        phone:
          pattern: \+[0-9]{1,3}[-\ ][0-9()+\-]{1,30}
          type: string
          description: The contact person's phone number in ITU-T E123 format.
          example: +1 607 1234 456
          title: phone
        type:
          description: The type of shipping method used.
          enum:
          - ELECTRONIC
          - GROUND
          - NOT_SHIPPED
          - OVERNIGHT
          - PICKUP
          - PRIORITY
          - SAME_DAY
          example: SAME_DAY
          type: string
          title: type
        email:
          pattern: '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$'
          type: string
          description: The contact person's email address.The parameter format restriction ensures that the email address is longer than 3 characters and adheres to a generous subset of valid RFC 2822 email addresses.
          example: xyjfg@gmail.com
          title: email
        origin:
          maxLength: 10
          minLength: 1
          type: string
          description: The post code or zip code of the address the order is shipped from.
          example: '120567'
          title: origin
        source:
          description: The type of shipping method used.
          enum:
          - ADDRESS_ON_FILE
          - NEW_ADDRESS
          example: NEW_ADDRESS
          type: string
          title: source
        address:
          $ref: '#/components/schemas/Shipping-Address'
    Sdk:
      title: sdk
      description: sdk payer authentication
      properties:
        application_id:
          description: A unique identifier for the app on the payer's device (EMVCo fieldsdkAppID).
          example: PA123456789
          maxLength: 36
          minLength: 36
          type: string
          title: application_id
        encrypted_data:
          description: Information about the payer's device collected and encrypted by the SDK (EMVCo fieldsdkEncData).
          example: PA123456789
          maxLength: 646000
          minLength: 1
          type: string
          title: encrypted_data
        public_key:
          description: A public key generated by the SDK for a secure session (EMVCo fieldsdkEphemPubKey).
          example: PA123456789
          maxLength: 256
          minLength: 1
          type: string
          title: public_key
        device_interface:
          description: The UI formats the payer's device supports for challenges (EMVCosdkInterface).
          example: PA123456789
          maxLength: 256
          minLength: 1
          type: string
          title: device_interface
        reference_number:
          description: Identifier of the vendor and version of the 3DS SDK assigned by EMVCo (EMVCosdkReferenceNumber).
          example: PA123456789
          maxLength: 32
          minLength: 1
          type: string
          title: reference_number
        time_out:
          description: 'The duration (in seconds) available to the payer to authenticate (Default: 900, range 300-900).'
          example: PA123456789
          maximum: 900
          minimum: 300
          type: number
          title: time_out
        transaction_id:
          description: A unique identifier for the app on the payer's device (EMVCo fieldsdkAppID).
          example: PA123456789
          maxLength: 36
          minLength: 36
          type: string
          title: transaction_id
        ui_type:
          type: array
          items:
            type: string
            description: The UI types the SDK supports for displaying challenges within the app (EMVCosdkUiType).
            title: ui_type
    Authentication-Payer-Request:
      type: object
      title: Authentication-Payer-Request
      required:
      - order
      - transaction
      properties:
        authentication:
          $ref: '#/components/schemas/Authentication-Payer-Initiate-Request'
        customer:
          $ref: '#/components/schemas/Customer-Authentication-Request'
        method:
          $ref: '#/components/schemas/Authentication-Payer-Method'
        transaction:
          $ref: '#/components/schemas/Authentication-Transaction-Request'
        order:
          $ref: '#/components/schemas/Authentication-Payer-Order'
        mandate:
          $ref: '#/components/schemas/Authentication-Mandate'
        shipping:
          $ref: '#/components/schemas/Authentication-Payer-Shipping'
      additionalProperties: false
      description: Payment Request
    Initiate-Authentication:
      title: ' Intiate Authentication'
      required:
      - channel
      properties:
        channel:
          description: Indicates the channel in which the authentication request is initiated.
          enum:
          - MERCHANT_REQUESTED
          - PAYER_APP
          - PAYER_BROWSER
          example: MERCHANT_REQUESTED
          type: string
          title: channel
        purpose:
          description: Indicates the context in which payer authentication is requested.
          enum:
          - ADD_CARD
          - AGREEMENT_CANCELLATION
          - MAINTAIN_CARD
          - PAYMENT_TRANSACTION
          - REFRESH_AUTHENTICATION
          example: ADD_CARD
          type: string
          title: purpose
        type:
          type: array
          items:
            type: string
            description: "A comma separated list of accepted payer authentication forms. \n- Accepted values are 3DS1,3DS2,PASSKEY"
            title: type
        line_of_business:
          description: Identifier for different lines of business configured in the merchant profile.
          example: CART123456
          maxLength: 100
          minLength: 1
          type: string
          title: line_of_business
    Authentication-Mandate:
      title: Mandate
      properties:
        amount_variability:
          description: Indicates if all the payments within the agreement use the same amount or if the amount differs between the payments. The parameter must be provided for recurring payment agreements.
          enum:
          - FIXED
          - VARIABLE
          example: VARIABLE
          type: string
          title: amount_variability
        custom_data:
          description: Additional information requested for the agreement which cannot be passed using other available data parameters. This parameter must not contain sensitive data.
          example: '7788'
          maxLength: 2048
          minLength: 1
          type: string
          title: custom_data
        expiry_date:
          description: Date at which your agreement with the payer to process payments expires.
          example: '2024-02-15'
          format: date
          type: string
          title: expiry_date
        id:
          description: "Your identifier for the agreement you have with the payer to process payments.When you collect cards from your payers and store them for later use, you must provide an agreement ID when you use the stored values for: Recurring payments: you have an agreement with the payer that authorizes you to automatically debit their account at agreed intervals for fixed or variable amounts. For example, gym membership, phone bills, or magazine subscriptions. Installment payments: you have an agreement with the payer that authorizes you to process multiple payments over an agreed period of time for a single purchase. For example, the payer purchases an item for $1000 and pays for it in four monthly installments. Unscheduled: you have an agreement with the payer that authorizes you to process future payments when required. For example, the payer authorizes you to process an account top-up transaction for a transit card when the account balance drops below a certain threshold.Industry Practice: you have an agreement with the payer that authorizes you to initiate additional transactions to fulfil a standard business practice related to an original payment initiated by the payer. For example, a delayed charge for use of the hotel mini bar after the payer has checked out or a no show penalty charge when the payer fails to show for a booking. When you first establish an agreement with the payer you should also specify the type of agreement in agreement.type. \n- For Brazil PIX Initiation, this parameter is mandatory with max length 29 in format RR33479023yyyyMMddBRkkkkkkkkk and this should be same id received as part of push notification while creating the mandate"
          example: RR123456789
          maxLength: 100
          minLength: 1
          type: string
          title: id
        maximum_amount:
          description: The maximum amount for a single payment in the series as agreed with the payer under your agreement with them. The amount must be provided in the currency of the order.
          example: '200'
          maxLength: 14
          minLength: 1
          type: string
          title: maximum_amount
        minimum_amount:
          description: The minimum amount for a single payment in the series as agreed with the payer under your agreement with them. The amount must be provided in the currency of the order.
          example: '200'
          maxLength: 14
          minLength: 1
          type: string
          title: minimum_amount
        minimum_days:
          description: The minimum number of days between payments agreed with the payer under your agreement with them.
          example: 7788
          maximum: 9999
          minimum: 1
          type: number
          title: minimum_days
        number_of_payments:
          description: The number of merchant-initiated payments within the recurring payment agreement.
          example: 778
          maximum: 999
          minimum: 1
          type: number
          title: number_of_payments
        frequency:
          description: The frequency of the payments within the series as agreed with the payer under your agreement with them.
          enum:
          - AD_HOC
          - DAILY
          - FORTNIGHTLY
          - MONTHLY
          - OTHER
          - QUARTERLY
          - TWICE_YEARLY
          - WEEKLY
          - YEARLY
          example: YEARLY
          type: string
          title: frequency
        type:
          description: The type of commercial agreement that the payer has with you.Specify the agreement type when you have provided a value for agreement.id and this payment is the first in a series of payments. The default value is OTHER.
          enum:
          - INSTALLMENT
          - OTHER
          - RECURRING
          - UNSCHEDULED
          example: UNSCHEDULED
          type: string
          title: frequency
        start_date:
          description: This is the effective start date for the payment agreement.
          example: '2024-02-15'
          format: date
          type: string
          title: start_date
      type: object
    Recipient-Name:
      title: recipient name
      type: object
      description: Recipient Name
      properties:
        first_name:
          description: The first name of the person to whom the order is being shipped.
          example: JOHN
          maxLength: 50
          minLength: 1
          type: string
          title: first_name
        last_name:
          description: The last name or surname of the person to whom the order is being shipped.
          example: PETER
          maxLength: 50
          minLength: 1
          type: string
          title: last_name
        company_name:
          description: The name of the company associated with this address.
          example: COMPANY NAME
          maxLength: 100
          minLength: 1
          type: string
          title: company_name
    Error-Detail:
      type: object
      title: Error Detail
      properties:
        issue:
          type: string
          maxLength: 150
          description: more details about the issue
          title: issue
        action:
          type: string
          maxLength: 150
          description: corrective action to be taken to resolve above issue
          title: action
        code:
          type: string
          maxLength: 10
          description: unique code representing the issue
          title: code
    Authentication-Payer-Card:
      title: Authentication Payer Card
      description: Card informations
      properties:
        number:
          description: The customer’s payment card number, also known as the Primary Account Number (PAN).
          type: string
          minLength: 9
          maxLength: 23
          example: '4012000033330026'
          title: number
        expiry_month:
          description: Two-digit month in which the payment card expires.
          example: '01'
          type: string
          pattern: ^(0?[1-9]|1[0-2])$
          title: expiry_month
        expiry_year:
          description: Two-digit year in which the payment card expires.
          type: string
          pattern: ^[0-9]{2,2}$
          example: '25'
          title: expiry_year
        cvv:
          description: Card verification code (CVV/CVC/etc.).
          example: '123'
          maxLength: 4
          minLength: 3
          type: string
          title: cvv
        device_payment:
          $ref: '#/components/schemas/Authentication-Device-Payment'
    Authentication-Customer-History-Payer-Request:
      title: Authentication Customer History Payer Request
      description: Authentication-Customer-Payer-Request
      properties:
        attempts:
          description: Number of attempts to add/change a card in the last 24 hours (0-99).
          example: '99'
          maximum: 99
          minimum: 1
          type: number
          title: attempts
        annual_activity:
          description: Number of transactions (successful/abandoned) in the last year (0-999).
          example: '99'
          maximum: 999
          minimum: 1
          type: number
          title: annual_activity
        creation_date:
          type: string
          format: date
          description: The date the payer created an account (yyyy-mm-dd).
          example: '2022-09-13'
          title: creation_date
        issuer_acs_id:
          description: The unique transaction identifier used by the issuer's ACS.
          example: PA123456789
          maxLength: 36
          minLength: 1
          type: string
          title: issuer_acs_id
        authentication_token:
          description: The authentication token obtained from a previous request.
          example: PA123456789
          maxLength: 32
          minLength: 28
          type: string
          title: authentication_token
        directory_server_id:
          description: A unique transaction identifier assigned by the scheme Directory Server.
          example: PA123456789
          maxLength: 50
          minLength: 1
          type: string
          title: directory_server_id
        authentication_time:
          type: string
          format: date-time
          description: The date and time the payer was authenticated for the prior transaction (YYYY-MM-DDThh:mm:ss.SSSZ).
          example: '2022-09-13T08:23:49.114Z'
          title: authentication_time
        authentication_id:
          description: The gateway transaction ID of a previous Authenticate Payer request to reuse authentication data.
          example: PA123456789
          maxLength: 50
          minLength: 1
          type: string
          title: authentication_id
        authentication_type:
          description: The method used to authenticate the payer for a prior transaction.
          enum:
          - 3DS_FRICTIONLESS
          - 3DS_CHALLENGE
          - ADDRESS_VERIFICATION
          - OTHER
          example: OTHER
          type: string
          title: authentication_type
        last_updated_date:
          type: string
          format: date
          description: The date the payer's account with you was last updated (yyyy-mm-dd).
          example: '2022-09-13'
          title: last_updated_date
        password_last_changed_date:
          type: string
          format: date
          description: The date the payer's account with you was last updated (yyyy-mm-dd).
          example: '2022-09-13'
          title: password_last_changed_date
        transaction_activity:
          description: Number of transactions (successful/abandoned) in the last 24 hours (0-99).
          example: '99'
          maximum: 99
          minimum: 1
          type: number
          title: transaction_activity
        shipping_address_date:
          type: string
          format: date
          description: The date you first shipped goods to the provided shipping address (yyyy-mm-dd).
          example: '2022-09-13'
          title: shipping_address_date
        suspicious_activity:
          description: Have you experienced suspicious activity on the account in the past (true/false).
          type: boolean
          example: false
          title: suspicious_activity
    Lines:
      type: string
      maxLength: 100
      minLength: 1
      description: "Address Lines \n- For US RFP only one(1) line of 70 characters is allowed \n- For US ACH Direct Debit payment, unstructured address_lines is mandatory when structured address parameters are not provided and allowed three instances with each line max length of 35 characters. Address Line 1 should have Building info followed by asterik, Street Address ends with a single backslash. Address Line2 should have City followed by asterik, State ends with a single backslash. Address Line 3 should have Zip Code followed by asterik, Country Code ends with a single backslash. For example Zip code*US\\."
      title: lines
    Authentication-Customer-Payer-Response:
      title: Authentication Customer Payer Response
      description: Authentication-Customer-Payer-Response
      properties:
        action:
          description: Behaviour relating to the association between the customer account and their card.
          enum:
          - AUTHENTICATION
          - REGISTRATION
          example: REGISTRATION
          type: string
          title: action
        status:
          description: Status of the card association functionality.
          enum:
          - FAILED
          - NOT_SUPPORTED
          - SUCCESSFUL
          - SUPPORTED
          example: FAILED
          type: string
          title: status
        method:
          description: The method used to authenticate the payer.
          enum:
          - CUSTOMER_ACCOUNT_LOGIN
          - FEDERATED_IDENTITY_LOGIN
          - FIDO_AUTHENTICATION
          - ISSUER_ACCOUNT_LOGIN
          - NONE
          - THIRD_PARTY_ACCOUNT_LOGIN
          example: NONE
          type: string
          title: method
        time:
          type: string
          format: date-time
          description: Date and time the payer was authenticated (YYYY-MM-DDThh:mm:ss.SSSZ).
          example: '2022-09-13T08:23:49.114Z'
          title: update_time
    Authentication-Device-Payment:
      title: device
      type: object
      description: Device
      properties:
        eci_indicator:
          description: The Electronic Commerce Indicator generated for device payments.
          example: '12'
          maxLength: 2
          minLength: 1
          type: string
          title: eci_indicator
        online_payment_cryptogram:
          description: A cryptogram used to authenticate the transaction (from decrypted token).
          example: '56789'
          maxLength: 200
          minLength: 1
          type: string
          title: online payment cryptogram
        cryptogram_format:
          description: The format of the cryptogram provided for the digital payment.
          enum:
          - 3DSECURE
          - EMV
          example: EMV
          type: string
          title: cryptogram_format
        token:
          description: The payment token received from the device's payment SDK (e.g., Apple Pay).
          example: '56789'
          maxLength: 16384
          minLength: 1
          type: string
          title: token
    Authentication-Order:
      title: Authentication Order
      required:
      - currency_code
      - id
      properties:
        id:
          description: A unique identifier for this order to distinguish it from any other order you create.
          example: OR123456789
          maxLength: 40
          minLength: 1
          type: string
          title: id
        currency_code:
          description: The currency of the order expressed as an ISO 4217 alpha code, e.g. USD.
          enum:
          - USD
          example: USD
          type: string
          title: currency_code
        reference:
          description: An optional identifier for the order For example, a shopping cart number, an order number, or an invoice number.
          example: CART123456
          maxLength: 250
          minLength: 1
          type: string
          title: reference
        mcc:
          description: The invoice number you issued for this order
          example: '1234'
          maxLength: 4
          minLength: 4
          type: string
          title: mcc
      type: object
    Authentication-Payer-Method-Response:
      type: object
      title: Authentication Payer Method Response
      required:
      - type
      properties:
        card:
          $ref: '#/components/schemas/Authentication-Payer-Card-Response'
        holder_name:
          $ref: '#/components/schemas/Holder-Name'
        type:
          description: "Method specified by the customer for the transaction  \n- Provide CARD for CARD transactions"
          type: string
          enum:
          - CARD
          - GOOGLEPAY
          - APPLEPAY
          example: CARD
          title: type
        token_id:
          description: Session identification number
          type: string
          minLength: 1
          maxLength: 50
          example: SES1234567890123456789012345678
          title: token_id
        token_type:
          description: Token type.
          enum:
          - ALT_TOKEN
          - NETWORK_TOKEN
          - ISSUER_TOKEN
          - CITI_TOKEN
          example: ISSUER_TOKEN
          type: string
          title: token_type
    Authentication-Payer-Order:
      title: Authentication Payer Order
      required:
      - id
      - currency_code
      - avs_action
      - avs_response
      - charge_type
      properties:
        id:
          description: A unique identifier for this order to distinguish it from any other order you create.
          example: OR123456789
          maxLength: 50
          minLength: 1
          type: string
          title: id
        currency_code:
          description: The currency of the order expressed as an ISO 4217 alpha code, e.g. USD.
          enum:
          - USD
          example: USD
          type: string
          title: currency_code
        amount:
          description: The total amount for the order.  This is the net amount plus any merchant charge amounts.If you provide any sub-total amounts, then the sum of these amounts (order.itemAmount, order.taxAmount, order.shippingAndHandlingAmount, order.cashbackAmount, order.gratuityAmount, order.merchantCharge.amount and order.dutyAmount), minus the order.discountAmount must equal the net amount.The value of this parameter in the response is zero if payer funds are not transferred.
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        charge_amount:
          description: The amount of the additional fee that you are charging the payer.
          example: '20.0'
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: charge_amount
        charge_type:
          description: The type of the additional fee that you are charging the payer.
          enum:
          - SURCHARGE
          example: SURCHARGE
          type: string
          title: charge_type
        net_amount:
          description: The total item amount for the order.
          example: 150
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: net_amount
        shipping_and_handling_amount:
          description: The total shipping and handling amount for the order, including taxes on the shipping and/or handling
          example: 20
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: shipping_and_handling_amount
        shipping_and_handling_tax_amount:
          description: The tax amount levied on the shipping and handling amount for the order.
          example: 20
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: shipping_and_handling_tax_amount
        shipping_and_handling_tax_rate:
          description: The tax rate applied to the shipping and handling amount for the order to determine the shipping and handling tax amount.
          example: 20
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: shipping_and_handling_tax_rate
        discount_amount:
          description: The total amount of the discount you have applied to the order
          example: 300
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: discount_amount
        tax_registration_id:
          description: Your tax registration identifier provided by the Federal/National tax authority (for example, federal tax identification number, ABN).If you are a Canadian merchant, use this parameter to provide your Tax Registration ID for paying Harmonized Sales Tax (HST) or Goods and Services Tax (GST) collected by the Canada Revenue Agency.
          example: 300
          maxLength: 30
          minLength: 1
          type: string
          title: tax_registration_id
        gratuity_amount:
          description: The gratuity amount (also known as customs tax, tariff or dues) for the order.
          example: 150
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: gratuity_amount
        certainty:
          description: Indicates if you expect to capture the full order amount for which you are requesting authorization.If you do not provide a value for order.certainty the default configured for you by your payment service provider will be used. The value provided in the response shows the value the gateway sent to the acquirer.
          enum:
          - ESTIMATED
          - FINAL
          example: FINAL
          type: string
          title: certainty
        date:
          description: The date the payer placed the order.
          example: '1988-02-15'
          format: date
          type: string
          title: date
        description:
          description: Short textual description of the contents of the order.
          example: LAPTOP PURCHASE
          maxLength: 127
          minLength: 1
          type: string
          title: description
        discount_code:
          description: The code you use to identify the reason for the discount.
          example: DISC001
          maxLength: 40
          minLength: 1
          type: string
          title: discount_code
        discount_description:
          description: A description of your reason for the discount.
          example: CARD DISCOUNT
          maxLength: 127
          minLength: 1
          type: string
          title: discount_description
        duty_amount:
          description: The duty amount (also known as customs tax, tariff or dues) for the order.
          example: 150
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: duty_amount
        entity:
          description: Your identifier for the part of your organization that is responsible for the order.You might provide this data when you want to track the accountability for the order. For example, store number, sales region, branch, or profit center.
          example: INDENTITY1
          maxLength: 40
          minLength: 1
          type: string
          title: entity
        purchase_type:
          description: 'Indicates the purchase of specific types of goods or services You must provide a value if your Merchant Category Code (MCC) is one of the following: 6051 (Quasi Cash – Merchant or Non-Financial Institutions – Foreign Currency, Non-Fiat Currency) and this transaction is for the purchase of cryptocurrency. Set the value to CRYPTOCURRENCY. 6211 (Securities – Brokers/Dealers) and this transaction is for the purchase of high-risk securities. Set the value to HIGH_RISK_SECURITIES. 6012 (Merchandise and Services—Customer Financial Institutions) or 6051 (Non-Financial Institutions – Foreign Currency, Non-Fiat Currency) and this transaction is for debt repayment. Set the value to DEBT_REPAYMENT. If the transaction pulls money from an account for the purpose of crediting another account you must set purchase type to ACCOUNT_FUNDING. You may set purchase type to OTHER for any other type of payment.'
          enum:
          - ACCOUNT_FUNDING
          - CRYPTOCURRENCY
          - DEBT_REPAYMENT
          - HIGH_RISK_SECURITIES
          - OTHER
          example: ACCOUNT_FUNDING
          type: string
          title: purchase_type
        tax_amount:
          description: The total tax amount for the order. If you do not provide this value but provide line item data, then this amount is calculated as the sum of the item.quantity times the item.unitTaxAmount for all the line items (total tax amount).If you provide both this value and line item data, then the order.taxAmount MUST equal the total tax amount.
          example: 150
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: tax_amount
        retailer_location:
          description: Provide information about the location of the retailers for goods or services included in this order. Where a retailer is located in a country different from your country, they are considered a foreign retailer, otherwise they are considered a domestic retailer.
          enum:
          - DOMESTIC_ONLY
          - FOREIGN_AND_DOMESTIC
          - FOREIGN_ONLY
          example: FOREIGN_ONLY
          type: string
          title: retailer_location
        avs_action:
          description: The action to be performed for the Address Verification Service (AVS) Response Code.
          enum:
          - NO_ACTION
          - REJECT
          - REVIEW
          example: REVIEW
          type: string
          title: avs_action
        avs_response:
          description: The Address Verification Service (AVS) Response Code for which you are defining the rule.
          enum:
          - ADDRESS_MATCH
          - ADDRESS_ZIP_MATCH
          - NAME_ADDRESS_MATCH
          - NAME_MATCH
          - NAME_ZIP_MATCH
          - NOT_AVAILABLE
          - NOT_REQUESTED
          - NOT_VERIFIED
          - NO_MATCH
          - SERVICE_NOT_AVAILABLE_RETRY
          - SERVICE_NOT_SUPPORTED
          - ZIP_MATCH
          example: ADDRESS_MATCH
          type: string
          title: avs_response
        invoice_number:
          description: The invoice number you issued for this order
          example: INV123456
          maxLength: 25
          minLength: 1
          type: string
          title: invoice_number
      type: object
    Authentication-Payer-Method:
