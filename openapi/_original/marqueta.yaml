securityDefinitions:
  clientCredentials:
    description: >+
      All CitiConnect APIs use the oAuth2 authentication scheme, which requires
      a bearer token to authenticate your API call. The Token URL includes the
      version of authentication used by this API. See <a
      href="../../authentication/authentication-api-reference/"
      target="_blank">the Citi Authentication API reference</a> for information
      on requesting a token.

    type: oauth2
    tokenUrl: https://tts.apib2b.citi.com/tts/cards/api/v1/oauth2/token
    flow: application
    scopes: null
definitions:
  InitialEligibilityCheckRequest:
    type: object
    required:
      - encrypted_data
      - wallet_provider_profile
    properties:
      encrypted_data:
        type: string
        description: >-
          Encrypted Card data for initial eligibility check (encrypted value
          should align with card_token_service_provider_dtls schema)
      card_service_provider_dtls:
        $ref: '#/definitions/card%5ftoken%5fservice%5fprovider%5fdtls'
      wallet_provider_profile:
        $ref: '#/definitions/WalletProviderProfile'
  WalletProviderProfile:
    type: object
    required:
      - pan_source
    properties:
      pan_source:
        type: string
        example: MOBILE_BANKING_APP
        description: >-
          Possible values are
          <br><br>KEY_ENTERED<br>ON_FILE<br>MOBILE_BANKING_APP
    description: Wallet Provider profile data for initial eligibility check
  card_token_service_provider_dtls:
    type: object
    required:
      - card_data
      - token_service_provider
    properties:
      card_data:
        $ref: '#/definitions/CardData'
      token_service_provider:
        $ref: '#/definitions/TokenServiceProvider'
    description: >-
      card_token_service_provider_dtls is the schema for the encrypted payload.
      This schema should not be part of the request payload in plain text.
      `card_token_service_provider_dtls` schema describes the structure and the
      parameters that should be part of the encrypted data.
  CardData:
    type: object
    required:
      - primary_account_number
    properties:
      primary_account_number:
        type: string
        example: '4255000075555000'
        description: >-
          Account number of the card that is being tokenized. Typically expected
          to be 16 digits.
        minLength: 12
        maxLength: 19
        pattern: \d+
    description: Card data for initial eligibility check
  TokenServiceProvider:
    type: object
    required:
      - token_reference_id
      - token_requestor_id
    properties:
      pan_reference_id:
        type: string
        example: V-123343434343434
        description: >-
          Network reference id for the PAN being tokenized. Note: For VISA,
          pan_reference_id remains the same for multiple tokens created on a
          single PAN. However for MASTERCARD, pan_reference_id remains the same
          for multiple tokens created on a single PAN on the same wallet. Can be
          used to verify existing tokens on the device through the wallet API.
        minLength: 1
        maxLength: 255
      token_reference_id:
        type: string
        example: DNITHE343434343459
        description: >-
          ID to correlate the digital wallet token with the network. Primary
          identifier for Visa. This value is not populated until token is active
          for Mastercard.
        minLength: 0
        maxLength: 255
      token_requestor_id:
        type: string
        example: '40010075001'
        description: >-
          Id associated with the token requestor. Differs by
          network.<br><br>Possible values
          are<br>40010075001<br>40010030273<br>50110030273<br>50120834693
        minLength: 1
        maxLength: 50
      token_requestor_name:
        type: string
        example: APPLE_PAY
        description: >-
          Pseudo customer friendly name for the token requestor. For
          programmatic purposes, use token requestor id which is not subject to
          change.
        minLength: 1
        maxLength: 100
    description: Token Service Provider details for initial eligibility check.
  InternalServerErrorResponse:
    type: object
    required:
      - errors
    properties:
      errors:
        type: array
        items:
          $ref: '#/definitions/ErrorMessage'
        minItems: 1
  UnAuthorizedResponse:
    type: object
    required:
      - httpCode
      - httpMessage
      - moreInformation
    properties:
      httpCode:
        type: string
        example: '401'
        description: Error code to be sent to the client.
        minLength: 1
        maxLength: 10
      httpMessage:
        type: string
        example: Unauthorized
        description: Error message to be sent to the client.
        minLength: 1
        maxLength: 255
      moreInformation:
        type: string
        example: Access Denied
        description: More details related to the error to be sent to the client.
        minLength: 1
        maxLength: 255
  MethodNotAllowedResponse:
    type: object
    required:
      - httpCode
      - httpMessage
      - moreInformation
    properties:
      httpCode:
        type: string
        example: '405'
        description: Error code to be sent to the client.
        minLength: 1
        maxLength: 10
      httpMessage:
        type: string
        example: Method Not Allowed
        description: Error message to be sent to the client.
        minLength: 1
        maxLength: 255
      moreInformation:
        type: string
        example: Requested HTTP operation is not supported
        description: More details related to the error to be sent to the client.
        minLength: 1
        maxLength: 255
  ErrorMessage:
    type: object
    required:
      - errorCode
      - errorDescription
    properties:
      errorCode:
        type: string
        description: Error code to be sent to the client,
        minLength: 1
        maxLength: 10
      errorDescription:
        type: string
        description: Error description to be sent to the client.
        minLength: 1
        maxLength: 255
    description: List of error code and description to be sent to the client.
  InvalidInitialEligibilityCheckResponse:
    type: object
    required:
      - errors
    properties:
      errors:
        type: array
        items:
          $ref: '#/definitions/ErrorMessage'
        minItems: 1
  InitialEligibilityCheckResponse:
    type: object
    required:
      - issuer_decision_reason
      - issuer_eligibility_decision
    properties:
      issuer_eligibility_decision:
        type: string
        description: The outcome of the decision for the provision request.
        enum:
          - APPROVE
          - DECLINE
      issuer_decision_reason:
        type: string
        description: The reason for the outcome of the decision for the provision request.
        maxLength: 255
        enum:
          - APPROVED
          - DECLINE_NOTELIGIBLE
          - DECLINE_CARDEXPIRED
          - DECLINE_INVALIDPAN
          - DECLINE_INVALID_CVV2
          - DECLINE_INVALID_EXPIRY_DATE
          - DECLINE_ADDRESS_VERIFICATION_FAILED
          - DECLINE_OTHER, DECLINE_GATEWAY_ERROR
          - DECLINE_CONFIG
      card_art_id:
        type: string
        example: Token Activation
        description: >-
          Optional card_art_id which will specify subsequent metadata to be used
          during the request (T+C, card art, etc). Known as `profileID` by Visa.
        maxLength: 255
  TokenActivationRequest:
    type: object
    required:
      - digital_wallet_token
      - encrypted_data
      - issuer_risk_assessment
      - wallet_provider_profile
    properties:
      digital_wallet_token:
        $ref: '#/definitions/digital%5fwallet%5ftoken%5fhash'
      issuer_risk_assessment:
        $ref: '#/definitions/issuer%5frisk%5fassessment'
      wallet_provider_profile:
        $ref: '#/definitions/wallet%5fprovider%5fprofile'
      encrypted_data:
        type: string
        description: >-
          Encrypted data for token activation (encrypted value should align with
          card_details schema) using JWE/JWS algorithim.
      card_details:
        $ref: '#/definitions/card%5fdetails'
  card_details:
    type: object
    properties:
      card_data:
        $ref: '#/definitions/tar%5fcard%5fdata'
      token_service_provider:
        $ref: '#/definitions/tar%5ftoken%5fservice%5fprovider'
      device:
        $ref: '#/definitions/tar%5fdevice'
      address_verification:
        $ref: '#/definitions/address%5fverification'
    description: >-
      card_details is the schema for the encrypted payload. This schema should
      not be part of the request payload in plain text. card_details schema
      describes the structure and the parameters that should be part of the
      encrypted data.
  tar_card_data:
    type: object
    required:
      - expiration_date
      - primary_account_number
    properties:
      primary_account_number:
        type: string
        example: '412333434343434'
        description: >-
          Account number of the card that is being tokenized. Typically expected
          to be 16 digits.
        minLength: 12
        maxLength: 19
        pattern: \d+
      expiration_date:
        $ref: '#/definitions/ExpiryDate'
      cvv2:
        type: string
        example: '123'
        description: >-
          Card Verificiation Value (CVV2) as provided by end user. Not present
          for all use cases. Either Cvv2 or encryptedCvv2 will be provided
          depending on your configuration.
        minLength: 0
        maxLength: 4
      encryptedCvv2:
        $ref: '#/definitions/encrypted%5fcvv2'
      encryptedCvv2_type:
        type: string
        description: >-
          Denotes the encryption scheme used. For JWE, Encrypted CVV2 encrypted
          using A256GCM and formatted in JWE direct encryption format as
          described here:
          https://connect2id.com/products/nimbus-jose-jwt/examples/jwe-with-shared-key.
          For 3DES, the encrypted value is hex encoded. Only present if
          encryptedCvv2 is also present
  encrypted_cvv2:
    type: object
    required:
      - cvv2
    properties:
      cvv2:
        type: string
        example: 22E28A8924923753
        description: >-
          Card Verificiation Value (CVV2) as provided by end user. Not present
          for all use cases.  Either Cvv2 or encryptedCvv2 will be provided
          depending on your configuration.
        minLength: 0
        maxLength: 4
    description: >-
      Encrypted CVV2 encrypted using A256GCM and formatted in JWE direct
      encryption format as described here:
      https://connect2id.com/products/nimbus-jose-jwt/examples/jwe-with-shared-key
  tar_token_service_provider:
    type: object
    required:
      - pan_reference_id
      - token_requestor_id
      - token_requestor_name
      - token_type
    properties:
      pan_reference_id:
        type: string
        example: V-123343434343434
        description: >-
          Network reference id for the PAN being tokenized.  Note: For VISA,
          pan_reference_id remains the same for multiple tokens created on a
          single PAN. However for Mastercard, pan_reference_id remains the same
          for multiple tokens created on a single PAN on the same wallet.  Can
          be used to verify existing tokens on the device through the wallet
          api. Value persists across pans if pan swap is used. Similar but not
          identical to PAR.
        minLength: 1
        maxLength: 255
      token_reference_id:
        type: string
        example: DNITHE343434343459
        description: >-
          Id to correlate the digital wallet token with the network.  Primary
          identifier for Visa. This value is not populated until token is active
          for Mastercard.
        minLength: 0
        maxLength: 255
      correlation_id:
        type: string
        example: D454545432
        description: >-
          Id to correlate the digital wallet token with the network.  Primary
          identifier for Mastercard.
        minLength: 0
        maxLength: 14
      token_requestor_id:
        type: string
        example: '40010075001'
        description: Id associated with the token requestor.  Differs by network
        minLength: 1
        maxLength: 50
      token_requestor_name:
        type: string
        example: APPLE_PAY
        description: >-
          Pseudo customer friendly name for the token requestor. For
          programmatic purposes, use token requestor id which is not subject to
          change.
        minLength: 1
        maxLength: 100
      token_type:
        type: string
        example: DEVICE_SECURE_ELEMENT
        minLength: 1
        maxLength: 255
        enum:
          - MERCHANT_CARD_ON_FILE
          - DEVICE_SECURE_ELEMENT
          - DEVICE_CLOUD_BASED
          - ECOMMERCE_DIGITAL_WALLET
          - PSEUDO_ACCOUNT
      token_score:
        type: string
        example: '10'
        description: >-
          Token Score as set by the network. Its the network computed risk
          score. Possible VISA values (0-99). Can be presented with or without
          leading 0
        minLength: 0
        maxLength: 25
      token_eligibility_decision:
        type: string
        description: >-
          The token service provider's (typically the network's) recommendation
          as to whether the digital wallet token should be provisioned. Visa
          only and as 2021, Visa will auto decline based on rule decision are
          decline
        minLength: 0
        maxLength: 50
        enum:
          - DECISION_RED
          - DECISION_YELLOW
          - DECISION_GREEN
  tar_device:
    type: object
    required:
      - type
    properties:
      type:
        type: string
        description: Type of device used for tokenization.
        minLength: 1
        maxLength: 255
        enum:
          - UNKNOWN
          - MOBILE_PHONE
          - TABLET
          - WATCH
          - MOBILE_PHONE_OR_TABLET
          - PERSONAL_COMPUTER
          - VEHICLE
          - APPLIANCE
          - LAPTOP
          - GAMING_DEVICE
          - UNRECOGNIZED
      device_id:
        type: string
        example: 123B45a
        description: >-
          Id of the device. This is blank for non-device bound tokens like
          e-commerce type.
        maxLength: 255
      phone_number:
        type: string
        example: '4489'
        description: >-
          Phone number of the device. Can be null. Note: Can be the full phone
          number(including country code) or last 4 digits depending on the
          wallet provider.
        maxLength: 20
      name:
        type: string
        example: >-
          /U0001f32e/U0001f32e/U0001f32eJohn's
          iPhone/U0001f973/U0001f973/U0001f973
        description: >-
          Device name. Can be in UTF-8 byte and contain special characters like
          emojis
        maxLength: 128
      location:
        type: string
        example: +45.1/-23.1
        description: >-
          Location of the device at the time of the tokenization request. May
          not always be present and accuracy may vary.
        minLength: 0
        maxLength: 25
      ip_address:
        type: string
        example: 1.1.1.1
        description: IPV4 address of the device at the time of provisioning.
        minLength: 0
        maxLength: 25
      language_code:
        type: string
        example: eng
        description: >-
          Language code of the device as set by the user if provided by the
          wallet service provider.
        maxLength: 36
  address_verification:
    type: object
    properties:
      name:
        type: string
        description: Cardholder name.
        minLength: 0
        maxLength: 255
      street_address:
        type: string
        description: Street address used for address verification.
        minLength: 0
        maxLength: 255
      postal_code:
        type: string
        description: Postal code used for address verification.
        minLength: 0
        maxLength: 50
  ExpiryDate:
    type: object
    required:
      - month
      - year
    properties:
      month:
        type: string
        format: MM
        example: '01'
      year:
        type: string
        format: yyyy
        example: '2024'
  digital_wallet_token_hash:
    type: object
    required:
      - token
    properties:
      token:
        type: string
        example: 3f21058b-6da2-408f-8bf1-41a0fe79f554
        description: Marqeta identifier for the digital wallet token.
        minLength: 1
        maxLength: 36
    description: Marqeta identifier for the digital wallet token.
  issuer_risk_assessment:
    type: object
    required:
      - issuer_decision
    properties:
      issuer_decision:
        type: string
        example: APPROVE
        description: Token Provisioning request issuer risk assessment decision.
        minLength: 1
        maxLength: 255
        enum:
          - APPROVE
          - REQUIRE_FURTHER_AUTHENTICATION
          - DECLINE
      reason:
        type: string
        example: RISK_RULES
        description: >-
          Token Provisioning request reason for issuer risk assessment decision.
          Future values should be accepted without change.
        minLength: 1
        maxLength: 255
        enum:
          - RISK_RULES
    description: Token Provisioning request issuer risk assessment.
  wallet_provider_profile:
    type: object
    required:
      - account
      - pan_source
    properties:
      account:
        $ref: '#/definitions/account'
      risk_assessment:
        $ref: '#/definitions/risk%5fassessment'
      device_score:
        type: string
        example: '3'
        description: >-
          Wallet provider device score (possible values- 1-5), indicating the
          confidence level of the device. 5 being the highest level of
          confidence.
      pan_source:
        type: string
        minLength: 1
        maxLength: 50
        enum:
          - KEY_ENTERED
          - ON_FILE
          - MOBILE_BANKING_APP
      reason_code:
        type: string
        example: >-
          01, 02, 03, 04, 05, 06, 07, 08, 09, 0A, 0B, 0C, 0D, 0E, 0G, 0H, A1,
          A2, A3, A4, A5, A6, A7, A8, A9, AA, AB, AC, AD, AE, AF, AG, AH, AI,
          AL, AM, AN, AO
        description: >-
          Wallet provider reason codes, in a comma-separated format. The reason
          for the wallet provider's provisioning decision. Note This list of
          reason codes is  subject to change. <br> Apple Pay (Visa/Mastercard),
          Google Pay/Samsung Pay  (Mastercard only). <br> * 01 - Cardholder's
          wallet account is too new relative to launch. <br> * 02 - Cardholder's
          wallet account is too new relative to provisioning request.<br> * 03 -
          Cardholder's wallet account/card pair is newer than date
          threshold.<br> * 04 - Changes made to account data within the account
          threshold. <br> * 05 - Suspicious transactions linked to this account.
          <br> * 06 - Account has not had activity in the last year. <br> * 07 -
          Suspended cards in the secure element. <br> * 08 - Device was put in
          lost mode in the last seven days for longer than the duration
          threshold.<br> * 09 - The number of provisioning attempts on this
          device in 24 hours exceeds threshold. <br> * 0A - There have been more
          than the threshold number of different cards attempted at provisioning
          to this phone in 24 hours.<br> * 0B - The card provisioning attempt
          contains a distinct name in excess of the threshold. <br> * 0C - The
          device score is less than 3. <br> * 0D - The account score is less
          than 4. <br> * 0E - Device provisioning location outside of the
          cardholder's wallet account home country.<br> * 0G - Suspected fraud.
          <br> * 0H - The phone number score is less than <br> 3. Google
          Pay/Samsung Pay (Visa only)<br> * A0 - Cardholder PAN associated with
          account within threshold days. <br> * A1 - Wallet account holder name
          on file does not match cardholder entered name.<br> * A2 - User's
          account on device less than threshold days. <br> * A3 - User account
          was created within threshold days. <br> * A4 - Wallet account created
          within threshold days. <br> * A5 - Changes made to account data within
          threshold days. <br> * A6 - The number of provisioning attempts across
          all cards on this device in the last 24 hours exceeds the threshold.
          <br> * A7 - The wallet account into which the card is being
          provisioned contains distinct names greater than threshold. <br> * A8
          - Device provisioning location outside of cardholder's wallet account
          home country. <br> * A9 - Suspended cards in the wallet account is
          greater than threshold. <br> * AA - This account has not had activity
          within threshold period. <br> * AB - Number of days since device was
          last reported lost is less than threshold days. <br> * AC - Number of
          transactions in last 12 months less than threshold number. <br> * AD -
          Number of active tokens greater than threshold<br> * AE - Number of
          devices with Same UserID with token is greater than threshold. <br> *
          AF - Number of active tokens on all devices is greater than threshold.
          <br> * AG - Issuer deferred ID&V decision. <br> * AH - Issuer
          encrypted payment instrument data expired. <br> * AI - User/device
          receiving encrypted payment instrument data is different than the one
          that is provisioning the token. <br> * AL - Encrypted payment
          instrument data is pushed to a different device than the one that
          issuer application authenticated. <br> * AM - Encrypted payment
          instrument data is pushed to a different user than the cardholder.
          <br> * AN - Encrypted Payment Instrument Data is being pushed by the
          Issuer to the same device that the Issuer application authenticated,
          but without any upfront authentication.<br> * AO - Encrypted Payment
          Instrument Data is being pushed by the Issuer to the same device that
          the Issuer application authenticated, but with successful upfront
          authentication.
        minLength: 0
        maxLength: 100
    description: Wallet provider profile
  account:
    type: object
    required:
      - id
    properties:
      id:
        type: string
        example: 134343434A3_B
        description: >-
          Client wallet account ID. This is a value assigned by a digital wallet
          and typically represents the account but is otherwise is a random
          value. An example is that using the same iCloud account on two devices
          will result in the same value for this parameter.
        minLength: 1
        maxLength: 255
      email_address:
        type: string
        example: 5400bbf75135b1d6fe773a94edad4d0d469d222f41eddedd21475f278243251c
        description: >-
          Hashed email Address. The exact hashing algorithm may vary by wallets
          and networks. Can be used to validate that email associated with
          digital wallet matches what is on file for the account. Data is
          hexBinary encoded.
      score:
        type: string
        example: '3'
        description: >-
          Wallet provider account score (possible values- 1-5), indicating the
          confidence level of the account. Value definitions are not
          standardized between wallets but 5 is highest confidence. Can be
          presented with or without a leading 0.
        minLength: 0
        maxLength: 2
    description: Wallet provider account details.
  risk_assessment:
    type: object
    properties:
      score:
        type: string
        description: Wallet provider risk score.
        enum:
          - DECISION_RED
          - DECISION_YELLOW
          - DECISION_GREEN
      version:
        type: string
        example: 1, 2, 01, 0001.00, 0002.00
        description: Wallet provider risk version
    description: Wallet provider risk assessment details.
  TokenActivationResponse:
    type: object
    required:
      - avs_response
      - card_token
      - cvv2_response
      - issuer_eligibility_decision
    properties:
      card_token:
        type: string
        example: 537d837e-958a-4e9f-bc97-4843ec9486ee
        description: >-
          Card identifier/token for correlation with Issuer. Used to minimize
          the need to exchange card details during subsequent calls and/or
          troubleshooting. Should be GUID or pseudo unique.
        minLength: 1
        maxLength: 36
      issuer_eligibility_decision:
        type: string
        minLength: 1
        maxLength: 255
        enum:
          - APPROVE
          - REQUIRE_FURTHER_AUTHENTICATION
          - DECLINE
      issuer_decision_reason:
        type: string
        example: DECLINE_NOTELIGIBLE
        maxLength: 255
        enum:
          - APPROVED
          - DECLINE_NOTELIGIBLE
          - DECLINE_CARDEXPIRED
          - DECLINE_INVALIDPAN
          - DECLINE_INVALID_CVV2
          - DECLINE_INVALID_EXPIRY_DATE
          - DECLINE_ADDRESS_VERIFICATION_FAILED
          - DECLINE_OTHER
          - DECLINE_GATEWAY_ERROR
          - DECLINE_CONFIG
      avs_response:
        type: string
        minLength: 1
        maxLength: 255
        enum:
          - MATCH
          - NO_MATCH
          - NOT_EXECUTED
      cvv2_response:
        type: string
        minLength: 1
        maxLength: 255
        enum:
          - MATCH
          - NO_MATCH
          - NOT_EXECUTED
      card_art_id:
        type: string
        example: CUSTOMERA_BLACK
        description: >-
          Optional c`art_art_id` that can be provided and is a pointer to a set
          of card metadata previously setup. In this API, this parameter is only
          used for Mastercard and is known as Product Config ID. Please be
          advised that Mastercard sets certain limits on the values in this
          parameter (length, etc).
        minLength: 0
        maxLength: 255
      stepup_options:
        type: array
        description: >-
          Options for a user to complete step-up authentication. Should provide
          at least one option. Can skip providing any options if options are
          already setup on Marqeta platform
        items:
          type: object
          properties:
            token:
              type: string
              example: 12514e5a-0072-43f5-bc52-9f79377f27cc
              description: >-
                Customer provided identifier for a specific step-up option. For
                simplicity, the value can be the same as the stepup_type while
                sending unique stepup_type(s) (like user has only one phone
                number, one email-id etc).
              minLength: 1
              maxLength: 36
            stepup_type:
              type: string
              description: Type of step-up options
              minLength: 1
              maxLength: 255
              enum:
                - INBOUND_CALL_CENTER
                - OTP_SMS
                - OTP_EMAIL
                - IOS_APP
                - ANDROID_APP
            stepup_value:
              type: string
              example: +1-800-555-1212
              description: >-
                Specific value for the step-up option. Phone/email should be
                masked if customer will be sending out SMS. For call center, an
                example is +1-800-555-1212. For OTP_SMS an example is
                +1******3175. For OTP_Email, m******e@marqeta.com, for IOS,
                4RA9TRQ7CL.com.marqeta.dwdemo and for Android com.marqeta.dwdemo
              minLength: 1
              maxLength: 100
          required:
            - stepup_type
            - stepup_value
