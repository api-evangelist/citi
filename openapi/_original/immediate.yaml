      name: locationPresente
      in: query
      schema:
        type: boolean
    Status:
      name: status
      in: query
      schema:
        type: string
        title: Status do registro da cobrança
        description: Filter by collection item status.
    PaginaAtual:
      in: query
      name: paginacao.paginaAtual
      required: false
      schema:
        type: integer
        format: int32
        title: Página atual
        minimum: 0
        default: 0
        description: >-
          Page to be returned by the query. If not informed, the PSP will assume
          it will be 0.
    ItensPorPagina:
      in: query
      name: paginacao.itensPorPagina
      required: false
      schema:
        type: integer
        format: int32
        title: Itens por Página
        minimum: 1
        maximum: 1000
        default: 100
        description: >-
          Maximum number of records returned on each page. Only the last page
