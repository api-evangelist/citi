securityDefinitions:
  Client ID:
    description: ''
    in: query
    name: client_id
    type: apiKey
  clientCredentials:
    type: oauth2
    flow: application
    tokenUrl: $(catalog.url)/authenticationservices/v1/oauth/token
    description: >-
      All CitiConnect APIs use the OAuth2 authentication scheme, which requires
      a bearer token to authenticate your API call. The Token URL includes the
      version of authentication used by this API. See the Citi Authentication
      API Reference for information on requesting a token.
    x-scopeValidate:
      tls-profile: citi-direct-ssl-profile
paths:
  /payment/inquiry:
    post:
      responses:
        '200':
          description: >-
            OK - your request was received and acknowledged successfully.


            Check the response body for the transaction status.


            | Payment Status | Recommended Action |

            | -------------- |  ----------------- |

            | Decrypted payload is unintelligible | Make a payment status
            inquiry every 5 minutes for 15 minutes. If you do not receive a
            response, contact Citi.

            | ACTC/ACCP - Accepted | Make a payment status inquiry every 5
            minutes |

            | PDNG - Pending | Make a payment status inquiry every 60 minutes |

            | RJCT - Rejected | See the status reason for more information |

            | ACSP/ACSC - Payment successfully processed and cleared | No action
            required |
          content:
            application/xml:
              example: >-
                <?xmlversion="1.0"encoding="UTF-8"?><Documentxmlns="urn:iso:std:iso:20022:tech:xsd:pain.002.001.03"><CstmrPmtStsRpt><GrpHdr><MsgId>CITIBANK/20210311-PSR/1026834332</MsgId><CreDtTm>2021-03-11T17:30:29</CreDtTm><InitgPty><Id><OrgId><BICOrBEI>CITIUS33</BICOrBEI></OrgId></Id></InitgPty></GrpHdr><OrgnlGrpInfAndSts><OrgnlMsgId>GBP161114694869</OrgnlMsgId><OrgnlMsgNmId>pain.001.001.03</OrgnlMsgNmId></OrgnlGrpInfAndSts><OrgnlPmtInfAndSts><OrgnlPmtInfId>14017498FundTransferDomestic</OrgnlPmtInfId><TxInfAndSts><OrgnlEndToEndId>CC21TPH3B8J8H2R</OrgnlEndToEndId><TxSts>ACSP</TxSts><StsRsnInf><AddtlInf>ProcessedSettledatclearingSystem.Paymentsettledatclearingsystem</AddtlInf></StsRsnInf><OrgnlTxRef><Amt><InstdAmtCcy="USD">1.00</InstdAmt></Amt><ReqdExctnDt>2021-02-03</ReqdExctnDt><PmtMtd>TRF</PmtMtd><RmtInf><Ustrd>TR002638</Ustrd></RmtInf><Dbtr><Nm>CITIBANKE-BUSINESSEURDUMDEMO</Nm></Dbtr><DbtrAcct><Id><Othr><Id>12345678</Id></Othr></Id></DbtrAcct><DbtrAgt><FinInstnId><PstlAdr><Ctry>GB</Ctry></PstlAdr></FinInstnId></DbtrAgt><CdtrAgt><FinInstnId><BIC>fakebic</BIC></FinInstnId></CdtrAgt><Cdtr><Nm>8010643122XXXXXXXXXXXXXXXXX</Nm></Cdtr><CdtrAcct><Id><Othr><Id>12345678</Id></Othr></Id></CdtrAcct></OrgnlTxRef></TxInfAndSts></OrgnlPmtInfAndSts></CstmrPmtStsRpt></Document>
      summary: Payment Status Inquiry
      requestBody:
        description: >-
          EndToEndId (required) Unique identification assigned by the initiating
          party to clearly identify the transaction. This Identification is
          passed on, unchanged, throughout the entire end-to-end chain.
          <br>CreDt Date when the payment initiation started. <br>The date
          format is: YYYY-MM-DD. InstdAmt, Ccy Amount of money transferred
          between the debtor and the creditor before any deduction of charges is
          made. This is expressed in the currency that is specified by the
          initiating party. <b>ReqdExctnDt Date that the initiating party
          requests that the clearing agent process the payment.
        content:
          application/xml:
            schema: object
            example: >-
              <?xml version="1.0" encoding="UTF-8"?><paymentInquiryRequest
              xmlns="http://com.citi.citiconnect/services/types/inquiries/payment/v1"><EndToEndId>CC21TPH3B8J8H2R</EndToEndId></paymentInquiryRequest>
        required: true
    get:
      responses:
        '200':
          description: 200 OK
          content:
            application/xml:
              example: >-
                <?xml version="1.0" encoding="UTF-8"?><Document
                xmlns="urn:iso:std:iso:20022:tech:xsd:pain.002.001.03"><CstmrPmtStsRpt><GrpHdr><MsgId>CITIBANK/20210311-PSR/981382059</MsgId><CreDtTm>2021-03-11T19:31:39</CreDtTm><InitgPty><Id><OrgId><BICOrBEI>CITIUS33</BICOrBEI></OrgId></Id></InitgPty></GrpHdr><OrgnlGrpInfAndSts><OrgnlMsgId>GBP161114694869</OrgnlMsgId><OrgnlMsgNmId>pain.001.001.03</OrgnlMsgNmId></OrgnlGrpInfAndSts><OrgnlPmtInfAndSts><OrgnlPmtInfId>14017498
                Fund Transfer
                Domestic</OrgnlPmtInfId><TxInfAndSts><OrgnlEndToEndId>CC21TPH3B8J8H2R</OrgnlEndToEndId><TxSts>ACSP</TxSts><StsRsnInf><AddtlInf>Processed
                Settled at clearing System. Payment settled at clearing
                system</AddtlInf></StsRsnInf><OrgnlTxRef><Amt><InstdAmt
                Ccy="USD">1.00</InstdAmt></Amt><ReqdExctnDt>2021-02-03</ReqdExctnDt><PmtMtd>TRF</PmtMtd><RmtInf><Ustrd>TR002638</Ustrd></RmtInf><Dbtr><Nm>CITIBANK
                E-BUSINESS EUR DUM
                DEMO</Nm></Dbtr><DbtrAcct><Id><Othr><Id>12345678</Id></Othr></Id></DbtrAcct><DbtrAgt><FinInstnId><PstlAdr><Ctry>GB</Ctry></PstlAdr></FinInstnId></DbtrAgt><CdtrAgt><FinInstnId><BIC>fakebic</BIC></FinInstnId></CdtrAgt><Cdtr><Nm>8010643122X
                XXXXXXXXXXXXX
                XXX</Nm></Cdtr><CdtrAcct><Id><Othr><Id>12345678</Id></Othr></Id></CdtrAcct></OrgnlTxRef></TxInfAndSts></OrgnlPmtInfAndSts></CstmrPmtStsRpt></Document>
        '400':
          description: Bad Request
        '401':
          description: Unauthorized; OAuth header decryption failed
        '403':
          description: Forbidden
        '404':
          description: Service Not Found
        '405':
          description: Method Not Allowed
        '406':
          description: Duplicate Request Received
        '412':
          description: Precondition Failed
        '415':
          description: Unsupported Media Type
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
      summary: Payment Status Inquiry
      parameters:
        - name: endToEndId
          type: string
          required: false
          in: query
        - name: globalTranNo
          type: string
          required: false
          in: query
        - name: creationDate
          type: string
          required: false
          in: query
        - name: amount
          type: string
          required: false
          in: query
        - name: requiredExecutionDate
          type: string
          required: false
          in: query
        - name: directDebitInd
          type: string
          required: false
          in: query
      description: null
security:
  - clientCredentials: []
    Client ID: []
definitions:
  ErrorDetail:
    properties:
      action:
        description: Corrective action to be taken to resolve the issue.
        maxLength: 350
        type: string
      issue:
        description: more details about the  issue
        maxLength: 200
        type: string
    type: object
    xml:
      name: error
  error_response:
    properties:
      errors:
        description: >-
          Indicates actual error details with issues and corresponding actions
          to resolve the issue.
        items:
          $ref: '#/definitions/ErrorDetail'
        xml:
          wrapped: true
      http_code:
        description: Indicates HTTP status code to specify HTTP response status.
        format: int32
        pattern: ^[0-9]{3}$
        type: integer
      status:
        description: >-
          This parameter  indicates the status of the reconfirm/reject or
          cancel/recall request with set of values. for example- FAILED
        maxLength: 6
        type: string
    type: object
  fi_cancellation_request:
    properties:
      citi_reference:
        description: >-
          This parameter specifies the Product processor Reference Number for
          the transaction that needs to be cancelled or recalled. UETR or
          citi_reference with interbank_settlement_date or end_to_end_id /
          instruction_id with interbank_settlement_date is mandatory.
        maxLength: 32
        type: string
      end_to_end_id:
        description: >-
          This is a  unique end-to-end  reference number that identifies a
          transaction that needs to be cancelled. UETR or citi_reference with
          interbank_settlement_date or end_to_end_id / instruction_id with
          interbank_settlement_date is mandatory.
        maxLength: 35
        type: string
      instruction_id:
        description: >-
          This is a  unique end-to-end  reference number that identifies a
          transaction that needs to be cancelled. UETR or citi_reference with
          interbank_settlement_date or end_to_end_id / instruction_id with
          interbank_settlement_date is mandatory.
        maxLength: 35
        type: string
      interbank_settlement_date:
        description: >-
          This parameter specifies the value date (yyyy-MM-dd) of the original
          transaction that needs to be cancelled or recalled (the date on which
          funds were credited to the account).
        type: string
      reason:
        description: >-
          This is the four digits cancellation code (Example - DUPL) which is
          specified by the  customer to request to cancel the transaction
        maxLength: 4
        type: string
      reason_description:
        description: >-
          Further details on the request reason. Required for CUST and MS03
          reason codes applicable to Stop and Reconfirmation services
          respectively.
        maxLength: 150
        type: string
      uetr:
        description: >-
          Unique End-to-end Transaction Reference (UETR) relating to a payment
          has been identified as being associated with a Request for
          Cancellation. it should follow UUID version 4 format. UETR or
          citi_reference with interbank_settlement_date or end_to_end_id /
          instruction_id with interbank_settlement_date is mandatory.
        type: string
    required:
      - reason
    type: object
  fi_reconfirmation_request:
    properties:
      citi_reference:
        description: >-
          This parameter specifies the Product processor Reference Number for
          the transaction that needs to be reconfirm/reject. UETR or
          citi_reference with interbank_settlement_date or instruction_id with
          interbank_settlement_date is mandatory.
        maxLength: 32
        type: string
        xml:
          name: ClrSysRef
      instruction_id:
        description: >-
          This is a unique instrution id that identifies a transaction that
          needs to be reconfirm/reject. UETR or citi_reference with
          interbank_settlement_date or instruction_id with
          interbank_settlement_date is mandatory.
        maxLength: 35
        type: string
        xml:
          name: InstrId
      interbank_settlement_date:
        description: >-
          This parameter specifies the value date (yyyy-MM-dd) of the original
          transaction that needs to be reconfirm/reject (the date on which funds
          were credited to the account).
        format: date
        type: string
        xml:
          name: ReqdExctnDt
      reason:
        description: >-
          This is the five digits reconfirm/reject code (Example DUPL) which is
          specified by the  customer to request to reconfirm/reject the
          transaction
        maxLength: 5
        type: string
        xml:
          name: Rsn
      uetr:
        description: >-
          Unique End-to-end Transaction Reference (UETR) relating to a payment
          has been identified as being associated with a Request for
          reconfirm/reject. It should follow UUID version 4 format. UETR or
          citi_reference with interbank_settlement_date or instruction_id with
          interbank_settlement_date is mandatory.
        type: string
        xml:
          name: UETR
    required:
      - reason
    type: object
    xml:
      name: TransacService
  fi_response:
    properties:
      transaction_status:
        $ref: '#/definitions/transaction_status_detail'
    type: object
  transaction_status_detail:
    properties:
      status:
        description: >-
          This parameter indicates the status of the reconfirm/reject or
          cancel/recall request with set of values. for example- ACCP for
          Accepted or RJCT for Rejected.
        maxLength: 4
        type: string
        xml:
          name: TxSts
      type:
        description: >-
          This parameter provides additional information of the transaction when
          it is rejected/accepted.
        maxLength: 500
        type: string
        xml:
          name: AddtlInf
    type: object
    xml:
      name: TxInfAndSts
  payments_request:
    properties:
      paymentBase64:
        description: Base64 encoded string of ISO XML payment initiation input XML.
        format: byte
        type: string
    required:
      - paymentBase64
    type: object
  payments_response:
    properties:
      psrDocument:
        description: Base64 encoded string of ISO XML payment initiation response XML.
        format: byte
        type: string
    required:
      - psrDocument
    type: object
  payments_error_response:
    properties:
      correlationId:
        description: input request tracking unique id
        type: string
      message:
        description: message providing information about error
        type: string
      status:
        description: error status code
        type: string
    type: object
x-components:
  examples:
    accpStatusXmlExample:
      value:
        status: ACCP
        type: >-
          Your request has been registered. We will notify you once the
          transaction is reconfirmed/rejected.
    fi_cancellation:
      value: >-
