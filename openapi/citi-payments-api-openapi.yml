          title: birth_date
        birth_city:
          maxLength: 35
          minLength: 1
          type: string
          description: "Debtor's birth_city \n - For TH Instant payment debtor.birth_city is not applicable \n - For US Instant payment debtor.birth_city field is optional \n - For IN IMPS debtor.birth_city is not applicable \n - For UK FPS Instant payment debtor.birth_city is not applicable \n - For IN UPI debtor.birth_city is not applicable  \n - For Stripe_US Wire, debtor.birth_city is not applicable \n - For US ACH CCD/PPD/IAT payment, debtor.birth_city field is not applicable \n - For Japan Instant payment debtor.birth_city is not applicable \n - For SEPA, debtor.birth_city is conditional mandatory with city in which the person is born"
          title: birth_city
        birth_country:
          type: string
