openapi: 3.2.0
info:
  title: Payment Refund Txrefund API
  description: The Payment Refund endpoint allows you as an initiating party (or debtor) to initiate a refund request with the receiving party (or creditor) of a payment that was previously executed.
  version: 2.0.0
  x-ibm-name: paymentservices
servers:
- url: https://tts.apib2b.citi.com/citiconnect/prod/paymentservices/v3
  description: production gateway URL
- url: https://tts.apib2b.citi.com/citiconnect/sb/paymentservices/v3
  description: sandbox URL
security:
- clientCredentials: []
  Client ID: []
tags:
- name: Txrefund
