openapi: 3.0.0
info:
  description: >-
    Subscription API allows Commercial application events and to receive
    notifications based on those subscriptions
  version: 2.0.0
  title: vca events subscriptions
  x-ibm-name: vca-events-subscriptions
  contact:
    name: GLOBAL Commercial Cards API Production support
    email: >-
      dl.icg.global.commercial.cards.digital.production.support@imcap.ap.ssmb.com
servers:
  - url: https://tts.apib2b.citi.com/tts/cards
tags:
  - name: Subscription
    description: Operations related to event subscriptions
paths:
  /vca/v2/events/subscriptions:
    post:
      summary: Create Subscription
      description: >-
        Create a subscription that will cause notifications to be generated for
        the specified events.
      operationId: createSubscription
      tags:
        - Subscription
      parameters:
        - name: Authorization
          in: header
          description: Bearer token obtained from the OAuth2 Client Credentials flow
          required: true
          schema:
            type: string
        - name: Region
          in: header
          description: region of the client(Apac/EMEA/NAM)
          required: true
          schema:
            type: string
        - name: Country
          in: header
          description: country of the Client
          required: true
          schema:
            type: string
        - name: Req-Sys-Id
          in: header
          description: Client Tracking ID
          required: true
          schema:
            type: string
      requestBody:
        description: SubscriptionRequest
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '201':
          description: >-
            <table><tr><td>Code</td><td>Details</td></tr><tr><tr><td>SubscriptionResponse</td><td>Created</td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          description: >-
            <table><tr><td><strong>errorCode</strong><td><strong>errorDescription</strong><tr><td>EVB0700<td>subscriptionName
            is Mandatory<tr><td>EVB0701<td>subscriptionName length should
            contain a min of 1 character and a max of 50
            characters<tr><td>EVB0702<td>subscriptionName field is invalid and
            can only have letters, numbers, dashes and
            underscores<tr><td>EVB0703<td>active is
            Mandatory<tr><td>EVB0704<td>operator field is
            Mandatory<tr><td>EVB0705<td>WHERE operator can only be used in the
            first subscription.operator field, other subscription.operator
            fields should use only OR operator<tr><td>EVB0706<td>fieldName is
            Mandatory<tr><td>EVB0707<td>subscription.fieldName must have a value
            of programId for the first condition in the specifications in
            conjunction with the WHERE operator and the EQUALS
            fieldOperator<tr><td>EVB0708<td>subscription.fieldName that is after
            the first subscription can only have a value of programId in
            conjunction with an operator value of OR and a fieldOperator value
            of EQUALS<tr><td>EVB0709<td>fieldName should contain a min of 1
            character and a max of 30 characters<tr><td>EVB0710<td>fieldOperator
            is
            Mandatory<tr><td>EVB0711<td>subscription.expectedContent.contentType
            must have a value of INTEGER when subscription.fieldName value equal
            'programId'<tr><td>EVB0712<td>expectedContent.contentType is
            Mandatory<tr><td>EVB0713<td>expectedContent.contentType length
            should contain a min of 1 character and a max of 7
            characters<tr><td>EVB0714<td>subscription.expectedContent.contentType
            is invalid and can only have a value of INTEGER for the EQUALS
            operator<tr><td>EVB0715<td>expectedContent.value is
            Mandatory<tr><td>EVB0716<td>expectedContent.value must only contain
            letters, digits, spaces, hyphens, slashes, commas, periods and
            underscores<tr><td>EVB0717<td>children.operator is invalid and can
            only have a value of AND, OR<tr><td>EVB0718<td>Invalid value for the
            field children.fieldName<tr><td>EVB0719<td>Invalid value for the
            field children.fieldName. children.fieldName cannot contain a value
            of programId<tr><td>EVB0720<td>children.fieldOperator is invalid and
            can only have a value of
            EQUALS<tr><td>EVB0721<td>children.expectedContent.contentType can
            only have a value of TEXT when the children.fieldOperator field is
            EQUALS<tr><td>EVB0722<td>children.expectedContent.contentType must
            have a value of TEXT when children.fieldName value is
            'fundingSourceName'<tr><td>EVB0723<td>children.expectedContent.contentType
            must have a value of TEXT when children.fieldName value is
            'messageTypeIndicator'<tr><td>EVB0724<td>children.expectedContent.contentType
            must have a value of TEXT when children.fieldName value is
            'authorizationResponseDetail'<tr><td>EVB0725<td>children.expectedContent.contentType
            must have a value of TEXT when children.fieldName value is
            'vcaAuthorizationResponseDetail'<tr><td>EVB0357<td>ProgramId must be
            numeric<tr><td>EVB0201<td>We were unable to process your request.
            Please try again, or contact Citi support if you have any further
            questions or comments.<tr><td>EVB0066<td>ClientId and programId
            combination is not valid<tr><td>EVB0726<td>subscriptionId length
            should contain a min of 1 character and a max of 255
            characters<tr><td>EVB0727<td>No subscription found for the specified
            subscription ID<tr><td>EVB0728<td>This subscription name is already
            registered for this
            subscriber<tr><td>EVB0729<td>subscriptionEventType field is invalid
            and can only have one of the following
            values:'PAYMENT_AUTHORIZATION','CLEARING'<tr><td>GRC0005<td>Client
            Tracking ID is missing in the request
            header<tr><td>GRC0010<td>Client Tracking ID length should contain a
            min of 1 character and a max of 36
            characters<tr><td>GRC0003<td>Invalid JSON
            input<tr><td>GRC0016<td>Country code is not available in the
            request</table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: <table><tr><td>Error</td><td>Not Found</td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: <table><tr><td>Error</td><td>Internal Server Error</td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
