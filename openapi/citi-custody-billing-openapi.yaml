    parameter-58250:
      name: REPORTING_DATE
      description: Invoice Update Date is the date on which the invoice was last changed.
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-58222:
      name: BILLING_PERIOD
      description: Invoice Month is the month and year that the invoice was calculated.
      in: query
      required: false
      schema:
        type: string
    parameter-58253:
      name: SK_ACCOUNT
      description: >-
        Account ID is an identifier for both a Cash Account and/or a Safekeeping
        Account that is unique within a branch.
      in: query
      required: false
      schema:
        type: string
    parameter-58229:
      name: CLIENT_ID
      description: >-
        Client ID is an identifier for the client as set up in the core billing
        system.
      in: query
      required: false
      schema:
        type: string
    parameter-58243:
      name: INVOICE_SCHEDULE_ID
      description: >-
        Invoice Schedule Identifier is a unique reference for the schedule under
        which each invoice is created.
      in: query
      required: false
      schema:
        type: integer
        format: int64
    parameter-58242:
      name: INVOICE_NUMBER
      description: Invoice Number is the unique reference number of the invoice.
      in: query
      required: false
      schema:
        type: integer
        format: int64
    parameter-58251:
      name: REVISION_NUMBER
      description: Revision Number indicates how many times the invoice has been revised.
      in: query
      required: false
      schema:
        type: integer
        format: int32
    parameter-58255:
      name: SURCHARGE_TYPE
      description: Surcharge Type
      in: query
      required: false
      schema:
        type: string
    parameter-58226:
      name: CENTRE
      description: Place Of Settlement is the settlement location of the holding.
      in: query
      required: false
      schema:
        type: string
    parameter-58225:
      name: BROKE_CODE
      description: Counterparty is the counterparty of the trade.
      in: query
      required: false
      schema:
        type: string
    parameter-58231:
      name: CONTRACTUAL_SETTLEMENT_DATE
      description: >-
        Contractual Settlement Date is the date when the trade was supposed to
        settle in the market.
      in: query
      required: false
      schema:
        type: string
    parameter-58259:
      name: TXN_REF
      description: >-
        Citi Reference is the unique reference number of the trade within Citi
        systems.
      in: query
      required: false
      schema:
        type: string
    parameter-58232:
      name: CUST_REF
      description: >-
        Client Reference is the reference provided by the client on their
        instruction.
      in: query
      required: false
      schema:
        type: string
    parameter-58240:
      name: INSTR_MODE
      description: >-
        Instruction Mode is an internal classification for how the transaction
        was instructed.
      in: query
      required: false
      schema:
        type: string
    parameter-58258:
      name: TRADE_UNITS
      description: Quantity is the number of units of the security traded.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-58233:
      name: DELIVERY
      description: >-
        Physical Delivery indicates if the charge is on account of a manual
        delivery.
      in: query
      required: false
      schema:
        type: string
    parameter-58238:
      name: FEE
      description: Fee is the charge in the Fee Schedule Currency.
      in: query
      required: false
      schema:
        type: string
    parameter-58239:
      name: FEE_CURRENCY
      description: >-
        Fee Schedule Currency is the ISO currency code corresponding to the
        currency in which the rate card is published.
      in: query
      required: false
      schema:
        type: string
    parameter-58256:
      name: TOTAL_FEE
      description: Total Fee
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-58228:
      name: CLARITY_BRANCH_NAME
      description: >-
        Branch Name is the name of the branch for the Cash Account and/or
        Safekeeping Account.
      in: query
      required: false
      schema:
        type: string
    parameter-58246:
      name: MARKET
      description: >-
        Market is the name of the market or ICSD in which the billable activity
        has occurred.
      in: query
      required: false
      schema:
        type: string
    parameter-58249:
      name: REGION
      description: >-
        Region is the name of the geographical region (if appropriate) in which
        the billable activity has occurred.
      in: query
      required: false
      schema:
        type: string
    parameter-58227:
      name: CENTRE_CODE
      description: >-
        Place Of Settlement Code is a 3 digit code corresponding to the
        settlement location of the holding.
      in: query
      required: false
      schema:
        type: string
    parameter-58221:
      name: ACCT_ID
      description: >-
        Account ID is an identifier for the Safekeeping Account that is unique
        within a branch.
      in: query
      required: false
      schema:
        type: string
    parameter-68895:
      name: POSITION_LOCATION_CODE
      description: Position Location Code
      in: query
      required: false
      schema:
        type: string
    parameter-68896:
      name: ISO_COUNTRY_CODE
      description: >-
        ISO country code is the ISO 3166 code corresponding to the country in
        which the invoice is to be paid.
      in: query
      required: false
      schema:
        type: string
    parameter-68897:
      name: SECURITY_QUOTATION_SOURCE
      description: Security Quotation Source
      in: query
      required: false
      schema:
        type: string
