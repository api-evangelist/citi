        callback_url:
          description: URL to call after a 3DS challenge has been completed (valid RFC 1738 URL).
          example: PA123456789
          maxLength: 500
          minLength: 1
          type: string
          title: callback_url
        device_interface:
          description: The UI formats the payer's device supports for challenges (EMVCosdkInterface).
          example: PA123456789
          maxLength: 256
          minLength: 1
          type: string
          title: device_interface
        redirect_url:
          description: Indicates if the application should expect a Redirect URL in CRes to redirect the payer to their issuer's mobile banking app (true/false).
          type: boolean
          example: false
          title: redirect_url
        time_out:
          description: 'The duration (in seconds) available to the payer to authenticate (Default: 900, range 300-900).'
          example: PA123456789
          maximum: 900
          minimum: 300
          type: number
          title: time_out
        ui_type:
          type: array
