          title: declined_url
    Rfp-Transaction-Notification:
      type: object
      title: RFP Transaction Notification
      required:
      - status
      - description
      - uetr
      properties:
        id:
          description: "Unique Transaction identification provided by the merchant during  transaction creation \n- For US RFP this parameter is mandatory with max length 35 \n- For Brazil PIX, this is mandatory parameter with min length 26 & max length 35"
          example: pay02052023456r
          maxLength: 128
          minLength: 1
          type: string
          title: id
        uetr:
          type: string
          pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          description: "UUID v4 format unique end-to-end transaction reference \n- This parameter is madnatory for US RFP \n- For Brazil PIX, this is mandatory parameter"
          example: 4f09214d-296c-494b-8e9c-810bf1d9fc93
          title: uetr
        creation_date_time:
          type: string
          format: date-time
          description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment (Debit) - Date time, generated by CitiConnect API, when CitiConnect API accepted a payment initiation after validation \n- Instant Payment (Credit) - Date time, either provided by the customer bank or generated by Citi's transaction processing application, when a transaction was created \n- For Brazil PIX, this is mandatory parameter"
          title: creation_date_time
        value_date:
          type: string
          format: date
          description: "Value Date Format is YYYY-MM-DD. \n- For US RFP this parameter is mandatory"
          title: value_date
        expiry_date:
          type: string
          format: date
          description: "Expiry Date Format is YYYY-MM-DD \n- For US RFP this parameter is mandatory"
          title: expiry_date
        update_flag:
          description: "Indicator if the exact amount indicated in amount must be paid, or if under/over payment is permitted.\n- For QR Creation (ex. Brazil), during transaction processing if the merchant want to allow his client to change QR Amount then the value should be Y otherwise default value will be N \n- For US RFP, if Y then Amount may be modified by the customer, if N then Amount of payment must equal the Instructed Amount.If no value passed, default behavior is same as Y"
          enum:
          - Y
          - N
          example: Y
          type: string
          title: update_flag
        amount:
          description: "Transaction amount \n- For US RFP, this parameter is mandatory with maximum amount limit 1000000.00. \n- For Brazil PIX initiation, this parameter is mandatory with 18 digits including 2 decimals. "
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        currency_code:
          description: "ISO 4217 Currency Code for instance USD/GBP/EUR \n- transaction.currency_code parameter is mandatory for all transaction type creation"
          enum:
          - BRL
          - USD
          - GBP
          example: BRL
          type: string
          title: currency_code
        country_code:
          description: "The order country \n- transaction.country_code parameter is mandatory for all transaction type creation"
          enum:
          - US
          - BR
          - GB
          example: US
          type: string
          title: country_code
        full_amount:
          type: number
          minimum: 0.01
          maximum: 100000000000000000
          description: "Amount that is the gross amount payable by client \n- For US RFP transaction, this parameter is optional"
          title: full_amount
        discount_amount:
          type: number
          minimum: 0.01
          maximum: 100000000000000000
          description: "Amount that is the discount from the gross amount \n- Optional for US RFP.If populated, message.transaction.full_amount must also be popluated."
          title: discount_amount
        purpose:
          $ref: '#/components/schemas/Purpose'
        remittance_info:
          type: array
          description: "Unstructured remittance information \n - For US RFP, transaction.remittance_info parameter is optional and only one(1) line of 140 characters is allowed. \n- For Brazil PIX initiation, this parameter is optional and only one(1) line of 140 characters is allowed."
          items:
            $ref: '#/components/schemas/Unstructured'
          title: remittance_info
        reference:
          type: string
          maxLength: 35
          minLength: 1
          description: "Reference Id \n- For US RFP, this parameter will contain the unique reference (instruction) id with max length 35"
          title: reference
        network_id:
          type: string
          maxLength: 35
          minLength: 1
          description: "Network ID \n- This parameter is mandatory for US RFP with max length 35"
          title: network_id
        network:
          type: string
          enum:
          - RTP
          - FDN
          description: Financial market infrastructure or clearing system (e.g., RTP Network in the United States)
          title: network
        status:
          type: string
          maxLength: 20
          description: "Transaction Status, following status you will receive in response \n- WAIT_CONFIRMATION - Transaction awaiting confirmation from user \n- PENDING_SETTLEMENT - Transaction accepted settlement in process \n- SETTLED - Transaction settled \n- FAILED - 'rejection code - rejection description' "
          example: SETTLED
          title: status
          enum:
          - WAIT_CONFIRMATION
          - PENDING_SETTLEMENT
          - SETTLED
          - FAILED
        description:
          type: string
          maxLength: 256
          description: "Transaction Status, following status you will receive in response \n- WAIT_CONFIRMATION - Transaction awaiting confirmation from user \n- PENDING_SETTLEMENT - Transaction accepted settlement in process \n- SETTLED - Transaction settled \n- FAILED - 'rejection code - rejection description'"
          title: description
        reason_code:
          maxLength: 10
          minLength: 1
          type: string
          description: "Transaction reason code \n- For Brazil PIX this parameter is mandatory with max length 4"
          example: AGND
          title: reason_code
        status_date_time:
          format: date-time
          type: string
          description: "Date & Time when Payer bank provided their response GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- This parameter is mandatory for Brazil PIX"
          example: '2022-09-13T08:23:49.114Z'
          title: status_date_time
        holiday_flag:
          description: Specifies if a request should consider holiday
          type: boolean
          example: true
          title: holiday_flag
    Mandate:
      title: Mandate
      properties:
        offer_id:
          description: The unique identifier of the payment plan offer that the payer has accepted.
          example: OF123456789
          maxLength: 60
          minLength: 1
          type: string
          title: offer_id
        amount_variability:
          description: Indicates if all the payments within the agreement use the same amount or if the amount differs between the payments. The parameter must be provided for recurring payment agreements.
          enum:
          - FIXED
          - VARIABLE
          example: VARIABLE
          type: string
          title: amount_variability
        custom_data:
          description: Additional information requested for the agreement which cannot be passed using other available data parameters. This parameter must not contain sensitive data.
          example: '7788'
          maxLength: 2048
          minLength: 1
          type: string
          title: custom_data
        expiry_date:
          description: "Date at which your agreement with the payer to process payments expires. \n- For Brazil PIX Initiation, this parameter is mandatory."
          example: '2024-02-15'
          format: date
          type: string
          title: expiry_date
        id:
          description: "Your identifier for the agreement you have with the payer to process payments.When you collect cards from your payers and store them for later use, you must provide an agreement ID when you use the stored values for: Recurring payments: you have an agreement with the payer that authorizes you to automatically debit their account at agreed intervals for fixed or variable amounts. For example, gym membership, phone bills, or magazine subscriptions. Installment payments: you have an agreement with the payer that authorizes you to process multiple payments over an agreed period of time for a single purchase. For example, the payer purchases an item for $1000 and pays for it in four monthly installments. Unscheduled: you have an agreement with the payer that authorizes you to process future payments when required. For example, the payer authorizes you to process an account top-up transaction for a transit card when the account balance drops below a certain threshold.Industry Practice: you have an agreement with the payer that authorizes you to initiate additional transactions to fulfil a standard business practice related to an original payment initiated by the payer. For example, a delayed charge for use of the hotel mini bar after the payer has checked out or a no show penalty charge when the payer fails to show for a booking. When you first establish an agreement with the payer you should also specify the type of agreement in agreement.type. \n- For Brazil PIX Initiation, this parameter is mandatory with max length 29 in format RR33479023yyyyMMddBRkkkkkkkkk and this should be same id received as part of push notification while creating the mandate"
          example: RR123456789
          maxLength: 100
          minLength: 1
          type: string
          title: id
        maximum_amount:
          description: The maximum amount for a single payment in the series as agreed with the payer under your agreement with them. The amount must be provided in the currency of the order.
          example: '200'
          maxLength: 14
          minLength: 1
          type: string
          title: maximum_amount
        minimum_amount:
          description: The minimum amount for a single payment in the series as agreed with the payer under your agreement with them. The amount must be provided in the currency of the order.
          example: '200'
          maxLength: 14
          minLength: 1
          type: string
          title: minimum_amount
        minimum_days:
          description: The minimum number of days between payments agreed with the payer under your agreement with them.
          example: 7788
          maximum: 9999
          minimum: 1
          type: number
          title: minimum_days
        number_of_payments:
          description: The number of merchant-initiated payments within the recurring payment agreement.
          example: 778
          maximum: 999
          minimum: 1
          type: number
          title: number_of_payments
        frequency:
          description: The frequency of the payments within the series as agreed with the payer under your agreement with them.
          enum:
          - AD_HOC
          - DAILY
          - FORTNIGHTLY
          - MONTHLY
          - OTHER
          - QUARTERLY
          - TWICE_YEARLY
          - WEEKLY
          - YEARLY
          example: YEARLY
          type: string
          title: frequency
        type:
          description: The type of commercial agreement that the payer has with you.Specify the agreement type when you have provided a value for agreement.id and this payment is the first in a series of payments. The default value is OTHER.
          enum:
          - INSTALLMENT
          - OTHER
          - RECURRING
          - UNSCHEDULED
          example: UNSCHEDULED
          type: string
          title: frequency
        start_date:
          description: This is the effective start date for the payment agreement.
          example: '2024-02-15'
          format: date
          type: string
          title: start_date
        charges_owned_by:
          description: Indicates who ownes the charges fees
          enum:
          - MERCHANT
          - CONSUMER
          example: CONSUMER
          type: string
          title: charges_owned_by
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
      type: object
    Transaction-Status:
      type: object
      title: Transaction Status
      properties:
        id:
          maxLength: 128
          minLength: 1
          type: string
          description: "Unique Transaction identification provided by the merchant during transaction creation \n- transaction.id parameter is mandatory for all transaction type creation   \n- For Brazil QR Creation transaction.id should be Alphanumeric and length ≥ 23 and ≤ 35 \n- For US RFP this parameter is mandatory with max length 35 \n- For US ACH Direct Debit, this parameter is mandatory with max length 16 \n- For Brazil PIX, this parameter is mandatory with min length 26 & max length 35"
          example: pay02052023456r
          title: id
        end_to_end_id:
          maxLength: 35
          minLength: 1
          type: string
          description: "Unique identification assigned by the initiating party to unambiguously identify the transaction. This identification is passed on, unchanged, throughout the entire end-to-end chain. \n- This parameter is optional for Brazil QR PIX transaction"
          example: pay02052023456r
          title: end_to_end_id
        expiry_time:
          type: integer
          format: int32
          minimum: 10
          description: "Expiration time for QR collection, specified in seconds \n- QR Creation request will be rejected, if Expiration time value is less than 10"
          example: 3600
          title: expiry_time
        update_time:
          type: string
          format: date-time
          description: "Indicates the date and time the gateway considers the order to have last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment (Debit) - Date time, generated by CitiConnect API, when CitiConnect API accepted a payment initiation after validation \n- Instant Payment (Credit) - Date time, either provided by the debtor bank or generated by Citi's transaction processing application, when a transaction was created \n- For ACH PAY and Verify transaction, order.update_time parameter is mandatory"
          example: '2022-09-13T08:23:49.114Z'
          title: update_time
        type:
          description: Indicates the type of action performed on the order.
          enum:
          - AUTHENTICATION
          - AUTHORIZATION
          - AUTHORIZATION_UPDATE
          - CAPTURE
          - CHARGEBACK
          - DISBURSEMENT
          - FUNDING
          - PAYMENT
          - REFUND
          - REFUND_REQUEST
          - VERIFICATION
          - VOID_AUTHORIZATION
          - VOID_CAPTURE
          - VOID_PAYMENT
          - VOID_REFUND
          example: VERIFICATION
          type: string
          title: type
        reason_code:
          description: "Transaction rejection Code \n- For Brazil PIX, this parameter is mandatory with min & max length 4"
          example: SC0020
          maxLength: 100
          minLength: 1
          type: string
          title: reason_code
        authorization_code:
          description: Value generated by the issuing bank in response to a proposal to transfer funds
          example: AUTH123456
          maxLength: 100
          minLength: 1
          type: string
          title: authorization_code
        acquirer:
          $ref: '#/components/schemas/Acquirer-Request'
        terminal:
          description: Identifier used by the acquirer to identify the transaction. This identifier may be used by the acquirer in settlement reports.
          example: ACQ7894561
          maxLength: 16
          minLength: 1
          type: string
          title: terminal
        retrieval_reference_number:
          description: When a transaction registration succeeds, the value of this parameter contains the 44-digit number that was used to create the bar code on the Boleto slip. This bar code can then be scanned by the vendor if a payer elects to pay Boleto at a registered location.
          example: ACQ7894561
          maxLength: 100
          minLength: 1
          type: string
          title: retrieval_reference_number
        authorization_response:
          $ref: '#/components/schemas/Authorization-Response'
        response:
          $ref: '#/components/schemas/Response'
        receipt:
          description: When a transaction registration succeeds, the value of this parameter contains the 44-digit number that was used to create the bar code on the Boleto slip. This bar code can then be scanned by the vendor if a payer elects to pay Boleto at a registered location.
          example: MSG12345
          maxLength: 100
          minLength: 1
          type: string
          title: receipt
        additional_response_data:
          description: A 47-digit number the payer can use to make a Boleto payment.When a transaction registration succeeds, the value of this parameter contains the 44-digit number that was used to create the bar code on the Boleto slip. This bar code can then be scanned by the vendor if a payer elects to pay Boleto at a registered location.If the transaction registration fails, this parameter contains an error code and a description in key-value pair format.
          example: MSG12345
          maxLength: 4000
          minLength: 1
          type: string
          title: additional_response_data
        amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000000
          description: "Transaction amount \n - For Brazil QR Creation decimal values are mandatory for transaction.amount and it must have 2 digits \n - For Brazil QR Creation maxmium amount limit is 9999999999.99 \n- For US RFP, this parameter is mandatory with maximum amount limit 1000000.00 \n- For US ACH Direct Debit, this parameter is mandatory with max length 18 digits & 2 decimals \n- For Brazil PIX, this parameter is mandatory with max length 18 digits including 2 decimals"
          example: 200
          title: amount
        currency_code:
          type: string
          enum:
          - BRL
          - USD
          - GBP
          - INR
          - EUR
          - CAD
          - HKD
          - AUD
          - SGD
          - DKK
          - NOK
          - SEK
          - PLN
          - IDR
          - MYR
          - THB
          - CHF
          - PHP
          - CZK
          description: "ISO 4217 Currency Code for instance  USD/GBP/EUR \n- transaction.currency_code parameter is mandatory for all transaction type creation"
          example: BRL
          title: currency_code
        country_code:
          description: "The order country \n- transaction.country_code parameter is mandatory for all transaction type creation"
          enum:
          - US
          - BR
          - GB
          - IN
          - TH
          - AU
          - CA
          - MX
          - DE
          - NL
          - IE
          - IT
          - FR
          - ES
          - HK
          - SG
          - NZ
          - DK
          - 'NO'
          - SE
          - BE
          - FI
          - CH
          - CZ
          - AT
          - PT
          example: US
          type: string
          title: country_code
        update_flag:
          type: string
          enum:
          - Y
          - N
          description: "Indicator if the exact amount indicated in amount must be paid, or if under/over payment is permitted.\n- For QR Creation (ex. Brazil), during transaction processing if the merchant want to allow his client to change QR Amount then the value should be Y otherwise default value will be N \n- For US RFP, if Y then Amount may be modified by the customer, if N then Amount of payment must equal the Instructed Amount.If no value passed, default behavior is same as Y"
          example: Y
          title: update_flag
        qr_image:
          type: string
          enum:
          - Y
          - N
          description: Merchant to confirm QR Image is required or not, If required value should be Y
          example: Y
          title: qr_image
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
        update_count:
          type: integer
          format: int32
          description: Denotes the collection review. It always starts at zero. It always varies in increments of 1, if any updation done on QR creation)
          example: 1
          title: update_count
        qr_string:
          type: string
          maxLength: 512
          description: Dynamic QR Code based on the merchant payload request
          example: 00020101021226700014br.gov.bcb.pix.citi.com.br/qr/2/8b3da2f39a4140d1a91abd93113bd44 15204000053039865802BR5913Fulano de Tal6008BRASILIA62070503***630464E4
          title: qr_string
        qr_byte_code:
          type: string
          format: byte
          description: QR Image
          example: 
          title: qr_byte_code
        status:
          type: string
          maxLength: 20
          description: "Transaction Status, following status you will receive in response \n- CREATED - The transaction has successfully been created \n- PENDING - Transaction pending action from customer \n- AUTHORIZED - Authorization approved \n- CAPTURED - Transaction fully captured \n- CAPTURED_PARTIALLY - Transaction partially captured \n- CANCELLED - Transaction cancelled \n- DECLINED - Transaction declined by the payment processor \n- REJECTED - Requsest rejected after business logic check \n- SYSTEM_ERROR- Internal system error occurred processing the transaction \n- SETTLED - Transaction settled \n- SUCCESS - The operation was successfully processed \n- UNKNOWN - The result of the operation is unknown \n- WAIT_CONFIRMATION - Transaction awaiting confirmation from user \n- PENDING_SETTLEMENT - Transaction accepted settlement in process  \n- FAILED - 'rejection code - rejection description' "
          title: status
        description:
          type: string
          maxLength: 200
          description: "Transaction Status, following status you will receive in response \n- CREATED - The transaction has successfully been created \n- PENDING - Pending action from customer \n- AUTHORIZED - Authorization approved \n- CAPTURED - Transaction fully captured \n- CAPTURED_PARTIALLY - Transaction partially captured \n- CANCELLED - Transaction cancelled \n- DECLINED - Transaction declined by the payment processor \n- REJECTED - Requsest rejected after business logic check \n- SYSTEM_ERROR- Internal system error occurred processing the transaction \n- FAILED - Transaction failed for invalid payload \n- SETTLED - Transaction settled \n- SUCCESS - The operation was successfully processed \n- UNKNOWN - The result of the operation is unknown \n- WAIT_CONFIRMATION - Transaction awaiting confirmation from user \n- PENDING_SETTLEMENT - Transaction accepted settlement in process  \n- FAILED - 'rejection code - rejection description' "
          example: Transaction declined by the payment processor
          title: description
        creation_date_time:
          type: string
          format: date-time
          description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment (Debit) - Date time, generated by CitiConnect API, when CitiConnect API accepted a payment initiation after validation \n- Instant Payment (Credit) - Date time, either provided by the debtor bank or generated by Citi's transaction processing application, when a transaction was created \n- For US ACH Direct Debit, this parameter is mandatory \n- For Brazil PIX, this parameter is mandatory"
          example: '2022-09-13T08:23:49.114Z'
          title: creation_date_time
        tax_id:
          maxLength: 128
          minLength: 1
          type: string
          description: "Merchant's payee identification (e.g., email address) \n - For Brazil QR creation merchant.payee_id parameter is mandatory, allowed maxlength is 77 \n- This parameter is optional for Brazil QR PIX transaction"
          example: 1.020.340/8910-22
          title: tax_id
        remittance_info:
          type: array
          description: Unstructured remittance information
          items:
            $ref: '#/components/schemas/Unstructured'
        url:
          $ref: '#/components/schemas/Url'
        value_date:
          type: string
          format: date
          description: "YYYY-MM-DD Date in local time zone (e.g., EST for a United States RTP network transaction IST for IN IMPS) when Citi's transaction processing application starts processing a transaction \n- For US ACH Direct Debit, this parameter is mandatory \n- For Brazil PIX, this parameter is mandatory"
          example: '2022-09-07'
          title: value_date
        expiry_date:
          type: string
          format: date
          description: "Expiry Date Format is YYYY-MM-DD \n- For US RFP this parameter is mandatory"
          title: expiry_date
        reference:
          description: "Transaction additional information.  \n - For UK PAYBYBANK Creation reference parameter is optional and allowed maximum length is 128 \n- For US ACH Direct Debit, this parameter is mandatory with max length 7"
          example: REPAY
          maxLength: 250
          minLength: 1
          type: string
          title: reference
        reason:
          description: Cancellation/adjustment reason.
          example: REPAY
          maxLength: 140
          minLength: 1
          type: string
          title: reason
        batch_id:
          maxLength: 35
          minLength: 1
          type: string
          description: Identification for your Citi account consolidated credit posting including the transaction
          example: batch12345
          title: batch_id
        network_id:
          maxLength: 128
          minLength: 1
          type: string
          description: "Transaction identification generated by the network (clearing) \n- This parameter is optional for India UPI and UK PAYBYBANK transaction"
          example: clr02052023478
          title: network_id
        network:
          type: string
          enum:
          - RTP
          - FDN
          description: Financial market infrastructure or clearing system (e.g., RTP Network in the United States)
          title: network
        full_amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000000
          description: "Amount that is the gross amount payable by client \n- For US RFP transaction, this parameter is optional"
          title: full_amount
        discount_amount:
          type: number
          minimum: 0.01
          maximum: 100000000000000000
          description: "Amount that is the discount from the gross amount \n- Optional for US RFP. If populated, message.transaction.full_amount must also be popluated."
          title: discount_amount
        original_amount:
          type: number
          minimum: 0.01
          maximum: 100000000000000000
          description: "Amount that was originally sent by our client \n- For US RFP transaction, this parameter is optional"
          title: original_amount
        uetr:
          type: string
          pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          description: "UUID v4 format unique end-to-end transaction reference \n- This parameter is optional for India UPI and UK PAYBYBANK transaction \n- For Brazil PIX, this parameter is mandatory"
          example: 4f09214d-296c-494b-8e9c-810bf1d9fc93
          title: uetr
        redirect_url:
          type: string
          maxLength: 500
          description: The URL to which you must redirect the payer's browser to complete the payment when using the payment provider's website.
          example: https://greenzone-api.uat.nam.nsroot.net/api/notification
          title: redirect_url
        psp_reference:
          type: string
          maxLength: 36
          minLength: 1
          description: "Payment session id generated by Banked (third party system). Will be present in case of link creation being successful \n - For UK PAYBYBANK Creation payment_session_field parameter is mandatory for success link creation."
          example: PAY1234567
          title: psp_reference
        product_info:
          type: array
          items:
            $ref: '#/components/schemas/Product-Info'
        retry_possible:
          description: Identifier to indicate if the payment journey has ended or further retries are possibility Y - indicates that a retry is possible on the same link N - indicates no further retry is possible on this link
          enum:
          - Y
          - N
          example: Y
          type: string
          title: retry_possible
        status_date_time:
          format: date-time
          type: string
          description: "Date & Time when Payer bank provided their response GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- This parameter is mandatory for Brazil PIX"
          example: '2022-09-13T08:23:49.114Z'
          title: status_date_time
        clearing_local_code:
          maxLength: 4
          minLength: 1
          type: string
          description: Local Clearing code
          example: 008T
          title: clearing_local_code
        bill_id_1:
          description: Bill identification for a bill payment
          maxLength: 128
          minLength: 1
          pattern: ^[0-9A-Z]{1,128}$
          type: string
          example: '77889900'
          title: bill_id_1
        bill_id_2:
          description: Bill identification for a bill payment
          maxLength: 128
          minLength: 1
          pattern: ^[0-9A-Z]{1,128}$
          type: string
          example: '77889901'
          title: bill_id_2
        bill_id_3:
          description: Bill identification for a bill payment
          maxLength: 128
          minLength: 1
          pattern: ^[0-9A-Z]{1,128}$
          type: string
          example: '77889902'
          title: bill_id_3
        bill_due_date:
          description: ISO 8601 (YYYY-MM-DD) bill due date
          type: string
          format: date
          example: '2025-01-01'
          title: bill_due_date
        wht_rate:
          description: Withholding tax (WHT) rate
          type: number
          minimum: 0
          maximum: 100
          example: 10
          title: wht_rate
        wht_amount:
          description: Withholding tax (WHT) amount
          type: number
          minimum: 0.01
          maximum: 1000000000000000
          example: 1000
          title: wht_amount
        wht_code:
          description: Withholding tax (WHT) code A for WHT always paid by the seller, S for WHT once paid by the seller and B for WHT paid by the buyer
          type: string
          enum:
          - A
          - S
          - B
          example: A
          title: wht_code
        processing_code:
          description: Code defined by regulator to identify different kind of payments
          type: string
          minLength: 1
          maxLength: 35
          example: '550000'
          title: processing_code
        purpose:
          $ref: '#/components/schemas/Purpose'
        income_type:
          description: Income type
          type: string
          pattern: ^(00[0-9]|01[0-2])$
          example: '001'
          title: income_type
        vat_rate:
          description: Value-added tax (VAT) rate
          type: number
          minimum: 0
          maximum: 100
          example: 10
          title: wht_rate
        vat_amount:
          description: Value-added tax (VAT) amount
          type: number
          minimum: 0.01
          maximum: 1000000000000000
          example: 100
          title: vat_amount
        holiday_flag:
          description: Specifies if a request should consider holiday
          type: boolean
          example: true
          title: holiday_flag
    Payment-Request:
      type: object
