openapi: 3.0.1
info:
  title: Payment Initiation Service
  description: >-
    The Payment Initiation API allows partners to make payments. Each payment
    method takes different input values based on the type of payment. This
    service accommodates all different data attributes for all the available
    payment methods.


    This specification describes the fields required for the <a
    href="https://www.iso20022.org/catalogue-messages/iso-20022-messages-archive?search=pain.008.001.02"
    target="_blank">ISO PAIN 001.001.03 payment initiation standard
    payload.</a> 

    This standard supports multiple country and currency options. You can
    generate sample XML content for the countries of your choice by using the <a
    href="https://developer.citi.com/apim/go/paymentrules/" target="_blank">Citi
    Payment Formatting Rules Tool</a>. 


    Download our SDKs:


    * [Python
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=python&apiTitle=all&isClientSecReq=true)

    * [Java
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=java&apiTitle=all&isClientSecReq=true)

    * [.Net
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=dotnet&apiTitle=all&isClientSecReq=true)

    * [Ruby
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=ruby&apiTitle=all&isClientSecReq=true)

    * [NodeJS
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=nodejs&apiTitle=all&isClientSecReq=true)

    * [Go
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=go&apiTitle=all&isClientSecReq=true)

    * [CLI Tool
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=ccapi-cli&apiTitle=all&isClientSecReq=true)


    Note: You must be logged in to download the SDKs.


    ## Tracking Payment Status


    Because of the asynchronous nature of payment initiation and processing in
    Citi's Payment Initiation API, we recommend following these best practice
    guidelines for tracking your Payment Initiation Request to determine the
    status before reinitiating payment as that can cause inadvertent duplication
    of payments, resulting in unintended payments being made.


    To best determine the status of your Payment Initiation Request using a
    Payment Status Request (PSR): 


    | Scenario for Client                       | Scenario for
    Citi                             | Initial PSR Received? | Recommended
    Action                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     
    |

    |-------------------------------------------|-----------------------------------------------|-----------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|

    | Client received response from Citi        | Citi received Payment
    Initiation request      | Yes                   | API call, response and PSR
    working without issue. No action
    required.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
    |

    | Client did not receive response from Citi | Citi received Payment
    Initiation request<br/> | Yes                   | The payment initiation was
    confirmed to be successful by receipt of the first PSR. No action
    required.                                                                                                                                                                                                                                                                                                                                                                                                                                                 
    |

    | Client did not receive response from Citi | Citi received Payment
    Initiation request      | No                    | The client could not
    confirm the success of the Payment Initiation call from the syncronous
    response or PSR, but the request was received by Citi. In order to avoid
    duplicated payments, send a payment status inquiry at 5 minute intervals. If
    no response is received for three consecutive payment status inquiries,
    contact your Citi
    representative.                                                                                                                                                                                            
    |

    | Client did not receive response from Citi | Citi did not receive Payment
    Initiation       | No                    | Responses have timed out, but
    Citi is processing payment.<br/><br/>In order to avoid duplicated payments,
    send a payment status inquiry at 5 minute intervals. If no response is
    received for three consecutive payment status inquiries, contact your Citi
    representative. <br/><br/>If Citi representative is unable to confirm the
    payment status, or the payment initiation was unsuccessful, re-send the
    payment using the original end-to-end ID. Using the original end-to-end ID
    ensures that the payment will not be inadvertently duplicated. |
  contact:
    name: Standards & Developer Hub
    url: https://tts.sandbox.developer.citi.com/citiconnect/
    email: developer-support@citi.com
  version: 3.0.1
security:
  - clientCredentials: []
servers:
