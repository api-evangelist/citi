        '200':
          description: Session status
          headers:
            apim-guid:
              schema:
                type: string
              description: Citi's unique identification for your request
            Merchant-Id:
              schema:
                type: string
              description: The unique identifier issued to you by your payment provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session-Update-Response'
        '400':
          $ref: '#/components/responses/Bad-Post-Session-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '429':
          $ref: '#/components/responses/Rate-Limit-Exceeded'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        '504':
          $ref: '#/components/responses/Gateway-Timeout'
        default:
          $ref: '#/components/responses/Internal-Server-Error'
components:
  parameters:
    Offset-Param:
      in: query
      name: offset
      required: false
      schema:
        type: integer
        default: 0
      description: Payment status inquiry result page you want Citi to respond to you with
    Limit-Param:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        maximum: 1000
        minimum: 1
        default: 100
      description: |-
        Limit you want Citi to apply to your payment status inquiry results 
        - Maximum value is 1,000.
    Client-Id:
      in: query
      name: client_id
      required: true
      description: >-
        Your unique identification, same as the identification you use for OAuth
        token generation, Citi shared with you during your CitiConnect API
        onboarding
      schema:
        type: string
        description: >-
          Your unique identification, same as the identification you use for
          OAuth token generation, Citi shared with you during your CitiConnect
          API onboarding
        example: 9a10a5d6-63d4-4885-b6bd-19e79629496d
    Customer-Id:
      name: Customer-Id
      in: query
      description: Customer ID of the customer
      schema:
        type: string
        maxLength: 40
      example: CUST123456
    End-To-End-Id:
      name: id
      in: query
      description: The end to end ID included in the refund by the sender of the refund
      schema:
        $ref: '#/components/schemas/Restricted-Finx-Max-Text'
      example: 1L00IF2BCWUZF09
    Idempotency-Id:
      name: Idempotency-Id
      in: header
      required: true
      description: >-
        Your unique identification for a POST request 
         - Maximum length is 128. 
        -  CitiConnect API responds with an error (HTTP status 4XX) if your POST
        request idempotency identification value is a duplicate across a recent
        history of idempotency identifications in Citi's database.
      schema:
        type: string
        maxLength: 128
        description: >-
          Your unique identification for a POST request 
           - Maximum length is 128. 
          -  CitiConnect API responds with an error (HTTP status 4XX) if your
          POST request idempotency identification value is a duplicate across a
          recent history of idempotency identifications in Citi's database. 

          - If you don't receive any response (HTTP status 2XX, 4XX or 5XX) from
          Citi to your POST request and you wish to retry, reinitiate your
          request with the same idempotency identification to prevent accidental
          duplicate payment.
      example: a44cbb60-6de4-4edb-9a7a-123414bba3bb
    Taas:
      in: header
      name: Taas
      required: false
      description: Flag for tokenizing sensitive data
      schema:
        type: string
        description: Flag for tokenizing sensitive data
        example: 'Y'
    Post-Operation:
      in: header
      name: Operation
      required: false
      description: API operation
      schema:
        type: string
        enum:
          - CAPTURE
          - AUTHORIZE
          - PAY
          - VERIFY
          - DIRECTDEBIT
        description: API operation
        example: CAPTURE
    Post-Authentication-Operation:
      in: header
      name: Operation
      required: false
      description: API operation
      schema:
        type: string
        enum:
          - INITIATE_AUTHENTICATION
        description: API operation
        example: INITIATE_AUTHENTICATION
    Patch-Authentication-Operation:
      in: header
      name: Operation
      required: false
      description: API operation
      schema:
        type: string
        enum:
          - AUTHENTICATE_PAYER
        description: API operation
        example: AUTHENTICATE_PAYER
    Token-Operation:
      in: header
      name: Operation
      required: false
      description: Token operation
      schema:
        type: string
        enum:
          - DELETE_TOKEN
          - UPDATE_TOKEN
        description: Token operation
        example: DELETE_TOKEN
    Patch-Operation:
      in: header
      name: Operation
      required: false
      description: API operation
      schema:
        type: string
        enum:
          - AUTHORIZE
          - CANCEL
          - PAY
        description: API operation
        example: CANCEL
    Refund-Patch-Operation:
      in: header
      name: Operation
      required: false
      description: API operation
      schema:
        type: string
        enum:
          - CANCEL
        description: API operation
        example: CANCEL
    Mandate-Patch-Operation:
      in: header
      name: Operation
      required: true
      description: API operation
      schema:
        type: string
        enum:
          - CANCEL
        description: API operation
        example: CANCEL
    Id:
      name: id
      in: path
      required: true
      description: Your unique End To End identification
      schema:
        type: string
        maxLength: 128
        minLength: 1
        description: Your unique End To End identification
      example: abc-pay-123
    Get-Payment-End-To-End-Id:
      name: id
      in: query
      schema:
        type: string
        maxLength: 128
        minLength: 1
      description: >-
        The transaction ID provided by client during transaction creation or
        transaction end-to-end-id received in incoming credit notification, 

        - The id parameter is mandatory for inqury request.
      example: 1L00IF2BCWUZF09
    Token-Id-Get:
      name: id
      in: query
      schema:
        type: string
        maxLength: 128
        minLength: 1
      description: The transaction ID provided by client during token creation
      example: 1L00IF2BCWUZF09
    Get-End-To-End-Id:
      name: end-to-end-id
      in: query
      description: The end to end ID provided in credit notification
      schema:
        $ref: '#/components/schemas/Restricted-Finx-Max-Text'
      example: 1L00IF2BCWUZF09
    Original-Payment-Uetr:
      name: Original_Payment_Uetr
      in: query
      description: >-
        The unique ‘UETR’ reference assigned to the original incoming credit on
        your account for which a refund was initiated. If multiple refunds were
        initiated against an incoming credit, the response API will include all
        these refunds
      schema:
        type: string
        pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
        description: >-
          The unique ‘UETR’ reference assigned to the original incoming credit
          on your account for which a refund was initiated. If multiple refunds
          were initiated against an incoming credit, the response API will
          include all these refunds
        example: 0c4fb98b-d77a-4468-96bb-0c88b3b8f75a
    Creation-Date-Time-Start:
      name: creation_date_time_start
      in: query
      schema:
        type: string
        format: date-time
      description: |-
        GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 
         - Start of date time, generated by CitiConnect API, when CitiConnect API accepted a refund initiation after validation
      example: '2022-09-13T08:23:49.114Z'
    Creation-Date-Time-End:
      name: creation_date_time_end
      in: query
      schema:
        type: string
        format: date-time
      description: |-
        GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 
         - end of date time, generated by CitiConnect API, when CitiConnect API accepted a refund initiation after validation
      example: '2022-09-13T08:23:49.114Z'
    Status-Date-Time-Start:
      name: status_date_time_start
      in: query
      schema:
        type: string
        format: date-time
      description: |-
        GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 
         - Start of date time, generated by CitiConnect API, when CitiConnect API accepted a refund initiation after validation
      example: '2022-09-13T08:23:49.114Z'
    Status-Date-Time-End:
      name: status_date_time_end
      in: query
      schema:
        type: string
        format: date-time
      description: |-
        GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 
         - Start of date time, generated by CitiConnect API, when CitiConnect API accepted a refund initiation after validation
      example: '2022-09-13T08:23:49.114Z'
    Network-Id:
      name: network_id
      in: query
      schema:
        type: string
        maxLength: 36
      description: >-
        Transaction reference generated for or by a network (e.g., PromptPay,
        NPCI)
      example: '209323283934'
    Batch-Id:
      name: batch_id
      in: query
      schema:
        type: string
        maxLength: 35
      description: >-
        Identification for your Citi account consolidated debit or credit
        posting for the transactions
      example: '209323283934'
    Uetr:
      name: uetr
      in: query
      schema:
        type: string
        pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
      description: Unique end-to-end transaction reference
      example: 0c4fb98b-d77a-4468-96bb-0c88b3b8f75a
    Amount:
      name: amount
      in: query
      schema:
        type: number
        maximum: 100000000000000
      description: amount
      example: 73945.27
    Status:
      name: status
      in: query
      schema:
        type: string
        enum:
          - SETTLED
          - CREATED
          - FAILED
          - SUCCESS
      description: ISO 20022 transaction status code
      example: SETTLED
    Type:
      name: type
      in: query
      schema:
        type: string
        enum:
          - ID
          - ENDTOENDID
          - ORDERID
          - UETR
      description: >-
        Transaction identifier type. 

        - Default search will be based on ID, if client not provided any value
        from dropdown list
      example: ID
    Country-Code:
      name: country_code
      in: query
      schema:
        type: string
        enum:
          - BR
          - IN
      description: Country code
      example: IN
    Status-Inquiry:
      name: status
      in: query
      schema:
        type: string
        enum:
          - SETTLED
          - CREATED
          - FAILED
          - PENDING
          - CANCELLED
      description: ISO 20022 transaction status code
      example: SETTLED
    Merchant-Id:
      name: Merchant-Id
      in: header
      required: true
      description: Your unique Merchant Identification number
      schema:
        type: string
        maxLength: 40
        minLength: 1
        description: Your unique Merchant Identification number
      example: M123456987
    Merchant-Post-Id:
      name: Merchant-Id
      in: header
      required: false
      description: >-
        Your unique Merchant Identification number 
         - Merchant ID header parameter is mandatory for payment methods - PIX (Brazil QR creation), CARD, BOLETO, PPRO, GOOGLEPAY, APPLEPAY, FPS and PAYPAL. 
        - Merchant ID header parameter is not applicable for payment methods -
        ACH and RTP.
      schema:
        type: string
        maxLength: 40
        minLength: 1
        description: Your unique Merchant Identification number
      example: M123456987
    Merchant-Token-Id:
      name: Merchant-Id
      in: header
      required: true
      description: Your unique Merchant Identification number
      schema:
        type: string
        maxLength: 40
        minLength: 1
        description: Your unique Merchant Identification number
      example: M123456987
    Encrypt-Sign:
      name: Encrypt-Sign
      in: header
      description: Encrypted Sign
      schema:
        type: string
        enum:
          - 'N'
          - 'Y'
        description: Encrypted Sign
      example: 'Y'
    TokenID:
      name: Token-Id
      in: header
      schema:
        type: string
        maxLength: 40
        minLength: 1
        description: Token ID
      example: TOK1234456
    Post-Country-Code:
      name: Country-Code
      in: header
      schema:
        type: string
        maxLength: 2
        minLength: 2
        description: Country Code
      example: IN
    Merchant-Refund-Id:
      name: Merchant-Id
      in: header
      required: false
      description: >-
        Your unique Merchant Identification number 

        - Merchant ID header parameter is mandatory for payment methods - PIX,
        CARD. 

        - Merchant ID header parameter is not applicable for payment methods -
        UPI and FPS.
      schema:
        type: string
        maxLength: 40
        minLength: 1
        description: Your unique Merchant Identification number
      example: M123456987
    Apim-Guid:
      name: Apim-Guid
      in: header
      required: true
      description: Your unique Apim-Guid
      schema:
        type: string
        maxLength: 52
        minLength: 1
        description: Your unique Apim-Guid
        example: na-apimgwgtds04~4a98cbc5-d813-4e65-bc81-d70f0f87f6ec
    Event-Type:
      name: Event-Type
      in: header
      required: true
      description: Event Type
      schema:
        type: string
    Event-Name:
      name: Event-Name
      in: header
      required: true
      description: Event Type
      schema:
        type: string
    Reference-Id:
      name: Reference-Id
      in: header
      required: true
      description: Event Type
      schema:
        type: string
    Operation:
      name: Operation
      in: header
      required: true
      description: Event Type
      schema:
        type: string
    Token-Id:
      name: Token-Id
      in: header
      required: true
      description: Token Id
      schema:
        type: string
    Value-Added-Services:
      name: Value-Added-Services
      in: header
      required: true
      description: Event Type
      schema:
        type: string
        enum:
          - NETWORK_TOKEN
          - CITI_TOKEN
          - ACCOUNT_UPDATER
    Get-Token-Id:
      name: token-id
      in: query
      required: true
      description: Token ID
      schema:
        type: string
    Session-Id:
      name: session_id
      in: query
      required: true
      description: Session ID
      schema:
        type: string
        maxLength: 37
        minLength: 36
        description: Your unique session identification
      example: SE12345897456213ytrdghkjksdsds1234567
    Session-Path-Id:
      name: id
      in: path
      required: true
      description: Your unique session identification
      schema:
        type: string
        maxLength: 37
        minLength: 36
        description: Your unique session identification
      example: SE12345897456213ytrdghkjksdsds1234567
    Mandate-Id:
      name: mandate_id
      in: query
      required: true
      description: Unique Id assigned to identify the mandate
      schema:
        type: string
    Mandate-Country-Code:
      name: country_code
      in: query
      required: true
      schema:
        type: string
        enum:
          - BR
      description: Country code
      example: BR
  schemas:
    Customer:
      title: Customer
      properties:
        account:
          title: customer account
          description: Account Details
          properties:
            number:
              maxLength: 40
              minLength: 1
              type: string
              description: >-
                Customer's bank account 

                - For US RFP this parameter is mandatory with max length 40 

                - For ACH, max length is 17 
                 - For ACH Pay and verify transaction customer.account.number parameter is mandatory 
                - For US ACH Direct Debit, customer.account.number parameter is
                mandatory with max length 17
              example: '1122334455'
              title: number
            bank_id:
              maxLength: 35
              minLength: 1
              type: string
              description: >-
                Customer bank's network identification 

                - For US RFP this parameter is mandatory with max length 16 

                - For ACH, length is equal to 9 
                 - For ACH Pay and verify transaction customer.account.bank_id parameter is mandatory 
                - For US ACH Direct Debit, customer.account.bank_id parameter is
                mandatory with maximum length 9 

                - For Brazil PIX Initiation, this parameter is mandatory with
                min & max length 8
              example: CITIIN77
              title: bank_id
            bank_name:
              maxLength: 35
              minLength: 1
              type: string
              description: >-
                Name of the bank where customer is maintaining the account 

                - For US ACH Direct Debit, customer.account.bank_name parameter
                is mandatory with max length 35
              example: CITI
              title: bank_name
            bank_country_code:
              type: string
              pattern: ^[A-Z]{2,2}$
              description: >-
                Country code of the bank where customer is maintaining the
                account 

                - For US ACH Direct Debit, customer.account.bank_country
                parameter is mandatory
              example: US
              title: bank_country_code
            name:
              maxLength: 70
              minLength: 1
              type: string
              description: >-
                Customer's Account Name 

                - For US RFP transaction, customer.account.name parameter is
                optional
              title: name
            type:
              description: |-
                An indicator identifying the type of bank account 
                 - For ACH Pay and verify transaction customer.account.type parameter is mandatory 
                 - For US ACH Direct Debit, customer.account.type parameter is mandatory with allowed values - SAVINGS & CORPORATE_CHECKING
              enum:
                - SAVINGS
                - CURRENT
                - CARD
                - OVERDRAFT
                - VIRTUAL_ACCOUNT
                - CORPORATE_CHECKING
              example: SAVINGS
              type: string
              title: type
        id:
          description: Merchant internal customer ID.
          example: 1234abcjki
          maxLength: 40
          minLength: 1
          type: string
          title: id
        name:
          $ref: '#/components/schemas/Name'
        tax_id:
          description: >-
            Customer's payer identification (e.g., email address) 

            - For Brazil PIX Initiation, this parameter is mandatory, individual
            person tax identification (CPF) allowed length = 11 or business
            entity tax identification (CNPJ) allowed length = 14
          example: 234.453.678-21
          maxLength: 100
          minLength: 1
          type: string
          title: tax_id
        national_id:
          description: An identifier for the payer assigned by a government authority.
          example: 234.453.678-21
          maxLength: 30
          minLength: 1
          type: string
          title: national_id
        email:
          description: |-
            Customer email 
             - For UK PAYBYBANK creation, customer.email parameter is mandatory.
          example: customer.raj2024@gmail.com
          type: string
          pattern: '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$'
          title: email
        phone:
          description: Customer phone.
          example: '+919962125789'
          pattern: \+[0-9]{1,3}[-\ ][0-9()+\-]{1,30}
          type: string
          title: phone
        line_of_business:
          description: >-
            Your payment service provider might have configured your merchant
            profile to support several lines of business.
          example: SMALL BUSINESS
          maxLength: 100
          minLength: 1
          type: string
          title: line_of_business
        type:
          description: |-
            Customer type 
             - For Brazil QR Creation customer.type parameter is mandatory 
            - For US RFP, this parameter is optional
          enum:
            - INDIVIDUAL
            - BUSINESS
          example: BUSINESS
          type: string
          title: type
        organization_id:
          description: >-
            Customer Organization Id/ Legal Entity as provided at the time of
            payment request.

            - For US RFP max length is 20
          example: ORG123456
          maxLength: 35
          minLength: 1
          type: string
          title: organization_id
        birth_date:
          type: string
          format: date
          description: >-
            ISO 8601 (YYYY-MM-DD), Customer's birth_date  

            - For US RFP and  PAYPAL transactions, customer.birth_date parameter
            is optional
          title: birth_date
        birth_city:
          maxLength: 35
          minLength: 1
          type: string
          description: |-
            Customer's birth_city 
            - For US RFP max length is 35
          title: birth_city
        birth_country:
          type: string
          description: >-
            Customer's birth_country 

            - For US RFP transaction, customer.birth_country parameter is
            optional
          pattern: ^[A-Z]{2,2}$
          title: birth_country
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
        device:
          $ref: '#/components/schemas/Customer-Device'
        address:
          $ref: '#/components/schemas/Address'
    Customer-Authentication-Request:
      title: Customer Authentication Request
      properties:
        account:
          title: customer account authentication request
          description: Account Details
          properties:
            number:
              description: Your identifier for the payer's account with you (immutable ID).
              example: 1234abcjki
              maxLength: 40
              minLength: 1
              type: string
              title: number
            authentication:
              $ref: '#/components/schemas/Authentication-Customer-Payer-Request'
            history:
              $ref: >-
                #/components/schemas/Authentication-Customer-History-Payer-Request
        number:
          description: Your identifier for the payer's account with you (immutable ID).
          example: 1234abcjki
          maxLength: 40
          minLength: 1
          type: string
          title: number
        name:
          $ref: '#/components/schemas/Name'
        tax_id:
          description: Customer's payer identification (e.g., email address)
          example: 234.453.678-21
          maxLength: 100
          minLength: 1
          type: string
          title: tax_id
        email:
          description: Customer email
          example: customer.raj2024@gmail.com
          type: string
          pattern: '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$'
          title: email
        phone:
          description: Customer phone.
          example: '+919962125789'
          pattern: \+[0-9]{1,3}[-\ ][0-9()+\-]{1,30}
          type: string
          title: phone
        mobile_phone:
          description: Customer phone.
          example: '+919962125789'
          pattern: \+[0-9]{1,3}[-\ ][0-9()+\-]{1,30}
          type: string
          title: mobile_phone
        device:
          $ref: '#/components/schemas/Authentication-Customer-Device'
        address:
          $ref: '#/components/schemas/Authentication-Address'
    Customer-Authentication-Response:
      title: Customer Authentication Response
      properties:
        account:
          title: customer account authentication response
          description: Account Details
          properties:
            number:
              description: Your identifier for the payer's account with you (immutable ID).
              example: 1234abcjki
              maxLength: 40
              minLength: 1
              type: string
              title: number
            authentication:
              $ref: '#/components/schemas/Authentication-Customer-Payer-Response'
            history:
              $ref: >-
                #/components/schemas/Authentication-Customer-History-Payer-Request
        name:
          $ref: '#/components/schemas/Name'
        tax_id:
          description: Customer's payer identification (e.g., email address)
          example: 234.453.678-21
          maxLength: 100
          minLength: 1
          type: string
          title: tax_id
        email:
          description: Customer email
          example: customer.raj2024@gmail.com
          type: string
          pattern: '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$'
          title: email
        phone:
          description: Customer phone.
          example: '+919962125789'
          pattern: \+[0-9]{1,3}[-\ ][0-9()+\-]{1,30}
          type: string
          title: phone
        mobile_phone:
          description: Customer phone.
          example: '+919962125789'
          pattern: \+[0-9]{1,3}[-\ ][0-9()+\-]{1,30}
          type: string
          title: mobile_phone
        device:
          $ref: '#/components/schemas/Authentication-Customer-Device-Response'
        address:
          $ref: '#/components/schemas/Authentication-Address'
    Customer-Notification:
      type: object
      title: Customer Notification
      properties:
        account:
          title: customer account
          description: Account Details
          properties:
            number:
              maxLength: 40
              minLength: 1
              type: string
              description: >-
                Customer's bank account 

                - For US RFP this parameter is mandatory with max length 40 

                - For UK PAYBYBANK and IN UPI transactions,
                customer.account.number parameter is optional 

                - For US ACH Direct Debit, this parameter is mandatory with max
                length 17 

                - For Brazil PIX, this parameter is mandatory with max length 40
              example: '1122334455'
              title: number
            bank_id:
              maxLength: 35
              minLength: 1
              type: string
              description: >-
                Customer bank's network identification 

                - For US RFP this parameter is mandatory with max length 16 

                - For ACH, length is equal to 9 

                - For UK PAYBYBANK and IN UPI transactions,
                customer.account.bank_id parameter is optional
              example: CITIIN77
              title: bank_id
            branch_id:
              description: Customer bank's branch id
              minLength: 1
              maxLength: 35
              type: string
              example: BR123
              title: branch_id
            name:
