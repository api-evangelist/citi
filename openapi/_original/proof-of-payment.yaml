servers:
  - url: https://b2b.api.icg.citi.com/citiconnect/prod/paymentinsights
    description: production gateway url
  - url: https://sandbox.b2b.api.icg.citi.com/citiconnect/sb/paymentinsights
    description: sbox url
security:
  - oAuth2:
      - selfservices
tags:
  - name: ProofOfPayment
    description: APIs for retrieving proof of payment reports.
components:
  schemas:
    ProofOfPaymentResponse:
      title: ProofOfPaymentResponse
      type: object
      properties:
        payment_info:
          title: paymentInfo
          type: string
          format: byte
          description: >-
            The transactions that are being processed can be monitored real-time
            and providing customer the details and status of the payment
            process. <br>The real-time monitoring of payment processing can help
            to confirm payment authenticity for the potential amount, currency,
            and sender/recipient of the payment
          xml:
            name: PaymentInfo
    Gateway-Error-Response:
      type: object
      title: GatewayErrorResponse
      required:
        - httpCode
        - httpMessage
        - moreInformation
      properties:
        httpCode:
          type: string
          maxLength: 3
          description: Numeric HTTP Staus code
          title: httpCode
        httpMessage:
          type: string
          maxLength: 128
          description: HTTP error message
          title: httpMessage
          example: Bad Request
        moreInformation:
          type: string
          maxLength: 128
          description: HTTP error message
          title: moreInformation
          example: please provide valid value for request
    Service-Error-Response:
      title: ServiceErrorResponse
      type: object
      required:
        - ref_id
        - error_details
      properties:
        ref_id:
          title: ref_id
          type: string
          maxLength: 120
          description: Unique ID for the Transaction
          example: 444d0f3f-4x55-7g99-8b2c-0cf2a921a5ab
        error_details:
          title: error_details
          type: array
          description: List of error details
          items:
            $ref: '#/components/schemas/Error-Detail'
    Error-Detail:
      type: object
      title: ErrorDetail
      required:
        - issue
        - action
      properties:
        issue:
          type: string
          minLength: 1
          maxLength: 200
          description: more details about the issue
          title: issue
          example: property emailAddress is mandatory and it cannot be empty
        action:
          type: string
          maxLength: 350
          description: corrective action to be taken to resolve above issue
          title: action
          example: please provide valid value for property emailAddress
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: unique code representing the issue
          title: code
          example: VC00010
  responses:
    Bad-Request:
      description: Bad Request
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Gateway-Error-Response'
              - $ref: '#/components/schemas/Service-Error-Response'
          examples:
            Bad-Request-Service-Error-Example:
              $ref: '#/components/examples/Bad-Request-Service-Error-Example'
            Bad-Request-Gateway-Error-Example:
