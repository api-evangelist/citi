        type: string
        format: numeric
        maxLength: 17
      merchantCity:
        description: Merchant city
        type: string
        format: alphanumeric
        maxLength: 15
      merchantState:
        description: Merchant state code
        type: string
        format: alphanumeric
        maxLength: 5
      merchantCountry:
        description: >-
          Merchant Country returned as two character country code<br>Applicable
          only for non-NAM regions
        type: string
        format: alphanumeric
        maxLength: 2
      merchantZipCode:
        description: Merchant Zip code
        type: string
        format: alphanumeric
        maxLength: 10
      debitCreditIndicator:
        description: >-
          Indicates whether the transaction is a debit or credit<br><br>Possible
          values<br>DR - Debit<br>CR - Credit
        type: string
        format: alphanumeric
        example: DR
        maxLength: 2
      transactionId:
        description: Transaction ID<br>Applicable for NAM region only
