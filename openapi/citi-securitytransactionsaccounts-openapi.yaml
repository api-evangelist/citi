      name: TRANS_REF_NBR
      description: >-
        Custodian Reference is the unique reference assigned by the Custodian to
        the record. The reference number is unique within a branch.
      in: query
      required: false
      schema:
        type: string
    parameter-41720:
      name: REAG_DEAG_CD
      description: >-
        Settlement Counterparty Code is the code associated to the Settlement
        Counterparty.
      in: query
      required: false
      schema:
        type: string
    parameter-41721:
      name: REAG_DEAG
      description: >-
        Settlement Counterparty is the name associated to the underlying
        instruction's REAG/DEAG tag if provided.
      in: query
      required: false
      schema:
        type: string
    parameter-41722:
      name: TRADE_DT
      description: Trade Date is the date a transaction is effected or executed.
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-41723:
      name: TRN_CD
      description: >-
        Transaction Type reflects the code of the transaction type. Sample
        Values returned:  SLS (Securities Lending System); CONV; ISWAP.
      in: query
      required: false
      schema:
        type: string
    parameter-41724:
      name: TRANS_CLASS_CD
      description: >-
        Transaction Class is the transaction type code for securities
        transactions.  Values include: ADJ (Adjustment), BIDS, BOE,  BUY, CAPD,
        CAPG, CAPGL, DF (Deliver Free), DIV (Dividend), DRAW, DRIP, DVCA, etc.
      in: query
      required: false
      schema:
        type: string
    parameter-41725:
      name: TRANS_CLASS
      description: >-
        Transaction Classification describes the category of trade. Values
        include MARKET TRADES, SECURITIES LENDING TRANSACTIONS, etc.
      in: query
      required: false
      schema:
        type: string
    parameter-41726:
      name: SIGNED_QTY
      description: >-
        The signed quantity based on the type of a transaction. The value would
        be positive in case of a receive, and it would be negative in case of a
        deliver.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-41727:
      name: PLACE_OF_SETLMT_CD
      description: >-
        Place Of Settlement code is the code associated with the Place of
        Settlement or Depository Centre Code for the security.
      in: query
      required: false
      schema:
        type: string
    parameter-41728:
      name: VALUE_DT
      description: >-
        Value Date is the date on which the cash posting corresponding to this
        trade will have value.
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-41682:
      name: TRD_STATUS
      description: Transaction Status
      in: query
      required: false
      schema:
        type: string
    parameter-41705:
      name: PARTIAL_SETTLEMENT_FLAG
      description: >-
        Partial Settlement Flag indicates if the trades data contains partial
        settlements details.
      in: query
      required: false
      schema:
        type: string
    parameter-42167:
      name: TRADE_STATUS_VALUES
      description: It provides the logical value of the trade status.
      in: query
      required: false
      schema:
        type: string
    parameter-42371:
      name: LAST_CHANGE_TIMESTAMP
      description: Last Change Timestamp
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-49542:
      name: MARKET_REF
      description: Market Reference
      in: query
      required: false
      schema:
        type: string
    parameter-49543:
      name: MITI_REF
      description: Market Infrastructure Transaction Identification Reference number
      in: query
      required: false
      schema:
        type: string
    parameter-49544:
      name: MATCHING_REF
      description: Matching reference
      in: query
      required: false
      schema:
        type: string
    parameter-49563:
      name: CRTD_TMS
      description: >-
        Created Timestamp (CR) is the date and time of when an item was loaded
        to the Reporting database. Applicable to intraday information only.
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-49564:
      name: TRAN_NOTES
      description: The transaction notes
      in: query
      required: false
      schema:
        type: string
    parameter-55295:
      name: DTC_FED_IDENTIFIER
      description: >-
        It describes indicator values of trades settled in DTC (Depository Trust
        Company) or FED (Federal) location from market via SMI (Securities
        Market Interface).
      in: query
      required: false
      schema:
        type: string
    parameter-55414:
      name: SETD_CMB_QTY
      description: Settled Quantity.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-55415:
      name: CONSID_AMT_P
      description: >-
        Settled Amount is the amount that has settled, corresponding to the
        Settled Quantity. Settled Amount will be less than Instructed Amount in
        partial settlements.
      in: query
      required: false
      schema:
        type: number
        format: double
