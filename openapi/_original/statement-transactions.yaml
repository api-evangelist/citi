        description: >-
          Sum of Unbilled transactions<br><br>If base CurrencyFlag = Y, then
          amount is expressed in the billed currency<br><br>If base CurrencyFlag
          = N, then amount is expressed in the alternate currency
        type: string
        format: numeric
        example: '8.6'
        maxLength: 17
      transactionPostingCurrencyCode:
        description: >-
          Transaction posting currency code<br><br>Three character currency
          code<br><br>If base CurrencyFlag = Y, then currency is the billed
          currency<br><br>If base CurrencyFlag = N, then currency is the
          alternate currency.ISO 4127 alpha-3 code
        type: string
        format: alphanumeric
        example: USD
        maxLength: 3
      baseCurrencyFlag:
        description: >-
          Boolean Flag to identify whether the statement data is in base
          currency or not.<br><br>"N" is only applicable for dual currency
          accounts<br><br>Possible values:<br>Y   True<br>N   False
        type: string
        format: alphanumeric
        example: 'Y'
        maxLength: 1
      unbilledTransactions:
        type: array
        items:
          $ref: '#/definitions/TransactionResp'
    required:
      - unbilledTransactionAmount
      - transactionPostingCurrencyCode
      - baseCurrencyFlag
