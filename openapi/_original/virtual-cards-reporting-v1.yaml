  /vca/v2/reports/clearing:
    post:
      summary: Obtain Cleared Transaction Details Reporting
      description: >-
        Obtain cleared transaction details on a VCA for reporting and payment
        reconciliation
      operationId: Clearing Report
      parameters:
        - name: Content-Type
          in: header
          description: Supports application/json
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: >-
            Oauth token included by the external client to APIm. APIm will
            external the client ID and pass it to GRACE
          required: true
          schema:
            type: string
        - name: Country
          in: header
          description: >-
            Three character length country code used during onboarding into
            GRACE
          schema:
            type: string
          required: true
        - name: Region
          in: header
          description: >-
            This value will be used by APIm to route to the respective GRACE
            backend instance
          schema:
            type: string
          required: true
        - name: Req-Sys-Id
          in: header
          description: >-
            Unique ID of the API message sent. This ID will be provided back in
            the corresponding response. The ID can be used for investigation and
            troubleshooting. The ID must be unique per integration.
