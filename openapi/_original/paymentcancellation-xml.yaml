    properties:
      Cd:
        $ref: '#/definitions/DocumentType3Code'
      Prtry:
        description: Creditor reference type, in a proprietary form.
        allOf:
          - $ref: '#/definitions/Max35Text'
  DocumentType3Code:
    enum:
      - RADM
      - RPIN
      - FXDR
      - DISP
      - PUOR
      - SCOR
    type: string
    description: >-
      Type of creditor reference, in a coded form.<br><br><b>RADM</b> : Document
      is a remittance advice sent separately from the current transaction.
      <br><br><b>RPIN</b> : Document is a linked payment instruction to which
      the current payment instruction is related, for example, in a cover
      scenario. <br><br><b>FXDR</b> : Document is a pre-agreed or pre-arranged
      foreign exchange transaction to which the payment transaction refers.
      <br><br><b>DISP</b> : Document is a dispatch advice. <br><br><b>PUOR</b> :
      Document is a purchase order <br><br><b>SCOR</b> : Document is a
      structured communication reference provided by the creditor to identify
      the referred transaction.
  RemittanceAmount2:
