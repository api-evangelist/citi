              target-url: $(PanValidation)$(api.operation.path)
              tls-profile: icg-tts-ic
        otherwise: []
        version: 1.0.0
    - activity-log:
        title: activity-log
        content: header
        error-content: header
        version: 1.0.0
    catch: []
