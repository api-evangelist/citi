        vcaAuthorizationResponseDetail:
          description: >-
            Authorization status/reason description from Networks Payment
            Control<br><br>Possible values:<br><br>Visa:<br><br>ADT - Adult
            Themed merchants restriction<br>AIR - Airline merchants
            restriction<br>ALC - Alcohol merchants restriction<br>ATM - ATM cash
            disbursement restriction<br>ATML - ATM cash disbursement amount
            limit<br>AUTO - Auto merchants restriction<br>BUS - Business hours
            restriction<br>BUSS - Business Services merchants
            restriction<br>CAID - Card Acceptor Code restriction<br>CLOTH -
            General retail merchants restriction<br>CNP - Card-not-present
            restriction<br>CNTR - General Contractor Services merchant
            restriction<br>DOM - State-level transaction restrictions<br>EAM -
            E-commerce with transaction amount limit<br>ECOM - E-commerce
            transaction restriction<br>ELEC - Electronics merchants
            restriction<br>ENT - Entertainment related merchants
            restriction<br>FUEL - Fuel merchants restriction<br>GOV - Government
            Services merchants restriction<br>GROC - Grocery Stores and
            Pharmacies merchants restriction<br>GTM - Ground Transportation
            merchants restriction<br>HOT - Hotel merchants restriction<br>JEWL -
            Jewelery merchants restriction<br>MED - Medical retail merchants
            restriction<br>MISC - Miscellaneous Retailer restriction<br>NOC -
            Block all other cash access transaction<br>NOTFUEL - Non fuel
            merchants restriction<br>OSS - Office Supply merchants
            restriction<br>PROF - Professional Services and Membership
            Organizations restriction<br>PUR - Purchase amount limit<br>QSR -
            Fastfood merchants restriction<br>REST - Restaurant merchants
            restriction<br>RETL - Retail Outlet Services restriction<br>SPV -
            Spend Velocity restriction<br>TOLRNC - Tolerance range
            restriction<br>UTIL - Utilities merchants restriction<br>VPAS -
            Exact Match restriction<br>XBR - Cross-border transaction
            restriction<br>XBRA - Cross-border transaction restrictions with
            amount limits<br>XBRB - Country restriction<br>XBRX - Country
            restriction<br><br>Mastercard:<br><br>"Approval" - Transaction
            within the VCN limits.<br>"CPN does not exist" - Invalid VCN, not
            registered in In Control.<br>"Status bad" - VCN not in an active
            state. Cannot use forauthorizations.<br>"Expiry match fail" - Expiry
            provided for the authorization does not match the VCN
            Expiry.<br>"AVV match fail" - CVC2 provided for the authorization
            does not match the VCN CVC2.<br>"Valid period fail" - Transaction
            falls outside the VCN’s defined validity period.<br>"Trans limit
            fail" - Transaction amount greater than the VCN’s transaction
            limit.<br>"Cumul limit fail" - Current authorization causes the VCN
            to breach its cumulative spend limit.<br>"Num usages fail" - Current
            authorization causes the VCN to breach its usage limit.<br>"Merch Id
            limit fail" - Merchant Id for authorization does not match the
            Merchant Id linked to the VCN.<br>"MCC limit fail" - Merchant
            Category Code for the authorization does not match the MCC linked to
            this VCN.<br>"Iss/Netwk decline" - Authorization declined by the
            issuer or card network. Outside of In Control.<br>"Base/CPN conv.
            Err" - <br>"Crit Field Missing" - Critical field missing from the
            incoming authorization message.<br>"No Auth for Rev" - In Control
            cannot map the reversal to an original authorization.<br>"Unmatched
            Response" - Advice does not match any past requests in the
            authorization journal<br>"Revl of unsucc auth" - In Control cannot
            reverse an unsuccessful authorization<br>"Exp. Date of CPN used is
            expired" - VCN expired.<br>"Repeat message" - Repeat of a previous
            message. Based on a flag in the message header or on key message
            fields.<br>"Api fail"<br>"Api System Fail"<br>"Enhanced MID" -
            Acquirer Id (DE32) and Card Acceptor Id (DE42) in the authorization
            message do not match the values specified for the
            control.<br>"Enhanced MCC" - MCC value in the authorization message
            (D18) does not match the values specified for the control.<br>"Txn
            Env Control" - VCN breached its transaction environment
            control.<br>"Err Travel Control" - VCN breached its travel control
            rule.<br>"Multi Merch ID Assoc Lim" - Merchant Id for the
            authorization does not match any of those linked to this
            VCN.<br>"Single Merch Name Assoc Lim" - Merchant Name for the
            authorization does not match that linked to this VCN.<br>"Geographic
            Control" - VCN breached its geographic control rule.<br>"Curfew
            Control" - VCN breached its curfew control rule.<br>"Approve
            Control" - VCN breached its approve control rule.<br>"RCN Decline" -
            Transaction failed due to decline by a subsequent service.<br>"No
            Rules Fail" - Rule set with no rules to evaluate.<br>"No Controls
            Fail" - Rule with no controls to evaluate.<br>"Unknown Control Type
            Fail" - Cannot classify the control fail<br>"Svc Not Enabled" -
            Transaction received for an account with no service
            enabled<br>"Merch Amount Fail" - Transaction amount breaches the
            expected merchant currency<br>"Merch Curr Fail" - Transaction amount
            breaches the amount limit for the merchant currency.<br>"DE Control
            fail" - Values for DE3.1 – Processing Code and/or DE22.1 – PAN Entry
            Mode and/or61.11 – POS Term Capability Indicator do not match the
            values in the authorization.<br>"EVCN Control fail" - EVCN not in an
            active state. Cannot use for authorization.<br>"Roaming VC Fail" -
            VCN breaches its roaming velocity control.<br>"Amount Range Control
            Fail" - Transaction amount falls outside the minimum and maximum
            amount range set.<br>"CPN State Control Fail" - Account suspended.
            No authorization activity permitted.<br>"Aging Cumul limit fail" -
            Control that keeps track of the current remaining Available Credit.
            Approves transactions only if the requested amount is less than or
            equal to the remaining Available Credit.
          type: string
          format: alphanumeric
          example: Iss/Netwk decline
          maxLength: 69
        authorizationResponseCategory:
          description: >-
            Authorization Category Description from VisaNet<br>Mastercard - Not
            applicable<br>Visa - Required
          type: string
          format: alphanumeric
          example: ADT - Adult Themed merchants restriction
        settled:
          description: >-
