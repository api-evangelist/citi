      title: lines
    Customer:
      title: Customer
      properties:
        account:
          title: customer account
          description: Account Details
          properties:
            number:
              maxLength: 40
              minLength: 1
              type: string
              description: "Customer's bank account \n- For US RFP this parameter is mandatory with max length 40 \n- For ACH, max length is 17 \n - For ACH Pay and verify transaction customer.account.number parameter is mandatory \n- For US ACH Direct Debit, customer.account.number parameter is mandatory with max length 17"
              example: '1122334455'
              title: number
            bank_id:
              maxLength: 35
              minLength: 1
              type: string
              description: "Customer bank's network identification \n- For US RFP this parameter is mandatory with max length 16 \n- For ACH, length is equal to 9 \n - For ACH Pay and verify transaction customer.account.bank_id parameter is mandatory \n- For US ACH Direct Debit, customer.account.bank_id parameter is mandatory with maximum length 9 \n- For Brazil PIX Initiation, this parameter is mandatory with min & max length 8"
              example: CITIIN77
              title: bank_id
            bank_name:
              maxLength: 35
              minLength: 1
              type: string
              description: "Name of the bank where customer is maintaining the account \n- For US ACH Direct Debit, customer.account.bank_name parameter is mandatory with max length 35"
              example: CITI
              title: bank_name
            bank_country_code:
              type: string
              pattern: ^[A-Z]{2,2}$
              description: "Country code of the bank where customer is maintaining the account \n- For US ACH Direct Debit, customer.account.bank_country parameter is mandatory"
              example: US
              title: bank_country_code
            name:
              maxLength: 70
              minLength: 1
              type: string
              description: "Customer's Account Name \n- For US RFP transaction, customer.account.name parameter is optional"
              title: name
            type:
              description: "An indicator identifying the type of bank account \n - For ACH Pay and verify transaction customer.account.type parameter is mandatory \n - For US ACH Direct Debit, customer.account.type parameter is mandatory with allowed values - SAVINGS & CORPORATE_CHECKING"
              enum:
              - SAVINGS
              - CURRENT
              - CARD
              - OVERDRAFT
              - VIRTUAL_ACCOUNT
              - CORPORATE_CHECKING
              example: SAVINGS
              type: string
              title: type
        id:
          description: Merchant internal customer ID.
          example: 1234abcjki
          maxLength: 40
          minLength: 1
          type: string
          title: id
        name:
          $ref: '#/components/schemas/Name'
        tax_id:
          description: "Customer's payer identification (e.g., email address) \n- For Brazil PIX Initiation, this parameter is mandatory, individual person tax identification (CPF) allowed length = 11 or business entity tax identification (CNPJ) allowed length = 14"
          example: 234.453.678-21
          maxLength: 100
          minLength: 1
          type: string
          title: tax_id
        national_id:
          description: An identifier for the payer assigned by a government authority.
          example: 234.453.678-21
          maxLength: 30
          minLength: 1
          type: string
          title: national_id
        email:
          description: "Customer email \n - For UK PAYBYBANK creation, customer.email parameter is mandatory."
          example: customer.raj2024@gmail.com
          type: string
          pattern: '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$'
          title: email
        phone:
          description: Customer phone.
          example: '+919962125789'
          pattern: \+[0-9]{1,3}[-\ ][0-9()+\-]{1,30}
          type: string
          title: phone
        line_of_business:
          description: Your payment service provider might have configured your merchant profile to support several lines of business.
          example: SMALL BUSINESS
          maxLength: 100
          minLength: 1
          type: string
          title: line_of_business
        type:
          description: "Customer type \n - For Brazil QR Creation customer.type parameter is mandatory \n- For US RFP, this parameter is optional"
          enum:
          - INDIVIDUAL
          - BUSINESS
          example: BUSINESS
          type: string
          title: type
        organization_id:
          description: 'Customer Organization Id/ Legal Entity as provided at the time of payment request.

            - For US RFP max length is 20'
          example: ORG123456
          maxLength: 35
          minLength: 1
          type: string
          title: organization_id
        birth_date:
          type: string
          format: date
          description: "ISO 8601 (YYYY-MM-DD), Customer's birth_date  \n- For US RFP and  PAYPAL transactions, customer.birth_date parameter is optional"
          title: birth_date
        birth_city:
          maxLength: 35
          minLength: 1
          type: string
          description: "Customer's birth_city \n- For US RFP max length is 35"
          title: birth_city
        birth_country:
          type: string
          description: "Customer's birth_country \n- For US RFP transaction, customer.birth_country parameter is optional"
          pattern: ^[A-Z]{2,2}$
          title: birth_country
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
        device:
          $ref: '#/components/schemas/Customer-Device'
        address:
          $ref: '#/components/schemas/Address'
