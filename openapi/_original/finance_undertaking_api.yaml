            Code Name Definition:


            * AGENT     - Agent's Commission 

            * COMM      - Our Commission 

            * CORCOM    - Our Correspondent's Commission 

            * DISC      - Commercial Discount 

            * INSUR     - Insurance Premium 

            * POST      - Our Postage 

