            document needs to be examined for issuer or cardholder
            needs.<br>"Fee collection" - Transactions related to the collection
            or disbursement of fees that require funds settlement between
            various clearing system participants. Fee Collection messages may
            include fees generated between pairs of customers, and fees
            generated between the Corporation and customers. Following are some
            examples of Fee Collection messages: • Collection or disbursement
            from customer to customer of fees that brand, program, and service
            rules permit<br> • Collection or disbursement from Mastercard to
            customer of fees related to processing services that the clearing
            system provides<br> • Collection or disbursement from Mastercard to
            customer of such fees as administrative fees, membership fees, and
            penalties, according to brand, program, and service<br> • Collection
            or disbursement from customer to customer of summary settlement
            positions between customers that participate in bilateral clearing
            arrangements with clearing system summary settlement
