openapi: 3.2.0
info:
  title: Citi Authentication API
  version: 1.0.0
  x-refined-note:
  - x-ibm-name differs across the merged source definitions and was not carried
  description: 'Operations tagged Authentication across 2 of this provider''s published API definitions: DigitalPaymentsCollectionsv12.yaml, ukraine_open_banking_authentication_api.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://tts.apib2b.citi.com/citiconnect/prod
  description: production gateway URL
- url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb
  description: sbox URL
- url: https://tts.sit.apib2b.citi.com/citiconnect/uat
  description: uat URL
- url: https://b2b.tts.icgservices.citi.com/citiconnect/openbanking/ukr/authenticationservices/v1
  description: production gateway url
- url: https://sanbox.tts.icgservices.citi.com/citiconnect/openbanking/ukr/authenticationservices/v1
  description: sbox url
tags:
- name: Authentication
paths:
  /digitalpayments/v1/payment-acceptance/authentication:
    post:
      tags:
      - Authentication
      summary: Create a authentication request
      description: This endpoint validates your request and synchronously responds with HTTP status 200 (OK) after successful validation. If validation fails, the endpoint synchronously responds with error (HTTP status 4XX / 5XX and any applicable reason code), indicating Citi couldn't accept your authentication creation request.
      operationId: authentication
      parameters:
      - $ref: '#/components/parameters/Client-Id'
      - $ref: '#/components/parameters/Idempotency-Id'
      - $ref: '#/components/parameters/Merchant-Token-Id'
      - $ref: '#/components/parameters/Post-Authentication-Operation'
      - $ref: '#/components/parameters/Post-Country-Code'
      requestBody:
        description: Create authentication request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Authentication-Request'
            examples:
              Authentication_Initiate_Request:
                $ref: '#/components/examples/Authentication-Request-Example'
      security:
      - clientCredentials: []
      responses:
        '200':
          description: OK
          headers:
            apim-guid:
              schema:
                type: string
              description: Citi's unique identification for your request
            Merchant-Id:
              schema:
                type: string
              description: The unique identifier issued to you by your payment provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authentication-Response'
              examples:
                Authentication_Initiate_Response:
                  $ref: '#/components/examples/Authentication-Response-Example'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '429':
          $ref: '#/components/responses/Rate-Limit-Exceeded'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        '504':
          $ref: '#/components/responses/Gateway-Timeout'
        default:
          $ref: '#/components/responses/Internal-Server-Error'
    servers:
    - url: https://tts.apib2b.citi.com/citiconnect/prod
      description: production gateway URL
    - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb
      description: sbox URL
    - url: https://tts.sit.apib2b.citi.com/citiconnect/uat
      description: uat URL
  /digitalpayments/v1/payment-acceptance/authentication/{id}:
    patch:
      tags:
      - Authentication
      summary: Payer Authentication Request
      description: This endpoint validates your request and synchronously responds with HTTP status 202 (accepted) after successful validation. If validation fails, the endpoint synchronously responds with error (HTTP status 4XX / 5XX and any applicable reason code), indicating Citi couldn't accept your tokenization update request.
      operationId: updateAuthentication
      parameters:
      - $ref: '#/components/parameters/Idempotency-Id'
      - $ref: '#/components/parameters/Client-Id'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Merchant-Token-Id'
      - $ref: '#/components/parameters/Patch-Authentication-Operation'
      requestBody:
        description: Payer Authentication Request.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Authentication-Payer-Request'
            examples:
              Authentication_Payer_Request:
                $ref: '#/components/examples/Authentication-Payer-Request-Example'
      security:
      - clientCredentials: []
      responses:
        '200':
          description: OK
          headers:
            apim-guid:
              schema:
                type: string
              description: Citi's unique identification for your request
            Merchant-Id:
              schema:
                type: string
              description: The unique identifier issued to you by your payment provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authentication-Payer-Response'
              examples:
                Authentication_Payer_Response:
                  $ref: '#/components/examples/Authentication-Payer-Response-Example'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '429':
          $ref: '#/components/responses/Rate-Limit-Exceeded'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        '504':
          $ref: '#/components/responses/Gateway-Timeout'
    servers:
    - url: https://tts.apib2b.citi.com/citiconnect/prod
      description: production gateway URL
    - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb
      description: sbox URL
    - url: https://tts.sit.apib2b.citi.com/citiconnect/uat
      description: uat URL
  /oauth/token:
    post:
      tags:
      - Authentication
      summary: Request Access Token
      description: The OAuth token request authenticates your API message sent in either JSON formats and responds with an access token. In compliance with RFC 6749, requests to this endpoint MUST use the HTTP POST method and the request body MUST be URL-encoded (application/x-www-form-urlencoded).
      operationId: authentication
      parameters:
      - name: Authorization
        in: header
        description: "The authorization will include \"Basic\" followed by a single space, followed by the Base64 encoded value of the APIm `client_id` & `secret key`. \n\nIn the above example, the `client_id` is *1234a5b6-cde7-8f90-12gh-345ij6789012* & secret key is *abcdefghijklmnop*.  \n\nThe Base64 value after appending by adding “:” in between will be “MTIzNGE1YjYtY2RlNy04ZjkwLTEyZ2gtMzQ1aWo2Nzg5MDEyOmFiY2RlZmdoaWprbG1ub3A=”. \n"
        required: true
        schema:
          type: string
          format: byte
      requestBody:
        description: Request body for the OAuth Token.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Request'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
              example:
                httpMessage: Bad Request
                httpCode: '400'
                moreInformation: please provide valid value for request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
              example:
                httpMessage: UNAUTHORIZED
                httpCode: '401'
                moreInformation: The server could not verify that you are authorized to access the URL
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
              example:
                httpMessage: NOT FOUND
                httpCode: '404'
                moreInformation: No resources match requested URI
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
              example:
                httpMessage: METHOD NOT ALLOWED
                httpCode: '405'
                moreInformation: The method is not allowed for the requested URL
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
              example:
                httpMessage: UNSUPPORTED MEDIA TYPE
                httpCode: '415'
                moreInformation: Unsupported Content-Type application/octet-stream
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
              example:
                httpMessage: Internal Server Error
                httpCode: '500'
                moreInformation: Internal Server Error
      deprecated: false
      security:
      - BasicAuthentication: []
      x-codegen-request-body-name: body
    servers:
    - url: https://b2b.tts.icgservices.citi.com/citiconnect/openbanking/ukr/authenticationservices/v1
      description: production gateway url
    - url: https://sanbox.tts.icgservices.citi.com/citiconnect/openbanking/ukr/authenticationservices/v1
      description: sbox url
components:
  responses:
    Bad-Request:
      description: Bad Request
      headers:
        apim-guid:
          $ref: '#/components/headers/Request-Id'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Gateway-Error-Response'
            - $ref: '#/components/schemas/Error-Response'
          examples:
            Bad-Request-Service-Error-Example:
              $ref: '#/components/examples/Bad-Request-Example'
            Bad-Request-Gateway-Error-Example:
              $ref: '#/components/examples/Bad-Request-Gateway-Error-Example'
    Rate-Limit-Exceeded:
      description: Rate Limit Exceeded
      headers:
        apim-guid:
          $ref: '#/components/headers/Request-Id'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Gateway-Error-Response'
          examples:
            Rate-Limit-Exceeded-Gateway-Error-Example:
              $ref: '#/components/examples/Rate-Limit-Exceeded-Gateway-Error-Example'
    Gateway-Timeout:
      description: Gateway Timeout
      headers:
        apim-guid:
          $ref: '#/components/headers/Request-Id'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Gateway-Error-Response'
          examples:
            Gateway-Timeout-Gateway-Error-Example:
              $ref: '#/components/examples/Gateway-Timeout-Gateway-Error-Example'
    Conflict:
      description: Conflict
      headers:
        apim-guid:
          $ref: '#/components/headers/Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error-Response'
          examples:
            Idempotency-Id-Conflict-Example:
              $ref: '#/components/examples/Idempotency-Id-Conflict-Example'
    Method-Not-Allowed:
      description: Method Not Allowed
      headers:
        apim-guid:
          $ref: '#/components/headers/Request-Id'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Gateway-Error-Response'
            - $ref: '#/components/schemas/Error-Response'
          examples:
            Method-Not-Allowed-Service-Error-Example:
              $ref: '#/components/examples/Method-Not-Allowed-Example'
            Method-Not-Allowed-Gateway-Error-Example:
              $ref: '#/components/examples/Method-Not-Allowed-Gateway-Error-Example'
    Unauthorized:
      description: Unauthorized
      headers:
        apim-guid:
          $ref: '#/components/headers/Request-Id'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Gateway-Error-Response'
            - $ref: '#/components/schemas/Error-Response'
          examples:
            Unauthorized-Service-Error-Example:
              $ref: '#/components/examples/Unauthorized-Example'
            Unauthorized-Gateway-Error-Example:
              $ref: '#/components/examples/Unauthorized-Gateway-Error-Example'
    Internal-Server-Error:
      description: Internal Server Error
      headers:
        apim-guid:
          $ref: '#/components/headers/Request-Id'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Gateway-Error-Response'
            - $ref: '#/components/schemas/Error-Response'
          examples:
            Internal-Server-Error-Example:
              $ref: '#/components/examples/Internal-Server-Error-Example'
            Internal-Server-Gateway-Error-Example:
              $ref: '#/components/examples/Internal-Server-Gateway-Error-Example'
    Not-Found:
      description: Not Found
      headers:
        apim-guid:
          $ref: '#/components/headers/Request-Id'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Gateway-Error-Response'
            - $ref: '#/components/schemas/Error-Response'
          examples:
            Not-Found-Service-Error-Example:
              $ref: '#/components/examples/Not-Found-Example'
            Not-Found-Gateway-Error-Example:
              $ref: '#/components/examples/Not-Found-Gateway-Error-Example'
    Unsupported-Media-Type:
      description: Unsupported Media Type
      headers:
        apim-guid:
          $ref: '#/components/headers/Request-Id'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Gateway-Error-Response'
            - $ref: '#/components/schemas/Error-Response'
          examples:
            Unsupported-Media-Type-Service-Error-Example:
              $ref: '#/components/examples/Unsupported-Media-Type-Example'
            Unsupported-Media-Type-Gateway-Error-Example:
              $ref: '#/components/examples/Un-Supported-Media-Type-Gateway-Error-Example'
  examples:
    Bad-Request-Gateway-Error-Example:
      value:
        httpCode: '400'
        httpMessage: Bad Request
        moreInformation: please provide valid value for property emailAddress
    Method-Not-Allowed-Example:
      value:
        ref_id: ec689822-9864-4c4d-9d68-222467627902
        error_details:
        - issue: HTTP method is not supported
          action: Provide valid HTTP method
          code: CC00001
    Un-Supported-Media-Type-Gateway-Error-Example:
      value:
        httpCode: '415'
        httpMessage: Unsupported Media Type
        moreInformation: Unsupported Content-Type
    Rate-Limit-Exceeded-Gateway-Error-Example:
      value:
        httpCode: '429'
        httpMessage: Too Many Requests
        moreInformation: Rate Limit exceeded
    Internal-Server-Gateway-Error-Example:
      value:
        httpCode: '500'
        httpMessage: Internal Server Error
        moreInformation: unable to serve your request at this moment
    Gateway-Timeout-Gateway-Error-Example:
      value:
        httpCode: '504'
        httpMessage: GATEWAY_TIMEOUT
        moreInformation: 'Response took longer than timeout: PT50S'
    Not-Found-Gateway-Error-Example:
      value:
        httpCode: '404'
        httpMessage: Not Found
        moreInformation: No resources match requested URI
    Unauthorized-Example:
      value:
        ref_id: ec689822-9864-4c4d-9d68-222467627902
        error_details:
        - issue: User not authorized for this functionality
          action: please use valid credentials to access this functionality
          code: CC00007
    Bad-Request-Example:
      value:
        ref_id: 444d0f3f-4x55-7g99-8b2c-0cf2a921a5ab
        error_details:
        - issue: property method.type is mandatory and it cannot be empty
          action: please provide valid value for property method.type
          code: VC00010
    Idempotency-Id-Conflict-Example:
      value:
        ref_id: ec689822-9864-4c4d-9d68-222467627902
        error_details:
        - issue: Idempotency-Id provided is currently being used in another request
          action: please do not repeat the same request again
          code: VC00016
    Internal-Server-Error-Example:
      value:
        ref_id: ec689822-9864-4c4d-9d68-222467627902
        error_details:
        - issue: unable to serve your request at this moment
          action: Please refer to documentation provided or contact support team
          code: CC00004
    Unauthorized-Gateway-Error-Example:
      value:
        httpCode: '401'
        httpMessage: Unauthorized
        moreInformation: This server could not verify that you are authorized to access the URL
    Authentication-Request-Example:
      value:
        authentication:
          channel: MERCHANT_REQUESTED
        order:
          id: '123456789'
          currency_code: USD
        method:
          type: CARD
          id_type: CARD_NUMBER
          card:
            expiry_month: 09
            expiry_year: '25'
        transaction:
          id: TRANS1234567
          currency_code: USD
          country_code: US
    Authentication-Payer-Response-Example:
      value:
        transaction:
          id: CITI202402040111
        authentication:
          sdk:
            application_id: '567890432'
            encrypted_data: tyrwewe
            public_key: 568877989dsdsds
            reference_number: rtyudsds
            transaction_id: wertyuiopa1234567890qwertyuiop
        order:
          currency_code: USD
          avs_action: NO_ACTION
          avs_response: ADDRESS_MATCH
          charge_type: SURCHARGE
    Not-Found-Example:
      value:
        ref_id: ec689822-9864-4c4d-9d68-222467627702
        error_details:
        - issue: Resource that you are searching is not found
          action: Please use valid resource details
          code: CC00006
    Unsupported-Media-Type-Example:
      value:
        ref_id: ec689822-9864-4c4d-9d68-222467627902
        error_details:
        - issue: Media type not supported
          action: please use valid content-type in header
          code: CC00002
    Authentication-Response-Example:
      value:
        authentication:
          method_completed: true
          method_supported: SUPPORTED
          requestor_id: REQ123456
          requestor_name: SWDFGTHJ
        order:
          currency_code: USD
          status: AUTHORIZED
          total_auth_amount: 100
          total_captured_amount: 0
          total_refunded_amount: 0
          id: TX0250117002
          creation_time: '2025-01-17T13:10:23.973Z'
          update_time: '2025-01-17T13:10:24.351Z'
        transaction:
          id: ORD_20250117_002
          amount: 100
          currency_code: USD
          status: SUCCESS
          description: APPROVED
          creation_date_time: '2025-01-17T13:10:24.019Z'
          update_time: '2025-01-17T13:10:24.351Z'
        method:
          CARD:
            number: 401200xxxxxx0026
            expiry_month: '1'
            expiry_year: '39'
            fundingMethod: CREDIT
    Authentication-Payer-Request-Example:
      value:
        transaction:
          id: CITI202402040111
        authentication:
          sdk:
            application_id: '567890432'
            encrypted_data: tyrwewe
            public_key: 568877989dsdsds
            reference_number: rtyudsds
            transaction_id: wertyuiopa1234567890qwertyuiop
        order:
          currency_code: USD
          avs_action: NO_ACTION
          avs_response: ADDRESS_MATCH
          charge_type: SURCHARGE
    Method-Not-Allowed-Gateway-Error-Example:
      value:
        httpCode: '405'
        httpMessage: Method Not Allowed
        moreInformation: The method is not allowed for the requested URL
  parameters:
    Client-Id:
      in: query
      name: client_id
      required: true
      description: Your unique identification, same as the identification you use for OAuth token generation, Citi shared with you during your CitiConnect API onboarding
      schema:
        type: string
        description: Your unique identification, same as the identification you use for OAuth token generation, Citi shared with you during your CitiConnect API onboarding
        example: 9a10a5d6-63d4-4885-b6bd-19e79629496d
    Patch-Authentication-Operation:
      in: header
      name: Operation
      required: false
      description: API operation
      schema:
        type: string
        enum:
        - AUTHENTICATE_PAYER
        description: API operation
        example: AUTHENTICATE_PAYER
    Merchant-Token-Id:
      name: Merchant-Id
      in: header
      required: true
      description: Your unique Merchant Identification number
      schema:
        type: string
        maxLength: 40
        minLength: 1
        description: Your unique Merchant Identification number
      example: M123456987
    Idempotency-Id:
      name: Idempotency-Id
      in: header
      required: true
      description: "Your unique identification for a POST request \n - Maximum length is 128. \n-  CitiConnect API responds with an error (HTTP status 4XX) if your POST request idempotency identification value is a duplicate across a recent history of idempotency identifications in Citi's database."
      schema:
        type: string
        maxLength: 128
        description: "Your unique identification for a POST request \n - Maximum length is 128. \n-  CitiConnect API responds with an error (HTTP status 4XX) if your POST request idempotency identification value is a duplicate across a recent history of idempotency identifications in Citi's database. \n- If you don't receive any response (HTTP status 2XX, 4XX or 5XX) from Citi to your POST request and you wish to retry, reinitiate your request with the same idempotency identification to prevent accidental duplicate payment."
      example: a44cbb60-6de4-4edb-9a7a-123414bba3bb
    Id:
      name: id
      in: path
      required: true
      description: Your unique End To End identification
      schema:
        type: string
        maxLength: 128
        minLength: 1
        description: Your unique End To End identification
      example: abc-pay-123
    Post-Authentication-Operation:
      in: header
      name: Operation
      required: false
      description: API operation
      schema:
        type: string
        enum:
        - INITIATE_AUTHENTICATION
        description: API operation
        example: INITIATE_AUTHENTICATION
    Post-Country-Code:
      name: Country-Code
      in: header
      schema:
        type: string
        maxLength: 2
        minLength: 2
        description: Country Code
      example: IN
  schemas:
    Error-Response:
      type: object
      title: Error Response
      properties:
        ref_id:
          type: string
          maxLength: 60
          description: Unique ID for the Transaction
          title: ref_id
        error_details:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Error-Detail'
    Gateway-Error-Response:
      type: object
      title: GatewayErrorResponse
      properties:
        httpCode:
          type: string
          maxLength: 3
          description: Numeric HTTP Staus code
          title: httpCode
        httpMessage:
          type: string
          maxLength: 128
          description: HTTP error message
          title: httpMessage
        moreInformation:
          type: string
          maxLength: 128
          description: HTTP error message
          title: httpMessage
    Authentication-Customer-Device:
      title: Authentication Customer Device
      description: Customer-Device.
      properties:
        ani:
          description: The telephone number captured by ANI (Automatic Number Identification) when the customer calls to place the order.
          example: M1234567890
          maxLength: 10
          minLength: 1
          type: string
          title: ani
        ani_call_type:
          description: The 2 digit ANI information identifier provided by the telephone company to indicate the call type, for example, cellular (61-63), toll free (24,25), etc.
          example: '63'
          maxLength: 2
          minLength: 1
          type: string
          title: ani_call_type
        browser:
          description: The User-Agent header of the browser the customer used to place the order.
          example: '63'
          maxLength: 2048
          minLength: 1
          type: string
          title: browser
        browser_accept_window_size:
          description: Dimensions of the 3DS challenge window in pixels (e.g., 250x400).
          enum:
          - 250_X_400
          - 390_X_400
          - 500_X_600
          - 600_X_400
          - FULL_SCREEN
          example: FULL_SCREEN
          type: string
          title: browser_accept_window_size
        fingerprint:
          description: Information collected about a remote computing device for the purpose of providing a unique identifier for the device.
          example: '63'
          maxLength: 4000
          minLength: 1
          type: string
          title: fingerprint
        hostname:
          description: The name of the server to which the customer is connected.
          example: '63'
          maxLength: 60
          minLength: 1
          type: string
          title: hostname
        ip_address:
          description: The name of the server to which the customer is connected.
          example: '63'
          maxLength: 45
          minLength: 7
          type: string
          title: ip_address
        mobile_phone_model:
          description: The name of the server to which the customer is connected.
          example: '63'
          maxLength: 255
          minLength: 1
          type: string
          title: mobile_phone_model
        browser_accept_headers:
          description: The content of the Accept request-header field sent from the browser.
          example: '63'
          maxLength: 2048
          minLength: 1
          type: string
          title: browser_accept_headers
        browser_color_depth:
          description: The bit depth of the color palette for images (1-48 bits per pixel).
          example: '63'
          maximum: 48
          minimum: 1
          type: number
          title: browser_accept_headers
        browser_java_enabled:
