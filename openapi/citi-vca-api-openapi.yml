        transactionType:
          description: 'Specifies the type of transaction.<br><br>Possible values - Mastercard:<br><br>"Authorization" - Transactions that have a requested authorization<br>"Auth Purchase Return" - Authorization from issuer on a reversal (refund/credit)<br>"Advice" - Non-posting message generated by either an acquirer, issuer, or system. Acquirer-generated advice message - advises of an authorization that was carried out on the issuer’s behalf. Issuer-generated advice message - sent to the risk scoring system. System-generated advice message - advises of an authorization that was carried out on the issuer’s behalf.<br> "Reversal" - Reversal Request generated by an acquirer when the acquirer is unable to deliver an issuer’s Authorization Request Response to a merchant. Merchants also may initiate a Reversal Request to cancel the full or partial amount of the original authorization amount<br>"Reversal advice" - The Reversal Advice message fully reverses a previous Authorization Request. It advises an issuer of a Reversal Request responded to by the Authorization Platform. Reversal advise is generated by the Authorization Platform on detection of an exception condition while processing a previous Authorization Request Response. The Authorization Platform may generate this message when an issuer is unavailable to respond to a Reversal Request or is delayed in providing a Reversal Request Response message.<br>"Unspecified (Offline Settlements)" - Returned when none of the transactionType values apply: Authorization, Auth Purchase Return, Advise, Reversal, Reversal advice, Purchase Return, Forced Post<br>"Purchase Return" - Clearing only refund/credit<br>"Forced Post" - Forced Posted are records inserted in the authorization journal from clearing records when the clearing record didn’t match to a preceding authorization record<br><br>Possible values - Visa:<br><br>"0" -  NOT APPLICABLE<br>"100" -  AUTHORIZATION REQUEST<br>"101" -  REPEAT AUTHORIZATION REQUEST<br>"102" -  ATM CONFIRMATION<br>"110" -  AUTHORIZATION RESPONSE<br>"120" - AUTHORIZATION ADVICE<br>"130" -  AUTHORIZATION ADVICE<br>"200" -  ORIGINAL FINANCIAL REQUEST<br>"201" -  REPEAT FINANCIAL REQUEST<br>"210" -  ORIGINAL FINANCIAL RESPONSE<br>"220" -  ORIGL/ADVC/ADJMT/RPRSNT REQUEST<br>"221" -  REPEAT FINANCIAL ADVICE<br>"230" -  ORIGL/ADVC/ADJMT/RPRSNT RESPONSE<br>"282" -  REPRESENTMENT STATUS ADVICE<br>"292" -  REPRESENTMENT STATUS ADVICE RESPONSE<br>"300" -  FILE OR INQUIRY UPDATE- ACQUIRER<br>"302" -  FILE OR INQUIRY UPDATE-ISSUER<br>"310" -  FILE UPDATE OR INQUIRY RESPONSE-ACQUIRER<br>"312" -  FILE UPDATE OR INQUIRY RESPONSE-ISSUER<br>"322" -  FILE UPDATE OR DISCREPANCY ADVICE<br>"332" -  FILE UPDATE ADVICE RESPONSE<br>"400" -  REVERSAL REQUEST<br>"401" -  REPEAT REVERSAL REQUEST<br>"410" -  REVERSAL RESPONSE<br>"420" -  REVERSAL ADVICE<br>"422" -  CHARGEBACK REQUEST<br>"430" -  REVERSAL ADVICE RESPONSE<br>"432" -  CHARGEBACK RESPONSE<br>"480" -  CHARGEBACK STATUS ADVICE<br>"490" -  CHARGEBACK STATUS ADVICE RESPONSE<br>"500" -  RECONCILIATION TOTAL REQUEST<br>"510" -  RECONCILIATION TOTAL RESPONSE<br>"520" -  RECONCILIATION ADVICE<br>"530" -  RECONCILIATION RESPONSE<br>"600" -  ADMINISTRATIVE REQUEST<br>"610" -  ADMINISTRATIVE RESPONSE<br>"620" -  ADMINISTRATIVE ADVICE<br>"622" -  ADMINISTRATIVE ADVICE RESPONSE'
          type: string
          format: alphanumeric
          example: Authorization
          maxLength: 107
