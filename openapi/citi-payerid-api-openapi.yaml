            been onboarded`<br>`PI1005 - Payer ID XXXXXXXXX could not be
            activated. Please contact your Client Executive`<br>`PI1006 - Payer
            ID XXXXXXXXX is under compliance review and has been temporarily
            deactivated. Please contact your Client Executive for further
            assistance`<br>`PI1007 - Payer ID XXXXXXXXX could not be activated.
            Please contact your Client Executive`<br>`AC04 -
            ClosedAccountNumber`<br>`AC06 - BlockedAccount`<br>`MD07 -
            EndCustomerDeceased`<br>`BLKD - Blocked`<br>`REST - Restricted`
