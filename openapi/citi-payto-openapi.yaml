  /v1/mandates/recall:
    patch:
      summary: Recall Existing Mandate by Initiator
      description: >-
        This endpoint allows the client to request the recall of an existing
        mandate. Initiator client can recall the mandate if the mandate creation
        or mandate amendment is not approved or declined by the payer customer
        within the given stipulated time. Client can define business expiry time
        up to 5 calender days and after which initiator client can recall the
        mandate, if the payer customer did not approve or decline.
      operationId: recallMandate
      parameters:
        - name: client_id
          in: query
          description: >-
            Unique reference which was shared during CitiConnect API onboarding
            (client_id which used during OAuth token generation).
          required: true
          schema:
            type: string
            example: 4683fd9f-03fe-4268-b5da-93bf8203fd91
        - name: mandate_identification
          in: query
          description: >-
            Specify unique identification, as assigned by the clearing scheme,
            to identify the mandate.
          required: true
          schema:
            type: string
            example: CRED9945461615156344324324354
      requestBody:
        description: Recall
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecallMandate'
      callbacks:
        asynchronous-mandaterecall-push-notification:
          $ref: '#/components/callbacks/MandateRecallPushNotification'
      responses:
