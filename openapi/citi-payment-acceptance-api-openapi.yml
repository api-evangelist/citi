        method:
          $ref: '#/components/schemas/Method'
        transaction:
          $ref: '#/components/schemas/Transaction'
        order:
          $ref: '#/components/schemas/Order'
        mandate:
          $ref: '#/components/schemas/Mandate'
        shipping:
          $ref: '#/components/schemas/Shipping'
        authentication:
          $ref: '#/components/schemas/Authentication'
        risk:
          $ref: '#/components/schemas/Risk'
      additionalProperties: false
      description: Payment Request
    Rfp-Receiver-Notification:
      type: object
      title: RFP Receiver Notification
      properties:
        name:
          maxLength: 140
          minLength: 1
          type: string
          description: "Receiver Name \n- For US RFP transaction, this parameter is optional"
          title: name
        address:
          $ref: '#/components/schemas/Address'
        organization_id:
          description: 'Receiver Organization Id/ Legal Entity as provided at the time of payment request.

            - For US RFP max length is 20'
          example: ORG123456
          maxLength: 35
          minLength: 1
          type: string
          title: organization_id
        birth_date:
          type: string
          format: date
          description: "ISO 8601 (YYYY-MM-DD), Receiver's birth_date  \n- For US RFP transaction, this parameter is optional"
          title: birth_date
        birth_city:
          maxLength: 35
          minLength: 1
          type: string
          description: "Receiver's birth_city \n- For US RFP max length is 35"
          title: birth_city
        birth_country:
          type: string
          description: "Receiver's birth_country \n- For US RFP transaction, this parameter is optional"
          pattern: ^[A-Z]{2,2}$
          title: birth_country
        private_id:
          maxLength: 35
          minLength: 1
          type: string
          description: "Receiver's private ID \n- For US RFP transaction, this parameter is optional"
          title: private_id
    Shipping-Address:
      title: Shipping-Address
      type: object
      description: Address
      properties:
        lines:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/Lines'
          title: lines
        street_name:
          maxLength: 70
          minLength: 1
          type: string
          description: Customer Street Name.
          example: Federal Street
          title: street_name
        city:
          maxLength: 100
          minLength: 1
          type: string
          description: Customer city.
          example: Abis Brasil
          title: city
        postal_code:
          maxLength: 16
          minLength: 1
          type: string
          description: Customer postal code.
          example: 69935-000
          title: postal_code
        state:
          maxLength: 50
          minLength: 1
          type: string
          description: Customer state.
