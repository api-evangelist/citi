        description:
          type: string
          maxLength: 256
          description: >-
            Transaction Status, following status you will receive in response 

            - CREATED - The transaction has successfully been created 

            - PENDING - Transaction pending action from customer 

            - AUTHORIZED - Authorization approved 

            - CAPTURED - Transaction fully captured 

            - CAPTURED_PARTIALLY - Transaction partially captured  

            - CANCELLED - Transaction cancelled 

            - DECLINED - Transaction declined by the payment processor 

            - REJECTED - Request rejected after business logic check 

            - SYSTEM_ERROR- Internal system error occurred processing the
            transaction 

            - FAILED - Transaction failed for invalid payload 

            - SETTLED - Transaction settled 

            - SUCCESS - The operation was successfully processed 

            - UNKNOWN - The result of the operation is unknown
          example: Transaction declined by the payment processor
          title: description
        redirect_url:
          type: string
          maxLength: 500
          description: >-
            The URL to which you must redirect the payer's browser to complete
            the payment when using the payment provider's website.
          example: https://greenzone-api.uat.nam.nsroot.net/api/notification
          title: redirect_url
        creation_date_time:
          type: string
          format: date-time
          description: >-
            GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

            - Instant Payment (Debit) - Date time, generated by CitiConnect API,
            when CitiConnect API accepted a payment initiation after validation 

            - Instant Payment (Credit) - Date time, either provided by the
            debtor bank or generated by Citi's transaction processing
            application, when a transaction was created 

            - For ACH PAY and Verify transaction, order.creation_date_time
            parameter is mandatory 

            - For Brazil PIX, this parameter is mandatory
          example: '2022-09-13T08:23:49.114Z'
          title: creation_date_time
        update_time:
          type: string
          format: date-time
          description: >-
            Indicates the date and time the gateway considers the order to have
            last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

            - Instant Payment (Debit) - Date time, generated by CitiConnect API,
            when CitiConnect API accepted a payment initiation after validation 

            - Instant Payment (Credit) - Date time, either provided by the
            debtor bank or generated by Citi's transaction processing
            application, when a transaction was created 

            - For ACH PAY and Verify transaction, order.update_time parameter is
            mandatory
          example: '2022-09-13T08:23:49.114Z'
          title: update_time
        psp_reference:
          type: string
          maxLength: 36
          minLength: 1
          description: >-
            Payment session id generated by Banked (third party system). Will be
            present in case of link creation being successful 
             - For UK PAYBYBANK Creation payment_session_field parameter is mandatory for success link creation.
          example: PAY1234567
          title: psp_reference
        type:
          description: Indicates the type of action performed on the order.
          enum:
            - AUTHENTICATION
            - AUTHORIZATION
            - AUTHORIZATION_UPDATE
            - CAPTURE
            - CHARGEBACK
            - DISBURSEMENT
            - FUNDING
            - PAYMENT
            - REFUND
            - REFUND_REQUEST
            - VERIFICATION
            - VOID_AUTHORIZATION
            - VOID_CAPTURE
            - VOID_PAYMENT
            - VOID_REFUND
          example: VERIFICATION
          type: string
          title: type
        reference:
          description: An optional identifier for this transaction
          example: REPAY789541
          maxLength: 250
          minLength: 1
          type: string
          title: reference
        authorization_code:
          description: >-
            Value generated by the issuing bank in response to a proposal to
            transfer funds
          example: AUTH123456
          maxLength: 100
          minLength: 1
          type: string
          title: authorization_code
        acquirer:
          $ref: '#/components/schemas/Acquirer-Request'
        terminal:
          description: >-
            Identifier used by the acquirer to identify the transaction. This
            identifier may be used by the acquirer in settlement reports.
          example: ACQ7894561
          maxLength: 16
          minLength: 1
          type: string
          title: terminal
        retrieval_reference_number:
          description: >-
            When a transaction registration succeeds, the value of this
            parameter contains the 44-digit number that was used to create the
            bar code on the Boleto slip. This bar code can then be scanned by
            the vendor if a payer elects to pay Boleto at a registered location.
          example: ACQ7894561
          maxLength: 100
          minLength: 1
          type: string
          title: retrieval_reference_number
        reason_code:
          description: >-
            Transaction rejection Code 

            - For Brazil PIX, this parameter is mandatory with max length 4,
            expected values are ACCT, BLCK, CCLD, FAIL, OTHR, SLBD & SLCR
          example: SC0020
          maxLength: 10
          minLength: 1
          type: string
          title: reason_code
        authorization_response:
          $ref: '#/components/schemas/Authorization-Response'
        response:
          $ref: '#/components/schemas/Response'
        receipt:
          description: >-
            When a transaction registration succeeds, the value of this
            parameter contains the 44-digit number that was used to create the
            bar code on the Boleto slip. This bar code can then be scanned by
            the vendor if a payer elects to pay Boleto at a registered location.
          example: MSG12345
          maxLength: 100
          minLength: 1
          type: string
          title: receipt
        additional_response_data:
          description: >-
            A 47-digit number the payer can use to make a Boleto payment.When a
            transaction registration succeeds, the value of this parameter
            contains the 44-digit number that was used to create the bar code on
            the Boleto slip. This bar code can then be scanned by the vendor if
            a payer elects to pay Boleto at a registered location.If the
            transaction registration fails, this parameter contains an error
            code and a description in key-value pair format.
          example: MSG12345
          maxLength: 4000
          minLength: 1
          type: string
          title: additional_response_data
        status_date_time:
          format: date-time
          type: string
          description: >-
            Date & Time when Payer bank provided their response GMT (ISO 8601
            YYYY-MM-DDTHH:MM:SS.sssZ) 

            - This parameter is mandatory for Brazil PIX
          example: '2022-09-13T08:23:49.114Z'
          title: status_date_time
    Refund-Update-Method:
      type: object
      title: Refund-Notification Method
      properties:
        card:
          $ref: '#/components/schemas/Card-Refund-Update-Notification'
        type:
          description: Method specified by the customer for the transaction
          type: string
          enum:
            - CARD
            - GOOGLEPAY
            - APPLEPAY
          example: CARD
          title: type
    Refund-Update-Order:
      type: object
      title: Refund-Notification Order
      properties:
        id:
          description: >-
            A unique identifier for this order to distinguish it from any other
            order you create.
          example: OR123456789
          maxLength: 40
          minLength: 1
          type: string
          title: id
        amount:
          description: The total amount for the order
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        creation_date_time:
          type: string
          format: date-time
          description: >-
            GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

            - Instant Payment (Debit) - Date time, generated by CitiConnect API,
            when CitiConnect API accepted a payment initiation after validation 

            - Instant Payment (Credit) - Date time, either provided by the
            debtor bank or generated by Citi's transaction processing
            application, when a transaction was created
          example: '2022-09-13T08:23:49.114Z'
          title: creation_date_time
        update_time:
          type: string
          format: date-time
          description: >-
            Indicates the date and time the gateway considers the order to have
            last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

            - Instant Payment (Debit) - Date time, generated by CitiConnect API,
            when CitiConnect API accepted a payment initiation after validation 

            - Instant Payment (Credit) - Date time, either provided by the
            debtor bank or generated by Citi's transaction processing
            application, when a transaction was created 
          example: '2022-09-13T08:23:49.114Z'
          title: update_time
        reference:
          description: >-
            An optional identifier for the orderFor example, a shopping cart
            number, an order number, or an invoice number.
          example: REPAY789541
          maxLength: 200
          minLength: 1
          type: string
          title: reference
        invoice_number:
          description: The invoice number you issued for this order
          example: INV789541
          maxLength: 25
          minLength: 1
          type: string
          title: invoice_number
        currency_code:
          description: ISO 4217 Currency Code for instance  USD/GBP/EUR
          enum:
            - USD
          example: USD
          type: string
          title: currency_code
        merchant_amount:
          description: The total amount for the order in order.merchantCurrency units.
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: merchant_amount
        merchant_currency:
          description: ' The currency in which you priced your inventory for this order, expressed as an ISO 4217 alpha codeISO 4217 Currency Code for instance  USD/GBP/EUR '
          enum:
            - USD
          example: USD
          type: string
          title: merchant_currency
        status:
          type: string
          maxLength: 30
          description: >-
            Order Status, following status you will receive in response 

            - AUTHENTICATED - The payer was successfully authenticated. 

            - AUTHENTICATION_INITIATED - Payer authentication has been initiated
            but not completed. 

            - AUTHENTICATION_NOT_NEEDED - Payer authentication was not performed
            as it was not needed. 

            - AUTHENTICATION_UNSUCCESSFUL - Payer authentication was not able to
            be successfully completed. 

            - AUTHORIZED - The payment has been authorized successfully but the
            authorized amount has not yet been captured, in part, full, or
            excess. 

            - CANCELLED - The initial transaction for this order has been voided
            successfully. 

            - CAPTURED - The authorized amount for this order, in full or
            excess, has been captured successfully. 

            - CHARGEBACK_PROCESSED - A Chargeback has been processed against
            this order. 

            - DISPUTED - The payment has been disputed and is under
            investigation. A request for information has been received or a
            chargeback is pending. 

            - EXCESSIVELY_REFUNDED - The payment has been captured in part,
            full, or excess, but the captured amount in excess has been refunded
            successfully. 

            - FAILED - The payment has not been successful. 

            - FUNDING - The order transfers money to or from the merchant,
            without the involvement of a payer. For example, recording monthly
            merchant service fees from the payment service provider. 

            - INITIATED - A browser payment that has successfully been initiated
            for this order. No payment has yet been made. 

            - PARTIALLY_CAPTURED - The authorized amount for this order, in
            part, has been captured successfully. 

            - PARTIALLY_REFUNDED - The payment has been captured in part, full,
            or excess, but the captured amount in part has been refunded
            successfully. 

            - REFUNDED - The payment has been captured in part, full, or excess,
            but the captured amount in full has been refunded successfully. 

            - REFUND_REQUESTED - A refund against captured amounts on this order
            has been requested but not executed. Requires further action to
            approve the refund. 

            - VERIFIED - The card details for this order have successfully been
            verified. No payment has yet been initiated or made. 

            - DISBURSED - The order amount has successfully been disbursed to
            the payer.
          example: AUTHENTICATED
          title: status
        total_auth_amount:
          description: The amount that has been successfully authorized for this order.
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_auth_amount
        total_captured_amount:
          description: The amount that has been successfully captured for this order.
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_captured_amount
        total_disbursed_amount:
          description: 'The amount that has been successfully captured for this order. '
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_disbursed_amount
        total_refunded_amount:
          description: The amount that has been successfully captured for this order.
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_refunded_amount
    Mandate-Inquiry-Response:
      type: array
      items:
        $ref: '#/components/schemas/Mandate-Response'
    Mandate-Response:
      type: object
      title: Mandate Inquiry Notification
      properties:
        mandate:
          $ref: '#/components/schemas/Mandate-Get-Status'
        customer:
          $ref: '#/components/schemas/Customer-Get-Status'
        merchant:
          $ref: '#/components/schemas/Merchant-Get-Status'
        sender:
          $ref: '#/components/schemas/Sender-Get-Status'
    Mandate-Get-Status:
      type: object
      title: Mandate Notification
      properties:
        id:
          description: |-
            Unique Id given during initiation to identify the mandate 
            - This parameter is mandatory for Brazil with max length 29
          minLength: 1
          maxLength: 35
          type: string
          example: RR3347902320251109REF12345678
          title: id
        request_id:
          description: >-
            Unique Id given during initiation to identify request made on the
            mandate 

            - This parameter is mandatory for Brazil with max lenght 29
          minLength: 1
          maxLength: 35
          type: string
          example: SC3347902320251109REF12345678
          title: request_id
        status:
          description: |-
            Mandate Current Status 
            - This parameter is mandatory for Brazil
          type: string
          enum:
            - PENDING_AUTHORIZATION
            - PENDING_ACKNOWLEDGEMENT
            - ACTIVE
            - EXPIRED
            - REJECTED
            - SUSPENDED
            - CANCELLED
          example: ACTIVE
          title: status
        country_code:
          description: |-
            Mandate country 
            - This parameter is mandatory for Brazil
          enum:
            - US
            - BR
            - GB
            - IN
          example: US
          type: string
          title: country_code
        frequency:
          description: >-
            Frequency in which payments are to be processed YEAR = Annual, MNTH
            = Monthly, QURT = Quarterly, MIAN = Semiannual, WEEK = Weekly, DAIL
            = Daily, ADHO = Ad hoc, INDA = Intraday, FRTN = Fortnightly & OOFF =
            One Off 

            - This parameter is mandatory for Brazil
          type: string
          enum:
            - YEAR
            - MNTH
            - QURT
            - MIAN
            - WEEK
            - DAIL
            - ADHO
            - INDA
            - FRTN
            - OOFF
          example: MNTH
          title: frequency
        count_per_period:
          description: >-
            Number of instructions to be created and processed during the
            specified period 

            - This parameter is mandatory for Brazil
          type: number
          minimum: 1
          maximum: 99
          example: 13
          title: count_per_period
        auto_debit:
          description: >-
            Specifies whether the direct debit instructions should be
            automatically re-submitted periodically 

            - This parameter is mandatory for Brazil
          type: boolean
          example: true
          title: auto_debit
        expiry_date_time:
          description: >-
            Date & Time when the mandate request will get expired
            (format-YYYYMMDDYhh:mm:ss.000Z where time should be in UTC) 

            - This is mandatory parameter for Brazil
          type: string
          format: date-time
          example: '2024-04-29T23:59:59.999Z'
          title: expiry_date_time
        start_date:
          description: |-
            Effective start date for the payment in YYYY-MM-DD format 
            - This parameter is mandatory for Brazil
          type: string
          format: date
          example: '2025-12-07'
          title: start_date
        end_date:
          description: |-
            Effective end date for the payment in YYYY-MM-DD format 
            - This parameter is optional for Brazil
          type: string
          format: date
          example: '2025-12-07'
          title: end_date
        nature:
          description: |-
            Mandate nature 
            - This parameter is mandatory for Brazil
          type: string
          enum:
            - ELECTRONIC
            - QRC
            - PAPER
          example: PAPER
          title: nature
        reference_id:
          description: |-
            Reference Id given by merchant such as contract/document number 
            - This parameter is optional for Brazil with max length 35
          minLength: 1
          maxLength: 35
          type: string
          example: 84126/12
          title: reference_id
        additional_info:
          maxLength: 140
          minLength: 1
          type: string
          description: |-
            Additional information provided by payor 
            - This parameter is mandatory for Brazil with max length 35
          example: Mandate Initiated
          title: additional_info
        currency_code:
          description: |-
            Currency Code 
            - This parameter is mandatory for Brazil
          enum:
            - BRL
          example: BRL
          type: string
          title: currency_code
        amount:
          description: >-
            Fixed amount to be collected from the customer's account 

            - This parameter is optional for Brazil with max length 18 digits
            including 2 decimals
          minimum: 0.01
          maximum: 1000000000000000000
          type: number
          example: 1000
          title: amount
        max_amount:
          description: >-
            Max amount to be collected from customer's account 

            - This parameter is optional for Brazil with max length 18 digits
            including 2 decimals
          minimum: 0.01
          maximum: 1000000000000000000
          type: number
          example: 1000
          title: max_amount
        cancellation_requested_by:
          description: |-
            Party who initiated mandate cancelation 
            - This parameter is optional for Brazil with max length 15
          type: string
          maxLength: 35
          minLength: 1
          example: Canberry Inc
          title: cancellation_requested_by
        reason_code:
          description: |-
            Reason Code for rejection/cancellation 
            - This parameter is optional for Brazil with max length 4
          minLength: 1
          maxLength: 35
          type: string
          example: AC01
          title: reason_code
        description:
          description: |-
            Description against the status or/and reason code 
            - This parameter is optional for Brazil with max length 105
          minLength: 1
          maxLength: 105
          type: string
          example: IncorrectAccountNumber
          title: description
        audit_trail:
          description: |-
            Series of events along with date & time stamp on the mandate 
            - This parameter is mandatory for Brazil
          minLength: 1
          maxLength: 105
          type: string
          example: >-
            CRDT2024-04-23T10:00:00.000Z;ACTV2024-04-24T11:30:00.000Z;AMND2024-04-30T11:30:00.000Z
          title: audit_trail
        agreement_number:
          description: |-
            Agreement number between merchant and customer 
            - This parameter is optional for Brazil
          minLength: 1
          maxLength: 60
          type: string
          example: '123456'
          title: agreement_number
        qr_string:
          type: string
          maxLength: 512
          description: |-
            Dynamic QR Code based on the merchant payload request 
            - This parameter is optional for Brazil
          example: >-
            00020101021226700014br.gov.bcb.pix.citi.com.br/qr/2/8b3da2f39a4140d1a91abd93113bd44
            15204000053039865802BR5913Fulano de
            Tal6008BRASILIA62070503***630464E4
          title: qr_string
