        rates:
          - target_currency: USD
            rate: 0.711134
            value_date: '2025-04-26'
    Bad-Request-Gateway-Error-Example:
      value:
        httpCode: '400'
        httpMessage: Bad Request
        moreInformation: please provide valid value for request
    Bad-Request-Example-ClientId-Missing-JSON:
      value:
