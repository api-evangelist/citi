components:
  schemas:
    MandateClientDetails:
      title: MandateClientDetails
      type: object
      required:
        - mandate_details
      properties:
        mandate_details:
          $ref: '#/components/schemas/MandateDetails'
        initiating_party:
          $ref: '#/components/schemas/InitiatingParty'
        debtor:
          $ref: '#/components/schemas/Debtor'
        creditor:
          $ref: '#/components/schemas/Creditor'
        ultimate:
          $ref: '#/components/schemas/Ultimate'
    RecallMandate:
      title: RecallMandate
      type: object
      required:
        - action_id
        - country
      properties:
        action_id:
          title: action_id
          type: string
          description: Specifies identifier for the action recall mandate
          example: 76660ee1768511eb9138ca37071a0b1e
          pattern: ^[a-f0-9]{12}1[a-f0-9]{3}[89ab][a-f0-9]{15}$
        country:
          title: country
          type: string
          pattern: ^[A-Z]{2}$
          description: >-
            Specify the country code where the mandate request
            originated.<br>Australia = AU<br>Hongkong = HK<br>Argentina =
            AR<br>SEPA = UK
          example: AU
    AmendMandateDetails:
      title: AmendMandateDetails
      type: object
      required:
        - amend_details
        - amendment_mandate_details
      properties:
        amend_details:
          $ref: '#/components/schemas/AmendDetails'
        amendment_mandate_details:
          $ref: '#/components/schemas/AmendmentMandateDetails'
        amendment_initiating_party:
          $ref: '#/components/schemas/AmendmentInitiatingParty'
        amendment_creditor:
          $ref: '#/components/schemas/AmendmentCreditor'
        amendment_ultimate:
          $ref: '#/components/schemas/AmendmentUltimate'
    UpdateMandateDetails:
      title: UpdateMandateDetails
      type: object
      required:
        - status_request
        - request_reason
        - mandate_status_update
      properties:
        status_request:
          $ref: '#/components/schemas/StatusRequest'
        request_reason:
          $ref: '#/components/schemas/RequestReason'
        mandate_status_update:
          $ref: '#/components/schemas/MandateStatusUpdate'
    StatusRequest:
      title: StatusRequest
      type: object
      required:
        - change
      properties:
        change:
          title: change
          type: string
          enum:
            - CANC
            - SUSP
            - RELS
          description: >-
            Specify the status request type <br> - CANC = Cancelled (Cancel a
            mandate) <br> - SUSP = Suspended (Suspend an active mandate) <br> -
            RELS = Release (Release a suspended mandate)
          example: CANC
    RequestReason:
      title: RequestReason
      type: object
      required:
        - code
      properties:
        code:
          title: code
          type: string
          enum:
            - MD16
            - MD17
            - MD18
            - MD19
            - MD20
            - MD21
            - MD22
            - MS02
            - MS03
            - NARR
            - CTAM
            - CTCA
            - CTEX
            - MCFC
            - MCOC
            - MSUC
          description: >-
            Specification of request reason <br>MD16-Requested By Customer <br>
            MD17-Requested By Initiating Party <br>MD18-Requested By Initiating
            Party And Customer <br> MD19-Mandate Cancelled Due To Early
            Settlement <br>MD20-Mandate Expired <br> MD21-Mandate Cancelled Due
            To Fraud <br> MD22-Mandate Initiation Cancelled <br> MS02-Not
            Specified Reason Customer <br> MS03-Not Specified Reason Agent
            Generated <br> CTAM-Mandate suspended due to amendment of the
            contract <br> CTCA-Mandate suspended due to cancellation of the
            contract, requested by the debtor <br> CTEX-Mandate suspended due to
            the contract that expired <br> MCFC-Mandate suspended as final
            collection took place <br> MCOC-Mandate suspended as the once off
            collection took place <br> MSUC-Mandate suspended after 7
            consecutive unsuccessful collections <br> NARR- Reason is provided
            as narrative information
        additional_information:
          title: additional_information
          type: string
          minLength: 1
          maxLength: 105
          description: If code is NARR, this parameter is mandatory
          example: Requested by Customer
    MandateStatusUpdate:
      title: MandateStatusUpdate
      type: object
      required:
        - country
      properties:
        country:
          title: country
          type: string
          pattern: ^[A-Z]{2}$
          description: >-
            Specify the country code where the mandate request has been
            originated.<br>Australia = AU<br>Hongkong = HK<br>Argentina =
            AR<br>SEPA = UK
          example: AU
    AmendDetails:
      title: AmendDetails
      type: object
      required:
        - amend_reason
      properties:
        amend_reason:
          title: amend_reason
          type: string
          enum:
            - MD16
            - MD17
            - MD18
            - MS02
            - MS03
            - NARR
          description: >-
            Specification of amendment reason <br> MD16-Requested By Customer
            <br> MD17-Requested By Initiating Party<br> MD18-Requested By
            Initiating Party And Customer<br>MS02-Not Specified Reason
            Customer<br>MS03-Not Specified Reason Agent Generated <br>
            MSUC-Mandate suspended after 7 consecutive unsuccessful collections
            <br> NARR- Reason is provided as narrative information
        amend_additional_information:
          title: amend_additional_information
          type: string
          description: Specification of amendment additional information
          example: Requested by Customer
    MandateDetails:
      title: MandateDetails
      type: object
      required:
        - country
        - sequence_type
        - payment_frequency
        - tracking_indicator
        - mandate_start_date
      properties:
        becs_user_identification:
          title: becs_user_identification
          type: string
          minLength: 1
          maxLength: 35
          description: >-
            BECS user ID related to migrated DDR mandate. This parameter is
            conditional to Australia if mandate_scheme is MGCR.
          example: '123456'
        country:
          title: country
          type: string
          pattern: ^[A-Z]{2}$
          description: >-
            Specify the country code where the mandate request has been
            originated.<br>Australia = AU<br>Hongkong = HK<br>Argentina =
            AR<br>SEPA = UK
          example: AU
        mandate_description:
          title: mandate_description
          type: string
          minLength: 1
          maxLength: 140
          description: >-
            Specify the description of the reason for mandate setup as narrative
            text.<br> This parameter is specific to Australia. Both
            mandate_description and mandate_additional_ information parameters
            are expected to be sent by client for Australia. This parameter is
            eligible to be amended unilaterally.
          example: DESCRIPTION OF THE MANDATE
        sequence_type:
          title: sequence_type
          type: string
          enum:
            - RCUR
            - OOFF
          description: >-
            Specify the underlying transaction sequence as either recurring or
            one-off.<br> Only RCUR applicable for AU.
          example: RCUR
        payment_frequency:
          title: payment_frequency
          type: string
          enum:
            - ADHO
            - DAIL
