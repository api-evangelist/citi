openapi: 3.0.0
info:
  description: Virtual Card Create Notification request.
  version: 1.0.0
  title: VCA Life Cycle Webhook Client Notification
servers:
  - url: /
    description: Default server
security:
  - OAuth2:
      - read
      - write
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://tts.apib2b.citi.com/tts/api/v1/oauth2/authorize
          tokenUrl: https://tts.apib2b.citi.com/tts/api/v1/oauth2/token
          scopes:
            read: Grants read access
            write: Grants write access
            admin: Grants read and write access to administrative information
  schemas:
    ErrorMessage:
      type: object
      properties:
        errorCode:
          type: string
          enum:
            - EVB0401
            - EVB0404
            - EVB0430
            - EVB0431
            - EVB0432
            - EVB0435
            - EVB0436
            - EVB0437
            - EVB0438
            - EVB0406
            - EVB0440
            - EVB0441
            - EVB0442
            - EVB0443
            - EVB0427
            - EVB0445
            - EVB0446
            - EVB0447
            - EVB0448
            - EVB0449
            - EVB0450
            - EVB0452
            - EVB0453
            - EVB0454
            - EVB0455
            - EVB0456
            - EVB0457
            - EVB0426
            - EVB0459
            - EVB0460
            - EVB0461
            - EVB0462
            - EVB0444
            - EVB0465
            - EVB0466
            - EVB0468
            - EVB0469
            - EVB0470
            - EVB0471
            - EVB0472
            - EVB0473
            - EVB0474
            - EVB0475
            - EVB0476
            - EVB0477
            - EVB0478
            - EVB0479
            - EVB0032
            - EVB0033
            - EVB0041
            - EVB0042
            - EVB0053
            - EVB0061
            - EVB0062
            - EVB0063
            - EVB0065
            - EVB0071
            - EVB0099
            - EVB0106
            - EVB0107
            - EVB0110
            - EVB0112
            - EVB0113
            - EVB0114
            - EVB0120
            - EVB0121
            - EVB0125
            - EVB0126
            - EVB0136
            - EVB0137
            - EVB0140
            - EVB0163
            - EVB0170
            - EVB0215
            - EVB0217
            - EVB0218
            - EVB0219
            - EVB0222
            - EVB0224
            - EVB0231
            - EVB0232
            - EVB0233
            - EVB0235
            - EVB0236
            - EVB0237
            - EVB0238
