              - NOK
              - SEK
              - PLN
              - IDR
              - MYR
              - THB
              - CHF
              - PHP
              - CZK
              example: BRL
              type: string
              title: currency_code
            product_info:
              type: array
              items:
                $ref: '#/components/schemas/Product-Info'
            expiry_time:
              description: Expiration time for QR collection, specified in seconds.
              example: 3600
              format: int32
              minimum: 10
              type: integer
              title: expiry_time
            status:
              type: string
              maxLength: 20
              description: "Transaction Status, following status you will receive in response \n- CREATED - The transaction has successfully been created \n- PENDING - Transaction pending action from customer \n- AUTHORIZED - Authorization approved \n- CAPTURED - Transaction fully captured \n- CAPTURED_PARTIALLY - Transaction partially captured \n- CANCELLED - Transaction cancelled \n- DECLINED - Transaction declined by the payment processor \n- REJECTED - Request rejected after business logic check \n- SYSTEM_ERROR- Internal system error occurred processing the transaction \n- FAILED - Transaction failed for invalid payload \n- SETTLED - Transaction settled \n- SUCCESS - The operation was successfully processed \n- UNKNOWN - The result of the operation is unknown"
              example: SUCCESS
              title: status
            description:
              type: string
              maxLength: 256
              description: "Transaction Status, following status you will receive in response \n- CREATED - The transaction has successfully been created \n- PENDING - Transaction pending action from customer \n- AUTHORIZED - Authorization approved \n- CAPTURED - Transaction fully captured \n- CAPTURED_PARTIALLY - Transaction partially captured  \n- CANCELLED - Transaction cancelled \n- DECLINED - Transaction declined by the payment processor \n- REJECTED - Request rejected after business logic check \n- SYSTEM_ERROR- Internal system error occurred processing the transaction \n- FAILED - Transaction failed for invalid payload \n- SETTLED - Transaction settled \n- SUCCESS - The operation was successfully processed \n- UNKNOWN - The result of the operation is unknown"
              example: Transaction declined by the payment processor
              title: description
            redirect_url:
              type: string
              maxLength: 500
              description: The URL to which you must redirect the payer's browser to complete the payment when using the payment provider's website.
              example: https://greenzone-api.uat.nam.nsroot.net/api/notification
              title: redirect_url
            creation_date_time:
              type: string
              format: date-time
              description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment (Debit) - Date time, generated by CitiConnect API, when CitiConnect API accepted a payment initiation after validation \n- Instant Payment (Credit) - Date time, either provided by the debtor bank or generated by Citi's transaction processing application, when a transaction was created \n- For ACH PAY and Verify transaction, order.creation_date_time parameter is mandatory \n- For Brazil PIX, this parameter is mandatory"
              example: '2022-09-13T08:23:49.114Z'
              title: creation_date_time
            update_time:
              type: string
              format: date-time
              description: "Indicates the date and time the gateway considers the order to have last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment (Debit) - Date time, generated by CitiConnect API, when CitiConnect API accepted a payment initiation after validation \n- Instant Payment (Credit) - Date time, either provided by the debtor bank or generated by Citi's transaction processing application, when a transaction was created \n- For ACH PAY and Verify transaction, order.update_time parameter is mandatory"
              example: '2022-09-13T08:23:49.114Z'
              title: update_time
            psp_reference:
              type: string
              maxLength: 36
              minLength: 1
              description: "Payment session id generated by Banked (third party system). Will be present in case of link creation being successful \n - For UK PAYBYBANK Creation payment_session_field parameter is mandatory for success link creation."
              example: PAY1234567
              title: psp_reference
            type:
              description: Indicates the type of action performed on the order.
              enum:
              - AUTHENTICATION
              - AUTHORIZATION
              - AUTHORIZATION_UPDATE
              - CAPTURE
              - CHARGEBACK
              - DISBURSEMENT
              - FUNDING
              - PAYMENT
              - REFUND
              - REFUND_REQUEST
              - VERIFICATION
              - VOID_AUTHORIZATION
              - VOID_CAPTURE
              - VOID_PAYMENT
              - VOID_REFUND
              example: VERIFICATION
              type: string
              title: type
            reference:
              description: An optional identifier for this transaction
              example: REPAY789541
              maxLength: 250
              minLength: 1
              type: string
              title: reference
            authorization_code:
              description: Value generated by the issuing bank in response to a proposal to transfer funds
              example: AUTH123456
              maxLength: 100
              minLength: 1
              type: string
              title: authorization_code
            acquirer:
              $ref: '#/components/schemas/Acquirer-Request'
            terminal:
              description: Identifier used by the acquirer to identify the transaction. This identifier may be used by the acquirer in settlement reports.
              example: ACQ7894561
              maxLength: 16
              minLength: 1
              type: string
              title: terminal
            retrieval_reference_number:
              description: When a transaction registration succeeds, the value of this parameter contains the 44-digit number that was used to create the bar code on the Boleto slip. This bar code can then be scanned by the vendor if a payer elects to pay Boleto at a registered location.
              example: ACQ7894561
              maxLength: 100
              minLength: 1
              type: string
              title: retrieval_reference_number
            reason_code:
              description: "Transaction rejection Code \n- For Brazil PIX, this parameter is mandatory with max length 4, expected values are ACCT, BLCK, CCLD, FAIL, OTHR, SLBD & SLCR"
              example: SC0020
              maxLength: 10
              minLength: 1
              type: string
              title: reason_code
            authorization_response:
              $ref: '#/components/schemas/Authorization-Response'
            response:
              $ref: '#/components/schemas/Response'
            receipt:
              description: When a transaction registration succeeds, the value of this parameter contains the 44-digit number that was used to create the bar code on the Boleto slip. This bar code can then be scanned by the vendor if a payer elects to pay Boleto at a registered location.
              example: MSG12345
              maxLength: 100
              minLength: 1
              type: string
              title: receipt
            additional_response_data:
              description: A 47-digit number the payer can use to make a Boleto payment.When a transaction registration succeeds, the value of this parameter contains the 44-digit number that was used to create the bar code on the Boleto slip. This bar code can then be scanned by the vendor if a payer elects to pay Boleto at a registered location.If the transaction registration fails, this parameter contains an error code and a description in key-value pair format.
              example: MSG12345
              maxLength: 4000
              minLength: 1
              type: string
              title: additional_response_data
            status_date_time:
              format: date-time
              type: string
              description: "Date & Time when Payer bank provided their response GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- This parameter is mandatory for Brazil PIX"
              example: '2022-09-13T08:23:49.114Z'
              title: status_date_time
        method:
          type: object
          title: Payment Notification Method
          properties:
            card:
              $ref: '#/components/schemas/Card-Response'
            paypal:
              $ref: '#/components/schemas/Paypal-Response'
            type:
