        Coded information related to the processing of the payment instruction,
        provided by the initiating party, and intended for the creditor's
        agent.<br><br><b>CHQB</b> : (Ultimate) creditor must be paid by cheque.
        <br><br><b>HOLD</b> : Amount of money must be held for the (ultimate)
        creditor, who will call. Pay on identification. <br><br><b>PHOB</b> :
