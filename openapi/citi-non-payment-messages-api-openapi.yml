    Message-Transaction-Request-For-Payment:
      type: object
      title: MessageTransactionRequestForPayment
      required:
      - uetr
      - type
      - instructed_amount
      - creation_date_time
      - settlement_currency
      - payment_information_id
      - end_to_end_id
      - category
      properties:
        end_to_end_id:
          maxLength: 35
          minLength: 1
          type: string
          description: Client provided reference number
          title: end_to_end_id
        instruction_id:
          type: string
          maxLength: 35
          minLength: 1
          description: Instruction Id
          title: instruction_id
        payment_information_id:
          type: string
          maxLength: 35
          minLength: 1
          description: Payment Information ID
          title: payment_information_id
        uetr:
          type: string
          pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          description: UUID v4 format unique end-to-end transaction reference
          title: uetr
        type:
          type: string
          description: Transaction Type - Debit or Credit
          enum:
          - credit
          - debit
          title: type
        local_reference:
          maxLength: 35
          minLength: 1
          type: string
          description: This is a Citi generated payment reference which is included in the ‘Bank Reference’ field of bank statement posting for itemized transaction
          title: local_reference
        creation_date_time:
          type: string
          format: date-time
          description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment (Debit) - Date time, generated by CitiConnect API, when CitiConnect API accepted a payment initiation after validation \n- Instant Payment (Credit) - Date time, either provided by the debtor bank or generated by Citi's transaction processing application, when a transaction was created"
          title: creation_date_time
        instructed_amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000
          description: Amount instructed by client for a transaction
          title: instructed_amount
        settlement_currency:
          maxLength: 3
          type: string
          description: ISO 4217 code for the transaction settlement amount currency
          title: settlement_currency
        unstructured_remittance_info:
          type: array
          description: "Unstructured remitance information \n - For US transaction.unstructured_remittance_info field maximum length is 140 and unlimited line is allowed"
          items:
            $ref: '#/components/schemas/Unstructured'
          title: unstructured_remittance_info
        category:
          type: string
          description: Specifies the high level purpose of the instruction
          enum:
          - BUSINESS
          - CONSUMER
          title: category
        requested_execution_date:
          type: string
          format: date
          description: "Requested Execution Date Format is YYYY-MM-DD. \n- Either Requested Execution Date or Requested Execution Date Time must be present"
          title: requested_execution_date
        requested_execution_date_time:
          type: string
          format: date-time
          description: "Requested Execution Date/Time UTC (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n - \n- Either Requested Execution Date or Requested Execution Date Time must be present"
          title: requested_execution_date_time
        expiry_date:
          type: string
          format: date
          description: "Expiry Date Format is YYYY-MM-DD \n - Either Expiry Date or Expiry Date Time must be present"
          title: expiry_date
        expiry_date_time:
          type: string
          format: date-time
          description: "Expiry Date/Time GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n - Either Expiry Date or Expiry Date Time must be present"
          title: expiry_date_time
        amt_mod_allowed:
          type: boolean
          default: true
          description: "Indicator by customer if the debtor (RFP recipient) can modify over/under the instructed amount \n - true - Amount may be modified by the Debtor \n-  false - Amount of payment must equal the Instructed Amount"
          title: amt_mod_allowed
        full_amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000
          description: "Amount that is the gross amount payable by client \n- If populated, message.transaction.discount_amount must also be populated"
          title: full_amount
        discount_amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000
          description: "Amount that is the discount from the gross amount \n- If populated, message.transaction.full_amount must also be popluated"
          title: discount_amount
        purpose:
          type: string
          minLength: 1
          maxLength: 5
          description: "Purpose of a transaction \n- GDDS for payment related to purchase or sale of goods \n- SCVE for payment related to purchase or sale of services \n- PAYR for payroll payment \n- NOWS for Not Otherwise Specified \n- INVS for Invoice Signed \n- INSC for Payment Of Insurance Claim \n- INSM for Installment \n- PDEP for Property Deposit \n- UBIL for Utilities Subscription Identification \n- ACCT for Account Management \n- CBLK for Bulk card transactions \n- MP2P for Mobile P2P Payment "
          title: purpose
        status:
          type: object
          title: status
          properties:
            date_time:
              type: string
              format: date-time
              description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Date time of transaction status"
              title: date_time
            code:
              type: string
              description: ISO 20022 message status code
              enum:
              - PRES
              - ACSP
              - ACCC
              - RJCT
              title: code
            description:
              type: string
              description: "Status code description \n- RJCT - Rejected \n- PRES - Request For Payment has been presented to the Debtor \n- ACSP- Accepted Settlement In Process \n- ACCC - Accepted Settlement Completed"
              minLength: 1
              maxLength: 256
              title: description
          required:
          - date_time
          - code
          - description
        reasons:
          type: object
          title: reasons
          readOnly: true
          properties:
            code:
              type: string
              description: Reason code (applicable when message is rejected)
              maxLength: 4
              title: code
            description:
              type: string
              description: Reason code description (e.g., Debtor account is invalid.)
              minLength: 1
              maxLength: 256
              title: description
            isproprietary:
              type: integer
              description: "Flag to indicate the Rejection code is ISO Standard or Proprietary \n- 0 For ISO Code \n- 1 For Proprietary"
              enum:
              - 0
              - 1
              title: isproprietary
