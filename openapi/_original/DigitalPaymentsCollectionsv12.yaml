            token_id:
              description: >-
                Token_number. 

                - For India card transaction, method.card.token_number parameter
                is mandatory when token number is provided and allowed maximum
                length is 50.
              example: PA123456789
              maxLength: 50
              minLength: 1
              type: string
              title: token_number
            session_id:
              description: Session identification number
              type: string
              minLength: 36
              maxLength: 37
              example: SES1234567890123456789012345678
              title: session_id
        order:
          type: object
          title: Payment-Notification Order
          properties:
            id:
              description: >-
                A unique identifier for this order to distinguish it from any
                other order you create. 

                - For CARD Authorize, Capture, Pay and Verify operation order.id
                parameter is mandatory 

                - For ACH Pay and Verify transaction order.id parameter is
                mandatory
              example: OR123456789
              maxLength: 40
              minLength: 1
              type: string
              title: id
            amount:
              description: >-
                The total amount for the order 

                - For CARD Authorize operation order.amount parameter is
                mandatory 

                - For CARD Capture operation order.amount parameter is
                mandatory 

                - For CARD Pay operation order.amount parameter is mandatory 

                - For CARD Verify operation order.amount parameter is mandatory
                and allowed maximum amount is 2 

                - For ACH PAY and Verify transaction, order.amount parameter is
                mandatory
              example: 200
              maximum: 1000000000000000000
              minimum: 0.01
              type: number
              title: amount
            creation_date_time:
              type: string
              format: date-time
              description: >-
                GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

                - Instant Payment (Debit) - Date time, generated by CitiConnect
                API, when CitiConnect API accepted a payment initiation after
                validation 

                - Instant Payment (Credit) - Date time, either provided by the
                debtor bank or generated by Citi's transaction processing
                application, when a transaction was created 

                - For ACH PAY and Verify transaction, order.creation_date_time
                parameter is mandatory
              example: '2022-09-13T08:23:49.114Z'
              title: creation_date_time
            update_time:
              type: string
              format: date-time
              description: >-
                Indicates the date and time the gateway considers the order to
                have last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

                - Instant Payment (Debit) - Date time, generated by CitiConnect
                API, when CitiConnect API accepted a payment initiation after
                validation 

                - Instant Payment (Credit) - Date time, either provided by the
                debtor bank or generated by Citi's transaction processing
                application, when a transaction was created 

                - For ACH PAY and Verify transaction, order.last_update_time
                parameter is mandatory
              example: '2022-09-13T08:23:49.114Z'
              title: update_time
            reference:
              description: >-
                An optional identifier for the orderFor example, a shopping cart
                number, an order number, or an invoice number.
              example: REPAY789541
              maxLength: 200
              minLength: 1
              type: string
              title: reference
            invoice_number:
              description: The invoice number you issued for this order
              example: INV789541
              maxLength: 25
              minLength: 1
              type: string
              title: invoice_number
            currency_code:
              description: >-
                ISO 4217 Currency Code for instance  USD/GBP/EUR 

                - order.currency_code parameter is mandatory for all transaction
                type creation
              enum:
                - BRL
                - USD
                - GBP
                - INR
                - EUR
                - CAD
                - HKD
                - AUD
                - SGD
                - DKK
                - NOK
                - SEK
                - PLN
                - IDR
                - MYR
                - THB
                - CHF
                - PHP
                - CZK
              example: BRL
              type: string
              title: currency_code
            merchant_amount:
              description: >-
                The total amount for the order in order.merchantCurrency units. 

                - For CARD Authorize operation order.merchant_amount parameter
                is mandatory 

                - For CARD Capture operation order.merchant_amount parameter is
                mandatory 

                - For CARD Pay operation order.merchant_amount parameter is
                mandatory 

                - For CARD Verify operation order.merchant_amount parameter is
                mandatory
              example: 200
              maximum: 1000000000000000000
              minimum: 0.01
              type: number
              title: merchant_amount
            merchant_currency:
              description: >2-
                 The currency in which you priced your inventory for this order, expressed as an ISO 4217 alpha codeISO 4217 Currency Code for instance  USD/GBP/EUR 
                - order.merchant_currency parameter is mandatory for all
                transaction type creation
              enum:
                - BRL
                - USD
                - INR
              example: BRL
              type: string
              title: merchant_currency
            status:
              type: string
              maxLength: 30
              description: >-
                Order Status, following status you will receive in response 

                - AUTHENTICATED - The payer was successfully authenticated. 

                - AUTHENTICATION_INITIATED - Payer authentication has been
                initiated but not completed. 

                - AUTHENTICATION_NOT_NEEDED - Payer authentication was not
                performed as it was not needed. 

                - AUTHENTICATION_UNSUCCESSFUL - Payer authentication was not
                able to be successfully completed. 

                - AUTHORIZED - The payment has been authorized successfully but
                the authorized amount has not yet been captured, in part, full,
                or excess. 

                - CANCELLED - The initial transaction for this order has been
                voided successfully. 

                - CAPTURED - The authorized amount for this order, in full or
                excess, has been captured successfully. 

                - CHARGEBACK_PROCESSED - A Chargeback has been processed against
                this order. 

                - DISPUTED - The payment has been disputed and is under
                investigation. A request for information has been received or a
                chargeback is pending. 

                - EXCESSIVELY_REFUNDED - The payment has been captured in part,
                full, or excess, but the captured amount in excess has been
                refunded successfully. 

                - FAILED - The payment has not been successful. 

                - FUNDING - The order transfers money to or from the merchant,
                without the involvement of a payer. For example, recording
                monthly merchant service fees from the payment service
                provider. 

                - INITIATED - A browser payment that has successfully been
                initiated for this order. No payment has yet been made. 

                - PARTIALLY_CAPTURED - The authorized amount for this order, in
                part, has been captured successfully. 

                - PARTIALLY_REFUNDED - The payment has been captured in part,
                full, or excess, but the captured amount in part has been
                refunded successfully. 

                - REFUNDED - The payment has been captured in part, full, or
                excess, but the captured amount in full has been refunded
                successfully. 

                - REFUND_REQUESTED - A refund against captured amounts on this
                order has been requested but not executed. Requires further
                action to approve the refund. 

                - VERIFIED - The card details for this order have successfully
                been verified. No payment has yet been initiated or made. 

                - DISBURSED - The order amount has successfully been disbursed
                to the payer.
              example: AUTHENTICATED
              title: status
            total_auth_amount:
              description: >-
                The amount that has been successfully authorized for this
                order. 

                - For CARD Authorize operation order.total_auth_amount parameter
                is mandatory 

                - For CARD Capture operation order.total_auth_amount parameter
                is mandatory 

                - For CARD Pay operation order.total_auth_amount parameter is
                mandatory 

                - For CARD Verify operation order.total_auth_amount parameter is
                mandatory
              example: 200
              maximum: 1000000000000000000
              minimum: 0.01
              type: number
              title: total_auth_amount
            total_captured_amount:
              description: >-
                The amount that has been successfully captured for this order. 

                - For CARD Authorize operation order.total_captured_amount
                parameter is mandatory 

                - For CARD Capture operation order.total_captured_amount
                parameter is mandatory 

                - For CARD Pay operation order.total_captured_amount parameter
                is mandatory 

                - For CARD Verify operation order.total_captured_amount
                parameter is mandatory
              example: 200
              maximum: 1000000000000000000
              minimum: 0.01
              type: number
              title: total_captured_amount
            total_disbursed_amount:
              description: >-
                The amount that has been successfully captured for this order. 

                - For CARD Authorize operation order.total_disbursed_amount
                parameter is mandatory 

                - For CARD Capture operation order.total_disbursed_amount
                parameter is mandatory 

                - For CARD Pay operation order.total_disbursed_amount parameter
                is mandatory 

                - For CARD Verify operation order.total_disbursed_amount
                parameter is mandatory
              example: 200
              maximum: 1000000000000000000
              minimum: 0.01
              type: number
              title: total_disbursed_amount
            total_refunded_amount:
              description: >-
                The amount that has been successfully captured for this order. 

                - For CARD Authorize operation order.total_refunded_amount
                parameter is mandatory 

                - For CARD Capture operation order.total_refunded_amount
                parameter is mandatory 

                - For CARD Pay operation order.total_refunded_amount parameter
                is mandatory 

                - For CARD Verify operation order.total_refunded_amount
                parameter is mandatory
              example: 200
              maximum: 1000000000000000000
              minimum: 0.01
              type: number
              title: total_refunded_amount
            item_amount:
              description: >-
                The total item amount for the order.If you do not provide this
                value but provide line item data, then this amount is calculated
                as the sum of the item.quantity times the item.unitPrice for all
                the line items (total item amount).If you provide both this
                value and line item data, then the order.itemAmount MUST equal
                the total item amount.
              example: '100.00'
              maxLength: 14
              minLength: 1
              type: string
              title: item_amount
        merchant:
          type: object
          title: Payment-Notification Merchant
          properties:
            account:
              title: merchant account
              description: Account Details
              properties:
                bank_id:
                  maxLength: 35
                  minLength: 1
                  type: string
                  description: >-
                    Customer bank's network identification 

                    - For Brazil PIX, this parameter is mandatory with max
                    length 8
                  example: CITIIN77
                  title: bank_id
        mandate:
          type: object
          title: Payment-Notification Mandate
          properties:
            id:
              description: |-
                Unique Id given during initiation to identify the mandate 
                - This parameter is mandatory for Brazil with max length 29
              minLength: 1
              maxLength: 35
              type: string
              example: RR3347902320251109REF12345678
              title: id
        shipping:
          $ref: '#/components/schemas/Shipping'
    Authentication-Response:
      type: object
      title: Authentication Response
      required:
        - method
        - transaction
        - order
        - authentication
