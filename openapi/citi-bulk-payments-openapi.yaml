  callbacks:
    Bulk-Notification:
      /bulk-notification:
        post:
          description: >-
            Bulk notification containing status updates of all the transactions
            in a bulk request will be shared. The total number of transactions
            in bulk notification will always match with the request. EndtoEndId
            for each individual transaction in a bulk request will be provided
            in the bulk notification with the corresponding status. The
            transactions will be categorized together at a status level. For
            transactions in RJCT status, corresponding reason code and
            additional information for rejection will be shared.
          parameters:
            - $ref: '#/components/parameters/Event-Type'
            - $ref: '#/components/parameters/Event-Name'
          requestBody:
            content:
              application/xml:
                schema:
                  $ref: '#/components/schemas/DocumentRes'
                examples:
                  Bulk-Notification-Example:
                    $ref: '#/components/examples/Bulk-Notification-Example'
          responses:
            '202':
              description: Accepted
