openapi: 3.2.0
info:
  title: Citi Emandateservices API
  version: '1.0'
  description: 'Operations tagged Emandateservices across 2 of this provider''s published API definitions: citi-e-mandate-api-v1-openapi.yaml, citi-e-mandate-api-v2-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://tts.apib2b.citi.com/citiconnect/prod
tags:
- name: Emandateservices
paths:
  /emandateservices/v1/emandateinitiation:
    post:
      summary: Initiate An eMandate
      description: 'The eMandate Initiation API is sent by an initiating party (Creditor) to the receiving party (Debtor) in the collection chain to register an eMandate. Citi Connect API clients can initiate eMandate Initiation for the direct debit collections.


        payloadType :Currently Citi supports only “urn:iso:std:iso:20022:tech:xsd: pain.009.001.06”'
      operationId: EmandateServicesInitiationOperation
      parameters:
      - name: client_id
        in: query
        required: true
        description: This is your unique identifier shared during your CitiConnect API onboarding. This is the same `client_id` used for oauth token generation
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Supports "application/xml"
        required: true
        schema:
          type: string
      - name: payloadType
        in: header
        description: Supports urn:iso:std:iso:20022:tech:xsd:pain.009.001.06
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: The OAuth Token prefixed with "Bearer" and space in between.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK. Success.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Document'
              example:
                MndtAccptncRpt:
                  GrpHdr:
                    MsgId: CITIBANK/20200803-PSR/1100977414
                    CreDtTm: '2020-08-03T04:31:20'
                  UndrlygAccptncDtls:
                    OrgnlMsgInf:
                      MsgId: citiconnect api mandate062303
                      MsgNmId: pain.009.001.06
                      CreDtTm: '2001-12-31T12:00:00'
                    AccptncRslt:
                      Accptd: 'false'
                      RjctRsn:
                        Prtry: PDNG
                    OrgnlMndt:
                      OrgnlMndt:
                        MndtId: Not Available
                        MndtReqId: userguide03082001
                        Tp:
                          LclInstrm:
                            Cd: DDMU
                        TrckgInd: 'false'
                        Cdtr:
                          Nm: Citiconnect tester
                        CdtrAcct:
                          Id:
                            Othr:
                              Id: '1192834003'
                        CdtrAgt:
                          FinInstnId:
                            ClrSysMmbId:
                              MmbId: '12345'
                        Dbtr:
                          Nm: payer name
                        DbtrAcct:
                          Id:
                            Othr:
                              Id: '10897933748'
                        DbtrAgt:
                          FinInstnId:
                            ClrSysMmbId:
                              MmbId: '147992'
                        MndtRef: 4FDD231247EA44BA85FA67FEC1024A6F
                        RfrdDoc:
                          CdtrRef: payer ref name
        '400':
          description: Bad Request. Please try with Valid Request
        '401':
          description: The request is Unauthorized. Please try again with valid credentials.
        '405':
          description: Method Not Allowed. Please try with Valid HTTP Verb.
        '415':
          description: Unsupported Media Type. Resend the request with valid content-type
        '500':
          description: Internal Server Error. Check the service of API.
        '503':
          description: Service Unavailable. Please try again later/ after some time
        '504':
          description: GatewayTimeout. Look for server connectivity issues.
      security:
      - clientCredentials: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/MandateInitiationRequest'
        required: true
      tags:
      - Emandateservices
    servers:
    - url: https://tts.apib2b.citi.com/citiconnect/prod
  /emandateservices/v1/emandatestatusinquiry:
    get:
      summary: Get The Status Of An eMandate
      description: The eMandate Status Inquiry API allows you to access the status of your eMandate and generates eMandate details with the status of the eMandatetransaction.
      operationId: EmandateServicesStatusInquiryOperation
      parameters:
      - name: client_id
        in: query
        required: true
        description: This is your unique identifier shared during your CitiConnect API onboarding. This is the same `client_id` used for oauth token generation
        schema:
          type: string
      - name: Accept
        in: header
        description: Supports "application/xml"
        required: true
        schema:
          type: string
      - name: x-citi-enc-type
        in: header
        description: xmlenc
        required: true
        schema:
          type: string
      - name: mndtReqId
        in: header
        description: Unique identification assigned by the initiating party to clearlyidentify the transaction. This Identification is passed on, unchanged,throughout the entire end-to-end chain
        required: false
        schema:
          type: string
      - name: mndtId
        in: header
        description: Unique identification assigned by an institution to clearly identify the transaction.
        required: false
        schema:
          type: string
      - name: payerRefNm
        in: header
        description: Identification assigned by the initiating party to clearly identify the purpose of transaction.
        required: false
        schema:
          type: string
      - name: creationDate
        in: header
        description: Date when mandate is initiated (MM-DD-yyyy).
        required: false
        schema:
          type: string
      - name: amount
        in: header
        description: This represents the amount of money for which the eMandate request has been made.
        required: false
        schema:
          type: string
      - name: currency
        in: header
        description: Currency (HKD/CNY).
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK. Success.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Document'
              example:
                MndtAccptncRpt:
                  GrpHdr:
                    MsgId: CITIBANK/20200803-PSR/1245084092
                    CreDtTm: '2020-08-03T04:34:59'
                  UndrlygAccptncDtls:
                    AccptncRslt:
                      Accptd: 'false'
                      RjctRsn:
                        Prtry: PDNG
                    OrgnlMndt:
                      OrgnlMndt:
                        MndtId: Not Available
                        MndtReqId: userguide03082001
                        Tp:
                          LclInstrm:
                            Cd: DDMU
                        Ocrncs:
                          SeqTp: RCUR
                          Frqcy:
                            Prd:
                              Tp: WEEK
                              CntPerPrd: '100'
                          Drtn:
                            FrDt: '2020-08-03'
                            ToDt: '2020-08-03'
                        TrckgInd: 'false'
                        MaxAmt:
                          _Ccy: HKD
                          __text: '4086.67'
                        Cdtr:
                          Nm: Citiconnect tester
                        CdtrAcct:
                          Id:
                            Othr:
                              Id: '1192834003'
                        CdtrAgt:
                          FinInstnId:
                            ClrSysMmbId:
                              MmbId: '006'
                        Dbtr:
                          Nm: payer name
                          Id:
                            PrvtId: ''
                        DbtrAcct:
                          Id:
                            Othr:
                              Id: Not Available
                              SchmeNm:
                                Prtry: AIIN
                        DbtrAgt:
                          FinInstnId:
                            ClrSysMmbId:
                              MmbId: '147992'
                        RfrdDoc:
                          CdtrRef: payer ref name
        '400':
          description: Bad Request. Please try with Valid Request
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                statusCode: '400'
                statusMessage: Either mndtReqId or mndtId should be provided
        '401':
          description: Unauthorized.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                statusCode: '401'
                statusMessage: The request is Unauthorized. Please try again with valid credentials.
        '405':
          description: Method Not Allowed.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                statusCode: '405'
                statusMessage: Please try with Valid HTTP Verb.
        '415':
          description: Unsupported Media Type.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                statusCode: '415'
                statusMessage: Resend the request with valid content-type
        '500':
          description: Internal Server Error.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                statusCode: '500'
                statusMessage: Check the service of API.
        '503':
          description: Service Unavailable.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                statusCode: '503'
                statusMessage: Please try again later/ after some time
        '504':
          description: GatewayTimeout.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                statusCode: '504'
                statusMessage: Look for server connectivity issues.
      security:
      - clientCredentials: []
      tags:
      - Emandateservices
    servers:
    - url: https://tts.apib2b.citi.com/citiconnect/prod
  /emandateservices/v2/emandateinitiation:
    post:
      summary: Initiate An eMandate
      description: 'The eMandate Initiation API is sent by an initiating party (Creditor)to the receiving party (Debtor) in the collection chain to register an eMandate. CitiConnect clients can initiate eMandate Initiation for the direct debit collections. Currently, this functionality is applicable for the UK and for SEPA countries. The eMandate request will be sent in JSON message. The Push Notification API will enable eMandate API clients to receive proactive notification via a JSON Mandate Status Report if their Mandate Creation status changes. The push notification will only be sent for mandates initiated via API and client will receive multiple JSON Mandate Status Reports based on mandate status movement.


        Content-Type: Supports ''application/json''

        Authorization: The OAuth Token prefixed with “Bearer“ and space in between.'
      operationId: eMandateInitiation
      parameters:
      - name: client_id
        in: query
        required: true
        description: This is your unique identifier shared during your CitiConnect API onboarding. This is the same `client_id` used for oauth token generation
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Currently supports “application/JSON.
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: The OAuth Token prefixed with "Bearer" and space in between.
        required: true
        schema:
          type: string
      - name: region
        in: header
        description: Specifies merchant's region from where the mandate request is initiated i.e. 'EMEA'.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mandate_response'
              example:
                mandate_acceptance:
                - mandate_identification: test2402
                  mandate_request_identification: e27kpp59yb
                  scheme_identification: w24no84ybp
                  accepted: 'NO'
                  reasons:
                  - code: PDNG
                    description: READY_FOR_EXPORT
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                errors:
                - action: Please send valid value for property account_id.
                  issue: account_id cannot be null or empty
                status: FAILED
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                errors:
                - action: Get the new oauth token and resend the request.
                  issue: Provided oauth token is invalid.
                status: FAILED
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                errors:
                - action: Resend the request with valid HTTP POST verb.
                  issue: HTTP verb used is not allowed.
                status: FAILED
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                errors:
                - action: Resend the request with content-type as application/json in header.
                  issue: Provided content-type is not allowed.
                status: FAILED
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                errors:
                - action: Please verify the transaction status using url provided in links. Based on the transaction status re-initiate the request.
                  issue: Unable to process your request at this moment.
                links:
                - href: /mandate/status/1234568/mandate_request_identification?fields=status
                  method: GET
                  rel: status
                status: FAILED
      security:
      - clientCredentials: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/mandate_full_details'
        required: true
      tags:
      - Emandateservices
    servers:
    - url: https://tts.apib2b.citi.com/citiconnect/prod
  /emandateservices/v2/emandatestatusinquiry:
    get:
      summary: Get The Status Of An eMandate
      description: 'The eMandate Status Inquiry API V2 allows you to access the status of your eMandate and generates eMandate details with the status of the transaction. After the initial eMandate initiation call, there is an ability to view transaction status at any later point using the eMandate Status Inquiry API V2. You generate these details by passing values for the following fields in your request: Mandate Req ID, Scheme ID. The request follows custom schema formatting, and the response follows JSON message format.


        Content-Type: Supports ''application/json''.

        Authorization: The OAuth Token prefixed with “Bearer“ and space in between.'
      operationId: eMandateStatusInquiry
      parameters:
      - name: Accept
        in: header
        description: Supports "application/json".
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: The OAuth Token prefixed with "Bearer" and space in between.
        required: true
        schema:
          type: string
      - name: region
        in: header
        description: Specifies merchant's region from where the mandate request is initiated i.e. 'EMEA'.
        required: true
        schema:
          type: string
      - name: mandateRefId
        in: query
        description: Unique identification assigned/generated by the initiating party or by Origix platform respectively to clearly identify the transaction. This Identification is passed on, unchanged, throughout the entire end-to-end chain.
        required: true
        schema:
          type: string
      - name: schemeId
        in: query
        description: SchemeId assigned to each merchant during onboarding process.
        required: true
        schema:
          type: string
      - name: mandateId
        in: query
        description: mandateId  is to retreive the status of mandate.
        required: false
        schema:
          type: string
      - name: payer_reference_number
        in: query
        description: Unique and unambiguous identification as assigned by the creditor to the referred document shared with the debtor for its own reference.<br>Specify the reference document  for the mandate,  to be referred by debtor..
        required: false
        schema:
          type: string
      - name: max_transaction_amount
        in: query
        description: Maximum amount that may be collected from the debtor's account,per instruction.<br>Amount of the transaction. Determine how and when a currency fractional (decimals) should be indicated in each transaction.Maximum of 15 Digits (Including decimals).
        required: false
        schema:
          type: number
      - name: currency_code
        in: query
        description: Maximum amount that may be collected from the debtor's account, per instruction.<br>Amount of the transaction. Determine how and when a currency fractional (decimals) should be indicated in each transaction. Maximum of 15 Digits (Including decimals).
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mandateInqResponse'
              example:
                mandate_acceptance:
                - mandate_identification: test2402
                  mandate_request_identification: e27kpp59yb
                  scheme_identification: w24no84ybp
                  accepted: 'NO'
                  reasons:
                  - code: PDNG
                    description: READY_FOR_EXPORT
                mandate_full_details:
                  mandate_details:
                    mandate_occurence:
                      sequence_type: RCUR
                    tracking_indicator: false
                  debtor:
                    name: Samiel
                    address:
                      address_line_1: OlympusA
                      address_line_2: Rodas enclave
                      town_name: Ireland
                      postal_code: '12345'
                      country_code: IE
                    contact:
                      mobile_number: '9167632379'
                      email: kalpita1.sawant@citi.com
                    account:
                      identification: '00100560'
                      iban: GB62CITI18500800100560
                      bic: CITIGB2LXXX
                  scheme:
                    private_identification: w24no84ybp
                  creditor:
                    account:
                      iban: GB42CLRB04041320000046
                      bic: CLRBGB21
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                errors:
                - action: please send valid value for property account_id
                  issue: account_id cannot be null or empty
                status: FAILED
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                errors:
                - action: get the new oauth token and resend the request
                  issue: provided oauth token is invalid
                status: FAILED
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                errors:
                - action: resend the request with HTTP POST verb
                  issue: HTTP verb used is not allowed
                status: FAILED
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                errors:
                - action: resend the request with content-type as application/json in header
                  issue: provided content-type is not allowed
                status: FAILED
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                errors:
                - action: please verify the transaction status using url provided in links. Based on the transaction status re-initiate the request
                  issue: unable to process your request at this moment
                links:
                - href: /mandate/status/1234568/mandate_request_identification?fields=status
                  method: GET
                  rel: status
                mandate_request_identification: '12345678'
                status: FAILED
      security:
      - clientCredentials: []
      tags:
      - Emandateservices
    servers:
    - url: https://tts.apib2b.citi.com/citiconnect/prod
components:
  schemas:
    GroupHeader80:
      required:
      - creation_Date_time
      - message_identification
      properties:
        message_identification:
          type: object
          description: Point to point reference, as assigned by the instructing party, and sent to the instructed party, to unambiguously identify the message.
          allOf:
          - $ref: '#/components/schemas/Max35Text'
        creation_Date_time:
          type: object
          description: Date and time at which the message was created.
          allOf:
          - $ref: '#/components/schemas/ISODateTime'
        authorisation:
          type: array
          xml:
            name: Authstn
          description: User identification or any user key to be used to check the authority of the initiating party.
          items:
            $ref: '#/components/schemas/Authorisation1Choice'
          maxItems: 2
        initiating_party:
          type: object
          description: Party that initiates the mandate message.
          allOf:
          - $ref: '#/components/schemas/PartyIdentification135'
        instructing_agent:
          type: object
          description: Agent that is instructed by the previous party in the chain to carry out an instruction.
          allOf:
          - $ref: '#/components/schemas/BranchAndFinancialInstitutionIdentification6'
        instructed_agent:
          type: object
          description: Agent that is instructed by the previous party in the chain to carry out an instruction. In case of amendment and cancellation request messages, the instructed agent is the party receiving the amendment and cancellation request message and not the party that received the original mandate initiation request message. In case of acceptance report message, the instructed agent is the party receiving the acceptance report message and not the party that received the original mandate request message.
          allOf:
          - $ref: '#/components/schemas/BranchAndFinancialInstitutionIdentification6'
    Authorisation1Choice:
      type: object
      properties:
        code:
          type: object
          description: 'Specifies the level of approval depending on a number of factors, including payment type, threshold amount or local country or operations practice.<br><br><b>AUTH</b>: Indicates a file has been pre-authorized or approved within the originating customer environment and no further approval is required. <br><br><b>FDET</b>: Indicates that a file requires additional file level approval, with the ability to view both the payment information block and supporting customer credit transaction detail. <br><br><b>FSUM</b>: Indicates that a file requires additional file level approval, with the ability to view only the payment information block level information.<br><br><b>ILEV</b>: Indicates that a file requires all customer transactions to be authorized or approved.'
          allOf:
          - $ref: '#/components/schemas/Authorisation1Code'
        proprietary:
          type: string
          xml:
            name: Prtry
          description: Specifies the proprietary description
          minLength: 1
          maxLength: 128
      description: Either of Code or Proprietary is required.
    GenericIdentification30:
      type: object
      required:
      - identification
      - issuer
      properties:
        identification:
          type: string
          xml:
            name: Id
          description: Proprietary information, often a code, issued by the data source scheme issuer.
          pattern: '[a-zA-Z0-9]{4}'
        issuer:
          type: string
          xml:
            name: Issr
          description: Entity that assigns the identification.
          minLength: 1
          maxLength: 35
        scheme_name:
          type: string
          xml:
            name: SchmeNm
          description: Short textual description of the scheme.
          minLength: 1
          maxLength: 35
    Frequency37Choice:
      properties:
        code:
          type: object
          description: Specifies the regularity of an event. NEVR - Event does never take place. YEAR - Event takes place every year or once a year. RATE -Event takes place based on a change of a rate. MIAN - Event takes place every six months or two times a year. QURT - Event takes place every three months or four times a year.
          allOf:
          - $ref: '#/components/schemas/Frequency10Code'
        proprietary:
          type: string
          xml:
            name: Prtry
          description: Proprietary Details
      description: Defines the category of adjustment.Either from Code or Proprietaryis Required.
    Frequency36Choice:
      type: object
      required:
      - Prd
      - point_in_time
      - type
      properties:
        type:
          type: object
          allOf:
          - $ref: '#/components/schemas/Frequency6Code'
        Prd:
          type: object
          xml:
            name: Prd
          description: Defines a frequency in terms on counts per period for a specific period type.
          properties:
            type:
              type: object
              description: Period for which the number of instructions are to be created and processed.
              allOf:
              - $ref: '#/components/schemas/Frequency6Code'
            count_per_period:
              type: string
              xml:
                name: CntPerPrd
              description: Number of instructions to be created and processed during the specified period. Number of objects represented as a decimal number, for example 0.75 or 45.6. Fractional Digits up to 17 allowed.
              maxLength: 18
          required:
          - count_per_period
          - type
        point_in_time:
          type: object
          allOf:
          - $ref: '#/components/schemas/FrequencyAndMoment1'
      description: Regularity with which instructions are to be created and processed.
    MandateOccurrences4:
      type: object
      required:
      - sequence_type
      properties:
        sequence_type:
          type: string
          xml:
            name: SeqTp
          description: Identifies the underlying transaction sequence as either recurring or one-off. RCUR - Direct debit instruction where the debtor's authorization is used for regular direct debit transactions initiated by the creditor. OOFF - Direct debit instruction where the debtor's authorization is used to initiate one single direct debit transaction.
        Frqcy:
          type: object
          allOf:
          - $ref: '#/components/schemas/Frequency36Choice'
        Drtn:
          type: object
          allOf:
          - $ref: '#/components/schemas/DatePeriodDetails1'
        first_collection_date:
          type: string
          format: date
          xml:
            name: FrstColltnDt
          description: Date of the first collection of a direct debit as per the mandate.
        final_collection_date:
          type: string
          format: date
          xml:
            name: FnlColltnDt
          description: Date of the final collection of a direct debit as per the mandate.
      description: Provides details of the duration of the mandate and occurrence ofthe underlying transactions.
    AddressType3Choice:
      type: object
      properties:
        code:
          type: object
          description: 'Specifies the type of address.<br><br><b>ADDR</b>: Address is the complete postal address. <br><br><b>PBOX</b>: Address is a postal office (PO) box. <br><br><b>HOME</b>: Address is the home address. <br><br><b>BIZZ</b>: Address is the business address.<br><br><b>MLTO</b>: Address is the address to which mail is sent.<br><br><b>DLVY</b>: Address is the address to which delivery is to take place.'
          allOf:
          - $ref: '#/components/schemas/AddressType2Code'
        proprietary:
          type: object
          description: Information related to an identification, for example, party identification or account identification.
          allOf:
          - $ref: '#/components/schemas/GenericIdentification30'
      description: Either from Code or Proprietary is required.
    SupplementaryData1:
