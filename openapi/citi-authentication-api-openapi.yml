        acs_transaction_id:
          description: A unique transaction identifier assigned by the Access Control Server (ACS).
          example: '56'
          maxLength: 36
          minLength: 36
          type: string
          title: acs_transaction_id
        scheme:
          description: The EMV 3DS authentication scheme used (e.g., MADA, MASTERCARD, VISA).
          example: '56'
          maxLength: 50
          minLength: 2
          type: string
          title: scheme
        custom:
          description: Additional information returned by the scheme or issuer in the authentication response.
          example: '56'
          maxLength: 4000
          minLength: 1
          type: string
          title: custom
        directory_server_id:
          description: Additional information returned by the scheme or issuer in the authentication response.
          example: '56'
          maxLength: 10
          minLength: 10
          type: string
          title: directory_server_id
        directory_server_reference:
          description: Reference number assigned to the Directory Server (DS) by EMV Co.
          example: '56'
          maxLength: 32
          minLength: 1
          type: string
          title: directory_server_reference
        directory_transaction_id:
          description: A unique transaction identifier assigned by the scheme Directory Server.
          example: '56'
          maxLength: 50
          minLength: 1
          type: string
          title: directory_transaction_id
        method_completed:
          description: Indicates if the issuer's ACS completed the method call to obtain browser info.
          type: boolean
          example: true
          title: method_completed
        method_supported:
          description: Indicates if the issuer's ACS supports the method call protocol.
          enum:
          - NOT_SUPPORTED
          - SUPPORTED
          example: NOT_SUPPORTED
          type: string
          title: method_supported
        protocol_version:
          description: The version of the EMV 3-D Secure protocol used (e.g., 2.1.0).
          example: CART123456
          maxLength: 20
          minLength: 1
          type: string
          title: protocol_version
        requestor_id:
          description: The unique identifier assigned to the merchant by the card scheme directory server for 3DS2.
          example: CART123456
          maxLength: 20
          minLength: 1
          type: string
          title: requestor_id
        requestor_name:
          description: The unique name assigned to the merchant by the card scheme directory server for 3DS2.
          example: CART123456
          maxLength: 40
          minLength: 1
          type: string
          title: requestor_name
        sdk:
          $ref: '#/components/schemas/Sdk-Payer-Authentication-Response'
        status_reason_code:
          description: A code indicating the reason for the transaction status (EMVCo specification).
          example: '56'
          maxLength: 2
          minLength: 2
          type: string
          title: status_reason_code
        status:
          description: Indicates the result of payer authentication with the issuer (e.g., Y, N, U, A, R).
          example: Y
          maxLength: 1
          minLength: 1
          type: string
          title: status
        acs_reference:
          description: Reference number assigned to the issuer's ACS by EMV Co.
          example: AFT123456
          maxLength: 32
          minLength: 1
          type: string
          title: acs_reference
        signed_content:
          description: A JSON Web Signature (JWS) object returned by the issuer's ACS (acsSignedContent).
          example: AFT123456
          maxLength: 13684
          minLength: 1
          type: string
          title: signed_content
        amount:
          description: Product amount
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        method:
          description: The method that the issuer will use to authenticate the payer.
          enum:
          - DYNAMIC
          - OUT_OF_BAND
          - STATIC
          example: STATIC
          type: string
          title: method
        payer_interaction:
          description: Indicates if payer interaction was used to complete the authentication process.
          enum:
          - NOT_POSSIBLE
          - NOT_REQUIRED
          - REQUIRED
          example: NOT_REQUIRED
          type: string
          title: payer_interaction
        payment_exemption:
          description: Indicates why this payment qualifies for an SCA exemption.
          enum:
          - AUTO
          - LOW_RISK
          - LOW_VALUE_PAYMENT
          - TRUSTED_MERCHANT
          - MERCHANT_INITIATED_TRANSACTION
          - RECURRING_PAYMENT
          - SECURE_CORPORATE_PAYMENT
          - TRUSTED_MERCHANT
          example: TRUSTED_MERCHANT
          type: string
          title: payment_exemption
        trusted_merchant_status:
          description: Indicates if the payer has added you to their list of trusted merchants for this card.
          enum:
          - NOT_ON_LIST
          - ON_LIST
          example: ON_LIST
          type: string
          title: trusted_merchant_status
        redirect_acs_url:
          type: string
          maxLength: 500
          minLength: 1
          description: The URL of the issuer's ACS to be used for the challenge flow (valid RFC 1738 URL).
          example: https://greenzone-api.uat.nam.nsroot.net/api/notification
          title: redirect_acs_url
        redirect_c_req:
          type: string
          maxLength: 4000
          minLength: 1
          description: The Base64 URL encoded CReq message to be used for the challenge flow.
          example: https://greenzone-api.uat.nam.nsroot.net/api/notification
          title: redirect_c_req
        redirect_html:
          type: string
          maxLength: 40960
          minLength: 1
          description: The Base64 URL encoded CReq message to be used for the challenge flow.
          example: https://greenzone-api.uat.nam.nsroot.net/api/notification
          title: redirect_html
        redirect_domain_name:
          type: string
          maxLength: 253
          minLength: 1
          description: The domain name of the site where payer authentication was performed (e.g., ACS domain name).
          example: https://greenzone-api.uat.nam.nsroot.net/api/notification
          title: redirect_domain_name
        status_code:
          type: string
          maxLength: 100
          minLength: 1
          description: Indicates the status of payer authentication with the issuer (e.g., NPCI BEPG status code).
          example: '500'
          title: status_code
        status_description:
          type: string
          maxLength: 1024
          minLength: 1
          description: Indicates the status of payer authentication with the issuer (e.g., NPCI BEPG status code).
          example: '500'
          title: status_description
        line_of_business:
          type: string
          maxLength: 100
          minLength: 1
          description: Identifier for different lines of business configured in the merchant profile.
          example: '500'
          title: line_of_business
        time:
          type: string
          format: date-time
          description: Date and time of the payer authentication being performed (YYYY-MM-DDThh:mm:ss.SSSZ).
          example: '2022-09-13T08:23:49.114Z'
          title: time
        version:
          description: The form of payer authentication selected or available for use by the gateway.
          enum:
          - 3DS2
          - RUPAY
          - PASSKEY
          - NONE
          example: 3DS2
          type: string
          title: version
    Authentication-Method:
      type: object
      title: Authentication Method
      required:
      - type
      properties:
        type:
          description: "Method specified by the customer for the transaction  \n- Provide CARD for CARD transactions"
          type: string
          enum:
          - CARD
          - GOOGLEPAY
          - APPLEPAY
          example: CARD
          title: type
        card:
          $ref: '#/components/schemas/Authentication-Card'
        token_id:
