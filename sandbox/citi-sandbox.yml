credentials:
  type: Client ID and Client Secret plus an uploaded public-key certificate
  test_key_prefix: null
  note: There is no test-vs-live key prefix convention. Environments are separated by host and by separately issued
    credentials, so a key cannot be accidentally used against the wrong environment the way a mis-prefixed key can.
