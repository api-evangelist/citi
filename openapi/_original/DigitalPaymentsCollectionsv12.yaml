              enum:
                - DO_NOT_PROCEED
                - DO_NOT_PROCEED_ABANDON_ORDER
                - PROCEED
                - RESUBMIT_WITH_ALTERNATIVE_PAYMENT_DETAILS
              example: DO_NOT_PROCEED
              type: string
              title: gateway_recommendation
            status:
              type: string
              maxLength: 20
              minLength: 1
              description: >-
                Transaction Status, following status you will receive in
                response 

                - PENDING - Transaction pending action from customer  

                - FAILED - Transaction failed for invalid payload 

                - UNKNOWN - The result of the operation is unknown 

                - SUCCESS - The operation was successfully processed
              example: SUCCESS
              title: status
            description:
              type: string
              maxLength: 256
              minLength: 1
              description: >-
                Transaction Status, following status you will receive in
                response 

                - PENDING - Transaction pending action from customer  

                - FAILED - Transaction failed for invalid payload 

                - UNKNOWN - The result of the operation is unknown 

                - SUCCESS - The operation was successfully processed
              example: The operation was successfully processed
              title: description
            creation_date_time:
              type: string
              format: date-time
              description: >-
                GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

                - Instant Payment (Debit) - Date time, generated by CitiConnect
                API, when CitiConnect API accepted a payment initiation after
                validation
              example: '2022-09-13T08:23:49.114Z'
              title: creation_date_time
            update_time:
              type: string
              format: date-time
              description: >-
                Indicates the date and time the gateway considers the order to
                have last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ)
              example: '2022-09-13T08:23:49.114Z'
              title: update_time
            type:
              description: Indicates the type of action performed on the order.
              enum:
                - AUTHENTICATION
                - AUTHORIZATION
                - AUTHORIZATION_UPDATE
                - CAPTURE
                - CHARGEBACK
                - DISBURSEMENT
                - FUNDING
                - PAYMENT
                - REFUND
                - REFUND_REQUEST
                - VERIFICATION
                - VOID_AUTHORIZATION
                - VOID_CAPTURE
                - VOID_PAYMENT
                - VOID_REFUND
              example: VERIFICATION
              type: string
              title: type
            reference:
              description: An optional identifier for this transaction
              example: REPAY789541
              maxLength: 250
              minLength: 1
              type: string
              title: reference
            authentication_status:
              description: Indicates the result of payer authentication.
              enum:
                - AUTHENTICATION_ATTEMPTED
                - AUTHENTICATION_AVAILABLE
                - AUTHENTICATION_EXEMPT
                - AUTHENTICATION_FAILED
                - AUTHENTICATION_NOT_IN_EFFECT
                - AUTHENTICATION_NOT_SUPPORTED
                - AUTHENTICATION_PENDING
                - AUTHENTICATION_REJECTED
                - AUTHENTICATION_REQUIRED
                - AUTHENTICATION_SUCCESSFUL
                - AUTHENTICATION_UNAVAILABLE
              example: AUTHENTICATION_UNAVAILABLE
              type: string
              title: authorization_status
        method:
          type: object
          title: Authentication Method Response
          required:
            - type
          properties:
            type:
              description: |-
                Method specified by the customer for the transaction  
                - Provide CARD for CARD transactions
              type: string
              enum:
                - CARD
                - GOOGLEPAY
                - APPLEPAY
              example: CARD
              title: type
            card:
              $ref: '#/components/schemas/Authentication-Card-Response'
            holder_name:
              $ref: '#/components/schemas/Holder-Name'
            token_id:
              description: Token_number.
              example: PA123456789
              maxLength: 50
              minLength: 1
              type: string
              title: token_number
            token_type:
              description: Token type.
              enum:
                - ALT_TOKEN
                - NETWORK_TOKEN
                - ISSUER_TOKEN
                - CITI_TOKEN
              example: ISSUER_TOKEN
              type: string
              title: token_type
        order:
          type: object
          title: Authentication Order Response
          required:
            - creation_date_time
            - currency_code
            - id
            - update_time
            - total_auth_amount
            - total_captured_amount
            - total_refunded_amount
          properties:
            id:
              description: >-
                A unique identifier for this order to distinguish it from any
                other order you create.
              example: OR123456789
              maxLength: 40
              minLength: 1
              type: string
              title: id
            creation_date_time:
              type: string
              format: date-time
              description: GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ)
              example: '2022-09-13T08:23:49.114Z'
              title: creation_date_time
            update_time:
              type: string
              format: date-time
              description: >-
                Indicates the date and time the gateway considers the order to
                have last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ)
              example: '2022-09-13T08:23:49.114Z'
              title: update_time
            reference:
              description: >-
                An optional identifier for the orderFor example, a shopping cart
                number, an order number, or an invoice number.
              example: REPAY789541
              maxLength: 200
              minLength: 1
              type: string
              title: reference
            currency_code:
              description: ISO 4217 Currency Code for instance  USD/GBP/EUR
              enum:
                - USD
              example: USD
              type: string
              title: currency_code
            status:
              type: string
              maxLength: 30
              minLength: 1
              description: >-
                Order Status, following status you will receive in response 

                - AUTHENTICATED - The payer was successfully authenticated. 

                - AUTHENTICATION_INITIATED - Payer authentication has been
                initiated but not completed. 

                - AUTHENTICATION_NOT_NEEDED - Payer authentication was not
                performed as it was not needed. 

                - AUTHENTICATION_UNSUCCESSFUL - Payer authentication was not
                able to be successfully completed. 

                - AUTHORIZED - The payment has been authorized successfully but
                the authorized amount has not yet been captured, in part, full,
                or excess. 

                - CANCELLED - The initial transaction for this order has been
                voided successfully. 

                - CAPTURED - The authorized amount for this order, in full or
                excess, has been captured successfully. 

                - CHARGEBACK_PROCESSED - A Chargeback has been processed against
                this order. 

                - DISPUTED - The payment has been disputed and is under
                investigation. A request for information has been received or a
                chargeback is pending. 

                - EXCESSIVELY_REFUNDED - The payment has been captured in part,
                full, or excess, but the captured amount in excess has been
                refunded successfully. 

                - FAILED - The payment has not been successful. 

                - FUNDING - The order transfers money to or from the merchant,
                without the involvement of a payer. For example, recording
                monthly merchant service fees from the payment service
                provider. 

                - INITIATED - A browser payment that has successfully been
                initiated for this order. No payment has yet been made. 

                - PARTIALLY_CAPTURED - The authorized amount for this order, in
                part, has been captured successfully. 

                - PARTIALLY_REFUNDED - The payment has been captured in part,
                full, or excess, but the captured amount in part has been
                refunded successfully. 

                - REFUNDED - The payment has been captured in part, full, or
                excess, but the captured amount in full has been refunded
                successfully. 

                - REFUND_REQUESTED - A refund against captured amounts on this
                order has been requested but not executed. Requires further
                action to approve the refund. 

                - VERIFIED - The card details for this order have successfully
                been verified. No payment has yet been initiated or made. 

                - DISBURSED - The order amount has successfully been disbursed
