openapi: 3.0.0
info:
  title: Virtual Accounts Single Entity
  description: >-
    CitiConnect API services allows you to enable STP
    (straight-through-processing) for incremental virtual account creation
    functionality where the client ERP system can invoke CitiConnect API
    requests to open virtual accounts for reservation and activation
    functionalities. The user can also invoke the CitiConnect API request to
    inquire on the status or modify existing of virtual accounts or delete an
    active virtual account.
  contact:
    name: Standards & Developer Hub
    url: https://tts.sandbox.developer.citi.com/citiconnect/
    email: developer-support@citi.com
  version: 1.0.0
servers:
  - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb
    description: 'sandbox URL '
  - url: https://tts.apib2b.citi.com/citiconnect/prod
    description: production gateway URL
tags:
  - name: Virtual Account Single Entity
    description: Virtual Account Single Entity
paths:
  /receivablesservices/v1/virtualaccount/activateorreserve:
    post:
      summary: Create a Virtual Account
      description: >-
        This endpoint allows you to create a virtual account with activation and
        reservation services. The endpoint supports both XML and JSON format.
        The activation and reservation functionality is identified based on the
        `action` in the request payload.
      operationId: virtualAccountActivateOrReserve
      tags:
        - Virtual Account Single Entity
      parameters:
        - name: client_id
          in: query
          description: >-
            This is your unique identifier shared during your CitiConnect API
            onboarding. This is the same `client_id` used for OAuth token
            generation.
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          description: Supports \"application/xml\" and \"application/json\".
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: The OAuth Token prefixed with "Bearer" and space in between.
          required: true
          schema:
            type: string
      requestBody:
        description: Describes the virtual account creation APIs request body fields.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualAccountRequest'
            examples:
              Virtual-Account-Reservation-Request:
                $ref: '#/components/examples/Virtual-Account-Reservation-Request'
              Virtual-Account-Activation-Request:
                $ref: '#/components/examples/Virtual-Account-Activation-Request'
          application/xml:
            schema:
              $ref: '#/components/schemas/VirtualAccountRequest'
            examples:
              Virtual-Account-Reservation-Request:
                value: >-
                  <?xml
                  version="1.0"encoding="UTF-8"?><VirtualAccountRequest><ApiVersion>1.0</ApiVersion><Action>reservation</Action><BranchCode>920</BranchCode><NumAccountsRequired>1</NumAccountsRequired><VirtualHeaderAccount>54444598</VirtualHeaderAccount><ContactFirstName>James</ContactFirstName><ContactLastName>Smith</ContactLastName><ContactEmail>james.smith@email.com</ContactEmail><ContactPhone>+44-2021220909</ContactPhone></VirtualAccountRequest>
              Virtual-Account-Activation-Request:
                value: >-
                  <VirtualAccountRequest><ApiVersion>1.0</ApiVersion><Action>activation</Action><BranchCode>920</BranchCode><VirtualHeaderAccount>54444598</VirtualHeaderAccount><ContactFirstName>James</ContactFirstName><ContactLastName>Smith</ContactLastName><ContactEmail>james.smith@email.com</ContactEmail><ContactPhone>+44-2021220909</ContactPhone><Accounts><Account><VirtualHeaderAccount>54444598</VirtualHeaderAccount><VirtualAccountNumber>54536468</VirtualAccountNumber><AlternateAccountNumber>54536468</AlternateAccountNumber><TaxIdentificationNumber>12345678</TaxIdentificationNumber><ReportingAccountNumber>54444598</ReportingAccountNumber><PurposeOfVirtualAccount>C</PurposeOfVirtualAccount><Name>David</Name><AddressLine1>New
                  York</AddressLine1><VirtualAccountBalanceDisplayOption>Y</VirtualAccountBalanceDisplayOption><BalanceControlOption>O</BalanceControlOption></Account></Accounts></VirtualAccountRequest>
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualAccountResponse'
              examples:
                Virtual-Account-Reservation-Response:
                  $ref: '#/components/examples/Virtual-Account-Reservation-Response'
                Virtual-Account-Activation-Response:
                  $ref: '#/components/examples/Virtual-Account-Activation-Response'
            application/xml:
              schema:
                $ref: '#/components/schemas/VirtualAccountResponse'
              examples:
                Virtual-Account-Reservation-Response:
                  value: >-
                    <VirtualAccountResponse><RequestId>b8f-d8e5-4a48-ad13-5d1ec8bb32e858052</RequestId><Status>success</Status><Message>Request
                    accepted Successfully</Message></VirtualAccountResponse>
                Virtual-Account-Activation-Response:
                  value: >-
                    <VirtualAccountResponse><RequestId>8c4-c93c-4803-b9b6-aef2d43ca76e57920</RequestId><Status>success</Status><Message>Request
                    accepted Successfully</Message></VirtualAccountResponse>
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
        - clientCredentials: []
  /receivablesservices/v1/virtualaccounts:
    get:
      summary: Virtual Account Status
      description: >-
        This endpoint allows you to retrieve details of any active virtual
        accounts.
      operationId: getVirtualAccounts
      tags:
        - Virtual Account Single Entity
      parameters:
        - name: client_id
          in: query
          description: >-
            This is your unique identifier shared during your CitiConnect API
            onboarding. This is the same `client_id` used for OAuth token
            generation.
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: The OAuth Token prefixed with "Bearer" and space in between.
          required: true
          schema:
            type: string
        - name: encrypted-params
          in: header
          description: >-
            Indicates the virtual_account_number To specify the virtual account
            number that must be for inquired/updated/deleted.<br>Sample message
            before encryption - {"virtual_account_number":"09834572"}
          required: true
          schema:
            type: string
        - name: branch_code
          in: query
          description: >-
            Citi's internal branch code associated with a virtual account
            number.
          required: true
          schema:
            type: string
            maxLength: 4
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualAccountResponse'
              examples:
                Virtual-Account-Get-Response:
                  $ref: '#/components/examples/Virtual-Account-Get-Response'
            application/xml:
              schema:
                $ref: '#/components/schemas/VirtualAccountResponse'
              example: >-
                <?xml version="1.0"
                encoding="UTF-8"?><VirtualAccountResponse><RequestId>3c2224a8-ce1b-4c12-8a05-f9b3ee2716c6</RequestId><Status>success</Status><Message>Request
                accepted Successfully</Message></VirtualAccountResponse>
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
        - clientCredentials: []
    put:
      summary: Modify a Virtual Account
      description: >-
        This endpoint allows you to modify existing accounts or reopen
        previously closed virtual accounts. You can modify the account's
        description, tax ID, address as well as specify whether the virtual
        account will allow credits or debits to post.
      operationId: updateVirtualAccounts
      tags:
        - Virtual Account Single Entity
      parameters:
        - name: client_id
          in: query
          description: >-
            This is your unique identifier shared during your CitiConnect API
            onboarding. This is the same `client_id` used for OAuth token
            generation.
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          description: Supports \"application/xml\" and \"application/json\".
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: The OAuth Token prefixed with "Bearer" and space in between.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVirtualAccounts'
            examples:
              Virtual-Account-Modify-Request:
                $ref: '#/components/examples/Virtual-Account-Modify-Request'
          application/xml:
            schema:
              $ref: '#/components/schemas/UpdateVirtualAccounts'
            example: >-
              <?xml version="1.0"
              encoding="UTF-8"?><UpdateVirtualAccounts><VirtualAccountNumber>14337204</VirtualAccountNumber><Action>Modify</Action><BranchCode>600</BranchCode><AccountDescription>David</AccountDescription><TaxPayerId>123452354</TaxPayerId><Address><AddressLine1>Ireland
              country</AddressLine1><AddressLine2>Addressline
              2</AddressLine2></Address></UpdateVirtualAccounts>
        required: true
        x-s2o-overloaded: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualAccountResponse'
              examples:
                Account-Modify-Response:
                  $ref: '#/components/examples/Modify-Virtual-Account-Response'
            application/xml:
              schema:
                $ref: '#/components/schemas/VirtualAccountResponse'
              example: >-
                <VirtualAccountResponse><RequestId>912-1b37-449a-9e1a-3401d7ab7d8384932</RequestId><Status>success</Status><Message>Request
                accepted Successfully</Message></VirtualAccountResponse>
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
        - clientCredentials: []
      x-s2o-warning: Operation updateVirtualAccounts has multiple requestBodies
    delete:
      summary: Delete a Virtual Account
      description: This endpoint allows you to delete an active virtual account.
      operationId: deleteVirtualAccount
      tags:
        - Virtual Account Single Entity
      parameters:
        - name: client_id
          in: query
          description: >-
            This is your unique identifier shared during your CitiConnect API
            onboarding. This is the same `client_id` used for OAuth token
            generation.
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: The OAuth token prefixed with "Bearer" and a space in between.
          required: true
          schema:
            type: string
        - name: encrypted-params
          in: header
          description: >-
            Indicates the virtual account number that must be for status
            inquiries updates and deletions. <br>Sample message before
            encryption - {"virtual_account_number":"09834572"}
          required: true
          schema:
            type: string
        - name: branch_code
          in: query
          description: Citi internal branch code associated with a virtual account number.
          required: true
          schema:
            type: string
            maxLength: 4
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualAccountResponse'
              examples:
                Virtual-Account-Delete-Request:
                  $ref: '#/components/examples/Virtual-Account-Delete-Request'
            application/xml:
              schema:
                $ref: '#/components/schemas/VirtualAccountResponse'
              example: >-
                <?xml version="1.0"
                encoding="UTF-8"?><VirtualAccountResponse><RequestId>2aafe680-c12d-41a3-8b3d-f9b3ee2792a4</RequestId><Status>success</Status><Message>Request
                accepted Successfully</Message></VirtualAccountResponse>
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
        - clientCredentials: []
x-components:
  parameters:
    BranchCode:
      description: Citi branch code associated with a given virtual header account.
      in: query
      maxLength: 4
      name: branch_code
      required: true
      type: string
    ClientId:
      description: >-
        This is your unique identifier shared during your CitiConnect API
        onboarding. This is the same `client_id` used for OAuth token
        generation.
      in: query
      name: client_id
      required: true
      type: string
    EncryptedHeader:
      description: >-
        Indicates the virtual account number that must be for status inquiries
        updates and deletions. Sample message before  encryption -
        {"virtual_account_number":"09834572"}
      in: header
      name: encrypted-params
      required: true
      type: string
  responses:
    BadRequest:
      description: Bad Request
      schema:
        $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal Server Error
      schema:
        $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: Method Not Allowed
      schema:
        $ref: '#/components/schemas/ErrorResponse'
    OKResponse:
      description: Accepted
      schema:
        $ref: '#/components/schemas/VirtualAccountResponse'
    Unauthorized:
      description: Unauthorized
      schema:
        $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Unsupported Media Type
      schema:
        $ref: '#/components/schemas/ErrorResponse'
  examples:
    Account-Reservation: null
    value:
      api_version: '1.0'
      action: reservation
      branch_code: '920'
      number_of_accounts_required: '4'
      virtual_header_account: '54444598'
      contact_first_name: RAVI6
      contact_last_name: SATPUTE6
      contact_email: raviksatpute6@citi.com
      contact_phone: +91-9762615353
    BadRequestExample:
      value:
        code: CC00004
        error_details:
          - action: please provide valid branch code
            issue: branch code is invalid/missing
        message: Bad Request
        ref_id: ec689822-9864-4c4d-9d68-222467627902
        status: '400'
    CreditDebitPreferencesExample:
      value:
        action: CreditDebitPreferences
        branch_code: GB3
        credit_debit_preferences:
          disallow_credit: 'Y'
          disallow_debit: 'Y'
        virtual_account_number: 987453211
    InternalServerErrorExample:
      value:
        code: CC00003
        error_details:
          - action: please try some time later
            issue: unable to serve your request at this moment
        message: Internal Server Error
        ref_id: ec689822-9864-4c4d-9d68-222467627902
        status: '500'
    MethodNotAllowedExample:
