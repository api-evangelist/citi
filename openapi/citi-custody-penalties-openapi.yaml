      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Unsupported-Media-Type-Example:
              $ref: '#/components/examples/Unsupported-Media-Type-Example'
    Internal-Server-Error:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Internal-Server-Error-Example:
              $ref: '#/components/examples/Internal-Server-Error-Example'
  examples:
    Bad-Request-Example:
      value:
        ref_id: 444d0f3f-4x55-7g99-8b2c-0cf2a921a5ab
        errorDetails:
          - issue: path-param servicePortableId is mandatory and it cannot be empty
            action: please provide valid parameter values
            code: VC00010
    Unauthorized-Example:
      value:
        ref_id: 444d0f3f-4x55-7g99-8b2c-0cf2a921a5ab
        errorDetails:
          - issue: User not authorized for this functionality
            action: please use valid credentials to access this functionality
            code: CC00007
    Not-Found-Example:
      value:
        ref_id: 444d0f3f-4x55-7g99-8b2c-0cf2a921a5ab
        errorDetails:
          - issue: Resource that you are searching is not found
            action: Please use valid resource details
            code: CC00006
    Method-Not-Allowed-Example:
      value:
        ref_id: 444d0f3f-4x55-7g99-8b2c-0cf2a921a5ab
        errorDetails:
          - issue: Method not supported
            action: please use valid http verb
            code: CC00001
    Unsupported-Media-Type-Example:
      value:
        ref_id: 444d0f3f-4x55-7g99-8b2c-0cf2a921a5ab
        errorDetails:
          - issue: Media type not supported
            action: please use valid content-type in header
            code: CC00002
    Internal-Server-Error-Example:
      value:
        ref_id: 444d0f3f-4x55-7g99-8b2c-0cf2a921a5ab
        errorDetails:
          - issue: unable to serve your request at this moment
            action: Please refer to documentation provided or contact support team
            code: CC00004
  schemas:
    3de83cae-f7b8-4ba6-8f2f-4869ce6284e2-data-schema:
      type: object
      properties:
        ACCT_ID:
          type: string
          description: >-
            Account ID is an identifier for both a Cash Account and/or a
            Safekeeping Account that is unique within a branch.
          example: DEMOSK02US
        ACCT_NME:
          type: string
          description: >-
            Account Name is the name that is assigned to the Cash Account and/or
            the Safekeeping Account. If an Alternate Account Name has been
            specified for an account it will be displayed as the Account Name.
          example: Demo - SK - Japan 2
        ACCT_OWN_NAME:
          type: string
          description: >-
            Account Servicer/Depository is the name of the party which
            administers the account.
          example: Demo_d Ltd
        CPRT_NAME:
          type: string
          description: >-
            Counterparty is the name of the party imposed with the penalties or
            credited with the penalty(ies).
          example: ECLR/10608
        PENALTY_DETEC_DT:
          type: string
          format: date
          description: >-
            Penalty Detection Date is the day for which the penalty was
            computed. /nIt is the date on which the instruction matched for Late
            Matching Fail Penalty (LMFP) or the date on which an instruction
            fails to settle for Settlement Fail Penalty (SEFP). /nNote: This
            date is not updated upon re-calculation of the penalty and always
            relates to the business day for which the penalty was initially
            computed.
          example: '2025-03-10'
        PENALTY_REF:
          type: string
          description: >-
            Reference is assigned by the market infrastructure to the penalty
            and is the individual identification of the penalty for the relevant
            account owner (that is, either for the failing participant or for
            the non-failing participant).
          example: F260305454043360
        COM_REF:
          type: string
          description: >-
            Common Reference is assigned by the market infrastructure (for
            example T2S) to the penalty and that is common for both the failing
            and the non-failing participant.
          example: C070200015097454
        PENALTY_TYP_CD:
          type: string
          description: >-
            Penalty Type indicating whether it is a Late Matching Fail Penalty
            (LMFP) or Settlement Fail Penalty (SEFP).
          example: LMFP
        PENALTY_AMT_CURR:
          type: string
          description: >-
            Penalty Currency is the ISO 4217 currency code for the currency of
            the penalty amount.
          example: USD
        PENALTY_AMT:
          type: number
          format: double
          description: >-
            Penalty Amount is calculated based on the security and instruction
            characteristics and the reason for the fail. For a Late Matching
            Fail Penalty (LMFP) that spans several business days, this amount is
            the sum of the amounts calculated for each applicable business day.
          example: 250.75
        PFD_ID_CTXT_CD:
          type: string
          description: >-
            Security ID Type indicates the type of identifier of the
            corresponding Security ID field. Values include: CUSIP, ISIN, SEDOL,
            LOCAL, etc.
          example: CUSIP
        PFD_ISS_ID:
          type: string
          description: >-
            Security ID is the most commonly used identifier for the security in
            a given market.
          example: CSD12345
        SEC_SHRT_NME:
          type: string
          description: Issue Name is the Security Name of the security instrument.
          example: TEMPORARY SECURITY 000BMTYVP8
        SID_ISIN:
          type: string
          description: >-
            ISIN (International Securities Identification Number) is a
            12-character alpha-numerical code governed by ISO 6166 it is a
            uniform identification of a security at trading and settlement. This
            data is sourced from multiple sources and will be provided if
            available.
          example: US88160R1014
        CLIENT_SEC_REF:
          type: string
          description: >-
            Custodian reference is i a unique identifier assigned to a client’s
            securities or accounts by the custodian
          example: Demo_nnnnn086021
        CLIENT_REF:
          type: string
          description: >-
            Client Reference is a unique number assigned by the client, to the
            transaction, for identification purposes within their organization.
          example: Demo_xxnnn54792
        TRADE_DT:
          type: string
          format: date
          description: Date when the trade was agreed on with counterparty.
          example: '2025-02-28'
        SEC_PEN_RT:
          type: number
          format: double
          description: Security penalty rate applied in the calculation of the penalty.
          example: 0.005
        CNTR_SETL_DT:
          type: string
          format: date
          description: >-
            Contractual Settlement Date represents the agreed‑upon date on which
            a trade is supposed to settle according to market rules or
            contractual terms.
          example: '2025-03-03'
        POST_QTY:
          type: number
          format: double
          description: >-
            Quantity provides the number of units, par value or nominal value
            (for fixed income instruments), amount of currency (for FX
            transactions), or number of shares. Indicates the contract quantity
            on the original transaction that was given up.
          example: 1500
        POST_AMT_CURR:
          type: string
          description: Settlement Currency is the currency name for the Settlement Amount.
          example: EUR
        POST_AMT:
          type: number
          format: double
          description: >-
            Settlement Amount is the cash value of the trade in the market
            currency.
          example: 450000
        PENALTY_STATUS:
          type: string
          description: >-
            Penalty status is to check if penalty is active or inactive for a
            given record.
          example: ACTV
    3de83cae-f7b8-4ba6-8f2f-4869ce6284e2-json-response-schema:
