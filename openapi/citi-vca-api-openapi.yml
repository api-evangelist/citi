          description: '<table><tr><td>ErrorResponseForAuthReport</td><td><table><tr><th>Error Code</th><th>Error Description</th></tr>\n<tr><td>ERS0001</td><td>Invalid Virtual Card Account Number format</td></tr>\n<tr><td>ERS0002</td><td>Invalid Transaction Type</td></tr>\n<tr><td>ERS0003</td><td>timeZone field is empty or has an invalid UTC offset time zone format</td></tr>\n<tr><td>ERC0004</td><td>Transactions were unable to be returned for the requested data range. Please try again, or contact Citi support if you have any further questions or comments.</td></tr>\n<tr><td>ERS0007</td><td>Invalid Message ID format</td></tr>\n<tr><td>ERS0009</td><td>Client Onboard Configuration setup is missing. Contact Citi support.</td></tr>\n<tr><td>ERS0010</td><td>Invalid Report ID format. Report ID must include numeric values</td></tr>\n<tr><td>ERS0053</td><td>Start Date is Mandatory.</td></tr>\n<tr><td>ERS0054</td><td>End Date is Mandatory.</td></tr>\n<tr><td>ERS0055</td><td>Requested report date cannot exceed 180 days in the past from today''s date</td></tr>\n<tr><td>ERS0057</td><td>startDate value exceeds requested endDate value</td></tr>\n<tr><td>ERS0060</td><td>Client ID and/or Program Id is missing in Client Onboard Configuration setup. Contact Citi support.</td></tr>\n<tr><td>ERS0061</td><td>VCA ID is not present in our system</td></tr>\n<tr><td>ERS0063</td><td>Requested Time Zone is not supported</td></tr>\n<tr><td>ERS0068</td><td>Program Id is Mandatory.</td></tr>\n<tr><td>ERS0069</td><td>Vca Id is Mandatory.</td></tr>\n<tr><td>ERS0070</td><td>Message Id is Mandatory.</td></tr>\n<tr><td>ERS0071</td><td>Virtual Card Account Number is Mandatory.</td></tr>\n<tr><td>ERS0072</td><td>Requested report date cannot exceed 36 months in the past from todays date</td></tr>\n<tr><td>ERS0079</td><td>The requested report ID(s) is for a VCA that is different than the VCA included in the request. Please include the VCA associated to the report ID(s).</td></tr>\n<tr><td>ERS0080</td><td>The requested report ID(s) is for a programId that is different than the programId included in the request. Please include the programId associated to the report ID(s).</td></tr>\n<tr><td>ERS0081</td><td>The requested report ID(s) is for a timeZone that is different than the timeZone included in the request. Please include the timeZone associated to the report ID(s).</td></tr>\n<tr><td>ERS0082</td><td>The requested report IDs are for different VCAs, Please include report IDs that belong to the same VCA.</td></tr>\n<tr><td>ERS0083</td><td>The requested report IDs are for different program IDs, Please include report IDs that belong to the same program ID.</td></tr>\n<tr><td>ERS0084</td><td>The requested report IDs are for different requested time zones, Please include report IDs that belong to the same requested time zone.</td></tr>\n<tr><td>ERS0091</td><td>startDate value must have valid format: YYYY-MM-DD</td></tr>\n<tr><td>ERS0092</td><td>endDate value must have valid format: YYYY-MM-DD</td></tr>\n<tr><td>ERS0093</td><td>The date specified in startDate does not exist</td></tr>\n<tr><td>ERS0094</td><td>The date specified in endDate does not exist</td></tr>\n<tr><td>ERS0095</td><td>Report ID included in your request is not present for the given ClientID/program ID. Please generate a new report ID for this Reports request by calling the Reports API without a report ID</td></tr>\n<tr><td>ERS0097</td><td>startTime value must have valid format: HH:MM - H (0,1,2) | H (0-9) : M (0-5) | M (0-9)</td></tr>\n<tr><td>ERS0098</td><td>endTime value must have valid format: HH:MM - H (0,1,2) | H (0-9) : M (0-5) | M (0-9)</td></tr>\n<tr><td>ERS0099</td><td>startTime value cannot exceed the requested endTime value</td></tr><tr><td>ERS0100</td><td>Invalid sortOrder value</td></tr><tr><td>ERS0101</td><td>startIndex should be numeric</td></tr><tr><td>ERS0102</td><td>endIndex should be numeric</td></tr><tr><td>ERS0103</td><td>startIndex should be less than or equal to endIndex</td></tr><tr><td>ERS0104</td><td>The startIndex & endIndex range cannot be greater than 150</td></tr><tr><td>ERS0105</td><td>The startDate and endDate range cannot be greater than 30 days if paginationRequired is true</td></tr>\n\n<tr><td>MS0001</td><td>Invalid Virtual Card Account Number</td></tr>\n<tr><td>MS0002</td><td>From date should be before to date.</td></tr>\n<tr><td>MS0006</td><td>Invalid vcaId value</td></tr>\n<tr><td>MS0008</td><td>Invalid Report ID</td></tr>\n\n<tr><td>GRC0002</td><td>Client ID is missing in the request header</td></tr>\n<tr><td>GRC0003</td><td>Invalid JSON Input</td></tr>\n<tr><td>GRC0004</td><td>Region ID is not available in the request</td></tr>\n<tr><td>GRC0011</td><td>Client ID and/or Country and/or region id is missing in Client Onboard Configuration setup. Contact Citi support.</td></tr>\n<tr><td>GRC0016</td><td>Country code is not available in the request</td></tr>\n</table></td></tr></table>'
