  /accounts/amountavailability:
    get:
      summary: Payment Amount Availability
      description: 'CitiConnect Payment Amount Availability allows users to submit requests to Citi in order to identify whether a Citi client has sufficient funds available to complete a transaction. The requestor provides details of the transaction and CitiConnect Payment Amount Availability responds with a Yes or No to indicate if there are sufficient funds.


        Content-Type : Supports “application/xml” or “application/json” :

        Authorization : The OAuth Token prefixed with “Bearer” and space in between. :

        amount : Amount :

        accountNumber : Account Number :

        baseCurrency : Currency Type :'
      parameters:
      - name: client_id
        in: query
        description: This is your unique identifier shared during your CitiConnect API onboarding. This is the same `client_id` used for oauth token generation
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: The OAuth Token prefixed with "Bearer" and space in between.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 OK
          content: {}
      tags:
      - Accounts
      security:
      - clientCredentials: []
      operationId: getAccountsAmountavailability
      x-operation-id-source: derived
    servers:
    - url: https://tts.apib2b.citi.com/citiconnect/prod/selfservices/v1
      description: production gateway url
    - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb/selfservices/v1
      description: sbox url
components:
  schemas:
    BalInquiryRequest:
      properties:
        accountNumber:
          description: Number of the account to which the balance inquiry relates. TPP clients must send encrypted Account number field.
          type: string
          format: alphanumeric
          example: '1234567890123450'
          maxLength: 19
          minLength: 16
        accountLevel:
          description: Heirarchy level to which balance inquiry relates<br>Possible Values<br>G - Corporate Group<br>R - Corporate Relationship<br>A - Financial Account<br>C - Card
          type: string
          format: alphanumeric
          example: C
          maxLength: 1
        transactionAmount:
          description: 'The amount of the planned transaction to be checked against the available limit<br><br>Applicable only when transactionType = C<br><br>Amount format must be passed with the appropriate amount of decimal positions based on the currency per the ISO 4217 standard<br><br>If additonal digits are added to the right of the decimal where not applicable for the given currency as per the ISO 4217 standard, the additional digits will be stripped from the end from the value.<br>Max length: 14 digits to the left of the decimal and 2 digits to the right of the decimal<br>or 13 digits to the left of the decimal and 3 digits to the right of the decimal.'
          type: string
          format: alphanumeric
          example: '100.50'
          maxLength: 17
        transactionAmountCurrency:
          description: Required if transactionAmount is included in request. If not included while Transaction Amount is present, transactionAmountCurrency will be defaulted to the domestic currency<br><br>Applicable only when transactionType = C<br><br>The currency of the planned transaction to be checked against the available limit
          type: string
          format: alphanumeric
          example: USD
          maxLength: 3
      required:
      - accountNumber
    ResponseCodes:
      properties:
        errorCode:
