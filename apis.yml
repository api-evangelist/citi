description: 'Citi is the consumer and institutional brand of Citigroup, serving over 200 million customers
  across 160 countries. Citi runs one of the largest published API estates in banking: 118 machine-readable
  OpenAPI and Swagger contracts covering 297 operations are served from developer.citi.com across payment
  initiation and status, payment acceptance and collections, account reporting and statements, commercial
  cards and virtual card accounts, CitiFX Gateway and Instant FX, custody and securities services, funds
  transfer agency, trade services, open banking and gateway services. The payment estate is ISO 20022
  native: pain.001, pacs.008, pacs.009 and camt.056 message types are declared inside the contracts themselves,
  in matched JSON and XML encodings. Authentication is OAuth 2.0 client-credentials over mutual TLS with
  message-level PKI signing. A sandbox estate is declared in the contracts; production access is relationship-managed
  through Citi sales.'
