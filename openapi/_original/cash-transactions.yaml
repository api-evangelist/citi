  parameters:
    client_id:
      description: >-
        Your unique ID. This is the same as the ID you used for OAuth token
        generation. Citi shared this ID with you during your Data On Demand API
        onboarding
      name: client_id
      in: header
      required: true
      schema:
        type: string
    skip:
      name: skip
      in: query
      description: The number of records to skip before returning the results
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    take:
      name: take
      in: query
      description: The maximum number of records to return
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 5000
    select:
      name: $select
      in: query
      description: >-
        The `$select` parameter in an API allows users to specify which data
        parameters (properties or columns) they want to receive in the API
        response. This helps improve efficiency by reducing the amount of data
        transferred and simplifying client-side processing.
      required: false
      schema:
        type: string
    parameter-18839:
      name: ACCT_BASE_NBR
      description: >-
        Account Base Number is an internal Citi client identifier that is
        associated to a Safekeeping or cash account.
      in: query
      required: false
      schema:
        type: string
    parameter-18841:
      name: ACCT_ID
      description: >-
        Account ID is an identifier for both a cash account and/or a safekeeping
        account that is unique within a branch.
      in: query
      required: false
      schema:
        type: string
    parameter-18842:
      name: ULTM_BENEF_ACCT
      description: >-
        Ultimate Beneficiary Account is the account number of the Ultimate
        Beneficiary.
      in: query
      required: false
      schema:
        type: string
    parameter-18843:
      name: BR_NME
      description: >-
        Branch Name is the name of the branch for the cash account and/or
        safekeeping account.
      in: query
      required: false
      schema:
        type: string
    parameter-18844:
      name: ALTV_CUR_CD
      description: Account Base Currency Code is the ISO Currency Code for the account.
      in: query
      required: false
      schema:
        type: string
    parameter-18846:
      name: SEC_GROUP
      description: >-
        Asset Type is a code representing the Asset Type of the security. 
        Values include: EQTY (Equity), FI (Fixed Income), etc.
      in: query
      required: false
      schema:
        type: string
    parameter-18847:
      name: ASRD_INCM_IND
      description: >-
        The Assured Income Indicator advises whether an income payment is
        assured (to be paid on the anticipated payment date) or actual (to be
        paid when funds are actually received).  The values are ASRD (assured)
        and ACTU (actual).
      in: query
      required: false
      schema:
        type: string
    parameter-18849:
      name: BNK_CUST_PMT_COND
      description: >-
        Bank/Customer Payment Conditions are the terms and conditions for
        payment services for financial institutions.
      in: query
      required: false
      schema:
        type: string
    parameter-18850:
      name: BNKCUST_REPMT_COND
      description: >-
        Bank/Customer Repayment Conditions are the terms and conditions for
        payment services for financial institutions.
      in: query
      required: false
      schema:
        type: string
    parameter-18851:
      name: CLNT_PFD_CUR_CD
      description: >-
        Base Currency Code is the ISO currency code preferred by the client
        organization.
      in: query
      required: false
      schema:
        type: string
    parameter-18852:
      name: BENEF
      description: The Beneficiary is the recipient (payee) of the funds.
      in: query
      required: false
      schema:
        type: string
    parameter-18853:
      name: BENEF_BNK
      description: The Beneficiary Bank  is the bank where the beneficiary has the account.
      in: query
      required: false
      schema:
        type: string
    parameter-18855:
      name: BENEF_REF
      description: >-
        Beneficiary Reference is a transaction level reference at the
        beneficiary bank side.
      in: query
      required: false
      schema:
        type: string
    parameter-18856:
      name: BR_ID
      description: >-
        Branch Code is the identifier of the branch for the account.  For the
        cash account the branch code is a numeric value and for the safekeeping
        account it is the ISO Country code.
      in: query
      required: false
      schema:
        type: string
    parameter-18858:
      name: BRKR_NME
      description: Transaction Broker Name.
      in: query
      required: false
      schema:
        type: string
    parameter-18859:
      name: BRKR_CODE
      description: Broker Code
      in: query
      required: false
      schema:
        type: string
    parameter-18860:
      name: EFF_POST_DT
      description: >-
        The contractual settlement date while the underlying transaction is not
        settled. The actual settlement date for settled transactions.
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-18861:
      name: PRIN_INC_IND
      description: >-
        Principal / Income Indicator advises if the balance is for Principal or
        Income.  Values include: P (Principal) or I (Income).
      in: query
      required: false
      schema:
        type: string
    parameter-18862:
      name: CASH_CR_AMT
      description: Cash Credit is the amount on the credit transaction
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18863:
      name: CASH_DB_AMT
      description: Cash Debit is the amount on the debit transaction
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18864:
      name: CASH_NET_AMT
      description: >-
        Cash Net Amount is the signed amount that will be credited or debited
        from the cash account.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18873:
      name: CMPNY_DESC
      description: >-
        Company Description contains information regarding the company which
        issued the security.
      in: query
      required: false
      schema:
        type: string
    parameter-18878:
      name: CONTR_PYBL_DT
      description: >-
        Contractual Settlement Date is the date when the clients cash account
        should be credited with funds on a sale (and debited on a purchase) on
        the due settlement date in place of when a trade actually settles in the
        market.
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-18880:
      name: CORP_ACTN_TYP
      description: >-
        Corporate Action Type are codes that identify the type of corporation
        action transaction.  Values include: BIDS (BID/REVERSE RIGHTS), CSHDIV
        (CASH DIVIDEND), INTR (INTEREST PAYMENT), STDIV (STOCK DIVIDEND), etc.
      in: query
      required: false
      schema:
        type: string
    parameter-18881:
      name: CORP_ACTN_TYP_NME
      description: >-
        Corporate Action Type Name is the description for the Corporate Action
        Type code.  Values include: BID/REVERSE RIGHTS (BIDS), CASH DIVIDEND
        (CSHDIV), INTEREST PAYMENT (INTR), STOCK DIVIDEND (STDIV), etc.
      in: query
      required: false
      schema:
        type: string
    parameter-18882:
      name: CORR_BNK_ACCT_NBR
      description: >-
        The Corresponding Bank Account Number is the account established by a
        banking institution to receive deposits from, make payments on behalf
        of, or handle other financial transactions for another financial
        institution.
      in: query
      required: false
      schema:
        type: string
    parameter-18883:
      name: TRAD_BRKR_NME
      description: >-
        Counterparty is the other party to the trade. The person or entity (e.g.
        institution, agent, broker) with whom a transaction is conducted).
      in: query
      required: false
      schema:
        type: string
    parameter-18886:
      name: CUM_AMRT_AMT
      description: >-
        Cumulative Amortization Amount is the amount for fixed income
        securities.  This parameter pertains to US domestic only.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18887:
      name: CUM_QTY
      description: >-
        Cumulative Quantity is the units for fixed income securities.  This
        parameter pertains to US domestic only.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18888:
      name: CURR_FCTR
      description: >-
        Current Factor is the factor which applies to the current accrual period
        to determine payments and balances for principal paying securities.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18889:
      name: DTED_TMS
      description: >-
        Dated Date/Time is the date that the interest begins to accrue on a
        fixed-income security.
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-18890:
      name: DIV_RATE
      description: >-
        The Dividend Rate is the total expected dividend payments for an
        investment on an annualized basis
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18891:
      name: ENTLMT_QTY
      description: >-
        Entitlement Quantity is the associated security holding quantity on
        which the entitlement has been calculated.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18892:
      name: ENTLMT_STS_NME
      description: >-
        Entitlements Status is a description of the current processing status of
        the entitlement.  Values include: Pending, Fully Released, Fully Paid,
        Partially Released, Partially Paid, Pending Payment, Pending, Reversal,
        Rev, To Be Received, (null), etc.
      in: query
      required: false
      schema:
        type: string
    parameter-18893:
      name: ENTRY_ID
      description: Entry ID is the two-digit National Codification Bureau (NCB) code
      in: query
      required: false
      schema:
        type: string
    parameter-18894:
      name: EVENT_CLAS_CD
      description: >-
        Event Class are codes that identify the type of Income transaction. 
        Values include:  BOT, DELD, DIV (Dividend), INT (Interest), MBSD, PAID,
        RECD, SOLD, TSFD, (null).
      in: query
      required: false
      schema:
        type: string
    parameter-18896:
      name: EX_DISTN_DT
      description: >-
        Ex Date is the trading cut off date after which position changes will no
        longer alter the eligibility to the corporate action or the date
        established by an issuer of a security for the purpose of determining
        the holders who are entitled to receive the last dividend or
        distribution.
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-18897:
      name: FED_REF_NBR
      description: >-
        The FED/CHIPS Reference Number is a unique number that is assigned by
        the Federal Reserve Bank (FED) or the Clearing House Interbank Payments
        System (CHIPS) for the transaction.
      in: query
      required: false
      schema:
        type: string
    parameter-18898:
      name: PCH_CUR_CD
      description: >-
        The FX Purchase Currency is the ISO Currency Code for the currency that
        is being purchased as part of the foreign exchange transaction.
      in: query
      required: false
      schema:
        type: string
    parameter-18900:
      name: CUR_CVN_RATE
      description: >-
        FX Rate - Local is a foreign exchange rate applied for converting the
        local currency into the base currency. The rate is effective as of the
        trade date of the transaction.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18901:
      name: SALE_CUR_CD
      description: >-
        The FX Sale Currency is the ISO 4217 Currency Code for the currency that
        is being sold as part of the foreign exchange transaction.
      in: query
      required: false
      schema:
        type: string
    parameter-18902:
      name: FACE_QTY
      description: >-
        Face Value is the original face value for Mortgage Backed Securities in
        the US domestic market. For other MBS positions this will be the current
        face value after amortization.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18905:
      name: DIV_AMT
      description: Gross Income is the gross amount received for an income transaction.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18906:
      name: GROSS_NET_IND
      description: >-
        The Gross/Net is an indicator that advises if the amount for the
        transaction is Gross or Net. Values include G (Gross), N (Net) and
        (null).
      in: query
      required: false
      schema:
        type: string
    parameter-18908:
      name: INCM_CUR_CD
      description: >-
        Income Currency Code is the ISO currency code in which income payments
        will be made for the security in the local market.
      in: query
      required: false
      schema:
        type: string
    parameter-18909:
      name: INCM_CUR_NME
      description: >-
        Income Currency Name is the name of the currency in which income
        payments will be made for the security in the local market.
      in: query
      required: false
      schema:
        type: string
    parameter-18910:
      name: BASE_INCM_ERND
      description: >-
        The Income Earned - Base is the signed income amount in the account base
        currency.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18911:
      name: LCL_INCM_ERND
      description: The Income Earned - Local is the signed income amount in local currency.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18912:
      name: INCM_IND
      description: >-
        Income Indicator.  Values include Y (Yes for Income), N (No for Income)
        and (null).  This parameter pertains to US domestic only.
      in: query
      required: false
      schema:
        type: string
    parameter-18913:
      name: INCM_QTY
      description: >-
        Income Quantity is the number of shares/units for the income payment or
        the entitlement shares or face amount for income payments.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18915:
      name: INT_PMT_COND
      description: Interest Payment Conditions provides details for income transactions.
      in: query
      required: false
      schema:
        type: string
    parameter-18921:
      name: ISS_CLF_NME
      description: >-
        Issue Classification Name is a description for the Issue Classification
        Code parameter.  This is for US ASTRA only and values include Stripped,
        UIT, Sealed-Envlp, etc.
      in: query
      required: false
      schema:
        type: string
    parameter-18922:
      name: ISS_TMS
      description: Issue Date is the date of first issue of the security.
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-18923:
      name: SEC_DESC
      description: Issue Description contains the name and other details of the instrument.
      in: query
      required: false
      schema:
        type: string
    parameter-18925:
      name: SEC_SUB_TYP_CD
      description: >-
        Issue Type Code is a code linked to the Issue Type parameter which
        describes the type of security instrument. Values include: 1 (ADR
        Convertible), 12 (Bond), 19 (Bond Convertible), etc.
      in: query
      required: false
      schema:
        type: string
    parameter-18926:
      name: SEC_SUB_TYP_NME
      description: >-
        Issue Type is a description of the type of the security instrument. 
        Values include: ADR Convertible (1), Bond (12) , Bond Convertible (19),
        etc.
      in: query
      required: false
      schema:
        type: string
    parameter-18928:
      name: ISSR_LOC_CD
      description: >-
        Issuer Location Code is the ISO country code where the issuer of the
        security is based.  Values include: AR (Argentina), CA (Canada), IE
        (Ireland), etc.
      in: query
      required: false
      schema:
        type: string
    parameter-18929:
      name: ISSR_LOC_NME
      description: >-
        Issuer Location is the name of the country where the issuer of the
        security is based.  Values include: Argentina (AR), Canada (CA), Ireland
        (IE), etc.
      in: query
      required: false
      schema:
        type: string
    parameter-18931:
      name: LCL_CUR_NME
      description: >-
        Local Currency Name is the description for the ISO currency code or it
        is the name of the local currency of the Settlement Amount.
      in: query
      required: false
      schema:
        type: string
    parameter-18933:
      name: MATY_DT
      description: >-
        Maturity Date is the date of maturity or redemption for fixed income
        securities.
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-18935:
      name: NET_DIV
      description: The Net Dividend is the net amount of the transaction.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18938:
      name: NOMINEE
      description: >-
        Nominee: role played by a Legal entity established solely for the
        purpose of registration of record ownership of securities. A custodian
        typically registers customer securities in a nominee name for ease of
        handling subsequent transfers or denomination changes, interest and
        dividend collections and other corporate actions.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18939:
      name: NOMINEE_CD
      description: >-
        The Nominee Code provides the two-digit nominee code value for the
        transaction. This parameter pertains to US domestic only.
      in: query
      required: false
      schema:
        type: string
    parameter-18941:
      name: DEAL_REF_NBR
      description: >-
        OTM Reference is the Order and Trade Manager Reference number that has
        been assigned to the order instructions.
      in: query
      required: false
      schema:
        type: string
    parameter-18942:
      name: ONE_DAY_FLO
      description: >-
        One Day Float is the time period between when a deposit is made and when
        funds become available in an account.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18943:
      name: ORD_BANK_ACCT_NO
      description: >-
        Ordering Bank Account Number is the account for the amount of money used
        to derive the financial instrument to be bought or sold.
      in: query
      required: false
      schema:
        type: string
    parameter-18944:
      name: ORD_BANK_ADR_LNE_1
      description: >-
        Ordering Bank Address1 is the first line of (1 of 4) address for the
        Ordering Bank
      in: query
      required: false
      schema:
        type: string
    parameter-18945:
      name: ORD_BANK_ADR_LNE_2
      description: >-
        Ordering Bank Address2 is the second line of (2 of 4) address for the
        Ordering Bank
      in: query
      required: false
      schema:
        type: string
    parameter-18946:
      name: ORD_BANK_ADR_LNE_3
      description: >-
        Ordering Bank Address3 is the third line of (3 of 4) address for the
        Ordering Bank
      in: query
      required: false
      schema:
        type: string
    parameter-18947:
      name: ORD_BANK_ADR_LNE_4
      description: >-
        Ordering Bank Address4 is the fourth line of (4 of 4) address for the
        Ordering Bank
      in: query
      required: false
      schema:
        type: string
    parameter-18948:
      name: ORD_BANK_NME
      description: >-
        Ordering Bank Name is the name of the institution that has been
        authorized to act on the payment of funds.
      in: query
      required: false
      schema:
        type: string
    parameter-18949:
      name: ORD_PTY_ACCT_NO
      description: >-
        Ordering Party Account Number is the account number of the instructing
        party that has authorized the payment of funds.
      in: query
      required: false
      schema:
        type: string
    parameter-18950:
      name: ORD_PTY_ADR_LNE_1
      description: >-
        Ordering Party Address1 is the first line of (1 of 4) address for the
        Ordering Party
      in: query
      required: false
      schema:
        type: string
    parameter-18951:
      name: ORD_PTY_ADR_LNE_2
      description: >-
        Ordering Party Address2 is the second line of (2 of 4) address for the
        Ordering Party
      in: query
      required: false
      schema:
        type: string
    parameter-18952:
      name: ORD_PTY_ADR_LNE_3
      description: >-
        Ordering Party Address3 is the third line of (3 of 4) address for the
        Ordering Party
      in: query
      required: false
      schema:
        type: string
    parameter-18953:
      name: ORD_PTY_ADR_LNE_4
      description: >-
        Ordering Party Address4 is the fourth line of (4 of 4) address for the
        Ordering Party
      in: query
      required: false
      schema:
        type: string
    parameter-18954:
      name: ORD_PTY_NME
      description: >-
        Ordering Party Name is the name of the instructing party that has
        authorized the payment of funds.
      in: query
      required: false
      schema:
        type: string
    parameter-18959:
      name: ORIG_BANK_ACCT_NO
      description: >-
        The Originating Bank Account Number is the account at the originating
        bank from which the transfer originated.
      in: query
      required: false
      schema:
        type: string
    parameter-18960:
      name: ORIG_BANK_ADR_LNE1
      description: >-
        Originating Bank Address Line 1 is the first line of (1 of 4) address
        for the Originating Bank
      in: query
      required: false
      schema:
        type: string
    parameter-18961:
      name: ORIG_BANK_ADR_LNE2
      description: >-
        Originating Bank Address Line 2 is the second line of (2 of 4) address
        for the Originating Bank
      in: query
      required: false
      schema:
        type: string
    parameter-18962:
      name: ORIG_BANK_ADR_LNE3
      description: >-
        Originating Bank Address Line 3 is the third line of (3 of 4) address
        for the Originating Bank
      in: query
      required: false
      schema:
        type: string
    parameter-18963:
      name: ORIG_BANK_ADR_LNE4
      description: >-
        Originating Bank Address Line 4 is the fourth line of (4 of 4) address
        for the Originating Bank
      in: query
      required: false
      schema:
        type: string
    parameter-18965:
      name: PMT_DTL_DESC
      description: >-
        Payment Details provides descriptive information regarding the
        transaction.
      in: query
      required: false
      schema:
        type: string
    parameter-18966:
      name: PLEDGE_CDE
      description: >-
        Pledge Code is a 10 digit numeric number corresponding to the
        DTC(Depository Trust Company) participant number in a pledge.
      in: query
      required: false
      schema:
        type: string
    parameter-18967:
      name: POOL_ID_CD
      description: >-
        Pool ID is an alphanumeric code that identifies a particular mortgage
        backed security.
      in: query
      required: false
      schema:
        type: string
    parameter-18969:
      name: PFD_ISS_ID
      description: >-
        Security ID is the most commonly used identifier for the security in a
        given market.
      in: query
      required: false
      schema:
        type: string
    parameter-18971:
      name: PREV_FCTR
      description: >-
        The factor which applies for the previous accrual period to determine
        payments and balances for principal paying securities. Currently
        applicable to the US intraday cash transactions.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18972:
      name: PRNCSH_CMB_AMT
      description: >-
        Principal Cash is the consideration amount. On the Buy side, it is
        comprised of the broker commission + tax + security fee. On the Sell
        side, it is comprised of the broker commission - tax - security fee.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18973:
      name: PRIN_QTY
      description: Principal Quantity is the quantity for principal transactions.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18974:
      name: PRCD_CMB_AMT
      description: >-
        Proceeds - Local is the amount, in the market currency, for a sale
        and/or loan transaction.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18975:
      name: PRDCT_NME
      description: >-
        Product Name is a high level description for the cash transaction 
        Values include: Data Entry (DE), Foreign Exchange Movement (FX), Funds
        Transfer (FT), Money Market Movement (MM), Security Settlement Advice
        (SC), (null).
      in: query
      required: false
      schema:
        type: string
    parameter-18976:
      name: PRDCT_TYP
      description: >-
        Product Type is a 2-digit high level description for the cash
        transaction  Values include: DE (Data Entry), FX (Foreign Exchange
        Movement), FT (Funds Transfer), MM (Money Market Movement ), SC
        (Security Settlement Advice), (null).
      in: query
      required: false
      schema:
        type: string
    parameter-18977:
      name: RCEV_DIV_AMT
      description: Received Dividend Amount is the dividend amount of the  transaction.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-18978:
      name: RCEV_DIV_CUR_CD
      description: >-
        Received Dividend Currency is the ISO 4217 Currency Code for the
        dividend amount.
      in: query
      required: false
      schema:
        type: string
    parameter-18981:
      name: REC_DT
      description: >-
        Record Date is the date established by the issuer of a security for the
        purpose of determining the holders who are entitled to receive a
        dividend or distribution or is the cut off date to determine which
        holders of the security are eligible.
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-18983:
      name: RELD_REF
      description: Related Reference as provided on a SWIFT message.
      in: query
      required: false
      schema:
        type: string
    parameter-18985:
      name: SUB_DIVSN_ID
      description: >-
        Reversal Indicator (FX) notes whether or not the  transaction was
        processed to reverse an earlier transaction.  Values include: N, R, Y,
        (null)
      in: query
      required: false
      schema:
        type: string
    parameter-18986:
      name: SID_SEDOL
      description: >-
        SEDOL (Stock Exchange Daily Official List) is a unique identification
        code, consisting of seven alphanumeric characters, that is assigned to
        all securities trading on the London Stock Exchange.
      in: query
      required: false
      schema:
        type: string
    parameter-18987:
      name: SK_ACCT_ID
