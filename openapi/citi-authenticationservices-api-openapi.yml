components:
  schemas:
    oAuthToken:
      title: oAuthTokenRequest
      description: The request body for the V1 authentication service to retrieve an OAuth token.
      properties:
        grantType:
          type: string
          description: You must always pass 'client_credentials' in this field because Citi only provides credentials-based authentication for API users.
        merchantId:
          type: string
        scope:
          type: string
          description: This is the version scope of the authentication call. Note that this value will be the same for ALL versions of the Authentication API and should be `/authenticationservices/v1`.
        sourceApplication:
          type: string
          description: This represents the route of the authentication call within CitiConnect API.
          enum:
          - CCF
        userDetails:
          $ref: '#/components/schemas/UserDetailsType'
      required:
      - grantType
      - scope
      example:
        grantType: client_credentials
        scope: /authenticationservices/v1
      xml:
        namespace: http://com.citi.citiconnect/services/types/oauthtoken/v1
    token:
      title: oAuthTokenResponse
      description: The response body for the V1 authentication service to retrieve an OAuth token.
      properties:
        token_type:
          type: string
          description: The default value will be “Bearer”.
        access_token:
          type: string
          description: Contains the OAuth Token that will be used for authenticating successive API calls.
        expires_in:
          type: string
          description: The expiry time limit of the OAuth Token in seconds.
        scope:
          type: string
          description: The version scope of the authentication call. The value will be the same for all the API versions.
    UserDetailsType:
      title: UserDetailsType
      type: object
      properties:
        userId:
          type: string
          xml:
            name: userId
            attribute: false
            wrapped: false
        userIdType:
          type: string
          xml:
            name: userIdType
            attribute: false
            wrapped: false
          enum:
          - SAFEWORD
      xml:
        name: userDetailsType
        attribute: false
        wrapped: false
    oAuthToken_2:
      title: oAuthTokenRequest
      description: The request body for the V2 authentication service to retrieve an OAuth token.
      properties:
        grantType:
          type: string
          description: You must always pass 'client_credentials' in this field because Citi only provides credentials-based authentication for API users.
        merchantId:
          type: string
        scope:
          type: string
          description: This is the version scope of the authentication call. Note that this value will be the same for ALL versions of the Authentication API and should be `/authenticationservices/v1` (even for versions 2, 3, and 4).
        sourceApplication:
          type: string
          description: This represents the route of the authentication call within CitiConnect API.
          enum:
          - CCF
        userDetails:
          $ref: '#/components/schemas/UserDetailsType'
      required:
      - grantType
      - scope
      example:
        grantType: client_credentials
        scope: /authenticationservices/v1
      xml:
        namespace: http://com.citi.citiconnect/services/types/oauthtoken/v1
    token_2:
      title: oAuthTokenResponse
      description: The response body for the V2 authentication service to retrieve an OAuth token.
      properties:
        token_type:
          type: string
          description: The default value will be “Bearer”.
        access_token:
          type: string
          description: Contains the OAuth Token that will be used for authenticating successive API calls.
        expires_in:
          type: string
          description: The expiry time limit of the OAuth Token in seconds.
        scope:
          type: string
          description: The version scope of the authentication call. The value will be the same for all the API versions.
    Request:
      properties:
        oAuthToken:
          $ref: '#/components/schemas/OAuthTokenType'
    OAuthTokenType:
      required:
      - grantType
      - scope
      properties:
        grantType:
          type: string
          description: You must always pass 'client_credentials' in this field because Citi only provides credentials-based authentication for API users.
          xml:
            name: grantType
            attribute: false
            wrapped: false
        scope:
          type: string
          description: This is the version scope of the authentication call. Note that this value will be the same for ALL versions of the Authentication API and should be `/authenticationservices/v1` (even for versions 2, 3, and 4).
          xml:
            name: scope
            attribute: false
            wrapped: false
      example:
        grantType: client_credentials
        scope: /authenticationservices/v1
      xml:
        namespace: http://com.citi.citiconnect/services/types/oauthtoken/v1
    Response:
      title: oAuthTokenResponse
      description: The response body for the v3 authentication service to retrieve an OAuth token.
      type: object
      properties:
        token:
          required:
          - access_token
          - expires_in
          - scope
          type: object
          properties:
            access_token:
              type: string
              description: Contains the OAuth Token that will be used for authenticating successive API calls.
            token_type:
              type: string
              description: Default value will be “Bearer".
            scope:
              type: string
              description: The version scope of the authentication call. The value will be the same for all the API versions.
            expires_in:
              type: string
              description: The expiry time of the OAuth Token in seconds.
          xml:
            name: Token
      example:
        token:
          token_type: Bearer
          access_token: 
          expires_in: '1800'
          scope: /authenticationservices/v1
    ErrorMessage:
      required:
      - httpCode
      properties:
        httpCode:
          type: integer
          format: int32
        httpMessage:
          type: string
      xml:
        name: errormessage
    Request_2:
      properties:
        oAuthToken:
          $ref: '#/components/schemas/OAuthTokenType_2'
      title: Request
    OAuthTokenType_2:
      required:
      - grantType
      - scope
      title: OAuthTokenType
      properties:
        grantType:
          type: string
          title: grantType
          description: You must always pass 'client_credentials' in this field because Citi only provides credentials-based authentication for API users.
          xml:
            name: grantType
            attribute: false
            wrapped: false
        scope:
          type: string
          title: scope
          description: This is the version scope of the authentication call. Note that this value will be the same for ALL versions of the Authentication API and should be `/authenticationservices/v1` (even for versions 2 and 3).
          xml:
            name: scope
            attribute: false
            wrapped: false
      example:
        grantType: client_credentials
        scope: /authenticationservices/v1
      xml:
