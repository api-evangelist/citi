- aid: citi:citi-payments-api
  name: Citi Payments API
  description: >-
    Use the Payments endpoint to initiate and track instant payments.

    While all payments can be sent through a single CitiConnect API, it is important to observe local
    country requirements to avoid rejects and returned transactions. The table below shows the minimum
    fields required to initiate a Thailand Instant Payment transaction. For a full list of fields please
    refer to the swagger files shared by your Citi representative. To ensure that a payment is initiated
    correctly:


    * Ensure you have the required datapoints to initiate a transaction in the country where your payee
    is located.

    * Make a ``POST`` request to the `/paymentservices/v1/payments` endpoint and include the required
    information inside the payload of the request to initiate the transaction.
