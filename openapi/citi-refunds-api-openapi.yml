          type: string
          maxLength: 200
          description: "Transaction Status, following status you will receive in response \n- FAILED - Transaction failed for invalid payload/ Transaction failed \n- PENDING - The operation is currently in progress or pending processing/ Transaction is in-progress \n- SETTLED - Transaction settled \n- SUCCESS - The operation was successfully processed (e.g., \n- AM03 -Method instructed currency is invalid (not in ISO 4217 format or value) \n- AM02 -Instructed amount is not ≥ 0.01 & ≤ 2,000,000.00.\n- AC02 -Debtor account is invalid \n- CH03 -Value date is in the future \n- CH04 -Value date is in the past \n- CH20 -Value-added tax (VAT) amount format is invalid \n- CH21 -Bill identification 1 is mandatory for a bill payment,Bill identification 2 and 3 are conditional for a bill payment \n- BE23 -Creditor mobile number (proxy identification) format is invalid \n- NARR -Creditor name maximum length is 50 )"
          example: Transaction settled
          title: description
        status_date_time:
          type: string
          format: date-time
          description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Date time of transaction status \n- This parameter is optional for ACH Return & Reversal."
          title: status_date_time
        refund_type:
          type: string
          description: Refund Status P - Partial Refund F - Full Refund
          enum:
          - P
          - F
          title: refund_type
        authorization_response:
          $ref: '#/components/schemas/Authorization-Refund-Response'
        acquirer:
          $ref: '#/components/schemas/Acquirer-Refund-Response'
        response:
          $ref: '#/components/schemas/Response'
        acquirer_code:
          description: Indicates success or failure of the transaction registration. A value of 0 (zero) indicates success, and a value of 99 indicates failure.
          example: ACQ7894561
          maxLength: 100
          minLength: 1
          type: string
          title: acquirer_code
        reference:
          description: "An optional identifier for this transaction \n- This parameter is optional for ACH Return & Reversal."
          example: REPAY789541
          maxLength: 250
          minLength: 1
          type: string
          title: reference
        terminal:
          description: Identifier used by the acquirer to identify the transaction. This identifier may be used by the acquirer in settlement reports.
          example: ACQ7894561
          maxLength: 16
          minLength: 1
          type: string
          title: terminal
        update_time:
          type: string
          format: date-time
          description: Indicates the date and time the gateway considers the order to have last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ)
          example: '2022-09-13T08:23:49.114Z'
          title: update_time
        acquirer_message:
          description: An additional message indicating the success or failure of the transaction registration. If the registration was successful, this parameter contains the value Data Received. If the registration failed, this parameter contains the value Data Not Received.
          example: MSG12345
          maxLength: 255
          minLength: 1
          type: string
          title: acquirer_message
        refund_authorization:
          description: "This parameter is used to indicate that you want the gateway to authorize the Refund with the issuer before submitting it to the acquirer. \n - The transaction.refund_authorization parameter is optional for Card transaction."
          enum:
          - Y
          - N
          example: Y
          type: string
          title: refund_authorization
        clearing_local_code:
          maxLength: 4
          minLength: 1
          type: string
          description: "Reason local Clearing codes (e.g.0000,0080,0081,0082,0083,0084,1100 and etc.).Additional status code received from the local clearing which does not follow ISO standards but will on some occasions provide additional insights. Codes will vary by country and will be published on our developer portal \n- For UK it is an optional parameter with max length 4 \n- For US FedNow, it is an optional parameter with max length 4 \n- refer to FPS Error Code excel file for complete list of response codes and descriptions. \n- This parameter is optional for ACH Return and Reversal."
          example: 008T
          title: clearing_local_code
        rrn:
          maxLength: 100
          minLength: 1
          type: string
          description: A unique reference generated by the acquirer for a specific merchant interaction The reference may be used when contacting the acquirer about a specific transaction
          example: 008T
          title: rrn
        stan:
          maxLength: 999999
          minLength: 1
          type: string
          description: The System Trace Audit Number (STAN) for the transaction The STAN is a unique trace number assigned by the gateway to identify the transaction message sent to the acquirer. It remains unchanged for the life of the transaction.
          example: '667799'
          title: stan
        authorization_code:
          maxLength: 100
          minLength: 1
          type: string
          description: Value generated by the issuing bank in response to a proposal to transfer funds
          example: '667'
          title: authorization_code
        source:
          description: "Indicates the channel through which you received authorization for the payment for this order from the payer. \n- CALL_CENTRE Transaction conducted via a call centre. \n- CARD_PRESENT Transaction where the card is presented to the merchant. \n- INTERNET Transaction conducted over the Internet. \n- MAIL_ORDER Transaction received by mail. \n- MERCHANT Transaction initiated by you based on an agreement with the payer. For example, a recurring payment, installment payment, or account top-up. \n- MOTO Transaction received by mail or telephone. \n- PAYER_PRESENT Transaction where a non-card payment method is presented to the Merchant. \n- TELEPHONE_ORDER Transaction received by telephone.\n- VOICE_RESPONSE Transaction conducted by a voice/DTMF recognition system."
          enum:
          - CALL_CENTRE
          - CARD_PRESENT
          - INTERNET
          - MAIL_ORDER
          - MERCHANT
          - MOTO
          - PAYER_PRESENT
          - TELEPHONE_ORDER
          - VOICE_RESPONSE
          example: PAYER_PRESENT
          type: string
          title: source
        debit_credit_flag:
          type: string
          enum:
          - CR
          - DR
          description: "Indicates if transaction is debit or credit \n- This parameter is optional for ACH Return & Reversal."
          title: debit_credit_flag
        action:
          description: "Indicates if this request is for Return or Reversal \n- This parameter is optional for ACH Return & Reversal."
          enum:
          - RETURN
          - REVERSAL
          example: RETURN
          type: string
          title: action
        purpose:
          description: "Purpose of transaction. \n- This parameter is optional for ACH Return & Reversal."
          minLength: 1
          maxLength: 100
          type: string
          example: AWS Market
          title: purpose
    Error-Detail:
      type: object
      title: Error Detail
      properties:
        issue:
          type: string
          maxLength: 150
          description: more details about the issue
          title: issue
        action:
          type: string
          maxLength: 150
          description: corrective action to be taken to resolve above issue
          title: action
        code:
          type: string
          maxLength: 10
          description: unique code representing the issue
          title: code
    Authorization-Response:
      title: Authorization-Response
      description: Authorization Response
      properties:
        stan:
          description: The System Trace Audit Number is assigned by a transaction originator to assist in identifying a Card Transaction.The trace number remains unchanged for the life of the Card Transaction.
          example: AUD345
          maxLength: 6
          minLength: 1
          type: string
          title: stan
        merchant_advice_code:
          description: This parameter contains data returned by the issuer or card network to clearly communicate to merchants the reason for declining a MasterCard or Visa transaction Merchants can use this information to determine the best action to take.
          example: '2'
          maxLength: 2
          minLength: 1
          type: string
          title: merchant_advice_code
        pos_entry_mode:
          description: The POS Entry Mode provided to Discover (JCB (US Domestic only), and Diners) for the authorization
          example: '2'
          maxLength: 4
          minLength: 1
          type: string
          title: pos_entry_mode
        return_aci:
          description: The ACI (Authorization Characteristics Indicator) returned by the issuer
          example: '1'
          maxLength: 1
          minLength: 1
          type: string
          title: return_aci
        avscode:
          description: The acquirer AVS response code generated by the card issuing institution
          example: '1'
          maxLength: 100
          minLength: 1
          type: string
          title: avscode
        commercial_card_indicator:
          description: Indicates the type of commercial card as returned by the card issuer
          example: '1'
          maxLength: 3
          minLength: 1
          type: string
          title: commercial_card_indicator
        date:
          type: string
          description: "The local date, in MMDD format, on which the transaction occurred. \n- Format MMDD"
          title: date
          example: '0530'
        financial_network_code:
          description: Indicates the code of the financial network that was used to process the transaction with the issuer.
          example: '1'
          maxLength: 3
          minLength: 1
          type: string
          title: financial_network_code
        financial_network_date:
          type: string
          format: date
          description: "The date for the Authorization as returned by the scheme. \n- Format YYYY-MM-DD"
          example: '2024-05-30'
          title: financial_network_date
        pos_data:
          description: Indicates the specific card information conditions for capture that are available when the card transaction occurs at point of service.
          example: '1'
          maxLength: 13
          minLength: 3
          type: string
          title: pos_data
        processing_code:
          description: Identifies the type of Card Transaction sent to Card Acceptor
          example: '1'
          maxLength: 6
          minLength: 1
          type: string
          title: processing_code
        response_code:
          description: The response code which indicates the status of the transaction
          example: '1'
          maxLength: 3
          minLength: 1
          type: string
          title: response_code
        time:
          type: string
          format: date-time
          description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment (Credit) - Date time, either provided by the debtor bank or generated by Citi's transaction processing application, when a transaction was created \n- For US RFP this parameter is mandatory"
          example: '2022-09-13T08:23:49.114Z'
          title: time
        transaction_identifier:
          description: The unique identifier for the transaction returned by the issuer.
          example: '1'
          maxLength: 30
          minLength: 1
          type: string
          title: transaction_identifier
    Refund-Update-Method:
      type: object
      title: Refund-Notification Method
      properties:
        card:
          $ref: '#/components/schemas/Card-Refund-Update-Notification'
        type:
