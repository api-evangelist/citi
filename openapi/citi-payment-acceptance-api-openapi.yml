    Transaction-Update:
      type: object
      title: Transaction Update
      required:
      - id
      properties:
        id:
          description: "Unique Transaction identification provided by the merchant during  transaction update  \n- For CARD operations transaction.id parameter mandatory and allowed maxmium length is 40. \n- For ACH transaction, transaction.id parameter is mandatory and allowed maxmium length is 40. \n- For Brazil PIX Cancellation, this parameter is mandatory with min length 26 & max length 35 alphanumeric characters and the value should be same as sent during PIX Initiation request \n- For India CARD cancel transaction, transaction.id parameter mandatory and allowed maxmium length is 50."
          example: pay02052023456r
          maxLength: 128
          minLength: 1
          type: string
          title: id
        expiry_time:
          type: integer
          format: int32
          minimum: 10
          description: "Expiration time for QR collection, specified in seconds \n- QR Creation request will be rejected, if Expiration time value is less than 10 "
          example: 3600
          title: expiry_time
        amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000000
          description: "Transaction amount \n - For Brazil QR Update decimal values are mandatory for transaction.amount and it must have 2 digits \n - For Brazil QR Update maxmium amount limit is 9999999999.99 \n- For CARD Update Authorization operation transaction.amount parameter is mandatory \n- For CARD Void/Cancel operation transaction.amount parameter is mandatory"
          example: 200
          title: amount
        reference:
          description: "Transaction additional information. \n- For Brazil PIX Cancellation, this parameter is mandatory with min length 26 & mmax length 35 and input should be same as unique identifier (transaction.id) given during PIX Initiation"
          example: REPAY
          maxLength: 250
          minLength: 1
          type: string
          title: reference
        currency_code:
          type: string
          enum:
          - BRL
          - USD
          - INR
          - GBP
          description: "ISO 4217 Currency Code for instance  USD/GBP/EUR. \n- For CARD Update Authorization operation transaction.currency_code parameter is mandatory \n- For CARD Void/Cancel operation transaction.currency_code parameter is mandatory \n- For ACH Void/Cancel transaction, transaction.currency_code parameter is mandatory \n- For India Card Cancel transaction, transaction.currency_code parameter is mandatory"
          example: BRL
          title: currency_code
        country_code:
          description: "The order country. n- For CARD Update Authorization operation transaction.country_code parameter is mandatory \n- For CARD Void/Cancel operation transaction.country_code parameter is mandatory \n- For ACH Void/Cancel transaction, transaction.country_code parameter is mandatory \n- For Brazil PIX Cancellation, this parameter is mandatory \n- For India Card Cancel transaction, transaction.country_code parameter is mandatory"
          enum:
          - US
          - BR
          - IN
          - GB
          example: US
          type: string
          title: country_code
        reason:
          description: "Cancellation/refund/adjustment reason. \n- For Brazil PIX Cancellation, this parameter is mandatory with max length 4 and allowed values are:<br> ACCT - Transactional Account Closure<br>BLCK - Transactional Account Blocking<br> CCLD -  Cancellation of authorization for periodic payments<br> FAIL - Cancellation of the commitment for periodic payments<br> OTHR - Cancellation of the commitment for periodic payments<br>SLBD - Requested by the paying user<br> SLCR - Requested by the receiving user"
          example: REPAY
          maxLength: 140
          minLength: 1
          type: string
          title: reason
        url:
          $ref: '#/components/schemas/Url-Update'
        target_transaction_id:
          description: "The identifier for the transaction you wish to refund, That is the {transactionId} URL parameter for REST and the transaction.id parameter for NVP. \n- For CARD Void/Cancel operation transaction.target_transaction_id parameter is mandatory \n- For ACH Void/Cancel transaction, transaction.target_transaction_id parameter is mandatory"
          example: T123456789
          maxLength: 40
          minLength: 1
          type: string
          title: target_transaction_id
        acquirer:
          $ref: '#/components/schemas/Acquirer'
        charge_amount:
          description: The amount of the additional fee that you are charging the payer.
          example: '20.0'
          maxLength: 14
          minLength: 1
          type: string
          title: charge_amount
        charge_type:
          description: The type of the additional fee that you are charging the payer.
          enum:
          - SURCHARGE
          example: SURCHARGE
          type: string
          title: charge_type
        correlation_id:
          description: A transient identifier for the request, that can be used to match the response to the request.
          example: TEFG123456
          maxLength: 128
          minLength: 1
          type: string
          title: correlation_id
        update_flag:
          type: string
          enum:
          - Y
          - N
          description: For QR Creation (ex. Brazil), during transaction processing if the merchant want to allow his client to change QR Amount then the value should be Y otherwise default value will be N
          example: Y
          title: update_flag
        qr_image:
          type: string
          enum:
          - Y
          - N
          description: Merchant to confirm QR Image is required or not, If required value should be Y
          example: Y
          title: qr_image
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
