        type: string
    parameter-53384:
      name: PFD_ISS_ID
      description: >-
        Security ID is the most commonly used identifier for the security in a
        given market.
      in: query
      required: false
      schema:
        type: string
    parameter-53385:
      name: SEC_SHRT_NME
      description: Issue Name is the Security Name of the security instrument.
      in: query
      required: false
      schema:
        type: string
    parameter-53386:
      name: SID_ISIN
      description: >-
        ISIN (International Securities Identification Number) is a 12-character
        alpha-numerical code governed by ISO 6166 it is a uniform identification
        of a security at trading and settlement. This data is sourced from
        multiple sources and will be provided if available.
      in: query
      required: false
      schema:
        type: string
    parameter-53387:
      name: CLIENT_SEC_REF
      description: >-
        Calcualtion Method indixates the calculation rule used to compute the
        penalty. Values are CASH, MIXE, SECU, BOTH).
      in: query
      required: false
      schema:
        type: string
    parameter-53388:
      name: CLIENT_REF
      description: >-
        Number of Days is the number of days over which a late matching penalty
        has been calculated.
      in: query
      required: false
      schema:
        type: string
    parameter-53389:
      name: TRADE_DT
      description: Date when the trade was agreed on with counterparty.
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-53390:
      name: SEC_PEN_RT
      description: Security penalty rate applied in the calculation of the penalty.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-53391:
      name: CNTR_SETL_DT
      description: >-
        Penalty Type indicates whether the penalty is a late matching fail
        penalty (LMFP) or a settlement fail penalty (SEFP).
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-53392:
      name: POST_QTY
      description: >-
        Quantity provides the number of units, par value or nominal value (for
        fixed income instruments), amount of currency (for FX transactions), or
        number of shares. Indicates the contract quantity on the original
        transaction that was given up.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-53393:
      name: POST_AMT_CURR
      description: Settlement Currency is the currency name for the Settlement Amount.
      in: query
      required: false
      schema:
        type: string
    parameter-53394:
      name: POST_AMT
      description: Settlement Amount is the cash value of the trade in the market currency.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-53407:
      name: RPT_PER_DT_START
      description: >-
        The date calculated based on the Period chosen as the start date for the
        report.
      in: query
      required: true
      schema:
        type: string
        format: date-time
    parameter-53408:
      name: RPT_PER_DT_END
      description: >-
        The date calculated based on the Period chosen as the end date for the
        report.
      in: query
      required: true
      schema:
        type: string
        format: date-time
    parameter-53424:
      name: ACCT_ID
      description: >-
        Account ID is an identifier for both a Cash Account and/or a Safekeeping
        Account that is unique within a branch.
      in: query
      required: false
      schema:
        type: string
    parameter-53425:
      name: ACCT_NME
      description: >-
        Account Name is the name that is assigned to the Cash Account and/or the
        Safekeeping Account. If an Alternate Account Name has been specified for
        an account it will be displayed as the Account Name.
      in: query
      required: false
      schema:
        type: string
    parameter-53426:
      name: CPRT_ACCT_SER_NAME
      description: >-
        Counterparty's Account Servicer/Depository is the name of the
        counterparty's account servicer/depository.
      in: query
      required: false
      schema:
        type: string
    parameter-53427:
      name: RPT_PER_DT_START
      description: >-
        The date calculated based on the Period chosen as the start date for the
        report.
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-53428:
      name: RPT_PER_DT_END
      description: >-
        The date calculated based on the Period chosen as the end date for the
        report.
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-53429:
      name: CASH_ACCT_ID
      description: >-
        Cash Account ID is the account number for the cash account. It is unique
        within a branch.
      in: query
      required: false
      schema:
        type: string
    parameter-53430:
      name: CPRT_NET_AMT_CURR
      description: Net Amount Currency is the currency of the Net Amount.
      in: query
      required: false
      schema:
        type: string
    parameter-53431:
      name: AGGR_AMT
      description: >-
        The global net amount for a party is the sum of all cash penalties in
        this currency that this party is entitled to receive minus the sum of
        all cash penalties in this currency that are imposed to the party. A
        positive amount indicates that the party will be credited with this
        amount; a negative amount indicates that the amount will be debited.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-53432:
      name: PFOD_MESG_ID
      description: Reference of the penalty payment.
      in: query
      required: false
      schema:
        type: string
    parameter-53433:
      name: ACCT_SERVR_BIC
      description: >-
        Account Servicer/Depository BIC is the Bank Identifier code of the party
        which administers the account.
      in: query
      required: false
      schema:
        type: string
    parameter-53434:
      name: CURRENCY
      description: Currency in which the penalties are expressed.
      in: query
      required: false
      schema:
        type: string
    parameter-53435:
      name: RLTD_PARTY_BIC
      description: >-
        Identification of the party reported as party imposed with the penalties
        reported or party credited with the penalty(ies).
      in: query
      required: false
      schema:
        type: string
    parameter-53436:
      name: PARTY_TYPE
      description: Specifies the role of the party in the transaction.
      in: query
      required: false
      schema:
        type: string
    parameter-53437:
      name: CPRT_BIC
      description: >-
        Counterparty BIC is the Bank Identifier code of the party imposed with
        the penalties reported or party credited with the penalty(ies).
      in: query
      required: false
      schema:
        type: string
    parameter-53438:
      name: CPRT_TYPE
      description: Specifies the role of the counterparty in the transaction.
      in: query
      required: false
      schema:
        type: string
    parameter-53439:
      name: CPRT_NET_AMT
      description: >-
        The bilateral net amount for a party and counterpart will be the sum of
        all cash penalties in this currency that this party is entitled to
        receive (reported as credit) from the same counterpart (that is, to be
        paid by this counterpart) minus the sum of all cash penalties in this
        currency that are imposed to the party (reported as debit) and to be
        paid to the given counterpart.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-53440:
      name: COM_REF
      description: >-
        Common Reference is assigned by the market infrastructure (for example
        T2S) to the penalty and that is common for both the failing and the
        non-failing participant.
      in: query
      required: false
      schema:
        type: string
    parameter-53441:
      name: PENALTY_REF
      description: >-
        Reference is assigned by the market infrastructure to the penalty and is
        the individual identification of the penalty for the relevant account
        owner (that is, either for the failing participant or for the
        non-failing participant).
      in: query
      required: false
      schema:
        type: string
    parameter-53442:
      name: PENALTY_TYP_CD
      description: >-
        Penalty Type indicates whether the penalty is a late matching fail
        penalty (LMFP) or a settlement fail penalty (SEFP).
      in: query
      required: false
      schema:
        type: string
    parameter-53443:
      name: PENALTY_AMT_COMP
      description: >-
        Indicates whether or not the amount calculated for the reported penalty
        will be added to the aggregated amounts at global level. There could be
        several reasons for not considering the penalty amount. The flag is used
        to indicate an exceptional situation. If the flag is not reported in the
        message this means that the penalty is considered for the calculation of
        aggregated amounts.
      in: query
      required: false
      schema:
        type: integer
        format: int32
    parameter-53444:
      name: PENALTY_AMT
      description: >-
        Penalty Amount is calculated based on the security and instruction
        characteristics and the reason for the fail. For a Late Matching Fail
        Penalty (LMFP) that spans several business days, this amount is the sum
        of the amounts calculated for each applicable business day.
      in: query
      required: false
      schema:
        type: integer
        format: int32
    parameter-53445:
      name: CALC_METHOD
      description: >-
        Calcualtion Method indixates the calculation rule used to compute the
        penalty. Values are CASH, MIXE, SECU, BOTH).
      in: query
      required: false
      schema:
        type: string
    parameter-53446:
      name: NBR_OF_DAYS
      description: >-
        Number of Days is the number of days over which a late matching penalty
        has been calculated.
      in: query
      required: false
      schema:
        type: integer
        format: int32
    parameter-53447:
      name: ACCT_OWN_TX_ID
      description: Reference assigned to the reported transaction by the account owner.
      in: query
      required: false
      schema:
        type: string
    parameter-53448:
      name: ACCT_SEC_TX_ID
      description: Reference assigned to the reported transaction by the account servicer.
      in: query
      required: false
      schema:
        type: string
    parameter-53449:
      name: PROCESSOR_TX_ID
      description: >-
        Identification of the transaction assigned by the processor of the
        instruction other than the account owner/the account servicer and the
        market infrastructure.
      in: query
      required: false
      schema:
        type: string
    parameter-53450:
      name: MKT_INFR_TX_ID
      description: >-
        Identification of a transaction assigned by a market infrastructure
        other than a central securities depository, for example,
        Target2-Securities.
      in: query
      required: false
      schema:
        type: string
    parameter-53451:
      name: COMMON_ID
      description: >-
        Unique reference agreed upon by the Investment Manager and the
        Broker/Dealer to identify the trade. This reference should be passed
        down and up through the whole life cycle of the transaction.
      in: query
      required: false
      schema:
        type: string
    parameter-53452:
      name: CORP_ACT_EV_ID
      description: >-
        Reference assigned by the account servicer to unambiguously identify a
        related corporate action event.
      in: query
      required: false
      schema:
        type: string
    parameter-53453:
      name: RELATED_TX_ID
      description: Reference of the linked message which was previously received.
      in: query
      required: false
      schema:
        type: string
    parameter-53454:
      name: PEN_PY_DT
      description: >-
        Payment Date is the date at which the last payment on the entitlement
        was made. Or Date/time at which the movement is due to take place (cash
        and/or securities).
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-53455:
      name: CPRT_ACCT_SER_BIC
      description: >-
        Counterparty's Account Servicer/Depository BIC is the Bank Identifier of
        the counterparty's account servicer/depository.
      in: query
      required: false
      schema:
        type: string
    parameter-53456:
      name: PENALTY_DETEC_DT
      description: >-
        Penalty Detection Date is the day for which the penalty was computed.
        /nIt is the date on which the instruction matched for Late Matching Fail
        Penalty (LMFP) or the date on which an instruction fails to settle for
        Settlement Fail Penalty (SEFP). /nNote: This date is not updated upon
        re-calculation of the penalty and always relates to the business day for
        which the penalty was initially computed.
      in: query
      required: true
      schema:
        type: string
        format: date
    parameter-53457:
      name: PENALTY_STATUS
      description: >-
        Penalty status is to check if penalty is active or inactive for a given
        record.
      in: query
      required: true
      schema:
        type: string
  securitySchemes:
    client-Credential-Oauth-Security-Schema:
      type: oauth2
      description: This API uses OAuth 2 with the client credentials flow
      flows:
        clientCredentials:
          tokenUrl: /markets/api/oauth2/token
          scopes:
            /dod: Access to Cash Balances Information
