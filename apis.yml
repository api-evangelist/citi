- aid: citi:citi-beneficiary-validation-api
  name: Citi Beneficiary Validation API
  description: >-
    Before initiating payment, POST beneficiary validation details to confirm that you are sending to
    the correct beneficiary. Validating beneficiary information is a two-step process:

    1. Make a POST request to the `/paymentservices/v1/beneficiaryvalidations` endpoint and include the
    required information inside the payload of the request to initiate the transaction.<br/><br/>

    You will receive an initial response, usually within 5 seconds, verifying that your request was received
    and indicating whether it was accepted. If your request was not accepted, check the request and resubmit
    it.

    2. When you receive the response to your POST request, retrieve the beneficiary details by making
    a GET request to the `/paymentservices/v1/beneficiaryvalidations/UETR`value endpoint, using the UETR
    value from your initial response.
  humanURL: https://developer.citi.com/apidocs/authentication/authentication-only-guide
