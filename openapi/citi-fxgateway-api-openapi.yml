g response = responseReader.ReadToEnd(); \n Console.Out.WriteLine(response); \n } \n }catch (Exception e) \n { \n Console.Out.WriteLine(\"-----------------\"); \n Console.Out.WriteLine(e.Message); \n } \n \n } \n } \n}"
