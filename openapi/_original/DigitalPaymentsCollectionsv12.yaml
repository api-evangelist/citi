    Card-Refund-Update-Notification:
      title: card
      description: Card refund update Response
      properties:
        number:
          description: >-
            The account number of the payer's account used for the payment. On
            requests, provide the number in the form that you receive it (as
            explained below). On responses, the gateway populates it with a form
            that the payer would recognize.
          example: PA123456789
          maxLength: 23
          minLength: 9
          type: string
          title: number
        expiry_month:
          description: Two-digit month in which the payment card expires.
          example: '01'
          type: string
          pattern: ^(0?[1-9]|1[0-2])$
          title: expiry_month
        expiry_year:
          description: Four-digit year in which the payment card expires.
          type: string
          pattern: ^[0-9]{2,2}$
          example: '25'
          title: expiry_year
        encryption:
          description: >-
            The encryption framework used for the payment details received by
            the gateway.
          enum:
            - DEVICE
            - DIGITAL_WALLET
            - DUKPT
          example: DEVICE
          type: string
          title: encryption
        device:
          $ref: '#/components/schemas/Device-Response'
        device_specific:
          $ref: '#/components/schemas/Device-Specific-Response'
    Card-Refund-Response:
      title: card
      description: Card Method Response
      properties:
        brand:
          description: >-
            The brand name used to describe the card that is recognized and
            accepted globally. For many major card types this will match the
            scheme name. In some markets, a card may also be co-branded with a
            local brand that is recognized and accepted within its
            country/region of origin (see card.localBrand).You may use this
            information to support surcharging decisions. This information is
            gathered from 3rd party sources and may not be accurate in all
            circumstances. 

            - For Card transaction, card.brand parameter is mandatory
          enum:
            - AMEX
            - CHINA_UNIONPA
            - DINERS_CLUB
            - DISCOVER
            - JCB
            - LOCAL_BRAND_ONLY
            - MAESTRO
            - MASTERCARD
            - RUPAY
            - UATP
            - UNKNOWN
            - VISA
          example: AMEX
          type: string
          title: brand
        scheme:
          description: >-
            The organization that owns a card brand and defines operating
            regulations for its use. The card scheme also controls authorization
            and settlement of card transactions among issuers and acquirers. 

            - For Card transaction, card.scheme parameter is mandatory
          enum:
            - AMEX
            - CHINA_UNIONPA
            - DINERS_CLUB
            - DISCOVER
            - JCB
            - LOCAL_BRAND_ONLY
            - MAESTRO
            - MASTERCARD
            - RUPAY
            - UATP
            - UNKNOWN
            - VISA
          example: AMEX
          type: string
          title: scheme
        funding_method:
          description: >-
            The method used by the payer to provide the funds for the
            payment.You may use this information to support surcharging
            decisions. This information is gathered from 3rd party sources and
            may not be accurate in all circumstances. 

            - For Card transaction, card.funding_method parameter is mandatory
          enum:
            - CHARGE
            - CREDIT
            - DEBIT
            - UNKNOWN
          example: CHARGE
          type: string
          title: funding_method
        stored_on_file:
          description: >-
            This parameter only applies if you collect card details from your
            payer, store them, and either you or your payer use the stored
            credentials for subsequent payments.
          enum:
            - NOT_STORED
            - STORED
            - TO_BE_STORED
          example: NOT_STORED
          type: string
          title: stored_on_file
    Device-Specific-Response:
      title: Device
      description: Device Specific Response
      properties:
        number:
          description: The payer's account number associated with a digital payment method.
          example: PA123456789
          maximum: 19
          minimum: 9
          type: number
          title: number
        expiry_month:
          description: Two-digit month in which the device specific expires.
          example: '01'
          type: string
          pattern: ^(0?[1-9]|1[0-2])$
          title: expiry_month
        expiry_year:
          description: Year from the expiry date of the device specific account number.
          type: string
          pattern: ^[0-9]{2,2}$
