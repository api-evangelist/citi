swagger: '2.0'
info:
  title: Payment Refund
  description: >-
    The Payment Refund endpoint allows you as an initiating party (or debtor) to
    initiate a refund request with the receiving party (or creditor) of a
    payment that was previously executed. This service is currently available
    only in Singapore and India. The request follows the ISO XML pain.007.001.09
    format in which you specify at least the mandatory elements of the XML
    message and encode it in Base64, encrypt and sign it before placing it in
    the request specifying the header elements and then invoke the endpoint.
    CitiConnect will respond with a pain.002.001.03 Refund Initiation
    acknowledgement. This endpoint is available 24X7. The customer reference
    number, value date, branch code, the payment amount, value date (date on
    which funds were credited to the receiving party?s account), the receiving
    party?s account number of the ORIGINAL TRANSACTION must be specified in the
    request of this message along with the ISO reversal reason code and the
    creation date of the reversal request. Optionally you may also send the UETR
    which may be retrieved using the Enhanced Payment Status Inquiry endpoint.
    The Original Message ID (OrgnlMsgId), Original Message Name (OrgnlMsgNmId),
    Original Payment Information (OrgnlPmtInfId), Original Financial Institution
    ID (FinInstnId > Nm) and the Debtor Account (DbtrAcct > Other > Id) fields
    are mandated by the schema definition but not required by Citi. We recommend
    that you send hardcoded values in them.


    Download our SDKs:


    * [Python
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=python&apiTitle=all&isClientSecReq=true)

    * [Java
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=java&apiTitle=all&isClientSecReq=true)

    * [.Net
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=dotnet&apiTitle=all&isClientSecReq=true)

    * [Ruby
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=ruby&apiTitle=all&isClientSecReq=true)

    * [NodeJS
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=nodejs&apiTitle=all&isClientSecReq=true)

    * [Go
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=go&apiTitle=all&isClientSecReq=true)

    * [CLI Tool
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=ccapi-cli&apiTitle=all&isClientSecReq=true)


    Note: You must be logged in to download the SDKs.
