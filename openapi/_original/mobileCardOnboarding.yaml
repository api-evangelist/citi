  CardPurgeErrorMessage:
    required:
      - errorCode
      - errorDescription
    type: object
    description: List of error code and description to be sent to the Client
    properties:
      errorCode:
        maxLength: 10
        minLength: 1
        type: string
        description: error code to be sent to the Client
        format: alphanumeric [a-zA-Z0-9]
        example: EVB1257
      errorDescription:
        description: >-
          The error description that corresponds to  error code when there is
          any <br> error occurred while retrieving the transactions.<br>*
          `GRC0002` - Client ID is missing in the request header<br>* `GRC0003`
          - Invalid JSON Input<br>* `GRC0004` - Region ID is not available in
          the request<br>* `GRC0005` - Client Tracking ID is missing in the
          request header<br>* `GRC0010` - Client Tracking ID length should
          contain a min of 1 character and a max of 36 characters.<br>*
          `GRC0011` - Client ID and/or Country and/or region id is missing in
          Client Onboard Configuration setup. Contact Citi support.<br>*
          `GRC0012` - Necessary header value is missing<br>* `GRC0014` - We have
          encountered an error and couldnt receive your request. Please try
          again, or contact Citi support if you have any further questions or
          comments<br>* `GRC0016` - Country code is not available in the
          request<br>* `EVB1150` - cardHolderUserID is mandatory<br>* `EVB1152`
          cardHolderUserID must be numeric<br>* `EVB1151` - cardHolderUserID
          size must be between 1 and 200 characters<br>* `EVB1258` -
          countryOfIssuance is mandatory
        type: string
        example: >-
          Document(s) is mandatory and should not be null or empty and should be
          one of the required documents
        format: alphanumeric [a-zA-Z0-9]
  CardMaintenanceRequest:
    properties:
      requestType:
        description: Action which would help to define the processing flow
        type: string
        example: DEMOGRAPHIC_UPDATE
        items:
          enum:
            - CARD_MODIFY
            - CARD_CANCEL
            - DEMOGRAPHIC_UPDATE
        format: alpha[a-zA-Z]
      cardHolderUserId:
        description: >-
          Unique ID to be generated & sent by Citi clients to identify user
          profile.
        type: string
        format: alphanumeric [a-zA-Z0-9//s]
        example: Billy33896
        maxLength: 20
        minLength: 1
      countryOfIssuance:
        description: Country based on which the santions screening rules are applied.
        type: string
        format: alphabets [a-zA-Z]
        example: USA
        maxLength: 3
        minLength: 2
      modifyCardInfo:
        description: This object should be populated when requestType is CARD_MODIFY
