    Tokenization-Update-Request-Billing_Address:
      title: billing address Update
      type: object
      properties:
        company:
          description: "Company Name \n- For token id update request, billing_address.company parameter becomes mandatory when customer_id parameters was not provided by client in the payload request."
          type: string
          minLength: 1
          maxLength: 100
          example: ABC Inc
          title: company
        city:
          description: "Customer City Name \n- For token id update request, billing_address.city parameter becomes mandatory when customer_id parameters was not provided by client in the payload request."
          type: string
          minLength: 1
          maxLength: 100
          example: New York
          title: city
        state:
          description: "Customer State Name \n- For token id update request, billing_address.state parameter becomes mandatory when customer_id parameters was not provided by client in the payload request."
          type: string
          minLength: 1
          maxLength: 35
          example: California
          title: state
        postal_code:
          description: "Customer Postal code \n- For token id update request, billing_address.postal_code parameter becomes mandatory when customer_id parameters was not provided by client in the payload request."
          type: string
          minLength: 1
          maxLength: 16
          example: '33610'
          title: postal_code
        country_code:
          description: "Customer Country code \n- For token id update request, billing_address.country_code parameter becomes mandatory when customer_id parameters was not provided by client in the payload request."
          type: string
          pattern: ^[A-Z]{2,2}$
          example: US
          title: country_code
        email:
          description: "Customer Email \n- Email address must be longer than 3 characters and adheres to a generous subset of valid RFC 2822 email addresses \n- For token id update request, billing_address.email parameter becomes mandatory when customer_id parameters was not provided by client in the payload request."
          example: customer.raj2024@gmail.com
          type: string
          pattern: '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$'
          title: email
        phone:
          description: "Customer Phone number \n- Data consists of '+', country code (1, 2 or 3 digits), 'space', and national number (which may embed single space characters for readability) \n- For token id update request, billing_address.phone parameter becomes mandatory when customer_id parameters was not provided by client in the payload request."
          example: '+919962125789'
          pattern: \+[0-9]{1,3}[-\ ][0-9()+\-]{1,30}
          type: string
          title: phone
        lines:
          type: array
          minItems: 1
          maxItems: 7
          items:
            $ref: '#/components/schemas/Token_Lines'
