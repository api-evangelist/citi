openapi: 3.2.0
info:
  title: Citi Paymentservices API
  version: 1.0.0
  description: 'Operations tagged Paymentservices across 3 of this provider''s published API definitions: Static.yaml, citi-due-date-openapi.yaml, citi-immediate-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://tts.apib2b.citi.com/citiconnect/prod/
  description: production gateway url
- url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb/
  description: sandbox url
- url: https://tts.sit.apib2b.citi.com/citiconnect/sit5/
  description: dev gateway url
tags:
- name: Payment Services
paths:
  /paymentservices/collections/qrcodes:
    post:
      summary: This API has an ability to create a QR Code for user which will allow their…
      description: 'QR Code Creation API has an ability to create a QR Code for user and is supported JSON format. This API can be initiated by forming a well-defined POST request. Finally, you encrypt the payload, place it in your request and send it via your application.


        Content-Type : Supports application/json.

        Authorization: The OAuth Token prefixed with Bearer and space in between.'
      operationId: qrCodeCreation
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CountryCode'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/PaymentMethod'
      - $ref: '#/components/parameters/Language'
      requestBody:
        description: Describes the QR Code creation APIs request body fields.
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/BrazilStaticQRCodeRequest'
            examples:
              BrazilStaticQRCodeExample:
                $ref: '#/components/examples/BrazilStaticQRCodeExample'
        required: true
      responses:
        '201':
          $ref: '#/components/responses/CreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      security:
      - oAuth2:
        - paymentservices
      tags:
      - Payment Services
    servers:
    - url: https://tts.apib2b.citi.com/citiconnect/prod/
      description: production gateway url
    - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb/
      description: sandbox url
  /paymentservices/collections/qrcodes/cobv/{txid}:
    parameters:
    - $ref: '#/components/parameters/TxId'
    - $ref: '#/components/parameters/ClientId_2'
    put:
      summary: Create collection with due date
      operationId: dynamicCollectionCreateWithDueDate
      security:
      - cobVWriteSample:
        - cobv.write
      description: Endpoint to create a collection with due date.
      requestBody:
        $ref: '#/components/requestBodies/CobVBody'
      responses:
        '201':
          $ref: '#/components/responses/CobVGeradaCreateResponse'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/AcessoNegado1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoInvalido'
        '415':
          $ref: '#/components/responses/MidiaInvalida'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel1'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      tags:
      - Payment Services
    patch:
      parameters:
      - $ref: '#/components/parameters/CNPJ'
      summary: Update collection with due date
      operationId: dynamicCollectionUpdateWithDueDate
      security:
      - cobVWriteSample:
        - cobv.write
      requestBody:
        $ref: '#/components/requestBodies/CobVBodyRevisada'
      responses:
        '200':
          $ref: '#/components/responses/CobVGeradaUpdateResponse'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/AcessoNegado1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoInvalido'
        '415':
          $ref: '#/components/responses/MidiaInvalida'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel1'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      tags:
      - Payment Services
    get:
      parameters:
      - $ref: '#/components/parameters/TxId'
      - $ref: '#/components/parameters/CNPJQuery'
      - $ref: '#/components/parameters/Revisao'
      - $ref: '#/components/parameters/ClientId_2'
      summary: Retrieve specific collection with due date details
      operationId: dynamicCollectionInquiryWithDueDate
      security:
      - cobVReadSample:
        - cobv.read
      description: Endpoint intended to retrieve details for a collection with due date through a specific TXID.
      responses:
        '200':
          $ref: '#/components/responses/CobVCompletaResponse'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/AcessoNegado1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoInvalido'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel1'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      tags:
      - Payment Services
    servers:
    - url: https://tts.sit.apib2b.citi.com/citiconnect/sit5/
      description: dev gateway url
    - url: https://tts.apib2b.citi.com/citiconnect/prod/
      description: production gateway url
    - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb/
      description: 'sbox url '
  /paymentservices/collections/qrcodes/cobv:
    get:
      parameters:
      - $ref: '#/components/parameters/Inicio'
      - $ref: '#/components/parameters/Fim'
      - $ref: '#/components/parameters/CPF'
      - $ref: '#/components/parameters/CNPJ'
      - $ref: '#/components/parameters/LocationPresente'
      - $ref: '#/components/parameters/Status'
      - $ref: '#/components/parameters/loteCobVId'
      - $ref: '#/components/parameters/PaginaAtual'
      - $ref: '#/components/parameters/ItensPorPagina'
      - $ref: '#/components/parameters/ClientId_2'
      summary: Retrieve a list of collection items with due date
      operationId: dynamicCollectionInquiryListWithDueDate
      security:
      - cobVReadSample:
        - cobv.read
      description: Endpoint to query outstanding collections through parameters like start date, end date, taxpayer ID (CPF/CNPJ) and status.
      responses:
        '200':
          $ref: '#/components/responses/CobsVConsultadasResponse'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/AcessoNegado1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoInvalido'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel1'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      tags:
      - Payment Services
    servers:
    - url: https://tts.sit.apib2b.citi.com/citiconnect/sit5/
      description: dev gateway url
    - url: https://tts.apib2b.citi.com/citiconnect/prod/
      description: production gateway url
    - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb/
      description: 'sbox url '
  /paymentservices/collections/qrcodes/cob/{txid}:
    parameters:
    - $ref: '#/components/parameters/TxId'
    - $ref: '#/components/parameters/ClientId_3'
    put:
      summary: Create immediate Collection
      operationId: dynamicCollectionCreation
      security:
      - cobWriteSample:
        - cob.write
      description: Endpoint to create an Immediate collection.
      requestBody:
        $ref: '#/components/requestBodies/CobBody'
      responses:
        '201':
          $ref: '#/components/responses/CobGeradaResponse'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/AcessoNegado1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoInvalido'
        '415':
          $ref: '#/components/responses/MidiaInvalida'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel1'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      tags:
      - Payment Services
    get:
      parameters:
      - $ref: '#/components/parameters/Revisao'
      - $ref: '#/components/parameters/CNPJ'
      summary: See Immediate Collection
      operationId: dynamicCollectionInquiry
      security:
      - cobReadSample:
        - cob.read
      description: Endpoint intended to retrieve details for a Collection using a specific TXID.
      responses:
        '200':
          $ref: '#/components/responses/CobCompletaResponse'
        '401':
          $ref: '#/components/responses/AcessoNegado1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoInvalido'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel1'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      tags:
      - Payment Services
    patch:
      parameters:
      - $ref: '#/components/parameters/CNPJ'
      summary: Update immediate Collection
      operationId: dynamicCollectionUpdate
      security:
      - cobWriteSample:
        - cob.write
      description: Endpoint to update an Immediate collection.
      requestBody:
        $ref: '#/components/requestBodies/CobBodyRevisada'
      responses:
        '200':
          $ref: '#/components/responses/CobGeradaResponse'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/AcessoNegado1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoInvalido'
        '415':
          $ref: '#/components/responses/MidiaInvalida'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel1'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      tags:
      - Payment Services
    servers:
    - url: https://tts.sit.apib2b.citi.com/citiconnect/sit5/
      description: dev gateway url
    - url: https://tts.apib2b.citi.com/citiconnect/prod/
      description: production gateway url
    - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb/
      description: 'sbox url '
  /paymentservices/collections/qrcodes/cob:
    parameters:
    - $ref: '#/components/parameters/ClientId_3'
    get:
      parameters:
      - $ref: '#/components/parameters/Inicio'
      - $ref: '#/components/parameters/Fim'
      - $ref: '#/components/parameters/CPF'
      - $ref: '#/components/parameters/CNPJ'
      - $ref: '#/components/parameters/LocationPresente'
      - $ref: '#/components/parameters/Status_2'
      - $ref: '#/components/parameters/PaginaAtual'
      - $ref: '#/components/parameters/ItensPorPagina'
      summary: See Immediate Collection List
      operationId: dynamicCollectionInquiryList
      security:
      - cobReadSample:
        - cob.read
      description: Endpoint intended to check a Collection through parameters such as start date, end date, taxpayer ID (CPF/CNPJ) and status.
      responses:
        '200':
          $ref: '#/components/responses/CobsConsultadasResponse'
        '401':
          $ref: '#/components/responses/AcessoNegado1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoInvalido'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel1'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      tags:
      - Payment Services
    servers:
    - url: https://tts.sit.apib2b.citi.com/citiconnect/sit5/
      description: dev gateway url
    - url: https://tts.apib2b.citi.com/citiconnect/prod/
      description: production gateway url
    - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb/
      description: 'sbox url '
components:
  schemas:
    BrazilStaticQRCodeResponse:
      type: object
      description: Describes the QR Code Creation APIs response fields when user initiated request is with country BR, payment method PIX and language Portuguese.
      required:
      - txid
      - qrcode
      properties:
        txid:
          type: string
          pattern: ^[a-zA-Z0-9 ]{1,25}$
          maxLength: 25
          description: Identical to the one informed with input parameter
        valor:
          type: string
          pattern: ^[0-9]{1,10}.[0-9][0-9]$
          description: Collection amount, identical to that received
        qrcode:
          type: string
          maxLength: 300
          description: QR code string representation, EMV standard
    BrazilStaticQRCodeRequest:
      type: object
      description: Describes the  Brazil QR Code Creation APIs request fields.This Schema is applicable only when country is BR, payment method is PIX and language is Portuguese.
      required:
      - chave
      properties:
        txid:
          type: string
          pattern: ^[a-zA-Z0-9 ]{1,25}$
          maxLength: 25
          description: Transaction identifier (the purpose of this field is to be an element that allows the recipient's PSP to present the payment reconciliation functionality to the recipient user).
        chave:
          type: string
          maxLength: 77
          description: Pix alias registered in the DICT that will be used for the collection. This key will be read by the payer's PSP application for consultation with the DICT, which will return information that will identify the recipient of the collection.
        infoAdicionais:
          type: string
          maxLength: 72
          description: Additional information that will be displayed to the Payer when reading the QR code.
        valor:
          type: string
          pattern: ^[0-9]{1,10}.[0-9][0-9]$
          description: Collection amount. The decimal separator is the period character. Thousands separator not applicable.
        nomeBeneficiario:
          type: string
          pattern: ^[a-zA-Z0-9 ]{1,25}$
          maxLength: 25
          description: Beneficiary / recipient name
        cidadeBeneficiario:
          type: string
          pattern: ^[a-zA-Z0-9 ]{1,15}$
          maxLength: 15
          description: City where the transaction is made or city of the recipients bank counter
        saque:
          type: string
          default: '0'
          enum:
          - '0'
          - '1'
          description: identify the static qrcode for withdrawal <br> 1 - this qr code request is for the purpose of saque <br>0 - this qr code is not for the withdrawal purpose and this will be default
    PortugeseErrorDetail:
      type: object
      description: Describes the reason for errors when user initiated request is with country BR, payment method PIX and language Portuguese.
      properties:
        razao:
          type: string
          maxLength: 150
          description: this field is used to describe the reason for failure.
        propriedade:
          type: string
          maxLength: 30
          description: this field is used to show above reason is for this Property name
        valor:
          type: string
          maxLength: 12
          description: Property value
    BrazilstaticQRCodeErrorResponse:
      type: object
      description: Describes the QR Code Creation APIs error response fields when user initiated request is with country BR, payment method PIX and language Portuguese.
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          maxLength: 77
          description: Reference URI that identifies the type of problem. According to RFC 7807.
        title:
          type: string
          maxLength: 50
          description: message for error.
        status:
          type: string
          maxLength: 3
          description: HTTP status code returned.
        detail:
          type: string
          maxLength: 150
          description: Complete description of the problem.
        corelationId:
          type: string
          maxLength: 40
          description: unique id to which will allocate to every request when request come to us.
        violacoes:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PortugeseErrorDetail'
    CobVCompleta:
      title: Cobrança com vencimento completa
      required:
      - status
      allOf:
      - $ref: '#/components/schemas/CobVSolicitada'
      - $ref: '#/components/schemas/CobVGerada'
      - type: object
        properties:
          pix:
            type: array
            title: Pix recebidos
            items:
              allOf:
              - $ref: '#/components/schemas/Pix'
              - type: object
                properties:
                  txid:
                    allOf:
                    - $ref: '#/components/schemas/TxId'
                    - pattern: '[a-zA-Z0-9]{26,35}'
      - type: object
        properties:
          status:
            $ref: '#/components/schemas/CobrancaStatus'
    DadosDevedor:
      type: object
      properties:
        devedor:
          description: The debtor object organizes information about the collection debtor.
          oneOf:
          - $ref: '#/components/schemas/PessoaFisica'
          - $ref: '#/components/schemas/PessoaJuridica'
          allOf:
          - type: object
            properties:
              email:
                type: string
                title: Email
                description: User email.
          - $ref: '#/components/schemas/DadosComplementaresPessoa'
    Devolucao:
      type: object
      title: Devolução
      required:
      - id
      - rtrId
      - valor
      - horario
      - status
      properties:
        id:
          $ref: '#/components/schemas/DevolucaoId'
        rtrId:
          type: string
          title: RtrId
          description: ReturnIdentification transiting PACS004.
          example: D12345678202009091000abcde123456
          pattern: '[a-zA-Z0-9]{32}'
          minLength: 32
          maxLength: 32
        valor:
          type: string
          title: Valor a devolver.
          pattern: \d{1,10}\.\d{2}
          description: Amount to return.
        natureza:
          $ref: '#/components/schemas/DevolucaoNatureza'
        descricao:
          type: string
          title: Mensagem ao pagador relativa à devolução.
          maxLength: 140
          description: The optional `description` field determines a text to be displayed to the payer containing information about the payment return. This text will be filled in, in pacs.004, by the recipient's PSP, in the field RemittanceInformation. The field size in pacs.004 is limited to 140 characters.
        horario:
          type: object
          properties:
            solicitacao:
              type: string
              format: date-time
              title: Horário de solicitação
              description: Time when the payment return was requested on the PSP.
            liquidacao:
              type: string
              format: date-time
              title: Horário de liquidacao
              description: Time the payment return was settled on the PSP.
        status:
          type: string
          title: Status
          description: Return status.
          enum:
          - EM_PROCESSAMENTO
          - DEVOLVIDO
          - NAO_REALIZADO
        motivo:
          type: string
          title: Descrição do status.
          description: '# Payment Return Status


            Optional field that can be used by the receiving PSP to detail the reasons

            the return has reached the status in question.

            It can be used, for example, to detail the reason why the return was not carried out.

            '
          maxLength: 140
    PayloadLocation:
      type: object
      title: Location do Payload
      description: Payload location identifier.
      required:
      - id
      - location
      - tipoCob
      - criacao
      properties:
        id:
          $ref: '#/components/schemas/PayloadLocationId'
        location:
          type: string
          title: Localização do payload
          description: Payload location to be provided when creating the collection item.
          maxLength: 77
          format: uri
          example: pix.example.com/qr/v2/2353c790eefb11eaadc10242ac120002
        tipoCob:
          type: string
          title: Tipo da cobrança
          enum:
          - cob
          - cobv
        criacao:
          type: string
          format: date-time
          title: Data de Criação
          description: Payload location creation Date and time. Complies with RFC 3339.
    Paginacao:
      type: object
      title: Paginação
      required:
      - paginaAtual
      - itensPorPagina
      - quantidadeDePaginas
      - quantidadeTotalDeItens
      properties:
        paginaAtual:
          type: integer
          title: Página atual
          description: Retrieved page number.
          minimum: 0
        itensPorPagina:
          type: integer
          title: Itens por página
          description: Number of records returned on the page.
          minimum: 1
        quantidadeDePaginas:
          type: integer
          title: Quantidade de páginas
          description: Number of pages available for consultation.
          minimum: 1
        quantidadeTotalDeItens:
          type: integer
          title: Quantidade total de itens
          description: Total amount of items available according to the parameters informed.
          minimum: 0
    PixValorMulta:
      type: object
      properties:
        multa:
          type: object
          required:
          - valor
          properties:
            valor:
              type: string
              title: Valor relativo a multa.
              description: Fine amount.
              pattern: \d{1,10}\.\d{2}
    DadosComplementaresPessoa:
      type: object
      properties:
        logradouro:
          type: string
          title: Logradouro
          description: User address.
          maxLength: 200
        cidade:
          type: string
          title: Cidade
          description: User city.
          maxLength: 200
        uf:
          type: string
          title: UF
          description: UF of the user.
          maxLength: 2
        cep:
          type: string
          title: CEP
          description: User zip code.
          maxLength: 8
    Inicio:
      type: string
      title: Data de início
      description: Filters records whose creation date is greater than or equal to the start date. Complies with RFC 3339.It should be in ISO_DATE(yyyy-MM-dd'T'HH:mm:ss.SSSZ) format
      example: '2021-10-01T00:01:54.876Z'
    PessoaJuridica:
      type: object
      required:
      - cnpj
      - nome
      title: Pessoa Jurídica
      properties:
        cnpj:
          type: string
          title: CNPJ
          pattern: /^\d{14}$/
          description: User's CNPJ.
        nome:
          type: string
          title: Nome
          description: User's Nome.
          maxLength: 200
    TxId:
      type: string
      title: Id da Transação
      description: Field `txid` determines the transaction identifier for reconciliation purposes. In pacs.008 it is referenced as `TransactionIdentification <txId>` or `idConciliacaoRecebedor`. The txid is retrieved by the payer’s PSP application and, after the payment is confirmed, it is sent to SPI via pacs.008. A pacs.008 is also sent to the receiver’s PSP, containing the txid in addition to all the usual payment  information. Upon receiving the payment with txid, the receiver's PSP may inform the creditor to reconcile. The contents of this field are provided exclusively by the collector, who is the ultimate responsible for them. The txid should be unique by collector’s CPF/CNPJ. The receiving PSP is responsible for validating this rule in the API.
      pattern: '[a-zA-Z0-9]{26,35}'
    CobrancaStatus:
      type: string
      title: Status do registro da cobrança.
      description: ' Collection registration status. Not to be confused with its payment status, like paid, overdue, expired, for instance.

        The statuses are defined in this way: - `ATIVA`: indicates that the collection item was generated and is active (not yet been paid or removed); - `CONCLUIDA`: indicates that the collection item is no longer active and therefore will not accept further payments; - `REMOVIDO_PELO_USUARIO_RECEBEDOR`: indicates that the collection item was removed by the creditor; and - `REMOVIDO_PELO_PSP`: indicates that the collection item was removed by the PSP.'
      enum:
      - ATIVA
      - CONCLUIDA
      - REMOVIDA_PELO_USUARIO_RECEBEDOR
      - REMOVIDA_PELO_PSP
    PixValorOriginal:
      type: object
      properties:
        original:
          type: object
          required:
          - valor
          properties:
            valor:
              type: string
              title: Valor original
              description: Original Pix value.
              pattern: \d{1,10}\.\d{2}
    PixValorDesconto:
      type: object
      properties:
        desconto:
          type: object
          required:
          - valor
          properties:
            valor:
              type: string
              title: Valor relativo a desconto.
              description: Discount amount.
              pattern: \d{1,10}\.\d{2}
    PixValorTroco:
      type: object
      properties:
        troco:
          type: object
          required:
          - valor
          - modalidadeAgente
          - prestadorDoServicoDeSaque
          properties:
            valor:
              type: string
              title: Valor do Troco Pix
              description: Amount of Change Pix.
              pattern: \d{1,10}\.\d{2}
            modalidadeAgente:
              type: string
              title: Modalidade do Agente
              description: '##### Agent Type

                <table><tr><th>ACRONYM</th><th>Description</th></tr><tr><td>AGTEC</td><td>Business Establishment Agent</td></tr ><tr><td>AGTOT</td><td>Other Type of Legal Entity Agent</td></tr></table>

                '
              enum:
              - AGTEC
              - AGTOT
            prestadorDoServicoDeSaque:
              type: string
              title: Facilitador de Serviço de Saque
              pattern: \d{8}
              description: Withdrawal Service Provider ISPB
    PixValorAbatimento:
      type: object
      properties:
        abatimento:
          type: object
          required:
          - valor
          properties:
            valor:
              type: string
              title: Valor relativo a abatimento.
              description: Rebate amount.
              pattern: \d{1,10}\.\d{2}
    DevolucaoNatureza:
      type: string
      title: Natureza da Devolução
      description: 'Indicates the nature of the return. A return can be related to a regular Pix, or to a Withdrawal/Change Pix. In the absence of this field the nature must be interpreted as being of a common Pix (ORIGINAL).


        Natures are defined as follows:

        - `ORIGINAL`: when the return refers to a common Pix or the purchase amount in a Pix Troca;

        - `RETIRADA`: when the return refers to a Cash Out Pix or the amount of change in a Pix Change.

        - `MED_OPERACIONAL`: when the return occurs within the MED due to operational failure and refers to a common Pix (`BE08`);

        - `MED_FRAUDE`: when the return occurs within the MED on grounds of suspected fraud and refers to a common Pix (`FR01`).

        '
      enum:
      - ORIGINAL
      - RETIRADA
      - MED_OPERACIONAL
      - MED_FRAUDE
    CobBase:
      type: object
      title: Cobrança Base
      description: Attributes common to all collection entities
      properties:
        chave:
          type: string
          title: Chave DICT do recebedor
          description: 'PIX Alias - Determines the alias registered in DICT, which will be used for the collection. This alias will be submitted by the payer’s PSP applications to DICT, which will return the translated information that will identify the collection creditor. *The aliases can be of the following types: phone number, e-mail address, taxpayer ID (CPF/CNPJ) or EVP.* The aliases formats can be found in [Standards Manual for starting  Pix](https://www.bcb.gov.br/estabilidadefinanceira/pagamentosinstantaneos).'
          maxLength: 77
        solicitacaoPagador:
          type: string
          title: Solicitação ao pagador
          description: This optional field determines a text to be presented to the payer so that he can enter related information, in free format, to be sent to the recipient. This text will be filled, in pacs.008, by the payer's PSP, in the RemittanceInformation <RmtInf> field. The length of the <RmtInf> field in pacs.008 is limited to 140 characters.
          maxLength: 140
        infoAdicionais:
