        jsonReqId:
          type: string
          example: Req20181011776
          description: The unique identifier that you assign in the JSON request. Must be alphanumeric.
          maxLength: 100
        senderCompId:
          type: string
          description: The Citi-assigned value used to identify the message sender. May contain special characters ( ‘_’, ‘.’, ‘-‘).
          maxLength: 20
          example: ClientName
        onBehalfOfCompId:
          type: string
          description: The Citi-assigned value used to identify the sub-entity. May contain special characters ( ‘_’, ‘.’, ‘-‘).
          maxLength: 20
          example: ClientName
