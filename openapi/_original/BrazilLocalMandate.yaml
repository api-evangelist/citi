              type: array
              title: Pix recebidos
              items:
                allOf:
                  - $ref: '#/components/schemas/PixAutomatico'
                  - type: object
                    properties:
                      txid:
                        allOf:
                          - $ref: '#/components/schemas/TxId'
                          - pattern: '[a-zA-Z0-9]{26,35}'
        - $ref: '#/components/schemas/CobRAtualizacao'
        - $ref: '#/components/schemas/CobRTentativas'
    CobRAtualizacao:
      type: object
      title: Histórico de Atualização da Cobrança Recorrente
      required:
        - atualizacao
      properties:
        atualizacao:
          type: array
          title: Histórico de Status
          description: Histórico das mudanças de status das cobranças recorrentes.
          items:
            type: object
            required:
              - status
              - data
            properties:
              status:
                type: string
                title: Status da cobrança
                description: Status da cobrança.
                enum:
                  - CRIADA
                  - ATIVA
                  - CONCLUIDA
                  - EXPIRADA
                  - REJEITADA
                  - CANCELADA
              data:
                type: string
                format: date-time
                description: >-
                  Data e hora do registro de status atualizado. Respeita RFC
                  3339.
        encerramento:
          type: object
          title: Detalhamento do encerramento da cobrança.
          oneOf:
            - type: object
              properties:
                cancelamento:
                  type: object
                  title: Informações sobre o cancelamento da cobrança
                  required:
                    - solicitante
                    - codigo
                    - descricao
                  description: Informações sobre o cancelamento da cobrança
                  properties:
                    solicitante:
                      type: string
                      title: Solicitante do cancelamento
                      enum:
                        - PSP_PAGADOR
                        - USUARIO_PAGADOR
                        - PSP_RECEBEDOR
                        - USUARIO_RECEBEDOR
                    codigo:
                      type: string
                      title: Código do cancelamento
                      description: >-
                        Código do cancelamento. Corresponde ao código de
                        cancelamento presente no catálogo de mensagens.
                      maxLength: 4
                      enum:
                        - ACCT
                        - BLCK
                        - CCLD
                        - FAIL
                        - OTHR
                        - SLBD
                        - SLCR
                    descricao:
                      type: string
                      title: Descricao do cancelamento
                      description: Descricao da causa do cancelamento
                      maxLength: 105
            - type: object
              properties:
                rejeicao:
                  type: object
                  title: Informações sobre a rejeição da cobrança
                  required:
                    - codigo
                    - descricao
                  description: Informações sobre a rejeição da cobrança
                  properties:
                    codigo:
                      type: string
                      title: Código da rejeição
                      description: >-
                        Código da rejeição. Corresponde ao código de rejeição
                        presente no catálogo de mensagens.
                      maxLength: 4
                      enum:
                        - AB10
                        - AC05
                        - AC06
                        - AM02
                        - AM09
                        - DENC
                        - DS27
                        - DTED
                        - DTNT
                        - FBRD
                        - IRNT
                        - MIDI
                        - MSUC
                        - NIEC
                        - NIPA
                        - NITX
                        - QUNT
                        - RC09
                        - UDEI
                    descricao:
                      type: string
                      title: Descricao da rejeição
                      description: Descricao da causa da rejeição
                      maxLength: 105
    CobRTentativas:
      type: object
      title: Histórico de Tentativas da Cobrança Recorrente
      properties:
        tentativas:
          type: array
          title: Histórico de Tentativas de Cobrança
          description: Histórico de Tentativas de Cobrança
          items:
            type: object
            required:
              - dataLiquidacao
              - tipo
              - endToEndId
              - status
              - atualizacao
            properties:
              dataLiquidacao:
                type: string
                format: date
                description: >-
                  Data da liquidação da cobrança. Trata-se de uma data, no
                  formato `YYYY-MM-DD`, segundo ISO 8601.
                example: '2023-04-01'
              tipo:
                type: string
                title: Tipo da Tentativa
                description: Tipo da tentativa da cobrança.
                enum:
                  - AGND
                  - NTAG
                  - RIFL
              status:
                type: string
                title: Status da Tentativa
                description: Status da tentativa da cobrança.
                enum:
                  - SOLICITADA
                  - AGENDADA
                  - PAGA
                  - CANCELADA
                  - REJEITADA
                  - EXPIRADA
              endToEndId:
                $ref: '#/components/schemas/EndToEndId'
              atualizacao:
                type: array
                title: Histórico de Status da Tentativa
                description: Histórico das mudanças de status da tentativa de cobrança.
                items:
                  type: object
                  required:
                    - status
                    - data
                  properties:
                    status:
                      type: string
                      title: Status da Tentativa
                      description: Status da tentativa da cobrança.
                      enum:
                        - SOLICITADA
                        - AGENDADA
                        - PAGA
                        - CANCELADA
                        - REJEITADA
                        - EXPIRADA
                    data:
                      type: string
                      format: date-time
                      description: >-
                        Data e hora do registro de status atualizado. Respeita
                        RFC 3339.
              rejeicao:
                type: object
                title: Informações sobre a rejeição da tentativa da cobrança
                required:
                  - codigo
                  - descricao
                description: Informações sobre a rejeição da tentativa da cobrança
                properties:
                  codigo:
                    type: string
                    title: Código da rejeição da tentativa
                    description: >-
                      Código da rejeição da tentativa. Corresponde ao código de
                      rejeição presente no catálogo de mensagens. Os códigos de
                      rejeição da tentativa
                      `AC05`,`AM09`,`DENC`,`DS27`,`DTED`,`MIDI`,`MSUC`,`NITX`,`RC09`
                      e `DTED` causam a rejeição da cobrança recorrente
                      correspondente.
                    maxLength: 4
                    enum:
                      - AB10
                      - AC05
                      - AC06
                      - AM02
                      - AM09
                      - DENC
                      - DS27
                      - DTED
                      - DTNT
                      - FBRD
                      - IRNT
                      - MIDI
                      - MSUC
                      - NIEC
                      - NIPA
                      - NITX
                      - QUNT
                      - RC09
                      - UDEI
                  descricao:
                    type: string
                    title: Descricao da rejeição
                    description: Descricao da causa da rejeição
                    maxLength: 105
