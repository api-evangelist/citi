openapi: 3.2.0
info:
  title: WorldLink v2 API
  description: 'WorldLink is a complete cross-border payment and Foreign-Exchange (FX)

    service that allows you to perform payments in 135 currencies without having

    the need to maintain local currency accounts for each of them.'
  contact:
    name: Standards & Developer Hub
    url: https://tts.sandbox.developer.citi.com/citiconnect/
    email: developer-support@citi.com
  version: 2.0.0
servers:
- url: https://tts.apib2b.citi.com/citiconnect/prod/worldlinkservices
  description: production gateway url
- url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb/worldlinkservices
  description: sandbox url
security:
- clientCredentials: []
tags:
- name: WorldLink v2
paths:
  /v2/doddfrank/disclosure:
    post:
      tags:
      - WorldLink v2
      summary: WorldLink Dodd Frank
      description: 'CitiConnect WorldLink Dodd Frank allows users to access information for fees, taxes, and delivery dates.

        This information is subsequently provided to consumers on a Dodd Frank 1073 disclosure or receipt.'
      operationId: doddFrankRequestUsingPOST
      parameters:
      - name: client_id
        in: query
        description: Unique identifier which is created during the onboarding process.
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Supports \"application/xml\" and \"application/json\".
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: The OAuth Token prefixed with "Bearer" and space in between.
        required: true
        schema:
          type: string
      requestBody:
        description: Request body for WorldLink Dodd Frank
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/disclosure_request'
            example:
              in:
                clientId: '24884'
                subEntityId: '0001'
                destinationCountry: IN
                destinationState: AK
                destinationCity: ANCHORAGE
                bankCode: CITIIN00
                bankCodeType: B
                paymentMethod: W
                paymentCurrency: INR
                fundingCurrency: USD
                paymentCurrencyAmount: 100
                nonSTPFlag: N
                isBeneDeduct: Y
                citiPointOfOrigination: US
                beneDeductFeeType: T
                estimatePercentile: 95
                chargeCode: SHA
                releaseTime: '2026-04-23T16:11:23.000'
                nostroCountry: AU
                flagODE: N
                valueDate: '2026-04-23'
                flagFutureDated: N
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/disclosure_response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error-Message'
              example:
                correlationId: q2te~bd8e9b8f-d8e5-4a48-ad13-5d1ec8bb32e815587
                message: Mismatch of WorldLink client ID or client ID is not maintained.
                status: '400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error-Message'
              example:
                httpMessage: Unauthorized
                httpCode: '401'
                moreInformation: This server could not verify that you are authorized to access the URL
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error-Message'
              example:
                httpMessage: Not Found
                httpCode: '404'
                moreInformation: No resources match requested URI
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error-Message'
              example:
                httpMessage: Method Not Allowed
                httpCode: '405'
                moreInformation: The method is not allowed for the requested URL
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error-Message'
              example:
                httpMessage: Unsupported Media Type
                httpCode: '415'
                moreInformation: Unsupported Content-Type
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error-Message'
              example:
                message: Unable to process your request
                status: '500'
                correlationId: q2te~8b8b4912-1b37-449a-9e1a-3401d7ab7d8312352
      x-codegen-request-body-name: body
