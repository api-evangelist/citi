            amount:
              description: Transaction amount
              example: 200
              maximum: 1000000000000000000
              minimum: 0.01
              type: number
              title: amount
            country_code:
              description: Country code
              enum:
                - US
              example: US
              type: string
              title: country_code
            currency_code:
              description: ISO 4217 Currency Code for instance  USD/GBP/EUR
              enum:
                - USD
              example: USD
              type: string
              title: currency_code
            gateway_recommendation:
              description: >-
                Provides a recommendation for your next action based on the
