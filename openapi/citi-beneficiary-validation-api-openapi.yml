              xml:
                name: PennyTest
              type: string
              description: "This field enables selection of penny,non-penny or both validations \n- Applicable for IN IMPS"
              enum:
              - NONPENNY
              - PENNY
              - BOTH
              title: penny_test
          required:
          - country
          - method
          - type
