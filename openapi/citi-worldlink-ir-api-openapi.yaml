          any third party, unless explicitly permitted by Citi.
        rates:
          - target_currency: USD
            rate: 0.711134
            value_date: '2025-04-26'
          - target_currency: INR
            rate: 0.12735342
            value_date: '2025-05-26'
          - target_currency: PKR
            rate: 0.8421322
