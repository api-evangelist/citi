    f631ab51-6333-4183-9ef7-144f5fadc9b5-data-schema:
      type: object
      properties:
        SK_ACCT_ID:
          type: string
          description: The Safekeeping Account ID is an identifier for a Safekeeping Account that is unique within a branch.
          example: '0000123456'
        COUNTRY:
          type: string
          description: Country is the reclaim market.
          example: GERMANY
        CODE_RCLM_CURR:
          type: string
          description: Reclaim Currency is the currency of the reclaim (currency in which the claim is made).
          example: EUR
        RECLAIM_REF:
          type: string
          description: Reclaim Reference is the unique identifying number for each reclaim in Citi system.
          example: 600SE123456
        BO_BATCH_NO:
          type: string
          description: Batch Number is Citi's unique reference for the reclaims submitted to the Tax authorities (submission may contain more than one reclaim).
          example: B910BE123456
        BEN_OWNER_NAME:
          type: string
          description: Beneficial Owner Name is the name of the Beneficiary Owner of the reclaim.
          example: ABC Investments Ltd.
        DEPOT_CODE:
          type: string
          description: Depot Code is the internal Citi identifier for the local sub-account the securities are held on.
          example: NAY
        DATE_SENT_TO_FTA:
          type: string
          format: date
          description: Date sent to FTA is the date when the reclaim was submitted to the foreign tax authority.
          example: '2020-05-14'
        DATE_SENT_TO_LTA:
          type: string
          format: date
          description: Date sent to LTA is the date when the reclaim was submitted to the local tax authority.
          example: '2020-05-14'
        GERMAN_FILE_NUMBER:
          type: string
          description: E-Filing Serial (Reclaim) is the reference no. for electronically filed reclaim submission.
          example: '1234567891'
        EFILE_REF:
          type: string
          description: E-File Reference is Citi's unique reference for each electronic submission to Tax authorities (submission may contain more than 1 reclaim).
          example: F500DE000345
        ENTITLEMENT_REF:
          type: string
          description: Entitlement Reference is the unique reference number generated from Citi internal systems for each line of taxable income.
          example: '00365104513'
        CODE_RATE_CURR:
          type: string
          description: Rate Currency is the currency of the dividend.
          example: '54251700451'
        DIVIDEND_RATE:
          type: number
          format: double
          description: The Dividend Rate is the total expected dividend payments for an investment on an annualized basis.
          example: 1.953100028
        FX_RATE_EUR:
          type: number
          format: double
          description: FX Rate (EUR) is the FX rate used to convert the reclaim currency into EUR.
          example: 0.09401
        GROSS_DIV_EUR:
          type: number
          format: double
          description: Gross Dividend (EUR) is the value of the Gross Dividend expressed in Euro currency.
          example: 1500.75
        TAX_PAID_EUR:
          type: number
          format: double
          description: Local Tax (WHT Paid) (EUR) is the value of tax withheld expressed in Euro currency.
          example: 300.5
        NET_DIV_EUR:
          type: number
          format: double
          description: Net Dividend (EUR) is the dividend net of withholding tax expressed in Euro currency.
          example: 1200.25
        RECLM_VAL_EUR:
          type: number
          format: double
          description: Reclaim Amount (EUR) is the amount being reclaimed expressed in Euro currency.
          example: 250
        AMT_RECVED_EUR:
          type: number
          format: double
          description: Reclaim Amount Received (EUR) is the refund received from the Tax Authority expressed in Euro currency.
          example: 240
        FX_RATE_GBP:
          type: number
          format: double
          description: FX Rate (GBP) is the FX rate used to convert the reclaim currency into GBP.
          example: 0.8126
        GROSS_DIV_GBP:
          type: number
          format: double
          description: Gross Dividend (GBP) is the value of the Gross Dividend expressed in British pound currency.
          example: 1300.4
        TAX_PAID_GBP:
          type: number
          format: double
          description: Local Tax (WHT Paid) (GBP) is the value of tax withheld expressed in British pound currency.
          example: 260.35
        NET_DIV_GBP:
          type: number
          format: double
          description: Net Dividend (GBP) is the dividend net of withholding tax expressed in British pound currency.
          example: 1040.05
        RECLM_VAL_GBP:
          type: number
          format: double
          description: Reclaim Amount (GBP) is the amount being reclaimed expressed in British pound currency.
          example: 215
        AMT_RECVED_GBP:
          type: number
          format: double
          description: Reclaim Amount Received (GBP) is the refund received from the Tax Authority expressed in British pound currency.
          example: 210
        EQUIVAL_RATE_CCY:
          type: number
          format: double
          description: Equivalent Rate is the dividend rate per share expressed in the currency of the reclaim.
          example: 1.15672
        GROSS_DIV_CCY:
          type: number
          format: double
          description: Gross Dividend expressed in the currency of the reclaim.
          example: 2000
        TAX_PAID_CCY:
          type: number
          format: double
          description: Local Tax (WHT Paid) expressed in the currency of the reclaim.
          example: 400
        NET_DIV_CCY:
          type: number
          format: double
          description: Net Dividend expressed in the currency of the reclaim.
          example: 1600
        RECLM_VAL_RCY:
          type: number
          format: double
          description: Reclaim Amount expressed in the currency of the reclaim.
          example: 320
        AMT_RECVED_CCY:
          type: number
          format: double
          description: Reclaim Amount Received (excluding interest), expressed in the currency of the reclaim.
          example: 310
        FX_RATE_USD:
          type: number
          format: double
          description: FX Rate (USD) is the FX rate used to convert the reclaim currency into USD.
          example: 1.08
        GROSS_DIV_USD:
          type: number
          format: double
          description: Gross Dividend (USD) is the value of the Gross Dividend expressed in US dollar currency.
          example: 1650
        TAX_PAID_USD:
          type: number
          format: double
          description: Local Tax (WHT Paid) expressed in US dollar currency.
          example: 330
        NET_DIV_USD:
          type: number
          format: double
          description: Net Dividend (USD) is the dividend net of withholding tax expressed in US dollar currency.
          example: 1320
        RECLM_VAL_USD:
          type: number
          format: double
          description: Reclaim Amount (USD) is the value of the amount being reclaimed expressed in US dollar currency.
          example: 275
        AMT_RECVED_USD:
          type: number
          format: double
          description: Reclaim Amount Received (USD) is the refund received from the Tax Authority expressed in US dollar currency.
          example: 270
        STATUS:
          type: string
          description: Reclaim Status is the current status of the reclaim.
          example: Suspended
        STATUS_CHANGE_DATE:
          type: string
