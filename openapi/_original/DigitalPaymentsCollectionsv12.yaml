          type: string
          minLength: 36
          maxLength: 37
          example: SES1234567890123456789012345678
          title: id
        authentication_limit:
          description: >-
            The number of operations which may be submitted to the gateway using
            this session id as a password.This field applies when you write a
            browser or mobile app that issues operations to the gateway from the
            device, using the session id as a password.In that case, a payer (or
            a compromised browser), could issue a large number of requests to
            the gateway on your behalf, and you could incur unnecessary fees as
            a result.This field lets you limit your exposure to that risk. The
            value defaulted by the gateway is suitable for typical payments.
            There is an upper limit (your operation will be rejected if that
            limit is exceeded).
          type: string
          pattern: ^(?:[1-9]|1[0-9]|2[0-5])$
          example: '12'
          title: authentication_limit
        validity:
          description: >-
            Time till which session id can be used within the authentication
            limit in minutes(min: 1 minute; max: 25 minutes)
          type: string
          pattern: ^(?:[1-9]|1[0-9]|2[0-5])$
          example: '12'
          title: validity
    Session-Updat-Response:
      title: Session
      type: object
      required:
        - id
      properties:
        id:
          description: >-
            The identifier for the payment session.You can add request fields to
            the session using a Hosted Payment Form or wallet provider
            interaction, or the Update Session operation.
          type: string
          minLength: 36
          maxLength: 37
          example: SES1234567890123456789012345678
          title: id
    Tokenization-Create-Request:
      title: Create Token Request
      type: object
      required:
        - customer
        - method
        - id
      properties:
        customer:
          $ref: '#/components/schemas/Tokenization-Create-Request-Customer'
        method:
          $ref: '#/components/schemas/Tokenization-Create-Request-Method'
        id:
          description: Request Id
          type: string
          minLength: 1
          maxLength: 128
          example: ABC123456
          title: id
        card:
          $ref: '#/components/schemas/Tokenization-Create-Request-Card'
        billing_address:
          $ref: '#/components/schemas/Tokenization-Create-Request-Billing_Address'
    Tokenization-Create-Request-Customer:
      title: Customer
      type: object
      required:
        - id
      properties:
        id:
          description: Customer ID
          minLength: 1
          maxLength: 40
          type: string
          example: ABC12345
          title: id
        first_name:
          description: Customer's first name
          minLength: 1
          maxLength: 50
          type: string
          example: John
          title: Customer first name
        last_name:
          description: Customer's last name
          minLength: 1
          maxLength: 50
          type: string
          example: Karl
          title: Customer last name
    Tokenization-Create-Request-Method:
      title: method
      type: object
      required:
        - type
        - id_type
      properties:
        type:
          description: Payment Method Type
          type: string
          enum:
            - CARD
            - ACH
            - SEPA
          example: CARD
          title: type
        id_type:
          description: Personally Identifiable Information
          type: string
          enum:
            - CARD_NUMBER
            - ACCOUNT_NUMBER
            - IBAN
            - CITI_TOKEN
          example: IBAN
          title: id_type
        token_id:
          description: >-
            Token id. 

            - For Network token ID creation, method.token_id parameter becomes
            mandatory when client is not provided card related information in
            the payload request.
          type: string
          minLength: 1
          maxLength: 50
          example: Create0618token02
          title: token_id
        session_id:
          description: Session identification number
          type: string
          minLength: 36
          maxLength: 37
          example: SES1234567890123456789012345678
          title: session_id
    Tokenization-Create-Request-Card:
      title: card
      type: object
      description: >-
        Card object is mandatory for Citi token ID creation, if method.type is
        selected as CARD
      properties:
        number:
          description: >-
            Card Number that needs to be tokenized 

            - For Network token ID creation, card.number parameter becomes
            mandatory when client is not provided method.token_id parameter in
            the payload request.
          type: string
          minLength: 9
          maxLength: 23
          example: '4012000033330026'
          title: number
        name_on_card:
          description: >-
            Payer's name as given on the card 

            - For Network token ID creation, card.name_on_card parameter becomes
            mandatory when client is not provided method.token_id parameter in
            the payload request.
          type: string
          minLength: 1
          maxLength: 50
          example: ROGER WOOD
          title: name_on_card
        expiry_month:
          description: >-
            Two-digit month in which the payment card expires 

            - For Network token ID creation, card.expiry_month parameter becomes
            mandatory when client is not provided method.token_id parameter in
            the payload request.
          example: '01'
          type: string
          pattern: ^(0?[1-9]|1[0-2])$
          title: expriry_month
        expiry_year:
          description: >-
            Two-digit year in which the payment card expires 

            - For Network token ID creation, card.expiry_year parameter becomes
            mandatory when client is not provided method.token_id parameter in
            the payload request.
          type: string
          pattern: ^[0-9]{2,2}$
          example: '25'
          title: expiry_year
    Tokenization-Create-Request-Billing_Address:
      title: billing_address
      type: object
      properties:
        company:
          description: Company Name
          type: string
          minLength: 1
          maxLength: 100
          example: ABC Inc
          title: company
        city:
          description: Customer City Name
          type: string
          minLength: 1
          maxLength: 100
          example: New York
          title: city
        state:
          description: Customer State Name
          type: string
          minLength: 1
          maxLength: 35
          example: California
          title: state
        postal_code:
          description: Customer Postal code
          type: string
          minLength: 1
          maxLength: 16
          example: '33610'
          title: postal_code
        country_code:
          description: Customer Country code
          type: string
          pattern: ^[A-Z]{2,2}$
          example: US
          title: country_code
        email:
          description: >-
            Customer Email 

            - Email address must be longer than 3 characters and adheres to a
            generous subset of valid RFC 2822 email addresses
          example: customer.raj2024@gmail.com
          type: string
          pattern: '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$'
          title: email
        phone:
          description: >-
            Customer Phone number 

            - Data consists of '+', country code (1, 2 or 3 digits), 'space',
            and national number (which may embed single space characters for
            readability)
          example: '+919962125789'
          pattern: \+[0-9]{1,3}[-\ ][0-9()+\-]{1,30}
          type: string
          title: phone
        lines:
          type: array
          minItems: 1
          maxItems: 7
          items:
            $ref: '#/components/schemas/Token_Lines'
    Tokenization-Update-Request-Billing_Address:
      title: billing address Update
      type: object
      properties:
        company:
          description: >-
            Company Name 

            - For token id update request, billing_address.company parameter
            becomes mandatory when customer_id parameters was not provided by
            client in the payload request.
          type: string
          minLength: 1
          maxLength: 100
          example: ABC Inc
          title: company
        city:
          description: >-
            Customer City Name 

            - For token id update request, billing_address.city parameter
            becomes mandatory when customer_id parameters was not provided by
            client in the payload request.
          type: string
          minLength: 1
          maxLength: 100
          example: New York
          title: city
        state:
          description: >-
            Customer State Name 

            - For token id update request, billing_address.state parameter
            becomes mandatory when customer_id parameters was not provided by
            client in the payload request.
          type: string
          minLength: 1
          maxLength: 35
          example: California
          title: state
        postal_code:
          description: >-
            Customer Postal code 

            - For token id update request, billing_address.postal_code parameter
            becomes mandatory when customer_id parameters was not provided by
            client in the payload request.
          type: string
          minLength: 1
          maxLength: 16
          example: '33610'
          title: postal_code
        country_code:
          description: >-
            Customer Country code 

            - For token id update request, billing_address.country_code
            parameter becomes mandatory when customer_id parameters was not
            provided by client in the payload request.
          type: string
          pattern: ^[A-Z]{2,2}$
          example: US
          title: country_code
        email:
          description: >-
            Customer Email 

            - Email address must be longer than 3 characters and adheres to a
            generous subset of valid RFC 2822 email addresses 

            - For token id update request, billing_address.email parameter
            becomes mandatory when customer_id parameters was not provided by
            client in the payload request.
          example: customer.raj2024@gmail.com
          type: string
          pattern: '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$'
          title: email
        phone:
          description: >-
            Customer Phone number 

            - Data consists of '+', country code (1, 2 or 3 digits), 'space',
            and national number (which may embed single space characters for
            readability) 

            - For token id update request, billing_address.phone parameter
            becomes mandatory when customer_id parameters was not provided by
            client in the payload request.
          example: '+919962125789'
          pattern: \+[0-9]{1,3}[-\ ][0-9()+\-]{1,30}
          type: string
          title: phone
        lines:
          type: array
          minItems: 1
          maxItems: 7
          items:
            $ref: '#/components/schemas/Token_Lines'
    Token_Lines:
      type: string
      maxLength: 70
      minLength: 1
      description: Address Lines
      title: lines
    Payment-Method:
      type: array
      title: Payment Method
      items:
        type: object
        title: Items
        properties:
          type:
            description: |-
              Method specified by the customer for the transaction 
              - PIX for brazil QR creation 
              - CARD for CARD transactions 
              - BOLETO for BOLETO transactions 
              - ALIPAY for ALIPAY transactions 
              - ACH for ACH transactions 
              - FPS for PAYBYBANK transactions 
              - RTP for US RFP transactions 
              - GOOGLEPAY for Google pay transactions 
              - APPLEPAY for Apple pay transactions
            type: string
            maxLength: 20
            minLength: 1
            example: PIX
            title: type
          country_code:
            description: Country where merchant onboarded for the payment method.
            type: string
            pattern: ^[A-Z]{2,2}$
            example: BR
            title: country_code
          currency_code:
            description: Currency code where merchant onboarded for the payment method.
            type: array
            items:
              type: string
              pattern: ^[A-Z]{3,3}$
              example: BRL
              title: currency_code
        additionalProperties: false
    Customer-Update:
      type: object
      title: Customer Update
      properties:
        id:
          description: Merchant internal customer ID.
          example: 1234abcjki
          maxLength: 40
          minLength: 1
          type: string
          title: id
        type:
          type: string
          enum:
            - INDIVIDUAL
            - BUSINESS
          description: |-
            Merchant customer type 
             - For Brazil QR update customer.type parameter is mandatory, if anyone of the parameter method.pix.tax_id and customer.name is provided
          example: BUSINESS
          title: type
        tax_id:
          description: Customer's payer identification (e.g., email address).
          example: 234.453.678-21
          maxLength: 100
          minLength: 1
          type: string
          title: tax_id
        name:
          $ref: '#/components/schemas/Name'
        address:
          $ref: '#/components/schemas/Address'
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
    Merchant-Update:
      type: object
      title: Merchant Update
      properties:
        tax_id:
          maxLength: 128
          minLength: 1
          type: string
          description: |-
            Merchant's payee identification (e.g., email address) 
             - For Brazil QR creation merchant.tax_id parameter is mandatory, allowed maxlength is 77
          example: 1.020.340/8910-22
          title: tax_id
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
      additionalProperties: false
    Method-Update:
      type: object
      title: Method Update
      properties:
        type:
          description: >-
            Method specified by the customer for the transaction 

            - Provide PIX for brazil QR creation & RFP 

            - For CARD Update Authorization operation method.type parameter is
            mandatory 

            - For CARD Void/Cancel operation method.type parameter is mandatory 

            - Provide GOOGLEPAY for GOOGLE PAY transactions 

            - For ACH Void/Cancel transaction, method.type parameter is
            mandatory 

            - For PAYPAL transaction, method.type parameter is mandatory
          type: string
          enum:
            - PIX
            - CARD
            - GOOGLEPAY
            - APPLEPAY
            - ACH
            - PAYPAL
          example: PIX
          title: type
        pix:
          $ref: '#/components/schemas/Pix'
        paypal:
          $ref: '#/components/schemas/Paypal-Update'
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
    Refund-Method-Update:
      type: object
      title: Refund Method Update
      required:
        - type
      properties:
        type:
          description: >-
            Method specified by the customer for the transaction  

            - For CARD,GOOGLEPAY and APPLEPAY Void/Cancel operation method.type
            parameter is mandatory 

            - Provide GOOGLEPAY for GOOGLE PAY transactions 

            - Provide APPLEPAY for APPLE PAY transactions 

            - Provide CARD for CARD transactions 
          type: string
          enum:
            - CARD
            - GOOGLEPAY
            - APPLEPAY
          example: CARD
          title: type
    Transaction-Update:
      type: object
      title: Transaction Update
      required:
        - id
      properties:
        id:
          description: >-
            Unique Transaction identification provided by the merchant during 
            transaction update  

            - For CARD operations transaction.id parameter mandatory and allowed
            maxmium length is 40. 

            - For ACH transaction, transaction.id parameter is mandatory and
            allowed maxmium length is 40. 

            - For Brazil PIX Cancellation, this parameter is mandatory with min
            length 26 & max length 35 alphanumeric characters and the value
            should be same as sent during PIX Initiation request 

            - For India CARD cancel transaction, transaction.id parameter
            mandatory and allowed maxmium length is 50.
          example: pay02052023456r
          maxLength: 128
          minLength: 1
          type: string
          title: id
        expiry_time:
          type: integer
          format: int32
          minimum: 10
          description: >-
            Expiration time for QR collection, specified in seconds 

            - QR Creation request will be rejected, if Expiration time value is
            less than 10 
          example: 3600
          title: expiry_time
        amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000000
          description: >-
            Transaction amount 
             - For Brazil QR Update decimal values are mandatory for transaction.amount and it must have 2 digits 
             - For Brazil QR Update maxmium amount limit is 9999999999.99 
            - For CARD Update Authorization operation transaction.amount
            parameter is mandatory 

            - For CARD Void/Cancel operation transaction.amount parameter is
            mandatory
          example: 200
          title: amount
        reference:
          description: >-
            Transaction additional information. 

            - For Brazil PIX Cancellation, this parameter is mandatory with min
            length 26 & mmax length 35 and input should be same as unique
            identifier (transaction.id) given during PIX Initiation
          example: REPAY
          maxLength: 250
          minLength: 1
          type: string
          title: reference
        currency_code:
          type: string
          enum:
            - BRL
            - USD
            - INR
            - GBP
          description: >-
            ISO 4217 Currency Code for instance  USD/GBP/EUR. 

            - For CARD Update Authorization operation transaction.currency_code
            parameter is mandatory 

            - For CARD Void/Cancel operation transaction.currency_code parameter
            is mandatory 

            - For ACH Void/Cancel transaction, transaction.currency_code
            parameter is mandatory 

            - For India Card Cancel transaction, transaction.currency_code
            parameter is mandatory
          example: BRL
          title: currency_code
        country_code:
          description: >-
            The order country. n- For CARD Update Authorization operation
            transaction.country_code parameter is mandatory 

            - For CARD Void/Cancel operation transaction.country_code parameter
            is mandatory 

            - For ACH Void/Cancel transaction, transaction.country_code
            parameter is mandatory 

            - For Brazil PIX Cancellation, this parameter is mandatory 

            - For India Card Cancel transaction, transaction.country_code
            parameter is mandatory
          enum:
            - US
            - BR
            - IN
            - GB
          example: US
          type: string
          title: country_code
        reason:
          description: >-
            Cancellation/refund/adjustment reason. 

            - For Brazil PIX Cancellation, this parameter is mandatory with max
            length 4 and allowed values are:<br> ACCT - Transactional Account
            Closure<br>BLCK - Transactional Account Blocking<br> CCLD - 
            Cancellation of authorization for periodic payments<br> FAIL -
            Cancellation of the commitment for periodic payments<br> OTHR -
            Cancellation of the commitment for periodic payments<br>SLBD -
            Requested by the paying user<br> SLCR - Requested by the receiving
            user
          example: REPAY
          maxLength: 140
          minLength: 1
          type: string
          title: reason
        url:
          $ref: '#/components/schemas/Url-Update'
        target_transaction_id:
          description: >-
            The identifier for the transaction you wish to refund, That is the
            {transactionId} URL parameter for REST and the transaction.id
            parameter for NVP. 

            - For CARD Void/Cancel operation transaction.target_transaction_id
            parameter is mandatory 

            - For ACH Void/Cancel transaction, transaction.target_transaction_id
            parameter is mandatory
          example: T123456789
          maxLength: 40
          minLength: 1
          type: string
          title: target_transaction_id
        acquirer:
          $ref: '#/components/schemas/Acquirer'
        charge_amount:
          description: The amount of the additional fee that you are charging the payer.
          example: '20.0'
          maxLength: 14
          minLength: 1
          type: string
          title: charge_amount
        charge_type:
          description: The type of the additional fee that you are charging the payer.
          enum:
            - SURCHARGE
          example: SURCHARGE
          type: string
          title: charge_type
        correlation_id:
          description: >-
            A transient identifier for the request, that can be used to match
            the response to the request.
          example: TEFG123456
          maxLength: 128
          minLength: 1
          type: string
          title: correlation_id
        update_flag:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: >-
            For QR Creation (ex. Brazil), during transaction processing if the
            merchant want to allow his client to change QR Amount then the value
            should be Y otherwise default value will be N
          example: 'Y'
          title: update_flag
        qr_image:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: >-
            Merchant to confirm QR Image is required or not, If required value
            should be Y
          example: 'Y'
          title: qr_image
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
    Refund-Transaction-Update:
      type: object
      title: Refund Transaction Update
      required:
        - id
      properties:
        id:
          description: >-
            Unique Transaction identification provided by the merchant during 
            transaction update  

            - For CARD/GOOGLEPAY/APPLEPAY transactions, transaction.id parameter
            is mandatory and allowed maxmium length is 40.
          example: pay02052023456r
          maxLength: 128
          minLength: 1
          type: string
          title: id
        reference:
          description: >-
            Transaction additional information. 

            - For Brazil PIX Cancellation, this parameter is mandatory with min
            length 26 & mmax length 35 and input should be same as unique
            identifier (transaction.id) given during PIX Initiation
          example: REPAY
          maxLength: 250
          minLength: 1
          type: string
          title: reference
        currency_code:
          type: string
          enum:
            - USD
          description: >-
            ISO 4217 Currency Code for instance  USD/GBP/EUR. 

            - For CARD/GOOGLEPAY/APPLEPAY transactions,
            transaction.currency_code parameter is mandatory
          example: USD
          title: currency_code
        country_code:
          description: >-
            The order country. 

            - For CARD/GOOGLEPAY/APPLEPAY transactions, transaction.country_code
            parameter is mandatory
          enum:
            - US
          example: US
          type: string
          title: country_code
        reason:
          description: 'Cancellation/refund/adjustment reason. '
          example: REPAY
          maxLength: 140
          minLength: 1
          type: string
          title: reason
        target_transaction_id:
          description: >-
            The identifier for the transaction you wish to refund, That is the
            {transactionId} URL parameter for REST and the transaction.id
            parameter for NVP.
          example: T123456789
          maxLength: 128
          minLength: 1
          type: string
          title: target_transaction_id
        correlation_id:
          description: >-
            A transient identifier for the request, that can be used to match
            the response to the request.
          example: TEFG123456
          maxLength: 128
          minLength: 1
          type: string
          title: correlation_id
    Order-Update:
      title: Order Update
      properties:
        id:
          description: >-
            A unique identifier for this order to distinguish it from any other
            order you create. 

            - For CARD Update Authorization operation order.id parameter is
            mandatory 

            - For CARD Void/Cancel operation order.id parameter is mandatory 

            - For ACH Void/Cancel transaction, order.id parameter is mandatory 

            - For India Card Cancel transaction, order.id parameter is mandatory
          example: OR123456789
          maxLength: 50
          minLength: 1
          type: string
          title: id
        amount:
          description: >-
            The total amount for the order.  This is the net amount plus any
            merchant charge amounts.If you provide any sub-total amounts, then
            the sum of these amounts (order.itemAmount, order.taxAmount,
            order.shippingAndHandlingAmount, order.cashbackAmount,
            order.gratuityAmount, order.merchantCharge.amount and
            order.dutyAmount), minus the order.discountAmount must equal the net
            amount.The value of this parameter in the response is zero if payer
            funds are not transferred.  

            - For CARD Update Authorization operation order.amount parameter is
            mandatory 

            - For CARD Void/Cancel operation order.amount parameter is mandatory
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        currency_code:
          description: >-
            The currency of the order expressed as an ISO 4217 alpha code, e.g.
            USD.
          example: USD
          type: string
          title: currency_code
        duty_amount:
          description: >-
            The duty amount (also known as customs tax, tariff or dues) for the
            order.
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: duty_amount
        tax_amount:
          description: >-
            The total tax amount for the order.If you do not provide this value
            but provide line item data, then this amount is calculated as the
            sum of the item.quantity times the item.unitTaxAmount for all the
            line items (total tax amount).If you provide both this value and
            line item data, then the order.taxAmount MUST equal the total tax
            amount.
          example: INDENTITY1
          maxLength: 14
          minLength: 1
          type: string
          title: tax_amount
        item_amount:
          description: >-
            The total item amount for the order.If you do not provide this value
            but provide line item data, then this amount is calculated as the
            sum of the item.quantity times the item.unitPrice for all the line
            items (total item amount).If you provide both this value and line
            item data, then the order.itemAmount MUST equal the total item
            amount.
          example: '100.00'
          maxLength: 14
          minLength: 1
          type: string
          title: item_amount
        reference:
          description: >-
            An optional identifier for the order For example, a shopping cart
            number, an order number, or an invoice number.
          example: CART123456
          maxLength: 200
          minLength: 1
          type: string
          title: reference
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
      type: object
    Refund-Order-Update:
      title: Refund Order Update
      properties:
        id:
          description: >-
            A unique identifier for this order to distinguish it from any other
            order you create. 

            - For CARD/GOOGLEPAY/APPLEPAY transactions, order.id parameter is
            mandatory
          example: OR123456789
          maxLength: 50
          minLength: 1
          type: string
          title: id
      type: object
    Payment-Method-Response:
      type: object
      title: Payment Method Response
      properties:
        method:
          $ref: '#/components/schemas/Payment-Method'
      additionalProperties: false
      description: Payment method response
    Token-Response:
      type: array
      items:
        $ref: '#/components/schemas/Tokenization'
    Tokenization:
      type: object
      title: Tokenization
      properties:
        customer:
          $ref: '#/components/schemas/Tokenization-Request-Customer'
        id:
          description: Request Id
          type: string
          minLength: 1
          maxLength: 128
          example: ABC123456
          title: id
        status:
          type: string
          enum:
            - SUCCESS
            - FAILED
          description: Transaction Status
          title: status
        value_added_services:
          type: array
          items:
            type: string
            description: >-
              Value added services like CITI_TOKEN, NETWORK_TOKEN and
              ACCOUNT_UPDATER
            title: value_added_services
        description:
          type: string
          minLength: 1
          maxLength: 200
          description: |-
            Status Description 
            - SUCCESS - Network Token Activated 
            - FAILED - Network Token Creation Failed
          title: description
        reason_code:
          description: Tokenization rejection Code
          example: SC0020
          maxLength: 100
          minLength: 1
          type: string
          title: reason_code
        method:
          $ref: '#/components/schemas/Tokenization-Create-Status-Method-Notification'
        card:
          $ref: '#/components/schemas/Tokenization-Create-Status-Card-Notification'
        billing_address:
          $ref: >-
            #/components/schemas/Tokenization-Create-Status-Billing_Address-Notification
    Tokenization-Request-Customer:
      title: Customer Get
      type: object
      required:
        - id
      properties:
        id:
          description: Customer ID
          minLength: 1
          maxLength: 40
          type: string
          example: ABC12345
          title: id
        first_name:
          description: Customer's first name
          minLength: 1
          maxLength: 50
          type: string
          example: John
          title: Customer first name
        last_name:
          description: Customer's last name
          minLength: 1
          maxLength: 50
          type: string
          example: Karl
          title: Customer last name
    Tokenization-Request-Id:
      title: request_id
      type: object
      required:
        - id
      properties:
        request_id:
          description: Request Id
          type: string
          minLength: 1
          maxLength: 40
          example: ABC123456
          title: request_id
    Tokenization-Request-Card:
      title: card
      type: object
      required:
        - token_id
      properties:
        token_id:
          description: Token id
          type: string
          minLength: 1
          maxLength: 50
          example: Create0618token02
          title: token_id
    Payments-Response:
      type: array
      items:
        $ref: '#/components/schemas/Payments'
    Payments:
      type: object
      title: Payments
      properties:
        customer:
          $ref: '#/components/schemas/Customer-Get'
        sender:
          $ref: '#/components/schemas/Sender-Notification'
        merchant:
          $ref: '#/components/schemas/Merchant-Status'
        receiver:
          $ref: '#/components/schemas/Receiver-Notification'
        method:
          $ref: '#/components/schemas/Method-Status'
        transaction:
          $ref: '#/components/schemas/Transaction-Status'
        response_rfp:
          $ref: '#/components/schemas/Rfp-Response-Rfp-Notification'
        order:
          $ref: '#/components/schemas/Order-Get-Notification'
        mandate:
          $ref: '#/components/schemas/Mandate'
        shipping:
          $ref: '#/components/schemas/Shipping'
        risk:
          $ref: '#/components/schemas/Risk'
      additionalProperties: false
      description: Payment status notification / inquiry response
    Transaction-Status:
      type: object
      title: Transaction Status
      properties:
        id:
          maxLength: 128
          minLength: 1
          type: string
          description: >-
            Unique Transaction identification provided by the merchant during
            transaction creation 

            - transaction.id parameter is mandatory for all transaction type
            creation   

            - For Brazil QR Creation transaction.id should be Alphanumeric and
            length ≥ 23 and ≤ 35 

            - For US RFP this parameter is mandatory with max length 35 

            - For US ACH Direct Debit, this parameter is mandatory with max
            length 16 

            - For Brazil PIX, this parameter is mandatory with min length 26 &
            max length 35
          example: pay02052023456r
          title: id
        end_to_end_id:
          maxLength: 35
          minLength: 1
          type: string
          description: >-
            Unique identification assigned by the initiating party to
            unambiguously identify the transaction. This identification is
            passed on, unchanged, throughout the entire end-to-end chain. 

            - This parameter is optional for Brazil QR PIX transaction
          example: pay02052023456r
          title: end_to_end_id
        expiry_time:
          type: integer
          format: int32
          minimum: 10
          description: >-
            Expiration time for QR collection, specified in seconds 

            - QR Creation request will be rejected, if Expiration time value is
            less than 10
          example: 3600
          title: expiry_time
        update_time:
          type: string
          format: date-time
          description: >-
            Indicates the date and time the gateway considers the order to have
            last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

            - Instant Payment (Debit) - Date time, generated by CitiConnect API,
            when CitiConnect API accepted a payment initiation after validation 

            - Instant Payment (Credit) - Date time, either provided by the
            debtor bank or generated by Citi's transaction processing
            application, when a transaction was created 

            - For ACH PAY and Verify transaction, order.update_time parameter is
            mandatory
          example: '2022-09-13T08:23:49.114Z'
          title: update_time
        type:
          description: Indicates the type of action performed on the order.
          enum:
            - AUTHENTICATION
            - AUTHORIZATION
            - AUTHORIZATION_UPDATE
            - CAPTURE
            - CHARGEBACK
            - DISBURSEMENT
            - FUNDING
            - PAYMENT
            - REFUND
            - REFUND_REQUEST
            - VERIFICATION
            - VOID_AUTHORIZATION
            - VOID_CAPTURE
            - VOID_PAYMENT
            - VOID_REFUND
          example: VERIFICATION
          type: string
          title: type
        reason_code:
          description: >-
            Transaction rejection Code 

            - For Brazil PIX, this parameter is mandatory with min & max length
            4
          example: SC0020
          maxLength: 100
          minLength: 1
          type: string
          title: reason_code
        authorization_code:
          description: >-
            Value generated by the issuing bank in response to a proposal to
            transfer funds
          example: AUTH123456
          maxLength: 100
          minLength: 1
          type: string
          title: authorization_code
        acquirer:
          $ref: '#/components/schemas/Acquirer-Request'
        terminal:
          description: >-
            Identifier used by the acquirer to identify the transaction. This
            identifier may be used by the acquirer in settlement reports.
          example: ACQ7894561
          maxLength: 16
          minLength: 1
          type: string
          title: terminal
        retrieval_reference_number:
          description: >-
            When a transaction registration succeeds, the value of this
            parameter contains the 44-digit number that was used to create the
            bar code on the Boleto slip. This bar code can then be scanned by
            the vendor if a payer elects to pay Boleto at a registered location.
          example: ACQ7894561
          maxLength: 100
          minLength: 1
          type: string
          title: retrieval_reference_number
        authorization_response:
          $ref: '#/components/schemas/Authorization-Response'
        response:
          $ref: '#/components/schemas/Response'
        receipt:
          description: >-
            When a transaction registration succeeds, the value of this
            parameter contains the 44-digit number that was used to create the
            bar code on the Boleto slip. This bar code can then be scanned by
            the vendor if a payer elects to pay Boleto at a registered location.
          example: MSG12345
          maxLength: 100
          minLength: 1
          type: string
          title: receipt
        additional_response_data:
          description: >-
            A 47-digit number the payer can use to make a Boleto payment.When a
            transaction registration succeeds, the value of this parameter
            contains the 44-digit number that was used to create the bar code on
            the Boleto slip. This bar code can then be scanned by the vendor if
            a payer elects to pay Boleto at a registered location.If the
            transaction registration fails, this parameter contains an error
            code and a description in key-value pair format.
          example: MSG12345
          maxLength: 4000
          minLength: 1
          type: string
          title: additional_response_data
        amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000000
          description: >-
            Transaction amount 
             - For Brazil QR Creation decimal values are mandatory for transaction.amount and it must have 2 digits 
             - For Brazil QR Creation maxmium amount limit is 9999999999.99 
            - For US RFP, this parameter is mandatory with maximum amount limit
            1000000.00 

            - For US ACH Direct Debit, this parameter is mandatory with max
            length 18 digits & 2 decimals 

            - For Brazil PIX, this parameter is mandatory with max length 18
            digits including 2 decimals
          example: 200
          title: amount
        currency_code:
          type: string
          enum:
            - BRL
            - USD
            - GBP
            - INR
            - EUR
            - CAD
            - HKD
            - AUD
            - SGD
            - DKK
            - NOK
            - SEK
            - PLN
            - IDR
            - MYR
            - THB
            - CHF
            - PHP
            - CZK
          description: >-
            ISO 4217 Currency Code for instance  USD/GBP/EUR 

            - transaction.currency_code parameter is mandatory for all
            transaction type creation
          example: BRL
          title: currency_code
        country_code:
          description: >-
            The order country 

            - transaction.country_code parameter is mandatory for all
            transaction type creation
          enum:
            - US
            - BR
            - GB
            - IN
            - TH
            - AU
            - CA
            - MX
            - DE
            - NL
            - IE
            - IT
            - FR
            - ES
            - HK
            - SG
            - NZ
            - DK
            - 'NO'
            - SE
            - BE
            - FI
            - CH
            - CZ
            - AT
            - PT
          example: US
          type: string
          title: country_code
        update_flag:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: >-
            Indicator if the exact amount indicated in amount must be paid, or
            if under/over payment is permitted.

            - For QR Creation (ex. Brazil), during transaction processing if the
            merchant want to allow his client to change QR Amount then the value
            should be Y otherwise default value will be N 

            - For US RFP, if Y then Amount may be modified by the customer, if N
            then Amount of payment must equal the Instructed Amount.If no value
            passed, default behavior is same as Y
          example: 'Y'
          title: update_flag
        qr_image:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: >-
            Merchant to confirm QR Image is required or not, If required value
            should be Y
          example: 'Y'
          title: qr_image
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
        update_count:
          type: integer
          format: int32
          description: >-
            Denotes the collection review. It always starts at zero. It always
            varies in increments of 1, if any updation done on QR creation)
          example: 1
          title: update_count
        qr_string:
          type: string
          maxLength: 512
          description: Dynamic QR Code based on the merchant payload request
          example: >-
            00020101021226700014br.gov.bcb.pix.citi.com.br/qr/2/8b3da2f39a4140d1a91abd93113bd44
            15204000053039865802BR5913Fulano de
            Tal6008BRASILIA62070503***630464E4
          title: qr_string
        qr_byte_code:
          type: string
          format: byte
          description: QR Image
          example: >-
            
          title: qr_byte_code
        status:
          type: string
          maxLength: 20
          description: >-
            Transaction Status, following status you will receive in response 

            - CREATED - The transaction has successfully been created 

            - PENDING - Transaction pending action from customer 

            - AUTHORIZED - Authorization approved 

            - CAPTURED - Transaction fully captured 

            - CAPTURED_PARTIALLY - Transaction partially captured 

            - CANCELLED - Transaction cancelled 

            - DECLINED - Transaction declined by the payment processor 

            - REJECTED - Requsest rejected after business logic check 

            - SYSTEM_ERROR- Internal system error occurred processing the
            transaction 

            - SETTLED - Transaction settled 

            - SUCCESS - The operation was successfully processed 

            - UNKNOWN - The result of the operation is unknown 

            - WAIT_CONFIRMATION - Transaction awaiting confirmation from user 

            - PENDING_SETTLEMENT - Transaction accepted settlement in process  

            - FAILED - 'rejection code - rejection description' 
          title: status
        description:
          type: string
          maxLength: 200
          description: >-
            Transaction Status, following status you will receive in response 

            - CREATED - The transaction has successfully been created 

            - PENDING - Pending action from customer 

            - AUTHORIZED - Authorization approved 

            - CAPTURED - Transaction fully captured 

            - CAPTURED_PARTIALLY - Transaction partially captured 

            - CANCELLED - Transaction cancelled 

            - DECLINED - Transaction declined by the payment processor 

            - REJECTED - Requsest rejected after business logic check 

            - SYSTEM_ERROR- Internal system error occurred processing the
            transaction 

            - FAILED - Transaction failed for invalid payload 

            - SETTLED - Transaction settled 

            - SUCCESS - The operation was successfully processed 

            - UNKNOWN - The result of the operation is unknown 

            - WAIT_CONFIRMATION - Transaction awaiting confirmation from user 

            - PENDING_SETTLEMENT - Transaction accepted settlement in process  

            - FAILED - 'rejection code - rejection description' 
          example: Transaction declined by the payment processor
          title: description
        creation_date_time:
          type: string
          format: date-time
          description: >-
            GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

            - Instant Payment (Debit) - Date time, generated by CitiConnect API,
            when CitiConnect API accepted a payment initiation after validation 

            - Instant Payment (Credit) - Date time, either provided by the
            debtor bank or generated by Citi's transaction processing
            application, when a transaction was created 

            - For US ACH Direct Debit, this parameter is mandatory 

            - For Brazil PIX, this parameter is mandatory
          example: '2022-09-13T08:23:49.114Z'
          title: creation_date_time
        tax_id:
          maxLength: 128
          minLength: 1
          type: string
          description: |-
            Merchant's payee identification (e.g., email address) 
             - For Brazil QR creation merchant.payee_id parameter is mandatory, allowed maxlength is 77 
            - This parameter is optional for Brazil QR PIX transaction
          example: 1.020.340/8910-22
          title: tax_id
        remittance_info:
          type: array
          description: Unstructured remittance information
          items:
            $ref: '#/components/schemas/Unstructured'
        url:
          $ref: '#/components/schemas/Url'
        value_date:
          type: string
          format: date
          description: >-
            YYYY-MM-DD Date in local time zone (e.g., EST for a United States
            RTP network transaction IST for IN IMPS) when Citi's transaction
            processing application starts processing a transaction 

            - For US ACH Direct Debit, this parameter is mandatory 

            - For Brazil PIX, this parameter is mandatory
          example: '2022-09-07'
          title: value_date
        expiry_date:
          type: string
          format: date
          description: |-
            Expiry Date Format is YYYY-MM-DD 
            - For US RFP this parameter is mandatory
          title: expiry_date
        reference:
          description: >-
            Transaction additional information.  
             - For UK PAYBYBANK Creation reference parameter is optional and allowed maximum length is 128 
            - For US ACH Direct Debit, this parameter is mandatory with max
            length 7
          example: REPAY
          maxLength: 250
          minLength: 1
          type: string
          title: reference
        reason:
          description: Cancellation/adjustment reason.
          example: REPAY
          maxLength: 140
          minLength: 1
          type: string
          title: reason
        batch_id:
          maxLength: 35
          minLength: 1
          type: string
          description: >-
            Identification for your Citi account consolidated credit posting
            including the transaction
          example: batch12345
          title: batch_id
        network_id:
          maxLength: 128
          minLength: 1
          type: string
          description: >-
            Transaction identification generated by the network (clearing) 

            - This parameter is optional for India UPI and UK PAYBYBANK
            transaction
          example: clr02052023478
          title: network_id
        network:
          type: string
          enum:
            - RTP
            - FDN
          description: >-
            Financial market infrastructure or clearing system (e.g., RTP
            Network in the United States)
          title: network
        full_amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000000
          description: |-
            Amount that is the gross amount payable by client 
            - For US RFP transaction, this parameter is optional
          title: full_amount
        discount_amount:
          type: number
          minimum: 0.01
          maximum: 100000000000000000
          description: >-
            Amount that is the discount from the gross amount 

            - Optional for US RFP. If populated, message.transaction.full_amount
            must also be popluated.
          title: discount_amount
        original_amount:
          type: number
          minimum: 0.01
          maximum: 100000000000000000
          description: |-
            Amount that was originally sent by our client 
            - For US RFP transaction, this parameter is optional
          title: original_amount
        uetr:
          type: string
          pattern: >-
            ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          description: >-
            UUID v4 format unique end-to-end transaction reference 

            - This parameter is optional for India UPI and UK PAYBYBANK
            transaction 

            - For Brazil PIX, this parameter is mandatory
          example: 4f09214d-296c-494b-8e9c-810bf1d9fc93
          title: uetr
        redirect_url:
          type: string
          maxLength: 500
          description: >-
            The URL to which you must redirect the payer's browser to complete
            the payment when using the payment provider's website.
          example: https://greenzone-api.uat.nam.nsroot.net/api/notification
          title: redirect_url
        psp_reference:
          type: string
          maxLength: 36
          minLength: 1
          description: >-
            Payment session id generated by Banked (third party system). Will be
            present in case of link creation being successful 
             - For UK PAYBYBANK Creation payment_session_field parameter is mandatory for success link creation.
          example: PAY1234567
          title: psp_reference
        product_info:
          type: array
          items:
            $ref: '#/components/schemas/Product-Info'
        retry_possible:
          description: >-
            Identifier to indicate if the payment journey has ended or further
            retries are possibility Y - indicates that a retry is possible on
            the same link N - indicates no further retry is possible on this
            link
          enum:
            - 'Y'
            - 'N'
          example: 'Y'
          type: string
          title: retry_possible
        status_date_time:
          format: date-time
          type: string
          description: >-
            Date & Time when Payer bank provided their response GMT (ISO 8601
            YYYY-MM-DDTHH:MM:SS.sssZ) 

            - This parameter is mandatory for Brazil PIX
          example: '2022-09-13T08:23:49.114Z'
          title: status_date_time
        clearing_local_code:
          maxLength: 4
          minLength: 1
          type: string
          description: Local Clearing code
          example: 008T
          title: clearing_local_code
        bill_id_1:
          description: Bill identification for a bill payment
          maxLength: 128
          minLength: 1
          pattern: ^[0-9A-Z]{1,128}$
          type: string
          example: '77889900'
          title: bill_id_1
        bill_id_2:
          description: Bill identification for a bill payment
          maxLength: 128
          minLength: 1
          pattern: ^[0-9A-Z]{1,128}$
          type: string
          example: '77889901'
          title: bill_id_2
        bill_id_3:
          description: Bill identification for a bill payment
          maxLength: 128
          minLength: 1
          pattern: ^[0-9A-Z]{1,128}$
          type: string
          example: '77889902'
          title: bill_id_3
        bill_due_date:
          description: ISO 8601 (YYYY-MM-DD) bill due date
          type: string
          format: date
          example: '2025-01-01'
          title: bill_due_date
        wht_rate:
          description: Withholding tax (WHT) rate
          type: number
          minimum: 0
          maximum: 100
          example: 10
          title: wht_rate
        wht_amount:
          description: Withholding tax (WHT) amount
          type: number
          minimum: 0.01
          maximum: 1000000000000000
          example: 1000
          title: wht_amount
        wht_code:
          description: >-
            Withholding tax (WHT) code A for WHT always paid by the seller, S
            for WHT once paid by the seller and B for WHT paid by the buyer
          type: string
          enum:
            - A
            - S
            - B
          example: A
          title: wht_code
        processing_code:
          description: Code defined by regulator to identify different kind of payments
          type: string
          minLength: 1
          maxLength: 35
          example: '550000'
          title: processing_code
        purpose:
          $ref: '#/components/schemas/Purpose'
        income_type:
          description: Income type
          type: string
          pattern: ^(00[0-9]|01[0-2])$
          example: '001'
          title: income_type
        vat_rate:
          description: Value-added tax (VAT) rate
          type: number
          minimum: 0
          maximum: 100
          example: 10
          title: wht_rate
        vat_amount:
          description: Value-added tax (VAT) amount
          type: number
          minimum: 0.01
          maximum: 1000000000000000
          example: 100
          title: vat_amount
        holiday_flag:
          description: Specifies if a request should consider holiday
          type: boolean
          example: true
          title: holiday_flag
    Payment-Request:
      type: object
      title: Payment Request
      required:
        - customer
        - method
        - transaction
      properties:
        customer:
          $ref: '#/components/schemas/Customer'
        sender:
          $ref: '#/components/schemas/Sender'
        merchant:
          $ref: '#/components/schemas/Merchant'
        receiver:
          $ref: '#/components/schemas/Receiver'
        method:
          $ref: '#/components/schemas/Method'
        transaction:
          $ref: '#/components/schemas/Transaction'
        order:
          $ref: '#/components/schemas/Order'
        mandate:
          $ref: '#/components/schemas/Mandate'
        shipping:
          $ref: '#/components/schemas/Shipping'
        authentication:
          $ref: '#/components/schemas/Authentication'
        risk:
          $ref: '#/components/schemas/Risk'
      additionalProperties: false
      description: Payment Request
    Authentication-Request:
      type: object
      title: Authentication Request
      required:
        - authentication
        - order
        - method
        - transaction
      properties:
        authentication:
          $ref: '#/components/schemas/Initiate-Authentication'
        method:
          $ref: '#/components/schemas/Authentication-Method'
        transaction:
          $ref: '#/components/schemas/Authentication-Transaction'
        order:
          $ref: '#/components/schemas/Authentication-Order'
      additionalProperties: false
      description: Authentication Request
    Authentication-Payer-Request:
      type: object
      title: Authentication-Payer-Request
      required:
        - order
        - transaction
      properties:
        authentication:
          $ref: '#/components/schemas/Authentication-Payer-Initiate-Request'
        customer:
          $ref: '#/components/schemas/Customer-Authentication-Request'
        method:
          $ref: '#/components/schemas/Authentication-Payer-Method'
        transaction:
          $ref: '#/components/schemas/Authentication-Transaction-Request'
        order:
          $ref: '#/components/schemas/Authentication-Payer-Order'
        mandate:
          $ref: '#/components/schemas/Authentication-Mandate'
        shipping:
          $ref: '#/components/schemas/Authentication-Payer-Shipping'
      additionalProperties: false
      description: Payment Request
    Authentication-Payer-Response:
      type: object
      title: Authentication Payer Response
      required:
        - authentication
        - customer
        - order
        - transaction
      properties:
        authentication:
          $ref: '#/components/schemas/Authentication-Payer-Initiate-Response'
        customer:
          $ref: '#/components/schemas/Customer-Authentication-Response'
        method:
          $ref: '#/components/schemas/Authentication-Payer-Method-Response'
        transaction:
          $ref: '#/components/schemas/Authentication-Transaction-Response'
        order:
          $ref: '#/components/schemas/Authentication-Payer-Order-Response'
        mandate:
          $ref: '#/components/schemas/Authentication-Mandate'
        shipping:
          $ref: '#/components/schemas/Authentication-Payer-Shipping'
      additionalProperties: false
      description: Payment Request
    Payment-Update-Request:
      type: object
