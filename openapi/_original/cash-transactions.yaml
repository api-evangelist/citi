        Ordering Party Name is the name of the instructing party that has
        authorized the payment of funds.
      in: query
      required: false
      schema:
        type: string
    parameter-14060:
      name: SEC_SECURITY_CD
      description: >-
        CITI Internal Security Code is the identifier of the CITI Internal
        Security Identifier.
      in: query
      required: false
      schema:
        type: string
    parameter-14061:
      name: SEC_SHRT_NME
      description: Issue Name is the Security Name of the security instrument.
      in: query
      required: false
      schema:
        type: string
    parameter-14062:
      name: LST_BUSCLS_DT
      description: The date for which End of Day data was last received for the account.
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-28902:
      name: ACT_SETT_DT
      description: Actual Settlement Date is the date of final settlement of the trade.
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-28827:
      name: DEAL_REF_NBR
      description: >-
        OTM Reference is the Order and Trade Manager Reference number that has
        been assigned to the order instructions.
      in: query
      required: false
      schema:
        type: string
    parameter-28806:
      name: ASRD_INCM_IND
      description: >-
        The Assured Income Indicator advises whether an income payment is
        assured (to be paid on the anticipated payment date) or actual (to be
        paid when funds are actually received).  The values are ASRD (assured)
        and ACTU (actual).
      in: query
      required: false
      schema:
        type: string
    parameter-28833:
      name: GROSS_NET_IND
      description: >-
        The Gross/Net is an indicator that advises if the amount for the
        transaction is Gross or Net. Values include G (Gross), N (Net) and
        (null).
      in: query
      required: false
      schema:
        type: string
    parameter-28817:
      name: CA_INCM_IND
      description: >-
        The CA/Income Indicator advises if the cash transaction is related to
        corporate actions or income.  Values are: C for Corporate Action, I for
        Income.
      in: query
      required: false
      schema:
        type: string
    parameter-28829:
      name: INTRNL_REF_ID_CA
      description: >-
        Custodian Reference (CA) is the unique reference assigned by the
        Custodian to the record. The reference number is unique within a branch.
      in: query
      required: false
      schema:
        type: string
    parameter-28777:
      name: TRN_CL_CD_CA
      description: >-
        Transaction Class Code (CA) is the transaction type code for corporate
        action transactions.  The parameter values are CATX and (null).
      in: query
      required: false
      schema:
        type: string
    parameter-28788:
      name: CORP_ACTN_TYP
      description: >-
        Corporate Action Type are codes that identify the type of corporation
        action transaction.  Values include: BIDS (BID/REVERSE RIGHTS), CSHDIV
        (CASH DIVIDEND), INTR (INTEREST PAYMENT), STDIV (STOCK DIVIDEND), etc.
      in: query
      required: false
      schema:
        type: string
    parameter-28789:
      name: CORP_ACTN_TYP_NME
      description: >-
        Corporate Action Type Name is the description for the Corporate Action
        Type code.  Values include: BID/REVERSE RIGHTS (BIDS), CASH DIVIDEND
        (CSHDIV), INTEREST PAYMENT (INTR), STOCK DIVIDEND (STDIV), etc.
      in: query
      required: false
      schema:
        type: string
    parameter-28818:
      name: ENTLMT_STS_NME
      description: >-
        Entitlements Status is a description of the current processing status of
        the entitlement.  Values include: Pending, Fully Released, Fully Paid,
        Partially Released, Partially Paid, Pending Payment, Pending, Reversal,
        Rev, To Be Received, (null), etc.
      in: query
      required: false
      schema:
        type: string
    parameter-28748:
      name: ENTLMT_QTY
      description: >-
        Entitlement Quantity is the associated security holding quantity on
        which the entitlement has been calculated.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-14088:
      name: PAY_DATE
      description: >-
        Payable Date is the date on which a dividend or interest payment is
        scheduled to be paid.
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-14090:
      name: SID_LOCAL
      description: Local ID is the Local security identifier of the associated security.
      in: query
      required: false
      schema:
        type: string
    parameter-28882:
      name: RVSL_IND
      description: >-
        Reversal Indicator notes whether or not the  transaction was processed
        to reverse an earlier transaction.  Values include: N, R, Y, (null)
      in: query
      required: false
      schema:
        type: string
    parameter-28893:
      name: IOD_UPDATE_TMS
      description: IOD Timestamp
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-28804:
      name: CASH_TRANS_TYPE
      description: Cash Transaction Type
      in: query
      required: false
      schema:
        type: string
    parameter-28869:
      name: MKT_TRANS_TYPE
      description: Market Transaction Type
      in: query
      required: false
      schema:
        type: string
    parameter-54318:
      name: CITI_INTRNL_REF_ID
      description: >-
        Custodian Reference (Internal) is a Citi generated identifier for a
        unique cash transaction record. This attribute is only valid within Citi
        and we recommend that it should not be used by clients.
      in: query
      required: false
      schema:
        type: string
