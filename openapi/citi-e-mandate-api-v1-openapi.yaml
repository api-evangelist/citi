  DocumentType6Code:
    type: string
    description: >-
      Document type in a coded form.<br><br><b>MSIN</b>: Document is an invoice
      claiming payment for the supply of metered services, for example gas or
      electricity supplied to a fixed meter. <br><br><b>CNFA</b>: Document is a
      credit note for the final amount settled for a commercial
      transaction.<br><br><b>DNFA</b>: Document is a debit note for the final
      amount settled for a commercial transaction. <br><br><b>CINV</b>:  
      Document is an invoice.<br><br><b>CREN</b>: Document is a credit note.
      <br><br><b>DEBN</b>: Document is a debit note. <br><br><b>HIRI</b>:
      Document is an invoice for the hiring of human resources or renting goods
      or equipment. <br><br><b>SBIN</b>: Document is an invoice issued by the
      debtor. <br><br><b>SVGS</b>: Account used for savings.
      <br><br><b>CMCN</b>: Document is an agreement between the parties,
      stipulating the terms and conditions of the delivery of goods or
      services.<br><br><b>SOAC</b>: Document is a statement of the transactions
      posted to the debtor's account at the supplier. <br><br><b>DISP</b>:
      Document is a dispatch advice. <br><br><b>BOLD</b>: Document is a shipping
      notice. <br><br><b>VCHR</b>: Document is an electronic payment document.
      <br><br><b>AROI</b>: Document is a payment that applies to a specific
      source document. <br><br><b>TSUT</b>: Document is a transaction identifier
      as assigned by the Trade Services Utility.<br><br><b>PUOR</b>: Document is
      a purchase order.
    enum:
      - MSIN
      - CNFA
      - DNFA
      - CINV
      - CREN
      - DEBN
      - HIRI
      - SBIN
      - CMCN
      - SOAC
      - DISP
      - BOLD
      - VCHR
      - AROI
      - TSUT
      - PUOR
