            ID is not available in the request<br>* `GRC0011` - Client ID and/or
            Country and/or region id is missing in Client Onboard Configuration
            setup. Contact Citi support.<br>* `GRC0016` - Country code is not
            available in the request"
          type: string
          format: alphanumeric
          example: Invalid Virtual Card Account Number format
