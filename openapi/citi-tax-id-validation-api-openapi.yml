      description: ''
      encoded: false
  catalogs:
    SIT5:
      properties:
        hostName: https://beneficiary-dev-168554.nam.nsroot.net/v3
        PanValidation: https://self-support-services-dev-168554.nam.nsroot.net/v3
    PTE:
      properties:
        hostName: https://beneficiary-pte-168554.cloudgsl.nam.nsroot.net/v3
        PanValidation: https://self-support-services-pte-168554.nam.nsroot.net/v3
    UAT1:
      properties:
        hostName: https://beneficiary-uat-168554.nam.nsroot.net/v3
