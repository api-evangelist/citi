      value:
        action: reservation
        api_version: '1.0'
        branch_code: GB3
        contact_email: james.smith@email.com
        contact_first_name: James
        contact_last_name: Smith
        contact_phone: '+442021220909'
        number_of_accounts_required: 50
        virtual_header_account: 983029057
components:
  securitySchemes:
    clientCredentials:
      description: >+
        All CitiConnect APIs use the oAuth2 authentication scheme, which
        requires a bearer token to authenticate your API call. The Token URL
        includes the version of authentication used by this API. See <a
        href="../../authentication/authentication-api-reference/"
        target="_blank">the Citi Authentication API reference</a> for
        information on requesting a token.

      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /authenticationservices/v3/oauth/token
          scopes: {}
  schemas:
    Account:
      type: object
      required:
        - balance_control_option
        - purpose_of_virtual_account
        - virtual_account_balance_display_option
        - virtual_account_number
        - virtual_header_account
      properties:
        address_line_1:
          type: string
          xml:
            name: AddressLine1
          description: >-
            AddressLine-1 is to be provided by client, if purpose of VA is not P
            (Physical Account Owner). Information that locates and identifies a
            specific address, as defined by postal services, presented in
            free-form text.
          maxLength: 105
        address_line_2:
          type: string
          xml:
            name: AddressLine2
          description: >-
            AddressLine-2 is to be provided by client, if purpose of VA is not
            P(Physical Account Owner). Information that locates and identifies a
            specific address, as defined by postal services, presented in
            free-form text.
          maxLength: 105
        address_line_3:
          type: string
          xml:
            name: AddressLine3
          description: >-
            AddressLine-3 is to be provided by client, if purpose of VA is not
            P(Physical Account Owner). Information that locates and identifies a
            specific address, as defined by postal services, presented in
            free-form text.
          maxLength: 105
        address_line_4:
          type: string
          xml:
            name: AddressLine4
          description: >-
            AddressLine-4 is to be provided by client, if purpose of VA is not
            P(Physical Account Owner). Information that locates and identifies a
            specific address, as defined by postal services, presented in
            free-form text.
          maxLength: 105
        alternate_account_number:
          type: string
          xml:
            name: AlternateAccountNumber
          description: Alternate account number associated with virtual header account.
          maxLength: 40
        balance_control_option:
          type: string
          xml:
            name: BalanceControlOption
          description: >-
            Mandatory parameter only if value of 'action' parameter is
            'activation'.<br><br>Default options as below:<br> Option will be
            defaulted from reporting virtual account if any. OR <br> Full pool
            balance if the Virtual Account is reporting to virtual header
            account. <br>  If Purpose of Virtual Account is 'C', then value
            allowed should be only 'O'. <br><br>Description of possible
            parameter values:<br><b>O</b>: Own Balance - Virtual Account to be
            able to use its own balance only. <br><br><b>F</b>: Full pool
            balance - Virtual Account to have access to full pool balance.
            <br><br><b>X</b>: Fixed Amount from pool - Fixed amount that a
            Virtual Account can withdraw from the pool over and above its own
            balance.
          minLength: 1
          maxLength: 10
        file_export_template_ids:
          type: string
          xml:
            name: FileExportTemplateIds
          description: provide comma separated fileExport TemplateIds
        fixed_amount:
          type: string
          xml:
            name: FixedAmount
          description: >-
            Should be mandatory for virtual accounts if the balance control
            option is 'X' (balanceControlOption parameter value).
          maxLength: 25
        iban:
          type: string
          xml:
            name: IBAN
          description: >-
            >- International Bank Account Number (IBAN) - identifier used
            internationally by financial institutions to uniquely identify the
            account of a customer. Further specifications of the format and
            content of the IBAN can be found in the standard ISO 13616 "Banking
            and related financial services - International Bank Account Number
            (IBAN)" version 1997-10-01, or later revisions.
          pattern: ^[A-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}$
        name:
          type: string
          xml:
            name: Name
          description: >-
            Name is to be provided by client, if purpose of VA is not P
            (Physical Account Owner).
          maxLength: 105
        purpose_of_virtual_account:
          type: string
          xml:
            name: PurposeOfVirtualAccount
          description: >-
            Mandatory parameter only if value of 'action' parameter is
            'activation'.<br><br>It specifies the purpose for creation of
            virtual account. <br><br>Description of possible parameter
            values:<br><b>P - Physical Account Owner. <br><br><b>S - Client
            Subsidiary. <br><br><b>C - Client's Customer.
          minLength: 1
          maxLength: 10
        reporting_account_number:
          type: string
          xml:
            name: ReportingAccountNumber
          description: Reporting Account Number associated with virtual header account.
          maxLength: 40
        tax_identification_number:
          type: string
          xml:
            name: TaxIdentificationNumber
          description: Tax Identification Number of the account holder.
          maxLength: 10
        virtual_account_balance_display_option:
          type: string
          xml:
            name: VirtualAccountBalanceDisplayOption
          description: >-
            Mandatory parameter only if value of 'action' parameter is
            'activation'.<br><br>It specifies whether to display opening or
            closing balances or not. Default value will be
            'N'.<br><br>Description of possible parameter values:<br><b>Y Show
            virtual account opening and closing balances. <br><br><b>N Show ZERO
            opening and closing balance for virtual account in statements and
            reports.
          minLength: 1
          maxLength: 10
        virtual_account_number:
          type: string
          xml:
            name: VirtualAccountNumber
          description: >-
            Mandatory parameter only if the value of the 'action' parameter is
            'activation'.<br><br>It specifies the virtual account to be
            activated.
          maxLength: 40
        virtual_header_account:
          type: string
          xml:
            name: VirtualHeaderAccount
          description: Physical account in a VAM structure.
          maxLength: 40
      xml:
        name: Account
    AddressDetails:
      type: object
      properties:
        address_line_1:
          type: string
          xml:
            name: AddressLine1
          description: >-
            AddressLine-1 is to be provided by client, Information that locates
            and identifies a specific address, as defined by postal services,
            presented in free-form text.
          maxLength: 105
        address_line_2:
          type: string
          xml:
            name: AddressLine2
          description: >-
            AddressLine-2 is to be provided by client, Information that locates
            and identifies a specific address, as defined by postal services,
            presented in free-form text.
          maxLength: 105
        address_line_3:
          type: string
          xml:
            name: AddressLine3
          description: >-
            AddressLine-3 is to be provided by client, Information that locates
            and identifies a specific address, as defined by postal services,
            presented in free-form text.
          maxLength: 105
        address_line_4:
          type: string
          xml:
            name: AddressLine4
          description: >-
            AddressLine-4 is to be provided by client, Information that locates
            and identifies a specific address, as defined by postal services,
            presented in free-form text.
          maxLength: 105
      description: >-
        Address Details of the entity to which the previously mentioned Virtual
        Account is assigned to.<br><br> This parameter is conditionally
        mandatory only for action = 'Modify'.
    CreditDebitPreference:
      type: object
      properties:
        disallow_credit:
          type: string
          xml:
            name: DisallowCredit
          description: >-
            Indicative parameter as No 'N' or Yes 'Y' to disallow or Allow
            Credit posting for the previously mentioned Virtual Account
          minLength: 1
          maxLength: 10
        disallow_debit:
          type: string
          xml:
            name: DisallowDebit
          description: >-
            Indicative parameter as No 'N' or Yes 'Y' to disallow or Allow Debit
            posting for the previously mentioned Virtual Account
          minLength: 1
          maxLength: 10
    ErrorDetail:
      type: object
      properties:
        action:
          type: string
          xml:
            name: Action
          description: corrective action to be taken to resolve above issue
          maxLength: 350
        issue:
          type: string
          xml:
            name: Issue
          description: more details about the  issue
          maxLength: 200
      xml:
        name: Error
    ErrorResponse:
      properties:
        code:
          type: string
          xml:
            name: Code
          description: >-
            The code which categorize the https error, to compile recognize at
            application, i.e. CC00003,CC00004,CC00005 etc
          maxLength: 10
          pattern: \w*\W*
        error_details:
          type: array
          xml:
            name: ErrorDetails
            wrapped: true
          items:
            $ref: '#/components/schemas/ErrorDetail'
          maxItems: 10
        message:
          type: string
          xml:
            name: Message
          description: message for error
          maxLength: 60
          pattern: \w*\W*
        ref_id:
          type: string
          xml:
            name: RefId
          description: unique reference ID for a particular request
          maxLength: 60
          pattern: \w*\W*
        status:
          type: string
          xml:
            name: Status
          description: https status code
          maxLength: 3
          pattern: \w*\W*
        httpMessage:
          type: string
        httpCode:
          type: string
        moreInformation:
          type: string
      xml:
        name: ErrorMessage
      description: Description of Error
    UpdateVirtualAccounts:
      required:
        - action
        - branch_code
        - virtual_account_number
      properties:
        account_description:
          type: string
          xml:
            name: AccountDescription
          description: >-
            Description for the previously mentioned virtual account. <br><br>
            This parameter is conditional if the action = 'Modify'.
          maxLength: 105
        action:
          type: string
          xml:
            name: Action
          description: >-
            Type of action that will be applied to virtual account. Actions that
            can be chosen are: <br>- CreditDebitPreferences<br>- Reopen<br>-
            Modify
          enum:
            - CreditDebitPreferences
            - Reopen
            - Modify
        address:
          type: object
          allOf:
            - $ref: '#/components/schemas/AddressDetails'
        branch_code:
          type: string
          xml:
            name: BranchCode
          description: Citi internal branch code associated with a virtual account number.
          maxLength: 4
        credit_debit_preferences:
          type: object
          allOf:
            - $ref: '#/components/schemas/CreditDebitPreference'
        tax_payer_id:
          type: string
          xml:
            name: TaxPayerId
          description: >-
            Tax payer ID to which entity the previously mentioned virtual
            account is assigned to.<br><br>This parameter is mandatory only when
            the action = 'Modify'.
          maxLength: 10
        virtual_account_number:
          type: string
          xml:
            name: VirtualAccountNumber
          description: specifies the virtual account that has to be updated.
          maxLength: 40
      xml:
        name: UpdateVirtualAccounts
    VirtualAccountRequest:
      required:
        - action
        - api_version
        - branch_code
        - contact_email
        - contact_first_name
        - contact_last_name
        - contact_phone
        - virtual_header_account
      properties:
        accounts:
          type: array
          xml:
            name: Accounts
            wrapped: true
          description: >-
            Mandatory only if value of 'action' parameter is
            'activation'.<br><br>This parameter specifies the list of Virtual
            Accounts.
          items:
            $ref: '#/components/schemas/Account'
        action:
          type: string
          xml:
            name: Action
          description: >-
            Action is a request type. if you are requesting to activate a
            virtual account, then provide action values as ``activation``. If
            requesting to reserve virtual accounts for a previously cited
            virtual header account then provide action value as ``reservation``.
          enum:
            - reservation
            - activation
        api_version:
          type: string
          xml:
            name: ApiVersion
          description: Version of the API.
          maxLength: 10
        branch_code:
          type: string
          xml:
            name: BranchCode
          description: Citi branch code associated with a given virtual header account.
          maxLength: 4
        contact_email:
          type: string
          format: email
          xml:
            name: ContactEmail
          description: Email address as defined on the virtual header account.
          maxLength: 2048
        contact_first_name:
          type: string
          xml:
            name: ContactFirstName
          description: First name as defined on the virtual header account.
          maxLength: 105
        contact_last_name:
          type: string
          xml:
            name: ContactLastName
          description: Last name as defined on the virtual header account.
          maxLength: 105
        contact_phone:
          type: string
          xml:
            name: ContactPhone
          description: Phone number as defined on the virtual header account.
          pattern: \+[0-9]{1,3}-[0-9()+\-]{1,30}
        number_of_accounts_required:
          type: integer
          xml:
            name: NumAccountsRequired
          description: >-
            Mandatory parameter only if  the value of 'action' parameter is
            'reservation', and specifies the number of virtual accounts
            requested to be reserved.
          maximum: 1200
        virtual_header_account:
          type: string
          xml:
            name: VirtualHeaderAccount
          description: Physical account in a VAM structure.
          maxLength: 40
      description: Describes the Virtual Account Creation APIs request parameters.
    VirtualAccountResponse:
      required:
        - message
        - request_id
        - status
      properties:
        message:
          type: string
          xml:
            name: Message
          description: Detailed response description for given request.
          maxLength: 400
        request_id:
          type: string
          xml:
            name: RequestId
          description: Auto-generated unique identification assigned for the request.
          maxLength: 40
        status:
          type: string
          xml:
            name: Status
          description: Status of the request.
          maxLength: 20
  responses:
    Bad-Request:
