    IFXResponse-FX-Rate:
      type: object
      description: Fx Rate Response
      xml:
        name: IFX
      properties:
        BankSvcRs:
          type: object
          properties:
            Status:
              type: object
              properties:
                StatusCode:
                  maxLength: 35
                  type: string
                  description: "StatusCode as Per IFX XML. PROCESSED for code 000 and 120 (Rate returned and value date changed) FAILED for all other codes\n (Rejects)"
                Severity:
                  maxLength: 5
                  type: string
                  description: Error,Warn,Info. NONE for code 000, HIGH for all the other status codes.
                StatusDesc:
                  maxLength: 255
                  type: string
                  description: 'Text description for status code. <StatusDesc>991 : Application program abend has occurred</StatusDesc> <StatusDesc>000 : Rate Returned</StatusDesc>'
            RqUID:
              type: string
              description: Customer Ref No for the request.
              example: 99dc17a3-6bbf-4310-973a-a369e5
            PrefPrice:
              maxLength: 1
              type: string
              description: Preferred pricing indicator.<br>N - Default value for standard pricing. <br>Value must be 'W' for Alipay Wallet payments, 'E' for UPI Cards payment and ‘Z’ for Dandelion Wallet payments.
            BaseNo:
              maxLength: 10
              type: string
              description: FXLM Base Number. If provided this base number will be passed to FXLM for pricing and settlement. Only one of <BaseNo> or <FXLMEntity> may be provided. If neither is present the OLR to base number configuration will be used. Echoed from customer request.
            FXLMEntity:
              maxLength: 10
              type: string
              description: FXLM Entity. If provided this Entity will be passed to FXLM for pricing and settlement. Only one of <BaseNo> or <FXLMEntity> may be provided. If neither is present the OLR to base number configuration will be used. Echoed from customer request.
            WLFlag:
              maxLength: 1
              type: string
              description: Account processing and settlement. W - Standard WorldLink account processing and settlement<br>N- Bypass all WorldLink account processing and settlement. Pass the numeric detail TRN to FXLM.<br>O - Bypass all WorldLink account processing and settlement. Pass the OLR numeric sequence number as the TRN to FXLM.<br>If not provided default will be W.
            DealType:
              maxLength: 1
              type: string
              description: Deal type. Deal type- 'B' for all bench deals for bench fixing rates<br>Deal type- `Q` for all real time quoted rate deals This must be coordinated with QUOTED fixing type<br>Deal Type- 'O' book per OLR parameters<br>Default value will be O, if not provided.
            ForExRateInqRs:
              type: object
              properties:
                Status:
                  type: object
                  properties:
                    StatusCode:
                      maxLength: 35
                      type: string
                      description: "StatusCode as Per IFX XML. PROCESSED for code 000 and 120 (Rate returned and value date changed) FAILED for all other codes\n (Rejects)"
                    ServerStatusCode:
                      maxLength: 35
                      type: string
                      description: Backend Status Code
                    Severity:
                      maxLength: 5
                      type: string
                      description: Error,Warn,Info. NONE for code 000, HIGH for all the other status codes.
                    StatusDesc:
                      maxLength: 255
                      type: string
                      description: 'Text description for status code. <StatusDesc>991 : Application program abend has occurred</StatusDesc> <StatusDesc>000 : Rate Returned</StatusDesc>'
                RqUID:
                  maxLength: 35
                  type: string
                  description: Customer Ref No for the request. Header - Client Reference Number. Echoed from customer request.
                  example: 99dc17a3-6bbf-4310-973a-a369e5
                CustId:
                  type: object
                  properties:
                    SPName:
                      maxLength: 35
                      type: string
                      description: Always set to "CTSI".
                    CustPermId:
                      maxLength: 9
                      type: string
                      description: WL Client Number + WorldLink Branch Number. It is used to validate client id. Please note this will be same for all requests in a single message as per existing CMX flow.
                ResTime:
                  maxLength: 19
                  type: string
                  description: Date & Time when the response is generated
                RemitAmt:
                  maxLength: 15
                  type: string
                  description: Amount to Buy or Sell. If RemitAmt is provided it means you are selling the currency.
                IssueAmt:
                  maxLength: 15
                  type: string
                  description: Amount to Buy or Sell. If IssueAmt is provided it means you are buying the currency.
                RemitCurCode:
                  maxLength: 3
                  type: string
                  description: Remit Currency. It is an ISO currency code. It is mandatory field for rate request if RemitAmt is provided and will be used for validating currency code.
                IssueCurCode:
                  maxLength: 3
                  type: string
                  description: Issue Currency. It is an ISO currency code. It is mandatory field for rate request if issueAmt is provided and will be used for validating currency code.
                CurConvertRule:
                  maxLength: 35
                  type: string
                  description: Currency conversion method Direct/Indirect
                  enum:
                  - DIRECT
                  - INDIRECT
                  - INTERBANK
                DepAcctId:
                  type: object
                  properties:
                    AcctId:
                      maxLength: 35
                      minLength: 1
                      type: string
                      description: FROM account number. Not used. Echoed from Customer Request ForExRateInqRq
                    AcctType:
                      maxLength: 4
                      minLength: 1
                      type: string
                      description: FROM account type. Not used. Echoed from Customer Request ForExRateInqRq
                    BankInfo:
                      $ref: '#/components/schemas/BankInfo'
                ForExRateRec:
                  type: object
                  properties:
                    ForExRateId:
                      maxLength: 15
                      type: string
                      description: The commited FX contract ID. This parameter is present if the ForExRateRq had ForExRateType=Committed and the deal was successfully booked.
                    ForExValDt:
                      maxLength: 10
                      type: string
                      description: Value date
                    ForExRateInfo:
                      type: object
                      properties:
                        RemitAmt:
                          maxLength: 15
                          type: string
                          description: Amount to Buy or Sell. If RemitAmt is provided it means you are selling the currency.
                        IssueAmt:
                          maxLength: 15
                          type: string
                          description: Amount to Buy or Sell. If IssueAmt is provided it means you are buying the currency.
                        RemitCurCode:
                          maxLength: 3
                          type: string
                          description: Remit Currency. It is an ISO currency code. It is mandatory field for rate request if RemitAmt is provided and will be used for validating currency code.
                        IssueCurCode:
                          maxLength: 3
                          type: string
                          description: Issue Currency. It is an ISO currency code. It is mandatory field for rate request if issueAmt is provided and will be used for validating currency code.
                        CurRate:
                          type: number
                          description: FX Rate
                        CurConvertRule:
                          maxLength: 35
                          type: string
                          description: Currency conversion method Direct/Indirect
                          enum:
                          - DIRECT
                          - INDIRECT
                          - INTERBANK
                        ExpDt:
                          type: string
                          maxLength: 19
                          description: Contract Expiry Datetime. This is the expiry datetime for this contract. This may be a few minutes for a rate offer and may be few days for a committed rate.
                        SPRefId:
                          maxLength: 36
                          type: string
                          description: 'Object identifiers in the IFX specification are of the data type "Identifier."  This is a narrow character data type with a maximum length of 36.                        '
                        ForExValDtType:
                          maxLength: 35
                          type: string
                          description: Daily, Spot or Future. Default value is Spot, if no value is provided.
                        ForExTnr:
                          maxLength: 2
                          type: string
                          description: Tenor value from frontend. Two Alphanumeric code for tenor.0 SP, TN, SD & BA. Conditional when FX request has Tenor listed as SD or TN or SP, OLR will book the FX and respond with the same requested tenor value. If the request is having BA as tenor value, OLR will determine tenor value either as SD or TN or SP based on FX availablity.
                        BenchFixing:
                          maxLength: 20
                          type: string
                          description: Bench Fixing. Required only for Bench Deals
