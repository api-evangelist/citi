openapi: 3.2.0
info:
  title: Citi Fxgateway API
  version: ''
  description: 'Operations tagged Fxgateway across 13 of this provider''s published API definitions: fx_benchmark_async_api.yaml, fx_benchmark_sync_api.yaml, fx_cancel_async_api.yaml, fx_cancel_sync_api.yaml, fx_eCommerce_api.yaml, fx_gateway_reporting_async_api.yaml, fx_gateway_reporting_sync_api.yaml, fx_market_async_api.yaml, fx_market_sync_api.yaml, fx_orders_async_api.yaml, fx_orders_sync_api.yaml, fx_quote_async_api.yaml, fx_quote_sync_api.yaml.'
servers:
- url: https://sandbox.api.citivelocity.com/markets
  description: sandbox URL
- url: https://api.citivelocity.com/markets
  description: production gateway URL
- url: https://icg.api.citigroup.net/markets/internal
tags:
- name: Fxgateway
paths:
  /fxgateway/async/benchmarkorder/api/v1:
    post:
      summary: Benchmark Order Asynchronous Request
      description: Use this endpoint to initiate a new spot, forward, or swap fixing order request.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FXBenchmarkOrder'
        required: true
      responses:
        '200':
          description: "OK Acknowledged.\n\n<b>Note: The response message will be sent via web socket.</b> Please see the User Guide for more information on using the web socket connection.   \n"
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Order_Acknowledged_Or_Rejected'
                - $ref: '#/components/schemas/Order_Accepted'
                - $ref: '#/components/schemas/Order_Rated'
        '401':
          description: Unauthorized user / Invalid_client (Not authorized to Oauth API) / Not registered to the plan
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
      tags:
      - Fxgateway
      security:
      - OAuth2:
        - fxapi
      - client_id: []
      operationId: postFxgatewayAsyncBenchmarkorderApiV1
      x-operation-id-source: derived
    servers:
    - url: https://sandbox.api.citivelocity.com/markets
      description: sandbox URL
    - url: https://api.citivelocity.com/markets
      description: production gateway URL
