    ba848120-2d1f-4ec0-9f5c-2aa51b5d1634-data-schema:
      type: object
      properties:
        SK_ACCT_ID:
          type: string
          description: The Safekeeping Account ID is an identifier for a Safekeeping Account that is unique within a branch.
          example: '0000123456'
        COUNTRY:
          type: string
          description: Country is the reclaim market
          example: GERMANY
        CODE_RCLM_CURR:
          type: string
          description: Reclaim Currency is the currency of the reclaim (currency in which the claim is made)
          example: EUR
        RECLAIM_REF:
          type: string
          description: Reclaim Reference is the unique identifying number for each reclaim in Citi system
          example: 600SE123456
        BO_BATCH_NO:
          type: string
          description: Batch Number is Citi's unique reference for the reclaims submitted to the Tax authorities (submission may contains more than 1 reclaim
          example: B910BE123456
        BEN_OWNER_NAME:
          type: string
          description: Beneficial Owner Name is the name of the Beneficiary Owner of the reclaim
          example: ABC Investments Ltd.
        DEPOT_CODE:
          type: string
          description: Depot Code is the internal Citi identifier for the local sub account the securities are held on
          example: NAY
        DATE_SENT_TO_FTA:
          type: string
          format: date
          description: Date sent to FTA is the date when the reclaim was submitted to the foreign tax authority
          example: '2020-05-14'
        DATE_SENT_TO_LTA:
          type: string
          format: date
          description: Date sent to LTA is the date when the reclaim was submitted to the local tax authority
          example: '2020-05-14'
        GERMAN_FILE_NUMBER:
          type: string
          description: E-Filing Serial (Reclaim) is the reference no. for electronically filed reclaim submission
          example: '1234567891'
        EFILE_REF:
          type: string
          description: E-File Reference is Citi's unique reference for each electronic submission to Tax authorities (submission may contains more than 1 reclaim)
          example: F500DE000345
        ENTITLEMENT_REF:
          type: string
          description: Entitlement Reference is the unique reference number generated from Citi internal systems for each line of taxable income
          example: '00365104513'
        CODE_RATE_CURR:
          type: string
          description: Rate Currency is the currency of the dividend.
          example: '54251700451'
        DIVIDEND_RATE:
          type: number
          format: double
          description: The Dividend Rate is the total expected dividend payments for an investment on an annualized basis.
          example: 1.953100028
        FX_RATE_EUR:
          type: number
          format: double
          description: FX Rate (EUR) is the FX rate used to convert the reclaim currency into EUR.
          example: 0.09401
        GROSS_DIV_EUR:
          type: number
          format: double
          description: Gross Dividend (EUR) is the value of the Gross Dividend expressed in Euro currency.
          example: 1500.75
        TAX_PAID_EUR:
          type: number
          format: double
          description: Local Tax (WHT Paid) (EUR) is the value of tax withheld expressed in Euro currency.
          example: 300.5
        NET_DIV_EUR:
          type: number
          format: double
          description: Net Dividend (EUR) is the value of is the dividend net of withholding tax expressed in Euro currency.
          example: 1200.25
        RECLM_VAL_EUR:
          type: number
          format: double
          description: Reclaim Amount (EUR) is the value of the amount being reclaimed expressed in Euro currency.
          example: 250
        AMT_RECVED_EUR:
          type: number
          format: double
          description: Reclaim Amount Received (EUR) is the value of the refund received from the Tax Authority expressed in Euro currency
          example: 240
        FX_RATE_GBP:
          type: number
          format: double
          description: FX Rate (GBP) is the FX rate used to convert the reclaim currency into GBP
          example: 0.8126
        GROSS_DIV_GBP:
          type: number
          format: double
          description: Gross Dividend (GBP) is the value of the Gross Dividend expressed in British pound currency
          example: 1300.4
        TAX_PAID_GBP:
          type: number
          format: double
          description: Local Tax (WHT Paid) (GBP) is the value of tax withheld expressed in British pound currency
          example: 260.35
        NET_DIV_GBP:
          type: number
          format: double
          description: Net Dividend (GBP) is the value of is the dividend net of withholding tax expressed in British pound currency
          example: 1040.05
        RECLM_VAL_GBP:
          type: number
          format: double
          description: Reclaim Amount (GBP) is the value of the amount being reclaimed expressed in British pound currency
          example: 215
        AMT_RECVED_GBP:
          type: number
          format: double
          description: Reclaim Amount Received (GBP) is the value of the refund received from the Tax Authority expressed in British pound currency
          example: 210
        EQUIVAL_RATE_CCY:
          type: number
          format: double
          description: Equivalent Rate is the dividend rate per share expressed in the currency of the reclaim.
          example: 1.15672
        GROSS_DIV_CCY:
          type: number
          format: double
          description: Gross Dividend is the value of the Gross Dividend expressed in the currency of the reclaim.
          example: 2000
        TAX_PAID_CCY:
          type: number
          format: double
          description: Local Tax (WHT Paid) is the value of tax withheld expressed in the currency of the reclaim.
          example: 400
        NET_DIV_CCY:
          type: number
          format: double
          description: Net Dividend is the value of is the dividend net of withholding tax expressed in the currency of the reclaim.
          example: 1600
        RECLM_VAL_RCY:
          type: number
          format: double
          description: Reclaim Amount is the value of the amount being reclaimed expressed in the currency of the reclaim.
          example: 320
        AMT_RECVED_CCY:
          type: number
          format: double
          description: Reclaim Amount Received is the value of the refund received from the Tax Authority excluding interest, expressed in the currency of the reclaim.
          example: 310
        FX_RATE_USD:
          type: number
          format: double
          description: FX Rate (USD) is the FX rate used to convert the reclaim currency into USD.
          example: 1.08
        GROSS_DIV_USD:
          type: number
          format: double
          description: Gross Dividend (USD) is the value of the Gross Dividend expressed in US dollar currency.
          example: 1650
        TAX_PAID_USD:
          type: number
          format: double
          description: Local Tax (WHT Paid) (USD) is the value of tax withheld expressed in US dollar currency
          example: 330
        NET_DIV_USD:
          type: number
          format: double
          description: Net Dividend (USD) is the value of is the dividend net of withholding tax expressed in US dollar currency.
          example: 1320
        RECLM_VAL_USD:
          type: number
          format: double
          description: Reclaim Amount (USD) is the value of the amount being reclaimed expressed in US dollar currency.
          example: 275
        AMT_RECVED_USD:
          type: number
          format: double
          description: Reclaim Amount Received (USD) is the value of the refund received from the Tax Authority expressed in US dollar currency.
          example: 270
        STATUS:
          type: string
          description: Reclaim Status is the current status of the reclaim.
          example: Suspended
        STATUS_CHANGE_DATE:
          type: string
          format: date
          description: Status Date is the date on which the status was last changed.
          example: '2023-06-05'
        ISSUER_TAX_ID:
          type: string
          description: Security Code is the SEDOL code (Stock Exchange Daily Official List identifier) of the security
          example: BW4NR74
        ISIN:
          type: string
          description: Alternate Security Code (ISIN) is the International Securities Identification Number.
          example: US0378331005
        SEC_SHRTN:
          type: string
          description: Security Name is the stock name of the security.
          example: BYSTRONIC
        LOCAL_TAX_ID:
          type: string
          description: Tax ID is the Beneficial Owner local Tax ID.
          example: A92145408
        WITH_RATE:
          type: number
          format: double
          description: WHT Rate is the rate of withholding tax applied to the income payment.
          example: 15.286
        CREATION_DATE:
          type: string
          format: date
          description: Input Date is the date when the reclaim was loaded to Citi's reclaim system.
          example: '2024-01-20'
        ALLOCATED_HOLDING:
          type: number
          format: double
          description: Holding Value is the number of reclaimable shares per reclaim.
          example: 500
        BO_DOMICILE:
          type: string
          description: BO Domicile (Fiscal Domicile) is the Domicile of beneficial owner
          example: HUNGARY
        ENTITY_TYPE:
          type: string
          description: 'Entity Type (Fiscal Type) is the Beneficial Owner entity type (i.e.: corporate, Pension Fund, etc.).'
          example: Individual
        PAY_DATE:
          type: string
          format: date
          description: Pay Date is the pay date of the dividend payment.
          example: '2024-03-31'
        PAYYEAR:
          type: number
          format: double
          description: Pay Year is the pay year of the dividend.
          example: 2024
        PAYQUARTER:
          type: string
          description: Pay Quarter is the pay quarter of the dividend.
          example: '1'
        EX_DATE:
          type: string
          format: date
          description: Ex Date is the trading cut off date after which position changes will no longer alter the eligibility to the corporate action.
          example: '2025-02-14'
        RECLAIM_RATE:
          type: number
          format: double
          description: Reclaim Rate is the percentage that the Ben Owner is entitled to reclaim back from the Foreign Tax Authorities (i.e. WHT Rate % less treaty rate).
          example: 10.012
        STATUTE_DTE:
          type: string
          format: date
          description: Statute Date is the last day the reclaim is in statute.
          example: '2025-12-31'
        EVENT_REFERENCE:
          type: string
          description: Event Reference is the Corporate Action event ID (CAID).
          example: '9304700792'
        CLIENT_REF:
          type: string
          description: Client Reference is a unique number assigned by the client, to the transaction, for identification purposes within their organization..
          example: '348888'
        INCOME_ACCOUNT:
          type: string
          description: Cash Account is the cash account number the income was paid to.
          example: 00000014168569
        FUND_NAME:
          type: string
          description: Portfolio Name is the name of the safekeeping account.
          example: FUND 501
        RECONCILIATION_DATE:
          type: string
          format: date
          description: Receipt Date is the date when the funds were credited into client's cash account.
          example: '2024-05-10'
        HOLDING:
          type: number
          format: double
          description: Total Entitlement Holding Amount is the total number of shares at entitlement level.
          example: 1000
        INT_AMT_CCY:
          type: number
          format: double
          description: Interest Amount Received is the amount of interest paid by the Foreign Tax Authority in addition to the tax reclaim value expressed in the currency of the reclaim
          example: 45.75
        INT_AMT_GBP:
          type: number
          format: double
          description: Interest Amount (GBP) is the amount of interest paid by the Foreign Tax Authority in addition to the tax reclaim value expressed in British pound currency
          example: 37.1
        INT_AMT_EUR:
          type: number
          format: double
          description: Interest Amount (EUR) is the amount of interest paid by the Foreign Tax Authority in addition to the tax reclaim value expressed in Euro currency
          example: 42.5
        INT_AMT_USD:
          type: number
          format: double
          description: Interest Amount (USD) is the amount of interest paid by the Foreign Tax Authority in addition to the tax reclaim value expressed in US dollar currency
          example: 48.2
        OVERRIDE_CNTRY_ID_TRS:
          type: number
          format: double
          description: Security Domicile (Stock Residency) is the country in which tax was withheld and where tax will be reclaimed
          example: 1
        MARKET:
          type: string
          description: Depot Domicile is the Depot domicile (Country where the sub-account is held).
          example: AUSTRALIA
        TOTAL_AMT_RECVED_CCY:
          type: number
          format: double
          description: Reclaim Amount Received is the value of the refund received from the Tax Authority including interest, expressed in the currency of the reclaim.
          example: 350
        TOTAL_AMT_RECVED_EUR:
          type: number
          format: double
          description: Reclaim Amount Received (EUR) is the value of the refund received from the Tax Authority including interest, expressed in Euro currency.
          example: 325
        TOTAL_AMT_RECVED_GBP:
          type: number
          format: double
          description: Reclaim Amount Received (GBP) is the value of the refund received from the Tax Authority including interest, expressed in British pound currency.
          example: 290
        TOTAL_AMT_RECVED_USD:
          type: number
          format: double
          description: Reclaim Amount Received (USD) is the value of the refund received from the Tax Authority including interest, expressed in US dollar currency.
          example: 380
        ACCT_BASE_NBR:
          type: string
          description: Account Base Number is an internal Citi client identifier that is associated to a Safekeeping or Cash Account.
          example: '133611'
        ACCT_BUS_TYP_CD:
          type: string
          description: 'Account Type Code indicates the type of the account. Values are: C (Cash Account), S (Safekeeping Account).'
          example: C
        ACCT_BUS_TYP_NME:
          type: string
          description: Account Type Description indicates the type of the account. Values are CASH (C), S/K (S).
          example: CASH
        ACCT_CLS_DT:
          type: string
          format: date
          description: Account Close Date is the date when the account was closed. It will only have a value if the account is closed.
          example: '2024-12-31'
        ACCT_ID:
          type: string
          description: Account ID is an identifier for both a Cash Account and/or a Safekeeping Account that is unique within a branch.
          example: DEMOSK02US
        ACCT_NME:
          type: string
          description: Account Name is the name that is assigned to the Cash Account and/or the Safekeeping Account. If an Alternate Account Name has been specified for an account it will be displayed as the Account Name.
          example: Demo - SK - US DCC Equity
        ACCT_OPN_DT:
          type: string
          format: date
          description: Account Open Date is the date when the account was opened.
          example: '2020-01-15'
        ACCT_STS_TYP:
          type: string
          description: 'Account Status provides the current status of the Cash Account and/or the Safekeeping Account. Values are: Open, Closed, Frozen'
          example: Open
        ALTV_CUR_CD:
          type: string
          description: Account Base Currency Code is the ISO Currency Code for the account.
          example: JPY
        BR_ID:
          type: string
          description: Branch Code is the identifier of the branch for the account. For the Cash Account the branch code is a numeric value and for the Safekeeping Account it is the ISO Country code.
          example: SG
        BR_NME:
          type: string
          description: Branch Name is the name of the branch for the Cash Account and/or Safekeeping Account.
          example: CITIBANK JAPAN LTD
        CASH_TYPE:
          type: number
          format: double
          description: Cash Type Code pertains to US Direct Cash Accounts and indicates whether the Cash Account has a split income and principal balance.
          example: 1
        GFC_ID:
          type: string
          description: Client ID is an identifier that is available on a Cash Account and/or a Safekeeping Account. This Client ID is referred to, internally at Citi, as a GFCID.
          example: '1000123456'
        IBAN:
          type:
          - string
          - 'null'
          description: IBAN is the International Bank Account Number for the Cash Account.
          example: 'null'
        CMPNY_NME:
          type: string
          description: Company Name is the name of the company which issued the security.
          example: ABC Capital Ltd.
        SEC_DESC:
          type: string
          description: Issue Description contains the name and other details of the instrument.
          example: SOPRA STERIA GROUP
        SEC_SECURITY_CD:
          type: string
          description: CITI Internal Security Code is the identifier of the CITI Internal Security Identifier.
          example: BVGH0K1
        SEC_SHRT_NME:
          type: string
          description: Issue Name is the Security Name of the security instrument.
          example: NESTLE
        SID_BLOOMBERG:
          type: string
          description: Bloomberg ID is the value supplied by Bloomberg to identify the security.
          example: BBG00K60SBR4
        SID_CUSIP:
          type: string
          description: CUSIP (Committee on Uniform Securities Identification Procedures) It is a nine-character alphanumeric code that identifies a North American financial security for the purposes of facilitating clearing and settlement of trades.
          example: E00460233
        SID_LOCAL:
          type: string
          description: Local ID is the Local security identifier of the associated security.
          example: DNB
        SID_TICKER_SYMB:
          type: string
          description: Ticker is the symbol used on the exchange to identify the security.
          example: KINVB
        ACRL_BASIS_CDE:
          type: string
          description: 'Accrual Basis Code is a code linked to the Accrual Basis field which indicates the basis on which interest accruals are calculated. Values include: 00043 (360 / 365), 00011 (360 / 360), 00063 (30 / 360 Non-EOM), etc.'
          example: '00011'
        ACRL_BASIS_NME:
          type: string
          description: Accrual Basis Description is the basis on which interest accrual is calculated, e.g. 30/360 meaning nominal 30 day months and a 360 day year.
          example: Actual/360
        CURR_FCTR_RATE:
          type: number
          format: double
          description: Current Factor is the factor which applies to the current accrual period to determine payments and balances for principal paying securities.
          example: 0.4515268
        DLAY_DAYS:
          type: string
          description: Delay Days is the number of days from the issuance of an MBS pool (or from the beginning of the interest accrual period) until the first payment is remitted/paid to the holders.
          example: '13'
        DNOMD_CUR_CD:
          type: string
          description: Denomination Currency Code is the ISO currency code in which the security is denominated, in the local market.
          example: USD
        DTED_TMS:
          type: string
          format: date-time
          description: Dated Date/Time is the date that the interest begins to accrue on a fixed-income security.
          example: '2019-08-26 00:00:00'
        FCTR_DTE:
          type: string
          format: date-time
          description: Factor Date is the date the current factor is applicable from for principal paying securities.
          example: '2023-12-10 00:00:00'
        INCM_CUR_CD:
          type: string
          description: Income Currency Code is the ISO currency code in which income payments will be made for the security in the local market.
          example: EUR
        INCM_CUR_NME:
          type: string
          description: Income Currency Name is the name of the currency in which income payments will be made for the security in the local market.
          example: Euro
        INCM_PROJN_RATE:
          type: number
          format: double
          description: Interest Rate is the coupon rate of the security.
          example: 3.0946
        ISS_CAT_NME:
          type: string
          description: 'Issue Category is the description for the Issue Category Code. Values include: Common Stock (CSTK), Derivatives (DERIV), Mortgage Backed Securities (MBS), etc.'
          example: Derivatives
        ISS_CATG_CD:
          type: string
          description: 'Issue Category Code is a specific category for the security. Values include: CSTK (Common Stock), DERIV (Derivatives), MBS (Mortgage Backed Securities), etc.'
          example: DERIV
        ISS_TMS:
          type: string
          format: date-time
          description: Issue Date is the date of first issue of the security.
          example: '2019-11-26 00:00:00'
        ISSR_LOC_CD:
          type: string
          description: 'Issuer Location Code is the ISO country code where the issuer of the security is based. Values include: AR (Argentina), CA (Canada), IE (Ireland), etc.'
          example: US
        ISSR_LOC_NME:
          type: string
          description: 'Issuer Location is the name of the country where the issuer of the security is based. Values include: Argentina (AR), Canada (CA), Ireland (IE), etc.'
          example: United States
        MATY_DT:
          type: string
          format: date-time
          description: Maturity Date is the date of maturity or redemption for fixed income securities.
          example: '2041-10-10 00:00:00'
        NXT_PAY_DT:
          type: string
          format: date
          description: Next Payable Date is the next date on which a dividend or interest payment is scheduled to be paid.
          example: '2026-07-15'
        PFD_ID_CTXT_CD:
          type: string
          description: 'Security ID Type indicates the type of identifier of the corresponding Security ID field. Values include: CUSIP, ISIN, SEDOL, LOCAL, etc.'
          example: ISIN
        PFD_ISS_ID:
          type: string
          description: Security ID is the most commonly used identifier for the security in a given market.
          example: BFXCMX4
        PMT_FREQY_DESC:
          type: string
          description: 'Payment Frequency Description indicates how often interest is paid on the security. Values include: Annual (00001), Sem-Annual (00002), One Payment Per Year (00035), etc.'
          example: Sem-Annual
        POOL_ID_CD:
          type: string
          description: Pool ID is an alphanumeric code that identifies a particular mortgage backed security.
          example: AB1234
        PREV_FCTR_RATE:
          type: number
          format: double
          description: Previous Factor is the factor which applies to the last accrual period to determine payments and balances for principal paying securities.
          example: 0.9985
        SEC_GROUP:
          type: string
          description: 'Asset Type is a code representing the Asset Type of the security. Values include: EQTY (Equity), FI (Fixed Income), etc.'
          example: EQTY
        SEC_SUB_TYP_CD:
          type: string
          description: 'Issue Type Code is a code linked to the Issue Type field which describes the type of security instrument. Values include: 1 (ADR Convertible), 12 (Bond), 19 (Bond Convertible), etc.'
          example: '12'
        SEC_SUB_TYP_NME:
          type: string
          description: 'Issue Type is a description of the type of the security instrument. Values include: ADR Convertible (1), Bond (12) , Bond Convertible (19), etc.'
          example: Bond
        STRK_PRC_AMT:
          type: number
          format: double
          description: Strike Price is the specified price on an options contract at which the contract may be exercised.
          example: 150.09
        US_SIC_CD:
          type: string
          description: SIC is the Standard Industrial Classification four-digit numeric code.
          example: '7372'
        PAYABLE_DATE:
          type: string
          format: date
          description: Payable Date is the date on which a dividend or interest payment is scheduled to be paid.
          example: '2026-08-28'
