  /v1/mandates/status:
    patch:
      summary: Change the Status of a Mandate
      description: >-
        This endpoint allows you to change the status of a mandate. A status
        change should always be performed as a unilateral operation. The status
        change can only be performed when the mandate is currently active or
        suspended. Releasing a suspended mandate can only be performed by the
        party that suspended the mandate.
      operationId: updateMandateStatus
      parameters:
        - name: client_id
          in: query
          description: >-
            Unique reference which was shared during CitiConnect API Onboarding
            (`client_id` which used during OAuth token generation).
          required: true
          schema:
            type: string
            example: 4683fd9f-03fe-4268-b5da-93bf8203fd91
        - name: mandate_identification
          in: query
          description: >-
            Specify unique identification, as assigned by the clearing scheme,
            to identify the mandate.
          required: true
          schema:
            type: string
            example: CRED14243536457658
      requestBody:
        description: Update mandate client details required.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMandateDetails'
      callbacks:
        asynchronous-mandatestatuschange-push-notification:
          $ref: '#/components/callbacks/UpdateStatusPushNotification'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateResponse'
        '400':
          description: Bad Request
