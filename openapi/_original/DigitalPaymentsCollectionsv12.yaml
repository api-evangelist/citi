    Mandate-Status-Notification:
      type: object
      title: Mandate Initiation Status Notification
      required:
        - mandate
      properties:
        mandate:
          $ref: '#/components/schemas/Mandate-Initiation-Status-Mandate-Notification'
        customer:
          $ref: '#/components/schemas/Mandate-Initiation-Status-Customer-Notification'
        sender:
          $ref: '#/components/schemas/Mandate-Initiation-Status-Sender-Notification'
        merchant:
          $ref: '#/components/schemas/Mandate-Initiation-Status-Merchant-Notification'
    Mandate-Initiation-Status-Mandate-Notification:
      type: object
      title: Mandate Notification
      required:
        - id
      properties:
        id:
          description: |-
            Unique Id assigned to identify the mandate 
            - This parameter is mandatory for Brazil with max length 29
          minLength: 1
          maxLength: 35
          type: string
          example: RR3347902320251109BR345678901
          title: id
        request_id:
          description: |-
            Unique Id assigned to identify request made on the mandate 
            - This parameter is mandatory for Brazil with max length 29
          minLength: 1
          maxLength: 35
          type: string
          example: SC3347902320251109R2345678901
          title: request_id
        frequency:
          description: >-
            Frequency in which payments are to be processed YEAR = Annual, MNTH
            = Monthly, QURT = Quarterly, MIAN = Semiannual, WEEK = Weekly, DAIL
            = Daily, ADHO = Ad hoc, INDA = Intraday, FRTN = Fortnightly & OOFF =
            One Off 

            - This parameter is mandatory for Brazil
          type: string
          enum:
            - YEAR
            - MNTH
            - QURT
            - MIAN
            - WEEK
            - DAIL
            - ADHO
            - INDA
            - FRTN
            - OOFF
          example: MNTH
          title: frequency
        start_date:
          description: |-
            Effective start date for the payment in YYYY-MM-DD format 
            - This parameter is mandatory for Brazil
          type: string
          format: date
          example: '2025-12-07'
          title: start_date
        end_date:
          description: |-
            Effective end date for the payment in YYYY-MM-DD format 
            - This parameter is optional for Brazil
          type: string
          format: date
          example: '2025-12-07'
          title: end_date
        auto_debit:
          description: >-
            Specifies whether the direct debit instructions should be
            automatically re-submitted periodically 

            - This parameter is mandatory for Brazil
          type: boolean
          example: false
          title: auto-debit
        amount:
          description: >-
            Fixed amount to be collected from the customer's account 

            - This parameter is optional for Brazil with 18 digits including 2
            decimals
          minimum: 0.01
          maximum: 1000000000000000000
          type: number
          example: 1000
          title: amount
        max_amount:
          description: >-
            Max amount to be collected from customer's account 

            - This parameter is optional for Brazil with 18 digits including 2
            decimals
          minimum: 0.01
          maximum: 1000000000000000000
          type: number
          example: 1000
          title: max_amount
        currency_code:
          type: string
          description: |-
            Currency Code for the mandate 
            - This parameter is mandatory for Brazil
          enum:
            - BRL
          example: BRL
          title: currency_code
        reason_code:
          description: |-
            Reason Code for rejection 
            - This parameter is optional for Brazil with max length 4
          minLength: 1
          maxLength: 35
          type: string
          example: AC01
          title: reason_code
        description:
          description: |-
            Description against the status or/and reason code 
            - This parameter is optional For Brazil
          minLength: 1
          maxLength: 105
          type: string
          example: IncorrectAccountNumber
          title: description
        status:
          description: |-
            Mandate Status 
            - This parameter is mandatory for Brazil
          type: string
          enum:
            - ACTIVE
            - PENDING_AUTHORIZATION
            - REJECTED
            - CANCELLED
          example: ACTIVE
          title: status
        reference_id:
          description: |-
            Reference Id given by merchant such as contract/document number 
            - This parameter is mandatory for Brazil with max length 35
          minLength: 1
          maxLength: 35
          type: string
          example: 84126/12
          title: reference_id
        creation_date_time:
          type: string
          format: date-time
          description: >-
            Date and time at which the message was created in format
            YYYY-MM-DDTHH:MM:SS.sssZ in UTC time zone 

            - This parameter is mandatory for Brazil
          example: '2022-09-13T08:23:49.114Z'
          title: creation_date_time
        additional_info:
          type: string
          maxLength: 140
          minLength: 1
          description: |-
            Additional Info on the mandate 
            - This parameter is optional for Brazil with max length 35
          title: additional_info
        qr_string:
          type: string
          maxLength: 512
          description: |-
            Dynamic QR Code based on the merchant payload request 
            - This parameter is optional for Brazil
          example: >-
            00020101021226700014br.gov.bcb.pix.citi.com.br/qr/2/8b3da2f39a4140d1a91abd93113bd44
            15204000053039865802BR5913Fulano de
            Tal6008BRASILIA62070503***630464E4
          title: qr_string
