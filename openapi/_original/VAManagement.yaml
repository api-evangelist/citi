openapi: 3.0.3
info:
  title: Receivable Services
  description: >-
    CitiConnect API service allows you to do the virtual account (VA) creation
    functionality directly from your client ERP system. You can access the VA
    APIs create and manage functions such as update, delete, and inquiry for
    virtual accounts. You can create VAs using the reservation and activation
    endpoints.
  contact:
    name: Standards & Developer Hub
    url: https://tts.sandbox.developer.citi.com/citiconnect/
    email: developer-support@citi.com
  version: 1.0.0
servers:
  - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb
    description: 'sandbox URL '
  - url: https://tts.apib2b.citi.com/citiconnect/prod
    description: production gateway URL
tags:
  - name: Virtual Account-Wallet
paths:
  /receivablesservices/v2/virtualaccounts:
    post:
      tags:
        - Virtual Account-Wallet
      summary: Reserve Virtual Accounts
      description: >-
        The virtual account creation is a 2-step process (using the reservation
        and activation services), you can use POST and PUT endpoints one after
        another. <br> Contact your citi representative for the number of
        accounts you can request for reservation per API. <br> <br> Use
        <b>POST</b> verb for <b>Reservation</b> action <br> - The API support
        XML and JSON formats. <br> - The reservation/activation functionality is
        identified based on the request payload (`action`). <br> - You specify
        values for input parameters in the body of your XML/JSON document. <br>
        - You encrypt the payload, place it in your request and send it with
        your application.<br><br><font size='2'><b>Content-Type:</b> Supports
        application/xml and application/json. <br><b>Authorization:</b> The
        OAuth Token prefixed with bearer and a space in between.
        <br><br><b>Allowed characters:</b> A-Z, a-z, 0-9, Space <br><b>Allowed
        punctuation marks:</b> ' ( ) * - , . / : ; _ & { } $ # @ [ ]
      operationId: virtualAccountReservation
      parameters:
        - $ref: '#/components/parameters/Client-Id'
        - $ref: '#/components/parameters/Idempotency-Id'
      requestBody:
        description: Describes the virtual account creation APIs request body parameters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Virtual-Account-Reservation-Request'
            examples:
              VAReservationExample:
                $ref: '#/components/examples/Reservation-Example'
          application/xml:
            schema:
              $ref: '#/components/schemas/Virtual-Account-Reservation-Request'
            examples:
              VAReservationExample:
                value: >-
                  <VirtualAccountReservationRequest><Action>RESERVATION</Action><HeaderAccount><Account>0011224455</Account><BranchCode>930</BranchCode></HeaderAccount><NumAcctReq>50</NumAcctReq><Purpose>C</Purpose></VirtualAccountReservationRequest>
      responses:
        '202':
          $ref: '#/components/responses/Accepted-Response'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '409':
          $ref: '#/components/responses/Idempotency-Duplication'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '429':
          $ref: '#/components/responses/Too-Many-Request'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
        - clientCredentials: []
      callbacks:
        virtual-account-reservation:
          $ref: '#/components/callbacks/Reservation-Response'
    put:
      tags:
        - Virtual Account-Wallet
      summary: Activate Virtual Accounts
      description: >-
        The virtual account creation is a 2-step process (using the reservation
        and activation services), you can use POST and PUT endpoints one after
        another. <br> <br> Use <b>PUT</b> verb for <b>Activation</b> action <br>
        - The API support XML and JSON formats. <br> - The
        reservation/activation functionality is identified based on the request
        payload (action). <br> - You specify values for input parameters in the
        body of your XML/JSON document. <br> - You encrypt the payload, place it
        in your request and send it with your application.<br><br><font
        size='2'><b>Content-Type</b>: Supports application/xml and
        application/json. <br><b>Authorization</b>: The OAuth Token prefixed
        with Bearer and space in between. <br><br><b>Allowed characters:</b>
        A-Z, a-z, 0-9, Space <br><b>Allowed punctuation marks:</b> ' ( ) * - , .
        / : ; _ & { } $ # @ [ ]
      operationId: virtualAccountActivation
      parameters:
        - $ref: '#/components/parameters/Client-Id'
      requestBody:
        description: Describes the virtual account creation APIs request body parameters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Virtual-Account-Activation-Request'
            examples:
              VAActivationEntityIdExample:
                $ref: '#/components/examples/Activation-Entity-Id-Example'
              VAActivationEntityDetailsExample:
                $ref: '#/components/examples/Activation-Entity-Details-Example'
          application/xml:
            schema:
              $ref: '#/components/schemas/Virtual-Account-Activation-Request'
            examples:
              VAActivationEntityIdExample:
                value: >-
                  <VirtualAccountActivationRequest><Action>ACTIVATION</Action><HeaderAccount><Account>51218421</Account><BranchCode>930</BranchCode></HeaderAccount><VirtualAccount><Account>10000000202133567</Account><Purpose>C</Purpose><BalanceDisplayOption>Y</BalanceDisplayOption><Entity><Id>DMB0TGcLscEhdjsP0YRl</Id><CtryOfOpr>CA</CtryOfOpr></Entity></VirtualAccount></VirtualAccountActivationRequest>
              VAActivationEntityDetailsExample:
                value: >-
                  <VirtualAccountActivationRequest><Action>ACTIVATION</Action><HeaderAccount><Account>51218421</Account><BranchCode>930</BranchCode></HeaderAccount><VirtualAccount><Account>10000000201340652</Account><Purpose>C</Purpose><BalanceDisplayOption>Y</BalanceDisplayOption><Entity><LastName>FDGDFGFDG</LastName><Type>C</Type><DateOfBirth>2024-02-29</DateOfBirth><Website>GHHsdc.co</Website><StoreName>BNVJHGJH</StoreName><BusinessPurpose>watches/BusinessPurpose</BusinessPurpose><Acronym>abc</Acronym><CtryOfOpr>US</CtryOfOpr><OrganisationPrivateIdentification><Type>TAX_ID</Type><Id>A{{$timestamp}}</Id><CountryOfIssuance>CN</CountryOfIssuance></OrganisationPrivateIdentification><Address><StrtNm>3100
                  Keele st</StrtNm><BldgNb>533</BldgNb><PstCd>L5B
                  3Y6</PstCd><TwnNm>North
                  York</TwnNm><CtrySubDvsn>Ontario</CtrySubDvsn><Ctry>CN</Ctry></Address></Entity><BeneficialOwner><BeneficialOwner><FirstName>GGHJFHJG</FirstName><LastName>CFFHG</LastName><DateOfBirth>2024-02-29</DateOfBirth><Address><StrtNm>534
                  cYTross
                  st</StrtNm><BldgNb>533</BldgNb><PstCd>785263</PstCd><TwnNm>caralado</TwnNm><CtrySubDvsn>US</CtrySubDvsn><Ctry>US</Ctry></Address></BeneficialOwner></BeneficialOwner></VirtualAccount></VirtualAccountActivationRequest>
      callbacks:
        virtual-account-activation:
          $ref: '#/components/callbacks/Activation-Response'
      responses:
        '202':
          $ref: '#/components/responses/Accepted-Response'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '429':
          $ref: '#/components/responses/Too-Many-Request'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
        - clientCredentials: []
    patch:
      tags:
        - Virtual Account-Wallet
      summary: Update Virtual Accounts
      description: >-
        The virtual account update (using the update service endpoint) allows
        you to modify virtual account information. <br> <br> Use the
        <b>PATCH</b> verb for <b>Update</b> action <br> - The API support XML
        and JSON formats. <br> - The update functionality is identified based on
        the request payload (action). <br> - You specify values for input
        parameters in the body of your XML/JSON document. <br> - You encrypt the
        payload, place it in your request, and send it with your application.
        <br><br> The virtual account update endpoint allows you to modify the
        virtual account details and status. <br> Below are the sub-object
        combinations allowed under the virtual_account object for updates: <br>
        <br> <b>- VALID combination 1:</b> For `virtual_account.entity.type = C`
        (Company), update the entity details under a virtual_account using the
        `virtual_account.entity` as well as
        `virtual_account.beneficial_owner`<br> <b>- VALID combination 2:</b> For
        `virtual_account.entity.type = S` (Sole Trader), update the entity
        details under a virtual_account using the `virtual_account.entity`<br>
        <b>- VALID combination 3:</b> For `virtual_account.entity.type = I`
        (Individual), update the entity details under a virtual_account using
        the `virtual_account.entity`<br> <b>- VALID combination 4:</b> Apply the
        posting restrictions on virtual_account use only the
        `virtual_account.credit_debit_preferences` object <br><br> Below are the
        INVALID object combinations for the PATCH endpoint: <br> <b>- INVALID
        combination 1:</b> Only with `virtual_account.entity` for
        `virtual_account.entity.type = C` (Company) <br> <b>- INVALID
        combination 2:</b> Only with `virtual_account.beneficial_owner`<br> <b>-
        INVALID combination 3:</b> With all 3 objects, `virtual_account.entity`,
        `beneficial_owner`, `credit_debit_preferences`<br> <b>- INVALID
        combination 4:</b> With 2 objects, `virtual_account.entity`,
        `credit_debit_preferences`<br> <b>- INVALID combination 5:</b> With 2
        objects, `virtual_account.beneficial_owner`,
        `credit_debit_preferences`<br> <br><font size='2'><b>Content-Type</b>:
        Supports application/xml and application/json. <br>
        <b>Authorization</b>: The OAuth Token prefixed with Bearer and space in
        between. <br><br><b>Allowed characters:</b> A-Z, a-z, 0-9, Space
        <br><b>Allowed punctuation marks:</b> ' ( ) * - , . / : ; _ & { } $ # @
        [ ]
      operationId: virtualAccountUpdate
      parameters:
        - $ref: '#/components/parameters/Client-Id'
      requestBody:
        description: >-
          Describes the virtual account creation endpoint request body
          parameters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Virtual-Account-Update-Request'
            examples:
              VAUpdateEntityDetailsExample:
                $ref: '#/components/examples/Update-Entity-Details-Example'
              VAPostingRestrictionExample:
                $ref: '#/components/examples/Update-Posting-Restriction-Example'
          application/xml:
            schema:
              $ref: '#/components/schemas/Virtual-Account-Update-Request'
            examples:
              VAUpdateEntityDetailsExample:
                value: >-
                  <VirtualAccountUpdateRequest><Action>UPDATE</Action><HeaderAccount><Account>51218421</Account><BranchCode>930</BranchCode></HeaderAccount><VirtualAccount><Account>9305441932</Account><Entity><LastName>INC</LastName><Id>FGlajbO0_vpOdtwXU3Oi</Id><Type>C</Type><DateOfBirth>2002-11-12</DateOfBirth><Website>www.dd.com</Website><StoreName>dd</StoreName><BusinessPurpose>dd</BusinessPurpose><Acronym>dd</Acronym><CtryOfOpr>US</CtryOfOpr><OrganisationPrivateIdentification><Type>TAX_ID</Type><CountryOfIssuance>US</CountryOfIssuance><Id>A1737720860</Id></OrganisationPrivateIdentification><Address><StrtNm>125
                  Oain
                  st</StrtNm><BldgNb>155/356</BldgNb><PstCd>14526369</PstCd><TwnNm>cuba</TwnNm><CtrySubDvsn>NC32</CtrySubDvsn><Ctry>US</Ctry></Address></Entity><BeneficialOwner><BeneficialOwner><FirstName>GGHJFHJG</FirstName><LastName>CFFHG</LastName><DateOfBirth>2002-11-12</DateOfBirth><Address><StrtNm>534
                  cYTross
                  st</StrtNm><BldgNb>22</BldgNb><PstCd>785263</PstCd><TwnNm>caralado</TwnNm><CtrySubDvsn>US</CtrySubDvsn><Ctry>US</Ctry></Address></BeneficialOwner></BeneficialOwner></VirtualAccount></VirtualAccountUpdateRequest>
              VAPostingRestrictionExample:
                value: >-
                  <VirtualAccountUpdateRequest><Action>UPDATE</Action><HeaderAccount><Account>51218421</Account><BranchCode>930</BranchCode></HeaderAccount><VirtualAccount><Account>10000000202133567</Account><CreditDebitPreferences><DisallowCredit>Y</DisallowCredit><DisallowDebit>N</DisallowDebit></CreditDebitPreferences></VirtualAccount></VirtualAccountUpdateRequest>
      callbacks:
        virtual-account-activation:
          $ref: '#/components/callbacks/Update-Response'
      responses:
        '202':
          $ref: '#/components/responses/Accepted-Response'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '409':
          $ref: '#/components/responses/Idempotency-Duplication'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '429':
          $ref: '#/components/responses/Too-Many-Request'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
        - clientCredentials: []
    get:
      tags:
        - Virtual Account-Wallet
      summary: Check Virtual Account Status and Details
      description: >-
        The virtual account inquiry endpoint can be used primarily for virtual
        account status check as well as information purposes. <br> <br> <b>-
        Scenario 1:</b> `request_id` (applicable only for reservation API (verb:
        POST) `request_ids`))<br> <b>- Scenario 2:</b> `virtual_account`<br>
        <b>- Scenario 3:</b> `virtual_account`, `branch_code`<br> <b>- Scenario
        4:</b> `request_id` and `virtual_account` (preference will be given to
        `virtual_account` and the `request_id` will be ignored)
      operationId: virtualAccountInquiry
      parameters:
        - $ref: '#/components/parameters/Client-Id'
        - $ref: '#/components/parameters/Branch-Code'
        - $ref: '#/components/parameters/Reservation-Request-Id'
        - $ref: '#/components/parameters/Encrypted-Params'
      responses:
        '200':
          $ref: '#/components/responses/Inquiry-Response'
        '400':
          $ref: '#/components/responses/Bad-Request-Sync-Response'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '429':
          $ref: '#/components/responses/Too-Many-Request'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
        - clientCredentials: []
    delete:
      tags:
        - Virtual Account-Wallet
      summary: Deactivate Virtual Accounts
      description: >-
        Deactivation can be performed only if an account holds no balances. <br>
        Deactivation is an irreversible action<br> Please perform the necessary
        verification before deactivating any virtual accounts.
      operationId: virtualAccountDeactivation
      parameters:
        - $ref: '#/components/parameters/Client-Id'
        - $ref: '#/components/parameters/Branch-Code'
        - $ref: '#/components/parameters/Encrypted-Params'
      responses:
        '202':
          $ref: '#/components/responses/De-Activation-Accepted-Response'
        '400':
          $ref: '#/components/responses/De-Activation-Bad-Request-Response'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '429':
          $ref: '#/components/responses/Too-Many-Request'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      callbacks:
        virtual-account-activation:
          $ref: '#/components/callbacks/De-Activation-Response'
components:
  parameters:
    Client-Id:
      name: client_id
      in: query
      description: >-
        Unique reference shared during CitiConnect API onboarding (`client_id`
        used during OAuth token generation).
      required: true
      schema:
        type: string
        maxLength: 128
        example: f56f0f6b-74fe-4dfa-b4ab-0da35a46b65e
    Idempotency-Id:
      name: Idempotency-Id
      in: header
      description: >-
        Your unique identification for a POST request <br> - Maximum length is
        128. <br>-  CitiConnect API responds with an error (HTTP status 4XX) if
        your POST request idempotency identification value is a duplicate across
        a recent history of idempotency identifications in Citi's database<br>-
        If you don't receive any response (HTTP status 2XX, 4XX or 5XX) from
        Citi to your POST request and you wish to retry, re-initiate your
        request with the same idempotency identification to prevent an
        accidental duplicate payment.
      required: true
      schema:
        type: string
        maxLength: 128
        example: a44cbb606de4edb9a7a123414bba3bb
    Apim-Guid:
      name: Apim-Guid
      in: header
      required: true
      description: >-
        Unique system-generated reference number, refer this number in case of
        any discrepancy reporting to a Citi representative.
      schema:
        type: string
        maxLength: 52
        minLength: 1
        example: na-apimgwgtds04~4a98cbc5-d813-4e65-bc81-d70f0f87f6ec
    Event-Type:
      name: Event-Type
      in: header
      required: true
      description: Describes the PUSH Notification (callback) event type.
      schema:
        type: string
        maxLength: 20
        minLength: 1
        example: VAMAPI
    Event-Name:
      name: Event-Name
      in: header
      required: true
      description: Describes the PUSH Notification (callback) event name.
      schema:
        type: string
        maxLength: 20
        minLength: 1
        example: Status Update
    Pagination-Metadata:
      name: Pagination-Metadata
      in: header
      required: true
      description: >-
        current_page: current page number<br> total_page: total number of pages
        available for your request<br> page_size: total number of records
        available in the current page<br> has_more: anymore message or records
        expected
      schema:
        type: string
      example: '{"current_page":2, "total_pages":10, "page_size":100,"has_more":true}'
    Branch-Code:
      name: branch_code
      in: query
      required: false
      description: Citi's bank code associated with given a header account number.
      schema:
        type: string
        minLength: 3
        maxLength: 4
      example: '960'
    Reservation-Request-Id:
      name: request_id
      in: query
      required: false
      description: >-
        <b> request_id </b> received as part of 'Reservation API' response. <br>
        Inquiry using the `request_id` parameter can be done only if the virtual
        account is not ACTIVATED yet. <br> Inquiry can be made up to 90 days
        from the date from which the `request_id` was created.
      schema:
        type: string
        minLength: 1
        maxLength: 40
      example: 0ae52a57-01ff-43a0-a8cc-6112dfcb4c64
    Encrypted-Params:
      name: Encrypted-Params
      in: header
      schema:
        type: string
      description: >-
        Encrypt the key values as below: <br> - Virtual account <br> <br> Use
        your digital cert to do the encryption. <br> <br>
        <b>virtual_account:</b> <br> In the GET operation: Virtual account that
        was reserved as well as activated are allowed <br> In DELETE operation:
        Virtual account that was activated is only allowed
      example: '{"virtual_account":"1234567890"}'
  schemas:
    Virtual-Account-Reservation-Request:
      title: VirtualAccountReservationRequest
      xml:
        name: VirtualAccountReservationRequest
      required:
        - action
      properties:
        action:
          title: action
          xml:
            name: Action
          type: string
          description: >-
            Action is a request type. <br> - Choose the action value as
            ''RESERVATION'', if you want to reserve virtual accounts for the
            previous virtual header account.
          enum:
            - RESERVATION
          example: RESERVATION
        header_account:
          $ref: '#/components/schemas/Header-Account'
        number_of_accounts_required:
          title: number_of_accounts_required
          xml:
            name: NumAcctReq
          type: integer
          minimum: 1
          maximum: 50000
          description: >-
            Required parameter only if the value of the `action` parameter is
            'RESERVATION'.<br><br> This parameter specifies the number of
            virtual accounts requested to be reserved. Minimum account that can
            be requested/supported under one API call is 1. Contact your Citi
            representative for the number of accounts you are allowed to request
            per API call.
          example: 10
        purpose:
          $ref: '#/components/schemas/Purpose-Ref'
    Virtual-Account-Activation-Request:
      title: VirtualAccountActivationRequest
      xml:
        name: VirtualAccountActivationRequest
      required:
        - action
      properties:
        action:
          title: action
          xml:
            name: Action
          type: string
          description: >-
            Action is a request type.  <br> - Choose the action value as
            ''ACTIVATION'', if you want to activate the virtual account which
            was reserved earlier.
          enum:
            - ACTIVATION
          example: ACTIVATION
        header_account:
          $ref: '#/components/schemas/Header-Account'
        virtual_account:
          $ref: '#/components/schemas/Virtual-Account'
    Virtual-Account-Update-Request:
      title: VirtualAccountRequest
      xml:
        name: VirtualAccountUpdateRequest
      required:
        - action
      properties:
        action:
          title: action
          xml:
            name: Action
          type: string
          description: >-
            Action is a request type.  <br> - Choose the action value as
            'UPDATE', if you want to update the virtual account details that
            were stored earlier.
          enum:
            - UPDATE
          example: UPDATE
        header_account:
          $ref: '#/components/schemas/Header-Account'
        virtual_account:
          $ref: '#/components/schemas/Virtual-Account-Update'
    Header-Account:
      title: HeaderAccount
      xml:
        name: HeaderAccount
      type: object
      properties:
        account:
          title: account
          xml:
            name: Account
          type: string
          minLength: 1
          maxLength: 40
          description: >-
            Required parameter if the value of the `action` parameter is
            'RESERVATION' (or) 'ACTIVATION' (or) 'UPDATE'. Specifies the header
            account number assigned during the account opening.
          example: '0123456789'
        branch_code:
          title: branch_code
          xml:
            name: BranchCode
          type: string
          minLength: 3
          maxLength: 4
          description: Citi's bank code associated with given a header account number.
          example: '820'
    Virtual-Account:
      title: VirtualAccount
      xml:
        name: VirtualAccount
      type: object
      properties:
        account:
          title: account
          xml:
            name: Account
          type: string
          minLength: 1
          maxLength: 40
          description: >-
            Required parameter only if the value of the `action` parameter is
            'ACTIVATION'.<br><br>This parameter specifies the virtual account to
            be activated.
          example: '0123456789'
        purpose:
          $ref: '#/components/schemas/Purpose-Ref'
        balance_display_option:
          title: balance_display_option
          xml:
            name: BalanceDisplayOption
          type: string
          enum:
            - 'Y'
            - 'N'
          description: >-
            This parameter is only applicable if the value of the `action`
            parameter is set to 'ACTIVATION'.<br><br> This parameter specifies
            whether to display opening or closing balances or not. Default value
            is 'Y'.<br><br>Description of possible parameter values:<br><b>Y -
            Show virtual account opening and closing balances. <br><br> <b>N -
            Show ZERO opening and closing balance for virtual account in
            statements and reports.
          example: 'Y'
        entity:
          $ref: '#/components/schemas/Entity'
        beneficial_owner:
          title: BeneficialOwner
          description: >-
            This parameter is only applicable if the value of the `action`
            parameter is set to 'ACTIVATION' and the relevant purpose parameter
            is ENUMS. <br> <br> Required parameter if the `entity.id` parameter
            is not used. <br> <br> - Not applicable for sole trader
            (`entity.type`='S') and individual (`entity.type`='I'). <br> <br> -
            For company (`entity.type`='C'), where `entity.address.country` =
            'CN', `beneficial_owner` fields are optional.
          xml:
            name: BeneficialOwner
            wrapped: true
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/Beneficial-Owner'
    Virtual-Account-Update:
      title: VirtualAccount
      xml:
        name: VirtualAccount
      type: object
      properties:
        account:
          title: account
          xml:
            name: Account
          type: string
          minLength: 1
          maxLength: 40
          description: >-
            Required parameter if the value of the `action` parameter is
            'UPDATE'.<br><br>This parameter specifies the virtual account
            details to be modified.
          example: '0123456789'
        entity:
          $ref: '#/components/schemas/Entity-Update'
        beneficial_owner:
          title: BeneficialOwner
          description: >-
            <b> <u>Note:</u> Provides the complete beneficial owner's list which
            is updated into the system. This action replaces the existing
            beneficial owner's details </b> <br> <br> Required object if the
            `entity` object is used. <br> <br> - Not applicable for sole trader
            (`entity.type`='S') and individual (`entity.type`='I')
          xml:
            name: BeneficialOwner
            wrapped: true
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/Beneficial-Owner-Update'
        credit_debit_preferences:
          $ref: '#/components/schemas/Credit-Debit-Preferences-Update-Request'
    Header-Account-Sync-Response:
      title: HeaderAccountResponse
      xml:
        name: HeaderAccount
      type: object
      required:
        - account
        - branch_code
      properties:
        account:
          title: account
          xml:
            name: Account
          type: string
          minLength: 1
          maxLength: 40
          description: >-
            Specifies the header account number under which the virtual accounts
            are reserved/activated.
          example: '0123456789'
        branch_code:
          title: branch_code
          xml:
            name: BranchCode
          type: string
          minLength: 3
          maxLength: 4
          description: Citi's bank code associated with given a header account number.
          example: '820'
    Virtual-Account-Sync-Response:
      title: VirtualAccountResponse
      xml:
        name: VirtualAccount
      type: object
      required:
        - account
        - status
      properties:
        account:
          title: account
          xml:
            name: Account
          type: string
          minLength: 1
          maxLength: 40
          description: >-
            This parameter specifies the virtual account for which the inquiry
            results are shown.
          example: '0123456789'
        status:
          title: status
          xml:
            name: Status
          type: string
          description: >-
            Status of the virtual account presented in the inquiry. <br> <u>
            Possible status: </u> <br> - `RESERVED` <br> - `ACTIVE` <br> -
            `CLOSED` 
          example: ACTIVE
        balance_display_option:
          title: balance_display_option
          xml:
            name: BalanceDisplayOption
          type: string
          enum:
            - 'Y'
            - 'N'
          description: >-
            This parameter specifies whether 'opening' or 'closing' balances are
            displayed. <br> Default value is 'Y'.<br><br>Description of possible
            parameter values:<br><b>Y - Show virtual account opening and closing
            balances. <br><br><b>N - Show ZERO opening and closing balance for
            virtual account in statements and reports.
          example: 'Y'
        entity:
          $ref: '#/components/schemas/Entity-Sync-Response'
        credit_debit_preferences:
          $ref: '#/components/schemas/Credit-Debit-Preferences-Response'
        beneficial_owner:
          title: BeneficialOwner
          description: >-
            Parameters are applicable only if the value of the `action`
            parameter is set to 'ACTIVATION' and the relevant purpose parameter
            is ENUMS.
          xml:
            name: BeneficialOwner
            wrapped: true
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/Beneficial-Owner-Sync-Response'
    Entity-Sync-Response:
      title: Entity
      description: Parameters are shown only if the virtual account is activated.
      xml:
        name: Entity
      allOf:
        - type: object
          title: Entity
          properties:
            id:
              title: id
              xml:
                name: Id
              type: string
              minLength: 20
              maxLength: 20
              description: >-
                The entity ID that was assigned specifically to the entity that
                was activated under this virtual account.
              example: EN_45678901234567890
            last_name:
              title: last_name
              xml:
                name: LastName
              type: string
              maxLength: 210
              description: >-
                Entity Name (concatenated form of 'first_name' and 'last_name')
                pertaining to the entity that was activated under this virtual
                account.
              example: LastName
            date_of_birth:
              title: date_of_birth
              xml:
                name: DateOfBirth
              type: string
              minLength: 10
              maxLength: 10
              pattern: >-
                ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)$
              description: >-
                Date of birth or incorporation date pertaining to the entity
                that was activated under this virtual account. This parameter is
                represented in a fixed 10-digit format (YYYY-MM-DD) as per ISO
                standards.
              example: '1995-04-01'
            org_prvt_identification:
              $ref: >-
