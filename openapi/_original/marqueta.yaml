        minLength: 0
        maxLength: 20
      name:
        type: string
        example: John's iPhone
        description: Device name
        minLength: 0
        maxLength: 128
      location:
        type: string
        example: 37.74/-121.88
        description: Location of the device at the time of the tokenization request
        minLength: 0
        maxLength: 25
      ip_address:
        type: string
        example: 255.255.255.255
        description: IP address in IPV4 format
        minLength: 0
        maxLength: 25
      language_code:
        type: string
        example: en
        minLength: 0
        maxLength: 36
  DigitalWalletTokenWalletProviderModel:
    type: object
    required:
      - account
      - pan_source
    properties:
      account:
        $ref: '#/definitions/account'
      risk_assessment:
        $ref: '#/definitions/webhooks%5frisk%5fassessment'
      device_score:
        type: string
        example: '3'
        description: >-
          Wallet provider device score (possible values- 1-5), indicating the
          confidence level of the device. 5 being the highest level of
          confidence.
      pan_source:
        type: string
        description: >-
          PAN source<br><br>Possible values are
          <br>KEY_ENTERED<br>ON_FILE<br>MOBILE_BANKING_APP<br>
        minLength: 1
        maxLength: 50
      reason_code:
        type: string
        example: >-
          01, 02, 03, 04, 05, 06, 07, 08, 09, 0A, 0B, 0C, 0D, 0E, 0G, 0H, A1,
          A2, A3, A4, A5, A6, A7, A8, A9, AA, AB, AC, AD, AE, AF, AG, AH, AI,
          AL, AM, AN, AO
        description: >-
          Wallet provider reason codes, in a comma-separated format. The reason
          for the wallet provider's provisioning decision. Note This list of
          reason codes is  subject to change. <br> Apple Pay (Visa/Mastercard),
          Google Pay/Samsung Pay  (Mastercard only). <br> * 01 - Cardholder's
          wallet account is too new relative to launch. <br> * 02 - Cardholder's
          wallet account is too new relative to provisioning request.<br> * 03 -
          Cardholder's wallet account/card pair is newer than date
          threshold.<br> * 04 - Changes made to account data within the account
          threshold. <br> * 05 - Suspicious transactions linked to this account.
          <br> * 06 - Account has not had activity in the last year. <br> * 07 -
          Suspended cards in the secure element. <br> * 08 - Device was put in
          lost mode in the last seven days for longer than the duration
          threshold.<br> * 09 - The number of provisioning attempts on this
          device in 24 hours exceeds threshold. <br> * 0A - There have been more
          than the threshold number of different cards attempted at provisioning
          to this phone in 24 hours.<br> * 0B - The card provisioning attempt
          contains a distinct name in excess of the threshold. <br> * 0C - The
          device score is less than 3. <br> * 0D - The account score is less
          than 4. <br> * 0E - Device provisioning location outside of the
          cardholder's wallet account home country.<br> * 0G - Suspected fraud.
          <br> * 0H - The phone number score is less than <br> 3. Google
          Pay/Samsung Pay (Visa only)<br> * A0 - Cardholder PAN associated with
          account within threshold days. <br> * A1 - Wallet account holder name
          on file does not match cardholder entered name.<br> * A2 - User's
          account on device less than threshold days. <br> * A3 - User account
          was created within threshold days. <br> * A4 - Wallet account created
          within threshold days. <br> * A5 - Changes made to account data within
          threshold days. <br> * A6 - The number of provisioning attempts across
          all cards on this device in the last 24 hours exceeds the threshold.
          <br> * A7 - The wallet account into which the card is being
          provisioned contains distinct names greater than threshold. <br> * A8
          - Device provisioning location outside of cardholder's wallet account
          home country. <br> * A9 - Suspended cards in the wallet account is
          greater than threshold. <br> * AA - This account has not had activity
          within threshold period. <br> * AB - Number of days since device was
          last reported lost is less than threshold days. <br> * AC - Number of
          transactions in last 12 months less than threshold number. <br> * AD -
          Number of active tokens greater than threshold<br> * AE - Number of
          devices with Same UserID with token is greater than threshold. <br> *
          AF - Number of active tokens on all devices is greater than threshold.
          <br> * AG - Issuer deferred ID&V decision. <br> * AH - Issuer
          encrypted payment instrument data expired. <br> * AI - User/device
          receiving encrypted payment instrument data is different than the one
          that is provisioning the token. <br> * AL - Encrypted payment
          instrument data is pushed to a different device than the one that
          issuer application authenticated. <br> * AM - Encrypted payment
          instrument data is pushed to a different user than the cardholder.
          <br> * AN - Encrypted Payment Instrument Data is being pushed by the
          Issuer to the same device that the Issuer application authenticated,
          but without any upfront authentication.<br> * AO - Encrypted Payment
          Instrument Data is being pushed by the Issuer to the same device that
          the Issuer application authenticated, but with successful upfront
          authentication.
        minLength: 0
        maxLength: 100
    description: Wallet provider profile
  webhooks_risk_assessment:
    type: object
    properties:
      score:
        type: string
        description: >-
          Wallet provider risk score<br><br>Possible values are
