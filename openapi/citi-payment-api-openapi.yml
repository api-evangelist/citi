  schemas:
    Payment-Info-Details:
      title: PaymentInfoDetails
      type: object
      description: Payment Information details.
      required:
      - transaction
      - method
      properties:
        transaction:
          $ref: '#/components/schemas/Transaction-Details'
        creditor:
          $ref: '#/components/schemas/Payment-Creditor'
        method:
          $ref: '#/components/schemas/Method'
    Country-Code:
      type: string
      title: country_code
      pattern: ^[A-Z]{2,2}$
      description: Country code.
      example: CN
    Fx-Rate:
      type: number
      title: fx_rate
      description: The indicative FX rate which is for reference only. The number indicates how much units of buy_currency you can get from one unit of sell_currency.
    Common-Inbound:
      type: object
      title: Inbound-Common
      description: This section contains Common details.
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/Name'
          - description: Creditor's name.
            example: Su Lin
        account_number:
          type: string
          title: account_number
          description: Account number of the VA receiving funds.
          minLength: 1
          maxLength: 64
          example: '78945615'
        address:
          type: string
          title: address
          description: Recipient's address.
          example: Schillerstrasse 23
    Gateway-Error-Response:
      type: object
      title: GatewayErrorResponse
      required:
      - httpCode
      - httpMessage
      - moreInformation
      properties:
        httpCode:
          type: string
          maxLength: 3
          description: Numeric HTTP Staus code
          title: httpCode
        httpMessage:
          type: string
          maxLength: 128
          description: HTTP error message
          title: httpMessage
          example: Bad Request
        moreInformation:
          type: string
          maxLength: 128
          description: HTTP error message
          title: moreInformation
          example: please provide valid value for request
    Message-Id:
      type: string
      title: message_id
      description: Unique id from your system for batch. Required for Payment to Wallet (virtual_account credit).
      example: bulk123
      minLength: 1
      maxLength: 34
    Partner-User-Reference:
      title: PartnerUserReference
      type: string
      description: Unique reference from seller for each payment.
      minLength: 1
      maxLength: 35
      example: PUR1234556567wegry
    Payment-Details:
      title: PaymentDetails
      type: object
      description: Payment details.
      required:
      - payment_info
      properties:
        debtor:
          $ref: '#/components/schemas/Payment-Debtor'
        payment_info:
          type: array
          title: payment_info
          items:
            $ref: '#/components/schemas/Payment-Info-Details'
    Inbound-Debtor:
      type: object
      description: This section contains detailed payor information.
      allOf:
      - $ref: '#/components/schemas/Common-Inbound'
      - type: object
        title: Inbound-Debtor
        properties:
          country_code:
            type: string
            title: country_code
            description: Payer's country.
            minLength: 1
            maxLength: 128
            example: CN
    File-Id:
      type: string
      description: Unique identifier for the document uploaded.
      title: file_id
      minLength: 1
      maxLength: 128
      example: '112213'
    Payment-Request:
      title: PaymentRequest
      type: object
      description: Request body for creating a payment. Contains the payload with debtor, creditor, and transaction details.
      required:
      - payments
      properties:
        message_id:
          allOf:
          - $ref: '#/components/schemas/Message-Id'
          description: Unique identifier for bulk payments. Required for payment to wallet.
        payments:
          type: array
          title: payments
          items:
            $ref: '#/components/schemas/Payment-Details'
    Completed-Time:
      type: string
      title: completed_on
      format: date-time
      description: The time the transaction was finished. Pattern YYYY-MM-DDTHH:mm:ssZ
      example: '2026-01-06T11:00:25Z'
    Payment-Response:
      title: PaymentResponse
      type: object
      description: Response body for payment initiation. Contains the details of the payment.
      properties:
        ref_id:
          type: string
          minLength: 1
          maxLength: 120
          description: Unique ID for the Transaction.
          title: ref_id
          example: 444d0f3f-4x55-7g99-8b2c-0cf2a921a5ab
        status:
          $ref: '#/components/schemas/Status'
        message:
          $ref: '#/components/schemas/Message'
        message_id:
          $ref: '#/components/schemas/Message-Id'
        transaction:
          type: array
          title: transaction
          items:
            $ref: '#/components/schemas/Transaction'
    Transaction-Details:
      title: TransactionDetails
      type: object
      description: Transaction details.
      allOf:
      - $ref: '#/components/schemas/Common-Transaction'
      - type: object
        title: Transaction-Details
        required:
        - end_to_end_id
        - amount
        - currency_code
        properties:
          partner_user_reference:
            $ref: '#/components/schemas/Partner-User-Reference'
          equivalent_currency_code:
            allOf:
            - $ref: '#/components/schemas/Currency-Code'
            title: equivalent_currency_code
            description: The currency you use to fund the payment. <br> Required for payment to external.
          equivalent_amount:
            allOf:
            - $ref: '#/components/schemas/Amount'
            title: equivalent_amount
            description: Amount in origin currency.
          fx_rate_id:
            allOf:
            - $ref: '#/components/schemas/Fx-Rate-Id'
            title: fx_rate_id
            example: '3885000000000000000'
          charges_type:
            type: string
            title: charges_type
            description: Charges type.
            enum:
            - OUR
            - SHAR
            example: SHAR
          purpose_code:
            type: string
            title: purpose_code
            minLength: 1
            maxLength: 50
            description: Payment purpose code. Required for payment to external parties. Supported values are 1001 (Physical goods), 3003 (Logistics), 3005 (Salary), 3006 (Business/ Commission), 3007 (Family support), 3009 (Rent), 3010 (Tax), 3011 (Property/management fees), 3012 (Water electricity), 3016 (Patent), 3017 (Accounting Service), 3018 (Office Expenses), 3019 (Advertising), 3021 (Transfer to Own Account), 3022 (Warehousing), 3023 (GoodsInsurance), 3024 (AttorneysFee), 3025 (StaffWelfare)
            example: '1001'
          file_id:
            $ref: '#/components/schemas/File-Id'
          payment_type:
            $ref: '#/components/schemas/Payment-Type'
    Merchant-Id:
      type: string
      description: Unique identifier generated by Citi for each seller. Seller to use this id for the further functional calls.
      title: merchant_id
      minLength: 1
      maxLength: 36
      example: ec689822-9864-4c4d-9d68-222467627901
    Account:
      title: Account
      type: object
      description: Account details.
      properties:
        number:
          type: string
          title: number
          description: Account number.
          example: '456456547'
        branch_code:
          type: string
          title: branch_code
          description: Branch code which holds the account number.
          example: VA202501080950209789
        virtual_account_id:
          allOf:
          - $ref: '#/components/schemas/Virtual-Account-Id'
          description: virtual_account_id received when you call wallet activation endpoint. <br> Required at creditor side when paying to wallet. <br> Required at debtor side for payment to external.
    Method:
      title: method
      type: object
      description: This object contains the payment method and clearing network details.
      required:
      - type
      - method
      properties:
        type:
          type: string
          title: type
          description: Payment method. Required for payment to external and payment to wallet. <br> payment to wallet - LOCAL should be used. <br> payment to external - CROSS_BORDER.
          enum:
          - CROSS_BORDER
          - LOCAL
          example: CROSS_BORDER
        method:
          type: string
          title: method
          description: ACH, IP, RTGS, DFT, SEPA, BKT, CBFT. <br> For payment to wallet - value must be BKT <br> For payment to external - value should be CBFT.
          enum:
          - ACH
          - IP
          - RTGS
          - DFT
          - SEPA
          - BKT
          - CBFT
          example: CBFT
        country_code:
          allOf:
          - $ref: '#/components/schemas/Country-Code'
          title: country_code
          description: Country code of the debtor.
    Payment-Debtor:
      title: Debtor
      type: object
      description: Information pertaining to debtor of the payment.
      properties:
        account:
          $ref: '#/components/schemas/Account'
        country_code:
          allOf:
          - $ref: '#/components/schemas/Country-Code'
          title: country_code
          description: Country code where the fund is credited.
    Amount:
      type: number
      title: amount
      description: Amount in currency.
      minimum: 0.01
      maximum: 10000000000000
      example: 1000
    Name:
      type: string
      title: name
      minLength: 1
      maxLength: 128
      example: SHASHANK VIJAYSHANKAR TIWARI
    Get-Payment-Response-Details:
      title: GetPaymentResponseDetails
      type: object
      description: Get Payment Response Details.
      properties:
