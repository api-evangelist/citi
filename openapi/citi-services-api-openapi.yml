    c5da44dd-2c3c-42cc-8125-711c2aadbe4f-data-schema:
      type: object
      properties:
        ACCT_BASE_NBR:
          type: string
          description: Account Base Number is an internal Citi client identifier that is associated to a Safekeeping or Cash Account.
          example: 8-DEMOCSH53JPY
        ACCT_ID:
          type: string
          description: Account ID is an identifier for both a Cash Account and/or a Safekeeping Account that is unique within a branch.
          example: DEMOSK02US
        ACCT_NME:
          type: string
          description: Account Name is the name that is assigned to the Cash Account and/or the Safekeeping Account. If an Alternate Account Name has been specified for an account it will be displayed as the Account Name.
          example: Demo - SK - US DCC Equity
        ACT_SETT_DT:
          type: string
          format: date
          description: Actual Settlement Date is the date of final settlement of the trade.
          example: '2024-06-15'
        BR_ID:
          type: string
          description: Branch Code is the identifier of the branch for the account. For the Cash Account the branch code is a numeric value and for the Safekeeping Account it is the ISO Country code.
          example: '484'
        BR_NME:
          type: string
          description: Branch Name is the name of the branch for the Cash Account and/or Safekeeping Account.
          example: NEW YORK SECURITIES CB
        RELATED_REF:
          type: string
          description: Related Reference is the value provided via RELA tag on the underlying instruction.
          example: RELA123456
        CLIENT_REF:
          type: string
          description: Client Reference is a unique number assigned by the client, to the transaction, for identification purposes within their organization.
          example: '12345678'
        BUYR_SELL_CD:
          type: string
          description: Buyer/Seller Code is the code associated to the Buyer/Seller.
          example: B
        CLR_BRKR_NME:
          type: string
          description: Clearing Broker Name is the name of the firm that guarantees the obligations of the parties in an exchange traded security or derivative transaction.
          example: Goldman Sachs
        CONTR_SETT_DT:
          type: string
          format: date-time
          description: Contractual Settlement Date is the date when the clients cash account should be credited with funds on a sale (and debited on a purchase) on the due settlement date in place of when a trade actually settles in the market.
          example: '2024-06-15T10:30:00Z'
        CNTRY_CD:
          type: string
          description: The Country Code (location) of the security custodian. Not applicable to the US domestic positions.
          example: US
        COMP_DESC:
          type: string
          description: Company Description contains information regarding the company which issued the security.
          example: Microsoft Corporation
        CONTR_SETT_FLG:
          type: string
          description: Contractual Settlement Flag indicates whether the trade will settle on the Contractual Settlement Date whether or not it actually settles. Values are Y (settle on contractual settlement date) or N (settle on actual settlement date).
          example: Y
        CURR_FCTR_RATE:
          type: number
          format: double
          description: Current Factor is the factor which applies to the current accrual period to determine payments and balances for principal paying securities.
          example: 0.9875
        DEAL_REF_NBR:
          type: string
          description: OTM Reference is the Order and Trade Manager Reference number that has been assigned to the order instructions.
          example: OTM123456789
        HOLDING_TYPE:
          type: string
          description: How Position is Held is a description of the status of the holding affected by the trade, or where that holding is held.
          example: Held At Depot
        SEC_CCY:
          type: string
          description: Denomination Currency Code is the ISO 4217 currency code in which the security is denominated, in the local market.
          example: USD
        FAIL_AGE:
          type: integer
          format: int32
          description: Fail Age is the number of days the transaction has not settled, past the contractual settlement date.
          example: 5
        FAIL_DESC:
          type: string
          description: Fail Description provides the reason why the trade has not or is not expected to settle on the contractual settlement date.
          example: Insufficient Securities
        FAIL_TXT:
          type: string
          description: Fail Text provides additional information on the reason for failure.
          example: Counterparty has not delivered securities.
        FCTR_DTE:
          type: string
          format: date-time
          description: Factor Date is the date the current factor is applicable from for principal paying securities.
          example: '2024-06-01T00:00:00Z'
        INST_DT:
          type: string
          format: date
          description: Instruction Date is the date the trade was first received.
          example: '2024-06-10'
        ISS_TMS:
          type: string
          format: date-time
          description: Issue Date is the date of first issue of the security.
          example: '2020-01-01T00:00:00Z'
        ISSR_LOC_CD:
          type: string
          description: 'Issuer Location Code is the ISO country code where the issuer of the security is based.  Values include: AR (Argentina), CA (Canada), IE (Ireland), etc. '
          example: US
        ISSR_LOC_NME:
          type: string
          description: 'Issuer Location is the name of the country where the issuer of the security is based.  Values include: Argentina (AR), Canada (CA), Ireland (IE), etc.  '
          example: United States
        SETT_AMT:
          type: number
          format: double
          description: Settlement Amount is the cash value of the partial settlement in the local currency.
          example: 150000.25
        LCL_CUR_CD:
          type: string
          description: Settlement Currency Code is the ISO currency code of the local currency of the Settlement Amount.
          example: USD
        SETT_CCY:
          type: string
          description: Settlement Currency is the currency name for the Settlement Amount.
          example: US Dollar
        LOAN_DT:
          type: string
          format: date
          description: Loan Date is the date the loan originated.
          example: '2024-01-15'
        LOAN_PURPOSE_CD:
          type: string
          description: Loan Purpose Code is a code that identifies the purpose of the loan transaction if the position is on loan.
          example: COLL
        LOAN_PURPOSE_DESC:
          type: string
          description: Loan Purpose is the description of the purpose of the loan transaction if the position is on loan.
          example: Collateral Management
        LOAN_REF_ID:
          type: string
          description: The Loan Reference Number is the number assigned to 3rd party lending transactions. This is for US domestic only.
          example: LN123456789
        MATY_DT:
          type: string
          format: date-time
          description: Maturity Date is the date of maturity or redemption for fixed income securities.
          example: '2030-12-31T00:00:00Z'
        PART_UNSETL_QTY:
          type: number
          format: double
          description: Unsettled Quantity shows the quantity that is still yet to settle when there is a partial settlement of the trade.
          example: 2500
        PARTICIPANT_NO:
          type: string
          description: DTC Number is the participant or sub-account number at DTCC.
          example: 0901
        SEC_ID_TYPE:
          type: string
          description: 'Security ID Type indicates the type of identifier of the corresponding Security ID field. Values include: CUSIP, ISIN, SEDOL, LOCAL, etc.'
          example: ISIN
        SEC_ID:
          type: string
          description: Security ID is the most commonly used identifier for the security in a given market.
          example: US0378331005
        PLACE_OF_SETLMT:
          type: string
          description: Place Of Settlement is the name of the settlement location for the security, applicable to securities positions, transactions only.
          example: TOKYO, JAPAN
        PLDG_ABA_NAM:
          type: string
          description: American Bankers Association Description is the name of the institution identified by the ABA number.
          example: Citibank N.A.
        PLDG_ABA_NO:
          type: string
          description: ABA Number is the American Bankers Association Transit Number used to identify a US institution.
          example: 021000089
        PLDG_REF_NBR:
          type: string
          description: Pledge Reference is the unique reference number for the pledge transaction.
          example: PLG987654321
        PREV_FCTR_RATE:
          type: number
          format: double
          description: Previous Factor is the factor which applies to the last accrual period to determine payments and balances for principal paying securities.
          example: 0.985
        CASH_ACCT_ID:
          type: string
          description: Cash Account ID is the account id of the cash account which will be credited or debited at settlement for the trade.
          example: '156602418'
        SEC_DESC:
          type: string
          description: Issue Description contains the name and other details of the instrument.
          example: Apple Inc. Common Stock
        ASSET_TYP:
          type: string
          description: 'Asset Type is a code representing the Asset Type of the security. Values include: EQTY (Equity), FI (Fixed Income), etc.'
          example: EQTY
        SEC_LEND_FLG:
          type: string
          description: Securities Lending Flag indicates that the trade is a securities lending transaction.
          example: Y
        QUANTITY:
          type: number
          format: double
          description: Quantity provides the number of units, par value or nominal value (for fixed income instruments), amount of currency (for FX transactions), or number of shares. Indicates the contract quantity on the original transaction that was given up.
          example: 10000
        SEC_SHORT_IND:
          type: string
          description: Short Flag indicates if the transaction can be processed or if it cannot be processed due to a short position.
          example: N
        ISSUE_NME:
          type: string
          description: Issue Name is the Security Name of the security instrument.
          example: Apple Inc.
        ISSUE_TYP_CD:
          type: string
          description: 'Issue Type Code is a code linked to the Issue Type field which describes the type of security instrument. Values include: 1 (ADR Convertible), 12 (Bond), 19 (Bond Convertible), etc. '
          example: '12'
        ISSUE_TYP:
          type: string
          description: 'Issue Type is a description of the type of the security instrument.  Values include: ADR Convertible (1), Bond (12) , Bond Convertible (19), etc. '
          example: Bond
        SETT_QTY:
          type: number
          format: double
          description: Settled Quantity is the quantity that has settled or the quantity of the security that is fully settled at the 'As Of' date.  For partial settlements the settled quantity is the portion that has settled.
          example: 7500
        HOLDING_TYPE_CD:
          type: string
          description: Location of Where Held is a code indicating the location of a holding. Examples include HD - Held At Depot and LE - Securities Lent.
          example: HD
        CUSIP:
          type: string
          description: CUSIP (Committee on Uniform Securities Identification Procedures) It is a nine-character alphanumeric code that identifies a North American financial security for the purposes of facilitating clearing and settlement of trades.
          example: 037833100
        ISIN:
          type: string
          description: ISIN (International Securities Identification Number) is a 12-character alpha-numerical code that does not contain information characterizing financial instruments but serves for uniform identification of a security at trading and settlement.
          example: US0378331005
        SEDOL:
          type: string
          description: SEDOL (Stock Exchange Daily Official List) is a unique identification code, consisting of seven alphanumeric characters, that is assigned to all securities trading on the London Stock Exchange.
          example: '2046251'
        TICKER:
          type: string
          description: Ticker is the symbol used on the exchange to identify the security.
          example: AAPL
        UPDATE_TMS:
          type: string
          format: date-time
          description: Created Timestamp is the date and time of when an item was loaded to the source system.
          example: '2024-06-15T12:30:45Z'
        SWIFT_STATUS:
          type: string
          description: SWIFT Status is the combined SWIFT 25D and 24B status codes as would be shown in an MT537 message.
          example: MATCH
        TRANS_TYP:
          type: string
          description: Transaction Type indicates the direction of the trade. Values are Receive Free, Receive Versus Payment, Deliver Free, Delivery Versus Payment, etc.
          example: Receive Versus Payment
        TRANS_REF_NBR:
          type: string
          description: Custodian Reference is the unique reference assigned by the Custodian to the record. The reference number is unique within a branch.
          example: TRX20240615001
        REAG_DEAG_CD:
          type: string
          description: Settlement Counterparty Code is the code associated to the Settlement Counterparty.
          example: CP001
        REAG_DEAG:
          type: string
          description: Settlement Counterparty is the name associated to the underlying instruction's REAG/DEAG tag if provided.
          example: JP Morgan Chase
        TRADE_DT:
          type: string
          format: date-time
          description: Trade Date is the date a transaction is effected or executed.
          example: '2024-06-12T14:30:00Z'
        TRN_CD:
          type: string
          description: 'Transaction Type reflects the code of the transaction type. Sample Values returned:  SLS (Securities Lending System); CONV; ISWAP.'
          example: SLS
        TRANS_CLASS_CD:
          type: string
          description: Transaction Class is the transaction type code for securities transactions.
          example: BUY
        TRANS_CLASS:
          type: string
          description: 'Transaction Class is the transaction type code for securities transactions.  Values include: ADJ (Adjustment), BIDS, BOE,  BUY, CAPD, CAPG, CAPGL, DF (Deliver Free), DIV (Dividend), DRAW, DRIP, DVCA, etc.'
          example: MARKET TRADES
        SIGNED_QTY:
          type: number
          format: double
          description: The signed quantity based on the type of a transaction. The value would be positive in case of a receive, and it would be negative in case of a deliver.
          example: 10000
        PLACE_OF_SETLMT_CD:
          type: string
          description: Place Of Settlement code is the code associated with the Place of Settlement or Depository Centre Code for the security.
          example: DTC
        VALUE_DT:
          type: string
          format: date
          description: Value Date is the date on which the cash posting corresponding to this trade will have value.
          example: '2024-06-17'
        TRD_STATUS:
          type: string
          description: Transaction Status.
          example: SETTLED
        PARTIAL_SETTLEMENT_FLAG:
          type: string
          description: Partial Settlement Flag indicates if the trades data contains partial settlements details.
          example: Y
        TRADE_STATUS_VALUES:
          type: string
          description: It provides the logical value of the trade status.
          example: Settled
        LAST_CHANGE_TIMESTAMP:
          type: string
          format: date-time
          description: Last Change Timestamp.
          example: '2024-06-15T15:20:10Z'
        MARKET_REF:
          type: string
          description: Market Reference.
          example: MKT123456789
        MITI_REF:
          type: string
          description: Market Infrastructure Transaction Identification Reference number.
          example: MITI987654321
        MATCHING_REF:
          type: string
          description: Matching reference.
          example: MATCH123456
        CRTD_TMS:
          type: string
          format: date-time
          description: Created Timestamp (CR) is the date and time of when an item was loaded to the Reporting database. Applicable to intraday information only.
          example: '2024-06-15T09:00:00Z'
        TRAN_NOTES:
          type: string
          description: The transaction notes.
          example: Partial settlement due to insufficient position.
        DTC_FED_IDENTIFIER:
          type: string
          description: It describes indicator values of trades settled in DTC (Depository Trust Company) or FED (Federal) location from market via SMI (Securities Market Interface).
          example: DTC
        SETD_CMB_QTY:
          type: number
          format: double
          description: Settled Quantity.
          example: 7500
        CONSID_AMT_P:
          type: number
          format: double
          description: Settled Amount is the amount that has settled, corresponding to the Settled Quantity. Settled Amount will be less than Instructed Amount in partial settlements.
          example: 250000.75
