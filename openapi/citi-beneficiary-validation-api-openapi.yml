            name: Response
          type: object
          title: response
          properties:
            type:
              xml:
                name: Type
              type: string
              description: "Validation based on historic or real time data \n - For India IMPS,this field is not applicable \n - For India UPI,this field is not applicable \n - For US EWS,this field is mandatory \n - For UK,this field is mandatory \n - For IN PAN,this field is mandatory \n - For Pay2China, this field is not applicable \n- HR - Validation based on Historic Data if we don’t have a real time data \n - RT- Validation based on real time data and data source is present \n- ERROR - Erroneous issue "
              enum:
              - HR
              - RT
              - ERROR
              title: type
            data_date_time:
              xml:
                name: DataDateTime
              type: string
              format: date-time
              description: "Contains the provider datetime else current Datetime in UTC (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n - For India IMPS,this field is not applicable \n - For India UPI,this field is not applicable \n - For US EWS,this field is mandatory \n - For UK,this field is mandatory \n - For IN PAN,this field is mandatory \n - For Pay2China, this field is mandatory"
              title: data_date_time
            validation_risk_score:
              xml:
                name: ValidationRiskScore
              type: string
              description: "Risk appetite of utilizing this account. This field will be populated only in case of reponse.type = HR \n - For India IMPS,this field is not applicable \n - For India UPI,this field is not applicable \n - For US,this field is conditional \n - For UK,this field is conditional \n - For IN PAN,this field is not applicable \n - For Pay2China, this field is not applicable \n- HIGH - There is high risk the data subject to validations is inaccurate as per the source. \n- MEDIUM - There is moderate risk the data subject to validations is inaccurate as per the source. \n- LOW- There is Low risk the data subject to validations is inaccurate as per the source. \n- UNKNOWN- The risk is unknown. "
              enum:
              - HIGH
              - MEDIUM
              - LOW
              - UNKNOWN
              - NA
              title: validation_risk_score
            account:
              xml:
                name: Account
              type: object
              title: account
              properties:
                number_validation:
                  xml:
                    name: NumberValidation
                  type: string
                  description: "Account validation result \n - For India IMPS,this field is not applicable \n - For India UPI,this field is not applicable \n - For US EWS,this field is conditional \n - For UK,this field is conditional \n - For IN PAN,this field is not applicable \n - For Pay2China, this field is not applicable \n- MATCH - Validation based on account is a match \n - MISMATCH - Validation based on account is a mismatch \n- NA - Validation is not applicable"
