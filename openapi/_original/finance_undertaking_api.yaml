             Code Name Definition
              * COUR  - Courier 
              * MESS  - Messenger
              * OTHR  - Other
              * REGM  - RegisteredMail
              * COLL  - BY collection
              * MAIL  - Ny Mail
              
              Usage -> This field is applicable for Issuance and Amend of Bank Guarantee
              
              MT Mapping: field 24E
