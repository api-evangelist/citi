            returned etc.<br><br>Visa - Not applicable<br><br>Mastercard -
            Optional<br><br>Possible Values:<br><br>"All" - Returns all Clearing
            transactions associated to a virtual card account for a given time
            range<br>"Presentment" - First Presentment transactions<br>"Second
            Presentment" - Second Presentment transactions in response to a
            Chargeback initaited from Issuer<br>"Chargeback" - First Chargeback
            transactions (Full & Partial)<br>"Arbitration Chargeback" -
            Arbitration chargeback transactions (Full & Partial)<br>"Retrieval
            Request" - Transactions where an issuer sent a Retrieval Request to
