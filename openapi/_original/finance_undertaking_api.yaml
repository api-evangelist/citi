    PhoneNumber:
      pattern: ^\+[0-9]{1,3}-[0-9()+\-]{1,30}$
      type: string
      description: >
        The collection of information which identifies a specific phone or FAX
        number as defined by telecom services.

        It consists of a "+" followed by the country code (from 1 to 3
        characters) then a "-" and finally, any combination of numbers, "(",
        ")", "+" and "-" (up to 30 characters).
    PlaceOfPresentation:
      required:
        - place
      type: object
      properties:
        place:
          maxLength: 4
          minLength: 4
          type: string
          description: "Place of the presentation.  Place of the presentation can be either  - a code from the list published on ISO20022.org as part of external code sets OR - if code is different from the ISO code list (mentioned above), then a bilaterally agreed code may be used.\n\nCode Name Definition:\n\n* ADVP  - AdvisingParty - Party advising the undertaking.  \n* ANYB  - AnyBank - Any bank.  \n* APPL  - Applicant - Party named in the undertaking as the â€œapplicantâ€\x9D.\n* BENE  - Beneficiary - Party in whose favour the undertaking (or counter-undertaking) is issued.  \n* CONF  - ConfirmationParty - Party that adds its undertaking to honour the undertaking.  \n* CUB2  - SecondCounterUndertakingBeneficiary - Beneficiary of the second counter-undertaking.  \n* CUB3  - ThirdCounterUndertakingBeneficiary - Beneficiary of the third counter-undertaking.  \n* ISSU  - Issuer - Party that issues the undertaking (or counter-undertaking).   \n* OBLG  - Obligor - Party obligated to reimburse the issuer.   \n* ORDR  - OrderingParty - Party requested to issue an undertaking on behalf of the applicant. Also known as the ordering institution or applicant's bank.  \n* PRES  - PresentingParty - Party nominated to receive presentation.   \n* SADV  - SecondAdvisingParty - Second advising party.  \n* SPEC  - SpecifiedAddress - Party located at specified address.\n"
        country:
          pattern: ^[A-Z]{2,2}$
          type: string
          description: Country where a presentation is to be made.
          x-Validation: true
          x-ValidationType: Algorithmic, ReferenceData
          x-Error: >-
            ErrorCode:Sw.Stds.D00004, ErrorText:Invalid Country Code.,
            CitiValidation:true,  Severity:Fatal
      additionalProperties: false
      description: Location of a presentation.
    PlaceOrUnderConfirmationChoice:
      title: PlaceOrUnderConfirmation
      type: object
      additionalProperties: true
      description: Choice between a location and codified form.
      oneOf:
        - title: PlaceOfPresentation
          required:
            - place_of_presentation
          type: object
          properties:
            place_of_presentation:
              $ref: '#/components/schemas/PlaceOfPresentation'
          additionalProperties: false
        - title: PresentationUnderConfirmation
          required:
            - presentation_under_confirmation
          type: object
          properties:
            presentation_under_confirmation:
              $ref: '#/components/schemas/PresentationPartyCode'
          additionalProperties: false
    Presentation:
      type: object
      properties:
        format:
          maxLength: 4
          minLength: 4
          type: string
          description: |
            Format for presentation documents that are submitted electronically.

            Code Name Definition:

            * CODE  - Format of document
            * DPDF  - PDF 
            * DXML  - XML
            * OTHR  - Other
            * SDSH  - Spreadsheet 
            * WORD  - Word 
            * XSLT  - XSLT
        channel:
          maxLength: 4
          minLength: 4
          type: string
          description: >-
            Channel through which presentation documents are submitted
            electronically
        address:
          type: string
          description: >-
            Uniform Resource Identifier (URI), such as a web or an email
            address, specifying where the presentation can be addressed.
          format: uri
        additional_details:
          maxLength: 35
          minLength: 1
          type: string
          description: >
            Additional information related to 'Deliver to' information.


            Usage Guideline: This field can additionally be used to identify the
            format and channel when the format and channel code is 'OTHR'. 


            Recommend to structure the information as follows (example):

            When Format is Other - //OTHR//JPEG 

            When Channel is Other - //OTHR//HOST

            When both Format and Channel is Other - //OTHR//JPEG//OTHR//HOST
      additionalProperties: false
      description: Electronic presentation information.
    PresentationPartyCode:
      maxLength: 4
      minLength: 4
      type: string
      description: >
        Specifies the party to receive the presentation.


        Code Name Definition:


        * ETHR - Presentation made either to the issuer or other nominated
        party.

        * EXCN - Presentation made exclusively to the confirmer.

        * EXIS - Presentation made exclusively to the issuer.
      enum:
        - ETHR
        - EXCN
        - EXIS
    TradeConfirmationTypeCode:
      maxLength: 7
      minLength: 6
      type: string
      description: >
        This field contains confirmation instructions from the issuing bank to
        the advising party.


        Code Name Definition:


        * CONFIRM - The requested confirmation party is requested to confirm the
        credit

        * MAYADD - The requested confirmation party may add its confirmation to
        the credit

        * WITHOUT - No confirmation is requested
      enum:
        - CONFIRM
        - MAYADD
        - WITHOUT
    TradeFinanceInstruction:
      required:
        - applicant_issuance_request_identification
        - undertaking_application_date
        - undertaking_form
        - governance_rule_identification
        - party
        - undertaking_amount
        - undertaking_text_purpose
        - undertaking_terms_and_conditions
