    ActiveCurrencyAndAmount:
      required:
      - amount
      - currency
      type: object
      properties:
        currency:
          pattern: ^[A-Z]{3,3}$
          type: string
          description: 'Not Applicable.

            '
          x-MXComponent: ActiveOrHistoricCurrencyCode
          x-Validation: true
          x-ValidationType: Algorithmic, ReferenceData
          x-Error: ErrorCode:Sw.Stds.D00006, ErrorText:Invalid currency code., :true, Severity:Fatal
        amount:
          maxLength: 19
          pattern: ^0*(([0-9]{0,13}\.[0-9]{1,5})|([0-9]{0,14}\.[0-9]{1,4})|([0-9]{0,15}\.[0-9]{1,3})|([0-9]{0,16}\.[0-9]{1,2})|([0-9]{0,17}\.[0-9]{1,1})|([0-9]{0,18}\.)|0*|([0-9]{0,18}))$
          type: string
          description: "The amount with fractional digit. Note: The decimal separator is a dot.\n\nUsage:\n  Total digits: 18\n  Fraction Digits: 5\n"
          x-MXComponent: ActiveCurrencyAndAmount
          x-Validation: true
          x-ValidationType: Algorithmic
          x-Error: ErrorCode:Sw.Stds.D00007, ErrorText:Too many decimal digits or the amount does not comply with the pattern. Severity:Fatal
      additionalProperties: false
      description: A number of monetary units specified in an active currency where the unit of currency is explicit and compliant with ISO 4217.
    ISO2ALanguageCode:
      pattern: ^[a-z]{2,2}$
      type: string
      description: 'Identification of the language name according to the ISO 639-1 codes. The type is validated by the list of values coded with two alphabetic characters, defined in the standard.


        usage : This field is applicable for Issaunce of Bank guarantee

        '
    PhoneNumber:
      pattern: ^\+[0-9]{1,3}-[0-9()+\-]{1,30}$
      type: string
      description: 'The collection of information which identifies a specific phone or FAX number as defined by telecom services.

        It consists of a "+" followed by the country code (from 1 to 3 characters) then a "-" and finally, any combination of numbers, "(", ")", "+" and "-" (up to 30 characters).

        '
  headers:
    ETag:
      description: An entity-tag, as defined in the RFC7232 ETag header field is an opaque identifier for the current versions of a resource. The subsequent PATCH/PUT requests should provide the ETag value in a If-match header field to implement optimistic concurrency control. If the server ETag value does not match with the provided ETag value, the error response 412 - precondition fail will be returned. This signifies the resource out of date.
