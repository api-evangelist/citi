  token_service_provider:
    type: object
    required:
      - pan_reference_id
      - token_requestor_id
      - token_requestor_name
      - token_type
    properties:
      pan_reference_id:
        type: string
        example: V-123343434343434
        description: >-
          Network reference ID for the PAN being tokenized. Note: For VISA,
          pan_reference_id remains the same for multiple tokens created on a
          single PAN. However for Mastercard, pan_reference_id remains the same
          for multiple tokens created on a single PAN on the same wallet. Can be
          used to verify existing tokens on the device through the wallet API.
        minLength: 1
        maxLength: 255
      token_reference_id:
        type: string
        example: DNITHE343434343459
        description: >-
          Id to correlate the digital wallet token with the network.  Primary
          identifier for Visa. This value is not populated until token is active
          for Mastercard.
        minLength: 0
        maxLength: 255
      correlation_id:
        type: string
        example: D454545432
        description: >-
          Id to correlate the digital wallet token with the network.  Primary
          identifier for Mastercard.
        minLength: 0
        maxLength: 14
      token_requestor_id:
        type: string
        example: '40010075001'
        description: Id associated with the token requestor. Differs by network
        minLength: 1
        maxLength: 50
      token_requestor_name:
        type: string
        example: APPLE_PAY
        description: >-
          Pseudo customer friendly name for the token requestor. For
          programmatic purposes, use token requestor ID which is not subject to
          change.
        minLength: 1
        maxLength: 100
      token_type:
        type: string
        example: DEVICE_SECURE_ELEMENT
        description: >-
          Token type <br><br>Possible values are
          <br>MERCHANT_CARD_ON_FILE<br>DEVICE_SECURE_ELEMENT<br>DEVICE_CLOUD_BASED<br>ECOMMERCE_DIGITAL_WALLET<br>PSEUDO_ACCOUNT<br>
      token_assurance_level:
        type: string
        example: '10'
        description: Assurance level of the token to PAN binding
        maxLength: 2
      token_pan:
        type: string
        example: 411111______1111
        description: >-
          DPAN of the digital wallet token if provisioned. Masked format.
          /showtokenpan endpoint returns the token_pan in clear text.
      token_expiration:
        type: string
        format: mmyy
        example: '1225'
        description: Expiration of the digital wallet token
      token_score:
        type: string
        example: '10'
        description: Token Score as set by the network
        maxLength: 25
      token_eligibility_decision:
        type: string
        description: >-
          The token service provider's recommendation as to whether the digital
          wallet token should be provisioned.
        maxLength: 50
  Webhook_DigitalWalletTokenTransition_Array_Type:
