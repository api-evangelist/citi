          source: >-
            var hm = require('header-metadata'); 

            var client_id = apim.getvariable('client.app.id'); 

            hm.response.set('client_id', client_id); 

            apim.setvariable('message.headers.client_id',client_id); 

            hm.response.set('x-citiportal-apim-client-id', client_id); 

            apim.setvariable('message.headers.x-citiportal-apim-client-id',client_id); 
