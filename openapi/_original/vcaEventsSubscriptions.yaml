components:
  securitySchemes:
    ClientCredentials:
      type: oauth2
      description: OAuth2 Client Credentials flow
      flows:
        clientCredentials:
          tokenUrl: https://tts.sandbox.apib2b.citi.com/tts/cards/api/oauth2/token
          scopes:
            /api: ' '
  schemas:
    SubscriptionRequest:
      type: object
      required:
        - subscriptionName
        - active
        - subscription
      properties:
        subscriptionName:
          description: >-
            Unique name for the subscription. It can include upper and lowercase
            alphabets, numbers, dashes and underscores.
          type: string
          example: Enter_unique_subscription_name_here
          maxLength: 50
        eventType:
          description: >-
            Client Allowed values are either 1 of the
            below:<ul><li>PAYMENT_AUTHORIZATION</li><li>CLEARING</li></ul>If not
            provided default to 'PAYMENT_AUTHORIZATION'
          type: string
          enum:
            - PAYMENT_AUTHORIZATION
            - CLEARING
          maxLength: 30
        active:
          description: >-
            Specify whether the subscription should be active (true ) or
            inactive (false) for the API to create notifications only if the
            subscription is active.
          type: boolean
          example: true
        subscription:
          description: >-
            Alert subscription conditions to filter the payment authorization
            messages
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
    Subscription:
      type: object
      required:
        - operator
        - fieldName
        - fieldOperator
        - expectedContent
      properties:
        operator:
          description: >-
            Specify an operator to combine multiple conditions in the
            specifications.<br>* WHERE: By default, the first condition in the
            specifications should always have this value to represent the WHERE
            clause.<br>* AND: Use this in the second condition onwards to create
            notifications only if all specifications conditions are true.<br>*
            OR: Use this in the second condition onwards to create notifications
            if one of the specifications conditions is true.
          type: string
          example: WHERE
          maxLength: 5
        fieldName:
          description: >-
            Specifies the field name for the condition to check. This is used in
            conjunction with the fieldOperator.programId is a required field in
            order to create a subscription<br><br> Possible
            values:<br>"programId" - VCA program ID. By default, the first
            condition in the specifications should always have this value in
            conjunction with the WHERE operator.
          type: string
          example: purchaseRequest.rcnAlias
          maxLength: 30
        fieldOperator:
          description: >-
            Specify the relational operator to use in the condition for the
            fieldName. This is used in conjunction with the expectedContent.<br>
            <br> Possible values:<br>"EQUALS": This applies to contentType
            "TEXT" and "INTEGER". Create notifications for the exact fieldName
            value specified in the condition.
          type: string
          example: EQUALS
          maxLength: 12
        expectedContent:
          $ref: '#/components/schemas/FieldContent'
        children:
          description: >-
            Used to define specifications with nested conditions for a
            subscription.
          type: array
          items:
            $ref: '#/components/schemas/Children'
    FieldContent:
      type: object
      required:
        - contentType
        - value
      properties:
        contentType:
          description: >-
            Specify the type of the fields value - TEXT or INTEGER for the
            EQUALS operator and INTEGER for the rest.
          type: string
        value:
          description: Specify a value for a fieldName
          type: string
          example: Travel Expense RCN
    Children:
      type: object
      required:
        - operator
        - fieldName
        - fieldOperator
        - expectedContent
      properties:
        operator:
          description: >-
            Specify an operator to combine multiple conditions in the
            specifications.<br>* WHERE: By default, the first condition in the
            specifications should always have this value to represent the WHERE
            clause.<br>* AND: Use this in the second condition onwards to create
            notifications only if all specifications conditions are true.<br>*
            OR: Use this in the second condition onwards to create notifications
            if one of the specifications conditions is true.
          type: string
          example: WHERE
          maxLength: 5
        fieldName:
          description: >-
            Specifies the field name for the condition to check. This is used in
            conjunction with the fieldOperator.programId is a required field in
            order to create a subscription<br><br> Possible
            values:<br>"fundingSourceName" - Funding source
            name<br>"messageTypeIndicator" - Message type
            indicator<br>"authorizationResponseDetail" - Response
            code<br>"vcaAuthorizationResponseDetail" - In Control VCN service
            result code
          type: string
          example: purchaseRequest.rcnAlias
          maxLength: 30
        fieldOperator:
          description: >-
            Specify the relational operator to use in the condition for the
            fieldName. This is used in conjunction with the expectedContent.<br>
            <br> Possible values:<br>"EQUALS": This applies to contentType
            "TEXT" and "INTEGER". Create notifications for the exact fieldName
            value specified in the condition.
          type: string
          example: EQUALS
          maxLength: 12
        expectedContent:
          $ref: '#/components/schemas/FieldContent'
        children:
          description: >-
            Used to define specifications with nested conditions for a
            subscription.
          type: array
          items:
            $ref: '#/components/schemas/Children'
    SubscriptionResponse:
      type: object
      properties:
        subscriptionId:
          description: >-
            System generated unique identifier for a subscription, which is
            returned in the create subscription call. Access the individual
            subscription using its id to update, get details or delete a
            subscription permanently.
          type: string
          example: >-
            CNSa91bf379b48a593fd17f07f431bad8fb296796498f4e9982ea134394c1fa4f071556724070
          maxLength: 255
          minLength: 1
        eventType:
          description: >-
            Client Allowed values are either 1 of the
            below:<ul><li>PAYMENT_AUTHORIZATION</li><li>CLEARING</li></ul>If not
            provided default to 'PAYMENT_AUTHORIZATION'
          type: string
          enum:
            - PAYMENT_AUTHORIZATION
            - CLEARING
          maxLength: 30
        subscriptionName:
          description: >-
            Unique name for the subscription. It can include upper and lowercase
            alphabets, numbers, dashes and underscores.
          type: string
          example: Enter_unique_subscription_name_here
          maxLength: 50
          minLength: 1
        active:
          description: >-
            Specify whether the subscription should be active (true ) or
            inactive (false) for the API to create notifications only if the
            subscription is active.
          type: boolean
          example: true
        subscription:
          description: >-
            Alert subscription conditions to filter the payment authorization
            messages.
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
    ErrorResponse:
      type: object
      properties:
        errorMessage:
          type: array
          items:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorMessage:
      type: object
      required:
        - errorCode
        - errorDescription
      properties:
        errorCode:
          type: string
          enum:
            - EVB0700
            - EVB0701
            - EVB0702
            - EVB0703
            - EVB0704
            - EVB0705
            - EVB0706
            - EVB0707
            - EVB0708
            - EVB0709
            - EVB0710
            - EVB0711
            - EVB0712
            - EVB0713
            - EVB0714
            - EVB0715
            - EVB0716
            - EVB0717
            - EVB0718
            - EVB0719
            - EVB0720
            - EVB0721
            - EVB0722
            - EVB0723
            - EVB0724
            - EVB0725
            - GRC0005
            - GRC0010
            - GRC0003
            - GRC0016
            - EVB0357
            - EVB0201
            - EVB0066
            - EVB0726
            - EVB0727
            - EVB0728
            - EVB0729
        errorDescription:
          description: >-
            The error description that corresponds to error code when there is
            any<br>               error occurred while retrieving the
            transaction.            <br>            <br>              *
            `EVB0700` - subscriptionName is Mandatory<br>              *
            `EVB0701` - subscriptionName length should contain a min of 1
            character and a max of 50 characters<br>              * `EVB0702` -
            subscriptionName field is invalid and can only have letters,
            numbers, dashes and underscores<br>              * `EVB0703` -
            active is Mandatory<br>              * `EVB0704` - operator field is
            Mandatory<br>              * `EVB0705` - WHERE operator can only be
            used in the first subscription.operator field, other
            subscription.operator fields should use only OR
            operator<br>              * `EVB0706` - fieldName is
            Mandatory<br>              * `EVB0707` - subscription.fieldName must
            have a value of programId for the first condition in the
            specifications in conjunction with the WHERE operator and the EQUALS
            fieldOperator<br>              * `EVB0708` - subscription.fieldName
            that is after the first subscription can only have a value of
            programId in conjunction with an operator value of OR and a
            fieldOperator value of EQUALS<br>              * `EVB0709` -
            fieldName should contain a min of 1 character and a max of 30
