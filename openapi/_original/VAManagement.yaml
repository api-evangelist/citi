    Entity-Contact-Name:
      title: Entity-Contact-Name
      xml:
        name: EntityContactName
      type: object
      properties:
        first_name:
          title: first_name
          xml:
            name: FirstName
          type: string
          minLength: 1
          maxLength: 105
          description: >-
            First name of entity linked to a virtual account. <br> Required
            parameter if the `entity` object is used. <br> - Required parameter
            when sole trader (`entity.type`='S') or individual
            (`entity.type`='I') is present <br> - Not applicable for company
            (`entity.type`='C').

            - For 'US' virtual_account.entity.first_name and
            virtual_account.entity.last_name fields combined total length
            including spaces cannot exceed 34 characters. <br> 

            - For sole trader (`entity.type`='S') and individual
            (`entity.type`='I'), `entity.first_name` and `entity.last_name`
            should not be same.
          example: John
        last_name:
          title: last_name or entity_name
          xml:
            name: LastName
          type: string
          minLength: 1
          maxLength: 105
          description: >-
            Last name of the entity linked to a virtual account. <br> Required
            parameter if the `entity` object is used. <br> <br> - For sole
            trader (`entity.type`='S') or individual (`entity.type`='I') -
            include the last name <br> - For company (`entity.type`='C') -
            include the legal entity name.

            - For 'US' virtual_account.entity.first_name and
            virtual_account.entity.last_name fields combined total length
            including spaces cannot exceed 34 characters. <br> 

            - For company (`entity.type`='C'), `entity.last_name` should not be
            same as `beneficial_owner.first_name` + `beneficial_owner.last_name`
            (spaces between first name and last name removed) for any beneficial
            owner.
          example: Thomas
