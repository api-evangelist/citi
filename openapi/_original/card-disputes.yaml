openapi: 3.0.0
info:
  description: >-
    Cards disputes APIs to initiate a dispute case creation request and to
    inquire the dispute case status
  version: 1.0.0
  title: cards-disputes_1-0-0
  x-ibm-name: cards-disputes_1-0-0
  contact:
    name: GLOBAL Commercial Cards API Production support
    email: >-
      dl.icg.global.commercial.cards.digital.production.support@imcap.ap.ssmb.com
tags:
  - name: Create Dispute request
    description: Operations related to dispute management
  - name: Status Enquiry request
    description: 'Operations related to dispute status enquiry '
servers:
  - url: https://tts.apib2b.citi.com/tts/cards/disputes
    description: Base URL for the API
  - url: https://tts.apib2b.citi.com/tts/apac/cards/disputes
    description: Base URL for the APAC API
paths:
  /v1/cases:
    post:
      summary: Submit dispute case on a transaction
      description: >-
        Case creation/submission API for clients to consume by providing
        Acquirer Reference Number of a posted transaction along with dispute
        reason
      operationId: createDispute
      security:
        - ClientCredentials: []
      tags:
        - Create Dispute request
      parameters:
        - name: region
          in: header
          description: 'Region of the client. <br>`Example`: NAM,APAC, EMEA, LATAM, INDIA'
          schema:
            type: string
          required: true
        - name: country
          in: header
          description: >-
            Country code in ISO 3166 alpha-3 format.. <br>`Example`: USA(United
            States of America), SGP(Singapore), PHL(Philippines), THA(Thailand)
          schema:
            type: string
          required: true
        - name: req-sys-id
          in: header
          description: >-
            Client Unique id to identify the particular
            request.Min-12:Max-36<br> `Format`: UUID <br> `Example`:
            7d13245e-243a-5e8f-bc10-8626ec728291
          schema:
            type: string
          required: true
        - name: Authorization
          in: header
          description: >-
            </br>Request should contain Authorization header OAuth  <br>
            **OAuth:** <br> Request contains a header field in the form of
            Authorization: Bearer (access_token), where access_token is
            generated using the OAuth url <br>

            `Example` : Bearer
            AAIkMjU2OTI4OGQtODY5Ny00ZjgzLTg0NzEtY2QyZWYwZjM5ZjJk_m3yqnGAbxR_ovVx5bs9OUfF0dd52qHadLtw2ARkwCw2BJcwg1zHsTOuvjPtsW5ioxxd2xXXjlDDCKLuvg15Ce1gzGxTu17xEvLOzSECLIdU_02JbpS3h9ee9GzB-u_MPfKseOiACXYAh_7AVWQhtRMLDKd8RgCUsNzTGXXBeE4</br>
          schema:
            type: string
          required: true
      requestBody:
        required: true
        description: requestBody section
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseRequest'
            examples:
              DuplicateProcessing:
                $ref: '#/components/examples/DuplicateProcessing'
              AlteredAmount:
                $ref: '#/components/examples/AlteredAmount'
              IncorrectTransactionCurrency:
                $ref: '#/components/examples/IncorrectTransactionCurrency'
              MultipleProcessing:
                $ref: '#/components/examples/MultipleProcessing'
              CreditAppliedAsCharge:
                $ref: '#/components/examples/CreditAppliedAsCharge'
              HotelCancellation:
                $ref: '#/components/examples/HotelCancellation'
              AirlineTicketCancellation:
                $ref: '#/components/examples/AirlineTicketCancellation'
              MerchandiseReturned:
                $ref: '#/components/examples/MerchandiseReturned'
              CreditNotReceived:
                $ref: '#/components/examples/CreditNotReceived'
              CancelledRecurringTransaction:
                $ref: '#/components/examples/CancelledRecurringTransaction'
              PaidByOtherMeans:
                $ref: '#/components/examples/PaidByOtherMeans'
              ATMDiscrepancy:
                $ref: '#/components/examples/ATMDiscrepancy'
              NotAsDescribed:
                $ref: '#/components/examples/NotAsDescribed'
              NeverReceived:
                $ref: '#/components/examples/NeverReceived'
              FraudulentTransaction:
                $ref: '#/components/examples/FraudulentTransaction'
      responses:
        '202':
          description: Ack Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponsePayload'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/status:
    get:
      summary: >-
        To get status of a dispute by passing the Acquirer Reference Number or
        Case ID
      description: >-
        To get status of a dispute by passing the Acquirer Reference Number or
        Case ID
      operationId: getDisputeStatus
      security:
        - ClientCredentials: []
      tags:
        - Status Enquiry request
      parameters:
        - name: Content-Type
          in: header
          description: >-
            The MIME type of the body of the request (used with POST and PUT
            requests). Always pass application/json.
          schema:
            type: string
          required: false
        - name: req-sys-id
          in: header
          description: Client Unique id to identify the particular request.
          schema:
            type: string
          required: true
        - name: country
          in: header
          description: >-
            Country code in ISO 3166 alpha-3 format.. <br>`Example`: USA(United
            States of America), SGP(Singapore), PHL(Philippines), THA(Thailand)
          schema:
            type: string
          required: true
        - name: region
          in: header
          description: 'Region of the client. <br>`Example`: NAM,APAC, EMEA, LATAM, INDIA'
          schema:
            type: string
          required: true
        - name: Authorization
          in: header
          description: >-
            </br>Request should contain Authorization header OAuth  <br>
            **OAuth:** <br> Request contains a header field in the form of
            Authorization: Bearer (access_token), where access_token is
            generated using the OAuth url <br>

            `Example` : Bearer
            AAIkMjU2OTI4OGQtODY5Ny00ZjgzLTg0NzEtY2QyZWYwZjM5ZjJk_m3yqnGAbxR_ovVx5bs9OUfF0dd52qHadLtw2ARkwCw2BJcwg1zHsTOuvjPtsW5ioxxd2xXXjlDDCKLuvg15Ce1gzGxTu17xEvLOzSECLIdU_02JbpS3h9ee9GzB-u_MPfKseOiACXYAh_7AVWQhtRMLDKd8RgCUsNzTGXXBeE4</br>
          schema:
            type: string
          required: true
        - name: acquirerReferenceNumber
          in: query
          example: '12345678912123456789123'
          description: >-
            The Acquirer Reference Number of the transaction on which the
            dispute case was created
          schema:
            type: string
          required: false
        - name: caseId
          in: query
          example: '12345678912'
          description: >-
            The Dispute case ID that was sent back to the client as part of the
            final response webhook post dispute case creation
          schema:
            type: string
          required: false
      responses:
        '200':
          description: >-
            <table><tr><td>Code</td><td>Details</td></tr><tr><tr><td>ChargeBackStatusEnquiryResponse</td><td>Success
            response for getting the status</td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeBackStatusEnquiryResponse'
        '400':
          description: >-
            <table><tr><td>InvalidChargeBackStatusEnquiryResponse</td><td>Bad
            request</td></tr></tr><tr><td>DISP140</td><td>Client Group corporate
            number is not available</td></tr><tr><td>DISP141</td><td>Invalid
            Case ID or ARN</td></tr><tr><td>DISP142</td><td>Either
            acquirerReferenceNumber or caseId is mandatory. Kindly provide
            acquirerReferenceNumber or
            caseId</td></tr><tr><td>DISP143</td><td>Either
            acquirerReferenceNumber or caseId is only accepted but not both.
            Kindly provide acquirerReferenceNumber or
            caseId</td></tr><tr><td>DISP144</td><td>caseId expected minimum
            length is 11 and can be only
            alphanumeric</td></tr><tr><td>DISP145</td><td>acquirerReferenceNumber
            expected minimum length is 23 and expected maximum length is 24 and
            can be of only digits</td></tr><tr><td>DISP146</td><td>No record
            found for given caseId</td></tr><tr><td>DISP147</td><td>No record
            found for given
            acquirerReferenceNumber</td></tr><tr><td>DISP148</td><td>Invalid
            caseId</td></tr><tr><td>DISP149</td><td>Invalid
            acquirerReferenceNumber</td></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidChargeBackStatusEnquiryResponse'
        '401':
          description: >-
            <table><tr><td>UnAuthorizedResponse</td><td>UnAuthorized
            request.</td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnAuthorizedResponse'
        '500':
          description: >-
            <table><tr><td>InternalServerErrorResponse</td><td></tr><tr><td>GRC0015</td><td>We
            have encountered an error and couldn't receive your request. Please
            try again, or contact Citi support if you have any further questions
            or comments</td><table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
components:
  securitySchemes:
    ClientCredentials:
      type: oauth2
      description: ''
      flows:
        clientCredentials:
          tokenUrl: https://tts.apib2b.citi.com/api/oauth2/token
          scopes:
            /api: ''
  schemas:
    CaseRequest:
      properties:
        reasonCode:
          description: >-
            Reason Code provides the Dispute reason for sending the chargeback.
            Based on the selected reason code, the respective reason code
            details need to be passed in the request.
          type: string
          format: string
          title: reasonCode
          example: DuplicateProcessing
          enum:
            - DuplicateProcessing
            - AlteredAmount
            - IncorrectTransactionCurrency
            - MultipleProcessing
            - CreditAppliedAsCharge
            - HotelCancellation
            - AirlineTicketCancellation
            - MerchandiseReturned
            - CreditNotReceived
            - CancelledRecurringTransaction
            - PaidByOtherMeans
            - ATMDiscrepancy
            - NotAsDescribed
            - NeverReceived
            - FraudulentTransaction
        reasonCodeDetails:
          $ref: '#/components/schemas/ReasonCodeDetails'
        transactionDetails:
          description: Dispute transactions details
          type: array
          maxLength: 1
          title: transactionDetails
          items:
            $ref: '#/components/schemas/TransactionDetails'
      required:
        - reasonCode
        - transactionDetails
        - reasonCodeDetails
    TransactionDetails:
      properties:
        requestId:
          description: >-
            Unique Request ID. UUID generated by a client for each individual
            transaction
          type: string
          format: alphanumeric
          title: requestId
          example: 73d150f5-ee16-4841-a2db-4f24b6d372cc
          maxLength: 36
          minLength: 36
        acquirerReferenceNumber:
          description: >-
            The Acquirer Reference Number of the transaction against which the
            dispute case creation request is being raised
          type: string
          format: numeric
          title: acquirerReferenceNumber
          example: '22345678901234500000000'
          maxLength: 24
          minLength: 23
        disputeAmount:
          description: Dispute Amount
          type: number
          format: Double
          title: disputeAmount
          example: 123456789876.65
          maxLength: 19
        disputeCurrency:
          description: >-
            Disputed amount currency. ISO-3 Currency Code only. E.g. USD, INR,
            IDR, SGD
          type: string
          format: string
          title: disputeCurrency
          example: USD
          minLength: 3
          maxLength: 3
      required:
        - requestId
        - acquirerReferenceNumber
        - disputeAmount
        - disputeCurrency
    ReasonCodeDetails:
      description: Pass the reason code details based on the reason code selected.
      oneOf:
        - $ref: '#/components/schemas/DuplicateProcessing'
        - $ref: '#/components/schemas/AlteredAmount'
        - $ref: '#/components/schemas/IncorrectTransactionCurrency'
        - $ref: '#/components/schemas/MultipleProcessing'
        - $ref: '#/components/schemas/CreditAppliedAsCharge'
        - $ref: '#/components/schemas/HotelCancellation'
        - $ref: '#/components/schemas/MerchandiseReturned'
        - $ref: '#/components/schemas/CreditNotReceived'
        - $ref: '#/components/schemas/AirlineTicketCancellation'
        - $ref: '#/components/schemas/CancelledRecurringTransaction'
        - $ref: '#/components/schemas/NeverReceived'
        - $ref: '#/components/schemas/NotAsDescribed'
        - $ref: '#/components/schemas/ATMDiscrepancy'
        - $ref: '#/components/schemas/PaidByOtherMeans'
        - $ref: '#/components/schemas/FraudulentTransaction'
    DuplicateProcessing:
      properties:
        chComments:
          description: Cardholder comments
          type: string
          format: alphanumeric
          title: chComments
          example: Sample cardholder comments.
          maxLength: 250
        chAckd:
          description: >-
            Checkbox Answer to the Question -I certify that the information
            provided is true to the best of my knowledge (True/False)
          type: string
          format: string
          title: chAckd
          example: 'True'
      required:
        - chAckd
    AlteredAmount:
      properties:
        chComments:
          description: Cardholder comments
          type: string
          format: alphanumeric
          title: chComments
          example: Sample cardholder comments
          maxLength: 250
        chAlteredAmtFrm:
          description: This is the expected original transaction amount
          type: string
          format: Double
          title: chAlteredAmtFrm
          example: '1234567898.76'
          maxLength: 19
        chAlteredAmtTo:
          description: >-
            This is the amount that the original transaction amount was altered
            to
          type: string
          format: Double
          title: chAlteredAmtTo
          example: '12345678987.98'
          maxLength: 19
      required:
        - chAlteredAmtFrm
        - chAlteredAmtTo
    IncorrectTransactionCurrency:
      properties:
        merchantProcessedCurr:
          description: Merchants processed currency only. E.g. USD, INR, IDR, SGD
          type: string
          format: string
          title: merchantProcessedCurr
          example: USD
          maxLength: 3
          minLength: 3
        chReceiptCurr:
          description: Cardholders receipt currency only. E.g. USD, INR, IDR, SGD
          type: string
          format: string
          title: chReceiptCurr
          example: IND
          maxLength: 3
          minLength: 3
      required:
        - merchantProcessedCurr
        - chReceiptCurr
    MultipleProcessing:
      properties:
        chComments:
          description: Cardholder comments
          type: string
          format: alphanumeric
          title: chComments
          example: Sample cardholder comments
          maxLength: 250
        chProvidedTransDt:
          description: Cardholder provided transaction date, Should be YYYYMMDD format
          type: string
          format: Date
          title: chProvidedTransDt
          example: YYYYMMDD
        chProvidedTransAmnt:
          description: Cardholder provided transactional amount .
          type: string
          format: Double
          title: chProvidedTransAmnt
          example: '1234567898765.43'
          maxLength: 19
      required:
        - chProvidedTransDt
        - chProvidedTransAmnt
    CreditAppliedAsCharge:
      properties:
        chComments:
          description: Cardholder comments
          type: string
          format: alphanumeric
          title: chComments
          example: Sample cardholder comments
          maxLength: 250
      additionalProperties: false
    HotelCancellation:
      title: HotelCancellation
      properties:
        chComments:
          description: 'Cardholder comments '
          type: string
          format: alphanumeric
          title: chComments
          example: >-
            If without Cancellation number, provide Details of the cancellation
            and the person accepting the Cancellation.
          maxLength: 250
        cancelledDate:
          description: Cardholder cancellation date. Should be YYYYMMDD format
          type: string
          format: Date
          title: cancelledDate
          example: YYYYMMDD
        cancelledTime:
          description: Cardholder cancellation time. Should be HH:MM format
          type: string
          format: Time
          title: cancelledTime
          example: HH:MM
        cancellationNumber:
          description: >-
            Cancellation number .If isCancelPolicyProvided == Y then, Either
            Cancellation Number or Cancellation Details is required
          type: string
          format: numeric
          title: cancellationNumber
          example: '1245'
        isCancelPolicyProvided:
          description: Is the cancellation policy provided? True/False
          type: string
          format: string
          title: isCancelPolicyProvided
          example: 'True'
        cancellationDetails:
          description: >-
            Cancellation details.Either Cancellation Number or Cancellation
            Details is required
          type: string
          format: alphanumeric
          title: cancellationDetails
          example: >-
            If without Cancellation number, provide Details of the cancellation
            and the person accepting the Cancellation.
          maxLength: 250
        contactedMerchantDt:
          description: Cardholder contact date with the Merchant. Should be YYYYMMDD format
          type: string
          format: Date
          title: contactedMerchantDt
          example: YYYYMMDD
        merchantResponse:
          description: >-
            Response from the Merchant .If CancellationDetails is iprovided then
            Merchant Response is Mandatory
          type: string
          format: alphanumeric
          title: merchantResponse
          example: Merchant Response
        isMerchantBankrupt:
          description: Is the Merchant Bankrupt? (True/False)
          type: string
          format: string
          title: isMerchantBankrupt
          example: 'True'
        serviceType:
          description: Type of Service :T=Timeshare/G=Guaranteed Reservation
          type: string
          format: string
          title: serviceType
          example: T
        reservationType:
          description: >-
            If Service Type is  G ,  then choose any of the below  :GR = The
            cardholder properly cancelled the guaranteed reservation/RC = The
            cardholder attempted to cancel within 24 hours of delivery of the
            reservation confirmation/AR = The merchant billed a no show
            transaction for more than one day's accommodation or rental
          type: string
          format: string
          title: reservationType
          example: GR
        serviceDate:
          description: Date of service or expected service
          type: string
          format: Date
          title: serviceDate
          example: YYYYMMDD
        cancellationReason:
          description: Cancellation Reason
          type: string
          format: alphanumeric
          title: cancellationReason
          example: cancellationReason
          maxLength: 250
      required:
        - cancelledDate
        - isCancelPolicyProvided
        - isMerchantBankrupt
        - serviceType
        - serviceDate
        - cancellationReason
    MerchandiseReturned:
      title: MerchandiseReturned
      properties:
        merchandiseAmnt:
          description: Merchandise Amount
          type: string
          format: Double
          title: merchandiseAmnt
          example: '1234567898765432.34'
          maxLength: 19
        merchandiseReturnedOn:
          description: Date the merchandise was returned on (YYYYMMDD)
          type: string
          format: Date
          title: merchandiseReturnedOn
          example: YYYYMMDD
        returnReason:
          description: Reason for returning the merchandise
          type: string
          format: string
          title: returnReason
          example: returnReason
        contactedMerchantOn:
          description: Date the merchant was contacted on (YYYYMMDD)
          type: string
          format: Date
          title: contactedMerchantOn
          example: YYYYMMDD
        merchantResponse:
          description: Merchant Response
          type: string
          format: string
          title: merchantResponse
          example: merchantResponse
        merchantReturnPolicy:
          description: Merchant Return Policy
          type: string
          format: string
          title: merchantReturnPolicy
          example: merchantReturnPolicy
        returnItems:
          description: Items returned to the merchant
          type: string
          format: string
          title: returnItems
          example: returnItems
        isReturnAuthorized:
          description: Is the Return Authorized? (True/False)
          type: string
          format: string
          title: isReturnAuthorized
          example: 'True'
        merchantAdvise:
          description: Merchant advise
          type: string
          format: string
          title: merchantAdvise
          example: merchantAdvise
        merchandiseReceivedOn:
          description: Date the merchandise was received (YYYMMDD)
          type: string
          format: Date
          title: merchandiseReceivedOn
          example: YYYYMMDD
        invoiceNumber:
          description: Invoice Number
          type: string
          format: string
          title: invoiceNumber
          example: '123456789'
        packageSignedBy:
          description: 'Package Signed by '
          type: string
          format: string
          title: packageSignedBy
          example: packageSigned name
        deliveryAddress:
          description: Delivery Address
          type: string
          format: string
          title: deliveryAddress
          example: address
        returnMethod:
          description: >-
            "Return Method.Mandatory if invoice number is present. <br>  Domain
            Values: <br> FF=Face to Face <br> FE=Fed Ex <br> D=DHL <br> U=UPS
            <br> P=Postal Service <br> O=Other"
          type: string
          format: string
          title: returnMethod
          example: P
        otherComments:
          description: Other Comments.Mandatory if value Other selected in Retun Method
          type: string
          format: string
          title: otherComments
          example: otherreturn method
          maxLength: 250
        merchantReturnReceivedDt:
          description: Date of receipt of returned merchandise
          type: string
          format: Date
          title: merchantReturnReceivedDt
          example: YYYYMMDD
      required:
        - merchandiseAmnt
        - merchandiseReturnedOn
        - returnReason
        - contactedMerchantOn
        - merchantResponse
        - returnItems
        - isReturnAuthorized
        - merchantReturnReceivedDt
    CreditNotReceived:
      properties:
        disputeAmnt:
          description: Disputed Amount for which the credit is not received
          type: string
          format: Double
          title: disputeAmnt
          example: '1234567898765432.34'
          maxLength: 19
        creditVoucherDate:
          description: >-
            Date of credit voucher, transaction receipt or refund
            acknowledgement
          type: string
          format: Date
          title: creditVoucherDate
          example: YYYYMMDD
        cancellationDate:
          description: >-
            Date the cardholder cancelled the service or returned the
            merchandise
          type: string
          format: Date
          title: cancellationDate
          example: YYYYMMDD
      required:
        - disputeAmnt
        - creditVoucherDate
        - cancellationDate
    AirlineTicketCancellation:
      title: AirlineTicketCancellation
      properties:
        isCancelled:
          description: Is the airline ticket cancelled? True/False
          type: string
          format: string
          title: isCancelled
          example: 'True'
        cancelledDate:
          description: >-
            Cancellation Date.If isCancelled == 'true', then cancelledDate is
            required 
          type: string
          format: Date
          title: cancelledDate
          example: YYYYMMDD
        cancelReason:
          description: Cancellation Reason
          type: string
          format: string
          title: cancelReason
          example: cancel ticket reason
        ticketNumber:
          description: Ticket Number
          type: string
          format: string
          title: ticketNumber
          example: 24ja98
        contactedAirlineOn:
          description: 'Date on which the client contacted the airline '
          type: string
          format: Date
          title: contactedAirlineOn
          example: YYYYMMDD
        airlineResponse:
          description: Response from the airline
          type: string
          format: string
          title: airlineResponse
          example: airlineResponse
        travelAgentDetails:
          description: 'Details of the Travel Agent '
          type: string
          format: string
          title: travelAgentDetails
          example: travelAgentDetails
        cancellationPolicyAndNum:
          description: Cancellation Policy and Number
          type: string
          format: string
          title: cancellationPolicyAndNum
          example: 24ja98
        isMerchantBankrupt:
          description: Is merchant in bankruptcy/liquidation? True/False
          type: string
          format: string
          title: isMerchantBankrupt
          example: 'True'
        serviceDate:
          description: Date of service or expected service
          type: string
          format: Date
          title: serviceDate
          example: YYYYMMDD
      required:
        - isCancelled
        - isMerchantBankrupt
        - serviceDate
    CancelledRecurringTransaction:
      title: CancelledRecurringTransaction
      properties:
        chNotificationDt:
          description: Cardholder notification date to the merchant.
          type: string
          format: Date
          title: chNotificationDt
          example: YYYYMMDD
        contactedMerchantDt:
          description: >-
            Cardholder contact date with the Merchant.Either Contacted Merchant
            Date or Merchant Response is required 
          type: string
          format: Date
          title: contactedMerchantDt
          example: YYYYMMDD
        merchantResponse:
          description: >-
            Merchant response text to the card holder.Either Contacted Merchant
            Date or Merchant Response is required
          type: string
          format: string
          title: merchantResponse
          example: merchantResponse
        cancellationNumber:
          description: Cancellation number provided by the merchant to the Cardholder.
          type: string
          format: string
          title: cancellationNumber
          example: '123456789'
        cancellationReason:
          description: Cancellation Reason
          type: string
          format: string
          title: cancellationReason
          example: cancellationReason
          maxLength: 250
      required:
        - chNotificationDt
        - cancellationReason
    NeverReceived:
      title: NeverReceived
      properties:
        whatNotReceived:
          description: Details of merchandise or service.
          type: string
          format: string
          title: whatNotReceived
          example: whatNotReceived
          maxLength: 250
        purchaseAmnt:
          description: Amount of Purchase
          type: string
          format: Double
          title: purchaseAmnt
