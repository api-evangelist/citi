    FXQuoteReportRequest:
      description: "Use this endpoint to request historic rates for all currency pairs for either a tradedate or ratesetid over a session. While the fields ‘tradeDate’, ‘rateSetId’,  are optional, you must send them in at least one of the combinations below to fetch the results:\n\na) ‘tradeDate’ \n\nb) ‘rateSetId’ \n"
      type: object
      required:
      - action
      - jsonReqId
      - senderCompId
      - onBehalfOfCompId
      - sendingTime
      - account
      properties:
        action:
          type: string
          description: 'The service you are requesting. Allowed values: rate-report-request.'
          maxLength: 20
          example: rate-report-request
        jsonReqId:
          type: string
          description: The unique identifier for the JSON request. Must be alphanumeric.
          maxLength: 100
          example: Req20181011776
        senderCompId:
          type: string
          description: The Citi-assigned value used to identify the message sender. This was assigned to you during onboarding. May contain special characters ( ‘_’, ‘.’, ‘-‘).
          maxLength: 20
          example: ClientName
        onBehalfOfCompId:
          type: string
          description: The Citi-assigned value used to identify the sub-entity. This was assigned to you during onboarding. May contain special characters ( ‘_’, ‘.’, ‘-‘)
          maxLength: 20
          example: ClientName
        sendingTime:
          type: string
          description: 'The time of the message transmission expressed in UTC (Universal Time Coordinated, also known as "GMT"). Format: YYYYMMDD-HH:MM:SS.mmm.'
          example: 20180820-04:48:29.125
        account:
          type: string
          description: Your Citi-assigned client identifier. May contain special characters ( ‘_’, ‘.’, ‘-‘)
          maxLength: 50
          example: ABC123
        rateSetId:
          type: string
          description: 'The Rate Set ID for which the rate report is requested.

            '
          example: '12345'
        tradeDate:
          type: string
          format: date
          description: 'The trade date for which the rate report is requested.

            '
          example: '2026-06-30'
      example:
        action: rate-report-request
        jsonReqId: 8ee02197-d54d-41ac-84a4-b607462ba3b1
        senderCompId: IFXCLIENT1
        onBehalfOfCompId: IFXCLIENT1
        sendingTime: 20180820-04:48:29.125
        account: XXXXXXX
        rateSetId: '12345'
    FXQuoteResponse:
      type: object
      required:
      - action
      - jsonReqId
      - senderCompId
      - onBehalfOfCompId
      - sendingTime
      properties:
        action:
          type: string
          description: Defines the action of the message. Value will be rate-response.
          example: rate-response
          maxLength: 20
        jsonReqId:
          type: string
          description: The unique identifier for the JSON request. Format is alphanumeric.
          maxLength: 100
          example: Req20181011776
        senderCompId:
          type: string
          description: The Citi-assigned value used to identify the firm sending the message. May  contain special characters ( ‘_’, ‘.’, ‘-‘).
          maxLength: 20
          example: ClientName
        onBehalfOfCompId:
          type: string
          description: The Citi-assigned value used to identify the sub-entity. May contain special characters ( ‘_’, ‘.’, ‘-‘)
          maxLength: 20
          example: ClientName
        sendingTime:
          type: string
          description: 'The time of message transmission. Always expressed in UTC (Universal Time Coordinated, also known as ''GMT''), format: YYYYMMDD-HH:MM:SS.mmm.'
          example: 20180820-04:48:31.155
        errorCode:
          type: integer
          description: The error code associated with the response. See the Error Codes tab for a complete list.
          example: 89
        errorMessage:
          type: string
          description: The error message associated with the response. See the Error Codes tab for a complete list.
          example: No records found for the given inputs.
        ifxRates:
          type: array
          items:
            type: object
            required:
            - rateSetId
            - ccyPair
            - tenor
            - bidSpotRate
            - offerSpotRate
            - bidForwardPoints
            - offerForwardPoints
            - midPrice
            - validUntilTime
            - isValid
            - baseCurrency
            - ratePrecision
            - valueDate
            - bidOutrightRate
            - offerOutrightRate
            - fixingRate
            properties:
              rateSetId:
                type: integer
                description: The Citi-defined rate set ID that the rate belongs to.
                example: 123456
              ccyPair:
                type: string
                description: A six character sorted alpha string comprising two ISO ccy codes that the rate applies to.
                example: EURUSD
                maxLength: 6
              tenor:
                type: string
                description: The Tenor for the rate.
                maxLength: 3
                example: SP
              bidSpotRate:
                type: string
                format: double
                description: The Bid Spot Rate for the currency pair.
                example: '1.04'
              offerSpotRate:
                type: string
                format: double
                description: The Offer Spot Rate for the currency pair.
                example: '1.06'
              bidForwardPoints:
                type: string
                format: double
                description: The Bid Forward Points for this tenor (Forward Pricing Only).
                example: '0.01'
              offerForwardPoints:
                type: string
                format: double
                description: The Offer Forward Points for this tenor (Forward Pricing Only).
                example: '0.02'
              midPrice:
                type: string
                format: double
                description: The Mid Price for the rate.
                example: '1.05'
              validUntilTime:
                type: string
                description: 'The time and date that this rate will expire. Note-This is held in GMT / UTC format: yyyyMM-dd HH:mm:ss.SSS'
                example: 2018-10-15 16:30:00.000 GMT
              isValid:
                type: boolean
                description: A flag that shows that Citi was able to provide the requested rate. If this field is false, then midPrice, points, and rates are zero.
                example: true
              baseCurrency:
                type: string
                maxLength: 3
                description: The base currency of the currency pair.
                example: EUR
              ratePrecision:
                type: integer
                description: The number of decimal places to which the rate(s) for this tenor should be quoted in regular base/term format.
                example: 2
              isTradable:
                type: boolean
                description: A flag to indicate whether the rate is tradable by the client (TRUE) or is to be used for reference purposes only.
                example: true
              fixingRate:
                type: string
                format: double
                description: This field and `fixingsource` field will only be populated once a month on the agreed NDF fixing date. Will contain the fixing rate to be used for this currency pair.
                example: '0'
              fixingSource:
                type: string
                description: Will contain the fixing source associated with the fixingRate field.
                example: Citi New York 15:00 Fixing
                maxLength: 100
              valueDate:
                type: string
                format: date
                description: 'The value date of the rate returned in format: yyyy-MM-dd.'
                example: '2011-05-06'
              drawDownValidUntilTime:
                description: 'Optional field. The extended time and date that this rate will expire for sending draw down orders. This field will be sent only if you are enabled for sending pre-order requests. Note: this is held in GMT / UTC in format: yyyy-MM-dd HH:mm:ss.SSS.

                  '
                example: '2011-05-05 09:30:00.000'
              bidOutrightRate:
                type: string
                format: double
                description: The Bid Outright Rate for this currency pair.
                example: '111.24'
              offerOutrightRate:
                type: string
                format: double
                description: The Offer Outright Rate for this currency pair.
                example: '112.24'
              isMrf:
                description: Optional field. Applicable when MRF hourly updated rate option enabled. Flag indicates whether this is updated rate due to MRF True indicates updated rate.
                type: boolean
                example: true
              rateId:
                type: integer
                description: Optional field. Applicable when MRF hourly updated rate option enabled. Unique identifier of a rate. Value is incremental. Used for reference purpose to identify latest rate in case of incremental version of rate due to MRF.
                example: 456123
      example:
        action: rate-response
        jsonReqId: 8ee02197-d54d-41ac-84a4-b607462ba3b1
        senderCompId: IFXCLIENT1
        onBehalfOfCompId: IFXCLIENT1
        sendingTime: 20250126-22:54:56.684
