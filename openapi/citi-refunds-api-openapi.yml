  schemas:
    Refund-Update-Request:
      type: object
      title: Refund update request
      required:
      - transaction
      - method
      properties:
        method:
          $ref: '#/components/schemas/Refund-Method-Update'
        transaction:
          $ref: '#/components/schemas/Refund-Transaction-Update'
        order:
          $ref: '#/components/schemas/Refund-Order-Update'
      additionalProperties: false
      description: Payment Update Request
    Error-Response:
      type: object
      title: Error Response
      properties:
        ref_id:
          type: string
          maxLength: 60
          description: Unique ID for the Transaction
          title: ref_id
        error_details:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Error-Detail'
    Gateway-Error-Response:
      type: object
      title: GatewayErrorResponse
      properties:
        httpCode:
          type: string
          maxLength: 3
          description: Numeric HTTP Staus code
          title: httpCode
        httpMessage:
          type: string
          maxLength: 128
          description: HTTP error message
          title: httpMessage
        moreInformation:
          type: string
          maxLength: 128
          description: HTTP error message
          title: httpMessage
    Card-Refund-Response:
      title: card
      description: Card Method Response
      properties:
        brand:
          description: "The brand name used to describe the card that is recognized and accepted globally. For many major card types this will match the scheme name. In some markets, a card may also be co-branded with a local brand that is recognized and accepted within its country/region of origin (see card.localBrand).You may use this information to support surcharging decisions. This information is gathered from 3rd party sources and may not be accurate in all circumstances. \n- For Card transaction, card.brand parameter is mandatory"
          enum:
          - AMEX
          - CHINA_UNIONPA
          - DINERS_CLUB
          - DISCOVER
          - JCB
          - LOCAL_BRAND_ONLY
          - MAESTRO
          - MASTERCARD
          - RUPAY
          - UATP
          - UNKNOWN
          - VISA
          example: AMEX
          type: string
          title: brand
        scheme:
          description: "The organization that owns a card brand and defines operating regulations for its use. The card scheme also controls authorization and settlement of card transactions among issuers and acquirers. \n- For Card transaction, card.scheme parameter is mandatory"
          enum:
          - AMEX
          - CHINA_UNIONPA
          - DINERS_CLUB
          - DISCOVER
          - JCB
          - LOCAL_BRAND_ONLY
          - MAESTRO
          - MASTERCARD
          - RUPAY
          - UATP
          - UNKNOWN
          - VISA
          example: AMEX
          type: string
          title: scheme
        funding_method:
          description: "The method used by the payer to provide the funds for the payment.You may use this information to support surcharging decisions. This information is gathered from 3rd party sources and may not be accurate in all circumstances. \n- For Card transaction, card.funding_method parameter is mandatory"
          enum:
          - CHARGE
          - CREDIT
          - DEBIT
          - UNKNOWN
          example: CHARGE
          type: string
          title: funding_method
        stored_on_file:
          description: This parameter only applies if you collect card details from your payer, store them, and either you or your payer use the stored credentials for subsequent payments.
          enum:
          - NOT_STORED
          - STORED
          - TO_BE_STORED
          example: NOT_STORED
          type: string
          title: stored_on_file
    Response:
      title: Response
      description: Response
      properties:
        acquirer_code:
          description: Indicates success or failure of the transaction registration. A value of 0 (zero) indicates success, and a value of 99 indicates failure.
          example: ACQ7894561
          maxLength: 100
          minLength: 1
          type: string
          title: acquirer_code
        acquirer_message:
          description: An additional message indicating the success or failure of the transaction registration. If the registration was successful, this parameter contains the value Data Received. If the registration failed, this parameter contains the value Data Not Receive.
          example: MSG12345
          maxLength: 255
          minLength: 1
          type: string
          title: acquirer_message
        card_holder_verification:
          $ref: '#/components/schemas/avs'
    Refund-Order-Update:
      title: Refund Order Update
      properties:
        id:
          description: "A unique identifier for this order to distinguish it from any other order you create. \n- For CARD/GOOGLEPAY/APPLEPAY transactions, order.id parameter is mandatory"
          example: OR123456789
          maxLength: 50
          minLength: 1
          type: string
          title: id
      type: object
    Payment-Response:
      type: object
      title: Payment Response
      properties:
        id:
          type: string
          maxLength: 128
          description: Unique reference number
          example: pay02052023456r
          title: id
        status:
          type: string
          maxLength: 10
          description: The transaction has successfully been created.
          enum:
          - CREATED
          example: CREATED
          title: status
        description:
          type: string
          maxLength: 200
          description: more information about the status
          example: The transaction has successfully been created
          title: description
    Card-Refund-Update-Notification:
      title: card
      description: Card refund update Response
      properties:
        number:
          description: The account number of the payer's account used for the payment. On requests, provide the number in the form that you receive it (as explained below). On responses, the gateway populates it with a form that the payer would recognize.
          example: PA123456789
          maxLength: 23
          minLength: 9
          type: string
          title: number
        expiry_month:
          description: Two-digit month in which the payment card expires.
          example: '01'
          type: string
          pattern: ^(0?[1-9]|1[0-2])$
          title: expiry_month
        expiry_year:
          description: Four-digit year in which the payment card expires.
          type: string
          pattern: ^[0-9]{2,2}$
          example: '25'
          title: expiry_year
        encryption:
          description: The encryption framework used for the payment details received by the gateway.
          enum:
          - DEVICE
          - DIGITAL_WALLET
          - DUKPT
          example: DEVICE
          type: string
          title: encryption
        device:
          $ref: '#/components/schemas/Device-Response'
        device_specific:
          $ref: '#/components/schemas/Device-Specific-Response'
    Refund-Method:
      title: Method
      type: object
      required:
      - type
      properties:
        type:
          description: "Method specified by the customer for the transaction \n- Provide PIX for brazil QR creation \n- Provide CARD for CARD transactions \n- Provide UPI for India UPI transactions \n- Provide FPS for UK transactions \n- Provide PAYPAL for PAYPAL transactions \n- Provide ACH for US Return & Reversal \n- Provide GOOGLEPAY for GOOGLEPAY transactions \n- Provide APPLEPAY for APPLEPAY transactions"
          type: string
          enum:
          - PIX
          - CARD
          - UPI
          - FPS
          - ACH
          - PAYPAL
          - GOOGLEPAY
          - APPLEPAY
          - AFTERPAY
          - AMAZON_PAY
          - BITPAY
          - BIZUM
          - ALIPAY
          - TRUSTLY
          - BLIK
          - BLIK_BNPL
          - CASH_APP
          - DOKU_WALLET
          - EPS
          - ESTONIAN_BANKS
          - VERKKOPANKKI
          - FLOAPAY
          - FPX
          - GOPAY
          - IDEAL
          - INDOMARET
          - INDONESIAN_BANKS
          - JENIUS_PAY
          - KREDIVO
          - LATVIAN_BANKS
          - LINK_AJA
          - LITHUANIAN_BANKS
          - MBWAY
          - MULTIBANCO
          - OVO_WALLET
          - PAYSAFECARD
          - P24
          - SATISPAY
          - SCALAPAY
          - SKRILL
          - SWISH
          - THAIBANKS
          - TWINT
          - WERO
          - ZIP
          - BANCOMATPAY
          - DRAGONPAY
          - MYBANK
          - ALFAMART
          - PAYU
          - BANCONTACT
          - STABLECOINS
          - OXXO_PAY
          example: PIX
          title: type
    Refunds-Response:
      type: array
      items:
        $ref: '#/components/schemas/Payment-Refund-Notification'
    Refund-Update-Notification:
      type: object
      title: Refund Update Notification
      properties:
        method:
          $ref: '#/components/schemas/Refund-Update-Method'
        transaction:
          $ref: '#/components/schemas/Refund-Update-Transaction'
        order:
          $ref: '#/components/schemas/Refund-Update-Order'
    Refund-Update-Order:
      type: object
      title: Refund-Notification Order
      properties:
        id:
          description: A unique identifier for this order to distinguish it from any other order you create.
          example: OR123456789
          maxLength: 40
          minLength: 1
          type: string
          title: id
        amount:
          description: The total amount for the order
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        creation_date_time:
          type: string
          format: date-time
          description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment (Debit) - Date time, generated by CitiConnect API, when CitiConnect API accepted a payment initiation after validation \n- Instant Payment (Credit) - Date time, either provided by the debtor bank or generated by Citi's transaction processing application, when a transaction was created"
          example: '2022-09-13T08:23:49.114Z'
          title: creation_date_time
        update_time:
          type: string
          format: date-time
          description: "Indicates the date and time the gateway considers the order to have last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment (Debit) - Date time, generated by CitiConnect API, when CitiConnect API accepted a payment initiation after validation \n- Instant Payment (Credit) - Date time, either provided by the debtor bank or generated by Citi's transaction processing application, when a transaction was created "
          example: '2022-09-13T08:23:49.114Z'
          title: update_time
        reference:
          description: An optional identifier for the orderFor example, a shopping cart number, an order number, or an invoice number.
          example: REPAY789541
          maxLength: 200
          minLength: 1
          type: string
          title: reference
        invoice_number:
          description: The invoice number you issued for this order
          example: INV789541
          maxLength: 25
          minLength: 1
          type: string
          title: invoice_number
        currency_code:
          description: ISO 4217 Currency Code for instance  USD/GBP/EUR
          enum:
          - USD
          example: USD
          type: string
          title: currency_code
        merchant_amount:
          description: The total amount for the order in order.merchantCurrency units.
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: merchant_amount
        merchant_currency:
          description: ' The currency in which you priced your inventory for this order, expressed as an ISO 4217 alpha codeISO 4217 Currency Code for instance  USD/GBP/EUR '
          enum:
          - USD
          example: USD
          type: string
          title: merchant_currency
        status:
          type: string
          maxLength: 30
          description: "Order Status, following status you will receive in response \n- AUTHENTICATED - The payer was successfully authenticated. \n- AUTHENTICATION_INITIATED - Payer authentication has been initiated but not completed. \n- AUTHENTICATION_NOT_NEEDED - Payer authentication was not performed as it was not needed. \n- AUTHENTICATION_UNSUCCESSFUL - Payer authentication was not able to be successfully completed. \n- AUTHORIZED - The payment has been authorized successfully but the authorized amount has not yet been captured, in part, full, or excess. \n- CANCELLED - The initial transaction for this order has been voided successfully. \n- CAPTURED - The authorized amount for this order, in full or excess, has been captured successfully. \n- CHARGEBACK_PROCESSED - A Chargeback has been processed against this order. \n- DISPUTED - The payment has been disputed and is under investigation. A request for information has been received or a chargeback is pending. \n- EXCESSIVELY_REFUNDED - The payment has been captured in part, full, or excess, but the captured amount in excess has been refunded successfully. \n- FAILED - The payment has not been successful. \n- FUNDING - The order transfers money to or from the merchant, without the involvement of a payer. For example, recording monthly merchant service fees from the payment service provider. \n- INITIATED - A browser payment that has successfully been initiated for this order. No payment has yet been made. \n- PARTIALLY_CAPTURED - The authorized amount for this order, in part, has been captured successfully. \n- PARTIALLY_REFUNDED - The payment has been captured in part, full, or excess, but the captured amount in part has been refunded successfully. \n- REFUNDED - The payment has been captured in part, full, or excess, but the captured amount in full has been refunded successfully. \n- REFUND_REQUESTED - A refund against captured amounts on this order has been requested but not executed. Requires further action to approve the refund. \n- VERIFIED - The card details for this order have successfully been verified. No payment has yet been initiated or made. \n- DISBURSED - The order amount has successfully been disbursed to the payer."
          example: AUTHENTICATED
          title: status
        total_auth_amount:
          description: The amount that has been successfully authorized for this order.
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_auth_amount
        total_captured_amount:
          description: The amount that has been successfully captured for this order.
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_captured_amount
        total_disbursed_amount:
          description: 'The amount that has been successfully captured for this order. '
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_disbursed_amount
        total_refunded_amount:
          description: The amount that has been successfully captured for this order.
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_refunded_amount
    Original-Initial-Payment:
      type: object
      title: Original payment
      description: "Either populate UETR OR (id AND value_date) for the refund to be processed \n- For Brazil PIX, India UPI and UK FPS refund payment, original_payment object is mandatory"
      properties:
        id:
          description: The original payment transaction identification
          example: pay02052023456r
          maxLength: 128
          minLength: 1
          type: string
          title: id
        uetr:
          type: string
          pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          description: "UUID v4 format unique end-to-end transaction reference. \n- For ACH Return & Reversal, this parameter is mandatory."
          title: uetr
        value_date:
          type: string
          format: date
          description: Format YYYY-MM-DD Date in local time zone (e.g., EST for a United States RTP network transaction) when Citi's transaction processing application starts processing a transaction
          title: value_date
    Refund-Order-Status:
      title: Order
      properties:
        id:
          description: "A unique identifier for this order to distinguish it from any other order you create. \n- For Card transaction, order.id parameter is mandatory"
          example: OR123456789
          maxLength: 40
          minLength: 1
          type: string
          title: id
        creation_date_time:
          type: string
          format: date-time
          description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment (Debit) - Date time, generated by CitiConnect API, when CitiConnect API accepted a payment initiation after validation \n- For Card transaction, order.creation_date_time parameter is mandatory"
          example: '2022-09-13T08:23:49.114Z'
          title: creation_date_time
        update_time:
          type: string
          format: date-time
          description: "Indicates the date and time the gateway considers the order to have last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- For Card transaction, order.update_time parameter is mandatory"
          example: '2022-09-13T08:23:49.114Z'
          title: update_time
        amount:
          description: "The total amount for the order. \n- For Card transaction, order.amount parameter is mandatory"
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        currency_code:
          description: "ISO 4217 Currency Code for instance  USD/GBP/EUR \n- For Card transaction, order.currency_code parameter is mandatory"
          enum:
          - USD
          - INR
          example: USD
          type: string
          title: currency_code
        merchant_amount:
          description: "The total amount for the order in order.merchantCurrency units. \n- For Card transaction, order.merchant_amount parameter is mandatory"
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: merchant_amount
        merchant_currency:
          description: " The currency in which you priced your inventory for this order, expressed as an ISO 4217 alpha codeISO 4217 Currency Code for instance  USD/GBP/EUR \n- order.merchant_currency parameter is mandatory for all transaction type creation \n- For Card transaction, order.merchant_currency parameter is mandatory"
          enum:
          - USD
          - INR
          example: USD
          type: string
          title: merchant_currency
        reference:
          description: An optional identifier for the orderFor example, a shopping cart number, an order number, or an invoice number.
          example: REPAY789541
          maxLength: 200
          minLength: 1
          type: string
          title: reference
        refund_order_id:
          description: Refund order ID
          example: REPAY789541
          maxLength: 200
          minLength: 1
          type: string
          title: refund_order_id
        status:
          type: string
          maxLength: 30
          description: "Order Status, following status you will receive in response \n- AUTHENTICATED - The payer was successfully authenticated. \n- AUTHENTICATION_INITIATED - Payer authentication has been initiated but not completed. \n- AUTHENTICATION_NOT_NEEDED - Payer authentication was not performed as it was not needed. \n- AUTHENTICATION_UNSUCCESSFUL - Payer authentication was not able to be successfully completed. \n- AUTHORIZED - The payment has been authorized successfully but the authorized amount has not yet been captured, in part, full, or excess. \n- CANCELLED - The initial transaction for this order has been voided successfully. \n- CAPTURED - The authorized amount for this order, in full or excess, has been captured successfully. \n- CHARGEBACK_PROCESSED - A Chargeback has been processed against this order. \n- DISPUTED - The payment has been disputed and is under investigation. A request for information has been received or a chargeback is pending. \n- EXCESSIVELY_REFUNDED - The payment has been captured in part, full, or excess, but the captured amount in excess has been refunded successfully. \n- FAILED - The payment has not been successful. \n- FUNDING - The order transfers money to or from the merchant, without the involvement of a payer. For example, recording monthly merchant service fees from the payment service provider. \n- INITIATED - A browser payment that has successfully been initiated for this order. No payment has yet been made. \n- PARTIALLY_CAPTURED - The authorized amount for this order, in part, has been captured successfully. \n- PARTIALLY_REFUNDED - The payment has been captured in part, full, or excess, but the captured amount in part has been refunded successfully. \n- REFUNDED - The payment has been captured in part, full, or excess, but the captured amount in full has been refunded successfully. \n- REFUND_REQUESTED - A refund against captured amounts on this order has been requested but not executed. Requires further action to approve the refund. \n- VERIFIED - The card details for this order have successfully been verified. No payment has yet been initiated or made. \n- DISBURSED - The order amount has successfully been disbursed to the payer."
          example: AUTHENTICATED
          title: status
        total_auth_amount:
          description: "The amount that has been successfully authorized for this order. \n- For Card transaction, order.total_auth_amount parameter is mandatory"
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_auth_amount
        total_captured_amount:
          description: "The amount that has been successfully captured for this order. \n- For Card transaction, order.total_captured_amount parameter is mandatory"
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_captured_amount
        total_refunded_amount:
          description: "The amount that has been successfully captured for this order. \n- For Card transaction, order.total_refunded_amount parameter is mandatory"
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_refunded_amount
