    ResponseFilters:
      description: Provides variaous filter features which are optional in nature
      type: object
      properties:
        sortOrder:
          description: >-
            Specifies the oder in which transactions are
            sorted.<br><br>Applicable for Mastercard only<br><br>`Possible
            values`: ASCENDING, DESCENDING
          type: string
          format: alphanumeric
          example: ASCENDING
          maxLength: 10
        paginationApplied:
          description: Specifies whether pagination has been requested or not
          type: string
          format: boolean
          example: 'true'
        startIndex:
          description: >-
            Specifies the start index of the transactions being requested for
            pagination
          type: string
          format: alphanumeric
          example: '1'
        endIndex:
          description: >-
            Specifies the end index of the transactions being requested for
            pagination.
          type: string
          format: alphanumeric
          example: '100'
        lastIndex:
          description: >-
            Specifies the index of the last available
            transaction.<br><br>Applicable for Mastercard only
          type: string
          format: alphanumeric
          example: '250'
        hasMore:
          description: Specifie if there further transactions after the endIndex.
          type: string
          format: boolean
          example: 'true'
    AuthInfo:
      properties:
        fromDate:
          description: >-
            Specifies the start date from when the reports can be
            retrieved<br>Format - YYYY-MM-DD<br><br>Mastercard -
            Required<br>Visa - Not applicable
          type: string
          format: alphanumeric
          example: '2023-01-01'
          maxLength: 10
        toDate:
          description: >-
            Specifies the end date upto when the reports can be
            retrieved<br><br>Format - YYYY-MM-DD<br><br>Mastercard -
            Required<br>Visa - Not applicable
