        vcaId:
          type: string
          description: >-
            A reference number that uniquely identifies the virtual card
            account.
        cardImage:
          type: string
          description: A visual representation of the virtual card account front and back.
        currencyCode:
          type: string
          description: >-
            Currency Code in which VCA amounts are expressed. Mastercard -
            currencyCode is not required if currencyType = "B". Visa - Specifies
            whether Merchant transactions are limited to the VCA currency
            provided in the currencyCode field. The only possible value is "M".
        timeZone:
          type: string
          description: >-
            Defines the time zone applicable for any date or time parameters
            within controls set for a VCA.
        virtualCardAccountNumber:
          type: string
          description: The virtual card account number to use for transactions.
        expiryDate:
          type: string
          description: >-
            Expiry Date of the virtual card account. Represented in UTC time
            zone. Format - MMYYYY
        securityCode:
          type: string
          description: >-
            The security code (i.e. cvv) corresponding to the virtual card
            account.
        programId:
          type: string
          description: Unique ID of the company record defined in the virtual cards system.
        messageId:
          type: string
          description: >-
            Unique ID of the API message sent. The messageId will be provided
            back in the corresponding response. The ID can be used for
            investigation and troubleshooting. The ID must be unique per
            integration.
        mccGrouping:
          type: array
          description: Limits authorizations to defined Merchant Category Codes.
          items:
            type: string
        mccRange:
          type: array
          description: >-
            Limits authorizations to a defined range of Merchant Category
            Codes.(eg: [0001-9999, 2000-2999])
          items:
            type: string
        mccgAllowed:
          type: boolean
          description: >-
            Required if the mccGrouping field is populated with either a range
            of MCCs, or a MCCG (ex: AUTO, AIR). Specify whether the mccGrouping
            are allowed or disallowed.
          example: true
        currencyType:
          type: string
          description: >-
            Mastercard - Defines the type of the VCA currency. - Value "B"
            stands for Billing Currency. - Value "M" stands for Merchant
            Currency. Visa - The only possible value is "M".
        paymentBeneficiaryId:
          type: number
          description: >-
            Uniquely identifies the payment beneficiary for which the virtual
            card is created.
        paymentBeneficiaryEmails:
          type: array
          description: >-
            Lists of up to 5 email addresses separated by semicolon to which the
            virtual card details should be sent to.<br><br>Mastercard -
            Optional<br>Visa - Not applicable
          items:
            type: string
        customReference:
          type: array
          items:
            $ref: '#/components/schemas/Custom-Reference'
        templateId:
          type: number
          description: >-
            Identifies the template that was setup in the VCA system and that
            should be used for this virtual card.
        cumulativeSpendLimit:
          type: number
          description: >-
            Limits the overall amount that can be spent on the virtual card
            account. This field is associated to the Aging Velocity
            Control.<br>Mastercard - Optional. Max character length - 14 digits
            (12 digits to the left of the decimal and 2 digits to the right of
            the decimal)<br>Visa - Not applicable
        modifySpendVelocityControl:
          type: boolean
          description: >-
            Limits the frequency and total cumulative amount of authorizations
            performed on the VCA within a specified period.
        spendVelocity:
          type: array
          items:
            $ref: '#/components/schemas/Spend-Velocity-Response'
        modifyValidityPeriodControl:
          type: boolean
          description: Limits authorization activity to a specific time period.
        validityStartDate:
          type: string
          description: >-
            Identifies the date from which the virtual card account can be used
            for transactions. Format - YYYY-MM-DD
        validityEndDate:
          type: string
          description: >-
            Identifies the date until which the virtual card account can be used
            for transactions. Format - YYYY-MM-DD
        modifyAmountRangeControl:
          type: boolean
          description: >-
            Approves a transaction only if the requested amount for
            authorization is equal to or greater than the Minimum Amount and
            less than or equal to the Maximum Amount.
        maxAmount:
          type: number
          description: Identifies the maximum allowed transaction amount.
        minAmount:
          type: number
          description: Identifies the minimum allowed transaction amount.
        modifyTransactionLimitControl:
          type: boolean
          description: Limits individual transactions to a maximum amount.
        amountLimit:
          type: number
          description: Identifies the maximum allowed transaction amount.
        modifyCurfewControl:
          type: boolean
          description: >-
            Limits authorization activity to a single time period for each day
            selected.
        curfewTime:
          $ref: '#/components/schemas/Curfew-Time'
        modifyTimeOfDayControl:
          type: boolean
          description: Limits authorization request to defined time periods each day.
        timeOfDay:
          type: array
          items:
            $ref: '#/components/schemas/Time-Of-Day'
        modifyAgingVelocityControl:
          type: boolean
          description: >-
            Sets a cumulative amount and keeps track of the current remaining
            balance. Allows the requester to age off approved authorization
            requests that have not been cleared by the merchant after a defined
            number of days.
        authorizationHoldDays:
          type: number
          description: >-
            Identifies the number of days after which an authorization gets aged
            off if no matching clearing record was received.
        availableBalance:
          type: number
          description: >-
            The current available balance for the virtual card account,
            associated to Aging Velocity Control. This is provided at the
            message level for easy access.
        modifyGeographyControl:
          type: boolean
          description: >-
            Limits authorization requests to a defined geographic location. This
            is an optional control. If this control is not used, pass False or
            leave this section out from the request. If value passed is True,
            all fields in this section are required.<br>Mastercard -
            Optional<br>Visa - Optional
        countryCodes:
          type: array
          example:
            - USA
          description: >-
            Defines the merchant country in which the VCA can or cannot be
            used.<br>Mastercard - Optional<br>Visa - Optional
          items:
            type: string
        allowed:
          type: boolean
          description: >-
            Indicate whether the values in countryCode are allowed or
            disallowed. True = values provided in countryCode are allowed False
            = values provided in countryCode are not allowed
        modifyMerchantIdControl:
          type: boolean
          description: >-
            Limits authorizations to a particular merchant using the Merchant ID
            and Acquirer ID (Mastercard) or Card Acceptor ID (Visa).
        merchantInfo:
          type: array
          items:
            $ref: '#/components/schemas/Merchant-Id-Response'
    Vca-Create-Failure-Response:
      type: object
      title: VcaCreateFailureResponse
      properties:
        vcaId:
          type: string
          description: >-
            A reference number that uniquely identifies the virtual card
            account.
        programId:
          type: string
          description: Unique ID of the company record defined in the virtual cards system.
        messageId:
          type: string
          description: >-
            Unique ID of the API message sent. The messageId will be provided
            back in the corresponding response. The ID can be used for
            investigation and troubleshooting. The ID must be unique per
            integration.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error-Message'
    Vca-Modify-Failure-Response:
      type: object
      title: VcaModifyFailureResponse
      properties:
        vcaId:
          type: string
          description: >-
            A reference number that uniquely identifies the virtual card
            account.
        programId:
