  /vca/v1/create:
    post:
      summary: Create Virtual Card Accounts
      operationId: create
      description: Create a virtual card and set its associated spending controls, custom reference data and payment beneficiaries.
      parameters:
      - name: client_id
        in: query
        required: true
        description: This is your unique identifier shared during your CitiConnect API onboarding. This is the same `client_id` used for OAuth token generation
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Supports \"application/xml\" and \"application/json\".
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: The OAuth Token prefixed with "Bearer" and a space in between.
        required: true
        schema:
          type: string
      - name: country
        in: header
        description: Country of the client.
        required: true
        schema:
          type: string
      - name: region
        in: header
        description: region of the client(APAC/EMEA/NAM)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Create virtual card acknowledgement response
          headers:
            api-transactionId:
              description: Citi commercial cards API tracking ID.
              schema:
                type: string
            messageId:
              description: Unique ID of the API message sent. The messageId will be provided back in the corresponding response. The ID can be used for investigation and troubleshooting. The ID must be unique per integration.
              example: 0123456789012345678901234567
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImmediateAckResponse'
        '400':
          description: Invalid virtual card request
          headers:
            api-transactionId:
              description: Citi commercial cards API tracking ID.
              schema:
                type: string
            messageId:
              description: Unique ID of the API message sent. The messageId will be provided back in the corresponding response. The ID can be used for investigation and troubleshooting. The ID must be unique per integration.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVirtualCardFailureResponse'
        '401':
          description: Unauthorized Modify Virtual Card request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnAuthorizedResponse'
        '405':
          description: Method Not Allowed
