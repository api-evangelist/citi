openapi: 3.2.0
info:
  title: Trade Finance Undertaking API
  description: 'Manage all processes involved in the life cycle of a Trade Finance Undertaking application between corporate and banks :


    `The API supports following functionalities:`

    * Request for application : Sent by the party requesting issuance of the undertaking (applicant or obligor) to the party issuing the undertaking (demand guarantee or standby letter of credit or dependent undertaking or counter-guarantee or counter-standby) and provides details on the applicable rules, terms, conditions and…'
  version: 0.0.1
tags:
- name: Trade Finance Undertaking
paths:
  /trade-finance-undertakings:
    get:
      tags:
      - Trade Finance Undertaking
      summary: Get Trade Finance Undertaking
      description: 'Request details of all avaiable Trade Finance Undertaking applications or issued Trade Finance Undertaking, including any amendments, demands, release, extensions.


        The endpoint will return an empty array when no resource is found.'
      operationId: getBankGuarantees
      parameters:
      - name: X-Request-ID
        in: header
        description: Specify an unique end to end tracking request ID. The element will be populated by the Citi API gateway
        required: false
        style: simple
        explode: false
        schema:
          type: string
        x-requiredByAPIGateway: true
        x-requiredByServiceProvider: true
      - name: X-UserContext
        in: header
        description: Provides requester entitlement information to service provider. A JWT containing a claim representing the entitlements of the API consumer as defined at the Citi Identity Provider. This header is provided by the Citi API Gateway and is not required to be provided by the API consumer.
        required: false
        style: simple
        explode: false
        schema:
          type: string
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIiLCJuYW1lIjoiIiwiaWF0IjowfQ.u_kftAUkjiUZO-OhIyj24H7lOUk1wi9GUF-e14JmCtQ
      - name: X-BIC
        in: header
        description: Specify the BIC of the provider of the service. The identification will be used by the API Gateway to forward the request to service provider.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: CITIIE20
      - name: applicant-issuance-request-identification
        in: query
        description: 'Unique business reference of the Issuance Request, assigned by the applicant.


          Usage: The undertaking-identification must not be used in conjunction with any other filter criteria. The anticipation is that the value is unique to retrieve a specific application by the reference.

          '
        required: false
        style: form
        explode: false
        schema:
          maxLength: 16
          minLength: 1
          type: string
        example: Corporateref1
      - name: undertaking-identification
        in: query
        description: 'Globally unique identification of the Trade Finance Undertaking application. The value must be constant throughout the lifecycle of the account. This identification shall be used as a unique reference to support application lifecycle to support interoperability between API and other channel.


          Usage: The undertaking-identification must not be used in conjunction with any other filter criteria. The anticipation is that the value is unique to retrieve a specific application by the reference.

          '
        required: false
        style: form
        explode: false
        schema:
          maxLength: 16
          minLength: 1
          type: string
        example: '5000052001'
      - name: application-date
        in: query
        description: 'Date on which the applicant lodge the application for issuance of Trade Finance Undertaking. Expressed in the YYYY-MM-DD format. The date cannot be in the future.


          Usage: The application-date must not be used in conjunction with application-from-date or application-to-date or issuance-date.

          '
        required: false
        style: form
        explode: false
        schema:
          pattern: ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)(?:Z|[+-][01]\d:[0-5]\d)?$
          type: string
      - name: application-from-date
        in: query
        description: 'Date on which the applicant lodge the application for issuance of Trade Finance Undertaking. Expressed in the YYYY-MM-DD format. The date cannot be in the future.


          Usage: The application-date must be used in conjunction with application-to-date. When used in conjunction with the application-to-date, the endpoint returns the application where the application date fall within that period.

          '
        required: false
        style: form
        explode: false
        schema:
          pattern: ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)(?:Z|[+-][01]\d:[0-5]\d)?$
          type: string
        example: '2023-05-22'
      - name: application-to-date
        in: query
        description: 'Date on which the applicant lodge the application for issuance of Trade Finance Undertaking. Expressed in the YYYY-MM-DD format. The date cannot be in the future.


          Usage: The application-date must not be used in conjunction with application-from-date. When used in conjunction with the application-from-date, the endpoint returns the application where the application date fall within that period.

          '
        required: false
        style: form
        explode: false
        schema:
          pattern: ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)(?:Z|[+-][01]\d:[0-5]\d)?$
          type: string
        example: '2023-05-23'
      - name: issuance-date
        in: query
        description: Date on which the Trade Finance Undertaking is issued by the issuing bank. Expressed in the YYYY-MM-DD format. The date cannot be in the future.
        required: false
        style: form
        explode: false
        schema:
          pattern: ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)(?:Z|[+-][01]\d:[0-5]\d)?$
          type: string
      - name: application-lifecycle-status
        in: query
        description: "Specifies the state of a Trade Finance Undertaking in its processing cycle.\n\nType of Trade Finance Undertaking status, in a codified form\n  \n  * AMRQ  - Trade Finance Undertaking Amendment Request\n  * APPL  - Trade Finance Undertaking Application\n"
        required: false
        style: form
        explode: false
        schema:
          type: string
        example: APLA
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200'
              examples:
                GETBankGuaranteeResponseCollectionEx-1:
                  $ref: '#/components/examples/GETBankGuaranteeResponseCollectionEx-1'
                GETBankGuaranteeResponseCollectionEx-2:
                  $ref: '#/components/examples/GETBankGuaranteeResponseCollectionEx-2'
                GETBankGuaranteeResponseCollectionEx-3:
                  $ref: '#/components/examples/GETBankGuaranteeResponseCollectionEx-3'
        '400':
          description: Bad Request
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '401':
          description: Unauthorized
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '403':
          description: Forbidden
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '404':
          description: Not Found
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '406':
          description: Not Acceptable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '413':
          description: URI Too Long
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '415':
          description: Unsupported Media Type
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '429':
          description: Too Many Requests
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '500':
          description: Internal Server Error
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '502':
          description: Bad Gateway
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '503':
          description: Service Unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '504':
          description: Gateway Timeout
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        default:
          description: Internal Server Error
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
