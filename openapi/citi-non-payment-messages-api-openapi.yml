          enum:
          - ACDA
          - ACNR
          - ACVA
          - CHRG
          - CNCL
          - CONF
          - CVAA
          - CWFW
          - FTNA
          - ICOV
          - IDUP
          - IPAY
          - IPYI
          - MCOV
          - MODI
          - MWFW
          - PDCR
          - PECR
          - PURP
          - RJCR
          - RJNR
          - RJVA
          - SMTC
          - SMTI
          - UWFW
          - BIAS
          - IDNE
          - IVCR
          - INFO
          - NINF
          - PDNG
          title: decision_code
        reasons:
          type: object
          title: reasons
          properties:
            code:
              type: string
              description: "Code of Transaction reasons \n- If decision_code = RJCR,reasons.code is mandatory for ResponseToRequest-For-Refund "
              enum:
              - AC04
              - ADAC
              - AGNT
              - AM04
              - ARDT
              - ARPL
              - CUST
              - LEGL
              - NARR
              - NOAS
              - NOOR
              - PTNA
              - RQDA
              - WSEQ
              - IDMN
              - ACLR
              - AEXR
              - ARFR
              - ARJR
              - PATE
              - RR04
              - RCAR
              - RCNR
              - RCPR
              - URTP
              title: code
            description:
              type: string
              description: "Reason code description (e.g., Debtor account is invalid.). \n- For reasons.code = NARR this field is mandatory"
              minLength: 1
              maxLength: 105
              title: description
        method:
          type: string
          description: "Method type \n- MPNS - for ACH payment \n- RTGS - for FedWire \n- RTNS - for CHIPS \n- RT1 - for SEPA IP payments"
          readOnly: true
          enum:
          - MPNS
          - RTGS
          - RTNS
          - RT1
          title: method
        interbank_settlement_date:
          type: string
          description: YYYY-MM-DD Intended interbank settlement date
          format: date
          readOnly: true
          title: interbank_settlement_date
        instructed_amount:
          type: number
          description: "Instructed amount for partial acceptance of return request \n- Mandatory for ResponseToRequest-For-Refund with decision code as PECR."
          minimum: 0.01
          maximum: 1000000000000000
          title: instructed_amount
        instructed_currency:
          type: string
          description: "Instructed currency for partial acceptance of return request \n- Mandatory for ResponseToRequest-For-Refund with decision code as PECR"
          enum:
          - USD
          - EUR
          - AUD
          - ARS
          - BRL
          - HKD
          - CNY
          title: instructed_currency
        instruction_id:
          writeOnly: true
          type: string
          description: Unique Instruction id on return payment initiation
          minLength: 1
          maxLength: 35
          title: instruction_id
        end_to_end_id:
          writeOnly: true
          type: string
          description: Unique end to end id on return payment initiation
          minLength: 1
          maxLength: 35
          title: end_to_end_id
        country:
          writeOnly: true
          description: "ISO 3166 Alpha-2 code for the non pay message country. \n- This field is optional for US \n- This field is mandatory for SEPA"
          type: string
          default: US
          enum:
          - US
          - IE
          - DE
          - AT
          - BE
          - FI
          - FR
          - GR
          - IT
          - LU
          - NL
          - PT
          - ES
          - SK
          - AU
          - AR
          - BR
          - HK
          - BG
          title: country
        network:
          type: string
          readOnly: true
          enum:
          - RTP
          - FDN
          description: "Financial market infrastructure or clearing system (e.g., RTP Network in the United States) \n- RTP for TCH \n- FDN for FedNow"
          title: network
        debtor:
          $ref: '#/components/schemas/Debtor-Refund'
        ultimate_debtor:
          $ref: '#/components/schemas/Ultimate-Debtor-Refund'
        status:
          type: object
          title: status
          readOnly: true
          properties:
            date_time:
              type: string
              format: date-time
              description: "UTC (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Date time, \n-, status change date time"
              title: date_time
            code:
              type: string
              description: ISO 20022 message status code
              enum:
              - RCVD
              - RJCT
              - PDNG
              title: code
            description:
              type: string
              description: "Status code description \n- RJCT - Rejected \n- RCVD - Received \n -  PDNG - Pending"
              minLength: 1
              maxLength: 256
              title: description
            reasons:
              type: object
              title: reasons
              readOnly: true
              properties:
                code:
                  type: string
                  description: Reason code (applicable when message is rejected)
                  maxLength: 4
                  title: code
                description:
                  type: string
                  description: Reason code description (e.g., Debtor account is invalid.)
                  minLength: 1
                  maxLength: 256
                  title: description
          required:
          - date_time
          - code
          - description
        return_id:
          type: string
          readOnly: true
          description: "If other FI wants to return funds outside of RTP, the unique identifier of the transaction used to return the funds must be included in this field \n - If via ACH, Trace Number must be populated \n - If via FedWire -- IMAD  must be populated \n- If via CHIPS -- System Sequence Number (SSN)  must be populated"
          minLength: 1
          maxLength: 35
          title: return_id
      required:
      - case_id
      - decision_code
      - end_to_end_id
