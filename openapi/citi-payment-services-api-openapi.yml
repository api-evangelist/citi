              description: PixValor do Saque Pix
              pattern: \d{1,10}\.\d{2}
            modalidadeAgente:
              type: string
              title: AgentModalidade do Agente
              description: '##### Agent Type

                <table><tr><th>ACRONYM</th><th>Description</th></tr><tr><td>AGTEC</td><td>Business Establishment Agent</td></tr ><tr><td>AGTOT</td><td>Other Type of Legal Entity Agent</td></tr><tr><td>AGPSS</td><td>Agent Withdrawal Service Provider< /td></tr></table>

                '
              enum:
              - AGTEC
              - AGTOT
              - AGPSS
            prestadorDoServicoDeSaque:
              type: string
              title: Prestador do Serviço de Saque
              pattern: \d{8}
              description: Withdrawal Service Provider ISPB
    Pix_2:
      type: object
      title: Pix
      required:
      - endToEndId
      - valor
      - horario
      properties:
        endToEndId:
          $ref: '#/components/schemas/EndToEndId'
        txid:
          allOf:
          - $ref: '#/components/schemas/TxId_2'
          - pattern: '[a-zA-Z0-9]{1,35}'
        valor:
          type: string
          title: Valor do Pix.
          pattern: \d{1,10}\.\d{2}
          description: Pix value.
        componentesValor:
          type: object
          title: Informações sobre o valor do Pix
          description: "The purpose of this framework is to explain the compositional elements of the Pix value.\n\nStructure rules:\n- The `value` of the Pix is ​​equal to the sum of the `value` fields of the substructures that make up this structure;\n- There cannot be simultaneously a substructure of the `draw` type and another of the `change` type;\n- There is no restriction on the order of substructures.\n\nIn case of withdrawal with withdrawal, you can return\n `original` with value=0.00 (zero) since the sum will be respected, or you can omit\n  the `original` substructure. In the case of change the `original` substructure will always be present.\n\n#### Valid examples:\nExample of valid completions.\n\n- **immediate collection (without cash withdrawal or change)**\n  ```\n  ...\n  \"componentesValor\": [\n   {\n   \"tipo\": \"ORIGINAL\",\n   \"valor\": \"100.00\"\n   }\n   ]\n  ...\n  ```\n- **Immediate collection with cash withdrawal**\n  ```\n  ...\n  \"componentesValor\": [\n   {\n   \"tipo\": \"SAQUE\",\n   \"valor\": \"100.00\"\n   } \n   ]\n  ...\n  ```\n- **Immediate collection with cash withdrawal (it may show type=ORIGINAL and value=0.00)**\n   ```\n   ...\n   \"componentesValor\": [\n   {\n   \"tipo\": \"ORIGINAL\",\n   \"valor\": \"0.00\"\n   },\n   {\n   \"tipo\": \"SAQUE\",\n   \"valor\": \"100.00\"\n   }\n  ]\n  ...\n  ```\n- **Immediate collection with change**\n ```\n ...\n \"componentesValor\": [\n {\n \"tipo\": \"ORIGINAL\",\n \"valor\": \"80.00\"\n },\n {\n \"tipo\": \"TROCO\",\n \"valor\": \"20.00\"\n }\n ]\n ...\n ```\n - **Immediate collection with change (the order does not matter)**\n ```\n ...\n \"componentesValor\": [\n {\n \"tipo\": \"TROCO\",\n \"valor\": \"20.00\"\n },\n {\n \"tipo\": \"ORIGINAL\",\n \"valor\": \"80.00\"\n }\n ]\n ...\n ```\n#### Invalid examples:\n Non-exhaustive examples, of invalid completions.\n - **`ORIGINAL` with value higher than 0.00 (zero) and `SAQUE` together**\n ```\n ...\n \"componentesValor\": [\n {\n \"tipo\": \"ORIGINAL\",\n \"valor\": \"80.00\"\n },\n {\n \"tipo\": \"SAQUE\",\n \"valor\": \"20.00\"\n }\n ]\n ...\n ```\n - **two `SAQUE` elements**\n ```\n ...\n \"componentesValor\": [\n {\n \"tipo\": \"SAQUE\",\n \"valor\": \"20.00\"\n },\n {\n \"tipo\": \"SAQUE\",\n \"valor\": \"10.00\"\n }\n ]\n ...\n ```\n - **Immediate collection with `SAQUE` and `TROCO`**\n ```\n ...\n \"componentesValor\": [\n {\n \"tipo\": \"ORIGINAL\",\n \"valor\": \"60.00\"\n },\n {\n \"tipo\": \"SAQUE\",\n \"valor\": \"20.00\"\n },\n {\n \"tipo\": \"TROCO\",\n \"valor\": \"20.00\"\n }\n ]\n ...\n ```"
          anyOf:
          - $ref: '#/components/schemas/PixValorOriginal'
          - $ref: '#/components/schemas/PixValorSaque_2'
          - $ref: '#/components/schemas/PixValorTroco_2'
          - $ref: '#/components/schemas/PixValorJuros'
          - $ref: '#/components/schemas/PixValorMulta'
          - $ref: '#/components/schemas/PixValorAbatimento'
          - $ref: '#/components/schemas/PixValorDesconto'
        chave:
          type: string
          title: Chave DICT do recebedor
          description: '# Creditor DICT alias


            * Creditor alias field as assigned in the respective PACS008.

            * Aliases types can be: phone, email, cpf/cnpj or EVP.

            * The format of the aliases can be found in the section "Formatting DICT aliases in BR Code" of the [Pix Initiation Standards Manual](https://www.bcb.gov.br/estabilidadefinanceira/pix).

            '
          maxLength: 77
        horario:
          type: string
          format: date-time
          title: Horário
          description: Time the Pix was processed on the PSP.
        infoPagador:
          type: string
          title: Informação livre do pagador
          maxLength: 140
        devolucoes:
          type: array
          title: Devoluções
          items:
            $ref: '#/components/schemas/Devolucao_2'
    CobExpiracao:
      type: object
      title: Expiração"
      properties:
        expiracao:
          type: integer
          format: int32
          title: Tempo de vida da cobrança, especificado em segundos.
          description: 'Collection item lifetime, specified in seconds from the creation date (Calendario.criacao)

            '
          example: '3600'
          default: 86400
    DevolucaoId_2:
      type: string
      title: Id da location
      description: Location identifier to be informed in the collection item creation.
      pattern: '[a-zA-Z0-9]{1,35}'
    ParametrosConsultaCob_2:
      type: object
      title: Parâmetros de Consulta de Cobrança
      description: '[DEPRECATED] Parameters used to carry out collection items query.'
      required:
      - inicio
      - fim
      - paginacao
      properties:
        inicio:
          type: string
          format: date-time
          title: Data de Início
          description: Starting date used in the query. Complies with RFC 3339.
          example: '2020-04-01T00:00:00Z'
        fim:
          type: string
          format: date-time
          title: Data de Fim
          description: End date used in the query. Complies with RFC 3339.
          example: '2020-04-01T17:00:00Z'
        cpf:
          type: string
          title: CPF
          pattern: /^\d{11}$/
          description: Filter by the CPF of the debtor. It cannot be used at the same time as the CNPJ.
        cnpj:
          type: string
          title: CNPJ
          pattern: /^\d{14}$/
          description: Filter by the debtor's CNPJ. It cannot be used at the same time as the CPF.
        locationPresente:
          type: boolean
          description: Filter by the existence of linked location.
        status:
          type: string
          title: Status do registro da cobrança
          description: Filter by collection item status.
        paginacao:
          $ref: '#/components/schemas/Paginacao'
