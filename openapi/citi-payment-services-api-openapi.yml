        This should increase whenever a collection item is updated. The `loc` field change is not considered an update and therefore does not trigger an increment to the version number.

        The `loc` field does not change the collection itself. It is not necessary to store the history of changes in the `loc` field for a given collection. For the other fields of the collection, history is recorded.'
