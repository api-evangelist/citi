    get:
      tags:
      - Payment-Acceptance
      summary: Get Transaction Details
      description: Receive transaction status of the transaction for last 90 days using transaction ID provided during transaction creation or transaction end-to-end-id received in incoming credit notification.
      operationId: getpaymentstatus
      parameters:
      - $ref: '#/components/parameters/Client-Id'
      - $ref: '#/components/parameters/Get-Payment-End-To-End-Id'
      - $ref: '#/components/parameters/Type'
      - $ref: '#/components/parameters/Post-Country-Code'
      security:
      - clientCredentials: []
      responses:
        '200':
          description: Payment status
          headers:
            apim-guid:
              schema:
                type: string
              description: Citi's unique identification for your request
            result:
              schema:
                type: integer
                minimum: 1
                maximum: 1000
                default: 100
              description: Number of transaction status matching your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments-Response'
              examples:
                Brazil-Qr-Created-Status:
                  $ref: '#/components/examples/Qr-Created-Status'
                Brazil-Qr-Pending-Status:
                  $ref: '#/components/examples/Qr-Pending-Status'
