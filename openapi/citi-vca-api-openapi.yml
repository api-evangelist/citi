              schema:
                type: string
            messageId:
              description: Unique ID of the API message sent. The messageId will be provided back in the corresponding response. The ID can be used for investigation and troubleshooting. The ID must be unique per integration.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVirtualCardFailureResponse'
        '500':
          description: Internal Server Error
          headers:
            api-transactionId:
              description: Citi commercial cards API tracking ID.
              schema:
                type: string
            messageId:
              description: Unique ID of the API message sent. The messageId will be provided back in the corresponding response. The ID can be used for investigation and troubleshooting. The ID must be unique per integration.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVirtualCardFailureResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualCardRequest'
        required: true
      tags:
      - Vca
      security:
      - clientCredentials: []
    servers:
