  schemas:
    Initial-Beneficiary-Validation-Response:
      xml:
        name: InitialBeneficiaryValidationResponse
      type: object
      title: InitialBeneficiaryValidationResponse
      properties:
        end_to_end_id:
          xml:
            name: EndToEndId
          type: string
          description: "Client provided reference number. \n - For India IMPS and UPI, this field is mandatory and max length is 16 \n - For US EWS,this field is not applicable \n - For UK,this field is not applicable \n - For IN PAN,this field is not applicable \n- For Pay2China, this field is not applicable"
          minLength: 1
          maxLength: 35
          title: end_to_end_id
        uetr:
          xml:
            name: Uetr
          type: string
          pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          description: UUID v4 format unique end-to-end transaction reference
          title: uetr
        debtor:
          xml:
            name: Debtor
          type: object
          title: debtor
          properties:
            account:
              xml:
                name: Account
              type: string
              description: "Bank account held with CITI \n - For India IMPS and UPI , this field is mandatory and max length is 34 \n - For US EWS, this field is mandatory and max length is 40 \n - For UK, this field is mandatory and max length is 40 \n - For IN PAN, this field is mandatory and max length is 40 \n - For Pay2China, this field is mandatory and max length is 40"
              minLength: 1
              maxLength: 40
              title: account
            name:
              xml:
                name: Name
              type: string
              description: "Debtor Account Name.\n - For India IMPS and UPI ,this field is mandatory and max length is 99 \n - For US EWS,this field is optional and max length is 140 \n - For UK,this field is optional and max length is 140 \n - For IN PAN,this field is optional and max length is 140 \n - For Pay2China, this field is optional and max length is 140"
              minLength: 1
              maxLength: 140
              title: name
            proxy_id:
              xml:
                name: ProxyId
              type: string
              description: "Remitter Proxy ID.\n - For India,this field is mandatory for UPI only and max length is 255 \n - For US EWS,this field is not applicable \n - For UK,this field is not applicable \n - For IN PAN,this field is not applicable \n - For Pay2China, this field is not applicable"
              minLength: 1
              maxLength: 255
              title: proxy_id
            ultimate_debtor:
              xml:
                name: UltimateDebtor
              type: object
              title: ultimate_debtor
              properties:
                name:
                  xml:
                    name: Name
                  type: string
                  description: "Ultimate debtor name. \n - For IMPS India,this field is not applicable \n - For UPI India,this field is not applicable \n - For US EWS,this field is not applicable \n - For UK,this field is not applicable \n - For Pay2China, this field is optional and the max length is 140"
                  minLength: 1
                  maxLength: 140
                  title: ultimate_debtor_name
                account:
                  xml:
                    name: Account
                  type: string
                  description: "Beneficiary Owner Id/Legal Rep id. \n - For IMPS India,this field is not applicable \n - For UPI India,this field is not applicable \n - For US EWS,this field is not applicable \n - For UK,this field is not applicable \n - For IN PAN,this field is not applicable \n - For Pay2China, this field is mandatory and the max length is 35"
                  minLength: 1
                  maxLength: 35
                  title: ultimate_debtor_account
          required:
          - account
        creditor:
          xml:
            name: Creditor
          type: object
          title: creditor
          properties:
            id:
              xml:
                name: Id
              type: string
              description: "Creditor Id. \n - For IMPS India,this field is not applicable \n - For UPI India, this field is not applicable \n - For US EWS,this field is not applicable \n - For UK,this field is not applicable \n - For IN PAN,this field is not applicable. \n - For Pay2China, this field is merchant ID. It is mandatory and the max length is 32"
              minLength: 1
              maxLength: 35
              title: id
            account:
              xml:
                name: Account
              type: string
              description: "Creditor Account Number. \n - For IMPS India,this field is mandatory and max length is 34 \n - For UPI India, this field is optional and length should be 34 \n - For US EWS,this field is conditional and max length is 17.Either creditor.account or creditor.proxy_id or creditor.wallet or creditor.IBAN should be passed by client \n - For UK,this field is conditional and max length is 17.Either creditor.account or creditor.proxy_id or creditor.wallet or creditor.IBAN should be passed by client \n - For IN PAN,this field is not applicable \n - For Pay2China, this field is optional and max length is 32"
              minLength: 1
              maxLength: 40
              title: account
            name:
              xml:
                name: Name
              type: string
              description: "Creditor Account Name.\n - For India IMPS and UPI,this field is optional and max length is 99 \n - For US EWS,this field is mandatory and max length is 87. Please provide first middle(if any) last name in this sequence with spaces \n - For UK,this field is mandatory and max length is 87. Please provide first middle(if any) last name in this sequence with spaces \n - For IN PAN,this field is mandatory and max length is 85. Please provide first middle(if any) last name in this sequence with spaces \n - For Pay2China, this field is merchant name. It is a conditional field. It is mandatory for first time onboarding and max length is 128"
              minLength: 1
              maxLength: 140
              title: name
            father_name:
              xml:
                name: FatherName
              type: string
              description: "Creditor' Father's Name.\n - For India IMPS and UPI,this field is not applicable \n - For US EWS,this field is not applicable \n - For UK,this field is not applicable \n - For IN PAN,this field is optional and max length is 75. Please provide first middle(if any) last name in this sequence with spaces \n - For Pay2China,this field is not applicable"
              minLength: 1
              maxLength: 140
              title: father_name
            bank_id:
              xml:
                name: BankId
              type: string
              description: "Receiving Financial Institution BIC.\n - For IMPS India,this field is mandatory and length should be 11 \n - For UPI India,this field is optional and length should be 11 \n - For US EWS,this field is mandatory and length should be 9 if routing/clearing code is populated \n - For UK,this field is mandatory and length should be 8 or 11 character if bic (including branch code) is sent \n - For IN PAN,this field is not applicable \n - For Pay2China, this field is optional and max length is 64"
              minLength: 1
              maxLength: 35
              title: bank_id
            bank_name:
              xml:
                name: BankName
              type: string
              description: "Receiving Financial Institution Name. \n - For IMPS India,this field is not applicable \n - For UPI India,this field is not applicable \n - For US EWS,this field is not applicable \n - For UK,this field is not applicable \n - For IN PAN,this field is not applicable \n - For Pay2China, this is an optional field and max length is 128"
              minLength: 1
              maxLength: 140
              title: bank_name
            proxy_id:
              xml:
                name: ProxyId
              type: string
              description: "Creditor Proxy ID \n - For India,this field is mandatory for UPI only and max length is 255 (UPI ID or Mobile number can be passed).If mobile number is passed it should be greater than or equal to 6 and less than or equal to 16 \n - For US EWS,this field is conditional and max length is 17.Either creditor.account or creditor.proxy_id or creditor.wallet or creditor.IBAN should be passed by client \n - For UK,this field is conditional and max length is 17.Either creditor.account or creditor.proxy_id or creditor.wallet or creditor.IBAN should be passed by client\n - For IN PAN,this field is not applicable  \n - For IN Pay2China,this field is not applicable"
              minLength: 1
              maxLength: 255
              title: proxy_id
            proxy_type:
              xml:
                name: ProxyType
