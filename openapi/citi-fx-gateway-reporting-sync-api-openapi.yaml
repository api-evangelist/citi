    FXBenchMarkOrder_Rated:
      description: >-
        If the current status of the deal is COMPLETED, below fields will be
        sent. In case of multiple orders, multiple dealResponses JSON objects
        will be present in the dealResponses JSON array. Response array can be
        of both Ack / Nack.
      required:
        - action
        - jsonReqId
        - senderCompId
        - onBehalfOfCompId
        - sendingTime
        - dealResponses
      properties:
        action:
          type: string
          example: enquiry-response
          description: 'Allowed Value: enquiry-response'
        jsonReqId:
          type: string
          example: Req20181011776
          description: The unique identifier for the JSON request. Format is alphanumeric.
          maxLength: 60
        senderCompId:
          type: string
          description: >-
            The Citi-assigned value used to identify the message sender. This
            was assigned to you during onboarding.
          example: ClientName
        onBehalfOfCompId:
          type: string
          description: >-
            The Citi-assigned value used to identify the sub-entity. This was
            assigned to you during onboarding.
          example: Sub Entity
        sendingTime:
          type: string
          description: >-
            The time of message transmission. Always expressed in UTC (Universal
            Time Coordinated, also known as 'GMT.' Format is
            YYYYMMDD-HH:MM:SS.mmm.
          example: 20180820-04:48:29.125
        deals:
          type: array
          items:
            required:
              - account
              - clOrdId
              - valueDate
              - tradeDate
              - ccyPair
              - dealtCcy
              - orderQty
              - side
              - fixingCode
              - transactTime
              - execId
              - avgPx
              - orderId
              - orderStatus
              - lastQty
              - contAmtValue
              - lastPx
              - lastSpotRate
              - lastForwardPoints
              - purposeCode
            properties:
              account:
                type: string
                description: Your Citi-assigned client identifier.
                example: 109430258
              clOrdId:
                type: string
                description: The order reference you assigned.
                example: TEST12345
              side:
                type: string
                enum:
                  - B
                  - S
                description: >-
                  Indicates whether you are buying (B) or selling (S) the dealt
                  ccy.
              valueDate:
                type: string
                description: Populated for a Rated deal.
                example: 20240502
              tradeDate:
                type: string
                description: Populated for a Rated deal.
                example: 20240429
              purposeCode:
                type: string
                description: >-
                  Populates the same value sent in incoming request when else
                  sent is null.
              ccyPair:
                type: string
                description: The currency pair that you are trading on. CCY1CCY2.
                maxLength: 6
                example: GBPUSD
              dealtCcy:
                type: string
                description: The currency for which you supplied the dealt amount.
                maxLength: 3
                example: GBP
              fixingCode:
                type: string
                description: Fixing code when sending the deal.
                example: QOUTED or LDN1500BFIX
              transactTime:
                type: string
                description: >-
                  Time the transaction represented by this single order
                  occurred.
                example: Mon Apr 29 12:50:33 IST 2024
              execId:
                type: string
                description: Unique identifier of execution message.
                example: Alphanumeric & special character hyphen (-)
              avgPx:
                type: number
                description: Calculated average price of all fills on this order.
                example: 0
              orderId:
                type: number
                description: >-
                  Citi-assigned order ID. This will be the same value as sent in
                  orderId field of Acknowledged and Accepted deal.
                example: 3714864
              orderStatus:
                type: string
                example: COMPLETED
                description: The current status of the deal. Allowed value = COMPLETED.
              contAmtValue:
                type: number
                description: The counter amount, i.e., non-dealt amount
                example: 54321.21
              lastPx:
                type: number
                description: Outright Rate
                example: 1.51446
              lastQty:
                type: number
                description: Dealt Amount
                example: 12345.56
              lastSpotRate:
                type: number
                description: Spot Rate
                example: 1.5144
              lastForwardPoints:
                type: number
                description: Forward Points
                example: 0
              lastForwardPoints2:
                type: number
                description: Far Forward Points. Applicable for SWAP orders only.
                example: 0.000006
              valueDate2:
                type: string
                description: Far Leg Value Date. Applicable for SWAP orders only
                example: 20250525
              orderQty2:
                type: number
                description: Far Leg Amount. Applicable for SWAP orders only
                example: 1000
              settlCurrAmt:
                type: number
                description: Far Counter Amount. Applicable for SWAP orders only
                example: 54321.21
              securityId:
                type: string
                description: MIFID Field. ISIN Code for the FX Security
              securityIdSource:
                type: string
                description: 'MIFID Field. Allowed Values: 4 = ISIN'
              legSecurityId:
                type: string
                description: MIFID Field. For SWAP Deals only
              legSecurityIdSource:
                type: string
                description: MIFID Field. For SWAP Deals only
              lastCapacity:
                type: string
                description: 'MIFID Field. Allowed Values: 4 = Principal'
              tradeReportingIndicator:
                type: string
                description: MIFID Field
              matchType:
                type: string
                description: MIFID Field
      example:
        senderCompId: TESTCLIENT2
        onBehalfOfCompId: TCL2R
        action: enquiry-response
        jsonReqId: 56ae4527
        sendingTime: 20240429-07:20:36.683
        senderSubId: System
        dealResponses:
          - account: LDN|xxxxxxxxxx
            clOrdId: TESTCL01
