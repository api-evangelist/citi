          example: A92145408
        WITH_RATE:
          type: number
          format: double
          description: WHT Rate is the rate of withholding tax applied to the income payment.
          example: 15.286
        CREATION_DATE:
          type: string
          format: date
          description: Input Date is the date when the reclaim was loaded to Citi's reclaim system.
          example: '2024-01-20'
        ALLOCATED_HOLDING:
          type: number
          format: double
          description: Holding Value is the number of reclaimable shares per reclaim.
          example: 500
        BO_DOMICILE:
