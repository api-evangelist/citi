          maxLength: 250
          minLength: 1
          type: string
          title: reference
        currency_code:
          description: "ISO 4217 Currency Code for instance  USD/GBP/EUR/INR \n- For Brazil PIX, India UPI, UK FPS and Card refund payment, transaction.currency_code parameter is mandatory."
          enum:
          - BRL
          - USD
          - INR
          - GBP
          - EUR
          - CAD
          - HKD
          - AUD
          - SGD
          - DKK
          - NOK
          - SEK
          - PLN
          - IDR
          - MYR
          - THB
          - CHF
          - PHP
          - CZK
