      description: >-
        Rolled Forward indicator parameter is used to flag if position valuation
        has been rolled forward from last close of business.
      in: query
      required: false
      schema:
        type: string
    parameter-18832:
      name: TRANS_REF_NBR
      description: >-
        Custodian Reference is the unique reference assigned by the custodian to
        the record. The reference number is unique within a branch.
      in: query
      required: false
      schema:
        type: string
    parameter-18833:
      name: IOD_TIMESTAMP
      description: Provides the Timestamp when data is loaded in the Data Lake
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-42407:
      name: HEAD_ACCOUNT
      description: SCAR Head Account Number
      in: query
      required: false
      schema:
        type: string
    parameter-13535:
      name: ACCT_BASE_NBR
      description: >-
        Account Base Number is an internal Citi client identifier that is
        associated to a safekeeping or cash account.
      in: query
      required: false
      schema:
        type: string
    parameter-13562:
      name: ACCT_BUS_TYP_CD
      description: >-
        Account Type Code indicates the type of the account. Values are:<br> C
        (cash account)<br> S (Safekeeping Account).
      in: query
      required: false
      schema:
        type: string
    parameter-13536:
      name: ACCT_BUS_TYP_NME
      description: >-
        Account type description indicates the type of the account. Values
        are:<br> CASH (C)<br> S/K (S)
      in: query
      required: false
      schema:
        type: string
    parameter-28702:
      name: ACCT_ID
      description: >-
        Account ID is an identifier for both a cash account and/or a safekeeping
        account that is unique within a branch.
      in: query
      required: false
      schema:
        type: string
    parameter-13553:
      name: ACCT_NME
      description: >-
        Account Name is the name that is assigned to the cash account and/or the
        safekeeping account. If an alternate account name has been specified for
        an account it will be displayed as the Account Name.
      in: query
      required: false
      schema:
        type: string
    parameter-13574:
      name: ACCT_STS_TYP
      description: >-
        Account status provides the current status of the cash account and/or
        the safekeeping account.  Values are:<br> Open<br> Closed<br> Frozen
      in: query
      required: false
      schema:
        type: string
    parameter-13539:
      name: ALTV_CUR_CD
      description: Account Base Currency Code is the ISO Currency Code for the account.
      in: query
      required: false
      schema:
        type: string
    parameter-28709:
      name: ASOF_TMS
      description: The As Of Date is the date of the information being reported.
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-28696:
      name: AVAL_BAL
      description: >-
        Available Balance is the cash account balance for  all posted
        transactions, except for future value dated transactions.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-28699:
      name: BAL_STS_TYP
      description: >-
        Cash Balance Type will be Posted for all cash accounts except for US
        Direct cash accounts where the balance type can be either Posted or
        Sweep.
      in: query
      required: false
      schema:
        type: string
    parameter-28700:
      name: BR_ID
      description: >-
        Branch Code is the identifier of the branch for the account.  For the
        cash account the branch code is a numeric value and for the safekeeping
        account it is the ISO Country code.
      in: query
      required: false
      schema:
        type: string
    parameter-13554:
      name: BR_NME
      description: >-
        Branch Name is the name of the branch for the cash account and/or
        safekeeping account.
      in: query
      required: false
      schema:
        type: string
    parameter-13572:
      name: CASH_TYPE
      description: >-
        Cash Type Code pertains to US Direct cash accounts and indicates whether
        the cash account has a split income and principal balance.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-28711:
      name: COB_DATE
      description: Close of Business Date
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-28701:
      name: EOD_INTRA_IND
      description: >-
        EOD/intraday Indicator advises if the information is as of end-of-day or
        as of Intraday.  Values are:<br>- 1 (Intraday)<br>- 2 (End of Day)
      in: query
      required: false
      schema:
        type: string
    parameter-13544:
      name: GFC_ID
      description: >-
        Client ID is an identifier that is available on a cash account and/or a
        safekeeping account. This Client ID is referred to, internally at Citi,
        as a GFCID.
      in: query
      required: false
      schema:
        type: string
    parameter-28710:
      name: IOD_UPDATE_TMS
      description: IOD Timestamp
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-28704:
      name: LCL_CUR_CD
      description: Currency code is the ISO currency code for the amount.
      in: query
      required: false
      schema:
        type: string
    parameter-28694:
      name: LED_BAL
      description: >-
        Ledger Balance is the balance for the cash account that includes all
        posted transactions including future value dated transactions.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-28707:
      name: LST_ENTRY_TMS
      description: >-
        Balance change date displays the date of the last change to the balance
        based on transactions that have been posted to the cash account.
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-28708:
      name: LST_UPD_TMS
      description: >-
        Balance Update Timestamp displays the date/time of the last update to
        the balance due to transactions that have posted to the cash account
        (Intraday) or due to reporting database updates (end-of-day).
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-28693:
      name: OPNG_BAL
      description: >-
        Opening balance is the opening ledger balance (previous days closing
        balance) for the cash account.  Ledger Balance includes all posted
        transactions including future value dated transactions.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-28705:
      name: PRNCPL_INC_IND
      description: >-
        Principal / Income Indicator advises if the balance is for principal or
        income.  Values include:<br> P (Principal) <br> I (Income)
      in: query
      required: false
      schema:
        type: string
    parameter-28698:
      name: TRANS_REF_NBR
      description: >-
        Custodian Reference is the unique reference assigned by the custodian to
        the record. The reference number is unique within a branch.
      in: query
      required: false
      schema:
        type: string
