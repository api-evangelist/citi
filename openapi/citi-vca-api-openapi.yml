      - name: Content-Type
        in: header
        description: Supports application/json
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: The OAuth Token prefixed with "Bearer" and space in between.
        required: true
        schema:
          type: string
      - name: Country
        in: header
        description: Three-character length country code used during onboarding into Citi.
        required: true
        schema:
          type: string
      - name: Region
        in: header
        description: This value will be used by APIm to route to the respective Citi backend instance.
        required: true
        schema:
          type: string
      requestBody:
        description: GenerateIdProvisioningRequest
        required: true
        content:
          application/json:
            schema:
