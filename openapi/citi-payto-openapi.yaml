          description: >-
            Specify the regularity of an event.<br>ADHO = Ad hoc (Event takes
            place on request or as necessary)<br>DAIL = Daily (Event takes place
            every day)<br>FRTN = Fortnightly (Event takes place every two
            weeks)<br>INDA = Intraday (Event takes place several times a
            day)<br>MIAN = Semiannual (Event takes place every six months or two
            times a year)<br>MNTH = Monthly (Event takes place every
            month)<br>QURT = Quarterly (Event takes place every three
            months)<br>WEEK = Weekly (Event takes place once a week)<br>YEAR =
            Annual (Event takes place every year or once a year)
          example: MNTH
        count_per_period:
          title: count_per_period
          type: string
          pattern: ^(?=.{1,19}$)[0-9]{0,19}(?:\.[0-9]{0,18})?$
          description: >-
            Specify the frequency in terms of the number of instructions to be
            created and processed during the specified period. count_per_period
            (or) point_in_time is a mandatory parameter for Australia.
          example: '124334143234.34232'
        point_in_time:
          title: point_in_time
          type: string
          pattern: ^[0-9]{2}$
          description: >-
            Specify the frequency in terms of an exact point in time or moment
            within the specified period.
          example: '02'
        tracking_indicator:
          title: tracking_indicator
          type: boolean
          description: >-
            Specify the indicating value either True or False, whether the
            direct debit instructions should be automatically re-submitted
            periodically when bilaterally agreed.
          example: false
        mandate_additional_information:
          title: mandate_additional_information
          type: string
          minLength: 1
          maxLength: 140
          description: >-
            Specify the additional information in free text form to complement
            the mandate information. This parameter is specific to Australia.
            Both mandate_description and mandate_additional_information
            parameters are expected to be sent by client for Australia. This
            parameter is eligible for amendment unilaterally.
