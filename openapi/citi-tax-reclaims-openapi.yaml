      description: >-
        Factor Date is the date the current factor is applicable from for
        principal paying securities.
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-15014:
      name: INCM_CUR_CD
      description: >-
        Income Currency Code is the ISO currency code in which income payments
        will be made for the security in the local market.
      in: query
      required: false
      schema:
        type: string
    parameter-15015:
      name: INCM_CUR_NME
      description: >-
        Income Currency Name is the name of the currency in which income
        payments will be made for the security in the local market.
      in: query
      required: false
      schema:
        type: string
    parameter-15016:
      name: INCM_PROJN_RATE
      description: Interest Rate is the coupon rate of the security.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-15017:
      name: ISS_CAT_NME
      description: >-
        Issue Category is the description for the Issue Category Code.  Values
        include:  Common Stock (CSTK), Derivatives (DERIV), Mortgage Backed
        Securities (MBS), etc.
      in: query
      required: false
      schema:
        type: string
    parameter-15018:
      name: ISS_CATG_CD
      description: >-
        Issue Category Code is a specific category for the security.  Values
        include: CSTK (Common Stock), DERIV (Derivatives), MBS (Mortgage Backed
        Securities), etc.
      in: query
      required: false
      schema:
        type: string
    parameter-15019:
      name: ISS_TMS
      description: Issue Date is the date of first issue of the security.
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-15020:
      name: ISSR_LOC_CD
      description: >-
        Issuer Location Code is the ISO country code where the issuer of the
        security is based.  Values include: AR (Argentina), CA (Canada), IE
        (Ireland), etc.
      in: query
      required: false
      schema:
        type: string
    parameter-15021:
      name: ISSR_LOC_NME
      description: >-
        Issuer Location is the name of the country where the issuer of the
        security is based.  Values include: Argentina (AR), Canada (CA), Ireland
        (IE), etc.
      in: query
      required: false
      schema:
        type: string
    parameter-15022:
      name: MATY_DT
      description: >-
        Maturity Date is the date of maturity or redemption for fixed income
        securities.
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-15023:
      name: NXT_PAY_DT
      description: >-
        Next Payable Date is the next date on which a dividend or interest
        payment is scheduled to be paid.
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-15024:
      name: PFD_ID_CTXT_CD
      description: >-
        Security ID Type indicates the type of identifier of the corresponding
        Security ID field. Values include: CUSIP, ISIN, SEDOL, LOCAL, etc.
      in: query
      required: false
      schema:
        type: string
    parameter-15025:
      name: PFD_ISS_ID
      description: >-
        Security ID is the most commonly used identifier for the security in a
        given market.
      in: query
      required: false
      schema:
        type: string
    parameter-15026:
      name: PMT_FREQY_DESC
      description: >-
        Payment Frequency Description indicates how often interest is paid on
        the security.  Values include: Annual (00001),  Sem-Annual (00002), One
        Payment Per Year (00035), etc.
      in: query
      required: false
      schema:
        type: string
    parameter-15027:
      name: POOL_ID_CD
      description: >-
        Pool ID is an alphanumeric code that identifies a particular mortgage
        backed security.
      in: query
      required: false
      schema:
        type: string
    parameter-15028:
      name: PREV_FCTR_RATE
      description: >-
        Previous Factor is the factor which applies to the last accrual period
        to determine payments and balances for principal paying securities.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-15029:
      name: SEC_GROUP
      description: >-
        Asset Type is a code representing the Asset Type of the security. 
        Values include: EQTY (Equity), FI (Fixed Income), etc.
      in: query
      required: false
      schema:
        type: string
    parameter-15030:
      name: SEC_SUB_TYP_CD
      description: >-
        Issue Type Code is a code linked to the Issue Type field which describes
        the type of security instrument. Values include: 1 (ADR Convertible), 12
        (Bond), 19 (Bond Convertible), etc.
      in: query
      required: false
      schema:
        type: string
    parameter-15031:
      name: SEC_SUB_TYP_NME
      description: >-
        Issue Type is a description of the type of the security instrument. 
        Values include: ADR Convertible (1), Bond (12) , Bond Convertible (19),
        etc.
      in: query
      required: false
      schema:
        type: string
    parameter-15032:
      name: STRK_PRC_AMT
      description: >-
        Strike Price is the specified price on an options contract at which the
        contract may be exercised.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-15033:
      name: US_SIC_CD
      description: SIC is the Standard Industrial Classification four-digit numeric code.
      in: query
      required: false
      schema:
        type: string
    parameter-15088:
      name: PAYABLE_DATE
      description: >-
        Payable Date is the date on which a dividend or interest payment is
        scheduled to be paid.
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-31457:
      name: UID
      description: >-
        Indicates whether or not the record was inserted, updated or deleted in
        Custody Reporting.
      in: query
      required: false
      schema:
        type: string
  securitySchemes:
