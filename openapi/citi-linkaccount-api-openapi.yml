      title: StatusDetails
      description: Status Details.
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Status'
        message:
          $ref: '#/components/schemas/Message'
    Country-Code:
      type: string
      title: country_code
      pattern: ^[A-Z]{2,2}$
      description: Country code.
      example: CN
    Partner-User-Id:
      type: string
      description: Partner user identifier for seller from your system.
      title: partner_user_id
      minLength: 1
      maxLength: 50
      example: '1323436'
    Gateway-Error-Response:
      type: object
      title: GatewayErrorResponse
      required:
      - httpCode
      - httpMessage
      - moreInformation
      properties:
        httpCode:
          type: string
          maxLength: 3
          description: Numeric HTTP Staus code
          title: httpCode
        httpMessage:
          type: string
          maxLength: 128
          description: HTTP error message
          title: httpMessage
          example: Bad Request
        moreInformation:
          type: string
          maxLength: 128
          description: HTTP error message
          title: moreInformation
          example: please provide valid value for request
    Get-Link-Account-Response:
      title: GetLinkAccountResponse
      description: Response body containing linked account details.
      type: array
      items:
        $ref: '#/components/schemas/Creditor-Detail'
    File-Id:
      type: string
      description: Unique identifier for the document uploaded.
      title: file_id
      minLength: 1
      maxLength: 128
      example: '112213'
    Creditor-Account-Details:
      title: CreditorAccountDetails
      type: object
      description: This section contains the details information of account.
      properties:
        holder_type:
          type: string
          title: holder_type
          description: The type of account holder.
          enum:
          - PERSONAL
          - COMPANY
          example: PERSONAL
        holder_contact_number:
          type: string
          title: holder_contact_number
          description: The full contact number, including the country code if mobile.
          minLength: 1
          maxLength: 32
          example: 007 3700 7457
        number:
          type: string
          title: number
          description: Unique account number.
          minLength: 1
          maxLength: 64
          example: '703912345678'
        name:
          allOf:
          - $ref: '#/components/schemas/Name'
          - description: Name of the account.
            example: SHASHANK VIJAYSHANKAR TIWARI
        currency_code:
          allOf:
          - $ref: '#/components/schemas/Currency-Code'
          title: currency_code
          description: Currency of the account (3-character ISO code).
          example: INR
        iban:
          type: string
          title: iban
          description: International Bank Account Number (IBAN). IBAN is not applicable for CN and HK.
          minLength: 1
          maxLength: 32
          example: HU58711204120061837086422231
        document_type:
          type: string
          title: document_type
          description: Type of identity document (ID). One of the following 00 Chinese national ID card 01 Chinese residence permit 02 Passport 03 ID card of Hong Kong, Macao or Taiwan 04 Residence permit of Hong Kong, Macao and Taiwan 05 Hong Kong and Macao travel permit 06 Other national ID card 07 Other residence permit
          enum:
          - CHINESE_NATIONAL_ID_CARD
          - CHINESE_RESIDENCE_PERMIT
          - PASSPORT
          - ID_CARD_OF_HONGKONG_MACAO_OR_TAIWAN
          - RESIDENCE_PERMIT_OF_HONGKONG_MACAO_AND_TAIWAN
          - HONGKONG_AND_MACAO_TRAVEL_PERMIT
          - OTHER_NATIONAL_ID_CARD
          - OTHER_RESIDENCE_PERMIT
          example: CHINESE_RESIDENCE_PERMIT
        document_number:
          type: string
          title: document_number
          description: Account holder's ID number.
          minLength: 1
          maxLength: 64
          example: CS8899966
    Merchant-Id:
      type: string
      description: Unique identifier generated by Citi for each seller. Seller to use this id for the further functional calls.
      title: merchant_id
      minLength: 1
      maxLength: 36
      example: ec689822-9864-4c4d-9d68-222467627901
    Webhook-Link-Account:
      title: WebhookLinkAccount
      description: Notification for Link account for the status update.
      allOf:
      - $ref: '#/components/schemas/Common-Error-Response'
      - type: object
        title: Webhook-Link-Account
        properties:
          creditor_id:
            $ref: '#/components/schemas/Creditor-Id'
    Get-Creditor-Account:
      title: GetCreditorAccount
      description: This section contains the details information of bank.
      allOf:
      - $ref: '#/components/schemas/Creditor-Account-Details'
      - type: object
        title: Get-Creditor-Account
        properties:
          type:
            type: string
            title: type
            description: Type of the bank.
            minLength: 1
            maxLength: 64
            example: CHECKING
    Name:
      type: string
      title: name
      minLength: 1
      maxLength: 128
      example: SHASHANK VIJAYSHANKAR TIWARI
    Creditor:
      title: Creditor
      description: This section contains the details information of creditor.
      allOf:
      - $ref: '#/components/schemas/Common-Creditor'
      - type: object
        title: Common-Creditor
        required:
        - type
        - name
        - address
        properties:
          creditor_partner_user_id:
            $ref: '#/components/schemas/Partner-User-Id'
          address:
            $ref: '#/components/schemas/Creditor-Address'
    Creditor-Account:
      title: CreditorAccount
      description: Creditor Account.
      allOf:
      - $ref: '#/components/schemas/Creditor-Account-Details'
      - type: object
        title: Creditor-Account'
        required:
        - holder_type
        - number
        - name
        - currency_code
    Get-Creditor:
      title: GetCreditor
      description: This section contains the details information of creditor.
      allOf:
      - $ref: '#/components/schemas/Common-Creditor'
      - type: object
        title: Get-Creditor
        properties:
          address:
            $ref: '#/components/schemas/Creditor-Address-Details'
    Created-Time:
      type: string
      format: date-time
      description: Date and time of the file created. Pattern YYYY-MM-DDTHH:mm:ssZ
      title: created_time
      example: '2026-01-06T10:56:25Z'
    Creditor-Id:
      type: string
      title: creditor_id
      description: The unique creditor identifier assigned by payment service provider.
      minLength: 1
      maxLength: 36
      example: R202501080950209789
    Creditor-Detail:
      title: CreditorDetail
      type: object
      description: Response body containing creditor's details.
      properties:
        creditor_id:
          $ref: '#/components/schemas/Creditor-Id'
        status:
          allOf:
          - $ref: '#/components/schemas/Status'
          title: status
          description: The status of creditor validation. PENDING; AVAILABLE; DECLINED
        message:
          $ref: '#/components/schemas/Message'
        created_time:
          $ref: '#/components/schemas/Created-Time'
        creditor_account:
          $ref: '#/components/schemas/Get-Creditor-Account'
        creditor_bank:
          $ref: '#/components/schemas/Get-Creditor-Bank'
        creditor:
          $ref: '#/components/schemas/Get-Creditor'
        file_id:
          $ref: '#/components/schemas/File-Id'
    Message:
      type: string
      description: Description of the status.
      title: message
      minLength: 1
      maxLength: 500
      example: Request is in-progress
    Creditor-Bank:
      title: CreditorBank
      description: Creditor Bank.
      allOf:
      - $ref: '#/components/schemas/Creditor-Bank-Details'
      - type: object
        title: Creditor-Bank
        required:
        - name
        - address
        properties:
          address:
            $ref: '#/components/schemas/Address'
    Link-Account-Request:
      title: LinkAccountRequest
      type: object
      description: Request body for linking an external account for payments.
      required:
      - creditor_account
      - creditor_bank
      - creditor
      properties:
        creditor_account:
          $ref: '#/components/schemas/Creditor-Account'
        creditor_bank:
          $ref: '#/components/schemas/Creditor-Bank'
        creditor:
          $ref: '#/components/schemas/Creditor'
        file_id:
          $ref: '#/components/schemas/File-Id'
    Service-Error-Response:
      title: ServiceErrorResponse
      type: object
      required:
      - ref_id
      - error_details
      properties:
        ref_id:
          type: string
          maxLength: 120
          description: Unique ID for the Transaction
          title: ref_id
          example: 444d0f3f-4x55-7g99-8b2c-0cf2a921a5ab
        error_details:
          type: array
          description: List of error details
          title: error_details
          items:
            $ref: '#/components/schemas/Error-Detail'
    Error-Detail:
      type: object
      title: ErrorDetail
      properties:
        issue:
          type: string
          minLength: 1
          maxLength: 200
          description: more details about the issue
          title: issue
          example: property emailAddress is mandatory and it cannot be empty
        action:
          type: string
          maxLength: 350
          description: corrective action to be taken to resolve above issue
          title: action
          example: please provide valid value for property emailAddress
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: unique code representing the issue
          title: code
          example: VC00010
    Creditor-Bank-Details:
      title: CreditorBankDetails
      type: object
      description: This section contains the details information of bank.
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/Name'
          - description: Name of the bank.
            minLength: 1
            maxLength: 256
            example: BANK OF BARODA
        code:
          type: string
          title: code
          description: Bank code.
          minLength: 1
          maxLength: 32
          example: '6'
        branch_name:
          type: string
          title: branch_name
          description: Branch name where the account is held.
          minLength: 1
          maxLength: 128
          example: THANE BRANCH
        branch_number:
          type: string
          title: branch_number
          description: Branch code where the account is held.
          minLength: 1
          maxLength: 32
          example: '391'
        swift_code:
          type: string
          title: swift_code
          description: SWIFT BIC (Bank Identifier Code).
          minLength: 1
          maxLength: 64
          example: CITIINHFXXX
        routing_number:
          type: string
          title: routing_number
          description: Routing code.
          minLength: 1
          maxLength: 64
          example: '6391'
        ifsc_code:
          type: string
          title: ifsc_code
          description: Indian Financial System Code (IFSC).
          minLength: 1
          maxLength: 64
          example: HDFC0000001
        sort_code:
          type: string
          title: sort_code
          description: Sort code.
          minLength: 1
          maxLength: 32
          example: '87'
    Sync-Response:
      title: SyncResponse
      type: object
      description: Acknowledgement.
      properties:
        status_details:
          $ref: '#/components/schemas/Status-Details'
    Common-Error-Response:
      title: CommonErrorResponse
      description: Details of error in the request.
      type: object
      properties:
        merchant_id:
          $ref: '#/components/schemas/Merchant-Id'
        status:
          allOf:
          - $ref: '#/components/schemas/Status'
          description: Status description. <br> Certification Webhook - Allowed values are APPROVED, DECLINED, RFI_PENDING. <br> Wallet Activation Webhook - Allowed values are AVAILABLE - account is available to be used; DECLINED - account application rejected; SUSPENDED - account is frozen; CLOSED - account is no longer available. <br> Link Account Webhook - Allowed values are AVAILABLE and DECLINED <br> Payment Webhook - Allowed values are SUCCESS, REJECTED. <br> Inbound Webhook - Allowed values is SUCCESS. <br> Transaction Reporting - PENDING, SUCCESS, REJECTED.
        message:
          $ref: '#/components/schemas/Message'
    Address:
      title: Address
      description: Address/
      allOf:
      - $ref: '#/components/schemas/Address-Details'
      - type: object
        title: Address-Details
        required:
        - country_code
        - city
        - state
    Get-Creditor-Bank:
      title: GetCreditorBank
      description: This section contains the details information of bank.
      allOf:
      - $ref: '#/components/schemas/Creditor-Bank-Details'
      - type: object
        title: Get-Creditor-Bank
        properties:
          type:
            type: string
            title: type
            description: Type of the bank.
            minLength: 1
            maxLength: 64
            example: RECIPIENT BANK
          address:
            $ref: '#/components/schemas/Address-Details'
    Address-Details:
      title: AddressDetails
      type: object
      description: Address information for the bank.
      properties:
        city:
          type: string
          title: city
          description: City.
          minLength: 1
          maxLength: 128
          example: THANE
        state:
          type: string
          title: state
          description: State.
          minLength: 1
          maxLength: 128
          example: MAHARASHTRA
        country_code:
          allOf:
          - $ref: '#/components/schemas/Country-Code'
          title: country_code
          description: Country code.
        address_line:
          type: string
          title: address_line
          description: Detailed address of the bank.
          minLength: 1
          maxLength: 256
          example: SUMAN HEIGHTS LODHA HERITAGR NAVNEET NAGAR MAHARASHTRA THANE INDIA
    Creditor-Address-Details:
      title: CreditorAddressDetails
      description: Address information for the creditor.
      allOf:
      - $ref: '#/components/schemas/Address-Details'
      - $ref: '#/components/schemas/Partial-Address'
      - type: object
        title: Creditor-Address-Details
    Status:
      type: string
      description: Status of the request.
      title: status
      minLength: 1
      maxLength: 64
    Common-Creditor:
      title: CommonCreditor
      type: object
      description: This section contains the details information of creditor.
      properties:
        type:
          type: string
          title: type
          description: Type of creditor.
          enum:
          - '00'
          example: '00'
        name:
          allOf:
          - $ref: '#/components/schemas/Name'
          - description: Name of the account.
            example: SHASHANK VIJAYSHANKAR TIWARI
        contact_number:
          type: string
          title: contact_number
          description: Full contact number.
          minLength: 1
          maxLength: 32
          example: '9876543210'
        contact_prefix:
          type: string
          title: contact_prefix
          description: International telephone area code.
          minLength: 1
          maxLength: 32
          example: '91'
        email:
          type: string
          title: email
          description: Email address of the merchant.
          minLength: 1
          maxLength: 32
          example: abc@pp.com
    Currency-Code:
      type: string
      title: currency_code
      description: The currency code in the transaction.
      pattern: ^[A-Z]{3}$
      example: USD
    Creditor-Address:
      title: CreditorAddress
      description: Address information for the creditor.
      allOf:
      - $ref: '#/components/schemas/Address-Details'
      - $ref: '#/components/schemas/Partial-Address'
      - type: object
        title: Creditor-Address
        required:
        - country_code
        - city
        - state
    Pagination-Metadata:
      description: '<br> current_page: Current page number<br> total_pages: Total number of pages available for this request<br> page_size: The number of records to display per page<br> has_more: Any more messages or records expected'
      type: object
      title: Pagination Metadata
      properties:
        current_page:
          description: Current page number
          type: integer
          minimum: 1
          maximum: 1000
          example: 1
          title: current_page
        total_pages:
          description: Total number of pages available for this request
          type: integer
          minimum: 1
          maximum: 1000
          example: 1
          title: total_pages
        page_size:
          description: Number of records to display per page
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
          title: page_size
        has_more:
          description: Any more messages or records expected
          type: boolean
          example: true
          title: has_more
      example:
        current_page: 1
        total_pages: 10
        page_size: 100
        has_more: true
    Partial-Address:
      title: PartialAddress
      description: Address information for the creditor.
      type: object
      properties:
        street_name:
          type: string
          title: street_name
          description: Street name.
          minLength: 1
          maxLength: 128
          example: ROYAL STREET
        postal_code:
          type: string
          title: postal_code
          description: Postal code.
          minLength: 1
          maxLength: 16
          example: '5110'
  parameters:
    Client-Id:
      in: query
      name: client_id
      description: Your unique identification, same as the identification you use for OAuth token generation, Citi shared with you during your CitiConnect API onboarding.
      schema:
        type: string
        title: Client-Id
        example: 6d3cf821-db6d-496d-bec0-064a362e9c31
        minimum: 1
        maximum: 128
      required: true
    Creditor-Partner-User-Id:
      name: creditor_partner_user_id
      in: query
      description: The unique creditor identifier of your system.
      schema:
        type: string
        title: creditor_partner_user_id
        minLength: 1
        maxLength: 50
        example: P298UI839KADY381
    Page-No:
      name: page_no
      in: query
      required: false
      description: Page number (default- 1).
      schema:
        type: integer
        title: page_no
        minimum: 1
        maximum: 5000
        default: 1
    Country-Code:
      in: header
      name: Country-Code
      description: Marketplace's country code.
      schema:
        pattern: ^[A-Z]{2,2}$
        type: string
        title: Country-Code
        example: US
      required: true
    Event-Type:
      name: Event-Type
      in: header
      required: true
      description: Type of event (e.g., CERTIFICATION, WALLET_ACTIVATION, LINK_ACCOUNT, PAYMENT, INBOUND, RFI).
      schema:
        type: string
        title: event-type
        minLength: 1
        maxLength: 64
        example: Webhook
    Event-Name:
      name: Event-Name
      in: header
      description: Name of event (e.g., PAYOUT, PAYIN).
      schema:
        type: string
        title: event-name
        minLength: 1
        maxLength: 64
        example: Payout
    Limit:
      name: limit
      in: query
      required: false
      description: Number of results per page (default- 50).
      schema:
        type: integer
        title: limit
        minimum: 1
        maximum: 100
        default: 50
    Idempotency-Id:
      in: header
      name: Idempotency-Id
      description: "Your unique identification for a POST request \n - Maximum length is 128. \n-CitiConnect API responds with an error (HTTP status 4XX) if your POST request idempotency identification value is a duplicate across a recent history of idempotency identifications in Citi's database. \n- If you don't receive any response (HTTP status 2XX, 4XX or 5XX) from Citi to your POST request and you wish to retry, reinitiate your request with the same idempotency identification to prevent accidental duplicate payment."
      schema:
        type: string
        title: Idempotency-Id
        minLength: 1
        maxLength: 128
        example: a44cbb606de4edb9a7a123414bba3bb
      required: true
    Creditor-Id:
      name: creditor_id
      in: query
      description: The unique creditor identifier returned when you call link account.
      schema:
        type: string
        title: creditor_id
        minLength: 1
        maxLength: 36
        example: R202501080950209789
    Apim-Guid:
      in: header
      name: Apim-Guid
      description: Unique system generated reference number generated by   Citi. Refer to this number in case of any discrepancy reporting to a Citi representative.
      schema:
        type: string
        maxLength: 128
        minLength: 1
        title: Apim-Guid
      required: true
      example: na-apimgwgtds04~4a98cbc5-d813-4e65-bc81-d70f0f87f6ec
    Merchant-Id:
      in: header
      name: Merchant-Id
      description: CITI generated Merchant ID during merchant creation.
      schema:
        type: string
        title: Merchant-Id
        minLength: 1
        maxLength: 36
        example: ec689822-9864-4c4d-9d68-22246762901
      required: true
  headers:
    Apim-Guid:
      description: Unique system generated reference number generated by   Citi. Refer to this number in case of any discrepancy reporting to a Citi representative.
      schema:
        type: string
        maxLength: 128
        minLength: 1
        title: Apim-Guid
      required: true
      example: na-apimgwgtds04~4a98cbc5-d813-4e65-bc81-d70f0f87f6ec
  securitySchemes:
    oAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://b2b.api.icg.citi.com/authenticationservices/v3/oauth/token
          scopes:
            /authenticationservices/v1: Access to marketplace management APIs
