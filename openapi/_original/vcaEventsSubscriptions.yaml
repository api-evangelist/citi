      responses:
        '200':
          description: >-
            <table><tr><td>Code</td><td>Details</td></tr><tr><tr><td>SubscriptionResponse</td><td>OK</td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          description: >-
            <table><tr><td><strong>errorCode</strong><td><strong>errorDescription</strong><tr><td>EVB0726<td>subscriptionId
            length should contain a min of 1 character and a max of 255
            characters<tr><td>EVB0727<td>No subscription found for the specified
            subscription ID<tr><td>GRC0005<td>Client Tracking ID is missing in
            the request header<tr><td>GRC0010<td>Client Tracking ID length
            should contain a min of 1 character and a max of 36
            characters<tr><td>GRC0016<td>Country code is not available in the
