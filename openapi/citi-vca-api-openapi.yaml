        account_description: VA Account
        action: Modify
        address:
          address_line_1: 127 Geetanagar 2 Society
          address_line_2: Near Sitanagar Chowk
          address_line_3: Punagam, Surat-395010
          address_line_4: Gujarat, India
        branch_code: GB3
        tax_payer_id: TINX2354
