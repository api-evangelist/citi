          description: "Transaction identification generated for or by the network \n - For India IMPS and UPI, this field is optional and max length is 12 \n - For US EWS,this field is not applicable \n - For UK,this field is not applicable \n - For IN PAN,this field is not applicable \n - For Pay2China, this field is not applicable"
          title: network_id
        local_reference:
          xml:
            name: LocalReference
          maxLength: 35
          minLength: 1
          type: string
          description: "This is a Citi generated payment reference which is included in the ‘Bank Reference’ field of bank statement posting for itemized transaction. \n- To utilize the field in production, please contact with implementation manager  \n - For India IMPS and UPI, local_reference is optional \n - For US EWS,this field is not applicable \n - For UK,this field is not applicable \n - For IN PAN,this field is not applicable"
          title: "local_reference \n - For Pay2China, this field is not applicable"
        status:
          xml:
            name: Status
          type: object
          title: status
          properties:
            date_time:
              xml:
                name: DateTime
              type: string
              format: date-time
              description: "UTC (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Date time of transaction status"
              title: date_time
            code:
              xml:
                name: Code
              type: string
              description: ISO 20022 acknowledegment status code
              enum:
              - ACCC
              - RJCT
              - ACTC
              - PDNG
              title: code
            description:
              xml:
                name: Description
              type: string
              description: "Status code description \n- ACCC - Completed \n- RJCT - Rejected \n - ACTC - Accepted \n- PDNG - Pending"
              title: description
          required:
          - code
          - description
          - date_time
        reasons:
          xml:
            name: Reasons
          type: object
          title: reasons
          properties:
            code:
              xml:
                name: Code
              type: string
              description: "Reason code (applicable when request is rejected/status.code = RJCT) \n - For Pay2China, local regulatory error code should be sent to client. 2201, 2202, 2203, 2204, 2205, 2206, 9000, 9001, 9007, 9019, 9042"
              maxLength: 4
              title: code
            description:
              xml:
                name: Description
              type: string
              description: "Reason code description \n - For Pay2China, local regulatory error code should be sent to client. 2201 -  corporate merchant not qualified, 2202 -  merchant id verification failed, 2203 -  individual merchant not qualified, 2204 -  merchant validation failed (Internal), 2205 -  account name of the payee error, 2206 -  Merchant Frozen, 9000 -  request parameter [{}] cannot be empty, 9001 -  request parameter [{}] format error, 9007 -  request parameter [{}] is too long, 9019 -  request parameter [{}] already exist, 9042  platform not exist or invalid"
              minLength: 1
              maxLength: 105
              title: description
