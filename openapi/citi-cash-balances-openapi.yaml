            action: please use valid http verb
            code: CC00001
    Unsupported-Media-Type-Example:
      value:
        ref_id: 444d0f3f-4x55-7g99-8b2c-0cf2a921a5ab
        errorDetails:
          - issue: Media type not supported
            action: please use valid content-type in header
            code: CC00002
    Internal-Server-Error-Example:
      value:
        ref_id: 444d0f3f-4x55-7g99-8b2c-0cf2a921a5ab
        errorDetails:
          - issue: unable to serve your request at this moment
            action: Please refer to documentation provided or contact support team
            code: CC00004
  schemas:
    e0b62396-5920-4270-96b1-26dddee0c242-data-schema:
      type: object
      properties:
        ACCT_BASE_NBR:
          type: string
          description: >-
            Account Base Number is an internal Citi client identifier that is
            associated to a safekeeping or cash account.
          example: 8-DEMOCSH53JPY
        ACCT_BUS_TYP_CD:
          type: string
          description: >-
            A code to indicate the type of account<br>Cash<br>Safekeeping<br>
            E-Report.
          example: C
        ACCT_BUS_TYP_NME:
          type: string
          description: >-
            Account type description indicates the type of the account. Values
            are<br> CASH (C)<br>S/K (S)
          example: CASH
        ACCT_ID:
          type: string
          description: >-
            Account ID is an identifier for both a cash account and/or a
            safekeeping account that is unique within a branch.
          example: DEMOSK02US
        ACCT_NME:
          type: string
          description: >-
            Account Name is the name that is assigned to the cash account and/or
            the safekeeping account. If an alternate account name has been
            specified for an account it will be displayed as the Account Name.
          example: Demo - SK - US DCC Equity
        ACCT_STS_TYP:
          type: string
          description: >-
            Account status provides the current status of the cash account
            and/or the safekeeping account.  Values are:<br> Open<br> Closed<br>
            Frozen
          example: Open
        ALTV_CUR_CD:
          type: string
          description: Account Base Currency Code is the ISO Currency Code for the account.
          example: JPY
        ASOF_TMS:
          type: string
          format: date-time
          description: The As Of Date is the date of the information being reported.
          example: '2019-08-26 00:00:00'
        AVAL_BAL:
          type: number
          format: double
          description: >-
            Available Balance is the cash account balance for  all posted
            transactions,  except for future value dated transactions.
          example: '6136188.61'
        BAL_STS_TYP:
          type: string
          description: >-
            Cash Balance Type will be Posted for all cash accounts except for US
            Direct cash accounts where  the balance type can be either Posted or
            Sweep.
          example: POSTED
        BR_ID:
          type: string
          description: >-
            Branch Code is the identifier of the branch for the account.For the
            cash account the branch code is a numeric value  and for the
            safekeeping account it is the ISO Country code.
          example: '484'
        BR_NME:
          type: string
          description: >-
            Branch Name is the name of the branch for the cash account and/or
            safekeeping account.
          example: NEW YORK SECURITIES CB
        CASH_TYPE:
          type: number
          format: double
          description: >-
            Cash Type Code pertains to US Direct cash accounts and indicates
            whether the cash account has a split income and principal balance.
          example: '1'
        COB_DATE:
          type: string
          format: date
          description: Close of Business Date
          example: '2019-08-26'
        EOD_INTRA_IND:
          type: string
          description: >-
            EOD/intraday Indicator advises if the balance is an end-of-day
            reported balance or  if the balance is an Intraday reported balance.
            Values are:<br>- 1 (Intraday)<br>- 2 (End of Day).
          example: '2'
        GFC_ID:
          type: string
          description: >-
            Client ID is an identifier that is available on a cash account
            and/or a safekeeping account. This Client ID is referred to,
            internally at Citi, as a GFCID.
          nullable: true
          example: '1000123456'
        LCL_CUR_CD:
          type: string
          description: Currency code is the ISO currency code for the amount.
          example: JPY
        LED_BAL:
          type: number
          format: double
          description: >-
            Ledger Balance is the balance for the cash account that includes all
            posted transactions including future value dated transactions.
          example: '6136188.61'
        LST_ENTRY_TMS:
          type: string
          format: date-time
          description: >-
            Balance change date displays the date of the last change to the
            balance based on transactions  that have been posted to the cash
            account.
          example: '2019-08-26 00:00:00'
        LST_UPD_TMS:
          type: string
          format: date-time
          description: >-
            Balance Update Timestamp displays the date/time of the last update
            to the balance due to transactions  that have posted to the cash
            account (Intraday) or due to reporting database updates (End of
            Day).
          example: '2019-08-26 00:00:00'
        OPNG_BAL:
          type: number
          format: double
          description: >-
            Opening balance is the opening ledger balance (previous days closing
            balance) for the cash account.  Ledger Balance includes all posted
            transactions including future value dated transactions.
          example: '6136188.61'
        PRNCPL_INC_IND:
          type: string
          description: >-
            Principal / Income Indicator advises if the balance is for principal
            or income.   Values include:<br> P (Principal)<br> I (Income)
          example: P
        ROLLED_FWD:
          type: string
          description: >-
            Rolled Forward indicator parameter is used to flag if position
            valuation has been rolled forward from last close of business.
          example: 'Y'
        TRANS_REF_NBR:
          type: string
          description: >-
            Custodian Reference is the unique reference assigned by the
            custodian to the record.  The reference number is unique within a
            branch.
          example: '46050312345'
        IOD_TIMESTAMP:
          type: string
          format: date-time
          description: Provides the Timestamp when data is loaded in the Data Lake
          example: '2019-08-26 00:00:00'
        HEAD_ACCOUNT:
          type: string
          description: SCAR Head Account Number
          example: '1234567'
