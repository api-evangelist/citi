    Order-Update:
      title: Order Update
      properties:
        id:
          description: "A unique identifier for this order to distinguish it from any other order you create. \n- For CARD Update Authorization operation order.id parameter is mandatory \n- For CARD Void/Cancel operation order.id parameter is mandatory \n- For ACH Void/Cancel transaction, order.id parameter is mandatory \n- For India Card Cancel transaction, order.id parameter is mandatory"
          example: OR123456789
          maxLength: 50
          minLength: 1
          type: string
          title: id
        amount:
          description: "The total amount for the order.  This is the net amount plus any merchant charge amounts.If you provide any sub-total amounts, then the sum of these amounts (order.itemAmount, order.taxAmount, order.shippingAndHandlingAmount, order.cashbackAmount, order.gratuityAmount, order.merchantCharge.amount and order.dutyAmount), minus the order.discountAmount must equal the net amount.The value of this parameter in the response is zero if payer funds are not transferred.  \n- For CARD Update Authorization operation order.amount parameter is mandatory \n- For CARD Void/Cancel operation order.amount parameter is mandatory"
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        currency_code:
          description: The currency of the order expressed as an ISO 4217 alpha code, e.g. USD.
          example: USD
          type: string
          title: currency_code
        duty_amount:
          description: The duty amount (also known as customs tax, tariff or dues) for the order.
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: duty_amount
        tax_amount:
          description: The total tax amount for the order.If you do not provide this value but provide line item data, then this amount is calculated as the sum of the item.quantity times the item.unitTaxAmount for all the line items (total tax amount).If you provide both this value and line item data, then the order.taxAmount MUST equal the total tax amount.
          example: INDENTITY1
          maxLength: 14
          minLength: 1
          type: string
          title: tax_amount
        item_amount:
          description: The total item amount for the order.If you do not provide this value but provide line item data, then this amount is calculated as the sum of the item.quantity times the item.unitPrice for all the line items (total item amount).If you provide both this value and line item data, then the order.itemAmount MUST equal the total item amount.
          example: '100.00'
          maxLength: 14
          minLength: 1
          type: string
          title: item_amount
        reference:
          description: An optional identifier for the order For example, a shopping cart number, an order number, or an invoice number.
          example: CART123456
          maxLength: 200
          minLength: 1
          type: string
          title: reference
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
      type: object
    Aggregated-Fare:
      title: aggregated
      properties:
        type:
          description: "Provide the transport mode used by the payer for the first trip when fare collection is aggregated across one or more trips as well as for merchant-initiated debt recovery transactions. \n- DEBT_RECOVERY_MERCHANT_INITIATED Transaction for a debt recovery for an known transit fare initiated by Merchant (according to the scheme rules). \n- DEBT_RECOVERY_PAYER_INITIATED Transaction for a debt recovery for an known transit fare initiated by payer (according to the scheme rules). \n- DEBT_RECOVERY_TAP_INITIATED Transaction for a debt recovery for an known transit fare tap initiated (according to the scheme rules). \n- FARE_DEFERRED_AUTHORIZATION Known transit fare payment where you are submitting the Authorization after the payer has already gained access to the transit service (deferred Authorization). \n- FARE_REAL_TIME_AUTHORIZATION Known transit fare payment where you are submitting the Authorization at the time of travel."
          enum:
          - DEBT_RECOVERY_MERCHANT_INITIATED
          - DEBT_RECOVERY_PAYER_INITIATED
          - DEBT_RECOVERY_TAP_INITIATED
          - FARE_DEFERRED_AUTHORIZATION
          - FARE_REAL_TIME_AUTHORIZATION
          example: DEBT_RECOVERY_TAP_INITIATED
          type: string
          title: type
        transportation_mode:
          description: Indicates if this is a transaction for an aggregated transit fare or a merchant-initiated, tap-initiated or payer-initiated debt recovery for an aggregated transit fare.
          enum:
          - CABLE_CAR
          - COACH
          - COMMUTER_TRAIN
          - EXPRESS_COMMUTER_TRAIN
          - FUNICULAR_TRAIN
          - HIGH_SPEED_TRAIN
          - INTERURBAN_BUS
          - INTER_CITY
          - LIGHT_TRAIN_MASS_TRANSIT
          - LOCOMOTIVE
          - OTHER
          - PARA_TRANSIT
          - PARKING
          - POWERED_MOTOR_VEHICLE
          - REGIONAL_TRAIN
          - RURAL_BUS
          - SELF_DRIVE_VEHICLE
          - TAXI
          - TOLL
          - TRAILER
          - TRAIN
          - URBAN_BUS
          - WATER_BORNE_VEHICLE
          example: COMMUTER_TRAIN
          type: string
          title: transportation_mode
        start_date:
          description: This is the start date of an aggregation and matches the date of the first travel or first tap within the aggregation period.
          example: '2024-03-07'
          format: date
          type: string
          title: start_date
