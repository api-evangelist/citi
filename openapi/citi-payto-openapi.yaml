          pattern: ^(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.[0-9]{1,3})?(?:Z)|(-)$
          description: >-
            Indicates that each execution of the mandate payment should not
            occur before a given time (hh:mm:ss.sssZ) of that execution day.
            This parameter is specific to Australia.
          example: 23:59:59.999Z
        transfer_arrangement:
          title: transfer_arrangement
