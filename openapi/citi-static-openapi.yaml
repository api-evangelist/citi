        corelationId: f481ace0-c3e6-426f-a3a8-f9b3ee279562
    BrazilStaticQRCodeExample:
      value:
        txid: QR00012346789079769986667
        chave: '12345678901234'
        infoAdicionais: Valor com desconto
        valor: '120.90'
        nomeBeneficiario: John Heten
        cidadeBeneficiario: Sao Paulo
        saque: '1'
