            instrument code list.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        Prtry:
          type: object
          description: >-
            Specifies the local instrument, as a proprietary code. \n - For
            Pay2China A01, this field to be prefixed with 'CITIA01'. \n - For
            Pay2China A02, this field to be prefixed with 'CITIA02'. \n - For
            Pay2China A03, this field to be prefixed with 'CITIA03'.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
      description: >-
        User community specific instrument. Either Code or Proprietary parameter
        value should be passed in request.
    Max10Text:
      maxLength: 10
      minLength: 1
