components:
  schemas:
    fi_reconfirmation_request:
      properties:
        citi_reference:
          description: This field specifies the Product processor Reference Number for the transaction that needs to be reconfirm/reject. UETR or citi_reference with interbank_settlement_date or instruction_id with interbank_settlement_date is mandatory.
          maxLength: 32
          type: string
          xml:
            name: ClrSysRef
        instruction_id:
          description: This is a unique instrution id that identifies a transaction that needs to be reconfirm/reject. UETR or citi_reference with interbank_settlement_date or instruction_id with interbank_settlement_date is mandatory.
          maxLength: 35
          type: string
          xml:
            name: InstrId
        interbank_settlement_date:
          description: This field specifies the value date (yyyy-MM-dd) of the original transaction that needs to be reconfirm/reject (the date on which funds were credited to the account).
          format: date
          type: string
          xml:
            name: ReqdExctnDt
        reason:
          description: This is the five digits reconfirm/reject code (Example DUPL) which is specified by the  customer to request to reconfirm/reject the transaction
          maxLength: 5
          type: string
          xml:
            name: Rsn
        uetr:
          description: Unique End-to-end Transaction Reference (UETR) relating to a payment has been identified as being associated with a Request for reconfirm/reject. It should follow UUID version 4 format. UETR or citi_reference with interbank_settlement_date or instruction_id with interbank_settlement_date is mandatory.
          type: string
          xml:
            name: UETR
      required:
      - reason
      type: object
      xml:
        name: TransacService
    ErrorDetail:
      properties:
        action:
          description: corrective action to be taken to resolve above issue
          maxLength: 350
          type: string
        issue:
          description: more details about the  issue
          maxLength: 200
          type: string
      type: object
      xml:
        name: error
    error_response:
      properties:
        errors:
          description: Indicates actual error details with issues and corresponding actions to resolve the issue
          items:
            $ref: '#/components/schemas/ErrorDetail'
          xml:
            wrapped: true
        http_code:
          description: Indicates http status code to specify http response status
          format: int32
          pattern: ^[0-9]{3}$
          type: integer
        status:
          description: This field  indicates the status of the reconfirm/reject or cancel/recall request with set of values. for example- FAILED
          maxLength: 6
          type: string
      type: object
    transaction_status_detail:
      properties:
        status:
          description: This field  indicates the status of the reconfirm/reject or cancel/recall request with set of values. for example- ACCP for Accepted or RJCT for Rejected
          maxLength: 4
          type: string
          xml:
            name: TxSts
        type:
          description: This field provides additional information of the transaction when it is rejected/accepted.
          maxLength: 500
          type: string
          xml:
            name: AddtlInf
      type: object
      xml:
        name: TxInfAndSts
    fi_response:
      properties:
        transaction_status:
          $ref: '#/components/schemas/transaction_status_detail'
      type: object
    ErrorDetail_2:
      type: object
      properties:
        issue:
          type: string
          description: More details about the issue.
          maxLength: 200
        action:
          type: string
          description: Corrective action to be taken to resolve above issue.
          maxLength: 350
      xml:
        name: error
    error_response_2:
      type: object
      description: Error response body.
      properties:
        status:
          type: string
          description: This parameter indicates the status of the reconfirm/reject or cancel/recall request with set of values. for example- FAILED.
          maxLength: 6
        http_code:
          type: integer
          description: Indicates http status code to specify http response. status
          format: int32
          pattern: ^[0-9]{3}$
        errors:
          type: array
          description: Indicates actual error details with issues and corresponding actions to resolve the issue.
          items:
            $ref: '#/components/schemas/ErrorDetail_2'
          xml:
            wrapped: true
    transaction_status_detail_2:
      type: object
      properties:
        status:
          type: string
          description: This parameter indicates the status of the cancel/recall request with set of values. for example - ACCP for Accepted or RJCT for Rejected.
          maxLength: 4
        type:
          type: string
          description: This parameter provides additional information of the transaction when it is rejected/accepted.
          maxLength: 500
    fi_cancellation_request:
      type: object
      properties:
        uetr:
          type: string
          format: uuid
          description: Unique End-to-end Transaction Reference (UETR) relating to a payment has been identified as being associated with a Request for Cancellation. It should follow UUID version 4 format. UETR or citi_reference with interbank_settlement_date or end_to_end_id / instruction_id with interbank_settlement_date is mandatory.
          minLength: 1
          maxLength: 32
        citi_reference:
          type: string
          description: This parameter specifies the product processor reference number for the transaction that needs to be cancelled or recalled. UETR or citi_reference with interbank_settlement_date or end_to_end_id / instruction_id with interbank_settlement_date is mandatory.
          maxLength: 32
        end_to_end_id:
          type: string
          description: This is a unique end-to-end reference number that identifies a transaction that needs to be cancelled. UETR or citi_reference with interbank_settlement_date or end_to_end_id / instruction_id with interbank_settlement_date is mandatory.
          maxLength: 16
        instruction_id:
          type: string
          description: This is a unique end-to-end instruction id that identifies a transaction that needs to be cancelled. UETR or citi_reference with interbank_settlement_date or end_to_end_id / instruction_id with interbank_settlement_date is mandatory.
          maxLength: 16
        interbank_settlement_date:
          type: string
          description: This parameter specifies the value date (yyyy-MM-dd) of the original transaction that needs to be cancelled or recalled (the date on which funds were credited to the account).
          format: date
        reason:
          type: string
          description: This is the four digits cancellation code (Example - DUPL) which is specified by the customer to request to cancel the transaction.
          maxLength: 4
        reason_description:
          type: string
          description: Further details on the request reason. Required for CUST and MS03 reason codes applicable to Stop services.
          maxLength: 150
