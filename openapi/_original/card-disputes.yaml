    ErrorMessage:
      title: ErrorMessage
      properties:
        errorCode:
          type: string
          example: ErrorCode
          description: >
            All Possible error codes that can be returned in the ErrorResponse.
            *`DISP001` *`DISP002` *`DISP003` *`DISP004` *`DISP005` *`DISP006`
            *`DISP007` *`DISP008` *`DISP009` *`DISP010` *`DISP012` *`DISP013`
            *`DISP014` *`DISP016` *`DISP017` *`DISP018` *`DISP019` *`DISP020`
            *`DISP021` *`DISP022` *`DISP023` *`DISP024` *`DISP025` *`DISP027`
            *`DISP028` *`DISP030` *`DISP031` *`DISP032` *`DISP033` *`DISP034`
            *`DISP035` *`DISP036` *`DISP037` *`DISP038` *`DISP039` *`DISP040`
            *`DISP041` *`DISP042` *`DISP043` *`DISP044` *`DISP045` *`DISP046`
            *`DISP047` *`DISP048` *`DISP049` *`DISP050` *`DISP051` *`DISP052`
            *`DISP053` *`DISP054` *`DISP055` *`DISP056` *`DISP057` *`DISP058`
            *`DISP059` *`DISP060` *`DISP061` *`DISP062` *`DISP063` *`DISP064`
            *`DISP065` *`DISP066` *`DISP067` *`DISP068` *`DISP069` *`DISP070`
            *`DISP071` *`DISP072` *`DISP073` *`DISP074` *`DISP075` *`DISP076`
            *`DISP077` *`DISP078` *`DISP079` *`DISP080` *`DISP081` *`DISP082`
            *`DISP083` *`DISP087` *`DISP088` *`DISP089` *`DISP090` *`DISP091`
            *`DISP092` *`DISP093` *`DISP094` *`DISP095` *`DISP096` *`DISP097`
            *`DISP098` *`DISP099` *`DISP100` *`DISP101` *`DISP102` *`DISP103`
            *`DISP104` *`DISP105` *`DISP106` *`DISP107` *`DISP108` *`DISP109`
            *`DISP110` *`DISP111` *`DISP112` *`DISP113` *`DISP114` *`DISP117`
            *`DISP118` *`DISP119` *`DISP120` *`DISP121` *`DISP122` *`DISP123`
            *`DISP124` *`DISP125` *`DISP126` *`DISP127` *`DISP128` *`DISP129`
            *`DISP130` *`DISP131` *`DISP132` *`DISP133` *`DISP134` *`DISP135`
            *`DISP136` *`DISP137` *`DISP138` *`DISP139` *`DISP140` *`GRC0003`
            *`GRC0004` *`GRC0005` *`GRC0006` *`GRC0007` *`GRC0010` *`GRC0016`
        errorDescription:
          type: string
          example: ErrorDescription
          description: >
            The error description that corresponds to error code when there is
            any error occurred while retrieving the transaction. * `DISP001` -
            reasonCode is mandatory * `DISP002` - Reason code could only be one
            of the 15 below:
              - Duplicate Processing
              - Altered Amount
              - Incorrect Transaction Currency
              - Multiple Processing
              - Credit Applied as Charge
              - Hotel Cancellation
              - Merchandise Returned
              - Credit Not Received
              - Airline Ticket Cancellation
              - Cancelled Recurring Transaction
              - Never Received
              - Not As Described
              - ATM Discrepency
              - Paid By Other Means
              - Fraudulent Transaction                  
            * `DISP003` - Transaction Details object is  mandatory * `DISP004` -
            You can send only one ARN per dispute creation request * `DISP005` -
            requestID is mandatory * `DISP006` - Request ID is not unique within
            the array. Please use unique request IDs for all ARNs in the array.
            * `DISP007` - RequestId length should contain max of 36 characters *
            `DISP008` - acquirerReferenceNumber is mandatory * `DISP009` -
            Invalid ARN * `DISP010` - disputeAmount is mandatory * `DISP012` -
            Disputed amount cannot be negative and cannot have more than 19
            digits (including decimals) * `DISP013` - disputeCurrency is
            mandatory * `DISP014` - disputeCurrency is invalid. Please send a
            valid 3-char currency code * `DISP016` - reasonCodeDetails is
            mandatory * `DISP017` - CardHolder Comments length should contain
            max of 250 characters * `DISP018` - Card holder acknowledgement is
            mandatory * `DISP019` - Card holder acknowledgement should be True
            or False * `DISP020` - chAlteredAmtFrm is mandatory * `DISP021` -
            Altered amount 'from' or 'to' cannot be negative and cannot have
            more than 19 digits (including decimals) * `DISP022` -
            chAlteredAmtTo is mandatory * `DISP023` - Altered amount 'from' or
            'to' cannot be negative and cannot have more than 19 digits
            (including decimals) * `DISP024` - merchantProcessedCurr is
            mandatory * `DISP025` - merchantProcessedCurr is invalid. Please
            send a valid 3-char currency code * `DISP027` - chReceiptCurr is
            mandatory * `DISP028` - chReceiptCurr is invalid. Please send a
            valid 3-char currency code * `DISP030` - chProvidedTransDt is
            mandatory * `DISP031` - Cardholder provided transaction date should
            be YYYYMMDD format and can't be future date * `DISP032` -
            chProvidedTransAmnt is mandatory * `DISP033` - chProvidedTransAmnt
            cannot be negative and cannot have more than 19 digits (including
            decimals) * `DISP034` - cancelledDate is mandatory * `DISP035` -
            Cancelled Date should be YYYYMMDD format and can't be a future date 
            * `DISP036` - Cancelled Time should beHH:MM format * `DISP037` -
            isCancPolicyProvided is mandatory * `DISP038` - isCancPolicyProvided
            must contain only True/False values * `DISP039` - Either
            Cancellation Number or Cancellation Details should be mandatory, If
            Cancellation policy is True. * `DISP040` - CancellationDetails
            length must be with in 250 character * `DISP041` -
            contactedMechantDt should be YYYYMMDD format and can't be a future
            date  * `DISP042` - merchantResponse cannot be more than 250 char *
            `DISP043` - isMerchantBankrupt is mandatory * `DISP044` -
            isMerchantBankrupt value should be True or False * `DISP045` -
            serviceType is mandatory * `DISP046` - serviceType value should be T
            or G * `DISP047` - reservationType is mandatory, if serviceType is G
            * `DISP048` - Invalid reservationType * `DISP049` - serviceDate is
            mandatory * `DISP050` - Service Date should be YYYYMMDD format and
            can't be future date * `DISP051` - cancellationReason is mandatory *
            `DISP052` - cancellationReason length with in 250 character. *
            `DISP053` - merchandiseAmnt is mandatory * `DISP054` -
            merchandiseAmnt cannot be negative and cannot have more than 19
            digits (including decimals) * `DISP055` - merchandiseReturnedOn is
            mandatory * `DISP056` - mechandiseReturnedOn should be YYYYMMDD
            format and can't be future date * `DISP057` - Return Reason is
            mandatory * `DISP058` - contactedmerchantOn is mandatory * `DISP059`
            - contactedMechantOn should be YYYYMMDD format and can't be future
            date * `DISP060` - Merchant Response is Mandatory * `DISP061` -
            Return Items is mandatory * `DISP062` - isReturnAuthorized is
            mandatory * `DISP063` - Return Authorized should be True or False *
            `DISP064` - mechandiseReceivedOn should be YYYYMMDD format and can't
            be future date * `DISP065` - returnMethod is mandatory, if invoice
            number present * `DISP066` - returnMethod is invalid * `DISP067` -
            otherComments is mandatory, if returnMethod value is Other *
            `DISP068` - otherComments cannot be more than 250 char * `DISP069` -
            merchantReturnReceivedDt is mandatory * `DISP070` -
            merchantReturnReceivedDt should be YYYYMMDD format and can't be
            future date * `DISP071` - creditVoucherDate is mandatory * `DISP072`
            - creditVoucherDate should be YYYYMMDD format and can't be future
            date * `DISP073` - cancellationDate is mandatory * `DISP074` -
            cancellationDate should be YYYYMMDD format and can't be future date
            * `DISP075` - isCancelled is Mandatory * `DISP076` - isCancelled
            should be True or False * `DISP077` - cancelledDate is mandatory, if
            isCancelled is True * `DISP078` - CancellationDate should be
            YYYYMMDD format and Furture Date not allowed, if Air ticket
            isCancelled True * `DISP079` - contactedAirlineOn should be YYYYMMDD
            format and can't be future date * `DISP080` - chNotificationDt is
            mandatory * `DISP081` - Card Holder NotificationDate should be
            YYYYMMDD format * `DISP082` - Either contactedMechantDt or
            merchantResponse is required * `DISP083` - contactedMerchantDt
            should be YYYYMMDD format

            * `DISP087` - whatNotReceived field is mandatory * `DISP088` -
            whatNotReceived cannot be more than 250 char * `DISP089` -
            purchaseAmnt is mandatory * `DISP090` - purchaseAmnt cannot be
            negative and cannot have more than 19 digits (including decimals) *
            `DISP091` - expectedDt is mandatory * `DISP092` - expectedDate
            should be YYYYMMDD format * `DISP093` - deliveredAddress is
            mandatory * `DISP094` - contactDt is mandatory * `DISP095` -
            contactDt should be YYYYMMDD format * `DISP096` -
            merchandiseOrService is mandatory * `DISP097` - merchandiseOrService
            must be either Service OR Merchandise * `DISP098` -
            didMerchantCancel is mandatory * `DISP099` - didMerchantCancel
            should be True or False * `DISP100` - merchantCancelledDt is
            mandatory if 'didMerchantCancel' is True * `DISP101` -
            merchantCancelledDt should be YYYYMMDD format * `DISP102` -
            chExplanation is mandatory * `DISP103` - chExplanation cannot be
            more than 250 char * `DISP104` - transactionHappenedAt is Mandatory
            * `DISP105` - merchandiseReceivedDt is mandatory * `DISP106` -
            merchandiseReceivedDt Should be YYYYMMDD format * `DISP107` -
            merchandiseCancelledDt is mandatory * `DISP108` -
            merchandiseCancelledDt should be YYYYMMDD format * `DISP109` -
            contactedMerchantDt is mandatory * `DISP110` - merchantResponse
            length with in 250 character * `DISP111` - isMerchantRefused is
            mandatory * `DISP112` - isMerchantRefused should be True or False *
            `DISP113` - invoiceNumber is mandatory * `DISP114` - invoiceNumber
            cannot be more than 64 char * `DISP117` - packageSignedBy cannot be
            more than 64 char * `DISP118` - deliveryAddress cannot be more than
            250 char * `DISP119` - whatPurchased is mandatory * `DISP120` -
            whatPurchased field should be either Merchandise or Service *
            `DISP121` - merchantAcceptedCancellation is mandatory if
            whatPurchased is Service * `DISP122` - merchantAcceptedCancellation
            should be either True or False * `DISP123` - amntDispensed is
            mandatory * `DISP124` - amntDispensed cannot be negative and cannot
            have more than 19 digits (including decimals) * `DISP125` -
            meansOfPayment is mandatory * `DISP126` - meansOfPayment should be
            valid for domain values A, T, C, F,V,S and O * `DISP127` -
            cardInPossessionDuringTxn is mandatory * `DISP128` -
            cardInPossessionDuringTxn either True or False * `DISP129` -
            anyoneHadAccessToCard either True or False * `DISP130` -
            relationToCH cannot be more than 16 character * `DISP131` -
            cardLostDt should be YYYYMMDD format * `DISP132` - cardLostDiscDt
            should be YYYYMMDD format * `DISP133` - cardStolenDt should be
            YYYYMMDD format * `DISP134` - cardStolenDiscDt should be YYYYMMDD
            format * `DISP135` - descOnCardStolen cannot be more than 250 char *
            `DISP136` - isReportedToCiti value should be either True or False *
            `DISP137` - cardDeliveryAdd length cannot be more than 250 char *
            `DISP138` - Duplicate req-sys-id * `DISP139` - fraudulentType should
            be Lost/Stolen/NeverReceived * `DISP140` - Client Group corporate
            number is not available * `GRC0003` - Invalid JSON input * `GRC0004`
            - Region ID is not available in the request * `GRC0005` - Invalid
            Region ID format. Region ID must be a max of 4 characters *
            `GRC0006` - Client Tracking ID is missing in the request header *
            `GRC0007` - Client requested Content Type is not supported. *
            `GRC0010` - Client Tracking ID length should contain a min of 1
            character and a max of 36 characters  * `GRC0016` - Country code is
            not available in the request
    ChargeBackStatusEnquiryResponse:
      properties:
        acquirerReferenceNumber:
          title: acquirerReferenceNumber
          description: Acquirer Reference Number of the disputed transaction
          type: string
          example: '123456789123456789123456'
          maxLength: 24
          minLength: 23
        cases:
          description: List of cases
          type: array
          items:
            $ref: '#/components/schemas/Cases'
      required:
        - acquirerReferenceNumber
    Cases:
      properties:
        caseDetails:
          $ref: '#/components/schemas/CaseDetails'
        reasonCode:
          description: Reason code against the dispute request
          type: string
          example: DuplicateProcessing
        requestId:
          description: >-
            This is the request that was used by the client at the time of case
            creation
          type: string
          example: '123456789123456789123456789123456789'
          maxLength: 36
          minLength: 36
        trackingId:
          title: trackingId
          description: >-
            This is the api-sys-id that was used at the time of dispute case
            creation request
          type: string
          example: '123456789123456789123456789123456789'
          maxLength: 36
          minLength: 36
      required:
        - caseDetails
        - disputeReason
        - requestID
        - trackingID
    CaseDetails:
      description: >-
        The object containing the individual case status to be sent back to the
        client
      title: CaseDetails
      properties:
        caseId:
          description: Case Number generated in ADS
          type: string
          example: '12345678912'
          maxLength: 11
          minLength: 11
        statusDescription:
          description: >-
            Case status description. Possible values - OP - Open; CP - Awaiting
            Information from Cardholder; CR - Cancelled / Rejected; CM - Closed
            in favour of bank; CC - Closed in favour of cardholder
          type: string
          example: CC - Closed in favour of cardholder
          maxLength: 250
        statusAsOnDate:
          description: >-
            This is the Date Timestamp that the status was last updated. This is
            in the GMT timezone with format YYYYMMDD HH:MM:SS:MMM
          type: string
          example: YYYYMMDD HH:MM:SS:MMM
      required:
        - caseId
        - statusAsOnDate
    InvalidChargeBackStatusEnquiryResponse:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Errors'
    Errors:
      title: Errors
      properties:
        errorCode:
          example: ErrorCode
          type: string
          description: >
            ErrorCode * `DISP140` * `DISP141` * `DISP142` * `DISP143` *
            `DISP144` * `DISP145` * `DISP146` * `DISP147` * `DISP148` *
            `DISP149`
        errorDescription:
          example: ErrorDescription
          description: >
            The error description that corresponds to error code when there is
            any error occurred while retrieving the transaction. * `DISP140` -
            Client Group corporate number is not onboarded * `DISP141` - Case ID
            or ARN doesn't belong to client * `DISP142` - Either
            acquirerReferenceNumber or caseId is mandatory. Kindly provide
            acquirerReferenceNumber or caseId * `DISP143` - Either
            acquirerReferenceNumber or caseId is only accepted but not both.
            Kindly provide acquirerReferenceNumber or caseId * `DISP144` - Case
            ID expected length is 11 and can be only alphanumeric * `DISP145` -
            acquirerReferenceNumber expected minimum length is 23 and expected
            maximum length is 24 and can be of only digits * `DISP146` - No
            record found for given caseId * `DISP147` - No record found for
            given acquirerReferenceNumber * `DISP148` - Invalid caseId *
            `DISP149` - Invalid acquirerReferenceNumber
          type: string
    UnAuthorizedResponse:
      properties:
        httpCode:
          title: httpCode
          description: error code to be sent to the Client
          type: string
          example: '401'
          maxLength: 10
          minLength: 1
        httpMessage:
          title: httpMessage
          description: error message to be sent to the Client
          type: string
          example: Unauthorized
          maxLength: 255
          minLength: 1
        moreInformation:
          description: more details related to the error to be sent to the Client
          type: string
