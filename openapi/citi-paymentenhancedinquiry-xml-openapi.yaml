      required:
        - CdOrPrtry
      type: object
      properties:
        CdOrPrtry:
          $ref: '#/components/schemas/DocumentLineType1Choice'
        Issr:
          type: object
          description: >-
            Identification of the issuer of the reference document line
            identificationtype.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
      description: Specifies the type of referred document line identification.
    DocumentLineType1Choice:
      type: object
      properties:
        Cd:
          type: object
          description: >-
            Specifies the document line type as published in an external
            document type code list.
          allOf:
            - $ref: '#/components/schemas/Max4Text'
        Prtry:
          type: object
          description: Proprietary identification of the type of the document line.
          allOf:
