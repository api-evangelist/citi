      properties:
        method:
          $ref: '#/components/schemas/Refund-Method-Update'
        transaction:
          $ref: '#/components/schemas/Refund-Transaction-Update'
        order:
          $ref: '#/components/schemas/Refund-Order-Update'
      additionalProperties: false
      description: Payment Update Request
    Token-Update-Request:
      type: object
      title: Token Update request
      required:
        - method
        - id
      properties:
        customer:
          $ref: '#/components/schemas/Token-Update-Request-Customer'
        method:
          $ref: '#/components/schemas/Token-Update-Request-Method'
        id:
          description: Request_Id
          type: string
          minLength: 1
          maxLength: 128
          example: ABC123456
          title: id
        billing_address:
          $ref: '#/components/schemas/Tokenization-Update-Request-Billing_Address'
    Token-Update-Request-Customer:
      title: Customer Update
      type: object
      required:
        - id
      properties:
        id:
          description: >-
            Customer ID 

            - For token id update request, customer_id parameter becomes
            mandatory when billing_address parameters was not provided by client
            in the payload request.
          minLength: 1
          maxLength: 40
          type: string
          example: ABC12345
          title: id
        first_name:
          description: Customer's first name
          minLength: 1
          maxLength: 50
          type: string
          example: John
          title: Customer first name
        last_name:
          description: Customer's last name
          minLength: 1
          maxLength: 50
          type: string
          example: Karl
          title: Customer last name
    Token-Update-Request-Method:
      title: method
      type: object
      required:
        - type
        - id_type
        - token_id
      properties:
        type:
          description: Payment Method Type
          type: string
          enum:
            - CARD
            - ACH
            - SEPA
          example: CARD
          title: type
        id_type:
          description: Personally Identifiable Information
          type: string
          enum:
            - CARD_NUMBER
            - ACCOUNT_NUMBER
            - IBAN
            - CITI_TOKEN
          example: IBAN
          title: id_type
        token_id:
          description: Token id
          type: string
          minLength: 1
          maxLength: 50
          example: Create0618token02
          title: token_id
    Mandate-Initiation-Request:
      type: object
      title: Mandate Initiation Request
      required:
        - mandate
        - merchant
      properties:
        mandate:
          $ref: '#/components/schemas/Mandate-Initiation-Request-Mandate'
        customer:
          $ref: '#/components/schemas/Mandate-Initiation-Request-Customer'
        sender:
          $ref: '#/components/schemas/Mandate-Initiation-Request-Sender'
        merchant:
          $ref: '#/components/schemas/Mandate-Initiation-Request-Merchant'
    Mandate-Initiation-Request-Mandate:
      title: Mandate
      type: object
      required:
        - request_id
        - auto_debit
        - frequency
        - country_code
      properties:
        request_id:
          description: >-
            Unique ID assigned to identify the request made on the mandate. 

            - For Brazil, this parameter is mandatory with a max length of 29 in
            format 'SC33479023yyyyMMddRkkkkkkkkkk' or
            'QR33479023yyyyMMddNkkkkkkkkkk', where:<br> the first two characters
            will be 'SC' in case of mandate.qr_code is 'N' or <br>the first two
            characters will be 'QR' in case of mandate.qr_code is
            'Y'<br>'33479023' is the merchant bank code<br> 'yyyyMMdd' is the
            mandate initiation date<br>The next character will be either 'R' or
            'N' where: <br>'R' refers to new attempts for the amount collection
            applicable after original recurrence scheduling date<br>'N' refers
            to the new attempts for amounts collection NOT applicable after
            original recurrence scheduling date<br>'kkkkkkkkkk' are unique
            alphanumeric characters
          minLength: 1
          maxLength: 35
          type: string
          example: SC3347902320251109REF12345678
          title: request_id
        frequency:
          description: >-
            Frequency in which payments are to be processed YEAR = Annual, MNTH
            = Monthly, QURT = Quarterly, MIAN = Semiannual, WEEK = Weekly, DAIL
            = Daily, ADHO = Ad hoc, INDA = Intraday, FRTN = Fortnightly and OOFF
            = One Off 

            - For Brazil this parameter is mandatory and with the allowed
            values: MIAN, MNTH, QURT, WEEK, and YEAR
          type: string
          enum:
            - YEAR
            - MNTH
            - QURT
            - MIAN
            - WEEK
            - DAIL
            - ADHO
            - INDA
            - FRTN
            - OOFF
          example: MNTH
          title: frequency
        start_date:
          description: >-
            Effective start date for the payment in YYYY-MM-DD format 

            - For Brazil this parameter is mandatory where the date should be
            greater than mandate creation date
          type: string
          format: date
          example: '2025-12-07'
          title: start_date
        end_date:
          description: >-
            Effective end date for the payment in YYYY-MM-DD format 

            - For Brazil this parameter is optional where date should be greater
            than mandate start date
          type: string
          format: date
          example: '2025-12-07'
          title: end_date
        auto_debit:
          description: >-
            Specifies whether the direct debit instructions should be
            automatically re-submitted periodically by indicating value either
            'true' or 'false' 

            - For Brazil this parameter is mandatory with an allowed value of
            false
          type: boolean
          example: false
          title: auto_debit
        amount:
          description: >-
            Fixed amount to be collected from the customer's account (either of
            amount or max_amount is allowed) 

            - For Brazil this is optional parameter with maxlength 18 digits and
            2 decimals
          minimum: 0.01
          maximum: 1000000000000000000
          type: number
          example: 1000
          title: amount
        max_amount:
          description: >-
            Max amount to be collected from customer's account (either of amount
            or max_amount is allowed) 

            - For Brazil this is optional parameter with maxlength 18 digits and
            2 decimals
          minimum: 0.01
          maximum: 1000000000000000000
          type: number
          example: 1000
          title: max_amount
        currency_code:
          type: string
          description: >-
            Currency Code for the mandate 

            - For Brazil this parameter should be provided only when amount or
            max_amount is provided
          enum:
            - BRL
          example: BRL
          title: currency_code
        country_code:
          description: |-
            Country code 
            - This parameter is mandatory for all regions
          enum:
            - BR
          example: BR
          type: string
          title: country_code
        expiry_date_time:
          description: >-
            Date & Time when the mandate request will get expired
            (format-YYYY-MM-DDThh:mm:ss.000Z where time should be in UTC) 

            - This is mandatory parameter for Brazil and date should be between
            current business day + 30 days
          type: string
          format: date-time
          example: '2024-04-29T23:59:59.999Z'
          title: expiry_date_time
        qr_code:
          description: >-
            QR Code against the mandate Y-Creating QR and sending to payer for
            acceptance/rejection N-Sending Pain.009 to Payer Bank for
            Authorization 

            - This is mandatory parameter for Brazil QR PIX
          type: string
          enum:
            - 'Y'
            - 'N'
          example: 'Y'
          title: qr_code
        reference_id:
          description: |-
            Reference Id given by merchant such as contract number 
            - For Brazil this parameter is mandatory with max length 35
          minLength: 1
          maxLength: 35
          type: string
          example: 84126/12
          title: reference_id
        agreement_number:
          description: |-
            Agreement number between merchant and customer 
            - For Brazil this parameter is optional with max length 60
          minLength: 1
          maxLength: 60
          type: string
          example: '123456'
          title: agreement_number
        additional_info:
          type: string
          maxLength: 140
          minLength: 1
          description: |-
            Additional Info on the mandate 
            - For Brazil this is optional parameter with max length 35
          title: additional_info
    Mandate-Initiation-Request-Customer:
      title: Customer
      type: object
      properties:
        private_id:
          description: >-
            Customer Tax or Legal Entity Id 

            - For Brazil this parameter is mandatory only when `mandate.qr_code`
            = N, individual person tax identification (CPF) allowed length = 11
            or business entity tax identification (CNPJ) allowed length = 14
          minLength: 1
          maxLength: 35
          type: string
          example: ABC123456789
          title: private_id
        account:
          title: customer account
          description: Account Details
          properties:
            number:
              description: >-
                Customer's bank account number 

                - For Brazil this parameter is mandatory only when
                `mandate.qr_code` = N with max length 20
              minLength: 1
              maxLength: 35
              type: string
              example: '123456789'
              title: number
            bank_id:
              description: >-
                Customer bank's network identification 

                - For Brazil this parameter is mandatory only when
                `mandate.qr_code` = N with max length 8
              minLength: 1
              maxLength: 35
              type: string
              example: CITIBRSP
              title: bank_id
            branch_id:
              description: >-
                Customer bank's branch id 

                - For Brazil this parameter is optional with max length 4 and
                only numbers are allowed
              minLength: 1
              maxLength: 35
              type: string
              example: BR123
              title: branch_id
    Mandate-Initiation-Request-Sender:
      title: Sender
      type: object
      properties:
        name:
          description: >-
            Sender Name 

            - For Brazil this parameter is mandatory only when `mandate.qr_code`
            = Y with max length 140
          minLength: 1
          maxLength: 140
          type: string
          example: Carlton Inc
          title: name
        private_id:
          description: >-
            Sender tax or Legal Entity Id 

            - For Brazil this parameter is mandatory when qr_code = Y,
            individual person tax identification (CPF) allowed length = 11 or
            business entity tax identification (CNPJ) allowed length = 14 (this
            parameter to be provided along with `sender.name`). 

            - For Brazil this parameter is optional when qr_code = N, individual
            person tax identification (CPF) allowed length = 11 or business
            entity tax identification (CNPJ) allowed length = 14 (if provided,
            value should be different from `customer.private_id` along with
            `sender.name`).
          minLength: 1
          maxLength: 35
          type: string
          example: '886253'
          title: private_id
    Mandate-Initiation-Request-Merchant:
      title: Merchant
      type: object
      required:
        - private_id
        - account
      properties:
        name:
          description: |-
            Merchant Name 
            - For Brazil this parameter is mandatory with max length 140
          minLength: 1
          maxLength: 140
          type: string
          example: Amazon Inc
          title: name
        private_id:
          description: >-
            Merchant Tax or Legal Entity Id 

            - For Brazil this parameter is mandatory, individual person tax
            identification (CPF) allowed length = 11 or business entity tax
            identification (CNPJ) allowed length = 14
          minLength: 1
          maxLength: 35
          type: string
          example: ABC123456789
          title: private_id
        account:
          title: merchant account
          description: Account Details
          required:
            - bank_id
          properties:
            bank_id:
              description: |-
                Merchant bank's network identification 
                - For Brazil this parameter is mandatory with max length 8
              minLength: 1
              maxLength: 35
              type: string
              example: CITIBRSP
              title: bank_id
            number:
              description: |-
                Merchant's bank account number 
                - For Brazil this parameter is mandatory with max length 10
              minLength: 1
              maxLength: 35
              type: string
              example: '123456789'
              title: number
    Mandate-Cancellation-Request:
      type: object
      title: Mandate Cancellation Request
      required:
        - mandate
      properties:
        mandate:
          $ref: '#/components/schemas/Mandate-Cancellation-Request-Mandate'
    Mandate-Cancellation-Request-Mandate:
      type: object
      title: Mandate
      required:
        - reason_code
        - request_id
        - country_code
      properties:
        reason_code:
          description: >-
            Reason due to which mandate is being cancelled 

            - For Brazil this is mandatory parameter with the allowed values:
            SLCR - Cancellation requested by receiver, SJUD - Cancellation by
            court order, OTHS - Other reasons
          type: string
          enum:
            - SLCR
            - SJUD
            - OTHS
          example: SLCR
          title: reason_code
        id:
          description: >-
            Unique ID to identify the mandate 

            - For Brazil this parameter is mandatory with min & max length 29
            with format RRxxxxxxxxyyyyMMddBRkkkkkkkkk received during mandate
            initiation
          minLength: 1
          maxLength: 35
          type: string
          example: RR3347902320251109BRF12345678
          title: id
        request_id:
          description: >-
            Unique ID assigned to identify request made on the mandate 

            - For Brazil this parameter is mandatory with max length 29 in
            format 'IC33479023yyyyMMddkkkkkkkkkkk', where First two characters
            will be 'IC', '33479023' is merchant bank code, 'yyyyMMdd' is
            mandate cancellation date, 'kkkkkkkkkkk' are unique alphanumeric
            characters
          minLength: 1
          maxLength: 35
          type: string
          example: IC3347902320251109REF12345678
          title: request_id
        country_code:
          description: Country code
          enum:
            - BR
          example: BR
          type: string
          title: country_code
    Payment-Response:
      type: object
      title: Payment Response
      properties:
        id:
          type: string
          maxLength: 128
          description: Unique reference number
          example: pay02052023456r
          title: id
        status:
          type: string
          maxLength: 10
          description: The transaction has successfully been created.
          enum:
            - CREATED
          example: CREATED
          title: status
        description:
          type: string
          maxLength: 200
          description: more information about the status
          example: The transaction has successfully been created
          title: description
    Tokens-Response:
      type: object
      title: Tokens Response
      properties:
        id:
          type: string
          maxLength: 128
          description: Unique reference number
          example: pay02052023456r
          title: id
        status:
          type: string
          maxLength: 10
          description: The request has successfully been created.
          enum:
            - CREATED
          example: CREATED
          title: status
        description:
          type: string
          maxLength: 200
          description: more information about the status
          example: The request has successfully been created
          title: description
    Mandate-Initiation-Response:
      type: object
      title: Mandate Initiation Response
      properties:
        mandate_request_id:
          type: string
          maxLength: 128
          description: Unique Id assigned to identify request made on the mandate
          example: SC3347902320251109REF12345678
          title: mandate_request_id
        status:
          type: string
          maxLength: 10
          description: Request status
          example: CREATED
          title: status
        description:
          type: string
          maxLength: 200
          description: More information about the status
          example: Mandate Request has been received and it is in progress.
          title: description
    Mandate-Cancellation-Response:
      type: object
      title: Mandate Cancellation Response
      properties:
        mandate_request_id:
          type: string
          maxLength: 128
          description: Unique Id assigned to identify request made on the mandate
          example: IC3347902320251109REF12345678
          title: mandate_request_id
        mandate_id:
          type: string
          maxLength: 128
          description: Unique Id assigned to identify request made on the mandate
          example: RR3347902320251109BRF12345678
          title: mandate_id
        status:
          type: string
          maxLength: 10
          description: Request status
          example: CREATED
          title: status
        description:
          type: string
          maxLength: 200
          description: More information about the status
          example: Mandate Request has been received and it is in progress.
          title: description
    Payment-Qr-Failed:
      type: object
      title: Payment QR Failed
      properties:
        transaction:
          type: object
          title: Payment QR Failed Transaction
          properties:
            id:
              maxLength: 128
              minLength: 1
              type: string
              description: >-
                Unique Transaction identification provided by the merchant
                during transaction creation 

                - transaction.id parameter is mandatory for all transaction type
                creation   

                - For Brazil QR Creation - Maximum length is 35.
              example: pay02052023456r
              title: id
            status:
              type: string
              enum:
                - SYSTEM_ERROR
                - FAILED
              description: >-
                Transaction Status 

                - SYSTEM_ERROR - Internal system error occurred processing the
                transaction
              title: status
            description:
              type: string
              maxLength: 200
              description: |-
                Transaction Status Description 
                - SETTLED - Transaction settled
              example: Transaction settled
              title: description
    Payment-Credit-Notification:
      type: object
      title: Payment Credit Notification
      required:
        - transaction
      properties:
        customer:
          $ref: '#/components/schemas/Customer-Notification'
        sender:
          $ref: '#/components/schemas/Sender-Notification'
        merchant:
          $ref: '#/components/schemas/Merchant-Notification'
        receiver:
          $ref: '#/components/schemas/Receiver-Notification'
        method:
          $ref: '#/components/schemas/Method-Notification'
        transaction:
          $ref: '#/components/schemas/Transaction-Notification'
        order:
          $ref: '#/components/schemas/Order-Notification'
        mandate:
          $ref: '#/components/schemas/Mandate-Notification'
      additionalProperties: false
      description: Payment Notification
    Payment-Cancelled-Notification:
      type: object
      title: Payment Cancelled Notification
      properties:
        transaction:
          type: object
          title: PC_transaction
          properties:
            id:
              maxLength: 128
              minLength: 1
              type: string
              description: >-
                Unique Transaction identification provided by the merchant
                during transaction creation 

                - transaction.id parameter is mandatory for all transaction type
                creation   

                - For Brazil QR Creation transaction.id parameter should be of
                length between 26 to 35 and allowed datatype is Alphanumeric and
                should not be filled with spaces or zeroes
              example: pay02052023456r
              title: id
            status:
              type: string
              enum:
                - CANCELLED
              description: |-
                Transaction Status 
                - CANCELLED - Transaction cancelled
              title: status
            description:
              type: string
              maxLength: 200
              description: |-
                Transaction Status Description  
                - CANCELLED - Transaction cancelled 
              example: Transaction cancelled
              title: description
    Payment-Link-Notification:
      type: object
      title: Payment Link Notification
      properties:
        transaction:
          type: object
          title: PL_transaction
          properties:
            id:
              description: >-
                Unique Transaction identification provided by the merchant
                during  transaction creation 

                - For Brazil QR Creation transaction.id parameter should be of
                length between 26 to 35 and allowed datatype is Alphanumeric and
                should not be filled with spaces or zeroes 

                - For CARD operations transaction.id parameter allowed maxmium
                length is 40. 

                - For UK PAYBYBANK creation transaction.id parameter allowed
                maxmium length is 18.
              example: pay02052023456r
              maxLength: 128
              minLength: 1
              type: string
              title: id
            amount:
              description: >-
                Transaction amount 
                 - For Brazil QR Creation decimal values are mandatory for transaction.amount and it must have 2 digits 
                 - For Brazil QR Creation maxmium amount limit is 9999999999.99 and transaction.amount parameter is mandatory 
                - For CARD Capture operation transaction.amount parameter is
                mandatory and allowed max 2 decimal after dot. 
                 - For UK PAYBYBANK Creation transaction.amount parameter is mandatory, maxmium amount limit is 1000000.00 and allowed max 2 decimal after dot.
              example: 200
              maximum: 1000000000000000000
              minimum: 0.01
              type: number
              title: amount
            currency_code:
              description: >-
                ISO 4217 Currency Code for instance  USD/GBP/EUR 

                - transaction.currency_code parameter is mandatory for all
                transaction type creation
              enum:
                - GBP
              example: GBP
              type: string
              title: currency_code
            status:
              type: string
              maxLength: 20
              description: >-
                Transaction Status, following status you will receive in
                response 

                - PENDING - Pending action from customer 

                - FAILED- Transaction failed for invalid payload
              example: PENDING
              title: status
            reason_code:
              description: Transaction rejection Code
              example: SC0020
              maxLength: 100
              minLength: 1
              type: string
              title: reason_code
            description:
              type: string
              maxLength: 200
              description: >-
                Transaction Status, following status you will receive in
                response 

                - PENDING - Pending action from customer 

                - FAILED- Transaction failed for invalid payload
              example: Transaction declined by the payment processor
              title: description
            creation_date_time:
              type: string
              format: date-time
              description: >-
                GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

                - Instant Payment (Debit) - Date time, generated by CitiConnect
                API, when CitiConnect API accepted a payment initiation after
                validation 

                - Instant Payment (Credit) - Date time, either provided by the
                debtor bank or generated by Citi's transaction processing
                application, when a transaction was created
              example: '2022-09-13T08:23:49.114Z'
              title: creation_date_time
            reference:
              description: |-
                Transaction additional information.  
                 - For UK PAYBYBANK Creation reference parameter is optional and allowed maximum length is 128
              example: REPAY
              maxLength: 250
              minLength: 1
              type: string
              title: reference
            redirect_url:
              type: string
              maxLength: 500
              description: >-
                The URL to which you must redirect the payer's browser to
                complete the payment when using the payment provider's website.
              example: https://greenzone-api.uat.nam.nsroot.net/api/notification
              title: redirect_url
            psp_reference:
              type: string
              maxLength: 36
              minLength: 1
              description: >-
                Payment session id generated by Banked (third party system).
                Will be present in case of link creation being successful 
                 - For UK PAYBYBANK Creation payment_session_field parameter is mandatory for success link creation.
              example: PAY1234567
              title: psp_reference
            expiry_time:
              description: Expiration time for QR collection, specified in seconds.
              example: 3600
              format: int32
              minimum: 10
              type: integer
              title: expiry_time
        Order:
          title: Order
          properties:
            id:
              description: >-
                A unique identifier for this order to distinguish it from any
                other order you create.
              example: OR123456789
              maxLength: 40
              minLength: 1
              type: string
              title: id
    Payment-Failed-Notification:
      type: object
      title: Payment Failed Notification
      properties:
        transaction:
          type: object
          title: PF_transaction
          properties:
            id:
              description: >-
                Unique Transaction identification provided by the merchant
                during  transaction creation 

                - For Brazil QR Creation transaction.id parameter should be of
                length between 26 to 35 and allowed datatype is Alphanumeric and
                should not be filled with spaces or zeroes 

                - For CARD operations transaction.id parameter allowed maxmium
                length is 40. 

                - For UK PAYBYBANK creation transaction.id parameter allowed
                maxmium length is 18.
              example: pay02052023456r
              maxLength: 128
              minLength: 1
              type: string
              title: id
            end_to_end_id:
              maxLength: 35
              minLength: 1
              type: string
              description: >-
                Unique identification assigned by the initiating party to
                unambiguously identify the transaction. This identification is
                passed on, unchanged, throughout the entire end-to-end chain. 

                - This parameter is optional for Brazil QR PIX transaction
              example: pay02052023456r
              title: end_to_end_id
            amount:
              description: >-
                Transaction amount 
                 - For Brazil QR Creation decimal values are mandatory for transaction.amount and it must have 2 digits 
                 - For Brazil QR Creation maxmium amount limit is 9999999999.99 and transaction.amount parameter is mandatory 
                - For CARD Capture operation transaction.amount parameter is
                mandatory and allowed max 2 decimal after dot. 
                 - For UK PAYBYBANK Creation transaction.amount parameter is mandatory, maxmium amount limit is 1000000.00 and allowed max 2 decimal after dot.
              example: 200
              maximum: 1000000000000000000
              minimum: 0.01
              type: number
              title: amount
            currency_code:
              description: >-
                ISO 4217 Currency Code for instance  USD/GBP/EUR 

                - transaction.currency_code parameter is mandatory for all
                transaction type creation
              enum:
                - GBP
              example: GBP
              type: string
              title: currency_code
            status:
              type: string
              maxLength: 20
              description: >-
                Transaction Status, following status you will receive in
                response 

                - PENDING - Pending action from customer 

                - FAILED- Transaction failed for invalid payload
              example: PENDING
              title: status
            description:
              type: string
              maxLength: 200
              description: >-
                Transaction Status, following status you will receive in
                response 

                - PENDING - Pending action from customer 

                - FAILED- Transaction failed for invalid payload
              example: Transaction declined by the payment processor
              title: description
            creation_date_time:
              type: string
              format: date-time
              description: >-
                GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

                - Instant Payment (Debit) - Date time, generated by CitiConnect
                API, when CitiConnect API accepted a payment initiation after
                validation 

                - Instant Payment (Credit) - Date time, either provided by the
                debtor bank or generated by Citi's transaction processing
                application, when a transaction was created
              example: '2022-09-13T08:23:49.114Z'
              title: creation_date_time
            reference:
              description: |-
                Transaction additional information.  
                 - For UK PAYBYBANK Creation reference parameter is optional and allowed maximum length is 128
              example: REPAY
              maxLength: 250
              minLength: 1
              type: string
              title: reference
            retry_possible:
              description: >-
                Identifier to indicate if the payment journey has ended or
                further retries are possibility Y - indicates that a retry is
                possible on the same link N - indicates no further retry is
                possible on this link
              enum:
                - 'Y'
                - 'N'
              example: 'Y'
              type: string
              title: retry_possible
            psp_reference:
              type: string
              maxLength: 36
              minLength: 1
              description: >-
                Payment session id generated by Banked (third party system).
                Will be present in case of link creation being successful 
                 - For UK PAYBYBANK Creation payment_session_field parameter is mandatory for success link creation.
              example: PAY1234567
              title: psp_reference
    Payment-Notification:
      type: object
      title: Payment Notification
      properties:
        customer:
          type: object
          title: Customer
          properties:
            id:
              description: Merchant internal customer ID.
              example: 1234abcjki
              maxLength: 40
              minLength: 1
              type: string
              title: id
            name:
              $ref: '#/components/schemas/Name'
            tax_id:
              description: >-
                Customer's payer identification (e.g., email address) 

                - For Brazil PIX Initiation, this parameter is mandatory,
                individual person tax identification (CPF) allowed length = 11
                or business entity tax identification (CNPJ) allowed length = 14
              example: 234.453.678-21
              maxLength: 100
              minLength: 1
              type: string
              title: tax_id
            email:
              description: |-
                Customer email 
                 - For UK PAYBYBANK creation, customer.email parameter is mandatory.
              example: customer.raj2024@gmail.com
              type: string
              pattern: '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$'
              title: email
            phone:
              description: Customer phone.
              example: '+919962125789'
              pattern: \+[0-9]{1,3}[-\ ][0-9()+\-]{1,30}
              type: string
              title: phone
            device:
              $ref: '#/components/schemas/Customer-Device'
            address:
              $ref: '#/components/schemas/Address'
        authentication:
          title: ' Authentication Sub Response'
          required:
            - channel
            - method_completed
            - method_supported
            - requestor_id
            - requestor_name
            - accept_versions
            - version
          properties:
            acs_eci:
              description: >-
                Electronic Commerce Indicator (ECI) value provided by the
                issuer's ACS.
              example: '56'
              maxLength: 2
              minLength: 1
              type: string
              title: acs_eci
            token:
              description: >-
                The base64 encoded value generated by the issuer
                (CAVV/AAV/AEVV/Authentication Value).
              example: '56'
              maxLength: 32
              minLength: 28
              type: string
              title: token
            3ds_transaction_id:
              description: >-
                A unique identifier for the 3-D Secure authentication
                transaction (XID for v1, DS ID for v2).
              example: '56'
              maxLength: 50
              minLength: 1
              type: string
              title: 3ds_transaction_id
            server_transaction_id:
              description: >-
                Unique identifier assigned by the 3DS Server
                (threeDSServerTransID).
              example: '56'
              maxLength: 50
              minLength: 1
              type: string
              title: server_transaction_id
            acs_transaction_id:
              description: >-
                A unique transaction identifier assigned by the Access Control
                Server (ACS).
              example: '56'
              maxLength: 36
              minLength: 36
              type: string
              title: acs_transaction_id
            scheme:
              description: >-
                The EMV 3DS authentication scheme used (e.g., MADA, MASTERCARD,
                VISA) for externally authenticated transactions.
              example: CART123456
              maxLength: 50
              minLength: 2
              type: string
              title: scheme
            custom:
              description: >-
                Additional information returned by the scheme or issuer in the
                authentication response.
              example: '56'
              maxLength: 4000
              minLength: 1
              type: string
              title: custom
            directory_server_id:
              description: >-
                Unique identifier for the Directory Server (RID) for in-app
                authentication.
              example: CART123456
              maxLength: 10
              minLength: 10
              type: string
              title: directory_server_id
            directory_server_reference:
              description: >-
                Reference number assigned to the Directory Server (DS) by EMV
                Co.
              example: '56'
              maxLength: 32
              minLength: 1
              type: string
              title: directory_server_reference
            directory_transaction_id:
              description: >-
                A unique transaction identifier assigned by the scheme Directory
                Server.
              example: '56'
              maxLength: 50
              minLength: 1
              type: string
              title: directory_transaction_id
            method_completed:
              description: >-
                Indicates if the issuer's ACS completed the method call to
                obtain browser info.
              type: boolean
              example: true
              title: method_completed
            method_supported:
              description: Indicates if the issuer's ACS supports the method call protocol.
              enum:
                - NOT_SUPPORTED
                - SUPPORTED
              example: NOT_SUPPORTED
              type: string
              title: method_supported
            protocol_version:
              description: The version of the EMV 3-D Secure protocol used (e.g., 2.1.0).
              example: CART123456
              maxLength: 20
              minLength: 1
              type: string
              title: protocol_version
            requestor_id:
              description: >-
                The unique identifier assigned to the merchant by the card
                scheme directory server for 3DS2.
              example: CART123456
              maxLength: 20
              minLength: 1
              type: string
              title: requestor_id
            requestor_name:
              description: >-
                The unique name assigned to the merchant by the card scheme
                directory server for 3DS2.
              example: CART123456
              maxLength: 40
              minLength: 1
              type: string
              title: requestor_name
            accept_versions:
              type: array
              items:
                type: string
                description: >-
                  A comma separated list of the forms of payer authentication
                  that you will accept.
                title: accept_versions
            channel:
              description: >-
                Indicates the channel in which the authentication request is
                initiated.
              enum:
                - MERCHANT_REQUESTED
                - PAYER_APP
                - PAYER_BROWSER
              example: MERCHANT_REQUESTED
              type: string
              title: channel
            method:
              description: The method that the issuer will use to authenticate the payer.
              enum:
                - DYNAMIC
                - OUT_OF_BAND
                - STATIC
              example: STATIC
              type: string
              title: method
            purpose:
              description: >-
                Indicates the context in which payer authentication is
                requested.
              enum:
                - ADD_CARD
                - AGREEMENT_CANCELLATION
                - MAINTAIN_CARD
                - PAYMENT_TRANSACTION
                - REFRESH_AUTHENTICATION
              example: ADD_CARD
              type: string
              title: purpose
            method_post_data:
              description: >-
                Base64 URL encoded frame contents to be posted to the method URL
                for risk assessment.
              example: https://greenzone-api.uat.nam.nsroot.net/api/notification
              maxLength: 100
              minLength: 1
              type: string
              title: method_post_data
            method_url:
              type: string
              maxLength: 500
              minLength: 1
              description: >-
                The URL provided by the issuer to which the method post data
                must be sent.
              example: https://greenzone-api.uat.nam.nsroot.net/api/notification
              title: method_url
            redirect_html:
              type: string
              maxLength: 40960
              minLength: 1
              description: >-
                The URL provided by the issuer to which the method post data
                must be sent.
              example: https://greenzone-api.uat.nam.nsroot.net/api/notification
              title: redirect_html
            version:
              description: >-
                Indicates the available payer authentication method or NONE if
                unavailable.
              enum:
                - 3DS2
                - RUPAY
                - PASSKEY
                - NONE
              example: RUPAY
              type: string
              title: version
            line_of_business:
              description: >-
                Identifier for different lines of business configured in the
                merchant profile.
              example: CART123456
              maxLength: 100
              minLength: 1
              type: string
              title: line_of_business
            sdk:
              $ref: '#/components/schemas/Sdk-Payer-Authentication-Response'
            status_reason_code:
              description: >-
                A code indicating the reason for the transaction status (EMVCo
                specification).
              example: '56'
              maxLength: 2
              minLength: 2
              type: string
              title: status_reason_code
            status:
              description: >-
                Indicates the result of payer authentication with the issuer
                (e.g., Y, N, U, A, R).
              example: 'Y'
              maxLength: 1
              minLength: 1
              type: string
              title: status
            acs_reference:
              description: Reference number assigned to the issuer's ACS by EMV Co.
              example: AFT123456
              maxLength: 32
              minLength: 1
              type: string
              title: acs_reference
            amount:
              description: Transaction amount
              example: 200
              maximum: 1000000000000000000
              minimum: 0.01
              type: number
              title: amount
            payer_interaction:
              description: >-
                Indicates if payer interaction was used to complete the
                authentication process.
              enum:
                - NOT_POSSIBLE
                - NOT_REQUIRED
                - REQUIRED
              example: NOT_REQUIRED
              type: string
              title: payer_interaction
            payment_exemption:
              description: Indicates why this payment qualifies for an SCA exemption.
              enum:
                - AUTO
                - LOW_RISK
                - LOW_VALUE_PAYMENT
                - TRUSTED_MERCHANT
                - MERCHANT_INITIATED_TRANSACTION
                - RECURRING_PAYMENT
                - SECURE_CORPORATE_PAYMENT
              example: TRUSTED_MERCHANT
              type: string
              title: payment_exemption
            trusted_merchant_status:
              description: >-
                Indicates if the payer has added you to their list of trusted
                merchants for this card.
              enum:
                - NOT_ON_LIST
                - ON_LIST
              example: ON_LIST
              type: string
              title: trusted_merchant_status
            redirect_domain_name:
              type: string
              maxLength: 253
              minLength: 1
              description: >-
                The domain name of the site where payer authentication was
                performed (e.g., ACS domain name).
              example: https://greenzone-api.uat.nam.nsroot.net/api/notification
              title: redirect_domain_name
            status_code:
              type: string
              maxLength: 100
              minLength: 1
              description: >-
                Indicates the status of payer authentication with the issuer
                (e.g., NPCI BEPG status code).
              example: '500'
              title: status_code
            status_description:
              type: string
              maxLength: 1024
              minLength: 1
              description: >-
                Indicates the status of payer authentication with the issuer
                (e.g., NPCI BEPG status code).
              example: '500'
              title: status_description
            time:
              type: string
              format: date-time
              description: >-
                Date and time of the payer authentication being performed
                (YYYY-MM-DDThh:mm:ss.SSSZ).
              example: '2022-09-13T08:23:49.114Z'
              title: time
            transaction_id:
              description: >-
                Identifier used by the acquirer to identify the transaction.
                This identifier may be used by the acquirer in settlement
                reports.
              example: ACQ7894561
              maxLength: 100
              minLength: 1
              type: string
              title: transaction_id
        transaction:
          type: object
          title: PN_transaction
          properties:
            id:
              description: >-
                Unique Transaction identification provided by the merchant
                during transaction creation 

                - transaction.id parameter is mandatory for all transaction type
                creation   

                - For Brazil QR Creation transaction.reference parameter should
                be of length between 26 to 35 and allowed datatype is
                Alphanumeric and should not be filled with spaces or zeroes 

                - For CARD Authorize operation transaction.id parameter is
                mandatory 

                - For CARD Capture operation transaction.id parameter is
                mandatory 

                - For CARD Pay operation transaction.id parameter is mandatory 

                - For CARD Verify operation transaction.id parameter is
                mandatory 

                - For ACH Pay and Verify transaction, transaction.id parameter
                is mandatory
              example: pay02052023456r
              maxLength: 128
              minLength: 1
              type: string
              title: id
            amount:
              description: >-
                Transaction amount 
                 - For Brazil QR Creation decimal values are mandatory for transaction.amount and it must have 2 digits 
                 - For Brazil QR Creation maxmium amount limit is 9999999999.99 and transaction.amount parameter is mandatory
                - For CARD Authorize operation transaction.amount parameter is
                mandatory 

                - For CARD Capture operation transaction.amount parameter is
                mandatory 

                - For CARD Pay operation transaction.amount parameter is
                mandatory 

                - For CARD Verify operation transaction.amount parameter is
                mandatory 

                - For ACH Pay and Verify transaction, transaction.amount
                parameter is mandatory 

                - For Brazil PIX cancellation, this parameter is mandatory with
                18 digits including 2 decimals.
              example: 200
              maximum: 1000000000000000000
              minimum: 0.01
              type: number
              title: amount
            country_code:
              description: Country code
              enum:
                - US
                - BR
                - GB
                - IN
                - TH
                - AU
                - CA
                - MX
                - DE
                - NL
                - IE
                - IT
                - FR
                - ES
                - HK
                - SG
                - NZ
                - DK
                - 'NO'
                - SE
                - SW
                - BE
                - FI
                - CH
                - CZ
                - AT
                - PT
              example: BR
              type: string
              title: country_code
            currency_code:
              description: >-
                ISO 4217 Currency Code for instance  USD/GBP/EUR 

                - transaction.currency_code parameter is mandatory for all
                transaction type creation
              enum:
                - BRL
                - USD
                - GBP
                - INR
                - EUR
                - CAD
                - HKD
                - AUD
                - SGD
                - DKK
                - NOK
                - SEK
                - PLN
                - IDR
                - MYR
                - THB
                - CHF
                - PHP
                - CZK
              example: BRL
              type: string
              title: currency_code
            product_info:
              type: array
              items:
                $ref: '#/components/schemas/Product-Info'
            expiry_time:
              description: Expiration time for QR collection, specified in seconds.
              example: 3600
              format: int32
              minimum: 10
              type: integer
              title: expiry_time
            status:
              type: string
              maxLength: 20
              description: >-
                Transaction Status, following status you will receive in
                response 

                - CREATED - The transaction has successfully been created 

                - PENDING - Transaction pending action from customer 

                - AUTHORIZED - Authorization approved 

                - CAPTURED - Transaction fully captured 

                - CAPTURED_PARTIALLY - Transaction partially captured 

                - CANCELLED - Transaction cancelled 

                - DECLINED - Transaction declined by the payment processor 

                - REJECTED - Request rejected after business logic check 

                - SYSTEM_ERROR- Internal system error occurred processing the
                transaction 

                - FAILED - Transaction failed for invalid payload 

                - SETTLED - Transaction settled 

                - SUCCESS - The operation was successfully processed 

                - UNKNOWN - The result of the operation is unknown
              example: SUCCESS
              title: status
            description:
              type: string
              maxLength: 256
              description: >-
                Transaction Status, following status you will receive in
                response 

                - CREATED - The transaction has successfully been created 

                - PENDING - Transaction pending action from customer 

                - AUTHORIZED - Authorization approved 

                - CAPTURED - Transaction fully captured 

                - CAPTURED_PARTIALLY - Transaction partially captured  

                - CANCELLED - Transaction cancelled 

                - DECLINED - Transaction declined by the payment processor 

                - REJECTED - Request rejected after business logic check 

                - SYSTEM_ERROR- Internal system error occurred processing the
                transaction 

                - FAILED - Transaction failed for invalid payload 

                - SETTLED - Transaction settled 

                - SUCCESS - The operation was successfully processed 

                - UNKNOWN - The result of the operation is unknown
              example: Transaction declined by the payment processor
              title: description
            redirect_url:
              type: string
              maxLength: 500
              description: >-
                The URL to which you must redirect the payer's browser to
                complete the payment when using the payment provider's website.
              example: https://greenzone-api.uat.nam.nsroot.net/api/notification
              title: redirect_url
            creation_date_time:
              type: string
              format: date-time
              description: >-
                GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

                - Instant Payment (Debit) - Date time, generated by CitiConnect
                API, when CitiConnect API accepted a payment initiation after
                validation 

                - Instant Payment (Credit) - Date time, either provided by the
                debtor bank or generated by Citi's transaction processing
                application, when a transaction was created 

                - For ACH PAY and Verify transaction, order.creation_date_time
                parameter is mandatory 

                - For Brazil PIX, this parameter is mandatory
              example: '2022-09-13T08:23:49.114Z'
              title: creation_date_time
            update_time:
              type: string
              format: date-time
              description: >-
                Indicates the date and time the gateway considers the order to
                have last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

                - Instant Payment (Debit) - Date time, generated by CitiConnect
                API, when CitiConnect API accepted a payment initiation after
                validation 

                - Instant Payment (Credit) - Date time, either provided by the
                debtor bank or generated by Citi's transaction processing
                application, when a transaction was created 

                - For ACH PAY and Verify transaction, order.update_time
                parameter is mandatory
              example: '2022-09-13T08:23:49.114Z'
              title: update_time
            psp_reference:
              type: string
              maxLength: 36
              minLength: 1
              description: >-
                Payment session id generated by Banked (third party system).
                Will be present in case of link creation being successful 
                 - For UK PAYBYBANK Creation payment_session_field parameter is mandatory for success link creation.
              example: PAY1234567
              title: psp_reference
            type:
              description: Indicates the type of action performed on the order.
              enum:
                - AUTHENTICATION
                - AUTHORIZATION
                - AUTHORIZATION_UPDATE
                - CAPTURE
                - CHARGEBACK
                - DISBURSEMENT
                - FUNDING
                - PAYMENT
                - REFUND
                - REFUND_REQUEST
                - VERIFICATION
                - VOID_AUTHORIZATION
                - VOID_CAPTURE
                - VOID_PAYMENT
                - VOID_REFUND
              example: VERIFICATION
              type: string
              title: type
            reference:
              description: An optional identifier for this transaction
              example: REPAY789541
              maxLength: 250
              minLength: 1
              type: string
              title: reference
            authorization_code:
              description: >-
                Value generated by the issuing bank in response to a proposal to
                transfer funds
              example: AUTH123456
              maxLength: 100
              minLength: 1
              type: string
              title: authorization_code
            acquirer:
              $ref: '#/components/schemas/Acquirer-Request'
            terminal:
              description: >-
                Identifier used by the acquirer to identify the transaction.
                This identifier may be used by the acquirer in settlement
                reports.
              example: ACQ7894561
              maxLength: 16
              minLength: 1
              type: string
              title: terminal
            retrieval_reference_number:
              description: >-
                When a transaction registration succeeds, the value of this
                parameter contains the 44-digit number that was used to create
                the bar code on the Boleto slip. This bar code can then be
                scanned by the vendor if a payer elects to pay Boleto at a
                registered location.
              example: ACQ7894561
              maxLength: 100
              minLength: 1
              type: string
              title: retrieval_reference_number
            reason_code:
              description: >-
                Transaction rejection Code 

                - For Brazil PIX, this parameter is mandatory with max length 4,
                expected values are ACCT, BLCK, CCLD, FAIL, OTHR, SLBD & SLCR
              example: SC0020
              maxLength: 10
              minLength: 1
              type: string
              title: reason_code
            authorization_response:
              $ref: '#/components/schemas/Authorization-Response'
            response:
              $ref: '#/components/schemas/Response'
            receipt:
              description: >-
                When a transaction registration succeeds, the value of this
                parameter contains the 44-digit number that was used to create
                the bar code on the Boleto slip. This bar code can then be
                scanned by the vendor if a payer elects to pay Boleto at a
                registered location.
              example: MSG12345
              maxLength: 100
              minLength: 1
              type: string
              title: receipt
            additional_response_data:
              description: >-
                A 47-digit number the payer can use to make a Boleto
                payment.When a transaction registration succeeds, the value of
                this parameter contains the 44-digit number that was used to
                create the bar code on the Boleto slip. This bar code can then
                be scanned by the vendor if a payer elects to pay Boleto at a
                registered location.If the transaction registration fails, this
                parameter contains an error code and a description in key-value
                pair format.
              example: MSG12345
              maxLength: 4000
              minLength: 1
              type: string
              title: additional_response_data
            status_date_time:
              format: date-time
              type: string
              description: >-
                Date & Time when Payer bank provided their response GMT (ISO
                8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

                - This parameter is mandatory for Brazil PIX
              example: '2022-09-13T08:23:49.114Z'
              title: status_date_time
        method:
          type: object
          title: Payment Notification Method
          properties:
            card:
