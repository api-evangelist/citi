          type: string
          title: payment_exemption
        redirect_url:
          type: string
          maxLength: 500
          description: The URL to which you want to redirect the payer after completing the payer authentication process.This will be a URL on your website, with the URL encoded as defined in RFC3986. This means special characters such spaces, hyphens, etc must be encoded.
