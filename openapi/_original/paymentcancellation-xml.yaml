        allOf:
          - $ref: '#/definitions/ActiveOrHistoricCurrencyAndAmount'
      DscntApldAmt:
        type: array
        description: >-
          Amount of discount to be applied to the amount due and payable to the
          creditor.
        items:
          $ref: '#/definitions/DiscountAmountAndType1'
      CdtNoteAmt:
