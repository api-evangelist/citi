    Pix:
      type: object
      title: Pix
      required:
        - endToEndId
        - valor
        - horario
      properties:
        endToEndId:
          $ref: '#/components/schemas/EndToEndId'
        txid:
          allOf:
            - $ref: '#/components/schemas/TxId'
            - pattern: '[a-zA-Z0-9]{1,35}'
        valor:
          type: string
          title: Valor do Pix.
          pattern: \d{1,10}\.\d{2}
          description: Pix value.
        componentesValor:
          type: object
          title: Informações sobre o valor do Pix
          description: >-
            The purpose of this framework is to explain the compositional
            elements of the Pix value.


            Structure rules:

            - The `value` of the Pix is ​​equal to the sum of the `value` fields
            of the substructures that make up this structure;

            - There cannot be simultaneously a substructure of the `draw` type
            and another of the `change` type;

            - There is no restriction on the order of substructures.


            In case of withdrawal with withdrawal, you can return
             `original` with value=0.00 (zero) since the sum will be respected, or you can omit
              the `original` substructure. In the case of change the `original` substructure will always be present.

            #### Valid examples:

            Example of valid completions.


            - **immediate collection (without cash withdrawal or change)**
              ```
              ...
              "componentesValor": [
               {
               "tipo": "ORIGINAL",
               "valor": "100.00"
               }
               ]
              ...
              ```
            - **Immediate collection with cash withdrawal**
              ```
              ...
              "componentesValor": [
               {
               "tipo": "SAQUE",
               "valor": "100.00"
               } 
               ]
              ...
              ```
            - **Immediate collection with cash withdrawal (it may show
            type=ORIGINAL and value=0.00)**
               ```
               ...
               "componentesValor": [
               {
               "tipo": "ORIGINAL",
               "valor": "0.00"
               },
               {
               "tipo": "SAQUE",
               "valor": "100.00"
               }
              ]
              ...
              ```
            - **Immediate collection with change**
             ```
             ...
             "componentesValor": [
             {
             "tipo": "ORIGINAL",
             "valor": "80.00"
             },
             {
             "tipo": "TROCO",
             "valor": "20.00"
             }
             ]
             ...
             ```
             - **Immediate collection with change (the order does not matter)**
             ```
             ...
             "componentesValor": [
             {
             "tipo": "TROCO",
             "valor": "20.00"
             },
             {
             "tipo": "ORIGINAL",
             "valor": "80.00"
             }
             ]
             ...
             ```
            #### Invalid examples:
             Non-exhaustive examples, of invalid completions.
             - **`ORIGINAL` with value higher than 0.00 (zero) and `SAQUE` together**
             ```
             ...
             "componentesValor": [
             {
             "tipo": "ORIGINAL",
             "valor": "80.00"
             },
             {
             "tipo": "SAQUE",
             "valor": "20.00"
             }
             ]
             ...
             ```
             - **two `SAQUE` elements**
             ```
             ...
             "componentesValor": [
             {
             "tipo": "SAQUE",
             "valor": "20.00"
             },
             {
             "tipo": "SAQUE",
             "valor": "10.00"
             }
             ]
             ...
             ```
             - **Immediate collection with `SAQUE` and `TROCO`**
             ```
             ...
             "componentesValor": [
             {
             "tipo": "ORIGINAL",
             "valor": "60.00"
             },
             {
             "tipo": "SAQUE",
             "valor": "20.00"
             },
             {
             "tipo": "TROCO",
             "valor": "20.00"
             }
             ]
             ...
             ```
          anyOf:
            - $ref: '#/components/schemas/PixValorOriginal'
            - $ref: '#/components/schemas/PixValorSaque'
            - $ref: '#/components/schemas/PixValorTroco'
            - $ref: '#/components/schemas/PixValorJuros'
            - $ref: '#/components/schemas/PixValorMulta'
            - $ref: '#/components/schemas/PixValorAbatimento'
            - $ref: '#/components/schemas/PixValorDesconto'
        chave:
          type: string
          title: Chave DICT do recebedor
          description: >
            # Creditor DICT alias


            * Creditor alias field as assigned in the respective PACS008.

            * Aliases types can be: phone, email, cpf/cnpj or EVP.

            * The format of the aliases can be found in the section "Formatting
            DICT aliases in BR Code" of the [Pix Initiation Standards
            Manual](https://www.bcb.gov.br/estabilidadefinanceira/pix).
          maxLength: 77
        horario:
          type: string
          format: date-time
          title: Horário
          description: Time the Pix was processed on the PSP.
        infoPagador:
          type: string
          title: Informação livre do pagador
          maxLength: 140
        devolucoes:
          type: array
          title: Devoluções
          items:
            $ref: '#/components/schemas/Devolucao'
    PixValorOriginal:
      type: object
      properties:
        original:
          type: object
          required:
            - valor
          properties:
            valor:
              type: string
              title: Valor original
              description: Original Pix value.
              pattern: \d{1,10}\.\d{2}
    PixValorSaque:
      type: object
      properties:
        saque:
          type: object
          required:
            - valor
            - modalidadeAgente
            - prestadorDoServicoDeSaque
          properties:
            valor:
              type: string
              title: Pix Cashout Value
              description: PixValor do Saque Pix
              pattern: \d{1,10}\.\d{2}
            modalidadeAgente:
              type: string
              title: AgentModalidade do Agente
              description: >
                ##### Agent Type

                <table><tr><th>ACRONYM</th><th>Description</th></tr><tr><td>AGTEC</td><td>Business
                Establishment Agent</td></tr ><tr><td>AGTOT</td><td>Other Type
                of Legal Entity Agent</td></tr><tr><td>AGPSS</td><td>Agent
                Withdrawal Service Provider< /td></tr></table>
              enum:
                - AGTEC
                - AGTOT
                - AGPSS
            prestadorDoServicoDeSaque:
              type: string
              title: Prestador do Serviço de Saque
              pattern: \d{8}
              description: Withdrawal Service Provider ISPB
    PixValorTroco:
      type: object
      properties:
        troco:
          type: object
          required:
            - valor
            - modalidadeAgente
            - prestadorDoServicoDeSaque
          properties:
            valor:
              type: string
              title: Valor do Troco Pix
              description: Amount of Change Pix.
              pattern: \d{1,10}\.\d{2}
            modalidadeAgente:
              type: string
              title: Modalidade do Agente
              description: >
                ##### Agent Type

                <table><tr><th>ACRONYM</th><th>Description</th></tr><tr><td>AGTEC</td><td>Business
                Establishment Agent</td></tr ><tr><td>AGTOT</td><td>Other Type
                of Legal Entity Agent</td></tr><tr><td>AGPSS</td><td>Agent
                Withdrawal Service Provider< /td></tr></table>
              enum:
                - AGTEC
                - AGTOT
                - AGPSS
            prestadorDoServicoDeSaque:
              type: string
              title: Prestador do Serviço de Saque
              pattern: \d{8}
              description: Withdrawal Service Provider ISPB
    Devolucao:
      type: object
      title: Devolução
      required:
        - id
        - rtrId
        - valor
        - horario
        - status
      properties:
        id:
          $ref: '#/components/schemas/DevolucaoId'
        rtrId:
          type: string
          title: RtrId
          description: ReturnIdentification transiting PACS004.
          example: D12345678202009091000abcde123456
          pattern: '[a-zA-Z0-9]{32}'
          minLength: 32
          maxLength: 32
        valor:
          type: string
          title: Valor a devolver.
          pattern: \d{1,10}\.\d{2}
          description: Amount to return.
        natureza:
          $ref: '#/components/schemas/DevolucaoNatureza'
        descricao:
          type: string
          title: Mensagem ao pagador relativa à devolução.
          maxLength: 140
          description: >-
            The optional `description` field determines a text to be displayed
            to the payer containing information about the return. This text will
            be filled in, in pacs.004, by the recipient's PSP, in the field
            RemittanceInformation. The field size in pacs.004 is limited to 140
            characters.
        horario:
          type: object
          properties:
            solicitacao:
              type: string
              format: date-time
              title: Horário de solicitação
              description: Time at which the return was requested on the PSP.
            liquidacao:
              type: string
              format: date-time
              title: Horário de liquidacao
              description: Time the return was settled on the PSP.
        status:
          type: string
          title: Status
          description: Return status.
          enum:
            - EM_PROCESSAMENTO
            - DEVOLVIDO
            - NAO_REALIZADO
        motivo:
          type: string
          title: Descrição do status.
          description: >
            # Return Status


            Optional field that can be used by the receiving PSP to detail the
            reasons

            the return has reached the status in question.

            It can be used, for example, to detail the reason why the return was
            not carried out.
          maxLength: 140
    Violacao:
      type: object
      title: Violações
      properties:
        razao:
          type: string
          title: Descrição do erro
          description: Error description
          example: Valor da cobrança não pode ser 0.00
        propriedade:
          type: string
          title: Nome da propriedade
          description: Property name
          example: cob.chave
        valor:
          type: string
          title: Valor da propriedade
          description: Property Value
          example: '061996671234'
    Paginacao:
      type: object
      title: Paginação
      required:
        - paginaAtual
        - itensPorPagina
        - quantidadeDePaginas
        - quantidadeTotalDeItens
      properties:
        paginaAtual:
          type: integer
          title: Página atual
          description: Retrieved page number.
          minimum: 0
        itensPorPagina:
          type: integer
          title: Itens por página
          description: Number of records returned on the page.
          minimum: 1
        quantidadeDePaginas:
          type: integer
          title: Quantidade de páginas
          description: Number of pages available for consultation.
          minimum: 1
        quantidadeTotalDeItens:
          type: integer
          title: Quantidade total de itens
          description: >-
            Total amount of items available according to the parameters
            informed.
          minimum: 0
    Problema:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: Reference URI identifying the type of issue. As per RFC 7807.
          example: https://pix.bcb.gov.br/api/v2/error/NaoEncontrado
        title:
          type: string
          description: A short description of the problem.
          example: Not found
        status:
          type: integer
          description: HTTP code of status returned.
          example: 404
        detail:
          type: string
          description: Full description of the problem.
        correlationId:
          type: string
          description: Issue correlation identifier for support purposes
        violacoes:
          type: array
          items:
            $ref: '#/components/schemas/Violacao'
  parameters:
