            startDate</li><li>startDate and endDate can be up to 36 months
             in the past from the day of report requested and not future date</li></ul></li><li>Visa:<ul><li>startDate and endDate cannot be more than 90 days apart</li><li>If endDate is more than 90 days after startDate, it will be automatically reset to exactly 90 days after startDate</li><li>startDate and endDate can be up to 6 months
