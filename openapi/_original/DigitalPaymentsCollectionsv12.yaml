    Rfp-Notification:
      type: object
      title: Payment RFP Notification
      required:
        - method
        - transaction
        - merchant
      properties:
        method:
          $ref: '#/components/schemas/Rfp-Method-Notification'
        transaction:
          $ref: '#/components/schemas/Rfp-Transaction-Notification'
        customer:
          $ref: '#/components/schemas/Rfp-Customer-Notification'
        merchant:
          $ref: '#/components/schemas/Rfp-Merchant-Notification'
        sender:
          $ref: '#/components/schemas/Rfp-Sender-Notification'
        receiver:
          $ref: '#/components/schemas/Rfp-Receiver-Notification'
        response_rfp:
          $ref: '#/components/schemas/Rfp-Response-Rfp-Notification'
        mandate:
          $ref: '#/components/schemas/Rfp-Mandate-Notification'
    Rfp-Method-Notification:
      type: object
      title: RFP Method Notification
      properties:
        type:
          description: |-
            Method specified by the customer for the transaction  
            - Provide RTP for US RFP 
            - Provide PIX for Brazil RFP
          type: string
          enum:
            - RTP
            - PIX
          example: RTP
          title: type
    Rfp-Transaction-Notification:
      type: object
      title: RFP Transaction Notification
      required:
        - status
        - description
        - uetr
      properties:
        id:
          description: >-
            Unique Transaction identification provided by the merchant during 
            transaction creation 

            - For US RFP this parameter is mandatory with max length 35 

            - For Brazil PIX, this is mandatory parameter with min length 26 &
            max length 35
          example: pay02052023456r
          maxLength: 128
          minLength: 1
          type: string
          title: id
        uetr:
          type: string
          pattern: >-
            ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          description: |-
            UUID v4 format unique end-to-end transaction reference 
            - This parameter is madnatory for US RFP 
            - For Brazil PIX, this is mandatory parameter
          example: 4f09214d-296c-494b-8e9c-810bf1d9fc93
          title: uetr
        creation_date_time:
          type: string
          format: date-time
          description: >-
            GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

            - Instant Payment (Debit) - Date time, generated by CitiConnect API,
            when CitiConnect API accepted a payment initiation after validation 

            - Instant Payment (Credit) - Date time, either provided by the
            customer bank or generated by Citi's transaction processing
            application, when a transaction was created 

            - For Brazil PIX, this is mandatory parameter
          title: creation_date_time
        value_date:
          type: string
          format: date
          description: |-
            Value Date Format is YYYY-MM-DD. 
            - For US RFP this parameter is mandatory
          title: value_date
        expiry_date:
          type: string
          format: date
          description: |-
            Expiry Date Format is YYYY-MM-DD 
            - For US RFP this parameter is mandatory
          title: expiry_date
        update_flag:
          description: >-
            Indicator if the exact amount indicated in amount must be paid, or
            if under/over payment is permitted.

            - For QR Creation (ex. Brazil), during transaction processing if the
            merchant want to allow his client to change QR Amount then the value
            should be Y otherwise default value will be N 

            - For US RFP, if Y then Amount may be modified by the customer, if N
            then Amount of payment must equal the Instructed Amount.If no value
            passed, default behavior is same as Y
          enum:
            - 'Y'
            - 'N'
          example: 'Y'
          type: string
          title: update_flag
        amount:
          description: >-
            Transaction amount 

            - For US RFP, this parameter is mandatory with maximum amount limit
            1000000.00. 

            - For Brazil PIX initiation, this parameter is mandatory with 18
            digits including 2 decimals. 
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        currency_code:
          description: >-
            ISO 4217 Currency Code for instance USD/GBP/EUR 

            - transaction.currency_code parameter is mandatory for all
            transaction type creation
          enum:
            - BRL
            - USD
            - GBP
          example: BRL
          type: string
          title: currency_code
        country_code:
          description: >-
            The order country 

            - transaction.country_code parameter is mandatory for all
            transaction type creation
          enum:
            - US
            - BR
            - GB
          example: US
          type: string
          title: country_code
        full_amount:
          type: number
          minimum: 0.01
          maximum: 100000000000000000
          description: |-
            Amount that is the gross amount payable by client 
            - For US RFP transaction, this parameter is optional
          title: full_amount
        discount_amount:
          type: number
          minimum: 0.01
          maximum: 100000000000000000
          description: >-
            Amount that is the discount from the gross amount 

            - Optional for US RFP.If populated, message.transaction.full_amount
            must also be popluated.
          title: discount_amount
        purpose:
          $ref: '#/components/schemas/Purpose'
        remittance_info:
          type: array
          description: >-
            Unstructured remittance information 
             - For US RFP, transaction.remittance_info parameter is optional and only one(1) line of 140 characters is allowed. 
            - For Brazil PIX initiation, this parameter is optional and only
            one(1) line of 140 characters is allowed.
          items:
            $ref: '#/components/schemas/Unstructured'
          title: remittance_info
        reference:
          type: string
          maxLength: 35
          minLength: 1
          description: >-
            Reference Id 

            - For US RFP, this parameter will contain the unique reference
            (instruction) id with max length 35
          title: reference
        network_id:
          type: string
          maxLength: 35
          minLength: 1
          description: |-
            Network ID 
            - This parameter is mandatory for US RFP with max length 35
          title: network_id
        network:
          type: string
          enum:
            - RTP
            - FDN
          description: >-
            Financial market infrastructure or clearing system (e.g., RTP
            Network in the United States)
          title: network
        status:
          type: string
          maxLength: 20
          description: |-
            Transaction Status, following status you will receive in response 
            - WAIT_CONFIRMATION - Transaction awaiting confirmation from user 
            - PENDING_SETTLEMENT - Transaction accepted settlement in process 
            - SETTLED - Transaction settled 
            - FAILED - 'rejection code - rejection description' 
          example: SETTLED
          title: status
          enum:
            - WAIT_CONFIRMATION
            - PENDING_SETTLEMENT
            - SETTLED
            - FAILED
        description:
          type: string
          maxLength: 256
          description: |-
            Transaction Status, following status you will receive in response 
            - WAIT_CONFIRMATION - Transaction awaiting confirmation from user 
            - PENDING_SETTLEMENT - Transaction accepted settlement in process 
            - SETTLED - Transaction settled 
            - FAILED - 'rejection code - rejection description'
          title: description
        reason_code:
          maxLength: 10
          minLength: 1
          type: string
          description: |-
            Transaction reason code 
            - For Brazil PIX this parameter is mandatory with max length 4
          example: AGND
          title: reason_code
        status_date_time:
          format: date-time
          type: string
          description: >-
            Date & Time when Payer bank provided their response GMT (ISO 8601
            YYYY-MM-DDTHH:MM:SS.sssZ) 

            - This parameter is mandatory for Brazil PIX
          example: '2022-09-13T08:23:49.114Z'
          title: status_date_time
        holiday_flag:
          description: Specifies if a request should consider holiday
          type: boolean
          example: true
          title: holiday_flag
    Rfp-Customer-Notification:
      type: object
      title: RFP Customer Notification
      properties:
        account:
          title: customer account
          description: Account Details
          properties:
            number:
              maxLength: 40
              minLength: 1
              type: string
              description: |-
                Customer's bank account 
                - For US RFP this parameter is mandatory with max length 40
              example: '1122334455'
              title: number
            bank_id:
              maxLength: 35
              minLength: 1
              type: string
              description: |-
                Customer bank's network identification 
                - For US RFP this parameter is mandatory with max length 16 
                - For ACH, length is equal to 0
              example: CITIIN77
              title: bank_id
            name:
              maxLength: 70
              minLength: 1
              type: string
              description: |-
                Customer's Account Name 
                - For US RFP transaction, this parameter is optional 
              title: name
        name:
          $ref: '#/components/schemas/Name'
        organization_id:
          description: >-
            Customer Organization Id/ Legal Entity as provided at the time of
            payment request.

            - For US RFP max length is 20
          example: ORG123456
          maxLength: 35
          minLength: 1
          type: string
