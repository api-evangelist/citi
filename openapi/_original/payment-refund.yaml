  gateway: datapower-gateway
  assembly:
    execute:
      - operation-switch:
          title: operation-switch
          case:
            - operations:
                - verb: post
                  path: /txrefund
              execute:
                - switch:
                    title: switch
                    case:
                      - condition: >-
                          ((apim.getvariable('message.headers.content-type')).includes('xml'))
                        execute:
                          - proxy:
                              title: proxy
                              timeout: 60
                              verb: keep
                              cache-response: protocol
                              cache-ttl: 900
                              version: 1.0.0
                              tls-profile: citiconnect-ssl-profile
                              target-url: $(BE-Services)
                      - condition: >-
                          ((apim.getvariable('message.headers.content-type')).includes('json'))
                        execute:
                          - proxy:
                              title: proxy
                              timeout: 60
                              verb: keep
                              cache-response: protocol
                              cache-ttl: 900
                              version: 1.0.0
                              tls-profile: citiconnect-ssl-profile
                              target-url: $(RESTEndpt)
                    version: 1.0.0
      - activity-log:
          title: activity-log
          content: header
          error-content: header
          version: 1.0.0
    catch: []
  categories:
    - 'operation: Enhanced Payment Status Inquiry'
    - 'operation: Payment Status Inquiry'
    - 'operation: Payment Initiation'
