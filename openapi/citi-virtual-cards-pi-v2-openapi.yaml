openapi: 3.0.0
info:
  description: Virtual Card Create, Modify, Cancel request.
  version: 2.0.0
  title: VCA Life Cycle Management for Payment Intermediaries
  x-ibm-name: vca-life-cycle-management-for-payment-intermediaries
  contact:
    name: GLOBAL Commercial Cards API Production support
    email: >-
      dl.icg.global.commercial.cards.digital.production.support@imcap.ap.ssmb.com
servers:
  - url: https://tts.apib2b.citi.com/tts/cards/vca/v2/pi
    description: Base URL for the API
tags:
  - name: VcaPiController
    description: Using this API we can create, modify and cancel virtual cards
security:
  - ClientCredentials:
      - /api
paths:
  /create:
    post:
      tags:
        - VcaPiController
      operationId: create
      summary: >-
        Create VCA for secure purchasing. It allows you to place a VCA creation
        request, with increased Transaction-Level Controls,  limit card number
        use by MCC, amounts, dates and even specific suppliers
      description: >-
        Create a virtual card and set its associated spending controls, custom
        reference data and payment beneficiaries. It allows you to place a a
        virtual card account creation request for secure purchasing, with
        increased transaction-Level controls, limit card number use by MCC,
        amounts, dates and even specific suppliers.<br/><br/>Note: In a Create
        VCA Request call for a Mastercard program, you must specify at least one
        instance of whichever velocity control the purchase template that is
        setup in the VCA application contains. Other controls are optional in
        the API request to Citi, even if they are included in the purchase
        template that is setup in the VCA application. If you indicate that you
        would like to use an optional control by sending the enable flag as
        TRUE, you have to specify all parameters listed in the control section
        unless otherwise specified, else, the API request will be rejected.
      parameters:
        - name: Authorization
          in: header
          description: 'OAuth2 Bearer token. Format: Bearer {access_token}'
          required: true
          schema:
            type: string
        - name: country
          in: header
          description: country of the Client
          required: true
          schema:
            type: string
        - name: region
          in: header
          description: region of the client(Apac/EMEA/NAM)
          required: true
          schema:
            type: string
        - name: req-sys-id
          in: header
          required: true
          description: >-
            Client Unique id to identify the particular request.<br> `Format`:
            UUID <br> `Example`: 123d837e-958a-4e9f-bc97-4843ec948123
          schema:
            type: string
      requestBody:
        required: true
        description: client request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VcaCreateRequest'
            examples:
              Mastercard:
                summary: VCA Create - Mastercard Sample Request
                value:
                  fundingSourceId: '15016'
                  fundingSourceName: GRACE RCN 1
                  programId: '431341'
                  messageId: 908c090d1995490eb3b431a1f37356df
                  templateId: 23358
                  expiryDate: '112026'
                  currencyCode: '008'
                  currencyType: B
                  timeZone: UTC+10:00
                  getCardImage: false
                  paymentBeneficiaryId: 19180
                  paymentBeneficiaryEmails:
                    - abcd.efgh@citi.com
                  customReference:
                    - customReferenceLabel: Invoice No.
                      customReferenceValue: '1234'
                    - customReferenceLabel: Cost Center
                      customReferenceValue: NAM Hub
                    - customReferenceLabel: Department
                      customReferenceValue: Marketing
                  mccGrouping:
                    - All MCCs
                  enableAgingVelocityControl: true
                  authorizationHoldDays: 5
                  cumulativeSpendLimit: 2000
                  enableSpendVelocityControl: false
                  spendVelocity:
                    - cumulativeSpendLimit: 2000
                      maxAuth: 5
                      periodType: D
                  enableCurfewControl: true
                  curfewTime:
                    startTime: '12:30'
                    endTime: '13:30'
                    weekdaysEffective:
                      - MON
                  enableTimeOfDayControl: false
                  timeOfDay:
                    - startTime: '12:30'
                      endTime: '13:30'
                      weekdayEffective: MON
                    - startTime: '13:30'
                      endTime: '14:30'
                      weekdayEffective: TUE
                  enableValidityPeriodControl: true
                  validityStartDate: '2026-06-16'
                  validityEndDate: '2026-06-17'
                  enableAmountRangeControl: true
                  minAmount: 1000.01
                  maxAmount: 2000.01
              Visa:
                summary: VCA Create - Visa Sample Request
                value:
                  fundingSourceId: GBP2145
                  programId: '918'
                  messageId: KS08736V2Create20260226131411
                  currencyCode: '752'
                  currencyType: M
                  timeZone: UTC+05:30
                  customReference:
                    - customReferenceLabel: Invoice No.
                      customReferenceValue: '1234'
                    - customReferenceLabel: Cost Center
                      customReferenceValue: NAM Hub
                    - customReferenceLabel: Department
                      customReferenceValue: Marketing
                  mccGrouping:
                    - ECOM
                    - ATM
                  enableSpendVelocityControl: true
                  spendVelocity:
                    - cumulativeSpendLimit: 300000
                      maxAuth: 1
                      periodType: '3'
                  enableValidityPeriodControl: true
                  validityStartDate: '2026-12-10'
                  validityEndDate: '2026-12-25'
                  enableAmountRangeControl: true
                  minAmount: 1000.1
                  maxAmount: 10000.1
                  enableTransactionLimitControl: false
                  amountLimit: 1000.1
                  enableTimeOfDayControl: true
                  timeOfDay:
                    - startTime: '10:00'
                      endTime: '11:00'
                      weekdayEffective: MON
                  enableGeographyControl: true
                  countryCodes:
                    - USA
                    - ZMB
                    - ZWE
                    - SWZ
                  allowed: false
                  enableMerchantIdControl: true
                  merchantId:
                    allowed: true
                    merchantIds:
                      - cardAcceptorId: '1234560'
                        acquirerId: '132412'
                      - cardAcceptorId: '1234561'
                        acquirerId: '1324121'
                      - cardAcceptorId: '1234561'
                        acquirerId: '1324112'
      responses:
        '200':
          description: Create Virtual Card Acknowledgement response
          headers:
            api-transactionId:
              description: Citi Commercial Cards API Tracking ID
              schema:
                type: string
            messageId:
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImmediateAckResponse'
              examples:
                Success:
                  summary: VCA Create - Immediate Acknowledgement Response
                  value:
                    messageId: 908c090d1995490eb3b431a1f37356df
                    status: Request accepted successfully
        '400':
          description: Invalid Virtual Card request
          headers:
            api-transactionId:
              description: Citi Commercial Cards API Tracking ID
              schema:
                type: string
            messageId:
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VcaCreateFailureResponse'
              examples:
                ValidationError:
                  summary: VCA Create - Validation Error Response
                  value:
                    programId: '431341'
                    messageId: 908c090d1995490eb3b431a1f37356df
                    errors:
                      - errorCode: EVB0222
                        errorDescription: messageId cannot be null
                InvalidFundingSource:
                  summary: VCA Create - Invalid Funding Source Error
                  value:
                    programId: '431341'
                    messageId: 908c090d1995490eb3b431a1f37356df
                    errors:
                      - errorCode: EVB0604
                        errorDescription: fundingSourceId provided in the request is not active.
        '401':
          description: Unauthorized Virtual Card request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnAuthorizedResponse'
        '405':
          description: Method Not Allowed
          headers:
            api-transactionId:
              description: Citi Commercial Cards API Tracking ID
              schema:
                type: string
            messageId:
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowedResponse'
        '500':
          description: Internal Server Error
          headers:
            api-transactionId:
              description: Citi Commercial Cards API Tracking ID
              schema:
                type: string
            messageId:
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VcaCreateFailureResponse'
  /modify:
    post:
      tags:
        - VcaPiController
      operationId: modify
      summary: >-
        Modify VCA for secure purchasing. It allows you to place a VCA update
        request,to alter Transaction-Level Controls,  limit card number use by
        MCC, amounts, dates and even specific suppliers
      description: >-
        Modify a virtual card and set its associated spending controls, custom
        reference data and payment beneficiaries. It allows you to place a a
        virtual card account update request for secure purchasing, to alter
        transaction-Level controls, limit card number use by MCC, amounts, dates
        and even specific suppliers.<br/><br/>Note: In a Create VCA Request call
        for a Mastercard program, you must specify at least one instance of
        whichever velocity control the purchase template that is setup in the
        VCA application contains. Other controls are optional in the API request
        to Citi, even if they are included in the purchase template that is
        setup in the VCA application. If you indicate that you would like to use
        an optional control by sending the enable flag as TRUE, you have to
        specify all parameters listed in the control section unless otherwise
        specified, else, the API request will be rejected. payments
      parameters:
        - name: Authorization
          in: header
          description: 'OAuth2 Bearer token. Format: Bearer {access_token}'
          required: true
          schema:
            type: string
        - name: country
          in: header
          description: country of the Client
          required: true
          schema:
            type: string
        - name: region
          in: header
          description: region of the client(Apac/EMEA/NAM)
          required: true
          schema:
            type: string
        - name: req-sys-id
          in: header
          required: true
          description: >-
            Client Unique id to identify the particular request.<br> `Format`:
            UUID <br> `Example`: 123d837e-958a-4e9f-bc97-4843ec948123
          schema:
            type: string
      requestBody:
        required: true
        description: client request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VcaModifyRequest'
            examples:
              Mastercard:
                summary: VCA Modify - Mastercard Sample Request
                value:
                  vcaId: 7890123456789
                  fundingSourceId: '15016'
                  fundingSourceName: GRACE RCN 1
                  programId: '431341'
                  messageId: a1b2c3d4e5f6789012345678abcdef12
                  templateId: 23358
                  expiryDate: '122026'
                  currencyCode: '008'
                  currencyType: B
                  timeZone: UTC+10:00
                  getCardImage: false
                  paymentBeneficiaryId: 19180
                  paymentBeneficiaryEmails:
                    - abch.efgh@citi.com
                  customReference:
                    - customReferenceLabel: Invoice No.
                      customReferenceValue: '5678'
                    - customReferenceLabel: Cost Center
                      customReferenceValue: APAC Hub
                  mccGrouping:
                    - All MCCs
                  modifyAgingVelocityControl: true
                  authorizationHoldDays: 10
                  cumulativeSpendLimit: 5000
                  modifySpendVelocityControl: false
                  spendVelocity:
                    - cumulativeSpendLimit: 5000
                      maxAuth: 10
                      periodType: M
                  modifyCurfewControl: true
                  curfewTime:
                    startTime: '08:00'
                    endTime: '18:00'
                    weekdaysEffective:
                      - MON
                      - TUE
                      - WED
                  modifyTimeOfDayControl: false
                  modifyValidityPeriodControl: true
                  validityStartDate: '2026-07-01'
                  validityEndDate: '2026-12-31'
                  modifyAmountRangeControl: true
                  minAmount: 500
                  maxAmount: 5000
              Visa:
                summary: VCA Modify - Visa Sample Request
                value:
                  vcaId: 5678901234567
                  fundingSourceId: GBP2145
                  programId: '918'
                  messageId: KS08736V2Modify20260603101500
                  currencyCode: '752'
                  currencyType: M
                  timeZone: UTC+05:30
                  customReference:
                    - customReferenceLabel: Invoice No.
                      customReferenceValue: '9999'
                    - customReferenceLabel: Cost Center
                      customReferenceValue: EMEA Hub
                  modifySpendVelocityControl: true
                  spendVelocity:
                    - cumulativeSpendLimit: 500000
                      maxAuth: 5
                      periodType: '2'
                  modifyValidityPeriodControl: true
                  validityStartDate: '2026-07-01'
                  validityEndDate: '2027-01-31'
                  modifyAmountRangeControl: true
                  minAmount: 2000
                  maxAmount: 20000
                  modifyGeographyControl: true
                  countryCodes:
                    - USA
                    - GBR
                  allowed: true
      responses:
        '200':
          description: Modify Virtual Card response
          headers:
            api-transactionId:
              description: Citi Commercial Cards API Tracking ID
              schema:
                type: string
            messageId:
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VcaModifyResponse'
              examples:
                Mastercard:
                  summary: VCA Modify - Mastercard Sample Response
                  value:
                    vcaId: '7890123456789'
                    virtualCardAccountNumber: '5412345678901234'
                    securityCode: '123'
                    expiryDate: '122026'
                    programId: '431341'
                    messageId: a1b2c3d4e5f6789012345678abcdef12
                    currencyCode: '008'
                    currencyType: B
                    timeZone: UTC+10:00
                    paymentBeneficiaryId: 19180
                    paymentBeneficiaryEmails:
                      - abcd.efgh@citi.com
                    customReference:
                      - customReferenceLabel: Invoice No.
                        customReferenceValue: '5678'
                      - customReferenceLabel: Cost Center
                        customReferenceValue: APAC Hub
                    templateId: 23358
                    mccGrouping:
                      - All MCCs
                    modifyAgingVelocityControl: true
                    authorizationHoldDays: 10
                    cumulativeSpendLimit: 5000
                    modifySpendVelocityControl: false
                    modifyCurfewControl: true
                    curfewTime:
                      startTime: '08:00'
                      endTime: '18:00'
                      weekdaysEffective:
                        - MON
                        - TUE
                        - WED
                    modifyTimeOfDayControl: false
                    modifyValidityPeriodControl: true
                    validityStartDate: '2026-07-01'
                    validityEndDate: '2026-12-31'
                    modifyAmountRangeControl: true
                    minAmount: 500
                    maxAmount: 5000
                Visa:
                  summary: VCA Modify - Visa Sample Response
                  value:
                    vcaId: '5678901234567'
                    virtualCardAccountNumber: '4012345678901234'
                    securityCode: '456'
                    expiryDate: '122025'
                    programId: '918'
                    messageId: KS08736V2Modify20260603101500
                    currencyCode: '752'
                    currencyType: M
                    timeZone: UTC+05:30
                    customReference:
                      - customReferenceLabel: Invoice No.
                        customReferenceValue: '9999'
                      - customReferenceLabel: Cost Center
                        customReferenceValue: EMEA Hub
                    modifySpendVelocityControl: true
                    spendVelocity:
                      - cumulativeSpendLimit: 500000
                        maxAuth: 5
                        periodType: '2'
                        availableBalance: 500000
                    modifyValidityPeriodControl: true
                    validityStartDate: '2026-07-01'
                    validityEndDate: '2027-01-31'
                    modifyAmountRangeControl: true
                    minAmount: 2000
                    maxAmount: 20000
                    modifyGeographyControl: true
                    countryCodes:
                      - USA
                      - GBR
                    allowed: true
        '400':
          description: Invalid Modify Virtual Card request
          headers:
            api-transactionId:
              description: Citi Commercial Cards API Tracking ID
              schema:
                type: string
            messageId:
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VcaModifyFailureResponse'
        '401':
          description: Unauthorized Modify Virtual Card request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnAuthorizedResponse'
        '405':
          description: Method Not Allowed
          headers:
            api-transactionId:
              description: Citi Commercial Cards API Tracking ID
              schema:
                type: string
            messageId:
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowedResponse'
        '500':
          description: Internal Server Error
          headers:
            api-transactionId:
              description: Citi Commercial Cards API Tracking ID
              schema:
                type: string
            messageId:
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VcaModifyFailureResponse'
  /cancel:
    post:
      tags:
        - VcaPiController
      operationId: cancel
      summary: >-
        Cancel VCA allows to turn a VCA to in-active status, in-order to suspend
        any payment requests
      description: >-
        Cancel VCA allows to turn a VCA to in-active status, in-order to suspend
        any payment requests
      parameters:
        - name: Authorization
          in: header
          description: 'OAuth2 Bearer token. Format: Bearer {access_token}'
          required: true
          schema:
            type: string
        - name: country
          in: header
          description: country of the Client
          required: true
          schema:
            type: string
        - name: region
          in: header
          description: region of the client(Apac/EMEA/NAM)
          required: true
          schema:
            type: string
        - name: req-sys-id
          in: header
          required: true
          description: >-
            Client Unique id to identify the particular request.<br> `Format`:
            UUID <br> `Example`: 123d837e-958a-4e9f-bc97-4843ec948123
          schema:
            type: string
      requestBody:
        required: true
        description: client request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VcaCancelRequest'
            examples:
              SingleCancel:
                summary: VCA Cancel - Single VCA Cancel Request
                value:
                  vcaIds:
                    - 7890123456789
                  programId: '431341'
                  messageId: c4d5e6f7a8b9012345678901abcdef34
              BulkCancel:
                summary: VCA Cancel - Bulk Cancel Request (Mastercard only)
                value:
                  vcaIds:
                    - 7890123456789
                    - 7890123456790
                    - 7890123456791
                  programId: '431341'
                  messageId: d5e6f7a8b9c0123456789012bcdef345
              VisaCancel:
                summary: VCA Cancel - Visa Cancel Request
                value:
                  vcaIds:
                    - 5678901234567
                  virtualCardAccountNumber: '4012345678901234'
                  programId: '918'
                  messageId: KS08736V2Cancel20260603120000
      responses:
        '200':
          description: Cancel Virtual Card response
          headers:
            api-transactionId:
              description: Citi Commercial Cards API Tracking ID
              schema:
                type: string
            messageId:
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VcaCancelResponse'
              examples:
                Success:
                  summary: VCA Cancel - Success Response
                  value:
                    programId: '431341'
                    messageId: c4d5e6f7a8b9012345678901abcdef34
                    vcaResponse:
                      - programId: '431341'
                        vcaId: 7890123456789
        '400':
          description: Invalid Cancel Virtual Card request
          headers:
            api-transactionId:
              description: Citi Commercial Cards API Tracking ID
              schema:
                type: string
            messageId:
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VcaCancelFailureResponse'
        '401':
          description: Unauthorized Virtual Card request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnAuthorizedResponse'
        '405':
          description: Method Not Allowed
          headers:
            api-transactionId:
              description: Citi Commercial Cards API Tracking ID
              schema:
                type: string
            messageId:
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowedResponse'
        '500':
          description: Internal Server Error
          headers:
            api-transactionId:
              description: Citi Commercial Cards API Tracking ID
              schema:
                type: string
            messageId:
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VcaCancelFailureResponse'
components:
  securitySchemes:
    ClientCredentials:
      type: oauth2
      description: OAuth 2.0 Client Credentials flow for API authentication
      flows:
        clientCredentials:
          tokenUrl: https://tts.apib2b.citi.com/tts/api/v1/oauth2/token
          scopes:
            /api: ''
  schemas:
    VcaCancelRequest:
      required:
        - vcaIds
        - programId
        - messageId
      type: object
      title: VcaCancelRequest
      properties:
        vcaIds:
          type: array
          description: Unique Identifier for each Virtual card request.
          items:
            type: number
        virtualCardAccountNumber:
          type: string
          description: >-
            The virtual card account number for which the modifications are
            requested.
        programId:
          type: string
          description: >-
            Unique ID of the company record defined in the virtual cards
            platform.<br/><br/>Mastercard - This value is returned in the ID
            Provisioning API. This value is generated when the VCA program is
            onboarded to Mastercard's VCA platform.<br/><br/>Visa - This value
            is generated when the VCA program is onboarded to Visa's VCA
            platform
        messageId:
          type: string
          description: >-
            Unique ID of the API message sent. The messageId will be provided
            back in the corresponding response. The ID can be used for
            investigation and troubleshooting. The ID must be unique per
            integration.
    ErrorMessage:
      type: object
      title: ErrorMessage
