  parameters:
    If-Match:
      name: If-Match
      in: header
      description: >-
        This header will contain the Etag of the resource representation to be
        manipulate. If the server ETag value does not match with the provided
        ETag value, the error response 412 - precondition fail will be returned.
        This signifies the resource is out of date.
      required: false
      style: simple
      explode: false
      schema:
        type: string
      example: f88dd058fe004909615a64f01be66a7
    pagination-offset:
      name: offset
      in: query
      description: >-
        Specifies the offset / starting point in the list of all available
        items, starting from which results will be returned. The numeric offset
        identifies the page token, allowing users to advance to the next page in
        the collection. The value 0 (zero) identifies the first page of entry.
      required: false
      style: form
      explode: false
      schema:
        minimum: 0
        type: integer
        default: 0
      example: 0
    pagination-limit:
      name: limit
      in: query
      description: >-
        The maximum number of items to return in a page. If unspecified, the
        default limit will be returned. If the limit specified is greater than
        the maximum permitted by the API, the API will return the maximum
        permitted limit. Each API should define *maximum and *default limit.
      required: false
      style: form
      explode: false
      schema:
        maximum: 100
        minimum: 1
        type: integer
        default: 25
      example: 25
    X-Request-ID:
      name: X-Request-ID
      in: header
      description: >-
        Specify an unique end to end tracking request ID. The element will be
        populated by the Citi API gateway
      required: false
      style: simple
      explode: false
      schema:
        type: string
      x-requiredByAPIGateway: true
      x-requiredByServiceProvider: true
    X-UserContext:
      name: X-UserContext
      in: header
      description: >-
        Provides requester entitlement information to service provider. A JWT
        containing a claim representing the entitlements of the API consumer as
        defined at the Citi Identity Provider. This header is provided by the
        Citi API Gateway and is not required to be provided by the API consumer.
      required: false
      style: simple
      explode: false
      schema:
        type: string
      example: >-
        eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIiLCJuYW1lIjoiIiwiaWF0IjowfQ.u_kftAUkjiUZO-OhIyj24H7lOUk1wi9GUF-e14JmCtQ
    X-BIC:
      name: X-BIC
      in: header
      description: >-
        Specify the BIC of the provider of the service. The identification will
        be used by the API Gateway to forward the request to service provider.
      required: true
      style: simple
      explode: false
      schema:
        type: string
      example: DEUTDEFF
    application-reference:
      name: application-reference
      in: path
      description: >
        An unique and unambiguous identification of the Trade Finance
        Undertaking Application as assigned by the origin server. The value must
        be constant throughout the lifecycle of the application. On successful
        creation, the application can be retrieved using the application
        reference. This identification shall be used as a resource identifier
        for all state transition.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
      example: 123e456-e89b-12d3-a456-426614174000
    undertaking-identification:
      name: undertaking-identification
      in: query
      description: >
        Globally unique identification of the Trade Finance Undertaking
        application. The value must be constant throughout the lifecycle of the
        account. This identification shall be used as a unique reference to
        support application lifecycle to support interoperability between API
        and other channel.


        Usage: The undertaking-identification must not be used in conjunction
        with any other filter criteria. The anticipation is that the value is
        unique to retrieve a specific application by the reference.
      required: false
      style: form
      explode: false
      schema:
        maxLength: 16
        minLength: 1
        type: string
      example: BGREQ30122022-01
    applicant-issuance-request-identification:
      name: applicant-issuance-request-identification
      in: query
      description: >
        Unique business reference of the Issuance Request, assigned by the
        applicant.


        Usage: The undertaking-identification must not be used in conjunction
        with any other filter criteria. The anticipation is that the value is
        unique to retrieve a specific application by the reference.
      required: false
      style: form
      explode: false
      schema:
        maxLength: 16
        minLength: 1
        type: string
      example: XYZ999-123
    application-date:
      name: application-date
      in: query
      description: >
        Date on which the applicant lodge the application for issuance of Trade
        Finance Undertaking. Expressed in the YYYY-MM-DD format. The date cannot
        be in the future.


        Usage: The application-date must not be used in conjunction with
        application-from-date or application-to-date or issuance-date.
      required: false
      style: form
      explode: false
      schema:
        pattern: >-
          ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)(?:Z|[+-][01]\d:[0-5]\d)?$
        type: string
    application-from-date:
      name: application-from-date
      in: query
      description: >
        Date on which the applicant lodge the application for issuance of Trade
        Finance Undertaking. Expressed in the YYYY-MM-DD format. The date cannot
        be in the future.


        Usage: The application-date must be used in conjunction with
        application-to-date. When used in conjunction with the
        application-to-date, the endpoint returns the application where the
        application date fall within that period.
      required: false
      style: form
      explode: false
      schema:
        pattern: >-
          ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)(?:Z|[+-][01]\d:[0-5]\d)?$
        type: string
      example: '2023-05-22'
    application-to-date:
      name: application-to-date
      in: query
      description: >
        Date on which the applicant lodge the application for issuance of Trade
        Finance Undertaking. Expressed in the YYYY-MM-DD format. The date cannot
        be in the future.


        Usage: The application-date must not be used in conjunction with
        application-from-date. When used in conjunction with the
        application-from-date, the endpoint returns the application where the
        application date fall within that period.
      required: false
      style: form
      explode: false
      schema:
        pattern: >-
          ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)(?:Z|[+-][01]\d:[0-5]\d)?$
        type: string
      example: '2023-05-23'
    issuance-date:
      name: issuance-date
      in: query
      description: >-
        Date on which the Trade Finance Undertaking is issued by the issuing
        bank. Expressed in the YYYY-MM-DD format. The date cannot be in the
        future.
      required: false
      style: form
      explode: false
      schema:
        pattern: >-
          ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)(?:Z|[+-][01]\d:[0-5]\d)?$
        type: string
    application-lifecycle-status:
      name: application-lifecycle-status
      in: query
      description: >
        Specifies the state of a Trade Finance Undertaking in its processing
        cycle.


        Type of Trade Finance Undertaking status, in a codified form
          
          * AMRQ  - Trade Finance Undertaking Amendment Request
          * APPL  - Trade Finance Undertaking Application
          * APLA  - Trade Finance Undertaking Application Issuance Advice
          * CANC  - Trade Finance Undertaking Application Cancelled
          * EXPI  - Trade Finance Undertaking Application Expired
          * RELE  - Trade Finance Undertaking Application Released
          * RJCT  - Trade Finance Undertaking Application Rejected
          * UNTN  - Trade Finance Undertaking Termination Notice
      required: false
      style: form
      explode: false
      schema:
        type: string
      example: APLA
