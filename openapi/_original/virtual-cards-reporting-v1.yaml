            anassociated cleared transaction record.<br><br>Visa - Not
            Applicable<br><br>Mastercard - Required <br><br>Possible values:
            <br>Settled<br>Unsettled
          type: string
          format: alphanumeric
          example: Unsettled
          maxLength: 9
        stipAdviceCode:
          description: >-
            Stand In Processing Advance Code<br><br>Mastercard - Not
            Applicable<br>Visa - Required
          type: string
          format: alphanumeric
          example: '5'
          maxLength: 4
        stipSwitchReasonCod:
          description: >-
            Stand In Processing Switch Reason Code<br><br>Mastercard - Not
            Applicable<br>Visa - Required
          type: string
          format: alphanumeric
          example: '0000'
          maxLength: 10
        stipSwitchReasonDescription:
