          description: >-
            Specifies the type of transaction<br><br>Possible
            values:<br><br>Mastercard:<br><br>"First Presentment" - Transactions
            where an acquire has initiated a first presentment to advise the
            issuer or its agent that a financial transaction was completed on
            its behalf<br>"Second Presentment (Full)" - Acquirer-initiated
            transaction to remedy a previous First Chargeback for the full First
            Presentment amount<br>"Second Presentment (Partial)" -
            Acquirer-initiated transaction to remedy a previous First
            Presentment or First Chargeback for part of the First Presentment
            amount or First Chargeback amount<br>"First Chargeback (Full)" -
            Issuer-initiated transaction to completely return a previous First
            Presentment amount<br>"Arbitration Chargeback (Full)" -
            Issuer-initiated transaction to completely return a previous First
            Presentment amount<br>"First Chargeback (Partial)" -
            Issuer-initiated transaction to partially return a previous First
            Presentment amount<br>"Arbitration Chargeback (Partial)" -
            Issuer-initiated transaction to partially return a previous First
            Presentment amount or Second Presentment
            amount<br><br>Visa:<br><br>10 = Purchase<br>11 = Credit
            Voucher<br>20 = Manual Cash Disbursement<br>22 = ATM Cash
            Disbursement<br>30 = Payment<br>Reversal - NSF Check<br>31 =
            Payment<br>40 = Finance Charge<br>50 = Annual Fee<br>52 =
            Miscellaneous Fees<br>54 = NSF Check Fee<br>56 = Report Fee<br>61 =
            Credit Adjustment<br>62 = Debit Adjustment<br>63 = Finance Charge
            Credit Adjustment<br>64 = Finance Charge Debit Adjustment<br>65 =
            Other Credits<br>66 = Other Debits<br>71 = Fuel Discount<br>73 =
            Non-Fuel Discount<br>80 = Convenience Checks<br>82 = Convenience
            Checks Fees<br>84 = Travelers Checks Fees<br>86 = ATM Fees<br>88 =
            Late Fees
          type: string
          format: alphanumeric
          example: First Presentment
          maxLength: 40
        merchantCategoryCode:
          description: >-
            The category under which the merchant is been assigned by the
            network
          type: string
          format: alphanumeric
          example: '5812'
          maxLength: 10
        mccDescription:
          description: >-
            The decsription of the category on which merchant has been assigned
            by the netwrok
          type: string
          format: alphanumeric
          example: EATING PLACES, RESTAURANTS
          maxLength: 200
        merchantId:
          description: >-
            The ID created for a specific merchant by the network<br>Mastercard
            - Required<br>Visa - Not applicable
          type: string
          format: alphanumeric
          example: 00000R-5411-USA
          maxLength: 50
        merchantName:
          description: >-
            The merchant name that corresponds to merchant id defined by the
            netwrok
          type: string
          format: alphanumeric
          example: GROCERY STORES, SUPERM
          maxLength: 200
        merchantState:
          description: The state under which the merchant has been categorised
          type: string
          format: alphanumeric
          example: MO
          maxLength: 100
        merchantCity:
          description: The city under which the merchant has been categorised
          type: string
          format: alphanumeric
          example: OFALLON
          maxLength: 100
        merchantCountryCode:
          description: >-
            The conutry code defined under which the merchant has been
            categorised
          type: string
          format: alphanumeric
          example: USA
          maxLength: 3
        merchantCountryName:
          description: >-
            The conutry name that corresponds to merchant country code under
            which the merchant has been categorised
          type: string
          format: alphanumeric
          example: United States (the)
          maxLength: 50
        merchantZipCode:
          description: >-
            The ZIP code defined under which the merchant city has been
            categorised<br>Mastercard - Not applicable<br>Visa - Required
          type: string
          format: alphanumeric
          example: '12345'
          maxLength: 10
        acquirerIdentifier:
          description: The identifier under which the acquirer has been categorised
          type: string
          format: alphanumeric
          example: '00000999080'
          maxLength: 50
        terminalId:
          description: >-
            The ID under which the terminal has been categorised<br>Mastercard -
            Required<br>Visa - Not applicable
          type: string
          format: alphanumeric
          example: '789254'
          maxLength: 50
        transactionId:
          description: >-
            Unique identifier of the transaction<br>Mastercard - Not
            applicable<br>Visa - Required
          type: string
          format: alphanumeric
          example: '380198318999999'
          maxLength: 50
        cardAcceptorId:
          description: >-
            Specifies card transaction acceptor ID<br>Mastercard - Not
            applicable<br>Visa - Required
          type: string
          format: alphanumeric
          example: '490050000000053'
          maxLength: 26
        transactionSequenceNumber:
          description: >-
            Specifies card transaction sequence number<br>Mastercard - Not
            applicable<br>Visa - Required
          type: string
          format: alphanumeric
          example: '4910'
          maxLength: 24
        acquirerReferenceData:
          description: >-
            Specifies card transaction acquirer reference number<br>Mastercard -
            Required<br>Visa - Not applicable
          type: string
          format: alphanumeric
          example: '25567681110000232050357'
          maxLength: 23
        messageType:
          description: >-
            Four-digit numeric field describing the type of message being
            interchanged.<br><br>Mastercard - Required<br>Visa - Not
            applicable<br><br>Possible Values:<br>1240   Presentment<br>1442  
            Chargeback<br>1644   Administrative<br>1740   Fee Collection
          type: string
          format: alphanumeric
          example: '1740'
          maxLength: 4
        messageReasonCode:
          description: >-
            Four-digit data element that indicates the reason for sending a
            message<br>Mastercard - Required<br>Visa - Not applicbale
          type: string
          format: alphanumeric
          example: '1400'
          maxLength: 4
        functionCode:
          description: >-
            Three-digit data element that indicates the specific purpose of a
            message in a message class.<br>Uniquely identifies all transaction
            functions the clearing system performs.<br><br>Mastercard -
            Required<br>Visa - Not applicbale<br><br>Possible
            values:<br><br>"200" – First Presentment<br>"205" – Second
            Presentment (Full)<br>"282" – Second Presentment (Partial)<br>"450"
            – First Chargeback (Full)<br>"451" – Arbitration Chargeback
            (Full)<br>"603" – Retrieval Request<br>"695" – File Trailer<br>"696"
            – Financial Detail Addendum<br>"697" – File Header<br>"700" – Fee
            Collection
          type: string
          format: alphanumeric
          example: '200'
          maxLength: 3
        transactionPostDate:
          description: >-
            Specifies card transaction once its posted / settled from
            network<br>Format - YYYY-MM-DD
          type: string
          format: alphanumeric
          example: '2023-01-20'
          maxLength: 10
        settlementAmount:
          description: >-
            Specifies card transaction amount where actual settlement was
            done<br>Mastercard - Required<br>Visa - Not applicable
          type: string
          format: alphanumeric
          example: '189.98'
          maxLength: 32
        settlementCurrencyCode:
          description: >-
            Specifies the currency code on which actual settlement of
            transaction was done<br>Mastercard - Required<br>Visa - Not
            applicable
          type: string
          format: alphanumeric
          example: SGD
          maxLength: 3
        settlementCurrencyDescription:
          description: >-
            Specifies the currency code description on which actual settlement
            of transaction was done<br>Mastercard - Required<br>Visa - Not
            applicable
          type: string
          format: alphanumeric
          example: Singapore Dollar
          maxLength: 70
        approvalCode:
          description: >-
            Specifies approval code which can be used for reconciliation, advise
            supplier/ merchants and trouble shoot declines across network
          type: string
          format: alphanumeric
          example: '802907'
          maxLength: 50
