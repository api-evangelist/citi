              title: Data da expiração da solicitação enviada ao usuário pagador.
              description: >-
                Data da expiração da solicitação enviada ao usuário pagador.
                Respeita RFC 3339.
        destinatario:
          title: Destinatario
          allOf:
            - $ref: '#/components/schemas/DadosBancarios'
          oneOf:
