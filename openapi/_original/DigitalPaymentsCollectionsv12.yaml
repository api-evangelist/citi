    Refund-Order-Status:
      title: Order
      properties:
        id:
          description: >-
            A unique identifier for this order to distinguish it from any other
            order you create. 

            - For Card transaction, order.id parameter is mandatory
          example: OR123456789
          maxLength: 40
          minLength: 1
          type: string
          title: id
        creation_date_time:
          type: string
          format: date-time
          description: >-
            GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

            - Instant Payment (Debit) - Date time, generated by CitiConnect API,
            when CitiConnect API accepted a payment initiation after validation 

            - For Card transaction, order.creation_date_time parameter is
            mandatory
          example: '2022-09-13T08:23:49.114Z'
          title: creation_date_time
        update_time:
          type: string
          format: date-time
          description: >-
            Indicates the date and time the gateway considers the order to have
            last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

            - For Card transaction, order.update_time parameter is mandatory
          example: '2022-09-13T08:23:49.114Z'
          title: update_time
        amount:
          description: |-
            The total amount for the order. 
            - For Card transaction, order.amount parameter is mandatory
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        currency_code:
          description: |-
            ISO 4217 Currency Code for instance  USD/GBP/EUR 
            - For Card transaction, order.currency_code parameter is mandatory
          enum:
            - USD
            - INR
          example: USD
          type: string
          title: currency_code
        merchant_amount:
          description: |-
            The total amount for the order in order.merchantCurrency units. 
            - For Card transaction, order.merchant_amount parameter is mandatory
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: merchant_amount
        merchant_currency:
          description: >2-
             The currency in which you priced your inventory for this order, expressed as an ISO 4217 alpha codeISO 4217 Currency Code for instance  USD/GBP/EUR 
            - order.merchant_currency parameter is mandatory for all transaction
            type creation 

            - For Card transaction, order.merchant_currency parameter is
            mandatory
          enum:
            - USD
            - INR
          example: USD
          type: string
          title: merchant_currency
        reference:
          description: >-
            An optional identifier for the orderFor example, a shopping cart
            number, an order number, or an invoice number.
          example: REPAY789541
          maxLength: 200
          minLength: 1
          type: string
          title: reference
        refund_order_id:
          description: Refund order ID
          example: REPAY789541
          maxLength: 200
          minLength: 1
          type: string
          title: refund_order_id
        status:
          type: string
          maxLength: 30
          description: >-
            Order Status, following status you will receive in response 

            - AUTHENTICATED - The payer was successfully authenticated. 

            - AUTHENTICATION_INITIATED - Payer authentication has been initiated
            but not completed. 

            - AUTHENTICATION_NOT_NEEDED - Payer authentication was not performed
            as it was not needed. 

            - AUTHENTICATION_UNSUCCESSFUL - Payer authentication was not able to
            be successfully completed. 

            - AUTHORIZED - The payment has been authorized successfully but the
            authorized amount has not yet been captured, in part, full, or
            excess. 

            - CANCELLED - The initial transaction for this order has been voided
            successfully. 

            - CAPTURED - The authorized amount for this order, in full or
            excess, has been captured successfully. 

            - CHARGEBACK_PROCESSED - A Chargeback has been processed against
            this order. 

            - DISPUTED - The payment has been disputed and is under
            investigation. A request for information has been received or a
            chargeback is pending. 

            - EXCESSIVELY_REFUNDED - The payment has been captured in part,
            full, or excess, but the captured amount in excess has been refunded
            successfully. 

            - FAILED - The payment has not been successful. 

            - FUNDING - The order transfers money to or from the merchant,
            without the involvement of a payer. For example, recording monthly
            merchant service fees from the payment service provider. 

            - INITIATED - A browser payment that has successfully been initiated
            for this order. No payment has yet been made. 

            - PARTIALLY_CAPTURED - The authorized amount for this order, in
            part, has been captured successfully. 

            - PARTIALLY_REFUNDED - The payment has been captured in part, full,
            or excess, but the captured amount in part has been refunded
            successfully. 

            - REFUNDED - The payment has been captured in part, full, or excess,
            but the captured amount in full has been refunded successfully. 

            - REFUND_REQUESTED - A refund against captured amounts on this order
            has been requested but not executed. Requires further action to
            approve the refund. 

            - VERIFIED - The card details for this order have successfully been
            verified. No payment has yet been initiated or made. 

            - DISBURSED - The order amount has successfully been disbursed to
            the payer.
          example: AUTHENTICATED
          title: status
        total_auth_amount:
          description: >-
            The amount that has been successfully authorized for this order. 

            - For Card transaction, order.total_auth_amount parameter is
            mandatory
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_auth_amount
        total_captured_amount:
          description: >-
            The amount that has been successfully captured for this order. 

            - For Card transaction, order.total_captured_amount parameter is
            mandatory
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_captured_amount
        total_refunded_amount:
          description: >-
            The amount that has been successfully captured for this order. 

            - For Card transaction, order.total_refunded_amount parameter is
            mandatory
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_refunded_amount
    Payment-Created-Notification:
      type: object
      title: Payment Created Notification
      properties:
        transaction:
          type: object
          title: Payment Created Notification Transaction
          properties:
            id:
              maxLength: 128
              minLength: 1
              type: string
              description: >-
                Unique Transaction identification provided by the merchant
                during transaction creation 

                - transaction.id parameter is mandatory for all transaction type
                creation   

                - For Brazil QR Creation transaction.id parameter should be of
                length between 26 to 35 and allowed datatype is Alphanumeric and
                should not be filled with spaces or zeroes
              example: pay02052023456r
              title: Id
            expiry_time:
              type: integer
              format: int32
              minimum: 10
              description: >-
                Expiration time for QR collection, specified in seconds 

                - QR Creation request will be rejected, if Expiration time value
                is less than 10
              example: 3600
              title: expiry_time
            status:
              type: string
              enum:
                - PENDING
                - CANCELLED
                - DECLINED
                - SETTLED
              description: |-
                Transaction Status 
                - PENDING - Transaction pending action from customer 
                - CANCELLED - Transaction cancelled 
                - DECLINED- Transaction declined by the payment processor 
                - SETTLED - Transaction settled
              title: status
            description:
              type: string
              maxLength: 200
              description: |-
                Transaction Status  
                - PENDING - Transaction pending action from customer 
                - CANCELLED - Transaction cancelled 
                - DECLINED- Transaction declined by the payment processor 
                - SETTLED - Transaction settled
              example: The transaction has successfully been created
              title: description
            update_count:
              type: integer
              format: int32
              description: >-
                Denotes the collection review. It always starts at zero. It
                always varies in increments of 1, if any updation done on QR
                creation)
              example: 1
              title: update_count
            qr_string:
              type: string
              maxLength: 512
              description: Dynamic QR Code based on the merchant payload request
              example: >-
                00020101021226700014br.gov.bcb.pix.citi.com.br/qr/2/8b3da2f39a4140d1a91abd93113bd44
                15204000053039865802BR5913Fulano de
                Tal6008BRASILIA62070503***630464E4
              title: qr_string
            creation_date_time:
              type: string
              format: date-time
              description: >-
                GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

                - Instant Payment (Debit) - Date time, generated by CitiConnect
                API, when CitiConnect API accepted a payment initiation after
                validation 

                - Instant Payment (Credit) - Date time, either provided by the
                debtor bank or generated by Citi's transaction processing
                application, when a transaction was created
              example: '2022-09-13T08:23:49.114Z'
              title: creation_date_time
            update_flag:
              type: string
              enum:
                - 'Y'
                - 'N'
              description: >-
                For QR Creation (ex. Brazil), during transaction processing if
                the merchant want to allow his client to change QR Amount then
                the value should be Y otherwise default value will be N
              example: 'Y'
              title: update_flag
            qr_byte_code:
              type: string
              format: byte
              description: QR Image
              example: >-
                
              title: qr_byte_code
