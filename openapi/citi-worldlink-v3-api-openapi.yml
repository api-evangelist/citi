                      enum:
                      - Indicated
                      - Committed
                    ForExRateDealType:
                      maxLength: 4
                      type: string
                      description: Buy or Sell. Default is Buy.
                    ForExValDtType:
                      maxLength: 35
                      type: string
                      description: Daily, Spot or Future. Default value is Spot, if no value is provided.
                    ForExTnr:
                      maxLength: 2
                      type: string
                      description: Tenor value from frontend. Two Alphanumeric code for tenor.0 SP, TN, SD & BA. Conditional when FX request has Tenor listed as SD or TN or SP, OLR will book the FX and respond with the same requested tenor value. If the request is having BA as tenor value, OLR will determine tenor value either as SD or TN or SP based on FX availablity.
                    ForExValDt:
                      maxLength: 10
                      type: string
                      description: "Value date required only if ForExValDtType is Future. Data type is\n  \"Date\" as defined in IFX XML. FX contract Value Date mapped as\nyyyy-mm-dd. Value date is required if ForExValDtType is Future <br>GPP to map the value date if Client profile is set up for FX Request type as Value date"
                    DeliveryMethod:
                      maxLength: 35
                      type: string
                      description: DEALID6 or DEALID16
                    PayAcct:
                      maxLength: 35
                      type: string
                      description: Citi Account held at Citi Branch routing id (valid Citi acct). This is only passed if requesting OLR to credit a source requested Citi account. Previous tag must also be sent in conjunction with this tag.
                    PayBrnch:
                      maxLength: 3
                      type: string
                      description: Citi Branch routing id (valid Citi Branch). This is only passed if requesting OLR to credit a source requested Citi account. Next tag must also be sent in conjunction with this tag.
                    RemitAcct:
                      maxLength: 35
                      type: string
                      description: Citi Account held at Citi Branch routing id (valid Citi acct). This is only passed if requesting OLR to debit a source requested Citi account. remitBrnch must also be sent.
                    RemitBrnch:
                      maxLength: 3
                      type: string
                      description: Citi Branch routing ID (valid Citi Branch). This is only passed if the requesting OLR to debit a source requested Citi account. RemitAcct must also be sent.
                    BenchFixing:
                      maxLength: 20
                      type: string
                      description: Bench Fixing. Required only for Bench Deals
