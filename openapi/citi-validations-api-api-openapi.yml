              enum:
              - GB
              - US
              - IN
              - AT
              - BE
              - FI
              - FR
              - DE
              - GR
              - IE
              - IT
              - LU
              - NL
              - PT
              - SK
              - ES
              - BG
              - CZ
              - DK
              - HU
              - 'NO'
              - PL
              - RO
              - SE
              title: country
            method:
              type: string
              description: Method specified by the debtor for the validation
              enum:
              - IBAN
              - SORTCODE
              - NC
              - BIC
              - BANKACCOUNT
              - CARD
              - PAYMENTID
              - ID
              title: method
            type:
              type: string
              description: "Message type (e.g., CT for credit transfer, AER for Account Enquiry Request) \n- For US EWS, this parameter is mandatory \n- For UK, this parameter is mandatory \n- For SEPA VoP, this parameter is mandatory \n- For Global Mastercard Validation, this parameter is mandatory  \n- Ownership - Account ownership is limited to validation of correct owner, hence the account number or equivalent (i.e Virtual account) and Name \n- Attributes - Attributes define the properties of the object, for an account the properties should include Status, type of account, status of account, the address of the account  etc. \n- Structure - Structure refers to the mod 97 and the length as per the country of IBAN \n- TAXID -  Validation of individual or corporate tax id/tax documentation\n - REACHABILITY - Bank is reachable on a given network \n- AVAILABILITY - Availability of a bank to receive a particular credit"
              enum:
              - REACHABILITY
              - AVAILABILITY
              - Structure
              - Ownership
              - Attributes
              - TAXID
              title: type
