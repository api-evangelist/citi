components:
  schemas:
    DocumentReq:
      required:
        - CstmrCdtTrfInitn
      properties:
        CstmrCdtTrfInitn:
          $ref: '#/components/schemas/CustomerCreditTransferInitiationV03'
      description: Customer credit transfer initiation request body.
      xml:
        name: Document
    Document:
      required:
        - CstmrPmtStsRpt
      properties:
        CstmrPmtStsRpt:
          $ref: '#/components/schemas/CustomerPaymentStatusReportV03'
      description: Customer payment status report.
    errormessage:
      required:
        - httpCode
      type: object
      properties:
        httpCode:
          type: integer
          format: int32
        httpMessage:
          type: string
        moreInformation:
          type: string
      description: Error response body
      xml:
        name: errormessage
    AccountIdentification4Choice:
      required:
        - IBAN
        - Othr
      type: object
      properties:
        IBAN:
          $ref: '#/components/schemas/IBAN2007Identifier'
        Othr:
          $ref: '#/components/schemas/GenericAccountIdentification1'
      description: >-
        Unique identification for the account between the account owner and the
        account servicer. Either `IBAN` or `Othr` parameter should be passed in
        the request.
    ActiveOrHistoricCurrencyAndAmount:
      type: object
      properties:
        Ccy:
          type: object
          description: Currency code. Passed as the parameter attribute.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
        Value:
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount_SimpleType'
    ActiveOrHistoricCurrencyAndAmount_SimpleType:
      maxLength: 18
      type: string
      description: >-
        A number of monetary units specified in an active or a historic currency
        where the unit of currency is explicit and compliant with ISO 4217.<br>
        The number of fractional digits should be 5.
    ActiveOrHistoricCurrencyCode:
      pattern: '[A-Z]{3,3}'
      type: string
    AmountType3Choice:
      type: object
      properties:
        EqvtAmt:
          $ref: '#/components/schemas/EquivalentAmount2'
        InstdAmt:
          type: object
          description: >-
            Amount of money to be moved between the debtor and creditor, before
            deduction of charges, expressed in the currency as ordered by the
            initiating party. \n - For Pay2China, Format is 'x.xx' and to be
            provided with currency attribute.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
      description: >-
        Amount of money to be moved between the debtor and creditor, before
        deduction of charges, expressed in the currency as ordered by the
        initiating party. Either `EqvtAmt` or `InstdAmt` parameter value should
        be passed on request.
    Authorisation1Choice:
      required:
        - Cd
        - Prtry
      type: object
      properties:
        Cd:
          type: string
          description: >-
            Specifies the authorization, in a coded form.<br><br><b>AUTH:</b>
            Indicates a file has been pre authorized or approved within the
            originating customer environment and no further approval is
            required. <br><br><b>FDET:</b> Indicates that a file requires
            additional file level approval, with the ability to view both the
            payment information block and supporting customer credit transaction
            detail. <br><br><b>FSUM:</b> Indicates that a file requires
            additional file level approval, with the ability to view only the
            payment information block level information. <br><br><b>ILEV:</b>
            Indicates that a file requires all customer transactions to be
            authorized or approved.
          enum:
            - AUTH
            - FDET
            - FSUM
            - ILEV
        Prtry:
          maxLength: 128
          minLength: 1
          type: string
          description: Specifies the authorisation, in a free text form.
    BaseOneRate:
      maxLength: 11
      type: string
      description: >-
        The factor used for conversion of an amount from one currency to
        another. This reflects the price at which one currency was bought with
        another currency.
    BranchAndFinancialInstitutionIdentification4:
      required:
        - FinInstnId
      type: object
      properties:
        BrnchId:
          $ref: '#/components/schemas/BranchData2'
        FinInstnId:
          $ref: '#/components/schemas/FinancialInstitutionIdentification7'
    BranchData2:
      type: object
      properties:
        Id:
          type: object
          description: Unique identification of a branch of a financial institution.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        Nm:
          type: object
          description: >-
            Name by which an agent is known and which is usually used to
            identify that agent.
          allOf:
            - $ref: '#/components/schemas/Max140Text'
        PstlAdr:
          $ref: '#/components/schemas/PostalAddress6'
      description: Identifies a specific branch of a financial institution.
    CashAccount16:
      required:
        - Id
      type: object
      properties:
        Ccy:
          type: object
          description: Identification of the currency in which the account is held.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
        Id:
          $ref: '#/components/schemas/AccountIdentification4Choice'
        Nm:
          type: object
          description: >-
            Name of the account, as assigned by the account servicing
            institution, in agreement with the account owner in order to provide
            an additional means of identification of the account.
          allOf:
            - $ref: '#/components/schemas/Max70Text'
        Tp:
          $ref: '#/components/schemas/CashAccountType2'
    CashAccountType2:
      type: object
      properties:
        Cd:
          $ref: '#/components/schemas/CashAccountType4Code'
        Prtry:
          type: object
          description: Nature or use of the account in a proprietary form.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
      description: >-
        Specifies the nature, or use of the account. Either Code or Proprietary
        parameter value should be passed on request.
    CashAccountType4Code:
      type: string
      description: >-
        Account type, in a coded form. <br><br><b>CASH</b> : Account used for
        the payment of cash. <br><br><b>CHAR</b> : Account used for charges if
        different from the account for payment. <br><br><b>COMM</b> : Account
        used for commission if different from the account for payment.
        <br><br><b>TAXE</b> : Account used for taxes if different from the
        account for payment. <br><br><b>CISH</b> : Account used for payment of
        income if different from the current cash account. <br><br><b>TRAS</b> :
        Account used for trading if different from the current cash account.
        <br><br><b>SACC</b> : Account used to post debit and credit entries, as
        a result of transactions cleared and settled through a specific clearing
        and settlement system. <br><br><b>CACC</b> : Account used to post debits
        and credits when no specific account has been nominated.
        <br><br><b>SVGS</b> : Account used for savings. <br><br><b>ONDP</b> :
        Account used for overnight deposits. <br><br><b>MGLD</b> : Account used
        for a marginal lending facility. <br><br><b>NREX</b> : Account used for
        non-resident external. <br><br><b>MOMA</b> : Account used for money
        markets if different from the cash account. <br><br><b>LOAN</b> :
        Account used for loans. <br><br><b>SLRY</b> : Accounts used for salary
        payments. <br><br><b>ODFT</b> : Account is used for overdrafts.
      enum:
        - CASH
        - CHAR
        - COMM
        - TAXE
        - CISH
        - TRAS
        - SACC
        - CACC
        - SVGS
        - ONDP
        - MGLD
        - NREX
        - MOMA
        - LOAN
        - SLRY
        - ODFT
    CategoryPurpose1Choice:
      type: object
      properties:
        Cd:
          maxLength: 4
          minLength: 1
          type: string
          description: >-
            Category purpose, as published in an external category purpose code
            list. \n - For Pay2China, this field is optional and can be
            populated as 'CASH'.
        Prtry:
          type: object
          description: Category purpose, in a proprietary form.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
      description: >-
        Specifies the high level purpose of the instruction based on a set of
        pre-defined categories. Either Code or Proprietary parameter value
        should be passed in request.
    ChargeBearerType1Code:
      type: string
      description: >-
        Specifies which party/parties will bear the charges associated with the
        processing of the payment transaction. <br><br><b>DEBT</b> : All
        transaction charges are to be borne by the debtor. <br><br><b>CRED</b> :
        All transaction charges are to be borne by the creditor.
        <br><br><b>SHAR</b> : In a credit transfer context, means that
        transaction charges on the sender side are to be borne by the debtor,
        transaction charges on the receiver side are to be borne by the
        creditor. In a direct debit context, means that transaction charges on
        the sender side are to be borne by the creditor, transaction charges on
        the receiver side are to be borne by the debtor. <br><br><b>SLEV</b> :
        Charges are to be applied following the rules agreed in the service
        level and/or scheme.
      enum:
        - DEBT
        - CRED
        - SHAR
        - SLEV
    Cheque6:
      type: object
      properties:
        ChqFr:
          type: object
          description: Identifies the party that ordered the issuance of the cheque.
          allOf:
            - $ref: '#/components/schemas/NameAndAddress10'
        ChqMtrtyDt:
          type: object
          description: >-
            Date when the draft becomes payable and the debtor's account is
            debited.
          allOf:
            - $ref: '#/components/schemas/ISODate'
        ChqNb:
          type: object
          description: Unique identifier for a cheque as assigned by the agent.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        ChqTp:
          $ref: '#/components/schemas/ChequeType2Code'
        DlvrTo:
          type: object
          description: Party to whom the debtor's agent needs to send the cheque.
          allOf:
            - $ref: '#/components/schemas/NameAndAddress10'
        DlvryMtd:
          $ref: '#/components/schemas/ChequeDeliveryMethod1Choice'
        FrmsCd:
          type: object
          description: >-
            Identifies, in a coded form, the cheque layout, company logo and
            digitized signature to be used to print the cheque, as agreed
            between the initiating party and the debtor's agent.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        InstrPrty:
          type: object
          description: >-
            Urgency or order of importance that the originator would like the
            recipient of the payment instruction to apply to the processing of
            the payment instruction.<br><br><b>HIGH</b> : Priority level is
            high. <br><br><b>NORM</b> : Priority level is normal.
          allOf:
            - $ref: '#/components/schemas/Priority2Code'
        MemoFld:
          maxItems: 2
          type: array
          description: >-
            Information that needs to be printed on a cheque, used by the payer
            to add miscellaneous information.
          items:
            $ref: '#/components/schemas/Max35Text'
        PrtLctn:
          type: object
          description: Specifies the print location of the cheque.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        RgnlClrZone:
          type: object
          description: >-
            Regional area in which the cheque can be cleared, when a country has
            no nation-wide cheque clearing organization.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
      description: Set of elements needed to issue a cheque.
    ChequeDelivery1Code:
      type: string
      description: >-
        Specifies the delivery method of the cheque by the debtor's agent.
        <br><br><b>MLDB</b>: Cheque is to be sent through mail services to
        debtor. <br><br><b>MLCD</b>: Cheque is to be sent through mail services
        to creditor. <br><br><b>MLFA</b>: Cheque is to be sent through mail
        services to creditor agent. <br><br><b>CRDB</b>: Cheque is to be sent
        through courier services to debtor. <br><br><b>CRCD</b>: Cheque is to be
        sent through courier services to creditor. <br><br><b>CRFA</b>: Cheque
        is to be sent through courier services to creditor agent.
        <br><br><b>PUDB</b>: Cheque will be picked up by the debtor.
        <br><br><b>PUCD</b>: Cheque will be picked up by the creditor.
        <br><br><b>PUFA</b>: Cheque will be picked up by the creditor agent.
        <br><br><b>RGDB</b>: Cheque is to be sent through registered mail
        services to debtor. <br><br><b>RGCD</b>: Cheque is to be sent through
        registered mail services to creditor. <br><br><b>RGFA</b>: Cheque is to
        be sent through registered mail services to creditor agent.
      enum:
        - MLDB
        - MLCD
        - MLFA
        - CRDB
        - CRCD
        - CRFA
        - PUDB
        - PUCD
        - PUFA
        - RGDB
        - RGCD
        - RGFA
    ChequeDeliveryMethod1Choice:
      type: object
      properties:
        Cd:
          $ref: '#/components/schemas/ChequeDelivery1Code'
        Prtry:
          type: object
          description: >-
            Specifies a proprietary delivery method of the cheque by the
            debtor's agent.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
      description: Specifies the delivery method of the cheque by the debtor's agent.
    ChequeType2Code:
      type: string
      description: >-
        Specifies the type of cheque to be issued. <br><br><b>CCHQ</b> : Cheque
        drawn on the account of the debtor, and debited on the debtor's account
        when the cheque is cashed. Synonym is 'corporate cheque'.
        <br><br><b>CCCH</b> : Cheque drawn on the account of the debtor, and
        debited on the debtor's account when the cheque is cashed. The financial
        institution prints and certifies the cheque, guaranteeing the payment.
        <br><br><b>BCHQ</b> : Cheque drawn on the account of the debtor's
        financial institution, which is debited on the debtor's account when the
        cheque is issued.These cheques are printed by the debtor's financial
        institution and payment is guaranteed by the financial institution.
        Synonym is 'cashier's cheque'. <br><br><b>DRFT</b> : A guaranteed bank
        cheque with a future value date (do not pay before], which in commercial
        terms is a 'negotiatable instrument': the beneficiary can receive early
        payment from any bank under subtraction of a discount. The ordering
        customer's account is debited on value date. <br><br><b>ELDR</b> : An
        instrument with a future value date (do not pay before], which in
        commercial terms is a 'negotiatable instrument': the beneficiary can
        receive early payment from any bank under subtraction of a discount. The
        ordering customer's account is debited on value date.
      enum:
        - CCHQ
        - CCCH
        - BCHQ
        - DRFT
        - ELDR
