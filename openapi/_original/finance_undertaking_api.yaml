          format: email
        additional_details:
          maxLength: 35
          minLength: 1
          type: string
          description: >
            Additional details of the party.


            Usage Guideline: This field can additionally be used to identify the
            party when the party type is 'OTHR'.
      additionalProperties: false
      description: Set of elements used to identify a person or an organisation.
    PartyIdentificationSummary:
      type: object
      properties:
        any_bic:
          $ref: '#/components/schemas/AnyBICDec2014Identifier'
        lei:
          pattern: ^[A-Z0-9]{18,18}[0-9]{2,2}$
          type: string
          description: Legal entity identifier of the financial institution.
          x-MXComponent: LEIIdentifier
        name:
          maxLength: 140
          minLength: 1
          type: string
          description: >-
