components:
  schemas:
    UnAuthorizedResponse:
      type: object
      properties:
        httpCode:
          type: string
          description: '401'
        httpMessage:
          type: string
          description: Unauthorized
        moreInformation:
          type: string
          description: Client ID and/or Country and/or region id is missing in Client Onboard Configuration setup. Contact Citi support.
    TechIssueResponse:
      type: object
      properties:
        messageId:
          type: string
          description: The requested `messageId` will be provided back in response. The ID can be `used for investigation and troubleshooting`.
        provisioningStatus:
          type: string
          description: The status of the provisioning made
          enum:
          - FAILED
        errors:
          type: array
          items:
            $ref: '#/components/schemas/TechErrors'
    PaymentBeneficiaryDetails:
      type: object
      properties:
        paymentBeneficiaryId:
          type: integer
          format: int64
          description: Uniquely identifies the payment beneficiary id for which the virtual card is created.
          example: 20122
        paymentBeneficiaryName:
          type: string
          description: Uniquely identifies the payment beneficiary name for which the virtual card is created.
          example: Test Company Supplier 2
    FundingSourceDetails:
      type: object
      properties:
        fundingSourceId:
          type: integer
          format: int64
          description: Unique identifier of the funding source to which the virtual card rolls up.
          example: 15510
        fundingSourceName:
          type: string
          description: Descriptive name of the real card to which the virtual card rolls up.
          example: APAC UAT GRACE TEST1
    Errors:
      type: object
      properties:
        errorCode:
          type: string
          description: The error code displayed while retrieving the transaction.
          enum:
          - ERC0001
          - ERS0007
          - ERS0064
          - ERS0065
          - ERS0066
          - ERS0076
          - ERC0002
          - ERC0003
          - MS0003
          - MS0004
          - MS0005
          - MS0006
          - GRC0002
          - GRC0003
          - GRC0004
          - GRC0007
          - GRC0011
          - GRC0012
          - GRC0013
          example: GRC0003
        errorDescription:
          type: string
          description: 'The error description that corresponds to error code when there is any error occurred while retrieving the transaction.<br><br>message:<br>  * `ERC0001` - No ID Provisioning data was found for the given Program Name: `{programName}`<br>  * `ERS0007` - Invalid Message ID format<br>  * `ERS0064` - No ID Provisioning data was found for the given Program Name: `{programName}`<br>  * `ERS0065` - The required Program Name Field was empty<br>  * `ERS0066` - The required Program Name Field count exceeds the maximum limit<br>  * `ERS0076` - Client ID and/or Program names are missing in Client Onboard Configuration setup. Contact Citi support .<br>  * `ERC0002`  - We have encountered an error and couldn''t receive your request. Please try again, or contact Citi support if you have any further questions or comments<br>  <br>  * `ERC0003`  - We have encountered an error and couldn''t receive your request. Please try again, or contact Citi support if you have any further questions or comments<br>  * `MS0003` - There was a problem retrieving the funding source data for Program Name: `{programName}`<br>  * `MS0004` - There was a problem retrieving ID provisioning data for Program Name: `{programName}`<br>  * `MS0005` - There was a problem retrieving the supplier data for the given Program Name: `{programName}`<br>  * `MS0006` - Invalid vcaId value.<br>  * `GRC0002`  - Client ID is missing in the request header<br>  <br>  * `GRC0003`  - Country code is not available in the request<br>  <br>  * `GRC0004`  - Region ID is not available in the request<br>  <br>  * `GRC0007`  - Client requested MediaType is not supported.<br>  <br><br>  * `GRC0011`  - Client ID and/or Country and/or region id is missing in Client Onboard Configuration setup. Contact Citi support.<br>  <br>  * `GRC0012`  - Necessary header value is missing<br>  <br>  * `GRC0013`  - Invalid JSON Input<br>'
          example: Country code is not available in the request
    IdProvResponse:
      type: object
      properties:
        messageId:
          type: string
          example: '1234'
          description: Unique ID of the API message sent. The `messageId` will be provided back in the corresponding response. The ID can be `used for investigation and troubleshooting`. The ID must be unique per integration.
        provisioningStatus:
          type: string
          description: " The status of your provisioning request.\n\n **Note:** a response of ``200: OK`` indicates only that your request is properly formed and has been successfully received. It is possible to receive a response of ``200: OK`` without successfully completing the provisioning.\n\n See ``provisioningStatus`` for more information."
          enum:
          - COMPLETED
          - PARTIALLY COMPLETED
          - FAILED
          example: COMPLETED
        warningMessage:
          type: string
          description: "Citi API Platform onboarding was not successful. \nPlease retry once. If you continue to receive this message please\\\ncontact Citi Support for assistance.\n\n**Note:** You will receive this message only if the provisionStatus is ``Partially Completed`` or ``Failed``."
          example: Citi API Platform onboarding was not successful. Please retry once. If you continue to receive this message please contact Citi Support for assistance.
        programDetails:
          type: array
          items:
            $ref: '#/components/schemas/ProgramDetails'
    IdProvRequest:
      type: object
      properties:
        programName:
          type: array
          description: '`Company Name` as defined in the virtual cards system'
          items:
            type: string
          maxItems: 5
          minItems: 1
          example:
          - CITIBANK NA SINGAPORE VCN
        messageId:
          type: string
          description: 'Unique ID of the API message sent. The messageId will be provided back in the corresponding response. The ID can be used for investigation and troubleshooting. The ID must be unique per integration.<br><br>`Rules:`<br><br>* Position 1- 4: Always "CITI"<br><br>* Position 5-8 : unique identifier for the client. This 4 character to be decided by Citi during client integration<br><br>* Position 9 - 24: Timestamp including milliseconds<br><br>* Position 25 - 28: Randomly generated value from the client<br><br>* Position 29 - 36: To be reserved for future use'
          minLength: 28
          maxLength: 36
          example: KN98420IdProvIDKNAM1647511593723
    PurchaseTemplates:
      type: object
      properties:
        templateId:
          type: integer
          format: int64
          description: Identifies the template id that was setup in the VCA system and that should be used for this virtual card.
          example: 24694
        templateName:
          type: string
          description: Identifies the template name that was setup in the VCA system and that should be used for this virtual card.
          example: GRACE Test Template 2
        templateDescription:
          type: string
          description: Identifies the template description that was setup in the VCA system and that should be used for this virtual card.
          example: GRACE Test Template 2
    MethodNotAllowedResponse:
      type: object
      properties:
        path:
          type: string
          description: Requested resource path is available
        error:
          type: string
          description: Method Not Allowed
        message:
          type: string
          description: Detail error message with HTTP request operation type
        timestamp:
          type: string
          description: Citi rejected timestamp
        status:
          type: string
          description: '405'
    ProgramDetails:
      type: object
      properties:
        programName:
          type: string
          description: Company Name as defined in the virtual cards system.
          example: INDRALOK INFOWAY
        programId:
          type: string
          description: Unique ID of the company record defined in the virtual cards system.
          example: '433161'
        status:
          type: string
          description: Defines the status of the data that was requested whether the request has been processed or not.
          enum:
          - COMPLETED
          - FAILED
          example: COMPLETED
        fundingSourceDetails:
          type: array
          items:
            $ref: '#/components/schemas/FundingSourceDetails'
        purchaseTemplates:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseTemplates'
        paymentBeneficiaryDetails:
          type: array
          items:
            $ref: '#/components/schemas/PaymentBeneficiaryDetails'
        error:
          $ref: '#/components/schemas/Errors'
    BadRequestResponse:
      type: object
      properties:
        messageId:
          type: string
          example: '1234'
          description: The requested `messageId` will be provided back in response. The ID can be `used for investigation and troubleshooting`.
        provisioningStatus:
          type: string
          description: The status of the provisioning made
          enum:
          - FAILED
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Errors'
    TechErrors:
      type: object
      properties:
        errorCode:
          type: string
          description: The error code if there is any error occurred while technical issue is occurred in system
          enum:
          - ERC0002
          - ERS0049
          - GRC0001
          - GRC0005
          - GRC0006
          - GRC0009
          - GRC0014
        errorDescription:
          type: string
          description: The error description that corresponds to error code when there is any error occurred while retrieving the transaction.<br><br>  * `ERC0002` - We have encountered an error and couldn't receive your request. Please try again, or contact Citi support if you have any further questions or comments<br>  <br>  * `ERS0049` - We have encountered an error and couldn't receive your request. Please try again, or contact Citi support if you have any further questions or comments<br><br>  * `GRC0001` - We have encountered an error and couldn't receive your request. Please try again, or contact Citi support if you have any further questions or comments<br><br>  * `GRC0005` - We have encountered an error and couldn't receive your request. Please try again, or contact Citi support if you have any further questions or comments<br>  <br>  * `GRC0006`  - We have encountered an error and couldn't receive your request. Please try again, or contact Citi support if you have any further questions or comments<br>  <br>  * `GRC0009`  - We have encountered an error and couldn't receive your request. Please try again, or contact Citi support if you have any further questions or comments<br>  <br>  * `GRC0014`  - We have encountered an error and couldn't receive your request. Please try again, or contact Citi support if you have any further questions or comments<br>
    TemplateControl:
      required:
      - controlCode
      - controlDescription
      properties:
        controlCode:
          type: string
          format: alphanumeric
          example: VL
          description: 2-character code of the template control name. Decides the type of control to use to create a purchase request.<br><br>Possible Values<br>AR (Amount range control)<br>CU (Curfew control)<br>GE (Geography control)<br>MA (Merchant amount control)<br>MI Merchant ID control)<br>TD (Time of day control)<br>TL (Transaction limit control)<br>VA (Validity period control)<br>VG (Aging velocity control)<br>VL (Velocity control)
          maxLength: 2
        controlDescription:
          type: string
          format: alphanumeric
          example: Velocity
          description: Template control description
          maxLength: 50
    Templates2:
      required:
      - mccGrouping
      - mvcaEnabled
      - purchaseType
      - templateDescription
      - templateId
      - templateName
      - templateType
      properties:
        templateId:
          type: string
          format: alphanumeric
          example: '36091'
          description: Identifies the template that was setup in the VCA system. <br>The template setup in the VCA system defines which controls, custom data fields and MCC groupings can be used.
          maxLength: 19
        templateName:
          type: string
          format: alphanumeric
          example: Airline Purchases
          description: Identifies the template name that was setup in the VCA system and that should be used for this virtual card
          maxLength: 200
        templateDescription:
          type: string
          format: alphanumeric
          example: Template for making arline purchases
          description: Description of the template.
          maxLength: 500
        templateType:
          type: string
          format: alphanumeric
          example: PC
          description: Type of the template
          maxLength: 20
        mvcaEnabled:
          type: string
          format: boolean
          example: 'true'
          description: Template enabled for mvca.
        purchaseType:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseType'
        templateControl:
          type: array
          description: Spending control available in the template to use
          items:
            $ref: '#/components/schemas/TemplateControl'
        mccGrouping:
          type: string
          format: alphanumeric
          example: Airlines
          description: Name of Merchant Category Code grouping set on purchase template
          maxLength: 200
        customReferenceData:
          type: array
          items:
            $ref: '#/components/schemas/CustomReferenceData'
    PurchaseType:
      required:
      - mcc
      - mccDescription
      properties:
        mcc:
          type: string
          format: alphanumeric
          example: '30001'
          description: Merchant Category Code used in the template
          maxLength: 4
        mccDescription:
          type: string
          format: alphanumeric
          example: AMERICAN AIRLINES
          description: Merchant Category Code description
          maxLength: 200
    ResponseCodes:
      required:
      - errorCode
      - errorDescription
      properties:
        errorCode:
          type: string
          format: alphanumeric
          example: ERS0065
          description: which indicates the error code
          maxLength: 30
        errorDescription:
          type: string
          format: alphanumeric
          example: The required Program Name Field was empty
          description: which indicates the error description
          maxLength: 300
    ResponseCodes400:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ResponseCodes'
    PurchaseTemplateInboundRequest:
      required:
      - programName
      properties:
        programName:
          type: string
          format: alphanumeric
          example: VCA Program NAM
          description: Company Name as defined in the virtual cards system
          maxLength: 200
        templateId:
