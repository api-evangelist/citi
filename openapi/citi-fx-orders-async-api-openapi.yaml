openapi: 3.1.0
info:
  version: ''
  title: InstantFX Order
  description: >
    The FX orders API allows you to submit a request for standard orders,
    drawdowns, pre-orders (intent to pay), forecast, and refund orders. Both
    individual and multi-order requests are accepted. 


    ### Web Sockets

    <b>The response to this endpoint will be sent via web socket connection.</b>
    Refer to the User Guide tab for more information on enabling a web socket
    connection. This allows you to integrate the responses you receive from Citi
    into your workflow for automated processing.

    Ensure that you have an open web socket session before sending any requests
    to consume the response.

    ### Trading Rules
     Please contact your Citi representative to obtain a list of currency pairs currently supported by Instant FX.
    #### Platform Operational Hours
      The Instant FX platform is available during standard FX market trading hours. The platform is not available during weekend hours.
      * Start of business is Monday 07:00 NZDT New Zealand/Auckland
      * End of business is Friday 17:00 EST New York
servers:
  - url: https://api.citivelocity.com/markets
    description: production gateway URL
  - url: https://sandbox.api.citivelocity.com/markets
    description: sandbox URL
security:
  - OAuth2:
      - fxapi
paths:
  /fxgateway/async/instantfxorder/api/v1:
    post:
      parameters:
        - name: client_id
          in: query
          description: >-
            Your unique identifier shared during your API onboarding. It is the
            same client_id used for oauth token generation.
          required: true
          schema:
            type: string
      summary: Order request
      description: >
        Use this endpoint to request a rate for standard, drawdowns, pre-orders
        (intent to pay), forecast, and refund orders. Both individual and
        multi-order requests are accepted.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FXTradeRequest'
        required: true
      responses:
        '200':
          description: >-
            OK Acknowledged.


            <b>Note: The orders response message will be sent via web
            socket.</b> Please see the User Guide tab for more information on
            using the web socket connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionReport'
        '401':
          description: Unauthorized user error
        '403':
          description: Access Forbidden error
        '500':
          description: Internal Server Error
