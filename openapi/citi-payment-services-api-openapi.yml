    CobValor:
      type: object
      title: Valor da cobrança imediata
      description: Collection item amount.
      properties:
        original:
          type: string
          title: Valor
          pattern: \d{1,10}\.\d{2}
          description: Collection item base amount.
        modalidadeAlteracao:
          type: integer
          format: int32
          minimum: 0
          maximum: 1
          title: Modalidade de alteração
          description: This determines if the effective due amount of the collection item can be changed by the payer. 0 if not allowed and 1 if allowed. If not provided it will be considered 0.
        retirada:
          description: "It is an optional structure related to the concept of receiving cash. Only one grouping at a time is allowed, when there is `draw` there is no `change` and vice versa.\n\nWhen an Immediate collection has a `withdrawal` structure, it ceases to be considered common Pix and becomes a Cash Pix category.\n\nIn order for the completion of the `withdrawal` object to be considered valid, the following rules apply:\n- the `modalidadeAgente` and `providerDoServicoDeSaque` fields are **required**;\n- when `withdrawal` is present, the collection must comply with the following conditions:\n  - The field `valor.original` must be filled with **value equal to 0.00 (zero)**;\n  - The field `valor.modalidadeAlteracao` must have the value 0 (zero) explicitly, or implicitly (by not filling it out).\n- when `change` is present, the collection must comply with the following conditions:\n  - The field `valor.original` must be filled with **value greater than 0.00 (zero)**;\n  - The field `valor.modalidadeAlteracao` must have the value 0 (zero) explicitly, or implicitly (by not filling it out).\n\n**IMPORTANT**: When using `withdrawal` or `change`, it will not be allowed to change the `original.value` received. In the presence of `draw` or `change`, the receipt of the `valor.modalidadeAlteracao` field with value 1 (one) is considered an error.\n\n#### Valid examples:\n   Considering the fields of structure `value` and predicate 'present', the result of which is true when the\n  indicated structure is found, we have:\n   - 1 - **collection with fixed value** (conditions: valor.original > 0 && valor.modalidadeAlteração = 0 &&\n  !present(valor.retirada))\n   ```\n   ...\n   \"value\": {\n   \"original\": \"10.00\"\n   },\n   ...\n   ```\n   - 2 - **collection with changeable value** (conditions: valor.original >= 0.00 && modalidadeAlteração = 1\n  && !present(valor.retirada))\n   ```\n   ...\n   \"value\": {\n   \"original\": \"10.00\",\n   \"modalidadeAlteracao\": 1\n   },\n   ```\n   - 3 - **cash withdrawal with fixed value** (conditions: valor.original = 0.00 && valor.modalidadeAlteração\n  = 0 && presente(valor.retirada.saque) && valor.retirada.saque.valor > 0 &&\n  valor.retirada.saque.modalidadeAlteracao = 0)\n   ```\n   ...\n   \"value\": {\n   \"original\": \"0.00\",\n   \"withdrawal\": {\n   \"cash withdrawal\": {\n   \"value\": \"5.00\"\n   }\n   }\n   },\n   ...\n   ```\n   - 4 - **cash withdrawal with changeable value** (conditions: valor.original = 0.00 &&\n  valor.modalidadeAlteração = 0 && presente(valor.retirada.saque) && valor.retirada.saque.valor >= 0 &&\n  valor.retirada.saque.modalidadeAlteracao = 1)\n   ```\n   ...\n   \"value\": {\n   \"original\": \"0.00\",\n   \"withdrawal\": {\n   \"cash withdrawal\": {\n   \"value\": \"5.00\",\n   \"modalidadeAlteracao\": 1,\n   }\n   }\n   },\n   ...\n   ```\n   - 5 - **collection with fixed change** (conditions: valor.original > 0.00 && valor.modalidadeAlteração = 0 &&\n  presente(valor.retirada.troco) && valor.retirada.troco.valor > 0 && valor.retirada.troco.modalidadeAlteracao = 0)\n   ```\n   ...\n   \"value\": {\n   \"original\": \"10.00\",\n   \"withdrawal\": {\n   \"change\": {\n   \"value\": \"5.00\"\n   }\n   }\n  \n   },\n   ...\n   ```\n   - 6 - **collection with changeable change** (conditions: valor.original > 0.00 && valor.modalidadeAlteração = 0\n  && present(valor.retirada.troco) && valor.retirada.troco.valor >= 0 && valor.retirada.troco.modalidadeAlteracao = 1)\n   ```\n   ...\n   \"value\": {\n   \"original\": \"10.00\",\n   \"change\": {\n   \"value\": \"0.00\",\n   \"modalidadeAlteracao\": 1\n   }\n   },\n   ...\n   ```\n   #### Invalid examples:\n   Below are some examples which **are not valid**. It is worth noting that this listing is not intended to be\n  complete, being just a reference for some possible errors.\n   - 1 - **collection with cash withdrawal and change together** (both of them cannot occur at the same time)\n   ```\n   ...\n   \"value\": {\n   \"original\": \"100.00\",\n   \"withdrawal\": {\n   \"cash withdrawal\": {\n   \"value\": \"50.00\"\n   },\n   \"change\": {\n   \"value\": \"30.00\"\n   }\n   }\n   },\n   ...\n   ```\n   - 2 - **cash withdrawal with valor.original higher than 0.00 (zero)** (cash withdrawal requires valor.original =\n  0.00)\n   ```\n   ...\n   \"value\": {\n   \"original\": \"10.00\",\n   \"withdrawal\": {\n   \"cash withdrawal\": {\n   \"value\": \"5.00\"\n   }\n   }\n   },\n   ...\n   ```\n   - 3 - **change with valor.original equal to 0.00 (zero)** (for having a change, there must be valor.original > 0.00)\n   ```\n   ...\n   \"value\": {\n   \"original\": \"0.00\",\n   \"withdrawal\": {\n   \"change\": {\n   \"value\": \"5.00\"\n  \n   }\n   }\n   },\n   ...\n   ```\n   - 4 - **cash withdrawal with changeable valor.original** (the valor.original cannot be changed in the\n  presence of cash withdrawal)\n   ```\n   ...\n   \"value\": {\n   \"original\": \"0.00\",\n   \"modalidadeAlteracao\": 1,\n   \"withdrawal\": {\n   \"cash withdrawal\": {\n   \"value\": \"5.00\",\n   \"modalidadeAlteracao\": 1,\n   }\n   }\n   },\n   ...\n   ```\n   - 5 - **change with changeable valor.original** (the valor.original cannot be changed in the presence of change)\n   ```\n   ...\n   \"value\": {\n   \"original\": \"0.00\",\n   \"modalidadeAlteracao\": 1,\n   \"withdrawal\": {\n   \"cash withdrawal\": {\n   \"value\": \"5.00\",\n   \"modalidadeAlteracao\": 1,\n   }\n   }\n   },\n   ...\n   ```\n"
          title: Informações de retirada
          type: object
          oneOf:
          - type: object
            properties:
              saque:
                type: object
                title: Saque
                required:
                - valor
                - modalidadeAgente
                - prestadorDoServicoDeSaque
                description: Information related to the cash withdrawal
                properties:
                  valor:
                    type: string
                    title: Valor do saque
                    pattern: \d{1,10}\.\d{2}
                    description: Value of the cash withdrawal conducted
                  modalidadeAlteracao:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 1
                    default: 0
                    title: Modalidade de alteração do saque
                    description: Cash withdrawal value change modality. When not completed, the assumed value is 0 (zero).
                  modalidadeAgente:
                    type: string
                    title: Modalidade do Agente
                    description: '##### Agent Type

                      <table><tr><th>ACRONYM</th><th>Description</th></tr><tr><td>AGTEC</td><td>Business Establishment Agent</td></tr ><tr><td>AGTOT</td><td>Other Type of Legal Entity Agent</td></tr><tr><td>AGPSS</td><td>Agent Withdrawal Service Provider< /td></tr></table>

                      '
                    enum:
                    - AGTEC
                    - AGTOT
                    - AGPSS
                  prestadorDoServicoDeSaque:
                    type: string
                    title: Prestador do Serviço de Saque
                    pattern: \d{8}
                    description: Withdrawal Service Provider ISPB
          - type: object
            properties:
              troco:
                type: object
                title: Troco
                required:
                - valor
                - modalidadeAgente
                - prestadorDoServicoDeSaque
                description: Change related information
                properties:
                  valor:
                    type: string
                    title: Valor do troco
                    pattern: \d{1,10}\.\d{2}
                    description: Value of the change conducted
                  modalidadeAlteracao:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 1
                    default: 0
                    title: Modalidade de alteração do troco
                    description: Change value alteration modality. When not completed, the assumed value is 0 (zero).
                  modalidadeAgente:
                    type: string
                    title: Modalidade do Agente
                    description: '##### Agent Type

                      <table><tr><th>ACRONYM</th><th>Description</th></tr><tr><td>AGTEC</td><td>Business Establishment Agent</td></tr ><tr><td>AGTOT</td><td>Other Type of Legal Entity Agent</td></tr><tr><td>AGPSS</td><td>Agent Withdrawal Service Provider< /td></tr></table>

                      '
                    enum:
                    - AGTEC
                    - AGTOT
                    - AGPSS
                  prestadorDoServicoDeSaque:
                    type: string
                    title: Prestador do Serviço de Saque
                    pattern: \d{8}
                    description: Withdrawal Service Provider ISPB
    CobCompleta:
      title: Cobrança imediata completa
      required:
      - status
      allOf:
      - $ref: '#/components/schemas/CobSolicitada'
      - $ref: '#/components/schemas/CobGerada'
      - type: object
        properties:
          status:
            type: string
            title: Bill Status
            enum:
            - ATIVA
            - CONCLUIDA
            - REMOVIDA_PELO_USUARIO_RECEBEDOR
            - REMOVIDA_PELO_PSP
      - type: object
        properties:
          pix:
            type: array
            title: Pix received
            items:
              allOf:
              - $ref: '#/components/schemas/Pix_2'
              - type: object
                properties:
                  txid:
                    allOf:
                    - $ref: '#/components/schemas/TxId_2'
                    - pattern: '[a-zA-Z0-9]{26,35}'
    TxId_2:
      type: string
      title: Id da Transação
      description: "# Transaction identifier\n  Field `txid` determines the transaction identifier for reconciliation purposes. In pacs.008 it is referenced as `TransactionIdentification <txId>` or `idConciliacaoRecebedor`. The txid is retrieved by the payer’s PSP application and, after the payment is confirmed, it is sent to SPI via pacs.008. A pacs.008 is also sent to the receiver’s PSP, containing the txid in addition to all the usual payment  information. Upon receiving the payment with txid, the receiver's PSP may inform the creditor to reconcile. The contents of this field are provided exclusively by the collector, who is the ultimate responsible for them. The txid should be unique by collector’s CPF/CNPJ. The receiving PSP is responsible for validating this rule in the API.\n"
      pattern: '[a-zA-Z0-9]{26,35}'
    PessoaJuridica_2:
      type: object
      required:
      - cnpj
      - nome
      title: Pessoa Jurídica
      properties:
        cnpj:
          type: string
          title: CNPJ
          pattern: /^\d{14}$/
          description: User's CNPJ.
        nome:
          type: string
          title: Nome
          description: User's Name.
          maxLength: 200
    CobsConsultadas:
      type: object
      title: Cobranças imediatas consultadas
      required:
      - parametros
      - cobs
      properties:
        parametros:
          $ref: '#/components/schemas/ParametrosConsultaCob_2'
        cobs:
          type: array
          title: Lista de cobranças
          items:
            allOf:
            - $ref: '#/components/schemas/CobCompleta'
            - required:
              - status
              - txid
              - idCob
    PixValorTroco_2:
      type: object
      properties:
        troco:
          type: object
          required:
          - valor
          - modalidadeAgente
          - prestadorDoServicoDeSaque
          properties:
            valor:
              type: string
              title: Valor do Troco Pix
              description: Amount of Change Pix.
              pattern: \d{1,10}\.\d{2}
            modalidadeAgente:
              type: string
              title: Modalidade do Agente
              description: '##### Agent Type

                <table><tr><th>ACRONYM</th><th>Description</th></tr><tr><td>AGTEC</td><td>Business Establishment Agent</td></tr ><tr><td>AGTOT</td><td>Other Type of Legal Entity Agent</td></tr><tr><td>AGPSS</td><td>Agent Withdrawal Service Provider< /td></tr></table>

                '
              enum:
              - AGTEC
              - AGTOT
              - AGPSS
            prestadorDoServicoDeSaque:
              type: string
              title: Prestador do Serviço de Saque
              pattern: \d{8}
              description: Withdrawal Service Provider ISPB
    CobBase_2:
      type: object
      title: Cobrança Base
      description: Atributos comuns a todas entidades de Cobrança
      properties:
        chave:
          type: string
          title: Chave DICT do recebedor
          description: 'PIX Alias - Determines the alias registered in DICT, which will be used for the collection. This alias will be submitted by the payer’s PSP applications to DICT, which will return the translated information that will identify the collection creditor. *The aliases can be of the following types: phone number, e-mail address, taxpayer ID (CPF/CNPJ) or EVP.* The aliases formats can be found in [Standards Manual for starting  Pix](https://www.bcb.gov.br/estabilidadefinanceira/pagamentosinstantaneos).'
          maxLength: 77
        solicitacaoPagador:
          type: string
          title: Solicitação ao pagador
          description: Field solicitacaoPagador, optional, determines a text to be presented to the payer so that he/she may type a correlate information, in free format, to be sent to the receiver. Such text will be completed, in pacs.008, by the payer’s PSP, in field RemittanceInformation <RmtInf>. The field size <RmtInf> in pacs.008 is limited to 140 characters.
          maxLength: 140
        infoAdicionais:
          type: array
          title: Informações adicionais
          description: Each respective additional information contained in the list (name and value) must be presented to the payer.
          maximum: 50
          items:
            type: object
            required:
            - nome
            - valor
            properties:
              nome:
                type: string
                title: Nome
                description: Name of field.
                maxLength: 50
              valor:
                type: string
                title: Valor
                description: Field data.
                maxLength: 200
    CobGerada:
      type: object
      title: Cobrança imediata gerada
      description: Immediate collection data created or changed via API Pix
      required:
      - txid
      - calendario
      - revisao
      - status
      - valor
      - chave
      allOf:
      - type: object
        properties:
          calendario:
            required:
            - expiracao
            title: Calendário
            description: Fields nested under the calendar identifier organize information regarding collection-related dates.
            allOf:
            - $ref: '#/components/schemas/CobCriacao'
            - $ref: '#/components/schemas/CobExpiracao'
          txid:
            $ref: '#/components/schemas/TxId_2'
          revisao:
            $ref: '#/components/schemas/Revisao_2'
      - type: object
        properties:
          devedor:
            description: The fields nested under object debtor are optional and identify the debtor, i.e., the person or institution who owes the debt. They do not necessarily identify who will effectively make the payment. A CPF can be the debtor, but another CPF effectively makes the payment. Field `devedor.cpf` and field `devedor.cnpj` are not allowed to be completed at the same time. If field `devedor.cnpj` is completed, then, field `devedor.cpf` cannot be completed, and vice-versa. If field `devedor.nome` is completed, then, there must be or a `devedor.cpf` or a field `devedor.cnpj` completed.
            oneOf:
            - $ref: '#/components/schemas/PessoaFisica'
            - $ref: '#/components/schemas/PessoaJuridica_2'
      - type: object
        properties:
          loc:
            required:
            - id
            - location
            - tipoCob
            - criacao
            allOf:
            - $ref: '#/components/schemas/PayloadLocation_2'
      - type: object
        properties:
          location:
            type: string
            title: Localização do payload
            description: Payload location to be provided when creating the collection item.
            maxLength: 77
            format: uri
            example: pix.example.com/qr/v2/2353c790eefb11eaadc10242ac120002
            readOnly: true
      - type: object
        properties:
          status:
            type: string
            title: Status da Cobrança
            enum:
            - ATIVA
            - CONCLUIDA
            - REMOVIDA_PELO_USUARIO_RECEBEDOR
            - REMOVIDA_PELO_PSP
      - type: object
        properties:
          valor:
            required:
            - original
            allOf:
            - $ref: '#/components/schemas/CobValor'
      - $ref: '#/components/schemas/CobBaseCopiaCola_2'
    CobBaseCopiaCola_2:
      type: object
      title: Cobrança Base com Copia e Cola
      description: Attributes common to all Billing entities that have Copy and Paste information
      allOf:
      - type: object
        properties:
          pixCopiaECola:
            type: string
            title: Pix Copia e Cola correspondente à cobrança.
