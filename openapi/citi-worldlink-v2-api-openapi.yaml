        Identifies the direct debit sequence, such as first, recurrent, final or
        one-off.<br><br><b>FRST</b> : First collection of a series of direct
        debit instructions.<br><br><b>RCUR</b> : Direct debit instruction where
        the debtor's authorisation is used for regular direct debit transactions
        initiated by the creditor.<br><br><b>FNAL</b> : Final collection of a
        series of direct debit instructions.<br><br><b>OOFF</b> : Direct debit
        instruction where the debtor's authorisation is used to initiate one
        single direct debit transaction.
      enum:
        - FRST
        - RCUR
        - FNAL
        - OOFF
    AmountType3Choice:
      type: object
      properties:
        EqvtAmt:
          $ref: '#/components/schemas/EquivalentAmount2'
        InstdAmt:
          type: object
          description: >-
            Amount of money to be moved between the debtor and creditor, before
            deduction of charges, expressed in the currency as ordered by the
            initiating party.
