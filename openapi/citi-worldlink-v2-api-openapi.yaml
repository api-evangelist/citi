            - $ref: '#/components/schemas/FrequencyAndMoment1'
    FrequencyAndMoment1:
      required:
        - PtInTm
        - Tp
      type: object
      properties:
        Tp:
          type: object
          allOf:
            - $ref: '#/components/schemas/Frequency6Code'
        PtInTm:
          pattern: '[0-9]{2}'
          type: string
          description: >-
            Further information on the exact point in time the event should take
            place.
      description: >-
        Defines a frequency in terms a specific moment within a specified period
        type.
    Frequency6Code:
      type: string
      description: >-
        Specifies the regularity of an event.<br><br><b>YEAR</b> : Event takes
        place every year or once a year. <br><br><b>MNTH</b> : Event takes place
        every month or once a month. <br><br><b>QURT</b> : Event takes place
        every three months or four times a year. <br><br><b>MIAN</b> : Event
        takes place every six months or two times a year.<br><br><b>WEEK</b> :
        Event takes place once a week. <br><br><b>DAIL</b> : Event takes place
        every day. <br><br><b>ADHO</b> : Event takes place on request or as
        necessary. <br><br><b>INDA</b> : Event takes place several times a day.
        <br><br><b>FRTN</b> : Event takes place every two weeks.
      enum:
        - YEAR
        - MNTH
        - QURT
        - MIAN
        - WEEK
        - DAIL
        - ADHO
        - INDA
        - FRTN
    PaymentMethod4Code:
      type: string
      description: >-
        Specifies the means of payment that will be used to move the amount of
        money.<br><br><b>CHK</b> : Written order to a bank to pay a certain
        amount of money from one person to another person. <br><br><b>TRF</b> :
        Transfer of an amount of money in the books of the account servicer.
        <br><br><b>DD</b> : Collection of an amount of money from the debtor's
        bank account by the creditor. The amount of money and dates of
        collections may vary. <br><br><b>TRA</b> : Transfer of an amount of
        money in the books of the account servicer. An advice should be sent
        back to the account owner.
      enum:
        - CHK
        - TRF
        - DD
        - TRA
