    semantics: '"The date when the API was stopped or will be stopped by the system owner. ISO 8601-1:2019 format."'
  - name: Sunset
    semantics: '"The date when the API will no longer be Supported by the system owner. The API will no longer be
      responsive and all REQUESTS will generate an error. ISO 8601-1:2019 format."'
  - name: Link
    semantics: '"Latest working url that can be used for the same purpose."'
