    Acquirer-Request:
      title: acquirer
      description: acquirer
      properties:
        transaction_id:
          description: >-
            Identifier used by the acquirer to identify the transaction. This
            identifier may be used by the acquirer in settlement reports.
          example: ACQ7894561
          maxLength: 100
          minLength: 1
          type: string
          title: transaction_id
    Response:
      title: Response
      description: Response
      properties:
        acquirer_code:
          description: >-
            Indicates success or failure of the transaction registration. A
            value of 0 (zero) indicates success, and a value of 99 indicates
            failure.
          example: ACQ7894561
          maxLength: 100
          minLength: 1
          type: string
          title: acquirer_code
        acquirer_message:
          description: >-
            An additional message indicating the success or failure of the
            transaction registration. If the registration was successful, this
            parameter contains the value Data Received. If the registration
            failed, this parameter contains the value Data Not Receive.
          example: MSG12345
          maxLength: 255
          minLength: 1
          type: string
          title: acquirer_message
        card_holder_verification:
          $ref: '#/components/schemas/avs'
    avs:
      title: avs
      description: avs
      properties:
        acquirer_code:
          description: >-
            The acquirer AVS response code generated by the card issuing
            institution.
          example: DE1245678945123
          maxLength: 100
          minLength: 1
          type: string
          title: acquirer_code
        gateway_code:
          description: >-
            The address verification result generated to indicate whether the
            address data supplied matches the data held by the cardholder's
            issuing bank
          enum:
            - ADDRESS_MATCH
            - ADDRESS_ZIP_MATCH
            - NAME_ADDRESS_MATCH
            - NAME_MATCH
            - NAME_ZIP_MATCH
            - NOT_AVAILABLE
            - NOT_REQUESTED
            - NOT_VERIFIED
            - NO_MATCH
            - SERVICE_NOT_AVAILABLE_RETRY
            - SERVICE_NOT_SUPPORTED
            - ZIP_MATCH
          example: ADDRESS_MATCH
          type: string
          title: gateway_code
    Alipay:
      title: alipay
      type: object
      description: >-

        - For ALIPAY Pay operation method.alipay parameter is mandatory when
        method.type parameter selected as ALIPAY
      properties:
        payer_code:
          description: The end customer's bank account number (e.g. IBAN).
          example: DE1245678945123
          maxLength: 255
          minLength: 1
          type: string
          title: payer_code
    Name:
      title: name
      type: object
      properties:
        first_name:
          description: >-
            The payer's first name. 
             - For Brazil QR and UK PAYBYBANK creation, name.first_name parameter is mandatory. 
            - For US RFP this parameter is mandatory and full name has to be
            passed in this parameter 

            - For US ACH Direct Debit, cutomer.name.first_name parameter is
            optional with max length 22
          example: JOHN
          maxLength: 140
          minLength: 1
          type: string
          title: first_name
        last_name:
          description: |-
            The payer's last name. 
             - For Brazil QR and UK PAYBYBANK creation, name.last_name parameter is mandatory.
          example: PETER
          maxLength: 50
          minLength: 1
          type: string
          title: last_name
        company_name:
          description: The name of the company associated with this address.
          example: COMPANY NAME
          maxLength: 100
          minLength: 1
          type: string
          title: company_name
    Recipient-Name:
      title: recipient name
      type: object
      description: Recipient Name
      properties:
        first_name:
          description: The first name of the person to whom the order is being shipped.
          example: JOHN
          maxLength: 50
          minLength: 1
          type: string
          title: first_name
        last_name:
          description: >-
            The last name or surname of the person to whom the order is being
            shipped.
          example: PETER
          maxLength: 50
          minLength: 1
          type: string
          title: last_name
        company_name:
          description: The name of the company associated with this address.
          example: COMPANY NAME
          maxLength: 100
          minLength: 1
          type: string
          title: company_name
    Boleto:
      title: boleto
      type: object
      description: >-

        - For BOLETO Pay operation method.boleto parameter is mandatory when
        method.type parameter is selected as BOLETO
      properties:
        action_type:
          description: The action to take if the payment is not honored.
          enum:
            - WRITE_OFF
          example: WRITE_OFF
          type: string
          title: action_type
        days_before_action:
          description: >-
            Number of days granted by you to the customer after the due date of
            Boleto payment before the specified action is taken.
          example: '2'
          maxLength: 2
          minLength: 1
          type: string
          title: days_before_action
        due_date:
          description: >-
            The date by which the Boleto amount needs to be paid. 

            - For BOLETO Pay operation method.boleto.days_before_action
            parameter is mandatory
          example: '2024-03-24'
          format: date
          title: due_date
    Paypal:
      title: paypal
      type: object
      description: >-

        - For PAYPAL Pay operation method.paypal parameter is mandatory when
        method.type parameter is selected as PAYPAL
      properties:
        browser_payment_operation:
          description: The operation values for browser payments
          enum:
            - INITIATE
          example: INITIATE
          type: string
          title: browser_payment_operation
        display_shipping_address:
          description: >-
            Indicates whether you want PayPal to display the shipping address to
            the payer on the PayPal website.
          enum:
            - 'TRUE'
            - 'FALSE'
          example: 'TRUE'
          type: string
          title: display_shipping_address
        override_shipping_address:
          description: >-
            Indicates whether you want to allow the payer to change the shipping
            address for the payment on the PayPal website
          enum:
            - 'TRUE'
            - 'FALSE'
          example: 'TRUE'
          type: string
          title: override_shipping_address
        payment_confirmation:
          description: >-
            Indicates where in the checkout flow you want the payer to commit to
            the payment - on the PayPal website or on your website after
            returning from the PayPal website.
          enum:
            - CONFIRM_AT_MERCHANT
            - CONFIRM_AT_PROVIDER
          example: CONFIRM_AT_PROVIDER
          type: string
          title: payment_confirmation
    Paypal-Update:
      title: paypal Update
      type: object
      description: >-

        - For PAYPAL Pay operation method.paypal parameter is mandatory when
        method.type parameter is selected as PAYPAL
      properties:
        browser_payment_operation:
          description: The operation values for browser payments
          enum:
            - CONFIRM
          example: CONFIRM
          type: string
          title: browser_payment_operation
    Paypal-Response:
      title: Paypal
      description: Paypal Method Response
      properties:
        account_email:
          description: The email address of the payer's PayPal account.
          example: john@gmail.com
          maxLength: 100
          minLength: 4
          type: string
          title: account_email
        account_holder:
          description: The name of the account holder of the payer's PayPal account
          example: john@gmail.com
          maxLength: 255
          minLength: 1
          type: string
          title: account_holder
        billing_agreement:
          $ref: '#/components/schemas/Billing-Agreement'
        payer_id:
          description: The unique identifier for the payer assigned by PayPal
          example: '4'
          maxLength: 13
          minLength: 1
          type: string
          title: payer_id
    Billing-Agreement:
      title: Billing Agreement
      description: Paypal Billing Method Response
      properties:
        cardinality:
          description: >-
            Indicates the number of billing agreements between you and this
            payer.
          example: '4'
          maxLength: 100
          minLength: 1
          type: string
          title: cardinality
        description:
          description: >-
            Your description for the PayPal billing agreement.This description
            is displayed to the payer when they are asked to approve the billing
            agreement.
          example: '4'
          maxLength: 255
          minLength: 1
          type: string
          title: description
        id:
          description: An identifier provided by PayPal for the billing agreement
          example: '4'
          maxLength: 100
          minLength: 1
          type: string
          title: id
        name:
          description: Your name for the PayPal billing agreement
          example: '4'
          maxLength: 255
          minLength: 1
          type: string
          title: name
    Card-Response:
      title: card
      description: Card Method Response
      properties:
        number:
          description: >-
            The account number of the payer's account used for the payment. On
            requests, provide the number in the form that you receive it (as
            explained below). On responses, the gateway populates it with a form
            that the payer would recognize.
          example: PA123456789
          maxLength: 23
          minLength: 9
          type: string
          title: number
        expiry_month:
          description: Two-digit month in which the payment card expires.
          example: '01'
          type: string
          pattern: ^(0?[1-9]|1[0-2])$
          title: expiry_month
        expiry_year:
          description: Four-digit year in which the payment card expires.
          type: string
          pattern: ^[0-9]{2,2}$
          example: '25'
          title: expiry_year
        encryption:
          description: >-
            The encryption framework used for the payment details received by
            the gateway.
          enum:
            - DEVICE
            - DIGITAL_WALLET
            - DUKPT
          example: DEVICE
          type: string
          title: encryption
        funding_method:
          description: Funding method.
          example: '24'
          maxLength: 50
          minLength: 1
          type: string
          title: funding_method
        scheme:
          description: Card scheme details.
          example: '24'
