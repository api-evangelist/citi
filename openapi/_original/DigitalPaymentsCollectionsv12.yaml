    Authentication-Customer-Payer-Request:
      title: Authentication Customer Payer Request
      description: Authentication-Customer-Payer-Request
      properties:
        action:
          description: >-
            Behaviour relating to the association between the customer account
            and their card.
          enum:
            - AUTHENTICATION
            - REGISTRATION
          example: REGISTRATION
          type: string
          title: action
        data:
          description: >-
            Data returned by an authentication service used when the customer
            logged in (e.g., FIDO token).
          example: PA123456789
          maxLength: 20000
          minLength: 1
          type: string
          title: data
        method:
          description: The method used to authenticate the payer.
          enum:
            - CUSTOMER_ACCOUNT_LOGIN
            - FEDERATED_IDENTITY_LOGIN
            - FIDO_AUTHENTICATION
            - ISSUER_ACCOUNT_LOGIN
            - NONE
            - THIRD_PARTY_ACCOUNT_LOGIN
          example: NONE
          type: string
          title: method
        time:
          type: string
          format: date-time
          description: >-
            Date and time the payer was authenticated
            (YYYY-MM-DDThh:mm:ss.SSSZ).
          example: '2022-09-13T08:23:49.114Z'
          title: update_time
    Authentication-Customer-Payer-Response:
      title: Authentication Customer Payer Response
      description: Authentication-Customer-Payer-Response
      properties:
        action:
          description: >-
            Behaviour relating to the association between the customer account
            and their card.
          enum:
            - AUTHENTICATION
            - REGISTRATION
          example: REGISTRATION
          type: string
          title: action
        status:
          description: Status of the card association functionality.
          enum:
            - FAILED
            - NOT_SUPPORTED
            - SUCCESSFUL
            - SUPPORTED
          example: FAILED
          type: string
          title: status
        method:
          description: The method used to authenticate the payer.
          enum:
            - CUSTOMER_ACCOUNT_LOGIN
            - FEDERATED_IDENTITY_LOGIN
            - FIDO_AUTHENTICATION
            - ISSUER_ACCOUNT_LOGIN
            - NONE
            - THIRD_PARTY_ACCOUNT_LOGIN
          example: NONE
          type: string
          title: method
        time:
          type: string
          format: date-time
          description: >-
            Date and time the payer was authenticated
            (YYYY-MM-DDThh:mm:ss.SSSZ).
          example: '2022-09-13T08:23:49.114Z'
          title: update_time
    Authentication-Customer-History-Payer-Request:
      title: Authentication Customer History Payer Request
      description: Authentication-Customer-Payer-Request
      properties:
        attempts:
          description: Number of attempts to add/change a card in the last 24 hours (0-99).
          example: '99'
          maximum: 99
          minimum: 1
          type: number
          title: attempts
        annual_activity:
          description: >-
            Number of transactions (successful/abandoned) in the last year
            (0-999).
          example: '99'
          maximum: 999
          minimum: 1
          type: number
          title: annual_activity
        creation_date:
          type: string
          format: date
          description: The date the payer created an account (yyyy-mm-dd).
          example: '2022-09-13'
          title: creation_date
        issuer_acs_id:
          description: The unique transaction identifier used by the issuer's ACS.
          example: PA123456789
          maxLength: 36
          minLength: 1
          type: string
          title: issuer_acs_id
        authentication_token:
          description: The authentication token obtained from a previous request.
          example: PA123456789
          maxLength: 32
          minLength: 28
          type: string
          title: authentication_token
        directory_server_id:
          description: >-
            A unique transaction identifier assigned by the scheme Directory
            Server.
          example: PA123456789
          maxLength: 50
          minLength: 1
          type: string
          title: directory_server_id
        authentication_time:
          type: string
          format: date-time
          description: >-
            The date and time the payer was authenticated for the prior
            transaction (YYYY-MM-DDThh:mm:ss.SSSZ).
          example: '2022-09-13T08:23:49.114Z'
          title: authentication_time
        authentication_id:
          description: >-
            The gateway transaction ID of a previous Authenticate Payer request
            to reuse authentication data.
          example: PA123456789
          maxLength: 50
          minLength: 1
          type: string
          title: authentication_id
        authentication_type:
          description: The method used to authenticate the payer for a prior transaction.
          enum:
            - 3DS_FRICTIONLESS
            - 3DS_CHALLENGE
            - ADDRESS_VERIFICATION
            - OTHER
          example: OTHER
          type: string
          title: authentication_type
        last_updated_date:
          type: string
          format: date
          description: The date the payer's account with you was last updated (yyyy-mm-dd).
          example: '2022-09-13'
          title: last_updated_date
        password_last_changed_date:
          type: string
          format: date
          description: The date the payer's account with you was last updated (yyyy-mm-dd).
          example: '2022-09-13'
          title: password_last_changed_date
        transaction_activity:
          description: >-
            Number of transactions (successful/abandoned) in the last 24 hours
            (0-99).
          example: '99'
          maximum: 99
          minimum: 1
          type: number
          title: transaction_activity
        shipping_address_date:
          type: string
          format: date
          description: >-
            The date you first shipped goods to the provided shipping address
            (yyyy-mm-dd).
          example: '2022-09-13'
          title: shipping_address_date
        suspicious_activity:
          description: >-
            Have you experienced suspicious activity on the account in the past
            (true/false).
          type: boolean
          example: false
          title: suspicious_activity
    Pix:
      title: Pix
      description: |2-

         - For Brazil QR creation method.pix parameter is mandatory when method.type parameter is selected as PIX
      properties:
        tax_id:
          description: |-
            Customer's payer identification (e.g., email address) 
             - For Brazil QR Creation, method.pix.tax_id parameter is mandatory, individual person tax identification (CPF) allowed length = 11  or business entity tax identification (CNPJ) allowed length = 14
          example: 1.020.340/8910-22
          maxLength: 128
          minLength: 1
          type: string
          title: tax_id
    Upi:
      title: Upi
      description: India UPI Transaction
      properties:
        initiation_type:
          description: |-
            Mode of payment 
            - For India UPI trasnaction, this parameter is Mandatory
          maxLength: 50
          minLength: 1
          type: string
          example: UPI QR Code
          title: initiation_type
    Ach:
      title: ach
      type: object
      description: >-

        - For ACH Pay operation method.ach parameter is mandatory when
        method.type parameter is selected as ACH 

        - For ACH Verify operation method.ach parameter is is mandatory when
        method.type parameter is selected as ACH
      properties:
        sec_code:
          description: >-
            Identifies the Standard Entry Class (SEC) code to be sent to the
            issuer where WEB = Internet Initiated/Mobile Entry, TEL =
            Telephone-Initiated Entry, PPD = Prearranged Payment and Deposit,
            CCD = Corporate Credit or Debit Entry, IAT = International ACH
            Transaction. 
             - For ACH Pay transaction method.ach.sec_code parameter is mandatory 
            - For US ACH Direct Debit, method.ach.sec_code parameter is
            mandatory with the following allowed values - IAT, CCD, PPD, and WEB
          enum:
            - WEB
            - TEL
            - PPD
            - CCD
            - IAT
          example: WEB
          type: string
          title: sec_code
    Device:
      title: device
      type: object
      description: Device
      properties:
        eci_indicator:
          description: >-
            The Electronic Commerce Indicator generated for payments made using
            a device payment method.
          example: '12'
          maxLength: 2
          minLength: 1
          type: string
          title: eci_indicator
        cryptogram:
          description: A cryptogram used to authenticate the transaction.
          example: '56789'
          maxLength: 128
          minLength: 1
          type: string
          title: cryptogram
        cryptogram_format:
          description: The format of the cryptogram provided for the digital payment.
          enum:
            - 3DSECURE
            - EMV
          example: EMV
          type: string
          title: cryptogram_format
        payment_token:
          description: >-
            This is the payment token that you received from the device's
            payment SDK.
          example: '56789'
          maxLength: 16384
          minLength: 1
          type: string
          title: payment_token
        masked_fpan:
          description: >-
            The Funding Primary Account Number (FPAN) of the payer's account in
            6.4 masking format.
          example: '5678967898'
          maxLength: 19
          minLength: 9
          type: string
          title: masked_fpan
        masked_fpan_expiry_month:
          description: The expiration month for the Funding Primary Account Number (FPAN).
          example: '12'
          type: string
          pattern: ^(0?[1-9]|1[0-2])$
          title: masked_fpan_expiry_month
        masked_fpan_expiry_year:
          description: The expiration year for the Funding Primary Account Number (FPAN).
          type: string
          pattern: ^[0-9]{2,2}$
          example: '25'
          title: masked_fpan_expiry_year
        sequence_number:
          description: >-
            A number used to differentiate between cards with the same Primary
            Account Number (PAN).
          example: '879'
          maxLength: 999
          minLength: 1
          type: string
          title: sequence_number
    Authentication-Device-Payment:
      title: device
      type: object
      description: Device
      properties:
        eci_indicator:
          description: The Electronic Commerce Indicator generated for device payments.
          example: '12'
          maxLength: 2
          minLength: 1
          type: string
          title: eci_indicator
        online_payment_cryptogram:
          description: >-
            A cryptogram used to authenticate the transaction (from decrypted
            token).
          example: '56789'
          maxLength: 200
          minLength: 1
          type: string
          title: online payment cryptogram
        cryptogram_format:
          description: The format of the cryptogram provided for the digital payment.
          enum:
            - 3DSECURE
            - EMV
          example: EMV
          type: string
          title: cryptogram_format
        token:
          description: >-
            The payment token received from the device's payment SDK (e.g.,
            Apple Pay).
          example: '56789'
          maxLength: 16384
          minLength: 1
          type: string
          title: token
    Authentication-Device-Payment-Response:
      title: Authentication Device Payment Response
      type: object
      description: Device
      properties:
        cryptogram_format:
          description: The format of the cryptogram provided for the digital payment.
          enum:
            - 3DSECURE
            - EMV
          example: EMV
          type: string
          title: cryptogram_format
    Acquirer:
      title: acquirer
      type: object
      description: Acquirer
      properties:
        custom_data:
          description: >-
            Additional information requested by the acquirer which cannot be
            passed using other available data parameters.
          example: PAYEMNT FOR GOODS
          maxLength: 2048
          minLength: 1
          type: string
          title: custom_data
        transaction_id:
          description: This is the value provided to the acquirer to identify the order.
          example: AQ1234567
          maxLength: 100
          minLength: 1
          type: string
          title: transaction_id
        trace_id:
          description: >-
            The unique identifier that allows the issuer to link related
            transactions.
          example: AQ1234567
          maxLength: 15
          minLength: 1
          type: string
          title: trace_id
    Acquirer-Refund-Response:
      title: Acquirer Refund Response
      type: object
      description: Acquirer
      properties:
        transaction_id:
          description: >-
            Identifier used by the acquirer to identify the transaction This
            identifier may be used by the acquirer in settlement reports.
          example: AQ1234567
          maxLength: 40
          minLength: 1
          type: string
          title: transaction_id
        batch:
          description: >-
            The processor's identifier for the settlement batch Provided only if
            the transaction was settled by batch.
          example: AQ1234567
          maxLength: 2147483647
          minLength: 1
          type: string
          title: batch
        date:
          description: >-
            The date the transaction was processed, as returned by the acquirer
            Not returned by most acquirers
          example: '4455'
          maxLength: 4000
          minLength: 1
          type: string
          title: date
        id:
          description: The ID for the acquirer used to process the transaction
          example: ID124455
          maxLength: 40
          minLength: 1
          type: string
          title: id
        settlement_date:
          type: string
          format: date
          description: >-
            The date the acquirer expects the funds to be transferred to (in the
            case of payments) or from (in the case of refunds) the merchant's
            account The date is defined in the acquirer's time zone (see
            transaction.acquirer.timeZone).
          example: '2022-09-07'
          title: settlement_date
        time_zone:
          type: string
          format: date-time
          description: GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ)
          example: '2022-09-13T08:23:49.114Z'
          title: time_zone
    Constraints:
      title: constraints
      type: object
      description: Constraints
      properties:
        deferral_period:
          description: The allowable number of deferral months for the payment plan.
          example: PAYEMNT FOR GOODS
          maxLength: 99
          minLength: 1
          type: string
          title: deferral_period
        number_of_payments:
          description: The allowable number of installments for the payment plan.
          maxLength: 99
          minLength: 1
          type: string
          title: number_of_payments
        supported:
          description: >-
            The identifiers for the payment plans supported for this
            transaction.
          example: '67'
          maxLength: 40
          minLength: 1
          type: string
          title: supported
    Product-Info:
      title: Product-Info
      type: object
      description: Product related information
      properties:
        id:
          description: Product ID
          example: PAYEMNTFORGOODS
          maxLength: 128
          minLength: 1
          type: string
          title: id
        name:
          description: |-
            Product Name 
             - For UK PAYBYBANK creation, product_info.name parameter is mandatory, if product_info object is selected
          example: GOODS
          maxLength: 128
          minLength: 1
          type: string
          title: name
        quantity:
          description: |-
            Product Quantity 
             - For UK PAYBYBANK creation, product_info.quantity parameter is mandatory, if product_info object is selected
          example: 200
          maximum: 1000000
          minimum: 1
          type: number
          title: quantity
        amount:
          description: |-
            Product amount 
             - For UK PAYBYBANK creation, product_info.amount parameter is mandatory, if product_info object is selected
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        description:
          description: Description of the product
          example: GOODS
          maxLength: 300
          minLength: 1
          type: string
          title: description
    Transit:
      title: transit
      type: object
      description: Transit
      properties:
        known_fare:
          description: >-
            Indicates if this is a transaction for a known fare submitted at the
            time of travel or after the payer has already gained access to the
            transit service (deferred Authorization).
          enum:
            - DEBT_RECOVERY_MERCHANT_INITIATED
            - DEBT_RECOVERY_PAYER_INITIATED
            - DEBT_RECOVERY_TAP_INITIATED
            - FARE_DEFERRED_AUTHORIZATION
            - FARE_REAL_TIME_AUTHORIZATION
          example: FARE_REAL_TIME_AUTHORIZATION
          type: string
          title: known_fare
        aggregated_fare:
          $ref: '#/components/schemas/Aggregated-Fare'
    Aggregated-Fare:
      title: aggregated
      properties:
        type:
          description: >-
            Provide the transport mode used by the payer for the first trip when
            fare collection is aggregated across one or more trips as well as
            for merchant-initiated debt recovery transactions. 

            - DEBT_RECOVERY_MERCHANT_INITIATED Transaction for a debt recovery
            for an known transit fare initiated by Merchant (according to the
            scheme rules). 

            - DEBT_RECOVERY_PAYER_INITIATED Transaction for a debt recovery for
            an known transit fare initiated by payer (according to the scheme
            rules). 

            - DEBT_RECOVERY_TAP_INITIATED Transaction for a debt recovery for an
            known transit fare tap initiated (according to the scheme rules). 

            - FARE_DEFERRED_AUTHORIZATION Known transit fare payment where you
            are submitting the Authorization after the payer has already gained
            access to the transit service (deferred Authorization). 

            - FARE_REAL_TIME_AUTHORIZATION Known transit fare payment where you
            are submitting the Authorization at the time of travel.
          enum:
            - DEBT_RECOVERY_MERCHANT_INITIATED
            - DEBT_RECOVERY_PAYER_INITIATED
            - DEBT_RECOVERY_TAP_INITIATED
            - FARE_DEFERRED_AUTHORIZATION
            - FARE_REAL_TIME_AUTHORIZATION
          example: DEBT_RECOVERY_TAP_INITIATED
          type: string
          title: type
        transportation_mode:
          description: >-
            Indicates if this is a transaction for an aggregated transit fare or
            a merchant-initiated, tap-initiated or payer-initiated debt recovery
            for an aggregated transit fare.
          enum:
            - CABLE_CAR
            - COACH
            - COMMUTER_TRAIN
            - EXPRESS_COMMUTER_TRAIN
            - FUNICULAR_TRAIN
            - HIGH_SPEED_TRAIN
            - INTERURBAN_BUS
            - INTER_CITY
            - LIGHT_TRAIN_MASS_TRANSIT
            - LOCOMOTIVE
            - OTHER
            - PARA_TRANSIT
            - PARKING
            - POWERED_MOTOR_VEHICLE
            - REGIONAL_TRAIN
            - RURAL_BUS
            - SELF_DRIVE_VEHICLE
            - TAXI
            - TOLL
            - TRAILER
            - TRAIN
            - URBAN_BUS
            - WATER_BORNE_VEHICLE
          example: COMMUTER_TRAIN
          type: string
          title: transportation_mode
        start_date:
          description: >-
            This is the start date of an aggregation and matches the date of the
            first travel or first tap within the aggregation period.
          example: '2024-03-07'
          format: date
          type: string
          title: start_date
    Holder-Name:
      title: Holder-Name
      description: The name of the bank account holder for the payer's bank account.
      properties:
        first_name:
          description: |-
            first_name. 
             - For ACH Pay and verify transaction method.holder.first_name parameter is mandatory 
             - For India Card transactions, method.holder.first_name parameter is mandatory
          example: PETER
          maxLength: 50
          minLength: 1
          type: string
          title: first_name
        last_name:
          description: |-
            last_name. 
             - For ACH Pay and verify transaction method.holder.last_name parameter is mandatory 
             - For India Card transactions, method.holder.last_name parameter is mandatory
          example: A
          maxLength: 50
          minLength: 1
          type: string
          title: last_name
    Refunds-Request:
      type: object
      title: Refunds-Request
      required:
        - method
        - transaction
      properties:
        method:
          $ref: '#/components/schemas/Refund-Method'
        transaction:
          $ref: '#/components/schemas/Refund-Transaction'
        order:
          $ref: '#/components/schemas/Refund-Order'
        original_payment:
          $ref: '#/components/schemas/Original-Initial-Payment'
    Refund-Method:
      title: Method
      type: object
      required:
        - type
      properties:
        type:
          description: |-
            Method specified by the customer for the transaction 
            - Provide PIX for brazil QR creation 
            - Provide CARD for CARD transactions 
            - Provide UPI for India UPI transactions 
            - Provide FPS for UK transactions 
            - Provide PAYPAL for PAYPAL transactions 
            - Provide ACH for US Return & Reversal 
            - Provide GOOGLEPAY for GOOGLEPAY transactions 
            - Provide APPLEPAY for APPLEPAY transactions
          type: string
          enum:
            - PIX
            - CARD
            - UPI
            - FPS
            - ACH
            - PAYPAL
            - GOOGLEPAY
            - APPLEPAY
            - AFTERPAY
            - AMAZON_PAY
            - BITPAY
            - BIZUM
            - ALIPAY
            - TRUSTLY
            - BLIK
            - BLIK_BNPL
            - CASH_APP
            - DOKU_WALLET
            - EPS
            - ESTONIAN_BANKS
            - VERKKOPANKKI
            - FLOAPAY
            - FPX
            - GOPAY
            - IDEAL
            - INDOMARET
            - INDONESIAN_BANKS
            - JENIUS_PAY
            - KREDIVO
            - LATVIAN_BANKS
            - LINK_AJA
            - LITHUANIAN_BANKS
            - MBWAY
            - MULTIBANCO
            - OVO_WALLET
            - PAYSAFECARD
            - P24
            - SATISPAY
            - SCALAPAY
            - SKRILL
            - SWISH
            - THAIBANKS
            - TWINT
            - WERO
            - ZIP
            - BANCOMATPAY
            - DRAGONPAY
            - MYBANK
            - ALFAMART
            - PAYU
            - BANCONTACT
            - STABLECOINS
            - OXXO_PAY
          example: PIX
          title: type
    Refund-Transaction:
      title: Transaction
      required:
        - id
        - country_code
      properties:
        id:
          maxLength: 128
          minLength: 1
          type: string
          description: >-
            Unique Transaction identification provided by the merchant during
            refund transaction creation. 
             - For IN UPI transaction.id allowed max length is 16 
             - For Brazil PIX transaction.id allowed min and max length is 35 
             - For Card transaction, transaction.id allowed maxlength is 40 
            - For ACH Return & Reversal, this parameter is mandatory with max
            length 35.
          example: pay02052023456r
          title: id
        amount:
          description: >-
            Transaction amount 
             - For Brazil refund payment, decimal values are mandatory for transaction.amount and it must have 2 digits 
             - For Brazil refund payment, transaction maxmium amount limit is 9999999999.99 and transaction.amount parameter is mandatory 
            - For Card refund payment, transaction.amount parameter is mandatory
            and allowed max 2 decimal after dot. 

            - For India UPI refund payment, transaction.amount parameter is
            mandatory and allowed minimum amount is 1 and maximum amount is
            200000.00. 

            - For UK FPS refund payment, transaction.amount parameter is
            mandatory and allowed minimum amount is 0.01 and maximum amount is
            1MM.
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        reference:
          description: |-
            Transaction additional information.  
             - The transaction.reference parameter is optional for Card transaction and allowed maxlength is 40
          example: REPAY
          maxLength: 250
          minLength: 1
          type: string
          title: reference
        currency_code:
          description: >-
            ISO 4217 Currency Code for instance  USD/GBP/EUR/INR 

            - For Brazil PIX, India UPI, UK FPS and Card refund payment,
            transaction.currency_code parameter is mandatory.
          enum:
            - BRL
            - USD
            - INR
            - GBP
            - EUR
            - CAD
            - HKD
            - AUD
            - SGD
            - DKK
            - NOK
            - SEK
            - PLN
            - IDR
            - MYR
            - THB
            - CHF
            - PHP
            - CZK
          example: BRL
          type: string
          title: currency_code
        country_code:
          description: Country code
          enum:
            - US
            - BR
            - IN
            - GB
            - TH
            - AU
            - CA
            - MX
            - DE
            - NL
            - IE
            - IT
            - FR
            - ES
            - HK
            - SG
            - NZ
            - DK
            - 'NO'
            - SE
            - SW
            - BE
            - FI
            - CH
            - CZ
            - AT
            - PT
          example: US
          type: string
          title: country_code
        reason:
          description: >-
            Cancellation/adjustment reason. 
             - The transaction.reason parameter is optional for Card transaction. 
            - For ACH Return & Reversal, this parameter is optional with max
            length 44.
          example: REPAY
          maxLength: 140
          minLength: 1
          type: string
          title: reason
        refund_authorization:
          description: >-
            This parameter is used to indicate that you want the gateway to
            authorize the Refund with the issuer before submitting it to the
            acquirer. 
             - The transaction.refund_authorization parameter is optional for Card transaction.
          enum:
            - 'Y'
            - 'N'
          example: 'Y'
          type: string
          title: refund_authorization
        action:
          description: |-
            Indicates if this request is for Return or Reversal 
             - For US ACH Return & Reversal, this is a mandatory parameter.
          enum:
            - RETURN
            - REVERSAL
          example: RETURN
          type: string
          title: action
    Refund-Order:
      title: ' Refund Order'
      properties:
        id:
          description: >-
            A unique identifier for this order to distinguish it from any other
            order you create. 

            - The order.id parameter is optional for Card transaction and its
            mandatory
          example: OR123456789
          maxLength: 40
          minLength: 1
          type: string
          title: id
        reference:
          description: >-
            An optional identifier for the orderFor example, a shopping cart
            number, an order number, or an invoice number.  
             - The order.reference parameter is optional for Card transaction and allowed maxlength is 200
          example: REPAY
          maxLength: 250
          minLength: 1
          type: string
          title: reference
    Session-Create-Request:
      title: Create Session Request
      type: object
      required:
        - id
      properties:
        id:
          description: Request Id
          type: string
          minLength: 1
          maxLength: 128
          example: ABC123456
          title: id
        session:
          $ref: '#/components/schemas/Session'
    Session:
      title: Session
      type: object
      properties:
        authentication_limit:
          description: >-
            The number of operations which may be submitted to the gateway using
            this session id as a password.This field applies when you write a
            browser or mobile app that issues operations to the gateway from the
            device, using the session id as a password.In that case, a payer (or
            a compromised browser), could issue a large number of requests to
            the gateway on your behalf, and you could incur unnecessary fees as
            a result.This field lets you limit your exposure to that risk. The
            value defaulted by the gateway is suitable for typical payments.
            There is an upper limit (your operation will be rejected if that
            limit is exceeded).
          type: string
          pattern: ^(?:[1-9]|1[0-9]|2[0-5])$
          example: '12'
          title: authentication_limit
        validity:
          description: >-
            Time till which session id can be used within the authentication
            limit in minutes(min: 1 minute; max: 25 minutes)
          type: string
          pattern: ^(?:[1-9]|1[0-9]|2[0-5])$
          example: '12'
          title: validity
    Session-Status-Response:
      title: Create Status Response
      type: object
      required:
        - session
        - status
      properties:
        status:
          type: string
          enum:
            - SUCCESS
            - FAILED
          description: >-
            A system-generated high level overall result of the
            transaction/operation.Value must be a member of the following list.
            The values are case sensitive.
          title: status
        session:
          $ref: '#/components/schemas/Session-Get-Response'
        method:
          $ref: '#/components/schemas/Method-Session-Update'
        card:
          $ref: '#/components/schemas/Session-Get-Status-Card-Notification'
        ach:
          $ref: '#/components/schemas/Session-Get-Status-Ach-Notification'
    Session-Create-Response:
      title: Create Session Response
      type: object
      required:
        - id
        - status
        - session
      properties:
        id:
          description: Request Id
          type: string
          minLength: 1
          maxLength: 128
          example: ABC123456
          title: id
        status:
          type: string
          enum:
            - SUCCESS
            - FAILED
          description: >-
            A system-generated high level overall result of the
            transaction/operation.Value must be a member of the following list.
            The values are case sensitive.
          title: status
        session:
          $ref: '#/components/schemas/Session-Response'
    Session-Update-Request:
      title: Update Request
      type: object
      properties:
        method:
          $ref: '#/components/schemas/Method-Session-Update'
        card:
          $ref: '#/components/schemas/Session-Get-Status-Card-Notification'
        ach:
          $ref: '#/components/schemas/Session-Get-Status-Ach-Notification'
    Session-Update-Response:
      title: Update Status Response
      type: object
      required:
        - session
        - status
      properties:
        status:
          type: string
          enum:
            - SUCCESS
            - FAILED
          description: >-
            A system-generated high level overall result of the
            transaction/operation.Value must be a member of the following list.
            The values are case sensitive.
          title: status
        session:
          $ref: '#/components/schemas/Session-Updat-Response'
        method:
          $ref: '#/components/schemas/Method-Session-Update'
        card:
          $ref: '#/components/schemas/Session-Get-Status-Card-Notification'
        ach:
          $ref: '#/components/schemas/Session-Get-Status-Ach-Notification'
    Session-Get-Status-Card-Notification:
      title: Session Get Card
      type: object
      properties:
        number:
          description: Card Number that needs to be tokenized
          type: string
          minLength: 9
          maxLength: 23
          example: '4012000033330026'
          title: number
        expiry_month:
          description: Two-digit month in which the payment card expires
          example: '01'
          type: string
          pattern: ^(0?[1-9]|1[0-2])$
          title: expiry_month
        expiry_year:
          description: Two-digit year in which the payment card expires
          type: string
          pattern: ^[0-9]{2,2}$
          example: '25'
          title: expiry_year
    Session-Get-Status-Ach-Notification:
      title: Session Get Ach
      type: object
      properties:
        account_number:
          description: Account Number that needs to be tokenized
          type: string
          minLength: 1
          maxLength: 17
          example: '401200003333'
          title: account_number
        routing_number:
          description: Routing Number that needs to be tokenized
          type: string
          minLength: 9
          maxLength: 9
          example: '401200003333'
          title: routing_number
        account_type:
          type: string
          enum:
            - SAVINGS
            - CHECKING
          description: >-
            An indicator identifying the type of bank account.Consumer (checking
            or savings), orBusinessFor pre-arranged payments
            (sourceOfFunds.provided.ach.secCode=PPD) retrieve this information
            from the payer.If payments were telephone-initiated
            (sourceOfFunds.provided.ach.secCode=TEL) or internet-initiated
            (sourceOfFunds.provided.ach.secCode=WEB) you may choose to limit the
            payer's options (e.g. only support consumer checking accounts),
            depending on your type of business (e.g. B2C online webshop).
          title: status
          example: CHECKING
    Session-Response:
      title: Session
      type: object
      required:
        - id
        - authentication_limit
        - validity
      properties:
        id:
          description: >-
            The identifier for the payment session.You can add request fields to
            the session using a Hosted Payment Form or wallet provider
            interaction, or the Update Session operation.
          type: string
          minLength: 36
          maxLength: 37
          example: SES1234567890123456789012345678
          title: id
        authentication_limit:
          description: >-
            The number of operations which may be submitted to the gateway using
            this session id as a password.This field applies when you write a
            browser or mobile app that issues operations to the gateway from the
            device, using the session id as a password.In that case, a payer (or
            a compromised browser), could issue a large number of requests to
            the gateway on your behalf, and you could incur unnecessary fees as
            a result.This field lets you limit your exposure to that risk. The
            value defaulted by the gateway is suitable for typical payments.
            There is an upper limit (your operation will be rejected if that
            limit is exceeded).
          type: string
          pattern: ^(?:[1-9]|1[0-9]|2[0-5])$
          example: '12'
          title: authentication_limit
        validity:
          description: >-
            Time till which session id can be used within the authentication
            limit in minutes(min: 1 minute; max: 25 minutes)
          type: string
          pattern: ^(?:[1-9]|1[0-9]|2[0-5])$
          example: '12'
          title: validity
        access_key:
          description: >-
            For some gateway operations invoked via a payer device, you supply
            your website as a return URL.On return to your website
          type: string
          minLength: 44
          maxLength: 44
          example: SES1234567890123456789012345678
          title: access_key
    Method-Session-Update:
      title: Method Session Update
      description: Session method
      properties:
        holder_name:
          $ref: '#/components/schemas/Holder-Session-Name'
    Holder-Session-Name:
      title: Holder Session name
      description: Session Name
      properties:
        first_name:
          description: first_name.
          example: PETER
          maxLength: 50
          minLength: 1
          type: string
          title: first_name
        last_name:
          description: last_name.
          example: A
          maxLength: 50
          minLength: 1
          type: string
          title: last_name
    Session-Get-Response:
      title: Session
      type: object
      required:
