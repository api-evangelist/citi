openapi: 3.0.3
info:
  title: Brazil QR code - Dynamic Immediate Collections API
  description: >-
    This API allows clients to accept and manage PIX QR code collections for
    immediate use. PIX is a payment method owned by the Central Bank of Brazil
    (Banco Central), offering instant direct bank transfers in Brazil.
  version: 1.0.0
servers:
  - url: https://tts.sit.apib2b.citi.com/citiconnect/sit5/
    description: dev gateway url
  - url: https://tts.apib2b.citi.com/citiconnect/prod/
    description: production gateway url
  - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb/
    description: 'sbox url '
paths:
  /paymentservices/collections/qrcodes/cob/{txid}:
    parameters:
      - $ref: '#/components/parameters/TxId'
      - $ref: '#/components/parameters/ClientId'
    put:
      summary: Create immediate Collection.
      operationId: dynamicCollectionCreation
      security:
        - cobWriteSample:
            - cob.write
      description: Endpoint to create an Immediate collection.
      requestBody:
        $ref: '#/components/requestBodies/CobBody'
      responses:
        '201':
          $ref: '#/components/responses/CobGeradaResponse'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/AcessoNegado1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoInvalido'
        '415':
          $ref: '#/components/responses/MidiaInvalida'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel1'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    get:
      parameters:
        - $ref: '#/components/parameters/Revisao'
        - $ref: '#/components/parameters/CNPJ'
      summary: See Immediate Collection.
      operationId: dynamicCollectionInquiry
      security:
        - cobReadSample:
            - cob.read
      description: >-
        Endpoint intended to retrieve details for a Collection using a specific
        TXID.
      responses:
        '200':
          $ref: '#/components/responses/CobCompletaResponse'
        '401':
          $ref: '#/components/responses/AcessoNegado1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoInvalido'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel1'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    patch:
      parameters:
        - $ref: '#/components/parameters/CNPJ'
      summary: Update immediate Collection.
      operationId: dynamicCollectionUpdate
      security:
        - cobWriteSample:
            - cob.write
      description: Endpoint to update an Immediate collection.
      requestBody:
        $ref: '#/components/requestBodies/CobBodyRevisada'
      responses:
        '200':
          $ref: '#/components/responses/CobGeradaResponse'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/AcessoNegado1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoInvalido'
        '415':
          $ref: '#/components/responses/MidiaInvalida'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel1'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
  /paymentservices/collections/qrcodes/cob:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      parameters:
        - $ref: '#/components/parameters/Inicio'
        - $ref: '#/components/parameters/Fim'
        - $ref: '#/components/parameters/CPF'
        - $ref: '#/components/parameters/CNPJ'
        - $ref: '#/components/parameters/LocationPresente'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/PaginaAtual'
        - $ref: '#/components/parameters/ItensPorPagina'
      summary: See Immediate Collection List.
      operationId: dynamicCollectionInquiryList
      security:
        - cobReadSample:
            - cob.read
      description: >-
        Endpoint intended to check a Collection through parameters such as start
        date, end date, taxpayer ID (CPF/CNPJ) and status.
      responses:
        '200':
          $ref: '#/components/responses/CobsConsultadasResponse'
        '401':
          $ref: '#/components/responses/AcessoNegado1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoInvalido'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel1'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
components:
  schemas:
    TxId:
      type: string
      title: Id da Transação
      description: |
        # Transaction identifier
          Field `txid` determines the transaction identifier for reconciliation purposes. In pacs.008 it is referenced as `TransactionIdentification <txId>` or `idConciliacaoRecebedor`. The txid is retrieved by the payer’s PSP application and, after the payment is confirmed, it is sent to SPI via pacs.008. A pacs.008 is also sent to the receiver’s PSP, containing the txid in addition to all the usual payment  information. Upon receiving the payment with txid, the receiver's PSP may inform the creditor to reconcile. The contents of this field are provided exclusively by the collector, who is the ultimate responsible for them. The txid should be unique by collector’s CPF/CNPJ. The receiving PSP is responsible for validating this rule in the API.
      pattern: '[a-zA-Z0-9]{26,35}'
    EndToEndId:
      type: string
      title: Id fim a fim da transação
      description: EndToEndIdentification that carries over PACS002, PACS004 and PACS008
      pattern: '[a-zA-Z0-9]{32}'
      minLength: 32
      maxLength: 32
    DevolucaoId:
      type: string
      title: Id da location
      description: Location identifier to be informed in the collection item creation.
      pattern: '[a-zA-Z0-9]{1,35}'
    Inicio:
      type: string
      title: Data de início
      description: >-
        Filters records whose creation date is greater than or equal to the
        start date. Complies with RFC 3339.It should be in
        ISO_DATE(yyyy-MM-dd'T'HH:mm:ss.SSSZ) format
      example: '2021-10-01T00:01:54.876Z'
    Fim:
      type: string
      title: Data de fim
      description: >-
        Filters records whose creation date is less than or equal to the end
        date. Complies with RFC 3339.It should be in
        ISO_DATE(yyyy-MM-dd'T'HH:mm:ss.SSSZ) format
      example: '2021-10-02T00:01:54.876Z'
    DevolucaoNatureza:
      type: string
      title: Natureza da Devolução
      description: >
        Indicates the nature of the return. A return can be related to a regular
        Pix, or to a Withdrawal/Change Pix. In the absence of this field the
        nature must be interpreted as being of a common Pix (ORIGINAL).


        Natures are defined as follows:

        - `ORIGINAL`: when the return refers to a common Pix or the purchase
        amount in a Pix Troca;

        - `RETIRADA`: when the return refers to a Cash Out Pix or the amount of
        change in a Pix Change.

        - `MED_OPERACIONAL`: when the return occurs within the MED due to
        operational failure and refers to a common Pix (`BE08`);

        - `MED_FRAUDE`: when the return occurs within the MED on grounds of
        suspected fraud and refers to a common Pix (`FR01`).
      enum:
        - ORIGINAL
        - RETIRADA
        - MED_OPERACIONAL
        - MED_FRAUDE
    PayloadLocationId:
      type: integer
      format: int64
      title: Id da location
      description: Identifier of the location to be informed when creating the collection.
    Revisao:
      type: integer
      format: int32
      title: Revisão
      description: >
        # The `review` field


        Denotes the collection review version. Always starts at zero. Always
        increments 1.


        This should increase whenever a collection item is updated.

        The `loc` field change is not considered an update and therefore does
        not trigger an increment to the version number.


        The `loc` field does not change the collection itself.

        It is not necessary to store the history of changes in the `loc` field
        for a given collection.

        For the other fields of the collection, history is recorded.
      readOnly: true
    PessoaFisica:
      type: object
      required:
        - cpf
        - nome
      title: Pessoa Física
      properties:
        cpf:
          type: string
          title: CPF
          pattern: /^\d{11}$/
          description: User's CPF.
        nome:
          type: string
          title: Nome
          description: Username.
          maxLength: 200
    PessoaJuridica:
      type: object
      required:
        - cnpj
        - nome
      title: Pessoa Jurídica
      properties:
        cnpj:
          type: string
          title: CNPJ
          pattern: /^\d{14}$/
          description: User's CNPJ.
        nome:
          type: string
          title: Nome
          description: User's Name.
          maxLength: 200
    CobExpiracao:
      type: object
      title: Expiração"
      properties:
        expiracao:
          type: integer
          format: int32
          title: Tempo de vida da cobrança, especificado em segundos.
          description: >
            Collection item lifetime, specified in seconds from the creation
            date (Calendario.criacao)
          example: '3600'
          default: 86400
    CobCriacao:
      type: object
      title: Criação
      required:
        - criacao
      properties:
        criacao:
          type: string
          format: date-time
          title: Data de Criação
          description: >-
            Timestamp that indicates when the collection item was created.
            Complies with the format defined in RFC 3339.
    CobValor:
      type: object
      title: Valor da cobrança imediata
      description: Collection item amount.
      properties:
        original:
          type: string
          title: Valor
          pattern: \d{1,10}\.\d{2}
          description: Collection item base amount.
        modalidadeAlteracao:
          type: integer
          format: int32
          minimum: 0
          maximum: 1
          title: Modalidade de alteração
          description: >-
            This determines if the effective due amount of the collection item
            can be changed by the payer. 0 if not allowed and 1 if allowed. If
            not provided it will be considered 0.
        retirada:
          description: >
            It is an optional structure related to the concept of receiving
            cash. Only one grouping at a time is allowed, when there is `draw`
            there is no `change` and vice versa.


            When an Immediate collection has a `withdrawal` structure, it ceases
            to be considered common Pix and becomes a Cash Pix category.


            In order for the completion of the `withdrawal` object to be
            considered valid, the following rules apply:

            - the `modalidadeAgente` and `providerDoServicoDeSaque` fields are
            **required**;

            - when `withdrawal` is present, the collection must comply with the
            following conditions:
              - The field `valor.original` must be filled with **value equal to 0.00 (zero)**;
              - The field `valor.modalidadeAlteracao` must have the value 0 (zero) explicitly, or implicitly (by not filling it out).
            - when `change` is present, the collection must comply with the
            following conditions:
              - The field `valor.original` must be filled with **value greater than 0.00 (zero)**;
              - The field `valor.modalidadeAlteracao` must have the value 0 (zero) explicitly, or implicitly (by not filling it out).

            **IMPORTANT**: When using `withdrawal` or `change`, it will not be
            allowed to change the `original.value` received. In the presence of
            `draw` or `change`, the receipt of the `valor.modalidadeAlteracao`
            field with value 1 (one) is considered an error.


            #### Valid examples:
               Considering the fields of structure `value` and predicate 'present', the result of which is true when the
              indicated structure is found, we have:
               - 1 - **collection with fixed value** (conditions: valor.original > 0 && valor.modalidadeAlteração = 0 &&
              !present(valor.retirada))
               ```
               ...
               "value": {
               "original": "10.00"
               },
               ...
               ```
               - 2 - **collection with changeable value** (conditions: valor.original >= 0.00 && modalidadeAlteração = 1
              && !present(valor.retirada))
               ```
               ...
               "value": {
               "original": "10.00",
               "modalidadeAlteracao": 1
               },
               ```
               - 3 - **cash withdrawal with fixed value** (conditions: valor.original = 0.00 && valor.modalidadeAlteração
              = 0 && presente(valor.retirada.saque) && valor.retirada.saque.valor > 0 &&
              valor.retirada.saque.modalidadeAlteracao = 0)
               ```
               ...
               "value": {
               "original": "0.00",
               "withdrawal": {
               "cash withdrawal": {
               "value": "5.00"
               }
               }
               },
               ...
               ```
               - 4 - **cash withdrawal with changeable value** (conditions: valor.original = 0.00 &&
              valor.modalidadeAlteração = 0 && presente(valor.retirada.saque) && valor.retirada.saque.valor >= 0 &&
              valor.retirada.saque.modalidadeAlteracao = 1)
               ```
               ...
               "value": {
               "original": "0.00",
               "withdrawal": {
               "cash withdrawal": {
               "value": "5.00",
               "modalidadeAlteracao": 1,
               }
               }
               },
               ...
               ```
               - 5 - **collection with fixed change** (conditions: valor.original > 0.00 && valor.modalidadeAlteração = 0 &&
              presente(valor.retirada.troco) && valor.retirada.troco.valor > 0 && valor.retirada.troco.modalidadeAlteracao = 0)
               ```
               ...
               "value": {
               "original": "10.00",
               "withdrawal": {
               "change": {
               "value": "5.00"
               }
               }
              
               },
               ...
               ```
               - 6 - **collection with changeable change** (conditions: valor.original > 0.00 && valor.modalidadeAlteração = 0
              && present(valor.retirada.troco) && valor.retirada.troco.valor >= 0 && valor.retirada.troco.modalidadeAlteracao = 1)
               ```
               ...
               "value": {
               "original": "10.00",
               "change": {
               "value": "0.00",
               "modalidadeAlteracao": 1
               }
               },
               ...
               ```
               #### Invalid examples:
               Below are some examples which **are not valid**. It is worth noting that this listing is not intended to be
              complete, being just a reference for some possible errors.
               - 1 - **collection with cash withdrawal and change together** (both of them cannot occur at the same time)
               ```
               ...
               "value": {
               "original": "100.00",
               "withdrawal": {
               "cash withdrawal": {
               "value": "50.00"
               },
               "change": {
               "value": "30.00"
               }
               }
               },
               ...
               ```
               - 2 - **cash withdrawal with valor.original higher than 0.00 (zero)** (cash withdrawal requires valor.original =
              0.00)
               ```
               ...
               "value": {
               "original": "10.00",
               "withdrawal": {
               "cash withdrawal": {
               "value": "5.00"
               }
               }
               },
               ...
               ```
               - 3 - **change with valor.original equal to 0.00 (zero)** (for having a change, there must be valor.original > 0.00)
               ```
               ...
               "value": {
               "original": "0.00",
               "withdrawal": {
               "change": {
               "value": "5.00"
              
               }
               }
               },
               ...
               ```
               - 4 - **cash withdrawal with changeable valor.original** (the valor.original cannot be changed in the
              presence of cash withdrawal)
               ```
               ...
               "value": {
               "original": "0.00",
               "modalidadeAlteracao": 1,
               "withdrawal": {
               "cash withdrawal": {
               "value": "5.00",
               "modalidadeAlteracao": 1,
               }
               }
               },
               ...
               ```
               - 5 - **change with changeable valor.original** (the valor.original cannot be changed in the presence of change)
               ```
               ...
               "value": {
               "original": "0.00",
               "modalidadeAlteracao": 1,
               "withdrawal": {
               "cash withdrawal": {
               "value": "5.00",
               "modalidadeAlteracao": 1,
               }
               }
               },
               ...
               ```
          title: Informações de retirada
          type: object
          oneOf:
            - type: object
              properties:
                saque:
                  type: object
                  title: Saque
                  required:
                    - valor
                    - modalidadeAgente
                    - prestadorDoServicoDeSaque
                  description: Information related to the cash withdrawal
                  properties:
                    valor:
                      type: string
                      title: Valor do saque
                      pattern: \d{1,10}\.\d{2}
                      description: Value of the cash withdrawal conducted
                    modalidadeAlteracao:
                      type: integer
                      format: int32
                      minimum: 0
                      maximum: 1
                      default: 0
                      title: Modalidade de alteração do saque
                      description: >-
                        Cash withdrawal value change modality. When not
                        completed, the assumed value is 0 (zero).
                    modalidadeAgente:
                      type: string
                      title: Modalidade do Agente
                      description: >
                        ##### Agent Type

                        <table><tr><th>ACRONYM</th><th>Description</th></tr><tr><td>AGTEC</td><td>Business
                        Establishment Agent</td></tr
                        ><tr><td>AGTOT</td><td>Other Type of Legal Entity
                        Agent</td></tr><tr><td>AGPSS</td><td>Agent Withdrawal
                        Service Provider< /td></tr></table>
                      enum:
                        - AGTEC
                        - AGTOT
                        - AGPSS
                    prestadorDoServicoDeSaque:
                      type: string
                      title: Prestador do Serviço de Saque
                      pattern: \d{8}
                      description: Withdrawal Service Provider ISPB
            - type: object
              properties:
                troco:
                  type: object
                  title: Troco
                  required:
                    - valor
                    - modalidadeAgente
                    - prestadorDoServicoDeSaque
                  description: Change related information
                  properties:
                    valor:
                      type: string
                      title: Valor do troco
                      pattern: \d{1,10}\.\d{2}
                      description: Value of the change conducted
                    modalidadeAlteracao:
                      type: integer
                      format: int32
                      minimum: 0
                      maximum: 1
                      default: 0
                      title: Modalidade de alteração do troco
                      description: >-
                        Change value alteration modality. When not completed,
                        the assumed value is 0 (zero).
                    modalidadeAgente:
                      type: string
                      title: Modalidade do Agente
                      description: >
                        ##### Agent Type

                        <table><tr><th>ACRONYM</th><th>Description</th></tr><tr><td>AGTEC</td><td>Business
                        Establishment Agent</td></tr
                        ><tr><td>AGTOT</td><td>Other Type of Legal Entity
                        Agent</td></tr><tr><td>AGPSS</td><td>Agent Withdrawal
                        Service Provider< /td></tr></table>
                      enum:
                        - AGTEC
                        - AGTOT
                        - AGPSS
                    prestadorDoServicoDeSaque:
                      type: string
                      title: Prestador do Serviço de Saque
                      pattern: \d{8}
                      description: Withdrawal Service Provider ISPB
    CobBase:
      type: object
      title: Cobrança Base
      description: Atributos comuns a todas entidades de Cobrança
      properties:
        chave:
          type: string
          title: Chave DICT do recebedor
          description: >-
            PIX Alias - Determines the alias registered in DICT, which will be
            used for the collection. This alias will be submitted by the payer’s
            PSP applications to DICT, which will return the translated
            information that will identify the collection creditor. *The aliases
            can be of the following types: phone number, e-mail address,
            taxpayer ID (CPF/CNPJ) or EVP.* The aliases formats can be found in
            [Standards Manual for starting 
            Pix](https://www.bcb.gov.br/estabilidadefinanceira/pagamentosinstantaneos).
          maxLength: 77
        solicitacaoPagador:
          type: string
          title: Solicitação ao pagador
          description: >-
            Field solicitacaoPagador, optional, determines a text to be
            presented to the payer so that he/she may type a correlate
            information, in free format, to be sent to the receiver. Such text
            will be completed, in pacs.008, by the payer’s PSP, in field
            RemittanceInformation <RmtInf>. The field size <RmtInf> in pacs.008
            is limited to 140 characters.
          maxLength: 140
        infoAdicionais:
          type: array
          title: Informações adicionais
          description: >-
            Each respective additional information contained in the list (name
            and value) must be presented to the payer.
          maximum: 50
          items:
            type: object
            required:
              - nome
              - valor
            properties:
              nome:
                type: string
                title: Nome
                description: Name of field.
                maxLength: 50
              valor:
                type: string
                title: Valor
                description: Field data.
                maxLength: 200
    CobSolicitada:
      type: object
      title: Cobrança imediata solicitada
      description: Data sent to create or change Immediate collection via API Pix
      required:
        - valor
        - chave
        - calendario
      allOf:
        - type: object
          properties:
            calendario:
              title: Calendário
              description: >-
                The fields nested under the calendar identifier organize
                information regarding collection-related dates.
              allOf:
                - $ref: '#/components/schemas/CobExpiracao'
        - type: object
          properties:
            devedor:
              description: >-
                The fields nested under object debtor are optional and identify
                the debtor, i.e., the person or institution who owes the debt.
                They do not necessarily identify who will effectively make the
                payment. A CPF can be the debtor, but another CPF effectively
                makes the payment. Field `devedor.cpf` and field `devedor.cnpj`
                are not allowed to be completed at the same time. If field
                `devedor.cnpj` is completed, then, field `devedor.cpf` cannot be
                completed, and vice-versa. If field `devedor.nome` is completed,
                then, there must be or a `devedor.cpf` or a field `devedor.cnpj`
                completed.
              oneOf:
                - $ref: '#/components/schemas/PessoaFisica'
                - $ref: '#/components/schemas/PessoaJuridica'
        - type: object
          properties:
            loc:
              allOf:
                - $ref: '#/components/schemas/PayloadLocationCob'
        - type: object
          properties:
            valor:
              allOf:
                - $ref: '#/components/schemas/CobValor'
                - required:
                    - original
        - $ref: '#/components/schemas/CobBase'
    CobRevisada:
      type: object
      title: Cobrança imediata revisada
      description: Data sent to create or change Immediate collection via API Pix
      allOf:
        - type: object
          properties:
            calendario:
              title: Calendário
              description: >-
                The fields nested under the calendar identifier organize
                information regarding collection-related dates.
              allOf:
                - $ref: '#/components/schemas/CobExpiracao'
        - type: object
          properties:
            devedor:
              description: >-
                The fields nested under object debtor are optional and identify
                the debtor, i.e., the person or institution who owes the debt.
                They do not necessarily identify who will effectively make the
                payment. A CPF can be the debtor, but another CPF effectively
                makes the payment. Field `devedor.cpf` and field `devedor.cnpj`
                are not allowed to be completed at the same time. If field
                `devedor.cnpj` is completed, then, field `devedor.cpf` cannot be
                completed, and vice-versa. If field `devedor.nome` is completed,
                then, there must be or a `devedor.cpf` or a field `devedor.cnpj`
                completed.
              oneOf:
                - $ref: '#/components/schemas/PessoaFisica'
                - $ref: '#/components/schemas/PessoaJuridica'
        - type: object
          properties:
            loc:
              allOf:
                - $ref: '#/components/schemas/PayloadLocationCob'
        - type: object
          properties:
            status:
              type: string
              title: Status do registro da cobrança
              enum:
                - REMOVIDA_PELO_USUARIO_RECEBEDOR
        - type: object
          properties:
            valor:
              $ref: '#/components/schemas/CobValor'
        - $ref: '#/components/schemas/CobBase'
    CobGerada:
      type: object
      title: Cobrança imediata gerada
      description: Immediate collection data created or changed via API Pix
      required:
        - txid
        - calendario
        - revisao
        - status
        - valor
        - chave
      allOf:
        - type: object
          properties:
            calendario:
              required:
                - expiracao
              title: Calendário
              description: >-
                Fields nested under the calendar identifier organize information
                regarding collection-related dates.
              allOf:
                - $ref: '#/components/schemas/CobCriacao'
                - $ref: '#/components/schemas/CobExpiracao'
            txid:
              $ref: '#/components/schemas/TxId'
            revisao:
              $ref: '#/components/schemas/Revisao'
        - type: object
          properties:
            devedor:
              description: >-
                The fields nested under object debtor are optional and identify
                the debtor, i.e., the person or institution who owes the debt.
                They do not necessarily identify who will effectively make the
                payment. A CPF can be the debtor, but another CPF effectively
                makes the payment. Field `devedor.cpf` and field `devedor.cnpj`
                are not allowed to be completed at the same time. If field
                `devedor.cnpj` is completed, then, field `devedor.cpf` cannot be
                completed, and vice-versa. If field `devedor.nome` is completed,
                then, there must be or a `devedor.cpf` or a field `devedor.cnpj`
                completed.
              oneOf:
                - $ref: '#/components/schemas/PessoaFisica'
                - $ref: '#/components/schemas/PessoaJuridica'
        - type: object
          properties:
            loc:
              required:
                - id
                - location
                - tipoCob
                - criacao
              allOf:
                - $ref: '#/components/schemas/PayloadLocation'
        - type: object
          properties:
            location:
              type: string
              title: Localização do payload
              description: >-
                Payload location to be provided when creating the collection
                item.
              maxLength: 77
              format: uri
              example: pix.example.com/qr/v2/2353c790eefb11eaadc10242ac120002
              readOnly: true
        - type: object
          properties:
