            is invalid/missing</issue><action>please provide valid value for
            property
            virtualAccountNumber</action></error_details></error_details></ErrorMessage>
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: CC00003
            message: Method argument(s) are invalid
