      type: string
    Max16Text:
      maxLength: 16
      minLength: 1
      type: string
    Max2048Text:
      maxLength: 2048
      minLength: 1
      type: string
    Max34Text:
      maxLength: 34
      minLength: 1
      type: string
    Max35Text:
      maxLength: 35
      minLength: 1
      type: string
    Max4Text:
      maxLength: 4
      minLength: 1
      type: string
    Max70Text:
      maxLength: 70
      minLength: 1
      type: string
    Max105Text:
      maxLength: 105
      minLength: 1
      type: string
    NameAndAddress10:
