nsaction within the VCN limits.<br>"CPN does not exist" - Invalid VCN, not registered in In Control.<br>"Status bad" - VCN not in an active state. Cannot use forauthorizations.<br>"Expiry match fail" - Expiry provided for the authorization does not match the VCN Expiry.<br>"AVV match fail" - CVC2 provided for the authorization does not match the VCN CVC2.<br>"Valid period fail" - Transaction falls outside the VCN’s defined validity period.<br>"Trans limit fail" - Transaction amount greater than the VCN’s transaction limit.<br>"Cumul limit fail" - Current authorization causes the VCN to breach its cumulative spend limit.<br>"Num usages fail" - Current authorization causes the VCN to breach its usage limit.<br>"Merch Id limit fail" - Merchant Id for authorization does not match the Merchant Id linked to the VCN.<br>"MCC limit fail" - Merchant Category Code for the authorization does not match the MCC linked to this VCN.<br>"Iss/Netwk decline" - Authorization declined by the issuer or card network. Outside of In Control.<br>"Base/CPN conv. Err" - <br>"Crit Field Missing" - Critical field missing from the incoming authorization message.<br>"No Auth for Rev" - In Control cannot map the reversal to an original authorization.<br>"Unmatched Response" - Advice does not match any past requests in the authorization journal<br>"Revl of unsucc auth" - In Control cannot reverse an unsuccessful authorization<br>"Exp. Date of CPN used is expired" - VCN expired.<br>"Repeat message" - Repeat of a previous message. Based on a flag in the message header or on key message fields.<br>"Api fail"<br>"Api System Fail"<br>"Enhanced MID" - Acquirer Id (DE32) and Card Acceptor Id (DE42) in the authorization message do not match the values specified for the control.<br>"Enhanced MCC" - MCC value in the authorization message (D18) does not match the values specified for the control.<br>"Txn Env Control" - VCN breached its transaction environment control.<br>"Err Travel Control" - VCN breached it