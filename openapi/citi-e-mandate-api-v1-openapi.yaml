swagger: '2.0'
info:
  description: >-
    The eMandate API allows you to access CitiDirect based mandate services in a
    light weight message exchange interface. This API supports
    `theMandateInitiationRequest` message and `MandateAcceptanceReport` message.
    A `MandateInitiationRequestmessage` which is sent by the initiator of the
    request to his agent. The initiator can either be the debtor or the
    creditor. A MandateAcceptanceReport message is used to confirm the
    acceptance or rejection of a Mandate Request message.
  version: 1.0.0
  title: eMandate API
host: tts.apib2b.citi.com
basePath: /citiconnect/prod
schemes:
  - https
paths:
  /emandateservices/v1/emandateinitiation:
    post:
      summary: Initiate An eMandate
      description: >-
        The eMandate Initiation API is sent by an initiating party (Creditor) to
        the receiving party (Debtor) in the collection chain to register an
        eMandate. Citi Connect API clients can initiate eMandate Initiation for
        the direct debit collections. <br/><br><b>payloadType</b> :Currently
        Citi supports only “urn:iso:std:iso:20022:tech:xsd: pain.009.001.06”
      operationId: EmandateServicesInitiationOperation
      consumes:
        - application/xml
      produces:
        - application/xml
      parameters:
        - name: client_id
          in: query
          required: true
          description: >-
            This is your unique identifier shared during your CitiConnect API
            onboarding. This is the same `client_id` used for oauth token
            generation
          schema: null
          type: string
        - name: Content-Type
          in: header
          description: Supports "application/xml"
          required: true
          type: string
        - name: payloadType
          in: header
          description: Supports urn:iso:std:iso:20022:tech:xsd:pain.009.001.06
          required: true
          type: string
        - name: Authorization
          in: header
          description: The OAuth Token prefixed with "Bearer" and space in between.
          required: true
          type: string
        - in: body
          name: Request Body
          required: true
          schema:
            $ref: '#/definitions/MandateInitiationRequest'
      responses:
        '200':
          description: OK. Success.
          examples:
            application/xml:
              MndtAccptncRpt:
                GrpHdr:
                  MsgId: CITIBANK/20200803-PSR/1100977414
                  CreDtTm: '2020-08-03T04:31:20'
                UndrlygAccptncDtls:
                  OrgnlMsgInf:
                    MsgId: citiconnect api mandate062303
                    MsgNmId: pain.009.001.06
                    CreDtTm: '2001-12-31T12:00:00'
                  AccptncRslt:
                    Accptd: 'false'
                    RjctRsn:
                      Prtry: PDNG
                  OrgnlMndt:
                    OrgnlMndt:
                      MndtId: Not Available
                      MndtReqId: userguide03082001
                      Tp:
                        LclInstrm:
                          Cd: DDMU
                      TrckgInd: 'false'
                      Cdtr:
                        Nm: Citiconnect tester
                      CdtrAcct:
                        Id:
                          Othr:
                            Id: '1192834003'
                      CdtrAgt:
                        FinInstnId:
                          ClrSysMmbId:
                            MmbId: '12345'
                      Dbtr:
                        Nm: payer name
                      DbtrAcct:
                        Id:
                          Othr:
                            Id: '10897933748'
                      DbtrAgt:
                        FinInstnId:
                          ClrSysMmbId:
                            MmbId: '147992'
                      MndtRef: 4FDD231247EA44BA85FA67FEC1024A6F
                      RfrdDoc:
                        CdtrRef: payer ref name
          schema:
            $ref: '#/definitions/Document'
        '400':
          description: Bad Request. Please try with Valid Request
        '401':
          description: >-
            The request is Unauthorized. Please try again with valid
            credentials.
        '405':
          description: Method Not Allowed. Please try with Valid HTTP Verb.
        '415':
          description: Unsupported Media Type. Resend the request with valid content-type
        '500':
          description: Internal Server Error. Check the service of API.
        '503':
          description: Service Unavailable. Please try again later/ after some time
        '504':
          description: GatewayTimeout. Look for server connectivity issues.
      security:
        - clientCredentials: []
  /emandateservices/v1/emandatestatusinquiry:
    get:
      summary: Get The Status Of An eMandate
      description: >-
        The eMandate Status Inquiry API allows you to access the status of your
        eMandate and generates eMandate details with the status of the
        eMandatetransaction.
      operationId: EmandateServicesStatusInquiryOperation
      consumes:
        - application/xml
      produces:
        - application/xml
      parameters:
        - name: client_id
          in: query
          required: true
          description: >-
            This is your unique identifier shared during your CitiConnect API
            onboarding. This is the same `client_id` used for oauth token
            generation
          schema: null
          type: string
        - name: Accept
          in: header
          description: Supports "application/xml"
          required: true
          type: string
        - name: x-citi-enc-type
          in: header
          description: xmlenc
          required: true
          type: string
        - name: mndtReqId
          in: header
          description: >-
            Unique identification assigned by the initiating party to
            clearlyidentify the transaction. This Identification is passed on,
            unchanged,throughout the entire end-to-end chain
          required: false
          type: string
        - name: mndtId
          in: header
          description: >-
            Unique identification assigned by an institution to clearly identify
            the transaction.
          required: false
          type: string
        - name: payerRefNm
          in: header
          description: >-
            Identification assigned by the initiating party to clearly identify
            the purpose of transaction.
          required: false
          type: string
        - name: creationDate
          in: header
          description: Date when mandate is initiated (MM-DD-yyyy).
          required: false
          type: string
        - name: amount
          in: header
          description: >-
            This represents the amount of money for which the eMandate request
            has been made.
          required: false
          type: string
        - name: currency
          in: header
          description: Currency (HKD/CNY).
          required: false
          type: string
      responses:
        '200':
          description: OK. Success.
          examples:
            application/xml:
              MndtAccptncRpt:
                GrpHdr:
                  MsgId: CITIBANK/20200803-PSR/1245084092
                  CreDtTm: '2020-08-03T04:34:59'
                UndrlygAccptncDtls:
                  AccptncRslt:
                    Accptd: 'false'
                    RjctRsn:
                      Prtry: PDNG
                  OrgnlMndt:
                    OrgnlMndt:
                      MndtId: Not Available
                      MndtReqId: userguide03082001
                      Tp:
                        LclInstrm:
                          Cd: DDMU
                      Ocrncs:
                        SeqTp: RCUR
                        Frqcy:
                          Prd:
                            Tp: WEEK
                            CntPerPrd: '100'
                        Drtn:
                          FrDt: '2020-08-03'
                          ToDt: '2020-08-03'
                      TrckgInd: 'false'
                      MaxAmt:
                        _Ccy: HKD
                        __text: '4086.67'
                      Cdtr:
                        Nm: Citiconnect tester
                      CdtrAcct:
                        Id:
                          Othr:
                            Id: '1192834003'
                      CdtrAgt:
                        FinInstnId:
                          ClrSysMmbId:
                            MmbId: '006'
                      Dbtr:
                        Nm: payer name
                        Id:
                          PrvtId: ''
                      DbtrAcct:
                        Id:
                          Othr:
                            Id: Not Available
                            SchmeNm:
                              Prtry: AIIN
                      DbtrAgt:
                        FinInstnId:
                          ClrSysMmbId:
                            MmbId: '147992'
                      RfrdDoc:
                        CdtrRef: payer ref name
          schema:
            $ref: '#/definitions/Document'
        '400':
          description: Bad Request. Please try with Valid Request
          examples:
            application/xml:
              statusCode: '400'
              statusMessage: Either mndtReqId or mndtId should be provided
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized.
          examples:
            application/xml:
              statusCode: '401'
              statusMessage: >-
                The request is Unauthorized. Please try again with valid
                credentials.
          schema:
            $ref: '#/definitions/Response'
        '405':
          description: Method Not Allowed.
          examples:
            application/xml:
              statusCode: '405'
              statusMessage: Please try with Valid HTTP Verb.
          schema:
            $ref: '#/definitions/Response'
        '415':
          description: Unsupported Media Type.
          examples:
            application/xml:
              statusCode: '415'
              statusMessage: Resend the request with valid content-type
          schema:
            $ref: '#/definitions/Response'
        '500':
          description: Internal Server Error.
          examples:
            application/xml:
              statusCode: '500'
              statusMessage: Check the service of API.
          schema:
            $ref: '#/definitions/Response'
        '503':
          description: Service Unavailable.
          examples:
            application/xml:
              statusCode: '503'
              statusMessage: Please try again later/ after some time
          schema:
            $ref: '#/definitions/Response'
        '504':
          description: GatewayTimeout.
          examples:
            application/xml:
              statusCode: '504'
              statusMessage: Look for server connectivity issues.
          schema:
            $ref: '#/definitions/Response'
      security:
        - clientCredentials: []
securityDefinitions:
  clientCredentials:
    description: >+
      All CitiConnect APIs use the oAuth2 authentication scheme, which requires
      a bearer token to authenticate your API call. The Token URL includes the
      version of authentication used by this API. See <a
      href="../../authentication/authentication-api-reference/"
      target="_blank">the Citi Authentication API reference</a> for information
      on requesting a token.

    type: oauth2
    tokenUrl: >-
      https://tts.sit.apib2b.citi.com/citiconnect/sit5/authenticationservices/v1/oauth/token
    flow: application
    scopes: null
definitions:
  Response:
    type: object
    properties:
      statusCode:
        type: string
        description: Http Code
        minLength: 3
        maxLength: 3
      statusMessage:
        type: string
        description: Status Message
  MandateInitiationRequest:
    type: object
    required:
      - mandate_initiation_request
    properties:
      mandate_initiation_request:
        type: object
        description: >-
          The MandateInitiationRequest message is sent by the initiator of the
          request to his agent. The initiator can either be the debtor or the
          creditor. The MandateInitiationRequest message is forwarded by the
          agent of the initiator to the agent of the counterparty. The
          MandateInitiationRequest message is used to setup the instruction that
          allows the debtor agent to accept instructions from the creditor,
          through the creditor agent, to debit the account of the debtor.
        allOf:
          - $ref: '#/definitions/MandateInitiationRequestV06'
    xml:
      name: Document
  MandateInitiationRequestV06:
    type: object
    required:
      - group_header
    properties:
      group_header:
        type: object
        description: >-
          Set of characteristics to identify the message and parties playing a
          role in the mandate initiation, but which are not part of the mandate.
        allOf:
          - $ref: '#/definitions/GroupHeader80'
      mandate:
        type: array
        xml:
          name: Mndt
        description: >-
          Set of elements used to provide the details of the mandate signed
          between the ultimate creditor and the ultimate debtor. Information
          that serves as a basis to debit an account.
        items:
          $ref: '#/definitions/Mandate13'
      supplementary_data:
        type: array
        xml:
          name: SplmtryData
        description: >-
          Additional information that cannot be captured in the structured
          elements and/or any other specific block. The SupplementaryData
          building block at message level must not be used to provide additional
          information about a transaction. The SupplementaryData element at
          transaction level should be used for that purpose.
        items:
          $ref: '#/definitions/SupplementaryData1'
    description: >-
      The CreditorPaymentActivationRequestStatusReport message is sent by a
      party to the next party in the creditor payment activation request chain.
      It is used to inform the latter about the positive or negative status of a
      creditor payment activation request (either single or file).
  GroupHeader80:
    required:
      - creation_Date_time
      - message_identification
    properties:
      message_identification:
        type: object
        description: >-
          Point to point reference, as assigned by the instructing party, and
          sent to the instructed party, to unambiguously identify the message.
        allOf:
          - $ref: '#/definitions/Max35Text'
      creation_Date_time:
        type: object
        description: Date and time at which the message was created.
        allOf:
          - $ref: '#/definitions/ISODateTime'
      authorisation:
        type: array
        xml:
          name: Authstn
        description: >-
          User identification or any user key to be used to check the authority
          of the initiating party.
        items:
          $ref: '#/definitions/Authorisation1Choice'
        maxItems: 2
      initiating_party:
        type: object
        description: Party that initiates the mandate message.
        allOf:
          - $ref: '#/definitions/PartyIdentification135'
      instructing_agent:
        type: object
        description: >-
          Agent that is instructed by the previous party in the chain to carry
          out an instruction.
        allOf:
          - $ref: '#/definitions/BranchAndFinancialInstitutionIdentification6'
      instructed_agent:
        type: object
        description: >-
          Agent that is instructed by the previous party in the chain to carry
          out an instruction. In case of amendment and cancellation request
          messages, the instructed agent is the party receiving the amendment
          and cancellation request message and not the party that received the
          original mandate initiation request message. In case of acceptance
          report message, the instructed agent is the party receiving the
          acceptance report message and not the party that received the original
          mandate request message.
        allOf:
          - $ref: '#/definitions/BranchAndFinancialInstitutionIdentification6'
  BranchAndFinancialInstitutionIdentification6:
    type: object
    required:
      - FinInstnId
    properties:
      branch_identification:
        type: object
        allOf:
          - $ref: '#/definitions/BranchData3'
      FinInstnId:
        type: object
        allOf:
          - $ref: '#/definitions/FinancialInstitutionIdentification18'
  FinancialInstitutionIdentification18:
    type: object
    properties:
      bicfi:
        type: object
        description: >-
          Code allocated to a financial institution by the ISO 9362 Registration
          Authority as described in ISO 9362 Banking - Banking telecommunication
          messages - Business identifier code (BIC).
        allOf:
          - $ref: '#/definitions/BICFIDec2014Identifier'
      ClrSysMmbId:
        type: object
        description: Information used to identify a member within a clearing system.
        allOf:
          - $ref: '#/definitions/ClearingSystemMemberIdentification2'
      legal_entity:
        type: object
        description: >-
          Legal entity identification for the branch of the
          financialinstitution.
        allOf:
          - $ref: '#/definitions/LEIIdentifier'
      name:
        type: object
        description: >-
          Name by which an agent is known and which is usually used to identify
          that agent.
        allOf:
          - $ref: '#/definitions/Max140Text'
      postal_address:
        type: object
        description: >-
          Information that locates and identifies a specific address, as defined
          by postal services.
        allOf:
          - $ref: '#/definitions/PostalAddress24'
      other:
        type: object
        description: >-
          Unique identification of an agent, as assigned by an institution,
          using an identification scheme.
        allOf:
          - $ref: '#/definitions/GenericFinancialIdentification1'
  GenericFinancialIdentification1:
    type: object
    required:
      - identification
    properties:
      identification:
        type: object
        description: Unique and unambiguous identification of a person.
        allOf:
          - $ref: '#/definitions/Max35Text'
      issuer:
        type: object
        description: Entity that assigns the identification.
        allOf:
          - $ref: '#/definitions/Max35Text'
      scheme_name:
        type: object
        allOf:
          - $ref: '#/definitions/FinancialIdentificationSchemeName1Choice'
    description: >-
      Unique identification of an agent, as assigned by an institution, using an
      identification scheme.
  FinancialIdentificationSchemeName1Choice:
    type: object
    properties:
      code:
        type: string
        xml:
          name: Cd
        description: >-
          Name of the identification scheme, in a coded form as published in an
          external list.
        minLength: 1
        maxLength: 4
      proprietary:
        type: object
        description: Name of the identification scheme, in a free text form.
        allOf:
          - $ref: '#/definitions/Max35Text'
    description: >-
      Name of the identification scheme. Either Code or Proprietary field value
      should be passed on request.
  BICFIDec2014Identifier:
    type: string
    pattern: '[A-Z0-9]{4,4}[A-Z]{2,2}[A-Z0-9]{2,2}([A-Z0-9]{3,3}){0,1}'
  BranchData3:
    type: object
    properties:
      identification:
        type: object
        description: >-
          Unique and unambiguous identification of a branch of a financial
          institution.
        allOf:
          - $ref: '#/definitions/Max35Text'
      legal_entity:
        type: object
        description: >-
          Legal entity identification for the branch of the financial
          institution.
        allOf:
          - $ref: '#/definitions/LEIIdentifier'
      name:
        type: object
        description: >-
          Name by which an agent is known and which is usually used to identify
          that agent.
        allOf:
          - $ref: '#/definitions/Max140Text'
      postal_address:
        type: object
        description: >-
          Information that locates and identifies a specific address, as defined
          by postal services.
        allOf:
          - $ref: '#/definitions/PostalAddress24'
    description: Identifies a specific branch of a financial institution.
  LEIIdentifier:
    type: string
    pattern: '[A-Z0-9]{18,18}[0-9]{2,2}'
  Authorisation1Choice:
    type: object
    properties:
      code:
        type: object
        description: >-
          Specifies the level of approval depending on a number of factors,
          including payment type, threshold amount or local country or
          operations practice.<br><br><b>AUTH</b>: Indicates a file has been
          pre-authorized or approved within the originating customer environment
          and no further approval is required. <br><br><b>FDET</b>: Indicates
          that a file requires additional file level approval, with the ability
          to view both the payment information block and supporting customer
          credit transaction detail. <br><br><b>FSUM</b>: Indicates that a file
          requires additional file level approval, with the ability to view only
          the payment information block level information.<br><br><b>ILEV</b>:
          Indicates that a file requires all customer transactions to be
          authorized or approved.
        allOf:
          - $ref: '#/definitions/Authorisation1Code'
      proprietary:
        type: string
        xml:
          name: Prtry
        description: Specifies the proprietary description
        minLength: 1
        maxLength: 128
    description: Either of Code or Proprietary is required.
  ClearingSystemMemberIdentification2:
    type: object
    required:
      - MmbId
    properties:
      clearing_system_identification:
        type: object
        xml:
          name: ClrSysId
        description: >-
          Specification of a pre-agreed offering between clearing agents or the
          channel through which the payment instruction is processed.
        properties:
          code:
            type: string
            xml:
              name: Cd
            description: >-
              Identification of a clearing system, in a coded form as published
              in an external list.
            minLength: 1
            maxLength: 5
          proprietary:
            type: object
            description: >-
              Identification code for a clearing system, that has not yet been
              identified in the list of clearing systems.
            allOf:
              - $ref: '#/definitions/Max35Text'
      MmbId:
        type: object
        description: Identification of a member of a clearing system.
        allOf:
          - $ref: '#/definitions/Max35Text'
    description: Information used to identify a member within a clearing system.
  Authorisation1Code:
    type: string
    description: >-
      <br><br><b>AUTH</b>: Indicates a file has been pre authorized or approved
      within the originating customer environment and no further approval is
      required. <br><br><b>FDET</b>: Indicates that a file requires additional
      file-level approval, with the ability to view both the payment information
      block and supporting customer credit transaction detail.
      <br><br><b>FSUM</b>: Indicates that a file requires additional file level
      approval, with the ability to view only the payment information block
      level information. <br><br><b>ILEV</b>: Indicates that a file requires all
      customer transactions to be authorized or approved.
    enum:
      - AUTH
      - FDET
      - FSUM
      - ILEV
  Max35Text:
    type: string
    minLength: 1
    maxLength: 35
  ISODateTime:
    type: string
    format: date-time
  PartyIdentification135:
    type: object
    properties:
      Nm:
        type: object
        description: >-
          Name by which a party is known and which is usually used to identify
          that party.
        allOf:
          - $ref: '#/definitions/Max140Text'
      postal_address:
        type: object
        description: >-
          Information that locates and identifies a specific address, as defined
          by postal services.
        allOf:
          - $ref: '#/definitions/PostalAddress24'
      Id:
        type: object
        description: >-
          Unique and unambiguous identification of a party. Should pass EITHER
          OrgId or PrvtId for organisation and private respectively.
        allOf:
          - $ref: '#/definitions/Party38Choice'
      country_of_residence:
        type: object
        description: >-
          Country in which a person resides (the place of a person's home).In
          the case of a company, it is the country from which the affairs of
          that company are directed.
        allOf:
          - $ref: '#/definitions/CountryCode'
      contact_details:
        type: object
        description: Set of elements used to indicate how to contact the party.
        allOf:
          - $ref: '#/definitions/Contact4'
  Contact4:
    type: object
    properties:
      name_prefix:
        type: object
        description: >-
          Specifies the terms used to formally address a
          person.<br><br><b>DOCT</b>: Title of the person is Doctor or Dr.
          <br><br><b>MIST</b>: Title of the person is Mister or Mr.
          <br><br><b>MISS</b>: Title of the person is Miss. <br><br><b>MADM</b>:
          Title of the person is Madam.<br><br><b>MIKS</b>: Title of the person
          is Gender Neutral.
        allOf:
          - $ref: '#/definitions/NamePrefix2Code'
      name:
        type: object
        description: >-
          Name by which a party is known and which is usually used to identify
          that party.
        allOf:
          - $ref: '#/definitions/Max140Text'
      phone_number:
        type: object
        description: >-
          Collection of information that identifies a phone number, as defined
          by telecom services.
        allOf:
          - $ref: '#/definitions/PhoneNumber'
      mobile_number:
        type: object
        description: >-
          Collection of information that identifies a mobile phone number, as
          defined by telecom services.
        allOf:
          - $ref: '#/definitions/PhoneNumber'
      fax_number:
        type: object
        description: >-
          Collection of information that identifies a FAX number, as defined by
          telecom services.
        allOf:
          - $ref: '#/definitions/PhoneNumber'
      email_address:
        type: object
        description: Address for electronic mail (e-mail).
        allOf:
          - $ref: '#/definitions/Max2048Text'
      email_purpose:
        type: object
        description: Purpose for which an email address may be used.
        allOf:
          - $ref: '#/definitions/Max35Text'
      job_title:
        type: object
        description: Title of the function.
        allOf:
          - $ref: '#/definitions/Max35Text'
      responsibility:
        type: object
        description: Role of a person in an organisation.
        allOf:
          - $ref: '#/definitions/Max35Text'
      department:
        type: object
        description: Identification of a division of a large organization or building.
        allOf:
          - $ref: '#/definitions/Max70Text'
      other:
        type: array
        xml:
          name: Othr
        description: Contact details in another form.
        items:
          $ref: '#/definitions/OtherContact1'
      contact_preferred_method:
        type: object
        description: >-
          Preferred method used to reach the contact.<br><br><b>LETT</b>:
          Preferred method used to reach the contact is per letter.
          <br><br><b>FAXX</b>: Preferred method used to reach the contact is per
          fax.<br><br><b>PHON</b>: Preferred method used to reach the contact is
          per phone. <br><br><b>MAIL</b>: Preferred method used to reach the
          contact is per Email .<br><br><b>CELL</b>: Preferred method used to
          reach the contact is per mobile or cell phone.
        allOf:
          - $ref: '#/definitions/PreferredContactMethod1Code'
    description: Set of elements used to indicate how to contact the party.
  NamePrefix2Code:
    type: string
    description: >-
      Specifies the terms used to formally address a person.<br><br><b>DOCT</b>:
      Title of the person is Doctor or Dr. <br><br><b>MIST</b>: Title of the
      person is Mister or Mr. <br><br><b>MISS</b>: Title of the person is
      Miss.<br><br><b>MADM</b>: Title of the person is
      Madam.<br><br><b>MIKS</b>: Title of the person is Gender Neutral.
    enum:
      - DOCT
      - MADM
      - MISS
      - MIST
      - MIKS
  Max2048Text:
    type: string
    minLength: 1
