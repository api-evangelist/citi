openapi: 3.2.0
info:
  title: Citi Payment API
  version: '1.0'
  description: 'Operations tagged Payment across 4 of this provider''s published API definitions: citi-marketplace-management-openapi.yaml, citi-payment-status-openapi.yaml, citi-paymentenhancedinquiry-json-openapi.yaml, self-service_api.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://b2b.api.icg.citi.com/citiconnect/prod/gatewayservices
  description: production gateway url
- url: https://sandbox.b2b.api.icg.citi.com/citiconnect/sb/gatewayservices
  description: sbox url
- url: https://tts.apib2b.citi.com/citiconnect/prod/paymentservices/v3
  description: production gateway URL
- url: https://tts.apib2b.citi.com/citiconnect/sb/paymentservices/v3
  description: sandbox URL
- url: 'https://tts.sandbox.apib2b.citi.com/citiconnect/sb/paymentservices/v3 '
- url: https://tts.apib2b.citi.com/citiconnect/prod/selfservices/v1
  description: production gateway url
- url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb/selfservices/v1
  description: sbox url
tags:
- name: Payment
  description: Payout and payment query operations
paths:
  /merchants/v1/payments:
    post:
      summary: Create Payment
      description: Make a payment from your account held with Citi to a virtual account held with Citi or from the virtual account held with Citi to an external bank account. Virtual account must be in "AVAILABLE" status.
      operationId: createPayout
      servers:
      - url: https://b2b.api.icg.citi.com/citiconnect/prod/gatewayservices
      tags:
      - Payment
      parameters:
      - $ref: '#/components/parameters/Client-Id'
      - $ref: '#/components/parameters/Idempotency-Id'
      - $ref: '#/components/parameters/Country-Code'
      - $ref: '#/components/parameters/Optional-Merchant-Id'
      - $ref: '#/components/parameters/Wallet-Payment'
      requestBody:
        x-skip-validation: true
        required: true
        description: This section contains the request parameters for payment initiation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment-Request'
            examples:
              Payment-To-Wallet-Request:
                $ref: '#/components/examples/Payment-To-Wallet-Request'
              Payment-To-External-Request:
                $ref: '#/components/examples/Payment-To-External-Request'
      responses:
        '202':
          description: Payout request accepted for processing.
          headers:
            apim-guid:
              $ref: '#/components/headers/Apim-Guid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment-Response'
              examples:
                Payment-Validation-Success-Example:
                  $ref: '#/components/examples/Payment-Validation-Success-Example'
                Payment-Validation-Partial-Rejection-Example:
                  $ref: '#/components/examples/Payment-Validation-Partial-Rejection-Example'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                title: Payment-Bad-Request-Response
                oneOf:
                - $ref: '#/components/schemas/Gateway-Error-Response'
                - $ref: '#/components/schemas/Service-Error-Response'
                - $ref: '#/components/schemas/Payment-Response'
              examples:
                Payment-Validation-Full-Rejection-Example:
                  $ref: '#/components/examples/Payment-Validation-Full-Rejection-Example'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        '503':
          $ref: '#/components/responses/Service-Unavailable'
        '504':
          $ref: '#/components/responses/Gateway-Timeout'
      security:
      - oAuth2:
        - /authenticationservices/v1
      callbacks:
        payout-webhook:
          '{$notificationURL}':
            post:
              summary: Payout Webhook
              description: Webhook notification for payment status updates.
              operationId: payoutWebhook
              parameters:
              - $ref: '#/components/parameters/Event-Type'
              - $ref: '#/components/parameters/Event-Name'
              - $ref: '#/components/parameters/Apim-Guid'
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Webhook-Payment-Request'
                    examples:
                      Payment-To-Wallet-Rejected-Webhook:
                        $ref: '#/components/examples/Payment-To-Wallet-Rejected-Webhook'
                      Payment-To-External-Rejected-Webhook:
                        $ref: '#/components/examples/Payment-To-External-Rejected-Webhook'
                      Payment-To-Wallet-Success-Webhook:
                        $ref: '#/components/examples/Payment-To-Wallet-Success-Webhook'
                      Payment-To-External-Success-Webhook:
                        $ref: '#/components/examples/Payment-To-External-Success-Webhook'
              responses:
                '200':
                  description: Webhook received successfully.
        inbound-payment:
          '{$notificationURL}':
            post:
              operationId: inboundPaymentNotification
              summary: Inbound Payment Notification Webhook
              description: This webhook pushes notifications for the payment received in your virtual account.
              tags:
              - Inbound Webhook
              parameters:
              - $ref: '#/components/parameters/Event-Type'
              - $ref: '#/components/parameters/Event-Name'
              - $ref: '#/components/parameters/Apim-Guid'
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Inbound-Payment-Notification'
                    examples:
                      inbound-payment-example:
                        $ref: '#/components/examples/Inbound-Payment-Notification-Example'
              responses:
                '200':
                  description: Webhook received successfully.
    get:
      summary: Get Payment
      description: Query the status and detailed attributes of a payment using supported identifiers, including processing state, settlement outcomes, and reference information needed for reconciliation and customer support.
      operationId: getPayment
      tags:
      - Payment
      servers:
      - url: https://b2b.api.icg.citi.com/citiconnect/prod/gatewayservices
      parameters:
      - $ref: '#/components/parameters/Client-Id'
      - $ref: '#/components/parameters/Country-Code'
      - $ref: '#/components/parameters/Optional-Merchant-Id'
      - $ref: '#/components/parameters/Uetr'
      - $ref: '#/components/parameters/End-To-End-Id'
      responses:
        '200':
          description: Payment details retrieved successfully.
          headers:
            apim-guid:
              $ref: '#/components/headers/Apim-Guid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-Payment-Response'
              examples:
                Get-Payment-To-Wallet:
                  $ref: '#/components/examples/Get-Payment-To-Wallet'
                Get-Payment-To-External:
                  $ref: '#/components/examples/Get-Payment-To-External'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        '503':
          $ref: '#/components/responses/Service-Unavailable'
        '504':
          $ref: '#/components/responses/Gateway-Timeout'
      deprecated: false
      security:
      - oAuth2:
        - /authenticationservices/v1
    servers:
    - url: https://b2b.api.icg.citi.com/citiconnect/prod/gatewayservices
      description: production gateway url
    - url: https://sandbox.b2b.api.icg.citi.com/citiconnect/sb/gatewayservices
      description: sbox url
  /payment/inquiry:
    post:
      responses:
        '200':
          description: 'OK - your request was received and acknowledged successfully.


            Check the response body for the transaction status.


            | Payment Status | Recommended Action |

            | -------------- |  ----------------- |

            | Decrypted payload is unintelligible | Make a payment status inquiry every 5 minutes for 15 minutes. If you do not receive a response, contact Citi.

            | ACTC/ACCP - Accepted | Make a payment status inquiry every 5 minutes |

            | PDNG - Pending | Make a payment status inquiry every 60 minutes |

            | RJCT - Rejected | See the status reason for more information |

            | ACSP/ACSC - Payment successfully processed and cleared | No action required |'
          content:
            application/xml:
              example: <?xmlversion="1.0"encoding="UTF-8"?><Documentxmlns="urn:iso:std:iso:20022:tech:xsd:pain.002.001.03"><CstmrPmtStsRpt><GrpHdr><MsgId>CITIBANK/20210311-PSR/1026834332</MsgId><CreDtTm>2021-03-11T17:30:29</CreDtTm><InitgPty><Id><OrgId><BICOrBEI>CITIUS33</BICOrBEI></OrgId></Id></InitgPty></GrpHdr><OrgnlGrpInfAndSts><OrgnlMsgId>GBP161114694869</OrgnlMsgId><OrgnlMsgNmId>pain.001.001.03</OrgnlMsgNmId></OrgnlGrpInfAndSts><OrgnlPmtInfAndSts><OrgnlPmtInfId>14017498FundTransferDomestic</OrgnlPmtInfId><TxInfAndSts><OrgnlEndToEndId>CC21TPH3B8J8H2R</OrgnlEndToEndId><TxSts>ACSP</TxSts><StsRsnInf><AddtlInf>ProcessedSettledatclearingSystem.Paymentsettledatclearingsystem</AddtlInf></StsRsnInf><OrgnlTxRef><Amt><InstdAmtCcy="USD">1.00</InstdAmt></Amt><ReqdExctnDt>2021-02-03</ReqdExctnDt><PmtMtd>TRF</PmtMtd><RmtInf><Ustrd>TR002638</Ustrd></RmtInf><Dbtr><Nm>CITIBANKE-BUSINESSEURDUMDEMO</Nm></Dbtr><DbtrAcct><Id><Othr><Id>12345678</Id></Othr></Id></DbtrAcct><DbtrAgt><FinInstnId><PstlAdr><Ctry>GB</Ctry></PstlAdr></FinInstnId></DbtrAgt><CdtrAgt><FinInstnId><BIC>fakebic</BIC></FinInstnId></CdtrAgt><Cdtr><Nm>8010643122XXXXXXXXXXXXXXXXX</Nm></Cdtr><CdtrAcct><Id><Othr><Id>12345678</Id></Othr></Id></CdtrAcct></OrgnlTxRef></TxInfAndSts></OrgnlPmtInfAndSts></CstmrPmtStsRpt></Document>
      summary: Payment Status Inquiry
      requestBody:
        description: 'EndToEndId (required) Unique identification assigned by the initiating party to clearly identify the transaction. This Identification is passed on, unchanged, throughout the entire end-to-end chain. <br>CreDt Date when the payment initiation started. <br>The date format is: YYYY-MM-DD. InstdAmt, Ccy Amount of money transferred between the debtor and the creditor before any deduction of charges is made. This is expressed in the currency that is specified by the initiating party. <b>ReqdExctnDt Date that the initiating party requests that the clearing agent process the payment.'
        content:
          application/xml:
            schema: object
            example: <?xml version="1.0" encoding="UTF-8"?><paymentInquiryRequest xmlns="http://com.citi.citiconnect/services/types/inquiries/payment/v1"><EndToEndId>CC21TPH3B8J8H2R</EndToEndId></paymentInquiryRequest>
        required: true
      tags:
      - Payment
      security:
      - clientCredentials: []
        Client ID: []
      operationId: postPaymentInquiry
      x-operation-id-source: derived
    get:
      responses:
        '200':
          description: 200 OK
          content:
            application/xml:
              example: <?xml version="1.0" encoding="UTF-8"?><Document xmlns="urn:iso:std:iso:20022:tech:xsd:pain.002.001.03"><CstmrPmtStsRpt><GrpHdr><MsgId>CITIBANK/20210311-PSR/981382059</MsgId><CreDtTm>2021-03-11T19:31:39</CreDtTm><InitgPty><Id><OrgId><BICOrBEI>CITIUS33</BICOrBEI></OrgId></Id></InitgPty></GrpHdr><OrgnlGrpInfAndSts><OrgnlMsgId>GBP161114694869</OrgnlMsgId><OrgnlMsgNmId>pain.001.001.03</OrgnlMsgNmId></OrgnlGrpInfAndSts><OrgnlPmtInfAndSts><OrgnlPmtInfId>14017498 Fund Transfer Domestic</OrgnlPmtInfId><TxInfAndSts><OrgnlEndToEndId>CC21TPH3B8J8H2R</OrgnlEndToEndId><TxSts>ACSP</TxSts><StsRsnInf><AddtlInf>Processed Settled at clearing System. Payment settled at clearing system</AddtlInf></StsRsnInf><OrgnlTxRef><Amt><InstdAmt Ccy="USD">1.00</InstdAmt></Amt><ReqdExctnDt>2021-02-03</ReqdExctnDt><PmtMtd>TRF</PmtMtd><RmtInf><Ustrd>TR002638</Ustrd></RmtInf><Dbtr><Nm>CITIBANK E-BUSINESS EUR DUM DEMO</Nm></Dbtr><DbtrAcct><Id><Othr><Id>12345678</Id></Othr></Id></DbtrAcct><DbtrAgt><FinInstnId><PstlAdr><Ctry>GB</Ctry></PstlAdr></FinInstnId></DbtrAgt><CdtrAgt><FinInstnId><BIC>fakebic</BIC></FinInstnId></CdtrAgt><Cdtr><Nm>8010643122X XXXXXXXXXXXXX XXX</Nm></Cdtr><CdtrAcct><Id><Othr><Id>12345678</Id></Othr></Id></CdtrAcct></OrgnlTxRef></TxInfAndSts></OrgnlPmtInfAndSts></CstmrPmtStsRpt></Document>
        '400':
          description: Bad Request
        '401':
          description: Unauthorized; OAuth header decryption failed
        '403':
          description: Forbidden
        '404':
          description: Service Not Found
        '405':
          description: Method Not Allowed
        '406':
          description: Duplicate Request Received
        '412':
          description: Precondition Failed
        '415':
          description: Unsupported Media Type
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
      summary: Payment Status Inquiry
      parameters:
      - name: endToEndId
        required: false
        in: query
        schema:
          type: string
      - name: globalTranNo
        required: false
        in: query
        schema:
          type: string
      - name: creationDate
        required: false
        in: query
        schema:
          type: string
      - name: amount
        required: false
        in: query
        schema:
          type: string
      - name: requiredExecutionDate
        required: false
        in: query
        schema:
          type: string
      - name: directDebitInd
        required: false
        in: query
        schema:
          type: string
      description: null
      tags:
      - Payment
      security:
      - clientCredentials: []
        Client ID: []
      operationId: getPaymentInquiry
      x-operation-id-source: derived
    servers:
    - url: https://tts.apib2b.citi.com/citiconnect/prod/paymentservices/v3
      description: production gateway URL
    - url: https://tts.apib2b.citi.com/citiconnect/sb/paymentservices/v3
      description: sandbox URL
  /payment/enhancedinquiry:
    post:
      summary: Payment Status Inquiry
      description: 'This API returns details of your transactions for both Incoming and Outgoing payments based on specified parameters.


        Content-Type : Supports application/json.'
      operationId: paymentStatusInquiry
      parameters:
      - name: client_id
        in: query
        description: This is your unique identifier shared during your CitiConnect API onboarding. This is the same `client_id` used for oauth token generation
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Oauth token used to authenticate the user. This token is short lived, so make sure valid token used.
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: This header represents the format in which the response output is needed. I.e. Input will be application/json;format=PSRJ03
        required: true
        schema:
          type: string
        example: application/json;format=PSRJ03
      - name: Content-type
        in: header
        description: Specify 'application/json' as the response type.
        required: true
        schema:
          type: string
        example: application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnhancedRequest'
            examples:
              Inquiry-Request-Example-EndtoEndId:
                $ref: '#/components/examples/Inquiry-Request-Example-EndtoEndId'
              Inquiry-Request-Example-UETR:
                $ref: '#/components/examples/Inquiry-Request-Example-UETR'
              Inquiry-Request-Example-EndtoEndId-Transaction-Flow-Indicator:
                $ref: '#/components/examples/Inquiry-Request-Example-EndtoEndId-Transaction-Flow-Indicator'
              Inquiry-Request-Example-UETR-Transaction-Flow-Indicator:
                $ref: '#/components/examples/Inquiry-Request-Example-UETR-Transaction-Flow-Indicator'
        required: true
      responses:
        '200':
          description: OK. successful operation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                Inquiry-Response-Example:
                  $ref: '#/components/examples/Inquiry-Response-Example'
                Inquiry-Response-Return-Example:
                  $ref: '#/components/examples/Inquiry-Response-Return-Example'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                errors:
                - action: Resend request with valid Transaction flow indicator, Indicator should be CR or DR.
                  issue: Invalid Transaction flow indicator
                - action: Resend request with valid UETR.
                  issue: UETR cannot be empty or invalid format
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway-Error-Response_2'
              example:
                httpCode: '401'
                httpMessage: Unauthorized
                moreInformation: This server could not verify that you are authorized to access the URL
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway-Error-Response_2'
              example:
                httpCode: '404'
                httpMessage: Not Found
                moreInformation: No resources match requested URI
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway-Error-Response_2'
              example:
                httpCode: '405'
                httpMessage: Method Not Allowed
                moreInformation: The method is not allowed for the requested URL
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway-Error-Response_2'
              example:
                httpCode: '415'
                httpMessage: Unsupported Media Type
                moreInformation: Unsupported Content-Type
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway-Error-Response_2'
              example:
                httpCode: '429'
                httpMessage: Too Many Requests
                moreInformation: Rate Limit exceeded
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                errors:
                - action: Check the service of API.
                  issue: Internal Server Error
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                errors:
                - action: Please try again later/ after some time.
                  issue: Service Unavailable
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                errors:
                - action: Look for server connectivity issues.
                  issue: Gateway timeout issue
      security:
      - clientCredentials: []
      x-codegen-request-body-name: body
      tags:
      - Payment
    servers:
    - url: https://tts.apib2b.citi.com/citiconnect/prod/paymentservices/v3
    - url: 'https://tts.sandbox.apib2b.citi.com/citiconnect/sb/paymentservices/v3 '
  /payment/banksearch:
    post:
      summary: Bank Listing
      description: 'CitiConnect Bank Listing allows users to get bank details for specific payment methods, primarily for ACH and FVT, for streamlining integration and reducing downstream errors.


        Content-Type : Supports “application/json”

        Authorization: The OAuth Token prefixed with “Bearer” and space in between. :

        countryCode : Country Code

        bankShortName: Bank Short Name

        bankCityName : Bank City Name :

        bankCode : Bank Code :

        bankRoutingCode : Bank Routing code :

        paymentType : Payment Method type (DFT,BKT,…etc.) :

        branchCode : Branch Code :

        currencyCode : Currency Code :

        bankStateName : Bank state Name :'
      parameters:
      - name: Authorization
        in: header
        description: The OAuth Token prefixed with "Bearer" and space in between.
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Supports application/json.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 OK
          content: {}
      tags:
      - Payment
      security:
      - clientCredentials: []
      operationId: postPaymentBanksearch
      x-operation-id-source: derived
    servers:
    - url: https://tts.apib2b.citi.com/citiconnect/prod/selfservices/v1
      description: production gateway url
    - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb/selfservices/v1
      description: sbox url
