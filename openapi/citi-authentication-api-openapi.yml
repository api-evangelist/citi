          type: string
          title: authentication_status
        currency_code:
          description: ISO 4217 Currency Code for instance USD/GBP/EUR
          enum:
          - USD
          example: USD
          type: string
          title: currency_code
        type:
          description: Indicates the result of payer authentication.
          enum:
          - AUTHENTICATION
          - AUTHORIZATION
          - AUTHORIZATION_UPDATE
          - CAPTURE
          - CHARGEBACK
          - DISBURSEMENT
          - FUNDING
          - PAYMENT
          - REFUND
          - REFUND_REQUEST
          - VERIFICATION
          - VOID_AUTHORIZATION
          - VOID_CAPTURE
          - VOID_PAYMENT
          - VOID_REFUND
          example: VOID_REFUND
          type: string
          title: type
    Authentication-Payer-Shipping:
      type: object
