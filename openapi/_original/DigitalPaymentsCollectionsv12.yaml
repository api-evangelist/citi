    Url:
      title: url
      type: object
      description: |-
        URL.  
         - For UK PAYBYBANK Creation transaction.url parameter is mandatory.
      properties:
        accepted:
          description: |-
            Acceptance URL. 
             - For UK PAYBYBANK Creation transaction.url.accepted parameter is mandatory and maximum allowed length is 200 and URL should start either with http:// or https://
          example: accepted
          maxLength: 2083
          minLength: 1
          type: string
          title: accepted_url
        declined:
          description: |-
            Declined URL. 
             - For UK PAYBYBANK Creation transaction.url.declined parameter is mandatory and maximum allowed length is 200 and URL should start either with http:// or https://
          example: declined
          maxLength: 2083
          minLength: 1
          type: string
          title: declined_url
        browser_payment_return:
          description: >-
            The URL of your website to which you want the payer's browser to be
            redirected on completing the payment interaction at the payment
            provider's website. 
             - For Paypal transaction transaction.url.browser_payment_return field becomes mandatory, when transaction.url.app_payment_return field is not provided by client in the payment initiation request
          example: declined
          maxLength: 2048
          minLength: 1
          type: string
          title: browser_payment_return_url
        app_payment_return:
          description: >-
            The URL of your app to which you want the payer to be redirected on
            completing the payment interaction at the payment provider's website
            or in the payment provider's app. 
             - For Paypal transaction.url.app_payment_return is mandatory, if client not provided transaction.url.browser_payment_return 
          example: declined
          maxLength: 2048
          minLength: 1
          type: string
          title: app_payment_return_url
    Url-Update:
      title: url
      description: URL.
      properties:
        accepted:
          description: Acceptance URL.
          example: accepted
          maxLength: 128
          minLength: 1
          type: string
          title: accepted_url
        declined:
          description: Declined URL.
          example: declined
          maxLength: 128
          minLength: 1
          type: string
          title: declined_url
    Authorization-Response:
      title: Authorization-Response
      description: Authorization Response
      properties:
        stan:
          description: >-
            The System Trace Audit Number is assigned by a transaction
            originator to assist in identifying a Card Transaction.The trace
            number remains unchanged for the life of the Card Transaction.
          example: AUD345
          maxLength: 6
          minLength: 1
          type: string
          title: stan
        merchant_advice_code:
          description: >-
            This parameter contains data returned by the issuer or card network
            to clearly communicate to merchants the reason for declining a
            MasterCard or Visa transaction Merchants can use this information to
            determine the best action to take.
          example: '2'
          maxLength: 2
          minLength: 1
          type: string
          title: merchant_advice_code
        pos_entry_mode:
          description: >-
            The POS Entry Mode provided to Discover (JCB (US Domestic only), and
            Diners) for the authorization
          example: '2'
          maxLength: 4
          minLength: 1
          type: string
          title: pos_entry_mode
        return_aci:
          description: >-
            The ACI (Authorization Characteristics Indicator) returned by the
            issuer
          example: '1'
          maxLength: 1
          minLength: 1
          type: string
          title: return_aci
        avscode:
          description: >-
            The acquirer AVS response code generated by the card issuing
            institution
          example: '1'
          maxLength: 100
          minLength: 1
          type: string
          title: avscode
        commercial_card_indicator:
          description: Indicates the type of commercial card as returned by the card issuer
          example: '1'
          maxLength: 3
          minLength: 1
          type: string
          title: commercial_card_indicator
        date:
          type: string
          description: |-
            The local date, in MMDD format, on which the transaction occurred. 
            - Format MMDD
          title: date
          example: '0530'
        financial_network_code:
          description: >-
            Indicates the code of the financial network that was used to process
            the transaction with the issuer.
          example: '1'
          maxLength: 3
          minLength: 1
          type: string
          title: financial_network_code
        financial_network_date:
          type: string
          format: date
          description: |-
            The date for the Authorization as returned by the scheme. 
            - Format YYYY-MM-DD
          example: '2024-05-30'
          title: financial_network_date
        pos_data:
          description: >-
            Indicates the specific card information conditions for capture that
            are available when the card transaction occurs at point of service.
          example: '1'
          maxLength: 13
          minLength: 3
          type: string
          title: pos_data
        processing_code:
          description: Identifies the type of Card Transaction sent to Card Acceptor
          example: '1'
          maxLength: 6
          minLength: 1
          type: string
          title: processing_code
        response_code:
          description: The response code which indicates the status of the transaction
          example: '1'
          maxLength: 3
          minLength: 1
          type: string
          title: response_code
        time:
          type: string
          format: date-time
          description: >-
            GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

            - Instant Payment (Credit) - Date time, either provided by the
            debtor bank or generated by Citi's transaction processing
            application, when a transaction was created 

            - For US RFP this parameter is mandatory
          example: '2022-09-13T08:23:49.114Z'
          title: time
        transaction_identifier:
          description: The unique identifier for the transaction returned by the issuer.
          example: '1'
          maxLength: 30
          minLength: 1
          type: string
          title: transaction_identifier
