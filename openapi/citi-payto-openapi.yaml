openapi: 3.0.3
info:
  description: >-
    This API supports the Mandate Initiation Request, Inquiry, Amendment,
    Cancellation, Suspension/Release, and Recall <br><br>The Mandate Initiation
    Request message is used to request the set-up of an instruction that allows
    the debtor agent to accept instructions from the creditor, through the
    creditor agent, to debit the account of the debtor (mandate).<br><br>A
    Mandate Inquiry is used to check the details/status of the Mandate
    Request.<br><br> A Mandate Amendment is a request from one party to another
    party to amend certain information in an existing mandate bilateral/
    unilateral.<br><br> A Mandate Cancellation is a request from one party to
    another party to cancel an existing mandate <br><br>A Mandate Suspension is
    a request from one party to another party to suspend an existing
    Mandate<br><br> A Mandate Release is a request from one party to another
    party release an existing Mandate <br><br> A Mandate recall is a request
    that allows request to perform recall of an existing mandate by Initiator
  version: 1.0.0
  title: eMandate Service API
security:
  - clientCredentials: []
tags:
  - name: eMandate
    description: >-
      eMandate allows the Merchant to initiate the mandate creation and inquiry
      process from Clients ERP to Citi's system in a secure manner.
servers:
  - url: https://tts.sit.apib2b.citi.com/citiconnect/sit5/recievablesservices
    description: dev gateway url
  - url: https://tts.sit.apib2b.citi.com/citiconnect/uat1/recievablesservices
    description: uat gateway url
  - url: https://tts.apib2b.citi.com/citiconnect/prod/recievablesservices
    description: production gateway url
  - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb/recievablesservices
    description: sandbox gateway url
paths:
  /v1/mandates:
    post:
      summary: Initiate and Create A Mandate
      description: >-
        This endpoint allows the merchant to initiate the mandate creation
        process from client's ERP to Citi's system in a secure manner.
      operationId: createMandate
      parameters:
        - name: client_id
          in: query
          description: >-
            Unique reference which was shared during CitiConnect API Onboarding
            (`client_id` which is used during OAuth token generation).
          required: true
          schema:
            type: string
            example: 4683fd9f-03fe-4268-b5da-93bf8203fd91
        - name: Idempotency-Id
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
            example: a44cbb60123414bba3bb
          description: >-
            Your unique identification for a POST request for CitiConnect API to
            perform idempotency check. Same `client_id` is to be maintained by
            the client if client wants to retry request within 48 hours.
      requestBody:
        description: Mandate client details required
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MandateClientDetails'
      callbacks:
        asynchronous-mandatecreation-push-notification:
          $ref: '#/components/callbacks/CreationPushNotification'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                ref_id: ec689822-9864-4c4d-9d68-222467627902
                error_details:
                  - code: VC00001
                    issue: >-
                      Invalid value provided for property
                      `mandateDetails.paymentExecutionNotBeforeTime`
                    action: >-
                      Please provide valid value for property
                      `mandateDetails.paymentExecutionNotBeforeTime`
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                ref_id: ec689822-9864-4c4d-9d68-222467627902
                error_details:
                  - code: CC00007
                    issue: Authorization failed
                    action: Please try again with valid credentials.
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                ref_id: ec689822-9864-4c4d-9d68-222467627902
                error_details:
                  - code: CC00001
                    issue: Method not supported
                    action: Please use valid HTTP verb.
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                ref_id: ec689822-9864-4c4d-9d68-222467627902
                error_details:
                  - code: CC00002
                    issue: Media type not supported
                    action: >-
                      Resend the request with content-type as application/JSON
                      in header
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                ref_id: ec689822-9864-4c4d-9d68-222467627902
                error_details:
                  - code: CC00004
                    issue: Unable to serve your request at this moment
                    action: >-
                      Please try again later. If this error persists, please
                      reach out to australia.citiservice@citi.com
    get:
      summary: Retrieve Mandate Response From Citi System
      description: A Mandate inquiry is used to check the details/status of the mandates.
      operationId: inquiryMandate
      parameters:
        - name: country
          in: query
          required: true
          description: Country
          schema:
            type: string
            pattern: ^[A-Z]{2,2}$
            description: Country Is mandatory
        - name: mandate_request_identification
          in: query
          required: false
          description: mandate_request_identification
          schema:
            type: string
            minLength: 1
            maxLength: 35
            description: >-
              mandate_request_identification is used to retrieve the status of a
              mandate.<br>Populate value from unique value generated by Citi
              Connect.
        - name: mandate_identification
          in: query
          required: false
          description: mandate_identification
          schema:
            type: string
            minLength: 1
            maxLength: 35
            description: >-
              mandate_identification is used to retrieve the status of a
              mandate.
      callbacks:
        asynchronous-mandateStatusInquiry-push-notification:
          $ref: '#/components/callbacks/MandateStatusInquiryPushNotification'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryMandateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                ref_id: ec689822-9864-4c4d-9d68-222467627902
                error_details:
                  - code: VC00001
                    issue: Invalid value provided for property country
                    action: Please provide valid value for property country
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                ref_id: ec689822-9864-4c4d-9d68-222467627902
                error_details:
                  - code: CC00007
                    issue: Authorization failed
                    action: Please try again with valid credentials.
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                ref_id: ec689822-9864-4c4d-9d68-222467627902
                error_details:
                  - code: CC00001
