source: https://developer.citi.com/apidocs/outgoing-payments/express-instant-payments/express-instant-payments-error-codes
  and https://developer.citi.com/apidocs/accept-payments/online-payment-acceptance/online-payment-acceptance-error-codes
  — Citi publishes both reference tables at developer.citi.com; read 2026-09-05
applies_to: Citi payment initiation, instant/express payments, payment acceptance, direct debit and Request to Pay
  surfaces
envelope:
  field: reasonCode
  note: The reason code is returned in reasonCode on the JSON express-payments surface and inside the ISO 20022
    status report (pain.002 / pacs.002, TxInfAndSts.StsRsnInf.Rsn.Cd) on the XML payment surfaces. NARR carries
    free-text narrative in StsRsnInf.AddtlInf when no coded reason applies.
  status_field: transaction status — ACCC (settled on creditor account), ACWP (accepted without posting), PDNG (deemed
    approved, final status awaited), RJCT (rejected)
code_system: ISO 20022 External Return Reason Codes, extended with local clearing-scheme code sets
