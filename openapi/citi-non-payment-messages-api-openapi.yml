openapi: 3.2.0
info:
  title: Instant Payments Non-Payment Messages API
  description: 'Use the Citi Payments Express API to initiate these types of transaction and check their status:

    * Instant Payments

    * Payment Messages

    * Refunds

    * Beneficiary Validation


    **Note:** The Citi Payments Express API is for direct payments and refunds. To send payments or refunds to a third-party account or via a proxy, use the CitiConnect Payments API'
  contact:
    name: Standards & Developer Hub
    url: https://tts.sandbox.developer.citi.com/citiconnect/
    email: developer-support@citi.com
  version: 1.0.0
servers:
- url: https://b2b.api.icg.citi.com/citiconnect/prod
  description: production gateway url
- url: https://sandbox.b2b.api.icg.citi.com/citiconnect/sb
  description: 'sbox url '
tags:
- name: Non-Payment Messages
paths:
  /paymentservices/v1/payments/{uetr}/messages:
    post:
      tags:
      - Non-Payment Messages
      summary: Initiate a non payment message
      description: This endpoint validates your request and responds with HTTP status 202 (accepted) after successful validation. If validation fails, the endpoint synchronously responds with error (HTTP status 4XX / 5XX and any applicable ISO 20022 reason code), indicating Citi couldn't accept your message initiation request.
      operationId: createMessage
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: Your unique identification, same as the identification you use for OAuth token generation, Citi shared with you during your CitiConnect API onboarding
        example: 6d3cf821-db6d-496d-bec0-064a362e9c31
      - name: uetr
        in: path
        required: true
        description: Unique end-to-end transaction reference
        schema:
          type: string
          pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
      - name: Idempotency-Id
        in: header
        required: true
        schema:
          type: string
          maxLength: 128
        example: a44cbb60-6de4-4edb-9a7a-123414bba3bb
        description: "Your unique identification for a POST request \n - Maximum length is 128. \n-  CitiConnect API responds with an error (HTTP status 4XX) if your POST request idempotency identification value is a duplicate across a recent history of idempotency identifications in Citi's database. \n- If you don't receive any response (HTTP status 2XX, 4XX or 5XX) from Citi to your POST request and you wish to retry, reinitiate your request with the same idempotency identification to prevent accidental duplicate payment."
      requestBody:
        required: true
        description: 'This endpoint validates your request and responds with HTTP status 202 (accepted) after successful validation. If validation fails, the endpoint synchronously responds with error (HTTP status 4XX / 5XX and any applicable ISO 20022 reason code), indicating Citi couldn''t accept your message initiation request.

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message-Request'
            examples:
              Response to Request For Refund:
                $ref: '#/components/examples/Response-To-Request-For-Refund-Example'
              Response to Payment Confirmation Request:
                $ref: '#/components/examples/Response-To-Payment-Confirmation-Request-Example'
              Accept Response to Incoming Payment Confirmation Request From CITI:
                $ref: '#/components/examples/Th-Response-To-Payment-Confirmation-Sucess-Request-Example'
              Reject Response to Incoming Payment Confirmation Request From CITI:
                $ref: '#/components/examples/Th-Response-To-Payment-Confirmation-Reject-Request-Example'
              Response to Request for Payment:
                $ref: '#/components/examples/Response-To-Request-For-Payment-Example'
              Outgoing Request for Refund:
                $ref: '#/components/examples/Outgoing-Request-For-Refund-Example'
              Response to Request for Information Compliance:
                $ref: '#/components/examples/Response-To-Request-For-Information-Compliance-Example'
              Uk Stop Request:
                $ref: '#/components/examples/Uk-Stop-Request-Example'
              In Stop Request:
                $ref: '#/components/examples/In-Stop-Request-Example'
              Br Stop Request:
                $ref: '#/components/examples/Br-Stop-Request-Example'
      security:
      - oAuth2:
        - paymentservices
      responses:
        '202':
          description: Accepted
          headers:
            request_id:
              schema:
                type: string
              description: Citi's unique identification for your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Initial-Acknowledgement-Response'
              examples:
                Status - Initial-Response-To-Request-For-Refund:
                  $ref: '#/components/examples/Initial-Response-To-Request-For-Refund'
                Status - Initial-Response-To-Payment-Confirmation-Request:
                  $ref: '#/components/examples/Initial-Response-To-Payment-Confirmation-Request'
                Status - Initial-Response-To-Request-For-Payment:
                  $ref: '#/components/examples/Initial-Response-To-Request-For-Payment'
                Status - Initial-Outgoing-Request-For-Refund:
                  $ref: '#/components/examples/Initial-Outgoing-Request-For-Refund'
                Status - Initial-Response-To-Request-for-Information-Compliance:
                  $ref: '#/components/examples/Initial-Response-To-Request-for-Information-Compliance'
                Uk Status - Stop Request:
                  $ref: '#/components/examples/Uk-Stop-Request'
                In Status - Stop Request:
                  $ref: '#/components/examples/In-Stop-Request'
                Br Status - Stop Request:
                  $ref: '#/components/examples/Br-Stop-Request'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        default:
          $ref: '#/components/responses/Internal-Server-Error'
  /paymentservices/v1/payments/{uetr}/messages/{message_id}:
    get:
      tags:
      - Non-Payment Messages
      summary: Inquire for the latest status of a transaction using UETR and Message Id
      operationId: findMessageByMessageId
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: Your unique identification, same as the identification you use for OAuth token generation, Citi shared with you during your CitiConnect API onboarding
        example: 6d3cf821-db6d-496d-bec0-064a362e9c31
      - name: uetr
        in: path
        description: Unique end-to-end transaction reference
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
      - name: message_id
        in: path
        description: Unique message id
        required: true
        schema:
          type: string
          maxLength: 35
        examples:
          message_id_1:
            value: 0c4fb98bd77a446896bb0c88b3b8f75a
      security:
      - oAuth2:
        - paymentservices
      responses:
        '200':
          description: OK
          headers:
            request_id:
              schema:
                type: string
              description: Citi's unique identification for your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Final-Message-Response'
              examples:
                Status - ValidRequest-For-Refund:
                  $ref: '#/components/examples/Ok-Request-For-Refund'
                Status - ValidRequest-For-Refund-SEPA:
                  $ref: '#/components/examples/Ok-Request-For-Refund-SEPA'
                Status - ValidResponsetoRequest-For-Refund:
                  $ref: '#/components/examples/Ok-Response-To-Request-For-Refund'
                Status - ValidResponsetoRequest-For-Refund-SEPA:
                  $ref: '#/components/examples/Ok-Response-To-Request-For-Refund-SEPA'
                Status - InvalidResponsetoRequest-For-Refund:
                  $ref: '#/components/examples/Not-Ok-Response-To-Request-For-Refund'
                Status - ValidPayment-Confirmation-Request:
                  $ref: '#/components/examples/Ok-Payment-Confirmation-Request'
                Status - ValidPending-Payment-Confirmation-Request:
                  $ref: '#/components/examples/Pending-Payment-Confirmation-Request'
                Status - ValidRequest-For-Payment:
                  $ref: '#/components/examples/Ok-Request-For-Payment'
                Status - ValidRequest-for-Information-Compliance:
                  $ref: '#/components/examples/OK-Request-For-Information-Compliance'
                Status - ValidResponsetoRequest-For-Information-Compliance:
                  $ref: '#/components/examples/OK-Response-To-Request-For-Information-Compliance'
                Status - ValidRequest-For-Refund-Uk:
                  $ref: '#/components/examples/Ok-Request-For-Refund-Uk'
                Status - ValidRequest-For-Refund-In:
                  $ref: '#/components/examples/Ok-Request-For-Refund-In'
                Status - ValidRequest-For-Refund-Br:
                  $ref: '#/components/examples/Ok-Request-For-Refund-Br'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        default:
          $ref: '#/components/responses/Internal-Server-Error'
components:
  responses:
    Bad-Request:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error-Response'
          examples:
            Bad-Request-Example:
              $ref: '#/components/examples/Bad-Request-Example'
    Method-Not-Allowed:
      description: Method Not Allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error-Response'
          examples:
            Method-Not-Allowed-Example:
              $ref: '#/components/examples/Method-Not-Allowed-Example'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error-Response'
          examples:
            Unauthorized-Example:
              $ref: '#/components/examples/Unauthorized-Example'
    Internal-Server-Error:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error-Response'
          examples:
            Internal-Server-Error-Example:
              $ref: '#/components/examples/Internal-Server-Error-Example'
    Not-Found:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error-Response'
          examples:
            Not-Found-Example:
              $ref: '#/components/examples/Not-Found-Example'
  schemas:
    Response-To-Payment-Confirmation-Request:
      type: object
      title: ResponseToPaymentConfirmationRequest
      properties:
        uetr:
          type: string
          description: UETR of Original payment
          pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          title: uetr
        status:
          type: object
          title: status
          readOnly: true
          properties:
            date_time:
              type: string
              format: date-time
              description: "UTC (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Date time, \n-, status change date time"
              title: date_time
            code:
              type: string
              description: ISO 20022 message status code
              enum:
              - PDNG
              - RJCT
              title: code
            description:
              type: string
              description: "Status code description \n- PDNG - Pending \n- RJCT - Rejected"
              minLength: 1
              maxLength: 256
              title: description
            reasons:
              type: object
              title: reasons
              readOnly: true
              properties:
                code:
                  type: string
                  description: Reason code (applicable when message is rejected)
                  maxLength: 4
                  title: code
                description:
                  type: string
                  description: Reason code description (e.g., Debtor account is invalid.)
                  minLength: 1
                  maxLength: 256
                  title: description
    Initial-Acknowledgement-Response:
      type: object
      title: InitialAcknowledgementResponse
      properties:
        message_id:
          type: string
          description: Message Identification
          readOnly: true
          maxLength: 35
          title: message_id
        creation_date_time:
          type: string
          format: date-time
          description: "UTC (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Date time when a message was created"
          readOnly: true
          title: creation_date_time
        message_type:
          type: string
          description: "Message Type as provided by the customer \n- RFR - Request for Refund (camt.056) \n- RRFR - Response to Request for Refund(camt.029) \n- PCR - Payment Confirmation Request \n- RPCR - Response to Payment Confirmation Request \n- RFP - Request for Payment (pain.013) \n- RRFP - Response to Request for Payment (pain.014) \n- RRFICS - Response to Request for Information Compliance"
          enum:
          - RFR
          - RRFR
          - PCR
          - RPCR
          - RFP
          - RRFP
          - RRFICS
          title: message_type
        message:
          oneOf:
          - $ref: '#/components/schemas/Initial-Response-To-Request-For-Refund'
          - $ref: '#/components/schemas/Initial-Response-To-Payment-Confirmation-Request'
          - $ref: '#/components/schemas/Initial-Response-To-Request-For-Payment'
          - $ref: '#/components/schemas/Initial-Outgoing-Request-For-Refund'
          - $ref: '#/components/schemas/Initial-Response-To-Request-for-Information-Compliance'
      required:
      - message_id
      - creation_date_time
      - message_type
    Initial-Response-To-Request-For-Refund:
      type: object
      title: InitialResponseToRequestForRefund
      properties:
        case_id:
          type: string
          description: Case Id received from clearing
          minLength: 1
          maxLength: 35
          title: case_id
        decision_code:
          type: string
          description: "Acceptance or Rejection of return of funds. Only the below 3 codes are applicable  \n- IPAY - Acceptance to Return the payment \n- RJCR - Decline to Return the payment \n- PECR - Partially Executed Cancellation Return"
          enum:
          - ACDA
          - ACNR
          - ACVA
          - CHRG
          - CNCL
          - CONF
          - CVAA
          - CWFW
          - FTNA
          - ICOV
          - IDUP
          - IPAY
          - IPYI
          - MCOV
          - MODI
          - MWFW
          - PDCR
          - PECR
          - PURP
          - RJCR
          - RJNR
          - RJVA
          - SMTC
          - SMTI
          - UWFW
          - BIAS
          - IDNE
          - IVCR
          - INFO
          - NINF
          - PDNG
          title: decision_code
        reasons:
          type: object
          title: reasons
          properties:
            code:
              type: string
              description: "Code of Transaction reasons \n- If decision_code = RJCR,reasons.code is mandatory for ResponseToRequest-For-Refund "
              enum:
              - AC04
              - ADAC
              - AGNT
              - AM04
              - ARDT
              - ARPL
              - CUST
              - LEGL
              - NARR
              - NOAS
              - NOOR
              - PTNA
              - RQDA
              - WSEQ
              - IDMN
              - ACLR
              - AEXR
              - ARFR
              - ARJR
              - PATE
              - RR04
              - RCAR
              - RCNR
              - RCPR
              - URTP
              title: code
            description:
              type: string
              description: "Reason code description (e.g., Debtor account is invalid.). \n- For reasons.code = NARR this field is mandatory"
              minLength: 1
              maxLength: 105
              title: description
        instructed_amount:
          type: number
          description: "Instructed amount for partial acceptance of return request \n- Mandatory for ResponseToRequest-For-Refund with decision code as PECR."
          minimum: 0.01
          maximum: 1000000000000000
          title: instructed_amount
        instructed_currency:
          type: string
          description: "Instructed currency for partial acceptance of return request \n- Mandatory for ResponseToRequest-For-Refund with decision code as PECR"
          enum:
          - USD
          - EUR
          - AUD
          - ARS
          - BRL
          - HKD
          - CNY
          title: instructed_currency
        instruction_id:
          type: string
          description: Unique Instruction id on return payment initiation
          minLength: 1
          maxLength: 35
          title: instruction_id
        end_to_end_id:
          type: string
          description: Unique end to end id on return payment initiation
          minLength: 1
          maxLength: 35
          title: end_to_end_id
        country:
          description: "ISO 3166 Alpha-2 code for the non pay message country. \n- This field is optional for US \n- This field is mandatory for SEPA"
          type: string
          default: US
          enum:
          - US
          - IE
          - DE
          - AT
          - BE
          - FI
          - FR
          - GR
          - IT
          - LU
          - NL
          - PT
          - ES
          - SK
          - BG
          title: country
        status:
          type: object
          title: status
          readOnly: true
          properties:
            date_time:
              type: string
              format: date-time
              description: "UTC (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Status change date time"
              title: date_time
            code:
              type: string
              description: ISO 20022 message status code
              enum:
              - PDNG
              title: code
            description:
              type: string
              description: "Status code description \n- PDNG - Pending"
              minLength: 1
              maxLength: 256
              title: description
          required:
          - date_time
          - code
          - description
      required:
      - case_id
      - decision_code
      - end_to_end_id
    Message-Debtor-Request-For-Payment:
      type: object
      title: MessageDebtorRequestForPayment
      properties:
        account:
          maxLength: 40
          minLength: 1
          type: string
          description: Debtor Account ID
          title: account
        account_name:
          maxLength: 140
          minLength: 1
          type: string
          description: Debit Account name, different from the Debtor Name
          title: account_name
        name:
          maxLength: 140
          minLength: 1
          type: string
          description: Debtor Name
          title: name
        bank_id:
          maxLength: 16
          minLength: 1
          type: string
          description: Instructing Agent member Identification ID of a clearing system
          title: bank_id
        address_lines:
          type: array
          description: Debtor's address_lines
          items:
            $ref: '#/components/schemas/Address'
          title: address_lines
        street_name:
          maxLength: 70
          minLength: 1
          type: string
          description: 'Debtor''s street_name '
          title: street_name
        building_number:
          maxLength: 16
          minLength: 1
          type: string
          description: Debtor's building_number
          title: building_number
        postal_code:
          maxLength: 16
          minLength: 1
          type: string
          description: Debtor's postal_code
          title: postal_code
        city:
          maxLength: 35
          minLength: 1
          type: string
          description: Debtor's City
          title: city
        state:
          maxLength: 35
          minLength: 1
          type: string
          description: Debtor's State
          title: state
        country:
          type: string
          description: Debtor's Country
          pattern: ^[A-Z]{2,2}$
          title: country
        org_id:
          maxLength: 20
          minLength: 1
          type: string
          description: Debtor's org_id
          title: org_id
        birth_date:
          type: string
          format: date
          description: 'ISO 8601 (YYYY-MM-DD), Debtor''s birth_date '
          title: birth_date
        birth_city:
          maxLength: 35
          minLength: 1
          type: string
          description: Debtor's birth_city
          title: birth_city
        birth_country:
          type: string
          description: Debtor's birth_country
          pattern: ^[A-Z]{2,2}$
          title: birth_country
      required:
      - account
      - name
      - bank_id
    Message-Transaction-Status:
      type: object
      title: MessageTransactionStatus
      required:
      - uetr
      - type
      - instructed_amount
      - creation_date_time
      - value_date
      - settlement_currency
      - settlement_amount
      properties:
        end_to_end_id:
          maxLength: 35
          minLength: 1
          pattern: ^(?!\s*$).+
          type: string
          description: Specifies a character string with a maximum length of 35 characters
          title: end_to_end_id
        instruction_id:
          type: string
          maxLength: 35
          minLength: 1
          description: Instruction Id
          title: instruction_id
        uetr:
          type: string
          pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          description: UUID v4 format unique end-to-end transaction reference
          title: uetr
        network_id:
          maxLength: 128
          minLength: 1
          type: string
          description: Transaction identification generated for or by the network
          title: network_id
        local_reference:
          maxLength: 35
          minLength: 1
          type: string
          description: This is a Citi generated payment reference which is included in the ‘Bank Reference’ field of bank statement posting for itemized transaction
          title: local_reference
        batch_id:
          maxLength: 35
          minLength: 1
          type: string
          description: "Identification for the bulk debit or credit posting to Citi account \n - For SEPA, transaction.batch_id field is optional and allwed maxLength is 35"
          title: batch_id
        bill_id_1:
          maxLength: 128
          pattern: ^[0-9A-Z]{1,128}$
          type: string
          description: "Bill identification for a bill payment \n - For US transaction.bill_id_1 field is not applicable"
          title: bill_id_1
        bill_id_2:
          maxLength: 128
          pattern: ^[0-9A-Z]{1,128}$
          type: string
          description: "Bill identification for a bill payment \n - For US transaction.bill_id_2 field is not applicable"
          title: bill_id_2
        bill_id_3:
          maxLength: 128
          pattern: ^[0-9A-Z]{1,128}$
          type: string
          description: "Bill identification for a bill payment \n - For US transaction.bill_id_3 field is not applicable"
          title: bill_id_3
        type:
          type: string
          description: Transaction Type - Debit or Credit
          enum:
          - credit
          - debit
          title: type
        purpose:
          type: string
          enum:
          - CNFL
          - PAYR
          - OTHR
          - CASH
          - GP2P
          - SCVE
          - GDDS
          - GDSV
          - SALA
          - SUPP
          - RCPT
          - COST
          - TREA
          - REFU
          description: "Purpose of a transaction \n- CASH for cash management \n- CNFL for confidential \n- COST for payment for business expenses \n- GDDS for payment related to purchase or sale of goods \n- GDSV for payment related to purchase or sale of goods and services \n- GP2P for person-to-person payment \n- OTHR for other, if your payment doesn't fit any of the specific purpose codes \n- PAYR for payroll payment \n- RCPT for payment of a receipt \n- SALA for salary payment \n- SCVE for payment related to purchase or sale of services \n- SUPP for supplier payment \n- TREA for treasury payment \n- REFU for refund payment"
          title: purpose
        tax_code:
          type: number
          enum:
          - 0
          - 1
          description: "Tax code \n - For US transaction.tax_code field is not applicable"
          title: tax_code
        wht_code:
          type: string
          enum:
          - A
          - S
          - B
          description: "Withholding tax (WHT) code \n - For US transaction.wht_code field is not applicable"
          title: wht_code
        income_type:
          type: string
          pattern: ^(00[0-9]|01[0-2])$
          description: "Income type  \n - For US transaction.income_type field is not applicable"
          title: income_type
        vat_rate:
          type: number
          minimum: 0
          description: "Value-added tax (VAT) rate \n - For US transaction.vat_rate field is not applicable"
          title: vat_rate
        vat_amount:
          type: number
          maximum: 1000000000000000
          description: "Value-added tax (VAT) amount \n - For US transaction.vat_amount field is not applicable"
          title: vat_amount
        wht_rate:
          type: number
          minimum: 0
          description: "Withholding tax (WHT) rate (0 - 99.99) \n - For US transaction.wht_rate field is not applicable"
          title: wht_rate
        wht_amount:
          type: number
          maximum: 1000000000000000
          description: "Withholding tax (WHT) amount \n - For US transaction.wht_amount field is not applicable"
          title: wht_amount
        bill_due_date:
          type: string
          format: date
          description: "ISO 8601 (YYYY-MM-DD) bill due date \n - For US transaction.bill_due_date field is not applicable"
          title: bill_due_date
        creation_date_time:
          type: string
          format: date-time
          description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment (Debit) - Date time, generated by CitiConnect API, when CitiConnect API accepted a payment initiation after validation \n- Instant Payment (Credit) - Date time, either provided by the debtor bank or generated by Citi's transaction processing application, when a transaction was created"
          title: creation_date_time
        value_date:
          type: string
          format: date
          description: YYYY-MM-DD Date in local time zone (e.g., EST for a United States RTP ) when Citi's transaction processing application starts processing a transaction
          title: value_date
        instructed_amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000
