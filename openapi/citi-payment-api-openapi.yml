    PaymentTransaction:
      required:
      - confirmed_amount
      - creditor
      - creditor_account
      - creditor_agent
      - debtor
      - debtor_account
      - debtor_agent
      - instructed_amount
      - payment_event
      - service_type_indicator
      - transaction_status
      - uetr
      type: object
      properties:
        uetr:
          allOf:
          - $ref: '#/components/schemas/UUIDv4Identifier'
          - description: string of unique characters attached to payment messages,designed to provide complete transparency for all parties in a payment. It identifies the payment resource.
        end_to_end_identification:
          maxLength: 35
          minLength: 1
          type: string
