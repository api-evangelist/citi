          type: string
          description: The time of the message transmission expressed in UTC (Universal Time Coordinated, also known as "GMT") in format YYYYMMDD-HH:MM:SS.mmm
          example: 20180820-04:48:29.125
        deals:
          type: array
          items:
            required:
            - account
            - clOrdId
            - tenor
            - dealtCcy
            - ccyPair
            - side
            - orderQty
            - rateSetId
            - ordType
            properties:
              account:
                type: string
                description: Your Citi-assigned client identifier. This may contain special characters ( ‘_’, ‘.’, ‘-‘).
                maxLength: 50
                example: '109430258'
              clOrdId:
                type: string
                description: The unique identifier of the order that you assign. It should be a reference specific to the client/request combination.
                maxLength: 64
                example: TEST12345
              tenor:
                type: string
                description: "The following FX standard tenors are supported:\n\n|Tenor |\tValue|\n| ----- | ------------|\n|Overnight\t| ON\t|\n|Tom/Next | TN\t|\n|Spot  |SP\t|\n|Spot/Next  |SN\t|\n|One Week  |1W\t|\n|Two Week  |2W\t|\n|Three Week  |3W\t|\n|One Month  |1M\t|\n|Two Month  |2M\t|\n|Three Month  |3M\t|\n|Four Month  |4M\t|\n|Five Month  |5M\t|\n|Six Month  |6M\t|\n|Seven Month  |7M\t|\n|Eight Month  |8M\t|\n|Nine Month  |9M\t|\n|Ten Month  |10M\t|\n|Eleven Month  |11M\t|\n|One Year  |1Y\t|\n|Fifteen Months  |15M\t|\n|Eighteen Months  |18M\t|\n|Twenty One Months  |21M\t|\n|Two Years  |2Y\t|\n|Specify a Broken Date| BROKEN  |\n\nIf providing a Broken Date, <i>i.e.</i> a Value Date is specified, the Tenor must be populated with ‘BROKEN’."
                maxLength: 10
                example: SP
              valueDate:
                type: string
                format: date
                description: 'The value date the order is being placed for. Only required if tenor=’BROKEN’. Format: yyyy-MM-dd.'
                example: '2011-05-05'
              dealtCcy:
                type: string
                description: The Currency that you wish to deal on. Please contact your Citi representative to obtain a list supported currency pairs.
                maxLength: 3
                example: GBP
              ccyPair:
                type: string
                description: The Currency Pair that  you are dealing on. Please discuss with your Citi Representative on your preference of sending the value of currency pair in either BaseTerm format or alphabetic sort order.
                maxLength: 6
                example: GBPUSD
              side:
                type: string
                enum:
                - B
                - S
                description: The Buy Or Sell indicator from your perspective. B=Client buys dealt ccy S=Client sells dealt ccy.
                example: B
              orderQty:
                type: number
                format: double
                description: The Order quantity of the dealt currency.
                example: 100000
              customTenorUnit:
                type: integer
                description: 'The tenor unit to be used when booking a trade with a Tenor type of T. Current supported values are 1, 3, 5. Field Type: Integer.'
                example: 1
              clientData:
                type: string
                description: 'Optional. This field will take a string value and whatever you send in it will be sent back to you as we received it. This field value will be available in the final report.

                  Key1:Value1|Key2:Value2|Key3:Value

                  '
                maxLength: 30
                example: Amount:1234|onBehalfOf:ClientB
              clientData2:
                type: string
                description: 'Optional. This field will take a string value and whatever you send in it will be sent back to you as we received it. This field may be available in the final report.

                  Key1:Value1|Key2:Value2|Key3:Value

                  '
                maxLength: 30
                example: Amount:1234|onBehalfOf:ClientB
              clientData3:
                type: string
                description: 'Optional. This field will take a string value and whatever you send in it will be sent back to you as we received it.

                  Key1:Value1|Key2:Value2|Key3:Value"

                  '
                example: Amount:1234|onBehalfOf:ClientB
                maxLength: 30
              clientData4:
                type: string
                description: 'Optional. This field will take a string value and whatever you send in it will be sent back to you as we received it.

