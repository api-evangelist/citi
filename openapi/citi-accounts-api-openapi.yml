openapi: 3.2.0
info:
  title: Citi Accounts API
  version: '1.0'
  description: 'Operations tagged Accounts across 4 of this provider''s published API definitions: account_balance_inquiry_api.yaml, citi-statement-transactions-openapi.yaml, citi-transfer-agency-accounts-openapi.yaml, self-service_api.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://tts.apib2b.citi.com/tts/cards
  description: production gateway URL
- url: https://tts.sandbox.apib2b.citi.com/tts/cards
  description: sandbox URL
- url: https://sit.b2b.api.icg.citi.com/citiconnect/sit5/iis/api/funds/transferagency
  description: dev gateway url
- url: https://sandbox.b2b.api.icg.citi.com/citiconnect/sb/iis/api/funds/transferagency
  description: sandbox url
- url: https://b2b.api.icg.citi.com/citiconnect/prod/iis/api/funds/transferagency
  description: production gateway url
- url: https://tts.apib2b.citi.com/citiconnect/prod/selfservices/v1
  description: production gateway url
- url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb/selfservices/v1
  description: sbox url
tags:
- name: Accounts
paths:
  /accounts/v1/balanceInquiry:
    post:
      summary: Account Balance Inquiry
      description: Retrieves account balance information such as the credit or cash limit, current balance, and total usage for various account levels(group, relationship, financial account, or card). Optionally pass a transaction amount in the request to check whether there is available credit for a card transaction.
      operationId: Account Balance Inquiry
      parameters:
      - name: Content-Type
        in: header
        description: Supports application/json
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: The OAuth Token prefixed with "Bearer" and space in between.
        required: true
        schema:
          type: string
      - name: client_id
        in: query
        required: true
        description: This is your unique identifier shared during your CitiConnect API onboarding. This is the same `client_id` used for oauth token generation
        schema:
          type: string
      - name: Region
        in: header
        description: region of the client(APAC/EMEA/NAM)
        required: true
        schema:
          type: string
      - name: Country
        in: header
        description: country of the client
        required: true
        schema:
          type: string
      - name: Req-Sys-Id
        in: header
        description: Client tracking ID
        required: true
        schema:
          type: string
      - name: key-id
        in: header
        description: Client certificate key ID to be provided by TPP
        required: true
        schema:
          type: string
      responses:
        '200':
          description: <table><tr><td>Code</td><td>Details</td></tr><tr><tr><td>BalInquiryResponse</td><td><table><tr><td>Code</td><td>Details</td></tr><tr><tr><td>BalInquiryResponse</td><td>Success</td></tr></table></td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalInquiryResponse'
        '400':
          description: <table><tr><td>ResponseCodes400</td><td><table><tr><td>ResponseCode</td><td>Bad Request</td></tr></table></td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseCodes400'
        '500':
          description: <table><tr><td>ResponseCode500</td><td><table><tr><td>ResponseCodes</td><td>Internal Server Error</td></tr></table></td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseCode500'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalInquiryRequest'
        description: BalInquiryRequest
        required: true
      tags:
      - Accounts
      security:
      - clientCredentials: []
    servers:
    - url: https://tts.apib2b.citi.com/tts/cards
      description: production gateway URL
    - url: https://tts.sandbox.apib2b.citi.com/tts/cards
      description: sandbox URL
  /accounts/v1/statement/summary:
    post:
      summary: Get All Statements
      description: This endpoint is used to obtain the summary of statements
      operationId: All Statements
      tags:
      - Accounts
      parameters:
      - name: Content-Type
        in: header
        description: Supports application/json
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: The OAuth Token prefixed with "Bearer" and space in between.
        required: 'true'
        schema:
          type: string
      - name: client_id
        in: query
        required: true
        description: This is your unique identifier shared during your CitiConnect API onboarding. This is the same `client_id` used for oauth token generation
        schema:
          type: string
      - name: Country
        in: header
        description: Country of the client
        required: true
        schema:
          type: string
      - name: Region
        in: header
        description: region of the client(APAC/EMEA/NAM)
        required: true
        schema:
          type: string
      - name: Req-Sys-Id
        in: header
        description: Client Tracking ID
        required: true
        schema:
          type: string
      - name: key-id
        in: header
        description: Client certificate key ID to be provided by TPP. Non TPP clients should provide value as 00000000
        required: true
        schema:
          type: string
      responses:
        '200':
          description: <table><tr><td>Code</td><td>Details</td></tr><tr><tr><td>AccountSummaryInboundResponse</td><td></td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummaryInboundResponse'
        '400':
          description: <table><tr><td>ResponseCodes400</td><td><table><tr><th>Error Code</th><th>Error Description</th></tr><tr><td>EVB1101</td><td>accountNumber is required</td></tr><tr><td>EVB1102</td><td>accountNumber value must be numeric</td></tr><tr><td>EVB1103</td><td>accountNumber must be between 16 and 19 digits</td></tr><tr><td>EVB1117</td><td>Card account number does not belong to the relationship number that has been onboarded for this client ID</td></tr><tr><td>EVB1118</td><td>Card account number does not belong to the group account number that has been onboarded for this client ID</td></tr><tr><td>EVB1119</td><td>Card account number does not belong to the region that has been onboarded for this client ID</td></tr><tr><td>EVB1120</td><td>Invalid accountNumber</td></tr> <tr><td>EVB1130</td><td>Certificate Key Id entered is not valid</td></tr> <tr><td>EVB1131</td><td>Payload signing validation failed.</td></tr> <tr><td>EVB1132</td><td>Group account number has not been onboarded for this client ID and key ID.</td></tr><tr><td>EVC1133</td><td>Certificate Key Id is mandatory</td></tr><tr><td>GRC0002</td><td>Client ID is missing in the request header</td></tr><tr><td>GRC0003</td><td>Invalid JSON Input</td></tr><tr><td>GRC0004</td><td>Region ID is not available in the request</td></tr><tr><td>GRC0005</td><td>Client Tracking ID is missing in the request header</td></tr><tr><td>GRC0007</td><td>Client requested Content Type is not supported</td></tr><tr><td>GRC0010</td><td>Client Tracking ID length should contain a min of 1 character and a max of 36 characters</td></tr><tr><td>GRC0011</td><td>Client ID and/or Country and/or region id is missing in Client Onboard Configuration setup. Contact Citi support.</td></tr><tr><td>GRC0016</td><td>Country code is not available in the request</td></tr></table></td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseCodes400'
        '500':
          description: <table><tr><td>ResponseCode500</td><td><table><tr><th>Error Code</th><th>Error Description</th></tr><tr><td>GRC0014</td><td>We have encountered an error and couldn't receive your request. Please try again, or contact Citi support if you have any further questions or comments</td></tr></table></td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseCode500'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSummaryInboundRequest'
        description: AccountSummaryInboundRequest
        required: true
      security:
      - clientCredentials: []
    servers:
    - url: https://tts.apib2b.citi.com/tts/cards
      description: production gateway URL
    - url: https://tts.sandbox.apib2b.citi.com/tts/cards
      description: sandbox URL
