  schemas:
    Validation-Response:
      type: object
      title: ValidationResponse
      properties:
        uetr:
          type: string
          pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          description: UUID v4 format unique end-to-end transaction reference
          title: uetr
        end_to_end_id:
          type: string
          description: "Client provided reference number. \n - For SEPA VoP, this parameter is optional with max length 35 \n - For UK bank availability/reachability, this parameter is not applicable \n - For US EWS, this parameter is not applicable \n - For UK, this parameter is not applicable \n - For IN PAN, this parameter is not applicable \n - For Global Mastercard validation, this parameter is not applicable"
          minLength: 1
          maxLength: 35
          title: end_to_end_id
        debtor:
          type: object
          title: debtor_response
          properties:
            account:
              type: string
              description: "Bank account held with CITI \n - For UK bank availability/reachability, this parameter is optional and max length is 40 \n - For US EWS, this parameter is optional and max length is 40 \n - For UK, this parameter is optional and max length is 40 \n - For IN PAN, this parameter is optional and max length is 40  \n - For SEPA VoP, this parameter is optional and max length is 40 \n - For Global Mastercard Validation this parameter is not applicable"
              minLength: 1
              maxLength: 40
              title: account
            name:
