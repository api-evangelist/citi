openapi: 3.1.0
info:
  version: ''
  title: InstantFX Reporting (SYNCHRONOUS CALL)
  description: >
    The FX Reporting API allows you to submit reporting requests to retrieve an
    execution report, order status enquiry, or refund availability report.
servers:
  - url: https://api.citivelocity.com/markets
    description: production URL
  - url: https://sandbox.api.citivelocity.com/markets
    description: sanbox URL
security:
  - OAuth2:
      - fxapi
paths:
  /fxgateway/sync/orderreport/api/v1:
    post:
      summary: Order enquiry and refund report enquiry
      description: >
        This endpoint facilitates requests for order enquiries and refund
        reports. 

        For FX Order Enquiry: while the fields `tradeDate`, `rateSetId`,
        `clOrdId` and `orderId` are optional individually, you must send them in
        at least one of the combinations below:
          * `tradeDate` & `rateSetId`
          * `clOrdId`
          * `orderId`

        For FX Gross and Portfolio Refund Enquiry: while the fields `tradeDate`,
        `rateSetId`, `fromTradeDate` and `toTradeDate` are optional
        individually, you must send them in at least one of the combinations
        below:
          * `tradeDate` & `symbol`
          * `rateSetId` & `symbol`
          * `fromTradeDate` & `toTradeDate` & `symbol`

        For Two Way Refund Enquiry, You must send in at least the `origClOrdId`
        or `rateSetId`
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/FXOrderEnquiry'
                - $ref: '#/components/schemas/FXGrossRefundEnquiryRequest'
                - $ref: '#/components/schemas/FXPortfolioRefundEnquiryRequest'
                - $ref: '#/components/schemas/FXTwoWayRefundEnquiryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ExecutionReport'
                  - $ref: '#/components/schemas/FXGrossRefundEnquiryResponse'
                  - $ref: '#/components/schemas/FXPortfolioRefundEnquiryResponse'
                  - $ref: '#/components/schemas/FXTwoWayRefundEnquiryResponse'
        '401':
          description: Unauthorized user error
        '403':
          description: Access Forbidden error
        '500':
          description: Internal Server Error
