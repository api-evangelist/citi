            <br><br><b>SALE</b> : Exchange rate applied is the market rate at
            the time of the sale. <br><br><b>AGRD</b> : Exchange rate applied is
            the rate agreed between the parties.
          enum:
            - SPOT
            - SALE
            - AGRD
      description: >-
        Set of elements used to provide details on the currency exchange rate
        and contract.
