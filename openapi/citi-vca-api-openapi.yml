    ClearingReportInboundRequest:
      properties:
        startDate:
          description: "Specifies the end date upto when the reports can be retrieved<br><br>Format:YYYY-MM-DD<br><br>Rules:<ol><li>End date should greater than the start date</li><li>Mastercard:  <ul><li>startDate and endDate cannot be more than 90 days apart</li><li>startDate and endDate can be up to 36 months\n in the past from the day of report requested and not future date</li></ul></li><li>Visa:<ul><li>startDate and endDate cannot be more than 90 days apart</li><li>startDate and endDate can be up to 6 months\n in the past from the day of report requested and not future date</li></ul></li></ol>"
          type: string
          format: alphanumeric
          example: '2023-01-01'
          maxLength: 10
        endDate:
          description: "Specifies the end date upto when the reports can be retrieved<br><br>Format:YYYY-MM-DD<br><br>Rules:<ol><li>End date should greater than the start date</li><li>Mastercard:  <ul><li>startDate and endDate cannot be more than 90 days apart</li><li>If endDate is more than 90 days after startDate, it will be automatically reset to exactly 90 days after startDate</li><li>startDate and endDate can be up to 36 months\n in the past from the day of report requested and not future date</li></ul></li><li>Visa:<ul><li>startDate and endDate cannot be more than 90 days apart</li><li>If endDate is more than 90 days after startDate, it will be automatically reset to exactly 90 days after startDate</li><li>startDate and endDate can be up to 6 months\n in the past from the day of report requested and not future date</li></ul></li></ol>"
          type: string
          format: alphanumeric
          example: '2023-01-30'
          maxLength: 10
        startTime:
          description: Specifies the start time from when the reports can be retrieved<br><br>Format:HH:MM<br><br>Mastercard - Optional<br>Visa - Not applicable
          type: string
          format: alphanumeric
          example: 00:00
          maxLength: 10
        endTime:
          description: Specifies the end time upto when the reports can be retrieved<br><br>Format:HH:MM<br><br>Mastercard - Optional<br>Visa - Not applicable
          type: string
          format: alphanumeric
          example: '23:59'
          maxLength: 10
        transactionType:
          description: 'Specifies the nature of the transaction whether it was authorized or returned etc.<br><br>Visa - Not applicable<br><br>Mastercard - Optional<br><br>Possible Values:<br><br>"All" - Returns all Clearing transactions associated to a virtual card account for a given time range<br>"Presentment" - First Presentment transactions<br>"Second Presentment" - Second Presentment transactions in response to a Chargeback initaited from Issuer<br>"Chargeback" - First Chargeback transactions (Full & Partial)<br>"Arbitration Chargeback" - Arbitration chargeback transactions (Full & Partial)<br>"Retrieval Request" - Transactions where an issuer sent a Retrieval Request to an acquirer when it is determined that thetransaction information document needs to be examined for issuer or cardholder needs.<br>"Fee collection" - Transactions related to the collection or disbursement of fees that require funds settlement between various clearing system participants. Fee Collection messages may include fees generated between pairs of customers, and fees generated between the Corporation and customers. Following are some examples of Fee Collection messages: • Collection or disbursement from customer to customer of fees that brand, program, and service rules permit<br> • Collection or disbursement from Mastercard to customer of fees related to processing services that the clearing system provides<br> • Collection or disbursement from Mastercard to customer of such fees as administrative fees, membership fees, and penalties, according to brand, program, and service<br> • Collection or disbursement from customer to customer of summary settlement positions between customers that participate in bilateral clearing arrangements with clearing system summary settlement'
          type: string
          format: alphanumeric
          example: All
          maxLength: 20
        vcaId:
          description: A reference number that uniquely identifies the virtual card account.
          type: string
          format: alphanumeric
          example: '67676781'
          maxLength: 19
        programId:
          description: Unique ID of the company record defined in the virtual cards system.<br><br>Mastercard - This value is returned in the ID Provisioning API. This value is generated when the VCA program is onboarded to Mastercard's VCA platform. Data format - Long (Numeric). Max character length - 19<br><br>Visa - This value is generated when the VCA program is onboarded to Visa's VCA platform. Data format - Alphanumeric. Max character length - 25
          type: string
          format: alphanumeric
          example: '233191'
          maxLength: 25
        messageId:
          description: nique ID of the API message sent. The messageId will be provided back in the corresponding response. The ID must be unique per API request and cannot include special characters
          type: string
          format: alphanumeric
          example: CITI0000000ClearReport20230825120311
          maxLength: 36
          minLength: 28
        virtualCardAccountNumber:
          description: The virtual card account number to use for transactions.<br><br>Numeric field and no decimals allowed
          type: string
          format: alphanumeric
          example: '5281722601926445'
          maxLength: 16
        timeZone:
          description: Defines the time zone applicable for any date or time<br><br>UTC offset<br><br>Mastercard - Required<br>Visa - Not applicable
          type: string
          format: alphanumeric
          example: UTC+05:30
          maxLength: 9
        reportIds:
          description: An optional reportId array passed by client to fetch the Clearing report transactions that previously returned a "PENDING" or "IN-PROGRESS" report status. When calling the API with reportId, pass all other request parameters as orignally passed in the previous request<br><br>Mastercard - Optional<br>Visa - Not applicable
          type: array
          items:
            type: string
          format: alphanumeric
          example:
          - '12345'
        filters:
          $ref: '#/components/schemas/RequestFilters'
      required:
      - startDate
      - endDate
      - vcaId
      - programId
      - messageId
      - virtualCardAccountNumber
