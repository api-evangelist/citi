      type: string
      format: date-time
      title: Data de início
      description: >-
        Filtra os registros cuja data de criação seja maior ou igual que a data
        de início. Respeita RFC 3339.
    Fim:
      type: string
      format: date-time
      title: Data de fim
      description: >-
        Filtra os registros cuja data de criação seja menor ou igual que a data
        de fim. Respeita RFC 3339.
  parameters:
    Client-Id:
      in: query
      name: client_id
      required: true
      description: >-
        Sua identificação exclusiva, a mesma que você usa para geração de token
        OAuth, o Citi compartilhou com você durante a integração da API do
        CitiConnect
      schema:
        type: string
        description: >-
          Sua identificação exclusiva, a mesma que você usa para geração de
          token OAuth, o Citi compartilhou com você durante a integração da API
          do CitiConnect
        example: 9a10a5d6-63d4-4885-b6bd-19e79629496d
    paginaAtual:
      in: query
      name: paginacao.paginaAtual
      required: false
      schema:
        type: integer
        format: int32
        title: Página atual
        minimum: 0
        default: 0
        description: >-
          Página a ser retornada pela consulta. Se não for informada, o PSP
          assumirá que será 0.
    itensPorPagina:
      in: query
      name: paginacao.itensPorPagina
      required: false
      schema:
        type: integer
        format: int32
        title: Itens por Página
        minimum: 1
        maximum: 1000
        default: 100
        description: >-
          Quantidade máxima de registros retornados em cada página. Apenas a
          última página pode conter uma quantidade menor de registros.
  responses:
    NaoEncontrado:
      description: Recurso solicitado não foi encontrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            exemplo1:
              $ref: '#/components/examples/NaoEncontradoExample1'
    AcessoNegado:
      description: >-
        Requisição de participante autenticado que viola alguma regra de
        autorização.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            exemplo1:
              $ref: '#/components/examples/AcessoNegadoExample1'
    ServicoIndisponivel:
      description: >-
        Serviço não está disponível no momento. Serviço solicitado pode estar em
        manutenção ou fora da janela de funcionamento.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            exemplo1:
              $ref: '#/components/examples/ServicoIndisponivelExample1'
