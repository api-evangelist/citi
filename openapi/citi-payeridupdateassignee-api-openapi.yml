          schema:
            $ref: '#/components/schemas/Payer-ID-Update-Assignee-Response'
          examples:
            OkResponseExampleForUpdateAssigneedetails:
              $ref: '#/components/examples/OK-Response-Update-Assignee-Success-Example'
