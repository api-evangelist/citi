    FXGrossRefundEnquiryRequest:
      description: >
        This report enquiry shows the current usage and availability of
        refunds.  While the fields `tradeDate`, `rateSetId`, `fromTradeDate`,
        `toTradeDate`, `symbol` are optional, you must send them in at least one
        of the combinations below to fetch the results:

        a) `tradeDate` & `symbol`

        b) `rateSetId` & `symbol`

        c) `fromTradeDate` & `toTradeDate` & `symbol`
      type: object
      required:
        - action
        - jsonReqId
        - senderCompId
        - onBehalfOfCompId
        - account
        - symbol
        - sendingTime
      properties:
        action:
          type: string
          description: >-
            The service you are requesting. Allowed value:
            refund-report-request.
          example: refund-report-request
        jsonReqId:
          type: string
          description: >-
            The unique identifier that you assign in the JSON request. Must be
            alphanumeric.
          maxLength: 100
          example: Req20181011776
        senderCompId:
          type: string
          description: >-
            The Citi-assigned value used to identify the message sender. This
            was assigned to you during onboarding. May contain special
            characters ( ‘_’, ‘.’, ‘-‘).
          maxLength: 20
          example: ClientName
        onBehalfOfCompId:
          type: string
          description: >-
            The Citi-assigned value used to identify the sub-entity. This was
            assigned to you during onboarding. May contain special characters (
            ‘_’, ‘.’, ‘-‘).
          maxLength: 20
          example: ClientName
        sendingTime:
          type: string
          description: >-
            The time of the message transmission expressed in UTC (Universal
            Time Coordinated, also known as "GMT"). Format:
            YYYYMMDD-HH:MM:SS.mmm.
          example: 20180820-04:48:29.125
        account:
          type: string
          description: >-
            The Account ID supplied by Citi. May contain special characters
            (‘_’, ‘.’, ‘-‘)
          maxLength: 50
          example: TEST12345
        rateSetId:
          type: integer
          format: int32
          description: The Rate Set Id for the report.
          example: 12345
        symbol:
          type: string
          maxLength: 6
          description: >-
            The currency pair value. The value must be ‘ALL’ to enquire refund
            availability for all the currency pairs on which orders are placed
            in the specified rateSetId. Otherwise, the value must be the
            specific currency to which you want to enquire refund availability
            for the mentioned symbol in the mentioned rateSetId.
          example: ALL
        tradeDate:
          type: string
          format: date
          description: 'The rate set’s trade date for the report. Format: yyyy-MM-dd.'
          example: '2023-09-21'
        fromTradeDate:
          type: string
          format: date
          description: >-
            Denotes the starting date in rate set’s trade date range for the
            report. Format: yyyy-MM-dd.
          example: '2026-02-01'
        toTradeDate:
          type: string
          format: date
          description: >-
            Denotes the ending date in rate set’s trade date range for the
            report. Format: yyyy-MM-dd.
          example: '2026-03-01'
      example:
        action: refund-report-request
        senderCompId: CTEST12001
        onBehalfOfCompId: BTEST62013
        jsonReqId: brs-25-09-2018-01
        sendingTime: 20210406-04:48:29.125
        account: client1
        symbol: ALL
        rateSetId: 12345
    FXGrossRefundEnquiryResponse:
      type: object
      required:
        - action
        - jsonReqId
        - senderCompId
        - onBehalfOfCompId
        - sendingTime
      properties:
        action:
          type: string
          description: >-
            Defines the action of the message. Value will be
            refund-report-response.
          example: refund-report-response
        jsonReqId:
          type: string
          description: The unique identifier for the JSON request. Format is alphanumeric.
          maxLength: 100
          example: Req20181011776
        senderCompId:
          type: string
          description: >-
            The Citi-assigned value used to identify the firm sending the
            message.
          maxLength: 20
          example: clientname
        onBehalfOfCompId:
          type: string
          description: >-
            The Citi-assigned value used to identify the sub-entity. May contain
            special characters ( ‘_’, ‘.’, ‘-‘).
          maxLength: 20
          example: clientname
        sendingTime:
          type: string
          description: >-
            The time of message transmission. Always expressed in UTC (Universal
            Time Coordinated, also known as 'GMT.' Format is
            YYYYMMDD-HH:MM:SS.mmm.
          example: 20180820-04:48:31.155
        errorCode:
          type: integer
          description: >-
            The error code associated with the response. See the Error Codes tab
            for a complete list.
          example: 99
        errorMessage:
          type: string
          description: >-
            The error message associated with the response. See the Error Codes
            tab for a complete list.
          example: unable to process your request
        refundAvailable:
          type: object
          properties:
            grAvailable:
              type: array
              items:
                required:
                  - account
                  - rateSetId
                  - currencyPair
                  - baseCcy
                  - refundBaseBuyUsed
                  - refundBaseSellUsed
                  - refundBaseBuyAvailable
                  - refundBaseSellAvailable
                  - tradeDate
                properties:
                  account:
                    type: string
                    description: >-
                      The API Client ID supplied by Citi. May contain special
                      characters (‘_’, ‘.’, ‘-‘).
                    maxLength: 50
                    example: TEST12345
                  rateSetId:
                    type: integer
                    format: int32
                    description: The Rate Set Id for the report.
                    example: 12345
                  currencyPair:
                    type: string
                    description: >-
                      A 6-character sorted alpha string containing two ISO ccy
                      codes that this rate applies.
                    example: EURUSD
                  tierSequence:
                    type: integer
                    description: >-
                      Only applicable if you are configured for time-based
                      guaranteed rates. Shows the ordinal number of the rate
                      used in the set of time-based rates, ordered according to
                      “valid until time”, for the specified currency pair.
                    example: 1
                  baseCcy:
                    type: string
                    description: The base currency of the currency pair.
                    maxLength: 3
                    example: EUR
                  refundBaseBuyUsed:
                    type: number
                    format: double
                    description: The buy refund amount used in terms of base currency.
                    example: 111.24
                  refundBaseSellUsed:
                    type: number
                    format: double
                    description: The sell refund amount used in terms of base currency.
                    example: 111.24
                  refundBaseBuyAvailable:
                    type: number
                    format: double
                    description: The buy refund amount available in terms of base currency.
                    example: 55.34
                  refundBaseSellAvailable:
                    type: number
                    format: double
                    description: >-
                      The sell refund amount available in terms of base
                      currency.
                    example: 66.99
                  tradeDate:
                    description: The ratesets tradeDate
                    type: string
                    format: date
                    example: '2026-02-03'
      example:
        refundAvailable:
          grAvailable:
            - account: client1
              rateSetId: 12345
              currencyPair: GBPZMW
              tierSequence: 1
              baseCcy: GBP
              refundBaseBuyUsed: 15.71
              refundBaseSellUsed: 0
              refundBaseBuyAvailable: 0
              refundBaseSellAvailable: 15.67
              tradeDate: '2026-02-02'
            - account: client1
              rateSetId: 12345
              currencyPair: GBPZMW
              tierSequence: 2
              baseCcy: GBP
              refundBaseBuyUsed: 20.59
              refundBaseSellUsed: 18.54
              refundBaseBuyAvailable: 76.98
              refundBaseSellAvailable: 76.54
              tradeDate: '2026-02-02'
        action: refund-report-response
        jsonReqId: brs-25-09-2018-01
        senderCompId: IFXCLIENT0
        onBehalfOfCompId: IFXCLIENT0
        sendingTime: 20260312-11:18:40.741
