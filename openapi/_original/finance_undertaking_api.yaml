            * DEMD  - Demand
            * ECID  - E-stamp Certificate ID
            * OTH   - Other
            * TRAF  - TransferForm

            Or any other bilaterally agreed code.

            MT Mapping: field 23X"
        undertaking_document_identification:
          maxLength: 35
          minLength: 1
          type: string
          description: 'Identification of the document or template.  MT Mapping: field 23X'
