          example: EMV
          type: string
          title: cryptogram_format
    Card:
      title: card
      description: "\n- For CARD Authorize operation method.card parameter is mandatory when method.type parameter is selected as CARD \n- For CARD Capture operation method.card parameter is mandatory when method.type parameter is selected as CARD \n- For CARD Pay operation method.card parameter is mandatory when method.type parameter is selected as CARD \n- For CARD Verify operation method.card parameter is mandatory when method.type parameter is selected as CARD"
      properties:
        number:
          description: "The customer’s payment card number, also known as the Primary Account Number (PAN). \n- For CARD Authorize operation method.card.number parameter is mandatory  \n- For CARD Pay operation method.card.number parameter is mandatory \n- For CARD Verify operation method.card.number parameter is mandatory \n- For India card transaction, method.card.number parameter is mandatory when token number is not provided"
          example: PA123456789
          maxLength: 23
          minLength: 9
          type: string
          title: number
        expiry_month:
          description: "Two-digit month in which the payment card expires.  \n- For CARD Authorize operation method.card.expiry_month parameter is mandatory \n- For CARD Pay operation method.card.expiry_month parameter is mandatory \n- For CARD Verify operation method.card.expiry_month parameter is mandatory \n- For India card transaction, method.card.expiry_month parameter is mandatory"
          example: '01'
          type: string
          pattern: ^(0?[1-9]|1[0-2])$
          title: expiry_month
        expiry_year:
          description: "Four-digit year in which the payment card expires. \n- For CARD Authorize operation method.card.expiry_year parameter is mandatory \n- For CARD Pay operation method.card.expiry_year parameter is mandatory \n- For CARD Verify operation method.card.expiry_year parameter is mandatory \n- For India card transaction, method.card.expiry_year parameter is mandatory"
          type: string
          pattern: ^[0-9]{2,2}$
          example: '25'
          title: expiry_year
        cvv:
          description: "Card security code. \n- For India card transaction, method.card.cvv parameter is mandatory"
          example: '311'
          maxLength: 4
          minLength: 3
          type: string
          title: cvv
        type:
          description: You can provide this parameter for card types that have a savings/checking option, such as Maestro cards.If you do not provide a value, we will use the acquirer's default. You can use paymentTypes.card.cardTypes in the 'Retrieve Payment Options' operation response to determine the card type.
          enum:
          - CHECKING
          - SAVINGS
          example: SAVINGS
          type: string
          title: type
        card_type:
          description: This parameter is only applicable if the gateway has identified the card as a co-branded card.
          example: JOHN
          maxLength: 50
          minLength: 3
          type: string
          title: card_type
        last_4_digits:
          description: "The customer’s payment card last four number. \n- For India card transaction, method.card.last_4_digits parameter is mandatory when token number is provided"
          example: '1234'
          maxLength: 4
          minLength: 4
          type: string
          title: last_4_digits
        cryptogram:
          description: "The card cryptogram details. \n- For India card transaction, method.card.cryptogram parameter is mandatory when token number is provided and allowed maximum length is 50."
          example: PA123456789
          maxLength: 50
          minLength: 1
          type: string
          title: cryptogram
        diner_token_reference:
          description: The card diner token reference.
          example: PA123456789
          maxLength: 50
          minLength: 1
          type: string
          title: diner_token_reference
        diner_merchant_id:
          description: The card diner merchant id.
          example: ADFEGTYYUU
          maxLength: 50
          minLength: 1
          type: string
          title: diner_merchant_id
        device:
          $ref: '#/components/schemas/Device'
    Unstructured:
      type: string
      maxLength: 140
      minLength: 1
      description: “Unstructured remittance information”
      title: Unstructured
    Transaction:
      title: Transaction
      required:
      - id
      - currency_code
      - country_code
      properties:
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
        url:
          $ref: '#/components/schemas/Url'
        amount:
          description: "Transaction amount \n - For Brazil QR Creation decimal values are mandatory for transaction.amount and it must have 2 digits \n - For Brazil QR Creation maxmium amount limit is 9999999999.99 and transaction.amount parameter is mandatory \n- For CARD Capture operation transaction.amount parameter is mandatory, maxmium amount limit is 50000.00 and allowed max 2 decimal after dot. \n - For UK PAYBYBANK Creation transaction.amount parameter is mandatory, maxmium amount limit is 1000000.00 and allowed max 2 decimal after dot. \n- For US RFP, this parameter is mandatory with maximum amount limit 1000000.00 \n- For ACH verify transaction, transaction.amount parameter is mandatory. \n- For US ACH Direct Debit, transaction.amount parameter is mandatory with max 18 digits and 2 decimals. \n- For Brazil PIX Initiation, this is mandatory parameter with max 18 digits & 2 decimals \n - For India Card Capture transaction, transaction.amount parameter is mandatory, minimum amount is 1 and maxmium amount limit is 1000000"
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        currency_code:
          description: "ISO 4217 Currency Code for instance USD/GBP/EUR \n- transaction.currency_code parameter is mandatory for all transaction type creation"
          enum:
          - BRL
          - USD
          - GBP
          - INR
          - EUR
          - CAD
          - HKD
          - AUD
          - SGD
          - DKK
          - NOK
          - SEK
          - PLN
          - IDR
          - MYR
          - THB
          - CHF
          - PHP
          - CZK
          example: BRL
          type: string
          title: currency_code
        reference:
          description: "Value provided by the merchant for internal tracking/referencing.  \n - For UK PAYBYBANK Creation reference parameter is optional and allowed maximum length is 128 \n- For US RFP, this parameter will contain the unique reference (instruction) id with max length 35 \n- For US ACH Direct Debit, transaction.reference parameter is mandatory with max length 10 (accepts only numbers) \n- For Brazil PIX Initiation this parameter is optional for retry use case where applicable value will be transaction ID used during initial request"
          example: REPAY
          maxLength: 250
          minLength: 1
          type: string
          title: reference
        network:
          type: string
          enum:
          - RTP
          - FDN
          description: Financial market infrastructure or clearing system (e.g., RTP Network in the United States)
          title: network
        source:
          description: "Indicates the channel through which you received authorization for the payment for this order from the payer. \n- CALL_CENTRE Transaction conducted via a call centre. \n- CARD_PRESENT Transaction where the card is presented to the merchant. \n- INTERNET Transaction conducted over the Internet. \n- MAIL_ORDER Transaction received by mail. \n- MERCHANT Transaction initiated by you based on an agreement with the payer. For example, a recurring payment, installment payment, or account top-up. \n- MOTO Transaction received by mail or telephone. \n- PAYER_PRESENT Transaction where a non-card payment method is presented to the Merchant. \n- TELEPHONE_ORDER Transaction received by telephone.\n- VOICE_RESPONSE Transaction conducted by a voice/DTMF recognition system."
          enum:
          - CALL_CENTRE
          - CARD_PRESENT
          - INTERNET
          - MAIL_ORDER
          - MERCHANT
          - MOTO
          - PAYER_PRESENT
          - TELEPHONE_ORDER
          - VOICE_RESPONSE
          example: PAYER_PRESENT
          type: string
          title: source
        country_code:
          description: "The order country \n- transaction.country_code parameter is mandatory for all transaction type creation"
          enum:
          - US
          - BR
          - GB
          - IN
          - TH
          - AU
          - CA
          - MX
          - DE
          - NL
          - IE
          - IT
          - FR
          - ES
          - HK
          - SG
          - NZ
          - DK
          - 'NO'
          - SE
          - SW
          - BE
          - FI
          - CH
          - CZ
          - AT
          - PT
          example: US
          type: string
          title: country_code
        reason:
          description: "Cancellation/adjustment reason. \n- For Brazil PIX Initiation, this parameter is mandatory with max length 4 with the following allowed values: 'AGND' (First Attempt of Payment Schedule Request) & 'NTAG' (Scheduling of a new post-due payment attempt)"
          example: REPAY
          maxLength: 140
          minLength: 1
          type: string
          title: reason
        auth_id:
          description: The transactionId you used for the Initiate Authentication operation.
          example: A123456789
          maxLength: 40
          minLength: 1
          type: string
          title: auth_id
        target_transaction_id:
          description: The identifier for the transaction you wish to refund, That is the {transactionId} URL parameter for REST and the transaction.id parameter for NVP.
          example: T123456789
          maxLength: 40
          minLength: 1
          type: string
          title: target_transaction_id
        correlation_id:
          description: A transient identifier for the request, that can be used to match the response to the request.
          example: '123456789'
          maxLength: 100
          minLength: 1
          type: string
          title: correlation_id
        preferred_language:
          description: The language that you prefer the payment provider to use for pages displayed to the payer.
          example: '123456789'
          maxLength: 35
          minLength: 2
          type: string
          title: preferred_language
        expiry_time:
          description: Expiration time for QR collection, specified in seconds.
          example: 3600
          format: int32
          minimum: 10
          type: integer
          title: expiry_time
        qr_image:
          description: Merchant to confirm QR Image is required or not, If required value should be Y.
          enum:
          - Y
          - N
          example: Y
          type: string
          title: qr_image
        id:
          description: "Unique Transaction identification provided by the merchant during  transaction creation \n- For Brazil QR Creation transaction.id parameter should be of length between 26 to 35 and allowed datatype is Alphanumeric and should not be filled with spaces or zeroes \n- For CARD operations transaction.id parameter allowed maxmium length is 40. \n- For UK PAYBYBANK creation transaction.id parameter allowed maxmium length is 18 and allowed characters are alphabets, numbers and space \n- For US RFP this parameter is mandatory with max length 35 \n- For ACH transaction transaction.id parameter is mandatory with allowed maxmium length is 40. \n- For US ACH Direct Debit, this parameter is mandatory with maxLength 16. \n- For Brazil PIX Initiation, this parameter is mandatory with min length 26 & max length 35 of alphanumeric characters \n- For India CARD transaction, transaction.id parameter allowed maxmium length is 50."
          example: pay02052023456r
          maxLength: 128
          minLength: 1
          type: string
          title: id
        value_date:
          type: string
          format: date
          description: "Value Date Format is YYYY-MM-DD. \n- For US RFP this parameter is mandatory \n- For US ACH Direct Debit, this parameter is mandatory"
          title: value_date
        expiry_date:
          type: string
          format: date
          description: "Expiry Date Format is YYYY-MM-DD \n- For US RFP this parameter is mandatory"
          title: expiry_date
        update_flag:
          description: "Indicator if the exact amount indicated in amount must be paid, or if under/over payment is permitted.\n- For QR Creation (ex. Brazil), during transaction processing if the merchant want to allow his client to change QR Amount then the value should be Y otherwise default value will be N \n- For US RFP, if Y then Amount may be modified by the customer, if N then Amount of payment must equal the Instructed Amount. If no value passed, default behavior is same as Y"
          enum:
          - Y
          - N
          example: Y
          type: string
          title: update_flag
        full_amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000000
          description: "Amount that is the gross amount payable by client \n- For US RFP transaction, this parameter is optional"
          title: full_amount
        discount_amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000000
          description: "Amount that is the discount from the gross amount \n- for US RFP. If populated, message.transaction.full_amount must also be populated."
          title: discount_amount
        creation_date_time:
          type: string
          format: date-time
          readOnly: true
          description: "Date and time at which request was received in UTC timezone \n- This parameter is mandatory for Brazil PIX Initiation."
          example: '2022-09-13T08:23:49.114Z'
          title: creation_date_time
        purpose:
          $ref: '#/components/schemas/Purpose'
        remittance_info:
          type: array
          description: "Unstructured remittance information \n - For US RFP, transaction.remittance_info parameter is optional and only one(1) line of 140 characters is allowed \n- For Brazil PIX Initiation this parameter is optional and only one(1) line of 140 characters is allowed"
          items:
            $ref: '#/components/schemas/Unstructured'
          title: remittance_info
        constraints:
          $ref: '#/components/schemas/Constraints'
        acquirer:
          $ref: '#/components/schemas/Acquirer'
        transit:
          $ref: '#/components/schemas/Transit'
        product_info:
          type: array
          items:
            $ref: '#/components/schemas/Product-Info'
        holiday_flag:
          description: Specifies if a request should consider holiday
          type: boolean
          example: true
          title: holiday_flag
      type: object
    Risk:
      type: object
      title: Risk
      properties:
        custom:
          maxLength: 4000
          minLength: 1
          type: string
          description: Additional data passed to third-party risk assessment providers.This parameter is only relevant if you use a third-party risk assessment provider, and you have agreed with them the values to provide
          title: custom
        payment_recipient:
          $ref: '#/components/schemas/Payment-Recipient'
    Payment-Update-Request:
      type: object
      title: Payment update request
      required:
      - transaction
      properties:
        customer:
          $ref: '#/components/schemas/Customer-Update'
        merchant:
          $ref: '#/components/schemas/Merchant-Update'
        method:
          $ref: '#/components/schemas/Method-Update'
        transaction:
          $ref: '#/components/schemas/Transaction-Update'
        order:
          $ref: '#/components/schemas/Order-Update'
        shipping:
          $ref: '#/components/schemas/Shipping'
      additionalProperties: false
      description: Payment Update Request
    Ach:
      title: ach
      type: object
      description: "\n- For ACH Pay operation method.ach parameter is mandatory when method.type parameter is selected as ACH \n- For ACH Verify operation method.ach parameter is is mandatory when method.type parameter is selected as ACH"
      properties:
        sec_code:
          description: "Identifies the Standard Entry Class (SEC) code to be sent to the issuer where WEB = Internet Initiated/Mobile Entry, TEL = Telephone-Initiated Entry, PPD = Prearranged Payment and Deposit, CCD = Corporate Credit or Debit Entry, IAT = International ACH Transaction. \n - For ACH Pay transaction method.ach.sec_code parameter is mandatory \n- For US ACH Direct Debit, method.ach.sec_code parameter is mandatory with the following allowed values - IAT, CCD, PPD, and WEB"
          enum:
          - WEB
          - TEL
          - PPD
          - CCD
          - IAT
          example: WEB
          type: string
          title: sec_code
    Url:
      title: url
      type: object
      description: "URL.  \n - For UK PAYBYBANK Creation transaction.url parameter is mandatory."
      properties:
        accepted:
          description: "Acceptance URL. \n - For UK PAYBYBANK Creation transaction.url.accepted parameter is mandatory and maximum allowed length is 200 and URL should start either with http:// or https://"
          example: accepted
          maxLength: 2083
          minLength: 1
          type: string
          title: accepted_url
        declined:
          description: "Declined URL. \n - For UK PAYBYBANK Creation transaction.url.declined parameter is mandatory and maximum allowed length is 200 and URL should start either with http:// or https://"
          example: declined
          maxLength: 2083
          minLength: 1
          type: string
          title: declined_url
        browser_payment_return:
          description: "The URL of your website to which you want the payer's browser to be redirected on completing the payment interaction at the payment provider's website. \n - For Paypal transaction transaction.url.browser_payment_return field becomes mandatory, when transaction.url.app_payment_return field is not provided by client in the payment initiation request"
          example: declined
          maxLength: 2048
          minLength: 1
          type: string
          title: browser_payment_return_url
        app_payment_return:
          description: "The URL of your app to which you want the payer to be redirected on completing the payment interaction at the payment provider's website or in the payment provider's app. \n - For Paypal transaction.url.app_payment_return is mandatory, if client not provided transaction.url.browser_payment_return "
          example: declined
          maxLength: 2048
          minLength: 1
          type: string
          title: app_payment_return_url
    Order-Get-Notification:
      title: Order
      properties:
        id:
          description: "A unique identifier for this order to distinguish it from any other order you create. \n- For CARD Authorize, Capture, Pay and Verify operation order.id parameter is mandatory \n- For ACH Pay and Verify transaction order.id parameter is mandatory"
          example: OR123456789
          maxLength: 40
          minLength: 1
          type: string
          title: id
        amount:
          description: "The total amount for the order \n- For CARD Authorize operation order.amount parameter is mandatory \n- For CARD Capture operation order.amount parameter is mandatory \n- For CARD Pay operation order.amount parameter is mandatory \n- For CARD Verify operation order.amount parameter is mandatory and allowed maximum amount is 2 \n- For ACH PAY and Verify transaction, order.amount parameter is mandatory"
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        creation_date_time:
          type: string
          format: date-time
          description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment (Debit) - Date time, generated by CitiConnect API, when CitiConnect API accepted a payment initiation after validation \n- Instant Payment (Credit) - Date time, either provided by the debtor bank or generated by Citi's transaction processing application, when a transaction was created \n- For ACH PAY and Verify transaction, order.creation_date_time parameter is mandatory"
          example: '2022-09-13T08:23:49.114Z'
          title: creation_date_time
        update_time:
          type: string
          format: date-time
          description: "Indicates the date and time the gateway considers the order to have last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment (Debit) - Date time, generated by CitiConnect API, when CitiConnect API accepted a payment initiation after validation \n- Instant Payment (Credit) - Date time, either provided by the debtor bank or generated by Citi's transaction processing application, when a transaction was created \n- For ACH PAY and Verify transaction, order.last_update_time parameter is mandatory"
          example: '2022-09-13T08:23:49.114Z'
          title: update_time
        reference:
          description: An optional identifier for the orderFor example, a shopping cart number, an order number, or an invoice number.
          example: REPAY789541
          maxLength: 200
          minLength: 1
          type: string
          title: reference
        invoice_number:
          description: The invoice number you issued for this order
          example: INV789541
          maxLength: 25
          minLength: 1
          type: string
          title: invoice_number
        currency_code:
          description: "ISO 4217 Currency Code for instance  USD/GBP/EUR \n- order.currency_code parameter is mandatory for all transaction type creation"
          enum:
          - BRL
          - USD
          - GBP
          - INR
          - EUR
          - CAD
          - HKD
          - AUD
          - SGD
          - DKK
          - NOK
          - SEK
          - PLN
          - IDR
          - MYR
          - THB
          - CHF
          - PHP
          - CZK
          example: BRL
          type: string
          title: currency_code
        merchant_amount:
          description: "The total amount for the order in order.merchantCurrency units. \n- For CARD Authorize operation order.merchant_amount parameter is mandatory \n- For CARD Capture operation order.merchant_amount parameter is mandatory \n- For CARD Pay operation order.merchant_amount parameter is mandatory \n- For CARD Verify operation order.merchant_amount parameter is mandatory"
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: merchant_amount
        merchant_currency:
          description: " The currency in which you priced your inventory for this order, expressed as an ISO 4217 alpha codeISO 4217 Currency Code for instance  USD/GBP/EUR \n- order.merchant_currency parameter is mandatory for all transaction type creation"
          enum:
          - BRL
          - USD
          - INR
          example: BRL
          type: string
          title: merchant_currency
        status:
          type: string
          maxLength: 30
          description: "Order Status, following status you will receive in response \n- AUTHENTICATED - The payer was successfully authenticated. \n- AUTHENTICATION_INITIATED - Payer authentication has been initiated but not completed. \n- AUTHENTICATION_NOT_NEEDED - Payer authentication was not performed as it was not needed. \n- AUTHENTICATION_UNSUCCESSFUL - Payer authentication was not able to be successfully completed. \n- AUTHORIZED - The payment has been authorized successfully but the authorized amount has not yet been captured, in part, full, or excess. \n- CANCELLED - The initial transaction for this order has been voided successfully. \n- CAPTURED - The authorized amount for this order, in full or excess, has been captured successfully. \n- CHARGEBACK_PROCESSED - A Chargeback has been processed against this order. \n- DISPUTED - The payment has been disputed and is under investigation. A request for information has been received or a chargeback is pending. \n- EXCESSIVELY_REFUNDED - The payment has been captured in part, full, or excess, but the captured amount in excess has been refunded successfully. \n- FAILED - The payment has not been successful. \n- FUNDING - The order transfers money to or from the merchant, without the involvement of a payer. For example, recording monthly merchant service fees from the payment service provider. \n- INITIATED - A browser payment that has successfully been initiated for this order. No payment has yet been made. \n- PARTIALLY_CAPTURED - The authorized amount for this order, in part, has been captured successfully. \n- PARTIALLY_REFUNDED - The payment has been captured in part, full, or excess, but the captured amount in part has been refunded successfully. \n- REFUNDED - The payment has been captured in part, full, or excess, but the captured amount in full has been refunded successfully. \n- REFUND_REQUESTED - A refund against captured amounts on this order has been requested but not executed. Requires further action to approve the refund. \n- VERIFIED - The card details for this order have successfully been verified. No payment has yet been initiated or made. \n- DISBURSED - The order amount has successfully been disbursed to the payer."
          example: AUTHENTICATED
          title: status
        total_auth_amount:
          description: "The amount that has been successfully authorized for this order. \n- For CARD Authorize operation order.total_auth_amount parameter is mandatory \n- For CARD Capture operation order.total_auth_amount parameter is mandatory \n- For CARD Pay operation order.total_auth_amount parameter is mandatory \n- For CARD Verify operation order.total_auth_amount parameter is mandatory"
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_auth_amount
        total_captured_amount:
          description: "The amount that has been successfully captured for this order. \n- For CARD Authorize operation order.total_captured_amount parameter is mandatory \n- For CARD Capture operation order.total_captured_amount parameter is mandatory \n- For CARD Pay operation order.total_captured_amount parameter is mandatory \n- For CARD Verify operation order.total_captured_amount parameter is mandatory"
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_captured_amount
        total_disbursed_amount:
          description: "The amount that has been successfully captured for this order. \n- For CARD Authorize operation order.total_disbursed_amount parameter is mandatory \n- For CARD Capture operation order.total_disbursed_amount parameter is mandatory \n- For CARD Pay operation order.total_disbursed_amount parameter is mandatory \n- For CARD Verify operation order.total_disbursed_amount parameter is mandatory"
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_disbursed_amount
        total_refunded_amount:
          description: "The amount that has been successfully captured for this order. \n- For CARD Authorize operation order.total_refunded_amount parameter is mandatory \n- For CARD Capture operation order.total_refunded_amount parameter is mandatory \n- For CARD Pay operation order.total_refunded_amount parameter is mandatory \n- For CARD Verify operation order.total_refunded_amount parameter is mandatory"
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_refunded_amount
        item_amount:
          description: The total item amount for the order.If you do not provide this value but provide line item data, then this amount is calculated as the sum of the item.quantity times the item.unitPrice for all the line items (total item amount).If you provide both this value and line item data, then the order.itemAmount MUST equal the total item amount.
          example: '100.00'
          maxLength: 14
          minLength: 1
          type: string
          title: item_amount
    Payment-Method:
      type: array
      title: Payment Method
      items:
        type: object
        title: Items
        properties:
          type:
            description: "Method specified by the customer for the transaction \n- PIX for brazil QR creation \n- CARD for CARD transactions \n- BOLETO for BOLETO transactions \n- ALIPAY for ALIPAY transactions \n- ACH for ACH transactions \n- FPS for PAYBYBANK transactions \n- RTP for US RFP transactions \n- GOOGLEPAY for Google pay transactions \n- APPLEPAY for Apple pay transactions"
            type: string
            maxLength: 20
            minLength: 1
            example: PIX
            title: type
          country_code:
            description: Country where merchant onboarded for the payment method.
            type: string
            pattern: ^[A-Z]{2,2}$
            example: BR
            title: country_code
          currency_code:
            description: Currency code where merchant onboarded for the payment method.
            type: array
            items:
              type: string
              pattern: ^[A-Z]{3,3}$
              example: BRL
              title: currency_code
        additionalProperties: false
    Order:
      title: Order
      properties:
        id:
          description: "A unique identifier for this order to distinguish it from any other order you create. \n- For CARD Authorize,Capture,Pay and Verify operation order.id parameter is mandatory \n- For ACH Pay and Verify transaction order.id parameter is mandatory \n - For India Card Capture transaction, order.id parameter is mandatory"
          example: OR123456789
          maxLength: 50
          minLength: 1
          type: string
          title: id
        amount:
          description: "The total amount for the order.  This is the net amount plus any merchant charge amounts.If you provide any sub-total amounts, then the sum of these amounts (order.itemAmount, order.taxAmount, order.shippingAndHandlingAmount, order.cashbackAmount, order.gratuityAmount, order.merchantCharge.amount and order.dutyAmount), minus the order.discountAmount must equal the net amount.The value of this parameter in the response is zero if payer funds are not transferred. /n- For CARD Operations post decimal allowed maxmium 3 digits /n- For CARD Authorize, PAY and VERIFY Operations order.amount parameter is mandatory \n- For ACH Pay and Verify transaction order.amount parameter is mandatory /n- For India CARD transaction, order.amount parameter is mandatory, minimum amount is 1 and maxmium amount limit is 1000000 "
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        currency_code:
          description: "The currency of the order expressed as an ISO 4217 alpha code, e.g. USD. \n- For CARD Authorize operation order.currency_code parameter is mandatory \n- For CARD Capture operation order.currency_code parameter is mandatory \n- For CARD Pay operation order.currency_code parameter is mandatory \n- For CARD Verify operation order.currency_code parameter is mandatory \n- For BOLETO Pay operation order.currency_code parameter is mandatory \n- For ALIPAY Pay operation order.currency_code parameter is mandatory \n- For ACH Pay operation order.currency_code parameter is mandatory \n- For ACH Verify operation order.currency_code parameter is mandatory \n- For ACH Pay and Verify transaction order.currency_code parameter is mandatory /n- For India CARD transaction, order.currency_code parameter is mandatory"
          enum:
          - BRL
          - USD
          - GBP
          - INR
          - EUR
          - CAD
          - HKD
          - AUD
          - SGD
          - DKK
          - NOK
          - SEK
          - PLN
          - IDR
          - MYR
          - THB
          - CHF
          - PHP
          - CZK
          example: USD
          type: string
          title: currency_code
        charge_amount:
          description: The amount of the additional fee that you are charging the payer.
          example: '20.0'
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: charge_amount
        charge_type:
          description: The type of the additional fee that you are charging the payer.
          enum:
          - SURCHARGE
          example: SURCHARGE
          type: string
          title: charge_type
        item_amount:
          description: The total item amount for the order.
          example: 150
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: item_amount
        shipping_and_handling_amount:
          description: The total shipping and handling amount for the order, including taxes on the shipping and/or handling
          example: 20
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: shipping_and_handling_amount
        shipping_and_handling_tax_amount:
          description: The tax amount levied on the shipping and handling amount for the order.
          example: 20
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: shipping_and_handling_tax_amount
        shipping_and_handling_tax_rate:
          description: The tax rate applied to the shipping and handling amount for the order to determine the shipping and handling tax amount.
          example: 20
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: shipping_and_handling_tax_rate
        discount_amount:
          description: The total amount of the discount you have applied to the order
          example: 300
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: discount_amount
        tax_registration_id:
          description: Your tax registration identifier provided by the Federal/National tax authority (for example, federal tax identification number, ABN).If you are a Canadian merchant, use this parameter to provide your Tax Registration ID for paying Harmonized Sales Tax (HST) or Goods and Services Tax (GST) collected by the Canada Revenue Agency.
          example: 300
          maxLength: 30
          minLength: 1
          type: string
          title: tax_registration_id
        mcc:
          description: A 4-digit code used to classify your business by the type of goods or services it offers. This is also known as the Merchant Category Code (MCC).You only need to provide the MCC if you want to override the default value configured for your acquirer link. The value you provide must match one of those configured by your payment service provider.
          example: '7788'
          maxLength: 4
          minLength: 4
          type: string
          title: mcc
        certainty:
          description: Indicates if you expect to capture the full order amount for which you are requesting authorization.If you do not provide a value for order.certainty the default configured for you by your payment service provider will be used. The value provided in the response shows the value the gateway sent to the acquirer.
          enum:
          - ESTIMATED
          - FINAL
          example: FINAL
          type: string
          title: certainty
        date:
          description: The date the payer placed the order.
          example: '1988-02-15'
          format: date
          type: string
          title: date
        description:
          description: Short textual description of the contents of the order.
          example: LAPTOP PURCHASE
          maxLength: 127
          minLength: 1
          type: string
          title: description
        discount_code:
          description: The code you use to identify the reason for the discount.
          example: DISC001
          maxLength: 40
          minLength: 1
          type: string
          title: discount_code
        discount_description:
          description: A description of your reason for the discount.
          example: CARD DISCOUNT
          maxLength: 127
          minLength: 1
          type: string
          title: discount_description
        duty_amount:
          description: The duty amount (also known as customs tax, tariff or dues) for the order. /n- For CARD Operations post decimal allowed maxmium 3 digits
          example: 150
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: duty_amount
        entity:
          description: Your identifier for the part of your organization that is responsible for the order.You might provide this data when you want to track the accountability for the order. For example, store number, sales region, branch, or profit center.
          example: INDENTITY1
          maxLength: 40
          minLength: 1
          type: string
          title: entity
        purchase_type:
          description: 'Indicates the purchase of specific types of goods or services You must provide a value if your Merchant Category Code (MCC) is one of the following: 6051 (Quasi Cash – Merchant or Non-Financial Institutions – Foreign Currency, Non-Fiat Currency) and this transaction is for the purchase of cryptocurrency. Set the value to CRYPTOCURRENCY. 6211 (Securities – Brokers/Dealers) and this transaction is for the purchase of high-risk securities. Set the value to HIGH_RISK_SECURITIES. 6012 (Merchandise and Services—Customer Financial Institutions) or 6051 (Non-Financial Institutions – Foreign Currency, Non-Fiat Currency) and this transaction is for debt repayment. Set the value to DEBT_REPAYMENT. If the transaction pulls money from an account for the purpose of crediting another account you must set purchase type to ACCOUNT_FUNDING. You may set purchase type to OTHER for any other type of payment.'
          enum:
          - ACCOUNT_FUNDING
          - CRYPTOCURRENCY
          - DEBT_REPAYMENT
          - HIGH_RISK_SECURITIES
          - OTHER
          example: ACCOUNT_FUNDING
          type: string
          title: purchase_type
        tax_amount:
          description: The total tax amount for the order. If you do not provide this value but provide line item data, then this amount is calculated as the sum of the item.quantity times the item.unitTaxAmount for all the line items (total tax amount).If you provide both this value and line item data, then the order.taxAmount MUST equal the total tax amount.
          example: '100.00'
          maxLength: 14
          minLength: 1
          type: string
          title: tax_amount
        number_of_captures:
          description: This parameter only applies if you intend to receive the payer's funds in several Capture operations. You must provide this value where you want the gateway to automatically reverse the outstanding Authorization amount you do not intend to capture. Note that this requires your merchant profile to be configured accordingly. Contact your payment service provider if you are unsure about your configuration.
          example: 99
          maximum: 99
          minimum: 1
          type: number
          title: number_of_captures
        retailer_location:
          description: Provide information about the location of the retailers for goods or services included in this order. Where a retailer is located in a country different from your country, they are considered a foreign retailer, otherwise they are considered a domestic retailer.
          enum:
          - DOMESTIC_ONLY
          - FOREIGN_AND_DOMESTIC
          - FOREIGN_ONLY
          example: FOREIGN_ONLY
          type: string
          title: retailer_location
        reward_amount:
          description: The amount that the payer has chosen to pay by redeeming reward points earned using a card enrolled in a rewards program for full or part payment for this purchase.
          example: '100'
          maxLength: 14
          minLength: 1
          type: string
          title: reward_amount
        balance_id:
          description: An identifier generated by the gateway when you have requested the balance available for a credit or debit card.
          example: '100'
          maxLength: 100
          minLength: 1
          type: string
          title: balance_id
        avs_action:
          description: The action to be performed for the Address Verification Service (AVS) Response Code.
          enum:
          - NO_ACTION
          - REJECT
          - REVIEW
          example: REVIEW
          type: string
          title: avs_action
        avs_response:
          description: The Address Verification Service (AVS) Response Code for which you are defining the rule.
          enum:
          - ADDRESS_MATCH
          - ADDRESS_ZIP_MATCH
          - NAME_ADDRESS_MATCH
          - NAME_MATCH
          - NAME_ZIP_MATCH
          - NOT_AVAILABLE
          - NOT_REQUESTED
          - NOT_VERIFIED
          - NO_MATCH
          - SERVICE_NOT_AVAILABLE_RETRY
          - SERVICE_NOT_SUPPORTED
          - ZIP_MATCH
          example: ADDRESS_MATCH
          type: string
          title: avs_response
        reference:
          description: An optional identifier for the order For example, a shopping cart number, an order number, or an invoice number.
          example: CART123456
          maxLength: 200
          minLength: 1
          type: string
          title: reference
        invoice_number:
          description: The invoice number you issued for this order
          example: INV123456
          maxLength: 25
          minLength: 1
          type: string
          title: invoice_number
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
      type: object
  parameters:
    Client-Id:
      in: query
      name: client_id
      required: true
      description: Your unique identification, same as the identification you use for OAuth token generation, Citi shared with you during your CitiConnect API onboarding
      schema:
        type: string
        description: Your unique identification, same as the identification you use for OAuth token generation, Citi shared with you during your CitiConnect API onboarding
        example: 9a10a5d6-63d4-4885-b6bd-19e79629496d
