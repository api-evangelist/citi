    AnyBICIdentifier:
      pattern: ^[A-Z0-9]{4,4}[A-Z]{2,2}[A-Z0-9]{2,2}([A-Z0-9]{3,3}){0,1}$
      type: string
      description: >-
        Code allocated to a financial or non-financial institution by the ISO
        9362 Registration Authority, as described in ISO 9362: 2014 - "Banking -
        Banking telecommunication messages - Business identifier code (BIC)".
    ISODateTime:
      pattern: >-
        ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.[0-9]+)?(?:Z|[+-][01]\d:[0-5]\d)?$
      type: string
      description: >-
        Date & time(format YYYY-MM-DDThh:mm:ss.sssZ) when this particular of
        transaction status is captured. A particular point in the progression of
        time defined by a mandatory date and a mandatory time component,
        expressed in either UTC time format (YYYY-MM-DDThh:mm:ss.sssZ), local
        time with UTC offset format (YYYY-MM-DDThh:mm:ss.sss+/-hh:mm), or local
        time format (YYYY-MM-DDThh:mm:ss.sss). These representations are defined
        in "XML Schema Part 2: Datatypes Second Edition - W3C Recommendation 28
        October 2004" which is aligned with ISO 8601.

        Note on the time format:

        1) beginning / end of calendar day

        00:00:00 = the beginning of a calendar day

        24:00:00 = the end of a calendar day

        2) fractions of second in time format

        Decimal fractions of seconds may be included. In this case, the involved
        parties shall agree on the maximum number of digits that are allowed.
