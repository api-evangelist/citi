          required: true
          style: simple
          explode: false
          schema:
            type: string
          example: CITIIE20
        - name: If-Match
          in: header
          description: >-
            This header will contain the Etag of the resource representation to
            be manipulate. If the server ETag value does not match with the
            provided ETag value, the error response 412 - precondition fail will
            be returned. This signifies the resource is out of date.
          required: false
          style: simple
          explode: false
          schema:
            type: string
          example: f88dd058fe004909615a64f01be66a7
        - name: application-reference
          in: path
          description: >
            An unique and unambiguous identification of the Trade Finance
            Undertaking Application as assigned by the origin server. The value
            must be constant throughout the lifecycle of the application. On
            successful creation, the application can be retrieved using the
            application reference. This identification shall be used as a
            resource identifier for all state transition.
          required: true
          style: simple
          explode: false
          schema:
            type: string
            format: uuid
          example: 123e456-e89b-12d3-a456-426614174000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeFinanceInstruction'
            examples:
              updateBankGuarantee_success:
                $ref: '#/components/examples/UpdateBankGuarantee'
        required: true
      responses:
        '202':
          description: Accepted
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
        '400':
          description: Bad Request
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '401':
          description: Unauthorized
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '403':
          description: Forbidden
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '404':
          description: Not Found
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '406':
          description: Not Acceptable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '412':
          description: Precondition Failed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '415':
          description: Unsupported Media Type
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '429':
          description: Too Many Requests
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '500':
          description: Internal Server Error
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '502':
          description: Bad Gateway
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '503':
          description: Service Unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '504':
          description: Gateway Timeout
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        default:
          description: Internal Server Error
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
components:
  schemas:
    AccountIdentificationChoice:
      title: AccountIdentification
      type: object
      additionalProperties: true
      description: >-
        Specifies the unique identification of an account as assigned by the
        account servicer.
      oneOf:
        - title: IBANAccountIdentification
          required:
            - iban
          type: object
          properties:
            iban:
              pattern: ^[A-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}$
              type: string
              description: >
                International Bank Account Number (IBAN) - identifier used
                internationally by financial institutions to uniquely identify
                the account of a customer. Further specifications of the format
                and content of the IBAN can be found in the standard ISO 13616
                "Banking and related financial services - International Bank
                Account Number (IBAN)" version 1997-10-01, or later revisions.
              x-MXComponent: IBAN2007Identifier
              x-Validation: true
              x-ValidationType: Algorithmic
              x-Error: >-
                ErrorCode:Sw.Stds.D00003, ErrorText:Invalid IBAN format or
                invalid check digits., CitiValidation:true, Severity:Fatal
          additionalProperties: false
        - title: OtherAccountIdentification
          required:
            - other
          type: object
          properties:
            other:
              maxLength: 34
              minLength: 1
              type: string
              description: >-
                Unique identification of an account, as assigned by the account
                servicer, using an identification scheme.
          additionalProperties: false
    Amount1Choice:
      x-MXComponent: Amount1Choice
      type: object
      description: Choice of amounts.
      additionalProperties: true
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            increase_amount:
              x-MXComponent: ActiveCurrencyAndAmount
              description: >
                Amount of increase, and currency.


                A number of monetary units specified in an active currency where
                the unit of currency is explicit and compliant with ISO 4217.
              type: object
              additionalProperties: false
              properties:
                currency:
                  x-MXComponent: ActiveCurrencyCode
                  type: string
                  pattern: ^[A-Z]{3,3}$
                amount:
                  type: string
                  maxLength: 19
                  pattern: >-
                    ^0*(([0-9]{0,13}\.[0-9]{1,5})|([0-9]{0,14}\.[0-9]{1,4})|([0-9]{0,15}\.[0-9]{1,3})|([0-9]{0,16}\.[0-9]{1,2})|([0-9]{0,17}\.[0-9]{1,1})|([0-9]{0,18}\.)|0*|([0-9]{0,18}))$
              required:
                - currency
                - amount
          required:
            - increase_amount
        - type: object
          additionalProperties: false
          properties:
            decrease_amount:
              x-MXComponent: ActiveCurrencyAndAmount
              description: >
                Amount of decrease, and currency.


                A number of monetary units specified in an active currency where
                the unit of currency is explicit and compliant with ISO 4217.
              type: object
              additionalProperties: false
              properties:
                currency:
                  x-MXComponent: ActiveCurrencyCode
                  type: string
                  pattern: ^[A-Z]{3,3}$
                amount:
                  type: string
                  maxLength: 19
                  pattern: >-
                    ^0*(([0-9]{0,13}\.[0-9]{1,5})|([0-9]{0,14}\.[0-9]{1,4})|([0-9]{0,15}\.[0-9]{1,3})|([0-9]{0,16}\.[0-9]{1,2})|([0-9]{0,17}\.[0-9]{1,1})|([0-9]{0,18}\.)|0*|([0-9]{0,18}))$
              required:
                - currency
                - amount
          required:
            - decrease_amount
    BankGuaranteeAmendment2Subset:
      x-MXComponent: BankGuaranteeAmendment2Subset
      type: object
      description: Details of the bank guarantee amendment.
      additionalProperties: false
      properties:
        amendment_request_identification:
          x-MXComponent: RestrictedFINXMax16Text
          description: >
            Unique and unambiguous identifier assigned by the applicant to the
            Undertaking amendment request.


            MT Mapping: field 21A of MT 798


            Specifies a character string with a maximum length of 16 characters.
            It has a pattern that disables the use of characters that is not
            part of the character set X, that is, that is not a-z A-Z / - ? : (
            ) . , ‘ + , and disable the use of slash "/" at the beginning and
            end of line and double slash "//" within the line.
          type: string
          minLength: 1
          maxLength: 16
          pattern: >-
            ^([0-9a-zA-Z\-\?:\(\)\.,'\+ ]([0-9a-zA-Z\-\?:\(\)\.,'\+
            ]*(/[0-9a-zA-Z\-\?:\(\)\.,'\+ ])?)*)$
        amendment_platform_reference:
          x-MXComponent: UUIDv4Identifier
          description: >
            Unique technical reference assigned by the platform.



            Universally Unique IDentifier (UUID) version 4, as described in IETC
            RFC 4122 "Universally Unique IDentifier (UUID) URN Namespace".
          type: string
          pattern: >-
            ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
        amendment_sequence_number:
          x-MXComponent: Max3NumericText
          description: >
            Sequence number assigned by the Applicant to each proposed Amendment
            of the Undertaking.



            MT Mapping: field 26E


            Specifies a numeric string with a maximum length of 3 digits.
          type: string
          pattern: ^[0-9]{1,3}$
        amendment_request_date:
          x-MXComponent: ISODate
          description: >
            Date of the Undertaking amendment request.


            MT Mapping: field 13E


            A particular point in the progression of time in a calendar year
            expressed in the YYYY-MM-DD format. This representation is defined
            in "XML Schema Part 2: Datatypes Second Edition - W3C Recommendation
            28 October 2004" which is aligned with ISO 8601.
          type: string
          pattern: >-
            ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)(?:Z|[+-][01]\d:[0-5]\d)?$
        amendment_date:
          x-MXComponent: ISODate
          description: >
            Date on which the amendment is effective.


            MT Mapping: field 30


            A particular point in the progression of time in a calendar year
            expressed in the YYYY-MM-DD format. This representation is defined
            in "XML Schema Part 2: Datatypes Second Edition - W3C Recommendation
            28 October 2004" which is aligned with ISO 8601.
          type: string
          pattern: >-
            ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)(?:Z|[+-][01]\d:[0-5]\d)?$
        undertaking_amendment_instruction_purpose:
          x-MXComponent: AmendmentPurpose1Code
          description: >
            Specifies the purpose of this instruction.


            MT Mapping: 22A


            Specifies whether the amendment is to be made to issued counter,
            counter-counter or local undertaking.


            Code Name Definition:

            *`ICCA` - AmendmentToIssuedCounterCounterUndertaking - Request
            issuance of amendment to issued counter counter-undertaking and/or
            request to issue amendment to counter-undertaking and local
            undertaking.

            *`ISCA` - AmendmentToIssuedCounterUndertaking - Request issuance of
            amendment to issued counter-undertaking and/or request to issue
            amendment to local undertaking.

            *`ISUA` - AmendmentToIssuedUndertaking - Request issuance of
            amendment to issued undertaking.
          type: string
          enum:
            - ICCA
            - ISCA
            - ISUA
        amendment_impact:
          type: array
          description: >
            Proposed amendment(s) to the undertaking in a codified form.


            Amendment to to a trade finance undertaking in a codified form.


            Code Name Definition:

            *`CTHR` - CounterUndertakingOtherAmendments - Any other amendments
            made to the undertaking.

            *`CUAD` - CounterUndertakingAmountDecrease - Indication of the
            amount of decrease to the undertaking amount.

            *`CUAI` - CounterUndertakingAmountIncrease - Indication of the
            amount of increase to the undertaking amount.

            *`CUDX` - CounterUndertakingExpiryDate - Specifies the new date when
            the undertaking will cease to be available.

            *`CUNB` - CounterUndertakingNewBeneficiary - Requested new
            beneficiary of the undertaking.

            *`CUTC` - CounterUndertakingTermsAndCondition - Requested new terms
            and conditions of the undertaking.

            *`CUXC` - CounterUndertakingNewExpiryCondition - Specifies the
            amended documentary condition that indicates when the undertaking
            will cease to be available.

            *`LTHR` - LocalUndertakingOtherAmendments - Any other amendments
            made to the local undertaking.

            *`LUAD` - LocalUndertakingAmountDecrease - Indication of the amount
            of decrease to the local undertaking amount.

            *`LUAI` - LocalUndertakingAmountIncrease - Indication of the amount
            of increase to the local undertaking amount.

            *`LUDX` - LocalUndertakingExpiryDate - Specifies the new date when
            the local undertaking will cease to be available.

            *`LUNB` - LocalUndertakingNewBeneficiary - Requested new beneficiary
            of the local undertaking.

            *`LUTC` - LocalUndertakingTermsAndCondition - Requested new terms
            and conditions of the local undertaking.

            *`LUXC` - LocalUndertakingNewExpiryCondition - Specifies the amended
            documentary condition that indicates when the local undertaking will
            cease to be available.
          items:
            x-MXComponent: AmendmentImpact1Code
            type: string
            enum:
              - CTHR
              - CUAD
              - CUAI
              - CUDX
              - CUNB
              - CUTC
              - CUXC
              - LTHR
              - LUAD
              - LUAI
              - LUDX
              - LUNB
              - LUTC
              - LUXC
        undertaking_termination_request:
          x-MXComponent: YesNoIndicator
          description: |
            Specifies that the instrument is requested to be cancelled.

            MT Mapping: 23S

            Indicates a "Yes" or "No" type of answer for an element.
          type: boolean
        undertaking_increase_decrease_amount:
          description: >
            Indication of the amount of increase or decrease to the undertaking
            amount.

            Choice of amounts.


            MT Mapping: field 32B/33B in SeqC
          $ref: '#/components/schemas/Amount1Choice'
        new_undertaking_terms_and_conditions:
          type: array
          maxItems: 8
          description: >
            Specifies changes to the terms and conditions of the Undertaking
            (excluding information already expressed in other fields or other
            associated messages).


            MT Mapping: field 77U


            Specifies a character string with a maximum length of 9750
            characters.
          items:
            x-MXComponent: Max9750Text
            type: string
            minLength: 1
            maxLength: 9750
        counter_undertaking_increase_decrease_amount:
          description: |
            Amount of increase, and currency.

            MT Mapping: field 32B/33B in SeqB
          $ref: '#/components/schemas/Amount1Choice'
        new_counter_undertaking_terms_and_condition:
          x-MXComponent: Max9750Text
          description: >
            Specifies changes to the terms and conditions of the local
            Undertaking (excluding information already expressed in other fields
            or other associated messages).


            MT Mapping: field 77L in SeqC


            Specifies a character string with a maximum length of 9750
            characters.
          type: string
          minLength: 1
          maxLength: 9750
        delivery_channel_method:
          x-MXComponent: Max4Text
          description: Method by which the proposed amendment is to be made available.
          type: string
          minLength: 1
          maxLength: 4
        deliver_to_party_type:
          x-MXComponent: Max4Text
          description: "Type of party to whom the proposed amendment is intended to be delivered.\n\nType of party can be either \n- a code from the list published on ISO20022.org as part of external code sets\nOR\n- if code is different from the ISO code list (mentioned above), then a bilaterally agreed code may be used\n\n\"\nCode\"\t\"\nName\"\nADVP - AdvisingParty\nANYB - AnyBank\nAPPL - Applicant\nBENE - Beneficiary\nCONF - ConfirmationParty\nCUB2 - SecondCounterUndertakingBeneficiary\nCUB3 - ThirdCounterUndertakingBeneficiary\nISSU - Issuer\nOBLG - Obligor\nORDR - OrderingParty\nPRES - PresentingParty\nSADV - SecondAdvisingParty\nSPEC - SpecifiedAddress\n\n\nMT Mapping: field 24G\n\nSpecifies a character string with a maximum length of 4 characters.\n"
          type: string
          minLength: 1
          maxLength: 4
        deliver_to_name:
          x-MXComponent: RestrictedFINXMax140Text
          description: >
            Name of party to whom the proposed amendment is intended to be
            delivered.


            MT Mapping: field 24G


            Specifies a character string with a maximum length of 140 characters
            limited to character set X, that is, a-z A-Z / - ? : ( ) . , ‘ + .
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.\n\r,'\+ ]{1,140}$
        deliver_to_address:
          type: array
          maxItems: 3
          description: >
            Address of party to whom the original undertaking or proposed
            amendment is intended to be delivered.


            MT Mapping: field 24G


            Specifies a character string with a maximum length of 35 characters
            limited to character set X, that is, a-z A-Z / - ? : ( ) . , ‘ + .
          items:
            x-MXComponent: RestrictedFINXMax35Text
            type: string
            minLength: 1
            maxLength: 35
            pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]{1,35}$
        deliver_to_tracking_reference:
          x-MXComponent: Max35Text
          description: >
            Unique tracking reference used by the delivery method, for example
            courier tracking reference, FileAct reference, etc.


            Specifies a character string with a maximum length of 35 characters.
          type: string
          minLength: 1
          maxLength: 35
        additional_deliver_to_details:
          x-MXComponent: RestrictedFINMax35Text
          description: >
            Additional information related to 'Deliver to' information.


            Usage Guideline: This field can additionally be used to identify the
            format and channel when the format and channel code is 'OTHR'.
            Recommend to structure the information as follows (example):


            When Format is Other - //OTHR//JPEG 

            When Channel is Other - //OTHR//HOST

            When both Format and Channel is Other - //OTHR//JPEG//OTHR//HOST


            Specifies a character string with a maximum length of 35 characters.
            It has a pattern ([^/]+/)+([^/]+)|([^/]*) that disables the use of
            slash "/" at the beginning and end of line and double slash "//"
            within the line.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^([^/]+/)+([^/]+)|([^/]*)$
        reduction_release:
          description: |
            Not Applicable
        supporting_document:
          type: array
          description: |
            Not Applicable
        additional_information:
          x-MXComponent: Max210Text
          description: >
            Additional information related to the amendment or release/reduction
            of the undertaking.

            MT Mapping: field 72Z

            Specifies a character string with a maximum length of 210
            characters.
          type: string
          minLength: 1
          maxLength: 210
