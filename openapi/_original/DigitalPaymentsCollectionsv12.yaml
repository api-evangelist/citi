          description: The type of shipping method used.
          enum:
            - ELECTRONIC
            - GROUND
            - NOT_SHIPPED
            - OVERNIGHT
            - PICKUP
            - PRIORITY
            - SAME_DAY
          example: SAME_DAY
          type: string
          title: type
        email:
          pattern: '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$'
          type: string
          description: >-
            The contact person's email address.The parameter format restriction
            ensures that the email address is longer than 3 characters and
            adheres to a generous subset of valid RFC 2822 email addresses.
          example: xyjfg@gmail.com
          title: email
        origin:
          maxLength: 10
          minLength: 1
          type: string
          description: The post code or zip code of the address the order is shipped from.
          example: '120567'
          title: origin
        source:
          description: The type of shipping method used.
          enum:
            - ADDRESS_ON_FILE
            - NEW_ADDRESS
          example: NEW_ADDRESS
          type: string
          title: source
        address:
          $ref: '#/components/schemas/Shipping-Address'
    Risk:
      type: object
      title: Risk
      properties:
        custom:
          maxLength: 4000
          minLength: 1
          type: string
          description: >-
            Additional data passed to third-party risk assessment providers.This
            parameter is only relevant if you use a third-party risk assessment
            provider, and you have agreed with them the values to provide
          title: custom
        payment_recipient:
          $ref: '#/components/schemas/Payment-Recipient'
    Payment-Recipient:
      type: object
      title: payment recipient
      properties:
        account_identifier:
          maxLength: 50
          minLength: 1
          type: string
          description: >-
            The account identifier for the payment recipient's account.For
            payments into a card account provide the card number. For payments
            into other accounts (for example a bank account) provide the account
            number. The value provided will be returned masked in the response.
            Applicable for 'Initiate Browser payment' only, as an optional
            attribute.
          title: account_identifier
        birth_date:
          type: string
          format: date
          description: |-
            ISO 8601 (YYYY-MM-DD), Sender's birth_date  
             - For US RFP trasnaction, this parameter is optional
          title: birth_date
        last_name:
          description: 'Last name of the primary payment recipient. '
          example: PETER
          maxLength: 50
          minLength: 1
          type: string
          title: last_name
        postal_code:
          description: Postcode of the primary payment recipient.
          type: string
          minLength: 1
          maxLength: 10
          example: '33610'
          title: postal_code
    Sender:
      type: object
      title: sender
      properties:
        name:
          maxLength: 140
          minLength: 1
          type: string
          description: >-
            Sender Name 
             - For US RFP transaction, this parameter is optional 
            - For US ACH Direct Debit, sender.name parameter is optional with
            max length 35 

            - For Brazil PIX Initiation, this parameter is mandatory with max
            length 140
          title: name
        address:
          $ref: '#/components/schemas/Address'
        organization_id:
          description: >-
            Sender Organization Id/ Legal Entity as provided at the time of
            payment request.

            - For US RFP max length is 20
          example: ORG123456
          maxLength: 35
          minLength: 1
          type: string
          title: organization_id
        birth_date:
          type: string
          format: date
          description: |-
            ISO 8601 (YYYY-MM-DD), Sender's birth_date  
            - FOr US RFP transaction, this parameter is optional
          title: birth_date
        birth_city:
          maxLength: 35
          minLength: 1
          type: string
          description: |-
            Sender's birth_city 
            - For US RFP max length is 35
          title: birth_city
        birth_country:
          type: string
          description: |-
            Sender's birth_country 
            - For US RFP transaction, this parameter is optional
          pattern: ^[A-Z]{2,2}$
          title: birth_country
        private_id:
          maxLength: 35
          minLength: 1
          type: string
          description: >-
            Sender's private ID 
             - Applicable for US RFP 
            - For Brazil PIX Initiation, this parameter is mandatory, individual
            person tax identification (CPF) allowed length = 11 or business
            entity tax identification (CNPJ) allowed length = 14
          title: private_id
    Receiver:
      type: object
      title: receiver
      properties:
        name:
          maxLength: 140
          minLength: 1
          type: string
          description: >-
            Receiver Name 

            - For US RFP transaction, this parameter is optional 

            - For US ACH Direct Debit, receiver.name parameter is mandatory with
            max length 16
          title: name
        address:
          $ref: '#/components/schemas/Address'
        organization_id:
          description: >-
            Receiver Organization Id/ Legal Entity as provided at the time of
            payment request.

            - For US RFP max length is 20 

            - For US ACH Direct Debit, receiver.organization_ID parameter is
            mandatory with max length 10
          example: ORG123456
          maxLength: 35
          minLength: 1
          type: string
          title: organization_id
        birth_date:
          type: string
          format: date
          description: |-
            ISO 8601 (YYYY-MM-DD), Receiver's birth_date  
            - For US RFP transaction, this parameter is optional
          title: birth_date
        birth_city:
          maxLength: 35
          minLength: 1
          type: string
          description: |-
            Receiver's birth_city 
            - For US RFP max length is 35
          title: birth_city
        birth_country:
          type: string
          description: |-
            Receiver's birth_country 
            - For US RFP transaction, this parameter is optional
          pattern: ^[A-Z]{2,2}$
          title: birth_country
        private_id:
          maxLength: 35
          minLength: 1
          type: string
          description: |-
            Receiver's private ID 
            - For US RFP transaction, this parameter is optional
          title: private_id
    Additional-Info:
      title: >-
        Additional-Info /n- For Brazil and CARD transactions allowed maxmium of
        50 lines /n- For India CARD transactions allowed maxmium of 10 lines
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
          description: >-
            Specifies a character string with a maximum length of 50 characters.
            If transaction.Additional-Info.name is provided by merchant then
            transaction.Additional-Info.value is mandatory.
          example: request_to_payer
          title: name
        value:
          maxLength: 500
          minLength: 1
          type: string
          description: >-
            Specifies a character string with a maximum length of 200
            characters.  if transaction.Additional-Info.value is provided by
            merchant then transaction.Additional-Info.name is mandatory.
          example: this is for purchase order 4567
          title: value
    Customer-Device:
      title: Customer-Device
      description: Customer-Device.
      properties:
        ani:
          description: >-
            The telephone number captured by ANI (Automatic Number
            Identification) when the customer calls to place the order.
          example: M1234567890
          maxLength: 10
          minLength: 1
          type: string
          title: ani
        ani_call_type:
          description: >-
            The 2 digit ANI information identifier provided by the telephone
            company to indicate the call type, for example, cellular (61-63),
            toll free (24,25), etc.
          example: '63'
          maxLength: 2
