decline_code_count: 272
masked_to_buyers:
  note: Citi does not publish a masking policy for these codes. Several are explicitly narrative-suppressing by
    design — MS01 "Reason not specified", MS02 NotSpecifiedReasonCustomerGenerated, MS03 NotSpecifiedReasonAgentGenerated
    — and AM04 is returned for suspected fraud/risk-score declines, where the underlying reason is deliberately
    not disclosed. Treat MS01/MS02/MS03 and AM04 as intentionally opaque rather than as missing data.
local_code_sets:
- scheme: Australia (NPP / direct entry)
  note: A separate AU reason table is published in the Online Payment Acceptance error reference.
- scheme: TCH RTP (US real-time payments)
  note: TCH code table published, covering participant suspension, switch malfunction and proxy identification.
- scheme: India IMPS / NPCI
  note: Codes such as AM13 (amount less than INR 1 not allowed under IMPS) and AM15 (beneficiary bank limit with
    Clearing / NPCI exceeded).
- scheme: Brazil PIX (BACEN)
  note: Field-level validation table published separately for cob, cobv, rec and solicRec resources.
note: '7 codes appear in the published tables under a "Local Code" placeholder rather than a description and are
  recorded above without a meaning: XD22, XT04, XT06, XT75, XT79, XT80, XT83.'
