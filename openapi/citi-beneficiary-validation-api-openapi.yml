openapi: 3.2.0
info:
  title: Instant Payments Beneficiary Validation API
  description: 'Use the Citi Payments Express API to initiate these types of transaction and check their status:

    * Instant Payments

    * Payment Messages

    * Refunds

    * Beneficiary Validation


    **Note:** The Citi Payments Express API is for direct payments and refunds. To send payments or refunds to a third-party account or via a proxy, use the CitiConnect Payments API'
  contact:
    name: Standards & Developer Hub
    url: https://tts.sandbox.developer.citi.com/citiconnect/
    email: developer-support@citi.com
  version: 1.0.0
servers:
- url: https://b2b.api.icg.citi.com/citiconnect/prod
  description: production gateway url
- url: https://sandbox.b2b.api.icg.citi.com/citiconnect/sb
  description: 'sbox url '
tags:
- name: Beneficiary Validation
  description: Before initiating payment, POST beneficiary validation details to confirm that you are sending to the correct beneficiary.
paths:
  /paymentservices/v1/beneficiaryvalidations:
    post:
      tags:
      - Beneficiary Validation
      summary: Validating the beneficiary account details
      operationId: expressBeneficiaryValidation
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: Your unique identification, same as the identification you use for OAuth token generation, Citi shared with you during your CitiConnect API onboarding
        example: 6d3cf821-db6d-496d-bec0-064a362e9c31
      - name: Idempotency-Id
        in: header
        required: true
        schema:
          type: string
          maxLength: 128
        example: a44cbb606de4edb9a7a123414bba3bb
        description: "Your unique identification for a POST request \n - Maximum length is 128. \n-  CitiConnect API responds with an error (HTTP status 4XX) if your POST request idempotency identification value is a duplicate across a recent history of idempotency identifications in Citi's database. \n- If you don't receive any response (HTTP status 2XX, 4XX or 5XX) from Citi to your POST request and you wish to retry, reinitiate your request with the same idempotency identification to prevent accidental duplicate payment."
      requestBody:
        required: true
        description: This API allows the client to validate beneficiary details with the use of combination of fields
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Beneficiary-Validation-Request'
            examples:
              IN IMPS Beneficiary Validation Non Penny:
                $ref: '#/components/examples/In-Beneficiary-Validation-Request-Non-Penny'
              IN IMPS Beneficiary Validation Penny:
                $ref: '#/components/examples/In-Beneficiary-Validation-Request-Penny'
              UPI IN Beneficiary Validation:
                $ref: '#/components/examples/Upi-In-Beneficiary-Validation-Request'
              UPI IN Mobile Number Beneficiary Validation:
                $ref: '#/components/examples/Upi-In-Mobile-Number-Beneficiary-Validation-Request'
              UPI IN UPI ID Beneficiary Validation:
                $ref: '#/components/examples/Upi-In-UPI-ID-Beneficiary-Validation-Request'
              US EWS Beneficiary Validation:
                $ref: '#/components/examples/US-EWS-Beneficiary-Validation-Request'
              UK Beneficiary Validation:
                $ref: '#/components/examples/UK-Beneficiary-Validation-Request'
              IN PAN Validation:
                $ref: '#/components/examples/IN-PAN-Validation-Request'
              Pay2China Merchant Validation:
                $ref: '#/components/examples/Pay2China-Beneficiary-Validation-Request'
          application/xml:
            schema:
              $ref: '#/components/schemas/Beneficiary-Validation-Request'
            examples:
              Pay2China Merchant Validation:
                $ref: '#/components/examples/Pay2China-Beneficiary-Validation-Request'
      security:
      - oAuth2:
        - selfservices
      responses:
        '202':
          description: Accepted
          headers:
            request_id:
              schema:
                type: string
              description: Citi's unique identification for your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Initial-Beneficiary-Validation-Response'
              examples:
                IN IMPS Initial Beneficiary Validation Response Non Penny:
                  $ref: '#/components/examples/In-Initial-Beneficiary-Validation-Response-Non-Penny'
                IN IMPS Initial Beneficiary Validation Response Penny:
                  $ref: '#/components/examples/In-Initial-Beneficiary-Validation-Response-Penny'
                UPI IN Initial Beneficiary Validation Response:
                  $ref: '#/components/examples/Upi-In-Initial-Beneficiary-Validation-Response'
                UPI IN Mobile Number Initial Beneficiary Validation Response:
                  $ref: '#/components/examples/Upi-In-Mobile-Number-Initial-Beneficiary-Validation-Response'
                UPI IN UPI ID Initial Beneficiary Validation Response:
                  $ref: '#/components/examples/Upi-In-UPI-ID-Initial-Beneficiary-Validation-Response'
                US EWS Initial Beneficiary Validation Response:
                  $ref: '#/components/examples/US-EWS-Initial-Beneficiary-Validation-Response'
                UK Initial Beneficiary Validation Response:
                  $ref: '#/components/examples/UK-Initial-Beneficiary-Validation-Response'
                IN PAN Initial Validation Response:
                  $ref: '#/components/examples/IN-PAN-Initial-Validation-Response'
                Pay2China Initial Validation Response:
                  $ref: '#/components/examples/Pay2China-Initial-Beneficiary-Validation-Response'
            application/xml:
              schema:
                $ref: '#/components/schemas/Initial-Beneficiary-Validation-Response'
              examples:
                Pay2China Initial Validation Response:
                  $ref: '#/components/examples/Pay2China-Initial-Beneficiary-Validation-Response'
        '400':
          $ref: '#/components/responses/Bad-Request-Pay2China'
        '401':
          $ref: '#/components/responses/Unauthorized-Pay2China'
        '404':
          $ref: '#/components/responses/Not-Found-Pay2China'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed-Pay2China'
        '409':
          $ref: '#/components/responses/Conflict-Pay2China'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type-Pay2China'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-Pay2China'
        default:
          $ref: '#/components/responses/Internal-Server-Error-Pay2China'
  /paymentservices/v1/beneficiaryvalidations/{uetr}:
    get:
      tags:
      - Beneficiary Validation
      summary: Inquire for the latest status of a beneficiary validation using UETR
      description: The API service responds with the latest beneficiary validation status of the unique end-to-end transaction reference (UETR) you inquire with.
      operationId: findBeneficiaryValidation
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: Your unique identification, same as the identification you use for OAuth token generation, Citi shared with you during your CitiConnect API onboarding
        example: 6d3cf821-db6d-496d-bec0-064a362e9c31
      - name: end_to_end_id
        in: query
        schema:
          type: string
        description: Client provided reference number
      - name: uetr
        in: path
        description: Unique end-to-end transaction reference
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
        examples:
          payment_transaction_details_1:
            value: 0c4fb98b-d77a-4468-96bb-0c88b3b8f75a
      security:
      - oAuth2:
        - selfservices
      responses:
        '200':
          description: OK
          headers:
            request_id:
              schema:
                type: string
              description: Citi's unique identification for your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Final-Beneficiary-Validation-Response'
              examples:
                IN IMPS Final Beneficiary Validation Response Non Penny:
                  $ref: '#/components/examples/In-Final-Beneficiary-Validation-Response-Non-Penny'
                IN IMPS Final Beneficiary Validation Response Penny:
                  $ref: '#/components/examples/In-Final-Beneficiary-Validation-Response-Penny'
                UPI IN Final Beneficiary Validation Response:
                  $ref: '#/components/examples/Upi-In-Final-Beneficiary-Validation-Response'
                UPI IN Mobile Number Final Beneficiary Validation Response:
                  $ref: '#/components/examples/Upi-In-Final-Mobile-Number-Beneficiary-Validation-Response'
                UPI IN Mobile Number Final Beneficiary Validation Penny Testing Response:
                  $ref: '#/components/examples/Upi-In-Final-Mobile-Number-Beneficiary-Validation-Penny-Testing-Response'
                UPI IN UPI ID Final Beneficiary Validation Response:
                  $ref: '#/components/examples/Upi-In-Final-UPI-ID-Beneficiary-Validation-Response'
                US EWS Final Beneficiary Validation Response:
                  $ref: '#/components/examples/US-EWS-Final-Beneficiary-Validation-Response'
                UK Final Beneficiary Validation Response:
                  $ref: '#/components/examples/UK-Final-Beneficiary-Validation-Response'
                IN PAN Final Validation Response:
                  $ref: '#/components/examples/IN-PAN-Final-Validation-Response'
                Pay2China Final Validation Positive Response:
                  $ref: '#/components/examples/Pay2China-Final-Beneficiary-Validation-Positive-Response'
                Pay2China Final Validation Negative Response:
                  $ref: '#/components/examples/Pay2China-Final-Beneficiary-Validation-Negative-Response'
            application/xml:
              schema:
                $ref: '#/components/schemas/Final-Beneficiary-Validation-Response'
              examples:
                Pay2China Final Validation Positive Response:
                  $ref: '#/components/examples/Pay2China-Final-Beneficiary-Validation-Positive-Response'
                Pay2China Final Validation Negative Response:
                  $ref: '#/components/examples/Pay2China-Final-Beneficiary-Validation-Negative-Response'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        default:
          $ref: '#/components/responses/Internal-Server-Error'
  /payment/beneficiarysearch:
    get:
      parameters:
      - description: Unique reference which was shared during CitiConnect API on-boarding(client_id which used during oauth token generation)
        in: query
        name: client_id
        required: true
        schema:
          type: string
      - description: Country where the request is initiated for beneficiary account search/validation in ISO 3166-1 alpha-2 format
        in: query
        name: country_code
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - description: Account name of the creditor intended for search/validation whose payment amount will be credited. For early warning system (EWS), if the verification_type = (BANKOWN or BASICVR) either creditor_firstname & creditor_lastname or creditor_name (Business Name) should be passed. Business name maximum allowed length 87 characters.
        in: query
        name: creditor_name
        schema:
          type: string
          maxLength: 140
          minLength: 3
      - description: Creditor account bank identification code of the creditor whose payment amount will be credited. - For early warning system (EWS), 9 digit beneficiary bank routing number.
        in: query
        name: creditor_bank_code
        schema:
          type: string
          maxLength: 11
          minLength: 1
      - description: 'Creditor Branch identification of the creditor whose payment amount will be credited. ##### Field exclusively applicable for below conditions - country_code = AR (Argentina), BR (Brazil), UY (Uruguay), PE (Peru), MX (Mexico), CO (Colombia)'
        in: query
        name: creditor_branch_id
        schema:
          type: string
          maxLength: 3
      - description: 'Account alias name of the creditor intended for search/validation whose payment amount will be credited. ##### Field exclusively applicable for below conditions - country_code = AR (Argentina), BR (Brazil), UY (Uruguay), PE (Peru), MX (Mexico), CO (Colombia)'
        in: query
        name: creditor_alias
        schema:
          type: string
          maxLength: 140
          minLength: 3
      - description: Account name of the debtor whose payment amount will be deducted.
        in: query
        name: debtor_name
        schema:
          type: string
          maxLength: 140
          minLength: 3
      - description: 'Requested execution date post alias resolution when the payment needs to be processed for settlement, format would be YYYYMMDD ##### Field exclusively applicable for below countries - country_code = BR (Brazil) _Note_ * _If not provided present date will be populated when alias api is invoked_ * _Only Present and Future date will be acceptable and not past date_'
        in: query
        name: value_date
        schema:
          type: string
          maxLength: 8
      - description: "Account & Proxy details intended for search/validation of Beneficiary details\n  _Condition : It should be encrypted JSON combination of **creditor_account** or **creditor_proxy_type & creditor_proxy_value** should be passed along with **debtor_account**_\n  - **debtor_account** \n     - account number of the debtor whose payment amount will be deducted\n     - max length is 35\n     - mandatory\n  - **creditor_account**\n     - account number of the creditor whose payment amount will be credited & which requires validation\n     - max length is 35\n     - conditional\n\n  - **creditor_proxy_type**\n     - type of the proxy value to be used for validation/search\n     - max length is 35\n     - conditional \n        - *Supported Types*\n\n          * PHONE\n            - Used as an identifier for providing Mobile/Phone Number in **creditor_proxy_value**\n          * EMAIL\n            - Used as an identifier for providing Email ID in **creditor_proxy_value**\n          * TAXID\n            - Used as an identifier for providing Tax Identification No in **creditor_proxy_value**\n            - *Applicable only for country_code = BR (Brazil)*\n          * EVP\n            - Used as an identifier for providing EVP in **creditor_proxy_value**\n            - *Applicable only for country_code = BR (Brazil)*\n          * NIDN\n            - Used as an identifier for providing NRIC Number in **creditor_proxy_value**\n          * COID\n            - Used as an identifier for providing Unique Entity Number in **creditor_proxy_value**\n          * MOBN\n            - Used as an identifier for providing Mobile number       \n  - **creditor_proxy_value**\n     - value of proxy type to be used for validation/search\n     - max length is 70\n     - conditional\n   - **document_type**\n     - Originating Customer's Document Type. The values are:\n 1:LE \n2:DNI \n3:LM \n4:Pasaporte \n5:Carné de Extranjería \n6:RUC.           \n - **document_number**\n     - Originating Customer Document Number.In case the  Originating Client's account is joint, the document number must be 99999999\n     - max length is 12 \n - **creditor_document_number**\n     - Creditor document number of credit account (both creditor document number and creditor tax id are same). It is mandatory for Brazil and Colombia and not  applicable for other countries.\n     - It is a Request header with string data type.\n     - max length is 14\n      - example: \"11111111111111\" \n  - **creditor_account_type**\n     - Creditor Account Type of Credit Account. It is mandatory for Brazil and Colombia and not applicable for other countries.\n      - BR  - The account type must be populated with following list of dominion:SAVINGS, CHECKING, PAYMENTS,  EASY, PUBLIC_ENTITY. However validation is not required at CCAPI, whatever received by CCAPI will be   routed to downstream and downstream will do the validation\n      - CO - The account type must  be populated with following list of dominion:CUENTA_DE_AHORRO and CUENTA_CORRIENTE. However validation  is not required at CCAPI, whatever received by CCAPI will be routed to downstream and downstream will do the validation \n       - It is a Request header with string data type.\n        - maxLength: 15\n \n - **creditor_document_type**\n      - Creditor Document Type of Credit Account.It is Optional for  Brazil and Mandatory for Colombia and not applicable for other countries.\n       - CO - The  account type must be populated with following list of dominion:CC, CD, CE, NIT, TI, PAS, IEPN, IEPJ, FD, RC It is a Request header with string data type.\n       - maxLength: 5\n       - example: \"11111\"\n \n - **extra_information** \n     - Creditor Document Type of Credit Account. This field is  optional for Colombia and it is not applicable for other countries.\n     - It is a Request header  with string data type.\n     - maxLength: 30\n       - example: \"qwertyuiopasdfgjklzxcvbnm1234\" \n  * JSON combination :  \n\n     * With Creditor Account  \n\n       {\"debtor_account\":\"123123\",\"creditor_account\":\"234324234\"}.  \n\n     * with Proxy detials  \n\n       {\"debtor_account\":\"123123\",\"creditor_proxy_type\":\"EMAIL\",\"creditor_proxy_value\":\"John@citi.com\"}  \n       \n  *Note - Usage of both **creditor_account** + **creditor_proxy_type & creditor_proxy_value** will result in error response* \n  \n  **Example for encrypted-params:**\n   eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMTI4Q0JDLUhTMjU2In0.cM5nUBLy-Nt4bmoS3YyKpMKVgc1zG2bhX1SLFLPmfOtmuv4vMYDPrFJSStlBK6KQqnNpeia6Er-Mvtoiy6d-x_cE_wZnkZdY-s7-mPKTWdB-1mQ9ev7sripvDcrvdV46aA8yIdat7j3C1guyIrQ3pixJLAWuWwYh-Mu9oQ5Y4fbt8hSyWUcrv50BVVHDTNhl1JfC9aMedo9RSZP4uVQrkuc64cSDs65F5CPrALSINWc1kWvtBdE00rFs8VPboFlOjzh8SWKUwhEWRGziRcBo0s0Rvjr1aS6xlXFK2xduWa2Yhww_i8x4LZPl4wuG0lYUxNfYfW-i1zPgbffpxEEoTg.56JMOGxrFjQNqUnaTrDnWw._UYD1vvZk6zcPpVX0WbxpVSCv_kbZjMbMfY9zbrAeQkEwd5-6l2LJ2X0rOnQrt6bvfMdxuT8_v5A4rpOX2BlOtKOOxkt1rxO1422HJcimejh2QCG9SK65_Gq202ZHUpertZsxP1So4NXD4E5yHPCMHkhgQCxEiZYAOweVmmAGR28J7P2faMUY0_y_PEOK6L8R-MuI7MJvO95vhdQcXsn1YirgkvWYWiO9AJX9UY-ES-VnBXu5ZtH3VtEcvYsydVFjssP83vObZehaRoz-vObYFRkm8oHEXmcEGNchXgUQ-w5UtpIk4EKX-rqOG-TYPPfJTU-z-QH5s0Z9fVVUKcYpyys6-5LSgpR_LMYxkTg3nTbTvN4RoDVglgzi_pLz2fHBC8tQXLk2FpXB8l9dQPOFdfaxVyS7eq14kmEPHdkh0lRxhCKS1hFgMxIo1YRGrJoeRfrb0E7im1lviZcXm_T0ZLZTFtmLOxaRhB69ggTH38OZLHP_NFFJHSwcP3EIwQ7LS_2PC1yOBj8ctCWbd4Ig2ZjT2K7KECHaam8ugAPo1PbGrt0okk1P5fFfCwd4YPr92tnyVugI-ngSL2VpIUz3w.Sa9VUUM13fNAFvovk7L-Hg\n"
        in: header
        name: encrypted-params
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "**Complete Creditor account details will be part of response**\n\n**1. Generic Response:**\n```json\n{\n  \"debtor\": {\n    \"name\": \"XXXYXXX\",\n    \"account_id\": \"0054400063\"\n  },\n  \"creditor\": {\n    \"name\": \"ABCDEEFGH\",\n    \"alias\": \"ABCDEEFGH\",\n    \"resolved_name\": \"ABCDEEFGH\",\n    \"owner_type\": \"LEGAL_PERSON\",\n    \"tax_id\": \"12345678\",\n    \"country_code\": \"BR\",\n    \"bank_code\": \"ABCD123456\",\n    \"branch_id\": \"076\",\n    \"account_id\": \"1234567890\",\n    \"proxy_type\": \"PHONE\",\n    \"proxy_value\": \"5555141910097\",\n    \"account_currency\": \"USD,UYU\",\n    \"account_type\": \"SAVINGS\",\n    \"account_opening_date\": \"20221203\",\n    \"trade_name\": \"XYZ\",\n    \"document_type\": \"RUC\",\n    \"document_number\": \"91991923\"\n  },\n  \"additional_information\": {\n    \"end_to_end_id\": \"XYXYX001\",\n    \"value_date\": \"20220102\",\n    \"proxy_status\": \"ACTIVE\",\n    \"banelco_flag\": \"Y\",\n    \"clearing_system_id\": \"3233423\"\n  },\n  \"lookup_status_information\": {\n    \"lookup_reference\": \"ModifyAlias29122\",\n    \"lookup_response_status\": \"Success\",\n    \"status_code\": \"200\",\n    \"status_message\": \"Success\"\n  }\n} \n```\n\n**2. Argentina Response (country_code = AR):**\n ```json\n{\n  \"creditor\": {\n    \"alias\": \"ABCDEEFGH\",\n    \"resolved_name\": \"ABCDEEFGH\",\n    \"tax_id\": \"12345678\",\n    \"branch_id\": \"076\",\n    \"account_id\": \"1234567890\",\n    \"account_type\": \"SAVINGS\"\n  },\n  \"additional_information\": {\n    \"banelco_flag\": \"Y\",\n    \"clearing_system_id\": \"3233423\"\n  },\n  \"lookup_status_information\": {\n    \"lookup_response_status\": \"Success\",\n    \"status_code\": \"200\",\n    \"status_message\": \"Success\"\n  }\n}\n```\n**3. US Response (country_code = US):**\n```json\n{\n  \"creditor\": {\n    \"resolved_name\": \"ABCDEEFGH\",\n    \"proxy_value\": \"5555141910097\"\n  },\n  \"additional_information\": {\n    \"proxy_status\": \"ACTIVE\"\n  },\n  \"lookup_status_information\": {\n    \"status_code\": \"200\",\n    \"status_message\": \"Success\"\n  }\n}\n```\n**4. Korea Response (country_code = KR):**\n```json\n{\n  \"creditor\": {\n    \"resolved_name\": \"ABCDEEFGH\"\n  },\n  \"lookup_status_information\": {\n    \"lookup_reference\": \"ModifyAlias29122\",\n    \"lookup_response_status\": \"Success\",\n    \"status_code\": \"200\",\n    \"status_message\": \"Success\"\n  }\n}\n```\n**5. India Response (country_code = IN):**\n```json\n{\n  \"creditor\": {\n    \"name\": \"ABCDEEFGH\",\n    \"resolved_name\": \"ABCDEEFGH\",\n    \"account_id\": \"1234567890\"\n  },\n  \"lookup_status_information\": {\n    \"lookup_reference\": \"ModifyAlias29122\",\n    \"lookup_response_status\": \"Success\",\n    \"status_code\": \"200\",\n    \"status_message\": \"Success\"\n  }\n}\n```\n **6. Indonesia Response (country_code = ID):**\n```json\n{\n  \"creditor\": {\n    \"name\": \"ABCDEEFGH\",\n    \"resolved_name\": \"ABCDEEFGH\",\n    \"account_id\": \"1234567890\"\n  },\n  \"lookup_status_information\": {\n    \"lookup_reference\": \"ModifyAlias29122\",\n    \"lookup_response_status\": \"Success\",\n    \"status_code\": \"200\",\n    \"status_message\": \"Success\"\n  }\n}\n```\n **7. Singapore Response (country_code = SG):**\n```json\n{\n  \"creditor\": {\n    \"resolved_name\": \"ABCDEEFGH\",\n    \"proxy_value\": \"5555141910097\"\n  },\n  \"additional_information\": {\n    \"proxy_status\": \"ACTIVE\"\n  },\n  \"lookup_status_information\": {\n    \"status_code\": \"200\",\n    \"status_message\": \"Success\"\n  }\n}\n```\n **8. Brazil Alias Resolution (country_code = BR):**\n```json\n{\n  \"creditor\": {\n    \"resolved_name\": \"ABCDEEFGH\",\n    \"owner_type\": \"LEGAL_PERSON\",\n    \"tax_id\": \"12345678\",\n    \"bank_code\": \"ABCD123456\",\n    \"branch_id\": \"076\",\n    \"account_id\": \"1234567890\",\n    \"proxy_type\": \"PHONE\",\n    \"proxy_value\": \"5555141910097\",\n    \"account_type\": \"SAVINGS\",\n    \"account_opening_date\": \"20221203\",\n    \"trade_name\": \"XYZ\"\n  },\n  \"additional_information\": {\n    \"end_to_end_id\": \"XYXYX001\",\n    \"value_date\": \"20220102\",\n    \"proxy_status\": \"ACTIVE\"\n  }\n}\n```\n**9. LATAM Countries| Beneficiary Search (country_code = [ MX or PA or PE or UY or BR or CO ] ):**\n```json\n{\n  \"debtor\": {\n    \"account_id\": \"0054400063\"\n  },\n  \"creditor\": {\n    \"resolved_name\": \"ABCDEEFGH\",\n    \"country_code\": \"MX\",\n    \"bank_code\": \"ABCD123456\",\n    \"account_id\": \"1234567890\",\n    \"account_currency\": \"USD,UYU\",\n    \"account_type\": \"SAVINGS\",\n    \"document_type\": \"RUC\",\n    \"document_number\": \"91991923\"\n  },\n  \"lookup_status_information\": {\n    \"lookup_response_status\": \"Success\",\n    \"status_code\": \"200\",\n    \"status_message\": \"Success\"\n  }\n}\n```\n**10. US_EWS Response (country_code = US_EWS):**\n```json\n{\n  \"creditor\": {\n    \"account_verification_status\": \"Passed\",\n    \"account_verification_description\": \"Account sucessfully verfied in EWS\",\n    \"account_type\": \"Saving\",\n    \"account_owner_status\": \"Passed\",\n    \"account_owner_description\": \"Account owner sucessfully verfied in EWS\",\n    \"owner_type\": \"OWN\",\n    \"firstname\": \"FMATCH\",\n    \"lastname\": \"PMATCH\",\n    \"dob\": \"NAVAIL\",\n    \"address_line1\": \"PMATCH\",\n    \"address_line2\": \"PMATCH\",\n    \"city\": \"FMATCH\",\n    \"state\": \"FMATCH\",\n    \"zip\": \"FMATCH\",\n    \"home_phone\": \"FMATCH\",\n    \"work_phone\": \"FMATCH\",\n    \"tax_id\": \"PMATCH\",\n    \"id_type\": \"FMATCH\",\n    \"id_no\": \"FMATCH\",\n    \"id_issuance_place\": \"NMATCH\",\n    \"additional_information\": \"TESTING EWS RESPONSE\",\n    \"creditor_name\": \"FMATCH\"\n  }\n}\n```\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryValidationResponse'
              example:
                debtor:
                  name: XXXYXXX
                  account_id: '0054400063'
                creditor:
                  name: ABCDEEFGH
                  alias: ABCDEEFGH
                  resolved_name: ABCDEEFGH
                  owner_type: LEGAL_PERSON
                  tax_id: '12345678'
                  country_code: BR
                  bank_code: ABCD123456
                  branch_id: '076'
                  account_id: '1234567890'
                  proxy_type: PHONE
                  proxy_value: '5555141910097'
                  account_currency: USD,UYU
