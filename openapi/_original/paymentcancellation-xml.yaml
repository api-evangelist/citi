      period.<br><br><b>MM04</b> : Tax is related to the fourth month of the
      period.<br><br><b>MM05</b> : Tax is related to the fifth month of the
      period.<br><br><b>MM06</b> : Tax is related to the sixth month of the
      period.<br><br><b>MM07</b> : Tax is related to the seventh month of the
      period.<br><br><b>MM08</b> : Tax is related to the eighth month of the
      period.<br><br><b>MM09</b> : Tax is related to the ninth month of the
      period.<br><br><b>MM10</b> : Tax is related to the tenth month of the
      period.<br><br><b>MM11</b> : Tax is related to the eleventh month of the
      period.<br><br><b>MM12</b> : Tax is related to the twelfth month of the
      period.<br><br><b>QTR1</b> : Tax is related to the first quarter of the
      period.<br><br><b>QTR2</b> : Tax is related to the second quarter of the
      period.<br><br><b>QTR3</b> : Tax is related to the third quarter of the
      period.<br><br><b>QTR4</b> : Tax is related to the fourth quarter of the
      period.<br><br><b>HLF1</b> : Tax is related to the first half of the
      period.<br><br><b>HLF2</b> : Tax is related to the second half of the
