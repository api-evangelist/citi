  schemas:
    Method-Update:
      type: object
      title: Method Update
      properties:
        type:
          description: "Method specified by the customer for the transaction \n- Provide PIX for brazil QR creation & RFP \n- For CARD Update Authorization operation method.type parameter is mandatory \n- For CARD Void/Cancel operation method.type parameter is mandatory \n- Provide GOOGLEPAY for GOOGLE PAY transactions \n- For ACH Void/Cancel transaction, method.type parameter is mandatory \n- For PAYPAL transaction, method.type parameter is mandatory"
          type: string
          enum:
          - PIX
          - CARD
          - GOOGLEPAY
          - APPLEPAY
