    Authentication:
      type: object
      title: Authentication initiation request
      properties:
        acs_eci:
          description: Electronic Commerce Indicator (ECI) value provided by the issuer's ACS.
          example: '56'
          maxLength: 2
          minLength: 1
          type: string
          title: acs_eci
        token:
          description: The base64 encoded value generated by the issuer (CAVV/AAV/AEVV/Authentication Value).
          example: '56'
          maxLength: 32
          minLength: 28
          type: string
          title: token
        3ds_transaction_id:
          description: A unique identifier for the 3-D Secure authentication transaction (XID for v1, DS ID for v2).
          example: '56'
          maxLength: 50
          minLength: 1
          type: string
          title: 3ds_transaction_id
        acs_reference:
          description: A unique transaction
          example: '56'
          maxLength: 32
          minLength: 1
          type: string
          title: acs_reference
        acs_transaction_id:
          description: A unique transaction identifier assigned by the Access Control Server (ACS).
          example: '56'
          maxLength: 36
          minLength: 36
          type: string
          title: acs_transaction_id
        scheme:
          description: The EMV 3DS authentication scheme used (e.g., MADA, MASTERCARD, VISA).
          example: '56'
          maxLength: 50
          minLength: 2
          type: string
          title: scheme
        custom:
          description: Additional information returned by the scheme or issuer in the authentication response.
          example: '56'
          maxLength: 4000
          minLength: 1
          type: string
          title: custom
        directory_server_reference:
          description: Reference number assigned to the Directory Server (DS) by EMV Co.
          example: '56'
          maxLength: 32
          minLength: 1
          type: string
          title: directory_server_reference
        protocol_version:
          description: The version of the EMV 3-D Secure protocol used (e.g., 2.1.0).
          example: CART123456
          maxLength: 20
          minLength: 1
          type: string
          title: protocol_version
        status_reason_code:
          description: A code indicating the reason for the transaction status (EMVCo specification).
          example: '56'
          maxLength: 2
          minLength: 2
          type: string
        status:
          description: Indicates the result of payer authentication with the issuer (e.g., Y, N, U, A, R).
          example: Y
          maxLength: 1
          minLength: 1
          type: string
          title: status
        payment_exemption:
          description: Indicates why this payment qualifies for an SCA exemption.
          enum:
          - AUTO
          - LOW_RISK
          - LOW_VALUE_PAYMENT
          - TRUSTED_MERCHANT
          - MERCHANT_INITIATED_TRANSACTION
          - RECURRING_PAYMENT
          - SECURE_CORPORATE_PAYMENT
          - TRUSTED_MERCHANT
          example: TRUSTED_MERCHANT
          type: string
          title: payment_exemption
        time:
          type: string
          format: date-time
          description: Date and time of the payer authentication being performed (YYYY-MM-DDThh:mm:ss.SSSZ).
          example: '2022-09-13T08:23:49.114Z'
          title: time
        transaction_id:
          description: Identifier used by the acquirer to identify the transaction. This identifier may be used by the acquirer in settlement reports.
          example: ACQ7894561
          maxLength: 40
          minLength: 1
          type: string
          title: transaction_id
        amount:
          description: "Product amount \n - For UK PAYBYBANK creation, product_info.amount parameter is mandatory, if product_info object is selected"
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
