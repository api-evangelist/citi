openapi: 3.2.0
info:
  title: Citi Authenticationservices API
  x-refined-note:
  - x-ibm-name differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Authenticationservices across 4 of this provider''s published API definitions: authentication_api_1.yaml, authentication_api_2.yaml, authentication_api_3.yaml, authentication_api_4.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb
  description: 'CTE/Sandbox url '
- url: https://tts.apib2b.citi.com/citiconnect/prod
  description: Production gateway url
tags:
- name: Authenticationservices
paths:
  /authenticationservices/v1/oauth/token:
    post:
      summary: Request v1 Access Token
      description: The OAuth v1 token request authenticates your API message sent in the XML format and responds with an access token.
      operationId: oAuthV1UsingPOST
      parameters:
      - name: Content-Type
        in: header
        description: Supports only \"application/xml\".
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: "The authorization will include \"Basic\" followed by a single space, followed by the Base64 encoded value of the APIm `client_id` & `secret key`. \n\nIn the above example, the `client_id` is *1234a5b6-cde7-8f90-12gh-345ij6789012* & secret key is *abcdefghijklmnop*.  \n\nThe Base64 value after appending by adding “:” in between will be “MTIzNGE1YjYtY2RlNy04ZjkwLTEyZ2gtMzQ1aWo2Nzg5MDEyOmFiY2RlZmdoaWprbG1ub3A=”. \n"
        required: true
        example: Basic MTIzNGE1YjYtY2RlNy04ZjkwLTEyZ2gtMzQ1aWo2Nzg5MDEyOmFiY2RlZmdoaWprbG1ub3A=
        schema:
          type: string
      requestBody:
        description: The following is the request body to retrieve an OAuth token using the V1 endpoint.
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/oAuthToken'
            example: <?xml version="1.0" encoding="UTF-8"?><oAuthToken xmlns="http://com.citi.citiconnect/services/types/oauthtoken/v1"><grantType>client_credentials</grantType><scope>/authenticationservices/v1</scope></oAuthToken>
        required: true
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/token'
              example: <?xml version="1.0" encoding="UTF-8"?><token><token_type>Bearer</token_type><access_token></access_token><expires_in>1800</expires_in><scope>/authenticationservices/v1</scope></token>
        '201':
          description: Created
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      security:
      - Basic Authentication: []
      x-codegen-request-body-name: body
      tags:
      - Authenticationservices
    servers:
    - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb
      description: 'CTE/Sandbox url '
    - url: https://tts.apib2b.citi.com/citiconnect/prod
      description: Production gateway url
