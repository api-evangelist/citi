components:
  schemas:
    PaymentInquiryRequest:
      required:
      - EndToEndId
      - WLClientID
      type: object
      properties:
        EndToEndId:
          maxLength: 35
          pattern: '[a-zA-Z0-9&#95;]*'
          type: string
          description: Unique identification assigned by the initiating party to clearly identify the transaction. This Identification is passed on, unchanged, throughout the entire end-to-end chain.
          example: API_2WAY_WIRE_01
        WLClientID:
          maxLength: 35
          pattern: '[a-zA-Z0-9]*'
          type: string
          description: Client ID to uniquely identify the transaction along with transaction reference number.
          example: '000000001'
        WLRef:
          maxLength: 12
          pattern: '[a-zA-Z0-9]*'
          type: string
          description: WorldLink generated unique reference number received in WorldLink Payment Initiation response
          example: KH80FI20GBY4
        CreDtTm:
          type: string
          description: Date when the payment initiation started. The date format is YYYY-MM-DD.
          format: date
          example: '2020-09-12'
        ReqdExctnDt:
          type: string
          description: The date that the initiating party requests that the clearing agent process the payment.
          format: date
          example: '2017-09-05'
        InstdAmt:
          type: object
          description: This represents the amount of money transferred between the debtor and the creditor before any deduction of charges is made. This is expressed in the currency that is specified by the initiating party.
          allOf:
          - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmountStatusInquiry'
        EqvtAmt:
          required:
          - Amt
          - CcyOfTrf
          type: object
          properties:
            Amt:
              type: object
              description: Amount of money
              allOf:
              - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmountStatusInquiry'
            CcyOfTrf:
              type: object
              description: Specifies the currency of the to be transferred amount, which is different from the currency of the debtor's account.
              allOf:
              - $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
          description: Partner can send either Payment Amount or Equivalent Amount and not both
      description: Payment Status Inquiries Inputs
    StatusReason6Choice:
      type: object
      properties:
        Cd:
          maxLength: 4
          minLength: 1
          type: string
          description: Reason for the status, as published in an external reason code list.
        Prtry:
          type: object
          description: Reason for the status, in a proprietary form.
          allOf:
          - $ref: '#/components/schemas/Max35Text'
      description: Specifies the reason for the status report. Either Code or Proprietary field value should be passed on request.
    AmountType3Choice:
      type: object
      properties:
        EqvtAmt:
          $ref: '#/components/schemas/EquivalentAmount2'
        InstdAmt:
          type: object
          description: Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party.
          allOf:
          - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
      description: Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party. Either EqvtAmt or InstdAmt field value should be passed on request.
    disclosure_request:
      type: object
      properties:
        in:
          required:
          - bankCode
          - bankCodeType
          - chargeCode
          - clientId
          - destinationCountry
          - estimatePercentile
          - flagFutureDated
          - flagODE
          - fundingCurrency
          - isBeneDeduct
          - nonSTPFlag
          - paymentCurrency
          - paymentCurrencyAmount
          - paymentMethod
          - releaseTime
          - valueDate
          - subEntityId
          - beneDeductFeeType
          - nostroCountry
          type: object
          properties:
            clientId:
              maxLength: 5
              type: string
              description: WorldLink specific client number if using WorldLink routing.
            subEntityId:
              maxLength: 4
              type: string
              description: WorldLink Branch (Sub entity number).
            destinationCountry:
              maxLength: 2
              type: string
              description: Value any country through or to which CITI transfers money via Fed Wire or ACH.
            destinationState:
              maxLength: 35
              type: string
              description: Destination State. If the full state or province is available it may be passed here. If this is in the database it will return the value, otherwise it will default. This entry is for tax calculation only.
            destinationCity:
              maxLength: 35
              type: string
              description: Destination City. If the full City is available it may be passed here.  If this is in the database it will return the value, otherwise it will default. This entry is for tax calculation only.
            bankCode:
              maxLength: 20
              type: string
              description: ID of bank through which money can be sent. This is used in conjunction with Bank Code Type.
            bankCodeType:
              maxLength: 1
              type: string
              description: This is used in conjunction with Bank Code B-BIC.
            paymentMethod:
              maxLength: 1
              type: string
              description: As a default pass 'W'ire W (wire), A (ACH), C (Cash)
            paymentCurrency:
              maxLength: 3
              type: string
              description: Payment currency SWIFT(ISO) code.
            fundingCurrency:
              maxLength: 3
              type: string
              description: Funding currency SWIFT(ISO) code.
            paymentCurrencyAmount:
              type: number
              description: Decimals dependent on currency number 19,3 .Between 0.00 and 9999999999999999.999
            nonSTPFlag:
              maxLength: 1
              type: string
              description: This will always default to ‘N’  for straight through processing. Always pass ‘N’.
            citiPointOfOrigination:
              maxLength: 2
              type: string
              description: Location of Nostro account or US. Allowable Value(2 characters) or space. Not allowed unless bank code is present. This tag may be used if the client is not routing through the WorldLink Omnibus accounts. Use of this value is to be coordinated with the DF Table administrator.
            isBeneDeduct:
              maxLength: 1
              type: string
              description: Accesses Bene Deduct table if Yes [Y]. Client should pass 'Y' if they know bene deduct fees are being applied.
              enum:
              - Y
              - N
            beneDeductFeeType:
              maxLength: 1
              type: string
              description: Flat(F) or Tiered(T). Value must be present if Bene Deduct indicator is Y. Spaces or no tag transmitted if Bene Deduct is N.
              enum:
              - F
              - T
            estimatePercentile:
              type: integer
              description: Estimate Percentile (80, 90 or 95) (required in case fee found is estimated, the API will return the appropriate value)
            chargeCode:
              maxLength: 3
              type: string
              description: 'BEN -- fees charged to beneficiaries

                SHA -- fees shared

                OUR -- Fees by bank/RTP

                '
            releaseTime:
              type: string
              description: 'Time that transactions will be released after the designated hold period. Format: yyyy-mm-ddThh:mm:ss.'
            nostroCountry:
              type: string
              description: Valid two digit country code.
            flagODE:
              type: string
              description: Our Deduct Flag. Both isBeneDeduct and flagODE, can't be Y, at the same time. When flagODE is Y, ChargeCode can't be anything other than OUR
              enum:
              - Y
              - N
            valueDate:
              type: string
              description: Value date for the payment.
              format: date
            flagFutureDated:
              maxLength: 1
              type: string
              description: Indicates whether it is future dated transaction.
              enum:
              - Y
              - N
          example:
            clientId: '24884'
            subEntityId: '0001'
            destinationCountry: IN
            destinationState: AK
            destinationCity: ANCHORAGE
            bankCode: CITIIN00
            bankCodeType: B
            paymentMethod: W
            paymentCurrency: INR
            fundingCurrency: USD
            paymentCurrencyAmount: 100
            nonSTPFlag: N
            isBeneDeduct: Y
            citiPointOfOrigination: US
            estimatePercentile: 95
            chargeCode: OPT
            releaseTime: '2019-11-28T16:11:23.000'
            nostroCountry: AU
            valueDate: '2019-11-28'
            flagFutureDated: N
            flagODE: Y
            beneDeductFeeType: F
