          maxLength: 50
          minLength: 1
          type: string
          title: first_name
        last_name:
          description: "last_name. \n - For ACH Pay and verify transaction method.holder.last_name parameter is mandatory \n - For India Card transactions, method.holder.last_name parameter is mandatory"
          example: A
          maxLength: 50
          minLength: 1
          type: string
          title: last_name
    Sdk-Payer-Authentication-Response:
      title: sdk payer authentication
      description: sdk payer authentication response
