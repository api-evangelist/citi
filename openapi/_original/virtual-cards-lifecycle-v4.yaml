    Custom-Reference:
      type: object
      title: CustomReference
      properties:
        customReferenceValue:
          type: string
          description: >-
            Specifies the value of a custom reference field. Conditionally
            required if customReferenceLabel is included in
            request.<br><br>Mastercard - Max Length - 80 characters<br>Visa -
            Max Length - 100 characters
        customReferenceLabel:
          type: string
          maxLength: 50
          description: >-
            Specifies the label of a custom reference field.<br>Mastercard: If
            the template used for this VCA request identifies a given custom
            reference field as required, then the custom reference label must be
            provided in the request.
    Time-Of-Day:
      type: object
      title: TimeOfDay
      properties:
        startTime:
          type: string
          description: >-
            Specifies the start time from which the virtual card account can be
            used on the particular day specified in weekDaysEffective. Format
            24-hour format<br><br>Mastercard - Optional<br>Visa - Optional. The
            minutes digit must be populated with zero only
        endTime:
          type: string
          description: >-
            Specifies the end time until which the virtual card account can be
            used on the particular day specified in weekDaysEffective. Format
            24-hour format<br><br>Mastercard - Optional<br>Visa - Optional. The
            minutes digit must be populated with zero only
        weekdayEffective:
          type: string
          description: >-
            Specifies the day applicable to the start and end times
            defined.<br>Mastercard - Optional<br>Visa - Optional<br><br>Possible
            Values:<br><br>Mon<br>Tue<br>Wed<br>Thu<br>Fri<br>Sat<br>Sun
    Merchant-Id-Response:
      type: object
      title: MerchantIdResponse
      properties:
        allowed:
          type: boolean
          description: >-
            Indicate whether the values in merchantId and acquirerId are allowed
            or disallowed.<br> True = values provided in merchantId and
            acquirerId are allowed<br> False = values provided in merchantId and
            acquirerId are not allowed.<br>Mastercard - Conditionally required
            if merchant ID control is enabled<br>Visa - Conditionally required
            if merchant ID control is enabled
        merchantIds:
          type: array
          items:
            $ref: '#/components/schemas/Merchant-Id'
    Merchant-Id:
      type: object
      title: MerchantId
      properties:
        cardAcceptorId:
          type: string
          maxLength: 15
          description: >-
            Specifies the Card Acceptor ID that should be allowed / disallowed
            when transacting with the virtual card.<br>Mastercard - Not
            applicable<br>Visa - Conditionally required if merchant ID control
            is enabled
          example: '123456'
        acquirerId:
          type: string
          maxLength: 15
          description: >-
            Specifies the Acquirer ID that should be allowed / disallowed when
            transacting with the virtual card.<br>Mastercard - Not
            applicable<br>Visa - Optional
          example: '123456'
    Merchant-Id-Request:
      type: object
      title: MerchantIdRequest
      properties:
        allowed:
          type: boolean
          description: >-
            Indicate whether the values in merchantId and acquirerId are allowed
            or disallowed.<br> True = values provided in merchantId and
            acquirerId are allowed<br> False = values provided in merchantId and
            acquirerId are not allowed.<br>Mastercard - Conditionally required
            if merchant ID control is enabled<br>Visa - Conditionally required
            if merchant ID control is enabled
        merchantIds:
          type: array
          description: >-
            Specifies the Merchant ID that should be allowed / disallowed when
            transacting with the virtual card.
          items:
            $ref: '#/components/schemas/Merchant-Id'
    Spend-Velocity-Response:
      type: object
      title: SpendVelocityResponse
      properties:
        maxAuth:
          type: number
          description: >-
            Limits the number of authorizations that can be made with a VCA.
            Should be set to 1, if a single-use VCA is created. Specify any
            value larger than one for a multi-use VCA. Mastercard: Set to 0, if
            unlimited authorizations should be allowed. (0 is not applicable for
            Visa)
        cumulativeSpendLimit:
          type: number
          description: >-
            Limits the overall amount that can be spent on the virtual card
            account.<br>Mastercard - Allows a maximum of 14 digits (12 digits to
            the left of the decimal and 2 digits to the right of the
            decimal)<br>Visa - Allows a maximum of 12 digits (10 digits to the
            left of the decimal and 2 digits to the right of the decimal)
        periodType:
          type: string
          description: >
            Period for which the control values are valid before they
            reset<br><br>Mastercard:<br>

              * `D` - Daily. The balances of control parameters enabled for a VCA are reset with their original values every day at 00:00:00.
              * `M` - Monthly. The balances of control parameters enabled for a VCA are reset with their original values at the start of every month.
              * `W` - Weekly. The balances of control parameters enabled for a VCA are reset with their original values every Monday at 00:00:00.
              * `Q` - Quarterly. The balances of control parameters enabled for a VCA are reset with their original values on the first day of every quarter at 00:00:00.
              * `Y` - Annually. The balances of control parameters enabled for a VCA are reset with their original values every year on January 1st at 00:00:00.
              * `C` - Continuous. The balances of control parameters enabled for a VCA are retained continuously for the validity period defined.<br><br>Visa:<br>
              * `1` - Recurring. The balances of control parameters enabled for a VCA are reset with their original values on a specified recurring day for every month. If you select this periodType, you must also populate the resetDay field.
              * `2` - Monthly. The balances of control parameters enabled for a VCA are reset with their original values on a specified recurring day for every month.
              * `3` - Date Range. The balances of control parameters enabled for a VCA are retained continuously for the validity period defined. If you select this periodType, then validityStartDate and validityEndDate fields are required.
        availableBalance:
          type: number
          description: The remaining balance available to spend on the virtual card.
        periodEndDate:
          type: string
          description: End date of the current period based on the periodType selected.
        resetDay:
          type: number
          description: >-
            Select a number between 1-28 to identify the day each month when the
            control parameter balances should reset to their original value.
            This field is only applicable if periodType was defined as "1".
    Spend-Velocity-Request:
      type: object
      title: SpendVelocityRequest
      properties:
        maxAuth:
          type: number
          description: >-
            Limits the number of authorizations that can be made with a VCA.
            Should be set to 1, if a single-use VCA is created. Specify any
            value larger than one for a multi-use VCA. Mastercard: Set to 0, if
            unlimited authorizations should be allowed. (0 is not applicable for
            Visa)<br><br>Mastercard - Optional. Allows a maximum of 8
            digits<br><br>Visa - Required. Allows a maximum of 10 digits
        cumulativeSpendLimit:
          type: number
          description: >-
            Limits the overall amount that can be spent on the virtual card
            account.<br><br>Mastercard - Optional. Allows a maximum of 14 digits
            (12 digits to the left of the decimal and 2 digits to the right of
            the decimal)<br><br>Visa - Required. Allows a maximum of 12 digits
            (10 digits to the left of the decimal and 2 digits to the right of
            the decimal)
        periodType:
          type: string
          description: >
            Period for which the control values are valid before they
            reset<br><br>Mastercard:<br>

              * `D` - Daily. The balances of control parameters enabled for a VCA are reset with their original values every day at 00:00:00.
              * `M` - Monthly. The balances of control parameters enabled for a VCA are reset with their original values at the start of every month.
              * `W` - Weekly. The balances of control parameters enabled for a VCA are reset with their original values every Monday at 00:00:00.
              * `Q` - Quarterly. The balances of control parameters enabled for a VCA are reset with their original values on the first day of every quarter at 00:00:00.
              * `Y` - Annually. The balances of control parameters enabled for a VCA are reset with their original values every year on January 1st at 00:00:00.
              * `C` - Continuous. The balances of control parameters enabled for a VCA are retained continuously for the validity period defined.<br><br>Visa:<br>
              * `1` - Recurring. If you select this periodType, you must also populate the resetDay field.
              * `2` - Monthly. The balances of control parameters enabled for a VCA are reset with their original values on a specified recurring day for every month.
              * `3` - Date Range. If you select this periodType, you must also populate the validityStartDate and validityEndDate fields.
        resetDay:
          type: number
          description: >-
            Select a number between 1-28 to identify the day each month when the
            control parameter balances should reset to their original value.
            This field is only applicable if periodType was defined as "1".
    Curfew-Time:
      type: object
      title: CurfewTime
      properties:
        startTime:
          type: string
          description: >-
            Specifies the start time until which the virtual card account can be
            used on the particular day specified in weekDaysEffective. Format -
            24-hour format<br>Mastercard - Optional<br>Visa - Not applicable
        endTime:
          type: string
          description: >-
            Specifies the end time until which the virtual card account can be
            used on the particular day specified in weekDaysEffective. Format -
            24-hour format<br>Mastercard - Optional<br>Visa - Not applicable
        weekdaysEffective:
          type: array
          description: >-
            Specifies the day applied to start and end times.<br>Mastercard -
            Optional<br>Visa - Not applicable<br><br>Possible
            Values:<br><br>Mon<br>Tue<br>Wed<br>Thu<br>Fri<br>Sat<br>Sun
          items:
            type: string
    Vca-Create-Request:
      type: object
      title: VcaCreateRequest
      required:
        - programId
        - messageId
        - fundingSourceId
        - timeZone
        - customReference
      properties:
        fundingSourceId:
          type: string
          description: >-
            Unique identifier of the funding source to which the virtual card
            rolls up to.<br/><br/>Mastercard - This value is returned in the ID
            Provisioning API. Mastercard generates this value when a funding
            account is onboarded to the VCA platform.<br/><br/>Visa - This is
            the proxy pool account name/number that is onboarded to the Visa VCA
            platform
        fundingSourceName:
          type: string
          description: >-
            Descriptive name of the real card to which the virtual card rolls up
            to.<br/><br/>Mastercard - Required. This value is returned in the ID
            Provisioning API<br/><br/>Visa - Not applicable
        programId:
          type: string
          description: >-
            Unique ID of the company record defined in the virtual cards
            platform.<br/><br/>Mastercard - This value is returned in the ID
            Provisioning API.<br/><br/>Visa - This value is generated when the
            VCA program is onboarded to Visa's VCA platform
        messageId:
          type: string
          description: >-
            Unique ID of the API message sent. The messageId will be provided
            back in the corresponding response. The ID can be used for
            investigation and troubleshooting. The ID must be unique per
            integration.
        mccGrouping:
          type: array
          description: >-
            Limits authorizations to defined Merchant Category Codes. Cannot be
            used in conjunction with the mccRange field.<br/><br/>Mastercard -
            The name of the Purchase Type configured on the Purchase
            Template.<br/><br/>Visa - Pass a list of MCCGs defined by Visa to
            allow or block VCA transactions.
          items:
            type: string
        mccRange:
          type: array
          description: >-
            Limits authorizations to a defined range of Merchant Category
            Codes.(eg: [0001-9999, 2000-2999]). Cannot be used in conjunction
            with the mccGrouping field.<br>Mastercard - Not Applicable<br>Visa -
            Optional
          items:
            type: string
        mccgAllowed:
          type: boolean
          description: >-
            Required if the mccGrouping field is populated or if the mccRange
            field is populated. Specifies whether the mccGrouping or mccRange is
            allowed or disallowed.<br/><br/>Mastercard - Not applicable<br>Visa
            - Conditionally required, if mccGrouping or mccRange is provided
          example: true
        getCardImage:
          type: boolean
          description: >-
            Specifies whether cardImage field needs to be included in the
            response or not.

            <br>Visa - Not applicable

            Mastercard - `Optional field` if not included, cardImage will be
            sent in the response.

            * True = cardImage field will be sent in the response

            * False = cardImage field will not be sent in the response.
        currencyCode:
          type: string
          description: >-
            Currency Code in which VCA amounts are expressed. <br>Mastercard -
            currencyCode is not required if currencyType = "B" for billing
            account currency. currencyCode is required if currencyType = "M" for
            merchant transaction currency. <br>Visa - Required
        currencyType:
          type: string
          description: >-
            Mastercard - Defines the type of the VCA currency.<br> - Value "B"
            stands for Billing Currency which indicates that the VCA spend limit
            is expressed in the billing account currency of the underlying
            funding source.<br> - Value "M" stands for Merchant Currency which
            indicates that Merchant transactions are limited to the VCA currency
            provided in the currencyCode field. <br>Visa - The only valid value
            is "M", which stands for Merchant Currency.
        timeZone:
          type: string
          description: >-
            Defines the time zone applicable for any of the following date or
            time parameters within controls set for a VCA:

            * Validity Period Control

            * Aging Velocity Control (Mastercard only)

            * Curfew Control

            * Time of Day Control
        paymentBeneficiaryId:
          type: number
          description: >-
            Uniquely identifies the payment beneficiary for which the virtual
            card is created.<br>Mastercard - Required<br>Visa - Not applicable
        paymentBeneficiaryEmails:
          type: array
          description: >-
            Lists of up to 5 email addresses separated by semicolon to which the
            virtual card details should be sent to.<br><br>Mastercard -
            Optional<br>Visa - Not applicable
          items:
            type: string
        customReference:
          type: array
          description: >-
            Up to 29 custom reference field labels and values can be defined in
            a given request. A custom reference value cannot be sent without a
            corresponding custom reference label.
          items:
            $ref: '#/components/schemas/Custom-Reference'
        templateId:
          type: number
          description: >-
            Identifies the template that was setup in the VCA system and that
            should be used for this virtual card.<br><br>Mastercard -
            Required<br>Visa - Not applicable
        expiryDate:
          type: string
          description: >-
            Expiry Date of the virtual card account. Represented in UTC time
            zone. Must be at least 1 month into the future and cannot be more
            than 24 months in the future. Format - MMYYYY<br>Mastercard -
            Required<br>Visa - Not applicable. The expiry date is inherited from
            the underlying funding account
        enableSpendVelocityControl:
          type: boolean
          description: >-
            Limits the frequency and total cumulative amount of authorizations
            performed on the VCA within a specified period.<br/><br/>Mastercard:
            The control is mandatory unless Aging Velocity Control is used. This
            control cannot be used in combination with the Aging Velocity
            Control.<br/><br/>Visa: Spend Velocity Control is mandatory.
        spendVelocity:
          type: array
          items:
            $ref: '#/components/schemas/Spend-Velocity-Request'
        enableValidityPeriodControl:
          type: boolean
          description: >-
            Limits authorization activity to a specific time
            period.<br>Mastercard - Optional<br>Visa - Required
        validityStartDate:
          type: string
          description: >-
            Identifies the date from which the virtual card account can be used
            for transactions. Format - YYYY-MM-DD<br>Mastercard -
            Optional<br>Visa - Optional. If not provided, then will be defaulted
            to today's date
        validityEndDate:
          type: string
          description: >-
            Identifies the date until which the virtual card account can be used
            for transactions. Format - YYYY-MM-DD<br>Mastercard -
            Optional<br>Visa - Required
        enableAmountRangeControl:
          type: boolean
          description: >-
            Approves a transaction only if the requested amount for
            authorization is equal to or greater than the Minimum Amount and
            less than or equal to the Maximum Amount. This control cannot be
            used in combination with Transaction Limit Control.<br>Mastercard -
            Optional<br>Visa - Optional
        maxAmount:
          type: number
          description: >-
            Identifies the maximum allowed transaction amount.<br><br>Mastercard
            - Optional. Max character length - 14 digits (12 digits to the left
            of the decimal and 2 digits to the right of the decimal)<br><br>Visa
            - Optional. Max character length - 12 digits (10 digits to the left
            of the decimal and 2 digits to the right of the decimal)
        minAmount:
          type: number
          description: >-
            Identifies the minimum allowed transaction amount.<br><br>Mastercard
            - Max character length - 14 digits (12 digits to the left of the
            decimal and 2 digits to the right of the decimal)<br><br>Visa -
            Optional. Max character length - 12 digits (10 digits to the left of
            the decimal and 2 digits to the right of the decimal)
        enableTransactionLimitControl:
          type: boolean
          description: >-
            Limits individual transactions to a maximum amount. This control
            cannot be used in combination with Amount Range
            Control.<br>Mastercard - Optional<br>Visa - Optional
        amountLimit:
          type: number
          description: >-
            Identifies the maximum allowed transaction amount.<br><br>Mastercard
            - Optional. Max character length - 17<br><br>Visa - Optional. Only
            integer value allowed. Max character length - 7
        enableCurfewControl:
          type: boolean
          description: >-
            Limits authorization activity to a single time period for each day
            selected. This control cannot be used in combination with Time Of
            Day Control.<br>Mastercard - Optional<br>Visa - Not applicable
        curfewTime:
          $ref: '#/components/schemas/Curfew-Time'
        enableTimeOfDayControl:
          type: boolean
          description: >-
            Limits authorization request to defined time periods each
            day.<br>Mastercard - Optional<br>Visa - Optional
        timeOfDay:
          type: array
          items:
            $ref: '#/components/schemas/Time-Of-Day'
        enableAgingVelocityControl:
          type: boolean
          description: >-
            Sets a cumulative amount and keeps track of the current remaining
            balance. Allows the requester to 'age off' approved authorization
            requests that have not been cleared by the merchant after a defined
            number of days.<br>Mastercard - Optional<br>Visa - Not applicable
        cumulativeSpendLimit:
          type: number
          description: >-
            Limits the overall amount that can be spent on the virtual card
            account. This field is associated to the Aging Velocity
            Control.<br>Mastercard - Optional. Max character length - 14 digits
            (12 digits to the left of the decimal and 2 digits to the right of
            the decimal)<br>Visa - Not applicable
        authorizationHoldDays:
          type: number
          description: >-
            Identifies the number of days after which an authorization gets aged
            off if no matching clearing record was received.<br>Mastercard -
            Optional<br>Visa - Not applicable
        enableGeographyControl:
          type: boolean
          description: >-
            Limits authorization requests to a defined geographic location. This
            is an optional control. If this control is not used, pass False or
            leave this section out from the request. If value passed is True,
            all fields in this section are required.<br>Mastercard -
            Optional<br>Visa - Optional
        countryCodes:
          type: array
          example:
            - USA
          description: >-
            Comma delimited list defining the merchant country in which the VCA
            can or cannot be used.<br>Mastercard - Optional<br>Visa - Optional
          items:
            type: string
        allowed:
          type: boolean
          description: >-
            Indicate whether the values in countryCode are allowed or
            disallowed.<br> True = values provided in countryCode are
            allowed<br> False = values provided in countryCode are not
            allowed<br>Mastercard - Optional<br>Visa - Optional
        enableMerchantIdControl:
          type: boolean
          description: >-
            Limits authorizations to a particular merchant using the Merchant ID
            and Acquirer ID (Mastercard) or Card Acceptor ID
            (Visa).<br>Mastercard - Optional<br>Visa - Optional
        merchantId:
          $ref: '#/components/schemas/Merchant-Id-Request'
