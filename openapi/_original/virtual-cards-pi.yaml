swagger: '2.0'
info:
  description: Virtual Card Create, Modify, Cancel request.
  version: ''
  title: VCA Life Cycle Management for Payment Intermediaries
servers:
  - url: https://tts.apib2b.citi.com/tts/cards/pi/
    description: production gateway URL
  - url: https://tts.sandbox.apib2b.citi.com/tts/cards/pi/
    description: sandbox URL
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
security:
  - clientCredentials: []
paths:
  /vca/v1/create:
    post:
      summary: Create Virtual Card Accounts
      operationId: create
      description: >-
        Create a virtual card and set its associated spending controls, custom
        reference data and payment beneficiaries.
      parameters:
        - name: client_id
          in: query
          required: true
          description: >-
            This is your unique identifier shared during your CitiConnect API
            onboarding. This is the same `client_id` used for OAuth token
            generation
          type: string
        - name: Content-Type
          in: header
          description: Supports \"application/xml\" and \"application/json\".
          required: true
          type: string
        - name: Authorization
          in: header
          description: The OAuth Token prefixed with "Bearer" and a space in between.
          required: true
          type: string
        - name: country
          in: header
          description: Country of the client.
          required: true
          type: string
        - name: region
          in: header
          description: region of the client(APAC/EMEA/NAM)
          required: true
          type: string
        - in: body
          name: request-body
          required: true
          schema:
            $ref: '#/definitions/CreateVirtualCardRequest'
      responses:
        '200':
          description: Create virtual card acknowledgement response
          headers:
            api-transactionId:
              type: string
              description: Citi commercial cards API tracking ID.
            messageId:
              type: string
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
              example: '0123456789012345678901234567'
          schema:
            $ref: '#/definitions/ImmediateAckResponse'
        '400':
          description: Invalid virtual card request
          headers:
            api-transactionId:
              type: string
              description: Citi commercial cards API tracking ID.
            messageId:
              type: string
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
          schema:
            $ref: '#/definitions/CreateVirtualCardFailureResponse'
        '401':
          description: Unauthorized Modify Virtual Card request
          schema:
            $ref: '#/definitions/UnAuthorizedResponse'
        '405':
          description: Method Not Allowed
          headers:
            api-transactionId:
              type: string
              description: Citi commercial cards API tracking ID.
            messageId:
              type: string
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
          schema:
            $ref: '#/definitions/CreateVirtualCardFailureResponse'
        '500':
          description: Internal Server Error
          headers:
            api-transactionId:
              type: string
              description: Citi commercial cards API tracking ID.
            messageId:
              type: string
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
          schema:
            $ref: '#/definitions/CreateVirtualCardFailureResponse'
  /vca/v1/modify:
    post:
      summary: Modify Virtual Card Accounts
      operationId: update
      description: >-
        Modify a virtual card and set its associated spending controls, custom
        reference data, and payment beneficiaries.
      parameters:
        - name: client_id
          in: query
          required: true
          description: >-
            This is your unique identifier shared during your CitiConnect API
            onboarding. This is the same `client_id` used for OAuth token
            generation
          type: string
        - name: Content-Type
          in: header
          description: Supports \"application/xml\" and \"application/json\".
          required: true
          type: string
        - name: Authorization
          in: header
          description: The OAuth Token prefixed with "Bearer" and a space in between.
          required: true
          type: string
        - name: country
          in: header
          description: Country of the client.
          required: true
          type: string
        - name: region
          in: header
          description: region of the client(APAC/EMEA/NAM)
          required: true
          type: string
        - in: body
          name: request-body
          required: true
          schema:
            $ref: '#/definitions/ModifyVirtualCardRequest'
      responses:
        '200':
          description: Modify Virtual Card response
          headers:
            api-transactionId:
              type: string
              description: Citi commercial cards API tracking ID.
            messageId:
              type: string
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
          schema:
            $ref: '#/definitions/ModifyVirtualCardResponse'
        '400':
          description: Invalid Modify Virtual Card request
          headers:
            api-transactionId:
              type: string
              description: Citi commercial cards API tracking ID.
            messageId:
              type: string
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
          schema:
            $ref: '#/definitions/ModifyVirtualCardFailureResponse'
        '401':
          description: Unauthorized Modify Virtual Card request
          schema:
            $ref: '#/definitions/UnAuthorizedResponse'
        '405':
          description: Method Not Allowed
          headers:
            api-transactionId:
              type: string
              description: Citi commercial cards API tracking ID.
            messageId:
              type: string
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
          schema:
            $ref: '#/definitions/ModifyVirtualCardFailureResponse'
        '500':
          description: Internal Server Error
          headers:
            api-transactionId:
              type: string
              description: Citi commercial cards API tracking ID.
            messageId:
              type: string
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
          schema:
            $ref: '#/definitions/ModifyVirtualCardFailureResponse'
  /vca/v1/cancel:
    post:
      summary: Cancel Virtual Card Accounts
      operationId: cancel
      description: Cancel a virtual card when it is no longer needed.
      parameters:
        - name: client_id
          in: query
          required: true
          description: >-
            This is your unique identifier shared during your CitiConnect API
            onboarding. This is the same `client_id` used for OAuth token
            generation
          type: string
        - name: Content-Type
          in: header
          description: Supports \"application/xml\" and \"application/json\".
          required: true
          type: string
        - name: Authorization
          in: header
          description: The OAuth Token prefixed with "Bearer" and a space in between.
          required: true
          type: string
        - name: country
          in: header
          description: Country of the client.
          required: true
          type: string
        - name: region
          in: header
          description: region of the client(APAC/EMEA/NAM)
          required: true
          type: string
        - in: body
          name: request-body
          required: true
          schema:
            $ref: '#/definitions/CancelVirtualCardRequest'
      responses:
        '200':
          description: Cancel Virtual Card response
          headers:
            api-transactionId:
              type: string
              description: Citi commercial cards API tracking ID.
            messageId:
              type: string
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
          schema:
            $ref: '#/definitions/CancelVirtualCardResponse'
        '400':
          description: Invalid Cancel Virtual Card request
          headers:
            api-transactionId:
              type: string
              description: Citi commercial cards API tracking ID.
            messageId:
              type: string
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
          schema:
            $ref: '#/definitions/CancelVirtualCardFailureResponse'
        '401':
          description: Unauthorized Virtual Card request
          schema:
            $ref: '#/definitions/UnAuthorizedResponse'
        '405':
          description: Method Not Allowed
          headers:
            api-transactionId:
              type: string
              description: Citi commercial cards API tracking ID.
            messageId:
              type: string
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
          schema:
            $ref: '#/definitions/CancelVirtualCardFailureResponse'
        '500':
          description: Internal Server Error
          headers:
            api-transactionId:
              type: string
              description: Citi commercial cards API tracking ID.
            messageId:
              type: string
              description: >-
                Unique ID of the API message sent. The messageId will be
                provided back in the corresponding response. The ID can be used
                for investigation and troubleshooting. The ID must be unique per
                integration.
          schema:
            $ref: '#/definitions/CancelVirtualCardFailureResponse'
definitions:
