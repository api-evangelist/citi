          - AFTERPAY
          - AMAZON_PAY
          - BITPAY
          - BIZUM
          - TRUSTLY
          - BLIK
          - BLIK_BNPL
          - CASH_APP
          - DOKU_WALLET
          - EPS
          - ESTONIAN_BANKS
          - VERKKOPANKKI
          - FLOAPAY
          - FPX
          - GOPAY
          - IDEAL
          - INDOMARET
          - INDONESIAN_BANKS
          - JENIUS_PAY
          - KREDIVO
          - LATVIAN_BANKS
          - LINK_AJA
          - LITHUANIAN_BANKS
          - MBWAY
          - MULTIBANCO
          - OVO_WALLET
          - PAYSAFECARD
          - P24
          - SATISPAY
          - SCALAPAY
          - SKRILL
          - SWISH
          - THAIBANKS
          - TWINT
          - WERO
          - ZIP
          - BANCOMATPAY
          - DRAGONPAY
          - MYBANK
          - ALFAMART
          - PAYU
          - BANCONTACT
          - STABLECOINS
          - OXXO_PAY
          example: PIX
          title: type
        alipay:
          $ref: '#/components/schemas/Alipay'
        boleto:
          $ref: '#/components/schemas/Boleto'
        paypal:
          $ref: '#/components/schemas/Paypal'
        card:
          $ref: '#/components/schemas/Card'
        token_id:
          description: "Token_number. \n- For India card transaction, method.card.token_number parameter is mandatory when token number is provided and allowed maximum length is 50."
          example: PA123456789
          maxLength: 50
          minLength: 1
          type: string
          title: token_number
        token_type:
          description: Token type.
          enum:
          - ALT_TOKEN
          - NETWORK_TOKEN
          - ISSUER_TOKEN
          - CITI_TOKEN
          example: ISSUER_TOKEN
          type: string
          title: token_type
        session_id:
          description: Session identification number
          type: string
          minLength: 36
          maxLength: 37
          example: SES1234567890123456789012345678
          title: session_id
        stored_method:
          description: "Flag to indicate if the customer payment method will be stored (Alias creation), \n - NOT_STORED Set this value if you are not storing the card details provided by the payer for this transaction. The gateway sets this value by default, if you are submitting a payer-initiated transaction. You must not use this value when submitting merchant-initiated transactions \n - STORED Set this value if you have previously stored the card details provided by the payer and are now using these stored details. The gateway sets this value by default, if you are submitting a merchant-initiated transaction \n - TO_BE_STORED Set this value if this is the first transaction using these card details and you intend to store the card details if the transaction is successful."
          enum:
          - NOT_STORED
          - STORED
          - TO_BE_STORED
          example: NOT_STORED
          type: string
          title: stored_method
