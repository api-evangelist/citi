openapi: 3.0.2
info:
  title: CCAPI Payments(JSON)
  description: |
    Update - March 31, 2026
  version: 1.0.0
servers:
  - url: https://b2b.api.icg.citi.com/citiconnect/prod
    description: production gateway url
  - url: https://sandbox.b2b.api.icg.citi.com/citiconnect/sb
    description: 'sbox url '
tags:
  - name: Validations API
    description: API services to support beneficiary/bank validation initiation
  - name: Request for Information API
    description: API services to support Request for Information
  - name: Response to Request for Information API
    description: API services to support Response to Request for Information
paths:
  /addonservices/v1/validations:
    post:
      tags:
        - Validations API
      summary: Validating the beneficiary/bank details
      description: >-
        This endpoint allows you to validate beneficiary/bank details with the
        use of combination of parameters
      operationId: expressBeneficiaryValidation
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: >-
            Your unique identification, same as the identification you use for
            OAuth token generation, Citi shared with you during your CitiConnect
            API onboarding
          example: 6d3cf821-db6d-496d-bec0-064a362e9c31
        - name: Idempotency-Id
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
          example: a44cbb606de4edb9a7a123414bba3bb
          description: >-
            Your unique identification for a POST request 
             - Maximum length is 128. 
            -  CitiConnect API responds with an error (HTTP status 4XX) if your
            POST request idempotency identification value is a duplicate across
            a recent history of idempotency identifications in Citi's database. 

            - If you don't receive any response (HTTP status 2XX, 4XX or 5XX)
            from Citi to your POST request and you wish to retry, reinitiate
            your request with the same idempotency identification to prevent
            accidental duplicate payment.
      requestBody:
        required: true
        description: >-
          This endpoint allows you to validate beneficiary/bank details with the
          use of combination of parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Validation-Request'
            examples:
              UK Bank Availability Validation:
                $ref: '#/components/examples/UK-Bank-Availability-Validation-Request'
              UK Bank Reachability Validation:
                $ref: '#/components/examples/UK-Bank-Reachability-Validation-Request'
              UK Beneficiary Validation:
                $ref: '#/components/examples/UK-Beneficiary-Validation-Request'
              SEPA VoP Beneficiary Validation:
                $ref: '#/components/examples/SEPA-VoP-Validation-Request'
              US EWS Beneficiary Validation:
                $ref: '#/components/examples/US-EWS-Beneficiary-Validation-Request'
              IN PAN Validation:
                $ref: '#/components/examples/IN-PAN-Validation-Request'
              Card Validation:
                $ref: '#/components/examples/Card-Validation-Request'
              IN AADHAR Validation:
                $ref: '#/components/examples/IN-PAN-Validation-Request'
      security:
        - clientCredentials: []
      responses:
        '200':
          description: OK
          headers:
            request_id:
              schema:
                type: string
              description: Citi's unique identification for your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Validation-Response'
              examples:
                UK Bank Availability Success Response:
                  $ref: '#/components/examples/UK-Bank-Availability-Success-Response'
                UK Bank Availability Reject Response:
                  $ref: '#/components/examples/UK-Bank-Availability-Reject-Response'
                UK Bank Reachability Success Response:
                  $ref: '#/components/examples/UK-Bank-Reachability-Success-Response'
                UK Bank Reachability Reject Response:
                  $ref: '#/components/examples/UK-Bank-Reachability-Reject-Response'
                UK Final Beneficiary Validation Positive Response:
                  $ref: >-
                    #/components/examples/UK-Final-Beneficiary-Validation-Positive-Response
                UK Final Beneficiary Validation Negative Response:
                  $ref: >-
                    #/components/examples/UK-Final-Beneficiary-Validation-Negative-Response
                SEPA VoP Validation Success Response:
                  $ref: '#/components/examples/SEPA-VoP-Validation-Success-Response'
                SEPA VoP Validation Reject Response:
                  $ref: '#/components/examples/SEPA-VoP-Validation-Reject-Response'
                US EWS Final Beneficiary Validation Response:
                  $ref: >-
                    #/components/examples/US-EWS-Final-Beneficiary-Validation-Response
                IN PAN Final Validation Response:
                  $ref: '#/components/examples/IN-PAN-Final-Validation-Response'
                IN AADHAR Validation:
                  $ref: '#/components/examples/IN-AADHAR-Final-Validation-Response'
                Card validation Success Response:
                  $ref: '#/components/examples/Card-Validation-Success-Response'
                Card validation Currency Reject Response:
                  $ref: >-
                    #/components/examples/Card-Validation-Currency-Reject-Response
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        default:
          $ref: '#/components/responses/Internal-Server-Error'
  /addonservices/v1/requestforinformations/{id}:
    get:
      tags:
        - Request for Information API
      summary: Inquire of Request for Information.
      description: This endpoint allows you to get Request for Information.
      operationId: findRequestForInformationByRfiId
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: >-
            Your unique identification, same as the identification you use for
            OAuth token generation, Citi shared with you during your CitiConnect
            API onboarding
          example: 6d3cf821-db6d-496d-bec0-064a362e9c31
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
          example: RFI-36345954-RFICSAWCNAM1
          description: >-
            Your unique identification for a request for information, same as
            rfi_id.
      security:
        - clientCredentials: []
      responses:
        '200':
          description: OK
          headers:
            request_id:
              schema:
                type: string
              description: Citi's unique identification for your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request-For-Information'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        default:
          $ref: '#/components/responses/Internal-Server-Error'
  /addonservices/v1/responsetorequestforinformations:
    post:
      tags:
        - Response to Request for Information API
      summary: Initiate Response to Request for Information
      description: This endpoint allows you to send Response to Request for Information
      operationId: responseToRequestForInformation
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: >-
            Your unique identification, same as the identification you use for
            OAuth token generation, Citi shared with you during your CitiConnect
            API onboarding
          example: 6d3cf821-db6d-496d-bec0-064a362e9c31
        - name: Idempotency-Id
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
          example: a44cbb606de4edb9a7a123414bba3bb
          description: >-
            Your unique identification for a POST request 
             - Maximum length is 128. 
            -  CitiConnect API responds with an error (HTTP status 4XX) if your
            POST request idempotency identification value is a duplicate across
            a recent history of idempotency identifications in Citi's database. 

            - If you don't receive any response (HTTP status 2XX, 4XX or 5XX)
            from Citi to your POST request and you wish to retry, reinitiate
            your request with the same idempotency identification to prevent
            accidental duplicate payment.
      requestBody:
        required: true
        description: This endpoint allows you to Response to Request for Information
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Response-To-Request-For-Information'
      security:
        - clientCredentials: []
      callbacks:
        Request-For-Information-Notification:
          $ref: '#/components/callbacks/Request-For-Information-Notification'
        Request-For-Information-Closure-Notification:
          $ref: '#/components/callbacks/Request-For-Information-Closure-Notification'
      responses:
        '200':
          description: OK
          headers:
            request_id:
              schema:
                type: string
              description: Citi's unique identification for your request
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Initial-Response-To-Request-For-Information
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        default:
          $ref: '#/components/responses/Internal-Server-Error'
  /addonservices/v1/responsetorequestforinformations/{id}:
    get:
      tags:
        - Response to Request for Information API
      summary: Inquire of Response to Request for Information.
      description: This endpoint allows you to get Response to Request for Information.
      operationId: findResponseToRequestForInformationByRfiId
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: >-
            Your unique identification, same as the identification you use for
            OAuth token generation, Citi shared with you during your CitiConnect
            API onboarding
          example: 6d3cf821-db6d-496d-bec0-064a362e9c31
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
          example: RFI-36345954-RFICSAWCNAM1
          description: >-
            Your unique identification for a request for information, same as
            rfi_id.
      security:
        - clientCredentials: []
      responses:
        '200':
          description: OK
          headers:
            request_id:
              schema:
                type: string
              description: Citi's unique identification for your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response-To-Request-For-Information'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        default:
          $ref: '#/components/responses/Internal-Server-Error'
components:
  parameters:
    Event-Type:
      name: Event-Type
      in: header
      required: true
      description: Event Type
      schema:
        type: string
    Event-Name:
      name: Event-Name
      in: header
      required: true
      description: Event Name
      schema:
        type: string
  schemas:
    Error-Response:
      type: object
      title: ErrorResponse
      properties:
        ref_id:
          type: string
          maxLength: 60
          description: Unique ID for the Transaction
          title: ref_id
        error_details:
          type: array
          items:
            $ref: '#/components/schemas/Error-Detail'
          title: error_details
    Error-Detail:
      type: object
      title: ErrorDetail
      properties:
        issue:
          type: string
          maxLength: 200
          description: more details about the issue
          title: issue
        action:
          type: string
          maxLength: 350
          description: corrective action to be taken to resolve above issue
          title: action
        code:
          type: string
          maxLength: 8
          description: unique code representing the issue
          title: code
    Validation-Request:
      type: object
      title: ValidationRequest
      required:
        - method
      properties:
        uetr:
          type: string
          pattern: >-
            ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          description: UUID v4 format unique end-to-end transaction reference
          title: uetr
        end_to_end_id:
          type: string
          description: |-
            Client provided reference number. 
             - For Single Euro Payments Area Verification of Payee (SEPA VoP), this parameter is mandatory with max length 35 if method.penny_test = PENNY 
             - For UK bank availability/reachability, this parameter is not applicable 
             - For US Early Warning System (EWS), this parameter is not applicable 
             - For UK, this parameter is not applicable 
             - For IN PAN, this parameter is not applicable 
             - For Global Mastercard Validation this parameter is not applicable
          minLength: 1
          maxLength: 35
          title: end_to_end_id
        debtor:
          type: object
          title: debtor_request
          properties:
            account:
              type: string
              description: >-
                Bank account held with CITI 
                 - For UK bank availability/reachability, this parameter is mandatory and max length is 40 
                 - For US EWS, this parameter is mandatory and max length is 40 
                 - For UK, this parameter is mandatory and max length is 40 
                 - For IN PAN, this parameter is mandatory and max length is 40 
                - For SEPA VoP, this parameter is mandatory and max length is
                40 
                 - For Global Mastercard Validation this parameter is not applicable
              minLength: 1
              maxLength: 40
              title: account
            name:
              type: string
              description: |-
                Debtor Account Name.
                 - For UK bank availability/reachability, this parameter is optional and max length is 140 
                 - For US EWS, this parameter is optional and max length is 140 
                 - For UK, this parameter is optional and max length is 140 
                 - For IN PAN, this parameter is optional and max length is 140 
                 - For Global Mastercard Validation this parameter is not applicable 
                 - For SEPA VoP, this parameter is optional and max length is 140
              minLength: 1
              maxLength: 140
              title: name
            id:
              type: string
              description: |-
                Debtor ID  
                 - For UK bank availability/reachability, this parameter is not applicable
                 - For US EWS, this parameter is not applicable 
                 - For UK, this parameter is not applicable
                 - For IN PAN, this parameter is not applicable 
                 - For SEPA VoP, this parameter is not applicable 
                 - For Global Mastercard Validation this parameter is Mandatory and max length is 40 and for Global Mastercard Validation CCAPI will pass the world link client id under the id parameter
              minLength: 1
              maxLength: 40
              title: id
        creditor:
          type: object
          title: creditor_request
          properties:
            bank_id:
              type: string
              description: |-
                Receiving Financial Institution BIC.
                 - For UK bank availability/reachability, this parameter is conditional and the condition is if method.method= NC, SORTCODE, BIC then this parameter should be present. If method.method = NC/SORTCODE, then length should be exactly 6. If method.method = BIC, then length should be 8 or 11  
                 - For US EWS, this parameter is mandatory and length should be 9 if routing/clearing code is populated 
                 - For UK, this parameter is mandatory and length should be exactly 6 or 8 or 11 characters 
                 - For IN PAN, this parameter is not applicable 
                 - For SEPA VoP, this parameter is not applicable 
                 - For Global Mastercard Validation this parameter is not applicable
              minLength: 1
              maxLength: 35
              title: bank_id
            iban:
              type: string
              description: |-
                Creditor IBAN number  
                 - For UK bank availability/reachability, this parameter is conditional with max length 22.Condition is if method.method= IBAN then this parameter should be present 
                 - For US EWS, this parameter is not applicable 
                 - For UK, this parameter is conditional and max length is 22.Condition is if method.method= IBAN then this parameter should be present.Either creditor.account or creditor.proxy_id or creditor.wallet or creditor.IBAN should be passed by client 
                 - For IN PAN, this parameter is not applicable 
                 - For SEPA VoP, this parameter is mandatory and max length is 40 
                 - For Global Mastercard Validation this parameter is not applicable
              minLength: 1
              maxLength: 40
              title: iban
            account:
              type: string
              description: |-
                Creditor Account Number. 
                 - For UK bank availability/reachability, this parameter is not applicable 
                 - For US EWS, this parameter is conditional and max length is 17.Condition is if method.method= BANKACCOUNT then this parameter should be present 
                 - For UK, this parameter is conditional and max length is 17.Condition is if method.method= BANKACCOUNT then this parameter should be present.Either creditor.account or creditor.proxy_id or creditor.wallet or creditor.IBAN should be passed by client 
                 - For IN PAN, this parameter is not applicable 
                 - For SEPA VoP, this parameter is not applicable 
                 - For Global Mastercard Validation this parameter is not applicable
              minLength: 1
              maxLength: 40
              title: account
            name:
              type: string
              description: |-
                Creditor Account Name. 
                 - For UK bank availability/reachability, this parameter is not applicable
                 - For US EWS, this parameter is mandatory and max length is 87. Please provide first middle(if any) last name in this sequence with spaces 
                 - For UK, this parameter is mandatory and max length is 140. Please provide first middle(if any) last name in this sequence with spaces 
                 - For IN PAN, this parameter is mandatory and max length is 85. Please provide first middle(if any) last name in this sequence with spaces 
                 - For Global Mastercard Validation this parameter is not applicable 
                 - For SEPA VoP, this parameter is mandatory and max length is 70. Please provide first middle(if any) last name in this sequence with spaces
              minLength: 1
              maxLength: 140
              title: name
            father_name:
              type: string
              description: |-
                Creditor' Father's Name 
                 - For UK bank availability/reachability, this parameter is not applicable 
                 - For US EWS, this parameter is not applicable 
                 - For UK, this parameter is not applicable 
                 - For IN PAN, this parameter is optional and max length is 75. Please provide first middle(if any) last name in this sequence with spaces 
                 - For Global Mastercard Validation this parameter is not applicable 
                 - For SEPA VoP, this parameter is not applicable
              minLength: 1
              maxLength: 140
              title: father_name
            proxy_id:
              type: string
              description: |-
                Creditor Proxy ID  
                 - For UK bank availability/reachability, this parameter is not applicable
                 - For US EWS, this parameter is not applicable 
                 - For UK, this parameter is conditional and max length is 17.Either creditor.account or creditor.proxy_id or creditor.wallet or creditor.IBAN should be passed by client
                 - For IN PAN, this parameter is not applicable 
                 - For SEPA VoP, this parameter is not applicable 
                 - For Global Mastercard Validation this parameter is not applicable
              minLength: 1
              maxLength: 255
              title: proxy_id
            wallet:
              type: string
              description: |-
                Creditor wallet details 
                 - For UK bank availability/reachability, this parameter is not applicable 
                 - For US EWS, this parameter is not applicable 
                 - For UK, this parameter is conditional and max length is 17.Either creditor.account or creditor.proxy_id or creditor.wallet or creditor.IBAN should be passed by client 
                 - For IN PAN, this parameter is not applicable 
                 - For SEPA VoP, this parameter is not applicable 
                 - For Global Mastercard Validation this parameter is not applicable
              minLength: 1
              maxLength: 40
              title: wallet
            address_lines:
              type: array
              description: |-
                Creditor's address lines 
                 - For UK bank availability/reachability, this parameter is not applicable 
                 - For US EWS, this parameter is optional and allowed 2 lines with each line max length of 40 
                 - For UK, this parameter is optional and allowed 2 lines with each line max length of 40 
                 - For IN PAN, this parameter is not applicable 
                 - For SEPA VoP, this parameter is not applicable 
                 - For Global Mastercard Validation this parameter is not applicable
              items:
                $ref: '#/components/schemas/Address'
              title: address_lines
            street_name:
              maxLength: 70
              minLength: 1
              type: string
              description: |-
                Creditor's street_name 
                 - For UK bank availability/reachability, this parameter is not applicable 
                 - For US EWS, this parameter is not applicable 
                 - For UK, this parameter is optional with max length 70 
                 - For IN PAN, this parameter is not applicable 
                 - For SEPA VoP, this parameter is not applicable 
                 - For Global Mastercard Validation this parameter is not applicable
              title: street_name
            building_number:
              maxLength: 16
              minLength: 1
              type: string
              description: |-
                Creditor's building_number 
                 - For UK bank availability/reachability, this parameter is not applicable 
                 - For US EWS, this parameter is not applicable 
                 - For UK, this parameter is optional with max length 16 
                 - For IN PAN, this parameter is not applicable 
                 - For SEPA VoP, this parameter is not applicable 
                 - For Global Mastercard Validation this parameter is not applicable
              title: building_number
            postal_code:
              maxLength: 16
              minLength: 1
              type: string
              description: |-
                Creditor's postal_code 
                 - For UK bank availability/reachability, this parameter is not applicable 
                 - For US EWS, this parameter is optional with max length 10 
                 - For UK, this parameter is optional with max length 16 
                 - For IN PAN, this parameter is not applicable 
                 - For SEPA VoP, this parameter is not applicable 
                 - For Global Mastercard validation, this parameter is not applicable
              title: postal_code
            city:
              maxLength: 35
              minLength: 1
              type: string
              description: |-
                Creditor's city 
                 - For UK bank availability/reachability, this parameter is not applicable 
                 - For US EWS, this parameter is optional with max length 25 
                 - For UK, this parameter is optional with max length 35 
                 - For IN PAN, this parameter is not applicable 
                 - For SEPA VoP, this parameter is not applicable 
                 - For Global Mastercard Validation this parameter is not applicable
              title: city
            state:
              maxLength: 35
              minLength: 1
              type: string
              description: |-
                Creditor's state 
                 - For UK bank availability/reachability, this parameter is not applicable 
                 - For US EWS, this parameter is optional with max length 2 
                 - For UK, this parameter is optional with max length 35 
                 - For IN PAN, this parameter is not applicable 
                 - For SEPA VoP, this parameter is not applicable 
                 - For Global Mastercard Validation, this parameter is not applicable
              title: state
            country:
              type: string
              description: |-
                Creditor's country  
                 - For UK bank availability/reachability, this parameter is not applicable
                 - For US EWS, this parameter is optional with max length 2 
                 - For UK, this parameter is optional with max length 2 
                 - For IN PAN, this parameter is not applicable 
                 - For SEPA VoP, this parameter is not applicable 
                 - For Global Mastercard Validation this parameter is not applicable
              pattern: ^[A-Z]{2,2}$
              title: country
            birth_date:
              type: string
              format: date
              description: |-
                ISO 8601 (YYYY-MM-DD), Creditor's birth date 
                 - For UK bank availability/reachability, this parameter is not applicable 
                 - For US EWS, this parameter is optional 
                 - For UK, this parameter is optional 
                 - For IN PAN, this parameter is mandatory 
                 - For SEPA VoP, this parameter is not applicable 
                 - For Global Mastercard Validation, this parameter is not applicable
              title: birth_date
            home_phone_number:
              maxLength: 34
              minLength: 6
              type: string
              description: |-
                Creditor's home phone number 
                 - For UK bank availability/reachability, this parameter is not applicable 
                 - For US EWS, this parameter is optional with max length 10 
                 - For UK, this parameter is optional with max length 34 
                 - For IN PAN, this parameter is not applicable 
                 - For SEPA VoP, this parameter is not applicable 
                 - For Global Mastercard Validation, this parameter is not applicable
              title: home_phone_number
            work_phone_number:
              maxLength: 34
              minLength: 6
              type: string
              description: |-
                Creditor's work phone number 
                 - For UK bank availability/reachability, this parameter is not applicable  
                 - For US EWS, this parameter is optional with max length 10 
                 - For UK, this parameter is optional with max length 34 
                 - For IN PAN, this parameter is not applicable 
                 - For SEPA VoP, this parameter is not applicable 
                 - For Global Mastercard Validation this parameter is not applicable
              title: work_phone_number
            document:
              type: object
              title: document_request
              properties:
                entity:
                  type: string
                  description: >-
                    Whether the document belongs to Business or Individual 
                     - For UK bank availability/reachability, this parameter is not applicable 
                     - For US EWS, this parameter is not applicable 
                    - If method.country= GB and method.method = BANKACCOUNT then
                    creditor.document.entity is mandatory parameter 
                     - For IN PAN, this parameter is not applicable 
                     - For SEPA VoP, this parameter is not applicable 
                     - For Global Mastercard Validation, this parameter is not applicable
                  enum:
                    - BUSINESS
                    - PERSONAL
                  title: entity
                type:
                  type: string
                  description: |-
                    Whether the document belongs to Business or Individual 
                     - For UK bank availability/reachability, this parameter is not applicable 
                     - For US EWS, this parameter is not applicable 
                    - For UK, this parameter is optional 
                     - For IN PAN, this parameter is mandatory with applicable value  TXID 
                    - Personal Code values 
                    - ARNU - AlienRegistrationNumber 
                    - CCPT - PassportNumber 
                    - CUST - CustomerIdentificationNumber 
                    - DRLC - DriversLicenseNumber 
                    - EMPL - EmployeeIdentificationNumber 
                    - NIDN - NationalIdentityNumber 
                    - SOSE - SocialSecurityNumber 
                    - TELE - TelephoneNumber 
                    - TXID - TaxIdentificationNumber 
                    - POID - PersonCommercialIdentification 
                     - Corporate Code values 
                    - BANK - BankPartyIdentification 
                    - CBID - Central Bank Identification Number 
                    - CHID - Clearing Identification Number 
                    - COID - CountryIdentificationCode 
                    - CUST - CustomerNumber 
                    - DUNS - Data Universal Numbering System 
                    - EMPL - EmployerIdentificationNumber 
                    - GS1G - GS1GLNIdentifier 
                    - SREN - SIREN 
                    - SRET - SIRET 
                    - TXID - Tax Identification Number 
                     - For SEPA VoP, this parameter is not applicable 
                     - For Global Mastercard Validation, this parameter is not applicable
                  enum:
                    - ARNU
                    - CCPT
                    - CUST
                    - DRLC
                    - EMPL
