    tokenUrl: /tts/api/v1/oauth2/token
  description: "Client applications must supply an\n authentication token with every request,\
    \ and therefore must first\n authenticate before it can proceed. A client can use the OAuth\
    \ 2 client\n credential grant flow to obtain a time limited access token. To get an\n access\
    \ token send a HTTP Post request to the token endpoint using basic\n authentication with\
    \ the client key and secret.<br><br>**Request**<br><br>```POST {baseURL}/tts/api/v1/oauth2/token\
    \ HTTPS/1.1\n Authorization: Basic base64(key:secret) \n Content-Type:application/x-www-form-urlencoded\n\
    \ {\n  scope=/api&grant_type=client_credentials\n }```<br><br>\n **Response**<br><br>```\n\
    \   {\n     \"token_type\": \"bearer\", \n     \"access_token\": <access token>, \n    \
    \ \"expires_in\": <seconds until expiry>, \n     \"consented_on\":<timestamp>, \n     \"\
    scope\": \"api\"\n   }```    <br><br>The bearer token is valid for 1800 seconds (30 minutes)\
    \ after which it will expire. At this point, you would need to re-authenticate.<br><br>"
