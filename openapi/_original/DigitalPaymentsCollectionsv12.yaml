              description: Indicates if the issuer's ACS supports the method call protocol.
              enum:
                - NOT_SUPPORTED
                - SUPPORTED
              example: NOT_SUPPORTED
              type: string
              title: method_supported
            protocol_version:
              description: The version of the EMV 3-D Secure protocol used (e.g., 2.1.0).
              example: CART123456
              maxLength: 20
              minLength: 1
              type: string
              title: protocol_version
            requestor_id:
              description: >-
                The unique identifier assigned to the merchant by the card
                scheme directory server for 3DS2.
              example: CART123456
              maxLength: 20
              minLength: 1
              type: string
              title: requestor_id
            requestor_name:
              description: >-
                The unique name assigned to the merchant by the card scheme
                directory server for 3DS2.
              example: CART123456
              maxLength: 40
              minLength: 1
              type: string
              title: requestor_name
            accept_versions:
              type: array
              items:
                type: string
                description: >-
                  A comma separated list of the forms of payer authentication
                  that you will accept.
                title: accept_versions
            channel:
              description: >-
                Indicates the channel in which the authentication request is
                initiated.
              enum:
                - MERCHANT_REQUESTED
                - PAYER_APP
                - PAYER_BROWSER
              example: MERCHANT_REQUESTED
              type: string
              title: channel
            method:
              description: The method that the issuer will use to authenticate the payer.
              enum:
                - DYNAMIC
                - OUT_OF_BAND
                - STATIC
              example: STATIC
              type: string
              title: method
            purpose:
              description: >-
                Indicates the context in which payer authentication is
                requested.
              enum:
                - ADD_CARD
                - AGREEMENT_CANCELLATION
                - MAINTAIN_CARD
                - PAYMENT_TRANSACTION
                - REFRESH_AUTHENTICATION
              example: ADD_CARD
              type: string
              title: purpose
            method_post_data:
              description: >-
                Base64 URL encoded frame contents to be posted to the method URL
                for risk assessment.
              example: https://greenzone-api.uat.nam.nsroot.net/api/notification
              maxLength: 100
              minLength: 1
              type: string
              title: method_post_data
            method_url:
              type: string
              maxLength: 500
              minLength: 1
              description: >-
                The URL provided by the issuer to which the method post data
                must be sent.
              example: https://greenzone-api.uat.nam.nsroot.net/api/notification
              title: method_url
            redirect_html:
              type: string
              maxLength: 40960
              minLength: 1
              description: >-
                The URL provided by the issuer to which the method post data
                must be sent.
              example: https://greenzone-api.uat.nam.nsroot.net/api/notification
              title: redirect_html
            version:
              description: >-
                Indicates the available payer authentication method or NONE if
                unavailable.
              enum:
                - 3DS2
                - RUPAY
                - PASSKEY
                - NONE
              example: RUPAY
              type: string
              title: version
            line_of_business:
              description: >-
                Identifier for different lines of business configured in the
                merchant profile.
              example: CART123456
              maxLength: 100
              minLength: 1
              type: string
              title: line_of_business
