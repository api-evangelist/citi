          allOf:
          - $ref: '#/components/schemas/CashAccount'
        debtor_agent:
          type: object
          description: Financial institution servicing an account for the debtor.
          allOf:
          - $ref: '#/components/schemas/PartyAgent'
        creditor:
          type: object
          description: Creditor is the Party to which an amount of money is due.
          allOf:
          - $ref: '#/components/schemas/PartyIdentificationCreditor'
        creditor_account:
          type: object
          description: Unambiguous identification of the account of the creditor to which a credit entry will be posted as a result of the payment transaction.
          allOf:
          - $ref: '#/components/schemas/CashAccount'
        creditor_agent:
          type: object
          description: Financial institution servicing an account for the creditor.
          allOf:
          - $ref: '#/components/schemas/PartyAgent'
        unstructured_remittance_information:
          type: string
          description: Contains Remittance Information or Payment details. Information supplied to enable the matching/reconciliation of an entry with the items that the payment is intended to settle, such as commercial invoices in an accounts' receivable system, in a structured form.
        payment_event:
          type: array
          description: Information about an event which is a payment message or status confirmation update. It is repeated as many times as there are events to be returned.
          items:
            $ref: '#/components/schemas/PaymentEventDetail'
      description: Contains the details on the payment transaction.
