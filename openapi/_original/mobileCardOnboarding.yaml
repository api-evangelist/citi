        $ref: '#/definitions/CancelCardRequest'
      demographicInfo:
        description: This object should be populated when requestType is DEMOGRAPHIC_UPDATE
        type: object
        format: object
        $ref: '#/definitions/DemographicUpdateInfo'
    required:
      - requestType
