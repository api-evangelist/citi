        type: string
        xml:
          name: message
      status:
        description: error status code
        type: string
        xml:
          name: status
    type: object
    xml:
      name: response
  InstantPaymentRequest:
    description: Object representing instant payment initiation request
    properties:
      paymentBase64:
        description: Base64 encoded string of ISO XML payment initiation input xml
        format: byte
        type: string
        xml:
          name: paymentBase64
    required:
      - paymentBase64
    type: object
    xml:
      name: Request
  InstantPaymentResponse:
    description: Object representing payment initiation response
    properties:
