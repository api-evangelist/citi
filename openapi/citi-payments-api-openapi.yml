          description: "Regulatory Reporting details code \n - For TH Instant payment transaction.regulatory_reporting.code  is not applicable \n - For US Instant payment transaction.regulatory_reporting.code  field is not applicable \n - For IN IMPS transaction.regulatory_reporting.code  is not applicable \n - For UK FPS Instant payment transaction.regulatory_reporting.code  is not applicable \n - For JP Instant payment transaction.regulatory_reporting.code  is not applicable \n - For IN UPI transaction.regulatory_reporting.code  is not applicable \n - For US WIRE,transaction.regulatory_reporting.code  field is not applicable \n - For US ACH CCD/PPD/IAT payment,transaction.regulatory_reporting.code  field is not applicable \n - For SEPA IDP transaction.regulatory_reporting.code  field is optional with max length 10 \n - For Japan Instant payment transaction.regulatory_reporting.code field is not applicable \n - For SEPA, transaction.regulatory_reporting.code field is optional and allowed maxLength is 35"
          title: code
    Instructing-Agent-Status:
      type: object
      title: InstructingAgent
      properties:
        bank_id:
          maxLength: 35
          minLength: 1
          type: string
          description: "Instructing Agent/Debtor Agent member Identification ID or BIC of a clearing system. \n - For TH Instant payment instructing_agent.bank_id field is not applicable \n - For US Instant payment instructing_agent.bank_id field is not applicable \n - For IN IMPS Instant payment instructing_agent.bank_id field is not applicable  \n - For UK FPS Instant payment instructing_agent.bank_id field is not applicable \n - For IN UPI Instant payment instructing_agent.bank_id field is not applicable \n - For US Wire, instructing_agent.bank_id is not applicable \n - For US ACH CCD/PPD payment, instructing_agent.bank_id is not applicable \n - For US ACH IAT payment, instructing_agent.bank_id is not applicable \n - For SEPA IDP instructing_agent.bank_id field is mandatory with max length 11 \n - For Japan Instant payment instructing_agent.bank_id field is not applicable \n - For India FIR IMPS Instant payment instructing_agent.bank_id field is optional and allowed length is 11 \n - For SEPA, instructing_agent.bank_id field is mandatory with max length 11"
          title: bank_id
        bank_name:
          maxLength: 140
          minLength: 1
          type: string
          description: "Instructing Agent name. \n - For TH, US, India IMPS, UK FPS, IN UPI, Stripe US - Wire, Stripe US- ACH CCD/PPD/IAT, SEPA, SEPA IDP and JP payment instructing_agent.bank_name field is not applicable \n - For India FIR IMPS Instant payment instructing_agent.bank_name field is mandatory, if client provided instructing_agent.bank_id and allowed max length is 100"
          title: bank_name
        street_name:
          maxLength: 70
          minLength: 1
          type: string
          description: "Instructing Agent street name. \n - For TH, US, India IMPS, UK FPS, IN UPI, Stripe US - Wire, Stripe US- ACH CCD/PPD/IAT, SEPA, SEPA IDP and JP payment instructing_agent.street_name field is not applicable \n - For India FIR IMPS Instant payment instructing_agent.street_name field is mandatory, if client provided instructing_agent.bank_id and allowed max length is 35"
          title: street_name
        building_number:
          maxLength: 35
          minLength: 1
          type: string
          description: "Instructing Agent building number. \n - For TH, US, India IMPS, UK FPS, IN UPI, Stripe US - Wire, Stripe US- ACH CCD/PPD/IAT, SEPA, SEPA IDP and JP payment instructing_agent.building_number field is not applicable \n - For India FIR IMPS Instant payment instructing_agent.building_number field is mandatory, if client provided instructing_agent.bank_id and allowed max length is 16"
          title: building_number
        postal_code:
          maxLength: 16
          minLength: 1
          type: string
          description: "Instructing Agent postal code. \n - For TH, US, India IMPS, UK FPS, IN UPI, Stripe US - Wire, Stripe US- ACH CCD/PPD/IAT, SEPA, SEPA IDP and JP payment instructing_agent.postal_code field is not applicable \n - For India FIR IMPS Instant payment instructing_agent.postal_code field is mandatory, if client provided instructing_agent.bank_id"
          title: postal_code
        city:
          maxLength: 35
          minLength: 1
          type: string
          description: "Instructing Agent city. \n - For TH, US, India IMPS, UK FPS, IN UPI, Stripe US - Wire, Stripe US- ACH CCD/PPD/IAT, SEPA, SEPA IDP and JP payment instructing_agent.city field is not applicable \n - For India FIR IMPS Instant payment instructing_agent.city field is mandatory, if client provided instructing_agent.bank_id"
          title: city
        state:
          maxLength: 35
          minLength: 1
          type: string
          description: "Instructing Agent state. \n - For TH, US, India IMPS, UK FPS, IN UPI, Stripe US - Wire, Stripe US- ACH CCD/PPD/IAT, SEPA, SEPA IDP and JP payment instructing_agent.state field is not applicable \n - For India FIR IMPS Instant payment instructing_agent.state field is mandatory, if client provided instructing_agent.bank_id"
          title: state
        country:
          type: string
          description: "Instructing Agent country \n - For TH, US, India IMPS, UK FPS, IN UPI, Stripe US - Wire, Stripe US- ACH CCD/PPD/IAT, SEPA, SEPA IDP and JP payment instructing_agent.country field is not applicable \n - For India FIR IMPS Instant payment instructing_agent.country field is mandatory, if client provided instructing_agent.bank_id"
          pattern: ^[A-Z]{2,2}$
          title: country
