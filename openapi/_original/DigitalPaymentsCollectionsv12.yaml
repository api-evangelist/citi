              title: authorization_status
        authentication:
          title: ' Authentication Sub Response'
          required:
            - channel
            - method_completed
            - method_supported
            - requestor_id
            - requestor_name
            - accept_versions
            - version
          properties:
            scheme:
              description: >-
                The EMV 3DS authentication scheme used (e.g., MADA, MASTERCARD,
                VISA) for externally authenticated transactions.
              example: CART123456
              maxLength: 50
              minLength: 2
              type: string
              title: scheme
            directory_server_id:
              description: >-
                Unique identifier for the Directory Server (RID) for in-app
                authentication.
              example: CART123456
              maxLength: 10
              minLength: 10
              type: string
              title: directory_server_id
            method_completed:
              description: >-
                Indicates if the issuer's ACS completed the method call to
                obtain browser info.
              type: boolean
              example: true
              title: method_completed
