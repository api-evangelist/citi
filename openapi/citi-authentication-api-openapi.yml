    Authentication-Response:
      type: object
      title: Authentication Response
      required:
      - method
      - transaction
      - order
      - authentication
      properties:
        transaction:
          type: object
          title: Authentication transaction response
          required:
          - amount
          - id
          - currency_code
          - country_code
          - type
          - status
          - description
          properties:
            id:
              description: Unique Transaction identification provided by the merchant during transaction creation
              example: pay02052023456r
              maxLength: 128
              minLength: 1
              type: string
              title: id
            amount:
              description: Transaction amount
              example: 200
              maximum: 1000000000000000000
              minimum: 0.01
              type: number
              title: amount
            country_code:
              description: Country code
              enum:
              - US
              example: US
              type: string
              title: country_code
            currency_code:
              description: ISO 4217 Currency Code for instance  USD/GBP/EUR
              enum:
              - USD
              example: USD
              type: string
              title: currency_code
            gateway_recommendation:
              description: Provides a recommendation for your next action based on the outcome of the transaction.
              enum:
              - DO_NOT_PROCEED
              - DO_NOT_PROCEED_ABANDON_ORDER
              - PROCEED
              - RESUBMIT_WITH_ALTERNATIVE_PAYMENT_DETAILS
              example: DO_NOT_PROCEED
              type: string
              title: gateway_recommendation
            status:
              type: string
              maxLength: 20
              minLength: 1
              description: "Transaction Status, following status you will receive in response \n- PENDING - Transaction pending action from customer  \n- FAILED - Transaction failed for invalid payload \n- UNKNOWN - The result of the operation is unknown \n- SUCCESS - The operation was successfully processed"
              example: SUCCESS
              title: status
            description:
              type: string
              maxLength: 256
              minLength: 1
              description: "Transaction Status, following status you will receive in response \n- PENDING - Transaction pending action from customer  \n- FAILED - Transaction failed for invalid payload \n- UNKNOWN - The result of the operation is unknown \n- SUCCESS - The operation was successfully processed"
              example: The operation was successfully processed
              title: description
            creation_date_time:
              type: string
              format: date-time
              description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment (Debit) - Date time, generated by CitiConnect API, when CitiConnect API accepted a payment initiation after validation"
              example: '2022-09-13T08:23:49.114Z'
              title: creation_date_time
            update_time:
              type: string
              format: date-time
              description: Indicates the date and time the gateway considers the order to have last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ)
              example: '2022-09-13T08:23:49.114Z'
              title: update_time
            type:
              description: Indicates the type of action performed on the order.
              enum:
              - AUTHENTICATION
              - AUTHORIZATION
              - AUTHORIZATION_UPDATE
              - CAPTURE
              - CHARGEBACK
              - DISBURSEMENT
              - FUNDING
              - PAYMENT
              - REFUND
              - REFUND_REQUEST
              - VERIFICATION
              - VOID_AUTHORIZATION
              - VOID_CAPTURE
              - VOID_PAYMENT
              - VOID_REFUND
              example: VERIFICATION
              type: string
              title: type
            reference:
              description: An optional identifier for this transaction
              example: REPAY789541
              maxLength: 250
              minLength: 1
              type: string
              title: reference
            authentication_status:
              description: Indicates the result of payer authentication.
              enum:
              - AUTHENTICATION_ATTEMPTED
              - AUTHENTICATION_AVAILABLE
              - AUTHENTICATION_EXEMPT
              - AUTHENTICATION_FAILED
              - AUTHENTICATION_NOT_IN_EFFECT
              - AUTHENTICATION_NOT_SUPPORTED
              - AUTHENTICATION_PENDING
              - AUTHENTICATION_REJECTED
              - AUTHENTICATION_REQUIRED
              - AUTHENTICATION_SUCCESSFUL
              - AUTHENTICATION_UNAVAILABLE
              example: AUTHENTICATION_UNAVAILABLE
              type: string
              title: authorization_status
        method:
          type: object
          title: Authentication Method Response
          required:
          - type
          properties:
            type:
              description: "Method specified by the customer for the transaction  \n- Provide CARD for CARD transactions"
              type: string
              enum:
              - CARD
              - GOOGLEPAY
              - APPLEPAY
              example: CARD
              title: type
            card:
              $ref: '#/components/schemas/Authentication-Card-Response'
            holder_name:
              $ref: '#/components/schemas/Holder-Name'
            token_id:
              description: Token_number.
              example: PA123456789
              maxLength: 50
              minLength: 1
              type: string
              title: token_number
            token_type:
              description: Token type.
              enum:
              - ALT_TOKEN
              - NETWORK_TOKEN
              - ISSUER_TOKEN
              - CITI_TOKEN
              example: ISSUER_TOKEN
              type: string
              title: token_type
        order:
          type: object
          title: Authentication Order Response
          required:
          - creation_date_time
          - currency_code
          - id
          - update_time
          - total_auth_amount
          - total_captured_amount
          - total_refunded_amount
          properties:
            id:
              description: A unique identifier for this order to distinguish it from any other order you create.
              example: OR123456789
              maxLength: 40
              minLength: 1
              type: string
              title: id
            creation_date_time:
              type: string
              format: date-time
              description: GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ)
              example: '2022-09-13T08:23:49.114Z'
              title: creation_date_time
            update_time:
              type: string
              format: date-time
              description: Indicates the date and time the gateway considers the order to have last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ)
              example: '2022-09-13T08:23:49.114Z'
              title: update_time
            reference:
              description: An optional identifier for the orderFor example, a shopping cart number, an order number, or an invoice number.
              example: REPAY789541
              maxLength: 200
              minLength: 1
              type: string
              title: reference
            currency_code:
              description: ISO 4217 Currency Code for instance  USD/GBP/EUR
              enum:
              - USD
              example: USD
              type: string
              title: currency_code
            status:
              type: string
              maxLength: 30
              minLength: 1
              description: "Order Status, following status you will receive in response \n- AUTHENTICATED - The payer was successfully authenticated. \n- AUTHENTICATION_INITIATED - Payer authentication has been initiated but not completed. \n- AUTHENTICATION_NOT_NEEDED - Payer authentication was not performed as it was not needed. \n- AUTHENTICATION_UNSUCCESSFUL - Payer authentication was not able to be successfully completed. \n- AUTHORIZED - The payment has been authorized successfully but the authorized amount has not yet been captured, in part, full, or excess. \n- CANCELLED - The initial transaction for this order has been voided successfully. \n- CAPTURED - The authorized amount for this order, in full or excess, has been captured successfully. \n- CHARGEBACK_PROCESSED - A Chargeback has been processed against this order. \n- DISPUTED - The payment has been disputed and is under investigation. A request for information has been received or a chargeback is pending. \n- EXCESSIVELY_REFUNDED - The payment has been captured in part, full, or excess, but the captured amount in excess has been refunded successfully. \n- FAILED - The payment has not been successful. \n- FUNDING - The order transfers money to or from the merchant, without the involvement of a payer. For example, recording monthly merchant service fees from the payment service provider. \n- INITIATED - A browser payment that has successfully been initiated for this order. No payment has yet been made. \n- PARTIALLY_CAPTURED - The authorized amount for this order, in part, has been captured successfully. \n- PARTIALLY_REFUNDED - The payment has been captured in part, full, or excess, but the captured amount in part has been refunded successfully. \n- REFUNDED - The payment has been captured in part, full, or excess, but the captured amount in full has been refunded successfully. \n- REFUND_REQUESTED - A refund against captured amounts on this order has been requested but not executed. Requires further action to approve the refund. \n- VERIFIED - The card details for this order have successfully been verified. No payment has yet been initiated or made. \n- DISBURSED - The order amount has successfully been disbursed to the payer."
              example: AUTHENTICATED
              title: status
            total_auth_amount:
              description: The amount that has been successfully authorized for this order.
              example: 200
              maximum: 1000000000000000000
              minimum: 0.01
              type: number
              title: total_auth_amount
            total_captured_amount:
              description: The amount that has been successfully captured for this order.
              example: 200
              maximum: 1000000000000000000
              minimum: 0.01
              type: number
              title: total_captured_amount
            total_refunded_amount:
              description: The amount that has been successfully captured for this order.
              example: 200
              maximum: 1000000000000000000
              minimum: 0.01
              type: number
              title: total_refunded_amount
            authentication_status:
              description: Indicates the result of payer authentication.
              enum:
              - AUTHENTICATION_ATTEMPTED
              - AUTHENTICATION_AVAILABLE
              - AUTHENTICATION_EXEMPT
              - AUTHENTICATION_FAILED
              - AUTHENTICATION_NOT_IN_EFFECT
              - AUTHENTICATION_NOT_SUPPORTED
              - AUTHENTICATION_PENDING
              - AUTHENTICATION_REJECTED
              - AUTHENTICATION_REQUIRED
              - AUTHENTICATION_SUCCESSFUL
              - AUTHENTICATION_UNAVAILABLE
              example: AUTHENTICATION_UNAVAILABLE
              type: string
              title: authorization_status
        authentication:
          title: ' Authentication Sub Response'
          required:
          - channel
          - method_completed
          - method_supported
          - requestor_id
          - requestor_name
          - accept_versions
          - version
          properties:
            scheme:
              description: The EMV 3DS authentication scheme used (e.g., MADA, MASTERCARD, VISA) for externally authenticated transactions.
              example: CART123456
              maxLength: 50
              minLength: 2
              type: string
              title: scheme
            directory_server_id:
              description: Unique identifier for the Directory Server (RID) for in-app authentication.
              example: CART123456
              maxLength: 10
              minLength: 10
              type: string
              title: directory_server_id
            method_completed:
              description: Indicates if the issuer's ACS completed the method call to obtain browser info.
              type: boolean
              example: true
              title: method_completed
            method_supported:
              description: Indicates if the issuer's ACS supports the method call protocol.
              enum:
              - NOT_SUPPORTED
              - SUPPORTED
              example: NOT_SUPPORTED
              type: string
              title: method_supported
            protocol_version:
              description: The version of the EMV 3-D Secure protocol used (e.g., 2.1.0).
              example: CART123456
              maxLength: 20
              minLength: 1
              type: string
              title: protocol_version
            requestor_id:
              description: The unique identifier assigned to the merchant by the card scheme directory server for 3DS2.
              example: CART123456
              maxLength: 20
              minLength: 1
              type: string
              title: requestor_id
            requestor_name:
              description: The unique name assigned to the merchant by the card scheme directory server for 3DS2.
              example: CART123456
              maxLength: 40
              minLength: 1
              type: string
              title: requestor_name
            accept_versions:
              type: array
              items:
                type: string
                description: A comma separated list of the forms of payer authentication that you will accept.
                title: accept_versions
            channel:
              description: Indicates the channel in which the authentication request is initiated.
              enum:
              - MERCHANT_REQUESTED
              - PAYER_APP
              - PAYER_BROWSER
              example: MERCHANT_REQUESTED
              type: string
              title: channel
            method:
              description: The method that the issuer will use to authenticate the payer.
              enum:
              - DYNAMIC
              - OUT_OF_BAND
              - STATIC
              example: STATIC
              type: string
              title: method
            purpose:
              description: Indicates the context in which payer authentication is requested.
              enum:
              - ADD_CARD
              - AGREEMENT_CANCELLATION
              - MAINTAIN_CARD
              - PAYMENT_TRANSACTION
              - REFRESH_AUTHENTICATION
              example: ADD_CARD
              type: string
              title: purpose
            method_post_data:
              description: Base64 URL encoded frame contents to be posted to the method URL for risk assessment.
              example: https://greenzone-api.uat.nam.nsroot.net/api/notification
              maxLength: 100
              minLength: 1
              type: string
              title: method_post_data
            method_url:
              type: string
              maxLength: 500
              minLength: 1
              description: The URL provided by the issuer to which the method post data must be sent.
              example: https://greenzone-api.uat.nam.nsroot.net/api/notification
              title: method_url
            redirect_html:
              type: string
              maxLength: 40960
              minLength: 1
              description: The URL provided by the issuer to which the method post data must be sent.
              example: https://greenzone-api.uat.nam.nsroot.net/api/notification
              title: redirect_html
            version:
              description: Indicates the available payer authentication method or NONE if unavailable.
              enum:
              - 3DS2
              - RUPAY
              - PASSKEY
              - NONE
              example: RUPAY
              type: string
              title: version
            line_of_business:
              description: Identifier for different lines of business configured in the merchant profile.
              example: CART123456
              maxLength: 100
              minLength: 1
              type: string
              title: line_of_business
    Customer-Authentication-Request:
