          description: "YYYY-MM-DD Date in local time zone (e.g., EST for a United States RTP network transaction IST for IN IMPS) when Citi's transaction processing application starts processing a transaction \n- For India UPI, UK PAYBYBANK and US RFP transactions transaction.value_date parameter is optional \n- For US RFP this parameter is mandatory \n- For US ACH Direct Debit, this parameter is mandatory \n- For Brazil PIX this parameter is mandatory"
          example: '2022-09-07'
          title: value_date
        currency_code:
          type: string
          description: "ISO 4217 code for the transaction instructed amount currency \n- For India UPI, UK PAYBYBANK and US RFP transactions transaction.currency_code parameter is optional \n- For US ACH Direct Debit, this parameter is mandatory \n- For Brazil PIX this parameter is mandatory"
          enum:
