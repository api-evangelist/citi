openapi: 3.2.0
info:
  title: Citi Payments API
  x-refined-note:
  - x-ibm-name differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Payments across 4 of this provider''s published API definitions: citi-payment-reconfirmation-openapi.yaml, citi-paymentcancellation-json-openapi.yaml, express_payments_api.yaml, ukraine_payment_service_initiation_api.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://tts.apib2b.citi.com/citiconnect/prod/paymentservices/v3
  description: production gateway URL
- url: https://tts.apib2b.citi.com/citiconnect/sb/paymentservices/v3
  description: sandbox URL
- url: https://b2b.api.icg.citi.com/citiconnect/prod
  description: production gateway url
- url: https://sandbox.b2b.api.icg.citi.com/citiconnect/sb
  description: 'sbox url '
- url: https://b2b.tts.icgservices.citi.com/citiconnect/openbanking/ukr/paymentconsentservices/v1
  description: production gateway url
- url: https://sanbox.tts.icgservices.citi.com/citiconnect/openbanking/ukr/paymentconsentservices/v1
  description: sbox url
tags:
- name: Payments
paths:
  /payments/reconfirmations:
    post:
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fi_response'
            application/xml:
              schema:
                $ref: '#/components/schemas/fi_response'
              example: <?xml version="1.0" encoding="UTF-8"?><TxInfAndSts><TxSts>RJCT</TxSts><AddtlInf>Transaction Not Found</AddtlInf></TxInfAndSts>
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                errors:
                - action: Please provide valid value for either uetr or (citi_reference/instruction_id with interbank_settlement_date).
                  issue: uetr/citi_reference/instruction_id cannot be null or empty.
                http_code: 400
                status: FAILED
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                errors:
                - action: Please try again with valid credentials.
                  issue: Authorization failed.
                http_code: 401
                status: FAILED
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                errors:
                - action: Please use valid Http Verb.
                  issue: Method not allowed.
                http_code: 405
                status: FAILED
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                errors:
                - action: Resend request in valid format.
                  issue: provided content-type of the request is not valid.
                http_code: 415
                status: FAILED
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                errors:
                - action: Please try again after sometime.
                  issue: unable to process your request at this moment.
                http_code: 500
                status: FAILED
      parameters:
      - description: This field used to identify request is for reconfirm/reject (Example - RECNFRM / RJCTCNFRM) FI Payments.
        in: header
        name: request_type
        required: true
        schema:
          type: string
          maxLength: 12
      - description: Unique reference which was shared during CitiConnect API on-boarding(client_id which used during oauth token generation)
        in: query
        name: client_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/fi_reconfirmation_request'
          application/xml:
            schema:
              $ref: '#/components/schemas/fi_reconfirmation_request'
            example: <?xml version="1.0" encoding="UTF-8"?><TransacService><InstrId>2009360588</InstrId><ReqdExctnDt>2020-09-25</ReqdExctnDt><Rsn>DUPL</Rsn></TransacService>
        required: true
      operationId: fiPaymentReconfirmation
      summary: Payment Reconfirmation
      description: This API allows you to initiate reconfirm/reject FI payments in JSON and XML format.
      tags:
      - Payments
      security:
      - clientCredentials: []
        Client ID: []
    servers:
    - url: https://tts.apib2b.citi.com/citiconnect/prod/paymentservices/v3
      description: production gateway URL
    - url: https://tts.apib2b.citi.com/citiconnect/sb/paymentservices/v3
      description: sandbox URL
  /payments/stops:
    post:
      summary: Payment Cancellation
      description: 'This API specification document provides descriptions of the request and response parameters for JSON content.


        The FI cancellation API lets you stop or recall payment requests against FI payments in payment insight. It supports custom JSON & ISO XML (camt.056.001.09) format. Initiating an FI Cancellation API using the CitiConnect API requires a well-defined POST request where you can specify the endpoint URL to call the API. Additionally, you need to specify the values for input parameters in the body of your JSON/XML document. Finally, you will encrypt the payload, place it in your request and send it via your application.'
      operationId: FICancellationAPI
      parameters:
      - name: client_id
        in: query
        required: true
        description: This is your unique identifier shared during your CitiConnect API onboarding. This is the same `client_id` used for OAuth token generation
        schema:
          type: string
      - name: Content-type
        in: header
        description: Supports \"application/json\".
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: The OAuth Token prefixed with "Bearer" and space in between.
        required: true
        schema:
          type: string
      - name: request_type
        description: Operation name. The possible value for this header is STOP_REQUEST.
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK > Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fi_cancellation_response'
              example:
                transaction_status:
                  status: ACCP
                  type: Your request has been registered. We will notify you once the transaction is stopped/recalled.
        '400':
          description: BAD REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response_2'
              example:
                status: FAILED
                http_code: 400
                errors:
                - issue: uetr/citi_reference/instruction_id cannot be null or empty.
                  action: Please provide valid value for either UETR or (citi_reference/instruction_id with interbank_settlement_date).
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response_2'
              example:
                status: FAILED
                http_code: 401
                errors:
                - issue: Authorization failed.
                  action: Please try again with valid credentials.
        '404':
          description: NOT FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response_2'
              example:
                status: FAILED
                http_code: 404
                errors:
                - issue: Not found
                  action: Please check the URL and try again later.
        '405':
          description: METHOD NOT ALLOWED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response_2'
              example:
                status: FAILED
                http_code: 405
                errors:
                - issue: Method not allowed.
                  action: Please use valid HTTP supported verb only.
        '415':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response_2'
              example:
                status: FAILED
                http_code: 415
                errors:
                - issue: Provided content-type of the request is not valid.
                  action: Resend request in valid format.
        '500':
          description: INTERNAL SERVER ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response_2'
              example:
                status: FAILED
                http_code: 500
                errors:
                - issue: Unable to process your request at this moment.
                  action: Please try again after sometime.
      security:
      - clientCredentials: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/fi_cancellation_request'
        description: Describes the request body.
        required: true
      tags:
      - Payments
    servers:
    - url: https://tts.apib2b.citi.com/citiconnect/prod/paymentservices/v3
      description: production gateway URL
    - url: https://tts.apib2b.citi.com/citiconnect/sb/paymentservices/v3
      description: sandbox URL
  /paymentservices/v1/payments:
    post:
      tags:
      - Payments
      summary: Initiate an outgoing instant payment credit transfer
      description: This endpoint validates your request and synchronously responds with HTTP status 202 (accepted) after successful validation. If validation fails, the endpoint synchronously responds with error (HTTP status 4XX / 5XX and any applicable ISO 20022 reason code), indicating Citi couldn't accept your transaction initiation request.
      operationId: expressPaymentInitiation
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: Your unique identification, same as the identification you use for OAuth token generation, Citi shared with you during your CitiConnect API onboarding
        example: 6d3cf821-db6d-496d-bec0-064a362e9c31
      - name: Idempotency-Id
        in: header
        required: true
        schema:
          type: string
          maxLength: 128
        example: a44cbb606de4edb9a7a123414bba3bb
        description: "Your unique identification for a POST request \n - Maximum length is 128. \n-  CitiConnect API responds with an error (HTTP status 4XX) if your POST request idempotency identification value is a duplicate across a recent history of idempotency identifications in Citi's database. \n- If you don't receive any response (HTTP status 2XX, 4XX or 5XX) from Citi to your POST request and you wish to retry, reinitiate your request with the same idempotency identification to prevent accidental duplicate payment."
      requestBody:
        required: true
        description: This endpoint validates your request and synchronously responds with HTTP status 202 (accepted) after successful validation. If validation fails, the endpoint synchronously responds with error (HTTP status 4XX / 5XX and any applicable ISO 20022 reason code), indicating Citi couldn't accept your transaction initiation request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment-Initiation-Request'
            examples:
              TH Proxy Credit Transfer:
                $ref: '#/components/examples/Th-Proxy-Payment-Initiation-Request-Example'
              TH Account Credit Transfer:
                $ref: '#/components/examples/Th-Account-Payment-Initiation-Request-Example'
              US Credit Transfer:
                $ref: '#/components/examples/Us-Payment-Initiation-Request-Example'
              IN IMPS Credit Transfer:
                $ref: '#/components/examples/In-Imps-Payment-Initiation-Request-Example'
              IN IMPS FIR Credit Transfer:
                $ref: '#/components/examples/In-Imps-Fir-Payment-Initiation-Request-Example'
              UK FPS Credit Transfer:
                $ref: '#/components/examples/Uk-Payment-Initiation-Request-Example'
              IN UPI Credit Transfer:
                $ref: '#/components/examples/In-Upi-Payment-Initiation-Request-Example'
              IN NEFT Credit Transfer:
                $ref: '#/components/examples/In-Neft-Payment-Initiation-Request-Example'
              US Wire Credit Transfer:
                $ref: '#/components/examples/Us-Wire-Payment-Initiation-Request-Example'
              US ACH CCD/PPD Credit Transfer:
                $ref: '#/components/examples/Us-Ach-Ccd-Payment-Initiation-Request-Example'
              US ACH IAT Credit Transfer:
                $ref: '#/components/examples/Us-Ach-Iat-Payment-Initiation-Request-Example'
              JP Credit Transfer:
                $ref: '#/components/examples/Jp-Payment-Initiation-Request-Example'
              SEPA Credit Transfer:
                $ref: '#/components/examples/SEPA-AllFields-Payment-Initiation-Request-Example'
              SEPA Credit Mandatory Transfer:
                $ref: '#/components/examples/SEPA-MandatoryFields-Payment-Initiation-Request-Example'
              AU Credit Transfer:
                $ref: '#/components/examples/AU-Payment-Initiation-Request-Example'
              MX DFT Credit Transfer:
                $ref: '#/components/examples/MX-DFT-Payment-Initiation-Request-Example'
              MX BKT Credit Transfer:
                $ref: '#/components/examples/MX-BKT-Payment-Initiation-Request-Example'
              AR IP Credit Transfer:
                $ref: '#/components/examples/AR-IP-Payment-Initiation-Request-Example'
              UK BACS Credit Transfer:
                $ref: '#/components/examples/UK-BACS-Initiation-Request-Example'
      security:
      - oAuth2:
        - paymentservices
      callbacks:
        Payment-Notification:
          $ref: '#/components/callbacks/Payment-Notification'
      responses:
        '202':
          description: Accepted
          headers:
            request_id:
              schema:
                type: string
              description: Citi's unique identification for your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments'
              examples:
                TH Credit Transfer Response:
                  $ref: '#/components/examples/Payment-Initiation-Response-Example'
                US Credit Transfer Response:
                  $ref: '#/components/examples/Us-Payment-Initiation-Response-Example'
                IN IMPS Credit Transfer Response:
                  $ref: '#/components/examples/In-Imps-Payment-Initiation-Response-Example'
                IN IMPS Fir Credit Transfer Response:
                  $ref: '#/components/examples/In-Imps-Fir-Payment-Initiation-Response-Example'
                UK FPS Credit Transfer Response:
                  $ref: '#/components/examples/Uk-Payment-Initiation-Response-Example'
                Proxy-Transaction-Post:
                  $ref: '#/components/examples/Proxy-Transaction-Post'
                IN UPI Credit Transfer Response:
                  $ref: '#/components/examples/In-Upi-Payment-Initiation-Response-Example'
                IN NEFT Credit Transfer Response:
                  $ref: '#/components/examples/In-Neft-Payment-Initiation-Response-Example'
                JP Credit Transfer Response:
                  $ref: '#/components/examples/Jp-Payment-Initiation-Response-Example'
                US Wire Credit Transfer Response:
                  $ref: '#/components/examples/Us-Wire-Payment-Initiation-Response-Example'
                US Ach Credit Transfer Response:
                  $ref: '#/components/examples/Us-Ach-Payment-Initiation-Response-Example'
                SEPA Credit Transfer Response:
                  $ref: '#/components/examples/SEPA-AllFields-Payment-Initiation-Response-Example'
                AU Credit Transfer Response:
                  $ref: '#/components/examples/AU-Payment-Initiation-Response-Example'
                MX DFT Credit Transfer Response:
                  $ref: '#/components/examples/MX-DFT-Payment-Initiation-Response-Example'
                MX BKT Credit Transfer Response:
                  $ref: '#/components/examples/MX-BKT-Payment-Initiation-Response-Example'
                AR IP Credit Transfer Response:
                  $ref: '#/components/examples/AR-IP-Payment-Initiation-Response-Example'
                UK BACS Credit Transfer Response:
                  $ref: '#/components/examples/UK-BACS-Initiation-Response-Example'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        default:
          $ref: '#/components/responses/Internal-Server-Error'
    get:
      tags:
      - Payments
      summary: Inquire for the latest status of transations matching additional parameters
      description: '-Get the latest statuses of payment transactions using matching criteria. Currently, you can get the latest transactions statuses up to 90 days from the payment initiation date. If the latest transactions statuses date is 90+ days old, the endpoint responds with HTTP status 404 (not found).

        -You can use this endpoint to pull the transactions of all payment methods that includes Wires, ACH, and IP. For ACH and Wires, use the end_to_end_id to pull the transactions.'
      operationId: findPayments
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: Your unique identification, same as the identification you use for OAuth token generation, Citi shared with you during your CitiConnect API onboarding
        example: 6d3cf821-db6d-496d-bec0-064a362e9c31
      - name: encrypted-params
        in: header
        description: 'Encrypt the key values as below. Debtor account or creditor account is mandatory.



          * **debtor_account:** Your Citi account for instant payment (debit) / outgoing


          * **creditor_account:** Your Citi account for instant payment (credit) / incoming


          * **debtor_proxy_id:** Debtor proxy identification - For US RTP Instant Payment - debtor_proxy_id header param is not applicable


          * **creditor_proxy_id:** Creditor proxy identification - For US RTP Instant Payment - creditor_proxy_id header param is not applicable


          * **debtor_virtual_account:** Your Citi virtual account for instant payment (debit) / outgoing - For US RTP Instant Payment - debtor_virtual_account header param is not applicable


          * **creditor_virtual_account:** Your Citi virtual account for instant payment (credit) / incoming - For US RTP Instant Payment - creditor_virtual_account header param is not applicable


          ***Sample header before encryption:*** {"debtor_account":"3001386964","creditor_proxy_id":"a93d@gmail.com"}

          '
        schema:
          type: string
          pattern: \w*\W*
          example: eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMTI4Q0JDLUhTMjU2In0.D4yD0xv7xuoy_YmFaz29dz85QejaLNI9EtlsiOIAP4v6v4hVFwHLx_Ad_pZoLNhc6lx_H2YPnxUcMem76UkO6kjQ849azAnC7WLAxlm_ytMCmuTsZTkhBoX3BHsgD4nmQ-6QhpklVmH8nz3czk6HVmJ5BYrtA6Q4N96bCaCCYkEDCrPLK6NHmTyBeKmRIe6LBzmia6Ct20ovHCU-juj_YPBsQGfqrMTrdSDInts_5DbmL49Q1eDRAeuU7vcSgl_ROJ54BHo-XwiZFuvUUXt5NIP4wxF0phoJ4oWk9VyFIgt29wG2Lht2WX5_0S8KIve9sBoOZIYHylK6YkUTk6FXMg.2hlCJTgnxZRsIqXwDhiMtg.X8HL_J5q9v7UQ-PX_JadGRte2grVQjbZ2Ep2k3kSKmjVuOam4OyZ8I429o-2xNHT9XrcH1RdNMfKC4QhfrtFXYlf39BzAmP89IWRilH_ez-HRy4CoainozRO0SjRzB2ZWgOQvr2J3UkvriHSLfYJEqA7reXcEWvifaISe-c_eh_zWaCqEOfe53oTPlcyjl9_lXGaIm07GMT-JQuPkYTDRVG2cV41bYAfrDjJFtbTwM7RAy0LAAtZxLCyRE5s8AHyFqsp6D_xtq5sjjy2UnfmMSp1sDwA0uwmAWNrH1orgr7JaPxzRa3zSIEeMoUN4SnAMwLPYhI65LnvdQjRo91M_ttqEr1CGJ1B_qkw9wSRV0rwe3Gmq12NmGLIe-khMPDXezI3toVY5urd8XeFMhqUeZBwzkR2NQvqTN3wOwgB_sMyG_Q27-LwwIXKDNxmGhZErLV73228dD2qSfiBwpGtEPz-keiN0cTFQJj4GM5ZrKNfx2Q_PDJZdP3eVDcUelpJooRiCl2DKWhNmBFQ4haGoVUSj6g88V_7_I6RQHC4s3EEG3rlVaoutzwyjrfp05vGg_8FiIcocGXnbUrBQa8-ZQ.K2RGIyBtuBoCfoDACIOYrA
      - name: end_to_end_id
        in: query
        description: Transaction identification provided by the debtor
        schema:
          $ref: '#/components/schemas/Restricted-Finx-Max-Text'
        examples:
          payment_transaction_details_1:
            value: 1L00IF2BCWUZF09
      - name: network_id
        in: query
        description: Transaction reference generated for or by a network (e.g., PromptPay)
        schema:
          type: string
          maxLength: 36
        examples:
          payment_transaction_details_1:
            value: '209323283934'
      - name: batch_id
        in: query
        description: Identification for your Citi account consolidated debit or credit posting for the transactions
        schema:
          type: string
          maxLength: 35
        examples:
          payment_transaction_details_1:
            value: '492084893'
      - name: creation_date_time_start
        in: query
        description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment (Debit) - Start of date time, generated by CitiConnect API, when CitiConnect API accepted a payment initiation after validation \n- Instant Payment (Credit) - Start of date time, either provided by the debtor bank or generated by Citi's transaction processing application, when a transaction was created"
        schema:
          $ref: '#/components/schemas/Iso-Normalised-Date-Time'
        examples:
          payment_transaction_details_1:
            value: '2022-09-13T08:23:49.114Z'
      - name: creation_date_time_end
        in: query
        description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment (Debit) - End of date time, generated by CitiConnect API, when CitiConnect API accepted a payment initiation after validation \n- Instant Payment (Credit) - End of date time, either provided by the debtor bank or generated by Citi's transaction processing application, when a transaction was created"
        schema:
          $ref: '#/components/schemas/Iso-Normalised-Date-Time'
        examples:
          payment_transaction_details_1:
            value: '2022-09-13T08:23:49.554Z'
      - name: instructed_amount
        in: query
        description: Instructed amount
        schema:
          type: number
          maximum: 1000000000000000
        examples:
          payment_transaction_details_1:
            value: 73945.27
      - name: settlement_amount
        in: query
        description: Settlement amount (e.g., after any currency exchange or charge on the instructed amount)
        schema:
          type: number
          maximum: 1000000000000000
        examples:
          payment_transaction_details_1:
            value: 50000.23
      - name: status_date_time_start
        in: query
        description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment - Start date time of the transaction status change (when CitiConnect API change the status of the transaction)"
        schema:
          $ref: '#/components/schemas/Iso-Normalised-Date-Time'
        examples:
          payment_transaction_details_1:
            value: '2022-09-13T08:23:49.224Z'
      - name: status_date_time_end
        in: query
        description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment - Start end time of the transaction status change (when CitiConnect API change the status of the transaction)"
        schema:
          $ref: '#/components/schemas/Iso-Normalised-Date-Time'
        examples:
          payment_transaction_details_1:
            value: '2022-09-13T08:23:49.331Z'
      - name: status_code
        in: query
        description: ISO 20022 transaction status code
        schema:
          type: string
          enum:
          - ACTC
          - PDNG
          - RJCT
          - ACCC
          - ACWP
        examples:
          payment_transaction_details_1:
            value: ACCC
      - name: debtor_account_last4
        in: query
        description: Last 4 digits of a debtor account in combination with your Citi creditor account
        examples:
          payment_transaction_details_1:
            value: '6373'
        schema:
          type: string
          pattern: ^[0-9]{4}$
      - name: creditor_account_last4
        in: query
        description: Last 4 digits of a creditor account number in combination with your Citi debtor account
        examples:
          payment_transaction_details_1:
            value: 0783
        schema:
          type: string
          pattern: ^[0-9]{4}$
      - $ref: '#/components/parameters/Off-Set-Param'
      - $ref: '#/components/parameters/Limit-Param'
      security:
      - oAuth2:
        - paymentservices
      responses:
        '200':
          description: Payment status
          headers:
            request_id:
              schema:
                type: string
              description: Citi's unique identification for your request
            result:
              schema:
                type: integer
                minimum: 1
                maximum: 1000
                default: 100
              description: Number of transaction status matching your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments-Response'
              examples:
                TH Status - Completed:
                  $ref: '#/components/examples/Ok-Response-Multiple'
                TH Status - Rejected:
                  $ref: '#/components/examples/Ok-Response-Failed-Multiple'
                US Status - Completed:
                  $ref: '#/components/examples/Us-Ok-Response-Multiple'
                US Status - Rejected:
                  $ref: '#/components/examples/Us-Ok-Response-Failed-Multiple'
                IN Status - Completed:
                  $ref: '#/components/examples/In-Ok-Response-Multiple'
                IN Status - Rejected:
                  $ref: '#/components/examples/In-Ok-Response-Failed-Multiple'
                IN UPI Status - Completed:
                  $ref: '#/components/examples/In-Upi-Ok-Response-Multiple'
                IN UPI Status - Rejected:
                  $ref: '#/components/examples/In-Upi-Ok-Response-Multiple-Failed'
                IN IMPS Fir Status - Completed:
                  $ref: '#/components/examples/In-Imps-Fir-Ok-Response-Multiple'
                IN IMPS Fir Status - Rejected:
                  $ref: '#/components/examples/In-Imps-Fir-Ok-Response-Multiple-Failed'
                UK FPS Status - Completed:
                  $ref: '#/components/examples/Uk-Ok-Response-Multiple'
                Uk FPS Status - Rejected:
