            * ADVP  - AdvisingParty 

            * ANYB  - AnyBank 

            * APPL  - Applicant 

            * BENE  - Beneficiary 

            * CONF  - ConfirmationParty 

            * CUB2  - SecondCounterUndertakingBeneficiary 

            * CUB3  - ThirdCounterUndertakingBeneficiary 

            * ISSU  - Issuer 

            * OBLG  - Obligor 

            * ORDR  - OrderingParty 

            * PRES  - PresentingParty 

            * SADV  - SecondAdvisingParty 

            * SPEC  - SpecifiedAddress


            If code is different from the above code list, then a bilaterally
            agreed code may be used.  MT Mapping: field 71D"
        charges_account:
          $ref: '#/components/schemas/AccountIdentificationChoice'
        charge_amount:
