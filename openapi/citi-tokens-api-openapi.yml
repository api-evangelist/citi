openapi: 3.2.0
info:
  title: Payment Acceptance Tokens API
  description: 'Payment Acceptance API

    Update - April 28, 2026'
  contact:
    name: Standards & Developer Hub
    url: https://tts.sandbox.developer.citi.com/citiconnect/
    email: developer-support@citi.com
  version: 1.0.0
servers:
- url: https://tts.apib2b.citi.com/citiconnect/prod
  description: production gateway URL
- url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb
  description: sbox URL
- url: https://tts.sit.apib2b.citi.com/citiconnect/uat
  description: uat URL
tags:
- name: Tokens
  description: Tokens API
paths:
  /digitalpayments/v1/payment-acceptance/tokens:
    post:
      tags:
      - Tokens
      summary: Create a Tokenization request
      description: This endpoint validates your request and synchronously responds with HTTP status 202 (accepted) after successful validation. If validation fails, the endpoint synchronously responds with error (HTTP status 4XX / 5XX and any applicable reason code), indicating Citi couldn't accept your tokenization creation request.
      operationId: tokenize
      parameters:
      - $ref: '#/components/parameters/Client-Id'
      - $ref: '#/components/parameters/Idempotency-Id'
      - $ref: '#/components/parameters/Merchant-Token-Id'
      - $ref: '#/components/parameters/Value-Added-Services'
      requestBody:
        description: Create Tokenization request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tokenization-Create-Request'
            examples:
              Citi_Token_Create_Request:
                $ref: '#/components/examples/Citi-Token-Create-Request-Example'
              Network_Token_Create_Request:
                $ref: '#/components/examples/Network-Token-Create-Request-Example'
              Account_Updater_Create_Request:
                $ref: '#/components/examples/Account-Updater-Token-Create-Request-Example'
      security:
      - clientCredentials: []
      callbacks:
        tokenization-create-request-status:
          $ref: '#/components/callbacks/Tokenization-Create-Request-Status'
      responses:
        '202':
          $ref: '#/components/responses/Request-Accepted'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '429':
          $ref: '#/components/responses/Rate-Limit-Exceeded'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        '504':
          $ref: '#/components/responses/Gateway-Timeout'
        default:
          $ref: '#/components/responses/Internal-Server-Error'
    get:
      tags:
      - Tokens
      summary: Retrieve token details
      description: Get the latest statuses of tokenization using matching criteria. Currently, you can get the latest tokenization statuses up to 90 days from the token creation date. If the tokenization statuses date is 90+ days old, the endpoint responds with HTTP status 404 (not found).
      operationId: getToken
      parameters:
      - $ref: '#/components/parameters/Client-Id'
      - $ref: '#/components/parameters/Get-Token-Id'
      - $ref: '#/components/parameters/Merchant-Id'
      security:
      - clientCredentials: []
      responses:
        '200':
          description: Token status
          headers:
            apim-guid:
              schema:
                type: string
              description: Citi's unique identification for your request
            result:
              schema:
                type: integer
                minimum: 1
                maximum: 1000
                default: 100
              description: Number of transaction status matching your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token-Response'
              examples:
                Token-Status:
                  $ref: '#/components/examples/Token-Retrieve-Status'
        '400':
          $ref: '#/components/responses/Bad-Get-Request2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '429':
          $ref: '#/components/responses/Rate-Limit-Exceeded'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        '504':
          $ref: '#/components/responses/Gateway-Timeout'
    patch:
      tags:
      - Tokens
      summary: Token Update Request
      description: This endpoint validates your request and synchronously responds with HTTP status 202 (accepted) after successful validation. If validation fails, the endpoint synchronously responds with error (HTTP status 4XX / 5XX and any applicable reason code), indicating Citi couldn't accept your tokenization update request.
      operationId: updateToken
      parameters:
      - $ref: '#/components/parameters/Client-Id'
      - $ref: '#/components/parameters/Idempotency-Id'
      - $ref: '#/components/parameters/Merchant-Token-Id'
      requestBody:
        description: Token Update Request.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Token-Update-Request'
            examples:
              Token_Update_Request:
                $ref: '#/components/examples/Token-Delete-Request-Example'
      security:
      - clientCredentials: []
      callbacks:
        token-update-request-status:
          $ref: '#/components/callbacks/Token-Update-Request-Status'
      responses:
        '202':
          $ref: '#/components/responses/Request-Accepted'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '429':
          $ref: '#/components/responses/Rate-Limit-Exceeded'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        '504':
          $ref: '#/components/responses/Gateway-Timeout'
    delete:
      tags:
      - Tokens
      summary: Token Delete Request
      description: This endpoint validates your request and synchronously responds with HTTP status 202 (accepted) after successful validation. If validation fails, the endpoint synchronously responds with error (HTTP status 4XX / 5XX and any applicable reason code), indicating Citi couldn't accept your tokenization update request.
      operationId: deleteToken
      parameters:
      - $ref: '#/components/parameters/Client-Id'
      - $ref: '#/components/parameters/Get-Token-Id'
      - $ref: '#/components/parameters/Merchant-Id'
      - $ref: '#/components/parameters/Value-Added-Services'
      security:
      - clientCredentials: []
      callbacks:
        token-delete-request-status:
          $ref: '#/components/callbacks/Token-Delete-Request-Status'
      responses:
        '202':
          $ref: '#/components/responses/Request-Accepted'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '429':
          $ref: '#/components/responses/Rate-Limit-Exceeded'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        '504':
          $ref: '#/components/responses/Gateway-Timeout'
components:
  schemas:
    Tokenization:
      type: object
      title: Tokenization
      properties:
        customer:
          $ref: '#/components/schemas/Tokenization-Request-Customer'
        id:
          description: Request Id
          type: string
          minLength: 1
          maxLength: 128
          example: ABC123456
          title: id
        status:
          type: string
          enum:
          - SUCCESS
          - FAILED
          description: Transaction Status
          title: status
        value_added_services:
          type: array
          items:
            type: string
            description: Value added services like CITI_TOKEN, NETWORK_TOKEN and ACCOUNT_UPDATER
            title: value_added_services
        description:
          type: string
          minLength: 1
          maxLength: 200
          description: "Status Description \n- SUCCESS - Network Token Activated \n- FAILED - Network Token Creation Failed"
          title: description
        reason_code:
          description: Tokenization rejection Code
          example: SC0020
          maxLength: 100
          minLength: 1
          type: string
          title: reason_code
        method:
          $ref: '#/components/schemas/Tokenization-Create-Status-Method-Notification'
        card:
          $ref: '#/components/schemas/Tokenization-Create-Status-Card-Notification'
        billing_address:
          $ref: '#/components/schemas/Tokenization-Create-Status-Billing_Address-Notification'
    Token-Response:
      type: array
      items:
        $ref: '#/components/schemas/Tokenization'
    Token-Update-Request-Customer:
      title: Customer Update
      type: object
      required:
      - id
      properties:
        id:
          description: "Customer ID \n- For token id update request, customer_id parameter becomes mandatory when billing_address parameters was not provided by client in the payload request."
          minLength: 1
          maxLength: 40
          type: string
          example: ABC12345
          title: id
        first_name:
          description: Customer's first name
          minLength: 1
          maxLength: 50
          type: string
          example: John
          title: Customer first name
        last_name:
          description: Customer's last name
          minLength: 1
          maxLength: 50
          type: string
          example: Karl
          title: Customer last name
    Tokenization-Create-Status-Billing_Address-Notification:
      title: Billing Address
      type: object
      properties:
        company:
          description: Company Name
          type: string
          minLength: 1
          maxLength: 100
          example: ABC Inc
          title: company
        city:
          description: Customer City Name
          type: string
          minLength: 1
          maxLength: 100
          example: New York
          title: city
        state:
          description: Customer State Name
          type: string
          minLength: 1
          maxLength: 20
          example: California
          title: state
        postal_code:
          description: Customer Postal code
          type: string
          minLength: 1
          maxLength: 10
          example: '33610'
          title: postal_code
        country_code:
          description: Customer Country code
          type: string
          pattern: ^[A-Z]{3,3}$
          example: USA
          title: country_code
        email:
          description: "Customer Email \n- Email address must be longer than 3 characters and adheres to a generous subset of valid RFC 2822 email addresses"
          type: string
          minLength: 3
          example: sca@citi.com
          title: email
        phone:
          description: "Customer Phone number \n- Data consists of '+', country code (1, 2 or 3 digits), 'space', and national number (which may embed single space characters for readability)"
          example: '+919962125789'
          pattern: \+[0-9]{1,3}[-\ ][0-9()+\-]{1,30}
          type: string
          title: phone
        lines:
          description: Billing Addres details
          type: array
          minItems: 1
          maxItems: 7
          items:
            $ref: '#/components/schemas/Token_Lines'
          title: lines
    Tokenization-Create-Request-Customer:
      title: Customer
      type: object
      required:
      - id
      properties:
        id:
          description: Customer ID
          minLength: 1
          maxLength: 40
          type: string
          example: ABC12345
          title: id
        first_name:
          description: Customer's first name
          minLength: 1
          maxLength: 50
          type: string
          example: John
          title: Customer first name
        last_name:
          description: Customer's last name
          minLength: 1
          maxLength: 50
          type: string
          example: Karl
          title: Customer last name
    Token-Update-Request-Notification:
      type: object
      title: Tokenization-Create-Request-Notification
      required:
      - id
      - customer
      - status
      - description
      - method
      properties:
        id:
          description: Request Id
          type: string
          minLength: 1
          maxLength: 128
          example: ABC123456
          title: id
        customer:
          $ref: '#/components/schemas/Token-Update-Request-Customer-Notification'
        status:
          type: string
          enum:
          - SUCCESS
          - FAILED
          description: Transaction Status
          title: status
        description:
          type: string
          minLength: 1
          maxLength: 200
          description: "Status Description \n- SUCCESS - Token is succesfully deleted \n- FAILED - Token deletion request is failed"
          title: description
        reason_code:
          description: Tokenization rejection Code
          example: SC0020
          maxLength: 100
          minLength: 1
          type: string
          title: reason_code
        method:
          $ref: '#/components/schemas/Token-Delete-Request-Method-Notification'
        billing_address:
          $ref: '#/components/schemas/Tokenization-Update-Request-Billing_Address'
        card:
          $ref: '#/components/schemas/Tokenization-Create-Status-Card-Notification'
    Token_Lines:
      type: string
      maxLength: 70
      minLength: 1
      description: Address Lines
      title: lines
    Tokenization-Create-Request-Billing_Address:
      title: billing_address
      type: object
      properties:
        company:
          description: Company Name
          type: string
          minLength: 1
          maxLength: 100
          example: ABC Inc
          title: company
        city:
          description: Customer City Name
          type: string
          minLength: 1
          maxLength: 100
          example: New York
          title: city
        state:
          description: Customer State Name
          type: string
          minLength: 1
          maxLength: 35
          example: California
          title: state
        postal_code:
          description: Customer Postal code
          type: string
          minLength: 1
          maxLength: 16
          example: '33610'
          title: postal_code
        country_code:
          description: Customer Country code
          type: string
          pattern: ^[A-Z]{2,2}$
          example: US
          title: country_code
        email:
          description: "Customer Email \n- Email address must be longer than 3 characters and adheres to a generous subset of valid RFC 2822 email addresses"
          example: customer.raj2024@gmail.com
          type: string
          pattern: '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$'
          title: email
        phone:
          description: "Customer Phone number \n- Data consists of '+', country code (1, 2 or 3 digits), 'space', and national number (which may embed single space characters for readability)"
          example: '+919962125789'
          pattern: \+[0-9]{1,3}[-\ ][0-9()+\-]{1,30}
          type: string
          title: phone
        lines:
          type: array
          minItems: 1
          maxItems: 7
          items:
            $ref: '#/components/schemas/Token_Lines'
    Token-Delete-Request-Method-Notification:
      title: method
      type: object
      required:
      - type
      - id_type
      - token_id
      properties:
        type:
          description: Payment Method Type
          type: string
          enum:
          - CARD
          - ACH
          - SEPA
          example: CARD
          title: type
        id_type:
          description: Personally Identifiable Information
          type: string
          enum:
          - CARD_NUMBER
          - ACCOUNT_NUMBER
          - IBAN
          - CITI_TOKEN
          example: IBAN
          title: id_type
        token_id:
          description: Token id generated/updated by VGS
          type: string
          minLength: 1
          maxLength: 50
          example: Create0618token02
          title: token_id
        session_id:
          description: Session identification number
          type: string
          minLength: 36
          maxLength: 37
          example: SES1234567890123456789012345678
          title: session_id
    Tokenization-Request-Customer:
      title: Customer Get
      type: object
      required:
      - id
      properties:
        id:
          description: Customer ID
          minLength: 1
          maxLength: 40
          type: string
          example: ABC12345
          title: id
        first_name:
          description: Customer's first name
          minLength: 1
          maxLength: 50
          type: string
          example: John
          title: Customer first name
        last_name:
          description: Customer's last name
          minLength: 1
          maxLength: 50
          type: string
          example: Karl
          title: Customer last name
    Error-Response:
      type: object
      title: Error Response
      properties:
        ref_id:
          type: string
          maxLength: 60
          description: Unique ID for the Transaction
          title: ref_id
        error_details:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Error-Detail'
    Tokens-Response:
      type: object
      title: Tokens Response
      properties:
        id:
          type: string
          maxLength: 128
          description: Unique reference number
          example: pay02052023456r
          title: id
        status:
          type: string
          maxLength: 10
          description: The request has successfully been created.
          enum:
          - CREATED
          example: CREATED
          title: status
        description:
          type: string
          maxLength: 200
          description: more information about the status
          example: The request has successfully been created
          title: description
    Gateway-Error-Response:
      type: object
      title: GatewayErrorResponse
      properties:
        httpCode:
          type: string
          maxLength: 3
          description: Numeric HTTP Staus code
          title: httpCode
        httpMessage:
          type: string
          maxLength: 128
          description: HTTP error message
          title: httpMessage
        moreInformation:
          type: string
          maxLength: 128
          description: HTTP error message
          title: httpMessage
    Error-Detail:
      type: object
      title: Error Detail
      properties:
        issue:
          type: string
          maxLength: 150
          description: more details about the issue
          title: issue
        action:
          type: string
          maxLength: 150
          description: corrective action to be taken to resolve above issue
          title: action
        code:
          type: string
          maxLength: 10
          description: unique code representing the issue
          title: code
    Token-Update-Request:
      type: object
      title: Token Update request
      required:
      - method
      - id
      properties:
        customer:
          $ref: '#/components/schemas/Token-Update-Request-Customer'
        method:
          $ref: '#/components/schemas/Token-Update-Request-Method'
        id:
          description: Request_Id
          type: string
          minLength: 1
          maxLength: 128
          example: ABC123456
          title: id
        billing_address:
          $ref: '#/components/schemas/Tokenization-Update-Request-Billing_Address'
    Tokenization-Create-Status-Customer-Notification:
      title: customer
      type: object
      required:
      - id
      properties:
        id:
          description: Customer ID
          minLength: 1
          maxLength: 40
          type: string
          example: ABC12345
          title: id
        first_name:
          description: Customer's first name
          minLength: 1
          maxLength: 50
          type: string
          example: John
          title: Customer first name
        last_name:
          description: Customer's last name
          minLength: 1
          maxLength: 50
          type: string
          example: Karl
          title: Customer last name
    Tokenization-Create-Request-Card:
      title: card
      type: object
      description: Card object is mandatory for Citi token ID creation, if method.type is selected as CARD
      properties:
        number:
          description: "Card Number that needs to be tokenized \n- For Network token ID creation, card.number parameter becomes mandatory when client is not provided method.token_id parameter in the payload request."
          type: string
          minLength: 9
          maxLength: 23
          example: '4012000033330026'
          title: number
        name_on_card:
          description: "Payer's name as given on the card \n- For Network token ID creation, card.name_on_card parameter becomes mandatory when client is not provided method.token_id parameter in the payload request."
          type: string
          minLength: 1
          maxLength: 50
          example: ROGER WOOD
          title: name_on_card
        expiry_month:
          description: "Two-digit month in which the payment card expires \n- For Network token ID creation, card.expiry_month parameter becomes mandatory when client is not provided method.token_id parameter in the payload request."
          example: '01'
          type: string
          pattern: ^(0?[1-9]|1[0-2])$
          title: expriry_month
        expiry_year:
          description: "Two-digit year in which the payment card expires \n- For Network token ID creation, card.expiry_year parameter becomes mandatory when client is not provided method.token_id parameter in the payload request."
          type: string
          pattern: ^[0-9]{2,2}$
          example: '25'
          title: expiry_year
    Token-Delete-Request-Notification:
      type: object
      title: Tokenization-Create-Request-Notification
      required:
      - customer
      - status
      - description
      - method
      properties:
        customer:
          $ref: '#/components/schemas/Token-Delete-Request-Customer-Notification'
        status:
          type: string
          enum:
          - SUCCESS
          - FAILED
          description: Transaction Status
          title: status
        description:
          type: string
          minLength: 1
          maxLength: 200
          description: "Status Description \n- SUCCESS - Token is succesfully deleted \n- FAILED - Token deletion request is failed"
          title: description
        reason_code:
          description: Tokenization rejection Code
          example: SC0020
          maxLength: 100
          minLength: 1
          type: string
          title: reason_code
        method:
          $ref: '#/components/schemas/Token-Delete-Request-Method-Notification'
        card:
          $ref: '#/components/schemas/Tokenization-Create-Status-Card-Notification'
    Token-Update-Request-Method:
      title: method
      type: object
      required:
      - type
      - id_type
      - token_id
      properties:
        type:
          description: Payment Method Type
          type: string
          enum:
          - CARD
          - ACH
          - SEPA
          example: CARD
          title: type
        id_type:
          description: Personally Identifiable Information
          type: string
          enum:
          - CARD_NUMBER
          - ACCOUNT_NUMBER
          - IBAN
          - CITI_TOKEN
          example: IBAN
          title: id_type
        token_id:
          description: Token id
          type: string
          minLength: 1
          maxLength: 50
          example: Create0618token02
          title: token_id
    Tokenization-Create-Status-Notification:
      type: object
      title: Tokenization-Create-Status-Notification
      required:
      - id
      - customer
      - status
      - description
      - method
      properties:
        id:
          description: Request Id
          type: string
          minLength: 1
          maxLength: 128
          example: ABC123456
          title: id
        customer:
          $ref: '#/components/schemas/Tokenization-Create-Status-Customer-Notification'
        status:
          type: string
          enum:
          - SUCCESS
          - FAILED
          description: Transaction Status
          title: status
        description:
          type: string
          minLength: 1
          maxLength: 200
          description: "Status Description \n- SUCCESS - Citi Token Created \n- FAILED - Citi Token Creation Failed"
          title: description
        reason_code:
          description: Tokenization rejection Code
          example: SC0020
          maxLength: 100
          minLength: 1
          type: string
          title: reason_code
        billing_address:
          $ref: '#/components/schemas/Tokenization-Create-Status-Billing_Address-Notification'
        method:
          $ref: '#/components/schemas/Tokenization-Create-Status-Method-Notification'
        card:
          $ref: '#/components/schemas/Tokenization-Create-Status-Card-Notification'
        card_old:
          $ref: '#/components/schemas/Tokenization-Create-Status-Card-Notification'
    Tokenization-Create-Request:
      title: Create Token Request
      type: object
      required:
      - customer
      - method
      - id
      properties:
        customer:
          $ref: '#/components/schemas/Tokenization-Create-Request-Customer'
        method:
          $ref: '#/components/schemas/Tokenization-Create-Request-Method'
        id:
          description: Request Id
          type: string
          minLength: 1
          maxLength: 128
          example: ABC123456
          title: id
        card:
          $ref: '#/components/schemas/Tokenization-Create-Request-Card'
        billing_address:
          $ref: '#/components/schemas/Tokenization-Create-Request-Billing_Address'
    Token-Delete-Request-Customer-Notification:
      title: Customer Update
      type: object
      required:
      - id
      properties:
        id:
          description: Customer ID
          minLength: 1
          maxLength: 40
          type: string
          example: ABC12345
          title: id
    Token-Update-Request-Customer-Notification:
      title: Customer Update
      type: object
      required:
      - id
      properties:
        id:
          description: Customer ID
          minLength: 1
          maxLength: 40
          type: string
          example: ABC12345
          title: id
        first_name:
          description: Customer's first name
          minLength: 1
          maxLength: 50
          type: string
          example: John
          title: Customer first name
        last_name:
          description: Customer's last name
          minLength: 1
          maxLength: 50
          type: string
          example: Karl
          title: Customer last name
    Tokenization-Create-Status-Card-Notification:
      title: card
      type: object
      properties:
        number:
          description: Card Number that needs to be tokenized
          type: string
          minLength: 9
          maxLength: 23
          example: '4012000033330026'
          title: number
        name_on_card:
          description: Payer's name as given on the card
          type: string
          minLength: 1
          maxLength: 50
          example: ROGER WOOD
          title: name_on_card
        expiry_month:
          description: Two-digit month in which the payment card expires
          example: '01'
          type: string
