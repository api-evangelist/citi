    PartyIdentificationDetail:
      required:
        - type
      type: object
      properties:
        type:
          maxLength: 4
          minLength: 4
          type: string
          description: "Type of Party can be either  - a code from the list published on ISO20022.org as part of external code sets OR - if code is different from the ISO code list (mentioned above), then a bilaterally agreed code may be used  RULE: MANDATORY to include one iteration of Party for Applicant and another one for Beneficiary.\n\nCode Name Definition:\n\n* ADVP - AdvisingParty - Party advising the undertaking.  \n* ANYB - AnyBank - Any bank.  \n* APPL - Applicant - Party named in the undertaking as the â€œapplicantâ€\x9D.\n* BENE - Beneficiary - Party in whose favour the undertaking (or counter-undertaking) is issued.  \n* CONF - ConfirmationParty - Party that adds its undertaking to honour the undertaking.  \n* CUB2 - SecondCounterUndertakingBeneficiary - Beneficiary of the second counter-undertaking.  \n* CUB3 - ThirdCounterUndertakingBeneficiary - Beneficiary of the third counter-undertaking.  \n* ISSU - Issuer - Party that issues the undertaking (or counter-undertaking).\n* OTHR - Other - Party not part of the list of codes.\n* OBLG - Obligor - Party obligated to reimburse the issuer.   \n* ORDR - OrderingParty - Party requested to issue an undertaking on behalf of the applicant. Also known as the ordering institution or applicant''s bank.  \n* PRES - PresentingParty - Party nominated to receive presentation.   \n* SADV - SecondAdvisingParty - Second advising party.  \n* SPEC - SpecifiedAddress - Party located at specified address.\n\nMT Mapping: Party fields like 50, 51, 52a, 59a, 56a, 57a'\n"
        identification:
          maxLength: 35
          minLength: 1
          type: string
          description: |
            Unique and unambiguous identifier assigned by the party.

            Usage :- This field is Mandatory for Applicant and Beneficiary only
        issuer:
          maxLength: 35
          minLength: 1
          type: string
          description: Not applicable.
        any_bic:
          $ref: '#/components/schemas/AnyBICDec2014Identifier'
        lei:
          pattern: ^[A-Z0-9]{18,18}[0-9]{2,2}$
          type: string
          description: Legal entity identifier of the financial institution.
          x-MXComponent: LEIIdentifier
        name:
          maxLength: 35
          minLength: 1
          type: string
          description: >-
            Name by which a party is known and which is usually used to identify
            that party.   RULE: If AnyBIC is absent then Name is mandatory and
            it is recommended to also provide the Postal Address.  RULE: If
            Postal Address is present then Name is mandatory.  MT Mapping: Name
            from fields 50, 51, 52a, 59a, 56a, 57a.
          x-MTComponent: RestrictedFINXMax35Text
        address_line:
          maxItems: 3
          type: array
          description: >-
            Information that locates and identifies a specific address, as
            defined by postal services, presented in free format text.   It is
            recommended to use dedicated elements like TownName,
            CountrySubDivision, PostCode, Country etc. as much as possible.  MT
            Mapping: Address from fields 50, 51, 52a, 59a, 56a, 57a.
          items:
            maxLength: 35
            minLength: 1
            type: string
            x-MTComponent: RestrictedFINXMax35Text
        country:
          $ref: '#/components/schemas/CountryCode'
        contact_name:
          maxLength: 35
          minLength: 1
          type: string
          description: >-
            Name by which a party is known and which is usually used to identify
            that party. Part of a set of elements used to indicate how to
            contact the party.
          x-MTComponent: RestrictedFINXMax35Text
        contact_phone_number:
          $ref: '#/components/schemas/PhoneNumber'
        contact_email_address:
          type: string
          description: >-
            Address for electronic mail (e-mail). Part of a set of elements used
