    Device-Response:
      title: Device Response
      description: Device Response
      properties:
        cryptogram_format:
          description: The format of the cryptogram provided for the digital payment.
          enum:
            - 3DSECURE
            - EMV
          example: EMV
          type: string
          title: cryptogram_format
    Card:
      title: card
      description: >-

        - For CARD Authorize operation method.card parameter is mandatory when
        method.type parameter is selected as CARD 

        - For CARD Capture operation method.card parameter is mandatory when
        method.type parameter is selected as CARD 

        - For CARD Pay operation method.card parameter is mandatory when
        method.type parameter is selected as CARD 

        - For CARD Verify operation method.card parameter is mandatory when
        method.type parameter is selected as CARD
      properties:
        number:
          description: >-
            The customer’s payment card number, also known as the Primary
            Account Number (PAN). 

            - For CARD Authorize operation method.card.number parameter is
            mandatory  

            - For CARD Pay operation method.card.number parameter is mandatory 

            - For CARD Verify operation method.card.number parameter is
            mandatory 

            - For India card transaction, method.card.number parameter is
            mandatory when token number is not provided
          example: PA123456789
          maxLength: 23
          minLength: 9
          type: string
          title: number
        expiry_month:
          description: >-
            Two-digit month in which the payment card expires.  

            - For CARD Authorize operation method.card.expiry_month parameter is
            mandatory 

            - For CARD Pay operation method.card.expiry_month parameter is
            mandatory 

            - For CARD Verify operation method.card.expiry_month parameter is
            mandatory 

            - For India card transaction, method.card.expiry_month parameter is
            mandatory
          example: '01'
          type: string
          pattern: ^(0?[1-9]|1[0-2])$
          title: expiry_month
        expiry_year:
          description: >-
            Four-digit year in which the payment card expires. 

            - For CARD Authorize operation method.card.expiry_year parameter is
            mandatory 

            - For CARD Pay operation method.card.expiry_year parameter is
            mandatory 

            - For CARD Verify operation method.card.expiry_year parameter is
            mandatory 

            - For India card transaction, method.card.expiry_year parameter is
            mandatory
          type: string
          pattern: ^[0-9]{2,2}$
          example: '25'
          title: expiry_year
        cvv:
          description: |-
            Card security code. 
            - For India card transaction, method.card.cvv parameter is mandatory
          example: '311'
          maxLength: 4
          minLength: 3
          type: string
          title: cvv
        type:
          description: >-
            You can provide this parameter for card types that have a
            savings/checking option, such as Maestro cards.If you do not provide
            a value, we will use the acquirer's default. You can use
            paymentTypes.card.cardTypes in the 'Retrieve Payment Options'
            operation response to determine the card type.
          enum:
            - CHECKING
            - SAVINGS
          example: SAVINGS
          type: string
          title: type
        card_type:
          description: >-
            This parameter is only applicable if the gateway has identified the
            card as a co-branded card.
          example: JOHN
          maxLength: 50
          minLength: 3
          type: string
          title: card_type
        last_4_digits:
          description: >-
            The customer’s payment card last four number. 

            - For India card transaction, method.card.last_4_digits parameter is
            mandatory when token number is provided
          example: '1234'
          maxLength: 4
          minLength: 4
          type: string
          title: last_4_digits
        cryptogram:
          description: >-
            The card cryptogram details. 

            - For India card transaction, method.card.cryptogram parameter is
            mandatory when token number is provided and allowed maximum length
            is 50.
          example: PA123456789
          maxLength: 50
          minLength: 1
          type: string
          title: cryptogram
        diner_token_reference:
          description: The card diner token reference.
          example: PA123456789
          maxLength: 50
          minLength: 1
          type: string
          title: diner_token_reference
        diner_merchant_id:
          description: The card diner merchant id.
          example: ADFEGTYYUU
          maxLength: 50
          minLength: 1
          type: string
          title: diner_merchant_id
        device:
          $ref: '#/components/schemas/Device'
