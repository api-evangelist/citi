          maxLength: 128
          minLength: 1
          type: string
          description: >-
            Unique Transaction identification provided by the merchant during
            transaction refund creation. 

            - This parameter is mandatory for all payment type.
          example: pay02052023456r
          title: id
        amount:
          description: >-
            Transaction amount 
             - For Brazil QR Creation decimal values are mandatory for transaction.amount and it must have 2 digits 
             - For Brazil QR Creation maxmium amount limit is 9999999999.99 and transaction.amount parameter is mandatory 
            - For Card transaction, transaction.amount parameter is mandatory
            and allowed max 2 decimal after dot. 

            - This parameter is optional for ACH Return & Reversal.
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        reason_code:
          description: |-
            Transaction rejection Code.
            - This parameter is optional for ACH Return & Reversal.
          example: SC0020
          maxLength: 100
          minLength: 1
          type: string
          title: reason_code
        uetr:
          type: string
          pattern: >-
            ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          description: UUID v4 format unique end-to-end transaction reference
          title: uetr
          example: 4f09214d-296c-494b-8e9c-810bf1d9fc93
        value_date:
          type: string
          format: date
          description: >-
            Date in local time zone (e.g., EST for a United States RTP network
            transaction) when Citi's transaction processing application starts
            processing a transaction in format YYYY-MM-DD. 

            - This parameter is optional for ACH Return & Reversal.
          title: value_date
          example: '2024-05-30'
        currency_code:
          description: >-
            ISO 4217 Currency Code for instance  USD/GBP/EUR/INR 

            - transaction.currency_code parameter is mandatory for all
            transaction type creation
          enum:
            - BRL
            - USD
            - INR
            - GBP
            - EUR
            - CAD
            - HKD
            - AUD
            - SGD
            - DKK
            - NOK
            - SEK
            - PLN
            - IDR
            - MYR
            - THB
            - CHF
            - PHP
            - CZK
          example: BRL
          type: string
          title: currency_code
        country_code:
          description: |-
            Country code 
            - For ACH Return & Reversal, this parameter is mandatory.
          enum:
            - US
            - BR
            - IN
            - GB
            - TH
            - AU
            - CA
            - MX
            - DE
            - NL
            - IE
            - IT
            - FR
            - ES
            - HK
            - SG
            - NZ
            - DK
            - 'NO'
            - SE
            - SW
            - BE
            - FI
            - CH
            - CZ
            - AT
            - PT
          example: US
          type: string
          title: country_code
        reason:
          description: |-
            Cancellation/adjustment reason. 
            - This parameter is optional for ACH Return & Reversal.
          example: REPAY
          maxLength: 140
          minLength: 1
          type: string
          title: reason
        psp_reference:
          type: string
          maxLength: 36
          minLength: 1
          description: Payment session id
          example: PAY1234567
          title: psp_reference
        retrieval_reference_number:
          description: >-
            When a transaction registration succeeds, the value of this
            parameter contains the 44-digit number that was used to create the
            bar code on the Boleto slip. This bar code can then be scanned by
            the vendor if a payer elects to pay Boleto at a registered location.
          example: ACQ7894561
          maxLength: 100
          minLength: 1
          type: string
          title: retrieval_reference_number
        network_id:
          description: Transaction identification generated by the network (clearing)
          example: NET123456
          maxLength: 128
          minLength: 1
          type: string
          title: network_id
        creation_date_time:
          description: >-
            GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ)- Instant Payment (Debit) -
            Date time, generated by CitiConnect API, when CitiConnect API
            accepted a payment initiation after validation 

            - Instant Payment (Credit) - Date time, either provided by the
            debtor bank or generated by Citi's transaction processing
            application, when a transaction was created 

            - For ACH Return & Reversal, this parameter is optional (only for
            enquiry & intermediary notification).
          example: '2024-05-02T12:44:34.655Z'
          type: string
          format: date-time
          title: creation_date_time
        status:
          type: string
          maxLength: 20
          description: >-
            Transaction Status, following status you will receive in response 

            - CREATED - The transaction has successfully been created 

            - FAILED - Transaction failed for invalid payload/ Transaction
            failed 

            - SETTLED - Transaction settled 

            - PENDING - The operation is currently in progress or pending
            processing/ Transaction is in-progress 

            - SUCCESS - The operation was successfully processed 

            - UNKNOWN - The result of the operation is unknown
          example: SETTLED
          title: status
        description:
          type: string
          maxLength: 200
          description: >-
            Transaction Status, following status you will receive in response 

            - FAILED - Transaction failed for invalid payload/ Transaction
            failed 

            - PENDING - The operation is currently in progress or pending
            processing/ Transaction is in-progress 

            - SETTLED - Transaction settled 

            - SUCCESS - The operation was successfully processed (e.g., 

            - AM03 -Method instructed currency is invalid (not in ISO 4217
            format or value) 

            - AM02 -Instructed amount is not ≥ 0.01 & ≤ 2,000,000.00.

            - AC02 -Debtor account is invalid 

            - CH03 -Value date is in the future 

            - CH04 -Value date is in the past 

            - CH20 -Value-added tax (VAT) amount format is invalid 

            - CH21 -Bill identification 1 is mandatory for a bill payment,Bill
            identification 2 and 3 are conditional for a bill payment 

            - BE23 -Creditor mobile number (proxy identification) format is
            invalid 

            - NARR -Creditor name maximum length is 50 )
          example: Transaction settled
          title: description
        status_date_time:
          type: string
          format: date-time
          description: |-
            GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 
            - Date time of transaction status 
            - This parameter is optional for ACH Return & Reversal.
          title: status_date_time
        refund_type:
          type: string
          description: Refund Status P - Partial Refund F - Full Refund
          enum:
            - P
            - F
          title: refund_type
        authorization_response:
          $ref: '#/components/schemas/Authorization-Refund-Response'
        acquirer:
          $ref: '#/components/schemas/Acquirer-Refund-Response'
        response:
          $ref: '#/components/schemas/Response'
        acquirer_code:
          description: >-
            Indicates success or failure of the transaction registration. A
            value of 0 (zero) indicates success, and a value of 99 indicates
            failure.
          example: ACQ7894561
          maxLength: 100
          minLength: 1
          type: string
          title: acquirer_code
        reference:
          description: |-
            An optional identifier for this transaction 
            - This parameter is optional for ACH Return & Reversal.
          example: REPAY789541
          maxLength: 250
          minLength: 1
          type: string
          title: reference
        terminal:
          description: >-
            Identifier used by the acquirer to identify the transaction. This
            identifier may be used by the acquirer in settlement reports.
          example: ACQ7894561
          maxLength: 16
          minLength: 1
          type: string
          title: terminal
        update_time:
          type: string
          format: date-time
          description: >-
            Indicates the date and time the gateway considers the order to have
            last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ)
          example: '2022-09-13T08:23:49.114Z'
          title: update_time
        acquirer_message:
          description: >-
            An additional message indicating the success or failure of the
            transaction registration. If the registration was successful, this
            parameter contains the value Data Received. If the registration
            failed, this parameter contains the value Data Not Received.
          example: MSG12345
          maxLength: 255
          minLength: 1
          type: string
          title: acquirer_message
        refund_authorization:
          description: >-
            This parameter is used to indicate that you want the gateway to
            authorize the Refund with the issuer before submitting it to the
            acquirer. 
             - The transaction.refund_authorization parameter is optional for Card transaction.
          enum:
            - 'Y'
            - 'N'
          example: 'Y'
          type: string
          title: refund_authorization
        clearing_local_code:
          maxLength: 4
          minLength: 1
          type: string
          description: >-
            Reason local Clearing codes (e.g.0000,0080,0081,0082,0083,0084,1100
            and etc.).Additional status code received from the local clearing
            which does not follow ISO standards but will on some occasions
            provide additional insights. Codes will vary by country and will be
            published on our developer portal 

            - For UK it is an optional parameter with max length 4 

            - For US FedNow, it is an optional parameter with max length 4 

            - refer to FPS Error Code excel file for complete list of response
            codes and descriptions. 

            - This parameter is optional for ACH Return and Reversal.
          example: 008T
          title: clearing_local_code
        rrn:
          maxLength: 100
          minLength: 1
          type: string
          description: >-
            A unique reference generated by the acquirer for a specific merchant
            interaction The reference may be used when contacting the acquirer
            about a specific transaction
          example: 008T
          title: rrn
        stan:
          maxLength: 999999
          minLength: 1
          type: string
          description: >-
            The System Trace Audit Number (STAN) for the transaction The STAN is
            a unique trace number assigned by the gateway to identify the
            transaction message sent to the acquirer. It remains unchanged for
            the life of the transaction.
          example: '667799'
          title: stan
        authorization_code:
          maxLength: 100
          minLength: 1
          type: string
          description: >-
            Value generated by the issuing bank in response to a proposal to
            transfer funds
          example: '667'
          title: authorization_code
        source:
          description: >-
            Indicates the channel through which you received authorization for
            the payment for this order from the payer. 

            - CALL_CENTRE Transaction conducted via a call centre. 

            - CARD_PRESENT Transaction where the card is presented to the
            merchant. 

            - INTERNET Transaction conducted over the Internet. 

            - MAIL_ORDER Transaction received by mail. 

            - MERCHANT Transaction initiated by you based on an agreement with
            the payer. For example, a recurring payment, installment payment, or
            account top-up. 

            - MOTO Transaction received by mail or telephone. 

            - PAYER_PRESENT Transaction where a non-card payment method is
            presented to the Merchant. 

            - TELEPHONE_ORDER Transaction received by telephone.

            - VOICE_RESPONSE Transaction conducted by a voice/DTMF recognition
            system.
          enum:
            - CALL_CENTRE
            - CARD_PRESENT
            - INTERNET
            - MAIL_ORDER
            - MERCHANT
            - MOTO
            - PAYER_PRESENT
            - TELEPHONE_ORDER
            - VOICE_RESPONSE
          example: PAYER_PRESENT
          type: string
          title: source
        debit_credit_flag:
          type: string
          enum:
            - CR
            - DR
          description: |-
            Indicates if transaction is debit or credit 
            - This parameter is optional for ACH Return & Reversal.
          title: debit_credit_flag
        action:
          description: |-
            Indicates if this request is for Return or Reversal 
            - This parameter is optional for ACH Return & Reversal.
          enum:
            - RETURN
            - REVERSAL
          example: RETURN
          type: string
          title: action
        purpose:
          description: |-
            Purpose of transaction. 
            - This parameter is optional for ACH Return & Reversal.
          minLength: 1
          maxLength: 100
          type: string
          example: AWS Market
          title: purpose
