                description: 'The value date the order is being placed for. Required if tenor = ‘BROKEN’. Format: yyyyMMdd. By default, the valueDate rolls over to the next business day if it falls on a currency holiday. If auto rollover to the next business day is not required, notify your Citi Representative. The default setup will be disabled within the CitiFX Gateway. The configuration applies to all trades sent over API and cannot be customized at an individual trade level.'
                example: 20250525
              ccyPair:
                type: string
                description: "Please contact your Citi Salesperson to obtain a list of currency pairs currently supported by CitiFX Gateway.\nCitiFX Gateway can accept currency pairs in any of the below formats:\n  - Alpha Sorted\n  - BaseTerm\n  - Base/Term\n  - TermBase\n  - Term/Base\n\nNote: Specifying term first in the currency pair field does not signify an inverted quote. Inverted quote is not supported for FX Market Orders.\n"
                maxLength: 6
                example: GBPUSD
              dealtCcy:
                type: string
                description: The currency that you wish to deal on.
                maxLength: 3
                example: GBP
              orderQty:
                type: number
                description: The order quanitity of the dealt currency.
                example: 1000
              side:
                type: string
                enum:
                - B
                - S
                description: The Buy Or Sell Indicator from your perspective. B=Client buys dealt ccy S=Client sells dealt ccy.
                example: B
              transactTime:
                type: string
                description: The time of the transaction represented by this single order.
                example: Mon Apr 29 12:50:33 IST 2024
              purposeCode:
                type: string
                description: The purpose code for your branch if mandatory as per regulation in your branch.
              customRemark1:
                type: string
                description: User-defined custom field.
              customRemark2:
                type: string
                description: User-defined custom field.
              customRemark3:
                type: string
                description: User-defined custom field.
              customRemark4:
                type: string
                description: User-defined custom field.
              customRemark5:
                type: string
                description: User-defined custom field.
              ndf:
                type: string
                description: NDF field. Should be Y if NDF deal. Default is N if blank.
              ndfCurrency:
                type: string
                description: NDF Currency. Applicable for NDF = Y but not mandatory. Applicable to synthetic cross. Else value will be discarded.
              ndfFixingSource:
                type: string
                description: NDF Fixing Source. For NDFs, this field is mandatory for G10. System will discard the value in case exist for non G10 cross.
                example: WMR LDN1600
              startTime:
                type: string
                description: For time-based market orders. Format:HH:mm <Timezone>.
                example: 13:45 GMT
              purposeOfTransfer:
                type: number
                description: Indicates the purpose of the FX Trade. Field is numeric value and contains list of pre-defined codes configured at Citi Legal Vehicle and will be provide to you during onboarding.
              debitTemplate:
                type: string
                description: Indicates the debit side of the deal. It is a list of pre-defined templates configured at individual entity level. Applicable only for Spot and Forward deals. Values will be provide by Citi during onboarding.
              creditTemplate:
                type: string
                description: Indicates the credit side of the deal. It is a list of pre-defined templates configured at individual entity level. Applicable only for Spot and Forward deals. Values will be provide by Citi during  onboarding.
              suppressSettlement:
                type: string
                description: Flag to suppress the settlement on FX side.
                example: Y (or) N
