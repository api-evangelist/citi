                type: string
                description: The Tenor the order is being placed for.
                maxLength: 10
                example: BROKEN
              valueDate:
                type: string
                format: date
                description: 'The value date of the order in format: yyyy-MM-dd'
                example: '2012-11-15'
              dealtCcy:
                type: string
                description: The currency for which you supplied the dealt amount.
                maxLength: 3
                example: USD
              side:
                type: string
                description: Indicates whether you are buying (B) or selling (S) the dealt ccy.
                enum:
                - B
                - S
                example: S
              orderQty:
                type: string
                format: double
                description: The dealt ccy amount
                example: '1000'
              rateSetId:
                type: integer
                description: If the rating method was IFX, this is the Rate Set Id used in the rating of the order. For Live Rates orders, this will be set to zero. In case of a Refund order, it is the rate set Id previously used to book original order.
                example: 41319
              counterCcy:
                type: string
                description: The counter ccy of the ccy pair, not the dealt ccy.
                example: GBP
                maxLength: 3
              contAmtValue:
                type: string
                format: double
                description: The calculated counter ccy amount.
                example: '6543.65'
              lastSpotRate:
                type: string
                format: double
                description: The spot rate applied to the order.
                example: '1.5282'
              lastForwardPoints:
                type: string
                format: double
                description: The forward points applied to the order. Will be zero for spot transactions.
                example: '0'
              outrightRate:
                type: string
                format: double
                description: The outright (spot and fwd points) rate applied to the Order.
                example: '1.5282'
              rejectCode:
                type: integer
                description: The reject code if order status = ‘REJECTED’ (rejected).
                example: 99
              rejectReason:
                type: string
                description: The reason for rejection if order status = ‘REJECTED’’ (rejected).
                maxLength: 250
              citiMergedOrder:
                type: boolean
                description: Indicates whether this is a merged order created by Citi. Only applicable to ‘Net & Merge’ clients.
              clOrdLinkId:
                type: string
                format: int64
                description: 'The Citi-assigned Merged Order reference.  This is applicable only to ‘Net & Merge’ InstantFX clients; where two or more orders are for the same ccy pair and value date, will be merged to create a single, netted Order and the original, contributing orders will be flagged as ‘Merged’ orders with a cross reference to the Citi created order.

                  '
              fixingDate:
                type: string
                format: date
                description: 'Optional field relating to NDF trades only. The fixing date of the NDF Order in format: yyyy-MM-dd'
                example: '2012-11-12'
              customTenorUnit:
                type: integer
                description: The tenor unit to be used when booking a trade with a Tenor type of T. Current supported values are 1, 3, 5.
                example: 1
              clientData:
                type: string
                description: Contains the value that was sent in the original request.
                maxLength: 30
                example: Amount:1234|onBehalfOf:ClientB
              clientData2:
                type: string
                description: Contains the value that was sent in the original request.
                maxLength: 30
                example: Amount:1234|onBehalfOf:ClientB
              clientData3:
                type: string
                description: Contains the value that was sent in the original request.
                maxLength: 30
                example: Amount:1234|onBehalfOf:ClientB
              clientData4:
                type: string
                description: Contains the value that was sent in the original request.
                maxLength: 30
                example: Amount:1234|onBehalfOf:ClientB
              clientData5:
                type: string
                description: Contains the value that was sent in the original request.
                maxLength: 30
                example: Amount:1234|onBehalfOf:ClientB
              origClOrdId:
                type: string
                format: int64
                description: Conditional field. Mandatory for ordType =”REFUND”. The value received in the “orderId” field of the standard order response published by Citi.
                example: '123456'
              ordType:
                description: The order type. Will be one of the following values
                type: string
                maxLength: 15
                enum:
                - STANDARD
                - REFUND
                - PRE
                - DRAWDOWN
                - FORECAST
                - STAGING
                example: STANDARD
              isBookedWithMRF:
                type: boolean
                description: 'This flag will be set if the order is booked with an adjusted rate. Note: Deals will be booked with an adjusted rate whenever MRF happens if you opted for it.'
              isBookedWithMktRate:
                type: boolean
                description: Flag to indicate if the order is booked on market rate
              mrfId:
                type: string
                fomrat: int32
                description: Conditional field. The reference number for the adjusted rate if isBookedWithMRF =”TRUE”.
                example: '9123'
              mrfPercentage:
                type: string
                format: double
                description: Percentage that is used to adjust the rate.
                example: '3.54'
              mrfComparisionRate:
                type: string
                format: double
                description: Rate at which Citi compared in market while order booking.
                example: '1.5982'
              mrfVariance:
                type: string
                format: double
                description: The variance between rate set rate and current market rate.
                example: '4.58'
              udc1:
                type: string
                description: The purpose code received in the order request.
                example: '3'
              udc2:
                type: string
                description: Purpose code received in the order request.
                example: '2'
              udc3:
                type: string
                description: Purpose code received in the order request.
                example: '1'
              backOffRef:
                type: string
                description: Back office settlement reference number for booked orders. Value will be null in the order response. The value can be obtained through a report request for the booked order. Please contact your Citi Representative to request the report.
                maxLength: 60
                example: 1054T31966
              uniqueTradeIdentifier:
                type: string
                description: UTI value for booked orders. This value will be null in the order response. The value can be obtained through Report request for the booked order. Please contact your Citi Representative to request the report.
                example: '1.0308657177112268e+21'
