    NumberOfTransactionsPerStatus3:
      required:
        - DtldNbOfTxs
        - DtldSts
      type: object
      properties:
        DtldNbOfTxs:
          type: object
          description: >-
            Number of individual transactions contained in the message, detailed
            per status.
          allOf:
