            x-MXComponent: AmendmentImpact1Code
            type: string
            enum:
              - CTHR
              - CUAD
              - CUAI
              - CUDX
              - CUNB
              - CUTC
              - CUXC
              - LTHR
              - LUAD
              - LUAI
              - LUDX
              - LUNB
              - LUTC
              - LUXC
        undertaking_termination_request:
          x-MXComponent: YesNoIndicator
          description: |
            Specifies that the instrument is requested to be cancelled.

            MT Mapping: 23S

            Indicates a "Yes" or "No" type of answer for an element.
          type: boolean
        undertaking_increase_decrease_amount:
          description: >
            Indication of the amount of increase or decrease to the undertaking
            amount.

            Choice of amounts.


            MT Mapping: field 32B/33B in SeqC
          $ref: '#/components/schemas/Amount1Choice'
        new_undertaking_terms_and_conditions:
          type: array
          maxItems: 8
          description: >
            Specifies changes to the terms and conditions of the Undertaking
            (excluding information already expressed in other fields or other
            associated messages).


            MT Mapping: field 77U


            Specifies a character string with a maximum length of 9750
            characters.
          items:
            x-MXComponent: Max9750Text
            type: string
            minLength: 1
            maxLength: 9750
        counter_undertaking_increase_decrease_amount:
          description: |
            Amount of increase, and currency.

            MT Mapping: field 32B/33B in SeqB
          $ref: '#/components/schemas/Amount1Choice'
        new_counter_undertaking_terms_and_condition:
          x-MXComponent: Max9750Text
          description: >
            Specifies changes to the terms and conditions of the local
            Undertaking (excluding information already expressed in other fields
            or other associated messages).


            MT Mapping: field 77L in SeqC


            Specifies a character string with a maximum length of 9750
            characters.
          type: string
          minLength: 1
          maxLength: 9750
        delivery_channel_method:
          x-MXComponent: Max4Text
          description: Method by which the proposed amendment is to be made available.
          type: string
          minLength: 1
          maxLength: 4
        deliver_to_party_type:
          x-MXComponent: Max4Text
          description: "Type of party to whom the proposed amendment is intended to be delivered.\n\nType of party can be either \n- a code from the list published on ISO20022.org as part of external code sets\nOR\n- if code is different from the ISO code list (mentioned above), then a bilaterally agreed code may be used\n\n\"\nCode\"\t\"\nName\"\nADVP - AdvisingParty\nANYB - AnyBank\nAPPL - Applicant\nBENE - Beneficiary\nCONF - ConfirmationParty\nCUB2 - SecondCounterUndertakingBeneficiary\nCUB3 - ThirdCounterUndertakingBeneficiary\nISSU - Issuer\nOBLG - Obligor\nORDR - OrderingParty\nPRES - PresentingParty\nSADV - SecondAdvisingParty\nSPEC - SpecifiedAddress\n\n\nMT Mapping: field 24G\n\nSpecifies a character string with a maximum length of 4 characters.\n"
          type: string
          minLength: 1
          maxLength: 4
        deliver_to_name:
          x-MXComponent: RestrictedFINXMax140Text
          description: >
            Name of party to whom the proposed amendment is intended to be
            delivered.


            MT Mapping: field 24G


            Specifies a character string with a maximum length of 140 characters
            limited to character set X, that is, a-z A-Z / - ? : ( ) . , ‘ + .
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.\n\r,'\+ ]{1,140}$
        deliver_to_address:
          type: array
          maxItems: 3
          description: >
            Address of party to whom the original undertaking or proposed
            amendment is intended to be delivered.


            MT Mapping: field 24G


            Specifies a character string with a maximum length of 35 characters
            limited to character set X, that is, a-z A-Z / - ? : ( ) . , ‘ + .
          items:
            x-MXComponent: RestrictedFINXMax35Text
            type: string
            minLength: 1
            maxLength: 35
            pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]{1,35}$
        deliver_to_tracking_reference:
          x-MXComponent: Max35Text
          description: >
            Unique tracking reference used by the delivery method, for example
            courier tracking reference, FileAct reference, etc.


            Specifies a character string with a maximum length of 35 characters.
          type: string
          minLength: 1
          maxLength: 35
        additional_deliver_to_details:
          x-MXComponent: RestrictedFINMax35Text
          description: >
            Additional information related to 'Deliver to' information.


            Usage Guideline: This field can additionally be used to identify the
            format and channel when the format and channel code is 'OTHR'.
            Recommend to structure the information as follows (example):


            When Format is Other - //OTHR//JPEG 

            When Channel is Other - //OTHR//HOST

            When both Format and Channel is Other - //OTHR//JPEG//OTHR//HOST


            Specifies a character string with a maximum length of 35 characters.
            It has a pattern ([^/]+/)+([^/]+)|([^/]*) that disables the use of
            slash "/" at the beginning and end of line and double slash "//"
            within the line.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^([^/]+/)+([^/]+)|([^/]*)$
        reduction_release:
          description: |
            Not Applicable
        supporting_document:
          type: array
          description: |
            Not Applicable
        additional_information:
          x-MXComponent: Max210Text
          description: >
            Additional information related to the amendment or release/reduction
            of the undertaking.



            MT Mapping: field 72Z


            Specifies a character string with a maximum length of 210
            characters.
          type: string
          minLength: 1
          maxLength: 210
    ActiveCurrencyAndAmount:
      required:
        - amount
        - currency
      type: object
      properties:
        currency:
          pattern: ^[A-Z]{3,3}$
          type: string
          description: |
            Not Applicable.
          x-MXComponent: ActiveOrHistoricCurrencyCode
          x-Validation: true
          x-ValidationType: Algorithmic, ReferenceData
          x-Error: >-
            ErrorCode:Sw.Stds.D00006, ErrorText:Invalid currency code., :true,
            Severity:Fatal
        amount:
          maxLength: 19
          pattern: >-
            ^0*(([0-9]{0,13}\.[0-9]{1,5})|([0-9]{0,14}\.[0-9]{1,4})|([0-9]{0,15}\.[0-9]{1,3})|([0-9]{0,16}\.[0-9]{1,2})|([0-9]{0,17}\.[0-9]{1,1})|([0-9]{0,18}\.)|0*|([0-9]{0,18}))$
          type: string
          description: >
            The amount with fractional digit. Note: The decimal separator is a
            dot.


            Usage:
              Total digits: 18
              Fraction Digits: 5
          x-MXComponent: ActiveCurrencyAndAmount
          x-Validation: true
          x-ValidationType: Algorithmic
          x-Error: >-
            ErrorCode:Sw.Stds.D00007, ErrorText:Too many decimal digits or the
            amount does not comply with the pattern. Severity:Fatal
      additionalProperties: false
      description: >-
        A number of monetary units specified in an active currency where the
        unit of currency is explicit and compliant with ISO 4217.
    AmendmentPurposeTypeCode:
      type: string
      description: >
        Purpose of amendment message


        Code Name Definition:


        * ICCA - Request issuance of amendment to issued counter
        counter-undertaking and/or request to issue amendment to
        counter-undertaking and local undertaking.

        * ISCA - Request issuance of amendment to issued counter-undertaking
        and/or request to issue amendment to local undertaking.

        * ISUA - Request issuance of amendment to issued undertaking.


        Usage -> This field is applicable for Amend of Bank Guarantee.
      enum:
        - ICCA
        - ISCA
        - ISUA
    AmountChoice:
      title: AmountChoice
      type: object
      additionalProperties: true
      description: |
        Choice of amounts.

        Usage -> This field is applicable for Amend of Bank Guarantee.
      oneOf:
        - title: AmountIncrease
          required:
            - increase_amount
          type: object
          properties:
            increase_amount:
              $ref: '#/components/schemas/ActiveCurrencyAndAmount'
          additionalProperties: false
        - title: AmountDecrease
          required:
            - decrease_amount
          type: object
          properties:
            decrease_amount:
              $ref: '#/components/schemas/ActiveCurrencyAndAmount'
          additionalProperties: false
    AnyBICDec2014Identifier:
      pattern: ^[A-Z0-9]{4,4}[A-Z]{2,2}[A-Z0-9]{2,2}([A-Z0-9]{3,3}){0,1}$
      type: string
      description: >-
        Code allocated to a financial or non-financial institution by the ISO
