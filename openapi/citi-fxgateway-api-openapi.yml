  /fxgateway/sync/instantfxquote/api/v1:
    post:
      parameters:
      - name: client_id
        in: query
        description: Your unique identifier shared during your API onboarding. It is the same client_id used for oauth token generation.
        required: true
        schema:
          type: string
      summary: Quote Request and Quote Report Request API
      description: 'This endpoint facilitates requests for active rate enquiries - for a specific currency pair or all currency pairs and historic rate enquiries - for all currency pairs.


        For Quote Report Request, while the fields ‘tradeDate’, ‘rateSetId’, are optional, you must send them in at least one of the combinations below to fetch the results:


        a) ‘tradeDate’


        b) ‘rateSetId’'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/FXQuoteRequest_2'
              - $ref: '#/components/schemas/FXQuoteReportRequest_2'
        required: true
      responses:
        '200':
          description: "OK Acknowledged.\n\nIn rate response, if you are configured to have time-based guaranteed rates, then all live rates are included. \nIn rate report response, if you are configured to have time based guaranteed rates, then all the tier-based rates are included. Expired rates are omitted in the sent response. \n\nThe different spot rates for a given currency pair will have different spreads and can be viewed based on the `validUntilTime` field. \n\nMissing rates are omitted in the rates and rates report response unless configured to receive missing rates."
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/FXQuoteResponse'
                - $ref: '#/components/schemas/FXQuoteReportResponse'
        '401':
          description: Unauthorized user error
        '403':
          description: Access Forbidden error
        '500':
          description: Internal Server Error
