            sent through Electronic Data Interchange (EDI). <br><br><b>URID</b>:
            Remittance advice information needs to be sent to a Uniform Resource
            Identifier (URI). URI is a compact string of characters that
            uniquely identify an abstract or physical resource. URI's are the
