            allOf:
            - $ref: '#/components/schemas/CobExpiracao'
      - type: object
        properties:
          devedor:
            description: The fields nested under object debtor are optional and identify the debtor, i.e., the person or institution who owes the debt. They do not necessarily identify who will effectively make the payment. A CPF can be the debtor, but another CPF effectively makes the payment. Field `devedor.cpf` and field `devedor.cnpj` are not allowed to be completed at the same time. If field `devedor.cnpj` is completed, then, field `devedor.cpf` cannot be completed, and vice-versa. If field `devedor.nome` is completed, then, there must be or a `devedor.cpf` or a field `devedor.cnpj` completed.
            oneOf:
            - $ref: '#/components/schemas/PessoaFisica'
            - $ref: '#/components/schemas/PessoaJuridica_2'
      - type: object
        properties:
          loc:
            allOf:
            - $ref: '#/components/schemas/PayloadLocationCob_2'
      - type: object
        properties:
          valor:
            allOf:
            - $ref: '#/components/schemas/CobValor'
            - required:
              - original
      - $ref: '#/components/schemas/CobBase_2'
    Revisao_2:
      type: integer
      format: int32
      title: Revisão
      description: '# The `review` field


        Denotes the collection review version. Always starts at zero. Always increments 1.


        This should increase whenever a collection item is updated.

        The `loc` field change is not considered an update and therefore does not trigger an increment to the version number.


        The `loc` field does not change the collection itself.

        It is not necessary to store the history of changes in the `loc` field for a given collection.

        For the other fields of the collection, history is recorded.

        '
      readOnly: true
    CobRevisada:
      type: object
      title: Cobrança imediata revisada
      description: Data sent to create or change Immediate collection via API Pix
      allOf:
      - type: object
        properties:
          calendario:
            title: Calendário
            description: The fields nested under the calendar identifier organize information regarding collection-related dates.
            allOf:
            - $ref: '#/components/schemas/CobExpiracao'
      - type: object
        properties:
          devedor:
            description: The fields nested under object debtor are optional and identify the debtor, i.e., the person or institution who owes the debt. They do not necessarily identify who will effectively make the payment. A CPF can be the debtor, but another CPF effectively makes the payment. Field `devedor.cpf` and field `devedor.cnpj` are not allowed to be completed at the same time. If field `devedor.cnpj` is completed, then, field `devedor.cpf` cannot be completed, and vice-versa. If field `devedor.nome` is completed, then, there must be or a `devedor.cpf` or a field `devedor.cnpj` completed.
            oneOf:
            - $ref: '#/components/schemas/PessoaFisica'
            - $ref: '#/components/schemas/PessoaJuridica_2'
      - type: object
        properties:
          loc:
            allOf:
            - $ref: '#/components/schemas/PayloadLocationCob_2'
      - type: object
        properties:
