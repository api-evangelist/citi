openapi: 3.0.1
info:
  title: Proof_of_Payment
  description: >-
    This API will facilitiate client to extract their Proof of payment report in
    a PDF, JSON and XML formats.
  version: 1.0.0
  contact:
    name: CitiConnect Support
paths:
  /v1/proofofpayment/{transaction_ref_no}:
    get:
      summary: Payment status details PDF and XML report for specific transaction.
      description: >-
        The API call will retrieve the Payment status details for specific
        transaction.
      tags:
        - ProofOfPayment
      operationId: getPaymentStatus
      parameters:
        - name: client_id
          in: query
          required: true
          description: >-
            Unique reference which was shared during CitiConnect API
            on-boarding(client_id which used during oauth token generation)
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: transaction_ref_type
          in: query
          required: true
          description: >-
            Indicates transaction reference type, possible values are
            ENDTOENDID, UETR, CITIREFERENCE. <br> <b>**ENDTOENDID**</b> - Unique
            identification assigned by the initiating party to clearly identify
            the transaction. This Identification is passed on, unchanged,
            throughout the entire end-to-end chain.<b>**end_to_end_id is
            required if uetr and citi_reference_number is not present**. <br>
            <b>**UETR**</b> - Unique EndtoEnd Transaction Reference
            identification assigned by the initiating party or payment
            processing bank to uniquely identify the transaction. <b>**uetr is
            required if citi_reference_number end_to_end_id is not
            present.**</b>. <br>**CITIREFERENCE**</b> - This is the Bank
            reference assigned by Citi to a transaction as displayed in account
            statements. Example MT940 (Account Servicing institution reference).
            <b>**citi_reference_number is required if uetr and end_to_end_id is
            not present. Required if it is worldlink payments and this contains
            citi generated transaction reference.**</b>
          schema:
            type: string
        - name: transaction_ref_no
          in: path
          required: true
          description: >-
            Unique transaction reference number to identify the payment
            transaction
          schema:
            type: string
            minLength: 1
            maxLength: 36
        - name: transaction_flow_indicator
          in: query
          required: false
          description: >-
            Only ‘DR’ can be inputted, if not provided by client the system will
            auto-populate as ‘DR’.
          schema:
            type: string
            default: DR
        - name: transaction_date
          in: query
          required: false
          description: >-
            The date when the transaction execution (value date of payment) is
            happened should be specified.
          schema:
            type: string
            format: date
          example: '2024-03-17'
        - name: amount_from
          in: query
          required: false
          description: >-
            Transaction amount from. This fields supports only whole value,
            decimal is not allowed.
          schema:
            type: string
            minLength: 1
            maxLength: 18
          example: '1000'
        - name: amount_to
          in: query
          required: false
          description: >-
            Transaction amount to. This fields supports only whole value,
            decimal is not allowed.
          schema:
            type: string
            minLength: 1
            maxLength: 18
          example: '1000'
        - name: debit_account
          in: query
          required: false
          description: Account from which the amount debited.
          schema:
            type: string
            minLength: 1
            maxLength: 34
          example: '1245679'
        - name: worldlink_client_identifier
          in: query
          required: false
          description: >-
            Unique identifier for the worldlink clients. It is required for
            worldlink payments.
          schema:
            type: string
            minLength: 1
            maxLength: 35
          example: WL1245679
        - name: branch_code
          in: query
          required: false
          description: >-
            Unique code for branch where the client holds their accounts. It is
            not applicable for worldlink payments.
          schema:
            type: string
            minLength: 1
            maxLength: 34
          example: WL1245679
        - name: currency_code
          in: query
          required: false
          description: Transaction currency.
          schema:
            type: string
            pattern: ^[A-Z]{3}$
          example: USD
      security:
        - oAuth2:
            - selfservices
      responses:
        '200':
          description: Specifies the details of payment status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofOfPaymentResponse'
              examples:
                200_json_response_encrypted:
                  $ref: '#/components/examples/200-JSON-RESPONSE-ENCRYPTED'
                200_json_response:
                  $ref: '#/components/examples/200-JSON-RESPONSE'
            application/xml:
