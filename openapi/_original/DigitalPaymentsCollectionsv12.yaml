          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: tax_amount
        retailer_location:
          description: >-
            Provide information about the location of the retailers for goods or
            services included in this order. Where a retailer is located in a
            country different from your country, they are considered a foreign
            retailer, otherwise they are considered a domestic retailer.
          enum:
            - DOMESTIC_ONLY
            - FOREIGN_AND_DOMESTIC
            - FOREIGN_ONLY
          example: FOREIGN_ONLY
          type: string
          title: retailer_location
        avs_action:
          description: >-
            The action to be performed for the Address Verification Service
            (AVS) Response Code.
          enum:
            - NO_ACTION
            - REJECT
            - REVIEW
          example: REVIEW
          type: string
          title: avs_action
        avs_response:
          description: >-
            The Address Verification Service (AVS) Response Code for which you
            are defining the rule.
          enum:
            - ADDRESS_MATCH
            - ADDRESS_ZIP_MATCH
            - NAME_ADDRESS_MATCH
            - NAME_MATCH
            - NAME_ZIP_MATCH
            - NOT_AVAILABLE
            - NOT_REQUESTED
            - NOT_VERIFIED
            - NO_MATCH
            - SERVICE_NOT_AVAILABLE_RETRY
            - SERVICE_NOT_SUPPORTED
            - ZIP_MATCH
          example: ADDRESS_MATCH
          type: string
          title: avs_response
        invoice_number:
          description: The invoice number you issued for this order
          example: INV123456
          maxLength: 25
          minLength: 1
          type: string
          title: invoice_number
      type: object
    Authentication-Payer-Order-Response:
      title: Authentication Payer Order
      required:
        - id
        - amount
        - currency_code
        - creation_date_time
        - update_time
        - charge_amount
        - charge_type
        - total_auth_amount
        - total_captured_amount
        - total_refunded_amount
        - avs_action
        - avs_response
      properties:
        id:
          description: A unique identifier for this order.
          example: ORD123456
          maxLength: 40
          minLength: 1
          type: string
          title: id
        amount:
          description: >-
            The total amount for the order.  This is the net amount plus any
            merchant charge amounts.If you provide any sub-total amounts, then
            the sum of these amounts (order.itemAmount, order.taxAmount,
            order.shippingAndHandlingAmount, order.cashbackAmount,
            order.gratuityAmount, order.merchantCharge.amount and
            order.dutyAmount), minus the order.discountAmount must equal the net
            amount.The value of this parameter in the response is zero if payer
            funds are not transferred.
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        authentication_status:
          description: Indicates the result of payer authentication.
          enum:
            - AUTHENTICATION_ATTEMPTED
            - AUTHENTICATION_AVAILABLE
            - AUTHENTICATION_EXEMPT
            - AUTHENTICATION_FAILED
            - AUTHENTICATION_NOT_IN_EFFECT
            - AUTHENTICATION_NOT_SUPPORTED
            - AUTHENTICATION_PENDING
            - AUTHENTICATION_REJECTED
            - AUTHENTICATION_REQUIRED
            - AUTHENTICATION_SUCCESSFUL
            - AUTHENTICATION_UNAVAILABLE
          example: AUTHENTICATION_EXEMPT
          type: string
          title: authentication_status
        creation_date_time:
          type: string
          format: date-time
          description: >-
            The date and time the gateway considers the order to have been
            created. GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ)
          example: '2022-09-13T08:23:49.114Z'
          title: creation_date_time
        currency_code:
          description: >-
            The currency of the order expressed as an ISO 4217 alpha code, e.g.
            USD.
          enum:
            - USD
          example: USD
          type: string
          title: currency_code
        charge_amount:
          description: The amount of the additional fee that you are charging the payer.
          example: '20.0'
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: charge_amount
        update_time:
          type: string
          format: date-time
          description: >-
            The date and time the gateway considers the order to have last been
            updated. GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ)
          example: '2022-09-13T08:23:49.114Z'
          title: update_time
        mcc:
          description: The invoice number you issued for this order
          example: '1234'
          maxLength: 4
          minLength: 4
          type: string
          title: mcc
        charge_type:
          description: The type of the additional fee that you are charging the payer.
          enum:
            - SURCHARGE
          example: SURCHARGE
          type: string
          title: charge_type
        net_amount:
          description: The total item amount for the order.
          example: 150
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: net_amount
        reference:
          description: >-
            An optional identifier for the order (e.g., shopping cart or invoice
            number).
          example: ORD123456
          maxLength: 200
          minLength: 1
          type: string
          title: reference
        shipping_and_handling_amount:
          description: >-
            The total shipping and handling amount for the order, including
            taxes on the shipping and/or handling
          example: 20
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: shipping_and_handling_amount
        shipping_and_handling_tax_amount:
          description: >-
            The tax amount levied on the shipping and handling amount for the
            order.
          example: 20
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: shipping_and_handling_tax_amount
        shipping_and_handling_tax_rate:
          description: >-
            The tax rate applied to the shipping and handling amount for the
            order to determine the shipping and handling tax amount.
          example: 20
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: shipping_and_handling_tax_rate
        discount_amount:
          description: The total amount of the discount you have applied to the order
          example: 300
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: discount_amount
        tax_registration_id:
          description: >-
            Your tax registration identifier provided by the Federal/National
            tax authority (for example, federal tax identification number,
            ABN).If you are a Canadian merchant, use this parameter to provide
            your Tax Registration ID for paying Harmonized Sales Tax (HST) or
            Goods and Services Tax (GST) collected by the Canada Revenue Agency.
          example: 300
          maxLength: 30
          minLength: 1
          type: string
          title: tax_registration_id
        total_auth_amount:
          description: The amount that has been successfully authorized for this order.
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_auth_amount
        total_captured_amount:
          description: The amount that has been successfully captured for this order.
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_captured_amount
        total_refunded_amount:
          description: The amount that has been successfully captured for this order.
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_refunded_amount
        certainty:
          description: >-
            Indicates if you expect to capture the full order amount for which
            you are requesting authorization.If you do not provide a value for
            order.certainty the default configured for you by your payment
            service provider will be used. The value provided in the response
            shows the value the gateway sent to the acquirer.
          enum:
            - ESTIMATED
            - FINAL
          example: FINAL
          type: string
          title: certainty
        date:
          description: The date the payer placed the order.
          example: '1988-02-15'
          format: date
          type: string
          title: date
        description:
          description: Short textual description of the contents of the order.
          example: LAPTOP PURCHASE
          maxLength: 127
          minLength: 1
          type: string
          title: description
        discount_code:
          description: The code you use to identify the reason for the discount.
          example: DISC001
          maxLength: 40
          minLength: 1
          type: string
          title: discount_code
        discount_description:
          description: A description of your reason for the discount.
          example: CARD DISCOUNT
          maxLength: 127
          minLength: 1
          type: string
          title: discount_description
        duty_amount:
          description: >-
            The duty amount (also known as customs tax, tariff or dues) for the
            order.
          example: 150
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: duty_amount
        entity:
          description: >-
            Your identifier for the part of your organization that is
            responsible for the order.You might provide this data when you want
            to track the accountability for the order. For example, store
            number, sales region, branch, or profit center.
          example: INDENTITY1
          maxLength: 40
          minLength: 1
          type: string
          title: entity
        status:
          description: The current progression of this order through the payment process.
          enum:
            - AUTHENTICATED
            - AUTHENTICATION_INITIATED
            - AUTHENTICATION_NOT_NEEDED
            - AUTHENTICATION_UNSUCCESSFUL
            - AUTHORIZED
            - CANCELLED
            - CAPTURED
            - CHARGEBACK_PROCESSED
            - DISBURSED
            - DISPUTED
            - EXCESSIVELY_REFUNDED
            - FAILED
            - FUNDING
            - INITIATED
            - PARTIALLY_CAPTURED
            - PARTIALLY_REFUNDED
            - REFUNDE
            - REFUND_REQUESTED
            - VERIFIED
          example: VERIFIED
          type: string
          title: status
        tax_amount:
          description: >-
            The total tax amount for the order. If you do not provide this value
            but provide line item data, then this amount is calculated as the
            sum of the item.quantity times the item.unitTaxAmount for all the
            line items (total tax amount).If you provide both this value and
            line item data, then the order.taxAmount MUST equal the total tax
            amount.
          example: 150
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: tax_amount
        retailer_location:
          description: >-
            Provide information about the location of the retailers for goods or
            services included in this order. Where a retailer is located in a
            country different from your country, they are considered a foreign
            retailer, otherwise they are considered a domestic retailer.
          enum:
            - DOMESTIC_ONLY
            - FOREIGN_AND_DOMESTIC
            - FOREIGN_ONLY
          example: FOREIGN_ONLY
          type: string
          title: retailer_location
        avs_action:
          description: >-
            The action to be performed for the Address Verification Service
            (AVS) Response Code.
          enum:
            - NO_ACTION
            - REJECT
            - REVIEW
          example: REVIEW
          type: string
          title: avs_action
        avs_response:
          description: >-
            The Address Verification Service (AVS) Response Code for which you
            are defining the rule.
          enum:
            - ADDRESS_MATCH
            - ADDRESS_ZIP_MATCH
            - NAME_ADDRESS_MATCH
            - NAME_MATCH
            - NAME_ZIP_MATCH
            - NOT_AVAILABLE
            - NOT_REQUESTED
            - NOT_VERIFIED
            - NO_MATCH
            - SERVICE_NOT_AVAILABLE_RETRY
            - SERVICE_NOT_SUPPORTED
            - ZIP_MATCH
          example: ADDRESS_MATCH
          type: string
          title: avs_response
        invoice_number:
          description: The invoice number you issued for this order
          example: INV123456
          maxLength: 25
          minLength: 1
          type: string
          title: invoice_number
      type: object
    Authentication-Method:
      type: object
      title: Authentication Method
      required:
        - type
      properties:
        type:
          description: |-
            Method specified by the customer for the transaction  
            - Provide CARD for CARD transactions
          type: string
          enum:
            - CARD
            - GOOGLEPAY
            - APPLEPAY
          example: CARD
          title: type
        card:
          $ref: '#/components/schemas/Authentication-Card'
        token_id:
          description: Token_number.
          example: PA123456789
          maxLength: 50
          minLength: 1
          type: string
          title: token_number
        token_type:
          description: Token type.
          enum:
            - ALT_TOKEN
            - NETWORK_TOKEN
            - ISSUER_TOKEN
            - CITI_TOKEN
          example: ISSUER_TOKEN
          type: string
          title: token_type
        session_id:
          description: Session identification number
          type: string
          minLength: 36
          maxLength: 37
          example: SES1234567890123456789012345678
          title: session_id
    Authentication-Payer-Method:
      type: object
      title: Authentication Payer Method
      properties:
        card:
          $ref: '#/components/schemas/Authentication-Payer-Card'
        holder_name:
          $ref: '#/components/schemas/Holder-Name'
        session_id:
          description: Session identification number
          type: string
          minLength: 36
          maxLength: 37
          example: SES1234567890123456789012345678
          title: session_id
        type:
          description: |-
            Method specified by the customer for the transaction  
            - Provide CARD for CARD transactions
          type: string
          enum:
            - CARD
            - GOOGLEPAY
            - APPLEPAY
          example: CARD
          title: type
        token_id:
          description: Token_number.
          example: PA123456789
          maxLength: 50
          minLength: 1
          type: string
          title: token_number
        token_type:
          description: Token type.
          enum:
            - ALT_TOKEN
            - NETWORK_TOKEN
            - ISSUER_TOKEN
            - CITI_TOKEN
          example: ISSUER_TOKEN
          type: string
          title: token_type
    Authentication-Payer-Method-Response:
      type: object
      title: Authentication Payer Method Response
      required:
        - type
      properties:
        card:
          $ref: '#/components/schemas/Authentication-Payer-Card-Response'
        holder_name:
          $ref: '#/components/schemas/Holder-Name'
        type:
          description: |-
            Method specified by the customer for the transaction  
            - Provide CARD for CARD transactions
          type: string
          enum:
            - CARD
            - GOOGLEPAY
            - APPLEPAY
          example: CARD
          title: type
        token_id:
          description: Session identification number
          type: string
          minLength: 1
          maxLength: 50
          example: SES1234567890123456789012345678
          title: token_id
        token_type:
          description: Token type.
          enum:
            - ALT_TOKEN
            - NETWORK_TOKEN
            - ISSUER_TOKEN
            - CITI_TOKEN
          example: ISSUER_TOKEN
          type: string
          title: token_type
    Authentication-Transaction:
      title: ' Authentication Transaction'
      required:
        - id
        - currency_code
        - country_code
      properties:
        currency_code:
          description: >-
            ISO 4217 Currency Code for instance USD/GBP/EUR 

            - transaction.currency_code parameter is mandatory for all
            transaction type creation
          enum:
            - USD
          example: USD
          type: string
          title: currency_code
        reference:
          description: Value provided by the merchant for internal tracking/referencing.
          example: REPAY
          maxLength: 250
          minLength: 1
          type: string
          title: reference
        country_code:
          description: The transaction country
          enum:
            - US
          example: US
          type: string
          title: country_code
        id:
          description: >-
            Unique Transaction identification provided by the merchant during 
            transaction creation
          example: pay02052023456r
          maxLength: 128
          minLength: 1
          type: string
          title: id
      type: object
    Authentication-Order:
      title: Authentication Order
      required:
        - currency_code
        - id
      properties:
        id:
          description: >-
            A unique identifier for this order to distinguish it from any other
            order you create.
          example: OR123456789
          maxLength: 40
          minLength: 1
          type: string
          title: id
        currency_code:
          description: >-
            The currency of the order expressed as an ISO 4217 alpha code, e.g.
            USD.
          enum:
            - USD
          example: USD
          type: string
          title: currency_code
        reference:
          description: >-
            An optional identifier for the order For example, a shopping cart
            number, an order number, or an invoice number.
          example: CART123456
          maxLength: 250
          minLength: 1
          type: string
          title: reference
        mcc:
          description: The invoice number you issued for this order
          example: '1234'
          maxLength: 4
          minLength: 4
          type: string
          title: mcc
      type: object
    Initiate-Authentication:
      title: ' Intiate Authentication'
      required:
        - channel
      properties:
        channel:
          description: >-
            Indicates the channel in which the authentication request is
            initiated.
          enum:
            - MERCHANT_REQUESTED
            - PAYER_APP
            - PAYER_BROWSER
          example: MERCHANT_REQUESTED
          type: string
          title: channel
        purpose:
          description: Indicates the context in which payer authentication is requested.
          enum:
            - ADD_CARD
            - AGREEMENT_CANCELLATION
            - MAINTAIN_CARD
            - PAYMENT_TRANSACTION
            - REFRESH_AUTHENTICATION
          example: ADD_CARD
          type: string
          title: purpose
        type:
          type: array
          items:
            type: string
            description: |-
              A comma separated list of accepted payer authentication forms. 
              - Accepted values are 3DS1,3DS2,PASSKEY
            title: type
        line_of_business:
          description: >-
            Identifier for different lines of business configured in the
            merchant profile.
          example: CART123456
          maxLength: 100
          minLength: 1
          type: string
          title: line_of_business
    Authentication-Payer-Initiate-Request:
      title: ' Payer Authentication Request'
      required:
        - channel
      properties:
        sdk:
          $ref: '#/components/schemas/Sdk'
        challenge_preference:
          description: >-
            Indicates if you want the payer to be presented with an
            authentication challenge (Default:NO_PREFERENCE).
          enum:
            - CHALLENGE_MANDATED
            - CHALLENGE_PREFERRED
            - NO_CHALLENGE
            - NO_PREFERENCE
            - REQUEST_TRUSTED_MERCHANT_LISTING
          example: REQUEST_TRUSTED_MERCHANT_LISTING
          type: string
          title: challenge_preference
        product_info:
          description: >-
            Description of the goods being purchased, displayed on the
            authentication UI.
          example: CART123456
          maxLength: 30
          minLength: 1
          type: string
          title: product_info
        payment_exemption:
          description: Indicates why this payment qualifies for an SCA exemption.
          enum:
            - AUTO
            - LOW_RISK
            - LOW_VALUE_PAYMENT
            - TRUSTED_MERCHANT
            - MERCHANT_INITIATED_TRANSACTION
            - RECURRING_PAYMENT
            - SECURE_CORPORATE_PAYMENT
          example: TRUSTED_MERCHANT
          type: string
          title: payment_exemption
        redirect_url:
          type: string
          maxLength: 500
          description: >-
            The URL to which you want to redirect the payer after completing the
            payer authentication process.This will be a URL on your website,
            with the URL encoded as defined in RFC3986. This means special
            characters such spaces, hyphens, etc must be encoded.
          example: https://greenzone-api.uat.nam.nsroot.net/api/notification
          title: redirect_url
    Authentication-Payer-Initiate-Response:
      title: ' Payer Authentication Response'
      required:
        - method_completed
        - method_supported
        - requestor_id
        - requestor_name
        - payer_interaction
      properties:
        acs_eci:
          description: >-
            Electronic Commerce Indicator (ECI) value provided by the issuer's
            ACS.
          example: '56'
          maxLength: 2
          minLength: 1
          type: string
          title: acs_eci
        token:
          description: >-
            The base64 encoded value generated by the issuer
            (CAVV/AAV/AEVV/Authentication Value).
          example: '56'
          maxLength: 32
          minLength: 28
          type: string
          title: token
        3ds_transaction_id:
          description: >-
            A unique identifier for the 3-D Secure authentication transaction
            (XID for v1, DS ID for v2).
          example: '56'
          maxLength: 50
          minLength: 1
          type: string
          title: 3ds_transaction_id
        server_transaction_id:
          description: Unique identifier assigned by the 3DS Server (threeDSServerTransID).
          example: '56'
          maxLength: 50
          minLength: 1
          type: string
          title: server_transaction_id
        acs_transaction_id:
          description: >-
            A unique transaction identifier assigned by the Access Control
            Server (ACS).
          example: '56'
          maxLength: 36
          minLength: 36
          type: string
          title: acs_transaction_id
        scheme:
          description: >-
            The EMV 3DS authentication scheme used (e.g., MADA, MASTERCARD,
            VISA).
          example: '56'
          maxLength: 50
          minLength: 2
          type: string
          title: scheme
        custom:
          description: >-
            Additional information returned by the scheme or issuer in the
            authentication response.
          example: '56'
          maxLength: 4000
          minLength: 1
          type: string
          title: custom
        directory_server_id:
          description: >-
            Additional information returned by the scheme or issuer in the
            authentication response.
          example: '56'
          maxLength: 10
          minLength: 10
          type: string
          title: directory_server_id
        directory_server_reference:
          description: Reference number assigned to the Directory Server (DS) by EMV Co.
          example: '56'
          maxLength: 32
          minLength: 1
          type: string
          title: directory_server_reference
        directory_transaction_id:
          description: >-
            A unique transaction identifier assigned by the scheme Directory
            Server.
          example: '56'
          maxLength: 50
          minLength: 1
          type: string
          title: directory_transaction_id
        method_completed:
          description: >-
            Indicates if the issuer's ACS completed the method call to obtain
            browser info.
          type: boolean
          example: true
          title: method_completed
        method_supported:
          description: Indicates if the issuer's ACS supports the method call protocol.
          enum:
            - NOT_SUPPORTED
            - SUPPORTED
          example: NOT_SUPPORTED
          type: string
          title: method_supported
        protocol_version:
          description: The version of the EMV 3-D Secure protocol used (e.g., 2.1.0).
          example: CART123456
          maxLength: 20
          minLength: 1
          type: string
          title: protocol_version
        requestor_id:
          description: >-
            The unique identifier assigned to the merchant by the card scheme
            directory server for 3DS2.
          example: CART123456
          maxLength: 20
          minLength: 1
          type: string
          title: requestor_id
        requestor_name:
          description: >-
            The unique name assigned to the merchant by the card scheme
            directory server for 3DS2.
          example: CART123456
          maxLength: 40
          minLength: 1
          type: string
          title: requestor_name
        sdk:
          $ref: '#/components/schemas/Sdk-Payer-Authentication-Response'
        status_reason_code:
          description: >-
            A code indicating the reason for the transaction status (EMVCo
            specification).
          example: '56'
          maxLength: 2
          minLength: 2
          type: string
          title: status_reason_code
        status:
          description: >-
            Indicates the result of payer authentication with the issuer (e.g.,
            Y, N, U, A, R).
          example: 'Y'
          maxLength: 1
          minLength: 1
          type: string
          title: status
        acs_reference:
          description: Reference number assigned to the issuer's ACS by EMV Co.
          example: AFT123456
          maxLength: 32
          minLength: 1
          type: string
          title: acs_reference
        signed_content:
          description: >-
            A JSON Web Signature (JWS) object returned by the issuer's ACS
            (acsSignedContent).
          example: AFT123456
          maxLength: 13684
          minLength: 1
          type: string
          title: signed_content
        amount:
          description: Product amount
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        method:
          description: The method that the issuer will use to authenticate the payer.
          enum:
            - DYNAMIC
            - OUT_OF_BAND
            - STATIC
          example: STATIC
          type: string
          title: method
        payer_interaction:
          description: >-
            Indicates if payer interaction was used to complete the
            authentication process.
          enum:
            - NOT_POSSIBLE
            - NOT_REQUIRED
            - REQUIRED
          example: NOT_REQUIRED
          type: string
          title: payer_interaction
        payment_exemption:
          description: Indicates why this payment qualifies for an SCA exemption.
          enum:
            - AUTO
            - LOW_RISK
            - LOW_VALUE_PAYMENT
            - TRUSTED_MERCHANT
            - MERCHANT_INITIATED_TRANSACTION
            - RECURRING_PAYMENT
            - SECURE_CORPORATE_PAYMENT
            - TRUSTED_MERCHANT
          example: TRUSTED_MERCHANT
          type: string
          title: payment_exemption
        trusted_merchant_status:
          description: >-
            Indicates if the payer has added you to their list of trusted
            merchants for this card.
          enum:
            - NOT_ON_LIST
            - ON_LIST
          example: ON_LIST
          type: string
          title: trusted_merchant_status
        redirect_acs_url:
          type: string
          maxLength: 500
          minLength: 1
          description: >-
            The URL of the issuer's ACS to be used for the challenge flow (valid
            RFC 1738 URL).
          example: https://greenzone-api.uat.nam.nsroot.net/api/notification
          title: redirect_acs_url
        redirect_c_req:
          type: string
          maxLength: 4000
          minLength: 1
          description: >-
            The Base64 URL encoded CReq message to be used for the challenge
            flow.
          example: https://greenzone-api.uat.nam.nsroot.net/api/notification
          title: redirect_c_req
        redirect_html:
          type: string
          maxLength: 40960
          minLength: 1
          description: >-
            The Base64 URL encoded CReq message to be used for the challenge
            flow.
          example: https://greenzone-api.uat.nam.nsroot.net/api/notification
          title: redirect_html
        redirect_domain_name:
          type: string
          maxLength: 253
          minLength: 1
          description: >-
            The domain name of the site where payer authentication was performed
            (e.g., ACS domain name).
          example: https://greenzone-api.uat.nam.nsroot.net/api/notification
          title: redirect_domain_name
        status_code:
          type: string
          maxLength: 100
          minLength: 1
          description: >-
            Indicates the status of payer authentication with the issuer (e.g.,
            NPCI BEPG status code).
          example: '500'
          title: status_code
        status_description:
          type: string
          maxLength: 1024
          minLength: 1
          description: >-
            Indicates the status of payer authentication with the issuer (e.g.,
            NPCI BEPG status code).
          example: '500'
          title: status_description
        line_of_business:
          type: string
          maxLength: 100
          minLength: 1
          description: >-
            Identifier for different lines of business configured in the
            merchant profile.
          example: '500'
          title: line_of_business
        time:
          type: string
          format: date-time
          description: >-
            Date and time of the payer authentication being performed
            (YYYY-MM-DDThh:mm:ss.SSSZ).
          example: '2022-09-13T08:23:49.114Z'
          title: time
        version:
          description: >-
            The form of payer authentication selected or available for use by
            the gateway.
          enum:
            - 3DS2
            - RUPAY
            - PASSKEY
            - NONE
          example: 3DS2
          type: string
          title: version
    Mandate:
      title: Mandate
      properties:
        offer_id:
          description: >-
            The unique identifier of the payment plan offer that the payer has
            accepted.
          example: OF123456789
          maxLength: 60
          minLength: 1
          type: string
          title: offer_id
        amount_variability:
          description: >-
            Indicates if all the payments within the agreement use the same
            amount or if the amount differs between the payments. The parameter
            must be provided for recurring payment agreements.
          enum:
            - FIXED
            - VARIABLE
          example: VARIABLE
          type: string
          title: amount_variability
        custom_data:
          description: >-
            Additional information requested for the agreement which cannot be
            passed using other available data parameters. This parameter must
            not contain sensitive data.
          example: '7788'
          maxLength: 2048
          minLength: 1
          type: string
          title: custom_data
        expiry_date:
          description: >-
            Date at which your agreement with the payer to process payments
            expires. 

            - For Brazil PIX Initiation, this parameter is mandatory.
          example: '2024-02-15'
          format: date
          type: string
          title: expiry_date
        id:
          description: >-
            Your identifier for the agreement you have with the payer to process
            payments.When you collect cards from your payers and store them for
            later use, you must provide an agreement ID when you use the stored
            values for: Recurring payments: you have an agreement with the payer
            that authorizes you to automatically debit their account at agreed
            intervals for fixed or variable amounts. For example, gym
            membership, phone bills, or magazine subscriptions. Installment
            payments: you have an agreement with the payer that authorizes you
            to process multiple payments over an agreed period of time for a
            single purchase. For example, the payer purchases an item for $1000
            and pays for it in four monthly installments. Unscheduled: you have
            an agreement with the payer that authorizes you to process future
            payments when required. For example, the payer authorizes you to
            process an account top-up transaction for a transit card when the
            account balance drops below a certain threshold.Industry Practice:
            you have an agreement with the payer that authorizes you to initiate
            additional transactions to fulfil a standard business practice
            related to an original payment initiated by the payer. For example,
            a delayed charge for use of the hotel mini bar after the payer has
            checked out or a no show penalty charge when the payer fails to show
            for a booking. When you first establish an agreement with the payer
            you should also specify the type of agreement in agreement.type. 

            - For Brazil PIX Initiation, this parameter is mandatory with max
            length 29 in format RR33479023yyyyMMddBRkkkkkkkkk and this should be
            same id received as part of push notification while creating the
            mandate
          example: RR123456789
          maxLength: 100
          minLength: 1
          type: string
          title: id
        maximum_amount:
          description: >-
            The maximum amount for a single payment in the series as agreed with
            the payer under your agreement with them. The amount must be
            provided in the currency of the order.
          example: '200'
          maxLength: 14
          minLength: 1
          type: string
          title: maximum_amount
        minimum_amount:
          description: >-
            The minimum amount for a single payment in the series as agreed with
            the payer under your agreement with them. The amount must be
            provided in the currency of the order.
          example: '200'
          maxLength: 14
          minLength: 1
          type: string
          title: minimum_amount
        minimum_days:
          description: >-
            The minimum number of days between payments agreed with the payer
            under your agreement with them.
          example: 7788
          maximum: 9999
          minimum: 1
          type: number
          title: minimum_days
        number_of_payments:
          description: >-
            The number of merchant-initiated payments within the recurring
            payment agreement.
          example: 778
          maximum: 999
          minimum: 1
          type: number
          title: number_of_payments
        frequency:
          description: >-
            The frequency of the payments within the series as agreed with the
            payer under your agreement with them.
          enum:
            - AD_HOC
            - DAILY
            - FORTNIGHTLY
            - MONTHLY
            - OTHER
            - QUARTERLY
            - TWICE_YEARLY
            - WEEKLY
            - YEARLY
          example: YEARLY
          type: string
          title: frequency
        type:
          description: >-
            The type of commercial agreement that the payer has with you.Specify
            the agreement type when you have provided a value for agreement.id
            and this payment is the first in a series of payments. The default
            value is OTHER.
          enum:
            - INSTALLMENT
            - OTHER
            - RECURRING
            - UNSCHEDULED
          example: UNSCHEDULED
          type: string
          title: frequency
        start_date:
          description: This is the effective start date for the payment agreement.
          example: '2024-02-15'
          format: date
          type: string
          title: start_date
        charges_owned_by:
          description: Indicates who ownes the charges fees
          enum:
            - MERCHANT
            - CONSUMER
          example: CONSUMER
          type: string
          title: charges_owned_by
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
      type: object
