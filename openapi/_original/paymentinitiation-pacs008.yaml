openapi: 3.0.1
info:
  title: Payment Initiation Service
  description: >-
    The Payment Initiation API allows partners to make payments. 

    Each payment method takes different input values based on the type of
    payment. 

    This service accommodates all different data attributes for all the
    available payment methods.


    This specification describes the fields required for the <a
    href="https://www.iso20022.org/sites/default/files/documents/D7/ISO20022_RTPG_pacs00800106_July_2017_v1_1.pdf"
    target="_blank">ISO PACS 008.001.02 payment initiation standard
    payload.</a> 

    This standard supports multiple country and currency options. You can
    generate sample XML content for the countries of your choice by using the <a
    href="https://developer.citi.com/apim/go/paymentrules/" target="_blank">Citi
    Payment Formatting Rules Tool</a>. 


    Download our SDKs:


    * [Python
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=python&apiTitle=all&isClientSecReq=true)

    * [Java
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=java&apiTitle=all&isClientSecReq=true)

    * [.Net
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=dotnet&apiTitle=all&isClientSecReq=true)

    * [Ruby
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=ruby&apiTitle=all&isClientSecReq=true)

    * [NodeJS
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=nodejs&apiTitle=all&isClientSecReq=true)

    * [Go
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=go&apiTitle=all&isClientSecReq=true)

    * [CLI Tool
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=ccapi-cli&apiTitle=all&isClientSecReq=true)


    Note: You must be logged in to download the SDKs.


    ## Tracking Payment Status


    Because of the asynchronous nature of payment initiation and processing in
    Citi's Payment Initiation API, we recommend following these best practice
    guidelines for tracking your Payment Initiation Request to determine the
    status before reinitiating payment as that can cause inadvertent duplication
    of payments, resulting in unintended payments being made.


    To best determine the status of your Payment Initiation Request using a
    Payment Status Request (PSR): 


    | Scenario for Client                       | Scenario for
    Citi                             | Initial PSR Received? | Recommended
    Action                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     
    |

    |-------------------------------------------|-----------------------------------------------|-----------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|

    | Client received response from Citi        | Citi received Payment
    Initiation request      | Yes                   | API call, response and PSR
    working without issue. No action
    required.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
    |

    | Client did not receive response from Citi | Citi received Payment
    Initiation request<br/> | Yes                   | The payment initiation was
    confirmed to be successful by receipt of the first PSR. No action
    required.                                                                                                                                                                                                                                                                                                                                                                                                                                                 
    |

    | Client did not receive response from Citi | Citi received Payment
    Initiation request      | No                    | The client could not
    confirm the success of the Payment Initiation call from the syncronous
    response or PSR, but the request was received by Citi. In order to avoid
    duplicated payments, send a payment status inquiry at 5 minute intervals. If
    no response is received for three consecutive payment status inquiries,
    contact your Citi
    representative.                                                                                                                                                                                            
    |

    | Client did not receive response from Citi | Citi did not receive Payment
    Initiation       | No                    | Responses have timed out, but
    Citi is processing payment.<br/><br/>In order to avoid duplicated payments,
    send a payment status inquiry at 5 minute intervals. If no response is
    received for three consecutive payment status inquiries, contact your Citi
    representative. <br/><br/>If Citi representative is unable to confirm the
    payment status, or the payment initiation was unsuccessful, re-send the
    payment using the original end-to-end ID. Using the original end-to-end ID
    ensures that the payment will not be inadvertently duplicated. |
  contact:
    name: Standards & Developer Hub
    url: https://tts.sandbox.developer.citi.com/citiconnect/
    email: developer-support@citi.com
  version: 3.0.0
servers:
  - url: >-
      https://b2b.tts.icgservices.citi.com/citiconnect/prod/paymentservices/v3/payment/initiation
    description: production gateway url
  - url: >-
      https://cte.b2b.tts.icgservices.citi.com/citiconnect/sb/paymentservices/v3/payment/initiation
    description: sandbox url
tags:
  - name: Pacs 00800108
paths:
  /payment/initiation:
    post:
      tags:
        - Pacs 00800108
      summary: Payment
      description: >-
        You can initiate a new payment using the Payment Initiation API. This
        service takes the necessary data required in <a
        href="https://www.iso20022.org/sites/default/files/documents/D7/ISO20022_RTPG_pacs00800106_July_2017_v1_1.pdf"
        target="_blank">ISOXML pacs.008.001.02 format</a> to initiate a payment
        through CitiConnect API. It can be used to initiate one Direct Debit
        request per API call. 


        **Note:** The required fields vary depending on the countries and
        currencies used in the request. For detailed and up-to-date information
        on the necessary fields and formats, see the <a
        href="https://uat.developer.citi.com/apim/go/paymentrules"
        target="_blank">Citi Payment Formatting Rules Tool</a>.


        The Payment Initiation service accommodates all different data
        attributes for all the available payment methods.


        * **payloadType:** Supports <a
        href="https://www.iso20022.org/sites/default/files/documents/D7/ISO20022_RTPG_pacs00800106_July_2017_v1_1.pdf"
        target="_blank">“urn:iso:std:iso:20022:tech:xsd:pacs.008.001.02”</a>

        * **Request:** The request follows <a
        href="https://www.iso20022.org/sites/default/files/documents/D7/ISO20022_RTPG_pacs00800106_July_2017_v1_1.pdf"
        target="_blank">ISO XML V3 (pacs.008.001.02) standards</a>

        * **paymentBase64:** <a
        href="https://www.iso20022.org/sites/default/files/documents/D7/ISO20022_RTPG_pacs00800106_July_2017_v1_1.pdf"
        target="_blank">ISO XML V3 (pain.008.001.02)</a> standards. 

        The file must be converted to Base64 format and passed in
        \<Request>\<paymentBase64> tags. 

        * **Response:** The response follows <a
        href="https://www.iso20022.org/sites/default/files/documents/D7/ISO20022_RTPG_pacs00800106_July_2017_v1_1.pdf"
        target="_blank">ISO XML V3 (pacs.002.001.10)</a> standards.
      operationId: paymentInitiationUsingPOST
      parameters:
        - name: client_id
          in: query
          description: >-
            This is your unique identifier shared during your CitiConnect API
            onboarding. This is the same `client_id` used for OAuth token
            generation.
          required: true
          schema:
            type: string
        - name: Content-type
          in: header
          description: Supports "application/xml"
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: The OAuth Token prefixed with "Bearer" and a space in between.
          required: true
          schema:
            type: string
        - name: payloadType
          in: header
          description: Supports "urn:iso:std:iso:20022:tech:xsd:pacs.008.001.08" format
          required: true
          schema:
            type: string
      requestBody:
        description: >+
          Contains the required fields of the ISOXML request body.

          The request body must be Base64 encoded and enclosed within the
          \<Request>\<paymentBase64> tags.


          **Note:** The required fields of the `requestBody` are highly
          dependent on the countries and currencies used in the payment. For the
          most specific and up-to-date fields use the <a
          href="https://uat.developer.citi.com/apim/go/paymentrules"
          target="_blank">Citi Payment Formatting Rules Tool</a>. This example
          `requestBody` is provided for guidance.

        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/DocumentReq'
            example: >-
              <?xml version="1.0" encoding="UTF8"?><Document
              xmlns="urn:iso:std:iso:20022:tech:xsd:pacs.008.001.08"><FIToFICstmrCdtTrf><GrpHdr><MsgId>TESTGBINS005TESTBINTESTGB247API1202</MsgId><CreDtTm>2020-12-01T01:05:00</CreDtTm><NbOfTxs>1</NbOfTxs><SttlmInf><SttlmMtd>INDA</SttlmMtd><SttlmAcct><Id><Othr><Id>8231141</Id></Othr></Id><Ccy>EUR</Ccy></SttlmAcct></SttlmInf><InstgAgt><FinInstnId><BICFI>BARCGB22XXX</BICFI></FinInstnId></InstgAgt><InstdAgt><FinInstnId><BICFI>CITIGB2L</BICFI><Nm>NOTPROVIDED</Nm><PstlAdr><Ctry>GB</Ctry></PstlAdr></FinInstnId><BrnchId><Id>600</Id></BrnchId></InstdAgt></GrpHdr><CdtTrfTxInf><PmtId><InstrId>A13600</InstrId><EndToEndId>Orginlref</EndToEndId><!--
              <UETR>e101cff3-283c-4c6c-93a9-143a22d43c2b</UETR>
              --></PmtId><PmtTpInf><LclInstrm><Prtry>CITI10G</Prtry></LclInstrm></PmtTpInf><IntrBkSttlmAmt
              Ccy="EUR">117743.33</IntrBkSttlmAmt><IntrBkSttlmDt>2021-06-18</IntrBkSttlmDt><InstdAmt
              Ccy="EUR">11143.33</InstdAmt><XchgRate>1.20</XchgRate><ChrgBr>CRED</ChrgBr><ChrgsInf><Amt
              Ccy="EUR">5242.10</Amt><Agt><FinInstnId><Nm>NOTPROVIDED</Nm><PstlAdr><AdrLine>NOTPROVIDED</AdrLine></PstlAdr></FinInstnId></Agt></ChrgsInf><IntrmyAgt1><FinInstnId><BICFI>BOFAUS3NXXX</BICFI><Nm>Intermediary
              Bank
              Namexxxxxxxxxxxxx</Nm><PstlAdr><Ctry>US</Ctry><AdrLine>Intermediary
              Bank Address Line 1x</AdrLine><AdrLine>Intermediary Bank Address
              Line 2x</AdrLine><AdrLine>Intermediary Bank Address Line
              3x</AdrLine></PstlAdr></FinInstnId></IntrmyAgt1><Dbtr><Nm>Ordering
              Party Name</Nm><PstlAdr><AdrLine>Ordering Party Address Line
              1</AdrLine><AdrLine>Ordering Party Address Line
              2</AdrLine><AdrLine>Ordering Party Address Line
              3</AdrLine></PstlAdr></Dbtr><DbtrAcct><Id><Othr><Id>8548668</Id></Othr></Id></DbtrAcct><DbtrAgt><FinInstnId><BICFI>DEUTDEFFXXX</BICFI><Nm>Debtor
              Agent Name</Nm><PstlAdr><AdrLine>Debtor Agent Address Line
              1</AdrLine><AdrLine>Debtor Agent Address Line
              2</AdrLine><AdrLine>Debtor Agent Address Line
              3</AdrLine></PstlAdr></FinInstnId></DbtrAgt><CdtrAgt><FinInstnId><!--<ClrSysMmbId><ClrSysId><Prtry>IS</Prtry></ClrSysId><MmbId>CITIGB20</MmbId></ClrSysMmbId>
              --><Nm>AcctInstname</Nm></FinInstnId></CdtrAgt><Cdtr><Nm>Beneficiary
              Name</Nm><PstlAdr><AdrLine>Beneficiary Address Line
              1</AdrLine><AdrLine>Beneficiary Address Line
              2</AdrLine><AdrLine>Beneficiary Address Line
              3</AdrLine></PstlAdr></Cdtr><CdtrAcct><Id><Othr><Id>30415477</Id></Othr></Id><Nm>NAME-CDTRACCT--------------------35</Nm></CdtrAcct><InstrForCdtrAgt><InstrInf>CHASGB33XXX123123123123NEW01</InstrInf></InstrForCdtrAgt><InstrForCdtrAgt><InstrInf>CHASGB33XXX12312312312312311NEW02</InstrInf></InstrForCdtrAgt><InstrForNxtAgt><InstrInf>CHASGB33XXXX123123123NEW1103</InstrInf></InstrForNxtAgt><InstrForNxtAgt><InstrInf>CHASGB33XXXX123123123NEW1111NEW04</InstrInf></InstrForNxtAgt><InstrForNxtAgt><InstrInf>CHASGB33XXXX123123123NEW1111NEW05</InstrInf></InstrForNxtAgt><RgltryRptg><Dtls><Inf>/BENEFRES/GB//REGLTORYREPRTINGLINE1</Inf><Inf>/BENEFRES/GB//REGLTORYREPRTINGLINE2</Inf><Inf>/BENEFRES/GB//REGLTORYREPRTINGLINE3</Inf></Dtls></RgltryRptg><RmtInf><Ustrd>UNSTRUCTURED
              PAYMENT LINE1
              UNSTRU01</Ustrd><Strd><CdtrRefInf><Tp><CdOrPrtry><Cd>FXDR</Cd></CdOrPrtry></Tp><Ref>strd
              tag creation begin here
              1</Ref></CdtrRefInf></Strd></RmtInf></CdtTrfTxInf></FIToFICstmrCdtTrf></Document>
        required: true
      responses:
        '200':
          description: >-
            OK - your request was received and acknowledged successfully.


            Check the response body for the transaction status.


            | Payment Status | Recommended Action |

            | -------------- |  ----------------- |

            | Decrypted payload is unintelligible | Make a payment status
            inquiry every 5 minutes for 15 minutes. If you do not receive a
            response, contact Citi.

            | PDNG - Pending | Received L0 as resposne |

            | ACTC/ACCP - Accepted | Make a payment status inquiry every 5
            minutes |

            | RJCT - Rejected | See the status reason for more information |

            | ACSP/ACSC - Payment successfully processed and cleared | No action
            required |
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Document'
              example: >-
                <?xml version="1.0" encoding="UTF-8"?><Document
                xmlns="urn:iso:std:iso:20022:tech:xsd:pacs.002.001.10"><FIToFIPmtStsRpt><GrpHdr><MsgId>CITIBANK/20260417-PSR/917946424</MsgId><CreDtTm>2026-04-17T09:35:22</CreDtTm></GrpHdr><TxInfAndSts><OrgnlGrpInf><OrgnlMsgId>TESTGBINS005TESTBINTESTGB247API1202</OrgnlMsgId><OrgnlMsgNmId>pacs.008.001.08</OrgnlMsgNmId></OrgnlGrpInf><OrgnlInstrId>SN4174156</OrgnlInstrId><OrgnlEndToEndId>SN4174156</OrgnlEndToEndId><OrgnlUETR>dbbb2c28-fbf7-4c80-be87-43c6d52afd1c</OrgnlUETR><TxSts>PDNG</TxSts><StsRsnInf><AddtlInf>Payment
                validation is
                in-progress</AddtlInf></StsRsnInf><InstgAgt><FinInstnId><BICFI>BARCGB22XXX</BICFI></FinInstnId></InstgAgt><InstdAgt><FinInstnId><BICFI>CITIGB2L</BICFI></FinInstnId></InstdAgt></TxInfAndSts></FIToFIPmtStsRpt></Document>
        '400':
          description: >-
            Bad Request <br></br>Send a Payment Status Inquiry three times at
            five minute intervals to confirm that the request has not been
            received in that time. If the request has not been received, resend
            the request using the same end-to-end ID.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/errormessage'
              example: >-
                <?xml version="1.0"
                encoding="UTF-8"?><errormessage><httpMessage>Bad
                Request</httpMessage><httpCode>400</httpCode><moreInformation>Schema
                Validation
                Failed.</moreInformation></errormessage>               
        '401':
          description: Unauthorized
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/errormessage'
              example: >-
                <?xml version="1.0"
                encoding="UTF-8"?><errormessage><httpMessage>Invalid OAuth
                Token</httpMessage><httpCode>401</httpCode><moreInformation>Please
                use valid OAuth Token.</moreInformation></errormessage>
        '403':
          description: Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/errormessage'
              example: >-
                <?xml version="1.0"
                encoding="UTF-8"?><errormessage><httpMessage>Forbidden</httpMessage><httpCode>403</httpCode><moreInformation>You
                are forbidden to access this
                service.</moreInformation></errormessage>
        '404':
          description: Not found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/errormessage'
              example: >-
                <?xml version="1.0"
                encoding="UTF-8"?><errormessage><httpMessage>Not
                Found</httpMessage><httpCode>404</httpCode><moreInformation>No
                resources match requested URI.</moreInformation></errormessage>
        '405':
          description: Method Not Allowed
          content:
            application/xml:
              example: >-
                <?xml version="1.0"
                encoding="UTF-8"?><errormessage><httpMessage>Method not
                allowed</httpMessage><httpCode>405</httpCode><moreInformation>Please
                use valid HTTP supported verb
                only.</moreInformation></errormessage>
        '500':
          description: >-
            Internal Server Error <br></br>Send a Payment Status Inquiry three
            times at five minute intervals to confirm that the request has not
            been received in that time. If the request has not been received,
            resend the request using the same end-to-end ID.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/errormessage'
              example: >-
                <?xml version="1.0"
                encoding="UTF-8"?><errormessage><httpMessage>SSL Connection
                error</httpMessage><httpCode>500</httpCode><moreInformation>SSL
                Connection error with BE
                server.</moreInformation></errormessage>
      security:
        - clientCredentials: []
components:
  schemas:
    DocumentReq:
      required:
        - FIToFICstmrCdtTrf
      properties:
        FIToFICstmrCdtTrf:
          $ref: '#/components/schemas/FIToFICustomerCreditTransferV08'
      description: Payment initiation request body.
      xml:
        name: Document
    Document:
      required:
        - FIToFIPmtStsRpt
      properties:
        FIToFIPmtStsRpt:
          $ref: '#/components/schemas/FIToFIPaymentStatusReportV10'
      description: Payment initiation response body in ISO XML pacs.002.001.10 format.
    errormessage:
      required:
        - httpCode
      properties:
        httpCode:
          type: integer
          format: int32
        httpMessage:
          type: string
        moreInformation:
          type: string
      description: Error response body
    FIToFICustomerCreditTransferV08:
      required:
        - CdtTrfTxInf
        - GrpHdr
      type: object
      properties:
        GrpHdr:
          $ref: '#/components/schemas/GroupHeader93'
        CdtTrfTxInf:
          minItems: 1
          type: array
          description: >-
            Provides further details specific to the individual transaction(s)
            included in the message.
          items:
            $ref: '#/components/schemas/CreditTransferTransaction39'
        SplmtryData:
          type: array
          description: >-
            Additional information that can not be captured in the structured
            parameters and/or any other specific block.
          items:
            $ref: '#/components/schemas/SupplementaryData1'
      description: >-
        The `FinancialInstitutionToFinancialInstitutionCustomerCreditTransfer`
        message is sent by the debtor agent to the creditor agent, directly or
        through other agents and/or a payment clearing and settlement system. It
        is used to move funds from a debtor account to a creditor.
    FIToFIPaymentStatusReportV10:
      required:
        - GrpHdr
      type: object
      properties:
        GrpHdr:
          $ref: '#/components/schemas/GroupHeader91'
        OrgnlGrpInfAndSts:
          type: array
          description: Provides details on the original group, to which the message refers.
          items:
            $ref: '#/components/schemas/OriginalGroupHeader17'
        TxInfAndSts:
          type: array
          description: >-
            Provides further details on the original transactions, to which the
            status report message refers.
          items:
            $ref: '#/components/schemas/PaymentTransaction110'
        SplmtryData:
          type: array
          description: >-
            Additional information that can not be captured in the structured
            parameters and/or any other specific block.
          items:
            $ref: '#/components/schemas/SupplementaryData1'
    AccountIdentification4Choice:
      type: object
      properties:
        IBAN:
          $ref: '#/components/schemas/IBAN2007Identifier'
        Othr:
          $ref: '#/components/schemas/GenericAccountIdentification1'
      description: >-
        Unique identification for the account between the account owner and the
        account servicer. Either the`iban` or the `Othr` parameter should be
        passed in the request .
    ActiveOrHistoricCurrencyAndAmount:
      type: object
      properties:
        Ccy:
          type: object
          description: Currency code. Passed as the tag attribute.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
        Value:
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount_SimpleType'
    ActiveCurrencyAndAmount:
      type: object
      properties:
        Ccy:
          type: object
          description: Currency code. Passed as the tag attribute.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
        Value:
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount_SimpleType'
    ActiveOrHistoricCurrencyAndAmount_SimpleType:
      maxLength: 18
      type: string
      description: >-
        A number of monetary units specified in an active or a historic currency
        where the unit of currency is explicit and compliant with ISO 4217. The
        number of fractional digits in the amount should not be more than 5.
    ActiveOrHistoricCurrencyCode:
      pattern: '[A-Z]{3,3}'
      type: string
    AddressType3Choice:
      type: object
      properties:
        Cd:
          type: string
          description: >-
            Specifies the type of address.<br><br><b>ADDR</b>: Address is the
            complete postal address. <br><br><b>PBOX</b>: Address is a postal
            office (PO) box. <br><br><b>HOME</b>: Address is the home address.
            <br><br><b>BIZZ</b>: Address is the business
            address.<br><br><b>MLTO</b>: Address is the address to which mail is
            sent.<br><br><b>DLVY</b>: Address is the address to which delivery
            is to take place.
          enum:
            - ADDR
            - PBOX
            - HOME
            - BIZZ
            - MLTO
            - DLVY
        Prtry:
          $ref: '#/components/schemas/GenericIdentification30'
      description: >-
        Identifies the nature of the postal address. Either Code or Proprietary
        parameter should be passed in the request .
    AmendmentInformationDetails13:
      type: object
      properties:
        OrgnlMndtId:
          type: object
          description: >-
            Unique identification, as assigned by the creditor, to  identify the
            original mandate.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        OrgnlCdtrSchmeId:
          type: object
          description: Original creditor scheme identification that has been modified.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification135'
        OrgnlDbtr:
          type: object
          description: Original debtor that has been modified.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification135'
        OrgnlDbtrAcct:
          type: object
          description: Original debtor account that has been modified.
          allOf:
            - $ref: '#/components/schemas/CashAccount38'
        OrgnlDbtrAgt:
          type: object
          description: Original debtor agent that has been modified.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification6
        OrgnlDbtrAgtAcct:
          type: object
          description: Original debtor agent account that has been modified.
          allOf:
            - $ref: '#/components/schemas/CashAccount38'
        OrgnlCdtrAgt:
          type: object
          description: Original creditor agent that has been modified.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification6
        OrgnlCdtrAgtAcct:
          type: object
          description: Original creditor agent account that has been modified.
          allOf:
            - $ref: '#/components/schemas/CashAccount38'
        OrgnlFnlColltnDt:
          type: string
          description: Original final collection date that has been modified.
          format: date
        OrgnlFrqcy:
          type: object
          description: >-
            Original frequency that has been modified. One of the 3
            parameters(Tp/Prd/PtInTm) should be passed in the request.
          allOf:
            - $ref: '#/components/schemas/Frequency36Choice'
        OrgnlRsn:
          type: object
          description: >-
            Original reason for the mandate to allow the user to distinguish
            between different mandates for the same creditor. One of the 2
            parameters (`Cd`/`Prtry`) should be passed in the request.
          allOf:
            - $ref: '#/components/schemas/MandateSetupReason1Choice'
        OrgnlTrckgDays:
          pattern: '[0-9]{2}'
          type: string
          description: Original number of tracking days that has been modified.
      description: List of mandate elements that have been modified.
    AmountType4Choice:
      type: object
      properties:
        EqvtAmt:
          $ref: '#/components/schemas/EquivalentAmount2'
        InstdAmt:
          type: object
          description: >-
            A number of monetary units specified in an active or a historic
            currency where the unit of currency is explicit and compliant with
            ISO 4217.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
      description: >-
        Amount of money to be moved between the debtor and creditor, before
        deduction of charges, expressed in the currency as ordered by the
        initiating party. Either the `EqvtAmt` or the `InstdAmt` parameter
        should be passed in the request.
    BaseOneRate:
      maxLength: 11
      type: string
      description: >-
        Factor used to convert an amount from one currency into another. This
        reflects the price at which one currency was bought with another
