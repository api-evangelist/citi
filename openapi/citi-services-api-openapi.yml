    e31d9564-2523-4b96-8144-1bc9579a7f85-data-schema:
      type: object
      properties:
        ACCT_NME:
          type: string
          description: Account Name is the name that is assigned to the cash account and/or the safekeeping account. If an alternate account name has been specified for an account it will be displayed as the Account Name.
          example: Demo - SK - Japan 2
        BUY_CURR_CODE:
          type: string
          description: Provides the ISO 4217 currency code in which amout will be debited from debit account.sample values are USD/INR.
          example: USD
        SELL_CURR_CODE:
          type: string
          description: Provides the ISO 4217 currency code in which amout will be credited in credit account.sample values are USD/INR.
          example: USD
        BUY_AMT:
          type: number
          format: double
          description: Total Buy amount for a FX trade.
          example: 1546.98
        SELL_AMT:
          type: number
          format: double
          description: Total Sell amount for a FX trade.
          example: 1416.98
        TRADE_DT:
          type: string
          format: date
          description: The date on which the actual contract is executed between the buyer and seller of a specific country.
          example: '2025-04-02'
        VALUE_DT:
          type: string
          format: date
          description: Value Date is the delivery date on which counterparties to a transaction agree to settle their respective obligations by making payments and transferring ownership.
          example: '2025-05-02'
        BR_ID:
          type: string
          description: Branch Code is the identifier of the branch for the account.  For the cash account the branch code is a numeric value and for the safekeeping account it is the ISO Country code.
          example: '484'
        ACCT_ID:
          type: string
          description: Account ID is an identifier for both a cash account and/or a safekeeping account that is unique within a branch.
          example: DEMOSK02US
        FX_RATE:
          type: number
          format: double
          description: Client rate Includes forward points on FX rate.
          example: 1.0835
        SENDER_REFERENCE:
          type: string
          description: The Sender Reference - from the third party or the internal source system.
          example: TRX20240613567
        CITI_REFERENCE:
          type: string
          description: Custodian Reference (Internal) is a Citi generated identifier for a unique cash transaction record. This attribute is only valid within Citi and we recommend that it should not be used by clients.
          example: FX98765432
        FX_TYPE:
          type: string
          description: 'Forex traders transact in one of three distinct marketplaces: the spot, the forward, or the futures market.'
          example: SPOT
        FX_BRKR_BIC_CODE:
          type: string
          description: FX Broker bank identitfier code.
          example: CITIUS33
        FX_BRKR_NME:
          type: string
          description: FX Broker Name. A forex broker is a financial services company that provides traders access to a platform for buying and selling foreign currencies.
          example: Citibank N.A
