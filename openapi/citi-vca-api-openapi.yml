    AuthReportInboundRequest:
      properties:
        startDate:
          description: "Specifies the start date upto when the reports can be retrieved<br><br>Format:YYYY-MM-DD<br><br>Rules:<ol><li>Start date should be less than end date.</li><li>Start date should not be earlier than create VCA date</li><li>Mastercard:  <ul><li>startDate and endDate cannot be more than 90 days apart</li><li>startDate and endDate can be up to 36 months\n in the past from the day of report requested and not future date</li></ul></li><li>Visa:<ul><li>startDate and endDate cannot be more than 30 days apart</li><li>startDate and endDate can be up to 6 months\n in the past from the day of report requested and not future date</li></ul></li></ol>"
          type: string
          format: alphanumeric
          example: '2023-01-01'
          maxLength: 10
        endDate:
          description: "Specifies the end date upto when the reports can be retrieved<br><br>Format:YYYY-MM-DD<br><br>Rules:<ol><li>End date should greater than the start date</li><li>Mastercard:  <ul><li>startDate and endDate cannot be more than 90 days apart.</li><li>If endDate is more than 90 days after startDate, it will be automatically reset to exactly 90 days after startDate</li><li>startDate and endDate can be up to 36 months\n in the past from the day of report requested and not future date</li></ul></li><li>Visa:<ul><li>startDate and endDate cannot be more than 30 days apart</li><li>startDate and endDate can be up to 6 months\n in the past from the day of report requested and not future date</li></ul></li></ol>"
          type: string
          format: alphanumeric
          example: '2023-03-30'
          maxLength: 10
        startTime:
          description: Specifies the start time from when the reports can be retrieved<br><br>Format:HH:MM
          type: string
          format: alphanumeric
          example: 00:00
          maxLength: 10
        endTime:
          description: Specifies the end time upto when the reports can be retrieved<br><br>Format:HH:MM
          type: string
          format: alphanumeric
          example: '23:59'
          maxLength: 10
        transactionType:
          description: 'Specifies the nature of the transaction whether it was authorized or returned etc.<br><br>Visa - Not applicable<br><br>Mastercard - Optional<br><br>Possible Values:<br>"All" - Returns all Authorization transactions associated to a virtual card account for a given time range<br>"Approved" - Authorization requests that have an Approved Authorization status from the issuer or card network<br>"Partial-Approved" - Authorization requests that have a Partial Approval Authorization status from the issuer<br>"Declined" - Authorization requests that have a declined Authorization status from the issuer or card network<br>"Issuer-Declined" - Authorization requests that have an declined Authorization status from the issuer<br>"Request-Response" - Response to an authorization request. It carries the response information required to service (approve or deny) the Authorization Request.<br>"Advice-Response" - Response by an Issuer or System to either an Acquirer-generated, Issuer-generated, or System-generated Authorization Advice message Note: Advices for Issuer declines, that match an earlier Auth, do not generate a record and therefore will not be included in this filter.<br>"Reversal-Response" - Response to a reversal request and denotes the disposition of the Reversal Request'
          type: string
          format: alphanumeric
          example: All
          maxLength: 20
        vcaId:
          description: A reference number that uniquely identifies the virtual card account.
          type: string
          format: alphanumeric
          example: '67676781'
          maxLength: 19
        programId:
          description: Unique ID of the company record defined in the virtual cards system.<br><br>Mastercard - This value is returned in the ID Provisioning API. This value is generated when the VCA program is onboarded to Mastercard's VCA platform. Data format - Long (Numeric). Max character length - 19<br><br>Visa - This value is generated when the VCA program is onboarded to Visa's VCA platform. Data format - Alphanumeric. Max character length - 25
          type: string
          format: alphanumeric
          example: '233191'
          maxLength: 25
        messageId:
          description: Unique ID of the API message sent. The messageId will be provided back in the corresponding response. The ID must be unique per API request and cannot include special characters
          type: string
          format: alphanumeric
          example: CITI00000000AuthReport20230825120311
          maxLength: 36
          minLength: 28
        virtualCardAccountNumber:
          description: The virtual card account number to use for transactions.<br><br>Numeric field and no decimals allowed
          type: string
          format: alphanumeric
          example: '5281722601926445'
          maxLength: 16
        timeZone:
          description: Defines the time zone applicable for any date or time<br><br>UTC offset<br><br>Mastercard - Required<br>Visa - Not applicable
          type: string
          format: alphanumeric
          example: UTC+05:30
          maxLength: 9
        reportIds:
          description: 'An optional reportId array passed by client to fetch the Auth report transactions that previously returned a "PENDING" or "IN-PROGRESS" report status. When calling the API with reportId, pass all other request parameters as orignally passed in the previous request '
          type: array
