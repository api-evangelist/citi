          - CARD
          - GOOGLEPAY
          - APPLEPAY
          example: CARD
          title: type
    Refund-Transaction-Update:
      type: object
      title: Refund Transaction Update
      required:
      - id
      properties:
        id:
          description: "Unique Transaction identification provided by the merchant during  transaction update  \n- For CARD/GOOGLEPAY/APPLEPAY transactions, transaction.id parameter is mandatory and allowed maxmium length is 40."
          example: pay02052023456r
          maxLength: 128
          minLength: 1
          type: string
          title: id
        reference:
          description: "Transaction additional information. \n- For Brazil PIX Cancellation, this parameter is mandatory with min length 26 & mmax length 35 and input should be same as unique identifier (transaction.id) given during PIX Initiation"
          example: REPAY
          maxLength: 250
          minLength: 1
          type: string
          title: reference
        currency_code:
          type: string
          enum:
          - USD
          description: "ISO 4217 Currency Code for instance  USD/GBP/EUR. \n- For CARD/GOOGLEPAY/APPLEPAY transactions, transaction.currency_code parameter is mandatory"
          example: USD
          title: currency_code
        country_code:
          description: "The order country. \n- For CARD/GOOGLEPAY/APPLEPAY transactions, transaction.country_code parameter is mandatory"
          enum:
          - US
          example: US
          type: string
          title: country_code
        reason:
          description: 'Cancellation/refund/adjustment reason. '
          example: REPAY
          maxLength: 140
          minLength: 1
          type: string
          title: reason
        target_transaction_id:
          description: The identifier for the transaction you wish to refund, That is the {transactionId} URL parameter for REST and the transaction.id parameter for NVP.
          example: T123456789
          maxLength: 128
          minLength: 1
          type: string
          title: target_transaction_id
        correlation_id:
          description: A transient identifier for the request, that can be used to match the response to the request.
          example: TEFG123456
          maxLength: 128
          minLength: 1
          type: string
          title: correlation_id
    Restricted-Finx-Max-Text:
      maxLength: 35
      minLength: 1
      pattern: ^(?!\s*$).+
      type: string
      description: "Specifies a character string with a maximum length of 35 characters limited to character set X, that is, a-z A-Z / - ? : ( ) . , ‘ + . \n - For Brazil refund request, end_to_end_id parameter is mandatory and should be of length 35 "
      title: Restricted-Finx-Max-Text
    Original-Payment:
      type: object
      title: Original payment
      description: Either populate UETR OR (end_to_end_id AND value_date) for the refund to be processed
      properties:
        id:
          description: The original payment transaction identification
          example: pay02052023456r
          maxLength: 128
          minLength: 1
          type: string
          title: id
        uetr:
          type: string
          pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          description: "UUID v4 format unique end-to-end transaction reference. \n- This parameter is mandatory for ACH Return & Reversal."
          title: uetr
        value_date:
          type: string
          format: date
          description: Format YYYY-MM-DD Date in local time zone (e.g., EST for a United States RTP network transaction) when Citi's transaction processing application starts processing a transaction
          title: value_date
        amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000000
          description: "Instructed amount \n - Thailand PromptPay - Maximum amount is 2000000.00 \n - United States - Maximum amount is 1000000.00"
          title: amount
        currency_code:
          description: ISO 4217 code for the transaction instructed amount currency
          type: string
          enum:
          - INR
          - USD
          - BRL
          - GBP
          title: currency_code
