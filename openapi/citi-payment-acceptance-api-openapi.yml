openapi: 3.2.0
info:
  title: Payment Acceptance API
  description: 'Payment Acceptance API

    Update - April 28, 2026'
  contact:
    name: Standards & Developer Hub
    url: https://tts.sandbox.developer.citi.com/citiconnect/
    email: developer-support@citi.com
  version: 1.0.0
servers:
- url: https://tts.apib2b.citi.com/citiconnect/prod
  description: production gateway URL
- url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb
  description: sbox URL
- url: https://tts.sit.apib2b.citi.com/citiconnect/uat
  description: uat URL
tags:
- name: Payment-Acceptance
  description: Payment Acceptance API
paths:
  /digitalpayments/v1/payment-acceptance/methods:
    get:
      tags:
      - Payment-Acceptance
      summary: Payment Method Details
      description: Payment method details, merchant enabled payment method during onboarding details.
      operationId: getPayment-Method
      parameters:
      - $ref: '#/components/parameters/Client-Id'
      - $ref: '#/components/parameters/Merchant-Id'
      security:
      - clientCredentials: []
      responses:
        '200':
          description: Payment method
          headers:
            apim-guid:
              schema:
                type: string
              description: Citi's unique identification for your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment-Method-Response'
              examples:
                Payment-Method:
                  $ref: '#/components/examples/Payment-Method'
        '400':
          $ref: '#/components/responses/Bad-Get-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '429':
          $ref: '#/components/responses/Rate-Limit-Exceeded'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        '504':
          $ref: '#/components/responses/Gateway-Timeout'
  /digitalpayments/v1/payment-acceptance:
    post:
      tags:
      - Payment-Acceptance
      summary: Submit A Payment With Selected Payment Method
      description: Create a payment
      operationId: Payments
