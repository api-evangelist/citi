    CobDataDeVencimento:
      type: object
      title: Data de Vencimento
      required:
      - dataDeVencimento
      properties:
        dataDeVencimento:
          type: string
          format: date
          title: Data de vencimento da cobrança
          description: This is a date, in the format `YYYY-MM-DD`, as per ISO 8601. It is the collection due date. The collection can be paid with no late payment penalty or interest up to this date, at any time of the day.
          example: '2020-04-01'
        validadeAposVencimento:
          type: integer
          format: int32
          title: Validade após vencimento
          description: ' It is the number of calendar days after calendario.dateDeVencimento, in which the collection can be technically paid (with or without late payment penalties or interest).

            Whenever the due date falls on a weekend or a holiday for the paying user, it must be automatically extended to the first subsequent business day. all fields that make reference to this date (`PostExpiration validity`; `discount`; `interest` and `fine`) must assume this extension, when applicable.

            To illustrate how it works, here are some examples, where: - ``(#)`` represents the due date; - ``(*)`` represents the date adjusted in terms of non-working days; - the ``(<number>)`` correspond to the additional days of validity for the payment.

            Exemplo A:

            ```txt Expiration Date: 2020-10-20, Tuesday. validityAfter Expiration: 4

            Trying to pay on the day 2020-10-20, Tuesday: accepted. (#)(*) Trying to pay on the day 2020-10-21, Wednesday: accepted. (1) Trying to pay on 2020-10-22, Thursday: accepted. (two) Trying to pay on the day 2020-10-23, Friday: accepted. (3) Attempts to pay on 2020-10-24, Saturday: accepted. Attempts to pay on the day 2020-10-25, Sunday: accepted. (Holiday) Trying to pay on 2020-10-26, Monday: accepted. (4) Trying to pay on 2020-10-27, Tuesday: denied. ```

            Exemplo B:

            ```txt Expiration Date: 2020-12-25, Friday, holiday. validityAfterExpiration: 0

            Attempts to pay on the day 2020-12-25, Friday: accepted. (#)(Holiday) Attempts to pay on 2020-12-26, Saturday: accepted. Attempts to pay on 2020-12-27, Sunday: accepted. Trying to pay on the day 2020-12-28, Monday: accepted. (*) Trying to pay on 2020-12-29, Tuesday: denied. ```

            Exemplo C:

            ```txt Expiration Date: 2020-12-25, Friday, holiday. validityAfter Expiration: 1

            Attempts to pay on the day 2020-12-25, Friday: accepted. (#)(Holiday) Attempts to pay on 2020-12-26, Saturday: accepted. Attempts to pay on 2020-12-27, Sunday: accepted. Trying to pay on the day 2020-12-28, Monday: accepted. (*) Trying to pay on 2020-12-29, Tuesday: accepted. (1) Trying to pay on the day 2020-12-30, Wednesday: denied. ```

            Exemplo D:

            ```txt Expiration Date: 2020-12-25, Friday, holiday. validityAfter Expiration: 3

            Attempts to pay on the day 2020-12-25, Friday: accepted. (#)(Holiday) Attempts to pay on 2020-12-26, Saturday: accepted. Attempts to pay on 2020-12-27, Sunday: accepted. Trying to pay on the day 2020-12-28, Monday: accepted. (*) Trying to pay on 2020-12-29, Tuesday: accepted. (1) Attempts to pay on the day 2020-12-30, Wednesday: accepted. (two) Trying to pay on 2020-12-31, Thursday: accepted. (3) Trying to pay on 2021-01-01, Friday: denied. ```

            Exemplo E:

            ```txt Expiration Date: 2020-12-25, Friday, holiday. validityAfter Expiration: 4

            Attempts to pay on the day 2020-12-25, Friday: accepted. (#)(Holiday) Attempts to pay on 2020-12-26, Saturday: accepted. Attempts to pay on 2020-12-27, Sunday: accepted. Trying to pay on the day 2020-12-28, Monday: accepted. (*) Trying to pay on 2020-12-29, Tuesday: accepted. (1) Attempts to pay on the day 2020-12-30, Wednesday: accepted. (two) Trying to pay on 2020-12-31, Thursday: accepted. (3) Trying to pay on 2021-01-01, Friday: accepted. (Holiday) Attempts to pay on 2021-01-02, Saturday: accepted. Attempts to pay on 2021-01-03, Sunday: accepted. Trying to pay on 2021-01-04, Monday: accepted. (4) Trying to pay on 2021-01-05, Tuesday: denied. ```

            Exemplo F:

            ```txt Expiration Date: 2021-08-27, Friday. validityAfter Expiration: 5

            Trying to pay on the day 2020-08-27, Friday: accepted. (#)(*) Attempts to pay on the day 2020-08-28, Saturday: accepted. (1) Attempts to pay on the day 2020-08-29, Sunday: accepted. (two) Trying to pay on the day 2020-08-30, Monday: accepted. (3) Trying to pay on 2020-12-31, Tuesday: accepted. (4) Attempts to pay on the day 2020-12-01, Wednesday: accepted. (5) Trying to pay on 2020-12-02, Thursday: denied. ```

            Exemplo G:

            ```txt Expiration Date: 2021-08-28, Saturday. validityAfter Expiration: 5

            Attempts to pay on the day 2020-08-28, Saturday: accepted. (#) Attempts to pay on the day 2020-08-29, Sunday: accepted. Trying to pay on the day 2020-08-30, Monday: accepted. (*) Trying to pay on the day 2020-08-31, Tuesday: accepted. (1) Trying to pay on the day 2020-09-01, Wednesday: accepted. (two) Trying to pay on 2020-09-02, Thursday: accepted. (3) Trying to pay on the day 2020-09-03, Friday: accepted. (4) Trying to pay on the day 2020-09-04, Saturday: accepted. Trying to pay on the day 2020-09-05, Sunday: accepted. Trying to pay on the day 2020-09-06, Monday: accepted. (5) ```'
          default: 30
