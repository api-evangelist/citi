          description: Time(format YYYY-MM-DDThh:mm:ss.sssZ) when the transaction had taken place
          allOf:
          - $ref: '#/components/schemas/ISODateTime'
        originator:
          maxLength: 35
          minLength: 1
          pattern: ^[A-Z0-9]{4,4}[A-Z]{2,2}[A-Z0-9]{2,2}([A-Z0-9]{3,3}){0,1}$
          type: string
          description: Code allocated to a financial or non-financial institution by  the ISO 9362 Registration Authority, as described in ISO 9362 2014 Banking Banking telecommunication messages - Business identifier code (BIC)
        instructed_amount:
          type: object
          description: A number of monetary units specified in an active or a historic currency where the unit of currency is explicit and compliant with ISO 4217
          allOf:
          - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        confirmed_amount:
          required:
          - amount
          type: object
          properties:
            amount:
              type: string
              description: Its a Final confirmed amount after dedcution of charges.A number of monetary units specified in an active or a historic currency where the unit of currency is explicit and compliant with iso 4217.
            currency:
              pattern: ^[A-Z]{3,3}$
              type: string
              description: Its a Final Confirmed currency. A code allocated to a currency by a Maintenance Agency under an international identification scheme, as described in the latest edition of the international standard ISO 4217
          description: A number of monetary units specified in an active or a historic currency where the unit of currency is explicit and compliant with ISO 4217
        request_execution_date:
          type: object
          description: 'Date at which the initiating party requests the clearing agent to process the payment.  '
          allOf:
          - $ref: '#/components/schemas/ISODate'
        debtor:
          type: object
          description: Party that owes an amount of money to the (ultimate) creditor.
          allOf:
          - $ref: '#/components/schemas/PartyIdentification'
        debtor_account:
          type: object
