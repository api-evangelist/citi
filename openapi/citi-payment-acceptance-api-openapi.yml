        type: string
    Merchant-Post-Id:
      name: Merchant-Id
      in: header
      required: false
      description: "Your unique Merchant Identification number \n - Merchant ID header parameter is mandatory for payment methods - PIX (Brazil QR creation), CARD, BOLETO, PPRO, GOOGLEPAY, APPLEPAY, FPS and PAYPAL. \n- Merchant ID header parameter is not applicable for payment methods - ACH and RTP."
      schema:
        type: string
        maxLength: 40
        minLength: 1
        description: Your unique Merchant Identification number
      example: M123456987
    Get-Payment-End-To-End-Id:
      name: id
      in: query
      schema:
        type: string
        maxLength: 128
        minLength: 1
      description: "The transaction ID provided by client during transaction creation or transaction end-to-end-id received in incoming credit notification, \n- The id parameter is mandatory for inqury request."
      example: 1L00IF2BCWUZF09
    Event-Type:
      name: Event-Type
      in: header
      required: true
      description: Event Type
      schema:
        type: string
    Event-Name:
      name: Event-Name
      in: header
      required: true
      description: Event Type
      schema:
        type: string
    Idempotency-Id:
      name: Idempotency-Id
      in: header
      required: true
      description: "Your unique identification for a POST request \n - Maximum length is 128. \n-  CitiConnect API responds with an error (HTTP status 4XX) if your POST request idempotency identification value is a duplicate across a recent history of idempotency identifications in Citi's database."
      schema:
        type: string
        maxLength: 128
        description: "Your unique identification for a POST request \n - Maximum length is 128. \n-  CitiConnect API responds with an error (HTTP status 4XX) if your POST request idempotency identification value is a duplicate across a recent history of idempotency identifications in Citi's database. \n- If you don't receive any response (HTTP status 2XX, 4XX or 5XX) from Citi to your POST request and you wish to retry, reinitiate your request with the same idempotency identification to prevent accidental duplicate payment."
      example: a44cbb60-6de4-4edb-9a7a-123414bba3bb
    Id:
      name: id
      in: path
      required: true
      description: Your unique End To End identification
      schema:
        type: string
        maxLength: 128
        minLength: 1
        description: Your unique End To End identification
      example: abc-pay-123
    Apim-Guid:
      name: Apim-Guid
      in: header
      required: true
      description: Your unique Apim-Guid
      schema:
        type: string
        maxLength: 52
        minLength: 1
        description: Your unique Apim-Guid
        example: na-apimgwgtds04~4a98cbc5-d813-4e65-bc81-d70f0f87f6ec
    Merchant-Id:
      name: Merchant-Id
      in: header
      required: true
      description: Your unique Merchant Identification number
      schema:
        type: string
        maxLength: 40
        minLength: 1
        description: Your unique Merchant Identification number
      example: M123456987
    Patch-Operation:
      in: header
      name: Operation
      required: false
      description: API operation
      schema:
        type: string
        enum:
        - AUTHORIZE
        - CANCEL
        - PAY
        description: API operation
        example: CANCEL
    Post-Country-Code:
      name: Country-Code
      in: header
      schema:
        type: string
        maxLength: 2
        minLength: 2
        description: Country Code
      example: IN
    Post-Operation:
      in: header
      name: Operation
      required: false
      description: API operation
      schema:
        type: string
        enum:
        - CAPTURE
        - AUTHORIZE
        - PAY
        - VERIFY
        - DIRECTDEBIT
        description: API operation
        example: CAPTURE
    Type:
      name: type
      in: query
      schema:
        type: string
        enum:
        - ID
        - ENDTOENDID
        - ORDERID
        - UETR
      description: "Transaction identifier type. \n- Default search will be based on ID, if client not provided any value from dropdown list"
      example: ID
