openapi: 3.2.0
info:
  title: Citi Refunds API
  version: 1.0.0
  contact:
    name: Standards & Developer Hub
    url: https://tts.sandbox.developer.citi.com/citiconnect/
    email: developer-support@citi.com
  description: 'Operations tagged Refunds across 2 of this provider''s published API definitions: DigitalPaymentsCollectionsv12.yaml, express_payments_api.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://tts.apib2b.citi.com/citiconnect/prod
  description: production gateway URL
- url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb
  description: sbox URL
- url: https://tts.sit.apib2b.citi.com/citiconnect/uat
  description: uat URL
- url: https://b2b.api.icg.citi.com/citiconnect/prod
  description: production gateway url
- url: https://sandbox.b2b.api.icg.citi.com/citiconnect/sb
  description: 'sbox url '
tags:
- name: Refunds
  description: Refunds API
paths:
  /digitalpayments/v1/payment-acceptance/refunds:
    post:
      tags:
      - Refunds
      summary: Initiate An Outgoing Instant Refund Credit Transfer
      description: Return an incoming payment transaction to the sender using either the "end_to_end_id" and "value_date", or "UETR". The response to a refund transaction is asynchronous, which is either through a GET Refund request or as a push notification via webhook.
      operationId: refundPayments
      parameters:
      - $ref: '#/components/parameters/Client-Id'
      - $ref: '#/components/parameters/Idempotency-Id'
      - $ref: '#/components/parameters/Merchant-Refund-Id'
      - $ref: '#/components/parameters/Post-Country-Code'
      requestBody:
        description: Refund Initiation Request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refunds-Request'
            examples:
              Brazil Pix Refund Transfer:
                $ref: '#/components/examples/Brazil-Pix-Refund-Initiation-Request-Example'
              US Card Refund Transfer:
                $ref: '#/components/examples/US-Card-Refund-Initiation-Request-Example'
              US ACH Refund Transfer:
                $ref: '#/components/examples/US-Ach-Refund-Initiation-Request-Example'
              India Card Refund Transfer:
                $ref: '#/components/examples/India-Card-Refund-Initiation-Request-Example'
              India UPI Refund Transfer:
                $ref: '#/components/examples/India-Upi-Refund-Initiation-Request-Example'
              UK Refund Transfer:
                $ref: '#/components/examples/Uk-Ip-Refund-Initiation-Request-Example'
              US Ach Return And Reversal:
                $ref: '#/components/examples/Us-Ach-Retrun-Reversal-Request-Example'
              US Googlepay Refund Transfer:
                $ref: '#/components/examples/Googlepay-Refund-Initiation-Request-Example'
              US Applepay Refund Transfer:
                $ref: '#/components/examples/Applepay-Refund-Initiation-Request-Example'
              US Paypal Refund Transfer:
                $ref: '#/components/examples/Us-Paypal-Refund-Initiation-Request-Example'
              US PPRO Refund Transfer:
                $ref: '#/components/examples/PPRO-Refund-Initiation-Request-Example'
      security:
      - clientCredentials: []
      callbacks:
        payment-refund-success:
          $ref: '#/components/callbacks/Payment-Refund-Created-Status'
        payment-refund-failed:
          $ref: '#/components/callbacks/Payment-Refund-Failed-Status'
        payment-refund-pending:
          $ref: '#/components/callbacks/Payment-Refund-Pending-Status'
      responses:
        '202':
          description: Accepted
          headers:
            apim-guid:
              schema:
                type: string
              description: Citi's unique identification for your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment-L0-Refund-Notification'
              examples:
                CardPaymentCreatedSucessResponse:
                  $ref: '#/components/examples/Payment-Refund-Card-Sucess-Response'
                IndiaCardPaymentCreatedSucessResponse:
                  $ref: '#/components/examples/India-Payment-Refund-Card-Sucess-Response'
                PixPaymentCreatedSucessResponse:
                  $ref: '#/components/examples/Payment-Refund-Pix-Sucess-Response'
                UpiPaymentCreatedSucessResponse:
                  $ref: '#/components/examples/Payment-Refund-India-Upi-Sucess-Response'
                UkPaymentCreatedSucessResponse:
                  $ref: '#/components/examples/Payment-Refund-Uk-Ip-Sucess-Response'
                UsAchReturnAndRevesalCreatedSuccessResponse:
                  $ref: '#/components/examples/Us-Ach-Return-And-Revesal-Success-Response'
                GooglepayPaymentCreatedSucessResponse:
                  $ref: '#/components/examples/Googlepay-Refund-Card-Sucess-Response'
                ApplepayPaymentCreatedSucessResponse:
                  $ref: '#/components/examples/Applepay-Refund-Card-Sucess-Response'
                PproPaymentCreatedSucessResponse:
                  $ref: '#/components/examples/Ppro-Refund-Card-Sucess-Response'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '429':
          $ref: '#/components/responses/Rate-Limit-Exceeded'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        '504':
          $ref: '#/components/responses/Gateway-Timeout'
        default:
          $ref: '#/components/responses/Internal-Server-Error'
    get:
      tags:
      - Refunds
      summary: Get refund transaction details
      description: 'Receive transaction status of the transaction for last 90 days using the additional parameter. End-To-End-Id or UETR or Country-Code or Original Payment UETR is mandatory.

        - For ACH Return & Reversal, you can retrieve transaction details using original_payment_uetr.'
      operationId: getrefundpaymentstatus
      parameters:
      - $ref: '#/components/parameters/Client-Id'
      - $ref: '#/components/parameters/End-To-End-Id'
      - $ref: '#/components/parameters/Country-Code'
      - $ref: '#/components/parameters/Uetr'
      - $ref: '#/components/parameters/Original-Payment-Uetr'
      - $ref: '#/components/parameters/Creation-Date-Time-Start'
      - $ref: '#/components/parameters/Creation-Date-Time-End'
      - $ref: '#/components/parameters/Amount'
      - $ref: '#/components/parameters/Status'
      - $ref: '#/components/parameters/Offset-Param'
      - $ref: '#/components/parameters/Limit-Param'
      security:
      - clientCredentials: []
      responses:
        '200':
          description: Payment status
          headers:
            apim-guid:
              schema:
                type: string
              description: Citi's unique identification for your request
            result:
              schema:
                type: integer
                minimum: 1
                maximum: 1000
                default: 100
              description: Number of transaction status matching your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refunds-Response'
              examples:
                Brazil Pix Refund Transfer:
                  $ref: '#/components/examples/Payment-Refund-Pix-Sucess-Notification'
                Card Refund Transfer:
                  $ref: '#/components/examples/Payment-Refund-Card-Sucess-Notification'
                India UPI Refund Transfer:
                  $ref: '#/components/examples/Payment-Refund-India-Upi-Sucess-Notification'
                Uk PAYBYBANK Refund Transfer:
                  $ref: '#/components/examples/Payment-Refund-Uk-Sucess-Notification'
                US ACH RETURN AND REVERSAL:
                  $ref: '#/components/examples/Us-Ach-Retrun-Reversal-Success-Notification'
                Googlepay Refund Transfer:
                  $ref: '#/components/examples/Googlepay-Refund-Card-Sucess-Notification'
                Applepay Refund Transfer:
                  $ref: '#/components/examples/Applepay-Refund-Card-Sucess-Notification'
                Ppro Refund Transfer:
                  $ref: '#/components/examples/Ppro-Refund-Card-Sucess-Notification'
        '400':
          $ref: '#/components/responses/Bad-Get-Request2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '429':
          $ref: '#/components/responses/Rate-Limit-Exceeded'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        '504':
          $ref: '#/components/responses/Gateway-Timeout'
    servers:
    - url: https://tts.apib2b.citi.com/citiconnect/prod
      description: production gateway URL
    - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb
      description: sbox URL
    - url: https://tts.sit.apib2b.citi.com/citiconnect/uat
      description: uat URL
  /digitalpayments/v1/payment-acceptance/refunds/{id}:
    patch:
      tags:
      - Refunds
      summary: Update a payment with selected payment method
      description: Update a payment.
      operationId: refundUpdate
      parameters:
      - $ref: '#/components/parameters/Idempotency-Id'
      - $ref: '#/components/parameters/Client-Id'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Merchant-Post-Id'
      - $ref: '#/components/parameters/Refund-Patch-Operation'
      - $ref: '#/components/parameters/Post-Country-Code'
      requestBody:
        description: Update a payment with selected payment method.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refund-Update-Request'
            examples:
              US Card Refund Update Request:
                $ref: '#/components/examples/Us-Refund-Update-Request-Example'
              US Card Refund Cancel Request:
                $ref: '#/components/examples/Us-Refund-Cancel-Request-Example'
              US GooglePay Refund Cancel Request:
                $ref: '#/components/examples/Us-Google-Pay-Refund-Cancel-Request-Example'
              US ApplePay Refund Cancel Request:
                $ref: '#/components/examples/Us-Apple-Pay-Refund-Cancel-Request-Example'
      security:
      - clientCredentials: []
      callbacks:
        refund-cancel-success:
          $ref: '#/components/callbacks/Refund-Cancel-Success'
        refund-cancel-failed:
          $ref: '#/components/callbacks/Refund-Cancel-Failed'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Not-Found'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type'
        '429':
          $ref: '#/components/responses/Rate-Limit-Exceeded'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
        '504':
          $ref: '#/components/responses/Gateway-Timeout'
    servers:
    - url: https://tts.apib2b.citi.com/citiconnect/prod
      description: production gateway URL
    - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb
      description: sbox URL
    - url: https://tts.sit.apib2b.citi.com/citiconnect/uat
      description: uat URL
  /paymentservices/v1/refunds:
    post:
      tags:
      - Refunds
      summary: Initiate an outgoing instant refund credit transfer
      description: Return an incoming payment transaction to the sender using either the “end_to_end_id” and "value_date”, or “UETR”. The response to a refund transaction is asynchronous, which is either through a GET Refund request or as a push notification via webhook.
      operationId: expressRefundInitiation
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: Your unique identification, same as the identification you use for OAuth token generation, Citi shared with you during your CitiConnect API onboarding
        example: 6d3cf821-db6d-496d-bec0-064a362e9c31
      - name: Idempotency-Id
        in: header
        required: true
        schema:
          type: string
          maxLength: 128
        example: a44cbb60-6de4-4edb-9a7a-123414bba3bb
        description: "Your unique identification for a POST request \n - Maximum length is 128. \n-  CitiConnect API responds with an error (HTTP status 4XX) if your POST request idempotency identification value is a duplicate across a recent history of idempotency identifications in Citi's database. \n- If you don't receive any response (HTTP status 2XX, 4XX or 5XX) from Citi to your POST request and you wish to retry, reinitiate your request with the same idempotency identification to prevent accidental duplicate payment."
      requestBody:
        required: true
        description: Return an incoming payment transaction to the sender using either the “end_to_end_id” and "value_date”, or “UETR”. The response to a refund transaction is asynchronous, which is either through a GET Refund request or as a push notification via webhook.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refunds-Initiation'
            examples:
              TH Refund Transfer:
                $ref: '#/components/examples/Th-Refund-Initiation-Request-Example'
              BR Refund Transfer:
                $ref: '#/components/examples/Br-Refund-Initiation-Request-Example'
              US Refund Transfer:
                $ref: '#/components/examples/Us-Refund-Initiation-Request-Example'
              SEPA Refund Transfer:
                $ref: '#/components/examples/SEPA-Refund-Initiation-Request-Example'
      security:
      - oAuth2:
        - paymentservices
      callbacks:
        Refund-Notification:
          $ref: '#/components/callbacks/Refund-Notification'
      responses:
        '202':
          description: Accepted
          headers:
            request_id:
              schema:
                type: string
              description: Citi's unique identification for your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refunds'
              examples:
                OK:
                  $ref: '#/components/examples/Refund-Initiation-Response-Example'
        '400':
          $ref: '#/components/responses/Bad-Request_2'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '404':
          $ref: '#/components/responses/Not-Found_2'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed_2'
        '409':
          $ref: '#/components/responses/Conflict_2'
        '415':
          $ref: '#/components/responses/Unsupported-Media-Type_2'
        '500':
          $ref: '#/components/responses/Internal-Server-Error_2'
        default:
          $ref: '#/components/responses/Internal-Server-Error_2'
    get:
      tags:
      - Refunds
      summary: Inquire for the latest status of refund transations matching additional…
      description: Get the latest refund transactions statuses initiated through the refund initiation endpoint using matching criteria. Currently, you can get the latest transactions statuses up to 90 days from the refund initiation date. If the latest transactions statuses date is 90+ days, the endpoint responds with HTTP status 404 (not found).
      operationId: findRefunds
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: Your unique identification, same as the identification you use for OAuth token generation, Citi shared with you during your CitiConnect API onboarding
        example: 6d3cf821-db6d-496d-bec0-064a362e9c31
      - name: end_to_end_id
        in: query
        description: The end to end ID included in the refund by the sender of the refund
        schema:
          $ref: '#/components/schemas/Restricted-Finx-Max-Text_2'
        examples:
          refund_transaction_details_1:
            value: 1L00IF2BCWUZF09
      - name: original_payment_uetr
        in: query
        description: The unique ‘UETR’ reference assigned to the original incoming credit on your account for which a refund was initiated. If multiple refunds were initiated against an incoming credit, the response API will include all these refunds
        schema:
          type: string
          pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
        examples:
          refund_transaction_details_1:
            value: 0c4fb98b-d77a-4468-96bb-0c88b3b8f75a
      - name: creation_date_time_start
        in: query
        description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n - Start of date time, generated by CitiConnect API, when CitiConnect API accepted a refund initiation after validation"
        schema:
          $ref: '#/components/schemas/Iso-Normalised-Date-Time'
        examples:
          refund_transaction_details_1:
            value: '2022-09-13T08:23:49.114Z'
      - name: creation_date_time_end
        in: query
        description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n - end of date time, generated by CitiConnect API, when CitiConnect API accepted a refund initiation after validation"
        schema:
          $ref: '#/components/schemas/Iso-Normalised-Date-Time'
        examples:
          refund_transaction_details_1:
            value: '2022-09-13T08:23:49.114Z'
      - name: instructed_amount
        in: query
        description: refund amount
        schema:
          type: number
          maximum: 1000000000000000
        examples:
          refund_transaction_details_1:
            value: 73945.27
      - name: status_code
        in: query
        description: ISO 20022 transaction status code
        schema:
          type: string
          enum:
          - ACCC
          - ACTC
          - RJCT
        examples:
          refund_transaction_details_1:
            value: ACCC
      - $ref: '#/components/parameters/Off-Set-Param'
      - $ref: '#/components/parameters/Limit-Param'
      security:
      - oAuth2:
        - paymentservices
      responses:
        '200':
          description: Refund status
          headers:
            request_id:
              schema:
                type: string
              description: Citi's unique identification for your request
            result:
              schema:
                type: integer
                minimum: 1
                maximum: 1000
                default: 100
              description: Number of transaction status matching your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refunds-Response_2'
              examples:
                Ok-ResponseExample:
                  $ref: '#/components/examples/Ok-Refund-Response-Multiple-Example'
        '400':
          $ref: '#/components/responses/Bad-Request_2'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '404':
          $ref: '#/components/responses/Not-Found_2'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed_2'
        '500':
          $ref: '#/components/responses/Internal-Server-Error_2'
        default:
          $ref: '#/components/responses/Internal-Server-Error_2'
    servers:
    - url: https://b2b.api.icg.citi.com/citiconnect/prod
      description: production gateway url
    - url: https://sandbox.b2b.api.icg.citi.com/citiconnect/sb
      description: 'sbox url '
  /paymentservices/v1/refunds/{refund_id}:
    get:
      tags:
      - Refunds
      summary: Inquire for the latest status of a transaction using refund_id
      description: '"Get the latest refund transaction status initiated through the refund initiation endpoint. Currently, you can get the latest transaction status up to 90 days from the refund initiation date. If the latest transaction status date is 90+ days, the endpoint responds with HTTP status 404 (not found)"'
      operationId: findRefundById
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: Your unique identification, same as the identification you use for OAuth token generation, Citi shared with you during your CitiConnect API onboarding
        example: 6d3cf821-db6d-496d-bec0-064a362e9c31
      - name: refund_id
        in: path
        description: 'Unique Refund reference Id, generated during refund initiation and provided to you in the synchronous response to your refund POST request '
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
        examples:
          payment_transaction_details_1:
            value: 0c4fb98b-d77a-4468-96bb-0c88b3b8f75a
      security:
      - oAuth2:
        - paymentservices
      responses:
        '200':
          description: OK
          headers:
            request_id:
              schema:
                type: string
              description: Citi's unique identification for your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refunds'
              examples:
                Refund Status - Completed:
                  $ref: '#/components/examples/Ok-Refund-Response'
                Refund Status - Rejected:
                  $ref: '#/components/examples/Ok-Refund-Response-Failed'
        '400':
          $ref: '#/components/responses/Bad-Request_2'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '404':
          $ref: '#/components/responses/Not-Found_2'
        '405':
          $ref: '#/components/responses/Method-Not-Allowed_2'
        '500':
          $ref: '#/components/responses/Internal-Server-Error_2'
        default:
          $ref: '#/components/responses/Internal-Server-Error_2'
    servers:
    - url: https://b2b.api.icg.citi.com/citiconnect/prod
      description: production gateway url
    - url: https://sandbox.b2b.api.icg.citi.com/citiconnect/sb
      description: 'sbox url '
