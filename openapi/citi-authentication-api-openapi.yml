          example: PA123456789
          maxLength: 50
          minLength: 1
          type: string
          title: token_number
        token_type:
          description: Token type.
          enum:
          - ALT_TOKEN
          - NETWORK_TOKEN
          - ISSUER_TOKEN
          - CITI_TOKEN
          example: ISSUER_TOKEN
          type: string
          title: token_type
        session_id:
          description: Session identification number
          type: string
          minLength: 36
          maxLength: 37
          example: SES1234567890123456789012345678
          title: session_id
    Customer-Authentication-Response:
      title: Customer Authentication Response
      properties:
        account:
          title: customer account authentication response
          description: Account Details
          properties:
            number:
              description: Your identifier for the payer's account with you (immutable ID).
              example: 1234abcjki
              maxLength: 40
              minLength: 1
              type: string
              title: number
