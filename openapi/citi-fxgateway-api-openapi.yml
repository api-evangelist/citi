components:
  schemas:
    Order_Acknowledged_Or_Rejected:
      description: The response will be published via web socket for Acknowledged or Rejected orders. In case of multiple orders, multiple dealResponses JSON objects will be present in the dealResponses JSON array. Response array can be of both Ack, Nack. This is also applicable for cancelled and cancel rejection. Upon receipt of the deal request, you will receive a status update as ACKNOWLEDGED (with orderId) or REJECTED (without orderId).
      required:
      - action
      - jsonReqId
      - senderCompId
      - onBehalfOfCompId
      - sendingTime
      - dealResponses
      properties:
        action:
          type: string
          example: order-response
          description: 'Defines the action of the message. Allowed value: order-response.'
        jsonReqId:
          type: string
          example: Req20181011776
          description: The unique identifier for the JSON request. Format is alphanumeric.
          maxLength: 60
        senderCompId:
          type: string
          description: The Citi-assigned value used to identify the firm sending the message.
          example: ClientName
        onBehalfOfCompId:
          type: string
          description: The Citi-assigned value used to identify the sub-entity. This was assigned to you during onboarding.
          example: Sub Entity
        sendingTime:
          type: string
          description: The time of message transmission. Always expressed in UTC (Universal Time Coordinated, also known as 'GMT.' Format is YYYYMMDD-HH:MM:SS.mmm.
          example: 20180820-04:48:29.125
        deals:
          type: array
          items:
            required:
            - account
            - clOrdId
            - ccyPair
            - dealtCcy
            - orderQty
            - side
            - fixingCode
            - transactTime
            - execId
            - avgPx
            - orderStatus
            - purposeCode
            properties:
              account:
                type: string
                description: Your Citi-assigned client identifier.
                example: 109430258
              clOrdId:
                type: string
                description: The order reference you assigned.
                example: TEST12345
              side:
                type: string
                enum:
                - B
                - S
                description: Indicates whether you are buying (B) or selling (S) the dealt ccy.
                example: B
              valueDate:
                type: string
                description: Populated for Acknowledged deal.
                example: '20240502'
              tradeDate:
                type: string
                description: Populated for Acknowledged deal.
                example: '20240429'
              purposeCode:
                type: string
                description: Populates with the same value as sent in the incoming request, else null.
              ccyPair:
                type: string
                description: The currency pair that you are trading on.
                maxLength: 6
                example: GBPUSD
              dealtCcy:
                type: string
                description: The currency for which you supplied the dealt amount.
                maxLength: 3
                example: GBP
              fixingCode:
                type: string
                description: The fixing code you requested when sending the deal.
                example: QOUTED
              transactTime:
                type: string
                description: The time of the transaction represented by this single order occurrance.
                example: Mon Apr 29 12:50:33 IST 2024
              execId:
                type: string
                description: Populates as 0 for an Acknowledged deal or a unique identifier for a Rejected deal.
                example: 0 (or) Alphanumeric & special character hyphen (-)
              avgPx:
                type: number
                description: The calculated average price of all fills on this order.
                example: 0
              orderId:
                type: number
                description: The Citi-assigned order ID for an Acknowledged deal. This field is not populated for Rejected deals.
                example: 3714864
              orderStatus:
                type: string
                description: The current status of the deal.
                example: ACKNOWLEDGED or REJECTED
              lastQty:
                type: number
                description: Populates with value 0 only for Acknowledged deals.
                example: 0
              cumQty:
                type: number
                description: Populates with value 0 only for Rejected deals.
              leavesQty:
                type: number
                description: Populates with value 0 only for Rejected deals.
              execType:
                type: number
                description: Populates with value 8 for Rejected deals. Does not get populated for Acknowledged deals.
                example: 8
              ordRejReason:
                type: number
                description: Applicable only for Rejected deals. Contains the rejection code.
                example: 99
              text:
                type: string
                description: Applicable only for Rejected deals. Contains actual rejection reason.
                example: 0
              secondaryClOrdId:
                type: string
                description: Secondary order reference.
                example: OR12345
              valueDate2:
                type: string
                description: Far Leg Value Date. Applicable for SWAP orders only. Date format is yyyyMMdd.
                example: 20250525
              orderQty2:
                type: string
                description: Far Leg Amount. Applicable for SWAP orders only.
                example: 1000
      example:
        senderCompId: TESTCLIENT0
        onBehalfOfCompId: TCL0
        action: order-response
        jsonReqId: e4c0bb9-6
        sendingTime: 20240429-07:20:36.683
        senderSubId: System
        dealResponses:
        - account: LDN|xxxxxxxxxx
          clOrdId: TEST98
          side: S
          fixingCode: QUOTED
          transactTime: Mon Apr 29 07:20:35 GMT 2024
          valueDate: '20240502'
          tradeDate: '20240429'
          dealtCcy: USD
          ccyPair: EURUSD
          execId: '0'
          avgPx: '0.0'
          orderId: '3714864'
          orderStatus: ACKNOWLEDGED
          lastQty: '0'
          purposeCode: 'null'
    Order_Rated:
      description: The response will be published via web socket for Rated orders. In case of multiple orders, multiple dealResponses JSON objects will be present in the dealResponses JSON array.
      required:
      - action
      - jsonReqId
      - senderCompId
      - onBehalfOfCompId
      - sendingTime
      - dealResponses
      properties:
        action:
          type: string
          description: 'Defines the action of the message. Allowed value: order-response.'
          example: order-response
        jsonReqId:
          type: string
          example: Req20181011776
          description: The unique identifier for the JSON request. Format is alphanumeric.
          maxLength: 60
        senderCompId:
          type: string
          description: The Citi-assigned value used to identify the firm sending the message.
          example: ClientName
        onBehalfOfCompId:
          type: string
          description: The Citi-assigned value used to identify the sub-entity. This was assigned to you during onboarding.
          example: Sub Entity
        sendingTime:
          type: string
          description: The time of message transmission. Always expressed in UTC (Universal Time Coordinated, also known as 'GMT.' Format is YYYYMMDD-HH:MM:SS.mmm.
          example: 20180820-04:48:29.125
        deals:
          type: array
          items:
            required:
