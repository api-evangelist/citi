        - name: body
          required: true
          in: body
          description: contains consumer id's and other optional to validate the status
          schema:
            $ref: '#/definitions/TaxIdValidationRequest'
      consumes:
        - application/json
      produces:
        - application/json
      operationId: validateTaxIdDetails
      summary: >-
        This API has the ability to check status of the given taxId as well
        as         the eligibility information.
      tags:
        - TaxIdValidation
      description: >-
        TaxId validation API has the ability to valdate status of the
        given         taxId and other eligibility information in Json format.
        This          functionality can be access with following input fields
        tax id, tax id         name, country code and other optional details.
        <br><br><font         size='2'><b>Content-Type</b> :
        application/json.         <br><b>Authorization</b> : The OAuth Token
        prefixed with Bearer and         space in between.
definitions:
  BeneficiaryValidationResponse:
    type: object
    properties:
      debtor:
        title: debtor
        allOf:
          - $ref: '#/definitions/AccountInfo'
        xml:
          name: Debtor
      creditor:
        title: creditor
        allOf:
          - $ref: '#/definitions/AccountInfo'
        xml:
          name: Creditor
      additional_information:
        title: additional_information
        allOf:
          - $ref: '#/definitions/AdditionalInformation'
        xml:
          name: AdditionalInformation
      lookup_status_information:
        title: lookup_status_information
        allOf:
          - $ref: '#/definitions/LookupStatusInformation'
        xml:
          name: LookupStatusInformation
    xml:
      name: BeneficiaryValidationResponse
  AccountInfo:
    type: object
    properties:
      name:
        type: string
        description: >-
          Name by which a party is known and which is usually used to identify
          that party
        maxLength: 140
        xml:
          name: Name
      alias:
        title: alias
        type: string
        description: Alias name of the party used for identification.
        maxLength: 140
        xml:
          name: Alias
      resolved_name:
        type: string
        description: Actual account name of the party resolved by backend system.
        maxLength: 140
        xml:
          name: RslvdName
      owner_type:
        type: string
        description: >
          Describes the type of party who owns the respective proxy/alias,
          either an Individual(NATURAL_PERSON) or Corporate(LEGAL_PERSON)
        maxLength: 30
        xml:
          name: OwnerTp
      tax_id:
        type: string
        description: |
          Tax identification number of the party.
        minLength: 8
        maxLength: 16
        xml:
          name: TaxId
      country_code:
        type: string
        description: >-
          Country where the request is initiated for beneficiary account
          search/validation in ISO 3166-1 alpha-2 format
        maxLength: 2
        xml:
          name: CtryCode
      bank_code:
        type: string
        description: >
          Bank identification code of the party used for identification of a
          financial institution
        maxLength: 10
        xml:
          name: BkCode
      branch_id:
        title: branch_id
        type: string
        description: >
          Branch identification identification code of the party used for
          identification of a financial institution
        maxLength: 10
        xml:
          name: BrnchId
      account_id:
        title: account_id
        type: string
        description: Account number of the party as provided in the Input API request
        maxLength: 35
        xml:
          name: AcctId
      proxy_type:
        title: proxy_type
        type: string
        description: |
          Type of the proxy value used for validation/search
        maxLength: 35
        xml:
          name: ProxyTp
      proxy_value:
        title: proxy_value
        type: string
        description: >-
          Actual proxy value related to the proxy type used for
          validation/search
        maxLength: 70
        xml:
          name: ProxyVal
      account_type:
        title: account_type
        type: string
        description: |
          Account type of the party."
        maxLength: 20
        xml:
          name: AcctTp
      account_currency:
        title: account_currency
        type: string
        description: >
          Identification of the currency in which the account is held.


          Single & mMltiple account currency is supported which are seperated by
          comma.
        pattern: ^[A-Z]{3}(,[A-Z]{3})*$
        xml:
          name: AcctCcy
      account_opening_date:
        title: account_opening_date
        type: string
        maxLength: 8
        description: >
          Date to identify when the Account is Operationally available for
          business transactions in business date format YYYYMMDD
        xml:
          name: AcctOpeningDate
      trade_name:
        title: trade_name
        type: string
        description: >
          Describes the trade name of the party who owns the respective
          proxy/alias
        maxLength: 100
        xml:
          name: TradeName
      document_type:
        title: document_type
        type: string
        description: |
          Name of Tax ID based on the country

          Example - Tax ID for Peru is 'RUC'.
        maxLength: 10
        xml:
          name: DcType
      document_number:
        title: document_number
        type: string
        description: |
          Unique Tax Identification number of the party.
        maxLength: 25
        xml:
          name: DcNumber
      account_verification_status:
        title: account_verification_status
        type: string
        description: |
          Account status details received from Early Warning Systems (EWS). 
        maxLength: 20
        xml:
          name: accountverificationstatus
      account_verification_description:
        title: account_verification_description
        type: string
        description: >
          Account status description details received from Early Warning Systems
          (EWS). 
        maxLength: 200
        xml:
          name: accountverificationdescription
      account_owner_status:
        title: account_owner_status
        type: string
        description: |
          Account status details received from Early Warning Systems (EWS). 
        maxLength: 20
        xml:
          name: accountownerstatus
      account_owner_description:
        title: account_owner_description
        type: string
        description: >
          Account status description details received from Early Warning Systems
          (EWS). 
        maxLength: 200
        xml:
          name: accountownerdescription
      firstname:
        title: firstname
        type: string
        description: >
          Beneficiary First Name verification response received from Early
          Warning Systems (EWS). 
        maxLength: 6
        xml:
          name: firstname
      lastname:
        title: lastname
        type: string
        description: >
          Beneficiary Last Name verification response received from Early
          Warning Systems (EWS). 
        maxLength: 6
        xml:
          name: lastname
      dob:
        title: dob
        type: string
        description: >
          Beneficiary date of birth verification response received from Early
          Warning Systems (EWS). 
        maxLength: 6
        xml:
          name: dob
      address_line1:
        title: address_line1
        type: string
        description: >
          Beneficiary Address line1 verification response received from Early
          Warning Systems (EWS). 
        maxLength: 6
        xml:
          name: address_line1
      address_line2:
        title: address_line2
        type: string
        description: >
          Beneficiary Address line2 verification response received from Early
          Warning Systems (EWS). 
        maxLength: 6
        xml:
          name: address_line2
      city:
        title: city
        type: string
        description: >
          Beneficiary city verification response received from Early Warning
          Systems (EWS). 
        maxLength: 6
        xml:
          name: city
      state:
        title: state
        type: string
        description: >
          Beneficiary city verification response received from Early Warning
          Systems (EWS). 
        maxLength: 6
        xml:
          name: state
      zip:
        title: zip
        type: string
        description: >
          Beneficiary zipcode verification response received from Early Warning
          Systems (EWS). 
        maxLength: 6
        xml:
          name: zip
      home_phone:
        title: home_phone
        type: string
        description: >
          Beneficiary home phone number verification response received from
          Early Warning Systems (EWS). 
        maxLength: 6
        xml:
          name: home_phone
      work_phone:
        title: work_phone
        type: string
        description: >
          Beneficiary work phone number verification response received from
          Early Warning Systems (EWS). 
        maxLength: 6
        xml:
          name: work_phone
      id_type:
        title: id_type
        type: string
        description: >
          Beneficiary identification type verification response received from
          Early Warning Systems (EWS). 
        maxLength: 6
        xml:
          name: id_type
      id_no:
        title: id_no
        type: string
        description: >
          Beneficiary identification number verification response received from
          Early Warning Systems (EWS). 
        maxLength: 6
        xml:
          name: id_no
      id_issuanceplace:
        title: id_issuanceplace
        type: string
        description: >
          Beneficiary identification issuance place verification response
          received from Early Warning Systems (EWS). 
        maxLength: 6
        xml:
          name: id_issuanceplace
      additional_information:
        title: additional_information
        type: string
        description: >
          Additional information received in the payload request for Early
          Warning Systems (EWS). 
        maxLength: 255
        xml:
          name: additional_information
      creditor_name:
        title: creditor_name
        type: string
        description: >
          Account name of the creditor intended for search/validation whose
          payment amount will be credited.

          For early warning system (EWS), if the verification_type = (BANKOWN or
          BASICVR) either creditor_firstname & creditor_lastname or
          creditor_name (Business Name) should be passed. Business name maximum
          allowed length 87 characters. 
        maxLength: 140
        minLength: 3
        xml:
          name: creditor_name
  AdditionalInformation:
    type: object
    properties:
      end_to_end_id:
        type: string
        description: >
          Unique identification assigned by the initiating party to
          unambiguously identify the transaction which can be used for
          reconciliation or to link tasks relating to the transaction. It can be
          included in several messages related to the transaction.
        maxLength: 32
        xml:
          name: EndtoEndId
      value_date:
        type: string
        description: >
          Requested execution date post alias resolution when the payment needs
          to be processed for settlement, format would be YYYYMMDD.
        maxLength: 8
        xml:
          name: ValueDate
      proxy_status:
        type: string
        description: >
          Describes the status of Alias/Proxy - whether Active, Inactive or
          Deleted
        maxLength: 20
        xml:
          name: ProxySts
      banelco_flag:
        type: string
        description: >
          Flag will be 'Y' for successfull search/validation & 'N' for failure
          case.
        maxLength: 1
        xml:
          name: BanFlag
      clearing_system_id:
        title: clearing_system_id
        type: string
        description: |
          Unique reference, as assigned by a clearing system.
        maxLength: 16
        xml:
          name: ClrSysId
  LookupStatusInformation:
    type: object
    properties:
      lookup_reference:
        type: string
        description: >-
          unique reference number of the request.This is e2e tracking reference
          from CCD. It will be provided by Concord.
        maxLength: 35
        xml:
          name: LkUpRef
      lookup_response_status:
        type: string
        description: >-
          status(SUCCESS / FAILURE) of the request and get processed
          successfully. If account exist then status is SUCCESS else FAILURE.
        maxLength: 10
        xml:
          name: Status
      status_code:
        type: string
        description: >-
          Response status of validation-Complete with data from Status
          Validation.
        maxLength: 3
        xml:
          name: StCod
      status_message:
        type: string
        description: >-
          Response message of validation-Complete with data from Message
          Validation.
        maxLength: 100
        xml:
          name: StMessage
  ErrorDetail:
    properties:
      code:
        description: Unique ID for the error code
        maxLength: 7
        type: string
      issue:
        title: issue
        description: more details about the  issue
        maxLength: 200
        type: string
      action:
        title: action
        description: corrective action to be taken to resolve above issue
        maxLength: 350
        type: string
    type: object
  ErrorResponse:
    properties:
      ref_id:
        title: ref_id
        description: Unique ID for the Transaction
        maxLength: 60
        type: string
      error_details:
        title: error_details
        items:
          $ref: '#/definitions/ErrorDetail'
        type: array
    type: object
  TaxIdErrorResponse:
    properties:
      errors:
        items:
          $ref: '#/definitions/ErrorDetail'
        type: array
      http_code:
        title: http_code
        description: Http Status code
        format: int32
        maxLength: 3
        type: integer
      ref_id:
        title: ref_id
        description: Unique ID for the Transaction
        maxLength: 60
        type: string
      status:
        title: status
        description: Status of the Transaction SUCCESS/FAILURE
        maxLength: 20
        type: string
    type: object
  TaxIdValidationRequest:
    description: contains consumer id's and other optional  to validate the status
    properties:
      additional_info:
        additionalProperties:
          type: string
        description: >-
          It is generic place holder object, it allows any generic key and value
          pairs
        type: object
      country_code:
        description: indicates the tax_id's country
        pattern: ^[A-Z]{2}$
        type: string
      tax_id:
        description: >-
          tax_id is the personal identification number given by the regulator
          body
        pattern: ^[A-Z a-z]{5}[0-9]{4}[A-Z a-z]{1}$
        type: string
      tax_id_name:
        description: >-
          tax_id_name is the name maintained under personal identification
          number given by the regulator body
        maxLength: 200
        minLength: 1
        type: string
    required:
      - country_code
      - tax_id
      - tax_id_name
    type: object
  TaxIdValidationResponse:
    description: contains taxId stautus and other details
    properties:
      additional_info:
        additionalProperties:
          type: string
        description: >-
          it is generic place holder object, it contains all other optional
          fields
        type: object
      request_status:
        title: request_status
        description: >-
          Indicates the taxId validation request status either
          SUCCESS/FAILURE/REJECT
        maxLength: 10
        minLength: 1
        type: string
      tax_id:
        title: tax_id
        description: >-
          tax_id is the personal identification number given by the regulator
          body
        pattern: ^[A-Z a-z]{5}[0-9]{4}[A-Z a-z]{1}$
        type: string
      tax_id_status:
        title: tax_id_status
        description: tax_id_status describes the taxId present status
        maxLength: 100
        minLength: 1
        type: string
    required:
      - request_status
      - tax_id
      - tax_id_status
    type: object
tags:
