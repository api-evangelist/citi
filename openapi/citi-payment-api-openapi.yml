        instruction_identification:
          maxLength: 35
          minLength: 1
          type: string
          description: Contains Payer Company's Transaction ID. Its a Unique identification as assigned by an instructing party for an instructed party to unambiguously identify the instruction
        account_servicer_reference:
          maxLength: 35
          minLength: 1
          type: string
          description: It contains Citi Transaction Reference Number. Its Internal Citi's product processors's reference number to track the transaction
        clearing_system_reference:
          maxLength: 35
          minLength: 1
          type: string
          description: Information used to identify a member within a clearing system.Contain FMI ISO name code, FMI Reference number.eg - FDW/20200102B1Q1234C123456
        service_type_indicator:
          maxLength: 3
          minLength: 3
          type: string
          description: It indicates whether the transaction is credit or debit. Possible values for credit 007 and for debit 003.
        transaction_status:
          type: object
          properties:
            status:
              type: string
              description: Specifies the status of a transaction, in a coded form. Possible Values - PDNG/ACCP/ACSC/ACSP/ACCC/RJCT. <br><br>ACCC (Accepted Credit Settlement Completed). Settlement on the creditors account has been completed <br><br> ACSC (Accepted Settlement Completed), Settlement on the debtors account has been completed <br><br> ACSP (Accepted Settlement In Process), All preceding checks such as technical validation and customer profile were successful and therefore the payment initiation has been accepted for execution <br><br>PDNG (Pending), Payment or individual transaction included in the payment is pending. Further checks and status update will be performed <br><br>RJCT (Rejected), Payment initiation or individual transaction included in the payment initiation has been rejected
              enum:
              - PDNG
              - ACCP
              - ACSC
              - ACSP
              - ACCC
              - RJCT
            status_reason_information:
              type: array
              description: Information about a each transaction. It is repeated as many times as there are transactions to be returned.
              items:
                $ref: '#/components/schemas/StatusReasonInformation'
          description: Indicates the payment transaction status and optionally the reason for that status.
