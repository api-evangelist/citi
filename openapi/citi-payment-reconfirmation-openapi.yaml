swagger: '2.0'
info:
  title: Payment Services
  description: >-
    The Payment Reconfirmation for Financial Institutions endpoint is only
    available if you are a Financial Institution reconfirming a previously
    initiated payment using the Payment Initiation endpoint in the ISO XML
    pacs.008.001.08 or pacs.009.001.08 formats and received a pacs.002.001.10
    message with a status Pending reconfirmation.


    You must specify the mandatory request elements at the very least, encrypt
    and sign the payload before placing it in the header-populated request to
    invoke the endpoint via your application. Please note the below rules
    regarding the input parameters:


    1. Either of the 32- character UETR OrgnlUETR (JSON:uetr) or the
    32-character Citi Transaction Reference OrgnlClrSysRef (JSON:citi_reference)
    or the 16-character Instruction ID OrgnlInstrID (JSON:end_to_end_id or
    instruction_id) of the original transaction in the order of priority must be
    specified in the request parameters.

    2. If you specify either the 32- character Citi Transaction Reference or the
    16-character Instruction ID, then the value date ReqdExctnDt
    (JSON:interbank_settlement_date) of the original transaction must be
    specified along with it.

    3. The 4-character ISO reconfirmation code Cd (JSON:reason) is mandatory for
    this endpoint. Below is the complete list of cancellation codes that you may
    use:

    4. For the reconfirmation code specified as MS03, please enter further
    information on the reconfirmation reason in the RsnDesc (JSON: reason_desc)


    CitiConnect will respond with a 4-character standard ISO status code txnSts
    (JSON: transaction_status>status) along with additional information AddlInf
    (JSON: transaction_status>type) informing you of the Accept or Reject status
    of the reconfirmation request. Once reconfirmed, the payment will then
    proceed with further execution.


    <a href="specs.xlsx" download>Click to Download</a> the Payment
    Reconfirmation request.


    Download our SDKs:


    * [Python
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=python&apiTitle=all&isClientSecReq=true)

    * [Java
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=java&apiTitle=all&isClientSecReq=true)

    * [.Net
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=dotnet&apiTitle=all&isClientSecReq=true)

    * [Ruby
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=ruby&apiTitle=all&isClientSecReq=true)

    * [NodeJS
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=nodejs&apiTitle=all&isClientSecReq=true)

    * [Go
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=go&apiTitle=all&isClientSecReq=true)

    * [CLI Tool
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=ccapi-cli&apiTitle=all&isClientSecReq=true)


    Note: You must be logged in to download the SDKs.
