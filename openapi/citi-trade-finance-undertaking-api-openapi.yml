          maxLength: 35
          minLength: 1
          type: string
          description: Not applicable.
        any_bic:
          $ref: '#/components/schemas/AnyBICDec2014Identifier'
        lei:
          pattern: ^[A-Z0-9]{18,18}[0-9]{2,2}$
          type: string
          description: Legal entity identifier of the financial institution.
          x-MXComponent: LEIIdentifier
        name:
          maxLength: 35
          minLength: 1
          type: string
          description: 'Name by which a party is known and which is usually used to identify that party.   RULE: If AnyBIC is absent then Name is mandatory and it is recommended to also provide the Postal Address.  RULE: If Postal Address is present then Name is mandatory.  MT Mapping: Name from fields 50, 51, 52a, 59a, 56a, 57a.'
          x-MTComponent: RestrictedFINXMax35Text
        address_line:
          maxItems: 3
          type: array
          description: 'Information that locates and identifies a specific address, as defined by postal services, presented in free format text.   It is recommended to use dedicated elements like TownName, CountrySubDivision, PostCode, Country etc. as much as possible.  MT Mapping: Address from fields 50, 51, 52a, 59a, 56a, 57a.'
