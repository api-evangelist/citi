openapi: 3.0.0
info:
  version: 2.0.0
  title: VCA Life Cycle Management
  description: Virtual Card Create, Modify, Cancel request.
  x-ibm-name: vca-life-cycle-management
  contact:
    name: GLOBAL Commercial Cards API Production support
    email: >-
      dl.icg.global.commercial.cards.digital.production.support@imcap.ap.ssmb.com
tags:
  - name: VirtualCardController
    description: Using this API we can create, modify, cancel virtual cards
servers:
  - url: https://tts.apib2b.citi.com/tts/cards/vca/v2
    description: Base URL for the API
paths:
  /create:
    post:
      tags:
        - VirtualCardController
      operationId: create
      summary: >-
        Create VCA for secure purchasing. It allows you to place a VCA creation
        request, with increased Transaction-Level Controls,  limit card number
        use by MCC, amounts, dates and even specific suppliers
      description: >-
        Create a virtual card and set its associated spending controls, custom
        reference data and payment beneficiaries. It allows you to place a a
        virtual card account creation request for secure purchasing, with
        increased transaction-Level controls, limit card number use by MCC,
        amounts, dates and even specific suppliers.<br/><br/>Note: In a Create
        VCA Request call for a Mastercard program, you must specify at least one
        instance of whichever velocity control the purchase template that is
        setup in the VCA application contains. Other controls are optional in
        the API request to Citi, even if they are included in the purchase
        template that is setup in the VCA application. If you indicate that you
        would like to use an optional control by sending the enable flag as
        TRUE, you have to specify all parameters listed in the control section
        unless otherwise specified, else, the API request will be rejected.
      parameters:
        - name: Authorization
          in: header
          description: Oauth token
          required: true
          schema:
            type: string
        - name: country
          in: header
          required: true
          schema:
            type: string
          description: country of the Client
        - name: region
          in: header
          required: true
          schema:
            type: string
          description: region of the client(Apac/EMEA/NAM)
        - name: req-sys-id
          in: header
          required: true
          schema:
            type: string
          description: >-
            Client Unique id to identify the particular request.<br> `Format`:
            UUID <br> `Example`: 123d837e-958a-4e9f-bc97-4843ec948123
      requestBody:
        required: true
        description: Request body description
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vca-Create-Request'
            examples:
              Mastercard:
                summary: VCA Create - Mastercard Sample Request
                value:
                  fundingSourceId: '15016'
                  fundingSourceName: GRACE RCN 1
                  programId: '431341'
                  messageId: 908c090d1995490eb3b431a1f37356df
                  templateId: 23358
                  expiryDate: '112026'
                  currencyCode: '008'
                  currencyType: B
                  timeZone: UTC+10:00
                  getCardImage: false
                  paymentBeneficiaryId: 19180
                  paymentBeneficiaryEmails:
                    - anistone.thobias@citi.com
                  customReference:
                    - customReferenceLabel: Invoice No.
                      customReferenceValue: '1234'
                    - customReferenceLabel: Cost Center
                      customReferenceValue: NAM Hub
                    - customReferenceLabel: Deparment
                      customReferenceValue: Marketing
                  mccGrouping:
                    - All MCCs
                  enableAgingVelocityControl: true
                  authorizationHoldDays: 5
                  cumulativeSpendLimit: 2000
                  enableSpendVelocityControl: false
                  spendVelocity:
                    - cumulativeSpendLimit: 2000
                      maxAuth: 5
                      periodType: D
                  enableCurfewControl: true
                  curfewTime:
                    startTime: '12:30'
                    endTime: '13:30'
                    weekdaysEffective:
                      - MON
                  enableTimeOfDayControl: false
                  timeOfDay:
                    - startTime: '12:30'
                      endTime: '13:30'
                      weekdayEffective: MON
                    - startTime: '13:30'
                      endTime: '14:30'
                      weekdayEffective: TUE
                  enableValidityPeriodControl: true
                  validityStartDate: '2022-06-16'
                  validityEndDate: '2022-06-17'
                  enableAmountRangeControl: true
                  minAmount: 1000.01
                  maxAmount: 2000.01
              Visa:
                summary: VCA Create - Visa Sample Request
                value:
                  fundingSourceId: GBP2145
                  programId: '918'
                  messageId: BA12345V2Create20260226131411
                  currencyCode: '752'
                  currencyType: M
                  timeZone: UTC+05:30
                  mccRange:
                    - 4812-4814
                    - 4816-4817
                    - 5044-5045
                  mccgAllowed: true
                  customReference:
                    - customReferenceLabel: Invoice No.
                      customReferenceValue: '1234'
                    - customReferenceLabel: Cost Center
                      customReferenceValue: NAM Hub
                    - customReferenceLabel: Department
                      customReferenceValue: Marketing
                  enableSpendVelocityControl: true
                  spendVelocity:
                    - cumulativeSpendLimit: 300000
                      maxAuth: 1
                      periodType: '3'
                  enableValidityPeriodControl: true
                  validityStartDate: '2026-12-10'
                  validityEndDate: '2026-12-25'
                  enableAmountRangeControl: true
                  minAmount: 1000.1
                  maxAmount: 10000.1
                  enableTransactionLimitControl: false
                  amountLimit: 1000.1
                  enableTimeOfDayControl: true
                  timeOfDay:
                    - startTime: '10:00'
                      endTime: '11:00'
                      weekdayEffective: MON
                  enableGeographyControl: true
                  countryCodes:
                    - USA
                    - ZMB
                    - ZWE
                    - SWZ
                  allowed: false
                  enableMerchantIdControl: true
                  merchantId:
                    allowed: true
                    merchantIds:
                      - cardAcceptorId: '1234560'
                        acquirerId: '132412'
                      - cardAcceptorId: '1234561'
                        acquirerId: '1324121'
                      - cardAcceptorId: '1234561'
                        acquirerId: '1324112'
      responses:
        '200':
          description: Create Virtual Card response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vca-Create-Response'
              examples:
                Mastercard:
                  summary: VCA Create - Mastercard Sample Response
                  value:
                    vcaId: '7890123456789'
                    virtualCardAccountNumber: '5412345678901234'
                    securityCode: '123'
                    expiryDate: '112026'
                    programId: '431341'
                    messageId: 908c090d1995490eb3b431a1f37356df
                    currencyCode: '008'
                    currencyType: B
                    timeZone: UTC+10:00
                    paymentBeneficiaryId: 19180
                    paymentBeneficiaryEmails:
                      - abcd@citi.com
                    customReference:
                      - customReferenceLabel: Invoice No.
                        customReferenceValue: '1234'
                      - customReferenceLabel: Cost Center
                        customReferenceValue: NAM Hub
                      - customReferenceLabel: Department
                        customReferenceValue: Marketing
                    templateId: 23358
                    mccGrouping:
                      - All MCCs
                    enableAgingVelocityControl: true
                    authorizationHoldDays: 5
                    cumulativeSpendLimit: 2000
                    availableBalance: 2000
                    enableSpendVelocityControl: false
                    enableCurfewControl: true
                    curfewTime:
                      startTime: '12:30'
                      endTime: '13:30'
                      weekdaysEffective:
                        - MON
                    enableTimeOfDayControl: false
                    enableValidityPeriodControl: true
                    validityStartDate: '2022-06-16'
                    validityEndDate: '2022-06-17'
                    enableAmountRangeControl: true
                    minAmount: 1000.01
                    maxAmount: 2000.01
                    standInVca: false
                Visa:
                  summary: VCA Create - Visa Sample Response
                  value:
                    vcaId: '5678901234567'
                    virtualCardAccountNumber: '4012345678901234'
                    securityCode: '456'
                    expiryDate: '122025'
                    programId: '918'
                    messageId: BA12345V2Create20260226131411
                    currencyCode: '752'
                    currencyType: M
                    timeZone: UTC+05:30
                    mccRange:
                      - 4812-4814
                      - 4816-4817
                      - 5044-5045
                    mccgAllowed: true
                    customReference:
                      - customReferenceLabel: Invoice No.
                        customReferenceValue: '1234'
                      - customReferenceLabel: Cost Center
                        customReferenceValue: NAM Hub
                      - customReferenceLabel: Department
                        customReferenceValue: Marketing
                    enableSpendVelocityControl: true
                    spendVelocity:
                      - cumulativeSpendLimit: 300000
                        maxAuth: 1
                        periodType: '3'
                    enableValidityPeriodControl: true
                    validityStartDate: '2026-12-10'
                    validityEndDate: '2026-12-25'
                    enableAmountRangeControl: true
                    minAmount: 1000.1
                    maxAmount: 10000.1
                    enableTransactionLimitControl: false
                    enableTimeOfDayControl: true
                    timeOfDay:
                      - startTime: '10:00'
                        endTime: '11:00'
                        weekdayEffective: MON
                    enableGeographyControl: true
                    countryCodes:
                      - USA
                      - ZMB
                      - ZWE
                      - SWZ
                    allowed: false
                    enableMerchantIdControl: true
                    merchantInfo:
                      - allowed: true
                        merchantIds:
                          - cardAcceptorId: '1234560'
                            acquirerId: '132412'
                          - cardAcceptorId: '1234561'
                            acquirerId: '1324121'
                          - cardAcceptorId: '1234561'
                            acquirerId: '1324112'
                    standInVca: false
        '400':
          description: Invalid Create Virtual Card request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vca-Create-Failure-Response'
        '401':
          description: Unauthorized Create Virtual Card request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vca-Create-Failure-Response'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vca-Create-Failure-Response'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vca-Create-Failure-Response'
  /modify:
    post:
      tags:
        - VirtualCardController
      operationId: modify
      summary: >-
        Modify VCA for secure purchasing. It allows you to place a VCA update
        request,to alter Transaction-Level Controls,  limit card number use by
        MCC, amounts, dates and even specific suppliers
      description: >-
        Modify a virtual card and set its associated spending controls, custom
        reference data and payment beneficiaries. It allows you to place a a
        virtual card account update request for secure purchasing, to alter
        transaction-Level controls, limit card number use by MCC, amounts, dates
        and even specific suppliers.<br/><br/>Note: In a Create VCA Request call
        for a Mastercard program, you must specify at least one instance of
        whichever velocity control the purchase template that is setup in the
        VCA application contains. Other controls are optional in the API request
        to Citi, even if they are included in the purchase template that is
        setup in the VCA application. If you indicate that you would like to use
        an optional control by sending the enable flag as TRUE, you have to
        specify all parameters listed in the control section unless otherwise
        specified, else, the API request will be rejected. payments
      parameters:
        - name: Authorization
          in: header
          description: Oauth token
          required: true
          schema:
            type: string
        - name: country
          in: header
          required: true
          schema:
            type: string
          description: country of the Client
        - name: region
          in: header
          required: true
          schema:
            type: string
          description: region of the client(Apac/EMEA/NAM)
        - name: req-sys-id
          in: header
          required: true
          schema:
            type: string
          description: >-
            Client Unique id to identify the particular request. Format: UUID.
            Example: 123d837e-958a-4e9f-bc97-4843ec948123
      requestBody:
        required: true
        description: Request body description
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vca-Modify-Request'
            examples:
              Mastercard:
                summary: VCA Modify - Mastercard Sample Request
                value:
                  vcaId: 7890123456789
                  fundingSourceId: '15016'
                  fundingSourceName: GRACE RCN 1
                  programId: '431341'
                  messageId: 908c090d1995490eb3b431a1f37356ef
                  templateId: 23358
                  expiryDate: '112027'
                  currencyCode: '008'
                  currencyType: B
                  timeZone: UTC+10:00
                  paymentBeneficiaryId: 19180
                  paymentBeneficiaryEmails:
                    - anistone.thobias@citi.com
                  customReference:
                    - customReferenceLabel: Invoice No.
                      customReferenceValue: '5678'
                    - customReferenceLabel: Cost Center
                      customReferenceValue: NAM Hub
                    - customReferenceLabel: Department
                      customReferenceValue: Finance
                  mccGrouping:
                    - All MCCs
                  modifyAgingVelocityControl: true
                  authorizationHoldDays: 10
                  cumulativeSpendLimit: 5000
                  modifySpendVelocityControl: false
                  spendVelocity:
                    - cumulativeSpendLimit: 5000
                      maxAuth: 10
                      periodType: M
                  modifyCurfewControl: true
                  curfewTime:
                    startTime: '09:00'
                    endTime: '17:00'
                    weekdaysEffective:
                      - MON
                      - TUE
                  modifyTimeOfDayControl: false
                  timeOfDay:
                    - startTime: '09:00'
                      endTime: '17:00'
                      weekdayEffective: MON
                  modifyValidityPeriodControl: true
                  validityStartDate: '2026-06-01'
                  validityEndDate: '2026-06-30'
                  modifyAmountRangeControl: true
                  minAmount: 500
                  maxAmount: 5000
              Visa:
                summary: VCA Modify - Visa Sample Request
                value:
                  vcaId: 5678901234567
                  fundingSourceId: GBP2145
                  programId: '918'
                  messageId: BA12345V2Modify20260226131411
                  currencyCode: '752'
                  currencyType: M
                  timeZone: UTC+05:30
                  mccRange:
                    - 4812-4814
                    - 4816-4817
                  mccgAllowed: true
                  customReference:
                    - customReferenceLabel: Invoice No.
                      customReferenceValue: '5678'
                    - customReferenceLabel: Cost Center
                      customReferenceValue: EMEA Hub
                    - customReferenceLabel: Department
                      customReferenceValue: Finance
                  modifySpendVelocityControl: true
                  spendVelocity:
                    - cumulativeSpendLimit: 500000
                      maxAuth: 2
                      periodType: '3'
                  modifyValidityPeriodControl: true
                  validityStartDate: '2026-12-01'
                  validityEndDate: '2026-12-31'
                  modifyAmountRangeControl: true
                  minAmount: 2000
                  maxAmount: 20000
                  modifyTransactionLimitControl: false
                  amountLimit: 2000
                  modifyTimeOfDayControl: true
                  timeOfDay:
                    - startTime: '08:00'
                      endTime: '18:00'
                      weekdayEffective: TUE
                  modifyGeographyControl: true
                  countryCodes:
                    - GBR
                    - DEU
                    - FRA
                  allowed: true
                  modifyMerchantIdControl: true
                  merchantId:
                    allowed: true
                    merchantIds:
                      - cardAcceptorId: '9876540'
                        acquirerId: '567812'
                      - cardAcceptorId: '9876541'
                        acquirerId: '567813'
      responses:
        '200':
          description: Modify Virtual Card response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vca-Modify-Response'
              examples:
                Mastercard:
                  summary: VCA Modify - Mastercard Sample Response
                  value:
                    vcaId: '7890123456789'
                    virtualCardAccountNumber: '5412345678901234'
                    securityCode: '123'
                    expiryDate: '112027'
                    programId: '431341'
                    messageId: 908c090d1995490eb3b431a1f37356ef
                    currencyCode: '008'
                    currencyType: B
                    timeZone: UTC+10:00
                    paymentBeneficiaryId: 19180
                    paymentBeneficiaryEmails:
                      - anistone.thobias@citi.com
                    customReference:
                      - customReferenceLabel: Invoice No.
                        customReferenceValue: '5678'
                      - customReferenceLabel: Cost Center
                        customReferenceValue: NAM Hub
                      - customReferenceLabel: Department
                        customReferenceValue: Finance
                    templateId: 23358
                    mccGrouping:
                      - All MCCs
                    modifyAgingVelocityControl: true
                    authorizationHoldDays: 10
                    cumulativeSpendLimit: 5000
                    availableBalance: 5000
                    modifySpendVelocityControl: false
                    modifyCurfewControl: true
                    curfewTime:
                      startTime: '09:00'
                      endTime: '17:00'
                      weekdaysEffective:
                        - MON
                        - TUE
                    modifyTimeOfDayControl: false
                    modifyValidityPeriodControl: true
                    validityStartDate: '2026-06-01'
                    validityEndDate: '2026-06-30'
                    modifyAmountRangeControl: true
                    minAmount: 500
                    maxAmount: 5000
                Visa:
                  summary: VCA Modify - Visa Sample Response
                  value:
                    vcaId: '5678901234567'
                    virtualCardAccountNumber: '4012345678901234'
                    securityCode: '456'
                    expiryDate: '122026'
                    programId: '918'
                    messageId: BA12345V2Modify20260226131411
                    currencyCode: '752'
                    currencyType: M
                    timeZone: UTC+05:30
                    mccRange:
                      - 4812-4814
                      - 4816-4817
                    mccgAllowed: true
                    customReference:
                      - customReferenceLabel: Invoice No.
                        customReferenceValue: '5678'
                      - customReferenceLabel: Cost Center
                        customReferenceValue: EMEA Hub
                      - customReferenceLabel: Department
                        customReferenceValue: Finance
                    modifySpendVelocityControl: true
                    spendVelocity:
                      - cumulativeSpendLimit: 500000
                        maxAuth: 2
                        periodType: '3'
                    modifyValidityPeriodControl: true
                    validityStartDate: '2026-12-01'
                    validityEndDate: '2026-12-31'
                    modifyAmountRangeControl: true
                    minAmount: 2000
                    maxAmount: 20000
                    modifyTransactionLimitControl: false
                    modifyTimeOfDayControl: true
                    timeOfDay:
                      - startTime: '08:00'
                        endTime: '18:00'
                        weekdayEffective: TUE
                    modifyGeographyControl: true
                    countryCodes:
                      - GBR
                      - DEU
                      - FRA
                    allowed: true
                    modifyMerchantIdControl: true
                    merchantInfo:
                      - allowed: true
                        merchantIds:
                          - cardAcceptorId: '9876540'
                            acquirerId: '567812'
                          - cardAcceptorId: '9876541'
                            acquirerId: '567813'
        '400':
          description: Invalid Modify Virtual Card request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vca-Modify-Failure-Response'
        '401':
          description: Unauthorized Modify Virtual Card request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vca-Modify-Failure-Response'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vca-Modify-Failure-Response'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vca-Modify-Failure-Response'
  /cancel:
    post:
      tags:
        - VirtualCardController
      operationId: cancel
      summary: >-
        Cancel VCA allows to turn a VCA to in-active status, in-order to suspend
        any payment requests
      description: >-
        Cancel VCA allows to turn a VCA to in-active status, in-order to suspend
        any payment requests
      parameters:
        - name: Authorization
          in: header
          description: Oauth token
          required: true
          schema:
            type: string
        - name: country
          in: header
          required: true
          schema:
            type: string
          description: country of the Client
        - name: region
          in: header
          required: true
          schema:
            type: string
          description: region of the client(Apac/EMEA/NAM)
        - name: req-sys-id
          in: header
          required: true
          schema:
            type: string
          description: >-
            Client Unique id to identify the particular request. Format: UUID.
            Example: 123d837e-958a-4e9f-bc97-4843ec948123
      requestBody:
        required: true
        description: Request body description
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vca-Cancel-Request'
            examples:
              Mastercard:
                summary: VCA Cancel - Mastercard Sample Request
                value:
                  vcaIds:
                    - '7890123456789'
                    - '7890123456790'
                  programId: '431341'
                  messageId: 908c090d1995490eb3b431a1f37356aa
              Visa:
                summary: VCA Cancel - Visa Sample Request
                value:
                  vcaIds:
                    - '5678901234567'
                  virtualCardAccountNumber: '4012345678901234'
                  programId: '918'
                  messageId: BA12345V2Cancel20260226131411
      responses:
        '200':
          description: Cancel Virtual Card response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vca-Cancel-Response'
              examples:
                Mastercard:
                  summary: VCA Cancel - Mastercard Sample Response
                  value:
                    programId: '431341'
                    messageId: 908c090d1995490eb3b431a1f37356aa
                    vcaResponse:
                      - programId: '431341'
                        vcaId: 7890123456789
                      - programId: '431341'
                        vcaId: 7890123456790
                Visa:
                  summary: VCA Cancel - Visa Sample Response
                  value:
                    programId: '918'
                    messageId: BA12345V2Cancel20260226131411
                    vcaResponse:
                      - programId: '918'
                        vcaId: 5678901234567
        '400':
          description: Invalid Cancel Virtual Card request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vca-Cancel-Failure-Response'
        '401':
          description: Unauthorized Virtual Card request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vca-Cancel-Failure-Response'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vca-Cancel-Failure-Response'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vca-Cancel-Failure-Response'
components:
  securitySchemes:
    ClientCredentials:
      type: oauth2
      description: ''
      flows:
        clientCredentials:
          tokenUrl: https://tts.apib2b.citi.com/tts/api/v1/oauth2/token
          scopes:
            /api: ''
  schemas:
    Vca-Cancel-Request:
      type: object
      title: VcaCancelRequest
      required:
        - vcaIds
        - programId
        - messageId
      properties:
        vcaIds:
          type: array
          description: Unique Identifier for each Virtual card request.
          items:
            type: string
        virtualCardAccountNumber:
          type: string
          description: >-
            The virtual card account number for which the modifications are
            requested.
        programId:
          type: string
          description: Unique ID of the company record defined in the virtual cards system.
        messageId:
          type: string
          description: >-
            Unique ID of the API message sent. The messageId will be provided
            back in the corresponding response. The ID can be used for
            investigation and troubleshooting. The ID must be unique per
            integration.
        blockVca:
          type: boolean
          description: Allow a client to block/unblock the VCAs associated to the VCA IDs.
