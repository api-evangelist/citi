    56e333ad-6934-4a26-9924-4c74d60397f2-data-schema:
      type: object
      properties:
        ACCT_BASE_NBR:
          type: string
          description: Account Base Number is an internal Citi client identifier that is associated to a Safekeeping or Cash Account.
          example: 8-DEMOCSH53JPY
        ACCT_BUS_TYP_NME:
          type: string
          description: Account Type Description indicates the type of the account. Values are CASH (C), S/K (S)
          example: C
        ACCT_CLS_DT:
          type: string
          format: date
          description: Account Close Date is the date when the account was closed. It will only have a value if the account is closed.
          example: '2025-08-02'
        ACCT_ID:
          type: string
          description: Account ID is an identifier for both a Cash Account and/or a Safekeeping Account that is unique within a branch.
          example: DEMOCSH53JPY
        ACCT_NME:
          type: string
          description: Account Name is the name that is assigned to the Cash Account and/or the Safekeeping Account. If an Alternate Account Name has been specified for an account it will be displayed as the Account Name.
          example: Demo - Cash - Japan JPY 11
        ACCT_OPN_DT:
          type: string
          format: date
          description: Account Open Date is the date when the account was opened.
          example: '2025-08-02'
        ACCT_STS_TYP:
          type: string
          description: Account Status provides the current status of the Cash Account and/or the Safekeeping account.  Values are Open, Closed, Frozen
          example: Open
        ALT_ACCT_NME:
          type: string
          description: Alternate Account Name is the user provided name for the account as entered using the Account Cabinet. If an Alternate Account Name is not provided this field will be blank.
          example: Demo - Cash - Japan JPY 11
        ALTV_CUR_CD:
          type: string
          description: Account Base Currency Code is the ISO Currency Code for the account.
          example: JPY
        BR_NME:
          type: string
          description: Branch Name is the name of the branch for the Cash Account and/or Safekeeping Account.
          example: CITIBANK JAPAN LTD
        CASH_TYPE:
          type: number
          format: double
          description: Cash Type Code pertains to US Direct Cash Accounts and indicates whether the Cash Account has a split income and principal balance.
          example: 1
        GFC_ID:
          type:
          - string
          - 'null'
          description: Client ID is an identifier that is available on a Cash Account and/or a Safekeeping Account.
          example: '1000123456'
        IBAN:
          type:
          - string
          - 'null'
          description: IBAN  ISO 13616:1997 is the International Bank Account Number for the Cash Account.
          example: null
        LEGAL_ENTITY:
          type:
          - string
          - 'null'
          description: This identifies the branch that is the Legal Entity for a Global Window branch.
          example: null
        RELATED_SAFEKEEPING_ACCT_ID:
          type:
          - string
          - 'null'
          description: This provides safekeeping account related to a cash account
          example: null
