      description: Depot Domicile is the Depot domicile (Country where the sub-account is held).
      in: query
      required: false
      schema:
        type: string
    parameter-29410:
      name: FX_RATE_EUR
      description: FX Rate (EUR) is the FX rate used to convert the reclaim currency into EUR
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-29433:
      name: NET_DIV_CCY
      description: Net Dividend is the value of is the dividend net of withholding tax expressed in the currency of the reclaim
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-29378:
      name: EVENT_REFERENCE
      description: Event Reference is the Corporate Action event ID (CAID)
      in: query
      required: false
      schema:
        type: string
    parameter-29373:
      name: EFILE_REF
      description: E-File Reference is Citi's unique reference for each electronic submission to Tax authorities (submission may contains more than 1 reclaim)
      in: query
      required: false
      schema:
        type: string
    parameter-14992:
      name: IBAN
      description: IBAN is the International Bank Account Number for the Cash Account.
      in: query
      required: false
      schema:
        type: string
    parameter-15010:
      name: DLAY_DAYS
      description: Delay Days is the number of days from the issuance of an MBS pool (or from the beginning of the interest accrual period) until the first payment is remitted/paid to the holders.
      in: query
      required: false
      schema:
        type: string
    parameter-29401:
      name: AMT_RECVED_CCY
      description: Reclaim Amount Received is the value of the refund received from the Tax Authority excluding interest, expressed in the currency of the reclaim
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-15002:
      name: SID_CUSIP
      description: CUSIP (Committee on Uniform Securities Identification Procedures) It is a nine-character alphanumeric code that identifies a North American financial security for the purposes of facilitating clearing and settlement of trades.
      in: query
      required: false
      schema:
        type: string
    parameter-29427:
      name: RECLM_VAL_RCY
      description: Reclaim Amount is the value of the amount being reclaimed expressed in the currency of the reclaim
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-14997:
      name: SEC_DESC
      description: Issue Description contains the name and other details of the instrument.
      in: query
      required: false
      schema:
        type: string
    parameter-15028:
      name: PREV_FCTR_RATE
      description: Previous Factor is the factor which applies to the last accrual period to determine payments and balances for principal paying securities.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-15007:
      name: ACRL_BASIS_CDE
      description: 'Accrual Basis Code is a code linked to the Accrual Basis field which indicates the basis on which interest accruals are calculated.  Values include: 00043 (360 / 365), 00011 (360 / 360), 00063 (30 / 360 Non-EOM), etc.'
      in: query
      required: false
      schema:
        type: string
    parameter-14984:
      name: ACCT_ID
      description: Account ID is an identifier for both a Cash Account and/or a Safekeeping Account that is unique within a branch.
      in: query
      required: false
      schema:
        type: string
    parameter-29391:
      name: RECONCILIATION_DATE
      description: Receipt Date is the date when the funds were credited into client's cash account
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-15031:
      name: SEC_SUB_TYP_NME
      description: 'Issue Type is a description of the type of the security instrument.  Values include: ADR Convertible (1), Bond (12) , Bond Convertible (19), etc.'
      in: query
      required: false
      schema:
        type: string
    parameter-14985:
      name: ACCT_NME
      description: Account Name is the name that is assigned to the Cash Account and/or the Safekeeping Account. If an Alternate Account Name has been specified for an account it will be displayed as the Account Name.
      in: query
      required: false
      schema:
        type: string
    parameter-14982:
      name: ACCT_BUS_TYP_NME
      description: Account Type Description indicates the type of the account. Values are CASH (C), S/K (S)
      in: query
      required: false
      schema:
        type: string
    parameter-29397:
      name: CREATION_DATE
      description: Input Date is the date when the reclaim was loaded to Citi's reclaim system
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-15017:
      name: ISS_CAT_NME
      description: 'Issue Category is the description for the Issue Category Code.  Values include:  Common Stock (CSTK), Derivatives (DERIV), Mortgage Backed Securities (MBS), etc.'
      in: query
      required: false
      schema:
        type: string
    parameter-29388:
      name: STATUS
      description: Reclaim Status is the current status of the reclaim
      in: query
      required: false
      schema:
        type: string
    parameter-14991:
      name: GFC_ID
      description: Client ID is an identifier that is available on a Cash Account and/or a Safekeeping Account. This Client ID is referred to, internally at Citi, as a GFCID.
      in: query
      required: false
      schema:
        type: string
    parameter-15019:
      name: ISS_TMS
      description: Issue Date is the date of first issue of the security.
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-15027:
      name: POOL_ID_CD
      description: Pool ID is an alphanumeric code that identifies a particular mortgage backed security.
      in: query
      required: false
      schema:
        type: string
    parameter-15006:
      name: SID_TICKER_SYMB
      description: Ticker is the symbol used on the exchange to identify the security.
      in: query
      required: false
      schema:
        type: string
    parameter-15008:
      name: ACRL_BASIS_NME
      description: Accrual Basis Description is the basis on which interest accrual is calculated, e.g. 30/360 meaning nominal 30 day months and a 360 day year.
      in: query
      required: false
      schema:
        type: string
    parameter-29438:
      name: OVERRIDE_CNTRY_ID_TRS
      description: Security Domicile (Stock Residency) is the country in which tax was withheld and where tax will be reclaimed
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-29385:
      name: RECLAIM_REF
      description: Reclaim Reference is the unique identifying number for each reclaim in Citi system
      in: query
      required: false
      schema:
        type: string
    parameter-29402:
      name: AMT_RECVED_EUR
      description: Reclaim Amount Received (EUR) is the value of the refund received from the Tax Authority expressed in Euro currency
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-29416:
      name: TAX_PAID_GBP
      description: Local Tax (WHT Paid) (GBP) is the value of tax withheld expressed in British pound currency
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-29403:
      name: AMT_RECVED_GBP
      description: Reclaim Amount Received (GBP) is the value of the refund received from the Tax Authority expressed in British pound currency
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-29425:
      name: RECLM_VAL_EUR
      description: Reclaim Amount (EUR) is the value of the amount being reclaimed expressed in Euro currency
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-15032:
      name: STRK_PRC_AMT
      description: Strike Price is the specified price on an options contract at which the contract may be exercised.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-15021:
      name: ISSR_LOC_NME
      description: 'Issuer Location is the name of the country where the issuer of the security is based.  Values include: Argentina (AR), Canada (CA), Ireland (IE), etc.'
      in: query
      required: false
      schema:
        type: string
    parameter-14990:
      name: CASH_TYPE
      description: Cash Type Code pertains to US Direct Cash Accounts and indicates whether the Cash Account has a split income and principal balance.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-29368:
      name: COUNTRY
      description: Country is the reclaim market
      in: query
      required: false
      schema:
        type: string
    parameter-15088:
      name: PAYABLE_DATE
      description: Payable Date is the date on which a dividend or interest payment is scheduled to be paid.
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-15016:
      name: INCM_PROJN_RATE
      description: Interest Rate is the coupon rate of the security.
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-29411:
      name: FX_RATE_GBP
      description: FX Rate (GBP) is the FX rate used to convert the reclaim currency into GBP
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-29386:
      name: SEC_SHRTN
      description: Security Name is the stock name of the security
      in: query
      required: false
      schema:
        type: string
    parameter-29412:
      name: FX_RATE_USD
      description: FX Rate (USD) is the FX rate used to convert the reclaim currency into USD
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-29362:
      name: BEN_OWNER_NAME
      description: Beneficial Owner Name is the name of the Beneficiary Owner of the reclaim
      in: query
      required: false
      schema:
        type: string
    parameter-29408:
      name: GROSS_DIV_GBP
      description: Gross Dividend (GBP) is the value of the Gross Dividend expressed in British pound currency
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-15015:
      name: INCM_CUR_NME
      description: Income Currency Name is the name of the currency in which income payments will be made for the security in the local market.
      in: query
      required: false
      schema:
        type: string
    parameter-14999:
      name: SEC_SHRT_NME
      description: Issue Name is the Security Name of the security instrument.
      in: query
      required: false
      schema:
        type: string
    parameter-29377:
      name: GERMAN_FILE_NUMBER
      description: EFiling Serial# (Reclaim) is the reference no. for electronically filed reclaim submission
      in: query
      required: false
      schema:
        type: string
    parameter-29389:
      name: PAYQUARTER
      description: Pay Quarter is the pay quarter of the dividend
      in: query
      required: false
      schema:
        type: string
    parameter-14987:
      name: ACCT_STS_TYP
      description: 'Account Status provides the current status of the Cash Account and/or the Safekeeping Account.  Values are: Open, Closed, Frozen'
      in: query
      required: false
      schema:
        type: string
    parameter-29434:
      name: NET_DIV_EUR
      description: Net Dividend (EUR) is the value of is the dividend net of withholding tax expressed in Euro currency
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-29414:
      name: TAX_PAID_CCY
      description: Local Tax (WHT Paid) is the value of tax withheld expressed in the currency of the reclaim
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-29375:
      name: ENTITY_TYPE
      description: 'Entity Type (Fiscal Type) is the Beneficial Owner entity type (i.e.: corporate, Pension Fund, etc.)'
      in: query
      required: false
      schema:
        type: string
    parameter-14986:
      name: ACCT_OPN_DT
      description: Account Open Date is the date when the account was opened.
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-14998:
      name: SEC_SECURITY_CD
      description: CITI Internal Security Code is the identifier of the CITI Internal Security Identifier.
      in: query
      required: false
      schema:
        type: string
    parameter-29409:
      name: GROSS_DIV_USD
      description: Gross Dividend (USD) is the value of the Gross Dividend expressed in US dollar  currency
      in: query
      required: false
      schema:
        type: number
        format: double
    parameter-15014:
      name: INCM_CUR_CD
      description: Income Currency Code is the ISO currency code in which income payments will be made for the security in the local market.
      in: query
      required: false
      schema:
        type: string
    parameter-15013:
      name: FCTR_DTE
      description: Factor Date is the date the current factor is applicable from for principal paying securities.
      in: query
      required: false
      schema:
        type: string
        format: date-time
    parameter-29393:
      name: STATUTE_DTE
      description: Statute Date is the last day the reclaim is in statute
      in: query
      required: false
      schema:
        type: string
        format: date
    parameter-14996:
      name: CMPNY_NME
      description: Company Name is the name of the company which issued the security.
      in: query
      required: false
      schema:
        type: string
  schemas:
    e0b62396-5920-4270-96b1-26dddee0c242-json-response-schema:
      type: object
      properties:
        Count:
          type: number
          format: integer
        PagedList:
          type: array
          items:
            $ref: '#/components/schemas/e0b62396-5920-4270-96b1-26dddee0c242-data-schema'
    1bcf00be-b782-4f9f-a814-0752b0326ae6-json-response-schema:
      type: object
      properties:
        Count:
          type: number
          format: integer
        PagedList:
          type: array
          items:
            $ref: '#/components/schemas/1bcf00be-b782-4f9f-a814-0752b0326ae6-data-schema'
    1bcf00be-b782-4f9f-a814-0752b0326ae6-data-schema:
      type: object
      properties:
        ACCT_BASE_NBR:
          type: string
          description: Account Base Number is an internal Citi client identifier that is associated to a safekeeping or cash account.
          example: 8-DEMOCSH53JPY
        ACCT_BUS_TYP_CD:
          type: string
          description: A code to indicate the type of account<br> Cash<br> Safekeeping,br> E-Report.
          example: C
        ACCT_BUS_TYP_NME:
          type: string
          description: Account type description indicates the type of the account. Values are:<br> CASH (C)<br> S/K (S)
          example: CASH
        ACCT_ID:
          type: string
          description: Account ID is an identifier for both a cash account and/or a safekeeping account that is unique within a branch.
          example: DEMOSK02US
        ACCT_NME:
          type: string
          description: Account Name is the name that is assigned to the cash account and/or the safekeeping account. If an alternate account name has been specified for an account it will be displayed as the Account Name.
          example: Demo - SK - US DCC Equity
        ACCT_STS_TYP:
          type: string
          description: Account status provides the current status of the cash account and/or the safekeeping account.  Values are<br> Open<br> Closed<br> Frozen
          example: Open
        ALTV_CUR_CD:
          type: string
          description: Account Base Currency Code is the ISO Currency Code for the account.
          example: JPY
        ASOF_TMS:
          type: string
          format: date-time
          description: The As Of Date is the date of the information being reported.
          example: '2019-08-26 00:00:00'
        AVAL_BAL:
          type: number
          format: double
          description: Available Balance is the cash account balance for all posted transactions,  except for future value dated transactions.
          example: '6136188.61'
        BAL_STS_TYP:
          type: string
          description: Cash Balance Type will be Posted for all cash accounts except for US Direct cash accounts where  the balance type can be either Posted or Sweep.
          example: POSTED
        BR_ID:
          type: string
          description: Branch Code is the identifier of the branch for the account.For the cash account the branch code is a numeric value  and for the safekeeping account it is the ISO Country code.
          example: '484'
        BR_NME:
          type: string
          description: Branch Name is the name of the branch for the cash account and/or safekeeping account.
          example: NEW YORK SECURITIES CB
        CASH_TYPE:
          type: number
          format: double
          description: Cash Type Code pertains to US Direct cash accounts and indicates whether the cash account has a split income and principal balance.
          example: '1'
        COB_DATE:
          type: string
          format: date
          description: Close of Business Date
          example: '2019-08-26'
        EOD_INTRA_IND:
          type: string
          description: EOD/intraday Indicator advises if the balance is an end-of-day reported balance or  if the balance is an Intraday reported balance. Values are:<br>- 1 (Intraday)<br>- 2 (End of Day)
          example: '2'
        GFC_ID:
          type:
          - string
          - 'null'
          description: Client ID is an identifier that is available on a cash account and/or a safekeeping account. This Client ID is referred to, internally at Citi, as a GFCID.
          example: '1000123456'
        IOD_UPDATE_TMS:
          type: string
          format: date-time
          description: IOD Timestamp
          example: '2019-08-26 00:00:00'
        LCL_CUR_CD:
          type: string
          description: Currency code is the ISO currency code for the amount.
          example: JPY
        LED_BAL:
          type: number
          format: double
          description: Ledger Balance is the balance for the cash account that includes all posted transactions including future value dated transactions.
          example: '6136188.61'
        LST_ENTRY_TMS:
          type: string
          format: date-time
          description: Balance change date displays the date of the last change to the balance based on transactions  that have been posted to the cash account.
          example: '2019-08-26 00:00:00'
        LST_UPD_TMS:
          type: string
          format: date-time
          description: Balance Update Timestamp displays the date/time of the last update to the balance due to transactions  that have posted to the cash account (Intraday) or due to reporting database updates (end-of-day).
          example: '2019-08-26 00:00:00'
        OPNG_BAL:
          type: number
          format: double
          description: Opening balance is the opening ledger balance (previous days closing balance) for the cash account.  Ledger Balance includes all posted transactions including future value dated transactions.
          example: '6136188.61'
        PRNCPL_INC_IND:
          type: string
          description: 'Principal / Income Indicator advises if the balance is for principal or income.   Values include: <br>P (Principal)<br> I (Income)'
          example: P
        TRANS_REF_NBR:
          type: string
          description: Custodian Reference is the unique reference assigned by the custodian to the record.  The reference number is unique within a branch.
          example: '46050312345'
    ErrorDetail:
      type: object
      title: Error Detail
      xml:
        name: ErrorDetail
      properties:
        issue:
          type: string
          maxLength: 150
          description: more details about the issue
          title: issue
          xml:
            name: Issue
        action:
          type: string
          maxLength: 150
          description: corrective action to be taken to resolve above issue
          title: action
          xml:
            name: Action
        code:
          type: string
          maxLength: 10
          description: unique code representing the issue
          title: code
          xml:
            name: Code
    e0b62396-5920-4270-96b1-26dddee0c242-xml-response-schema:
      type: object
      properties:
        row:
          type: array
          items:
            $ref: '#/components/schemas/e0b62396-5920-4270-96b1-26dddee0c242-data-schema'
      xml:
        name: data
    ErrorResponse:
      type: object
      title: ErrorResponse
      xml:
        name: ErrorResponse
      properties:
        ref_id:
          type: string
          maxLength: 60
          description: Unique ID for the Transaction
          title: ref_id
          xml:
            name: RefId
        errorDetails:
          type: array
          title: Error Detail
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ErrorDetail'
    1bcf00be-b782-4f9f-a814-0752b0326ae6-xml-response-schema:
      type: object
      properties:
