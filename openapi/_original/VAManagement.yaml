    Entity:
      title: Entity
      description: >-
        <b> Required parameter only if the value of `action` is set to
        'ACTIVATION'. </b>
      xml:
        name: Entity
      allOf:
        - $ref: '#/components/schemas/Entity-Contact-Name'
        - type: object
        - required:
            - country_of_operation
          properties:
            id:
              title: id
              xml:
                name: Id
              type: string
              minLength: 20
              maxLength: 20
              description: >-
                For activation, either the `entity.id` (or) rest of the entity
                details under the entity object are required.
              example: EN_45678901234567890
            type:
              title: type
              xml:
                name: Type
              type: string
              enum:
                - C
                - S
                - I
              description: >-
                Required parameter under the `entity` object if the `id`
                parameter is not used. <br> Populate the entity type applicable
                for the entity being activated under this virtual account.
                <br><br> C = COMPANY  <br><br> S = SOLE TRADER - enterprise
                owned and run by one person and in which there is no legal
                distinction between the owner and the business entity <br><br> I
                = INDIVIDUAL - natural person who is the sole owner of the
                enterprise and is personally liable for all the debts of the
                enterprise.
              example: C
            date_of_birth:
              title: date_of_birth
              xml:
                name: DateOfBirth
              type: string
              minLength: 10
              maxLength: 10
              pattern: >-
                ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)$
              description: >-
                Populates the date of birth or incorporation date pertaining to
                the entity that is being activated under this virtual account.
                It is in fixed 10-digit format (YYYY-MM-DD) as per ISO standard.
                <br> - Required parameter when sole trader (`entity.type`='S')
                or individual (`entity.type`='I') is present <br> - Optional for
                company (`entity. Type`='C'). <br> 

                - For sole trader (`entity.type`='S') and individual
                (`entity.type`='I'), merchant age should be 18 years or above at
                the time of activation. <br> 

                - Year (YYYY) and Month (MM) values in `date_of_birth` cannot be
                zero. <br> 

                - For company (`entity.type`='C'), the incorporation date cannot
                be a future date.
              example: '1995-04-01'
            website:
              title: website
              xml:
                name: Website
              type: string
              maxLength: 200
              description: >-
                Enter the website of entity being activated under this virtual
                account.
              example: http://www.dd.com
            store_name:
              title: store_name
              xml:
                name: StoreName
              type: string
              maxLength: 105
              description: >-
                Enter the store name of the entity being activated under this
                virtual account. Optional field, should not be considered as the
                entity name.
              example: ABC
            business_purpose:
              title: business_purpose
              xml:
                name: BusinessPurpose
              type: string
              maxLength: 105
              description: >-
                Populate the business purpose applicable for the entity being
                activated under this virtual account.
              example: Trade
            acronym:
              title: acronym
              xml:
                name: Acronym
              type: string
              maxLength: 105
              description: >-
                Populate the acronym for the entity being activated under this
                virtual account.
              example: Buss
            country_of_operation:
              title: country_of_operation
              xml:
                name: CtryOfOpr
              type: string
              minLength: 2
              maxLength: 2
              pattern: ^[A-Z]{2}$
              description: >-
                Enter the 'Country code' under which the entity is operated.
                <br> <b> Required parameter </b> for both `entity.id` (or)
                entity details combination.
              example: CA
            org_prvt_identification:
              $ref: '#/components/schemas/Organisation-Private-Identification'
            address:
              $ref: '#/components/schemas/Address'
