                description: "Status description: \n- PENDING: For InstantFX credit check failed orders/late orders/refund tolerance failed orders.\n- MERGED: Applicable only to ‘Net & Merge’ InstantFX clients; where two or more orders are for the same ccy pair and value date are merged to create a single, netted Order and the original, contributing orders will be flagged as ‘Merged’ orders with a cross reference to the Citi created order. \n- BOOKED: Order is booked.\n- ACCEPTED: Applicable only for pre-orders (intent to pay).\n- REJECTED: Order request rejected.\n"
                example: BOOKED
              ccyPair:
                type: string
                description: The currency pair that you are trading on. Please discuss your preference of sending the value of currency pair in either BaseTerm format or alphabetic sort order with your Citi Representative.
                maxLength: 6
                example: GBPUSD
              tenor:
                type: string
                description: The Tenor the order is being placed for.
                maxLength: 10
                example: BROKEN
              valueDate:
                type: string
                format: date
                description: 'The value date of the order in format: yyyy-MM-dd'
                example: '2012-11-15'
              dealtCcy:
                type: string
                description: The currency for which you supplied the dealt amount.
                maxLength: 3
                example: USD
              side:
                type: string
                description: Indicates whether you are buying (B) or selling (S) the dealt ccy.
                enum:
                - B
                - S
                example: S
              orderQty:
                type: string
                format: double
                description: The dealt ccy amount
                example: '1000'
              rateSetId:
                type: integer
                description: If the rating method was IFX, this is the Rate Set Id used in the rating of the order. For Live Rates orders, this will be set to zero. In case of a Refund order, it is the rate set Id previously used to book original order.
                example: 41319
              counterCcy:
                type: string
                description: The counter ccy of the ccy pair, not the dealt ccy.
                example: GBP
                maxLength: 3
              contAmtValue:
                type: string
                format: double
                description: The calculated counter ccy amount.
                example: '6543.65'
              lastSpotRate:
                type: string
                format: double
                description: The spot rate applied to the order.
                example: '1.5282'
              lastForwardPoints:
                type: string
                format: double
                description: The forward points applied to the order. Will be zero for spot transactions.
                example: '0'
              outrightRate:
                type: string
                format: double
                description: The outright (spot and fwd points) rate applied to the Order.
                example: '1.5282'
              rejectCode:
                type: integer
                description: The reject code if order status = ‘REJECTED’ (rejected).
                example: 99
              rejectReason:
                type: string
                description: The reason for rejection if order status = ‘REJECTED’’ (rejected).
                maxLength: 250
              citiMergedOrder:
                type: boolean
                description: Indicates whether this is a merged order created by Citi. Only applicable to ‘Net & Merge’ clients.
              clOrdLinkId:
                type: string
                format: int64
                description: 'The Citi-assigned Merged Order reference.  This is applicable only to ‘Net & Merge’ InstantFX clients; where two or more orders are for the same ccy pair and value date, will be merged to create a single, netted Order and the original, contributing orders will be flagged as ‘Merged’ orders with a cross reference to the Citi created order.

                  '
