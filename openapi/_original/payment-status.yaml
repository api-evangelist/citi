  assembly:
    execute:
      - operation-switch:
          title: operation-switch
          case:
            - operations:
                - verb: post
                  path: /payment/initiation
              execute:
                - switch:
                    title: switch
                    case:
                      - condition: >-
                          apim.getvariable('request.headers.content-type')=='application/json'
                        execute:
                          - gatewayscript:
                              title: gatewayscript
                              version: 1.0.0
                              source: "apim.setvariable(\"request.headers.sourceContent\",\"json\");\r\napim.setvariable(\"message.headers.sourceContent\",\"json\");\r\napim.setvariable(\"request.headers.portalTraffic\",\"N\");\r\napim.setvariable(\"message.headers.portalTraffic\",\"N\");\r\napim.setvariable(\"request.headers.Content-Type\",\"application/json\");\r\napim.setvariable(\"message.headers.Content-Type\",\"application/json\");\r\n\r\nvar clientIp = apim.getvariable(\"request.headers.x-archived-client-ip\");\r\napim.setvariable(\"message.headers.clientIpAddress\",clientIp);\r\napim.setvariable(\"request.headers.clientIpAddress\",clientIp);\r\n\r\n\r\nvar appname = apim.getvariable(\"request.headers.clientapp_name\");\r\nif(\"ccapidevportal_internal\" == appname){\r\n\tapim.setvariable(\"request.headers.portalTraffic\",\"Y\");\r\n\tapim.setvariable(\"message.headers.portalTraffic\",\"Y\");\r\n}\r\n"
                      - condition: >-
                          apim.getvariable('request.headers.content-type')=='application/xml'
                        execute:
                          - gatewayscript:
                              title: gatewayscript
                              version: 1.0.0
                              source: "apim.setvariable(\"request.headers.sourceContent\",\"xml\");\r\napim.setvariable(\"message.headers.sourceContent\",\"xml\");\r\napim.setvariable(\"request.headers.portalTraffic\",\"N\");\r\napim.setvariable(\"message.headers.portalTraffic\",\"N\");\r\n\r\nvar clientIp = apim.getvariable(\"request.headers.x-archived-client-ip\");\r\napim.setvariable(\"message.headers.clientIpAddress\",clientIp);\r\napim.setvariable(\"request.headers.clientIpAddress\",clientIp);\r\n\r\n\r\nvar appname = apim.getvariable(\"request.headers.clientapp_name\");\r\nif(\"ccapidevportal_internal\" == appname){\r\n\tapim.setvariable(\"request.headers.portalTraffic\",\"Y\");\r\n\tapim.setvariable(\"message.headers.portalTraffic\",\"Y\");\r\n}"
                    version: 1.0.0
                - switch:
                    title: switch
                    case:
                      - condition: >-
                          apim.getvariable('request.headers.icg-akamai-b2b-flag')=='true'
                        execute:
                          - proxy:
                              title: proxy
                              timeout: 60
                              verb: keep
                              cache-response: protocol
                              cache-ttl: 900
                              version: 1.0.0
                              tls-profile: citiconnect-ssl-profile
                              target-url: $(PaymentInitiationAkamai)
                      - otherwise:
                          - proxy:
                              title: proxy
                              timeout: 60
                              verb: keep
                              cache-response: protocol
                              cache-ttl: 900
                              version: 1.0.0
                              tls-profile: citiconnect-ssl-profile
                              target-url: $(PaymentInitiation)
                    version: 1.0.0
            - operations:
                - verb: post
                  path: /payment/inquiry
              execute:
                - proxy:
                    title: proxy
                    timeout: 60
                    verb: keep
                    cache-response: protocol
                    cache-ttl: 900
                    version: 1.0.0
                    tls-profile: citiconnect-ssl-profile
                    target-url: $(BE-EnquiriesService)
                    stop-on-error: []
            - operations:
                - verb: get
                  path: /payment/inquiry
              execute:
                - proxy:
                    title: Invoke-PSIGET-GREENEndPt
                    timeout: 60
                    verb: keep
                    cache-response: protocol
                    cache-ttl: 900
                    version: 1.0.0
                    tls-profile: citiconnect-ssl-profile
                    target-url: $(BE-EnquiriesService)
      - activity-log:
          title: activity-log
          content: header
          error-content: header
          version: 1.0.0
    catch: []
  categories:
    - 'operation: Enhanced Payment Status Inquiry'
    - 'operation: Payment Status Inquiry'
    - 'operation: Payment Initiation'
    - 'operation: Push Notification'
