tags: []
securityDefinitions:
  Client ID:
    description: ''
    in: query
    name: client_id
    type: apiKey
  clientCredentials:
    type: oauth2
    flow: application
    tokenUrl: /authenticationservices/v1/oauth/token
    description: >-
      All CitiConnect APIs use the oAuth2 authentication scheme, which requires
      a bearer token to authenticate your API call. The Token URL includes the
      version of authentication used by this API. See the Citi Authentication
      API Reference for information on requesting a token.
    x-scopeValidate:
      tls-profile: citi-direct-ssl-profile
paths:
  /payments/reconfirmations:
    post:
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/definitions/fi_response'
            application/xml:
              schema:
                $ref: '#/definitions/fi_response'
              example: >-
                <?xml version="1.0"
                encoding="UTF-8"?><TxInfAndSts><TxSts>RJCT</TxSts><AddtlInf>Transaction
                Not Found</AddtlInf></TxInfAndSts>
        '400':
          description: Bad Request
          examples:
            application/json:
              errors:
                - action: >-
                    Please provide valid value for either uetr or
                    (citi_reference/instruction_id with
                    interbank_settlement_date).
                  issue: uetr/citi_reference/instruction_id cannot be null or empty.
              http_code: 400
              status: FAILED
            application/xml:
              errors:
                - action: >-
                    Please provide valid value for either uetr or
                    (citi_reference/instruction_id with
                    interbank_settlement_date).
                  issue: uetr/citi_reference/instruction_id cannot be null or empty.
              http_code: 400
              status: FAILED
          schema:
            $ref: '#/definitions/error_response'
        '401':
          description: Unauthorized
          examples:
            application/json:
              errors:
                - action: Please try again with valid credentials.
                  issue: Authorization failed.
              http_code: 401
              status: FAILED
            application/xml:
              errors:
                - action: Please try again with valid credentials.
                  issue: Authorization failed.
              http_code: 401
              status: FAILED
          schema:
            $ref: '#/definitions/error_response'
        '405':
          description: Method Not Allowed
          examples:
            application/json:
              errors:
                - action: Please use valid Http Verb.
                  issue: Method not allowed.
              http_code: 405
              status: FAILED
            application/xml:
              errors:
                - action: Please use valid Http Verb.
                  issue: Method not allowed.
              http_code: 405
              status: FAILED
          schema:
            $ref: '#/definitions/error_response'
        '415':
          description: Unsupported Media Type
          examples:
            application/json:
              errors:
                - action: Resend request in valid format.
                  issue: provided content-type of the request is not valid.
              http_code: 415
              status: FAILED
            application/xml:
              errors:
                - action: Resend request in valid format.
                  issue: provided content-type of the request is not valid.
              http_code: 415
              status: FAILED
          schema:
            $ref: '#/definitions/error_response'
        '500':
          description: Internal Server Error
          examples:
            application/json:
              errors:
                - action: Please try again after sometime.
                  issue: unable to process your request at this moment.
              http_code: 500
              status: FAILED
            application/xml:
              errors:
                - action: Please try again after sometime.
                  issue: unable to process your request at this moment.
              http_code: 500
              status: FAILED
          schema:
            $ref: '#/definitions/error_response'
      parameters:
        - description: >-
            This field used to identify request is for reconfirm/reject (Example
            - RECNFRM / RJCTCNFRM) FI Payments.
          in: header
          maxLength: 12
          name: request_type
          required: true
          type: string
        - description: >-
            Unique reference which was shared during CitiConnect API
            on-boarding(client_id which used during oauth token generation)
          in: query
          name: client_id
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/fi_reconfirmation_request'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/definitions/fi_reconfirmation_request'
          application/xml:
            schema:
              $ref: '#/definitions/fi_reconfirmation_request'
            example: >-
              <?xml version="1.0"
              encoding="UTF-8"?><TransacService><InstrId>2009360588</InstrId><ReqdExctnDt>2020-09-25</ReqdExctnDt><Rsn>DUPL</Rsn></TransacService>
        required: true
      operationId: fiPaymentReconfirmation
      summary: Payment Reconfirmation
      description: >-
        This API allows you to initiate reconfirm/reject FI payments in JSON and
        XML format.
definitions:
  ErrorDetail:
    properties:
      action:
        description: corrective action to be taken to resolve above issue
        maxLength: 350
        type: string
      issue:
        description: more details about the  issue
        maxLength: 200
        type: string
    type: object
    xml:
      name: error
  error_response:
    properties:
      errors:
        description: >-
          Indicates actual error details with issues and corresponding actions
          to resolve the issue
        items:
          $ref: '#/definitions/ErrorDetail'
        xml:
          wrapped: true
      http_code:
        description: Indicates http status code to specify http response status
        format: int32
        pattern: ^[0-9]{3}$
        type: integer
      status:
        description: >-
          This field  indicates the status of the reconfirm/reject or
          cancel/recall request with set of values. for example- FAILED
        maxLength: 6
        type: string
    type: object
  fi_cancellation_request:
    properties:
      citi_reference:
        description: >-
          This field specifies the Product processor Reference Number for the
          transaction that needs to be cancelled or recalled. UETR or
          citi_reference with interbank_settlement_date or end_to_end_id /
          instruction_id with interbank_settlement_date is mandatory.
        maxLength: 32
        type: string
      end_to_end_id:
        description: >-
          This is a  unique end-to-end  reference number that identifies a
          transaction that needs to be cancelled. UETR or citi_reference with
          interbank_settlement_date or end_to_end_id / instruction_id with
          interbank_settlement_date is mandatory.
        maxLength: 35
        type: string
      instruction_id:
        description: >-
          This is a  unique end-to-end  reference number that identifies a
          transaction that needs to be cancelled. UETR or citi_reference with
          interbank_settlement_date or end_to_end_id / instruction_id with
          interbank_settlement_date is mandatory.
        maxLength: 35
        type: string
      interbank_settlement_date:
        description: >-
          This field specifies the value date (yyyy-MM-dd) of the original
          transaction that needs to be cancelled or recalled (the date on which
          funds were credited to the account).
        type: string
      reason:
        description: >-
          This is the four digits cancellation code (Example - DUPL) which is
          specified by the  customer to request to cancel the transaction
        maxLength: 4
        type: string
      reason_description:
        description: >-
          Further details on the request reason. Required for CUST and MS03
          reason codes applicable to Stop and Reconfirmation services
          respectively.
        maxLength: 150
        type: string
      uetr:
        description: >-
          Unique End-to-end Transaction Reference (UETR) relating to a payment
          has been identified as being associated with a Request for
          Cancellation. it should follow UUID version 4 format. UETR or
          citi_reference with interbank_settlement_date or end_to_end_id /
          instruction_id with interbank_settlement_date is mandatory.
        type: string
    required:
      - reason
    type: object
  fi_reconfirmation_request:
    properties:
      citi_reference:
        description: >-
          This field specifies the Product processor Reference Number for the
          transaction that needs to be reconfirm/reject. UETR or citi_reference
          with interbank_settlement_date or instruction_id with
          interbank_settlement_date is mandatory.
        maxLength: 32
        type: string
        xml:
          name: ClrSysRef
      instruction_id:
        description: >-
          This is a unique instrution id that identifies a transaction that
          needs to be reconfirm/reject. UETR or citi_reference with
          interbank_settlement_date or instruction_id with
          interbank_settlement_date is mandatory.
        maxLength: 35
        type: string
        xml:
          name: InstrId
      interbank_settlement_date:
        description: >-
          This field specifies the value date (yyyy-MM-dd) of the original
          transaction that needs to be reconfirm/reject (the date on which funds
          were credited to the account).
        format: date
        type: string
        xml:
          name: ReqdExctnDt
      reason:
        description: >-
          This is the five digits reconfirm/reject code (Example DUPL) which is
          specified by the  customer to request to reconfirm/reject the
          transaction
        maxLength: 5
        type: string
        xml:
          name: Rsn
      uetr:
        description: >-
          Unique End-to-end Transaction Reference (UETR) relating to a payment
          has been identified as being associated with a Request for
          reconfirm/reject. It should follow UUID version 4 format. UETR or
          citi_reference with interbank_settlement_date or instruction_id with
          interbank_settlement_date is mandatory.
        type: string
        xml:
          name: UETR
    required:
      - reason
    type: object
    xml:
      name: TransacService
  fi_response:
    properties:
      transaction_status:
        $ref: '#/definitions/transaction_status_detail'
    type: object
  transaction_status_detail:
    properties:
      status:
        description: >-
          This field  indicates the status of the reconfirm/reject or
          cancel/recall request with set of values. for example- ACCP for
          Accepted or RJCT for Rejected
        maxLength: 4
        type: string
        xml:
          name: TxSts
      type:
        description: >-
          This field provides additional information of the transaction when it
          is rejected/accepted.
        maxLength: 500
        type: string
        xml:
          name: AddtlInf
    type: object
    xml:
      name: TxInfAndSts
  payments_request:
    properties:
      paymentBase64:
        description: Base64 encoded string of ISO XML payment initiation input xml
        format: byte
        type: string
    required:
      - paymentBase64
    type: object
  payments_response:
    properties:
      psrDocument:
        description: Base64 encoded string of ISO XML payment initiation response xml
        format: byte
        type: string
    required:
      - psrDocument
    type: object
  payments_error_response:
    properties:
      correlationId:
        description: input request tracking unique id
        type: string
      message:
        description: message providing information about error
        type: string
      status:
        description: error status code
        type: string
    type: object
x-components:
  examples:
    accpStatusXmlExample:
      value:
        status: ACCP
        type: >-
          Your request has been registered. We will notify you once the txn is
