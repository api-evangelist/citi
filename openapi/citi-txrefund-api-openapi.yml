        required: true
      responses:
        '200':
          description: 200 OK
          content:
            application/xml:
              example: <?xml version="1.0" encoding="UTF-8"?><Document xmlns="urn:iso:std:iso:20022:tech:xsd:pain.002.001.03"><CstmrPmtStsRpt><GrpHdr><MsgId>CITIBANK/20191211-PSR/941416177</MsgId><CreDtTm>2019-12-11T06:24:52</CreDtTm><InitgPty><Id><OrgId><BICOrBEI>CITIUS33</BICOrBEI></OrgId></Id></InitgPty></GrpHdr><OrgnlGrpInfAndSts><OrgnlMsgId>MsgIdffgh</OrgnlMsgId><OrgnlMsgNmId>pain.007.001.09</OrgnlMsgNmId><OrgnlCreDtTm>2019-12-11T12:00:00</OrgnlCreDtTm><OrgnlNbOfTxs>1</OrgnlNbOfTxs></OrgnlGrpInfAndSts><OrgnlPmtInfAndSts><OrgnlPmtInfId>4568796</OrgnlPmtInfId><TxInfAndSts><OrgnlEndToEndId>20191209CITISGS0BRT2101630</OrgnlEndToEndId><TxSts>ACTC</TxSts></TxInfAndSts></OrgnlPmtInfAndSts></CstmrPmtStsRpt></Document>
        '400':
          description: Bad Request
        '401':
          description: Unauthorized; OAuth header decryption failed
        '405':
          description: Method Not Allowed
        '412':
          description: Precondition Failed
        '415':
          description: Unsupported Media Type
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
      tags:
      - Txrefund
      summary: Create txrefund
      x-summary-source: derived
      operationId: postTxrefund
      x-operation-id-source: derived
