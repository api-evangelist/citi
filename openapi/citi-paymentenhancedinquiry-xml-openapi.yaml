        InstdRmbrsmntAgtAcct:
          type: object
          description: >-
            Unambiguous identification of the account of the instructed
            reimbursement agent account at its servicing agent in the payment
            chain.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        ThrdRmbrsmntAgtAcct:
          type: object
