status_codes:
- status: 400
  declared_on: 247
  title: Bad Request
  remediation: Payload failed schema or business validation. The express-payments and payment-acceptance surfaces
    return a field-level reasonCode; see errors/citi-decline-codes.yml.
- status: 401
  declared_on: 230
  title: Unauthorized
  remediation: Access token missing, malformed or expired. Citi issues no refresh token — the published guidance
    is to renew the access token only on receiving a 401, then retry once.
- status: 403
  declared_on: 103
  title: Forbidden
  remediation: The client is authenticated but not entitled to this operation, region or country. Entitlement is
    granted per client during onboarding, not self-served.
- status: 404
  declared_on: 187
  title: Not Found
  remediation: Resource or reference identifier not found under the calling client entitlement.
