      title: PaymentInstructionInformation3
      properties:
        BtchBookg:
          title: BtchBookg
          type: boolean
          description: >-
            Identifies whether a single entry per individual transaction or a
            batch entry for the sum of the amounts of all transactions within
            the group of a message is requested.
        ChrgBr:
          $ref: '#/components/schemas/ChargeBearerType1Code'
        ChrgsAcct:
          title: ChrgsAcct
          description: Account used to process charges associated with a transaction.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        ChrgsAcctAgt:
          title: ChrgsAcctAgt
          description: Agent that services a charges account.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        CtrlSum:
          title: CtrlSum
          maxLength: 18
          type: string
          description: >-
            Total of all individual amounts included in the group, irrespective
            of currencies. The number of fractional digits should not be more
            than 17.
        CdtTrfTxInf:
          title: CdtTrfTxInf
          minItems: 1
          type: array
          description: >-
            Set of elements used to provide information on the individual
            transaction(s) included in the message.
          items:
            $ref: '#/components/schemas/CreditTransferTransactionInformation10'
        Dbtr:
          title: Dbtr
          description: Party that owes an amount of money to the (ultimate) creditor.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification32'
        DbtrAcct:
          title: DbtrAcct
          description: >-
            Identification of the account of the debtor to which a debit entry
            will be made as a result of the transaction.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        DbtrAgt:
          title: DbtrAgt
          description: Financial institution servicing an account for the debtor.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        DbtrAgtAcct:
          title: DbtrAgtAcct
          description: >-
            Identification of the account of the debtor agent at its servicing
            agent in the payment chain.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        NbOfTxs:
          title: NbOfTxs
          pattern: '[0-9]{1,15}'
          type: string
          description: >-
            Number of individual transactions contained in the paymnet
            information group.
        PmtInfId:
          title: PmtInfId
          description: >-
            Unique identification, as assigned by a sending party, to identify
            the payment information group within the message.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        PmtMtd:
          title: PmtMtd
          type: string
          description: >-
            Specifies the means of payment that will be used to move the amount
            of money. <br><br><b>CHK</b> : Written order to a bank to pay a
            certain amount of money from one person to another person.
            <br><br><b>TRF</b> : Transfer of an amount of money in the books of
            the account servicer. <br><br><b>TRA</b> : Transfer of an amount of
            money in the books of the account servicer. An advice should be sent
            back to the account owner. 
          enum:
            - CHK
            - TRF
            - TRA
        PmtTpInf:
          $ref: '#/components/schemas/PaymentTypeInformation19'
        PoolgAdjstmntDt:
          title: PoolgAdjstmntDt
          description: >-
            Date used for the correction of the value date of a cash pool
            movement that has been posted with a different value date.
          allOf:
            - $ref: '#/components/schemas/ISODate'
        ReqdExctnDt:
          title: ReqdExctnDt
          description: >-
            Date at which the initiating party requests the clearing agent to
            process the payment.
          allOf:
            - $ref: '#/components/schemas/ISODate'
        UltmtDbtr:
          title: UltmtDbtr
          description: >-
            Ultimate party that owes an amount of money to the (ultimate)
            creditor.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification32'
    PaymentTypeInformation19:
      title: PaymentTypeInformation19
      type: object
      properties:
        CtgyPurp:
          $ref: '#/components/schemas/CategoryPurpose1Choice'
        InstrPrty:
          $ref: '#/components/schemas/Priority2Code'
        LclInstrm:
          $ref: '#/components/schemas/LocalInstrument2Choice'
        SvcLvl:
          $ref: '#/components/schemas/ServiceLevel8Choice'
      description: Set of elements used to further specify the type of transaction.
    PersonIdentification5:
      title: PersonIdentification5
      type: object
      properties:
        DtAndPlcOfBirth:
          $ref: '#/components/schemas/DateAndPlaceOfBirth'
        Othr:
          title: Othr
          type: array
          description: >-
            Unique identification of a person, as assigned by an institution,
            using an identification scheme.
          items:
            $ref: '#/components/schemas/GenericPersonIdentification1'
      description: Unique identification of a person, for example a passport.
    PhoneNumber:
      title: PhoneNumber
      pattern: \+[0-9]{1,3}-[0-9()+\-]{1,30}
      type: string
    PostalAddress6:
      title: PostalAddress6
      type: object
      properties:
        AdrLine:
          title: AdrLine
          maxItems: 7
          type: array
          description: >-
            Information that locates and identifies a specific address, as
            defined by postal services, presented in free format text.
          items:
            $ref: '#/components/schemas/Max70Text'
        AdrTp:
          title: AdrTp
          type: string
          description: >-
            Identifies the nature of the postal address.<br><br><b>ADDR</b> :
            Address is the complete postal address. <br><br><b>PBOX</b> :
            Address is a postal office (PO) box. <br><br><b>HOME</b> : Address
            is the home address. <br><br><b>BIZZ</b> : Address is the business
            address.<br><br><b>MLTO</b> : Address is the address to which mail
            is sent.<br><br><b>DLVY</b> : Address is the address to which
            delivery is to take place.
          enum:
            - ADDR
            - PBOX
            - HOME
            - BIZZ
            - MLTO
            - DLVY
        BldgNb:
          title: BldgNb
          description: Number that identifies the position of a building on a street.
          allOf:
            - $ref: '#/components/schemas/Max16Text'
        Ctry:
          $ref: '#/components/schemas/CountryCode'
        CtrySubDvsn:
          title: CtrySubDvsn
          description: Identifies a subdivision of a country such as state, region, county.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        Dept:
          title: Dept
          description: Identification of a division of a large organization or building.
          allOf:
            - $ref: '#/components/schemas/Max70Text'
        PstCd:
          title: PstCd
          description: >-
            Identifier consisting of a group of letters and/or numbers that is
            added to a postal address to assist the sorting of mail.
          allOf:
            - $ref: '#/components/schemas/Max16Text'
        StrtNm:
          title: StrtNm
          description: Name of a street or thoroughfare.
          allOf:
            - $ref: '#/components/schemas/Max70Text'
        SubDept:
          title: SubDept
          description: >-
            Identification of a sub-division of a large organization or
            building.
          allOf:
            - $ref: '#/components/schemas/Max70Text'
        TwnNm:
          title: TwnNm
          description: >-
            Name of a built-up area, with defined boundaries, and a local
            government.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
      description: >-
        Information that locates and identifies a specific address, as defined
        by postal services.
    Priority2Code:
      title: Priority2Code
      type: string
      description: >-
        Indicator of the urgency or order of importance that the instructing
        party would like the instructed party to apply to the processing of the
        instruction.<br><br><b>HIGH</b> : Priority level is high.
        <br><br><b>NORM</b> : Priority level is normal.
      enum:
        - HIGH
        - NORM
    Purpose2Choice:
      title: Purpose2Choice
      type: object
      properties:
        Cd:
          title: Cd
          maxLength: 4
          minLength: 1
          type: string
          description: >-
            Underlying reason for the payment transaction, as published in an
            external purpose code list.
        Prtry:
          title: Prtry
          description: Purpose, in a proprietary form.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
      description: >-
        Underlying reason for the payment transaction. Either Code or
        Proprietary parameter value should be passed on request.
    ReferredDocumentInformation3:
      title: ReferredDocumentInformation3
      type: object
      properties:
        Nb:
          title: Nb
          description: Unique identification of the referred document.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        RltdDt:
          title: RltdDt
          description: Date associated with the referred document.
          allOf:
            - $ref: '#/components/schemas/ISODate'
        Tp:
          $ref: '#/components/schemas/ReferredDocumentType2'
    ReferredDocumentType1Choice:
      title: ReferredDocumentType1Choice
      type: object
      properties:
        Cd:
          $ref: '#/components/schemas/DocumentType5Code'
        Prtry:
          title: Prtry
          description: Proprietary identification of the type of the remittance document.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
      description: >-
        Provides the type details of the referred document. Either the `code` or
        the `proprietary` parameter value should be passed on request.
    ReferredDocumentType2:
      required:
        - CdOrPrtry
      type: object
      title: ReferredDocumentType2
      properties:
        CdOrPrtry:
          $ref: '#/components/schemas/ReferredDocumentType1Choice'
        Issr:
          title: Issr
          description: Identification of the issuer of the reference document type.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
      description: Specifies the type of referred document.
    RegulatoryReporting3:
      title: RegulatoryReporting3
      type: object
      properties:
        Authrty:
          title: Authrty
          type: object
          properties:
            Ctry:
              title: Ctry
              description: >-
                Country of the entity that requires the regulatory reporting
                information.
              allOf:
                - $ref: '#/components/schemas/CountryCode'
            Nm:
              title: Nm
              description: >-
                Name of the entity requiring the regulatory reporting
                information.
              allOf:
                - $ref: '#/components/schemas/Max140Text'
          description: Entity requiring the regulatory reporting information.
        DbtCdtRptgInd:
          title: DbtCdtRptgInd
          type: string
          description: >-
            Identifies whether the regulatory reporting information applies to
            the debit side, to the credit side or to both debit and credit sides
            of the transaction.<br><br><b>CRED</b> : Regulatory information
            applies to the credit side. <br><br><b>DEBT</b> : Regulatory
            information applies to the debit side. <br><br><b>BOTH</b> :
            Regulatory information applies to both credit and debit sides.
          enum:
            - CRED
            - DEBT
            - BOTH
        Dtls:
          title: Dtls
          type: array
          description: >-
            Set of elements used to provide details on the regulatory reporting
            information.
          items:
            $ref: '#/components/schemas/StructuredRegulatoryReporting3'
    RemittanceAmount1:
      title: RemittanceAmount1
      type: object
      properties:
        AdjstmntAmtAndRsn:
          title: AdjstmntAmtAndRsn
          type: array
          description: >-
            Set of elements used to provide information on the amount and reason
            of the document adjustment.
          items:
            $ref: '#/components/schemas/DocumentAdjustment1'
        CdtNoteAmt:
          title: CdtNoteAmt
          description: >-
            Amount specified for the referred document is the amount of a credit
            note.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        DscntApldAmt:
          title: DscntApldAmt
          description: >-
            Amount of money that results from the application of an agreed
            discount to the amount due and payable to the creditor.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        DuePyblAmt:
          title: DuePyblAmt
          description: >-
            Amount specified is the exact amount due and payable to the
            creditor.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        RmtdAmt:
          title: RmtdAmt
          description: Amount of money remitted for the referred document.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        TaxAmt:
          title: TaxAmt
          description: Quantity of cash resulting from the calculation of the tax.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
      description: >-
        Set of elements used to provide details on the amounts of the referred
        document.
    RemittanceInformation5:
      title: RemittanceInformation5
      type: object
      properties:
        Strd:
          title: Strd
          type: array
          description: >-
            Information supplied to enable the matching/reconciliation of an
            entry with the items that the payment is intended to settle, such as
            commercial invoices in an accounts' receivable system, in a
            structured form.
          items:
            $ref: '#/components/schemas/StructuredRemittanceInformation7'
        Ustrd:
          title: Ustrd
          type: array
          description: >-
            Information supplied to enable the matching/reconciliation of an
            entry with the items that the payment is intended to settle, such as
            commercial invoices in an accounts' receivable system, in an
            unstructured form.
          items:
            $ref: '#/components/schemas/Max140Text'
    RemittanceLocation2:
      title: RemittanceLocation2
      type: object
      properties:
        RmtId:
          title: RmtId
          description: >-
            Unique identification, as assigned by the initiating party, to
            identify the remittance information sent separately from the payment
            instruction, such as a remittance advice.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        RmtLctnElctrncAdr:
          title: RmtLctnElctrncAdr
          description: >-
            Electronic address to which an agent is to send the remittance
            information.
          allOf:
            - $ref: '#/components/schemas/Max2048Text'
        RmtLctnMtd:
          title: RmtLctnMtd
          type: string
          description: >-
            Method used to deliver the remittance advice
            information.<br><br><b>FAXI</b> : Remittance advice information must
            be faxed. <br><br><b>EDIC</b> : Remittance advice information must
            be sent through Electronic Data Interchange (EDI).
            <br><br><b>URID</b> : Remittance advice information needs to be sent
            to a Uniform Resource Identifier (URI). URI is a compact string of
            characters that uniquely identify an abstract or physical resource.
            URI's are the super-set of identifiers, such as URLs, email
            addresses, ftp sites, etc, and as such, provide the syntax for all
            of the identification schemes. <br><br><b>EMAL</b> : Remittance
            advice information must be sent through e-mail. <br><br><b>POST</b>
            : Remittance advice information must be sent through postal
            services. <br><br><b>SMSM</b> : Remittance advice information must
            be sent through by phone as a short message service (SMS).
          enum:
            - FAXI
            - EDIC
            - URID
            - EMAL
            - POST
            - SMSM
        RmtLctnPstlAdr:
          title: RmtLctnPstlAdr
          description: >-
            Postal address to which an agent is to send the remittance
            information.
          allOf:
            - $ref: '#/components/schemas/NameAndAddress10'
    ServiceLevel8Choice:
      title: ServiceLevel8Choice
      type: object
      properties:
        Cd:
          title: Cd
          description: >-
            Specifies a pre-agreed service or level of service between the
            parties, as published in an external service level code list.
          allOf:
            - $ref: '#/components/schemas/Max4Text'
        Prtry:
          title: Prtry
          description: >-
            Specifies a pre-agreed service or level of service between the
            parties, as a proprietary code.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
      description: >-
        Agreement under which or rules under which the transaction should be
        processed. Either code or proprietary parameter values should be sent in
        request.
    StructuredRegulatoryReporting3:
      title: StructuredRegulatoryReporting3
      type: object
      properties:
        Amt:
          title: Amt
          description: >-
            Amount of money to be reported for regulatory and statutory
            requirements.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        Cd:
          title: Cd
          description: >-
            Specifies the nature, purpose, and reason for the transaction to be
            reported for regulatory and statutory requirements in a coded form.
          allOf:
            - $ref: '#/components/schemas/Max10Text'
        Ctry:
          title: Ctry
          description: >-
            Country related to the specified type of regulatory reporting
            details.
          allOf:
            - $ref: '#/components/schemas/CountryCode'
        Dt:
          title: Dt
          description: Date related to the specified type of regulatory reporting details.
          allOf:
            - $ref: '#/components/schemas/ISODate'
        Inf:
          title: Inf
          type: array
          description: >-
            Additional details that cater for specific domestic regulatory
            requirements.
          items:
            $ref: '#/components/schemas/Max35Text'
        Tp:
          title: Tp
          description: >-
            Specifies the type of the information supplied in the regulatory
            reporting details.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
    StructuredRemittanceInformation7:
      title: StructuredRemittanceInformation7
      type: object
      properties:
        AddtlRmtInf:
          title: AddtlRmtInf
          maxItems: 3
          type: array
          description: >-
            Additional information, in free text form, to complement the
            structured remittance information.
          items:
            $ref: '#/components/schemas/Max140Text'
        CdtrRefInf:
          $ref: '#/components/schemas/CreditorReferenceInformation2'
        Invcee:
          title: Invcee
          description: >-
            Identification of the party to whom an invoice is issued, when it is
            different from the debtor or ultimate debtor.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification32'
        Invcr:
          title: Invcr
          description: >-
            Identification of the organization issuing the invoice, when it is
            different from the creditor or ultimate creditor.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification32'
        RfrdDocAmt:
          $ref: '#/components/schemas/RemittanceAmount1'
        RfrdDocInf:
          title: RfrdDocInf
          type: array
          description: >-
            Set of elements used to identify the documents referred to in the
            remittance information.
          items:
            $ref: '#/components/schemas/ReferredDocumentInformation3'
    TaxAmount1:
      title: TaxAmount1
      type: object
      properties:
        Dtls:
          title: Dtls
          type: array
          description: >-
            Set of elements used to provide details on the tax period and
            amount.
          items:
            $ref: '#/components/schemas/TaxRecordDetails1'
        Rate:
          title: Rate
          maxLength: 11
          type: string
          description: Rate used to calculate the tax.
        TaxblBaseAmt:
          title: TaxblBaseAmt
          description: Amount of money on which the tax is based.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        TtlAmt:
          title: TtlAmt
          description: >-
            Total amount that is the result of the calculation of the tax for
            the record.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
      description: >-
        Set of elements used to provide information on the amount of the tax
        record.
    TaxAuthorisation1:
      title: TaxAuthorisation1
      type: object
      properties:
        Nm:
          title: Nm
          description: Name of the debtor or the debtor's authorized representative.
          allOf:
            - $ref: '#/components/schemas/Max140Text'
        Titl:
          title: Titl
          description: >-
            Title or position of debtor or the debtor's authorized
            representative.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
      description: Details of the authorized tax paying party.
    TaxInformation3:
      title: TaxInformation3
      type: object
      properties:
        AdmstnZn:
          title: AdmstnZn
          description: Territorial part of a country to which the tax payment is related.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        Cdtr:
          $ref: '#/components/schemas/TaxParty1'
        Dt:
          title: Dt
          description: Date by which tax is due.
          allOf:
            - $ref: '#/components/schemas/ISODate'
        Dbtr:
          $ref: '#/components/schemas/TaxParty2'
        Mtd:
          title: Mtd
          description: >-
            Method used to indicate the underlying business or how the tax is
            paid.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        Rcrd:
          title: Rcrd
          type: array
          description: Record of tax details.
          items:
            $ref: '#/components/schemas/TaxRecord1'
        RefNb:
          title: RefNb
          description: Tax reference information that is specific to a taxing agency.
          allOf:
            - $ref: '#/components/schemas/Max140Text'
        SeqNb:
          title: SeqNb
          description: Sequential number of the tax report.
          allOf:
            - $ref: '#/components/schemas/Number'
        TtlTaxAmt:
          title: TtlTaxAmt
          description: Total amount of money as result of the calculation of the tax.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        TtlTaxblBaseAmt:
          title: TtlTaxblBaseAmt
          description: Total amount of money on which the tax is based.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
      description: Set of elements used to provide details on the tax.
    TaxParty1:
      title: TaxParty1
      type: object
      properties:
        RegnId:
          title: RegnId
          description: >-
            Unique identification, as assigned by an organization, to identify a
            party.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        TaxId:
          title: TaxId
          description: Tax identification number of the creditor.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        TaxTp:
          title: TaxTp
          description: Type of tax payer.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
      description: Party on the credit side of the transaction to which the tax applies.
    TaxParty2:
      title: TaxParty2
      type: object
      properties:
        Authstn:
          $ref: '#/components/schemas/TaxAuthorisation1'
        RegnId:
          title: RegnId
          description: >-
            Unique identification, as assigned by an organization, to identify a
            party.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        TaxId:
          title: TaxId
          description: Tax identification number of the debtor.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        TaxTp:
          title: TaxTp
          description: Type of tax payer.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
      description: >-
        Set of elements used to identify the party on the debit side of the
        transaction to which the tax applies.
    TaxPeriod1:
      title: TaxPeriod1
      type: object
      properties:
        FrToDt:
          title: FrToDt
          description: >-
            Range of time between a start date and an end date for which the tax
            report is provided.
          allOf:
            - $ref: '#/components/schemas/DatePeriodDetails'
        Tp:
          $ref: '#/components/schemas/TaxRecordPeriod1Code'
        Yr:
          title: Yr
          description: Year related to the tax payment.
          allOf:
            - $ref: '#/components/schemas/ISODate'
      description: >-
        Set of elements used to provide details on the period of time related to
        the tax payment.
    TaxRecord1:
      title: TaxRecord1
      type: object
      properties:
        AddtlInf:
          title: AddtlInf
          description: Further details of the tax record.
          allOf:
            - $ref: '#/components/schemas/Max140Text'
        Ctgy:
          title: Ctgy
          description: Specifies the tax code as published by the tax authority.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        CtgyDtls:
          title: CtgyDtls
          description: Provides further details of the category tax code.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        CertId:
          title: CertId
          description: >-
            Identification number of the tax report as assigned by the taxing
            authority.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        DbtrSts:
          title: DbtrSts
          description: >-
            Code provided by local authority to identify the status of the party
            that has drawn up the settlement document.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        FrmsCd:
          title: FrmsCd
          description: >-
            Identifies, in a coded form, on which template the tax report is to
            be provided.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        Prd:
          $ref: '#/components/schemas/TaxPeriod1'
        TaxAmt:
          $ref: '#/components/schemas/TaxAmount1'
        Tp:
          title: Tp
          description: High level code to identify the type of tax details.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
    TaxRecordDetails1:
      required:
        - Amt
      type: object
      title: TaxRecordDetails1
      properties:
        Amt:
          title: Amt
          description: Underlying tax amount related to the specified period.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        Prd:
          $ref: '#/components/schemas/TaxPeriod1'
    TaxRecordPeriod1Code:
      title: TaxRecordPeriod1Code
      type: string
      description: >-
        Identification of the period related to the tax payment.
        <br><br><b>MM01</b> : Tax is related to the first month of the period.
        <br><br><b>MM02</b> : Tax is related to the second month of the
        period.<br><br><b>MM03</b> : Tax is related to the third month of the
        period.<br><br><b>MM04</b> : Tax is related to the fourth month of the
        period.<br><br><b>MM05</b> : Tax is related to the fifth month of the
        period.<br><br><b>MM06</b> : Tax is related to the sixth month of the
        period.<br><br><b>MM07</b> : Tax is related to the seventh month of the
        period.<br><br><b>MM08</b> : Tax is related to the eighth month of the
        period.<br><br><b>MM09</b> : Tax is related to the ninth month of the
        period.<br><br><b>MM10</b> : Tax is related to the tenth month of the
        period.<br><br><b>MM11</b> : Tax is related to the eleventh month of the
        period.<br><br><b>MM12</b> : Tax is related to the twelfth month of the
        period.<br><br><b>QTR1</b> : Tax is related to the first quarter of the
        period.<br><br><b>QTR2</b> : Tax is related to the second quarter of the
        period.<br><br><b>QTR3</b> : Tax is related to the third quarter of the
        period.<br><br><b>QTR4</b> : Tax is related to the fourth quarter of the
        period.<br><br><b>HLF1</b> : Tax is related to the first half of the
        period.<br><br><b>HLF2</b> : Tax is related to the second half of the
        period.
      enum:
        - MM01
        - MM02
        - MM03
        - MM04
        - MM05
        - MM06
        - MM07
        - MM08
        - MM09
        - MM10
        - MM11
        - MM12
        - QTR1
        - QTR2
        - QTR3
        - QTR4
        - HLF1
        - HLF2
    CstmrPmtStsRpt:
      required:
        - OrgnlMsgId
      title: CstmrPmtStsRpt
      type: object
      description: Customer Payment Status Report Notification
      properties:
        OrgnlMsgId:
          title: OrgnlMsgId
          maxLength: 35
          minLength: 1
          type: string
          description: >-
            Point-to-point reference, as assigned by the instructing party, and
            sent to the next party in the chain to identify the message.
          example: GBP161114694869
        OrgnlNbOfTxs:
          title: OrgnlNbOfTxs
          description: Number of individual transactions contained in the message.
          type: string
          pattern: '[0-9]{1,15}'
          example: '1000'
        OrgnlPmtInfAndSts:
          title: OrgnlPmtInfAndSts
          description: Status Details
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/OriginalPaymentInformation1'
    OriginalPaymentInformation1:
      title: OriginalPaymentInformation1
      type: object
      properties:
        PmtInfSts:
          title: PmtInfSts
          description: Status of the transactions.
          maxLength: 4
          minLength: 1
          type: string
          example: PDNG
        DtldNbOfTxs:
          title: DtldNbOfTxs
          description: >-
            Number of individual transactions contained in the message, detailed
            per status.
          type: string
          example: '100'
        StsRsnInf:
          title: StsRsnInf
          type: array
          description: >-
            Set of elements used to provide detailed information on the status
            reason.
          items:
            $ref: '#/components/schemas/StatusReasonInformation8'
        TxInfAndSts:
          title: TxInfAndSts
          type: array
          description: Transaction Information
          items:
            $ref: '#/components/schemas/TransactionInfoAndStatus'
    TransactionInfoAndStatus:
      title: TransactionInfoAndStatus
      type: object
      properties:
        OrgnlEndToEndId:
          title: OrgnlEndToEndId
          description: >-
            Unique identification assigned by the initiating party to identify
            the transaction. This identification is passed on, unchanged,
            throughout the entire end-to-end chain.
          maxLength: 35
          minLength: 1
          type: string
          example: API2025060202
        Rsn:
          $ref: '#/components/schemas/StatusReason'
    StatusReason:
      title: StatusReason
      type: object
      properties:
        Cd:
          title: Cd
          maxLength: 4
          minLength: 1
          type: string
          description: Reason for the status, as published in an external reason code list.
        AddtlInf:
          title: AddtlInf
          maxLength: 300
          minLength: 1
          type: string
          description: Further details on the status reason.
      description: >-
        Specifies the reason for the status report. Either Code or Proprietary
        parameter value should be passed on request.
    StatusReasonInformation8:
      type: object
      title: StatusReasonInformation8
      properties:
        Rsn:
          $ref: '#/components/schemas/StatusReason'
    Gateway-Error-Response:
      type: object
      xml:
        name: errorMessage
      title: GatewayErrorResponse
      required:
        - httpCode
        - httpMessage
        - moreInformation
      properties:
        httpCode:
          type: string
          maxLength: 3
          description: Numeric HTTP Staus code
          xml:
            name: httpCode
          title: httpCode
          example: '400'
        httpMessage:
          type: string
          maxLength: 128
          description: HTTP error message
          xml:
            name: httpMessage
          title: httpMessage
          example: Bad Request
        moreInformation:
          type: string
          maxLength: 128
          description: HTTP error message
          xml:
            name: moreInformation
          title: httpMessage
          example: please provide valid value for request
    Service-Error-Response:
      title: ServiceErrorResponse
      xml:
        name: ErrorMessage
      type: object
      required:
        - ref_id
        - error_details
      properties:
        ref_id:
          type: string
          maxLength: 60
          description: Unique ID for the Transaction
          xml:
            name: RefId
          title: ref_id
          example: 444d0f3f-4x55-7g99-8b2c-0cf2a921a5ab
        error_details:
          xml:
            name: ErrorDetails
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Error-Detail'
          title: error_details
    Error-Detail:
      type: object
      title: ErrorDetail
      properties:
        code:
          type: string
          maxLength: 8
          description: unique code representing the issue
          xml:
            name: Code
          title: code
          example: VC00010
        issue:
          type: string
          maxLength: 200
          description: more details about the issue
          xml:
            name: Issue
          title: issue
          example: property emailAddress is mandatory and it cannot be empt
        action:
          type: string
          maxLength: 350
          description: corrective action to be taken to resolve above issue
          xml:
            name: Action
          title: action
          example: please provide valid value for property emailAddress
