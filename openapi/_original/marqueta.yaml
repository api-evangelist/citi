          <br><br>Possible values are
          <br>fulfillment.requested<br>state.request_declined<br>state.activated<br>state.suspended<br>state.reinstated<br>state.terminated<br>card.swap<br>
        minLength: 1
        maxLength: 255
      channel:
        type: string
        example: API
        description: >-
          Source of a change for instance whether the Marqeta system
          automatically made a change (SYSTEM) or initiated by the issuer (API).
