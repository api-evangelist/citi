openapi: 3.2.0
info:
  version: 1.0.0
  title: Virtual Cards Life Cycle Management Create API
  description: Create, modify or cancel a Virtual Card Account.
  x-ibm-name: vca-life-cycle-management
servers:
- url: https://tts.apib2b.citi.com/tts/cards/vca/v1/
  description: production gateway URL
- url: https://tts.sandbox.apib2b.citi.com/tts/cards/vca/v1/
  description: sandbox URL
security:
- clientCredentials: []
tags:
- name: Create
paths:
  /create:
    post:
      summary: Create Virtual Card Accounts
      operationId: create
      description: 'Create a virtual card and set its associated spending controls, custom reference data and payment beneficiaries. It allows you to place a a virtual card account creation request for secure purchasing, with increased transaction-Level controls, limit card number use by MCC, amounts, dates and even specific suppliers.


        Note: In a Create VCA Request call for a Mastercard program, you must specify at least one instance of whichever velocity control the purchase template that is setup in the VCA application contains. Other controls are optional in the API request to Citi, even if they are included in the purchase template that is setup in the VCA application. If you indicate that you would like to use an optional control by sending the enable flag as TRUE, you have to specify all parameters listed in the control section unless otherwise specified, else, the API request will be rejected.'
      parameters:
      - name: client_id
        in: query
        required: true
        description: This is your unique identifier shared during your CitiConnect API onboarding. This is the same `client_id` used for oauth token generation
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Supports \"application/xml\" and \"application/json\".
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: The OAuth Token prefixed with "Bearer" and space in between.
        required: true
        schema:
          type: string
      - name: country
        in: header
        required: true
        description: country of the Client
        schema:
          type: string
      - name: region
        in: header
        required: true
        description: region of the client(Apac/EMEA/NAM)
        schema:
          type: string
      responses:
        '200':
          description: Create Virtual Card response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVirtualCardResponse'
        '400':
          description: Invalid Modify Virtual Card request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVirtualCardFailureResponse'
        '401':
          description: Unauthorized Modify Virtual Card request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVirtualCardFailureResponse'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVirtualCardFailureResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVirtualCardFailureResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualCardRequest'
        required: true
      tags:
      - Create
components:
  schemas:
    CreateVirtualCardResponse:
      type: object
      properties:
        vcaId:
          type: string
          description: A reference number that uniquely identifies the virtual card account.
        cardImage:
          type: string
          description: A visual representation of the virtual card account front and back.
        currencyCode:
          type: string
          description: Currency Code in which VCA amounts are expressed.
        timeZone:
          type: string
          description: Defines the time zone applicable for any date or time parameters within controls set for a VCA.
        virtualCardAccountNumber:
          type: string
          description: The virtual card account number to use for transactions.
        expiryDate:
          type: string
          description: 'Expiry Date of the virtual card account. '
        securityCode:
          type: string
          description: The security code (i.e. cvv) corresponding to the virtual card accunt.
        programId:
          type: string
          description: Unique ID of the company record defined in the virtual cards system.
        messageId:
          type: string
          description: Unique ID of the API message sent. The messageId will be provided back in the corresponding response. The ID can be used for investigation and troubleshooting. The ID must be unique per integration.
        mccGrouping:
          type: array
          description: Limits authorizations to defined Merchant Category Codes.
          items:
            type: string
        currencyType:
          type: string
          description: Defines the type of the VCA currency. - Value B stands for Billing Currency which indicates that the VCA currency is equal to the billing currency of the underlying funding source. - Value M stands for Merchant Currency which indicates that the VCA currency is expressed in merchant currency and not in billing currency.
        paymentBeneficiaryId:
          type: number
          description: Uniquely identifies the payment beneficiary for which the virtual card is created.
        paymentBeneficiaryEmails:
          type: array
          description: Specifies up to five email addresses to which the virtual card account details should be delivered. Email addresses specified in the request will not override any default email addresses specified in the virtual card application.
          items:
            type: string
        customReference:
          type: array
          items:
            $ref: '#/components/schemas/CustomReference'
        templateId:
          type: number
          description: Identifies the template that was setup in the VCA system and that should be used for this virtual card.The template setup in the VCA system defines which controls, custom data fields and MCC groupings can be used.
        cumulativeSpendLimit:
          type: number
          format: bigdecimal
          description: 'Limits the overall amount spend on the virtual card account. '
        standInVca:
          type: boolean
          description: 'Indicates whether the VCA details returned are generated from the VCA platform, or a pre-generated VCA from Citi. If “true” is returned then the VCA returned is a pre-generated VCA from Citi. If the “false” is returned or if the field is not returned then the VCA returned is from the backend VCA platform. '
        warning:
          type: array
          description: Warning information regarding a non-fatal response condition that may be taken into account, but can be ignored
          example: The VCA Details returned are for a pre-generated VCA from Citi, as the backend VCA platform is currently unavailable
          items:
            type: string
        enableSpendVelocityControl:
          type: boolean
          description: Limits the frequency and total cumulative amount of authorizations performed on the VCA within a specified period.
        spendVelocity:
          type: array
          items:
            $ref: '#/components/schemas/SpendVelocityResponse'
        enableValidityPeriodControl:
          type: boolean
          description: 'Limits authorization activity to a specific time period. '
        validityStartDate:
          type: string
          description: Identifies the date from which the virtual card account can be used for transactions.
        validityEndDate:
          type: string
          description: Identifies the date until which the virtual card account can be used for transactions.
        enableAmountRangeControl:
          type: boolean
          description: Approves a transaction only if the requested amount for authorization is equal to or greater than the Minimum Amount and less than or equal to the Maximum Amount.
        maxAmount:
          type: number
          format: bigdecimal
          description: Identifies the maximum allowed transaction amount.
        minAmount:
          type: number
          format: bigdecimal
          description: Identifies the minimum allowed transaction amount.
        enableTransactionLimitControl:
          type: boolean
          description: Limits individual transactions to a maximum amount.
        amountLimit:
          type: number
          format: bigdecimal
          description: Identifies the maximum allowed transaction amount.
        enableCurfewControl:
          type: boolean
          description: Limits authorization activity to a single time period for each day selected.
        curfewTime:
          $ref: '#/components/schemas/CurfewTime'
        enableTimeOfDayControl:
          type: boolean
          description: 'Limits authorization request to defined time periods each day. '
        timeOfDay:
          type: array
          items:
            $ref: '#/components/schemas/TimeOfDay'
        enableAgingVelocityControl:
          type: boolean
          description: Sets a cumulative amount and keeps track of the current remaining balance. Allows the requester to age off approved authorization requests that have not been cleared by the merchant after a defined number of days.
        authorizationHoldDays:
          type: number
          format: long
          description: Identifies the number of days after which an authorization gets aged off if no matching clearing record was received.
        enableGeographyControl:
          type: boolean
          description: 'Limits authorization requests to a defined geographic location. '
        countryCodes:
          type: array
          description: Defines the merchant country in which the VCA can be used.
          items:
            type: string
        allowed:
          type: boolean
          description: Indicate whether the values in countryCode are allowed or disallowed.
        enableMerchantIdControl:
          type: boolean
          description: Limits authorizations to a particular merchant using the Merchant ID and Acquirer ID (Mastercard) or Card Acceptor ID (Visa).
        merchantInfo:
          type: array
          items:
            $ref: '#/components/schemas/MerchantIdResponse'
    MerchantIdRequest:
      type: object
      properties:
        allowed:
          type: boolean
          description: Indicate whether the values in merchantId and acquirerId are allowed or disallowed.True = values provided in merchantId and acquirerId are allowed,False = values provided in merchantId and acquirerId are not allowed
        cardAcceptorId:
          type: string
          description: Specifies the Card Acceptor ID that should be allowed / disallowed when transacting with the virtual card
        merchantId:
          type: string
          description: Specifies the Merchant ID that should be allowed / disallowed when transacting with the virtual card. Must always be provided in combination with a Acquirer ID.
        acquirerId:
          type: integer
          format: int64
          description: Specifies the Acquirer ID that should be allowed / disallowed when transacting with the virtual card. Must always be provided in combination with a Merchant ID.
    MerchantId:
      type: object
      properties:
        merchantId:
          type: string
          description: Specifies the Merchant ID that should be allowed / disallowed when transacting with the virtual card. Must always be provided in combination with a Acquirer ID.
        acquirerId:
          type: integer
          format: int64
          description: Specifies the Acquirer ID that should be allowed / disallowed when transacting with the virtual card. Must always be provided in combination with a Merchant ID.
