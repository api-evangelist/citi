tags:
  - name: Pain 00100103
paths:
  /payment/initiation:
    post:
      tags:
        - Pain 00100103
      summary: Payment Initiation
      description: >+
        You can initiate a new payment through the Payment Initiation endpoint.
        This endpoint takes the necessary data required in <a
        href="https://www.iso20022.org/catalogue-messages/iso-20022-messages-archive?search=pain.001.001.03"
        target="_blank">ISOXML pain.001.001.03 format</a> to initiate a payment
        through CitiConnect API. 

        It can be used to initiate one outgoing payment request per API call. 


        Each payment method take different input values based on the type of
        payment.

        Input values are also based on regulatory or local requirements. 


        **Note:** The required parameters vary depending on the countries and
        currencies used in the request. For detailed and up-to-date information
        on the necessary fields and formats, see the <a
        href="https://uat.developer.citi.com/apim/go/paymentrules"
        target="_blank">Citi Payment Formatting Rules Tool</a>.


        The Payment Initiation service accommodates all different data
        attributes for all the available payment methods.

        * **payloadType:** Supports <a
        href="https://www.iso20022.org/catalogue-messages/iso-20022-messages-archive?search=pain.001.001.03"
        target="_blank">urn:iso:std:iso:20022:tech:xsd:pain.001.001.03</a>. 

        * **Request:** The request follows <a
        href="https://www.iso20022.org/catalogue-messages/iso-20022-messages-archive?search=pain.001.001.03"
        target="_blank">ISO XML V3 (pain.001.001.03)</a> standards.

        * **paymentBase64:** <a
        href="https://www.iso20022.org/catalogue-messages/iso-20022-messages-archive?search=pain.001.001.03"
        target="_blank">ISO XML V3 (pain.001.001.03)</a> file has to be
        converted to Base64 format and passed in \<Request>\<paymentBase64>
        tags.

        * **Response:** The response follows <a
        href="https://www.iso20022.org/catalogue-messages/iso-20022-messages-archive?search=pain.001.001.03"
        target="_blank">ISO XML (pain.002.001.03)</a> standards.

      operationId: paymentInitiationUsingPOST
      parameters:
        - name: client_id
          in: query
          required: true
          description: >-
            This is your unique identifier shared during your CitiConnect API
            onboarding. This is the same `client_id` used for oauth token
            generation
          schema:
            type: string
        - name: Content-type
          in: header
          description: 'Supports "application/xml" '
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: The OAuth Token prefixed with "Bearer" and space in between.
          required: true
          schema:
            type: string
        - name: payloadType
          in: header
          description: Supports "urn:iso:std:iso:20022:tech:xsd:pain.001.001.03" format
          required: true
          schema:
            type: string
