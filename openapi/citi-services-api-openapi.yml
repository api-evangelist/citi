            $ref: '#/components/schemas/0687f793-b687-4ac0-9337-e6a0c8445918-data-schema'
    f5471486-3c48-45bc-9b1f-05a7d57bdc71-json-response-schema:
      type: object
      properties:
        Count:
          type: number
          format: integer
