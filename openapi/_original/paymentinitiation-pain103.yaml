        '400':
          description: >-
            Bad Request <br></br>Send a Payment Status Inquiry three times at
            five minute intervals to confirm that the request has not been
            received in that time. If the request has not been received, resend
            the request using the same end-to-end ID.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/errormessage'
              example: >-
                <?xml version="1.0"
                encoding="UTF-8"?><errormessage><httpMessage>Bad
                Request</httpMessage><httpCode>400</httpCode><moreInformation>Schema
                Validation
                Failed.</moreInformation></errormessage>               
        '401':
          description: Unauthorized
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/errormessage'
              example: >-
                <?xml version="1.0"
                encoding="UTF-8"?><errormessage><httpMessage>Invalid OAuth
                Token</httpMessage><httpCode>401</httpCode><moreInformation>Please
                use valid OAuth Token.</moreInformation></errormessage>
        '403':
          description: Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/errormessage'
              example: >-
                <?xml version="1.0"
                encoding="UTF-8"?><errormessage><httpMessage>Forbidden</httpMessage><httpCode>403</httpCode><moreInformation>You
                are forbidden to access this
                service.</moreInformation></errormessage>
        '404':
          description: Not found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/errormessage'
              example: >-
                <?xml version="1.0"
                encoding="UTF-8"?><errormessage><httpMessage>Not
                Found</httpMessage><httpCode>404</httpCode><moreInformation>No
                resources match requested URI.</moreInformation></errormessage>
        '405':
          description: Method Not Allowed
          content:
            application/xml:
              example: >-
                <?xml version="1.0"
                encoding="UTF-8"?><errormessage><httpMessage>Method not
                allowed</httpMessage><httpCode>405</httpCode><moreInformation>Please
                use valid HTTP supported verb
                only.</moreInformation></errormessage>
        '500':
          description: >-
            Internal Server Error <br></br>Send a Payment Status Inquiry three
            times at five minute intervals to confirm that the request has not
            been received in that time. If the request has not been received,
            resend the request using the same end-to-end ID.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/errormessage'
              example: >-
                <?xml version="1.0"
                encoding="UTF-8"?><errormessage><httpMessage>SSL Connection
                error</httpMessage><httpCode>500</httpCode><moreInformation>SSL
                Connection error with BE
                server.</moreInformation></errormessage>
      x-codegen-request-body-name: PaymentInitiationRequest
