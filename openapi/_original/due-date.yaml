      value:
        type: https://pix.bcb.gov.br/api/v2/error/midianaosuportada
        title: Midia invalida
        status: 415
        detail: Requisição enviada com midia não suportada
        violacoes:
          - razao: Midia não suportada
    NaoEncontradoExample1:
      summary: Example Request 1 Error
      value:
        type: https://pix.bcb.gov.br/api/v2/error/NaoEncontrado
        title: Não Encontrado
        status: 404
        detail: Entidade não encontrada.
    getCobsV1:
      summary: Example of the return of the due date collection query 1
      value:
        parametros:
          inicio: '2020-04-01T00:00:00Z'
          fim: '2020-04-01T23:59:59Z'
          paginacao:
            paginaAtual: 0
            itensPorPagina: 100
            quantidadeDePaginas: 1
            quantidadeTotalDeItens: 1
        cobs:
          - calendario:
              criacao: '2020-09-09T20:15:00.358Z'
              dataDeVencimento: '2020-12-31'
              validadeAposVencimento: 30
            txid: 7978c0c97ea847e78e8849634473c1f1
            revisao: 0
            loc:
              id: 789
              location: pix.example.com/qr/c2/cobv/9d36b84fc70b478fb95c12729b90ca25
              tipoCob: cobv
            status: ATIVA
            devedor:
              logradouro: Alameda Souza, Numero 80, Bairro Braz
              cidade: Recife
              uf: PE
              cep: '70011750'
              cpf: '12345678909'
              nome: Francisco da Silva
            recebedor:
              logradouro: Rua 15 Numero 1200, Bairro São Luiz
              cidade: São Paulo
              uf: SP
              cep: '70800100'
              cnpj: '56989000019533'
              nome: Empresa de Logística SA
            valor:
              original: '123.45'
            chave: 5f84a4c5-c5cb-4599-9f13-7eb4d419dacc
            solicitacaoPagador: Cobrança dos serviços prestados.
    ServicoIndisponivelExample1:
      summary: Example Request 1 Error
      value:
        type: https://pix.bcb.gov.br/api/v2/error/ServicoIndisponivel
        title: Serviço Indisponível
        status: 503
        detail: >-
          Serviço não está disponível no momento. Serviço solicitado pode estar
          em manutenção ou fora da janela de funcionamento.
    ServicoIndisponivelExample2:
      summary: Example Request 1 Error
      value:
        type: https://pix.bcb.gov.br/api/v2/error/ServicoIndisponivel
        title: Serviço Indisponível
        status: 500
        detail: >-
          Serviço não está disponível no momento. Serviço solicitado pode estar
          em manutenção ou fora da janela de funcionamento.
  requestBodies:
    CobVBody:
      description: Data for generating the collection item with due date.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CobVSolicitada'
          examples:
            exemplo1:
              $ref: '#/components/examples/cobBody1'
    CobVBodyRevisada:
      description: Data for updating the collection item.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CobVRevisada'
          examples:
            exemplo1:
              $ref: '#/components/examples/cobBody7'
            exemplo2:
              $ref: '#/components/examples/cobBody4'
            exemplo3:
              $ref: '#/components/examples/cobBody5'
  responses:
    CobVGeradaCreateResponse:
      description: Collection item with due date created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CobVGerada'
          examples:
            retorno1:
              $ref: '#/components/examples/cobResponse4'
    CobVGeradaUpdateResponse:
      description: Collection item with due date updated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CobVGerada'
          examples:
            retorno1:
              $ref: '#/components/examples/cobResponse4'
    RequisicaoInvalida:
      description: Request with invalid format.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            exemplo1:
              $ref: '#/components/examples/RequisicaoInvalidaCobExample1'
    NaoEncontrado:
      description: Requested resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            exemplo1:
              $ref: '#/components/examples/NaoEncontradoExample1'
    AcessoNegado:
      description: Authenticated participant request that violates some authorization rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            exemplo1:
              $ref: '#/components/examples/AcessoNegadoExample1'
    AcessoNegado1:
      description: Authenticated participant request that violates some authorization rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            exemplo1:
              $ref: '#/components/examples/AcessoNegadoExample2'
    MetodoInvalido:
      description: Request sent with invalid method
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            exemplo1:
              $ref: '#/components/examples/MetodoInvalidoExample1'
    ServicoIndisponivel:
      description: >-
        Service is not currently available. Requested service may be under
        maintenance or out of working window.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            exemplo1:
              $ref: '#/components/examples/ServicoIndisponivelExample1'
    ServicoIndisponivel1:
      description: >-
        Service is not currently available. Requested service may be under
        maintenance or out of working window.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            exemplo1:
              $ref: '#/components/examples/ServicoIndisponivelExample2'
    MidiaInvalida:
      description: Request sent with unsupported media
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            exemplo1:
              $ref: '#/components/examples/MidiaInvalidaExample1'
    CobsVConsultadasResponse:
      description: Immediate collection data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CobsVConsultadas'
          examples:
            getCobs1:
              $ref: '#/components/examples/getCobsV1'
    CobVCompletaResponse:
      description: Immediate collection data with due date.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CobVCompleta'
          examples:
            retorno1:
              $ref: '#/components/examples/cobResponse4'
  schemas:
    PayloadLocationId:
      type: integer
      format: int64
      title: Id da location
      description: Identifier of the location to be informed when creating the collection.
    CobBase:
      type: object
      title: Cobrança Base
      description: Attributes common to all collection entities
      properties:
        chave:
          type: string
          title: Chave DICT do recebedor
          description: >-
            PIX Alias - Determines the alias registered in DICT, which will be
            used for the collection. This alias will be submitted by the payer’s
            PSP applications to DICT, which will return the translated
            information that will identify the collection creditor. *The aliases
            can be of the following types: phone number, e-mail address,
            taxpayer ID (CPF/CNPJ) or EVP.* The aliases formats can be found in
            [Standards Manual for starting 
            Pix](https://www.bcb.gov.br/estabilidadefinanceira/pagamentosinstantaneos).
          maxLength: 77
        solicitacaoPagador:
          type: string
          title: Solicitação ao pagador
          description: >-
            This optional field determines a text to be presented to the payer
            so that he can enter related information, in free format, to be sent
            to the recipient. This text will be filled, in pacs.008, by the
            payer's PSP, in the RemittanceInformation <RmtInf> field. The length
            of the <RmtInf> field in pacs.008 is limited to 140 characters.
          maxLength: 140
        infoAdicionais:
          type: array
          title: Informações adicionais
          description: >-
            Each respective additional information contained in the list (name
            and amount) must be presented to the payer.
          maximum: 50
          items:
            type: object
            required:
              - nome
              - valor
            properties:
              nome:
                type: string
                title: Nome
                description: Field name.
                maxLength: 50
              valor:
                type: string
                title: Valor
                description: Field data.
                maxLength: 200
    CobBaseCopiaCola:
      type: object
      title: Cobrança Base com Copia e Cola
      description: >-
        Attributes common to all collection entities that have Copy and Paste
        information
      allOf:
        - type: object
          properties:
            pixCopiaECola:
              type: string
              title: Pix Copia e Cola correspondente à cobrança.
              description: >-
                This field returns the QR code string representation for a copy
                & paste operation.
              maxLength: 512
        - $ref: '#/components/schemas/CobBase'
    CobVSolicitada:
      type: object
      title: Cobrança com vencimento solicitada
      description: Data sent to create or update the collection with due date via API
      required:
        - valor
        - chave
        - devedor
        - calendario
      allOf:
        - type: object
          properties:
            calendario:
              title: Calendário
              description: >-
                Fields nested under the calendar identifier organize information
                regarding collection-related dates.
              allOf:
                - $ref: '#/components/schemas/CobDataDeVencimento'
        - $ref: '#/components/schemas/DadosDevedor'
        - type: object
          properties:
            loc:
              allOf:
                - $ref: '#/components/schemas/PayloadLocationCob'
        - type: object
          properties:
            valor:
              allOf:
                - required:
                    - original
                - $ref: '#/components/schemas/CobVValor'
        - $ref: '#/components/schemas/CobBase'
    CobVRevisada:
      type: object
      title: Cobrança com vencimento revisada
      description: Data sent for review of the collection item with due date via API
      allOf:
        - type: object
          properties:
            calendario:
              title: Calendário
              description: >-
                Fields nested under the calendar identifier organize information
                regarding collection-related dates.
              allOf:
                - $ref: '#/components/schemas/CobDataDeVencimento'
        - $ref: '#/components/schemas/DadosDevedor'
        - type: object
          properties:
            loc:
              allOf:
                - $ref: '#/components/schemas/PayloadLocationCob'
        - type: object
          properties:
            status:
              type: string
              title: Status do registro da cobrança
              enum:
                - REMOVIDA_PELO_USUARIO_RECEBEDOR
        - type: object
          properties:
            valor:
              $ref: '#/components/schemas/CobVValor'
        - $ref: '#/components/schemas/CobBase'
    TxId:
      type: string
      title: Id da Transação
      description: >-
        Field `txid` determines the transaction identifier for reconciliation
        purposes. In pacs.008 it is referenced as `TransactionIdentification
        <txId>` or `idConciliacaoRecebedor`. The txid is retrieved by the
        payer’s PSP application and, after the payment is confirmed, it is sent
        to SPI via pacs.008. A pacs.008 is also sent to the receiver’s PSP,
        containing the txid in addition to all the usual payment  information.
        Upon receiving the payment with txid, the receiver's PSP may inform the
        creditor to reconcile. The contents of this field are provided
        exclusively by the collector, who is the ultimate responsible for them.
        The txid should be unique by collector’s CPF/CNPJ. The receiving PSP is
        responsible for validating this rule in the API.
      pattern: '[a-zA-Z0-9]{26,35}'
    CNPJ:
      type: string
      title: número de identificação fiscal
      description: |
        # Tax identification identifier
          Field `taxid` determines the tax identification number.
      pattern: ^[0-9]{14}$
    EndToEndId:
      type: string
      title: Id fim a fim da transação
      description: EndToEndIdentification that carries over PACS002, PACS004 and PACS008
      pattern: '[a-zA-Z0-9]{32}'
      minLength: 32
      maxLength: 32
    DevolucaoId:
      type: string
      title: Id da Devolução
      description: Location ID to be informed in the collection item creation.
      pattern: '[a-zA-Z0-9]{1,35}'
    DevolucaoNatureza:
      type: string
      title: Natureza da Devolução
      description: >
        Indicates the nature of the return. A return can be related to a regular
        Pix, or to a Withdrawal/Change Pix. In the absence of this field the
        nature must be interpreted as being of a common Pix (ORIGINAL).


        Natures are defined as follows:

        - `ORIGINAL`: when the return refers to a common Pix or the purchase
        amount in a Pix Troca;

        - `RETIRADA`: when the return refers to a Cash Out Pix or the amount of
        change in a Pix Change.

        - `MED_OPERACIONAL`: when the return occurs within the MED due to
        operational failure and refers to a common Pix (`BE08`);

        - `MED_FRAUDE`: when the return occurs within the MED on grounds of
        suspected fraud and refers to a common Pix (`FR01`).
      enum:
        - ORIGINAL
        - RETIRADA
        - MED_OPERACIONAL
        - MED_FRAUDE
    Revisao:
      type: integer
      format: int32
      title: Revisão
      description: >-
        Denotes the collection review version. Always starts at zero. Always
        increments 1.

        This should increase whenever a collection item is updated. The `loc`
        field change is not considered an update and therefore does not trigger
        an increment to the version number.

        The `loc` field does not change the collection itself. It is not
        necessary to store the history of changes in the `loc` field for a given
        collection. For the other fields of the collection, history is recorded.
    PessoaFisica:
      type: object
      required:
        - cpf
        - nome
