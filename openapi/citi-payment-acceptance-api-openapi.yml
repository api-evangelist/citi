        creation_date_time:
          type: string
          format: date-time
          description: "GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) \n- Instant Payment (Credit) - Date time, either provided by the debtor bank or generated by Citi's transaction processing application, when a transaction was created \n- For US RFP this parameter is mandatory \n- For US ACH Direct Debit, this parameter is mandatory \n- For Brazil PIX, this parameter is mandatory"
          example: '2022-09-13T08:23:49.114Z'
          title: creation_date_time
        additional_info:
          maxLength: 140
          minLength: 1
