                    Whether the bank is a part of the scheme (reachable) or not 
                    - Y - Bank is reachable 
                     - N - Bank is not reachable/not checked
                  enum:
                    - 'Y'
                    - 'N'
                  title: is_reachable
                is_available:
                  type: string
                  description: |-
                    Whether the bank is a current online (available) or not 
                    - Y - Bank is available 
                     - N - Bank is not available/ not checked
                  enum:
                    - 'Y'
                    - 'N'
                  title: is_available
                reachability_data_type:
                  type: string
                  default: HR
                  description: >-
                    Validation based on historic or real time data 

                    - HR - Validation based on Historic Data in case there is no
                    real time data 
                     - RT - Validation based on real time data and data source is present 
                    - ERROR - Erroneous issue 
                  enum:
                    - HR
                    - RT
                    - ERROR
                  title: reachability_data_type
                availability_data_type:
                  type: string
                  default: RT
                  description: >-
                    Validation based on historic or real time data 

                    - HR - Validation based on Historic Data in case there is no
                    real time data 
                     - RT - Validation based on real time data and data source is present 
                    - ERROR - Erroneous issue 
                  enum:
                    - HR
                    - RT
                    - ERROR
                  title: availability_data_type
            card:
              type: object
              title: card_status
              properties:
                number_validation:
                  type: string
                  description: |-
                    Card number validation result
                     - For UK bank availability/reachability, this parameter is not applicable  
                     - For US EWS, this parameter is not applicable 
                     - For UK, this parameter is not applicable 
                     - For IN PAN, this parameter is not applicable  
                    - MATCH - Validation based on card number is a match 
                     - MISMATCH - Validation based on card number is a mismatch 
                    - NA - Validation is not applicable 
                     - For SEPA VoP, this parameter is not applicable 
                     - For Global Mastercard validations, this parameter is mandatory
                  enum:
                    - MATCH
                    - MISMATCH
                    - NA
                  title: number_validation
                receiving_eligibility:
                  type: string
                  description: >-
                    Whether the Creditor Mastercard is eligible to received
                    funds before initiating the payment  

                    - Y - The creditor Mastercard is eligible to receive the
                    payment 
                     - N - The creditor Mastercard is not eligible to receive the payment 
                     - For UK bank availability/reachability, this parameter is not applicable 
                     - For US EWS, this parameter is not applicable 
                     - For UK, this parameter is not applicable 
                     - For IN PAN, this parameter is not applicable 
                     - For Global Mastercard Validation this parameter is Mandatory with enum Y/N 
                     - For SEPA VoP, this parameter is not applicable
                  enum:
                    - 'Y'
                    - 'N'
                  title: receiving_eligibility
