    Authentication-Transaction-Request:
      title: Transaction
      required:
        - id
      properties:
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
        id:
          description: >-
            Unique Transaction identification provided by the merchant during 
            transaction creation
          example: pay02052023456r
          maxLength: 128
          minLength: 1
          type: string
          title: id
    Authentication-Transaction-Response:
      title: Transaction
      required:
        - id
        - amount
        - status
        - description
      properties:
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
        id:
          description: >-
            Unique Transaction identification provided by the merchant during 
            transaction creation
          example: pay02052023456r
          maxLength: 128
          minLength: 1
          type: string
          title: id
        creation_date_time:
          type: string
          format: date-time
          readOnly: true
          description: Date and time at which request was received in UTC timezone
          example: '2022-09-13T08:23:49.114Z'
          title: creation_date_time
        update_time:
          type: string
          format: date-time
          readOnly: true
          description: Date and time at which request was received in UTC timezone
          example: '2022-09-13T08:23:49.114Z'
          title: update_time
        amount:
          description: Transaction amount
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        gateway_recommendation:
          description: >-
            Provides a recommendation for your next action based on the outcome
            of the transaction.
          enum:
            - DO_NOT_PROCEED
            - DO_NOT_PROCEED_ABANDON_ORDER
            - PROCEED
            - RESUBMIT_WITH_ALTERNATIVE_PAYMENT_DETAILS
          example: DO_NOT_PROCEED
          type: string
          title: gateway_recommendation
        status:
          type: string
          enum:
            - FAILED
            - PENDING
            - SUCCESS
            - UNKNOWN
          description: >-
            A system-generated high level overall result of the
            transaction/operation.Value must be a member of the following list.
            The values are case sensitive.
          title: status
        description:
          description: Transaction status description
          example: ABORTED
          maxLength: 250
          minLength: 1
          type: string
          title: description
        authentication_status:
          description: Indicates the result of payer authentication.
          enum:
            - AUTHENTICATION_ATTEMPTED
            - AUTHENTICATION_AVAILABLE
            - AUTHENTICATION_EXEMPT
            - AUTHENTICATION_FAILED
            - AUTHENTICATION_NOT_IN_EFFECT
            - AUTHENTICATION_NOT_SUPPORTED
            - AUTHENTICATION_PENDING
            - AUTHENTICATION_REJECTED
            - AUTHENTICATION_REQUIRED
            - AUTHENTICATION_SUCCESSFUL
            - AUTHENTICATION_UNAVAILABLE
          example: AUTHENTICATION_REQUIRED
          type: string
          title: authentication_status
        currency_code:
          description: ISO 4217 Currency Code for instance USD/GBP/EUR
          enum:
            - USD
          example: USD
          type: string
          title: currency_code
        type:
          description: Indicates the result of payer authentication.
          enum:
            - AUTHENTICATION
            - AUTHORIZATION
            - AUTHORIZATION_UPDATE
            - CAPTURE
            - CHARGEBACK
            - DISBURSEMENT
            - FUNDING
            - PAYMENT
            - REFUND
            - REFUND_REQUEST
            - VERIFICATION
            - VOID_AUTHORIZATION
            - VOID_CAPTURE
            - VOID_PAYMENT
            - VOID_REFUND
          example: VOID_REFUND
          type: string
          title: type
    Transaction:
      title: Transaction
      required:
        - id
        - currency_code
        - country_code
      properties:
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
        url:
          $ref: '#/components/schemas/Url'
        amount:
          description: >-
            Transaction amount 
             - For Brazil QR Creation decimal values are mandatory for transaction.amount and it must have 2 digits 
             - For Brazil QR Creation maxmium amount limit is 9999999999.99 and transaction.amount parameter is mandatory 
            - For CARD Capture operation transaction.amount parameter is
            mandatory, maxmium amount limit is 50000.00 and allowed max 2
            decimal after dot. 
             - For UK PAYBYBANK Creation transaction.amount parameter is mandatory, maxmium amount limit is 1000000.00 and allowed max 2 decimal after dot. 
            - For US RFP, this parameter is mandatory with maximum amount limit
            1000000.00 

            - For ACH verify transaction, transaction.amount parameter is
            mandatory. 

            - For US ACH Direct Debit, transaction.amount parameter is mandatory
            with max 18 digits and 2 decimals. 

            - For Brazil PIX Initiation, this is mandatory parameter with max 18
            digits & 2 decimals 
             - For India Card Capture transaction, transaction.amount parameter is mandatory, minimum amount is 1 and maxmium amount limit is 1000000
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        currency_code:
          description: >-
            ISO 4217 Currency Code for instance USD/GBP/EUR 

            - transaction.currency_code parameter is mandatory for all
            transaction type creation
          enum:
            - BRL
            - USD
            - GBP
            - INR
            - EUR
            - CAD
            - HKD
            - AUD
            - SGD
            - DKK
            - NOK
            - SEK
            - PLN
            - IDR
            - MYR
            - THB
            - CHF
            - PHP
            - CZK
          example: BRL
          type: string
          title: currency_code
        reference:
          description: >-
            Value provided by the merchant for internal tracking/referencing.  
             - For UK PAYBYBANK Creation reference parameter is optional and allowed maximum length is 128 
            - For US RFP, this parameter will contain the unique reference
            (instruction) id with max length 35 

            - For US ACH Direct Debit, transaction.reference parameter is
            mandatory with max length 10 (accepts only numbers) 

            - For Brazil PIX Initiation this parameter is optional for retry use
            case where applicable value will be transaction ID used during
            initial request
          example: REPAY
          maxLength: 250
          minLength: 1
          type: string
          title: reference
        network:
          type: string
          enum:
            - RTP
            - FDN
          description: >-
            Financial market infrastructure or clearing system (e.g., RTP
            Network in the United States)
          title: network
        source:
          description: >-
            Indicates the channel through which you received authorization for
            the payment for this order from the payer. 

            - CALL_CENTRE Transaction conducted via a call centre. 

            - CARD_PRESENT Transaction where the card is presented to the
            merchant. 

            - INTERNET Transaction conducted over the Internet. 

            - MAIL_ORDER Transaction received by mail. 

            - MERCHANT Transaction initiated by you based on an agreement with
            the payer. For example, a recurring payment, installment payment, or
            account top-up. 

            - MOTO Transaction received by mail or telephone. 

            - PAYER_PRESENT Transaction where a non-card payment method is
            presented to the Merchant. 

            - TELEPHONE_ORDER Transaction received by telephone.

            - VOICE_RESPONSE Transaction conducted by a voice/DTMF recognition
            system.
          enum:
            - CALL_CENTRE
            - CARD_PRESENT
            - INTERNET
            - MAIL_ORDER
            - MERCHANT
            - MOTO
            - PAYER_PRESENT
            - TELEPHONE_ORDER
            - VOICE_RESPONSE
          example: PAYER_PRESENT
          type: string
          title: source
        country_code:
          description: >-
            The order country 

            - transaction.country_code parameter is mandatory for all
            transaction type creation
          enum:
            - US
            - BR
            - GB
            - IN
            - TH
            - AU
            - CA
            - MX
            - DE
            - NL
            - IE
            - IT
            - FR
            - ES
            - HK
            - SG
            - NZ
            - DK
            - 'NO'
            - SE
            - SW
            - BE
            - FI
            - CH
            - CZ
            - AT
            - PT
          example: US
          type: string
          title: country_code
        reason:
          description: >-
            Cancellation/adjustment reason. 

            - For Brazil PIX Initiation, this parameter is mandatory with max
            length 4 with the following allowed values: 'AGND' (First Attempt of
            Payment Schedule Request) & 'NTAG' (Scheduling of a new post-due
            payment attempt)
          example: REPAY
          maxLength: 140
          minLength: 1
          type: string
          title: reason
        auth_id:
          description: >-
            The transactionId you used for the Initiate Authentication
            operation.
          example: A123456789
          maxLength: 40
          minLength: 1
          type: string
          title: auth_id
        target_transaction_id:
          description: >-
            The identifier for the transaction you wish to refund, That is the
            {transactionId} URL parameter for REST and the transaction.id
            parameter for NVP.
          example: T123456789
          maxLength: 40
          minLength: 1
          type: string
          title: target_transaction_id
        correlation_id:
          description: >-
            A transient identifier for the request, that can be used to match
            the response to the request.
          example: '123456789'
          maxLength: 100
          minLength: 1
          type: string
          title: correlation_id
        preferred_language:
          description: >-
            The language that you prefer the payment provider to use for pages
            displayed to the payer.
          example: '123456789'
          maxLength: 35
          minLength: 2
          type: string
          title: preferred_language
        expiry_time:
          description: Expiration time for QR collection, specified in seconds.
          example: 3600
          format: int32
          minimum: 10
          type: integer
          title: expiry_time
        qr_image:
          description: >-
            Merchant to confirm QR Image is required or not, If required value
            should be Y.
          enum:
            - 'Y'
            - 'N'
          example: 'Y'
          type: string
          title: qr_image
        id:
          description: >-
            Unique Transaction identification provided by the merchant during 
            transaction creation 

            - For Brazil QR Creation transaction.id parameter should be of
            length between 26 to 35 and allowed datatype is Alphanumeric and
            should not be filled with spaces or zeroes 

            - For CARD operations transaction.id parameter allowed maxmium
            length is 40. 

            - For UK PAYBYBANK creation transaction.id parameter allowed maxmium
            length is 18 and allowed characters are alphabets, numbers and
            space 

            - For US RFP this parameter is mandatory with max length 35 

            - For ACH transaction transaction.id parameter is mandatory with
            allowed maxmium length is 40. 

            - For US ACH Direct Debit, this parameter is mandatory with
            maxLength 16. 

            - For Brazil PIX Initiation, this parameter is mandatory with min
            length 26 & max length 35 of alphanumeric characters 

            - For India CARD transaction, transaction.id parameter allowed
            maxmium length is 50.
          example: pay02052023456r
          maxLength: 128
          minLength: 1
          type: string
          title: id
        value_date:
          type: string
          format: date
          description: |-
            Value Date Format is YYYY-MM-DD. 
            - For US RFP this parameter is mandatory 
            - For US ACH Direct Debit, this parameter is mandatory
          title: value_date
        expiry_date:
          type: string
          format: date
          description: |-
            Expiry Date Format is YYYY-MM-DD 
            - For US RFP this parameter is mandatory
          title: expiry_date
        update_flag:
          description: >-
            Indicator if the exact amount indicated in amount must be paid, or
            if under/over payment is permitted.

            - For QR Creation (ex. Brazil), during transaction processing if the
            merchant want to allow his client to change QR Amount then the value
            should be Y otherwise default value will be N 

            - For US RFP, if Y then Amount may be modified by the customer, if N
            then Amount of payment must equal the Instructed Amount. If no value
            passed, default behavior is same as Y
          enum:
            - 'Y'
            - 'N'
          example: 'Y'
          type: string
          title: update_flag
        full_amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000000
          description: |-
            Amount that is the gross amount payable by client 
            - For US RFP transaction, this parameter is optional
          title: full_amount
        discount_amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000000
          description: >-
            Amount that is the discount from the gross amount 

            - for US RFP. If populated, message.transaction.full_amount must
            also be populated.
          title: discount_amount
        creation_date_time:
          type: string
          format: date-time
          readOnly: true
          description: |-
            Date and time at which request was received in UTC timezone 
            - This parameter is mandatory for Brazil PIX Initiation.
          example: '2022-09-13T08:23:49.114Z'
          title: creation_date_time
        purpose:
          $ref: '#/components/schemas/Purpose'
        remittance_info:
          type: array
          description: >-
            Unstructured remittance information 
             - For US RFP, transaction.remittance_info parameter is optional and only one(1) line of 140 characters is allowed 
            - For Brazil PIX Initiation this parameter is optional and only
            one(1) line of 140 characters is allowed
          items:
            $ref: '#/components/schemas/Unstructured'
          title: remittance_info
        constraints:
          $ref: '#/components/schemas/Constraints'
        acquirer:
          $ref: '#/components/schemas/Acquirer'
        transit:
          $ref: '#/components/schemas/Transit'
        product_info:
          type: array
          items:
            $ref: '#/components/schemas/Product-Info'
        holiday_flag:
          description: Specifies if a request should consider holiday
          type: boolean
          example: true
          title: holiday_flag
      type: object
    Order:
      title: Order
      properties:
        id:
          description: >-
            A unique identifier for this order to distinguish it from any other
            order you create. 

            - For CARD Authorize,Capture,Pay and Verify operation order.id
            parameter is mandatory 

            - For ACH Pay and Verify transaction order.id parameter is
            mandatory 
             - For India Card Capture transaction, order.id parameter is mandatory
          example: OR123456789
          maxLength: 50
          minLength: 1
          type: string
          title: id
        amount:
          description: >-
            The total amount for the order.  This is the net amount plus any
            merchant charge amounts.If you provide any sub-total amounts, then
            the sum of these amounts (order.itemAmount, order.taxAmount,
            order.shippingAndHandlingAmount, order.cashbackAmount,
            order.gratuityAmount, order.merchantCharge.amount and
            order.dutyAmount), minus the order.discountAmount must equal the net
            amount.The value of this parameter in the response is zero if payer
            funds are not transferred. /n- For CARD Operations post decimal
            allowed maxmium 3 digits /n- For CARD Authorize, PAY and VERIFY
            Operations order.amount parameter is mandatory 

            - For ACH Pay and Verify transaction order.amount parameter is
            mandatory /n- For India CARD transaction, order.amount parameter is
            mandatory, minimum amount is 1 and maxmium amount limit is 1000000 
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        currency_code:
          description: >-
            The currency of the order expressed as an ISO 4217 alpha code, e.g.
            USD. 

            - For CARD Authorize operation order.currency_code parameter is
            mandatory 

            - For CARD Capture operation order.currency_code parameter is
            mandatory 

            - For CARD Pay operation order.currency_code parameter is mandatory 

            - For CARD Verify operation order.currency_code parameter is
            mandatory 

            - For BOLETO Pay operation order.currency_code parameter is
            mandatory 

            - For ALIPAY Pay operation order.currency_code parameter is
            mandatory 

            - For ACH Pay operation order.currency_code parameter is mandatory 

            - For ACH Verify operation order.currency_code parameter is
            mandatory 

            - For ACH Pay and Verify transaction order.currency_code parameter
            is mandatory /n- For India CARD transaction, order.currency_code
            parameter is mandatory
          enum:
            - BRL
            - USD
            - GBP
            - INR
            - EUR
            - CAD
            - HKD
            - AUD
            - SGD
            - DKK
            - NOK
            - SEK
            - PLN
            - IDR
            - MYR
            - THB
            - CHF
            - PHP
            - CZK
          example: USD
          type: string
          title: currency_code
        charge_amount:
          description: The amount of the additional fee that you are charging the payer.
          example: '20.0'
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: charge_amount
        charge_type:
          description: The type of the additional fee that you are charging the payer.
          enum:
            - SURCHARGE
          example: SURCHARGE
          type: string
          title: charge_type
        item_amount:
          description: The total item amount for the order.
          example: 150
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: item_amount
        shipping_and_handling_amount:
          description: >-
            The total shipping and handling amount for the order, including
            taxes on the shipping and/or handling
          example: 20
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: shipping_and_handling_amount
        shipping_and_handling_tax_amount:
          description: >-
            The tax amount levied on the shipping and handling amount for the
            order.
          example: 20
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: shipping_and_handling_tax_amount
        shipping_and_handling_tax_rate:
          description: >-
            The tax rate applied to the shipping and handling amount for the
            order to determine the shipping and handling tax amount.
          example: 20
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: shipping_and_handling_tax_rate
        discount_amount:
          description: The total amount of the discount you have applied to the order
          example: 300
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: discount_amount
        tax_registration_id:
          description: >-
            Your tax registration identifier provided by the Federal/National
            tax authority (for example, federal tax identification number,
            ABN).If you are a Canadian merchant, use this parameter to provide
            your Tax Registration ID for paying Harmonized Sales Tax (HST) or
            Goods and Services Tax (GST) collected by the Canada Revenue Agency.
          example: 300
          maxLength: 30
          minLength: 1
          type: string
          title: tax_registration_id
        mcc:
          description: >-
            A 4-digit code used to classify your business by the type of goods
            or services it offers. This is also known as the Merchant Category
            Code (MCC).You only need to provide the MCC if you want to override
            the default value configured for your acquirer link. The value you
            provide must match one of those configured by your payment service
            provider.
          example: '7788'
          maxLength: 4
          minLength: 4
          type: string
          title: mcc
        certainty:
          description: >-
            Indicates if you expect to capture the full order amount for which
            you are requesting authorization.If you do not provide a value for
            order.certainty the default configured for you by your payment
            service provider will be used. The value provided in the response
            shows the value the gateway sent to the acquirer.
          enum:
            - ESTIMATED
            - FINAL
          example: FINAL
          type: string
          title: certainty
        date:
          description: The date the payer placed the order.
          example: '1988-02-15'
          format: date
          type: string
          title: date
        description:
          description: Short textual description of the contents of the order.
          example: LAPTOP PURCHASE
          maxLength: 127
          minLength: 1
          type: string
          title: description
        discount_code:
          description: The code you use to identify the reason for the discount.
          example: DISC001
          maxLength: 40
          minLength: 1
          type: string
          title: discount_code
        discount_description:
          description: A description of your reason for the discount.
          example: CARD DISCOUNT
          maxLength: 127
          minLength: 1
          type: string
          title: discount_description
        duty_amount:
          description: >-
            The duty amount (also known as customs tax, tariff or dues) for the
            order. /n- For CARD Operations post decimal allowed maxmium 3 digits
          example: 150
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: duty_amount
        entity:
          description: >-
            Your identifier for the part of your organization that is
            responsible for the order.You might provide this data when you want
            to track the accountability for the order. For example, store
            number, sales region, branch, or profit center.
          example: INDENTITY1
          maxLength: 40
          minLength: 1
          type: string
          title: entity
        purchase_type:
          description: >-
            Indicates the purchase of specific types of goods or services You
            must provide a value if your Merchant Category Code (MCC) is one of
            the following: 6051 (Quasi Cash – Merchant or Non-Financial
            Institutions – Foreign Currency, Non-Fiat Currency) and this
            transaction is for the purchase of cryptocurrency. Set the value to
            CRYPTOCURRENCY. 6211 (Securities – Brokers/Dealers) and this
            transaction is for the purchase of high-risk securities. Set the
            value to HIGH_RISK_SECURITIES. 6012 (Merchandise and
            Services—Customer Financial Institutions) or 6051 (Non-Financial
            Institutions – Foreign Currency, Non-Fiat Currency) and this
            transaction is for debt repayment. Set the value to DEBT_REPAYMENT.
            If the transaction pulls money from an account for the purpose of
            crediting another account you must set purchase type to
            ACCOUNT_FUNDING. You may set purchase type to OTHER for any other
            type of payment.
          enum:
            - ACCOUNT_FUNDING
            - CRYPTOCURRENCY
            - DEBT_REPAYMENT
            - HIGH_RISK_SECURITIES
            - OTHER
          example: ACCOUNT_FUNDING
          type: string
          title: purchase_type
        tax_amount:
          description: >-
            The total tax amount for the order. If you do not provide this value
            but provide line item data, then this amount is calculated as the
            sum of the item.quantity times the item.unitTaxAmount for all the
            line items (total tax amount).If you provide both this value and
            line item data, then the order.taxAmount MUST equal the total tax
            amount.
          example: '100.00'
          maxLength: 14
          minLength: 1
          type: string
          title: tax_amount
        number_of_captures:
          description: >-
            This parameter only applies if you intend to receive the payer's
            funds in several Capture operations. You must provide this value
            where you want the gateway to automatically reverse the outstanding
            Authorization amount you do not intend to capture. Note that this
            requires your merchant profile to be configured accordingly. Contact
            your payment service provider if you are unsure about your
            configuration.
          example: 99
          maximum: 99
          minimum: 1
          type: number
          title: number_of_captures
        retailer_location:
          description: >-
            Provide information about the location of the retailers for goods or
            services included in this order. Where a retailer is located in a
            country different from your country, they are considered a foreign
            retailer, otherwise they are considered a domestic retailer.
          enum:
            - DOMESTIC_ONLY
            - FOREIGN_AND_DOMESTIC
            - FOREIGN_ONLY
          example: FOREIGN_ONLY
          type: string
          title: retailer_location
        reward_amount:
          description: >-
            The amount that the payer has chosen to pay by redeeming reward
            points earned using a card enrolled in a rewards program for full or
            part payment for this purchase.
          example: '100'
          maxLength: 14
          minLength: 1
          type: string
          title: reward_amount
        balance_id:
          description: >-
            An identifier generated by the gateway when you have requested the
            balance available for a credit or debit card.
          example: '100'
          maxLength: 100
          minLength: 1
          type: string
          title: balance_id
        avs_action:
          description: >-
            The action to be performed for the Address Verification Service
            (AVS) Response Code.
          enum:
            - NO_ACTION
            - REJECT
            - REVIEW
          example: REVIEW
          type: string
          title: avs_action
        avs_response:
          description: >-
            The Address Verification Service (AVS) Response Code for which you
            are defining the rule.
          enum:
            - ADDRESS_MATCH
            - ADDRESS_ZIP_MATCH
            - NAME_ADDRESS_MATCH
            - NAME_MATCH
            - NAME_ZIP_MATCH
            - NOT_AVAILABLE
            - NOT_REQUESTED
            - NOT_VERIFIED
            - NO_MATCH
            - SERVICE_NOT_AVAILABLE_RETRY
            - SERVICE_NOT_SUPPORTED
            - ZIP_MATCH
          example: ADDRESS_MATCH
          type: string
          title: avs_response
        reference:
          description: >-
            An optional identifier for the order For example, a shopping cart
            number, an order number, or an invoice number.
          example: CART123456
          maxLength: 200
          minLength: 1
          type: string
          title: reference
        invoice_number:
          description: The invoice number you issued for this order
          example: INV123456
          maxLength: 25
          minLength: 1
          type: string
          title: invoice_number
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
      type: object
