                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        DbtrAgtAcct:
          type: object
          description: >-
            Identification of the account of the debtor agent at its servicing
            agent in the payment chain.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        CdtrAgt:
          type: object
          description: Financial institution servicing an account for the creditor.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        CdtrAgtAcct:
          type: object
          description: >-
            Identification of the account of the creditor agent at its servicing
            agent to which a credit entry will be made as a result of the
            payment transaction.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        Cdtr:
          type: object
          description: Party to which an amount of money is due.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification32'
        CdtrAcct:
          type: object
          description: >-
            Identification of the account of the creditor to which a credit
            entry will be posted as a result of the payment transaction.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        UltmtCdtr:
          type: object
          description: Ultimate party to which an amount of money is due.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification32'
      description: >-
        Set of key elements used to identify the original transaction that is
        being referred to.
    SettlementInformation13:
      required:
        - SttlmMtd
      type: object
      properties:
        SttlmMtd:
          $ref: '#/components/schemas/SettlementMethod1Code'
        SttlmAcct:
          type: object
          description: >-
            A specific purpose account used to post debit and credit entries as
            a result of the transaction.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        InstgRmbrsmntAgtAcct:
          type: object
          description: >-
            Identification of the account of the instructing reimbursement agent
            account at its servicing agent in the payment chain.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        InstdRmbrsmntAgtAcct:
          type: object
          description: >-
            Identification of the account of the instructed reimbursement agent
            account at its servicing agent in the payment chain.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        ThrdRmbrsmntAgtAcct:
          type: object
          description: >-
            Identification of the account of the third reimbursement agent
            account at its servicing agent in the payment chain.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        InstgRmbrsmntAgt:
          type: object
          description: >-
            Agent through which the instructing agent will reimburse the
            instructed agent.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        InstdRmbrsmntAgt:
          type: object
          description: Agent at which the instructed agent will be reimbursed.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        ThrdRmbrsmntAgt:
          type: object
          description: Agent at which the instructed agent will be reimbursed.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        ClrSys:
          $ref: '#/components/schemas/ClearingSystemIdentification3Choice'
      description: >-
        Specifies the details on how the settlement of the original
        transaction(s) between the instructing agent and the instructed agent
        was completed.
    SettlementMethod1Code:
      type: string
      description: >-
        Method used to settle the (batch of) payment instructions.
        <br><br><b>INDA</b> : Settlement is done by the agent instructed to
        execute a payment instruction. <br><br><b>INGA</b> : Settlement is done
        by the agent instructing and forwarding the payment to the next party in
        the payment chain. <br><br><b>COVE</b> : Settlement is done through a
        cover payment. <br><br><b>CLRG</b> : Settlement is done through a
        payment clearing system.
      enum:
        - INDA
        - INGA
        - COVE
        - CLRG
    PaymentTypeInformation22:
      type: object
      properties:
        InstrPrty:
          $ref: '#/components/schemas/Priority2Code'
        ClrChanl:
          type: string
          description: >-
            Specifies the clearing channel to be used to process the payment
            instruction.<br><br><b>RTGS</b> : Clearing channel is a real-time
            gross settlement system. <br><br><b>RTNS</b> : Clearing channel is a
            real-time net settlement system. <br><br><b>MPNS</b> : Clearing
            channel is a mass payment net settlement system. <br><br><b>BOOK</b>
            : Payment through internal book transfer.
          enum:
            - RTGS
            - RTNS
            - MPNS
            - BOOK
        SvcLvl:
          $ref: '#/components/schemas/ServiceLevel8Choice'
        LclInstrm:
          $ref: '#/components/schemas/LocalInstrument2Choice'
        SeqTp:
          type: string
          description: >-
            Identifies the direct debit sequence, such as first, recurrent,
            final or one-off.<br><br><b>FRST</b> : First collection of a series
            of direct debit instructions. <br><br><b>RCUR</b> : Direct debit
            instruction where the debtor's authorisation is used for regular
            direct debit transactions initiated by the creditor.
            <br><br><b>FNAL</b> : Final collection of a series of direct debit
            instructions. <br><br><b>OOFF</b> : Direct debit instruction where
            the debtor's authorisation is used to initiate one single direct
            debit transaction.
          enum:
            - FRST
            - RCUR
            - FNAL
            - OOFF
        CtgyPurp:
          $ref: '#/components/schemas/CategoryPurpose1Choice'
      description: Set of elements used to further specify the type of transaction.
    PaymentMethod4Code:
      type: string
      description: >-
        Specifies the means of payment that will be used to move the amount of
        money.<br><br><b>CHK</b> : Written order to a bank to pay a certain
        amount of money from one person to another person. <br><br><b>TRF</b> :
        Transfer of an amount of money in the books of the account servicer.
        <br><br><b>DD</b> : Collection of an amount of money from the debtor's
        bank account by the creditor. The amount of money and dates of
        collections may vary. <br><br><b>TRA</b> : Transfer of an amount of
        money in the books of the account servicer. An advice should be sent
        back to the account owner.
      enum:
        - CHK
        - TRF
        - DD
        - TRA
    MandateRelatedInformation6:
      type: object
      properties:
        MndtId:
          type: object
          description: >-
            Unique identification, as assigned by the creditor, to  identify the
            mandate.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        AmdmntInd:
          type: boolean
          description: >-
            Indicator notifying whether the underlying mandate is amended or
            not.
        AmdmntInfDtls:
          $ref: '#/components/schemas/AmendmentInformationDetails6'
        ElctrncSgntr:
          maxLength: 1025
          minLength: 1
          type: string
          description: >-
            Additional security provisions, such as a digital signature, as
            provided by the debtor.
        DtOfSgntr:
          type: string
          description: >-
            Date on which the direct debit mandate has been signed by the
            debtor.
          format: date
        FrstColltnDt:
          type: string
          description: Date of the first collection of a direct debit as per the mandate.
          format: date
        FnlColltnDt:
          type: string
          description: Date of the final collection of a direct debit as per the mandate.
          format: date
        Frqcy:
          $ref: '#/components/schemas/Frequency1Code'
      description: >-
        Set of elements used to provide further details of the mandate signed
        between the creditor and the debtor.
    AmendmentInformationDetails6:
      type: object
      properties:
        OrgnlMndtId:
          type: object
          description: >-
            Unique identification, as assigned by the creditor, to  identify the
            original mandate.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        OrgnlCdtrSchmeId:
          type: object
          description: Original creditor scheme identification that has been modified.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification32'
        OrgnlDbtr:
          type: object
          description: Original debtor that has been modified.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification32'
        OrgnlDbtrAcct:
          type: object
          description: Original debtor account that has been modified.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        OrgnlDbtrAgt:
          type: object
          description: Original debtor agent that has been modified.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        OrgnlDbtrAgtAcct:
          type: object
          description: Original debtor agent account that has been modified.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        OrgnlCdtrAgt:
          type: object
          description: Original creditor agent that has been modified.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        OrgnlCdtrAgtAcct:
          type: object
          description: Original creditor agent acount that has been modified.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        OrgnlFnlColltnDt:
          type: string
          description: Original final collection date that has been modified.
          format: date
        OrgnlFrqcy:
          $ref: '#/components/schemas/Frequency1Code'
      description: List of mandate elements that have been modified.
    Frequency1Code:
      type: string
      description: >-
        Original frequency that has been modified.<br><br><b>YEAR</b> : Event
        takes place every year or once a year. <br><br><b>MNTH</b> : Event takes
        place every month or once a month. <br><br><b>QURT</b> : Event takes
        place every three months or four times a year. <br><br><b>MIAN</b> :
        Event takes place every six months or two times a
        year.<br><br><b>WEEK</b> : Event takes place once a week.
        <br><br><b>DAIL</b> : Event takes place every day. <br><br><b>ADHO</b> :
        Event takes place on request or as necessary. <br><br><b>INDA</b> :
        Event takes place several times a day.
      enum:
        - YEAR
        - MNTH
        - QURT
        - MIAN
        - WEEK
        - DAIL
        - ADHO
        - INDA
    DateAndPlaceOfBirth:
      required:
        - BirthDt
        - CityOfBirth
        - CtryOfBirth
      type: object
      properties:
        BirthDt:
          type: object
          description: Date on which a person is born.
          allOf:
            - $ref: '#/components/schemas/ISODate'
        PrvcOfBirth:
          type: object
          description: Province where a person was born.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        CityOfBirth:
          type: object
          description: City where a person was born.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        CtryOfBirth:
          type: object
          description: Country where a person was born.
          allOf:
            - $ref: '#/components/schemas/CountryCode'
      description: Date and place of birth of a person.
    DatePeriodDetails:
      required:
        - FrDt
        - ToDt
      type: object
      properties:
        FrDt:
          type: object
          description: Start date of the range.
          allOf:
            - $ref: '#/components/schemas/ISODate'
        ToDt:
          type: object
          description: End date of the range.
          allOf:
            - $ref: '#/components/schemas/ISODate'
    DocumentAdjustment1:
      required:
        - Amt
      type: object
      properties:
        AddtlInf:
          type: object
          description: Provides further details on the document adjustment.
          allOf:
            - $ref: '#/components/schemas/Max140Text'
        Amt:
          type: object
          description: Amount of money of the document adjustment.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        CdtDbtInd:
          $ref: '#/components/schemas/CreditDebitCode'
        Rsn:
          type: object
          description: Specifies the reason for the adjustment.
          allOf:
            - $ref: '#/components/schemas/Max4Text'
    DocumentType3Code:
      type: string
      description: >-
        Type of creditor reference, in a coded form.<br><br><b>RADM</b> :
        Document is a remittance advice sent separately from the current
        transaction. <br><br><b>RPIN</b> : Document is a linked payment
        instruction to which the current payment instruction is related, for
        example, in a cover scenario. <br><br><b>FXDR</b> : Document is a
        pre-agreed or pre-arranged foreign exchange transaction to which the
        payment transaction refers. <br><br><b>DISP</b> : Document is a dispatch
        advice. <br><br><b>PUOR</b> : Document is a purchase order
        <br><br><b>SCOR</b> : Document is a structured communication reference
        provided by the creditor to identify the referred transaction.
      enum:
        - RADM
        - RPIN
        - FXDR
        - DISP
        - PUOR
        - SCOR
    DocumentType5Code:
      type: string
      description: >-
        Document type in a coded form.<br><br><b>MSIN</b> : Document is an
        invoice claiming payment for the supply of metered services, for example
        gas or electricity supplied to a fixed meter. <br><br><b>CNFA</b> :
        Document is a credit note for the final amount settled for a commercial
        transaction. <br><br><b>DNFA</b> : Document is a debit note for the
        final amount settled for a commercial transaction. <br><br><b>CINV</b>
        :   Document is an invoice. <br><br><b>CREN</b> : Document is a credit
        note. <br><br><b>DEBN</b> : Document is a debit note.
        <br><br><b>HIRI</b> : Document is an invoice for the hiring of human
        resources or renting goods or equipment. <br><br><b>SBIN</b> : Document
        is an invoice issued by the debtor. <br><br><b>SVGS</b> : Account used
        for savings. <br><br><b>CMCN</b> : Document is an agreement between the
        parties, stipulating the terms and conditions of the delivery of goods
        or services. <br><br><b>SOAC</b> : Document is a statement of the
        transactions posted to the debtor's account at the supplier.
        <br><br><b>DISP</b> : Document is a dispatch advice. <br><br><b>BOLD</b>
        : Document is a shipping notice. <br><br><b>VCHR</b> : Document is an
        electronic payment document. <br><br><b>AROI</b> : Document is a payment
        that applies to a specific source document. <br><br><b>TSUT</b> :
        Document is a transaction identifier as assigned by the Trade Services
        Utility.
      enum:
        - MSIN
        - CNFA
        - DNFA
        - CINV
        - CREN
        - DEBN
        - HIRI
        - SBIN
        - CMCN
        - SOAC
        - DISP
        - BOLD
        - VCHR
        - AROI
        - TSUT
    EquivalentAmount2:
      required:
        - Amt
        - CcyOfTrf
      type: object
      properties:
        Amt:
          type: object
          description: >-
            Amount of money to be moved between debtor and creditor, before
            deduction of charges, expressed in the currency of the debtor's
            account, and to be moved in a different currency.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        CcyOfTrf:
          type: object
          description: >-
            Specifies the currency of the to be transferred amount, which is
            different from the currency of the debtor's account.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
      description: >-
        Amount of money to be moved between the debtor and creditor, expressed
        in the currency of the debtor's account, and the currency in which the
        amount is to be moved.
    ExchangeRateInformation1:
      type: object
      properties:
        CtrctId:
          type: object
          description: >-
            Unique reference to the foreign exchange contract agreed between the
            initiating party/creditor and the debtor agent. \n - For Pay2China,
            this field is optional and can be populated with FX Contract ID. 
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        XchgRate:
          $ref: '#/components/schemas/BaseOneRate'
        RateTp:
          type: string
          description: >-
            Specifies the type used to complete the currency exchange.
            <br><br><b>SPOT</b> : Exchange rate applied is the spot rate.
            <br><br><b>SALE</b> : Exchange rate applied is the market rate at
            the time of the sale. <br><br><b>AGRD</b> : Exchange rate applied is
            the rate agreed between the parties.
          enum:
            - SPOT
            - SALE
            - AGRD
      description: >-
        Set of elements used to provide details on the currency exchange rate
        and contract.
    FinancialIdentificationSchemeName1Choice:
      required:
        - Cd
        - Prtry
      type: object
      properties:
        Cd:
          maxLength: 4
          minLength: 1
          type: string
          description: >-
            Name of the identification scheme, in a coded form as published in
            an external list.
        Prtry:
          type: object
          description: Name of the identification scheme, in a free text form.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
      description: >-
        Name of the identification scheme. Either Code or Proprietary parameter
        value should be passed on request.
    FinancialInstitutionIdentification7:
      type: object
      properties:
        BIC:
          pattern: '[A-Z]{6,6}[A-Z2-9][A-NP-Z0-9]([A-Z0-9]{3,3}){0,1}'
          type: string
          description: >-
            Code allocated to a financial institution by the ISO 9362
            Registration Authority as described in ISO 9362 "Banking - Banking
            telecommunication messages - Business identifier code (BIC)". \n -
            For Pay2China, this field must be populated as 'CITICNSX'.
        ClrSysMmbId:
          $ref: '#/components/schemas/ClearingSystemMemberIdentification2'
        Nm:
          type: object
          description: >-
            Name by which an agent is known and which is usually used to
            identify that agent. \n - For Pay2China, this field must accept up
            to 128 English or 42 Chinese characters.
          allOf:
            - $ref: '#/components/schemas/Max140Text'
        Othr:
          $ref: '#/components/schemas/GenericFinancialIdentification1'
        PstlAdr:
          $ref: '#/components/schemas/PostalAddress6'
      description: >-
        Unique identification of a financial institution, as assigned under an
        internationally recognized or proprietary identification scheme.
    GenericAccountIdentification1:
      required:
        - Id
      type: object
      properties:
        Id:
          type: object
          description: Identification assigned by an institution.
          allOf:
            - $ref: '#/components/schemas/Max34Text'
        Issr:
          type: object
          description: Entity that assigns the identification.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        SchmeNm:
          type: object
          description: Name of the identification scheme.
          allOf:
            - $ref: '#/components/schemas/FinancialIdentificationSchemeName1Choice'
      description: >-
        Unique identification of an account, as assigned by the account
        servicer, using an identification scheme.
    GenericFinancialIdentification1:
      required:
        - Id
      type: object
      properties:
        Id:
          type: object
          description: Unique identification of a person.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        Issr:
          type: object
          description: Entity that assigns the identification.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        SchmeNm:
          $ref: '#/components/schemas/FinancialIdentificationSchemeName1Choice'
      description: >-
        Unique identification of an agent, as assigned by an institution, using
        an identification scheme.
    GenericOrganisationIdentification1:
      required:
        - Id
      type: object
      properties:
        Id:
          type: object
          description: >-
            Identification assigned by an institution. \n - For Pay2China, this
            field must be populated with Merchant Num code.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        SchmeNm:
          type: object
          description: Name of the identification scheme.
          allOf:
            - $ref: '#/components/schemas/IdentificationSchemeName1Choice'
        Issr:
          type: object
          description: Entity that assigns the identification.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
    GenericPersonIdentification1:
      required:
        - Id
      type: object
      properties:
        Id:
          type: object
          description: Unique identification of a person.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        SchmeNm:
          type: object
          description: Name of the identification scheme.
          allOf:
            - $ref: '#/components/schemas/IdentificationSchemeName1Choice'
        Issr:
          type: object
          description: Entity that assigns the identification.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
      description: >-
        Unique identification of a person, as assigned by an institution, using
        an identification scheme.
    GroupHeader32:
      required:
        - CreDtTm
        - InitgPty
        - MsgId
        - NbOfTxs
      type: object
      properties:
        CtrlSum:
          maxLength: 18
          type: string
          description: >-
            Total of all individual amounts included in the message,
            irrespective of currencies. The number of fractional digits should
            not be more than 17. \n - For Pay2China, This field is used to
            validate the total amount of all transactions. If the amount is
            larger than 15 digits, then only the last 15 digits are validated.
        CreDtTm:
          type: string
          description: Date and time at which the message was created.
          format: date-time
        FwdgAgt:
          type: object
          description: >-
            Financial institution that receives the instruction from the
            initiating party and forwards it to the next agent in the payment
            chain for execution.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        InitgPty:
          type: object
          description: >-
            Party that initiates the payment. This can either be the debtor or
            the party that initiates the credit transfer on behalf of the
            debtor.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification32'
        MsgId:
          maxLength: 35
          minLength: 1
          type: string
          description: >-
            Message id. Point to point reference, as assigned by the instructing
            party, and sent to the next party in the chain to identify the
            message.
        NbOfTxs:
          type: object
          description: >-
            Number of individual transactions contained in the message. \n - For
            Pay2China, this field must be populated as 1.
          allOf:
            - $ref: '#/components/schemas/Max15NumericText'
        Authstn:
          maxItems: 2
          type: array
          description: >-
            User identification or any user key to be used to check whether the
            initiating party is allowed to initiate transactions from the
            account specified in the message.
          items:
            $ref: '#/components/schemas/Authorisation1Choice'
      description: >-
        Group header details. Set of characteristics shared by all individual
        transactions included in the message.
    GroupHeader36:
      required:
        - CreDtTm
        - MsgId
      type: object
      properties:
        CreDtTm:
          type: string
          description: Date and time at which the message was created.
          format: date-time
        FwdgAgt:
          type: object
          description: >-
            Financial institution that receives the instruction from the
            initiating party and forwards it to the next agent in the payment
            chain.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        DbtrAgt:
          type: object
          description: Financial institution servicing an account for the debtor.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        CdtrAgt:
          type: object
          description: Financial institution servicing an account for the creditor.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        InitgPty:
          type: object
          description: Party that initiates the status message.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification32'
        MsgId:
          maxLength: 35
          minLength: 1
          type: string
          description: >-
            Point to point reference, as assigned by the instructing party, and
            sent to the next party in the chain to identify the message.
      description: >-
        Set of characteristics shared by all individual transactions included in
        the message.
    IBAN2007Identifier:
      pattern: ^[A-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}$
      type: string
      description: >-
        >- International Bank Account Number (IBAN) - identifier used
        internationally by financial institutions to uniquely identify the
        account of a customer. Further specifications of the format and content
        of the IBAN can be found in the standard ISO 13616 Banking and related
        financial services - International Bank Account Number (IBAN) version
        1997-10-01, or later revisions.
    ISODate:
      type: string
      format: date
    Instruction3Code:
      type: string
      description: >-
        Coded information related to the processing of the payment instruction,
        provided by the initiating party, and intended for the creditor's
        agent.<br><br><b>CHQB:</b> (Ultimate) creditor must be paid by cheque.
        <br><br><b>HOLD</b>: Amount of money must be held for the (ultimate)
        creditor, who will call. Pay on identification. <br><br><b>PHOB</b>:
        Please advise/contact (ultimate) creditor/claimant by phone.
        <br><br><b>TELB</b>: Please advise/contact (ultimate) creditor/claimant
        by the most efficient means of telecommunication.
      enum:
        - CHQB
        - HOLD
        - PHOB
        - TELB
    InstructionForCreditorAgent1:
      type: object
      properties:
        Cd:
          $ref: '#/components/schemas/Instruction3Code'
        InstrInf:
          type: object
          description: >-
            Further information complementing the coded instruction or
            instruction to the creditor's agent that is bilaterally agreed or
            specific to a user community.
          allOf:
            - $ref: '#/components/schemas/Max140Text'
    LocalInstrument2Choice:
      type: object
      properties:
        Cd:
          type: object
