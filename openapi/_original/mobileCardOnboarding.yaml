      firstName:
        description: First name of the cardholder
        type: string
        format: alphabets [a-zA-Z]
        maxLength: 140
        example: Bradley
      middleName:
        description: Middle name of the cardholder
        type: string
        format: alphabets [a-zA-Z]
        maxLength: 140
        example: Justin
      lastName:
        description: Last name of the cardholder
        type: string
        format: alphabets [a-zA-Z]
        maxLength: 140
        example: Brown
      emailId:
        description: Email address of the cardholder
        type: string
        format: alphabets [a-zA-Z]
        example: abc@xyz.dom
        maxLength: 240
      mobileNumber:
