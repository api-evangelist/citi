          description: IOD Timestamp
          example: '2020-06-12 16:01:15'
        ISS_CAT_NME:
          type: string
          description: >-
            Issue Category is the description for the Issue Category Code. 
            Values include:  Common Stock (CSTK), Derivatives (DERIV), Mortgage
            Backed Securities (MBS), etc.
          example: EQUITIES
        ISS_CATG_CD:
          type: string
          description: >-
            Issue Category Code is a specific category for the security.  Values
            include: CSTK (Common Stock), DERIV (Derivatives), MBS (Mortgage
            Backed Securities), etc.
          example: EQTY
        ISS_PRC:
          type: number
          format: double
          description: Issue Price is the market price of the security at the "As Of" date.
          example: '35.811'
        ISS_TMS:
          type: string
          format: date-time
          description: Issue Date is the date of first issue of the security.
          example: '2019-11-26 00:00:00'
        ISSR_LOC_CD:
          type: string
          description: >-
            Issuer Location Code is the ISO country code where the issuer of the
            security is based. Values include: AR (Argentina), CA (Canada), IE
            (Ireland), etc.
          example: CA
        ISSR_LOC_NME:
          type: string
          description: >-
            Issuer Location is the name of the country where the issuer of the
            security is based. Values include: Argentina (AR), Canada (CA),
            Ireland (IE), etc.
          example: CANADA
        MATY_DT:
          type: string
          format: date-time
          description: >-
            Maturity Date is the date of maturity or redemption for fixed income
            securities.
          example: '2041-10-10 00:00:00'
        MKT_PRC_CUR_CD:
          type: string
          description: >-
            Market Value Currency Code is the ISO currency code of the Market
            Value.
          example: GBP
        ORGL_FCE_VAL:
          type: number
          format: double
          description: >-
            Face Value is the original face value for Mortgage Backed Securities
            in the US domestic market. For other MBS positions this will be the
            current face value after amortization.
          example: '6053'
        PFD_ID_CTXT_CD:
          type: string
          description: >-
            Security ID Type indicates the type of identifier of the
            corresponding Security ID parameter. Values include: CUSIP, ISIN,
            SEDOL, LOCAL, etc.
          example: ISIN
        PFD_ISS_ID:
          type: string
          description: >-
            Security ID is the most commonly used identifier for the security in
            a given market.
          example: BFXCMX
        PLACE_OF_SETLMT:
          type: string
          description: >-
            Place Of Settlement is the name of the settlement location for the
            security, applicable to securities positions , transactions only.
          example: MOSCOW
        PMT_FREQY:
          type: string
          description: >-
            Payment Frequency indicates how often interest is paid on the
            security.  Values include: 00001 (Annual), 00002 (Sem-Annual), 00035
            (One Payment Per Year), etc.
          example: '00001'
        PMT_FREQY_DESC:
          type: string
          description: >-
            Payment Frequency Description indicates how often interest is paid
            on the security.  Values include: Annual (00001),  Sem-Annual
            (00002), One Payment Per Year (00035), etc.
          example: Annual
        PNDNG_DELIV:
          type: number
          format: double
          description: >-
            Pending Deliverable is the sum of the quantity of outstanding
            deliver trades at the "As Of" date.
          example: '-34891'
        PNDNG_RECV:
          type: number
          format: double
          description: >-
            Pending Receivable is the sum of the quantity of outstanding receive
            trades at the "As Of" date.
          example: '353400'
        POOL_ID_CD:
          type: string
          description: >-
            Pool ID is an alphanumeric code that identifies a particular
            mortgage backed security.
          example: AB1234
        PRC_CCY_NME:
          type: string
          description: >-
            Market Value Currency is the name of the currency used to value the
            holding.
          example: POUND STERLING
        PREV_FCTR:
          type: number
          format: double
          description: >-
            The factor which applies for the previous accrual period to
            determine payments and balances for principal paying securities.
            Currently applicable to the US intraday cash transactions.
          example: '0.84824716'
        SEC_DESC:
          type: string
          description: >-
            Issue Description contains the name and other details of the
            instrument.
          example: TEMPORARY SECURITY 003263100
        SEC_GROUP:
          type: string
          description: >-
            Asset Type is a code representing the Asset Type of the security. 
            Values include: EQTY (Equity), FI (Fixed Income), etc.
          example: FI
        SEC_SECURITY_CD:
          type: string
          description: >-
            CITI Internal Security Code is the identifier of the CITI Internal
            Security Identifier.
          example: 000BMG6KT4
        SEC_SHRT_NME:
          type: string
          description: Issue Name is the Security Name of the security instrument.
          example: FR QN4224
        SEC_SUB_TYP_CD:
          type: string
          description: >-
            Issue Type Code is a code linked to the Issue Type parameter which
            describes the type of security instrument. Values include: 1 (ADR
            Convertible), 12 (Bond), 19 (Bond Convertible), etc.
          example: '12'
        SEC_SUB_TYP_NME:
          type: string
          description: >-
            Issue Type is a description of the type of the security instrument. 
            Values include: ADR Convertible (1), Bond (12) , Bond Convertible
            (19), etc.
          example: BOND
        SETL_HOLD_ST:
          type: string
          description: >-
            How Position is Held Code is a 2 digit code corresponding to the How
            Position Is Held parameter which carries the status of the holding,
            or where it is held.
          example: LE
        SETLD_QTY:
          type: number
          format: double
          description: >-
            Settled Quantity is the quantity that has settled or the quantity of
            the security that is fully settled at the "As Of" date.  For partial
            settlements the settled quantity is the portion that has settled.
          example: '165502'
        SID_CUSIP:
          type: string
          description: >-
            CUSIP (Committee on Uniform Securities Identification Procedures) It
            is a nine-character alphanumeric code that identifies a North
            American financial security for the purposes of facilitating
            clearing and settlement of trades.
          example: T5379P105
        SID_ISIN:
          type: string
          description: >-
            ISIN (International Securities Identification Number) is a
            12-character alpha-numerical code that does not contain information
            characterizing financial instruments but serves for uniform
            identification of a security at trading and settlement.
          example: JP3049040003
        SID_LOCAL:
          type: string
          description: >-
            Local ID is the Local security identifier of the associated
            security.
          example: '0059663300'
        SID_SEDOL:
          type: string
          description: >-
            SEDOL (Stock Exchange Daily Official List) is a unique
            identification code, consisting of seven alphanumeric characters,
            that is assigned to all securities trading on the London Stock
            Exchange.
          example: BJ18KB6
        SID_TICKER_SYMB:
          type: string
          description: Ticker is the symbol used on the exchange to identify the security.
          example: DARK
        ST_CD:
          type: string
          description: >-
            State Code is a 2 digit code corresponding to the State where this
            statutory deposit is placed. Applies only to US Domestic holdings.
          example: CA
        ST_NME:
          type: string
          description: >-
            State is the state where this statutory deposit is placed. Applies
            only to US Domestic holdings.
          example: CALIFORNIA
        STK_EXCHG_NME:
          type: string
          description: >-
            Nominee Description is the nominee name and/or other nominee
            information.
          example: VIDACOS NOMINEES LIMITED
        STRK_PRC_AMT:
          type: number
          format: double
          description: >-
            Strike Price is the specified price on an options contract at which
            the contract may be exercised.
          example: '109.9'
        TRDED_QTY:
          type: number
          format: double
          description: >-
            Traded Quantity is the quantity of the security held including any
            open trades.
          example: '755435'
        US_SIC_CD:
          type: string
          description: >-
            SIC is the Standard Industrial Classification four-digit numeric
            code.
          example: '3544'
        TRDED_QTY_MKT_EOD:
          type: number
          format: double
          description: >-
            Traded Quantity is the quantity of the security held including any
            open trades as of market close date
          example: '123456'
        SETLD_QTY_MKT_EOD:
          type: number
          format: double
          description: >-
            Settled Quantity is the quantity of the security that is fully
            settled as of market close date
          example: '12345'
        MKT_EOD_CL_DT:
          type: string
          format: date
          description: This is the last close date for the position in the local market.
          example: '2024-11-12'
