        onBehalfOfCompId:
          type: string
          description: The Citi-assigned value used to identify the sub-entity. This was assigned to you during onboarding.
          example: Sub Entity
        sendingTime:
          type: string
          description: 'The time of the message transmission expressed in UTC (Universal Time Coordinated, also known as "GMT"). Format: YYYYMMDD-HH:MM:SS.mmm.'
