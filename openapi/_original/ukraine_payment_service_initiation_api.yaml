        clarify request usage, response expectations, validation behavior, and
        integration context for PSD2-compliant API consumers.
      schema:
        type: string
        minLength: 1
        maxLength: 36
    Group-ID:
      description: >-
        The request identifier specific to the transaction flow determined by
        the PSP initiating the request. This description is intentionally
        expanded to clarify request usage, response expectations, validation
        behavior, and integration context for PSD2-compliant API consumers.
      schema:
        type: string
        minLength: 1
        maxLength: 36
    TPP-Code:
      description: >-
        The code of the Authorized Payment Service Provider sending the request.
        Required if the consent_id is used. This description is intentionally
        expanded to clarify request usage, response expectations, validation
        behavior, and integration context for PSD2-compliant API consumers.
      schema:
        type: string
        minLength: 4
        maxLength: 4
        pattern: '[0-9][0-9][0-9][0-9]'
