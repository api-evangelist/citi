  MaintenanceErrorMessage:
    properties:
      errorCode:
        description: which indicates the error code
        type: string
        format: alphanumeric [a-zA-Z0-9]
        example: EVB1257
      errorDescription:
        description: >-
          The error description that corresponds to error code when there is
          any  error occurred while retrieving the trsansaction.<br> * `GRC0001`
          - We have encountered an error and couldnt receive your request.
          Please try again, or contact Citi support if you have any further
          questions or comments <br>* `GRC0003` - Invalid JSON Input <br> *
          `GRC0004` - Region ID is not available in the request <br> * `GRC0005`
          - Client Tracking ID is missing in the request header <br> * `GRC0010`
          - Client Tracking ID length should contain a min of 1 character and a
          max of 36 characters. <br> * `GRC0011` - Client ID and/or Country
          and/or region id is missing in Client Onboard Configuration setup.
          Contact Citi support. <br>  * `GRC0012` - Necessary header value is
          missing <br> * `GRC0014` - We have encountered an error and couldnt
          receive your request. Please try again, or contact Citi support if you
          have any further questions or comments <br> * `GRC0016` - Country code
          is not available in the request <br> * `EVB1150` - cardHolderUserID is
          mandatory<br>* `EVB1152` cardHolderUserID must be numeric<br>*
          `EVB1151` - cardHolderUserID size must be between 1 and 200
          characters<br> * `EVB1245` - First Name is mandatory and should not be
          null or empty<br> * `EVB1246` - Last Name is mandatory and should not
          be null or empty<br> * `EVB1247` - Line 1 of address is mandatory and
          should not be null or empty<br> * `EVB1248` - City is mandatory and
          should not be null or empty<br>  * `EVB1249` - State is mandatory and
          should not be null or empty<br>  * `EVB1250` - Zip code is mandatory
          and should not be null or empty<br>   * `EVB1251` - Country is
          mandatory and should not be null or empty<br>  * `EVB1252` - Date of
          Birth is mandatory and should not be null or empty<br>   * `EVB1253` -
          Country is mandatory and should not be null or empty<br> * `EVB1254` -
          Nationality is mandatory and should not be null or empty<br>  *
          `EVB1257` - Document(s) is mandatory and should not be null or empty
          and should be one of the required documents  * `EVB1258` -
          countryOfIssuance is mandatory<br>
        type: string
        format: alphanumeric
        example: >-
          Document(s) is mandatory and should not be null or empty and should be
          one of the required documents
    required:
      - errorCode
      - errorDescription
