            parameter is mandatory 

            - For ACH Pay and Verify transaction order.id parameter is mandatory
          example: OR123456789
          maxLength: 40
          minLength: 1
          type: string
          title: id
    Mandate-Notification:
      type: object
      title: Mandate Notification
      properties:
        id:
          type: string
          maxLength: 35
          description: |-
            Unique Id assigned to identify the mandate 
            - This parameter is mandatory for Brazil PIX Credit notification.
          example: RR3347902320251109BRF12345678
          title: id
    Transaction-Notification:
      type: object
      title: Transaction Notification
      properties:
        id:
          maxLength: 128
          minLength: 1
          type: string
          description: >-
            Unique Transaction identification provided by the merchant during
            transaction creation 

            - For Brazil QR PIX , UK PAYBYBANK and US RFP transaction
            transaction.id is optional 

            - For Brazil QR Creation - Maximum length is 35. 

            - For US RFP max length is 35 

            - For US ACH Direct Debit, this parameter is mandatory with max
            length 16 

            - For Brazil PIX, this parameter is mandatory with min length 26 &
            max length 35
          example: pay02052023456r
          title: id
        uetr:
          type: string
          pattern: >-
            ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          description: >-
            UUID v4 format unique end-to-end transaction reference 

            - For India UPI,UK PAYBYBANK transaction, US RFP & Brazil PIX
            transaction.uetr is optional
          example: 4f09214d-296c-494b-8e9c-810bf1d9fc93
          title: uetr
        network_id:
          maxLength: 128
          minLength: 1
          type: string
          description: >-
            Transaction identification generated by the network (clearing) 

            - For India UPI, UK PAYBYBANK and US RFP transactions
            transaction.network_id is optional
          example: clr02052023478
          title: network_id
        network:
          type: string
          enum:
            - RTP
            - FDN
          description: >-
            Financial market infrastructure or clearing system (e.g., RTP
            Network in the United States)
          title: network
        batch_id:
          maxLength: 35
          minLength: 1
          type: string
          description: >-
            Identification for your Citi account consolidated credit posting
            including the transaction 

            - For India UPI, UK PAYBYBANK and US RFP transactions
            transaction.batch_id 

            - For US RFP max length is 35
          example: batch12345
          title: batch_id
        country_code:
          description: |-
            ISO 3166 Alpha-2 code for the transaction country 
            - For Brazil PIX, this parameter is mandatory
          type: string
          enum:
            - BR
            - IN
            - GB
            - US
            - TH
            - AU
          example: IN
          title: country_code
        reason_code:
          description: >-
            Transaction rejection Code 

            - For US ACH Direct Debit transaction.reason_code parameter is
            optional with max length 4 

            - For Brazil PIX, this parameter is mandatory
          example: SC0020
          maxLength: 100
          minLength: 1
          type: string
          title: reason_code
        value_date:
          type: string
          format: date
          description: >-
            YYYY-MM-DD Date in local time zone (e.g., EST for a United States
            RTP network transaction IST for IN IMPS) when Citi's transaction
            processing application starts processing a transaction 

            - For India UPI, UK PAYBYBANK and US RFP transactions
            transaction.value_date parameter is optional 

            - For US RFP this parameter is mandatory 

            - For US ACH Direct Debit, this parameter is mandatory 

            - For Brazil PIX this parameter is mandatory
          example: '2022-09-07'
          title: value_date
        currency_code:
          type: string
          description: >-
            ISO 4217 code for the transaction instructed amount currency 

            - For India UPI, UK PAYBYBANK and US RFP transactions
            transaction.currency_code parameter is optional 

            - For US ACH Direct Debit, this parameter is mandatory 

            - For Brazil PIX this parameter is mandatory
          enum:
            - BRL
            - INR
            - USD
            - GBP
            - THB
            - AUD
          example: INR
          title: currency_code
        remittance_info:
          type: array
          description: |-
            Unstructured remittance information 
            - For US ACH Direct Debit, this parameter is optional
          items:
            $ref: '#/components/schemas/Unstructured'
        end_to_end_id:
          maxLength: 35
          minLength: 1
          type: string
          description: >-
            Unique identification assigned by the initiating party to
            unambiguously identify the transaction. This identification is
            passed on, unchanged, throughout the entire end-to-end chain. 

            - For Brazil QR PIX, India UPI and PAYBYBANK transactions
            transaction.end_to_end_id parameter is optional 

            - 

            - For US ACH Direct Debit, this parameter is mandatory
          example: pay02052023456r
          title: end_to_end_id
        amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000000
          description: >-
            Transaction amount 
             - For Brazil QR Creation decimal values are mandatory for transaction.amount and it must have 2 digits 
             - For Brazil QR Creation maxmium amount limit is 9999999999.99 
            - For US RFP, this parameter is mandatory with maximum amount limit
            1000000.00 

            - For US ACH Direct Debit, this parameter is mandatory with 18
            digits & 2 decimals 

            - For Brazil PIX, this parameter is mandatory with 18 digits
            including 2 decimals
          example: 200
          title: amount
        tax_id:
          maxLength: 128
          minLength: 1
          type: string
          description: |-
            Merchant's payee identification (e.g., email address) 
             - For Brazil QR creation merchant.payee_id parameter is mandatory, allowed maxlength is 77
          example: 1.020.340/8910-22
          title: tax_id
        creation_date_time:
          type: string
          format: date-time
          description: >-
            GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

            - Instant Payment (Credit) - Date time, either provided by the
            debtor bank or generated by Citi's transaction processing
            application, when a transaction was created 

            - For US RFP this parameter is mandatory 

            - For US ACH Direct Debit, this parameter is mandatory 

            - For Brazil PIX, this parameter is mandatory
          example: '2022-09-13T08:23:49.114Z'
          title: creation_date_time
        additional_info:
          maxLength: 140
          minLength: 1
          type: string
          description: >-
            Additional information provided by payor 

            - For Brazil QR PIX and UK PAYBYBANK transactions
            transaction.additional_info parameter is optional
          example: Payment for Goods
          title: additional_info
        full_amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000000
          description: >-
            Amount that is the gross amount payable by client 

            - For US RFP transactions transaction.full_amount parameter is
            optional
          title: full_amount
        discount_amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000000
          description: >-
            Amount that is the discount from the gross amount 

            - For US RFP transactions transaction.discount_amount parameter is
            optional, If populated, message.transaction.full_amount must also be
            populated.
          title: discount_amount
        original_amount:
          type: number
          minimum: 0.01
          maximum: 1000000000000000000
          description: >-
            Amount that was originally sent by our client 

            - For US RFP transactions transaction.original_amount parameter is
            optional
          title: original_amount
        status:
          type: string
          enum:
            - SETTLED
            - FAILED
            - PENDING
            - POSTING_PENDING
            - CANCELLED
          description: |-
            Transaction Status 
            - Transaction settled
          title: status
        description:
          type: string
          maxLength: 1000
          description: |-
            Transaction Status Description 
            - SETTLED - Transaction settled
          example: Transaction settled
          title: description
        reference:
          description: >-
            Transaction additional information. 

            - For  India UPI transactions transaction.reference parameter is
            optional (NPCI Reference number for UPI). 

            - For US RFP, this parameter will contain the unique reference
            (instruction) id with max length 35
          example: REPAY
          maxLength: 250
          minLength: 1
          type: string
          title: reference
        status_date_time:
          format: date-time
          type: string
          description: >-
            Date & Time when Payer bank provided their response GMT (ISO 8601
            YYYY-MM-DDTHH:MM:SS.sssZ) 

            - This parameter is mandatory for Brazil PIX
          example: '2022-09-13T08:23:49.114Z'
          title: status_date_time
        settlement_date:
          type: string
          format: date
          description: The date on which transaction is settled.
          example: '2022-09-07'
          title: settlement_date
        clearing_local_code:
          maxLength: 4
          minLength: 1
          type: string
          description: Local Clearing code
          example: 008T
          title: clearing_local_code
        bill_id_1:
          description: Bill identification for a bill payment
          maxLength: 128
          minLength: 1
          pattern: ^[0-9A-Z]{1,128}$
          type: string
          example: '77889900'
          title: bill_id_1
        bill_id_2:
          description: Bill identification for a bill payment
          maxLength: 128
          minLength: 1
          pattern: ^[0-9A-Z]{1,128}$
          type: string
          example: '77889901'
          title: bill_id_2
        bill_id_3:
          description: Bill identification for a bill payment
          maxLength: 128
          minLength: 1
          pattern: ^[0-9A-Z]{1,128}$
          type: string
          example: '77889902'
          title: bill_id_3
        bill_due_date:
          description: ISO 8601 (YYYY-MM-DD) bill due date
          type: string
          format: date
          example: '2025-01-01'
          title: bill_due_date
        wht_rate:
          description: Withholding tax (WHT) rate
          type: number
          minimum: 0
          maximum: 100
          example: 10
          title: wht_rate
        wht_amount:
          description: Withholding tax (WHT) amount
          type: number
          minimum: 0.01
          maximum: 1000000000000000
          example: 1000
          title: wht_amount
        wht_code:
          description: >-
            Withholding tax (WHT) code A for WHT always paid by the seller, S
            for WHT once paid by the seller and B for WHT paid by the buyer
          type: string
          enum:
            - A
            - S
            - B
          example: A
          title: wht_code
        processing_code:
          description: Code defined by regulator to identify different kind of payments
          type: string
          minLength: 1
          maxLength: 35
          example: '550000'
          title: processing_code
        purpose:
          $ref: '#/components/schemas/Purpose'
        income_type:
          description: Income type
          type: string
          pattern: ^(00[0-9]|01[0-2])$
          example: '001'
          title: income_type
        vat_rate:
          description: Value-added tax (VAT) rate
          type: number
          minimum: 0
          maximum: 100
          example: 10
          title: wht_rate
        vat_amount:
          description: Value-added tax (VAT) amount
          type: number
          minimum: 0.01
          maximum: 1000000000000000
          example: 100
          title: vat_amount
        acceptance_date_time:
          format: date-time
          type: string
          description: >-
            Date & Time when Payee accepted the payment from clearing in GMT
            (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ)
          example: '2022-09-13T08:23:49.114Z'
          title: acceptance_date_time
        category_purpose:
          description: This field contains descriptive purpose of the payment
          type: string
          maxLength: 128
          minLength: 1
          example: payment for salary
          title: category_purpose
        charges_paid_by:
          description: Indicates who will bear charges for the payment
          type: string
          maxLength: 128
          minLength: 1
          example: SHAR
          title: charges_paid_by
        regulatory_reporting:
          type: object
          title: RegulatoryReporting
          properties:
            type:
              description: Regulatory Reporting details type
              maxLength: 35
              minLength: 1
              type: string
              example: More details here
              title: type
            code:
              description: Regulatory Reporting details code
              maxLength: 35
              minLength: 1
              type: string
              example: NOC
              title: code
        type:
          description: Indicates flow of payment
          type: string
          maxLength: 35
          minLength: 1
          example: CR
          title: type
        holiday_flag:
          description: Specifies if a request should consider holiday
          type: boolean
          example: true
          title: holiday_flag
    Order-Get-Notification:
      title: Order
      properties:
        id:
          description: >-
            A unique identifier for this order to distinguish it from any other
            order you create. 

            - For CARD Authorize, Capture, Pay and Verify operation order.id
            parameter is mandatory 

            - For ACH Pay and Verify transaction order.id parameter is mandatory
          example: OR123456789
          maxLength: 40
          minLength: 1
          type: string
          title: id
        amount:
          description: >-
            The total amount for the order 

            - For CARD Authorize operation order.amount parameter is mandatory 

            - For CARD Capture operation order.amount parameter is mandatory 

            - For CARD Pay operation order.amount parameter is mandatory 

            - For CARD Verify operation order.amount parameter is mandatory and
            allowed maximum amount is 2 

            - For ACH PAY and Verify transaction, order.amount parameter is
            mandatory
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: amount
        creation_date_time:
          type: string
          format: date-time
          description: >-
            GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

            - Instant Payment (Debit) - Date time, generated by CitiConnect API,
            when CitiConnect API accepted a payment initiation after validation 

            - Instant Payment (Credit) - Date time, either provided by the
            debtor bank or generated by Citi's transaction processing
            application, when a transaction was created 

            - For ACH PAY and Verify transaction, order.creation_date_time
            parameter is mandatory
          example: '2022-09-13T08:23:49.114Z'
          title: creation_date_time
        update_time:
          type: string
          format: date-time
          description: >-
            Indicates the date and time the gateway considers the order to have
            last been updated GMT (ISO 8601 YYYY-MM-DDTHH:MM:SS.sssZ) 

            - Instant Payment (Debit) - Date time, generated by CitiConnect API,
            when CitiConnect API accepted a payment initiation after validation 

            - Instant Payment (Credit) - Date time, either provided by the
            debtor bank or generated by Citi's transaction processing
            application, when a transaction was created 

            - For ACH PAY and Verify transaction, order.last_update_time
            parameter is mandatory
          example: '2022-09-13T08:23:49.114Z'
          title: update_time
        reference:
          description: >-
            An optional identifier for the orderFor example, a shopping cart
            number, an order number, or an invoice number.
          example: REPAY789541
          maxLength: 200
          minLength: 1
          type: string
          title: reference
        invoice_number:
          description: The invoice number you issued for this order
          example: INV789541
          maxLength: 25
          minLength: 1
          type: string
          title: invoice_number
        currency_code:
          description: >-
            ISO 4217 Currency Code for instance  USD/GBP/EUR 

            - order.currency_code parameter is mandatory for all transaction
            type creation
          enum:
            - BRL
            - USD
            - GBP
            - INR
            - EUR
            - CAD
            - HKD
            - AUD
            - SGD
            - DKK
            - NOK
            - SEK
            - PLN
            - IDR
            - MYR
            - THB
            - CHF
            - PHP
            - CZK
          example: BRL
          type: string
          title: currency_code
        merchant_amount:
          description: >-
            The total amount for the order in order.merchantCurrency units. 

            - For CARD Authorize operation order.merchant_amount parameter is
            mandatory 

            - For CARD Capture operation order.merchant_amount parameter is
            mandatory 

            - For CARD Pay operation order.merchant_amount parameter is
            mandatory 

            - For CARD Verify operation order.merchant_amount parameter is
            mandatory
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: merchant_amount
        merchant_currency:
          description: >2-
             The currency in which you priced your inventory for this order, expressed as an ISO 4217 alpha codeISO 4217 Currency Code for instance  USD/GBP/EUR 
            - order.merchant_currency parameter is mandatory for all transaction
            type creation
          enum:
            - BRL
            - USD
            - INR
          example: BRL
          type: string
          title: merchant_currency
        status:
          type: string
          maxLength: 30
          description: >-
            Order Status, following status you will receive in response 

            - AUTHENTICATED - The payer was successfully authenticated. 

            - AUTHENTICATION_INITIATED - Payer authentication has been initiated
            but not completed. 

            - AUTHENTICATION_NOT_NEEDED - Payer authentication was not performed
            as it was not needed. 

            - AUTHENTICATION_UNSUCCESSFUL - Payer authentication was not able to
            be successfully completed. 

            - AUTHORIZED - The payment has been authorized successfully but the
            authorized amount has not yet been captured, in part, full, or
            excess. 

            - CANCELLED - The initial transaction for this order has been voided
            successfully. 

            - CAPTURED - The authorized amount for this order, in full or
            excess, has been captured successfully. 

            - CHARGEBACK_PROCESSED - A Chargeback has been processed against
            this order. 

            - DISPUTED - The payment has been disputed and is under
            investigation. A request for information has been received or a
            chargeback is pending. 

            - EXCESSIVELY_REFUNDED - The payment has been captured in part,
            full, or excess, but the captured amount in excess has been refunded
            successfully. 

            - FAILED - The payment has not been successful. 

            - FUNDING - The order transfers money to or from the merchant,
            without the involvement of a payer. For example, recording monthly
            merchant service fees from the payment service provider. 

            - INITIATED - A browser payment that has successfully been initiated
            for this order. No payment has yet been made. 

            - PARTIALLY_CAPTURED - The authorized amount for this order, in
            part, has been captured successfully. 

            - PARTIALLY_REFUNDED - The payment has been captured in part, full,
            or excess, but the captured amount in part has been refunded
            successfully. 

            - REFUNDED - The payment has been captured in part, full, or excess,
            but the captured amount in full has been refunded successfully. 

            - REFUND_REQUESTED - A refund against captured amounts on this order
            has been requested but not executed. Requires further action to
            approve the refund. 

            - VERIFIED - The card details for this order have successfully been
            verified. No payment has yet been initiated or made. 

            - DISBURSED - The order amount has successfully been disbursed to
            the payer.
          example: AUTHENTICATED
          title: status
        total_auth_amount:
          description: >-
            The amount that has been successfully authorized for this order. 

            - For CARD Authorize operation order.total_auth_amount parameter is
            mandatory 

            - For CARD Capture operation order.total_auth_amount parameter is
            mandatory 

            - For CARD Pay operation order.total_auth_amount parameter is
            mandatory 

            - For CARD Verify operation order.total_auth_amount parameter is
            mandatory
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_auth_amount
        total_captured_amount:
          description: >-
            The amount that has been successfully captured for this order. 

            - For CARD Authorize operation order.total_captured_amount parameter
            is mandatory 

            - For CARD Capture operation order.total_captured_amount parameter
            is mandatory 

            - For CARD Pay operation order.total_captured_amount parameter is
            mandatory 

            - For CARD Verify operation order.total_captured_amount parameter is
            mandatory
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_captured_amount
        total_disbursed_amount:
          description: >-
            The amount that has been successfully captured for this order. 

            - For CARD Authorize operation order.total_disbursed_amount
            parameter is mandatory 

            - For CARD Capture operation order.total_disbursed_amount parameter
            is mandatory 

            - For CARD Pay operation order.total_disbursed_amount parameter is
            mandatory 

            - For CARD Verify operation order.total_disbursed_amount parameter
            is mandatory
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_disbursed_amount
        total_refunded_amount:
          description: >-
            The amount that has been successfully captured for this order. 

            - For CARD Authorize operation order.total_refunded_amount parameter
            is mandatory 

            - For CARD Capture operation order.total_refunded_amount parameter
            is mandatory 

            - For CARD Pay operation order.total_refunded_amount parameter is
            mandatory 

            - For CARD Verify operation order.total_refunded_amount parameter is
            mandatory
          example: 200
          maximum: 1000000000000000000
          minimum: 0.01
          type: number
          title: total_refunded_amount
        item_amount:
          description: >-
            The total item amount for the order.If you do not provide this value
            but provide line item data, then this amount is calculated as the
            sum of the item.quantity times the item.unitPrice for all the line
            items (total item amount).If you provide both this value and line
            item data, then the order.itemAmount MUST equal the total item
            amount.
          example: '100.00'
          maxLength: 14
          minLength: 1
          type: string
          title: item_amount
    Customer-Get:
      title: Customer Status
      properties:
        account:
          title: customer account
          description: Account Details
          properties:
            number:
              maxLength: 40
              minLength: 1
              type: string
              description: >-
                Customer's bank account 

                - For US RFP this parameter is mandatory with max length 40 

                - For IN UPI and UK FPS this parameter is optional 

                - For US ACH Direct Debit, this parameter is mandatory with max
                length 17 

                - For Brazil PIX, this parameter is mandatory with max length 40
              example: '1122334455'
              title: number
            phone:
              description: Customer phone.
              example: '+919962125789'
              pattern: \+[0-9]{1,3}[-\ ][0-9()+\-]{1,30}
              type: string
              title: phone
            bank_id:
              maxLength: 35
              minLength: 1
              type: string
              description: >-
                Customer bank's network identification 

                - For US RFP this parameter is mandatory with max length 16 

                - For ACH, length is equal to 9 

                - For IN UPI and UK FPS this parameter is optional 

                - For US ACH Direct Debit, this parameter is mandatory with max
                length 9 

                - For Brazil PIX, this parameter is mandatory with min & max
                length 8
              example: CITIIN77
              title: bank_id
            branch_id:
              description: Customer bank's branch id
              minLength: 1
              maxLength: 35
              type: string
              example: BR123
              title: branch_id
            bank_name:
              maxLength: 35
              minLength: 1
              type: string
              description: >-
                Customer's bank name 

                - For US ACH Direct Debit, this parameter is mandatory with max
                length 35
              example: CITI
              title: bank_name
            bank_country_code:
              type: string
              pattern: ^[A-Z]{2,2}$
              description: >-
                Country code of the bank where customer is maintaining the
                account 

                - For US ACH Direct Debit, this parameter is mandatory
              example: US
              title: bank_country_code
            name:
              maxLength: 70
              minLength: 1
              type: string
              description: |-
                Customer's Account Name 
                - FOr US RFP transaction this parameter is optional 
              title: name
            proxy_id:
              maxLength: 255
              minLength: 1
              type: string
              description: |-
                Customer's proxy identification (e.g., email address) 
                - For IN UPI transaction, this parameter is optional
              example: raja@citi.com
              title: proxy_id
            proxy_type:
              type: string
              enum:
                - BIID
                - EMAL
                - EWAL
                - MBNO
                - NIDN
              description: >-
                Customer's proxy type (BIID for bill identification, EMAL for
                email address, EWAL for electronic wallet identification, MBNO
                for mobile number and NIDN for national identification) 

                - For IN UPI this parameter is optional
              title: proxy_type
            type:
              description: |-
                Customer Source type of the transaction 
                - For IN UPI this parameter is optional 
                - For US ACH Direct Debit, this parameter is mandatory
              enum:
                - SAVINGS
                - CURRENT
                - CARD
                - OVERDRAFT
                - VIRTUAL_ACCOUNT
                - CORPORATE_CHECKING
              example: SAVINGS
              type: string
              title: type
            virtual_number:
              description: Customer's Virtual account number
              type: string
              maxLength: 140
              minLength: 1
              example: '123456789'
              title: virtual_number
            issuer:
              description: Entity that assigned account to the party
              type: string
              maxLength: 35
              minLength: 1
              example: ABC Ltd
              title: issuer
        id:
          description: Merchant internal customer ID.
          example: 1234abcjki
          maxLength: 40
          minLength: 1
          type: string
          title: id
        tax_id:
          description: >-
            Customer's payer identification (e.g., email address) 

            - For Brazil PIX, this parameter is mandatory with min length 11 &
            max length 14
          example: 234.453.678-21
          maxLength: 100
          minLength: 1
          type: string
          title: tax_id
        name:
          $ref: '#/components/schemas/Name'
        type:
          description: |-
            Customer type  
             - For Brazil QR Creation customer.type parameter is mandatory 
            - For US RFP, this parameter is optional
          enum:
            - INDIVIDUAL
            - BUSINESS
          example: BUSINESS
          type: string
          title: type
        email:
          description: |-
            Customer email 
             - For UK PAYBYBANK creation, customer.email parameter is mandatory.
          example: customer.raj2024@gmail.com
          pattern: '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$'
          type: string
          title: email
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/Additional-Info'
        address:
          $ref: '#/components/schemas/Address'
        organization_id:
          description: >-
            Customer Organization Id/ Legal Entity as provided at the time of
            payment request.

            - For US RFP max length is 20
          example: ORG123456
          maxLength: 35
          minLength: 1
          type: string
          title: organization_id
        birth_date:
          type: string
          format: date
          description: |-
            ISO 8601 (YYYY-MM-DD), Customer's birth_date  
            - This parameter is optional only for US RFP 
          title: birth_date
        birth_city:
          maxLength: 35
          minLength: 1
          type: string
          description: |-
            Customer's birth_city 
            - For US RFP  max length is 35
          title: birth_city
        birth_country:
          type: string
          description: |-
            Customer's birth_country 
            - This parameter is optional only for US RFP 
          pattern: ^[A-Z]{2,2}$
          title: birth_country
        birth_province:
          description: Customer's birth province
          type: string
          maxLength: 35
          minLength: 1
          title: birth_province
        private_id:
          description: Customer private id
          type: string
          maxLength: 35
          minLength: 1
          example: '123456789'
          title: private_id
