                    name: NumberValidation
                  type: string
                  description: "Document number validation result \n - For India IMPS,this field is not applicable \n - For India UPI,this field is not applicable \n - For US EWS,this field is not applicable \n - For UK,this field is not applicable \n - For IN PAN,this field is conditional \n - For Pay2China, this field is not applicable \n- MATCH - Validation based on document number is a match \n - MISMATCH - Validation based on document number is a mismatch \n- NA - Validation is not applicable"
                  enum:
                  - MATCH
                  - MISMATCH
                  - NA
                  title: number_validation
                name_validation:
                  xml:
                    name: NameValidation
                  type: string
                  description: "Document name validation result \n - For India IMPS,this field is not applicable \n - For India UPI,this field is not applicable \n - For US EWS,this field is not applicable \n - For UK,this field is not applicable \n - For IN PAN,this field is conditional \n - For Pay2China, this field is not applicable \n- MATCH - Validation based on document name is a match \n - MISMATCH - Validation based on document name is a mismatch \n- NA - Validation is not applicable"
                  enum:
                  - MATCH
                  - MISMATCH
                  - NA
                  title: name_validation
                father_name_validation:
                  xml:
                    name: FatherNameValidation
                  type: string
                  description: "Document father's name validation result \n - For India IMPS,this field is not applicable \n - For India UPI,this field is not applicable \n - For US EWS,this field is not applicable \n - For UK,this field is not applicable \n - For IN PAN,this field is conditional \n - For Pay2China, this field is not applicable \n- MATCH - Validation based on document father's name is a match \n - MISMATCH - Validation based on document father's name is a mismatch \n- NA - Validation is not applicable"
                  enum:
                  - MATCH
                  - MISMATCH
                  - NA
                  title: father_name_validation
                date_of_birth_validation:
                  xml:
                    name: DateOfBirthValidation
                  type: string
                  description: "Date of birth validation result \n - For India IMPS,this field is not applicable \n - For India UPI,this field is not applicable \n - For US EWS,this field is not applicable \n - For UK,this field is not applicable \n - For IN PAN,this field is conditional \n - For Pay2China, this field is not applicable \n- MATCH - Validation based on date of birth is a match \n - MISMATCH - Validation based on date of birth is a mismatch \n- NA - Validation is not applicable"
                  enum:
                  - MATCH
                  - MISMATCH
                  - NA
                  title: date_of_birth_validation
                status:
                  xml:
                    name: Status
                  type: string
                  description: "Status of the tax id document \n - For India IMPS,this field is not applicable \n - For India UPI,this field is not applicable \n - For US EWS,this field is not applicable \n - For UK,this field is not applicable \n - For IN PAN,this field is conditional \n - For Pay2China, this field is not applicable \n- E- EXISTING AND VALID \n- F - Marked as Fake \n- X - Marked as Deactivated \n- D - Deleted \n- N - Record (PAN) Not Found in ITD Database/Invalid PAN \n- EA - Existing and Valid but event marked as Amalgamation in ITD database \n- EC - Existing and Valid but event marked as Acquisition in ITD database \n- ED - Existing and Valid but event marked as Death in ITD database \n- EI - Existing and Valid but event marked as Dissolution in ITD database \n- EL - Existing and Valid but event marked as Liquidated in ITD database \n- EM - Existing and Valid but event marked as Merger in ITD database \n- EP - Existing and Valid but event marked as Partition in ITD database \n- ES - Existing and Valid but event marked as Split in ITD database \n- EU - Existing and Valid but event marked as Under Liquidation in ITD database \n- NA - Validation is not applicable"
                  enum:
                  - E
                  - F
                  - X
                  - D
                  - N
                  - EA
                  - EC
                  - ED
                  - EI
                  - EL
                  - EM
                  - EP
                  - ES
                  - EU
                  - NA
                  title: status
                seeding_status:
                  xml:
                    name: SeedingStatus
                  type: string
                  description: "Seeding status from underlying services \n - For India IMPS,this field is not applicable \n - For India UPI,this field is not applicable \n - For US EWS,this field is not applicable \n - For UK,this field is not applicable \n - For IN PAN,this field is conditional \n - For Pay2China, this field is not applicable \n- Y – Operative PAN \n- R - Inoperative PAN \n- NA -For all non-Individual PAN"
                  enum:
                  - Y
                  - R
                  - NA
                  title: seeding_status
            mxid:
              xml:
                name: MxId
              type: object
              title: mxid
              properties:
                number_validation:
                  xml:
                    name: NumberValidation
                  type: string
                  description: "Document number validation result \n - For India IMPS,this field is not applicable \n - For India UPI,this field is not applicable \n - For US EWS,this field is not applicable \n - For UK,this field is not applicable \n - For IN PAN,this field is conditional \n - For Pay2China, this field is mandatory \n- MATCH - Validation based on document number is a match \n - MISMATCH - Validation based on document number is a mismatch \n - NA - for other than MATCH/MISMATCH status from ECO"
