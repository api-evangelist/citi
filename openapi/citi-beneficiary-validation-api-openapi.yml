        method:
          xml:
            name: Method
          type: object
          title: method
          properties:
            country:
              xml:
                name: Country
              type: string
              description: ISO 3166 Alpha-2 code for the transaction country
              enum:
              - IN
              - US
              - GB
              - CN
              title: country
            method:
              xml:
                name: Method
              type: string
              description: Method specified by the debtor for the validation
              enum:
              - IMPS
              - UPI
              - BANKACCOUNT
              - IBAN
              - CARD
              - PAYMENTID
              - ID
              - MERCHANTID
              title: method
            type:
              xml:
                name: Type
              type: string
              description: "Message type (e.g., CT for credit transfer,AER for Account Enquiry Request) \n - For India,this field is mandatory and allowed value is AER \n - For US EWS,this field is mandatory \n- For UK,this field is mandatory \n- Ownership - Account ownership is limited to validation of correct owner , hence the account number or equivalent ( i.e Virtual account) and Name \n- Attributes- Attributes define the properties of the object , for an account the properties should include Status , type of account, status of account , the address of the account  etc. \n- Structure - Structure refers to the mod 97 and the length as per the country of IBAN \n- TAXID-  Validation of individual or corporate tax id/tax documentation \n - For Pay2China, this field is mandatory with the value Ownership"
              enum:
              - AER
              - Structure
              - Ownership
              - Attributes
              - TAXID
              title: type
