      properties:
        application_id:
          description: >-
            A unique identifier for the app on the payer's device (EMVCo
            fieldsdkAppID).
          example: PA123456789
          maxLength: 36
          minLength: 36
          type: string
          title: application_id
        encrypted_data:
          description: >-
            Information about the payer's device collected and encrypted by the
            SDK (EMVCo fieldsdkEncData).
          example: PA123456789
          maxLength: 646000
          minLength: 1
          type: string
          title: encrypted_data
        public_key:
          description: >-
            A public key generated by the SDK for a secure session (EMVCo
            fieldsdkEphemPubKey).
          example: PA123456789
          maxLength: 256
          minLength: 1
          type: string
          title: public_key
        device_interface:
          description: >-
            The UI formats the payer's device supports for challenges
            (EMVCosdkInterface).
          example: PA123456789
          maxLength: 256
          minLength: 1
          type: string
          title: device_interface
        reference_number:
          description: >-
            Identifier of the vendor and version of the 3DS SDK assigned by
            EMVCo (EMVCosdkReferenceNumber).
          example: PA123456789
          maxLength: 32
          minLength: 1
          type: string
          title: reference_number
        time_out:
          description: >-
            The duration (in seconds) available to the payer to authenticate
            (Default: 900, range 300-900).
          example: PA123456789
          maximum: 900
          minimum: 300
          type: number
          title: time_out
        transaction_id:
          description: >-
            A unique identifier for the app on the payer's device (EMVCo
            fieldsdkAppID).
          example: PA123456789
          maxLength: 36
          minLength: 36
          type: string
          title: transaction_id
