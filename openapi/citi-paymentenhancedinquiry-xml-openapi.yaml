openapi: 3.0.1
info:
  title: Enhanced Payment Status Inquiry
  description: >-
    CitiConnect® Payment Status Inquiry provides access to payment status and
    next steps in the payment workflow in real-time, providing increased
    visibility and control.



    ### Transaction Inquiry Parameters: `EndToEndID`, `UETR`, and
    `transaction_flow_indicator`


    When querying for specific transactions, clients can utilize either the
    `EndToEndID` or the `UETR` (Unique End-to-End Transaction Reference) as
    primary identifiers. Additionally, the `transaction_flow_indicator`
    parameter can be specified to distinguish between debit (`DR`) and credit
    (`CR`) transactions.


    ### Key Usage Guidelines


    *   **Primary Identifiers:** You should specify either `EndToEndID` or
    `UETR` to identify the transaction you are inquiring about.

    *   **Transaction Flow Indicator:** The `transaction_flow_indicator`
    parameter accepts two values:
        *   `"DR"`: To inquire about a debit transaction.
        *   `"CR"`: To inquire about a credit transaction.
    It is highly recommended to explicitly use this indicator to ensure the
    retrieval of the correct transaction type.


    ### Default Behavior (When `transaction_flow_indicator` is Omitted):


    1.  **`EndToEndID` Only:** If you provide only the `EndToEndID` and do not
    specify the `transaction_flow_indicator`, the API will, by default, filter
    for and return **debit transactions** associated with that `EndToEndID`.

    2.  **`UETR` Only:** If you provide only the `UETR` and do not specify the
    `transaction_flow_indicator`, the API will, by default, filter for and
    return **debit transactions** associated with that `UETR`.


    ### Recommendation for Unique Record Retrieval


    To guarantee the retrieval of a unique transaction record, it is strongly
    recommended to use the **`UETR` (Unique End-to-End Transaction Reference)**.
    The `EndToEndID`, while useful, may in certain circumstances be associated
    with multiple transaction records, potentially leading to duplicate results.
    Therefore, for precise and unique transaction identification, `UETR` is the
    preferred parameter.


    Additionally, to prevent ambiguity and ensure that you always retrieve the
    intended transaction type (debit or credit), always include the
    `transaction_flow_indicator` parameter with either `"DR"` or `"CR"` when
    performing a transaction inquiry.


    Download our SDKs:


    * [Python
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=python&apiTitle=all&isClientSecReq=true)

    * [Java
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=java&apiTitle=all&isClientSecReq=true)

    * [.Net
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=dotnet&apiTitle=all&isClientSecReq=true)

    * [Ruby
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=ruby&apiTitle=all&isClientSecReq=true)

    * [NodeJS
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=nodejs&apiTitle=all&isClientSecReq=true)

    * [Go
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=go&apiTitle=all&isClientSecReq=true)

    * [CLI Tool
    SDK](https://developer.citi.com/sandboxApi/admin/v1/downloadZipFile?language=ccapi-cli&apiTitle=all&isClientSecReq=true)


    Note: You must be logged in to download the SDKs.
  contact:
    name: Standards & Developer Hub
    url: https://tts.sandbox.developer.citi.com/citiconnect/
    email: developer-support@citi.com
  version: 3.0.1
servers:
  - url: https://tts.apib2b.citi.com/citiconnect/prod/paymentservices/v3
    description: production gateway URL
  - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb/paymentservices/v3
    description: sandbox URL
security:
  - clientCredentials: []
tags:
  - name: Enhanced Payment Status Inquiry
paths:
  /payment/enhancedinquiry:
    post:
      tags:
        - Enhanced Payment Status Inquiry
      summary: Payment Status Inquiry
      description: >-
        This API returns details of your transactions for both Incoming and
        Outgoing payments based on the specified parameters.<br><br><font
        size='2'><b>Content-Type</b> : Supports application/xml
      operationId: paymentStatusInquiry
      parameters:
        - name: client_id
          in: query
          description: >-
            This is your unique identifier shared during your CitiConnect API
            onboarding. This is the same `client_id` used for oauth token
            generation
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: >-
            Oauth token used to authenticate the user. This token is short
            lived, so make sure valid token used.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            This header represents the format in which the response output is
            needed. I.e. Input will be application/xml;format=PSRX03
          required: true
          schema:
            type: string
          example: application/xml;format=PSRX03
        - name: Content-type
          in: header
          description: Specify 'application/xml' as the response type.
          required: true
          schema:
            type: string
          example: application/xml
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/EnhancedRequest'
            examples:
              Inquiry-Request-Example-EndtoEndId:
                $ref: '#/components/examples/Inquiry-Request-Example-EndtoEndId'
              Inquiry-Request-Example-UETR:
                $ref: '#/components/examples/Inquiry-Request-Example-UETR'
              Inquiry-Request-Example-EndtoEndId-Transaction-Flow-Indicator:
                $ref: >-
                  #/components/examples/Inquiry-Request-Example-EndtoEndId-Transaction-Flow-Indicator
              Inquiry-Request-Example-UETR-Transaction-Flow-Indicator:
                $ref: >-
                  #/components/examples/Inquiry-Request-Example-UETR-Transaction-Flow-Indicator
      responses:
        '200':
          description: OK. successful operation response
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Document'
              examples:
                Inquiry-Response-Example:
                  $ref: '#/components/examples/Inquiry-Response-Example'
                Inquiry-Response-Return-Example:
                  $ref: '#/components/examples/Inquiry-Response-Return-Example'
        '400':
          description: Bad Request
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                error:
                  - action: >-
                      Resend request with valid Transaction flow indicator,
                      Indicator should be CR or DR.
                    issue: Invalid Transaction flow indicator
        '401':
          description: Unauthorized
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Gateway-Error-Response'
              example:
                httpCode: '401'
                httpMessage: Unauthorized
                moreInformation: >-
                  This server could not verify that you are authorized to access
                  the URL
        '404':
          description: Not Found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Gateway-Error-Response'
              example:
                httpCode: '404'
                httpMessage: Not Found
                moreInformation: No resources match requested URI
        '405':
          description: Method Not Allowed
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Gateway-Error-Response'
              example:
                httpCode: '405'
                httpMessage: Method Not Allowed
                moreInformation: The method is not allowed for the requested URL
        '415':
          description: Unsupported Media Type
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Gateway-Error-Response'
              example:
                httpCode: '415'
                httpMessage: Unsupported Media Type
                moreInformation: Unsupported Content-Type
        '429':
          description: Too Many Requests
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Gateway-Error-Response'
              example:
                httpCode: '429'
                httpMessage: Too Many Requests
                moreInformation: Rate Limit exceeded
        '500':
          description: Internal Server Error
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                error:
                  - action: Check the service of API.
                    issue: Internal Server Error
        '503':
          description: Service Unavailable
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                error:
                  - action: Please try again later/ after some time.
                    issue: Service Unavailable
        '504':
          description: Gateway Timeout
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                error:
                  - action: Look for server connectivity issues.
                    issue: Gateway timeout issue
      security:
        - clientCredentials: []
components:
  schemas:
    error_detail:
      type: object
      properties:
        action:
          maxLength: 150
          minLength: 1
          type: string
          description: correction action needs to be done
        issue:
          maxLength: 150
          minLength: 1
          type: string
          description: more details about the issue
    errors:
      type: object
      xml:
        name: Errors
      properties:
        error:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/error_detail'
    Gateway-Error-Response:
      type: object
      title: GatewayErrorResponse
      xml:
        name: errormessage
      properties:
        httpCode:
          type: string
          maxLength: 3
          description: Numeric HTTP Staus code
          title: http_code
          example: '400'
          xml:
            name: httpCode
        httpMessage:
          type: string
          maxLength: 128
          description: HTTP error message
          title: http_message
          example: Bad Request
          xml:
            name: httpMessage
        moreInformation:
          type: string
          maxLength: 128
          description: HTTP error message
          title: more_information
          example: please provide valid value for request
          xml:
            name: moreInformation
    EnhancedRequest:
      type: object
      properties:
        uetr:
          maxLength: 105
          minLength: 1
          pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          type: string
          description: >-
            Input UETR number. Unique EndtoEnd Transaction Reference
            identification assigned by the initiating party or payment
            processing bank to uniquely identify the transaction. 36 characters,
            made up to 32 hexadecimal characters, shown in five parts divided by
            hyphens/dashes as follows - xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx.
            Please provide either of uetr or end_to_end_identification.
          xml:
            name: UETR
        end_to_end_identification:
          maxLength: 35
          minLength: 1
          type: string
          description: >-
            Unique identification assigned by the initiating party to clearly
            identify the transaction. This Identification is passed on,
            unchanged, throughout the entire end-to-end chain.   Please provide
            either of uetr or end_to_end_identification.
          xml:
            name: endToEndId
        transaction_flow_indicator:
          type: string
          description: >-
            This value indicates whether the transaction is a Credit or debit
            with the values CR or DR respectively. For Debit Transaction
            inquiry, this input is not required as by default Sytem will
            consider the query to be Debit.  However for Credit Transaction
            inquiry this must be inputted as CR. Debit account number should be
            specified for outgoing transaction.Credit account number should be
            specified for incoming transaction
          xml:
            name: txnFlowInd
    Document:
      type: object
      oneOf:
        - properties:
            FIToFIPmtStsRpt:
              $ref: '#/components/schemas/FIToFIPaymentStatusReportV10'
        - properties:
            CstmrPmtStsRpt:
              $ref: '#/components/schemas/CustomerPaymentStatusReportV03'
    CustomerPaymentStatusReportV03:
      description: CustomerPaymentStatusReport (PAIN) message.
      title: CustomerPaymentStatusReport
      required:
        - GrpHdr
        - OrgnlGrpInfAndSts
      type: object
      properties:
        GrpHdr:
          $ref: '#/components/schemas/GroupHeader36'
        OrgnlGrpInfAndSts:
          $ref: '#/components/schemas/OriginalGroupInformation20'
        OrgnlPmtInfAndSts:
          type: array
          description: >-
            Information concerning the original payment information, to which
            the status report message refers.
          items:
            $ref: '#/components/schemas/OriginalPaymentInformation1'
    GroupHeader36:
      required:
        - CreDtTm
        - MsgId
      type: object
      properties:
        CreDtTm:
          type: string
          description: Date and time at which the message was created.
          format: date-time
        FwdgAgt:
          type: object
          description: >-
            Financial institution that receives the instruction from the
            initiating party and forwards it to the next agent in the payment
            chain.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        DbtrAgt:
          type: object
          description: Financial institution servicing an account for the debtor.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        CdtrAgt:
          type: object
          description: Financial institution servicing an account for the creditor.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        InitgPty:
          type: object
          description: Party that initiates the status message.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification32'
        MsgId:
          maxLength: 35
          minLength: 1
          type: string
          description: >-
            Point to point reference, as assigned by the instructing party, and
            sent to the next party in the chain to unambiguously identify the
            message.
      description: >-
        Set of characteristics shared by all individual transactions included in
        the message.
    BranchAndFinancialInstitutionIdentification4:
      required:
        - FinInstnId
      type: object
      properties:
        BrnchId:
          $ref: '#/components/schemas/BranchData2'
        FinInstnId:
          $ref: '#/components/schemas/FinancialInstitutionIdentification7'
    BranchData2:
      type: object
      properties:
        Id:
          type: object
          description: >-
            Unique and unambiguous identification of a branch of a financial
            institution.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        Nm:
          type: object
          description: >-
            Name by which an agent is known and which is usually used to
            identify that agent.
          allOf:
            - $ref: '#/components/schemas/Max140Text'
        PstlAdr:
          $ref: '#/components/schemas/PostalAddress6'
      description: Identifies a specific branch of a financial institution.
    OriginalGroupInformation20:
      required:
        - OrgnlMsgId
        - OrgnlMsgNmId
      type: object
      properties:
        OrgnlMsgId:
          type: object
          description: >-
            Point to point reference, as assigned by the original instructing
            party, to unambiguously identify the original message.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        OrgnlMsgNmId:
          type: object
          description: >-
            Specifies the original message name identifier to which the message
            refers.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        OrgnlCreDtTm:
          type: string
          description: Date and time at which the original message was created.
          format: date-time
        OrgnlNbOfTxs:
          type: object
          description: Number of individual transactions contained in the original message.
          allOf:
            - $ref: '#/components/schemas/Max15NumericText'
        OrgnlCtrlSum:
          maxLength: 18
          type: string
          description: >-
            Total of all individual amounts included in the original message,
            irrespective of currencies. The number of fractional digits should
            not be more than 17.
        GrpSts:
          $ref: '#/components/schemas/TransactionGroupStatus3Code'
        StsRsnInf:
          type: array
          description: >-
            Set of elements used to provide detailed information on the status
            reason.
          items:
            $ref: '#/components/schemas/StatusReasonInformation8'
        NbOfTxsPerSts:
          type: array
          description: >-
            Detailed information on the number of transactions for each
            identical transaction status.
          items:
            $ref: '#/components/schemas/NumberOfTransactionsPerStatus3'
      description: >-
        Original group information concerning the group of transactions, to
        which the status report message refers to.
    OriginalPaymentInformation1:
      required:
        - OrgnlPmtInfId
      type: object
      properties:
        OrgnlPmtInfId:
          type: object
          description: >-
            Unique identification, as assigned by the original sending party, to
            unambiguously identify the original payment information group.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        OrgnlNbOfTxs:
          type: object
          description: >-
            Number of individual transactions contained in the original payment
            information group.
          allOf:
            - $ref: '#/components/schemas/Max15NumericText'
        OrgnlCtrlSum:
          maxLength: 18
          type: string
          description: >-
            Total of all individual amounts included in the original payment
            information group, irrespective of currencies. The number of
            fractional digits should not be more than 17.
        PmtInfSts:
          type: object
          description: >-
            Specifies the status of the payment information
            group.<br><br><b>ACTC</b> : Authentication and syntactical and
            semantical validation are successful. <br><br><b>RCVD</b> : Payment
            initiation has been received by the receiving agent.
            <br><br><b>PART</b> : A number of transactions have been accepted,
            whereas another number of transactions have not yet achieved
            'accepted' status. <br><br><b>RJCT</b> : Payment initiation or
            individual transaction included in the payment initiation has been
            rejected.<br><br><b>PDNG</b> : Payment initiation or individual
            transaction included in the payment initiation is pending. Further
            checks and status update will be performed.<br><br><b>ACCP</b> :
            Preceding check of technical validation was successful. Customer
            profile check was also successful.<br><br><b>ACSP</b> : All
            preceding checks such as technical validation and customer profile
            were successful and therefore the payment initiation has been
            accepted for execution.<br><br><b>ACSC</b> : Settlement on the
            debtor's account has been completed. Usage : this can be used by the
            first agent to report to the debtor that the transaction has been
            completed. Warning : this status is provided for transaction status
            reasons, not for financial information. It can only be used after
            bilateral agreement<br><br><b>ACWC</b> : Instruction is accepted but
            a change will be made, such as date or remittance not sent.
          allOf:
            - $ref: '#/components/schemas/TransactionGroupStatus3Code'
        StsRsnInf:
          type: array
          description: >-
            Set of elements used to provide detailed information on the status
            reason.
          items:
            $ref: '#/components/schemas/StatusReasonInformation8'
        NbOfTxsPerSts:
          type: array
          description: >-
            Detailed information on the number of transactions for each
            identical transaction status.
          items:
            $ref: '#/components/schemas/NumberOfTransactionsPerStatus3'
        TxInfAndSts:
          type: array
          description: Payment transaction information and status.
          items:
            $ref: '#/components/schemas/PaymentTransactionInformation25'
    PaymentTransactionInformation25:
      type: object
      properties:
        StsId:
          type: object
          description: >-
            Unique identification, as assigned by an instructing party for an
            instructed party, to unambiguously identify the reported status.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        OrgnlInstrId:
          type: object
          description: >-
            Unique identification, as assigned by the original instructing party
            for the original instructed party, to unambiguously identify the
            original instruction.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        OrgnlEndToEndId:
          type: object
          description: >-
            Unique identification, as assigned by the original initiating party,
            to unambiguously identify the original transaction.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        TxSts:
          $ref: '#/components/schemas/TransactionIndividualStatus3Code'
        StsRsnInf:
          type: array
          description: >-
            Set of elements used to provide detailed information on the status
            reason.
          items:
            $ref: '#/components/schemas/StatusReasonInformation8'
        ChrgsInf:
          type: array
          description: >-
            Provides information on the charges related to the processing of the
            rejection of the instruction.
          items:
            $ref: '#/components/schemas/ChargesInformation5'
        AccptncDtTm:
          type: string
          description: >-
            Point in time when the payment order from the initiating party meets
            the processing conditions of the account servicing agent. This means
            that the account servicing agent has received the payment order and
            has applied checks such as authorisation, availability of funds.
          format: date-time
        AcctSvcrRef:
          type: object
          description: >-
            Unique reference, as assigned by the account servicing institution,
            to unambiguously identify the instruction.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        ClrSysRef:
          type: object
          description: >-
            Unique reference, as assigned by a clearing system, to unambiguously
            identify the instruction.
          allOf:
            - $ref: '#/components/schemas/Max35Text'
        OrgnlTxRef:
          $ref: '#/components/schemas/OriginalTransactionReference13'
    ChargesInformation5:
      required:
        - Amt
        - Pty
      type: object
      properties:
        Amt:
          type: object
          description: Transaction charges to be paid by the charge bearer.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        Pty:
          type: object
          description: >-
            Party that takes the transaction charges or to which the transaction
            charges are due.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
    OriginalTransactionReference13:
      type: object
      properties:
        IntrBkSttlmAmt:
          type: object
          description: >-
            Amount of money moved between the instructing agent and the
            instructed agent.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        Amt:
          $ref: '#/components/schemas/AmountType3Choice'
        IntrBkSttlmDt:
          type: string
          description: >-
            Date on which the amount of money ceases to be available to the
            agent that owes it and when the amount of money becomes available to
            the agent to which it is due.
          format: date
        ReqdColltnDt:
          type: string
          description: >-
            Date on which the creditor requests that the amount of money is to
            be collected from the debtor.
          format: date
        ReqdExctnDt:
          type: string
          description: >-
            Date at which the initiating party requests the clearing agent to
            process the payment.
          format: date
        CdtrSchmeId:
          type: object
          description: Credit party that signs the mandate.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification32'
        SttlmInf:
          $ref: '#/components/schemas/SettlementInformation13'
        PmtTpInf:
          $ref: '#/components/schemas/PaymentTypeInformation22'
        PmtMtd:
          $ref: '#/components/schemas/PaymentMethod4Code'
        MndtRltdInf:
          $ref: '#/components/schemas/MandateRelatedInformation6'
        RmtInf:
          $ref: '#/components/schemas/RemittanceInformation5'
        UltmtDbtr:
          type: object
          description: >-
            Ultimate party that owes an amount of money to the (ultimate)
            creditor.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification32'
        Dbtr:
          type: object
          description: Party that owes an amount of money to the (ultimate) creditor.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification32'
        DbtrAcct:
          type: object
          description: >-
            Unambiguous identification of the account of the debtor to which a
            debit entry will be made as a result of the transaction.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        DbtrAgt:
          type: object
          description: Financial institution servicing an account for the debtor.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        DbtrAgtAcct:
          type: object
          description: >-
            Unambiguous identification of the account of the debtor agent at its
            servicing agent in the payment chain.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        CdtrAgt:
          type: object
          description: Financial institution servicing an account for the creditor.
          allOf:
            - $ref: >-
                #/components/schemas/BranchAndFinancialInstitutionIdentification4
        CdtrAgtAcct:
          type: object
          description: >-
            Unambiguous identification of the account of the creditor agent at
            its servicing agent to which a credit entry will be made as a result
            of the payment transaction.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        Cdtr:
          type: object
          description: Party to which an amount of money is due.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification32'
        CdtrAcct:
          type: object
          description: >-
            Unambiguous identification of the account of the creditor to which a
            credit entry will be posted as a result of the payment transaction.
          allOf:
            - $ref: '#/components/schemas/CashAccount16'
        UltmtCdtr:
          type: object
          description: Ultimate party to which an amount of money is due.
          allOf:
            - $ref: '#/components/schemas/PartyIdentification32'
      description: >-
        Set of key elements used to identify the original transaction that is
        being referred to.
    AmountType3Choice:
      type: object
      properties:
        EqvtAmt:
          $ref: '#/components/schemas/EquivalentAmount2'
        InstdAmt:
          type: object
          description: >-
            Amount of money to be moved between the debtor and creditor, before
            deduction of charges, expressed in the currency as ordered by the
            initiating party.
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
      description: >-
        Amount of money to be moved between the debtor and creditor, before
