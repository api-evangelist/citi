      responses:
        '200':
          description: <table><tr><td>Code</td><td>Details</td></tr><tr><tr><td>PurchaseTemplateInboundSuccessResponse</td><td></td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseTemplateInboundSuccessResponse'
        '206':
          description: <table><tr><td>PurchaseTemplateInboundPartialResponse</td><td></td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseTemplateInboundPartialResponse'
        '400':
          description: '<table><tr><td>ResponseCodes400</td><td><table><tr><th>Error Code</th><th>Error Description</th></tr>

            <tr><td>ERS0060</td><td>Client ID and/or Program Id is missing in Client Onboard Configuration setup. Contact Citi support.</td></tr>

            <tr><td>MS0007</td><td>There was a problem retrieving the purchase template details for Purchase Template ID: {templateId}</td></tr>

            <tr><td>GRC0002</td><td>Client ID is missing in the request header</td></tr>

            <tr><td>GRC0003</td><td>Invalid JSON Input</td></tr>

            <tr><td>GRC0004</td><td>Region ID is not available in the request</td></tr>

            <tr><td>GRC0005</td><td>Client Tracking ID is missing in the request header</td></tr>

            <tr><td>GRC0010</td><td>Client Tracking ID length should contain a min of 1 character and a max of 36 characters</td></tr>

            <tr><td>GRC0011</td><td>Client ID and/or Country and/or region id is missing in Client Onboard Configuration setup. Contact Citi support.</td></tr>

            <tr><td>GRC0012</td><td>Necessary header value is missing</td></tr>

            <tr><td>GRC0016</td><td>Country code is not available in the request</td></tr>

            <tr><td>ERS0064</td><td>No ID Provisioning data was found for the given Program Name: {programName}</td></tr>

            <tr><td>ERS0065</td><td>The required Program Name Field was empty</td></tr>

            <tr><td>ERS0073</td><td>Size of the programName exceeds max length</td></tr>

            <tr><td>ERS0074</td><td>Size of the templateId exceeds max length</td></tr>

            <tr><td>ERS0075</td><td>templateId should be a valid long value</td></tr></table></td></tr></table>'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseCodes400'
        '500':
          description: '<table><tr><td>ResponseCode500</td><td><table><tr><th>Error Code</th><th>Error Description</th></tr>

            <tr><td>GRC0001</td><td>We have encountered an error and couldn''t receive your request. Please try again, or contact Citi support if you have any further questions or comments</td></tr><tr><td>GRC0014</td><td>We have encountered an error and couldn''t receive your request. Please try again, or contact Citi support if you have any further questions or comments</td></tr>

            <tr><td>MS0003</td><td>There was a problem retrieving the funding source data for Program Name: {programName}</td></tr>

            <tr><td>MS0004</td><td>There was a problem retrieving ID provisioning data for Program Name: {programName}</td></tr>

            <tr><td>MS0006</td><td> There was a problem retrieving the purchase template list for Program Name: {programName}</td></tr></table></td></tr></table>'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseCode500'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseTemplateInboundRequest'
        description: PurchaseTemplateInboundRequest
        required: true
