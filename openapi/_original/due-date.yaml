openapi: 3.0.3
info:
  title: Brazil QR code - Dynamic Collections with Due Date API
  description: >-
    This API allows clients to accept and manage PIX QR code collections with
    due date. PIX is a payment method owned by the Central Bank of Brazil (Banco
    Central), offering instant direct bank transfers in Brazil.
  version: 1.0.0
servers:
  - url: https://tts.sit.apib2b.citi.com/citiconnect/sit5/
    description: dev gateway url
  - url: https://tts.apib2b.citi.com/citiconnect/prod/
    description: production gateway url
  - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb/
    description: 'sbox url '
paths:
  /paymentservices/collections/qrcodes/cobv/{txid}:
    parameters:
      - $ref: '#/components/parameters/TxId'
      - $ref: '#/components/parameters/ClientId'
    put:
      summary: Create collection with due date.
      operationId: dynamicCollectionCreateWithDueDate
      security:
        - cobVWriteSample:
            - cobv.write
      description: Endpoint to create a collection with due date.
      requestBody:
        $ref: '#/components/requestBodies/CobVBody'
      responses:
        '201':
          $ref: '#/components/responses/CobVGeradaCreateResponse'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/AcessoNegado1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoInvalido'
        '415':
          $ref: '#/components/responses/MidiaInvalida'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel1'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    patch:
      parameters:
        - $ref: '#/components/parameters/CNPJ'
      summary: Update collection with due date.
      operationId: dynamicCollectionUpdateWithDueDate
      security:
        - cobVWriteSample:
            - cobv.write
      requestBody:
        $ref: '#/components/requestBodies/CobVBodyRevisada'
      responses:
        '200':
          $ref: '#/components/responses/CobVGeradaUpdateResponse'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/AcessoNegado1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoInvalido'
        '415':
          $ref: '#/components/responses/MidiaInvalida'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel1'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
    get:
      parameters:
        - $ref: '#/components/parameters/TxId'
        - $ref: '#/components/parameters/CNPJQuery'
        - $ref: '#/components/parameters/Revisao'
        - $ref: '#/components/parameters/ClientId'
      summary: Retrieve specific collection with due date details.
      operationId: dynamicCollectionInquiryWithDueDate
      security:
        - cobVReadSample:
            - cobv.read
      description: >-
        Endpoint intended to retrieve details for a collection with due date
        through a specific TXID.
      responses:
        '200':
          $ref: '#/components/responses/CobVCompletaResponse'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/AcessoNegado1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoInvalido'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel1'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
  /paymentservices/collections/qrcodes/cobv:
    get:
      parameters:
        - $ref: '#/components/parameters/Inicio'
        - $ref: '#/components/parameters/Fim'
        - $ref: '#/components/parameters/CPF'
        - $ref: '#/components/parameters/CNPJ'
        - $ref: '#/components/parameters/LocationPresente'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/loteCobVId'
        - $ref: '#/components/parameters/PaginaAtual'
        - $ref: '#/components/parameters/ItensPorPagina'
        - $ref: '#/components/parameters/ClientId'
      summary: Retrieve a list of collection items with due date.
      operationId: dynamicCollectionInquiryListWithDueDate
      security:
        - cobVReadSample:
            - cobv.read
      description: >-
        Endpoint to query outstanding collections through parameters like start
        date, end date, taxpayer ID (CPF/CNPJ) and status.
      responses:
        '200':
          $ref: '#/components/responses/CobsVConsultadasResponse'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/AcessoNegado1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoInvalido'
        '500':
          $ref: '#/components/responses/ServicoIndisponivel1'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
components:
  securitySchemes:
    cobVWriteSample:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /authenticationservices/v3/oauth/token
          scopes:
            cobv.write: Authenticates to update collection with due date
    cobVReadSample:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /authenticationservices/v3/oauth/token
          scopes:
            cobv.read: Authenticates to retrieve collection item with due date
  examples:
    cobBody1:
      summary: 'Example of creating a QR code collection #1'
      value:
        calendario:
          dataDeVencimento: '2020-12-31'
          validadeAposVencimento: 30
        loc:
          id: 789
        devedor:
          logradouro: Alameda Souza, Numero 80, Bairro Braz
          cidade: Recife
          uf: PE
          cep: '70011750'
          cpf: '12345678909'
          nome: Francisco da Silva
        valor:
          original: '123.45'
          multa:
            modalidade: '2'
            valorPerc: '15.00'
          juros:
            modalidade: '2'
            valorPerc: '2.00'
          desconto:
            modalidade: '1'
            descontoDataFixa:
              - data: '2020-11-30'
                valorPerc: '30.00'
        chave: 5f84a4c5-c5cb-4599-9f13-7eb4d419dacc
        solicitacaoPagador: Cobrança dos serviços prestados.
    cobBody7:
      summary: 'Collection Review Example #1'
      value:
        loc:
          id: 789
        devedor:
          logradouro: Alameda Souza, Numero 80, Bairro Braz
          cidade: Recife
          uf: PE
          cep: '70011750'
          cpf: '12345678909'
          nome: Francisco da Silva
        valor:
          original: '123.45'
        solicitacaoPagador: Cobrança dos serviços prestados.
    cobBody5:
      summary: 'Collection Review Example #3'
      value:
        status: REMOVIDA_PELO_USUARIO_RECEBEDOR
    cobBody4:
      summary: 'Collection Review Example #2'
      value:
        valor:
          original: '567.89'
        solicitacaoPagador: Informar cartão fidelidade
    OperacaoInvalidaCobVExample1:
      summary: 'Request Error Example #1'
      value:
        type: https://pix.bcb.gov.br/api/v2/error/CobVOperacaoInvalida
        title: Operação inválida.
        status: 400
        detail: >-
          Cobrança não encontra-se mais com o status ATIVA, somente cobranças
          ativas podem ser revisadas.
    cobResponse4:
      summary: 'Example of collection due #1'
      value:
        calendario:
          criacao: '2020-09-09T20:15:00.358Z'
          dataDeVencimento: '2020-12-31'
          validadeAposVencimento: 30
        txid: 7978c0c97ea847e78e8849634473c1f1
        revisao: 0
        loc:
          id: 789
          location: pix.example.com/qr/c2/cobv/9d36b84fc70b478fb95c12729b90ca25
          tipoCob: cobv
        status: ATIVA
        devedor:
          logradouro: Alameda Souza, Numero 80, Bairro Braz
          cidade: Recife
          uf: PE
          cep: '70011750'
          cpf: '12345678909'
          nome: Francisco da Silva
        recebedor:
          logradouro: Rua 15 Numero 1200, Bairro São Luiz
          cidade: São Paulo
          uf: SP
          cep: '70800100'
          cnpj: '56989000019533'
          nome: Empresa de Logística SA
        valor:
          original: '123.45'
        chave: 5f84a4c5-c5cb-4599-9f13-7eb4d419dacc
        solicitacaoPagador: Cobrança dos serviços prestados.
    RequisicaoInvalidaCobExample1:
      summary: 'Example Request Error #1'
      value:
        type: https://pix.bcb.gov.br/api/v2/error/CobOperacaoInvalida
        title: Cobrança inválida.
        status: 400
        detail: >-
          A requisição que busca alterar ou criar uma cobrança para pagamento
          imediato não respeita o _schema_ ou está semanticamente errada.
        violacoes:
          - razao: O campo cob.valor.original não respeita o _schema_.
            propriedade: cob.valor.original
    AcessoNegadoExample1:
      summary: Example Request 1 Error
      value:
        type: https://pix.bcb.gov.br/api/v2/error/AcessoNegado
        title: Acesso Negado
        status: 403
        detail: >-
          Requisição de participante autenticado que viola alguma regra de
          autorização.
    AcessoNegadoExample2:
      summary: Example Request 1 Error
      value:
        type: https://pix.bcb.gov.br/api/v2/error/AcessoNegado
        title: Acesso Negado
        status: 401
        detail: >-
          Requisição de participante autenticado que viola alguma regra de
