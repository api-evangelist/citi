openapi: 3.0.2
info:
  title: Online Payment Acceptance API
  description: >-
    The Online Payment Acceptance API currently allows merchants to accept PIX
    payments. PIX is a payment method owned by the Central Bank of Brazil (Banco
    Central), offering instant direct bank transfers in Brazil.
  version: 1.0.0
servers:
  - url: https://tts.apib2b.citi.com/citiconnect/prod
    description: production gateway url
  - url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb
    description: 'sbox url '
  - url: https://tts.sit.apib2b.citi.com/citiconnect/uat
    description: uat url
paths:
  /digitalpayments/v1/payment-acceptance/methods:
    get:
      summary: Payment Method Details
      description: >
        Payment Method Details returns the merchant payment method(s) enabled
        during onboarding.
      operationId: getpaymentmethod
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/MerchantID'
        - $ref: '#/components/parameters/authorization'
      responses:
        '200':
          description: Payment method
          headers:
            apim-guid:
              schema:
                type: string
              description: Citi's unique identification for your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodResponse'
              examples:
                PaymentMethod:
                  $ref: '#/components/examples/PaymentMethod'
        '400':
          $ref: '#/components/responses/BadGetRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Client Credentials: []
  /digitalpayments/v1/payment-acceptance:
    post:
      summary: Submit a Payment With Selected Payment Method
      description: Create a payment for a given payment method.
      operationId: Payments
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/authorization'
        - $ref: '#/components/parameters/contentType'
        - $ref: '#/components/parameters/IdempotencyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            examples:
              QRPIXPayments:
                $ref: '#/components/examples/QRPIXPaymentRequestExample'
              Payments:
                $ref: '#/components/examples/PaymentRequestExample'
      security:
        - Client Credentials: []
      callbacks:
        payment-qr-created:
          $ref: '#/components/callbacks/PaymentCreatedStatus'
        payment-qr-failed:
          $ref: '#/components/callbacks/PaymentFailedStatusNotification'
        payment-settled:
          $ref: '#/components/callbacks/PaymentSuccessStatusNotification'
      responses:
        '202':
          $ref: '#/components/responses/202Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
  /digitalpayments/v1/payment-acceptance/refunds:
    post:
      summary: Refund a Payment
      description: Create a partial or full refund for a payment transaction.
      operationId: refundPayments
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/authorization'
        - $ref: '#/components/parameters/contentType'
        - $ref: '#/components/parameters/IdempotencyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refunds'
            examples:
              BR Refund Transfer:
                $ref: '#/components/examples/BRRefundInitiationRequestExample'
      security:
        - Client Credentials: []
      callbacks:
        payment-refund-created:
          $ref: '#/components/callbacks/PaymentRefundCreatedStatus'
        payment-refund-failed:
          $ref: '#/components/callbacks/PaymentRefundFailedStatus'
      responses:
        '202':
          $ref: '#/components/responses/202Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
  /digitalpayments/v1/payment-acceptance/{reference}:
    patch:
      summary: Update a Previously Submitted Payment
      description: Update a payment.
      operationId: collectionUpdate
      parameters:
        - $ref: '#/components/parameters/authorization'
        - $ref: '#/components/parameters/contentType'
        - $ref: '#/components/parameters/IdempotencyId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ReferenceNo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentUpdateRequest'
            examples:
              QRPIXPayments:
                $ref: '#/components/examples/QRPIXPaymentUpdateRequestExample'
      security:
        - Client Credentials: []
      callbacks:
        payment-qr-modified:
          $ref: '#/components/callbacks/PaymentCreatedStatus'
        payment-qr-cancelled:
          $ref: '#/components/callbacks/PaymentCancelledStatus'
      responses:
        '202':
          $ref: '#/components/responses/202Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Receive Transaction Details
      description: >
        Receive transaction status with transaction reference number for up to
        90 days of transaction data.
      operationId: getpaymentstatus
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ReferenceNo'
        - $ref: '#/components/parameters/authorization'
      responses:
        '200':
          description: Payment status
          headers:
            apim-guid:
              schema:
                type: string
              description: Citi's unique identification for your request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments'
              examples:
                QRCreatedStatus:
                  $ref: '#/components/examples/QRCreatedStatus'
                QRPendingStatus:
                  $ref: '#/components/examples/QRPendingStatus'
                QRCancelledStatus:
                  $ref: '#/components/examples/QRCancelledStatus'
                QRFailedStatus:
                  $ref: '#/components/examples/QRFailedStatus'
        '400':
          $ref: '#/components/responses/BadGetRequest2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Client Credentials: null
  /digitalpayments/v1/payment-acceptance/{refund_id}:
    get:
      summary: Receive Refund Transaction Details
      description: >
        Receive transaction status with transaction reference number. 90 days of
        transaction data is available
      operationId: getrefundpaymentstatus
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Refund_id'
        - $ref: '#/components/parameters/authorization'
      responses:
        '200':
          description: Payment status
          headers:
            apim-guid:
              schema:
                type: string
              description: Citi's unique identification for your request,
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRefundNotification'
              examples:
                RefundcompletedStatus:
                  $ref: '#/components/examples/PaymentRefundSucessNotification'
                RefundrejectedStatus:
                  $ref: '#/components/examples/PaymentRefundFailedNotification'
        '400':
          $ref: '#/components/responses/BadGetRequest2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Client Credentials: []
components:
  parameters:
    ClientId:
      in: query
      name: client_id
      required: true
      schema:
        type: string
        description: >-
          This is your unique identifier shared during your CitiConnect API
          onboarding. This is the same `client_id` used for OAuth token
          generation
        example: abc123
    contentType:
      in: header
      name: Content-Type
      description: Supports application/json.
      required: true
      schema:
        type: string
    authorization:
      in: header
      name: Authorization
      description: The OAuth token prefixed with "Bearer" and space in between.
      required: true
      schema:
        type: string
    IdempotencyId:
      name: Idempotency-Id
      in: header
      required: true
      schema:
        type: string
        description: >-
          Unique idempotency identification provided by the merchant during
          transaction creation, maxlength of `IdempotencyId` is 128.
      example: abcd-123-y4df-yhrtk
    ReferenceNo:
      name: reference
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
        minLength: 1
        description: Your unique End To End identification
      example: abc-pay-123
    Refund_id:
      name: refund_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
        description: >-
          Unique refund reference ID, generated during refund initiation and
          provided to you in the synchronous response to your refund POST
          request 
      example: 0c4fb98b-d77a-4468-96bb-0c88b3b8f75a
    MerchantID:
      name: merchant_id
      in: query
      required: true
      schema:
        type: string
        maxLength: 40
        minLength: 1
        description: Your unique merchant identification number.
      example: M123456987
    ApimGuid:
      name: apim-guid
      in: header
      required: true
      schema:
        type: string
    EventType:
      name: event-type
      in: header
      required: true
      schema:
        type: string
    EventName:
      name: event-name
      in: header
      required: true
      schema:
        type: string
  schemas:
    Customer:
      properties:
        id:
          maxLength: 40
          minLength: 1
          type: string
          description: Merchant internal customer ID.
          example: 1234abcjki
        type:
          type: string
          enum:
            - INDIVIDUAL
            - BUSINESS
          description: |-
            Merchant customer type 
             - For Brazil QR creation `customer.type` parameter is mandatory
          example: BUSINESS
        payer_id:
          maxLength: 128
          minLength: 1
          type: string
          description: |-
            Customer's payer identification (e.g., email address) 
             - For Brazil QR creation, the `customer.payer_id` parameter is mandatory and only a numeric value is allowed, individual person tax identification (CPF) allowed length = 11  or business entity tax identification (CNPJ) allowed length = 14
          example: 234.453.678-21
        payer_type:
          type: string
          enum:
            - BIID
            - EMAL
            - EWAL
            - MBNO
            - NIDN
          description: >-
            Customer's payer type (BIID for bill identification, EMAL for email
            address, EWAL for electronic wallet identification, MBNO for mobile
            number and NIDN for national identification or tax identification 
             - For Brazil QR creation `customer.payer_type` parameter is mandatory, applicable value NIDN
          example: NIDN
        name:
          maxLength: 200
          minLength: 1
          type: string
          description: |2-
             Payer name 
             - For Brazil QR creation customer.name parameter is mandatory and allowed datatype alphanumeric, individual person or business entity name.
          example: Margarida
        address:
          $ref: '#/components/schemas/Address'
    RestrictedFINXMax128Text:
      maxLength: 35
      minLength: 1
      pattern: ^(?!\s*$).+
      type: string
      description: >-
        Specifies a character string with a maximum length of 35 characters
        limited to character set X, that is, a-z A-Z / - ? : ( ) . , ‘ + . 
         - For Brazil `end_to_end_id` parameter is mandatory and allowed max length is 35
    Address:
      description: |-

        - For Brazil QR transaction `shipping.address` details is not applicable
      required:
        - country_code
      properties:
        line1:
          maxLength: 40
          minLength: 1
          type: string
          description: Customer line1 address
          example: '#45, Block 12'
        line2:
          maxLength: 40
          minLength: 1
          type: string
          description: Customer line2 address.
          example: Federal Street
        city:
          maxLength: 30
          minLength: 1
          type: string
          description: Customer city
          example: Abis Brasil
        postal_code:
          maxLength: 16
          minLength: 1
          type: string
          description: Customer postal code.
          example: 69935-000
        state:
          maxLength: 30
          minLength: 1
          type: string
          description: Customer state.
          example: san francisco
        country_code:
          type: string
          enum:
            - BR
          description: Customer country.
          example: BR
    Original_Payment:
      type: object
      description: >-
        Either populate UETR OR (`end_to_end_id` AND `value_date`) for the
        refund to be processed.
      properties:
        end_to_end_id:
          $ref: '#/components/schemas/RestrictedFINXMax128Text'
        uetr:
          type: string
          pattern: >-
            ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          description: UUID v4 format unique end-to-end transaction reference.
        value_date:
          type: string
          format: date
          description: >-
            Format YYYY-MM-DD Date in local time zone (e.g., EST for a United
            States RTP network transaction) when Citi's transaction processing
            application starts processing a transaction.
    Original_Payment_Status:
      type: object
      description: >-
        Either populate UETR OR (`end_to_end_id` AND `value_date`) for the
        refund to be processed.
      properties:
        end_to_end_id:
          $ref: '#/components/schemas/RestrictedFINXMax128Text'
        uetr:
          type: string
          pattern: >-
            ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          description: UUID v4 format unique end-to-end transaction reference.
        value_date:
          type: string
          format: date
          description: >-
            Format YYYY-MM-DD Date in local time zone (e.g., EST for a United
            States RTP network transaction) when Citi's transaction processing
            application starts processing a transaction.
        instructed_amount:
          type: number
          minimum: 0.01
          maximum: 100000000000000
          description: |-
            Instructed amount 
             - Thailand PromptPay - Maximum amount is 2000000.00 
             - United States - Maximum amount is 1000000.00
        instructed_currency:
          description: ISO 4217 code for the transaction instructed amount currency.
          type: string
          enum:
            - BRL
    Merchant:
      type: object
      required:
        - id
      properties:
        id:
          maxLength: 40
          minLength: 1
          type: string
          description: Merchant ID assigned by Citi.
          example: M12348907
        payee_id:
          maxLength: 128
          minLength: 1
          type: string
          description: |-
            Merchant's payee identification (e.g., email address) 
             - For Brazil QR creation, `merchant.payee_id` parameter is mandatory, allowed maxlength is 77.
          example: 1.020.340/8910-22
        payee_type:
          type: string
          enum:
            - BIID
            - EMAL
            - EWAL
            - MBNO
            - NIDN
          description: >-
            Merchant's payee type (BIID for bill identification, EMAL for email
            address, EWAL for electronic wallet identification, MBNO for mobile
            number and NIDN for national identification or tax identification 
             - For Brazil QR creation `merchant.payee_type` parameter is mandatory
          example: NIDN
      additionalProperties: false
    Method:
      type: object
      required:
        - type
      properties:
        type:
          description: |-
            Method specified by the customer for the transaction 
            - Provide PIX for Brazil QR creation
          type: string
          enum:
            - PIX
          example: PIX
    Transaction:
      type: object
      required:
        - reference
        - amount
        - currency_code
      properties:
        reference:
          maxLength: 128
          minLength: 1
          type: string
          description: >-
            Unique transaction identification provided by the merchant during
            transaction creation 

            - transaction.reference parameter is mandatory for all transaction
            type creation   

            - For Brazil QR creation `transaction.reference` parameter should be
            of length between 26 to 35 and allowed datatype is alphanumeric and
            should not be filled with spaces or zeroes
          example: pay02052023456r
        order_id:
          maxLength: 128
          minLength: 1
          type: string
          description: >-
            Unique order identification provided by the merchant during
            transaction creation.
          example: order1234
        expiry_time:
          type: integer
          format: int32
          minimum: 10
          description: >-
            Expiration time for QR collection, specified in seconds 

            - QR Creation request will be rejected, if the expiration time value
            is less than 10.
          example: 3600
        amount:
          type: number
          minimum: 0.01
          maximum: 100000000000000
          description: |-
            Transaction amount 
             - For Brazil QR creation decimal values are mandatory for transaction.amount and it must have 2 digits 
             - For Brazil QR creation maximum amount limit is 9999999999.99
          example: 200
        currency_code:
          type: string
          enum:
            - BRL
          description: >-
            ISO 4217 Currency Code for instance  USD/GBP/EUR 

            - transaction.currency_code parameter is mandatory for all
            transaction type creation
          example: BRL
        update_flag:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: >-
            For QR Creation (e.g., Brazil), during transaction processing if the
            merchant wants to allow their clients to change QR amount then the
            value should be Y otherwise, the default value is 'N'.
          example: 'Y'
        qr_image:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: >-
            Merchant to confirm QR Image is required or not, If required, the
            value should be 'Y'.
          example: 'Y'
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalInfo'
    Shipping:
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
          description: |-
            Recipient name 
            - For Brazil QR, the `shipping.name` is not applicable.
          example: pay02052023456r
        phone:
          maxLength: 10
          minLength: 1
          type: number
          description: |-
            Recepient phone 
            - For Brazil QR, the `shipping.phone` is not applicable.
          example: 9982456123
        carrier:
          maxLength: 200
          minLength: 1
          type: string
          description: |-
            Service that shipped a physical product 
            - For Brazil QR, the `shipping.carrier` is not applicable.
          example: M455679
        tracking_number:
          maxLength: 40
          minLength: 8
          type: string
          description: |-
            Tracking number. 
            - For Brazil QR, the `shipping.tracking_number` is not applicable.
          example: T123456789
        address:
          $ref: '#/components/schemas/Address'
    AdditionalInfo:
      properties:
        name:
          maxLength: 50
          minLength: 1
          type: string
          description: >-
            Specifies a character string with a maximum length of 50
            characters. 

            - For Brazil QR transaction.additionalinfo.name is optional, if the
            `transaction.additionalinfo.name` parameter is provided by the
            merchant, then the `transaction.additionalinfo.value` parameter is
            mandatory.
          example: request_to_payer
        value:
          maxLength: 200
          minLength: 1
          type: string
          description: >-
            Specifies a character string with a maximum length of 200
            characters. 

            - For Brazil QR transaction.the `additionalinfo.value` parameter is
            optional, if the `transaction.additionalinfo.value` parameter is
            provided by merchant, then the `transaction.additionalinfo.name`
            parameter is mandatory.
          example: this is for purchase order 4567
    Refunds:
      type: object
      required:
        - instructed_amount
        - instructed_currency
        - original_payment
      properties:
        end_to_end_id:
          $ref: '#/components/schemas/RestrictedFINXMax128Text'
        instructed_amount:
          type: number
          minimum: 0.01
          maximum: 100000000000000
          description: >-
            Instructed amount can either be the full original transaction amount
            or a partial amount.
        instructed_currency:
          description: The ISO 4217 code for the transaction instructed amount currency.
          type: string
          enum:
            - BRL
        additional_info:
          type: string
          maxLength: 140
          description: |-
            Additional or remittance information 
            - For Brazil, the `refunds.additional_info` parameter is optional.
        original_payment:
          $ref: '#/components/schemas/Original_Payment'
    PaymentMethod:
      type: array
      items:
        type: object
        properties:
          type:
            description: |-
              Method specified by the customer for the transaction 
              - Provide PIX for Brazil QR creation.
            type: string
            maxLength: 20
            minLength: 1
            example: PIX
        additionalProperties: false
    CustomerUpdate:
      type: object
      properties:
        id:
          maxLength: 40
          minLength: 1
          type: string
          description: Merchant internal customer ID
          example: 1234abcjki
        type:
          type: string
          enum:
            - INDIVIDUAL
            - BUSINESS
          description: |-
            Merchant customer type 
             - For Brazil QR update, the `customer.type` parameter is mandatory, if any one of the following parameters are selected: `customer.payer_id`, `customer.payer_type`, and `customer.name` is selected.
          example: BUSINESS
        payer_id:
          maxLength: 128
          minLength: 1
          type: string
          description: |-
            Customer's payer identification (e.g., email address) 
             - For Brazil QR update, `customer.payer_id`  parameter is mandatory if any one of the following parameters are selected: `customer.payer_type`, `customer.name`, and `customer.type`, then only a numeric value is allowed, individual person tax identification (CPF) allowed length = 11 or business entity tax identification (CNPJ) allowed length = 14
          example: 234.453.678-21
        payer_type:
          type: string
          enum:
            - BIID
            - EMAL
            - EWAL
            - MBNO
            - NIDN
          description: >-
            Customer's payer type (BIID for bill identification, EMAL for email
            address, EWAL for electronic wallet identification, MBNO for mobile
            number and NIDN for national identification or tax identification 
             - For Brazil QR update, the `customer.payer_type` parameter is mandatory, if any one of the parameters `customer.payer_id`, `customer.type`, and `customer.name` is selected, the applicable value NIDN.
          example: NIDN
        name:
          maxLength: 200
          minLength: 1
          type: string
          description: |-
            Payer name 
             - For Brazil QR update, the `customer.name` parameter is mandatory, if any one of the parameters `customer.payer_id` ,`customer.payer_type`, and `customer.type` are selected and allowed datatype alphanumeric, individual person or business entity name.
          example: Margarida
        address:
          $ref: '#/components/schemas/Address'
    MerchantUpdate:
      type: object
      properties:
        id:
          maxLength: 40
          minLength: 1
          type: string
          description: Merchant ID assigned by Citi.
          example: M12348907
        payee_id:
          maxLength: 128
          minLength: 1
          type: string
          description: |-
            Merchant's payee identification (e.g., email address) 
             - For Brazil QR update, the `merchant.payee_id` parameter is mandatory, if the `merchant.payer_type` is selected, the allowed maxlength is 77.
          example: 1.020.340/8910-22
        payee_type:
          type: string
          enum:
            - BIID
            - EMAL
            - EWAL
            - MBNO
            - NIDN
          description: >-
            Merchant's payee type (BIID for bill identification, EMAL for email
            address, EWAL for electronic wallet identification, MBNO for mobile
            number and NIDN for national identification or tax identification 
             - For Brazil QR creation, the `merchant.payee_type` parameter is mandatory, if the `merchant.payer_id` is selected.
          example: NIDN
      additionalProperties: false
    TransactionUpdate:
      type: object
      properties:
        expiry_time:
          type: integer
          format: int32
          minimum: 10
          description: >-
            Expiration time for QR collection, specified in seconds 

            - QR Creation request will be rejected, if the expiration time value
            is less than 10
          example: 3600
        amount:
          type: number
          minimum: 0.01
          maximum: 100000000000000
          description: |-
            Transaction amount 
             - For Brazil QR Update decimal values are mandatory for the `transaction.amount`  must have 2 digits 
             - For Brazil QR update, the maximum amount limit is 9999999999.99.
          example: 200
        currency_code:
          type: string
          enum:
            - BRL
          description: ISO 4217 currency code, for instance, USD/GBP/EUR.
          example: BRL
        update_flag:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: >-
            For QR creation (e.g., Brazil), during transaction processing if the
            merchant wants to allow their client to change the QR amount, then
            the value should be 'Y' otherwise, the default value is 'N'.
          example: 'Y'
        qr_image:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: >-
            Merchant to confirm QR Image is required or not, If required, the
            value should be 'Y'.
          example: 'Y'
        operation:
          type: string
          enum:
            - CANCEL
          description: >-
            Transaction cancellation request. This parameter is applicable only
            for cancelling the collection request, if the merchant wants to
            cancel the already created QR collection request 

            - CANCEL - Request to cancel the transaction.
        additional_info:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalInfo'
