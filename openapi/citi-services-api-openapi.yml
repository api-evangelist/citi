    3de83cae-f7b8-4ba6-8f2f-4869ce6284e2-data-schema:
      type: object
      properties:
        ACCT_ID:
          type: string
          description: Account ID is an identifier for both a Cash Account and/or a Safekeeping Account that is unique within a branch.
          example: DEMOSK02US
        ACCT_NME:
          type: string
          description: Account Name is the name that is assigned to the Cash Account and/or the Safekeeping Account. If an Alternate Account Name has been specified for an account it will be displayed as the Account Name.
          example: Demo - SK - Japan 2
        ACCT_OWN_NAME:
          type: string
          description: Account Servicer/Depository is the name of the party which administers the account.
          example: Demo_d Ltd
        CPRT_NAME:
          type: string
          description: Counterparty is the name of the party imposed with the penalties or credited with the penalty(ies).
          example: ECLR/10608
        PENALTY_DETEC_DT:
          type: string
          format: date
          description: 'Penalty Detection Date is the day for which the penalty was computed. /nIt is the date on which the instruction matched for Late Matching Fail Penalty (LMFP) or the date on which an instruction fails to settle for Settlement Fail Penalty (SEFP). /nNote: This date is not updated upon re-calculation of the penalty and always relates to the business day for which the penalty was initially computed.'
          example: '2025-03-10'
        PENALTY_REF:
          type: string
          description: Reference is assigned by the market infrastructure to the penalty and is the individual identification of the penalty for the relevant account owner (that is, either for the failing participant or for the non-failing participant).
          example: F260305454043360
        COM_REF:
          type: string
          description: Common Reference is assigned by the market infrastructure (for example T2S) to the penalty and that is common for both the failing and the non-failing participant.
          example: C070200015097454
        PENALTY_TYP_CD:
          type: string
          description: Penalty Type indicating whether it is a Late Matching Fail Penalty (LMFP) or Settlement Fail Penalty (SEFP).
          example: LMFP
        PENALTY_AMT_CURR:
          type: string
          description: Penalty Currency is the ISO 4217 currency code for the currency of the penalty amount.
          example: USD
        PENALTY_AMT:
          type: number
          format: double
          description: Penalty Amount is calculated based on the security and instruction characteristics and the reason for the fail. For a Late Matching Fail Penalty (LMFP) that spans several business days, this amount is the sum of the amounts calculated for each applicable business day.
          example: 250.75
        PFD_ID_CTXT_CD:
          type: string
          description: 'Security ID Type indicates the type of identifier of the corresponding Security ID field. Values include: CUSIP, ISIN, SEDOL, LOCAL, etc.'
          example: CUSIP
        PFD_ISS_ID:
          type: string
          description: Security ID is the most commonly used identifier for the security in a given market.
          example: CSD12345
        SEC_SHRT_NME:
          type: string
          description: Issue Name is the Security Name of the security instrument.
          example: TEMPORARY SECURITY 000BMTYVP8
        SID_ISIN:
          type: string
          description: ISIN (International Securities Identification Number) is a 12-character alpha-numerical code governed by ISO 6166 it is a uniform identification of a security at trading and settlement. This data is sourced from multiple sources and will be provided if available.
          example: US88160R1014
        CLIENT_SEC_REF:
          type: string
          description: Custodian reference is i a unique identifier assigned to a client’s securities or accounts by the custodian
          example: Demo_nnnnn086021
        CLIENT_REF:
          type: string
          description: Client Reference is a unique number assigned by the client, to the transaction, for identification purposes within their organization.
          example: Demo_xxnnn54792
        TRADE_DT:
          type: string
          format: date
          description: Date when the trade was agreed on with counterparty.
          example: '2025-02-28'
        SEC_PEN_RT:
          type: number
          format: double
          description: Security penalty rate applied in the calculation of the penalty.
          example: 0.005
        CNTR_SETL_DT:
          type: string
          format: date
          description: Contractual Settlement Date represents the agreed‑upon date on which a trade is supposed to settle according to market rules or contractual terms.
          example: '2025-03-03'
        POST_QTY:
          type: number
          format: double
          description: Quantity provides the number of units, par value or nominal value (for fixed income instruments), amount of currency (for FX transactions), or number of shares. Indicates the contract quantity on the original transaction that was given up.
          example: 1500
        POST_AMT_CURR:
          type: string
          description: Settlement Currency is the currency name for the Settlement Amount.
          example: EUR
        POST_AMT:
          type: number
          format: double
          description: Settlement Amount is the cash value of the trade in the market currency.
          example: 450000
        PENALTY_STATUS:
          type: string
          description: Penalty status is to check if penalty is active or inactive for a given record.
          example: ACTV
    4b1404f9-e30e-434d-aca0-151861edacf1-data-schema:
      type: object
      properties:
        ACCT_ID:
          type: string
          description: Account ID is an identifier for both a Cash Account and/or a Safekeeping Account that is unique within a branch.
          example: DEMOSK02US
        ACCT_NME:
          type: string
          description: Account Name is the name that is assigned to the Cash Account and/or the Safekeeping Account. If an Alternate Account Name has been specified for an account it will be displayed as the Account Name.
          example: Demo - SK - Japan 2
        CPRT_ACCT_SER_NAME:
          type: string
          description: Counterparty's Account Servicer/Depository is the name of the counterparty's account servicer/depository.
          example: Demo_xxxden
        RPT_PER_DT_START:
          type: string
          format: date-time
          description: The date calculated based on the Period chosen as the start date for the report.
          example: '2025-10-01 00:00:00'
        RPT_PER_DT_END:
          type: string
          format: date-time
          description: The date calculated based on the Period chosen as the end date for the report.
          example: '2025-04-30 00:00:00'
        CASH_ACCT_ID:
          type: string
          description: Cash Account ID is the account number for the cash account. It is unique within a branch.
          example: Demo_nnn0422
        CPRT_NET_AMT_CURR:
          type: string
          description: Net Amount Currency is the currency of the Net Amount.
          example: EUR
        AGGR_AMT:
          type: number
          format: double
          description: The global net amount for a party is the sum of all cash penalties in this currency that this party is entitled to receive minus the sum of all cash penalties in this currency that are imposed to the party. A positive amount indicates that the party will be credited with this amount; a negative amount indicates that the amount will be debited.
          example: 432.51
        PFOD_MESG_ID:
          type: string
          description: Reference of the penalty payment.
          example: P2503DASI0496761
        ACCT_SERVR_BIC:
          type: string
          description: Account Servicer/Depository BIC is the Bank Identifier code of the party which administers the account.
          example: CEDELULLXXX
        CURRENCY:
          type: string
          description: Currency in which the penalties are expressed.
          example: EUR
        RLTD_PARTY_BIC:
          type: string
          description: Identification of the party reported as party imposed with the penalties reported or party credited with the penalty(ies).
          example: '5053360000'
        PARTY_TYPE:
          type: string
          description: Specifies the role of the party in the transaction.
          example: CSDP
        CPRT_BIC:
          type: string
          description: Counterparty BIC is the Bank Identifier code of the party imposed with the penalties reported or party credited with the penalty(ies).
          example: GIBAHUHBXXX
        CPRT_TYPE:
          type: string
          description: Specifies the role of the counterparty in the transaction
          example: NCSD
        CPRT_NET_AMT:
          type: number
          format: double
          description: The bilateral net amount for a party and counterpart will be the sum of all cash penalties in this currency that this party is entitled to receive (reported as credit) from the same counterpart (that is, to be paid by this counterpart) minus the sum of all cash penalties in this currency that are imposed to the party (reported as debit) and to be paid to the given counterpart.
          example: 782.86
        COM_REF:
          type: string
          description: Common Reference is assigned by the market infrastructure (for example T2S) to the penalty and that is common for both the failing and the non-failing participant.
          example: Demo_nnnnnnn91783743
        PENALTY_REF:
          type: string
          description: Reference is assigned by the market infrastructure to the penalty and is the individual identification of the penalty for the relevant account owner (that is, either for the failing participant or for the non-failing participant).
          example: Demo_nnnnnnn00005816
        PENALTY_TYP_CD:
          type: string
          description: Penalty Type indicates whether the penalty is a late matching fail penalty (LMFP) or a settlement fail penalty (SEFP).
          example: SEFP
        PENALTY_AMT_COMP:
          type: integer
          format: int32
          description: Indicates whether or not the amount calculated for the reported penalty will be added to the aggregated amounts at global level. There could be several reasons for not considering the penalty amount. The flag is used to indicate an exceptional situation. If the flag is not reported in the message this means that the penalty is considered for the calculation of aggregated amounts.
          example: 1
        PENALTY_AMT:
          type: integer
          format: int32
          description: Penalty Amount is calculated based on the security and instruction characteristics and the reason for the fail. For a Late Matching Fail Penalty (LMFP) that spans several business days, this amount is the sum of the amounts calculated for each applicable business day.
          example: 257
        CALC_METHOD:
          type: string
          description: Calcualtion Method indixates the calculation rule used to compute the penalty. Values are CASH, MIXE, SECU, BOTH.
          example: CASH
        NBR_OF_DAYS:
          type: integer
          format: int32
          description: Number of Days is the number of days over which a late matching penalty has been calculated.
          example: 16
        ACCT_OWN_TX_ID:
          type: string
          description: Reference assigned to the reported transaction by the account owner.
          example: '66176038465'
        ACCT_SEC_TX_ID:
          type: string
          description: Reference assigned to the reported transaction by the account servicer.
          example: H0000Y0ZB757CAI
        PROCESSOR_TX_ID:
          type: string
          description: Identification of the transaction assigned by the processor of the instruction other than the account owner/the account servicer and the market infrastructure.
          example: CSTDY00119545130
        MKT_INFR_TX_ID:
          type: string
          description: Identification of a transaction assigned by a market infrastructure other than a central securities depository, for example, Target2-Securities.
          example: '2503275363718075'
        COMMON_ID:
          type: string
          description: Unique reference agreed upon by the Investment Manager and the Broker/Dealer to identify the trade. This reference should be passed down and up through the whole life cycle of the transaction.
          example: 1403X34328787
        CORP_ACT_EV_ID:
          type: string
          description: Reference assigned by the account servicer to unambiguously identify a related corporate action event.
          example: AC17062532
        RELATED_TX_ID:
          type: string
          description: Reference of the linked message which was previously received.
          example: '66149993234'
        PEN_PY_DT:
          type: string
          format: date
          description: Payment Date is the date at which the last payment on the entitlement was made. Or Date/time at which the movement is due to take place (cash and/or securities).
          example: '2025-02-10'
        CPRT_ACCT_SER_BIC:
          type: string
          description: Counterparty's Account Servicer/Depository BIC is the Bank Identifier of the counterparty's account servicer/depository.
          example: IBLSPTPPXXX
        PENALTY_DETEC_DT:
          type: string
          format: date
          description: 'Penalty Detection Date is the day for which the penalty was computed. /nIt is the date on which the instruction matched for Late Matching Fail Penalty (LMFP) or the date on which an instruction fails to settle for Settlement Fail Penalty (SEFP). /nNote: This date is not updated upon re-calculation of the penalty and always relates to the business day for which the penalty was initially computed.'
          example: '2025-03-10'
        PENALTY_STATUS:
          type: string
          description: Penalty status is to check if penalty is active or inactive for a given record.
          example: ACTV
