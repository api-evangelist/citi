components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: >-
        Citi Velocity APIs use the oAuth2 authentication scheme, which requires
        a bearer token to authenticate your API call. See <a
        href="../../fx/authentication/authentication-api-reference/"
        target="_blank">the Citi Authentication API reference</a> for
        information on requesting a token.
      flows:
        clientCredentials:
          scopes:
            fxapi: ''
          tokenUrl: https://api.citivelocity.com/markets/cv/api/fx/oauth2/token
  schemas:
    FXOrderEnquiry:
      description: >
        Note: While the fields ‘tradeDate’, ‘rateSetId’, ‘clOrdId’ and ‘orderId’
        are optional individually, the client must send them in at least one of
        the combinations below to fetch the results.
          a) ‘tradeDate’ & ‘rateSetId’
          b) ‘clOrdId’
          c) ‘orderId’
      type: object
      required:
        - action
        - jsonReqId
        - senderCompId
        - onBehalfOfCompId
        - sendingTime
        - deals
      properties:
        action:
          type: string
          description: 'The service you are requesting. Allowed values: report-request.'
          example: report-request
        jsonReqId:
          type: string
          description: >-
            The unique identifier that you assign in the JSON request. Must be
            alphanumeric.
          maxLength: 100
          example: Req20181011776
        senderCompId:
          type: string
          description: >-
            The Citi-assigned value used to identify the message sender. This
            was assigned to you during onboarding. May contain special
            characters ( ‘_’, ‘.’, ‘-‘).
          maxLength: 20
          example: ClientName
        onBehalfOfCompId:
          type: string
          description: >-
            The Citi-assigned value used to identify the sub-entity. This was
            assigned to you during onboarding. May contain special characters (
            ‘_’, ‘.’, ‘-‘).
          maxLength: 20
          example: ClientName
        sendingTime:
          type: string
          description: >-
            The time of the message transmission expressed in UTC (Universal
            Time Coordinated, also known as "GMT"). Format:
            YYYYMMDD-HH:MM:SS.mmm.
          example: 20180820-04:48:29.125
        deals:
          type: array
          items:
            required:
              - account
            properties:
              account:
                type: string
                description: >-
                  Your Citi-assigned client identifier. May contain special
                  characters (‘_’, ‘.’, ‘-‘).
                maxLength: 50
                example: TEST12345
              tradeDate:
                type: string
                format: date
                description: 'The trade date for the report. Format: yyyy-MM-dd.'
                maxLength: 10
                example: '2011-03-03'
              rateSetId:
                type: integer
                format: int32
                description: The Rate Set Id for the report.
                example: 12345
              clOrdId:
                type: string
                description: The unique identifier that you assign.
                maxLength: 64
                example: CR12345
              orderId:
                type: string
                format: int64
                description: The Citi-assigned order reference.
                example: '1824923'
      example:
        action: report-request
        senderCompId: IFXCLIENT0
        onBehalfOfCompId: IFXCLIENT0
        jsonReqId: b2ff6f61
        sendingTime: 20180820-04:48:29.125
        deals:
          - account: XXXXXXXX
            rateSetId: 12725823
            tradeDate: '2024-03-06'
    ExecutionReport:
      type: object
      required:
        - action
        - jsonReqId
        - senderCompId
        - onBehalfOfCompId
        - sendingTime
      properties:
        action:
          type: string
          description: Defines action of the message. Value will be report-response.
          maxLength: 20
        jsonReqId:
          type: string
          description: The unique identifier for the JSON request. Format is alphanumeric.
          maxLength: 100
          example: Req20181011776
        senderCompId:
          type: string
          description: >-
            The Citi-assigned value used to identify the firm sending the
            message.
          maxLength: 20
          example: clientname
        onBehalfOfCompId:
          type: string
          description: >-
            The Citi-assigned value used to identify the sub-entity. May contain
            special characters ( ‘_’, ‘.’, ‘-‘).
          maxLength: 20
          example: clientname
        sendingTime:
          type: string
          description: >-
            The time of message transmission. Always expressed in UTC (Universal
            Time Coordinated, also known as 'GMT.' Format is
            YYYYMMDD-HH:MM:SS.mmm
          example: 20180820-04:48:31.155
        errorCode:
          type: integer
          description: >-
            The error code associated with the response. See the Error Codes tab
            for a complete list.
          example: 99
        errorMessage:
          type: string
          description: >-
            The error message associated with the response. See the Error Codes
            tab for a complete list.
          example: unable to process your request
        dealResponses:
          type: array
          items:
            required:
              - clOrdId
              - account
              - orderId
              - ordStatus
              - ccyPair
              - tenor
              - dealtCcy
              - side
              - orderQty
              - rateSetId
              - counterCcy
              - contAmtValue
              - lastSpotRate
              - lastForwardPoints
              - outrightRate
              - rejectCode
              - citiMergedOrder
              - customTenorUnit
              - ordType
              - isBookedWithMktRate
              - isBookedWithMRF
              - mrfPercentage
              - mrfComparisionRate
              - mrfVariance
            properties:
              clOrdId:
                type: string
                description: The order reference you assigned.
                maxLength: 64
                example: '22136'
              account:
                type: string
                description: >-
                  Your account ID. May contain special characters ( ‘_’, ‘.’,
                  ‘-‘).
                maxLength: 50
                example: ABC123
              orderId:
                type: string
                format: int64
                description: The Citi-assigned Order reference.
                example: '123456'
              ordStatus:
                type: string
                maxLength: 15
                enum:
                  - BOOKED
                  - MERGED
                  - PENDING
                  - ACCEPTED
                  - REJECTED
                description: >
                  Status description: 

                  - PENDING: For InstantFX credit check failed orders/late
                  orders/refund tolerance failed orders

                  - MERGED: This is applicable only to ‘Net & Merge’ InstantFX
                  clients; where two or more client orders are for the same ccy
                  pair and value date, will be merged to create a single, netted
                  Order and the original, contributing orders will be flagged as
                  ‘Merged’ orders with a cross reference to the Citi created
                  order. 

                  - BOOKED: order is booked

                  - ACCEPTED: applicable only for pre-orders (intent to pay)

                  - REJECTED: order rejected
                example: BOOKED
              ccyPair:
                type: string
                maxLength: 6
                description: >-
                  The currency pair that you are trading on. Please discuss your
                  preference of sending the value of currency pair in either
                  BaseTerm format or alphabetic sort order with your Citi
                  Representative.
                example: GBPUSD
              tenor:
                type: string
                description: The Tenor the order is being placed for.
                maxLength: 10
                example: BROKEN
              valueDate:
                type: string
                format: date
                description: The value date of the Order. Format is yyyy-MM-dd.
                example: '2012-11-15'
              dealtCcy:
                type: string
                maxLength: 3
                description: The currency for which you supplied the dealt amount.
                example: USD
              side:
                type: string
                maxLength: 1
                description: >-
                  Indicates whether you are buying (B) or selling (S) the dealt
                  ccy.
                enum:
                  - B
                  - S
                example: S
              orderQty:
                type: string
                format: double
                description: The dealt ccy amount
                example: '100'
              rateSetId:
                type: integer
                format: int32
                description: >-
                  If the rating method was IFX, this is the Rate Set Id used in
                  the rating of the order. In case of a Refund order, it is the
                  rate set Id previously used to book original order.
              counterCcy:
                type: string
                maxLength: 3
                description: The counter ccy of the ccy pair, not the dealt ccy.
                example: GBP
              contAmtValue:
                type: string
                format: double
                description: The calculated counter ccy amount.
                example: '6543.65'
              lastSpotRate:
                type: string
                format: double
                description: The spot rate applied to the order.
                example: '1.5282'
              lastForwardPoints:
                type: string
                format: double
                description: >-
                  The forward points applied to the order. Will be zero for spot
                  transactions.
                example: '0'
              outrightRate:
                type: string
                description: The outright (spot and fwd points) rate applied to the order.
                example: '1.5282'
              rejectCode:
                type: integer
                description: The reject code if order status = ‘REJECTED’ (rejected).
              rejectReason:
                type: string
                description: >-
                  The reason for rejection if order status = ‘REJECTED’’
                  (rejected).
                maxLength: 250
              citiMergedOrder:
                type: boolean
                description: >-
                  Indicates whether this is a merged order created by Citi. Only
                  applicable to ‘Net & Merge’ clients.
                example: false
              clOrdLinkId:
                type: string
                format: int64
                description: >-
                  The Citi-assigned Merged Order reference.  This is applicable
                  only to ‘Net & Merge’ InstantFX clients; where two or more
                  orders are for the same ccy pair and value date, will be
                  merged to create a single, netted Order and the original,
                  contributing orders will be flagged as ‘Merged’ orders with a
                  cross reference to the Citi created order.
                example: '123456'
              fixingDate:
                type: string
                format: date
                description: >-
                  Optional field relating to NDF trades only. The fixing date of
                  the NDF Order.
                example: '2012-11-12'
              customTenorUnit:
                type: integer
                description: >-
                  The tenor unit to be used when booking a trade with a Tenor
                  type of T. Current supported values are 1, 3, 5.
                example: 1
              clientData:
                type: string
                description: Contains the value that was sent in the original request.
                maxLength: 30
                example: Amount:1234|onBehalfOf:ClientB
              clientData2:
                type: string
                description: Contains the value that was sent in the original request.
                maxLength: 30
                example: Amount:1234|onBehalfOf:ClientB
              clientData3:
                type: string
                description: Contains the value that was sent in the original request.
                maxLength: 30
                example: Amount:1234|onBehalfOf:ClientB
              clientData4:
                type: string
                description: Contains the value that was sent in the original request.
                maxLength: 30
                example: Amount:1234|onBehalfOf:ClientB
              clientData5:
                type: string
                description: Contains the value that was sent in the original request.
                maxLength: 30
                example: Amount:1234|onBehalfOf:ClientB
              origClOrdId:
                type: string
                format: int64
                description: >-
                  Conditional field. Mandatory for ordType =”REFUND”. The value
                  received in the “orderId” field of the standard order response
                  published by Citi.
                example: '123456'
              ordType:
                description: The order type.
                type: string
                maxLength: 15
                enum:
                  - STANDARD
                  - REFUND
                  - PRE
                  - DRAWDOWN
                  - FORECAST
                  - STAGING
                  - STAGING_MERGED
                  - BALANCE
                example: STANDARD
              isBookedWithMktRate:
                type: boolean
                description: To indicate if the order is booked on market rate
              isBookedWithMRF:
                type: boolean
                description: >-
                  This flag will be set if the order is booked with an adjusted
                  rate. Note: Deals will be booked with an adjusted rate
                  whenever MRF happens if you opted for it.
                example: false
              mrfId:
                type: string
                description: >-
                  Conditional field. The reference number for the adjusted rate
                  if isBookedWithMRF ='TRUE'.
                example: '123'
              mrfPercentage:
                type: string
                format: double
                description: Percentage that is used to adjust the rate.
                example: '3.54'
              mrfComparisionRate:
                type: string
                format: double
                description: Rate at which Citi compares in market while order booking.
                example: '1.5982'
              mrfVariance:
                type: string
                format: double
                description: Variance between rate set rate and current market rate.
                example: '4.58'
              udc1:
                type: string
                description: The purpose code received in the order request.
                example: '3'
              udc2:
                type: string
                description: The purpose code received in the order request.
                example: '2'
              udc3:
                type: string
                description: The purpose code received in the order request.
                example: '1'
              backOffRef:
                type: string
                description: >-
                  Back office settlement reference number for booked orders.
                  Value will be null in the order response. The value can be
                  obtained through a report request for the booked order. Please
                  contact your Citi Representative to request the report.
                maxLength: 60
                example: 1054T31966
              uniqueTradeIdentifier:
                type: string
                description: >-
                  UTI value for booked orders. This value will be null in the
                  order response. The value can be obtained through Report
                  request for the booked order. Please contact your Citi
                  Representative to request the report.
                maxLength: 200
                example: 1030187177149384LDN324700496727
