          value must have valid format: YYYY-MM-DD<br> * `EVB0211` -
          validityStartDate invalid format. MM value must be less than or equal
          to 12 and DD value must be less than or equal to 31<br> * `EVB0238` -
          The date specified in validityStartDate does not exist<br> * `EVB0217`
          - validityStartDate cannot be a past date<br> * `EVB0126` -
          validityEndDate is mandatory if ValidityPeriodControl is true<br> *
          `EVB0120` - validityEndDate value must have valid format:
          YYYY-MM-DD<br> * `EVB0211` - validityEndDate invalid format. MM value
          must be less than or equal to 12 and DD value must be less than or
          equal to 31<br> * `EVB0237` - The date specified in validityEndDate
          does not exist<br> * `EVB0218` - validityEndDate cannot be a past
          date<br> * `EVB0600` - validityStartDate should be before
          validityEndDate<br> * `EVB0215` - Validity Period Control must be set
          to true and validityStartDate and validityEndDate are mandatory if
          periodType = C<br> * `EVB1153` - vcaRequestor.requestorType is
          mandatory and can be either 'INDIVIDUAL' or 'ORG'<br> * `EVB1154` -
          vcaRequestor.id is mandatory<br> * `EVB1155` - vcaRequestor.firstName
          is mandatory<br> * `EVB1156` - vcaRequestor.lastName is mandatory<br>
          * `EVB1157` - vcaRequestor.middleName is mandatory<br> * `EVB1158` -
          vcaRequestor.orgName is mandatory<br> * `EVB1161` - vcaUser.emailId is
          mandatory<br> * `EVB1162` - vcaUser.emailId format is invalid<br> *
          `EVB1163` - vcaUser.mobileNumber is mandatory<br> * `EVB1164` -
          vcaUser.mobileNumber should be numeric<br> * `EVB1165` -
          vcaUser.mobileCountryCode is mandatory<br>
        type: string
        example: >-
          Document(s) is mandatory and should not be null or empty and should be
          one of the required documents
        format: alphanumeric [a-zA-Z0-9]
  CardEnrollmentValidationFailureResponse:
