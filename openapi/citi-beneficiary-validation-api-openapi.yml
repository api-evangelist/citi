                  enum:
                  - MATCH
                  - MISMATCH
                  - PARTIALMATCH
                  - NA
                  - NOTCHECKED
                  title: address_validation
                phone_validation:
                  xml:
                    name: PhoneValidation
                  type: string
                  description: "Phone number validation result \n - For India IMPS,this field is not applicable \n - For India UPI,this field is not applicable \n - For US EWS,this field is conditional \n - For UK,this field is conditional \n - For IN PAN,this field is not applicable \n - For Pay2China, this field is not applicable \n- MATCH - Validation based on phone number is a match \n - MISMATCH - Validation based on phone number is a mismatch \n - PARTIALMATCH - Validation based on phone number is a partial match \n- NOTCHECKED - Validation not checked \n- NA - Validation is not applicable"
                  enum:
                  - MATCH
                  - MISMATCH
                  - PARTIALMATCH
                  - NA
                  - NOTCHECKED
                  title: phone_validation
            iban:
              xml:
                name: Iban
              type: object
              title: iban
              properties:
                structure_validation:
                  xml:
                    name: StructureValidation
                  type: string
                  description: "IBAN mod 97 structure validation \n - For India IMPS,this field is not applicable \n - For India UPI,this field is not applicable \n - For US EWS,this field is conditional \n - For UK,this field is conditional \n - For IN PAN,this field is not applicable \n - For Pay2China, this field is not applicable \n- MATCH - Validation based on mod 97 is a match \n - MISMATCH - Validation based on mod 97 is a mismatch \n- NOTCHECKED - Validation not checked \n- NA - Validation is not applicable"
                  enum:
                  - MATCH
                  - MISMATCH
