openapi: 3.2.0
info:
  title: Pix Rec API
  version: 2.8.1
  description: Update - February 04, 2026
servers:
- url: https://tts.apib2b.citi.com/citiconnect/prod
  description: Servidor de Produção
- url: https://tts.sandbox.apib2b.citi.com/citiconnect/sb
  description: sbox URL
- url: https://tts.sit.apib2b.citi.com/citiconnect/uat
  description: Servidor de Homologação
tags:
- name: Rec
  x-displayName: Gerenciamento de recorrências
  description: Reúne endpoints destinados a lidar com gerenciamento de recorrências.
paths:
  /digitalpayments/br/v1/rec/{idRec}:
    parameters:
    - name: idRec
      in: path
      required: true
      schema:
        type: string
        title: Id da location cadastrada para servir um payload
    get:
      tags:
      - Rec
      parameters:
      - $ref: '#/components/parameters/Client-Id'
      - name: txid
        in: query
        required: false
        schema:
          type: string
          title: TxId da cobrança associada a recorrência.
      summary: Consultar recorrência
      security:
      - OAuth2:
        - authenticationservices/v1
      description: Consultar recorrência.
      responses:
        '200':
          description: Dados da recorrência.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecCompleta'
              examples:
                response1:
                  $ref: '#/components/examples/recResponse3'
                response2:
                  $ref: '#/components/examples/recResponse4'
                response3:
                  $ref: '#/components/examples/recResponse5'
                response6:
                  $ref: '#/components/examples/recResponse8'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      operationId: getDigitalpaymentsBrV1RecByIdRec
      x-operation-id-source: derived
    patch:
      tags:
      - Rec
      parameters:
      - $ref: '#/components/parameters/Client-Id'
      summary: Revisar recorrência
      security:
      - OAuth2:
        - authenticationservices/v1
      description: Revisar recorrência.
      requestBody:
        $ref: '#/components/requestBodies/RecBodyRevisada'
      responses:
        '200':
          description: Recorrência revisada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecGerada'
              examples:
                retorno1:
                  $ref: '#/components/examples/recResponse1'
        '400':
          description: Requisição com formato inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                requisicao1:
                  $ref: '#/components/examples/OperacaoInvalidaRecExample1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      operationId: patchDigitalpaymentsBrV1RecByIdRec
      x-operation-id-source: derived
  /digitalpayments/br/v1/rec:
    get:
      parameters:
      - $ref: '#/components/parameters/Client-Id'
      - in: query
        name: inicio
        required: true
        schema:
          $ref: '#/components/schemas/Inicio'
      - in: query
        name: fim
        required: true
        schema:
          $ref: '#/components/schemas/Fim'
      - name: cpf
        in: query
        schema:
          type: string
          title: CPF
          pattern: /^\d{11}$/
          description: Filtro pelo CPF do devedor. Não pode ser utilizado ao mesmo tempo que o CNPJ.
      - name: cnpj
        in: query
        schema:
          type: string
          title: CNPJ
          pattern: /^\d{14}$/
          description: Filtro pelo CNPJ do devedor. Não pode ser utilizado ao mesmo tempo que o CPF.
      - name: locationPresente
        in: query
        schema:
          type: boolean
      - name: status
        in: query
        schema:
          type: string
          title: Status do registro da recorrência
          description: Filtro pelo status da recorrência.
      - name: convenio
        in: query
        schema:
          type: string
          title: Convênio
          maxLength: 60
          description: Filtro pelo convênio associado.
      - $ref: '#/components/parameters/paginaAtual'
      - $ref: '#/components/parameters/itensPorPagina'
      tags:
      - Rec
      summary: Consultar lista de recorrências
      security:
      - OAuth2:
        - authenticationservices/v1
      description: Consultar lista de recorrências.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecsConsultadas'
              examples:
                retorno1:
                  $ref: '#/components/examples/getRec1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      operationId: getDigitalpaymentsBrV1Rec
      x-operation-id-source: derived
    post:
      tags:
      - Rec
      parameters:
      - $ref: '#/components/parameters/Client-Id'
      summary: Criar recorrência
      security:
      - OAuth2:
        - authenticationservices/v1
      requestBody:
        $ref: '#/components/requestBodies/RecBody'
      responses:
        '201':
          description: Recorrência criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecGerada'
              examples:
                retorno1:
                  $ref: '#/components/examples/recResponse1'
                retorno2:
                  $ref: '#/components/examples/recResponse2'
        '400':
          description: Requisição com formato inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                requisicao1:
                  $ref: '#/components/examples/OperacaoInvalidaRecExample1'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
      operationId: postDigitalpaymentsBrV1Rec
      x-operation-id-source: derived
components:
  schemas:
    RecStatus:
      type: object
      title: Status da Recorrência
      required:
      - status
      properties:
        status:
          type: string
          title: Status do registro da recorrência
          enum:
          - CRIADA
          - APROVADA
          - REJEITADA
          - EXPIRADA
          - CANCELADA
    RecPayload:
      type: object
      title: Payload da Recorrência
      required:
      - idRec
      - atualizacao
      - recebedor
      description: Atributos de Configuração de Recorrência
      allOf:
      - type: object
        properties:
          idRec:
            $ref: '#/components/schemas/RecId'
      - $ref: '#/components/schemas/RecBase'
      - type: object
        properties:
          recebedor:
            oneOf:
            - $ref: '#/components/schemas/PessoaJuridicaRecorrencia'
            allOf:
            - type: object
              required:
              - ispbParticipante
              properties:
                ispbParticipante:
                  type: string
                  title: ISPB do usuário recebedor.
                  description: ISPB do usuário recebedor.
                  pattern: \d{8}
      - $ref: '#/components/schemas/RecConfiguracao'
      - $ref: '#/components/schemas/RecAtualizacao'
    SolicRecAtualizacao:
      type: object
      title: Histórico de Status da Solicitação de Recorrência
      required:
      - atualizacao
      properties:
        atualizacao:
          type: array
          title: Histórico de Status da Solicitação de Recorrência
          description: ''
          items:
            type: object
            required:
            - status
            - data
            properties:
              status:
                type: string
                title: Status do registro da solicitação de recorrência
                enum:
                - CRIADA
                - ENVIADA
                - RECEBIDA
                - REJEITADA
                - ACEITA
                - EXPIRADA
                - CANCELADA
              data:
                type: string
                format: date-time
                description: Data e hora do registro de status atualizado. Respeita RFC 3339.
    Problema:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: URI de referência que identifica o tipo de problema. De acordo com a RFC 7807.
          example: https://pix.bcb.gov.br/api/v2/error/NaoEncontrado
        title:
          type: string
          description: Descrição resumida do problema.
          example: Not found
        status:
          type: integer
          description: Código HTTP do status retornado.
          example: 404
        detail:
          type: string
          description: Descrição completa do problema.
        correlationId:
          type: string
          description: Identificador de correlação do problema para fins de suporte
        violacoes:
          type: array
          items:
            $ref: '#/components/schemas/Violacao'
    PayloadLocationRecId:
      type: integer
      format: int64
      title: Id da location
      description: Identificador da location a ser informada na criação de uma recorrência .
    SolicRecStatus:
      type: object
      title: Status da Solicitação de Recorrência
      required:
      - status
      properties:
        status:
          type: string
          title: Status do registro da solicitação de recorrência
          enum:
          - CRIADA
          - ENVIADA
          - RECEBIDA
          - REJEITADA
          - ACEITA
          - EXPIRADA
          - CANCELADA
    RecAtivacao:
      type: object
      title: Dados relacionados à confirmação da ativação da recorrência.
      properties:
        ativacao:
          type: object
          title: Dados relacionados à confirmação da ativação da recorrência.
          required:
          - tipoJornada
          description: Dados relacionados à confirmação da ativação da recorrência.
          properties:
            tipoJornada:
              type: string
              title: Jornada de ativação
              description: "Dado relacionado ao caminho percorrido pelo processo de adesão a recorrência pelo usuário pagador, os valores possíveis são:\n  - JORNADA_1: Usuário pagador aceitou a recorrência através de notificação externa ao ecossistema\n  - JORNADA_2: Usuário pagador aceitou a recorrência através de leitura de QR Code de recorrência\n  - JORNADA_3: Usuário pagador iniciou a recorrência através de leitura de QR Code composto e pagamento de cobrança imediata. O uso desta jornada torna obrigatório o preenchimento da informação dadosJornada.txid\n  - JORNADA_4: Usuário pagador escolheu aderir à recorrência através de leitura de QR Code composto relacionado à cobrança com vencimento ou estática relacionada a um contrato vigente\n  - AGUARDANDO_DEFINICAO: Valor inicial posterior a criação e anterior a ativação da recorrência.\n"
              enum:
              - JORNADA_1
              - JORNADA_2
              - JORNADA_3
              - JORNADA_4
              - AGUARDANDO_DEFINICAO
            dadosJornada:
              type: object
              title: Dados de confirmação da jornada e início da recorrência
              oneOf:
              - type: object
                title: Cobrança imediata vinculada à Jornada 3
                required:
                - txid
                description: Dado de preenchimento obrigatório quando utilizada a Jornada 3. Este campo deve ser removido pelo PSP Recebedor quando a ativação for realizada pelas jornadas 1, 2 ou 4.
                properties:
                  txid:
                    $ref: '#/components/schemas/TxId'
    RecSolicitada:
      type: object
      title: Recorrência Solicitada
      description: Atributos de Configuração de Recorrência
      allOf:
      - $ref: '#/components/schemas/RecBase'
      - type: object
        properties:
          recebedor:
            type: object
            title: Recebedor
            properties:
              convenio:
                type: string
                title: Convênio
                description: Convênio entre usuário e participante recebedor.
                minLength: 1
                maxLength: 60
                example: Master
      - $ref: '#/components/schemas/RecConfiguracao'
      - type: object
        properties:
          loc:
            allOf:
            - $ref: '#/components/schemas/PayloadLocationRecId'
      - $ref: '#/components/schemas/RecAtivacaoSolicitada'
    DadosPagadorRec:
      type: object
      title: Dados do Pagador
      required:
      - ispbParticipante
      properties:
        pagador:
          allOf:
          - type: object
            properties:
              ispbParticipante:
                type: string
                title: ISPB do PSP pagador.
                description: ISPB do PSP pagador.
                pattern: \d{8}
          - type: object
            properties:
              codMun:
                title: Código do município
                description: 'Código baseado na Tabela de Códigos de Municípios do __[IBGE](https://www.ibge.gov.br/explica/codigos-dos-municipios.php)__ que apresenta a lista dos municípios brasileiros associados a um código composto de 7 dígitos, sendo os dois primeiros referentes ao código da Unidade da Federação.

                  '
                type: string
                pattern: /^\d{7}$/
          oneOf:
          - $ref: '#/components/schemas/CPF'
          - $ref: '#/components/schemas/CNPJ'
    RecsConsultadas:
      type: object
      title: Recorrencias consultadas
      required:
      - parametros
      - recs
      properties:
        parametros:
          $ref: '#/components/schemas/ParametrosConsultaRec'
        recs:
          type: array
          title: Lista de recorrências
          items:
            allOf:
            - $ref: '#/components/schemas/RecCompletaPesquisada'
    PessoaFisicaRecorrencia:
      type: object
      required:
      - cpf
      - nome
      title: Pessoa Física
      properties:
        cpf:
          type: string
          title: CPF
          pattern: /^\d{11}$/
          example: '45164632481'
          description: CPF do usuário.
        nome:
          type: string
          title: Nome
          description: Nome do usuário.
          minLength: 1
          maxLength: 140
          example: Fulano de Tal
    RecGerada:
      type: object
      title: Recorrência Gerada
      required:
      - recebedor
      description: Atributos de Configuração de Recorrência
      allOf:
      - type: object
        properties:
          idRec:
            $ref: '#/components/schemas/RecId'
      - $ref: '#/components/schemas/RecBase'
      - type: object
        properties:
          recebedor:
            title: Racebedor
            oneOf:
            - $ref: '#/components/schemas/PessoaJuridicaRecorrencia'
            allOf:
            - type: object
              properties:
                convenio:
                  type: string
                  title: Convênio
                  description: Convênio entre usuário e participante recebedor.
                  maxLength: 60
      - $ref: '#/components/schemas/RecStatus'
      - type: object
        properties:
          loc:
            allOf:
            - $ref: '#/components/schemas/PayloadLocationRecCompleta'
      - $ref: '#/components/schemas/RecAtualizacao'
      - $ref: '#/components/schemas/RecEncerramento'
      - $ref: '#/components/schemas/RecAtivacao'
    CNPJ:
      type: object
      required:
      - cnpj
      title: Pessoa Jurídica
      properties:
        cnpj:
          type: string
          title: CNPJ
          pattern: /^\d{14}$/
          description: CNPJ do usuário.
    ParametrosConsultaRec:
      type: object
      title: Parâmetros de Consulta de Recorrências
      description: Parâmetros utilizados para a realização de uma consulta de recorrências.
      required:
      - inicio
      - fim
      - paginacao
      properties:
        inicio:
          type: string
          format: date-time
          title: Data de Início
          description: Data inicial utilizada na consulta. Respeita RFC 3339.
          example: '2020-04-01T00:00:00Z'
        fim:
          type: string
          format: date-time
          title: Data de Fim
          description: Data de fim utilizada na consulta. Respeita RFC 3339.
          example: '2020-04-01T17:00:00Z'
        cpf:
          type: string
          title: CPF
          pattern: /^\d{11}$/
          description: Filtro pelo CPF do devedor. Não pode ser utilizado ao mesmo tempo que o CNPJ.
        cnpj:
          type: string
          title: CNPJ
          pattern: /^\d{14}$/
          description: Filtro pelo CNPJ do devedor. Não pode ser utilizado ao mesmo tempo que o CPF.
        locationPresente:
          type: boolean
          description: Filtro pela existência de location vinculada.
        status:
          type: string
          title: Status do registro da recorrência
          description: Filtro pelo status das recorrências.
        recebedor:
          type: object
          title: Recebedor
          properties:
            convenio:
              type: string
              title: Convênio
              description: Convênio entre usuário e participante recebedor.
              maxLength: 60
        paginacao:
          $ref: '#/components/schemas/Paginacao'
    SolicRecId:
      type: object
      title: Id da Solicitação de recorrência
      required:
      - idSolicRec
      description: Dados criados ou alterados da cobrança recorrente via API Pix
      properties:
        idSolicRec:
          type: string
          title: ID Solicitação da Recorrência
          description: "# Identificador da Solicitação da Recorrência\n\nRegra de formação:\n- SCxxxxxxxxyyyyMMddkkkkkkkkkkk (29 caracteres; “case sensitive”, isso é, diferencia letras maiúsculas e minúsculas), sendo:\n  - SC - fixo (2 caracteres);\n  - xxxxxxxx – ISPB do agente que envia a mensagem pain.009 de solicitação de confirmação da recorrência;\n  - yyyyMMdd – data (8 caracteres) de criação da mensagem pain.009 de solicitação de confirmação da recorrência;\n  - kkkkkkkkkkk – sequencial criado pelo agente que gerou a mensagem de solicitação de confirmação da recorrência (11 caracteres alfanuméricos [a-z|A-Z|0-9]). Deve ser único dentro de cada “yyyyMMdd”.\n"
          pattern: '[a-zA-Z0-9]{29}'
          minLength: 29
          maxLength: 29
          example: SC1234567820240115abcdefghijk
    RecAtualizacao:
      type: object
      title: Histórico de atualização da recorrência.
      required:
      - atualizacao
      properties:
        atualizacao:
          type: array
          title: Histórico de Status
          description: Histórico das mudanças de status da recorrência.
          items:
            type: object
            required:
            - status
            - data
            properties:
              status:
                type: string
                title: Status da recorrência
                description: Status da recorrência.
                enum:
                - CRIADA
                - APROVADA
                - REJEITADA
                - EXPIRADA
                - CANCELADA
              data:
                type: string
                format: date-time
                description: Data e hora do registro de status atualizado. Respeita RFC 3339.
    PayloadLocationRecCompleta:
      type: object
      title: Location do Payload Completa
      description: Identificador da localização do payload completo.
      allOf:
      - $ref: '#/components/schemas/PayloadLocationRecGerada'
      - type: object
        properties:
          idRec:
            $ref: '#/components/schemas/RecId'
    Violacao:
      type: object
      title: Violações
      properties:
        razao:
          type: string
          title: Descrição do erro
          description: Descrição do erro
          example: Valor da cobrança não pode ser 0.00
        propriedade:
          type: string
          title: Nome da propriedade
          description: Nome da propriedade
          example: cob.chave
        valor:
          type: string
          title: Valor da propriedade
          description: Valor da propriedade
          example: 061996671234
    SolicRecCompleta:
      type: object
      title: Solicitação de Recorrência Completa
      required:
      - rec
      description: Dados criados ou alterados da solicitação da recorrência
      allOf:
      - $ref: '#/components/schemas/SolicRecId'
      - $ref: '#/components/schemas/SolicRecBase'
      - $ref: '#/components/schemas/SolicRecStatus'
      - $ref: '#/components/schemas/SolicRecAtualizacao'
      - type: object
        properties:
          recPayload:
            $ref: '#/components/schemas/RecPayload'
    PayloadLocationRecGerada:
      type: object
      title: Location do Payload Completa
      description: Identificador da localização do payload completo.
      required:
      - id
      - location
      - tipo
      - criacao
      properties:
        id:
          $ref: '#/components/schemas/PayloadLocationRecId'
        location:
          type: string
          title: Localização do payload
          description: Localização do Payload a ser informada na criação da recorrência.
          maxLength: 77
          format: uri
          example: pix.example.com/qr/v2/rec/2353c790eefb11eaadc10242ac120002
          readOnly: true
        criacao:
          type: string
          format: date-time
          title: Data de Criação
          description: Data e hora em que a location foi criada. Respeita RFC 3339.
          readOnly: true
    RecRevisada:
      type: object
      title: Recorrência Revisada
      description: Atributos de Revisão da Configuração de Recorrência
      allOf:
      - type: object
        title: Status da Recorrência
        properties:
          status:
            type: string
            title: Status do registro da recorrência
            enum:
            - CANCELADA
      - type: object
        properties:
          vinculo:
            type: object
            title: Vinculo
            properties:
              devedor:
                title: Devedor
                description: O objeto devedor organiza as informações sobre o devedor da recorrência.
                oneOf:
                - type: object
                  required:
                  - nome
                  title: Pessoa Física
                  properties:
                    nome:
                      type: string
                      title: Nome
                      description: Nome do usuário.
                      minLength: 1
                      maxLength: 140
                - type: object
                  required:
                  - nome
                  title: Pessoa Jurídica
                  properties:
                    nome:
                      type: string
                      title: Nome
                      description: Nome do usuário.
                      minLength: 1
                      maxLength: 140
      - type: object
        properties:
          loc:
            allOf:
            - $ref: '#/components/schemas/PayloadLocationRecId'
      - type: object
        properties:
          calendario:
            type: object
            title: Informações sobre calendário da recorrência
            description: Informações sobre calendário da recorrência
            properties:
              dataInicial:
                type: string
                format: date
                title: Data estimada de primeiro pagamento.
                description: Trata-se de uma data, no formato `YYYY-MM-DD`, segundo ISO 8601. Data estimada de primeiro pagamento.
                example: '2023-04-01'
      - $ref: '#/components/schemas/RecAtivacaoSolicitada'
    RecConfiguracao:
      type: object
      title: Configuração da Recorrência
      required:
      - politicaRetentativa
      properties:
        politicaRetentativa:
          type: string
          title: Política de retentativa pós vencimento da recorrência
          enum:
          - NAO_PERMITE
          - PERMITE_3R_7D
    RecCompleta:
      type: object
      title: Recorrência Completa
      required:
      - status
      - recebedor
      description: Atributos de Configuração de Recorrência
      allOf:
      - type: object
        properties:
          idRec:
            $ref: '#/components/schemas/RecId'
      - $ref: '#/components/schemas/RecBase'
      - type: object
        properties:
          recebedor:
            oneOf:
            - $ref: '#/components/schemas/PessoaJuridicaRecorrencia'
            allOf:
            - type: object
              properties:
                convenio:
                  type: string
                  title: Convênio
                  description: Convênio entre usuário e participante recebedor.
                  maxLength: 60
      - $ref: '#/components/schemas/DadosPagadorRec'
      - $ref: '#/components/schemas/RecStatus'
      - $ref: '#/components/schemas/RecConfiguracao'
      - type: object
        properties:
          loc:
            allOf:
            - $ref: '#/components/schemas/PayloadLocationRecCompleta'
      - $ref: '#/components/schemas/RecAtualizacao'
      - $ref: '#/components/schemas/RecEncerramento'
      - type: object
        properties:
          solicitacao:
            type: array
            title: Solicitações vinculadas
            description: Solicitações vinculadas
            items:
              allOf:
              - $ref: '#/components/schemas/SolicRecCompleta'
      - $ref: '#/components/schemas/RecAtivacao'
      - type: object
        properties:
          dadosQR:
            type: object
            title: Informações do QR Composto.
            description: "##### Informações relacionadas aos parâmetros `idRec` e `txid` informados na requisição.\nAo consultar uma recorrência via endpoint GET `/rec/{idRec}?txid={txid}`, o usuário recebedor pode optar pela consulta sem \no `txid` ou por compor a requisição com um `txid` de uma cobrança imediata, ou cobrança com vencimento, de forma a obter o QR Composto\npara a jornada de interesse.\n\nOs `dadosQR` retornados variam de acordo com a jornada desejada, indicada pela presença dos parâmetros de interesse, conforme a tabela abaixo:\n<table  >\n<tr><td width=\"15%\">idRec</td><td  width=\"15%\">txid de Cob</td><td  width=\"15%\">txid de CobV</td><td width=\"100%\">Conteúdo esperado</td></tr>\n<tr><td>X</td><td>-</td><td>-</td><td><pre>{ jornada: \"JORNADA_2\", pixCopiaECola: \"QR Composto da recorrência\" }</pre></td></tr>\n<tr><td>X</td><td>X</td><td>-</td><td><pre>{ jornada: \"JORNADA_3\", pixCopiaECola: \"QR Composto da cobrança imediata + recorrência\" }</pre></td></tr>\n<tr><td>X</td><td>-</td><td>X</td><td><pre>{ jornada: \"JORNADA_4\", pixCopiaECola: \"QR Composto da cobrança com vencimento + recorrência\" }</pre></td></tr>\n</table>\n\nOs campos `dadosQR.jornada` e `dadosQR.pixCopiaECola` só serão retornados se as respectivas locations necessárias para a construção do QR Composto\nestiverem preenchidas na recorrência e na eventual cobrança, a depender da jornada desejada.\n"
            properties:
              jornada:
                type: string
                title: Jornada de ativação
                enum:
                - JORNADA_2
                - JORNADA_3
                - JORNADA_4
              pixCopiaECola:
                type: string
                title: Pix Copia e Cola correspondente à Recorrência.
                description: Este campo retorna o valor do Pix Copia e Cola correspondente à recorrência. Trata-se da sequência de caracteres que representa o BR Code.
                maxLength: 512
    RecAtivacaoSolicitada:
      type: object
      title: Dados relacionados à confirmação da ativação da recorrência.
      properties:
        ativacao:
          type: object
          title: Dados relacionados à confirmação da ativação da recorrência.
          description: Dados relacionados à confirmação da ativação da recorrência.
          properties:
            dadosJornada:
              type: object
              title: Dados de confirmação da jornada e início da recorrência
              oneOf:
              - type: object
                title: Cobrança imediata vinculada à Jornada 3
                required:
                - txid
                description: Dado de preenchimento obrigatório quando utilizada a Jornada 3. Este campo deve ser removido pelo PSP Recebedor quando a ativação for realizada pelas jornadas 1, 2 ou 4.
                properties:
                  txid:
                    $ref: '#/components/schemas/TxId'
