    GovernanceIdentificationCode:
      maxLength: 4
      minLength: 4
      type: string
      description: >
        Specifies the identification of the rules and laws governing the
        undertaking.


        Code Name Definition:

        * ISPR - The version of the International Standby Practices (ISP) that
        is in effect on the date of issue of the undertaking.

        * NONE - No applicable rule set defined.

        * OTHR - The undertaking is subject to another set of rules, or the
        undertaking is not subject to the version of the rules that is in effect
        on the date of issue, these must be specified in
        GovernanceRuleNarrative.

        * UCPR - The version of the Uniform Customs and Practice for Documentary
        Credits (UCP) as published by the International Chamber of Commerce
        (ICC) that is in effect on the date of issue of the undertaking.

        * URDG - The version of the ICC Uniform Rules For Demand Guarantees
        (URDG) as published by the International Chamber of Commerce (ICC) that
        is in effect on the date of issue of the undertaking.


        Usage : - It is applicable for Issuance of Bank Guarantee
      enum:
        - ISPR
        - NONE
        - OTHR
        - UCPR
        - URDG
    GuaranteePaymentDemand:
      required:
        - complete_indicator
        - demand_amount
        - demand_submission_date
        - demand_type
        - party
        - undertaking_identification
      type: object
      properties:
        undertaking_identification:
          maxLength: 16
          minLength: 1
          type: string
          description: >-
            Business identification of the undertaking. Filled in by the bank
            after issuance of the Trade Finance Undertaking, stays unique
            throughout the lifecycle of the guarantee.  MT Mapping: field 20
          x-MTComponent: RestrictedFINXMax16Text
        advising_party_reference_number:
          maxLength: 16
          minLength: 1
          type: string
          description: >-
            Unique and unambiguous identifier assigned by the advising party to
            the undertaking.  MT Mapping: field 21
          x-MTComponent: RestrictedFINMax16Text
        beneficiary_reference_number:
          maxLength: 16
          minLength: 1
          type: string
          description: >-
            Unique and unambiguous identifier assigned by the beneficiary to the
            undertaking.  MT Mapping: field 23
          x-MTComponent: RestrictedFINXMax16Text
        demand_type:
          $ref: '#/components/schemas/DemandTypeCode'
        demand_submission_date:
          pattern: >-
            ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)(?:Z|[+-][01]\d:[0-5]\d)?$
          type: string
          description: 'Date at which the demand is submitted.  MT Mapping: field 31L.'
          x-MXComponent: ISODate
        demand_amount:
          $ref: '#/components/schemas/ActiveCurrencyAndAmount'
        demand_amount_additional_information:
          maxLength: 780
          minLength: 1
          type: string
          description: >-
            Additional information concerning the demand amount.  MT Mapping:
            field 78
        party:
          type: array
          description: |
            Parties specified in the undertaking or related to the Undertaking. 
            The type of Party is specified in the first element, Type.

            Usage Rule: MANDATORY to include one iteration each of Party for 
            1. Beneficiary
            2. Advising/nominated/confirming bank
            3. Applicant 
            4. Issuing bank
            optionally for other parties.

            MT Mapping: 52a, 59a, 56a, 57a
          items:
            $ref: '#/components/schemas/PartyIdentificationDetail'
        requested_expiry_date:
          pattern: >-
            ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)(?:Z|[+-][01]\d:[0-5]\d)?$
          type: string
          description: >
            Requested new expiry date as an alternative to payment of the
            demand. 


            Rule: Requested expiry date must be present when demand type is Pay
            or Extend.

            MT Mapping: field 31E
          x-MXComponent: ISODate
        complete_indicator:
          $ref: '#/components/schemas/CompleteDemandCode'
        completion_information:
          maxLength: 3250
          minLength: 1
          type: string
          description: >-
            Information related to an incomplete presentation.  MT Mapping:
            field 49A
        presentation_completion_details:
          maxLength: 700
          minLength: 1
          type: string
          description: >-
            This field specifies information about the presentation
            documentation. If the presentation is incomplete, this must specify
            how the presentation will be completed.  MT Mapping: field 77
        settlement_account:
          type: array
          items:
            $ref: '#/components/schemas/CashAccount'
        instructions_from_bank:
          maxLength: 210
          minLength: 1
          type: string
          description: 'Instructions received from bank.  MT Mapping: field 72Z'
        documentation:
          type: array
          description: 'Document(s) presented for examination.  MT Mapping: field 23X'
          items:
            $ref: '#/components/schemas/Document'
        bank_instructions:
          maxLength: 3250
          minLength: 1
          type: string
          description: >-
            Instructions from the requesting bank.  MT Mapping: field 78B of MT
            798
        last_date_for_response:
          pattern: >-
            ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)(?:Z|[+-][01]\d:[0-5]\d)?$
          type: string
          description: >-
            Last date for a response to the bank instructions.  MT Mapping:
            field 31T of MT 798
          x-MXComponent: ISODate
        bank_contact:
          type: array
          items:
            $ref: '#/components/schemas/Contacts'
        extend_or_pay_text:
          maxLength: 3250
          minLength: 1
          type: string
          description: >-
            Specify the text of the request to extend or pay.  MT Mapping: field
            49J of MT 798
      additionalProperties: false
      description: Details of the demand payment request.
    ISO2ALanguageCode:
      pattern: ^[a-z]{2,2}$
