inputs: Each candidate tool would inherit its parameters and requestBody from the backing OpenAPI operation named
  in spec/path/method above.
blockers:
- Production access is relationship-managed — an agent cannot self-onboard.
- Most APIs require message-level payload signing and encryption with client-held PKI keys (all authentication versions
  except V4), which an MCP server would have to perform on the caller's behalf.
- Mutual TLS is required in addition to the bearer token.
