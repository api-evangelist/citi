            RECONCILIATION ADVICE<br>"530" -  RECONCILIATION RESPONSE<br>"600"
            -  ADMINISTRATIVE REQUEST<br>"610" -  ADMINISTRATIVE
            RESPONSE<br>"620" -  ADMINISTRATIVE ADVICE<br>"622" - 
            ADMINISTRATIVE ADVICE RESPONSE
