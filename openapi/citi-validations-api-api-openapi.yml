              title: bank_status
              properties:
                is_reachable:
                  type: string
                  description: "Whether the bank is a part of the scheme (reachable) or not \n- Y - Bank is reachable \n - N - Bank is not reachable/not checked"
                  enum:
                  - Y
                  - N
                  title: is_reachable
                is_available:
                  type: string
                  description: "Whether the bank is a current online (available) or not \n- Y - Bank is available \n - N - Bank is not available/ not checked"
                  enum:
                  - Y
                  - N
                  title: is_available
                reachability_data_type:
                  type: string
                  default: HR
                  description: "Validation based on historic or real time data \n- HR - Validation based on Historic Data in case there is no real time data \n - RT - Validation based on real time data and data source is present \n- ERROR - Erroneous issue "
                  enum:
                  - HR
                  - RT
                  - ERROR
                  title: reachability_data_type
                availability_data_type:
                  type: string
                  default: RT
                  description: "Validation based on historic or real time data \n- HR - Validation based on Historic Data in case there is no real time data \n - RT - Validation based on real time data and data source is present \n- ERROR - Erroneous issue "
                  enum:
                  - HR
                  - RT
                  - ERROR
                  title: availability_data_type
            card:
              type: object
              title: card_status
              properties:
                number_validation:
                  type: string
                  description: "Card number validation result\n - For UK bank availability/reachability, this parameter is not applicable  \n - For US EWS, this parameter is not applicable \n - For UK, this parameter is not applicable \n - For IN PAN, this parameter is not applicable  \n- MATCH - Validation based on card number is a match \n - MISMATCH - Validation based on card number is a mismatch \n- NA - Validation is not applicable \n - For SEPA VoP, this parameter is not applicable \n - For Global Mastercard validations, this parameter is mandatory"
                  enum:
                  - MATCH
                  - MISMATCH
                  - NA
                  title: number_validation
                receiving_eligibility:
                  type: string
                  description: "Whether the Creditor Mastercard is eligible to received funds before initiating the payment  \n- Y - The creditor Mastercard is eligible to receive the payment \n - N - The creditor Mastercard is not eligible to receive the payment \n - For UK bank availability/reachability, this parameter is not applicable \n - For US EWS, this parameter is not applicable \n - For UK, this parameter is not applicable \n - For IN PAN, this parameter is not applicable \n - For Global Mastercard Validation this parameter is Mandatory with enum Y/N \n - For SEPA VoP, this parameter is not applicable"
                  enum:
                  - Y
                  - N
                  title: receiving_eligibility
      required:
      - uetr
      - method
      - status
