    CobRCompleta:
      type: object
      title: Cobrança Recorrente Completa
      required:
        - idRec
        - txid
        - status
        - valor
        - recebedor
        - calendario
      description: Dados completos da cobrança recorrente via API Pix
      allOf:
        - type: object
          properties:
            idRec:
              $ref: '#/components/schemas/RecId'
        - type: object
          properties:
            txid:
              $ref: '#/components/schemas/TxId'
        - $ref: '#/components/schemas/CobRBase'
        - type: object
          properties:
            calendario:
              type: object
              required:
                - criacao
              properties:
                criacao:
                  type: string
                  format: date
                  title: Data de criação da cobrança
                  description: >-
                    Trata-se de uma data, no formato `YYYY-MM-DD`, segundo ISO
                    8601. É a data de criação da cobrança.
                  example: '2023-04-01'
        - $ref: '#/components/schemas/CobRStatus'
        - $ref: '#/components/schemas/CobRConfiguracao'
        - $ref: '#/components/schemas/DadosDevedorRecorrencia'
        - type: object
          properties:
