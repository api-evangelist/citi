    Pix:
      type: object
      title: Pix
      required:
      - endToEndId
      - valor
      - horario
      - pagador
      properties:
        endToEndId:
          $ref: '#/components/schemas/EndToEndId'
        txid:
          allOf:
          - $ref: '#/components/schemas/TxId'
          - pattern: '[a-zA-Z0-9]{1,35}'
        valor:
          type: string
          title: Valor do Pix.
          pattern: \d{1,10}\.\d{2}
          description: Valor do Pix.
        componentesValor:
          type: object
          title: Informações sobre o valor do Pix
          description: "The purpose of this framework is to explain the elements that make up the Pix amount, including information on fines, interest, discounts, and deductions when Pix is related to overdue collections.\n\nStructure rules:\n- Pix `value` is equal to:\n  - (`original.amount` + `withdrawal.amount` + `change.amount`) + `fine.amount` + `interest.amount` – `rebate.amount` – `discount.amount`\n  considering only the fields that are present for each type of paid collection.\n- The `withdrawal` and `change` structures will only be returned when the Pix is relative to a Cashout Pix or Change Pix, respectively, and\nthe other structures (`interest`, `fine`, `rebate` and `discount`) will only be relevant to the Pix of payments of collections due.\n- There cannot be simultaneously a substructure of type `withdrawal` and another of type `change`;\n- There is no restriction on the order of substructures.\n\nIn the case of a Pix Withdraw, you can return `original` with value=0.00 (zero) since the sum will be respected, or you can omit the\noriginal substructure. In the case of a Pix Swap or a collection payment due date, the `original` substructure will always be\ngift.\n\n#### Valid examples:\nExample of valid fills.\n\n- **Pix para pagamento de cobrança imediata (sem saque ou troco).**\n  ```\n  ...\n  \"componentsValue\": {\n    \"original\": {\n      \"value\": \"100.00\"\n    }\n  }\n  ...\n  ```\n- **Pix Saque.**\n  ```\n  ...\n  \"componentsValue\": {\n    \"withdraw\": {\n      \"value\": \"100.00\",\n      \"agent modality\": \"AGPSS\",\n      \"Withdrawal Service Provider\": \"12345678\"\n    }\n  }\n  ...\n  ```\n- **Pix para pagamento de cobrança imediata com saque (pode vir original.valor=0.00).**\n  ```\n  ...\n  \"componentsValue\": {\n    \"original\": {\n      \"value\": \"0.00\"\n    },\n    \"withdraw\": {\n      \"value\": \"100.00\",\n      \"agent modality\": \"AGPSS\",\n      \"Withdrawal Service Provider\": \"12345678\"\n    }\n  }\n  ...\n  ```\n- **Pix Troco.**\n  ```\n  ...\n  \"componentsValue\": {\n    \"original\": {\n      \"value\": \"80.00\"\n    },\n    \"Thing\": {\n      \"value\": \"20.00\",\n      \"agent modality\": \"AGTEC\",\n      \"Withdrawal Service Provider\": \"12345678\"\n    }\n  }\n  ...\n  ```\n- **Pix para pagamento de cobrança imediata com troco (ordem não importa).**\n  ```\n  ...\n  \"componentsValue\": {\n    \"Thing\": {\n      \"value\": \"20.00\",\n      \"agent modality\": \"AGTEC\",\n      \"Withdrawal Service Provider\": \"12345678\"\n    },\n    \"original\": {\n      \"value\": \"80.00\"\n    }\n  }\n  ...\n  ```\n- **Pix para pagamento de cobrança com vencimento de R$100,00 considerando-se um atraso de 2 dias a uma multa de 3% e juros de 1% ao dia. O valor do Pix será R$105,00.**\n  ```\n  ...\n  \"componentsValue\": {\n    \"original\": {\n      \"value\": \"100.00\"\n    },\n    \"traffic ticket\": {\n      \"value\": \"3.00\"\n    },\n    \"fees\": {\n      \"value\": \"2.00\"\n    }\n  }\n  ...\n  ```\n#### Invalid examples:\nNon-exhaustive examples of invalid fills.\n- **`original.valor maior que 0.00 (zero) e saque juntos**\n  ```\n  ...\n  \"componentsValue\": {\n    \"original\": {\n      \"value\": \"80.00\"\n    },\n    \"withdraw\": {\n      \"value\": \"20.00\",\n      \"agent modality\": \"AGPSS\",\n      \"Withdrawal Service Provider\": \"12345678\"\n    }\n  }\n  ...\n  ```\n- **dois elementos de saque**\n  ```\n  ...\n  \"componentsValue\": [\n    \"withdraw\": {\n      \"value\": \"20.00\",\n      \"agent modality\": \"AGPSS\",\n      \"Withdrawal Service Provider\": \"12345678\"\n    },\n    \"withdraw\": {\n      \"value\": \"10.00\",\n      \"agent modality\": \"AGPSS\",\n      \"Withdrawal Service Provider\": \"12345678\"\n    }\n  ]\n  ...\n  ```\n- **saque e troco simultaneamente**\n  ```\n  ...\n  \"componentsValue\": {\n    \"original\": {\n      \"value\": \"60.00\"\n    },\n    \"withdraw\": {\n      \"value\": \"20.00\",\n      \"agent modality\": \"AGPSS\",\n      \"Withdrawal Service Provider\": \"12345678\"\n    },\n    \"Thing\": {\n      \"value\": \"20.00\",\n      \"agent modality\": \"AGTEC\",\n      \"Withdrawal Service Provider\": \"12345678\"\n    }\n  }\n  ...\n  ```"
          anyOf:
          - $ref: '#/components/schemas/PixValorOriginal'
          - $ref: '#/components/schemas/PixValorSaque'
          - $ref: '#/components/schemas/PixValorTroco'
          - $ref: '#/components/schemas/PixValorJuros'
          - $ref: '#/components/schemas/PixValorMulta'
          - $ref: '#/components/schemas/PixValorAbatimento'
          - $ref: '#/components/schemas/PixValorDesconto'
        chave:
          type: string
          title: Chave DICT do recebedor
          description: '# Creditor DICT alias


            * Creditor alias field as assigned in the respective PACS008.

            * Aliases types can be: phone, email, cpf/cnpj or EVP.

            * The format of the aliases can be found in the section "Formatting DICT aliases in BR Code" of the [Pix Initiation Standards Manual](https://www.bcb.gov.br/estabilidadefinanceira/pix).

            '
          maxLength: 77
        horario:
          type: string
          format: date-time
          title: Horário
          description: Time the Pix was processed on the PSP.
        infoPagador:
          type: string
          title: Informação livre do pagador
          maxLength: 140
        devolucoes:
          type: array
          title: Devoluções
          items:
            $ref: '#/components/schemas/Devolucao'
    CobVValor:
      type: object
      title: Valor da cobrança com vencimento
      description: Collection amount.
      properties:
        original:
          type: string
          title: Valor
          pattern: \d{1,10}\.\d{2}
          description: Valor original da cobrança.
        multa:
          type: object
          required:
          - modalidade
          - valorPerc
          title: Multa aplicada
          description: Penalty applied to collection
          properties:
            modalidade:
              type: integer
              format: int32
              title: Modalidade da multa
              minimum: 1
              maximum: 2
              description: <table><tr><th>Description</th><th>Domain</th></tr><tr><td>Value Fixo</td><td>1</td></tr><tr><td>percentage</td><td>2</td></tr></table>
            valorPerc:
              type: string
              title: Valor da multa absoluta
              description: Penalty in absolute or percentage amount, according to "amount.fine.modality".
              pattern: \d{1,10}\.\d{2}
        juros:
          type: object
          required:
          - modalidade
          - valorPerc
          title: Juro aplicado
          description: Interest applied to collection
          properties:
            modalidade:
              type: integer
              format: int32
              minimum: 1
              maximum: 8
              title: Modalidade de juros
              description: Interest rate, according to the domain table. <table><tr><th>Description</th><th>Domain</th></tr><tr><td>Value (calendar days)</td><td>1</td></tr><tr><td>Percentage per day (calendar days)</td><td>2</td></tr><tr><td>Percentage per month (calendar days)</td><td>3</td></tr><tr><td>Percentage per year (calendar days)</td><td>4</td></tr><tr><td>Value (working days)</td><td>5</td></tr><tr><td>Percentage per day (working days)</td><td>6</td></tr><tr><td>Percentage per month (working days)</td><td>7</td></tr><tr><td>Percentage per year (working days)</td><td>8</td></tr></table>
            valorPerc:
              type: string
              title: Valor
              pattern: \d{1,10}\.\d{2}
        abatimento:
          title: Abatimento aplicado
          required:
          - modalidade
          - valorPerc
          description: Deduction applied to collection
          properties:
            modalidade:
              type: integer
              format: int32
              minimum: 1
              maximum: 2
              title: Modalidade de abatimentos
              description: Deduction modality, according to the table of Domains. <table><tr><th>Description</th><th>Domain</th></tr><tr><td>Fixed Value</td><td>1</td></tr> <tr><td>Percentage</td><td>2</td></tr></table>
            valorPerc:
              type: string
              title: Abatimentos
              description: Deductions applied to the collection, in absolute value or as a percentage of the original value of the collection.
              pattern: \d{1,10}\.\d{2}
        desconto:
          title: Descontos aplicados
          required:
          - modalidade
          description: Discounts applied to collection
          allOf:
          - type: object
            properties:
              modalidade:
                type: integer
                format: int32
                minimum: 1
                maximum: 6
                title: Modalidade de descontos
                description: Discount modality, according to the domain table. <table><tr><th>Description</th><th>Domain</th></tr><tr><td>Fixed Value until[s] informed date[s]</td ><td>1</td></tr><tr><td>Percentage until the date informed</td><td>2</td></tr><tr><td>Amount in advance day corrido</td><td>3</td></tr><tr><td>Amount in advance business day</td><td>4</td></tr><tr><td> Percentage in calendar day advance</td><td>5</td></tr><tr><td>Percentage in business day advance</td><td>6</td></tr></table>
          oneOf:
          - type: object
            properties:
              descontoDataFixa:
                title: Lista de Descontos
                description: Absolute discounts applied to the collection.
                type: array
                minItems: 1
                maxItems: 3
                uniqueItems: true
                items:
                  required:
                  - data
                  - valorPerc
                  allOf:
                  - properties:
                      data:
                        title: Data limite para o desconto absoluto da cobrança
                        description: Discounts for prepayment, with a fixed date. Matrix with up to three elements, each element consisting of a pair "date and value Perc", to establish percentage or absolute discounts, up to that payment date. This is a date, in the format `YYYY-MM-DD`, according to ISO 8601. The discount date must be earlier than the collection due date.
                        type: string
                        format: date
                        example: '2020-04-01'
                  - properties:
                      valorPerc:
                        type: string
                        title: Valor do desconto absoluto
                        description: Discount in absolute amount or percentage per day, business or consecutive, according to value.discount.modality
                        pattern: \d{1,10}\.\d{2}
          - type: object
            required:
            - valorPerc
            properties:
              valorPerc:
                type: string
                title: Abatimentos
                description: Deductions applied to the collection, in absolute value or as a percentage of the original value of the collection.
                pattern: \d{1,10}\.\d{2}
    CobVGerada:
