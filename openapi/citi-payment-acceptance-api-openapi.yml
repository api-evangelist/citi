              title: status
            description:
              type: string
              maxLength: 200
              description: "Transaction Status  \n- PENDING - Transaction pending action from customer \n- CANCELLED - Transaction cancelled \n- DECLINED- Transaction declined by the payment processor \n- SETTLED - Transaction settled"
              example: The transaction has successfully been created
              title: description
